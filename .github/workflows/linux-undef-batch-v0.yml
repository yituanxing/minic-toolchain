name: Linux Undef Batch V0

on:
  push:
    branches: ["agent/linux-undef-batch-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-undef-batch-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  undef-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore prepared Linux baseline
        id: linux-base
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-asm-symbolic-pool-v0/linux-6.6.143
            build/linux-asm-symbolic-pool-v0/base-out
          key: linux-asm-symbolic-base-v1-6.6.143-riscv-defconfig-${{ runner.os }}

      - name: Install RV64 prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Apply semantic stack and batch CFG closure
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-asm-symbolic-pool-v0"
          build="$work/toolchain-batch"
          ev="$work/evidence-batch"
          rm -rf "$build" "$ev"
          mkdir -p "$ev"
          start=$(date +%s)
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
            apply-constant-inline-call-cfg-v0.py
            apply-local-integer-arithmetic-closure-v0.py
            apply-constant-cfg-product-v0.py
          )
          for patch in "${patches[@]}"; do
            python3 "tools/ci/$patch" | tee -a "$ev/patch.log"
          done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" \
            "$build/bin/minic" "$build/bin/minic-cc"
          test -x "$build/bin/minic" && test -x "$build/bin/minic-cc"
          echo "TIMING toolchain_s=$(($(date +%s) - start))" | tee "$ev/timing.txt"

      - name: Prepare pinned Linux baseline
        id: prepare-base
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-asm-symbolic-pool-v0"
          src="$work/linux-6.6.143"
          base="$work/base-out"
          archive="$work/linux-6.6.143.tar.xz"
          if test -s "$src/Makefile" && test -s "$base/.config" && \
             test -s "$base/include/config/auto.conf" && test -s "$base/include/generated/autoconf.h"; then
            echo "LINUX_UNDEF_BATCH_BASE=HIT"
          else
            rm -rf "$src" "$base"
            mkdir -p "$work"
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
            printf '%s  %s\n' \
              dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
              "$archive" | sha256sum -c -
            tar -xJf "$archive" -C "$work"
            make -C "$src" O="$base" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
            "$src/scripts/config" --file "$base/.config" \
              -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
              -e SERIAL_8250 -e SERIAL_8250_CONSOLE
            make -C "$src" O="$base" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
            make -C "$src" O="$base" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare
            echo "LINUX_UNDEF_BATCH_BASE=MISS_PREPARED"
          fi

      - name: Save prepared Linux baseline
        if: steps.linux-base.outputs.cache-hit != 'true' && steps.prepare-base.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-asm-symbolic-pool-v0/linux-6.6.143
            build/linux-asm-symbolic-pool-v0/base-out
          key: linux-asm-symbolic-base-v1-6.6.143-riscv-defconfig-${{ runner.os }}

      - name: Compile all current final-link failure objects once
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-asm-symbolic-pool-v0"
          src="$work/linux-6.6.143"
          base="$work/base-out"
          out="$work/out-batch"
          ev="$work/evidence-batch"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          rm -rf "$out"
          cp -a --reflink=auto "$base" "$out"
          targets=(
            arch/riscv/mm/init.o
            block/bio.o block/blk-core.o block/blk-map.o block/blk-merge.o block/blk-mq.o
            crypto/rsa-pkcs1pad.o crypto/skcipher.o
            drivers/acpi/scan.o drivers/net/phy/phy_device.o
            drivers/nvdimm/bus.o drivers/nvdimm/claim.o drivers/nvdimm/namespace_devs.o
            drivers/nvdimm/pmem.o drivers/nvdimm/region_devs.o drivers/spi/spi.o
            fs/ext4/inode.o fs/hugetlbfs/inode.o fs/proc/task_mmu.o fs/remap_range.o
            kernel/bpf/verifier.o kernel/dma/direct.o kernel/dma/pool.o kernel/jump_label.o
            kernel/ptrace.o kernel/sched/fair.o
            mm/gup.o mm/madvise.o mm/memcontrol.o mm/memfd.o mm/memory.o mm/mprotect.o
            mm/mremap.o mm/page_alloc.o mm/page_vma_mapped.o mm/percpu.o mm/shmem.o
            mm/slab_common.o mm/swap.o mm/truncate.o mm/vmalloc.o mm/vmstat.o
            net/core/bpf_sk_storage.o net/core/skbuff.o
            net/ipv4/tcp_ipv4.o net/ipv4/tcp_output.o net/ipv4/tcp_timer.o
            net/ipv6/addrconf.o net/ipv6/icmp.o
          )
          start=$(date +%s)
          MINIC="$work/toolchain-batch/bin/minic" \
          REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=0 \
          MINIC_KBUILD_TRACE="$ev/minic.trace" \
          CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/kbuild.log" 2>&1
          echo "TIMING pool_s=$(($(date +%s) - start)) objects=${#targets[@]}" | tee -a "$ev/timing.txt"
          : >"$ev/known-remaining.tsv"
          : >"$ev/all-undefined.tsv"
          for target in "${targets[@]}"; do
            test -s "$out/$target"
            riscv64-linux-gnu-nm -u "$out/$target" | awk '{print $NF}' | sort -u >"$ev/one.undefined"
            while IFS= read -r sym; do
              test -n "$sym" && printf '%s\t%s\n' "$target" "$sym" >>"$ev/all-undefined.tsv"
            done <"$ev/one.undefined"
            grep -Fxf tools/ci/linux-undef-known-v0.txt "$ev/one.undefined" | \
              while IFS= read -r sym; do printf '%s\t%s\n' "$target" "$sym"; done \
              >>"$ev/known-remaining.tsv" || true
          done
          cut -f2 "$ev/known-remaining.tsv" | sort -u >"$ev/known-remaining.unique"
          refs=$(wc -l <"$ev/known-remaining.tsv")
          unique=$(wc -l <"$ev/known-remaining.unique")
          asserts=$(grep -c '^__compiletime_assert_' "$ev/known-remaining.unique" || true)
          deferred=$(grep -c '__minic_deferred_asm_immediate_' "$ev/all-undefined.tsv" || true)
          printf 'LINUX_UNDEF_BATCH objects=%s known_refs=%s known_unique=%s asserts_unique=%s deferred_rows=%s\n' \
            "${#targets[@]}" "$refs" "$unique" "$asserts" "$deferred" | tee "$ev/summary.txt"
          cat "$ev/known-remaining.unique"
          test "$deferred" -eq 0
          test "$unique" -eq 0
          echo "LINUX_UNDEF_BATCH_V0=PASS known_unique=0"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-undef-batch-v0
          path: build/linux-asm-symbolic-pool-v0/evidence-batch/
          if-no-files-found: ignore
          retention-days: 7
