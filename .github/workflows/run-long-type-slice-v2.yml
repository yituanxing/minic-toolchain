name: Run long type slice v2

on:
  pull_request:
    paths:
      - '.github/workflows/run-long-type-slice-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
          fetch-depth: 0

      - name: Apply reviewed type slice and AST contract fix
        shell: bash
        run: |
          awk '
            /python3 - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-long-type-slice.yml > /tmp/apply-long-type-slice.py
          python3 /tmp/apply-long-type-slice.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/frontend/ast_verifier.c')
          text = path.read_text()
          old = '''               (type.integer_rank == MINIC_INTEGER_RANK_CHAR ||
                type.integer_rank == MINIC_INTEGER_RANK_INT);'''
          new = '''               (type.integer_rank == MINIC_INTEGER_RANK_CHAR ||
                type.integer_rank == MINIC_INTEGER_RANK_INT ||
                type.integer_rank == MINIC_INTEGER_RANK_LONG);'''
          if text.count(old) != 1:
              raise SystemExit(f'AST rank contract marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format and verify focused slice
        shell: bash
        run: |
          chmod +x tests/compiler/c0/run-long-types.sh
          clang-format-18 -i \
            src/frontend/token.h src/frontend/token.c src/frontend/lexer.c \
            src/frontend/type.h src/frontend/type.c src/frontend/parser_type.c \
            src/frontend/ast_verifier.c src/target/riscv64/layout.c \
            tests/frontend/token_model_test.c tests/frontend/lexer_test.c \
            tests/frontend/type_test.c tests/target/riscv64/layout_test.c \
            tests/compiler/c0/long_type_specifiers.c \
            tests/compiler/c0/invalid_long_long.c \
            tests/compiler/c0/invalid_signed_unsigned.c \
            tests/compiler/c0/invalid_long_char.c
          make -j2 \
            check-token-model check-lexer check-type check-ast-contract \
            check-layout check-long-types

      - name: Commit verified slice and remove temporary automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-long-type-slice.yml \
            .github/workflows/run-existing-long-type-slice.yml \
            .github/workflows/run-long-type-slice-v2.yml
          git add Makefile src tests
          git commit -m "frontend: add long type identity and declarations" -m "Add signed and unsigned LONG rank types, standard long declaration-specifier combinations, AST contract support, conflict diagnostics, RV64 eight-byte layout, and focused positive/negative gates. This slice deliberately stops before claiming 64-bit code-generation correctness.\n\n中文说明：加入有符号与无符号 LONG Rank、标准 long 声明说明符组合、AST 合约支持、冲突诊断、RV64 八字节布局和聚焦正负门禁；本切片有意不提前宣称 64 位代码生成正确。\n\nValidation / 验证： token model, lexer, type, AST contract, layout, and long declaration gates PASS."
          git push origin HEAD:frontend/rv64-long-integers
