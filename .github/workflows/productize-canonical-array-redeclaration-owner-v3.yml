name: Productize Canonical Array Redeclaration Owner V3 Durable
on:
  push:
    branches: [product/canonical-array-redeclaration-owner-v3]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/canonical-array-redeclaration-owner-v3
          fetch-depth: 0
      - name: Apply validate and persist
        shell: bash
        run: |
          set -u
          out=diagnostics/canonical-array-redeclaration-owner-v3
          mkdir -p "$out"
          stage=materialize
          status=0
          mat=tools/dev/.productize-array-owner-v3.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-canonical-array-redeclaration-owner-v1.py > "$mat" 2>"$out/materialize-fetch.err" || status=$?
          if [ "$status" -eq 0 ]; then python3 "$mat" >"$out/materialize.log" 2>&1 || status=$?; fi
          rm -f "$mat"

          if [ "$status" -eq 0 ]; then
            stage=regression-source
            cat > tests/compiler/c0/external_array_redeclaration_owner.c <<'EOF'
          int tentative_values[4];
          int tentative_values[];
          int defined_values[4];
          int defined_values[4] = {1, 2, 3, 4};
          int main(void) { return tentative_values[0] + defined_values[3] - 4; }
          EOF
            cat > tests/compiler/c0/run-external-array-redeclaration-owner.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/external-array-redeclaration-owner
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/external_array_redeclaration_owner.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          grep -F '.globl tentative_values' "$work/output.s" >/dev/null
          grep -F '.size tentative_values, 16' "$work/output.s" >/dev/null
          grep -F '.globl defined_values' "$work/output.s" >/dev/null
          grep -F '.size defined_values, 16' "$work/output.s" >/dev/null
          grep -F '  .word 4' "$work/output.s" >/dev/null
          EOF
            chmod +x tests/compiler/c0/run-external-array-redeclaration-owner.sh
            cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-external-array-redeclaration-owner.sh"
          EOF
            clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/external_array_redeclaration_owner.c >"$out/format.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=build
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/array-owner-v3 >"$out/build.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=focused
            MINIC="$GITHUB_WORKSPACE/build/array-owner-v3/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/array-owner-v3" \
              sh tests/compiler/c0/run-external-array-redeclaration-owner.sh >"$out/focused.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=check-fast
            make -j4 check-fast MODE=release BUILD_DIR=build/array-owner-v3-fast >"$out/check-fast.log" 2>&1 || status=$?
          fi
          printf 'final_stage=%s\nfinal_status=%s\n' "$stage" "$status" > "$out/status.txt"
          git diff -- src/frontend/parser_function.c tests/compiler/c0 > "$out/product.patch" || true

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -eq 0 ]; then
            git rm .github/workflows/productize-canonical-array-redeclaration-owner-v3.yml
            rm -rf "$out"
            git add src/frontend/parser_function.c tests/compiler/c0/external_array_redeclaration_owner.c tests/compiler/c0/run-external-array-redeclaration-owner.sh tests/compiler/c0/run.sh
            git commit -m 'frontend: retire transient external array redeclarations'
          else
            git add "$out"
            git commit -m 'diagnostic: record array owner v3 productization failure' || true
          fi
          git push origin HEAD:product/canonical-array-redeclaration-owner-v3
          exit 0
