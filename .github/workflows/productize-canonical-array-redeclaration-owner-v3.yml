name: Productize Canonical Array Redeclaration Owner V3
on:
  push:
    branches: [product/canonical-array-redeclaration-owner-v3]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/canonical-array-redeclaration-owner-v3
          fetch-depth: 0
      - name: Apply validated owner fix and regression
        run: |
          set -Eeuo pipefail
          mat=tools/dev/.productize-array-owner-v3.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-canonical-array-redeclaration-owner-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat > tests/compiler/c0/external_array_redeclaration_owner.c <<'EOF'
          int tentative_values[4];
          int tentative_values[];

          int defined_values[4];
          int defined_values[4] = {1, 2, 3, 4};

          int main(void) {
              return tentative_values[0] + defined_values[3] - 4;
          }
          EOF
          cat > tests/compiler/c0/run-external-array-redeclaration-owner.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/external-array-redeclaration-owner
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/external_array_redeclaration_owner.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          grep -F '.globl tentative_values' "$work/output.s" >/dev/null
          grep -F '.size tentative_values, 16' "$work/output.s" >/dev/null
          grep -F '.globl defined_values' "$work/output.s" >/dev/null
          grep -F '.size defined_values, 16' "$work/output.s" >/dev/null
          grep -F '  .word 4' "$work/output.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/external-array-redeclaration-owner'
          EOF
          chmod +x tests/compiler/c0/run-external-array-redeclaration-owner.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" \
          HOST_CC="$host_cc" \
          BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
          sh "$root/tests/compiler/c0/run-external-array-redeclaration-owner.sh"
          EOF
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/external_array_redeclaration_owner.c
          git diff --check
      - name: Validate focused Werror and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/array-owner-v3
          MINIC="$GITHUB_WORKSPACE/build/array-owner-v3/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/array-owner-v3" \
            sh tests/compiler/c0/run-external-array-redeclaration-owner.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/array-owner-v3-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-canonical-array-redeclaration-owner-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_function.c \
                  tests/compiler/c0/external_array_redeclaration_owner.c \
                  tests/compiler/c0/run-external-array-redeclaration-owner.sh \
                  tests/compiler/c0/run.sh
          git commit -m 'frontend: retire transient external array redeclarations'
          git push origin HEAD:product/canonical-array-redeclaration-owner-v3
