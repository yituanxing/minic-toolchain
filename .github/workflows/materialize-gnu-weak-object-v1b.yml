name: Materialize GNU Weak Object V1B
on:
  push:
    branches: [staging/string-octal-v1]
    paths:
      - tools/dev/materialize-gnu-weak-object-v1b.py
      - .github/workflows/materialize-gnu-weak-object-v1b.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-gnu-weak-object-v1.py
          python3 tools/dev/materialize-gnu-weak-object-v1b.py
          clang-format-18 -i src/frontend/attribute.c src/frontend/ast.h src/frontend/ast_global.c src/frontend/ast_verifier.c src/frontend/parser_attribute.c src/frontend/parser_internal.h src/frontend/parser_global.c src/frontend/parser_function.c src/target/riscv64/codegen_function.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/weak-object
      - name: Focused GNU weak object symbol semantics
        run: |
          set -Eeuo pipefail
          cat > /tmp/weak-object.c <<'EOF'
          int weak_definition __attribute__((weak));
          extern int weak_declaration __attribute__((__weak__));
          int strong_definition;
          int main(void) { return strong_definition + weak_definition; }
          EOF
          build/weak-object/bin/minic -S /tmp/weak-object.c -o /tmp/weak-object.s
          grep -Fx '.weak weak_definition' /tmp/weak-object.s
          grep -Fx '.weak weak_declaration' /tmp/weak-object.s
          grep -Fx '.globl strong_definition' /tmp/weak-object.s
          ! grep -Fx '.globl weak_definition' /tmp/weak-object.s
          cat > /tmp/static-weak.c <<'EOF'
          static int forbidden __attribute__((weak));
          int main(void) { return forbidden; }
          EOF
          if build/weak-object/bin/minic -S /tmp/static-weak.c -o /tmp/static-weak.s > /tmp/static-weak.out 2> /tmp/static-weak.err; then
            echo 'static weak unexpectedly accepted' >&2
            exit 1
          fi
      - name: Install Linux probe tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Probe unchanged version.i
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          set +e
          MINIC="$GITHUB_WORKSPACE/build/weak-object/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/weak-version" CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=1 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/weak-version/batch-summary.txt
          echo "VERSION_PROBE_STATUS=$status"
      - name: Commit product only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-gnu-weak-object-v1.py tools/dev/materialize-gnu-weak-object-v1b.py .github/workflows/materialize-gnu-weak-object-v1.yml .github/workflows/materialize-gnu-weak-object-v1b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools/dev/materialize-gnu-weak-object-v1.py tools/dev/materialize-gnu-weak-object-v1b.py .github/workflows/materialize-gnu-weak-object-v1.yml .github/workflows/materialize-gnu-weak-object-v1b.yml
          git diff --cached --check
          git commit -m 'frontend: model GNU weak object symbols'
          git push origin HEAD:staging/string-octal-v1
