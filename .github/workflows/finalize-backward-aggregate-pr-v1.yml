name: Finalize Backward Aggregate PR V1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  productize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'product/final-backward-aggregate-v1' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/final-backward-aggregate-v1
          fetch-depth: 0
      - name: Execute proven backward productizer body
        run: |
          set -Eeuo pipefail
          git show origin/product/backward-static-aggregate-overlay-v7:.github/workflows/compiler-c0.yml > /tmp/proven-backward.yml
          python3 - <<'PY'
          from pathlib import Path

          src = Path('/tmp/proven-backward.yml').read_text().splitlines()
          wanted = [
              'Apply generic backward aggregate owner',
              'Canonicalize and validate product slice',
              'Restore normal CI and commit product tree',
          ]
          chunks = []
          for name in wanted:
              marker = f'      - name: {name}'
              try:
                  i = src.index(marker)
              except ValueError:
                  raise SystemExit(f'missing proven productizer step: {name}')
              if i + 1 >= len(src) or src[i + 1].strip() != 'run: |':
                  raise SystemExit(f'malformed proven productizer step: {name}')
              i += 2
              block = []
              while i < len(src) and not src[i].startswith('      - name: '):
                  line = src[i]
                  if line.startswith('          '):
                      line = line[10:]
                  elif line.strip():
                      raise SystemExit(f'unexpected indentation in {name}: {line!r}')
                  block.append(line)
                  i += 1
              chunks.append('\n'.join(block).rstrip() + '\n')
          script = '\n'.join(chunks)
          script = script.replace(
              "rm -f diagnostics/productizer-backward-v7-trigger.txt",
              "rm -f diagnostics/productizer-backward-v7-trigger.txt diagnostics/final-backward-trigger.txt")
          script = script.replace(
              "git push origin HEAD:product/backward-static-aggregate-overlay-v7",
              "git push origin HEAD:product/final-backward-aggregate-v1")
          Path('/tmp/finalize-backward.sh').write_text(script)
          PY
          bash -eux /tmp/finalize-backward.sh
