name: One-shot Core Inline Asm Identity M28 Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Prove pre-M28 identity gap
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-inline-asm-identity-m28.py
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m28-before
          c="$GITHUB_WORKSPACE/build/core-m28-before/bin/minic"
          cat > /tmp/m28-gap.i <<'EOF'
          unsigned long probe_m28_gap(unsigned long value) { __asm__("" : "+rm"(value)); return value; }
          EOF
          if MINIC_CORE_IR=strict "$c" -S /tmp/m28-gap.i -o /tmp/m28-gap.s 2>/tmp/m28-gap.err; then
              echo 'M28 pre-gap unexpectedly absent' >&2
              exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'probe_m28_gap'" /tmp/m28-gap.err >/dev/null
          do_mounts_i=$(find build/linux-focus-corpus -type f -path '*/init/do_mounts.i' -print -quit)
          test -n "$do_mounts_i"
          set +e
          MINIC_CORE_IR=strict "$c" -S "$do_mounts_i" -o /tmp/m28-before-do-mounts.s 2>/tmp/m28-before-do-mounts.err
          before_rc=$?
          set -e
          printf 'M28_PRE_EXACT_RC=%d\n' "$before_rc"
          grep -F "Core IR shadow does not yet support function '__iter_div_u64_rem'" /tmp/m28-before-do-mounts.err >/dev/null
          printf '%s\n' 'M28_PRE_IDENTITY_GAP=proved' 'M28_PRE_ITER_DIV_BLOCKER=proved'

      - name: Apply M28 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-core-inline-asm-identity-m28.py
          chmod +x tests/compiler/c0/run-core-inline-asm-identity-m28.sh
          clang-format-18 -i src/core/core_lower.c tests/compiler/c0/core_inline_asm_identity_m28.c tests/compiler/c0/core_inline_asm_identity_m28_runtime.c
          sh -n tests/compiler/c0/run-core-inline-asm-identity-m28.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m28-product

      - name: Run M28 focused QEMU differential and negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-m28-product/bin/minic" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-inline-asm-identity-m28" \
              sh tests/compiler/c0/run-core-inline-asm-identity-m28.sh

      - name: Run recent Core regression chain
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m28-product/bin/minic"
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/m28-reg-m27" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-switch-m27.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/m28-reg-m26b" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-foundation-m26b.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/m28-reg-m26" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-less-m26.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/m28-reg-m25b" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-binary-preservation-m25b.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/m28-reg-m25" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-discard-expression-m25.sh

      - name: Prove exact frozen representative moved beyond iter div
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m28-product/bin/minic"
          do_mounts_i=$(find build/linux-focus-corpus -type f -path '*/init/do_mounts.i' -print -quit)
          test -n "$do_mounts_i"
          set +e
          MINIC_CORE_IR=strict "$c" -S "$do_mounts_i" -o /tmp/m28-do-mounts.s 2>/tmp/m28-do-mounts.err
          rc=$?
          set -e
          printf 'M28_EXACT_DO_MOUNTS_RC=%d\n' "$rc"
          sed -n '1,20p' /tmp/m28-do-mounts.err
          if grep -F "Core IR shadow does not yet support function '__iter_div_u64_rem'" /tmp/m28-do-mounts.err >/dev/null; then
              echo '__iter_div_u64_rem remains the frozen representative blocker' >&2
              exit 1
          fi
          printf '%s\n' 'M28_EXACT_ITER_DIV_BLOCKER=cleared'

      - name: Replay full frozen strict first500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m28-product/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-m28-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 5 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices ''
          replay_status=$?
          set -e
          printf 'M28_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/core-m28-strict500/frontier-summary.json')
          summary = json.loads(p.read_text())
          if summary.get('selected') != 500:
              raise SystemExit(f"expected frozen selected=500, got {summary.get('selected')}")
          text = p.read_text()
          if '__iter_div_u64_rem' in text:
              raise SystemExit('__iter_div_u64_rem remains in strict500 frontier summary')
          if summary.get('error') != 0 or summary.get('preprocess_missing') != 0:
              raise SystemExit('M28 introduced non-UNSUPPORTED strict failures')
          if summary.get('pass', 0) + summary.get('unsupported', 0) != 500:
              raise SystemExit('M28 strict500 accounting mismatch')
          print('M28_STRICT500_PASS', summary.get('pass'))
          print('M28_STRICT500_UNSUPPORTED', summary.get('unsupported'))
          print('M28_STRICT500_ERROR', summary.get('error'))
          print('M28_STRICT500_BLOCKERS', summary.get('blockers', [])[:15])
          print('M28_STRICT500_ITER_DIV_BLOCKER=0')
          PY

      - name: Productize M28
        shell: bash
        env:
          BRANCH: refactor/declaration-sema-v1
        run: |
          set -Eeuo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)" || {
              echo 'branch advanced during M28 qualification; refusing non-linear publish' >&2
              exit 75
          }
          rm -f tools/dev/patch-core-inline-asm-identity-m28.py
          rm -f .github/workflows/oneshot-core-inline-asm-identity-m28.yml
          rm -f .github/workflows/oneshot-core-next-frontier-batch-m26c.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'core: lower empty readwrite asm identity'
          git push origin "HEAD:$BRANCH"
