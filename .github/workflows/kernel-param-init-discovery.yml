name: Kernel Param Init Discovery

on:
  push:
    branches: [agent/kernel-param-init-family-v1]

permissions:
  contents: write

concurrency:
  group: kernel-param-init-discovery
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate clean product behavior
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/tail-family
          export MINIC="$GITHUB_WORKSPACE/build/tail-family/bin/minic"
          export BUILD_DIR="$GITHUB_WORKSPACE/build/tail-family-focused"
          sh tests/compiler/c0/run-static-aggregate-initializers.sh
          sh tests/compiler/c0/run-integer-constant-bitwise.sh
          sh tests/compiler/c0/run-unnamed-bit-fields.sh
          sh tests/compiler/c0/run-conditional-pointer-qualifiers.sh
          sh tests/compiler/c0/run-gnu-prefix-function-attributes.sh
          make check

      - name: Remove discovery staging and commit clean product
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-kernel-param-init-family.py
          rm -f tools/dev/materialize-start-kernel-policy-attrs.py
          rm -f .github/workflows/kernel-param-init-discovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(frontend): finalize Linux tail semantic family'
          git push origin HEAD:agent/kernel-param-init-family-v1
