name: MiniPP Linux Exact 500-999

concurrency:
  group: minipp-linux-500-999-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'toolchain/minipp-*'
    paths:
      - 'preprocessor/**'
      - 'tools/minic-cpp/**'
      - 'tests/preprocessor/**'
      - '.github/workflows/minipp-linux-exact-500-999.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  MINIPP_LINUX_ARCHIVE_SHA256: dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

jobs:
  reference500_999:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minipp-linux-1000]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      contract_sha: ${{ steps.identity.outputs.contract_sha }}
      cache_key: ${{ steps.identity.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install frozen-oracle prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils

      - name: Prepare Linux and freeze second500 preprocessing contract
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-ref500b-work"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"

          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts

          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/kbuild-plan.raw" 2>"$work/kbuild-plan.stderr"
          plan_status=$?
          set -e
          echo "MINIPP_REFERENCE500_PLAN_STATUS=$plan_status"

          python3 tests/preprocessor/freeze_linux_kbuild_manifest.py \
            --plan "$work/kbuild-plan.raw" \
            --src "$src" \
            --out "$out" \
            --offset 500 --limit 500 \
            --tsv "$work/second500.tsv" \
            --sources "$work/second500.txt" \
            --contract "$work/second500-contract.jsonl"

          contract_sha=$(sha256sum "$work/second500-contract.jsonl" | cut -d' ' -f1)
          gcc_fullversion=$(riscv64-linux-gnu-gcc -dumpfullversion)
          gcc_machine=$(riscv64-linux-gnu-gcc -dumpmachine)
          gcc_pkg=$(dpkg-query -W -f='${Version}' gcc-riscv64-linux-gnu 2>/dev/null || true)
          gcc_sig=$(printf '%s\n%s\n%s\n' "$gcc_fullversion" "$gcc_machine" "$gcc_pkg" | sha256sum | cut -d' ' -f1)
          logic_sig=$(sha256sum \
            tests/preprocessor/build_reference_predefines.sh \
            tests/preprocessor/build_linux_reference_corpus.py | sha256sum | cut -d' ' -f1)
          cache_key="minipp-linux-ref500b-v1-linux-6.6.143-$MINIPP_LINUX_ARCHIVE_SHA256-$contract_sha-$gcc_sig-$logic_sig"

          echo "contract_sha=$contract_sha" >>"$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >>"$GITHUB_OUTPUT"
          echo "MINIPP_REFERENCE500_IDENTITY=PASS contract_sha256=$contract_sha gcc=$gcc_fullversion machine=$gcc_machine"

      - name: Restore frozen GCC second500 corpus
        id: ref-cache
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref500b-corpus
          key: ${{ steps.identity.outputs.cache_key }}

      - name: Build GCC second500 reference corpus on cache miss
        if: steps.ref-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-ref500b-work"
          python3 tests/preprocessor/build_linux_reference_corpus.py \
            --contract "$work/second500-contract.jsonl" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --corpus "$GITHUB_WORKSPACE/build/minipp-linux-ref500b-corpus" \
            --gcc riscv64-linux-gnu-gcc \
            --jobs 8 \
            --linux-id "linux-6.6.143-$MINIPP_LINUX_ARCHIVE_SHA256-rv64-defconfig-offset500"
          echo "MINIPP_REFERENCE500_CACHE=MISS built=500"

      - name: Verify frozen GCC second500 corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-ref500b-work"
          corpus="$GITHUB_WORKSPACE/build/minipp-linux-ref500b-corpus"
          test -s "$corpus/meta.json"
          test -s "$corpus/contract.jsonl"
          test "$(find "$corpus/refs" -maxdepth 1 -type f -name '*.gcc.i' | wc -l)" -eq 500
          contract_sha=$(sha256sum "$work/second500-contract.jsonl" | cut -d' ' -f1)
          python3 - "$corpus/meta.json" "$contract_sha" <<'PY'
          import json
          import sys
          meta = json.load(open(sys.argv[1]))
          assert meta["selected"] == 500, meta
          assert meta["contract_sha256"] == sys.argv[2], meta
          print(
              "MINIPP_REFERENCE500_VERIFY=PASS "
              f"selected={meta['selected']} predef_contexts={meta['predef_contexts']} "
              f"bytes={meta['total_reference_bytes']}"
          )
          PY
          if [[ "${{ steps.ref-cache.outputs.cache-hit }}" == true ]]; then
            echo "MINIPP_REFERENCE500_CACHE=HIT"
          fi

      - name: Save frozen GCC second500 corpus
        if: steps.ref-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/minipp-linux-ref500b-corpus
          key: ${{ steps.identity.outputs.cache_key }}

      - name: Preserve reference identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-reference500_999-identity
          path: |
            build/minipp-linux-ref500b-work/second500.tsv
            build/minipp-linux-ref500b-work/second500.txt
            build/minipp-linux-ref500b-work/second500-contract.jsonl
            build/minipp-linux-ref500b-corpus/meta.json
            build/minipp-linux-ref500b-corpus/sha256sums.txt
            build/minipp-linux-ref500b-corpus/gcc-stderr/**
          if-no-files-found: ignore
          retention-days: 3

  sample16_500_999:
    needs: reference500_999
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils

      - name: Build independent MiniPP
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-500b-sample toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-500b-sample all
          test -x build/minipp-linux-500b-sample/bin/minic-cpp

      - name: Prepare Linux and reproduce frozen contract
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-500b-sample-work"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/kbuild-plan.raw" 2>"$work/kbuild-plan.stderr"
          set -e
          python3 tests/preprocessor/freeze_linux_kbuild_manifest.py \
            --plan "$work/kbuild-plan.raw" --src "$src" --out "$out" --offset 500 --limit 500 \
            --tsv "$work/second500.tsv" --sources "$work/second500.txt" \
            --contract "$work/second500-contract.jsonl"
          test "$(sha256sum "$work/second500-contract.jsonl" | cut -d' ' -f1)" = "${{ needs.reference500_999.outputs.contract_sha }}"
          echo "MINIPP_SAMPLE16_CONTRACT=PASS"

      - name: Restore frozen GCC second500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref500b-corpus
          key: ${{ needs.reference500_999.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Replay cached coverage sample16
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-500b-sample-work"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$work/second500-contract.jsonl" \
            --corpus "$GITHUB_WORKSPACE/build/minipp-linux-ref500b-corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-500b-sample/bin/minic-cpp" \
            --work "$work/replay" \
            --indices "$GITHUB_WORKSPACE/tests/preprocessor/linux-second500-sample16-indices.txt" \
            --jobs 8 \
            --label sample16-500-999

      - name: Preserve sample16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-second500-sample16
          path: |
            build/minipp-linux-500b-sample-work/replay/headline.txt
            build/minipp-linux-500b-sample-work/replay/results.tsv
            build/minipp-linux-500b-sample-work/replay/results.json
            build/minipp-linux-500b-sample-work/replay/failure-pool.tsv
            build/minipp-linux-500b-sample-work/replay/diff/**
            build/minipp-linux-500b-sample-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3

  product500_999:
    needs: reference500_999
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils

      - name: Build independent MiniPP
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-500b toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-500b all
          test -x build/minipp-linux-500b/bin/minic-cpp

      - name: Prepare Linux and reproduce frozen contract
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-500b-work"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/kbuild-plan.raw" 2>"$work/kbuild-plan.stderr"
          set -e
          python3 tests/preprocessor/freeze_linux_kbuild_manifest.py \
            --plan "$work/kbuild-plan.raw" --src "$src" --out "$out" --offset 500 --limit 500 \
            --tsv "$work/second500.tsv" --sources "$work/second500.txt" \
            --contract "$work/second500-contract.jsonl"
          test "$(sha256sum "$work/second500-contract.jsonl" | cut -d' ' -f1)" = "${{ needs.reference500_999.outputs.contract_sha }}"
          echo "MINIPP_PRODUCT500_CONTRACT=PASS"

      - name: Restore frozen GCC second500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref500b-corpus
          key: ${{ needs.reference500_999.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Replay cached product500
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-500b-work"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$work/second500-contract.jsonl" \
            --corpus "$GITHUB_WORKSPACE/build/minipp-linux-ref500b-corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-500b/bin/minic-cpp" \
            --work "$work/replay" \
            --jobs 8 \
            --label product500-999

      - name: Preserve product500 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-exact-500-999
          path: |
            build/minipp-linux-500b-work/replay/headline.txt
            build/minipp-linux-500b-work/replay/results.tsv
            build/minipp-linux-500b-work/replay/results.json
            build/minipp-linux-500b-work/replay/failure-pool.tsv
            build/minipp-linux-500b-work/replay/diff/**
            build/minipp-linux-500b-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3
