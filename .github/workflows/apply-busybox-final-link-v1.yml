name: Apply BusyBox Final Link V1

on:
  push:
    branches:
      - agent/busybox-final-link-v1

permissions:
  contents: write

concurrency:
  group: apply-busybox-final-link-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/busybox-final-link-v1
          fetch-depth: 0

      - name: Install RV64 runtime prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Apply final-link Core patch
        run: python3 tools/dev/patch-busybox-final-link-v1.py

      - name: Build current Mini toolchain
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/final-link-v1 all

      - name: Validate existing constant-if pruning
        run: |
          MINIC="$GITHUB_WORKSPACE/build/final-link-v1/bin/minic" \
          MINIAS="$GITHUB_WORKSPACE/build/final-link-v1/bin/minic-as" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/final-link-v1" \
          RISCV_LD=riscv64-linux-gnu-ld \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/driver/run-constant-if-link-v0.sh

      - name: Validate nested dead control-flow pruning
        run: |
          MINIC="$GITHUB_WORKSPACE/build/final-link-v1/bin/minic" \
          MINIAS="$GITHUB_WORKSPACE/build/final-link-v1/bin/minic-as" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/final-link-v1" \
          RISCV_LD=riscv64-linux-gnu-ld \
          RISCV_NM=riscv64-linux-gnu-nm \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/driver/run-dead-control-flow-link-v1.sh

      - name: Commit validated Core patch
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/core_lower.c
          git diff --cached --quiet && exit 0
          git commit -m 'core: prune dead short-circuit and internal-label branches'
          git push origin HEAD:agent/busybox-final-link-v1
