name: PR103 Materialize Pointer To Bool Conversion
on:
  push:
    branches: [agent/pointer-to-bool-conversion-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/pointer-to-bool-conversion-v0, fetch-depth: 0}
      - name: Materialize pointer-to-bool assignment conversion
        run: python3 tools/dev/pr103-materialize-pointer-bool.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          chmod +x tests/compiler/c0/run-pointer-to-bool-conversion.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused" HOST_CC=cc sh tests/compiler/c0/run-pointer-to-bool-conversion.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr103-materialize-pointer-bool.yml tools/dev/pr103-materialize-pointer-bool.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: support pointer-to-bool assignment conversion'
          git push origin HEAD:agent/pointer-to-bool-conversion-v0
