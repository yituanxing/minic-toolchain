name: Linux Filter Perf Diagnostic V0

on:
  push:
    branches: ["agent/filter-perf-b2d4"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 Linux prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Build exact centralized Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-filter-perf-v0"
          build="$work/toolchain"
          ev="$work/evidence"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'apply-riscv64-core-object-slot-reuse-v0.py' "$ev/profile/minic-profile.txt"
          grep -F 'apply-riscv64-core-object-slot-reuse-cfg-hotfix-v0.py' "$ev/profile/minic-profile.txt"

      - name: Prepare pinned Linux 6.6.143
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-filter-perf-v0"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work/evidence"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare

      - name: Compile isolated net core filter owner
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-filter-perf-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          start=$(date +%s)
          set +e
          MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/filter.trace" \
          MINIC_BOOTSTRAP_TRACE=1 MINIC_CORE_FRAME_TRACE=1 \
          MINIC_ASM_BATCH_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 CORE_FAST_TRACE=1 \
            timeout --signal=TERM --kill-after=15s 10m \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j1 V=1 net/core/filter.o >"$ev/filter.log" 2>&1
          rc=$?
          set -e
          elapsed=$(($(date +%s) - start))
          stderr_file=$(find "$work" -type f -name 'filter.minic-stage2.minic.stderr' -print -quit 2>/dev/null || true)
          input_file=$(find "$work" -type f -name 'filter.minic-stage2.i' -print -quit 2>/dev/null || true)
          [[ -z "$stderr_file" ]] || cp "$stderr_file" "$ev/filter.minic.stderr"
          [[ -z "$input_file" ]] || wc -lc "$input_file" | tee "$ev/filter-input-size.txt"
          printf 'FILTER_PERF rc=%s elapsed_s=%s\n' "$rc" "$elapsed" | tee "$ev/filter-summary.txt"
          exit "$rc"

      - name: Preserve filter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-filter-perf-diagnostic-v0
          path: build/linux-filter-perf-v0/evidence/
          if-no-files-found: ignore
          retention-days: 3
