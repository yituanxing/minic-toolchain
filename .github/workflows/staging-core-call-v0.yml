name: Staging Core Direct Scalar CALL V0

on:
  push:
    branches:
      - staging/core-call-v0

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish-v1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply evidence-bounded Core CALL v0
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, (path, count, old[:80])
              p.write_text(text.replace(old, new, 1))

          # Core representation: direct callee table + compact argument-value pool.
          replace_once(
              'src/core/core_ir.h',
              'typedef uint32_t MinicCoreObjectId;\n\n#define MINIC_CORE_VALUE_INVALID UINT32_MAX\n',
              'typedef uint32_t MinicCoreObjectId;\ntypedef uint32_t MinicCoreCalleeId;\n\n#define MINIC_CORE_VALUE_INVALID UINT32_MAX\n')
          replace_once(
              'src/core/core_ir.h',
              '#define MINIC_CORE_OBJECT_INVALID UINT32_MAX\n',
              '#define MINIC_CORE_OBJECT_INVALID UINT32_MAX\n#define MINIC_CORE_CALLEE_INVALID UINT32_MAX\n')
          replace_once(
              'src/core/core_ir.h',
              '    MINIC_CORE_INSTRUCTION_LOAD,\n    MINIC_CORE_INSTRUCTION_STORE\n',
              '    MINIC_CORE_INSTRUCTION_LOAD,\n    MINIC_CORE_INSTRUCTION_STORE,\n    MINIC_CORE_INSTRUCTION_CALL\n')
          replace_once(
              'src/core/core_ir.h',
              '''typedef struct MinicCoreObject {
              MinicSourceSpan span;
              MinicType type;
          } MinicCoreObject;

          typedef struct MinicCoreInstruction {''',
              '''typedef struct MinicCoreObject {
              MinicSourceSpan span;
              MinicType type;
          } MinicCoreObject;

          typedef struct MinicCoreCallee {
              char *name;
              size_t name_length;
              MinicType return_type;
              MinicType *parameter_types;
              size_t parameter_count;
          } MinicCoreCallee;

          typedef struct MinicCoreInstruction {''')
          replace_once(
              'src/core/core_ir.h',
              '''        struct {
                      MinicCoreValueId address;
                      MinicCoreValueId stored_value;
                      bool is_volatile;
                  } store;
              } value;''',
              '''        struct {
                      MinicCoreValueId address;
                      MinicCoreValueId stored_value;
                      bool is_volatile;
                  } store;
                  struct {
                      MinicCoreCalleeId callee_id;
                      size_t argument_begin;
                      size_t argument_count;
                  } call;
              } value;''')
          replace_once(
              'src/core/core_ir.h',
              '''    MinicType *parameter_types;
              size_t parameter_count;
              MinicCoreObject *objects;''',
              '''    MinicType *parameter_types;
              size_t parameter_count;
              MinicCoreCallee *callees;
              size_t callee_count;
              size_t callee_capacity;
              MinicCoreValueId *call_arguments;
              size_t call_argument_count;
              size_t call_argument_capacity;
              MinicCoreObject *objects;''')
          replace_once(
              'src/core/core_ir.h',
              '''bool minic_core_function_add_object(MinicCoreFunction *function,
                                              MinicSourceSpan span,
                                              MinicType type,
                                              MinicCoreObjectId *object_id);
          bool minic_core_function_append_value_instruction''',
              '''bool minic_core_function_add_object(MinicCoreFunction *function,
                                              MinicSourceSpan span,
                                              MinicType type,
                                              MinicCoreObjectId *object_id);
          bool minic_core_function_add_callee(MinicCoreFunction *function,
                                              const char *name,
                                              size_t name_length,
                                              MinicType return_type,
                                              const MinicType *parameter_types,
                                              size_t parameter_count,
                                              MinicCoreCalleeId *callee_id);
          bool minic_core_function_append_call_arguments(MinicCoreFunction *function,
                                                         const MinicCoreValueId *arguments,
                                                         size_t argument_count,
                                                         size_t *argument_begin);
          bool minic_core_function_append_value_instruction''')

          # Core storage ownership and verifier/dumper.
          replace_once(
              'src/core/core_ir.c',
              '''void minic_core_function_destroy(MinicCoreFunction *function) {
              size_t block_index;

              if (function == NULL) {
                  return;
              }
              for (block_index = 0U; block_index < function->block_count; ++block_index) {
                  free(function->blocks[block_index].instructions);
              }
              free(function->name);
              free(function->parameter_types);
              free(function->objects);''',
              '''void minic_core_function_destroy(MinicCoreFunction *function) {
              size_t block_index;
              size_t callee_index;

              if (function == NULL) {
                  return;
              }
              for (block_index = 0U; block_index < function->block_count; ++block_index) {
                  free(function->blocks[block_index].instructions);
              }
              for (callee_index = 0U; callee_index < function->callee_count; ++callee_index) {
                  free(function->callees[callee_index].name);
                  free(function->callees[callee_index].parameter_types);
              }
              free(function->name);
              free(function->parameter_types);
              free(function->callees);
              free(function->call_arguments);
              free(function->objects);''')

          replace_once(
              'src/core/core_ir.c',
              '''static bool reserve_instruction(MinicCoreFunction *function, MinicCoreBlock *block) {''',
              '''static bool core_call_scalar_type(MinicType type) {
              return minic_type_is_integer(type) || minic_type_is_pointer(type);
          }

          static bool callee_signature_equal(const MinicCoreCallee *callee,
                                             const char *name,
                                             size_t name_length,
                                             MinicType return_type,
                                             const MinicType *parameter_types,
                                             size_t parameter_count) {
              size_t index;

              if (callee == NULL || name == NULL || callee->name == NULL ||
                  callee->name_length != name_length || memcmp(callee->name, name, name_length) != 0 ||
                  !minic_type_equal(callee->return_type, return_type) ||
                  callee->parameter_count != parameter_count) {
                  return false;
              }
              for (index = 0U; index < parameter_count; ++index) {
                  if (!minic_type_equal(callee->parameter_types[index], parameter_types[index])) {
                      return false;
                  }
              }
              return true;
          }

          bool minic_core_function_add_callee(MinicCoreFunction *function,
                                              const char *name,
                                              size_t name_length,
                                              MinicType return_type,
                                              const MinicType *parameter_types,
                                              size_t parameter_count,
                                              MinicCoreCalleeId *callee_id) {
              MinicCoreCallee stored;
              size_t index;

              if (function == NULL || name == NULL || name_length == 0U || callee_id == NULL ||
                  function->callee_count >= (size_t)UINT32_MAX ||
                  (!minic_type_is_void(return_type) && !core_call_scalar_type(return_type)) ||
                  (parameter_count != 0U && parameter_types == NULL) ||
                  parameter_count > SIZE_MAX / sizeof(*stored.parameter_types)) {
                  return false;
              }
              for (index = 0U; index < parameter_count; ++index) {
                  if (!core_call_scalar_type(parameter_types[index])) {
                      return false;
                  }
              }
              for (index = 0U; index < function->callee_count; ++index) {
                  const MinicCoreCallee *existing;

                  existing = &function->callees[index];
                  if (existing->name_length == name_length &&
                      memcmp(existing->name, name, name_length) == 0) {
                      if (!callee_signature_equal(existing,
                                                  name,
                                                  name_length,
                                                  return_type,
                                                  parameter_types,
                                                  parameter_count)) {
                          return false;
                      }
                      *callee_id = (MinicCoreCalleeId)index;
                      return true;
                  }
              }
              (void)memset(&stored, 0, sizeof(stored));
              stored.name = copy_name(name, name_length);
              if (stored.name == NULL) {
                  return false;
              }
              if (parameter_count != 0U) {
                  stored.parameter_types =
                      (MinicType *)malloc(parameter_count * sizeof(*stored.parameter_types));
                  if (stored.parameter_types == NULL) {
                      free(stored.name);
                      return false;
                  }
                  (void)memcpy(stored.parameter_types,
                               parameter_types,
                               parameter_count * sizeof(*stored.parameter_types));
              }
              stored.name_length = name_length;
              stored.return_type = return_type;
              stored.parameter_count = parameter_count;
              if (!grow_array((void **)&function->callees,
                              &function->callee_capacity,
                              function->callee_count,
                              sizeof(*function->callees))) {
                  free(stored.name);
                  free(stored.parameter_types);
                  return false;
              }
              function->callees[function->callee_count] = stored;
              *callee_id = (MinicCoreCalleeId)function->callee_count;
              function->callee_count += 1U;
              return true;
          }

          bool minic_core_function_append_call_arguments(MinicCoreFunction *function,
                                                         const MinicCoreValueId *arguments,
                                                         size_t argument_count,
                                                         size_t *argument_begin) {
              size_t index;
              size_t start;

              if (function == NULL || argument_begin == NULL ||
                  (argument_count != 0U && arguments == NULL) ||
                  argument_count > SIZE_MAX - function->call_argument_count) {
                  return false;
              }
              start = function->call_argument_count;
              for (index = 0U; index < argument_count; ++index) {
                  if (!grow_array((void **)&function->call_arguments,
                                  &function->call_argument_capacity,
                                  function->call_argument_count,
                                  sizeof(*function->call_arguments))) {
                      function->call_argument_count = start;
                      return false;
                  }
                  function->call_arguments[function->call_argument_count] = arguments[index];
                  function->call_argument_count += 1U;
              }
              *argument_begin = start;
              return true;
          }

          static bool reserve_instruction(MinicCoreFunction *function, MinicCoreBlock *block) {''')

          replace_once(
              'src/core/core_ir.c',
              '''        return minic_type_equal(value_type, function->values[stored_value].type) &&
                         instruction->value.store.is_volatile == minic_type_is_volatile(pointee);
              }
              }
              return false;''',
              '''        return minic_type_equal(value_type, function->values[stored_value].type) &&
                         instruction->value.store.is_volatile == minic_type_is_volatile(pointee);
              }
              case MINIC_CORE_INSTRUCTION_CALL: {
                  const MinicCoreCallee *callee;
                  size_t argument_index;
                  size_t argument_end;
                  bool returns_void;

                  if (instruction->value.call.callee_id >= function->callee_count ||
                      instruction->value.call.argument_begin > function->call_argument_count ||
                      instruction->value.call.argument_count >
                          function->call_argument_count - instruction->value.call.argument_begin) {
                      return false;
                  }
                  callee = &function->callees[instruction->value.call.callee_id];
                  if (instruction->value.call.argument_count != callee->parameter_count ||
                      !minic_type_equal(instruction->type, callee->return_type)) {
                      return false;
                  }
                  returns_void = minic_type_is_void(callee->return_type);
                  if ((returns_void && instruction->result != MINIC_CORE_VALUE_INVALID) ||
                      (!returns_void && !instruction_result_is_valid(function, instruction))) {
                      return false;
                  }
                  argument_end =
                      instruction->value.call.argument_begin + instruction->value.call.argument_count;
                  for (argument_index = instruction->value.call.argument_begin;
                       argument_index < argument_end;
                       ++argument_index) {
                      MinicCoreValueId argument;
                      size_t parameter_index;

                      argument = function->call_arguments[argument_index];
                      parameter_index = argument_index - instruction->value.call.argument_begin;
                      if (argument >= function->value_count || !available_values[argument] ||
                          !minic_type_equal(function->values[argument].type,
                                           callee->parameter_types[parameter_index])) {
                          return false;
                      }
                  }
                  return true;
              }
              }
              return false;''')

          replace_once(
              'src/core/core_ir.c',
              '''        (function->parameter_count != 0U && function->parameter_types == NULL) ||
                  !storage_shape_is_valid(
                      function->objects, function->object_count, function->object_capacity) ||''',
              '''        (function->parameter_count != 0U && function->parameter_types == NULL) ||
                  !storage_shape_is_valid(
                      function->callees, function->callee_count, function->callee_capacity) ||
                  !storage_shape_is_valid(function->call_arguments,
                                          function->call_argument_count,
                                          function->call_argument_capacity) ||
                  !storage_shape_is_valid(
                      function->objects, function->object_count, function->object_capacity) ||''')

          replace_once(
              'src/core/core_ir.c',
              '''    instruction_seen = function->instruction_count == 0U
                                     ? NULL''',
              '''    for (index = 0U; index < function->callee_count; ++index) {
                  const MinicCoreCallee *callee;
                  size_t parameter_index;

                  callee = &function->callees[index];
                  if (callee->name == NULL || callee->name_length == 0U ||
                      (!minic_type_is_void(callee->return_type) &&
                       !core_call_scalar_type(callee->return_type)) ||
                      (callee->parameter_count != 0U && callee->parameter_types == NULL)) {
                      return false;
                  }
                  for (parameter_index = 0U; parameter_index < callee->parameter_count;
                       ++parameter_index) {
                      if (!core_call_scalar_type(callee->parameter_types[parameter_index])) {
                          return false;
                      }
                  }
              }
              instruction_seen = function->instruction_count == 0U
                                     ? NULL''')

          replace_once(
              'src/core/core_ir.c',
              'static bool dump_instruction(FILE *output, const MinicCoreInstruction *instruction) {',
              '''static bool dump_instruction(FILE *output,
                                           const MinicCoreFunction *function,
                                           const MinicCoreInstruction *instruction) {''')
          replace_once(
              'src/core/core_ir.c',
              '''    case MINIC_CORE_INSTRUCTION_STORE:
                  return fprintf(output,
                                 "  store%s %%%" PRIu32 ", %%%" PRIu32 "\\n",
                                 instruction->value.store.is_volatile ? ".volatile" : "",
                                 instruction->value.store.stored_value,
                                 instruction->value.store.address) >= 0;
              }
              return false;''',
              '''    case MINIC_CORE_INSTRUCTION_STORE:
                  return fprintf(output,
                                 "  store%s %%%" PRIu32 ", %%%" PRIu32 "\\n",
                                 instruction->value.store.is_volatile ? ".volatile" : "",
                                 instruction->value.store.stored_value,
                                 instruction->value.store.address) >= 0;
              case MINIC_CORE_INSTRUCTION_CALL: {
                  const MinicCoreCallee *callee;
                  size_t argument_index;

                  if (function == NULL || instruction->value.call.callee_id >= function->callee_count) {
                      return false;
                  }
                  callee = &function->callees[instruction->value.call.callee_id];
                  if (instruction->result == MINIC_CORE_VALUE_INVALID) {
                      if (fprintf(output, "  call @") < 0) {
                          return false;
                      }
                  } else if (fprintf(output, "  %%%" PRIu32 " = call @", instruction->result) < 0) {
                      return false;
                  }
                  if (fwrite(callee->name, 1U, callee->name_length, output) != callee->name_length ||
                      fprintf(output, "(") < 0) {
                      return false;
                  }
                  for (argument_index = 0U; argument_index < instruction->value.call.argument_count;
                       ++argument_index) {
                      MinicCoreValueId argument;

                      argument = function->call_arguments[instruction->value.call.argument_begin +
                                                          argument_index];
                      if ((argument_index != 0U && fprintf(output, ", ") < 0) ||
                          fprintf(output, "%%%" PRIu32, argument) < 0) {
                          return false;
                      }
                  }
                  return fprintf(output, ")\\n") >= 0;
              }
              }
              return false;''')
          replace_once(
              'src/core/core_ir.c',
              '            if (!dump_instruction(output, instruction)) {',
              '            if (!dump_instruction(output, function, instruction)) {')

          # Lowering: evidence-bounded direct, fixed-arity scalar CALL.
          replace_once(
              'src/core/core_lower.c',
              '''static MinicCoreLowerStatus lower_expression(MinicCoreLowerContext *context,
                                                       MinicExpressionId expression_id,
                                                       MinicCoreValueId *value_id) {''',
              '''static MinicCoreLowerStatus lower_direct_call(MinicCoreLowerContext *context,
                                                        const MinicExpression *expression,
                                                        MinicCoreValueId *value_id) {
              const MinicFunction *callee;
              MinicCoreCalleeId callee_id;
              MinicCoreInstruction instruction;
              MinicCoreValueId *arguments;
              MinicCoreLowerStatus status;
              size_t argument_begin;
              size_t argument_index;
              bool returns_void;

              if (context == NULL || context->body == NULL || context->body->program == NULL ||
                  context->function == NULL || expression == NULL || value_id == NULL ||
                  expression->kind != MINIC_EXPRESSION_CALL) {
                  return MINIC_CORE_LOWER_ERROR;
              }
              if (expression->value.call.function_id == MINIC_FUNCTION_INVALID) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              callee = minic_c0_program_function(context->body->program,
                                                 expression->value.call.function_id);
              if (callee == NULL || callee->name == NULL || callee->name_length == 0U) {
                  return MINIC_CORE_LOWER_ERROR;
              }
              returns_void = minic_type_is_void(callee->return_type);
              if (callee->is_variadic || expression->value.call.argument_count != callee->parameter_count ||
                  (!returns_void && !core_memory_scalar_type(callee->return_type))) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              for (argument_index = 0U; argument_index < callee->parameter_count; ++argument_index) {
                  if (!core_memory_scalar_type(callee->parameter_types[argument_index])) {
                      return MINIC_CORE_LOWER_UNSUPPORTED;
                  }
              }
              arguments =
                  callee->parameter_count == 0U
                      ? NULL
                      : (MinicCoreValueId *)malloc(callee->parameter_count * sizeof(*arguments));
              if (callee->parameter_count != 0U && arguments == NULL) {
                  return MINIC_CORE_LOWER_ERROR;
              }
              for (argument_index = 0U; argument_index < callee->parameter_count; ++argument_index) {
                  status = lower_expression(context,
                                            expression->value.call.arguments[argument_index],
                                            &arguments[argument_index]);
                  if (status != MINIC_CORE_LOWER_OK) {
                      free(arguments);
                      return status;
                  }
                  if (arguments[argument_index] >= context->function->value_count ||
                      !minic_type_equal(context->function->values[arguments[argument_index]].type,
                                       callee->parameter_types[argument_index])) {
                      free(arguments);
                      return MINIC_CORE_LOWER_UNSUPPORTED;
                  }
              }
              if (!minic_core_function_add_callee(context->function,
                                                  callee->name,
                                                  callee->name_length,
                                                  callee->return_type,
                                                  callee->parameter_types,
                                                  callee->parameter_count,
                                                  &callee_id) ||
                  !minic_core_function_append_call_arguments(context->function,
                                                             arguments,
                                                             callee->parameter_count,
                                                             &argument_begin)) {
                  free(arguments);
                  return MINIC_CORE_LOWER_ERROR;
              }
              free(arguments);
              (void)memset(&instruction, 0, sizeof(instruction));
              instruction.kind = MINIC_CORE_INSTRUCTION_CALL;
              instruction.span = expression->span;
              instruction.type = callee->return_type;
              instruction.result = MINIC_CORE_VALUE_INVALID;
              instruction.value.call.callee_id = callee_id;
              instruction.value.call.argument_begin = argument_begin;
              instruction.value.call.argument_count = callee->parameter_count;
              if (returns_void) {
                  *value_id = MINIC_CORE_VALUE_INVALID;
                  return minic_core_function_append_effect_instruction(
                             context->function, context->block_id, &instruction)
                             ? MINIC_CORE_LOWER_OK
                             : MINIC_CORE_LOWER_ERROR;
              }
              return minic_core_function_append_value_instruction(
                         context->function, context->block_id, &instruction, value_id)
                         ? MINIC_CORE_LOWER_OK
                         : MINIC_CORE_LOWER_ERROR;
          }

          static MinicCoreLowerStatus lower_expression(MinicCoreLowerContext *context,
                                                       MinicExpressionId expression_id,
                                                       MinicCoreValueId *value_id) {''')

          replace_once(
              'src/core/core_lower.c',
              '''    if (expression->value_category != MINIC_VALUE_RVALUE) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              (void)memset(&instruction, 0, sizeof(instruction));''',
              '''    if (expression->value_category != MINIC_VALUE_RVALUE) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              if (expression->kind == MINIC_EXPRESSION_CALL) {
                  return lower_direct_call(context, expression, value_id);
              }
              (void)memset(&instruction, 0, sizeof(instruction));''')

          replace_once(
              'src/core/core_lower.c',
              '''    if (expression->kind != MINIC_EXPRESSION_ASSIGNMENT) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              target_id = expression->value.binary.left;''',
              '''    if (expression->kind == MINIC_EXPRESSION_CALL) {
                  MinicCoreValueId discarded_value;

                  return lower_direct_call(context, expression, &discarded_value);
              }
              if (expression->kind != MINIC_EXPRESSION_ASSIGNMENT) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              target_id = expression->value.binary.left;''')

          # Permanent pipeline coverage: supported direct scalar calls + fail-closed boundaries.
          p = Path('tests/core/run-core-ir-shadow.sh')
          text = p.read_text()
          marker = "\ncat >\"$work_dir/unsupported.i\" <<'EOF'\n"
          assert text.count(marker) == 1
          addition = r'''

          cat >"$work_dir/direct-call-v0.i" <<'EOF'
          int direct_callee(int value) {
              return value + 1;
          }

          int direct_caller(int value) {
              return direct_callee(value);
          }
          EOF
          check_strict_case direct-call-v0

          cat >"$work_dir/direct-void-call-v0.i" <<'EOF'
          void direct_sink(int value) {
              return;
          }

          void direct_void_caller(int value) {
              direct_sink(value);
              return;
          }
          EOF
          check_strict_case direct-void-call-v0

          cat >"$work_dir/direct-pointer-result-statement-v0.i" <<'EOF'
          int *external_pointer_identity(int *value);

          void consume_pointer_call(int *value) {
              external_pointer_identity(value);
              return;
          }
          EOF
          check_strict_case direct-pointer-result-statement-v0

          cat >"$work_dir/indirect-call-unsupported.i" <<'EOF'
          int indirect_caller(int (*callee)(int), int value) {
              return callee(value);
          }
          EOF
          "$MINIC" -S "$work_dir/indirect-call-unsupported.i" \
              -o "$work_dir/indirect-call-unsupported-normal.s"
          if MINIC_CORE_IR=strict "$MINIC" -S "$work_dir/indirect-call-unsupported.i" \
              -o "$work_dir/indirect-call-unsupported-strict.s" \
              2>"$work_dir/indirect-call-unsupported-strict.err"; then
              echo "strict Core IR shadow unexpectedly accepted an indirect call" >&2
              exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'indirect_caller'" \
              "$work_dir/indirect-call-unsupported-strict.err" >/dev/null

          cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'
          int variadic_external(int first, ...);

          int variadic_caller(int value) {
              return variadic_external(value, value);
          }
          EOF
          "$MINIC" -S "$work_dir/variadic-call-unsupported.i" \
              -o "$work_dir/variadic-call-unsupported-normal.s"
          if MINIC_CORE_IR=strict "$MINIC" -S "$work_dir/variadic-call-unsupported.i" \
              -o "$work_dir/variadic-call-unsupported-strict.s" \
              2>"$work_dir/variadic-call-unsupported-strict.err"; then
              echo "strict Core IR shadow unexpectedly accepted a variadic call" >&2
              exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'variadic_caller'" \
              "$work_dir/variadic-call-unsupported-strict.err" >/dev/null
          '''
          p.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Canonical formatting
        run: |
          clang-format -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c
