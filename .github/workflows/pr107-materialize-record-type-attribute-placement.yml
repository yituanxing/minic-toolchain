name: PR107 Materialize Record Type Attribute Placement
on:
  push:
    branches: [agent/record-type-attribute-placement-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/record-type-attribute-placement-v0, fetch-depth: 0}
      - name: Materialize shared record type attributes
        run: python3 tools/dev/pr107-materialize-record-type-attribute-placement.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused-packed-record" HOST_CC=cc sh tests/compiler/c0/run-packed-record-layout.sh
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused-record-align" HOST_CC=cc sh tests/compiler/c0/run-gnu-record-alignment.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr107-materialize-record-type-attribute-placement.yml tools/dev/pr107-materialize-record-type-attribute-placement.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: share GNU record type attributes'
          git push origin HEAD:agent/record-type-attribute-placement-v0
