name: Linux Core Strict500, Focused Five and Full3352 Compile/Assemble Oracles

on:
  push:
    branches:
      - agent/linux-expanded-kbuild-v0
      - agent/linux-perf-boolean-domain-v1
    paths:
      - '.github/workflows/linux-core-all3352.yml'
      - '.github/workflows-disabled/core-first500-regression.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      mode:
        description: "Select compile-only corpus proof or GNU-assembler object proof"
        required: true
        type: choice
        default: compile
        options:
          - compile
          - assemble
          - strict500
          - focused-five
          - all

permissions:
  contents: read

jobs:

  first500:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'compile' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[all3352]') || contains(github.event.head_commit.message, '[linux-core-all3352]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen first500 corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Validate frozen first500 corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest=build/linux-focus-corpus/selected-tus.txt
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq 500

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/all3352-first500-compiler

      - name: Replay first500 exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/all3352-first500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/all3352-first500"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py             --minic "$compiler"             --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus"             --work "$work"             --jobs 4             --offset 0             --limit 500             --sample-count 0
          python3 tools/ci/classify-core-strict-frontier.py             "$work/batch-results.json"             --stderr-root "$work/minic-stderr"             --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h"             --examples 50             --json-out "$work/frontier-summary.json"             --reason-text-out "$work/reason-summary.txt"             --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/all3352-first500/frontier-summary.json")
          s = json.loads(p.read_text())
          expected = dict(selected=500, pass_=500, unsupported=0, error=0, preprocess_missing=0)
          actual = dict(selected=s["selected"], pass_=s["pass"], unsupported=s["unsupported"],
                        error=s["error"], preprocess_missing=s["preprocess_missing"])
          print(f"ALL3352_SHARD label=first500 selected={actual['selected']} pass={actual['pass_']} unsupported={actual['unsupported']} error={actual['error']} preprocess_missing={actual['preprocess_missing']}")
          if actual != expected:
              raise SystemExit(f"first500 not exact: {actual}")
          PY

  shards:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'compile' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[all3352]') || contains(github.event.head_commit.message, '[linux-core-all3352]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: new500
            corpus_dir: linux-new500-corpus
            cache_key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
            limit: 500
          - label: next500
            corpus_dir: linux-next500-corpus
            cache_key: linux-next500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1000-1499
            limit: 500
          - label: next500b
            corpus_dir: linux-next500b-corpus
            cache_key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
            limit: 500
          - label: next500c
            corpus_dir: linux-next500c-corpus
            cache_key: linux-next500c-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-2000-2499
            limit: 500
          - label: next500d
            corpus_dir: linux-next500d-corpus
            cache_key: linux-next500d-corpus-v4-6.6.143-rv64-defconfig-gcc13.3.0-indices-2500-2999
            limit: 500
          - label: final352
            corpus_dir: linux-final352-corpus
            cache_key: linux-final352-corpus-v2-6.6.143-rv64-defconfig-gcc13.3.0-indices-3000-3351
            limit: 352
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen shard corpus
        uses: actions/cache/restore@v4
        with:
          path: build/${{ matrix.corpus_dir }}
          key: ${{ matrix.cache_key }}
          fail-on-cache-miss: true

      - name: Validate frozen shard corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest="build/${{ matrix.corpus_dir }}/selected-tus.txt"
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq ${{ matrix.limit }}

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/all3352-${{ matrix.label }}-compiler

      - name: Replay shard exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          limit=${{ matrix.limit }}
          compiler="$GITHUB_WORKSPACE/build/all3352-$label-compiler/bin/minic"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/all3352-$label"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py             --minic "$compiler"             --corpus "$corpus"             --work "$work"             --jobs 4             --offset 0             --limit "$limit"             --sample-count 0
          python3 tools/ci/classify-core-strict-frontier.py             "$work/batch-results.json"             --stderr-root "$work/minic-stderr"             --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h"             --examples 50             --json-out "$work/frontier-summary.json"             --reason-text-out "$work/reason-summary.txt"             --require-no-errors
          LABEL="$label" LIMIT="$limit" WORK="$work" python3 - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads((Path(os.environ["WORK"]) / "frontier-summary.json").read_text())
          limit = int(os.environ["LIMIT"])
          actual = dict(selected=s["selected"], pass_=s["pass"], unsupported=s["unsupported"],
                        error=s["error"], preprocess_missing=s["preprocess_missing"])
          expected = dict(selected=limit, pass_=limit, unsupported=0, error=0, preprocess_missing=0)
          print(f"ALL3352_SHARD label={os.environ['LABEL']} selected={actual['selected']} pass={actual['pass_']} unsupported={actual['unsupported']} error={actual['error']} preprocess_missing={actual['preprocess_missing']}")
          if actual != expected:
              raise SystemExit(f"{os.environ['LABEL']} not exact: {actual}")
          PY

  all3352:
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'compile' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[all3352]') || contains(github.event.head_commit.message, '[linux-core-all3352]'))))
    needs:
      - first500
      - shards
    runs-on: ubuntu-24.04
    steps:
      - name: Require every frozen shard exact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.first500.result }}" = success
          test "${{ needs.shards.result }}" = success
          echo "ALL3352_EXACT head=$GITHUB_SHA selected=3352 pass=3352 unsupported=0 error=0 preprocess_missing=0"

  # Independent original GNU-assembler object proof job graph; exact command bodies retained.
  asm-first500:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'assemble' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-assemble-all3352]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore frozen first500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Install RV64 assembler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-assemble-all-first500-compiler

      - name: Compile and assemble full first500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-assemble-all-first500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-assemble-all-first500"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500
          python3 - "$work/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==500 and not bad, (len(rows), bad[:5])
          PY

          # kernel/configs.c contains a file-level .incbin of
          # kernel/config_data.gz.  That payload is generated by Kbuild and is
          # deliberately absent from the frozen preprocessed-TU corpus.  Use
          # an empty sidecar here only to validate MiniC assembly syntax and
          # relocations; the real non-empty sidecar path is separately proven
          # by Stage2 Linux Kbuild CC Smoke.
          mkdir -p kernel
          : > kernel/config_data.gz
          python3 tests/external/linux/assemble_replay.py --work "$work" --jobs 4
          rm -f kernel/config_data.gz
          rmdir kernel 2>/dev/null || true
          echo "LINUX_ASSEMBLE_SHARD=PASS shard=first500 selected=500 pass=500 auxiliary_sidecar=kernel/config_data.gz"

  asm-shards:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'assemble' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-assemble-all3352]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: new500
            corpus_dir: linux-new500-corpus
            cache_key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
            expected: 500
          - label: next500
            corpus_dir: linux-next500-corpus
            cache_key: linux-next500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1000-1499
            expected: 500
          - label: next500b
            corpus_dir: linux-next500b-corpus
            cache_key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
            expected: 500
          - label: next500c
            corpus_dir: linux-next500c-corpus
            cache_key: linux-next500c-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-2000-2499
            expected: 500
          - label: next500d
            corpus_dir: linux-next500d-corpus
            cache_key: linux-next500d-corpus-v4-6.6.143-rv64-defconfig-gcc13.3.0-indices-2500-2999
            expected: 500
          - label: final352
            corpus_dir: linux-final352-corpus
            cache_key: linux-final352-corpus-v2-6.6.143-rv64-defconfig-gcc13.3.0-indices-3000-3351
            expected: 352
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore frozen shard corpus
        uses: actions/cache/restore@v4
        with:
          path: build/${{ matrix.corpus_dir }}
          key: ${{ matrix.cache_key }}
          fail-on-cache-miss: true

      - name: Install RV64 assembler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-assemble-all-${{ matrix.label }}-compiler

      - name: Compile and assemble full shard
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          expected=${{ matrix.expected }}
          compiler="$GITHUB_WORKSPACE/build/linux-assemble-all-$label-compiler/bin/minic"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/linux-assemble-all-$label"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$corpus" --work "$work" --jobs 4
          python3 - "$work/batch-results.json" "$expected" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          expected=int(sys.argv[2])
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==expected and not bad, (len(rows), expected, bad[:5])
          PY
          python3 tests/external/linux/assemble_replay.py --work "$work" --jobs 4
          echo "LINUX_ASSEMBLE_SHARD=PASS shard=$label selected=$expected pass=$expected"

  asm-all3352:
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'assemble' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-assemble-all3352]')))
    needs: [asm-first500, asm-shards]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every object shard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.asm-first500.result }}" = success
          test "${{ needs.asm-shards.result }}" = success
          echo "LINUX_ASSEMBLE_ALL3352=PASS selected=3352 pass=3352 fail=0 head=$GITHUB_SHA"


  strict500:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'strict500' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[regress500]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Restore pinned Linux source archive
        if: steps.linux-corpus-cache.outputs.cache-hit != 'true'
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Restore RISC-V package archives
        if: steps.linux-corpus-cache.outputs.cache-hit != 'true'
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Restore native Kbuild package archives
        if: steps.linux-corpus-cache.outputs.cache-hit != 'true'
        id: kbuild-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/minic-kbuild-apt/archives
          key: kbuild-apt-${{ runner.os }}-${{ runner.arch }}-noble-flex-bison-bc-libelf-dev-libssl-dev-v1

      - name: Install Linux corpus rebuild dependencies
        if: steps.linux-corpus-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
          KBUILD_CACHE_HIT: ${{ steps.kbuild-cache.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          apt_cache="$HOME/.cache/minic-apt/archives"
          native_cache="$HOME/.cache/minic-kbuild-apt/archives"
          mkdir -p "$apt_cache/partial" "$native_cache/partial"

          install_cached_debs() {
            cache_dir=$1
            label=$2
            mapfile -d '' cached_packages < <(find "$cache_dir" -maxdepth 1 -type f -name '*.deb' -print0 | sort -z)
            if (( ${#cached_packages[@]} == 0 )); then
              return 1
            fi
            printf 'Restoring %d cached %s packages\n' "${#cached_packages[@]}" "$label"
            sudo dpkg --unpack "${cached_packages[@]}" || true
            sudo dpkg --configure -a
          }

          if [[ "$KBUILD_CACHE_HIT" == true ]]; then
            install_cached_debs "$native_cache" 'native Kbuild' || true
          fi
          if [[ "$RV64_CACHE_HIT" == true ]]; then
            install_cached_debs "$apt_cache" 'RISC-V' || true
          fi

          missing=()
          command -v flex >/dev/null 2>&1 || missing+=(flex)
          command -v bison >/dev/null 2>&1 || missing+=(bison)
          command -v bc >/dev/null 2>&1 || missing+=(bc)
          command -v riscv64-linux-gnu-gcc >/dev/null 2>&1 || missing+=(gcc-riscv64-linux-gnu libc6-dev-riscv64-cross)
          dpkg-query -W -f='${Status}' libelf-dev 2>/dev/null | grep -q 'ok installed' || missing+=(libelf-dev)
          dpkg-query -W -f='${Status}' libssl-dev 2>/dev/null | grep -q 'ok installed' || missing+=(libssl-dev)

          if (( ${#missing[@]} != 0 )); then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Dir::Cache::archives="$native_cache" \
              -o APT::Keep-Downloaded-Packages=true \
              install -y --no-install-recommends "${missing[@]}"
          fi
          command -v riscv64-linux-gnu-gcc
          command -v flex
          command -v bison
          command -v bc

      - name: Assert productized Core-only source
        id: source_state
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git grep -Fq 'M175B_SCALAR_DOUBLE_BRIDGE' -- src/core
          git grep -Fq 'M175B_SCALAR_RETURN_OWNER' -- src/core
          grep -Fq 'minic_riscv64_write_c0_program_with_core_functions' src/target/riscv64/codegen_function.c
          ! git grep -n 'minic_riscv64_write_c0_program(' -- src
          ! git grep -n 'minic_riscv64_emit_function(' -- src
          ! git grep -n 'MINIC_CORE_IR' -- src
          ! git grep -n 'core_required' -- src
          test ! -e src/target/riscv64/codegen_expression.c
          test ! -e src/target/riscv64/codegen_statement.c
          test ! -e src/target/riscv64/codegen_inline_asm.c
          source_head=$(git rev-parse HEAD)
          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
          echo "M175_EXACT_SOURCE_HEAD=$source_head"
          echo 'M175_CORE_ONLY_SOURCE route=ABSENT staging=NONE tree=CLEAN'

      - name: Build exact Core-only source
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m175-strict500-compiler

      - name: Rebuild frozen first500 corpus on cache miss
        if: steps.linux-corpus-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175-strict500-compiler/bin/minic"
          bootstrap="$GITHUB_WORKSPACE/build/m175-corpus-bootstrap"
          selection=$(grep -Ev '^[[:space:]]*(#|$)' tests/external/linux/replay-indices.txt | paste -sd, - || true)
          if [[ -n "$selection" ]]; then
            export LINUX_BATCH_SELECTION="$selection"
            echo "M175_CORPUS_SELECTION=explicit"
          else
            unset LINUX_BATCH_SELECTION
            echo "M175_CORPUS_SELECTION=default-first500"
          fi

          set +e
          MINIC="$compiler" \
          BUILD_DIR="$bootstrap" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 \
          LINUX_BATCH_LIMIT=500 \
          LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh
          bootstrap_status=$?
          set -e
          printf 'M175_CORPUS_BOOTSTRAP_COMPILER_STATUS=%d\n' "$bootstrap_status"

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          work = Path('build/m175-corpus-bootstrap')
          corpus = Path('build/linux-focus-corpus')
          selected = work / 'selected-tus.txt'
          if not selected.is_file():
              raise SystemExit('M175 corpus bootstrap did not produce selected-tus.txt')
          rows = [line for line in selected.read_text().splitlines() if line.strip()]
          if len(rows) != 500:
              raise SystemExit(f'M175 corpus bootstrap selected {len(rows)}, expected 500')
          shutil.rmtree(corpus, ignore_errors=True)
          inputs = corpus / 'kbuild'
          inputs.mkdir(parents=True)
          shutil.copy2(selected, corpus / 'selected-tus.txt')
          manifest = work / 'tu-manifest.txt'
          if manifest.is_file():
              shutil.copy2(manifest, corpus / 'tu-manifest.txt')
          for row in rows:
              _, _, rel_i, _ = row.split('\t', 3)
              source = work / 'kbuild' / rel_i
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f'M175 corpus bootstrap missing {source}')
              target = inputs / rel_i
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          print('M175_CORPUS_BOOTSTRAP selected=500 preprocess_missing=0')
          PY

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s build/linux-focus-corpus/selected-tus.txt
          test "$(grep -cve '^[[:space:]]*$' build/linux-focus-corpus/selected-tus.txt)" -eq 500
          echo "M175_STRICT500_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "M175_CORPUS_CACHE_HIT=${{ steps.linux-corpus-cache.outputs.cache-hit }}"

      - name: Save rebuilt frozen first500 corpus
        if: steps.linux-corpus-cache.outputs.cache-hit != 'true' && hashFiles('build/linux-focus-corpus/selected-tus.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Save pinned Linux source archive
        if: steps.linux-corpus-cache.outputs.cache-hit != 'true' && steps.linux-source-cache.outputs.cache-hit != 'true' && hashFiles('build/linux-cache/linux-6.6.143.tar.xz') != ''
        uses: actions/cache/save@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Qualify scalar double focused
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-cast-expressions MODE=release CFLAGS=-Werror BUILD_DIR=build/m175-strict500-cast
          compiler="$GITHUB_WORKSPACE/build/m175-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175-strict500-focused"
          mkdir -p "$work"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/cast_integer_to_double.c -o "$work/int-to-double.i"
          CORE_FAST_TRACE=1 "$compiler" -S "$work/int-to-double.i" -o "$work/int-to-double.s"
          grep -E '^[[:space:]]+fcvt\.d\.w[[:space:]]+' "$work/int-to-double.s" >/dev/null
          cc -E -P -std=gnu11 -x c tests/compiler/c0/cast_double_to_integer.c -o "$work/double-to-int.i"
          CORE_FAST_TRACE=1 "$compiler" -S "$work/double-to-int.i" -o "$work/double-to-int.s"
          grep -E '^[[:space:]]+fcvt\.w\.d[[:space:]]+[^,]+,[[:space:]]*[^,]+,[[:space:]]*rtz$' "$work/double-to-int.s" >/dev/null
          echo 'M175_DOUBLE_FOCUSED=PASS'

      - name: Qualify local complete object diagnostics
        run: make -j4 check-pointer-members MODE=release CFLAGS=-Werror BUILD_DIR=build/m175-strict500-pointer

      - name: Replay frozen strict500 from exact production source
        id: strict500_replay
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175-strict500"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'M175_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/m175-strict500')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          headline = (
              f"M175_STRICT500_EXACT selected={summary['selected']} pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error={summary['error']} "
              f"preprocess_missing={summary['preprocess_missing']}"
          )
          print(headline)
          (work / 'headline.txt').write_text(headline + '\n')
          if summary['selected'] != 500 or summary['pass'] != 500 or summary['unsupported'] != 0 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M175 exact-source strict500 is not exact 500/500: {summary}')
          PY

      - name: Run broad check-fast after strict500 census
        id: check_fast
        if: always()
        continue-on-error: true
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m175-strict500-fast

      - name: Record broad check-fast outcome
        if: always()
        shell: bash
        run: echo "M175_CHECK_FAST_AFTER_STRICT500=${{ steps.check_fast.outcome }}"

      - name: Keep broad check-fast observational after strict500
        if: always() && steps.check_fast.outcome != 'success'
        shell: bash
        run: |
          echo "M175_CHECK_FAST_OBSERVATION=FAIL outcome=${{ steps.check_fast.outcome }}"
          echo "Strict500 is the frozen architecture contract; unrelated broad debt is reported but does not invalidate it."

      - name: Persist M175 strict500 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m175-core-only-strict500-${{ steps.source_state.outputs.source_head }}
          path: |
            build/m175-strict500/batch-results.json
            build/m175-strict500/frontier-summary.json
            build/m175-strict500/reason-summary.txt
            build/m175-strict500/headline.txt
            build/m175-strict500/minic-stderr
            build/m175-strict500-focused/**
            build/m175-corpus-bootstrap/batch-summary.txt
            build/m175-corpus-bootstrap/preprocess.log
          if-no-files-found: warn

  # Preserved exact five-object historical regression proof.
  focused-five:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'focused-five' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-five]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen first500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Restore frozen new500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-new500-corpus
          key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
          fail-on-cache-miss: true

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-five-compiler

      - name: Replay five cross-shard regressions
        shell: bash
        run: |
          set -Euo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-five-compiler/bin/minic"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$GITHUB_WORKSPACE/build/linux-five-first" --jobs 1 --indices 254
          first_status=$?
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-new500-corpus" --work "$GITHUB_WORKSPACE/build/linux-five-new" --jobs 4 --indices 775,779,879,881
          new_status=$?
          set -e
          echo "FOCUSED_REPLAY_STATUS first=$first_status new=$new_status"

      - name: Print exact failing source context
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          sets = [
              (Path("build/linux-five-first"), Path("build/linux-focus-corpus/kbuild")),
              (Path("build/linux-five-new"), Path("build/linux-new500-corpus/kbuild")),
          ]
          failed = 0
          for work, corpus in sets:
              rows = json.loads((work / "batch-results.json").read_text())
              if isinstance(rows, dict):
                  rows = rows.get("results", [])
              for row in rows:
                  status = row["status"]
                  print(f"LINUX_FIVE index={row['index']} status={status} input={row['input']} "
                        f"line={row.get('first_error_line')} message={row.get('message','')}")
                  if status == "PASS":
                      continue
                  failed += 1
                  line = row.get("first_error_line")
                  path = corpus / row["input"]
                  if not path.is_file() or not isinstance(line, int):
                      continue
                  source = path.read_text(errors="replace").splitlines()
                  lo = max(1, line - 18)
                  hi = min(len(source), line + 18)
                  print(f"--- CONTEXT index={row['index']} {row['input']} lines={lo}-{hi} ---")
                  for n in range(lo, hi + 1):
                      marker = ">>" if n == line else "  "
                      print(f"{marker} {n:7d}: {source[n-1]}")
                  stderr = work / "minic-stderr" / f"{row['input']}.stderr"
                  if stderr.is_file():
                      print(f"--- STDERR index={row['index']} ---")
                      print(stderr.read_text(errors="replace")[:12000])
          if failed:
              raise SystemExit(f"focused-five still has {failed} failures")
          print("LINUX_FIVE_EXACT pass=5 fail=0")
          PY
