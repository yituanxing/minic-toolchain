name: Linux Core Full3352 Compile and Assemble Oracle

on:
  push:
    branches:
      - agent/linux-expanded-kbuild-v0
      - agent/linux-perf-boolean-domain-v1
    paths:
      - '.github/workflows/linux-core-all3352.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      mode:
        description: "Select compile-only corpus proof or GNU-assembler object proof"
        required: true
        type: choice
        default: compile
        options:
          - compile
          - assemble
          - all

permissions:
  contents: read

jobs:
  first500:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'compile' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[all3352]') || contains(github.event.head_commit.message, '[linux-core-all3352]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen first500 corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Validate frozen first500 corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest=build/linux-focus-corpus/selected-tus.txt
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq 500

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/all3352-first500-compiler

      - name: Replay first500 exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/all3352-first500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/all3352-first500"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py             --minic "$compiler"             --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus"             --work "$work"             --jobs 4             --offset 0             --limit 500             --sample-count 0
          python3 tools/ci/classify-core-strict-frontier.py             "$work/batch-results.json"             --stderr-root "$work/minic-stderr"             --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h"             --examples 50             --json-out "$work/frontier-summary.json"             --reason-text-out "$work/reason-summary.txt"             --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/all3352-first500/frontier-summary.json")
          s = json.loads(p.read_text())
          expected = dict(selected=500, pass_=500, unsupported=0, error=0, preprocess_missing=0)
          actual = dict(selected=s["selected"], pass_=s["pass"], unsupported=s["unsupported"],
                        error=s["error"], preprocess_missing=s["preprocess_missing"])
          print(f"ALL3352_SHARD label=first500 selected={actual['selected']} pass={actual['pass_']} unsupported={actual['unsupported']} error={actual['error']} preprocess_missing={actual['preprocess_missing']}")
          if actual != expected:
              raise SystemExit(f"first500 not exact: {actual}")
          PY

  shards:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'compile' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[all3352]') || contains(github.event.head_commit.message, '[linux-core-all3352]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: new500
            corpus_dir: linux-new500-corpus
            cache_key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
            limit: 500
          - label: next500
            corpus_dir: linux-next500-corpus
            cache_key: linux-next500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1000-1499
            limit: 500
          - label: next500b
            corpus_dir: linux-next500b-corpus
            cache_key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
            limit: 500
          - label: next500c
            corpus_dir: linux-next500c-corpus
            cache_key: linux-next500c-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-2000-2499
            limit: 500
          - label: next500d
            corpus_dir: linux-next500d-corpus
            cache_key: linux-next500d-corpus-v4-6.6.143-rv64-defconfig-gcc13.3.0-indices-2500-2999
            limit: 500
          - label: final352
            corpus_dir: linux-final352-corpus
            cache_key: linux-final352-corpus-v2-6.6.143-rv64-defconfig-gcc13.3.0-indices-3000-3351
            limit: 352
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen shard corpus
        uses: actions/cache/restore@v4
        with:
          path: build/${{ matrix.corpus_dir }}
          key: ${{ matrix.cache_key }}
          fail-on-cache-miss: true

      - name: Validate frozen shard corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest="build/${{ matrix.corpus_dir }}/selected-tus.txt"
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq ${{ matrix.limit }}

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/all3352-${{ matrix.label }}-compiler

      - name: Replay shard exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          limit=${{ matrix.limit }}
          compiler="$GITHUB_WORKSPACE/build/all3352-$label-compiler/bin/minic"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/all3352-$label"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py             --minic "$compiler"             --corpus "$corpus"             --work "$work"             --jobs 4             --offset 0             --limit "$limit"             --sample-count 0
          python3 tools/ci/classify-core-strict-frontier.py             "$work/batch-results.json"             --stderr-root "$work/minic-stderr"             --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h"             --examples 50             --json-out "$work/frontier-summary.json"             --reason-text-out "$work/reason-summary.txt"             --require-no-errors
          LABEL="$label" LIMIT="$limit" WORK="$work" python3 - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads((Path(os.environ["WORK"]) / "frontier-summary.json").read_text())
          limit = int(os.environ["LIMIT"])
          actual = dict(selected=s["selected"], pass_=s["pass"], unsupported=s["unsupported"],
                        error=s["error"], preprocess_missing=s["preprocess_missing"])
          expected = dict(selected=limit, pass_=limit, unsupported=0, error=0, preprocess_missing=0)
          print(f"ALL3352_SHARD label={os.environ['LABEL']} selected={actual['selected']} pass={actual['pass_']} unsupported={actual['unsupported']} error={actual['error']} preprocess_missing={actual['preprocess_missing']}")
          if actual != expected:
              raise SystemExit(f"{os.environ['LABEL']} not exact: {actual}")
          PY

  all3352:
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'compile' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[all3352]') || contains(github.event.head_commit.message, '[linux-core-all3352]'))))
    needs:
      - first500
      - shards
    runs-on: ubuntu-24.04
    steps:
      - name: Require every frozen shard exact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.first500.result }}" = success
          test "${{ needs.shards.result }}" = success
          echo "ALL3352_EXACT head=$GITHUB_SHA selected=3352 pass=3352 unsupported=0 error=0 preprocess_missing=0"

  # Independent original GNU-assembler object proof job graph; exact command bodies retained.
  asm-first500:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'assemble' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-assemble-all3352]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore frozen first500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Install RV64 assembler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-assemble-all-first500-compiler

      - name: Compile and assemble full first500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-assemble-all-first500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-assemble-all-first500"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500
          python3 - "$work/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==500 and not bad, (len(rows), bad[:5])
          PY

          # kernel/configs.c contains a file-level .incbin of
          # kernel/config_data.gz.  That payload is generated by Kbuild and is
          # deliberately absent from the frozen preprocessed-TU corpus.  Use
          # an empty sidecar here only to validate MiniC assembly syntax and
          # relocations; the real non-empty sidecar path is separately proven
          # by Stage2 Linux Kbuild CC Smoke.
          mkdir -p kernel
          : > kernel/config_data.gz
          python3 tests/external/linux/assemble_replay.py --work "$work" --jobs 4
          rm -f kernel/config_data.gz
          rmdir kernel 2>/dev/null || true
          echo "LINUX_ASSEMBLE_SHARD=PASS shard=first500 selected=500 pass=500 auxiliary_sidecar=kernel/config_data.gz"

  asm-shards:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'assemble' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-assemble-all3352]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: new500
            corpus_dir: linux-new500-corpus
            cache_key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
            expected: 500
          - label: next500
            corpus_dir: linux-next500-corpus
            cache_key: linux-next500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1000-1499
            expected: 500
          - label: next500b
            corpus_dir: linux-next500b-corpus
            cache_key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
            expected: 500
          - label: next500c
            corpus_dir: linux-next500c-corpus
            cache_key: linux-next500c-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-2000-2499
            expected: 500
          - label: next500d
            corpus_dir: linux-next500d-corpus
            cache_key: linux-next500d-corpus-v4-6.6.143-rv64-defconfig-gcc13.3.0-indices-2500-2999
            expected: 500
          - label: final352
            corpus_dir: linux-final352-corpus
            cache_key: linux-final352-corpus-v2-6.6.143-rv64-defconfig-gcc13.3.0-indices-3000-3351
            expected: 352
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore frozen shard corpus
        uses: actions/cache/restore@v4
        with:
          path: build/${{ matrix.corpus_dir }}
          key: ${{ matrix.cache_key }}
          fail-on-cache-miss: true

      - name: Install RV64 assembler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-assemble-all-${{ matrix.label }}-compiler

      - name: Compile and assemble full shard
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          expected=${{ matrix.expected }}
          compiler="$GITHUB_WORKSPACE/build/linux-assemble-all-$label-compiler/bin/minic"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/linux-assemble-all-$label"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$corpus" --work "$work" --jobs 4
          python3 - "$work/batch-results.json" "$expected" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          expected=int(sys.argv[2])
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==expected and not bad, (len(rows), expected, bad[:5])
          PY
          python3 tests/external/linux/assemble_replay.py --work "$work" --jobs 4
          echo "LINUX_ASSEMBLE_SHARD=PASS shard=$label selected=$expected pass=$expected"

  asm-all3352:
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'assemble' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-assemble-all3352]')))
    needs: [asm-first500, asm-shards]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every object shard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.asm-first500.result }}" = success
          test "${{ needs.asm-shards.result }}" = success
          echo "LINUX_ASSEMBLE_ALL3352=PASS selected=3352 pass=3352 fail=0 head=$GITHUB_SHA"
