name: Diagnostic Object Attribute 25 32 V1

on:
  push:
    branches: [diagnostic/object-attribute-25-32-v1]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Build MiniC candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/object-attribute-diagnostic

      - name: Drive Linux indices 25 through 32
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/object-attribute-diagnostic/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/object-attribute-batch" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=25 \
          LINUX_BATCH_LIMIT=8 \
          LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh

      - name: Show exact failure contexts
        if: always()
        shell: bash
        run: |
          printf '%s\n' '=== SUMMARY ==='
          cat build/object-attribute-batch/batch-summary.txt || true
          printf '%s\n' '=== FAILURE CONTEXTS ==='
          cat build/object-attribute-batch/failure-contexts.txt || true
