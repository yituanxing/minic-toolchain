name: PR71 Variadic Double

on:
  push:
    branches:
      - frontend/additive-update-pointer-difference

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Add variadic double support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/parser_expression.c')
          text = path.read_text()
          old = 'return minic_type_is_integer(type) || minic_type_is_pointer(type);'
          new = ('return minic_type_is_integer(type) || minic_type_is_pointer(type) || '
                 'minic_type_is_double(type);')
          if old not in text:
              raise SystemExit('parser variadic predicate not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/frontend/ast_verifier.c')
          text = path.read_text()
          old = '!minic_type_is_pointer(argument->type)) {'
          new = ('!minic_type_is_pointer(argument->type) &&\n'
                 '                   !minic_type_is_double(argument->type)) {')
          if old not in text:
              raise SystemExit('verifier variadic predicate not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/target/riscv64/codegen_expression.c')
          text = path.read_text()
          marker = 'static bool minic_riscv64_emit_variadic_argument_conversion(FILE *file, MinicType type) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('RV64 variadic conversion function not found')
          position = text.find('if (minic_type_is_pointer(type)) {', start)
          if position < 0:
              raise SystemExit('RV64 variadic pointer predicate not found')
          text = (text[:position] +
                  'if (minic_type_is_pointer(type) || minic_type_is_double(type)) {' +
                  text[position + len('if (minic_type_is_pointer(type)) {'):])
          path.write_text(text)
          PY
          clang-format-18 -i \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_expression.c

      - name: Commit generated sources
        env:
          BRANCH: frontend/additive-update-pointer-difference
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_expression.c
          git rm .github/workflows/pr71-variadic-double.yml
          git commit -m 'target: support double variadic arguments on RV64'
          git push origin HEAD:"$BRANCH"
