name: Productize Direct Function Parameter V1
on:
  push:
    branches: [product/direct-function-parameter-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/direct-function-parameter-v1
          fetch-depth: 0
      - name: Materialize source and permanent contract
        run: |
          set -Eeuo pipefail
          git show origin/staging/string-octal-v1:tools/dev/materialize-direct-function-parameter-v1.py > tools/dev/.productize-direct-function-parameter-v1.py
          python3 tools/dev/.productize-direct-function-parameter-v1.py
          rm tools/dev/.productize-direct-function-parameter-v1.py
          cat > tests/compiler/c0/direct_function_parameter.c <<'EOF'
          static int increment(int value) { return value + 1; }
          static int apply(int callback(int), int value) { return callback(value); }
          int main(void) { return apply(increment, 6) == 7 ? 0 : 1; }
          EOF
          cat >> tests/compiler/c0/run-function-parameter-adjustment.sh <<'EOF'

          "$host_cc" -E -P -std=gnu11 -x c \
              "$root/tests/compiler/c0/direct_function_parameter.c" \
              -o "$work/direct-function.i"
          "$minic" -S "$work/direct-function.i" -o "$work/direct-function.s"
          grep -F 'apply:' "$work/direct-function.s" >/dev/null
          grep -F 'jalr' "$work/direct-function.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/direct_function_parameter declarator=function-adjusted-to-pointer'
          EOF
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/direct_function_parameter.c
          git diff --check
      - name: Validate Werror focused and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-direct-function-parameter
          MINIC="$GITHUB_WORKSPACE/build/product-direct-function-parameter/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/product-direct-function-parameter" sh tests/compiler/c0/run-function-parameter-adjustment.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-direct-function-parameter-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-direct-function-parameter-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: adjust direct function parameters to pointers'
          git push origin HEAD:product/direct-function-parameter-v1
