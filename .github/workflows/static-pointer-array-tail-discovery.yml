name: Static Pointer Array Tail Discovery

on:
  push:
    branches: [agent/static-pointer-array-tail-v1]

permissions:
  contents: write

concurrency:
  group: static-pointer-array-tail-discovery
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize product slice
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-static-pointer-array-tail.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

      - name: Build and focused validation
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/static-pointer-array-tail
          MINIC="$GITHUB_WORKSPACE/build/static-pointer-array-tail/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-pointer-array-tail-focused" \
            sh tests/compiler/c0/run-static-pointer-arrays.sh

      - name: Write product changes back
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if git diff --cached --quiet; then
            echo 'product already materialized'
            exit 0
          fi
          git commit -m 'feat(frontend): converge static pointer-array suffix semantics'
          git push origin HEAD:agent/static-pointer-array-tail-v1
