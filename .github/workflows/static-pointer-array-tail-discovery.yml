name: Static Pointer Array Tail Discovery

on:
  push:
    branches: [agent/static-pointer-array-tail-v1]

concurrency:
  group: static-pointer-array-tail-discovery
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build, focused validation, and cached full-TU trace
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/frontend/ast_verifier.c')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} trace anchor not found')
              text = text.replace(old, new, 1)

          replace_once(
              '''    for (index = 0U; index < program->enum_count; ++index) {\n''',
              '''    fprintf(stderr, "VERIFY_PHASE enums\\n");\n    for (index = 0U; index < program->enum_count; ++index) {\n''',
              'enum phase')
          replace_once(
              '''    for (index = 0U; index < program->enumerator_count; ++index) {\n''',
              '''    fprintf(stderr, "VERIFY_PHASE enumerators\\n");\n    for (index = 0U; index < program->enumerator_count; ++index) {\n''',
              'enumerator phase')
          replace_once(
              '''    for (index = 0U; index < program->array_type_count; ++index) {\n        const MinicArrayType *array_type;\n\n        array_type = &program->array_types[index];\n        if ((array_type->element_count == 0U &&\n             !incomplete_array_has_semantic_owner(program, index)) ||''',
              '''    fprintf(stderr, "VERIFY_PHASE arrays count=%zu\\n", program->array_type_count);\n    for (index = 0U; index < program->array_type_count; ++index) {\n        const MinicArrayType *array_type;\n        const MinicRecord *element_record;\n        bool owner;\n\n        array_type = &program->array_types[index];\n        owner = array_type->element_count != 0U || incomplete_array_has_semantic_owner(program, index);\n        element_record = minic_type_is_record(array_type->element_type)\n                             ? minic_c0_program_record(program, array_type->element_type.record_id)\n                             : NULL;\n        fprintf(stderr,\n                "VERIFY_ARRAY index=%zu count=%zu owner=%d element_kind=%d record_id=%zu record=%s function=%d\\n",\n                index, array_type->element_count, owner ? 1 : 0,\n                (int)array_type->element_type.base_kind,\n                element_record == NULL ? SIZE_MAX : array_type->element_type.record_id,\n                element_record == NULL ? "-" : element_record->name,\n                minic_type_is_function(array_type->element_type) ? 1 : 0);\n        if ((array_type->element_count == 0U && !owner) ||''',
              'array phase')
          replace_once(
              '''    for (index = 0U; index < program->function_type_count; ++index) {\n''',
              '''    fprintf(stderr, "VERIFY_PHASE function-types\\n");\n    for (index = 0U; index < program->function_type_count; ++index) {\n''',
              'function-type phase')
          replace_once(
              '''    for (index = 0U; index < program->record_count; ++index) {\n''',
              '''    fprintf(stderr, "VERIFY_PHASE records\\n");\n    for (index = 0U; index < program->record_count; ++index) {\n''',
              'record phase')
          replace_once(
              '''    for (index = 0U; index < program->local_count; ++index) {\n''',
              '''    fprintf(stderr, "VERIFY_PHASE locals\\n");\n    for (index = 0U; index < program->local_count; ++index) {\n''',
              'local phase')
          replace_once(
              '''    for (index = 0U; index < program->function_count; ++index) {\n        const MinicFunction *function;\n''',
              '''    fprintf(stderr, "VERIFY_PHASE functions\\n");\n    for (index = 0U; index < program->function_count; ++index) {\n        const MinicFunction *function;\n''',
              'function phase')
          replace_once(
              '''    for (index = 0U; index < program->type_alias_count; ++index) {\n''',
              '''    fprintf(stderr, "VERIFY_PHASE aliases\\n");\n    for (index = 0U; index < program->type_alias_count; ++index) {\n''',
              'alias phase')
          replace_once(
              '''        object = &program->global_objects[index];\n        if (object->name == NULL || !type_is_valid(program, object->type) ||''',
              '''        object = &program->global_objects[index];\n        fprintf(stderr,\n                "VERIFY_OBJECT index=%zu name=%s kind=%d array=%d extern=%d zero=%d tentative=%d init=%zu reloc=%zu\\n",\n                index,\n                object->name == NULL ? "<null>" : object->name,\n                (int)object->type.base_kind,\n                minic_type_is_array(object->type) ? 1 : 0,\n                object->is_extern ? 1 : 0,\n                object->is_zero_initialized ? 1 : 0,\n                object->is_tentative ? 1 : 0,\n                object->initializer_count,\n                object->relocation_count);\n        if (object->name == NULL || !type_is_valid(program, object->type) ||''',
              'object phase')
          replace_once(
              '''    for (index = 0U; index < program->global_object_count; ++index) {\n        const MinicGlobalObject *object;\n\n        object = &program->global_objects[index];\n        fprintf(stderr,''',
              '''    fprintf(stderr, "VERIFY_PHASE globals\\n");\n    for (index = 0U; index < program->global_object_count; ++index) {\n        const MinicGlobalObject *object;\n\n        object = &program->global_objects[index];\n        fprintf(stderr,''',
              'global phase')
          path.write_text(text)
          PY
          make -j4 MODE=release BUILD_DIR=build/static-pointer-array-tail
          minic="$GITHUB_WORKSPACE/build/static-pointer-array-tail/bin/minic"
          MINIC="$minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-pointer-array-tail-focused" \
            sh tests/compiler/c0/run-static-pointer-arrays.sh
          mkdir -p build/linux-artifact
          gh run download 31689171683 -n linux-frontier-31689171683 -D build/linux-artifact
          test -s build/linux-artifact/kbuild/init/main.i
          set +e
          "$minic" -S build/linux-artifact/kbuild/init/main.i -o build/linux-artifact/main.s \
            >build/linux-artifact/minic.stdout 2>build/linux-artifact/minic.stderr
          status=$?
          set -e
          echo "cached_tu_status=$status"
          grep '^VERIFY_' build/linux-artifact/minic.stderr | tail -n 60 || true
          tail -n 10 build/linux-artifact/minic.stderr
          test "$status" -ne 0
