name: Static Pointer Array Tail Discovery

on:
  push:
    branches: [agent/static-pointer-array-tail-v1]

concurrency:
  group: static-pointer-array-tail-discovery
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and focused validation
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/static-pointer-array-tail
          minic="$GITHUB_WORKSPACE/build/static-pointer-array-tail/bin/minic"
          MINIC="$minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-pointer-array-tail-focused" \
            sh tests/compiler/c0/run-static-pointer-arrays.sh
          mkdir -p build/fnptr-array-repro
          cat > build/fnptr-array-repro/repro.c <<'EOF'
          typedef int (*fn_t)(void);
          extern fn_t start[];
          static fn_t *levels[] = { start };
          int main(void) { return levels != (fn_t **)0; }
          EOF
          cc -E -P -x c build/fnptr-array-repro/repro.c -o build/fnptr-array-repro/repro.i
          "$minic" -S build/fnptr-array-repro/repro.i -o build/fnptr-array-repro/repro.s
          cat build/fnptr-array-repro/repro.s
