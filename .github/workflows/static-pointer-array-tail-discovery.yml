name: Static Pointer Array Tail Discovery

on:
  push:
    branches: [agent/static-pointer-array-tail-v1]

concurrency:
  group: static-pointer-array-tail-discovery
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize, validate, and compile cached Linux TU
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-tail-ownership.py
          python3 tools/dev/materialize-subxlen-aggregate.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          make -j4 MODE=release BUILD_DIR=build/static-pointer-array-tail
          minic="$GITHUB_WORKSPACE/build/static-pointer-array-tail/bin/minic"

          cat > build/parameter-array-adjustment.c <<'EOF'
          struct vfsmount;
          void unmounts(struct vfsmount *mnt[], unsigned int num) {(void)mnt; (void)num;}
          int matrix_sum(int matrix[][4]) { return matrix[0][0]; }
          EOF
          "$minic" -S build/parameter-array-adjustment.c -o build/parameter-array-adjustment.s
          echo 'PASS parameter-array-adjustment record-pointer=[] multidim-inner=[4] verifier=clean'

          cat > build/zero-size-static.c <<'EOF'
          struct empty {};
          int zero_size_static(void) {
              static struct empty implicit;
              static struct empty explicit = {};
              return sizeof(implicit) + sizeof(explicit);
          }
          EOF
          "$minic" -S build/zero-size-static.c -o build/zero-size-static.s
          size0=$(grep -c '^\.size __minic_static_local_.*,[[:space:]]*0$' build/zero-size-static.s || true)
          test "$size0" -eq 2
          echo 'PASS zero-size-static record=gnu implicit+explicit size0=2'

          cat > build/subxlen-aggregate.c <<'EOF'
          struct kuid { unsigned int val; };
          static unsigned int unwrap(struct kuid uid) { return uid.val; }
          static struct kuid forward(struct kuid uid) { return uid; }
          int subxlen_test(void) {
              struct kuid value = { 7 };
              return unwrap(forward(value)) != 7;
          }
          EOF
          "$minic" -S build/subxlen-aggregate.c -o build/subxlen-aggregate.s
          grep -F 'sw a0' build/subxlen-aggregate.s >/dev/null
          echo 'PASS subxlen-aggregate size=4 chunks=1 parameter+return=1'

          MINIC="$minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-pointer-array-tail-focused" \
            sh tests/compiler/c0/run-static-pointer-arrays.sh

          mkdir -p build/linux-artifact
          gh run download 31689171683 -n linux-frontier-31689171683 -D build/linux-artifact
          test -s build/linux-artifact/kbuild/init/main.i
          set +e
          "$minic" -S build/linux-artifact/kbuild/init/main.i -o build/linux-artifact/main.s \
            >build/linux-artifact/minic.stdout 2>build/linux-artifact/minic.stderr
          status=$?
          set -e
          echo "cached_tu_status=$status"
          if test -s build/linux-artifact/minic.stderr; then
            tail -n 40 build/linux-artifact/minic.stderr
          fi
          if test "$status" -eq 0; then
            echo 'FULL_TU_PASS lines=90928'
            test -s build/linux-artifact/main.s
          fi
