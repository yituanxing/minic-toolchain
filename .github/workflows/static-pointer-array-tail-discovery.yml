name: Static Pointer Array Tail Discovery

on:
  push:
    branches: [agent/static-pointer-array-tail-v1]

concurrency:
  group: static-pointer-array-tail-discovery
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize, validate, and compile cached Linux TU
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-tail-ownership.py
          set +e
          python3 tools/dev/materialize-subxlen-aggregate.py 2>build-subxlen.err
          materialize_status=$?
          set -e
          if test "$materialize_status" -ne 0; then
            grep -Fx 'unexpected aggregate call staging anchor' build-subxlen.err >/dev/null
          fi
          python3 tools/dev/materialize-subxlen-aggregate-finish.py
          python3 tools/dev/fix-subxlen-materialization.py
          python3 tools/dev/materialize-aggregate-rvalue-arg.py
          python3 tools/dev/materialize-inline-asm-symbolic-immediate.py
          python3 tools/dev/materialize-inline-asm-rj-z.py
          python3 tools/dev/fix-inline-asm-rj-materialization.py
          python3 tools/dev/materialize-inline-asm-rk.py
          python3 tools/dev/materialize-codegen-span-trace.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          make -j4 MODE=release BUILD_DIR=build/static-pointer-array-tail
          minic="$GITHUB_WORKSPACE/build/static-pointer-array-tail/bin/minic"

          cat > build/parameter-array-adjustment.c <<'EOF'
          struct vfsmount;
          void unmounts(struct vfsmount *mnt[], unsigned int num) {(void)mnt; (void)num;}
          int matrix_sum(int matrix[][4]) { return matrix[0][0]; }
          EOF
          "$minic" -S build/parameter-array-adjustment.c -o build/parameter-array-adjustment.s
          echo 'PASS parameter-array-adjustment record-pointer=[] multidim-inner=[4] verifier=clean'

          cat > build/zero-size-static.c <<'EOF'
          struct empty {};
          int zero_size_static(void) {
              static struct empty implicit;
              static struct empty explicit = {};
              return sizeof(implicit) + sizeof(explicit);
          }
          EOF
          "$minic" -S build/zero-size-static.c -o build/zero-size-static.s
          size0=$(grep -c '^\.size __minic_static_local_.*,[[:space:]]*0$' build/zero-size-static.s || true)
          test "$size0" -eq 2
          echo 'PASS zero-size-static record=gnu implicit+explicit size0=2'

          cat > build/subxlen-aggregate.c <<'EOF'
          struct kuid { unsigned int val; };
          static unsigned int unwrap(struct kuid uid) { return uid.val; }
          static struct kuid forward(struct kuid uid) { return uid; }
          int subxlen_test(void) {
              struct kuid value = { 7 };
              return unwrap(forward(value)) != 7;
          }
          EOF
          "$minic" -S build/subxlen-aggregate.c -o build/subxlen-aggregate.s
          grep -F 'sw a0' build/subxlen-aggregate.s >/dev/null
          echo 'PASS subxlen-aggregate size=4 chunks=1 parameter+return+call-rvalue=1'

          cat > build/inline-asm-symbolic-immediate.c <<'EOF'
          static int target(void) { return 0; }
          int symbolic_immediate(void) {
              __asm__ __volatile__(
                  ".pushsection .minic_sym,\"aw\"\n\t"
                  ".word %0 - .\n\t"
                  ".word %1 - .\n\t"
                  ".half %2\n\t"
                  ".popsection"
                  :
                  : "i" ("source.c"), "i" (target), "i" (17));
              return 0;
          }
          EOF
          "$minic" -S build/inline-asm-symbolic-immediate.c -o build/inline-asm-symbolic-immediate.s
          grep -E '\.word \.Lminic_string_[0-9]+ - \.' build/inline-asm-symbolic-immediate.s >/dev/null
          grep -F '.word target - .' build/inline-asm-symbolic-immediate.s >/dev/null
          grep -F '.half 17' build/inline-asm-symbolic-immediate.s >/dev/null
          if grep -F '__minic_deferred_asm_immediate' build/inline-asm-symbolic-immediate.s >/dev/null; then
            echo 'FAIL symbolic immediate leaked deferred symbol' >&2
            exit 1
          fi
          echo 'PASS inline-asm-symbolic-immediate string+function+integer=resolved'

          cat > build/inline-asm-rj-z.c <<'EOF'
          int atomic_shape(int *p, int old, int new_value) {
              int result;
              unsigned int rc;
              __asm__ __volatile__(
                  "lr.w %0, %2\n\t"
                  "bne %0, %z3, 1f\n\t"
                  "sc.w.rl %1, %z4, %2\n\t"
                  "1:"
                  : "=&r" (result), "=&r" (rc), "+A" (*p)
                  : "rJ" ((long)old), "rJ" (new_value)
                  : "memory");
              __asm__ __volatile__("beq zero, %z0, 1f\n\t1:" : : "rJ" (0));
              return result;
          }
          EOF
          "$minic" -S build/inline-asm-rj-z.c -o build/inline-asm-rj-z.s
          grep -E 'bne [^,]+, t[0-6], 1f' build/inline-asm-rj-z.s >/dev/null
          grep -E 'sc\.w\.rl [^,]+, t[0-6],' build/inline-asm-rj-z.s >/dev/null
          grep -F 'beq zero, zero, 1f' build/inline-asm-rj-z.s >/dev/null
          echo 'PASS inline-asm-rJ modifier=%z runtime=register zero=zero-register'

          cat > build/inline-asm-rk.c <<'EOF'
          void csr_shape(unsigned long runtime_value) {
              __asm__ __volatile__("csrs 0x100, %0" : : "rK" (2UL) : "memory");
              __asm__ __volatile__("csrs 0x100, %0" : : "rK" (runtime_value) : "memory");
          }
          EOF
          "$minic" -S build/inline-asm-rk.c -o build/inline-asm-rk.s
          grep -F 'csrs 0x100, 2' build/inline-asm-rk.s >/dev/null
          grep -E 'csrs 0x100, t[0-6]' build/inline-asm-rk.s >/dev/null
          echo 'PASS inline-asm-rK csr-u5=immediate runtime=register'

          MINIC="$minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-pointer-array-tail-focused" \
            sh tests/compiler/c0/run-static-pointer-arrays.sh

          mkdir -p build/linux-artifact
          gh run download 31689171683 -n linux-frontier-31689171683 -D build/linux-artifact
          test -s build/linux-artifact/kbuild/init/main.i
          echo 'INLINE_ASM_ALT_CONSTRAINTS'
          grep -o '"r[A-Z]"' build/linux-artifact/kbuild/init/main.i | sort | uniq -c || true
          set +e
          "$minic" -S build/linux-artifact/kbuild/init/main.i -o build/linux-artifact/main.s \
            >build/linux-artifact/minic.stdout 2>build/linux-artifact/minic.stderr
          status=$?
          set -e
          echo "cached_tu_status=$status"
          if test -s build/linux-artifact/minic.stderr; then
            tail -n 40 build/linux-artifact/minic.stderr
            fail_line=$(sed -n 's/.*CODEGEN_FAIL statement .* kind=4 line=\([0-9][0-9]*\).*/\1/p' build/linux-artifact/minic.stderr | head -n 1)
            if test -n "$fail_line"; then
              start=$((fail_line > 6 ? fail_line - 6 : 1))
              end=$((fail_line + 6))
              echo "CODEGEN_SOURCE lines=${start}-${end}"
              nl -ba build/linux-artifact/kbuild/init/main.i | sed -n "${start},${end}p"
            fi
          fi
          if test "$status" -eq 0; then
            echo 'FULL_TU_PASS lines=90928'
            test -s build/linux-artifact/main.s
          fi
