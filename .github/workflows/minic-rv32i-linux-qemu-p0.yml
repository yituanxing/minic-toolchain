name: MiniC RV32I Linux immutable Image QEMU P0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/minic-rv32i-linux-qemu-p0.yml
      - tools/ci/linux-rv32i-qemu-p0-v1.sh
  workflow_dispatch:

# This runtime gate must never recompile Linux or rerun the seven producer
# shards. It downloads the exact 1741/1741 MiniC Image that passed the
# original GNU Kbuild ELF32 link, and binds the bytes with a fixed SHA.
jobs:
  rv32i-linux-qemu-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact seven-shard MiniC ELF32 Linux Image
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: '40189397298'
          name: linux-rv32i-seven-shard-Image-1e24841d0d64e608da145ed0b4980185fe155bcf
          github-token: ${{ github.token }}
          path: build/rv32i-qemu-p0/source-artifact

      - name: Require immutable Image SHA from certified 1741-object GNU link
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t images < <(find build/rv32i-qemu-p0/source-artifact -type f -path '*/arch/riscv/boot/Image' -print)
          if [[ "${#images[@]}" != 1 ]]; then
            echo "RV32I_QEMU_IMAGE=FAIL expected_one_Image found=${#images[@]}" >&2
            exit 1
          fi
          expected=c2e52427e6bc861216d0389e1d408d845b5606e2f67a8e23a805c11d29bfaf58
          actual=$(sha256sum "${images[0]}" | cut -d' ' -f1)
          test "$actual" = "$expected" || {
            echo "RV32I_QEMU_IMAGE=FAIL expected=$expected actual=$actual" >&2
            exit 1
          }
          printf 'RV32I_QEMU_IMAGE=PASS SHA=%s producer_run=40189397298 original_Kbuild=true MiniC_C=1741/1741\n' "$actual"
          printf 'RV32I_QEMU_IMAGE=%s\n' "$GITHUB_WORKSPACE/${images[0]}" >>"$GITHUB_ENV"

      - name: Install RV32 system QEMU and native GNU assembler
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          # Runner mirror may stall on the qemu-system-misc package; keep the
          # same bounded official-archive routing as the established receiver.
          for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]] && grep -q 'azure.archive.ubuntu.com' "$sources"; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$sources"
            fi
          done
          timeout 100s sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 update -qq
          timeout 480s sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends \
              qemu-system-misc opensbi binutils-riscv64-linux-gnu \
              gcc-riscv64-linux-gnu cpio device-tree-compiler
          command -v qemu-system-riscv32
          command -v riscv64-linux-gnu-as
          echo 'RV32I_QEMU_DEPS=PASS qemu=system-riscv32 firmware=OpenSBI as=GNU'

      - name: Identify pinned GNU RV32 image cache without compiling Linux
        id: golden
        shell: bash
        run: |
          set -Eeuo pipefail
          cfg=4c6c19f79741a8a31ec52ad57b1a6bc56b81dd6996cbf5e1bdc63f587d85244c
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          as=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -c1-16)
          echo "key=linux-gnu-golden-rv32i-v1-6.6.143-$cfg-$gcc-$ld-$as" >>"$GITHUB_OUTPUT"
      - name: Restore exact original GNU ELF32 Image control from existing cache
        id: original
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv32i-linux-entry/out
            build/rv32i-linux-entry/provenance
          key: ${{ steps.golden.outputs.key }}
      - name: Execute original GNU RV32 control through identical QEMU/PID1 script
        if: steps.original.outputs.cache-hit == 'true'
        shell: bash
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          golden="$GITHUB_WORKSPACE/build/rv32i-linux-entry"
          test -s "$golden/out/arch/riscv/boot/Image"
          grep -Fxq 'elf_class=ELF32' "$golden/provenance/gcc-baseline.txt"
          grep -Fxq 'isa=rv32i' "$golden/provenance/gcc-baseline.txt"
          grep -Fxq 'abi=ilp32' "$golden/provenance/gcc-baseline.txt"
          expected=$(sed -n 's/^image_sha256=//p' "$golden/provenance/gcc-baseline.txt")
          test "$(sha256sum "$golden/out/arch/riscv/boot/Image" | cut -d' ' -f1)" = "$expected"
          set +e
          RV32I_QEMU_IMAGE="$golden/out/arch/riscv/boot/Image" \
            RV32I_QEMU_WORK="$GITHUB_WORKSPACE/build/rv32i-qemu-p0/gnu-control" \
            bash tools/ci/linux-rv32i-qemu-p0-v1.sh \
            >"$GITHUB_WORKSPACE/build/rv32i-qemu-p0/gnu-control-step.log" 2>&1
          status=$?
          set -e
          echo "RV32I_GNU_CONTROL=EXECUTED result=$status image_sha256=$expected same_original_Kconfig=true same_QEMU=true"
          grep -E 'Linux version|Kernel panic|Oops:|RV32I_LINUX_PID1=' \
            "$GITHUB_WORKSPACE/build/rv32i-qemu-p0/gnu-control/qemu-serial.log" || true
          tail -n 35 "$GITHUB_WORKSPACE/build/rv32i-qemu-p0/gnu-control-step.log"
      - name: Report missing exact GNU control distinctly
        if: steps.original.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo 'RV32I_GNU_CONTROL=BLOCKED exact_cache_miss; no_recompile=true'

      - name: Restore exact MiniC scheduler object shards without recompilation
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: '40189397298'
          pattern: shard-*
          github-token: ${{ github.token }}
          path: build/rv32i-qemu-p0/attested-shards
          merge-multiple: false

      - name: Audit MiniC scheduler, fork and memory code and stack prologues
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence=build/rv32i-qemu-p0/frame-audit
          mkdir -p "$evidence"
          owners=(kernel/sched/core.o kernel/sched/fair.o
                  kernel/sched/idle.o kernel/sched/rt.o
                  kernel/fork.o init/main.o mm/page_alloc.o)
          audited=0
          for owner in "${owners[@]}"; do
            if ! grep -Fxq "$owner" build/rv32i-linux-entry/provenance/full-c-objects.txt; then
              echo "RV32I_FRAME_OWNER=EXCLUDED_BY_ORIGINAL_KCONFIG owner=$owner"
              continue
            fi
            audited=$((audited+1))
            mapfile -t objects < <(find build/rv32i-qemu-p0/attested-shards \
              -type f -path "*/minic/$owner" -print)
            if [[ "${#objects[@]}" == 0 ]]; then
              echo "RV32I_FRAME_OWNER=NOT_IN_KCONFIG owner=$owner"
              continue
            fi
            if [[ "${#objects[@]}" != 1 ]]; then
              echo "RV32I_FRAME_AUDIT=FAIL owner=$owner matches=${#objects[@]}" >&2
              exit 2
            fi
            object=${objects[0]}
            name=${owner//\//_}
            riscv64-linux-gnu-objdump -d "$object" >"$evidence/$name.disasm.txt"
            riscv64-linux-gnu-nm -S --size-sort "$object" >"$evidence/$name.symbols.txt"
            echo "RV32I_FRAME_OWNER=ATTESTED owner=$owner sha256=$(sha256sum "$object" | cut -d' ' -f1)"
            echo "RV32I_FRAME_TOP owner=$owner"
            tail -n 7 "$evidence/$name.symbols.txt"
            if [[ "$owner" == kernel/sched/core.o ]]; then
              sed -n '/<__schedule>:/,+25p' "$evidence/$name.disasm.txt"
              sed -n '/<schedule_debug>:/,+25p' "$evidence/$name.disasm.txt"
            fi
          done
          echo "RV32I_FRAME_AUDIT=PASS requested=${#owners[@]} present_at_least=2 missing_skipped=true no_compile=true source_run=40189397298"

      - name: Boot unmodified RV32I Linux Image into genuine ELF32 PID1
        if: always()
        shell: bash
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          RV32I_QEMU_WORK="$GITHUB_WORKSPACE/build/rv32i-qemu-p0/boot" \
            bash tools/ci/linux-rv32i-qemu-p0-v1.sh

      # The immutable MiniC Image fails with stack-end corruption.  Once the
      # original GNU Image passes under the same QEMU/PID1 contract, actually
      # relink and boot all seven 249-object-ish cohorts against GNU C owners.
      # This reuses certified artifacts and never reruns seven producer builds.
      - name: Restore pinned Linux source for cached seven-cohort fault isolation
        if: failure() && steps.original.outputs.cache-hit == 'true'
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Download all seven immutable RV32 MiniC object cohorts
        if: failure() && steps.original.outputs.cache-hit == 'true'
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: '40189397298'
          pattern: shard-*
          merge-multiple: false
          github-token: ${{ github.token }}
          path: build/rv32i-qemu-p0/shards

      - name: Relink and QEMU-boot all seven GNU/MiniC cohorts in one job
        if: failure() && steps.original.outputs.cache-hit == 'true'
        shell: bash
        timeout-minutes: 33
        run: |
          set -Eeuo pipefail
          RV32I_TRIAGE_ROOT="$GITHUB_WORKSPACE/build/rv32i-qemu-p0" \
          RV32I_TRIAGE_SOURCE="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143" \
          RV32I_TRIAGE_GOLDEN="$GITHUB_WORKSPACE/build/rv32i-linux-entry" \
            bash tools/ci/linux-rv32i-qemu-batch-isolate-v1.sh

      - name: Preserve exact Image, ELF32 init and serial boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32i-linux-qemu-p0-${{ github.sha }}
          path: |
            build/rv32i-qemu-p0/boot/provenance.txt
            build/rv32i-qemu-p0/boot/init-elf.txt
            build/rv32i-qemu-p0/boot/qemu-serial.log
            build/rv32i-qemu-p0/boot/initramfs.cpio.gz
            build/rv32i-qemu-p0/boot/virt-dumpdtb.log
            build/rv32i-qemu-p0/boot/virt-rv32-large-image.dtb
            build/rv32i-qemu-p0/boot/qemu-uart-serial.log
            build/rv32i-qemu-p0/boot/qemu-debug.log
            build/rv32i-qemu-p0/gnu-control-step.log
            build/rv32i-qemu-p0/gnu-control/qemu-serial.log
            build/rv32i-qemu-p0/gnu-control/qemu-debug.log
            build/rv32i-qemu-p0/cohort-results.tsv
            build/rv32i-qemu-p0/gnu-prepare.log
            build/rv32i-qemu-p0/gnu-reconcile.log
            build/rv32i-qemu-p0/runtime-build.log
            build/rv32i-qemu-p0/trials/*/link.log
            build/rv32i-qemu-p0/trials/*/qemu-step.log
            build/rv32i-qemu-p0/trials/*/qemu/qemu-serial.log
            build/rv32i-qemu-p0/frame-audit/*.symbols.txt
            build/rv32i-qemu-p0/frame-audit/*.disasm.txt
          if-no-files-found: warn
          retention-days: 7
