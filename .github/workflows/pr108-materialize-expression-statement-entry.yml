name: PR108 Materialize Expression Statement Entry
on:
  push:
    branches: [agent/shared-expression-statement-entry-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/shared-expression-statement-entry-v0, fetch-depth: 0}
      - name: Materialize shared expression entry predicate
        run: python3 tools/dev/pr108-materialize-shared-expression-statement-entry.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused-expression-entry" HOST_CC=cc sh tests/compiler/c0/run-expression-statement-entry.sh
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused-prefix-update" HOST_CC=cc sh tests/compiler/c0/run-prefix-update-expression.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr108-materialize-expression-statement-entry.yml tools/dev/pr108-materialize-shared-expression-statement-entry.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: share expression statement entry tokens'
          git push origin HEAD:agent/shared-expression-statement-entry-v0
