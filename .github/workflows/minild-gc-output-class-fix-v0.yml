name: MiniLD GC Output Class Fix V0

on:
  push:
    branches:
      - "agent/minild-gc-output-class-v0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minild-gc-output-class-fix-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Apply stable RX output-class grouping
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("linker/src/linker.c")
          text = path.read_text()
          marker = "static bool minild_gc_name_has_prefix"
          helper = r'''
          /*
           * GNU's default linker script groups executable input sections into
           * the text output region before read-only data.  The GC frontier
           * reconstructs original input-section identity, so preserving one
           * global input order across both code and rodata can incorrectly put
           * megabytes of live rodata between two direct R_RISCV_JAL sites.
           * Stable-partition the default non-script layout into output classes:
           * executable RX first, non-executable RX second, then everything
           * else.  Relative order inside each class remains the recovered input
           * order, so the earlier GC input-order contract is preserved.
           */
          static int minild_gc_default_output_class(const MiniLdSection *section) {
              if ((section->flags & SHF_ALLOC) != 0U &&
                  (section->flags & SHF_WRITE) == 0U) {
                  return (section->flags & SHF_EXECINSTR) != 0U ? 0 : 1;
              }
              return 2;
          }

          static bool minild_gc_group_default_output_classes(MiniLdState *state) {
              const size_t count = state->section_count;
              MiniLdSection *ordered_sections = NULL;
              size_t *remap = NULL;
              size_t index_capacity = 64U;
              size_t target;
              size_t next = 0U;
              size_t executable_rx = 0U;
              size_t readonly_rx = 0U;
              size_t i;
              int output_class;
              bool installed = false;
              bool ok = false;

              ordered_sections =
                  malloc((count == 0U ? 1U : count) * sizeof(*ordered_sections));
              remap = malloc((count == 0U ? 1U : count) * sizeof(*remap));
              if (ordered_sections == NULL || remap == NULL) {
                  fprintf(state->diagnostics,
                          "minic-ld: out-of-memory:gc-output-classes\n");
                  goto done;
              }

              for (output_class = 0; output_class < 3; ++output_class) {
                  for (i = 0U; i < count; ++i) {
                      if (minild_gc_default_output_class(&state->sections[i]) !=
                          output_class) {
                          continue;
                      }
                      ordered_sections[next] = state->sections[i];
                      remap[i] = next;
                      if (output_class == 0) {
                          ++executable_rx;
                      } else if (output_class == 1) {
                          ++readonly_rx;
                      }
                      ++next;
                  }
              }
              if (next != count) {
                  fprintf(state->diagnostics,
                          "minic-ld: gc-output-class-count-mismatch\n");
                  goto done;
              }

              for (i = 0U; i < state->symbol_count; ++i) {
                  MiniLdSymbol *symbol = &state->symbols[i];

                  if (symbol->section < 0) {
                      continue;
                  }
                  if ((size_t)symbol->section >= count) {
                      fprintf(state->diagnostics,
                              "minic-ld: gc-output-class-symbol-remap\n");
                      goto done;
                  }
                  symbol->section = (int)remap[symbol->section];
              }
              for (i = 0U; i < state->reloc_count; ++i) {
                  if (state->relocs[i].section >= count) {
                      fprintf(state->diagnostics,
                              "minic-ld: gc-output-class-reloc-remap\n");
                      goto done;
                  }
                  state->relocs[i].section = remap[state->relocs[i].section];
              }

              free(state->sections);
              state->sections = ordered_sections;
              state->section_capacity = count;
              ordered_sections = NULL;
              installed = true;

              if (count > (SIZE_MAX - 1U) / 2U) {
                  fprintf(state->diagnostics,
                          "minic-ld: gc-output-class-index-overflow\n");
                  goto done;
              }
              target = count * 2U + 1U;
              while (index_capacity < target) {
                  if (index_capacity > SIZE_MAX / 2U) {
                      fprintf(state->diagnostics,
                              "minic-ld: gc-output-class-index-overflow\n");
                      goto done;
                  }
                  index_capacity *= 2U;
              }
              if (!rebuild_section_index(state, index_capacity)) {
                  fprintf(state->diagnostics,
                          "minic-ld: out-of-memory:gc-output-class-index\n");
                  goto done;
              }
              fprintf(state->diagnostics,
                      "minic-ld: gc-output-classes:exec-rx=%zu:ro-rx=%zu\n",
                      executable_rx,
                      readonly_rx);
              ok = true;

          done:
              if (!installed) {
                  free(ordered_sections);
              }
              free(remap);
              return ok;
          }

          '''

          if "minild_gc_group_default_output_classes" not in text:
              if marker not in text:
                  raise SystemExit("missing output-class insertion marker")
              text = text.replace(marker, helper + marker, 1)

          old = """        !static_allocate_common(&state) ||\n        !minild_gc_prune_static(&state, entry_symbol) ||\n        !static_build_got(&state, &got) ||"""
          new = """        !static_allocate_common(&state) ||\n        !minild_gc_prune_static(&state, entry_symbol) ||\n        !minild_gc_group_default_output_classes(&state) ||\n        !static_build_got(&state, &got) ||"""
          if new not in text:
              if old not in text:
                  raise SystemExit("missing output-class call-site marker")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Build and run focused GC gates
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/minild-gc-output-class-fix-v0"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" all

          BUILD_DIR="$build" \
          MINILD="$build/bin/minic-ld" \
          RISCV_AS=riscv64-linux-gnu-as \
          RISCV_LD=riscv64-linux-gnu-ld \
          QEMU_RISCV64=qemu-riscv64 \
            bash tests/linker/run-gc-output-class-v0.sh

          BUILD_DIR="$build" \
          MINIC="$build/bin/minic" \
          MINIAS="$build/bin/minic-as" \
          MINILD="$build/bin/minic-ld" \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/linker/run-gc-v0.sh

          BUILD_DIR="$build" \
          MINILD="$build/bin/minic-ld" \
          RISCV_AS=riscv64-linux-gnu-as \
          QEMU_RISCV64=qemu-riscv64 \
            bash tests/linker/run-gc-input-order-v0.sh

      - name: Commit proven product change
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- linker/src/linker.c; then
            echo "MINILD_GC_OUTPUT_CLASS_PRODUCT=ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linker/src/linker.c
          git commit -m "linker: group GC default output classes"
          git push origin HEAD:agent/minild-gc-output-class-v0
          echo "MINILD_GC_OUTPUT_CLASS_PRODUCT=COMMITTED"
