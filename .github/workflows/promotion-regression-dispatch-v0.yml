name: Promotion Regression Dispatch V0

on:
  push:
    branches:
      - "agent/promotion-regression-dispatch-v0"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact-head promotion regressions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_REF: external/busybox-full-toolchain-v0
        shell: bash
        run: |
          set -Eeuo pipefail
          workflows=(
            toolchain-regression-ledger-v0.yml
            sqlite-full-driver-v0.yml
            lua-full-driver-v0.yml
            tinycc-full-driver-v0.yml
          )
          for workflow in "${workflows[@]}"; do
            echo "dispatching $workflow at $TARGET_REF"
            curl --fail-with-body -sS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$workflow/dispatches" \
              -d "{\"ref\":\"$TARGET_REF\"}"
          done
          echo "PROMOTION_REGRESSION_DISPATCH_V0=PASS ref=$TARGET_REF count=${#workflows[@]}"
