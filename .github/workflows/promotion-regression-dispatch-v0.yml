name: Promotion Regression Dispatch V0

on:
  push:
    branches:
      - "agent/promotion-regression-dispatch-v0"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch TinyCC PR519 c14
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_REF: agent/bisect-519-c14-v0
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/tinycc-full-driver-v0.yml/dispatches" \
            -d "{\"ref\":\"$TARGET_REF\"}"
          echo "TINYCC_PR519_C14_DISPATCH=PASS"
