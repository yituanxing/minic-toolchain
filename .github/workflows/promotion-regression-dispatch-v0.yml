name: Promotion Regression Dispatch V0

on:
  push:
    branches:
      - "agent/promotion-regression-dispatch-v0"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch TinyCC PR519 quartiles
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          refs=(agent/bisect-519-c5-v0 agent/bisect-519-c15-v0)
          for ref in "${refs[@]}"; do
            curl --fail-with-body -sS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/tinycc-full-driver-v0.yml/dispatches" \
              -d "{\"ref\":\"$ref\"}"
          done
          echo "TINYCC_PR519_QUARTILES_DISPATCH=PASS"
