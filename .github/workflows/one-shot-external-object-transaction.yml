name: One-shot External Object Transaction Wiring

on:
  push:
    branches:
      - refactor/declaration-sema-v1

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Route external object redeclaration through Declaration Sema
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/frontend/parser_global.c")
          text = path.read_text()
          start_marker = "static bool merge_extern_object_declaration("
          end_marker = "bool minic_parser_declare_block_scope_extern_object("
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("external object merge anchors are not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''static bool merge_extern_object_declaration(MinicParser *parser,
                                                    MinicGlobalObjectId object_id,
                                                    MinicType declared_type,
                                                    const char *section_name,
                                                    size_t section_name_length,
                                                    bool has_section,
                                                    size_t explicit_alignment,
                                                    MinicSymbolVisibility visibility,
                                                    bool has_visibility) {
              MinicDeclarationExternalObjectAttributes attributes;
              MinicDeclarationExternalObjectMergeStatus status;

              if (parser == NULL || parser->program == NULL) {
                  return false;
              }
              attributes.section_name = section_name;
              attributes.section_name_length = section_name_length;
              attributes.explicit_alignment = explicit_alignment;
              attributes.visibility = visibility;
              attributes.has_section = has_section;
              attributes.has_visibility = has_visibility;
              status = minic_declaration_merge_external_object(
                  parser->program, object_id, declared_type, &attributes);
              switch (status) {
              case MINIC_DECLARATION_EXTERNAL_OBJECT_MERGE_OK:
                  return true;
              case MINIC_DECLARATION_EXTERNAL_OBJECT_MERGE_TYPE_CONFLICT:
                  minic_parser_error(parser, "conflicting extern object redeclaration");
                  return false;
              case MINIC_DECLARATION_EXTERNAL_OBJECT_MERGE_ATTRIBUTE_CONFLICT:
                  minic_parser_error(parser, "conflicting extern object redeclaration attributes");
                  return false;
              case MINIC_DECLARATION_EXTERNAL_OBJECT_MERGE_INVALID:
                  minic_parser_error(parser, "invalid extern object redeclaration");
                  return false;
              case MINIC_DECLARATION_EXTERNAL_OBJECT_MERGE_COMMIT_FAILED:
              default:
                  minic_parser_error(parser, "cannot commit extern object redeclaration");
                  return false;
              }
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          clang-format -i \
            src/frontend/declaration_sema.h \
            src/frontend/parser_global.c \
            tests/frontend/declaration_sema_test.c
          rm .github/workflows/one-shot-external-object-transaction.yml
          git diff --check
          git diff -- src/frontend/declaration_sema.h src/frontend/parser_global.c tests/frontend/declaration_sema_test.c
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "frontend: commit external object redeclarations through sema"
          git push origin HEAD:refactor/declaration-sema-v1
