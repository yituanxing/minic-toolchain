          print('\n'.join(body[:24]))
          print('DEBUG_SPIN_PROLOGUE_END')
          PY
      - name: Unwind reverse call chain and frame sizes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('build/linux-runtime-spinlock-stack-v0/spinlock_debug.s')
          lines=p.read_text(errors='replace').splitlines()
          funcs={}
          order=[]
          cur=None
          for line in lines:
              m=re.match(r'^\.type\s+([^,]+),\s*@function', line.strip())
              if m:
                  cur=m.group(1); funcs.setdefault(cur,[]); order.append(cur); continue
              if cur is not None:
                  funcs[cur].append(line)
                  if line.strip().startswith('.size '+cur+','):
                      cur=None
          calls={f:[] for f in funcs}
          frame={}
          restores={}
          for f,b in funcs.items():
              for line in b:
                  m=re.search(r'\bcall\s+([^\s#]+)', line)
                  if m: calls[f].append(m.group(1))
              neg=[]; pos=[]
              for line in b:
                  m=re.search(r'\baddi\s+sp,\s*sp,\s*(-?\d+)', line)
                  if m:
                      v=int(m.group(1)); (neg if v<0 else pos).append(v)
              frame[f]=-neg[0] if neg else 0
              restores[f]=pos[-1] if pos else 0
          rev={}
          for caller, tgts in calls.items():
              for t in tgts: rev.setdefault(t,[]).append(caller)
          target='__minic_inline_spec_720_39'
          out=[]
          seen=set()
          frontier=[(target,0)]
          while frontier:
              f,d=frontier.pop(0)
              if (f,d) in seen or d>12: continue
              seen.add((f,d))
              cs=sorted(set(rev.get(f,[])))
              out.append(f'DEPTH={d} FUNC={f} FRAME={frame.get(f,"?")} RESTORE={restores.get(f,"?")} CALLERS={";".join(cs) if cs else "<none-in-TU>"}')
              for c in cs: frontier.append((c,d+1))
          out.append('--- CHAIN FUNCTION STACK MUTATIONS ---')
          chain={x.split(' FUNC=')[1].split(' FRAME=')[0] for x in out if ' FUNC=' in x}
          for f in order:
              if f not in chain: continue
              out.append(f'## {f}')
              for line in funcs[f]:
                  s=line.strip()
                  if re.search(r'\b(addi\s+sp,\s*sp|call\s+|ret\b)', s): out.append(s)
          text='\n'.join(out)+'\n'
          Path('build/linux-runtime-spinlock-stack-v0/call-chain.txt').write_text(text)
          print(text)
          PY
      - name: Preserve small evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-spinlock-stack-v0-${{ github.sha }}
          path: |
            build/linux-runtime-spinlock-stack-v0/profile/patch.log
