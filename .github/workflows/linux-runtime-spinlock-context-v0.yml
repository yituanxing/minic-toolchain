name: Linux Runtime Spinlock Context V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-spinlock-context-v0.yml"
      - "tools/ci/runtime-spinlock-trigger.txt"
      - "tools/ci/runtime-spinlock-stack-trigger.txt"
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select historical focused runtime probe; all runs independent jobs'
        required: true
        type: choice
        default: 'context'
        options:
          - 'context'
          - 'codegen'
          - 'first-context'
          - 'stack'
          - 'all'

permissions:
  contents: read

concurrency:
  group: linux-runtime-spinlock-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spinlock-context:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'context' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-spinlock-context]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-context-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-spinlock-context-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Instrument recursion context without printk
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-context-v0"
          python3 - "$src/kernel/locking/spinlock_debug.c" "$ev/spinlock_debug.context.c" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          evidence = Path(sys.argv[2])
          text = path.read_text()

          old_before = '''static inline void
          debug_spin_lock_before(raw_spinlock_t *lock)
          {
          \tSPIN_BUG_ON(READ_ONCE(lock->magic) != SPINLOCK_MAGIC, lock, "bad magic");
          \tSPIN_BUG_ON(READ_ONCE(lock->owner) == current, lock, "recursion");
          \tSPIN_BUG_ON(READ_ONCE(lock->owner_cpu) == raw_smp_processor_id(),
          \t\t\t\t\t\t\tlock, "cpu recursion");
          }
          '''
          new_before = '''static volatile unsigned long minic_spin_diag_lock_value;
          static volatile unsigned long minic_spin_diag_caller_value;
          static volatile unsigned long minic_spin_diag_current_value;

          static noinline void minic_spin_diag_bad_magic(void)
          {
          \tfor (;;)
          \t\tcpu_relax();
          }

          static noinline void minic_spin_diag_recursion(raw_spinlock_t *lock,
          \t\t\t\t\t\t unsigned long caller, void *cur)
          {
          \tminic_spin_diag_lock_value = (unsigned long)lock;
          \tminic_spin_diag_caller_value = caller;
          \tminic_spin_diag_current_value = (unsigned long)cur;
          \tfor (;;) {
          \t\tcpu_relax();
          \t\tcpu_relax();
          \t}
          }

          static noinline void minic_spin_diag_cpu_recursion(void)
          {
          \tfor (;;) {
          \t\tcpu_relax();
          \t\tcpu_relax();
          \t\tcpu_relax();
          \t}
          }

          static inline void
          debug_spin_lock_before(raw_spinlock_t *lock, unsigned long caller)
          {
          \tif (unlikely(READ_ONCE(lock->magic) != SPINLOCK_MAGIC))
          \t\tminic_spin_diag_bad_magic();
          \tif (unlikely(READ_ONCE(lock->owner) == current))
          \t\tminic_spin_diag_recursion(lock, caller, current);
          \tif (unlikely(READ_ONCE(lock->owner_cpu) == raw_smp_processor_id()))
          \t\tminic_spin_diag_cpu_recursion();
          }
          '''
          if text.count(old_before) != 1:
              raise SystemExit(f"expected one debug_spin_lock_before block, found {text.count(old_before)}")
          text = text.replace(old_before, new_before)

          old_lock = '''void do_raw_spin_lock(raw_spinlock_t *lock)
          {
          \tdebug_spin_lock_before(lock);
          \tarch_spin_lock(&lock->raw_lock);
          \tmmiowb_spin_lock();
          \tdebug_spin_lock_after(lock);
          }
          '''
          new_lock = '''void do_raw_spin_lock(raw_spinlock_t *lock)
          {
          \tunsigned long minic_caller = (unsigned long)__builtin_return_address(0);
          \tdebug_spin_lock_before(lock, minic_caller);
          \tarch_spin_lock(&lock->raw_lock);
          \tmmiowb_spin_lock();
          \tdebug_spin_lock_after(lock);
          }
          '''
          if text.count(old_lock) != 1:
              raise SystemExit(f"expected one do_raw_spin_lock block, found {text.count(old_lock)}")
          text = text.replace(old_lock, new_lock)

          path.write_text(text)
          evidence.write_text(text)
          print("SPINLOCK_CONTEXT_INSTRUMENT=APPLIED")
          PY
          grep -F 'minic_spin_diag_recursion(raw_spinlock_t *lock' "$src/kernel/locking/spinlock_debug.c"
          grep -F '__builtin_return_address(0)' "$src/kernel/locking/spinlock_debug.c"

      - name: Refresh runtime owners with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-context-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-spinlock-context-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock_debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build_utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build_policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/rcu/rcu_segcblist.o rcu-segcblist-refresh.log
          refresh_obj init/main.o init-main-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log

          riscv64-linux-gnu-nm -an "$out/kernel/locking/spinlock_debug.o" >"$ev/spinlock_debug.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/locking/spinlock_debug.o" >"$ev/spinlock_debug.objdump.txt"
          cp "$out/kernel/locking/spinlock_debug.minic-stage2.s" "$ev/spinlock_debug.minic-stage2.s"
          grep -n -E 'minic_spin_diag_(lock_value|caller_value|current_value|recursion)|debug_spin_lock_before|do_raw_spin_lock' "$ev/spinlock_debug.nm.txt" "$ev/spinlock_debug.objdump.txt" >"$ev/spinlock_context.symbols.txt" || true
          cat "$ev/spinlock_context.symbols.txt" || true

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-context-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"
          grep -E 'minic_spin_diag_(recursion|lock_value|caller_value|current_value)' "$ev/early/nm.txt" | tee "$ev/linked-context-symbols.txt"

      - name: Capture first recursion lock and caller with GDB
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-context-v0"
          qemu_log="$ev/qemu.console.log"
          qemu_debug="$ev/qemu.debug.log"
          gdb_cmd="$ev/capture.gdb"
          gdb_out="$ev/gdb-context.txt"

          cat >"$gdb_cmd" <<GDB
          set pagination off
          set confirm off
          file $ev/early/vmlinux.early
          target remote 127.0.0.1:1234
          hbreak minic_spin_diag_recursion
          continue
          printf "SPIN_CONTEXT_HIT=PASS\\n"
          printf "LOCK=0x%lx\\n", \$a0
          printf "CALLER=0x%lx\\n", \$a1
          printf "CURRENT=0x%lx\\n", \$a2
          info symbol \$a0
          info symbol \$a1
          info symbol \$a2
          x/8gx \$a0
          x/12i \$a1-24
          detach
          quit
          GDB

          qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/early/Image.early" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -S -gdb tcp:127.0.0.1:1234 -d int -D "$qemu_debug" \
            >"$qemu_log" 2>&1 &
          qpid=$!
          cleanup() {
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1

          set +e
          timeout 30s gdb-multiarch -q -batch -x "$gdb_cmd" >"$gdb_out" 2>&1
          grc=$?
          set -e
          cat "$gdb_out"
          grep -F 'SPIN_CONTEXT_HIT=PASS' "$gdb_out"
          grep -E '^LOCK=0x[0-9a-fA-F]+$' "$gdb_out"
          grep -E '^CALLER=0x[0-9a-fA-F]+$' "$gdb_out"
          grep -E '^CURRENT=0x[0-9a-fA-F]+$' "$gdb_out"
          echo "GDB_RC=$grc"
          test "$grc" -eq 0

      - name: Resolve captured context against linked symbols
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-context-v0"
          python3 - "$ev/gdb-context.txt" "$ev/early/nm.txt" "$ev/resolved-context.txt" <<'PY'
          from bisect import bisect_right
          from pathlib import Path
          import re, sys

          gdb = Path(sys.argv[1]).read_text(errors='replace')
          nm_lines = Path(sys.argv[2]).read_text(errors='replace').splitlines()
          out = Path(sys.argv[3])

          vals = {}
          for key in ('LOCK', 'CALLER', 'CURRENT'):
              m = re.search(rf'^{key}=(0x[0-9a-fA-F]+)$', gdb, re.M)
              if not m:
                  raise SystemExit(f'missing {key}')
              vals[key] = int(m.group(1), 16)

          syms = []
          for line in nm_lines:
              parts = line.split(None, 2)
              if len(parts) != 3:
                  continue
              try:
                  addr = int(parts[0], 16)
              except ValueError:
                  continue
              syms.append((addr, parts[2]))
          syms.sort()
          addrs = [x[0] for x in syms]

          def resolve(value):
              i = bisect_right(addrs, value) - 1
              if i < 0:
                  return 'none'
              addr, name = syms[i]
              return f'{name}+0x{value-addr:x} @0x{addr:x}'

          lines = []
          for key in ('LOCK', 'CALLER', 'CURRENT'):
              lines.append(f'{key}=0x{vals[key]:x}')
              lines.append(f'{key}_NEAREST={resolve(vals[key])}')
          out.write_text('\n'.join(lines) + '\n')
          print(out.read_text(), end='')
          PY

      - name: Preserve spinlock context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-spinlock-context-v0-${{ github.sha }}
          path: |
            build/linux-runtime-spinlock-context-v0/profile/patch.log
            build/linux-runtime-spinlock-context-v0/spinlock_debug.context.c
            build/linux-runtime-spinlock-context-v0/*-refresh.log
            build/linux-runtime-spinlock-context-v0/spinlock_debug.nm.txt
            build/linux-runtime-spinlock-context-v0/spinlock_debug.objdump.txt
            build/linux-runtime-spinlock-context-v0/spinlock_debug.minic-stage2.s
            build/linux-runtime-spinlock-context-v0/spinlock_context.symbols.txt
            build/linux-runtime-spinlock-context-v0/linked-context-symbols.txt
            build/linux-runtime-spinlock-context-v0/early/nm.txt
            build/linux-runtime-spinlock-context-v0/early/vmlinux.early.map
            build/linux-runtime-spinlock-context-v0/gdb-context.txt
            build/linux-runtime-spinlock-context-v0/resolved-context.txt
            build/linux-runtime-spinlock-context-v0/qemu.console.log
            build/linux-runtime-spinlock-context-v0/qemu.debug.log
          if-no-files-found: warn
          retention-days: 7

  # Retained exact specialized job from linux-runtime-spinlock-codegen-v0.yml.
  spinlock-codegen:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'codegen' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-spinlock-codegen]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Install RISC-V build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-codegen-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-spinlock-codegen-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Compile spinlock_debug with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-codegen-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-spinlock-codegen-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=kernel/locking/spinlock_debug.o
          base=kernel/locking/spinlock_debug
          rm -f "$out/$target" "$out/kernel/locking/.spinlock_debug.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/minic-build.log" 2>&1
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.s"
          cp "$out/$target" "$ev/spinlock_debug.minic.o"
          cp "$out/$base.minic-stage2.s" "$ev/spinlock_debug.minic-stage2.s"
          cp "$out/$base.minic-stage2.i" "$ev/spinlock_debug.minic-stage2.i"
          riscv64-linux-gnu-nm -an "$out/$target" >"$ev/spinlock_debug.minic.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/$target" >"$ev/spinlock_debug.minic.objdump.txt"
          riscv64-linux-gnu-objdump -dr --disassemble=arch_spin_lock "$out/$target" >"$ev/arch_spin_lock.minic.objdump.txt"
          riscv64-linux-gnu-objdump -dr --disassemble=do_raw_spin_lock "$out/$target" >"$ev/do_raw_spin_lock.minic.objdump.txt"
          echo 'MINIC_SPINLOCK_DEBUG=PASS'
          cat "$ev/arch_spin_lock.minic.objdump.txt"
          cat "$ev/do_raw_spin_lock.minic.objdump.txt"

      - name: Compile spinlock_debug with GCC reference
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-codegen-v0"
          target=kernel/locking/spinlock_debug.o
          rm -f "$out/$target" "$out/kernel/locking/.spinlock_debug.o.cmd"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC=/usr/bin/riscv64-linux-gnu-gcc -j2 V=1 "$target" >"$ev/gcc-build.log" 2>&1
          test -s "$out/$target"
          cp "$out/$target" "$ev/spinlock_debug.gcc.o"
          riscv64-linux-gnu-nm -an "$out/$target" >"$ev/spinlock_debug.gcc.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/$target" >"$ev/spinlock_debug.gcc.objdump.txt"
          riscv64-linux-gnu-objdump -dr --disassemble=arch_spin_lock "$out/$target" >"$ev/arch_spin_lock.gcc.objdump.txt"
          riscv64-linux-gnu-objdump -dr --disassemble=do_raw_spin_lock "$out/$target" >"$ev/do_raw_spin_lock.gcc.objdump.txt"
          echo 'GCC_SPINLOCK_DEBUG=PASS'
          cat "$ev/arch_spin_lock.gcc.objdump.txt"
          cat "$ev/do_raw_spin_lock.gcc.objdump.txt"

      - name: Compare focused disassembly
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-codegen-v0"
          diff -u "$ev/arch_spin_lock.gcc.objdump.txt" "$ev/arch_spin_lock.minic.objdump.txt" >"$ev/arch_spin_lock.diff.txt" || true
          diff -u "$ev/do_raw_spin_lock.gcc.objdump.txt" "$ev/do_raw_spin_lock.minic.objdump.txt" >"$ev/do_raw_spin_lock.diff.txt" || true
          echo '=== arch_spin_lock diff ==='
          cat "$ev/arch_spin_lock.diff.txt" || true
          echo '=== do_raw_spin_lock diff ==='
          cat "$ev/do_raw_spin_lock.diff.txt" || true

      - name: Preserve spinlock codegen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-spinlock-codegen-v0-${{ github.sha }}
          path: |
            build/linux-runtime-spinlock-codegen-v0/profile/patch.log
            build/linux-runtime-spinlock-codegen-v0/minic-build.log
            build/linux-runtime-spinlock-codegen-v0/gcc-build.log
