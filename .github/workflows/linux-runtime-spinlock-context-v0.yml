          python3 - "$ev/watch/qemu.trace.log" "$ev/early/nm.txt" "$ev/first-target.json" "$ev/first-target.txt" <<'PY'
          import bisect
          import json
          import re
          import sys
          from collections import deque
          from pathlib import Path

          trace = Path(sys.argv[1])
          nm = Path(sys.argv[2])
          jout = Path(sys.argv[3])
          tout = Path(sys.argv[4])
          pc_re = re.compile(r"0x([0-9a-fA-F]+):")
          targets = {"spin_bug", "minic_spin_diag_bad_magic", "minic_spin_diag_recursion", "minic_spin_diag_cpu_recursion"}

          syms = []
          by_name = {}
          for line in nm.read_text(errors="replace").splitlines():
              p = line.split()
              if len(p) < 3:
                  continue
              try:
                  a = int(p[0], 16)
              except ValueError:
                  continue
              syms.append((a, p[2]))
              by_name.setdefault(p[2], a)
          syms.sort()
          addrs = [a for a, _ in syms]
          anchor = by_name.get("_start") or by_name.get("_text") or by_name.get("_stext")
          phys = 0x80200000
          delta = anchor - phys if anchor is not None and anchor > phys else None
          floor = phys + delta if delta is not None else None

          def resolve(pc):
              lookup = pc
              relocated = False
              if delta is not None and pc >= phys and pc < floor:
                  lookup = pc + delta
                  relocated = True
              i = bisect.bisect_right(addrs, lookup) - 1
              if i < 0:
                  return {"pc": pc, "lookup": lookup, "relocated": relocated, "symbol": "?", "offset": 0}
              base, name = syms[i]
              return {"pc": pc, "lookup": lookup, "relocated": relocated, "symbol": name, "offset": lookup - base}

          history = deque(maxlen=160)
          raw_history = deque(maxlen=320)
          last_symbol = None
          found = None
          if trace.exists():
              with trace.open("r", errors="replace") as f:
                  for line in f:
                      m = pc_re.search(line)
                      if not m:
                          continue
                      e = resolve(int(m.group(1), 16))
                      raw_history.append(e)
                      if e["symbol"] in targets:
                          found = {"target": e, "context": list(history), "raw_context": list(raw_history)}
                          break
                      if e["symbol"] != last_symbol:
                          history.append(e)
                          last_symbol = e["symbol"]

          if found is None:
              result = {"found": False, "context": list(history), "raw_context": list(raw_history)}
              text = "FIRST_TARGET=none\n"
          else:
              result = {"found": True, **found}
              names = [e["symbol"] for e in found["context"]]
              target = found["target"]
              text = (
                  f"FIRST_TARGET={target['symbol']}+0x{target['offset']:x}\n"
                  f"FIRST_TARGET_PC=0x{target['pc']:x}\n"
                  f"FIRST_TARGET_CONTEXT={' -> '.join(names[-40:])}\n"
              )
          jout.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          tout.write_text(text)
          print(text, end="")
          PY

      - name: Preserve first-context evidence
        if: always()
