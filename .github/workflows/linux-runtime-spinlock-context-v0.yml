          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          evidence = Path(sys.argv[2])
          text = path.read_text()
          old = '''static inline void
          debug_spin_lock_before(raw_spinlock_t *lock)
          {
          \tSPIN_BUG_ON(READ_ONCE(lock->magic) != SPINLOCK_MAGIC, lock, "bad magic");
          \tSPIN_BUG_ON(READ_ONCE(lock->owner) == current, lock, "recursion");
          \tSPIN_BUG_ON(READ_ONCE(lock->owner_cpu) == raw_smp_processor_id(),
          \t\t\t\t\t\t\tlock, "cpu recursion");
          }
          '''
          new = '''static noinline void minic_spin_diag_bad_magic(void)
          {
          \tfor (;;)
          \t\tcpu_relax();
          }

          static noinline void minic_spin_diag_recursion(void)
          {
          \tfor (;;) {
          \t\tcpu_relax();
          \t\tcpu_relax();
          \t}
          }

          static noinline void minic_spin_diag_cpu_recursion(void)
          {
          \tfor (;;) {
          \t\tcpu_relax();
          \t\tcpu_relax();
          \t\tcpu_relax();
          \t}
          }

          static inline void
          debug_spin_lock_before(raw_spinlock_t *lock)
          {
          \tif (unlikely(READ_ONCE(lock->magic) != SPINLOCK_MAGIC))
          \t\tminic_spin_diag_bad_magic();
          \tif (unlikely(READ_ONCE(lock->owner) == current))
          \t\tminic_spin_diag_recursion();
          \tif (unlikely(READ_ONCE(lock->owner_cpu) == raw_smp_processor_id()))
          \t\tminic_spin_diag_cpu_recursion();
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one debug_spin_lock_before block, found {text.count(old)}")
          text = text.replace(old, new)
          path.write_text(text)
          evidence.write_text(text)
          print("SPINLOCK_FIRST_CONTEXT_INSTRUMENT=APPLIED")
          PY
          grep -F 'minic_spin_diag_bad_magic' "$src/kernel/locking/spinlock_debug.c"
          grep -F 'minic_spin_diag_recursion' "$src/kernel/locking/spinlock_debug.c"
          grep -F 'minic_spin_diag_cpu_recursion' "$src/kernel/locking/spinlock_debug.c"

