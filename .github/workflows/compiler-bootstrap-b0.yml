name: Compiler Bootstrap B0

on:
  push:
    branches:
      - refactor/declaration-sema-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-b0:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bootstrap-b0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install RV64 runtime toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user \
            ca-certificates make file

      - name: Build host stage0 MiniC
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/bootstrap-b0-stage0

      - name: Compile MiniC sources with stage0
        shell: bash
        run: |
          set -Eeuo pipefail
          stage0="$GITHUB_WORKSPACE/build/bootstrap-b0-stage0/bin/minic"
          work="$GITHUB_WORKSPACE/build/bootstrap-b0"
          mkdir -p "$work/i" "$work/s"

          sources="
          src/compiler/compiler.c
          src/core/core_ir.c
          src/core/core_lower.c
          src/core/core_lower_types.c
          src/core/core_lower_metadata.c
          src/core/core_lower_asm.c
          src/frontend/attribute.c
          src/frontend/ast.c
          src/frontend/expression_semantics.c
          src/frontend/ast_traversal.c
          src/frontend/function_body.c
          src/frontend/initializer.c
          src/frontend/ast_verifier.c
          src/frontend/cast_normalization.c
          src/frontend/const_eval.c
          src/frontend/declaration_sema.c
          src/frontend/ast_function.c
          src/frontend/ast_global.c
          src/frontend/lexer.c
          src/frontend/parser_constant.c
          src/frontend/parser_attribute.c
          src/frontend/parser_declarator.c
          src/frontend/parser_enum.c
          src/frontend/parser_core.c
          src/frontend/parser_expression.c
          src/frontend/parser_function.c
          src/frontend/parser_global.c
          src/frontend/parser_member.c
          src/frontend/parser_postfix.c
          src/frontend/parser_record.c
          src/frontend/parser_static_assert.c
          src/frontend/parser_statement.c
          src/frontend/parser_string.c
          src/frontend/parser_type.c
          src/frontend/parser_type_query.c
          src/frontend/parser_typedef.c
          src/frontend/token.c
          src/frontend/type.c
          src/target/data_layout.c
          src/target/target_info.c
          src/target/riscv64/abi.c
          src/target/riscv64/layout.c
          src/target/riscv64/codegen_support.c
          src/target/riscv64/core_codegen.c
          src/target/riscv64/codegen_function.c
          tools/minic/main.c
          "

          total=46
          passed=0
          objects=""
          for source in $sources; do
            key=$(printf '%s' "$source" | tr '/.' '__')
            pre="$work/i/$key.i"
            asm="$work/s/$key.s"

            riscv64-linux-gnu-gcc -E -P -std=c11 -Iinclude -Isrc "$source" -o "$pre"
            set +e
            CORE_FAST_TRACE=1 "$stage0" -S "$pre" -o "$asm" \
              >"$work/$key.stdout" 2>"$work/$key.stderr"
            status=$?
            set -e
            if test "$status" -ne 0; then
              line=$(sed -n "s/.*$key\.i:\([0-9][0-9]*\):.*/\1/p" "$work/$key.stderr" | head -n1)
              test -n "$line" || line=1
              echo "BOOTSTRAP_B0_BLOCKER source=$source passed=$passed total=$total status=$status line=$line" >&2
              start=$((line > 15 ? line - 15 : 1))
              end=$((line + 15))
              nl -ba "$pre" | sed -n "${start},${end}p" >&2
              sed -n '1,160p' "$work/$key.stderr" >&2
              exit "$status"
            fi
            passed=$((passed + 1))
            echo "PASS bootstrap-b0-tu source=$source completed=$passed/$total"
            objects="$objects $asm"
          done

          echo "$objects" >"$work/stage1-asm-list.txt"
          echo "BOOTSTRAP_B0_COMPILE=PASS selected=$total pass=$passed head=$GITHUB_SHA"

      - name: Link RV64 stage1 MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/bootstrap-b0"
          asm_inputs=$(cat "$work/stage1-asm-list.txt")
          riscv64-linux-gnu-gcc -static $asm_inputs -o "$work/minic-stage1-rv64"
          file "$work/minic-stage1-rv64"
          echo "BOOTSTRAP_B0_STAGE1_LINK=PASS head=$GITHUB_SHA"

      - name: Execute stage1 compiler smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/bootstrap-b0"
          riscv64-linux-gnu-gcc -E -P -x c tests/compiler/c0/return_42.c -o "$work/return_42.i"
          qemu-riscv64 "$work/minic-stage1-rv64" -S "$work/return_42.i" -o "$work/return_42.stage1.s"
          riscv64-linux-gnu-gcc -static "$work/return_42.stage1.s" -o "$work/return_42.stage1.elf"
          set +e
          qemu-riscv64 "$work/return_42.stage1.elf"
          status=$?
          set -e
          test "$status" -eq 42
          echo "BOOTSTRAP_B0_STAGE1_EXEC=PASS return_42=$status head=$GITHUB_SHA"

      - name: Recompile MiniC with stage1 and compare fixed point
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/bootstrap-b0"
          stage1="$work/minic-stage1-rv64"
          mkdir -p "$work/s2"

          compile_one() {
            stage0_asm="$1"
            key=$(basename "$stage0_asm" .s)
            pre="$work/i/$key.i"
            stage1_asm="$work/s2/$key.s"
            qemu-riscv64 "$stage1" -S "$pre" -o "$stage1_asm"
          }
          export -f compile_one
          export work stage1

          # Stage1 runs under QEMU and is much slower than the native stage0.
          # Compile independent translation units concurrently, then compare
          # deterministically in the original stage0 list order.
          tr ' ' '\n' <"$work/stage1-asm-list.txt" | sed '/^$/d' |
            xargs -n1 -P4 bash -c 'compile_one "$1"' _

          passed=0
          total=46
          stage2_inputs=""
          for stage0_asm in $(cat "$work/stage1-asm-list.txt"); do
            key=$(basename "$stage0_asm" .s)
            stage1_asm="$work/s2/$key.s"
            if ! cmp -s "$stage0_asm" "$stage1_asm"; then
              echo "BOOTSTRAP_B0_FIXED_POINT_MISMATCH key=$key completed=$passed total=$total" >&2
              diff -u "$stage0_asm" "$stage1_asm" | sed -n '1,200p' >&2 || true
              exit 1
            fi
            passed=$((passed + 1))
            stage2_inputs="$stage2_inputs $stage1_asm"
            echo "PASS bootstrap-b0-fixed-point key=$key completed=$passed/$total"
          done

          echo "$stage2_inputs" >"$work/stage2-asm-list.txt"
          echo "BOOTSTRAP_B0_STAGE1_RECOMPILE=PASS selected=$total pass=$passed head=$GITHUB_SHA"
          echo "BOOTSTRAP_B0_FIXED_POINT_ASM=PASS selected=$total pass=$passed head=$GITHUB_SHA"

      - name: Link RV64 stage2 MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/bootstrap-b0"
          asm_inputs=$(cat "$work/stage2-asm-list.txt")
          riscv64-linux-gnu-gcc -static $asm_inputs -o "$work/minic-stage2-rv64"
          file "$work/minic-stage2-rv64"
          sha256sum "$work/minic-stage1-rv64" "$work/minic-stage2-rv64"
          echo "BOOTSTRAP_B0_STAGE2_LINK=PASS head=$GITHUB_SHA"

      - name: Execute stage2 compiler smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/bootstrap-b0"
          qemu-riscv64 "$work/minic-stage2-rv64" -S "$work/return_42.i" -o "$work/return_42.stage2.s"
          cmp "$work/return_42.stage1.s" "$work/return_42.stage2.s"
          riscv64-linux-gnu-gcc -static "$work/return_42.stage2.s" -o "$work/return_42.stage2.elf"
          set +e
          qemu-riscv64 "$work/return_42.stage2.elf"
          status=$?
          set -e
          test "$status" -eq 42
          echo "BOOTSTRAP_B0_STAGE2_EXEC=PASS return_42=$status head=$GITHUB_SHA"

      - name: Preserve bootstrap blocker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-b0-blocker
          path: |
            build/bootstrap-b0/*.stdout
            build/bootstrap-b0/*.stderr
            build/bootstrap-b0/i/*.i
            build/bootstrap-b0/s/*.s
            build/bootstrap-b0/s2/*.s
            build/bootstrap-b0/stage1-asm-list.txt
            build/bootstrap-b0/stage2-asm-list.txt
            build/bootstrap-b0/minic-stage1-rv64
            build/bootstrap-b0/minic-stage2-rv64
          if-no-files-found: ignore
          retention-days: 1
