name: Agent RV64 zero-size record copies

on:
  push:
    branches:
      - agent/rv64-zero-size-record-copy-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build baseline MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-zero-record-baseline

      - name: Prove baseline rejects Linux-shaped zero-size record copy
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-zero-record-baseline/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          struct pin_cookie { };
          struct rq_flags { unsigned long flags; struct pin_cookie cookie; unsigned int clock_update_flags; };
          void pin(struct rq_flags *rf) {
              rf->cookie = ({ struct pin_cookie cookie = { }; cookie; });
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          if build/agent-zero-record-baseline/bin/minic -S "$work/repro.i" -o "$work/repro.s" \
              >"$work/stdout" 2>"$work/stderr"; then
              echo 'baseline unexpectedly accepted zero-size record copy' >&2
              exit 1
          fi
          grep -F 'cannot write RISC-V assembly' "$work/stderr" >/dev/null

      - name: Apply bounded zero-size record copy patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent-rv64-zero-size-record-copy.py
          clang-format-18 -i src/target/riscv64/codegen_expression.c tests/compiler/c0/gnu_empty_records.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Build patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-zero-record-patched

      - name: Re-run Linux-shaped reproducer first
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-zero-record-patched/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          struct pin_cookie { };
          struct rq_flags { unsigned long flags; struct pin_cookie cookie; unsigned int clock_update_flags; };
          void pin(struct rq_flags *rf) {
              rf->cookie = ({ struct pin_cookie cookie = { }; cookie; });
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          build/agent-zero-record-patched/bin/minic -S "$work/repro.i" -o "$work/repro.s"
          grep -F '.type pin, @function' "$work/repro.s" >/dev/null
          grep -F '.size pin, .-pin' "$work/repro.s" >/dev/null

      - name: Run focused empty-record contract
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/agent-zero-record-patched/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-zero-record-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-empty-records.sh

      - name: Run fast regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-fast

      - name: Commit product-only result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/zz-agent-rv64-zero-size-record-copy.yml
          rm -f tools/dev/agent-rv64-zero-size-record-copy.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: copy address-backed zero-size records'
          git push origin HEAD:agent/rv64-zero-size-record-copy-v1
