name: Core M126A M125 Baseline Diagnostic

on:
  pull_request:

jobs:
  m125-traps-baseline:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Assert clean M125 semantic source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse ea1192d27780aac21365b812493907d82162841e^{commit})" = ea1192d27780aac21365b812493907d82162841e
          for path in src/compiler/compiler.c src/core/core_ir.c src/core/core_ir.h src/core/core_lower.c src/target/riscv64/core_codegen.c; do
            if ! git diff --quiet ea1192d27780aac21365b812493907d82162841e -- "$path"; then
              echo "semantic source differs from clean M125: $path" >&2
              git diff --stat ea1192d27780aac21365b812493907d82162841e -- "$path"
              exit 1
            fi
          done

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply read-only diagnostics only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m126a-error-diagnostic.py
          git diff --check

      - name: Build M125 diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m126a-m125-baseline-compiler

      - name: Replay traps TU on M125 semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m126a-m125-baseline-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m126a-m125-baseline"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 1 \
            --indices '27'
          status=$?
          set -e
          printf 'M126A_M125_BASELINE_REPLAY_STATUS=%d\n' "$status"
          echo '--- traps stderr ---'
          cat "$work/minic-stderr/arch/riscv/kernel/traps.i.stderr" || true
          echo '--- batch result ---'
          cat "$work/batch-results.json"

      - name: Persist baseline diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m126a-m125-baseline-${{ github.sha }}
          path: |
            build/m126a-m125-baseline/batch-results.json
            build/m126a-m125-baseline/minic-stderr/**
          if-no-files-found: warn
