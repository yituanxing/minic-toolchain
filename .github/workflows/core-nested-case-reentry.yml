name: Core Nested Case Re-entry

on:
  push:
    branches:
      - fix/core-nested-case-reentry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 runtime tools
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross qemu-user

      - name: Build MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/nested-case all

      - name: Run Core switch runtime differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/nested-case/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/nested-case/m27" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-switch-m27.sh

      - name: Run C0 RV64 differential programs
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/nested-case/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/nested-case/programs" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          RISCV_OBJDUMP=riscv64-linux-gnu-objdump \
          QEMU_RISCV64=qemu-riscv64 \
          REQUIRE_RISCV_RUNTIME=1 \
            sh tests/programs/c0/run.sh

      - name: Run host fast regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/nested-case-check check-fast

      - name: Run direct minimal nested-case probe
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >build/nested-case/probe.c <<'EOF'
          int probe(int selector, int enabled)
          {
              int value = 0;
              switch (selector) {
              case 2:
                  if (enabled) {
              case 1:
                      value = 7;
                  }
                  break;
              default:
                  value = 9;
                  break;
              }
              return value;
          }
          int main(void)
          {
              if (probe(1, 0) != 7) return 1;
              if (probe(2, 1) != 7) return 2;
              if (probe(2, 0) != 0) return 3;
              if (probe(9, 1) != 9) return 4;
              return 0;
          }
          EOF
          cc -E -P -std=gnu11 build/nested-case/probe.c -o build/nested-case/probe.i
          build/nested-case/bin/minic -S build/nested-case/probe.i -o build/nested-case/probe.s
          riscv64-linux-gnu-gcc -O0 -static build/nested-case/probe.s -o build/nested-case/probe.elf
          qemu-riscv64 build/nested-case/probe.elf
          echo "NESTED_CASE_FIXED_RUNTIME=PASS"
