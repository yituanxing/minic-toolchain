name: Run long type slice v3

on:
  pull_request:
    paths:
      - '.github/workflows/run-long-type-slice-v3.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
          fetch-depth: 0
      - name: Finalize verified long type slice
        run: bash .github/scripts/finalize-long-type-slice.sh
