name: Productize incomplete array typedef v1

on:
  push:
    branches:
      - frontend/incomplete-array-typedef-v1
    paths:
      - 'tools/dev/materialize-incomplete-array-typedef-v1.py'
      - '.github/scripts/productize-incomplete-array-typedef-v1.sh'
      - '.github/workflows/productize-incomplete-array-typedef-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: productize-incomplete-array-typedef-v1
  cancel-in-progress: true

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout capability branch
        uses: actions/checkout@v4
        with:
          ref: frontend/incomplete-array-typedef-v1
          fetch-depth: 0

      - name: Materialize, validate, and publish incomplete array typedef support
        run: bash .github/scripts/productize-incomplete-array-typedef-v1.sh
