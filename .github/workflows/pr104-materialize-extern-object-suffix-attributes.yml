name: PR104 Materialize Extern Object Suffix Attributes
on:
  push:
    branches: [agent/extern-object-suffix-attributes-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/extern-object-suffix-attributes-v0, fetch-depth: 0}
      - name: Materialize shared object attribute semantics
        run: python3 tools/dev/pr104-materialize-extern-object-suffix-attributes.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused" HOST_CC=cc sh tests/compiler/c0/run-gnu-object-alignment-attribute.sh
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused-section" HOST_CC=cc sh tests/compiler/c0/run-gnu-section-symbol-attribute.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr104-materialize-extern-object-suffix-attributes.yml tools/dev/pr104-materialize-extern-object-suffix-attributes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: share extern object suffix attribute semantics'
          git push origin HEAD:agent/extern-object-suffix-attributes-v0
