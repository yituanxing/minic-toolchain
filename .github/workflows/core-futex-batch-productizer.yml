name: Core Futex5 Productizer

on:
  pull_request:

jobs:
  m116-verifier-probe:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Apply M116 candidate and verifier dump
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 tools/ci/apply-m116-pointer-arith-rvalue.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/core_lower.c')
          s = p.read_text()
          old = '''    if (!minic_core_function_verify(&lowered)) {
        minic_core_function_destroy(&lowered);
        return MINIC_CORE_LOWER_ERROR;
    }
'''
          new = '''    if (!minic_core_function_verify(&lowered)) {
        (void)fprintf(stderr, "CORE_M116_VERIFY_FAIL function=%s blocks=%zu instructions=%zu values=%zu\\n",
                      source_function->name, lowered.block_count,
                      lowered.instruction_count, lowered.value_count);
        (void)minic_core_function_dump(stderr, &lowered);
        minic_core_function_destroy(&lowered);
        return MINIC_CORE_LOWER_ERROR;
    }
'''
          if s.count(old) != 1:
              raise SystemExit(f'verify anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check

      - name: Build probe compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m116-probe-compiler

      - name: Replay ext4 verifier failure
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/m116-probe-compiler/bin/minic" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$GITHUB_WORKSPACE/build/m116-probe" \
            --jobs 1 --indices '435'
          rc=$?
          set -e
          echo "M116_PROBE_RC=$rc"
          cat build/m116-probe/minic-stderr/435.log 2>/dev/null || true
          exit 0
