name: Materialize One Element Record Array V1
on:
  push:
    branches: [staging/string-octal-v1]
    paths:
      - tools/dev/materialize-one-element-record-array-v1.py
      - .github/workflows/materialize-one-element-record-array-v1.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-one-element-record-array-v1.py
          clang-format-18 -i src/frontend/parser_global.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/one-element-record-array
      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Probe unchanged version.i
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          set +e
          MINIC="$GITHUB_WORKSPACE/build/one-element-record-array/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/one-element-version" CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=1 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/one-element-version/batch-summary.txt
          echo "VERSION_PROBE_STATUS=$status"
      - name: Commit product only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-one-element-record-array-v1.py .github/workflows/materialize-one-element-record-array-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_global.c tools/dev/materialize-one-element-record-array-v1.py .github/workflows/materialize-one-element-record-array-v1.yml
          git commit -m 'frontend: distinguish one-element record arrays from scalars'
          git push origin HEAD:staging/string-octal-v1
