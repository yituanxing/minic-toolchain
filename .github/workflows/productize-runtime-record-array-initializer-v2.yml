name: Productize Runtime Record Array Initializer V2
on:
  push:
    branches: [product/runtime-record-array-initializer-v2]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/runtime-record-array-initializer-v2
          fetch-depth: 0
      - name: Apply validated aggregate support
        run: |
          set -Eeuo pipefail
          mat=tools/dev/.productize-runtime-record-array-v2.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-runtime-record-array-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat > tests/compiler/c0/runtime_record_array_initializer.c <<'EOF'
          struct pair { long left; long right; };
          static void fill(long value) {
              struct pair values[2] = {
                  { .left = value, .right = 2 },
                  { .left = 3, .right = value },
              };
              (void)values;
          }
          int main(void) { fill(1); return 0; }
          EOF
          cat > tests/compiler/c0/run-runtime-record-array-initializer.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/runtime-record-array-initializer
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/runtime_record_array_initializer.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-runtime-record-array-initializer.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-runtime-record-array-initializer.sh"
          EOF
          clang-format-18 -i src/frontend/parser_statement.c tests/compiler/c0/runtime_record_array_initializer.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/runtime-record-array-v2
          MINIC="$GITHUB_WORKSPACE/build/runtime-record-array-v2/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/runtime-record-array-v2" \
            sh tests/compiler/c0/run-runtime-record-array-initializer.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/runtime-record-array-v2-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-runtime-record-array-initializer-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_statement.c tests/compiler/c0/runtime_record_array_initializer.c tests/compiler/c0/run-runtime-record-array-initializer.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: initialize runtime arrays of records'
          git push origin HEAD:product/runtime-record-array-initializer-v2
