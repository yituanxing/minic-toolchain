name: Linux Runtime Focused Owner Diagnostics (IRQ / RCU / Init / Timer)

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - "tools/ci/runtime-mm-core-trigger.txt"
      - "tools/ci/runtime-init-irq-trigger.txt"
      - "tools/ci/linux-runtime-rest-init-frontier-v0.json"
      - "tools/ci/runtime-timer-trigger.txt"
      - ".github/workflows/linux-runtime-focused-owners-v1.yml"
      - "tools/ci/select_runtime_focused_owners_v1.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose one Runtime diagnostic owner; all requires explicit opt-in"
        type: choice
        required: true
        default: codegen
        options:
          - codegen
          - irq
          - rcu
          - timer
          - all

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      irq: ${{ steps.owner.outputs.irq }}
      rcu: ${{ steps.owner.outputs.rcu }}
      codegen: ${{ steps.owner.outputs.codegen }}
      timer: ${{ steps.owner.outputs.timer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select Runtime owner without launching unrelated QEMU jobs
        id: owner
        env:
          EVENT_TYPE: ${{ github.event_name }}
          PRIOR: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 tools/ci/select_runtime_focused_owners_v1.py \
            --event "$EVENT_TYPE" --before "$PRIOR" --after "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  init-irq-bridge:
    needs: route
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'irq')) || (github.event_name == 'push' && needs.route.outputs.irq == 'true')
    concurrency:
      group: linux-runtime-mm-core-frontier-v0-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Restore certified frozen linker source subset
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: frozen

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-init-irq-bridge-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-init-irq-bridge-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh certified and current frontier owners with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-init-irq-bridge-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-init-irq-bridge-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
            "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" \
            >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          test -s "$out/$pi_base.minic-stage2.s"
          cp "$out/$pi_base.minic-stage2.s" "$ev/cmdline_early.minic-stage2.s"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$ev/cmdline_early.minic-stage2.s" >/dev/null
          echo 'PI_OWNER_REFRESH=PASS local_string=lla'

          init_target=arch/riscv/mm/init.o
          init_base=arch/riscv/mm/init
          rm -f "$out/$init_target" "$out/arch/riscv/mm/.init.o.cmd" \
            "$out/$init_base.minic-stage2.i" "$out/$init_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 MINIC_LOCAL_FACT_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$init_target" \
            >"$ev/init-refresh.log" 2>&1
          test -s "$out/$init_target"
          riscv64-linux-gnu-objdump -dr "$out/$init_target" >"$ev/init.objdump.txt"
          echo 'SATP_OWNER_REFRESH=PASS target=arch/riscv/mm/init.o'

          setup_target=arch/riscv/kernel/setup.o
          setup_base=arch/riscv/kernel/setup
          rm -f "$out/$setup_target" "$out/arch/riscv/kernel/.setup.o.cmd" \
            "$out/$setup_base.minic-stage2.i" "$out/$setup_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$setup_target" \
            >"$ev/setup-refresh.log" 2>&1
          test -s "$out/$setup_target"
          echo 'SETUP_OWNER_REFRESH=PASS target=arch/riscv/kernel/setup.o'

          sched_target=kernel/sched/core.o
          sched_base=kernel/sched/core
          rm -f "$out/$sched_target" "$out/kernel/sched/.core.o.cmd" \
            "$out/$sched_base.minic-stage2.i" "$out/$sched_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$sched_target" \
            >"$ev/sched-core-refresh.log" 2>&1
          test -s "$out/$sched_target"
          echo 'SCHED_OWNER_REFRESH=PASS target=kernel/sched/core.o'

          irq_target=arch/riscv/kernel/irq.o
          irq_base=arch/riscv/kernel/irq
          rm -f "$out/$irq_target" "$out/arch/riscv/kernel/.irq.o.cmd" \
            "$out/$irq_base.minic-stage2.i" "$out/$irq_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$irq_target" \
            >"$ev/irq-refresh.log" 2>&1
          test -s "$out/$irq_target"
          echo 'IRQ_OWNER_REFRESH=PASS target=arch/riscv/kernel/irq.o'

          # The current runtime frontier is arch_spin_lock+0x16.  The older
          # IRQ-frame focused gate identified kernel/locking/spinlock*.o as
          # the relevant instantiation owners.  Force both through the exact
          # current runtime MiniC profile so no cached pre-pack object can
          # masquerade as a live compiler failure.
          for stem in spinlock spinlock_debug; do
            target="kernel/locking/${stem}.o"
            base="kernel/locking/${stem}"
            rm -f "$out/$target" "$out/kernel/locking/.${stem}.o.cmd" \
              "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/${stem}-refresh.log" 2>&1
            test -s "$out/$target"
            riscv64-linux-gnu-objdump -dr "$out/$target" >"$ev/${stem}.objdump.txt"
            riscv64-linux-gnu-nm -an "$out/$target" >"$ev/${stem}.nm.txt"
            echo "SPINLOCK_OWNER_REFRESH=PASS target=$target"
          done

          {
            echo '=== spinlock.o ==='
            grep -E '[[:space:]]arch_spin_lock$|<arch_spin_lock>:' "$ev/spinlock.nm.txt" "$ev/spinlock.objdump.txt" || true
            echo '=== spinlock_debug.o ==='
            grep -E '[[:space:]]arch_spin_lock$|<arch_spin_lock>:' "$ev/spinlock_debug.nm.txt" "$ev/spinlock_debug.objdump.txt" || true
          } | tee "$ev/spinlock-owner.txt"

      - name: Verify SATP critical CSR window
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('build/linux-runtime-init-irq-bridge-v0/init.objdump.txt')
          text = p.read_text(errors='replace').splitlines()
          start = next(i for i,l in enumerate(text) if '<set_satp_mode>:' in l)
          end = len(text)
          for i in range(start + 1, len(text)):
              m = re.match(r'^([0-9a-f]+) <([^>]+)>:$', text[i].strip())
              if m and not m.group(2).startswith('.L'):
                  end = i
                  break
          body = text[start:end]
          first = next(i for i,l in enumerate(body) if re.search(r'\bcsrw\s+satp\b', l))
          second = next(i for i,l in enumerate(body[first+1:], first+1) if re.search(r'\bcsrrwi?\b.*\bsatp\b', l))
          window = body[first+1:second]
          stack_mem = [l for l in window if re.search(r'\b(?:lb|lbu|lh|lhu|lw|lwu|ld|sb|sh|sw|sd)\b[^\n]*\(sp\)', l)]
          print(f'SATP_INTER_CSR_STACK_MEM={len(stack_mem)}')
          if stack_mem:
              print('\n'.join(stack_mem))
              raise SystemExit(1)
          print('SATP_WINDOW=PASS')
          PY

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-init-irq-bridge-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"

      - name: Execute QEMU current frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-init-irq-bridge-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-init-irq-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-init-irq-bridge-v0-${{ github.sha }}
          path: |
            build/linux-runtime-init-irq-bridge-v0/profile/patch.log
            build/linux-runtime-init-irq-bridge-v0/pi-owner-refresh.log
            build/linux-runtime-init-irq-bridge-v0/init-refresh.log
            build/linux-runtime-init-irq-bridge-v0/setup-refresh.log
            build/linux-runtime-init-irq-bridge-v0/sched-core-refresh.log
            build/linux-runtime-init-irq-bridge-v0/irq-refresh.log
            build/linux-runtime-init-irq-bridge-v0/spinlock-refresh.log
            build/linux-runtime-init-irq-bridge-v0/spinlock_debug-refresh.log
            build/linux-runtime-init-irq-bridge-v0/spinlock.objdump.txt
            build/linux-runtime-init-irq-bridge-v0/spinlock_debug.objdump.txt
            build/linux-runtime-init-irq-bridge-v0/spinlock.nm.txt
            build/linux-runtime-init-irq-bridge-v0/spinlock_debug.nm.txt
            build/linux-runtime-init-irq-bridge-v0/spinlock-owner.txt
            build/linux-runtime-init-irq-bridge-v0/init.objdump.txt
            build/linux-runtime-init-irq-bridge-v0/watch/frontier-result.json
            build/linux-runtime-init-irq-bridge-v0/watch/frontier-summary.txt
            build/linux-runtime-init-irq-bridge-v0/watch/watch-result.json
            build/linux-runtime-init-irq-bridge-v0/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7

  rcu-softirq-owner-frontier:
    needs: route
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'rcu')) || (github.event_name == 'push' && needs.route.outputs.rcu == 'true')
    concurrency:
      group: linux-runtime-rcu-softirq-owner-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified fixtures
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Restore frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-rcu-owner-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -Fx 'apply-riscv64-core-object-slot-reuse-v0.py' "$ev/profile/minic-profile.txt"
          echo 'RUNTIME_OWNER_PROFILE=PASS slot_reuse=current'

      - name: Capture cached kallsyms owner
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          test -s "$out/kernel/kallsyms.o"
          cp "$out/kernel/kallsyms.o" "$ev/kallsyms.before.o"
          riscv64-linux-gnu-objdump -dr "$ev/kallsyms.before.o" >"$ev/kallsyms.before.objdump.txt"
          riscv64-linux-gnu-nm -an "$ev/kallsyms.before.o" >"$ev/kallsyms.before.nm.txt"
          echo 'KALLSYMS_CONFIG_BEGIN'
          grep -E '^CONFIG_KALLSYMS|^# CONFIG_KALLSYMS' "$out/.config" || true
          echo 'KALLSYMS_CONFIG_END'

      - name: Refresh certified runtime owners through kallsyms
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-rcu-owner-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$out/$pi_base.minic-stage2.s" >/dev/null
          echo 'PI_OWNER_REFRESH=PASS local_string=lla'

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock-debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build-utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build-policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log
          refresh_obj kernel/kallsyms.o kallsyms-refresh.log

          cp "$out/kernel/kallsyms.o" "$ev/kallsyms.after.o"
          cp "$out/kernel/kallsyms.minic-stage2.s" "$ev/kallsyms.minic-stage2.s"
          riscv64-linux-gnu-objdump -dr "$ev/kallsyms.after.o" >"$ev/kallsyms.after.objdump.txt"
          riscv64-linux-gnu-nm -an "$ev/kallsyms.after.o" >"$ev/kallsyms.after.nm.txt"

          python3 - "$ev" <<'PY'
          import re, sys
          from pathlib import Path
          ev = Path(sys.argv[1])
          for tag in ('before', 'after'):
              lines=(ev/f'kallsyms.{tag}.objdump.txt').read_text(errors='replace').splitlines()
              start=next((i for i,l in enumerate(lines) if '<get_symbol_pos>:' in l), None)
              print(f'KALLSYMS_{tag.upper()}_FOUND={int(start is not None)}')
              if start is None:
                  continue
              end=next((i for i in range(start+1,len(lines)) if re.match(r'^\s*[0-9a-f]+ <[^>]+>:$', lines[i]) and '<.L' not in lines[i]), min(len(lines),start+320))
              body=lines[start:end]
              print(f'KALLSYMS_{tag.upper()}_GET_SYMBOL_POS_BEGIN')
              print('\n'.join(body))
              print(f'KALLSYMS_{tag.upper()}_GET_SYMBOL_POS_END')
              for line in body:
                  m=re.match(r'^\s*([0-9a-f]+):.*\bebreak\b', line)
                  if m:
                      print(f'KALLSYMS_{tag.upper()}_EBREAK_OFFSET=0x{int(m.group(1),16):x}')
          PY

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"
          echo 'FRONTIER_SYMBOLS_BEGIN'
          grep -E '[[:space:]][Tt][[:space:]]+(console_init|fork_init|arch_call_rest_init|get_symbol_pos)$' "$ev/early/nm.txt" || true
          echo 'FRONTIER_SYMBOLS_END'

      - name: Execute QEMU current init-IRQ frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-init-irq-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Execute and diagnose QEMU fork-init frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-rest-init-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch-rest" --timeout-ms 30000 --poll-ms 100 | tee "$ev/watch-rest.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e

          cat "$ev/watch-rest/frontier-summary.txt" || true
          echo 'QEMU_REST_CONSOLE_TAIL_BEGIN'
          tail -n 160 "$ev/watch-rest/qemu.console.log" || true
          echo 'QEMU_REST_CONSOLE_TAIL_END'

          echo 'QEMU_REST_INTERRUPT_MAP_BEGIN'
          python3 - "$ev/early/nm.txt" "$ev/watch-rest/qemu.interrupts.txt" <<'PY'
          import bisect, re, sys
          from pathlib import Path
          nm_path = Path(sys.argv[1]); int_path = Path(sys.argv[2])
          symbols=[]
          for line in nm_path.read_text(errors='replace').splitlines():
              p=line.split()
              if len(p)<3: continue
              try: addr=int(p[0],16)
              except ValueError: continue
              symbols.append((addr,p[2]))
          symbols.sort(); addrs=[x[0] for x in symbols]
          def resolve(addr):
              i=bisect.bisect_right(addrs,addr)-1
              if i<0: return '?',0
              base,name=symbols[i]; return name,addr-base
          events=[]; rx=re.compile(r'epc:0x([0-9a-fA-F]+).*desc=(\S+)')
          for line in int_path.read_text(errors='replace').splitlines():
              m=rx.search(line)
              if m: events.append((int(m.group(1),16),m.group(2)))
          for epc,desc in events[-48:]:
              name,off=resolve(epc); print(f'INTERRUPT_MAP desc={desc} epc=0x{epc:x} symbol={name}+0x{off:x}')
          seen=set()
          for epc,desc in events:
              if desc!='breakpoint' or epc in seen: continue
              seen.add(epc); name,off=resolve(epc)
              print(f'BREAKPOINT_MAP epc=0x{epc:x} symbol={name}+0x{off:x}')
          PY
          echo 'QEMU_REST_INTERRUPT_MAP_END'
          exit "$rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-rcu-softirq-rest-init-v4-${{ github.sha }}
          path: |
            build/linux-runtime-rcu-owner-v0/profile/patch.log
            build/linux-runtime-rcu-owner-v0/profile/minic-profile.txt
            build/linux-runtime-rcu-owner-v0/*-refresh.log
            build/linux-runtime-rcu-owner-v0/kallsyms.*
            build/linux-runtime-rcu-owner-v0/early/nm.txt
            build/linux-runtime-rcu-owner-v0/watch/frontier-result.json
            build/linux-runtime-rcu-owner-v0/watch/frontier-summary.txt
            build/linux-runtime-rcu-owner-v0/watch/watch-result.json
            build/linux-runtime-rcu-owner-v0/watch/qemu.interrupts.txt
            build/linux-runtime-rcu-owner-v0/watch-rest/frontier-result.json
            build/linux-runtime-rcu-owner-v0/watch-rest/frontier-summary.txt
            build/linux-runtime-rcu-owner-v0/watch-rest/watch-result.json
            build/linux-runtime-rcu-owner-v0/watch-rest/qemu.console.log
            build/linux-runtime-rcu-owner-v0/watch-rest/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7

  riscv-init-codegen:
    needs: route
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'codegen')) || (github.event_name == 'push' && needs.route.outputs.codegen == 'true')
    concurrency:
      group: linux-runtime-riscv-init-codegen-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Install RISC-V toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-riscv-init-codegen-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-riscv-init-codegen-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"

      - name: Build MiniC and GCC init objects with identical Kbuild context
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-riscv-init-codegen-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-riscv-init-codegen-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=arch/riscv/mm/init.o
          base=arch/riscv/mm/init

          rm -f "$out/$target" "$out/arch/riscv/mm/.init.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s" \
                "$out/$base.minic-stage2.minic.stdout" "$out/$base.minic-stage2.minic.stderr"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
            >"$ev/minic-kbuild.log" 2>&1
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.i"
          test -s "$out/$base.minic-stage2.s"
          cp "$out/$target" "$ev/init.minic.o"
          cp "$out/$base.minic-stage2.i" "$ev/init.minic.i"
          cp "$out/$base.minic-stage2.s" "$ev/init.minic.s"
          cp "$out/arch/riscv/mm/.init.o.cmd" "$ev/init.minic.cmd" || true
          riscv64-linux-gnu-nm -an "$ev/init.minic.o" >"$ev/init.minic.nm"
          riscv64-linux-gnu-objdump -drwC "$ev/init.minic.o" >"$ev/init.minic.objdump"
          riscv64-linux-gnu-readelf -rW -sW "$ev/init.minic.o" >"$ev/init.minic.readelf"

          rm -f "$out/$target" "$out/arch/riscv/mm/.init.o.cmd"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC=/usr/bin/riscv64-linux-gnu-gcc -j2 V=1 "$target" \
            >"$ev/gcc-kbuild.log" 2>&1
          test -s "$out/$target"
          cp "$out/$target" "$ev/init.gcc.o"
          cp "$out/arch/riscv/mm/.init.o.cmd" "$ev/init.gcc.cmd" || true
          riscv64-linux-gnu-nm -an "$ev/init.gcc.o" >"$ev/init.gcc.nm"
          riscv64-linux-gnu-objdump -drwC "$ev/init.gcc.o" >"$ev/init.gcc.objdump"
          riscv64-linux-gnu-readelf -rW -sW "$ev/init.gcc.o" >"$ev/init.gcc.readelf"

          cp "$ev/init.minic.o" "$out/$target"

          {
            echo '=== MiniC key symbols/relocations ==='
            grep -E '(_dtb_early_va|_dtb_early_pa|create_fdt_early_page_table|setup_vm)$' "$ev/init.minic.nm" || true
            grep -E '_dtb_early_va|_dtb_early_pa' "$ev/init.minic.readelf" || true
            echo '=== GCC key symbols/relocations ==='
            grep -E '(_dtb_early_va|_dtb_early_pa|create_fdt_early_page_table|setup_vm)$' "$ev/init.gcc.nm" || true
            grep -E '_dtb_early_va|_dtb_early_pa' "$ev/init.gcc.readelf" || true
            echo '=== MiniC source-level references ==='
            grep -n -C 12 '_dtb_early_va\|dtb_early_va\|create_fdt_early_page_table' "$ev/init.minic.i" | head -320 || true
            echo '=== MiniC assembly references ==='
            grep -n -C 20 '_dtb_early_va\|_dtb_early_pa' "$ev/init.minic.s" | head -480 || true
          } | tee "$ev/focused.txt"

      - name: Preserve init codegen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-riscv-init-codegen-v0-${{ github.sha }}
          path: |
            build/linux-runtime-riscv-init-codegen-v0/profile/patch.log
            build/linux-runtime-riscv-init-codegen-v0/minic-kbuild.log
            build/linux-runtime-riscv-init-codegen-v0/gcc-kbuild.log
            build/linux-runtime-riscv-init-codegen-v0/init.minic.i
            build/linux-runtime-riscv-init-codegen-v0/init.minic.s
            build/linux-runtime-riscv-init-codegen-v0/init.minic.o
            build/linux-runtime-riscv-init-codegen-v0/init.gcc.o
            build/linux-runtime-riscv-init-codegen-v0/init.minic.nm
            build/linux-runtime-riscv-init-codegen-v0/init.gcc.nm
            build/linux-runtime-riscv-init-codegen-v0/init.minic.objdump
            build/linux-runtime-riscv-init-codegen-v0/init.gcc.objdump
            build/linux-runtime-riscv-init-codegen-v0/init.minic.readelf
            build/linux-runtime-riscv-init-codegen-v0/init.gcc.readelf
            build/linux-runtime-riscv-init-codegen-v0/init.minic.cmd
            build/linux-runtime-riscv-init-codegen-v0/init.gcc.cmd
            build/linux-runtime-riscv-init-codegen-v0/focused.txt
          if-no-files-found: warn
          retention-days: 7

  timer-frontier:
    needs: route
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'timer')) || (github.event_name == 'push' && needs.route.outputs.timer == 'true')
    concurrency:
      group: linux-runtime-timer-focused-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Restore certified frozen linker source subset
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: frozen

      - name: Install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-timer-focused-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh frontier owners plus timer/hrtimer/tick-sched/RCU/init-main/softirq with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-timer-focused-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock_debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build_utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build_policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/rcu/rcu_segcblist.o rcu-segcblist-refresh.log
          refresh_obj init/main.o init-main-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log

          riscv64-linux-gnu-nm -an "$out/kernel/time/timer.o" >"$ev/timer.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/time/timer.o" >"$ev/timer.objdump.txt"
          cp "$out/kernel/time/timer.minic-stage2.s" "$ev/timer.minic-stage2.s"
          grep -n -A30 -B4 '<get_current>:' "$ev/timer.objdump.txt" >"$ev/get_current.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/kernel/time/hrtimer.o" >"$ev/hrtimer.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/time/hrtimer.o" >"$ev/hrtimer.objdump.txt"
          cp "$out/kernel/time/hrtimer.minic-stage2.s" "$ev/hrtimer.minic-stage2.s"
          grep -n -A90 -B8 '<hrtimer_run_queues>:' "$ev/hrtimer.objdump.txt" >"$ev/hrtimer_run_queues.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/kernel/time/tick-sched.o" >"$ev/tick-sched.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/time/tick-sched.o" >"$ev/tick-sched.objdump.txt"
          cp "$out/kernel/time/tick-sched.minic-stage2.s" "$ev/tick-sched.minic-stage2.s"
          grep -n -A90 -B8 '<tick_check_oneshot_change>:' "$ev/tick-sched.objdump.txt" >"$ev/tick_check_oneshot_change.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/kernel/rcu/tree.o" >"$ev/rcu-tree.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/rcu/tree.o" >"$ev/rcu-tree.objdump.txt"
          cp "$out/kernel/rcu/tree.minic-stage2.s" "$ev/rcu-tree.minic-stage2.s"
          grep -n -A120 -B12 '<rcu_sched_clock_irq>:' "$ev/rcu-tree.objdump.txt" >"$ev/rcu_sched_clock_irq.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/kernel/rcu/rcu_segcblist.o" >"$ev/rcu-segcblist.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/rcu/rcu_segcblist.o" >"$ev/rcu-segcblist.objdump.txt"
          cp "$out/kernel/rcu/rcu_segcblist.minic-stage2.s" "$ev/rcu-segcblist.minic-stage2.s"
          grep -n -A80 -B8 '<__minic_inline_spec_7545_0>:' "$ev/rcu-segcblist.objdump.txt" >"$ev/rcu-segcblist-inline-7545.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/init/main.o" >"$ev/init-main.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/init/main.o" >"$ev/init-main.objdump.txt"
          cp "$out/init/main.minic-stage2.s" "$ev/init-main.minic-stage2.s"
          grep -n -A100 -B10 '<arch_local_irq_save>:' "$ev/init-main.objdump.txt" >"$ev/init-main-arch_local_irq_save.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/kernel/softirq.o" >"$ev/softirq.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/softirq.o" >"$ev/softirq.objdump.txt"
          cp "$out/kernel/softirq.minic-stage2.s" "$ev/softirq.minic-stage2.s"
          grep -n -A100 -B10 '<arch_local_irq_save>:' "$ev/softirq.objdump.txt" >"$ev/softirq-arch_local_irq_save.objdump.txt" || true

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"

      - name: Execute QEMU current frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py --config tools/ci/linux-runtime-init-irq-frontier-v0.json --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Diagnose linked first-fault symbol
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          result="$ev/watch/frontier-result.json"
          : >"$ev/inline-fault.owner-scan.txt"
          : >"$ev/inline-fault.nm-context.txt"
          : >"$ev/inline-fault.objdump.txt"
          test -s "$result" || exit 0
          readarray -t fault_fields < <(python3 - "$result" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          d=j.get('fault_detail') or {}
          f=j.get('fault') or {}
          lookup=d.get('lookup')
          vals=[
              f.get('symbol') or '',
              d.get('epc'), d.get('tval'), lookup,
              d.get('match_start'), d.get('offset'), d.get('relocated'),
              (lookup - 0x20) if isinstance(lookup, int) else None,
              (lookup + 0x40) if isinstance(lookup, int) else None
          ]
          for v in vals:
              if isinstance(v, bool):
                  print('true' if v else 'false')
              elif isinstance(v, int):
                  print(f'0x{v:x}')
              elif v is None:
                  print('')
              else:
                  print(v)
          PY
          )
          sym="${fault_fields[0]:-}"
          epc="${fault_fields[1]:-}"
          tval="${fault_fields[2]:-}"
          lookup="${fault_fields[3]:-}"
          match_start="${fault_fields[4]:-}"
          offset="${fault_fields[5]:-}"
          relocated="${fault_fields[6]:-}"
          dis_start="${fault_fields[7]:-}"
          dis_stop="${fault_fields[8]:-}"
          [[ -n "$sym" ]] || exit 0
          {
            printf 'FAULT_SYMBOL=%s\n' "$sym"
            printf 'FAULT_EPC=%s\n' "$epc"
            printf 'FAULT_TVAL=%s\n' "$tval"
            printf 'FAULT_LOOKUP=%s\n' "$lookup"
            printf 'FAULT_MATCH_START=%s\n' "$match_start"
            printf 'FAULT_OFFSET=%s\n' "$offset"
            printf 'FAULT_RELOCATED=%s\n' "$relocated"
          } | tee "$ev/inline-fault.symbol.txt"
          grep -n -F -B8 -A8 " $sym" "$ev/early/nm.txt" >"$ev/inline-fault.nm-context.txt" || true
          if [[ -n "$dis_start" && -n "$dis_stop" ]]; then
            riscv64-linux-gnu-objdump -dr --start-address="$dis_start" --stop-address="$dis_stop" "$ev/early/vmlinux.early" >"$ev/inline-fault.objdump.txt" 2>&1 || true
          else
            riscv64-linux-gnu-objdump -dr --disassemble="$sym" "$ev/early/vmlinux.early" >"$ev/inline-fault.objdump.txt" 2>&1 || true
          fi
          for archive in "$out/vmlinux.a" "$out/built-in.a" "$out/lib/lib.a" "$out/arch/riscv/lib/lib.a"; do
            [[ -e "$archive" ]] || continue
            echo "=== $archive ===" >>"$ev/inline-fault.owner-scan.txt"
            riscv64-linux-gnu-nm -A -an "$archive" 2>/dev/null | grep -F "$sym" >>"$ev/inline-fault.owner-scan.txt" || true
          done
          cat "$ev/inline-fault.symbol.txt" || true
          cat "$ev/inline-fault.nm-context.txt" || true
          cat "$ev/inline-fault.owner-scan.txt" || true
          cat "$ev/inline-fault.objdump.txt" || true

