name: One-shot Core Frontier Batch M31b

on:
  pull_request:
    branches: [frontend/linux-first500-final-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-m31b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-5df6e0e2761359d30a8275058e299fcc0381534545f55cf43e41983f5d4c9456

      - name: Apply M31b and build with Werror
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s build/linux-focus-corpus/selected-tus.txt
          python3 tools/dev/run-core-frontier-batch-m31b.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m31b-candidate

      - name: Focused M31b shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31b-candidate/bin/minic"
          w="$GITHUB_WORKSPACE/build/m31b-shapes"
          mkdir -p "$w"
          cat > "$w/static_global_array.c" <<'EOF'
          static const unsigned a[] = { 10, 20, 30 };
          unsigned f(unsigned n) { return n < 3 ? a[n] : 0; }
          EOF
          cat > "$w/static_local_array.c" <<'EOF'
          unsigned f(unsigned n) {
              static const unsigned a[] = { 10, 20, 30 };
              return n < 3 ? a[n] : 0;
          }
          EOF
          cat > "$w/record_call.c" <<'EOF'
          typedef struct { unsigned v; } S;
          static unsigned get(S x) { return x.v; }
          int eq(S a, S b) { return get(a) == get(b); }
          EOF
          cat > "$w/record_call_mixed.c" <<'EOF'
          typedef struct { unsigned long a, b; } P;
          static unsigned long mix(unsigned long x, P p, unsigned long y) { return x + p.a + p.b + y; }
          unsigned long f(P p) { return mix(3, p, 5); }
          EOF
          cat > "$w/barrier_only.c" <<'EOF'
          void f(void *p) { __asm__ __volatile__("" : : "r"(p) : "memory"); }
          EOF
          cat > "$w/memzero_shape.c" <<'EOF'
          extern void *memset(void *, int, unsigned long);
          void f(void *p, unsigned long n) { memset(p, 0, n); __asm__ __volatile__("" : : "r"(p) : "memory"); }
          EOF
          for src in "$w"/*.c; do
            name=$(basename "$src" .c)
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$name.s"
            printf 'M31B_SHAPE_PASS name=%s\n' "$name"
          done

      - name: QEMU MiniC versus GCC differential
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31b-candidate/bin/minic"
          w="$GITHUB_WORKSPACE/build/m31b-qemu"
          mkdir -p "$w"
          cat > "$w/core.c" <<'EOF'
          typedef struct { unsigned v; } S;
          typedef struct { unsigned long a, b; } P;
          static const unsigned global_a[] = { 10, 20, 30 };
          unsigned global_lookup(unsigned n) { return n < 3 ? global_a[n] : 0; }
          unsigned local_lookup(unsigned n) {
              static const unsigned local_a[] = { 40, 50, 60 };
              return n < 3 ? local_a[n] : 0;
          }
          static unsigned get_s(S x) { return x.v; }
          int record_eq(S a, S b) { return get_s(a) == get_s(b); }
          static unsigned long mix(unsigned long x, P p, unsigned long y) {
              return x + p.a + p.b + y;
          }
          unsigned long mixed_call(P p) { return mix(3, p, 5); }
          extern void *memset(void *, int, unsigned long);
          void wipe(void *p, unsigned long n) {
              memset(p, 0, n);
              __asm__ __volatile__("" : : "r"(p) : "memory");
          }
          EOF
          cat > "$w/runtime.c" <<'EOF'
          #include <stdio.h>
          typedef struct { unsigned v; } S;
          typedef struct { unsigned long a, b; } P;
          unsigned global_lookup(unsigned);
          unsigned local_lookup(unsigned);
          int record_eq(S, S);
          unsigned long mixed_call(P);
          void wipe(void *, unsigned long);
          int main(void) {
              S a = {7}, b = {7}, d = {8}; P p = {11, 13};
              unsigned char buf[6] = {1,2,3,4,5,6};
              wipe(buf, sizeof(buf));
              unsigned sum = 0; for (unsigned i=0;i<sizeof(buf);++i) sum += buf[i];
              printf("g=%u,%u l=%u,%u eq=%d,%d mix=%lu zero=%u\n",
                     global_lookup(1), global_lookup(9), local_lookup(2), local_lookup(9),
                     record_eq(a,b), record_eq(a,d), mixed_call(p), sum);
              return 0;
          }
          EOF
          MINIC_CORE_IR=strict "$c" -S "$w/core.c" -o "$w/minic.s"
          riscv64-linux-gnu-gcc -O0 -static "$w/runtime.c" "$w/minic.s" -o "$w/minic.elf"
          qemu-riscv64 "$w/minic.elf" > "$w/minic.out"
          riscv64-linux-gnu-gcc -O0 -static "$w/runtime.c" "$w/core.c" -o "$w/gcc.elf"
          qemu-riscv64 "$w/gcc.elf" > "$w/gcc.out"
          diff -u "$w/gcc.out" "$w/minic.out"
          grep -Fx 'g=20,0 l=60,0 eq=1,0 mix=32 zero=0' "$w/minic.out"
          printf '%s\n' M31B_QEMU_DIFFERENTIAL_PASS

      - name: Preserve M31 target and expression seams
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31b-candidate/bin/minic"
          w="$GITHUB_WORKSPACE/build/m31b-m31-smoke"
          mkdir -p "$w"
          cat > "$w/core.c" <<'EOF'
          struct C { int counter; };
          unsigned long output7(void) {
              register unsigned long x;
              __asm__ __volatile__("addi %0, zero, 7" : "=r"(x) : : "memory");
              return x;
          }
          void atomic_add(int i, struct C *v) {
              __asm__ __volatile__("amoadd.w zero, %1, %0" : "+A"(v->counter) : "r"(i) : "memory");
          }
          void relax1(void) {
              int dummy;
              __asm__ __volatile__("div %0, %0, zero" : "=r"(dummy));
              __asm__ __volatile__(".4byte 0x100000F");
              __asm__ __volatile__("" : : : "memory");
          }
          int errp(const void *ptr) {
              return __builtin_expect(!ptr, 0) ||
                     __builtin_expect((unsigned long)(void *)ptr >= (unsigned long)-4095, 0);
          }
          EOF
          cat > "$w/runtime.c" <<'EOF'
          #include <stdio.h>
          struct C { int counter; };
          unsigned long output7(void); void atomic_add(int, struct C *); void relax1(void); int errp(const void *);
          int main(void) { struct C c={5}; int x=1; atomic_add(3,&c); relax1();
            printf("out=%lu counter=%d null=%d normal=%d err=%d\n", output7(),c.counter,errp(0),errp(&x),errp((void *)(unsigned long)-1)); return 0; }
          EOF
          MINIC_CORE_IR=strict "$c" -S "$w/core.c" -o "$w/minic.s"
          riscv64-linux-gnu-gcc -O0 -static "$w/runtime.c" "$w/minic.s" -o "$w/minic.elf"
          qemu-riscv64 "$w/minic.elf" > "$w/minic.out"
          grep -Fx 'out=7 counter=8 null=1 normal=0 err=1' "$w/minic.out"
          printf '%s\n' M31B_M31_SMOKE_PASS

      - name: Previous permanent Core regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31b-candidate/bin/minic"
          for script in \
            run-core-aggregate-boundary-m30.sh \
            run-core-record-local-m29.sh \
            run-core-inline-asm-identity-m28.sh \
            run-core-switch-m27.sh \
            run-core-integer-foundation-m26b.sh \
            run-core-integer-binary-preservation-m25b.sh \
            run-core-fixed-call-scalar-conversions.sh; do
            name=${script#run-}; name=${name%.sh}
            MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/m31b-regress-$name" \
              RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 \
              sh "tests/compiler/c0/$script"
          done
          printf '%s\n' M31B_REGRESSIONS_PASS

      - name: Frozen representatives move past M31b blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31b-candidate/bin/minic"
          w="$GITHUB_WORKSPACE/build/m31b-frozen-proof"; mkdir -p "$w"
          declare -A cases=(
            [init/version.i]=regs_get_kernel_argument
            [init/do_mounts.i]=uid_eq
            [arch/riscv/kernel/pi/cmdline_early.i]=memzero_explicit
          )
          for f in "${!cases[@]}"; do
            tag=${f//\//_}
            set +e
            MINIC_CORE_IR=strict "$c" -S "build/linux-focus-corpus/kbuild/$f" -o "$w/$tag.s" 2>"$w/$tag.err"
            rc=$?
            set -e
            cat "$w/$tag.err"
            ! grep -Fq "Core IR shadow does not yet support function '${cases[$f]}'" "$w/$tag.err"
            if [ "$rc" -ne 0 ]; then grep -Fq 'Core IR shadow does not yet support function' "$w/$tag.err"; fi
            printf 'M31B_FROZEN_MOVED file=%s old=%s rc=%d\n' "$f" "${cases[$f]}" "$rc"
          done

      - name: Frozen strict first500 replay and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31b-candidate/bin/minic"
          w="$GITHUB_WORKSPACE/build/m31b-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$c" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$w" \
            --jobs 5 --offset 0 --limit 500 --sample-count 0 --indices ''
          rc=$?
          set -e
          printf 'M31B_STRICT500_REPLAY_STATUS=%d\n' "$rc"
          python3 tools/ci/classify-core-strict-frontier.py "$w/batch-results.json" \
            --examples 4 --json-out "$w/frontier-summary.json" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m31b-strict500/frontier-summary.json').read_text())
          assert s['selected']==500 and s['error']==0 and s['preprocess_missing']==0, s
          assert s['pass']+s['unsupported']==500, s
          b={r['function']:r['count'] for r in s['blockers']}
          removed=('get_current','get_cycles','cpu_relax','arch_atomic_add','IS_ERR_OR_NULL',
                   'regs_get_kernel_argument','uid_eq','memzero_explicit')
          for x in removed:
              if b.get(x,0): raise SystemExit(f'M31b blocker remains: {x}={b[x]}')
          print(f"M31B_STRICT500 selected=500 pass={s['pass']} unsupported={s['unsupported']} error=0 distinct={len(s['blockers'])}")
          for r in s['blockers'][:30]: print(f"M31B_NEXT_BLOCKER count={r['count']} function={r['function']}")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-frontier-batch-m31b-evidence
          path: |
            build/m31b-shapes/*.err
            build/m31b-qemu/*.out
            build/m31b-m31-smoke/*.out
            build/m31b-frozen-proof/*.err
            build/m31b-strict500/batch-summary.txt
            build/m31b-strict500/frontier-summary.json
          if-no-files-found: warn
