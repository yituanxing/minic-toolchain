name: Linux IRQ Frame Runtime V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-irq-frame-runtime-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  irq-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-irq-frame-runtime-v0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore known-good linked Linux cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update >/dev/null
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3 \
            qemu-system-misc opensbi file >/dev/null

      - name: Build patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          ev="$GITHUB_WORKSPACE/build/linux-irq-frame-runtime-v0/evidence"
          mkdir -p "$ev"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-asm-rk-early-v0.py
            apply-inline-asm-rk-early-hotfix-v0.py
            apply-inline-asm-rk-tail-rollback-v0.py
            apply-inline-asm-rk-cast-tail-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
            apply-riscv64-core-value-slot-pack-v0.py
          )
          start=$(date +%s%N)
          for p in "${patches[@]}"; do python3 "tools/ci/$p" >>"$ev/patch.log"; done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" >/dev/null
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING toolchain_ms={(b-a)//1_000_000}")
          PY

      - name: Refresh focused runtime failure pool
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          archive="$work/linux-6.6.143.tar.xz"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-irq-frame-runtime-v0/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          test -s "$out/.config"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          rm -rf "$src" && tar -xJf "$archive" -C "$work"

          targets=(arch/riscv/mm/init.o)
          rm -f "$out/arch/riscv/mm/init.o" "$out/arch/riscv/mm/.init.o.cmd"
          for base in cmdline_early fdt_early string ctype lib-fdt lib-fdt_ro; do
            rm -f "$out/arch/riscv/kernel/pi/${base}.o" "$out/arch/riscv/kernel/pi/${base}.pi.o" \
                  "$out/arch/riscv/kernel/pi/.${base}.o.cmd" "$out/arch/riscv/kernel/pi/.${base}.pi.o.cmd"
            targets+=("arch/riscv/kernel/pi/${base}.pi.o")
          done
          focused=(
            arch/riscv/kernel/traps.o
            kernel/softirq.o
            kernel/locking/spinlock.o
            kernel/locking/spinlock_debug.o
            kernel/time/timekeeping.o
            kernel/time/vsyscall.o
          )
          for obj in "${focused[@]}"; do
            rm -f "$out/$obj" "$out/$(dirname "$obj")/.$(basename "$obj" .o).o.cmd"
            targets+=("$obj")
          done

          stamp="$ev/rebuild-start.stamp"
          touch "$stamp"
          start=$(date +%s%N)
          MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/refresh.trace" \
          MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/refresh.log" 2>&1
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING refresh_ms={(b-a)//1_000_000} objects=13")
          PY

          find "$out" -type f -name '*.minic.stderr' -newer "$stamp" -print0 | xargs -0 -r cat >"$ev/minic-frame-trace.txt"
          grep -E 'CORE_FRAME function=(do_irq|handle_riscv_irq|irq_enter_rcu|arch_spin_lock|do_raw_spin_lock|timekeeping_advance|logarithmic_accumulation|accumulate_nsecs_to_secs|update_vsyscall)' \
            "$ev/minic-frame-trace.txt" | tee "$ev/focused-core-frames.txt" || true

          riscv64-linux-gnu-objdump -dr --disassemble=set_satp_mode "$out/arch/riscv/mm/init.o" >"$ev/set_satp_mode.full.txt"
          python3 - "$ev/set_satp_mode.full.txt" <<'PY' | tee "$ev/real-satp-gate.txt"
          import re,sys
          body=open(sys.argv[1],errors='replace').read().splitlines()
          write=swap=None; kind='missing'
          for i,x in enumerate(body):
              if write is None and re.search(r'\bcsrw\s+(?:satp|0x180)\s*,',x):
                  write=i; continue
              if write is not None:
                  m=re.search(r'\b(csrrw|csrrwi)\s+[^,]+,\s*(?:satp|0x180)\s*,',x)
                  if m: swap=i; kind=m.group(1); break
          touches=sum(1 for x in body[write+1:swap] if re.search(r'\bsp\b',x)) if write is not None and swap is not None else -1
          print(f'REAL_SATP_WINDOWS={int(write is not None and swap is not None)}')
          print(f'REAL_SATP_STACK_TOUCHES={touches}')
          print(f'REAL_SATP_SWAP_KIND={kind}')
          if write is None or swap is None or touches: raise SystemExit(1)
          PY

      - name: Relink and run focused QEMU gate
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-irq-frame-runtime-v0/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          start=$(date +%s%N)
          MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=0 MINIC_KBUILD_TRACE="$ev/relink.trace" CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 Image >"$ev/relink.log" 2>&1
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING relink_ms={(b-a)//1_000_000}")
          PY
          test -s "$out/arch/riscv/boot/Image"
          riscv64-linux-gnu-nm -n "$out/vmlinux" >"$ev/vmlinux.nm.txt"
          printf 'IMAGE_BYTES=%s\n' "$(stat -c %s "$out/arch/riscv/boot/Image")" | tee "$ev/summary.txt"

          start=$(date +%s%N)
          set +e
          timeout --signal=TERM 8s qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$out/arch/riscv/boot/Image" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -d int,in_asm -D "$ev/qemu.trace.log" \
            >"$ev/qemu.console.log" 2>&1
          rc=$?
          set -e
          end=$(date +%s%N)
          banner=0; old_satp=0; old_irq=0
          grep -a -q 'Linux version 6\.6\.143' "$ev/qemu.console.log" && banner=1 || true
          grep -a -q 'epc:0x000000008a06907a' "$ev/qemu.trace.log" && old_satp=1 || true
          grep -a -q 'tval:0xff1fffffffffff58' "$ev/qemu.trace.log" && old_irq=1 || true
          printf 'EARLY_QEMU_RC=%s\nLINUX_BANNER=%s\nOLD_SATP_FAULT=%s\nOLD_IRQ_GUARD_FAULT=%s\n' \
            "$rc" "$banner" "$old_satp" "$old_irq" | tee -a "$ev/summary.txt"
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING qemu_ms={(b-a)//1_000_000}")
          PY
          grep -a 'riscv_cpu_do_interrupt' "$ev/qemu.trace.log" >"$ev/qemu.interrupts.txt" || true
          grep -a -n -E 'store_page_fault|load_page_fault|exec_page_fault|illegal_instruction|breakpoint' "$ev/qemu.trace.log" | tail -n 160 >"$ev/qemu.faults.tail.txt" || true
          tail -n 1400 "$ev/qemu.trace.log" >"$ev/qemu.trace.tail.txt" || true
          tail -n 300 "$ev/qemu.console.log" >"$ev/qemu.console.tail.txt" || true

          python3 - "$ev/qemu.interrupts.txt" "$ev/vmlinux.nm.txt" <<'PY' | tee "$ev/fault-symbols.txt"
          import bisect,re,sys
          ints=open(sys.argv[1],errors='replace').read().splitlines()
          syms=[]
          for line in open(sys.argv[2],errors='replace'):
              p=line.split()
              if len(p)>=3:
                  try: a=int(p[0],16)
                  except ValueError: continue
                  syms.append((a,p[2]))
          add=[a for a,_ in syms]
          faults=[]
          for line in ints:
              if 'page_fault' not in line: continue
              m=re.search(r'epc:0x([0-9a-fA-F]+).*tval:0x([0-9a-fA-F]+).*desc=([^ ]+)',line)
              if not m: continue
              epc=int(m.group(1),16); tval=int(m.group(2),16); desc=m.group(3)
              i=bisect.bisect_right(add,epc)-1
              sym='?'; off=0
              if i>=0: sym=syms[i][1]; off=epc-syms[i][0]
              faults.append((epc,tval,desc,sym,off))
          for epc,tval,desc,sym,off in faults[-12:]:
              print(f'FAULT desc={desc} epc=0x{epc:016x} tval=0x{tval:016x} symbol={sym}+0x{off:x}')
          guard=sum(1 for _,t,desc,_,_ in faults if desc in ('store_page_fault','load_page_fault') and 0xff1ffffffff00000 <= t < 0xff20000000000000)
          print(f'IRQ_GUARD_RANGE_FAULTS={guard}')
          PY
          cat "$ev/summary.txt"
          cat "$ev/fault-symbols.txt"

      - name: Preserve focused runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-irq-frame-runtime-v0
          path: build/linux-irq-frame-runtime-v0/evidence/
          if-no-files-found: ignore
          retention-days: 7
