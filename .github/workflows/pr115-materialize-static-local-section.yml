name: PR115 Materialize Static Local Section
on:
  push:
    branches: [agent/static-local-section-attribute-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize static local section attributes
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr115-materialize.py
          clang-format-18 -i src/frontend/parser_statement.c tests/compiler/c0/gnu_static_local_interleaved_attribute.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr115-focused" HOST_CC=cc sh tests/compiler/c0/run-gnu-static-local-interleaved-attribute.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr115-materialize.py .github/workflows/pr115-materialize-static-local-section.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): persist static local section attributes'
          git push origin HEAD:agent/static-local-section-attribute-v0
