name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  productize-pointer-sign-assignment:
    name: Productize GNU pointer-sign assignment
    if: github.event_name == 'pull_request' && github.head_ref == 'frontend/gnu-pointer-sign-assignment-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v4
        with:
          ref: frontend/gnu-pointer-sign-assignment-v1

      - name: Materialize and validate focused gates
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-gnu-pointer-sign-assignment-v1.py
          clang-format -i src/frontend/ast.c
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/pointer-sign-assignment-product
          MINIC="$GITHUB_WORKSPACE/build/pointer-sign-assignment-product/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-sign-assignment-call" \
            sh tests/compiler/c0/run-gnu-pointer-sign-call-conversion.sh
          MINIC="$GITHUB_WORKSPACE/build/pointer-sign-assignment-product/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-sign-assignment-char" \
            sh tests/compiler/c0/run-unsigned-char-layout.sh
          git diff --check

      - name: Commit product
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/ast.c
          if git diff --cached --quiet; then
            echo 'GNU pointer-sign assignment product already materialized'
            exit 0
          fi
          git commit -m 'frontend: accept GNU same-rank pointer-sign assignment'
          git push origin HEAD:frontend/gnu-pointer-sign-assignment-v1

  full-validation:
    name: Full compiler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run the complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-c0-failure-diagnostics
          path: |
            build/ci-external/tests/external/tiny-aes-c/diagnostic.txt
            build/ci-external/tests/external/tiny-aes-c/*.status
          if-no-files-found: ignore
          retention-days: 7
