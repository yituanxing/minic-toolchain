name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
  push:
    branches:
      - main
      - frontend/incomplete-record-tags
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full compiler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run the complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-c0-failure-diagnostics
          path: |
            build/ci-external/tests/external/tiny-aes-c/diagnostic.txt
            build/ci-external/tests/external/tiny-aes-c/*.status
          if-no-files-found: ignore
          retention-days: 7

  apply-record-slice:
    name: Apply self-referential record slice
    if: github.event_name == 'push' && github.ref == 'refs/heads/frontend/incomplete-record-tags'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: frontend/incomplete-record-tags
          fetch-depth: 0

      - name: Prepare bounded acceptance and restore permanent workflow
        shell: bash
        run: |
          git fetch origin main
          printf '\n' >> src/frontend/parser_type.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-self-referential-records.sh')
          text = path.read_text()
          old = '''    Node first;
    Node second;

    first.next = &second;
    first.next->value = 41;
    return first.next->value;
'''
          new = '''    Node first;
    Node second;
    Node *cursor = &first;

    cursor->next = &second;
    cursor->next->value = 41;
    return cursor->next->value;
'''
          if text.count(old) != 1:
              raise SystemExit(f'fixture marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git checkout origin/main -- .github/workflows/compiler-c0.yml
          git rm --ignore-unmatch \
            .github/record-slice.ready \
            .github/record-slice-failure.log \
            .github/workflows/record-slice-push-diagnostic.yml \
            .github/workflows/record-slice-push.yml \
            .github/workflows/apply-self-referential-records-v2.yml

      - name: Apply, validate, and commit bounded slice
        run: bash .github/scripts/apply-self-referential-records.sh
