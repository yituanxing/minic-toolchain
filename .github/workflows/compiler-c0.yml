name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  productize-builtin-va-copy:
    name: Productize GNU va_copy
    if: github.event_name == 'pull_request' && github.head_ref == 'frontend/builtin-va-copy-v1'
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v4
        with:
          ref: frontend/builtin-va-copy-v1

      - name: Restore RISC-V package archives
        id: rv64-cache-product
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Materialize and validate GNU va_copy
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache-product.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-builtin-va-copy-v1.py
          clang-format -i \
            src/frontend/ast.h \
            src/frontend/ast_traversal.c \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_expression.c
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/va-copy-product
          if [[ "$RV64_CACHE_HIT" == true ]]; then
            mapfile -d '' cached_packages < <(find "$HOME/.cache/minic-apt/archives" -maxdepth 1 -type f -name '*.deb' -print0 | sort -z)
            sudo apt-get install -y --no-install-recommends "${cached_packages[@]}"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
          fi
          sh tools/ci/verify-validation-tools.sh
          MINIC="$GITHUB_WORKSPACE/build/va-copy-product/bin/minic" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
          REQUIRE_RISCV_RUNTIME=1 \
          BUILD_DIR="$GITHUB_WORKSPACE/build/va-copy-focused" \
            sh tests/compiler/c0/run-builtin-va-copy.sh
          git diff --check

      - name: Commit product
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/ast.h \
            src/frontend/ast_traversal.c \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_expression.c \
            tests/compiler/c0/run.sh
          if git diff --cached --quiet; then
            echo 'GNU va_copy product already materialized'
            exit 0
          fi
          git commit -m 'frontend: support target-aware GNU va_copy'
          git push origin HEAD:frontend/builtin-va-copy-v1

  full-validation:
    name: Full compiler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run the complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-c0-failure-diagnostics
          path: |
            build/ci-external/tests/external/tiny-aes-c/diagnostic.txt
            build/ci-external/tests/external/tiny-aes-c/*.status
          if-no-files-found: ignore
          retention-days: 7
