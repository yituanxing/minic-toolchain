name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full compiler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run the complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-c0-failure-diagnostics
          path: |
            build/ci-external/tests/external/tiny-aes-c/diagnostic.txt
            build/ci-external/tests/external/tiny-aes-c/*.status
          if-no-files-found: ignore
          retention-days: 7

  productize-rv64-inline-asm-readwrite-memory-jr:
    name: Productize RV64 inline asm +m/Jr
    if: github.event_name == 'pull_request' && github.head_ref == 'target/rv64-inline-asm-readwrite-memory-jr-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize product
        run: python3 tools/dev/productize-rv64-inline-asm-readwrite-memory-jr-v1.py

      - name: Restore RISC-V package archives
        id: rv64-cache-product
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Install cached RISC-V packages
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache-product.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          cache="$HOME/.cache/minic-apt/archives"
          if [[ "$RV64_CACHE_HIT" == true ]]; then
            mapfile -d '' packages < <(find "$cache" -maxdepth 1 -type f -name '*.deb' -print0 | sort -z)
            sudo dpkg --unpack "${packages[@]}"
            sudo dpkg --configure -a
          else
            sudo apt-get update
            mapfile -t requested < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
            sudo apt-get install -y --no-install-recommends "${requested[@]}"
          fi

      - name: Validate focused product
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-rv64-inline-asm-jr
          MINIC="$PWD/build/product-rv64-inline-asm-jr/bin/minic" \
            BUILD_DIR="$PWD/build/product-rv64-inline-asm-jr" \
            sh tests/compiler/c0/run-gnu-inline-asm-operands-rv64.sh

      - name: Publish product commit
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- src/target/riscv64/codegen_inline_asm.c; then
            echo 'Product already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/target/riscv64/codegen_inline_asm.c
          git commit -m 'target: support RV64 inline asm +m and Jr constraints'
          git push origin HEAD:${{ github.head_ref }}
