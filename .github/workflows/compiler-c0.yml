name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - '.github/workflows/compiler-c0.yml'

permissions:
  contents: write

concurrency:
  group: compiler-c0-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-stable-borrows:
    name: Materialize stable Program borrows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and commit stable-borrow fixup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/staging-stable-borrows-fixup.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c
          if git diff --cached --quiet; then
            echo 'Stable-borrow fixup already materialized.'
            exit 0
          fi
          git commit -m 'frontend: finish stable initializer borrow snapshots'
          git push origin HEAD:${{ github.head_ref }}
