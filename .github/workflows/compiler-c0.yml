name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full compiler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run the complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-c0-failure-diagnostics
          path: |
            build/ci-external/tests/external/tiny-aes-c/diagnostic.txt
            build/ci-external/tests/external/tiny-aes-c/*.status
          if-no-files-found: ignore
          retention-days: 7

  productize-gnu-pointer-sign-static-init:
    name: Productize GNU pointer-sign static initialization
    if: github.event_name == 'pull_request' && github.head_ref == 'frontend/gnu-pointer-sign-static-init-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact capability branch
        uses: actions/checkout@v4
        with:
          ref: frontend/gnu-pointer-sign-static-init-v1
          fetch-depth: 0

      - name: Materialize coherent type/static-init capability
        run: python3 tools/dev/materialize-gnu-pointer-sign-static-init-v1.py

      - name: Build release compiler with warnings as errors
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/gnu-pointer-sign-static-init

      - name: Run focused pointer conversion gates
        run: |
          MINIC="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-focused" \
            sh tests/compiler/c0/run-static-object-address-relocation.sh
          MINIC="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-focused" \
            sh tests/compiler/c0/run-gnu-pointer-sign-call-conversion.sh

      - name: Run fast regression gate
        run: make -j4 BUILD_DIR=build/gnu-pointer-sign-static-init-fast check-fast

      - name: Commit materialized product
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/type.h src/frontend/type.c src/frontend/parser_expression.c src/frontend/parser_global.c src/frontend/ast_global.c
          if git diff --cached --quiet; then
            printf '%s\n' 'Product source already materialized; nothing to commit.'
            exit 0
          fi
          git commit -m 'frontend: share GNU pointer-sign conversion semantics'
          git push origin HEAD:frontend/gnu-pointer-sign-static-init-v1
