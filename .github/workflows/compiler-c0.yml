name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  productize-function-pointer-array:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize clean product slice
        run: |
          set -Eeuo pipefail
          git fetch origin main staging/string-octal-v1
          git show origin/staging/string-octal-v1:tools/dev/materialize-function-pointer-array-declarator-v1.py > tools/dev/.productize-function-pointer-array-v10.py
          python3 tools/dev/.productize-function-pointer-array-v10.py
          rm tools/dev/.productize-function-pointer-array-v10.py
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tests/compiler/c0/function_pointer_qualifiers.c')
          addition = '''\nextern int (*external_handlers[])(int value);\nstatic int (*static_handlers[1])(int value) = {0};\n\nint function_pointer_array_shape(void)\n{\n    return static_handlers[0] == 0;\n}\n'''
          text = src.read_text()
          if 'function_pointer_array_shape' not in text:
              src.write_text(text + addition)
          runner = Path('tests/compiler/c0/run-function-pointer-qualifiers.sh')
          text = runner.read_text()
          anchor = "grep -F 'call_typedef:' \"$work/output.s\" >/dev/null\n"
          if anchor not in text:
              raise SystemExit('function-pointer runner anchor missing')
          if "function_pointer_array_shape:" not in text:
              runner.write_text(text.replace(anchor, anchor + "grep -F 'function_pointer_array_shape:' \"$work/output.s\" >/dev/null\n", 1))
          PY
          git show origin/main:.github/workflows/compiler-c0.yml > .github/workflows/compiler-c0.yml
          clang-format-18 -i src/frontend/parser_declarator.c tests/compiler/c0/function_pointer_qualifiers.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-fp-array-v10
          MINIC="$GITHUB_WORKSPACE/build/product-fp-array-v10/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-fp-array-v10-focused" sh tests/compiler/c0/run-function-pointer-qualifiers.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-fp-array-v10-fast
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_internal.h src/frontend/parser_declarator.c tests/compiler/c0/function_pointer_qualifiers.c tests/compiler/c0/run-function-pointer-qualifiers.sh .github/workflows/compiler-c0.yml
          git commit -m 'frontend: parse function pointer array declarators'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  full-validation:
    name: Full compiler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run the complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-c0-failure-diagnostics
          path: |
            build/ci-external/tests/external/tiny-aes-c/diagnostic.txt
            build/ci-external/tests/external/tiny-aes-c/*.status
          if-no-files-found: ignore
          retention-days: 7
