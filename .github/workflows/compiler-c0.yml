name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - '.github/workflows/compiler-c0.yml'
      - 'tools/dev/pr81-materialize.py'
      - 'tests/compiler/c0/gnu_void_pointer_relational.c'

permissions:
  contents: write

concurrency:
  group: compiler-c0-pr81-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-gnu-void-pointer-relational:
    name: Materialize GNU void pointer relational semantics
    if: github.event.pull_request.head.ref == 'agent/gnu-void-pointer-relational-v0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply bounded semantic slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr81-materialize.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4 MODE=debug check

      - name: Commit materialized source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_expression.c \
                  tests/compiler/c0/run-runtime.sh \
                  tests/compiler/c0/gnu_void_pointer_relational.c
          if git diff --cached --quiet; then
            echo 'GNU void pointer relational semantics already materialized.'
            exit 0
          fi
          git commit -m 'frontend: accept GNU void pointer ordering'
          git push origin HEAD:${{ github.head_ref }}
