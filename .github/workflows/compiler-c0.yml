name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
      - '.github/workflows/productize-record-conditional-type-v3.yml'

permissions:
  contents: write

jobs:
  productize-record-conditional:
    if: ${{ github.head_ref == 'product/record-conditional-type-v3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/record-conditional-type-v3
          fetch-depth: 0
      - name: Apply validated product slice
        run: |
          set -Eeuo pipefail
          git fetch origin 'refs/heads/staging/string-octal-v1:refs/remotes/origin/staging/string-octal-v1' --no-tags
          mat=tools/dev/.productize-record-conditional-v3.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-record-conditional-type-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat >> tests/compiler/c0/conditional_null_pointer_constant.c <<'EOF'

int choose_record_value(int condition) {
    struct node left = {"left", 11};
    const struct node right = {"right", 22};
    struct node value = condition ? left : right;
    return value.value;
}
EOF
          clang-format-18 -i src/frontend/expression_semantics.c tests/compiler/c0/conditional_null_pointer_constant.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-record-conditional
          MINIC="$GITHUB_WORKSPACE/build/product-record-conditional/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-record-conditional-focused" sh tests/compiler/c0/run-conditional-null-pointer-constant.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-record-conditional-fast
      - name: Persist clean product commit
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          git checkout origin/main -- .github/workflows/compiler-c0.yml
          git rm -f .github/workflows/productize-record-conditional-type-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/expression_semantics.c tests/compiler/c0/conditional_null_pointer_constant.c .github/workflows/compiler-c0.yml
          git commit -m 'frontend: type compatible record conditionals'
          git push origin HEAD:product/record-conditional-type-v3
