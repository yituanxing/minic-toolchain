name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - '.github/workflows/compiler-c0.yml'
      - 'tools/dev/pr80-materialize.py'

permissions:
  contents: write

concurrency:
  group: compiler-c0-pr80-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-cleanup-lifetime:
    name: Materialize GNU cleanup lifetime v0
    if: github.event.pull_request.head.ref == 'agent/gnu-cleanup-lifetime-v0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply bounded cleanup-lifetime slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr80-materialize.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4 MODE=debug check

      - name: Commit materialized source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/ast.c src/frontend/ast.h \
                  src/frontend/attribute.c src/frontend/attribute.h \
                  src/frontend/parser_internal.h src/frontend/parser_core.c \
                  src/frontend/parser_statement.c src/frontend/parser_function.c \
                  src/target/riscv64/codegen_statement.c \
                  tests/compiler/c0/run-runtime.sh
          if git diff --cached --quiet; then
            echo 'GNU cleanup lifetime v0 already materialized.'
            exit 0
          fi
          git commit -m 'frontend: model GNU cleanup lifetime exits'
          git push origin HEAD:${{ github.head_ref }}
