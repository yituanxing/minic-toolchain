name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
      - '.github/workflows/productize-function-pointer-array-declarator-v5.yml'

permissions:
  contents: write

jobs:
  productize-function-pointer-array:
    if: ${{ github.head_ref == 'product/function-pointer-array-declarator-v5' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/function-pointer-array-declarator-v5
          fetch-depth: 0
      - name: Apply validated product slice
        run: |
          set -Eeuo pipefail
          git fetch origin 'refs/heads/staging/string-octal-v1:refs/remotes/origin/staging/string-octal-v1' --no-tags
          mat=tools/dev/.productize-function-pointer-array-v5.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-function-pointer-array-declarator-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat >> tests/compiler/c0/function_pointer_qualifiers.c <<'EOF'

extern int (*external_handlers[])(int value);
static int (*static_handlers[1])(int value) = {0};

int function_pointer_array_shape(void)
{
    return static_handlers[0] == 0;
}
EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/compiler/c0/run-function-pointer-qualifiers.sh')
          s=p.read_text()
          anchor="grep -F 'call_typedef:' \"$work/output.s\" >/dev/null\n"
          if anchor not in s: raise SystemExit('function-pointer runner anchor missing')
          p.write_text(s.replace(anchor, anchor+"grep -F 'function_pointer_array_shape:' \"$work/output.s\" >/dev/null\n",1))
          PY
          clang-format-18 -i src/frontend/parser_declarator.c src/frontend/parser_internal.h tests/compiler/c0/function_pointer_qualifiers.c || true
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-fp-array
          MINIC="$GITHUB_WORKSPACE/build/product-fp-array/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-fp-array-focused" sh tests/compiler/c0/run-function-pointer-qualifiers.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-fp-array-fast
      - name: Persist clean product commit
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          git checkout origin/main -- .github/workflows/compiler-c0.yml
          git rm -f .github/workflows/productize-function-pointer-array-declarator-v5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_internal.h src/frontend/parser_declarator.c tests/compiler/c0/function_pointer_qualifiers.c tests/compiler/c0/run-function-pointer-qualifiers.sh .github/workflows/compiler-c0.yml
          git commit -m 'frontend: parse function pointer array declarators'
          git push origin HEAD:product/function-pointer-array-declarator-v5
