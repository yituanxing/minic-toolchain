name: Compiler C0 Gates

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/compiler-c0.yml'
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  productize-external-tentative-list:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize clean product slice
        run: |
          set -Eeuo pipefail
          git fetch origin main
          awk '/^          python3 - <<'\''PY'\''$/{flag=1;next} /^          PY$/{if(flag){exit}} flag{sub(/^          /,""); print}' \
            .github/workflows/productize-external-tentative-list-v4.yml > /tmp/productize-external-list.py
          python3 /tmp/productize-external-list.py
          cat > tests/compiler/c0/external_tentative_declarator_list.c <<'EOF'
          unsigned long first_value, second_value;
          int *first_pointer, *second_pointer;
          int main(void) {
              return (int)(first_value + second_value) +
                     (first_pointer != 0) + (second_pointer != 0);
          }
          EOF
          cat > tests/compiler/c0/run-external-tentative-declarator-list.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/external-tentative-declarator-list
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/external_tentative_declarator_list.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-external-tentative-declarator-list.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/compiler/c0/run.sh')
          s = p.read_text()
          if 'run-external-tentative-declarator-list.sh' not in s:
              s += '\nMINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \\\n  sh "$root/tests/compiler/c0/run-external-tentative-declarator-list.sh"\n'
              p.write_text(s)
          PY
          git rm .github/workflows/productize-external-tentative-list-v4.yml
          test -f diagnostics/productize-external-tentative-list-v4-trigger.txt && git rm diagnostics/productize-external-tentative-list-v4-trigger.txt || true
          git show origin/main:.github/workflows/compiler-c0.yml > .github/workflows/compiler-c0.yml
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/external_tentative_declarator_list.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/external-list-v5
          MINIC="$GITHUB_WORKSPACE/build/external-list-v5/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/external-list-v5-focused" sh tests/compiler/c0/run-external-tentative-declarator-list.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/external-list-v5-fast
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_function.c tests/compiler/c0/external_tentative_declarator_list.c tests/compiler/c0/run-external-tentative-declarator-list.sh tests/compiler/c0/run.sh .github/workflows/compiler-c0.yml
          git commit -m 'frontend: parse external tentative declarator lists'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  full-validation:
    name: Full compiler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run the complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-c0-failure-diagnostics
          path: |
            build/ci-external/tests/external/tiny-aes-c/diagnostic.txt
            build/ci-external/tests/external/tiny-aes-c/*.status
          if-no-files-found: ignore
          retention-days: 7
