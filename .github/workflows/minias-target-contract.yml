name: MiniAS Target ISA ABI Contract

on:
  pull_request:
    paths:
      - 'assembler/**'
      - 'elf/**'
      - 'tools/minic-as/**'
      - 'tests/assembler/**'
      - 'Makefile'
      - '.github/workflows/minias-target-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minias-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-a0-rv32i:
    name: Native A0, strict RV32I, GNU parity, ELF32 real link
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Assert evaluated source is exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MINIAS_EXACT_HEAD=PASS sha=$actual"
      - name: Install RISC-V GNU assembler/linker and QEMU user runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-riscv64-linux-gnu gcc-riscv64-linux-gnu \
            binutils-loongarch64-linux-gnu qemu-user
      - name: Build MiniAS from this exact PR head
        run: |
          make -j2 MODE=release CFLAGS=-Werror build/release/bin/minic-as
          test -x build/release/bin/minic-as
      - name: Reject malformed four-target operands with clean failure unwind
        run: bash tests/assembler/probe-mc-operand-failure-unwind.sh
      - name: Enforce ISA-private fixup and MC emission ownership
        run: bash tests/assembler/probe-mc-target-boundary.sh
      - name: Four Target EncodeResult and Common-owned Fixup/Symbol transactions
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-mc-encode-result.sh
      - name: Four Target bound SymbolRefs retain GNU object and fixup identity
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-mc-symbol-ref-transaction.sh
      - name: Four Target instruction lowering ownership and x86 GNU modes
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-mc-target-lowering-ownership.sh
      - name: GNU x86 register form plan, high-byte rules and relocation contract
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-x86-register-encoding-plan-gnu.sh
      - name: GNU LoongArch dynamic operand tokens and PCALA descriptor relocations
        run: |
          command -v loongarch64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-loong-dynamic-token-descriptor.sh
      - name: Validate Common MCOperand nested ownership and error-path lifecycle
        run: bash tests/assembler/probe-mc-operand-lifetime.sh
      - name: RV32E validates parsed GPRs without treating symbols as registers
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv32e-typed-registers.sh
      - name: Reject false-green immutable Linux seven-shard manifests
        run: bash tests/assembler/probe-minias-acceptance-gates.sh
      - name: Verify MCLayout validates source-ordered fragments and stable anchors
        run: grep -q "minias_validate_fragment_layout" assembler/src/mc_layout.c
      - name: Stress persistent MCLayout with 160 x86 long-branch expansions
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-relax-plan-stress.sh
      - name: GNU x86 and RV64 2048-edge alias DAG retains SymbolID order
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-alias-dag.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-alias-dag.sh
      - name: GNU x86 and RV64 SourceFrame replay after forced long branch
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-source-replay-branch.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-source-replay-branch.sh
      - name: SourceGraph reads physical input once and replays stable sites
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-source-graph-cache.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-source-graph-cache.sh
      - name: GNU RV64I 160-typed-fragment relaxation stress
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-typed-relax-four-target-stress.sh
      - name: GNU RV32/RV64 typed LI materialization semantics and measurement
        run: |
          # This CI acceptance gate may never silently skip its GNU oracle.
          command -v riscv64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv-typed-li-materialization.sh
      - name: GNU RV32F/RV64D typed FP register and rounding operands
        run: |
          command -v riscv64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv-typed-fp-operands.sh
      - name: GNU RISC-V option and ELF architecture attribute semantic state
        run: |
          command -v riscv64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv-attribute-semantic-state.sh
      - name: GNU RV32 target width invariants across data and instruction operands
        run: |
          command -v riscv64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv32-target-width-invariants.sh
      - name: GNU RV32/RV64 canonical target profile is a single source of truth
        run: |
          command -v riscv64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv-target-profile-single-source.sh
      - name: GNU RV32/RV64 .option RVC push pop and ISA feature-state boundaries
        run: |
          command -v riscv64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv-option-rvc-state.sh
      - name: GNU RVC compressed nop and ret are frozen at each lexical option site
        run: |
          command -v riscv64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv-compressed-pseudo-site-gnu.sh
      - name: RV strict executable instructions reject all Common raw data escapes
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv-exec-directive-completeness.sh
      - name: Assert one Common DWARF object model, CFI writer and owned bytecode
        run: bash tests/assembler/probe-cfi-model-ownership.sh
      - name: Enforce one Common MCFragment layout engine and shared variable DATA
        run: bash tests/assembler/probe-mc-layout-ownership.sh
      - name: Enforce unique Common MCExpr grammar and emission ownership
        run: bash tests/assembler/probe-mc-expression-ownership.sh
      - name: GNU expression precedence oracle across four Target data sections
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-mc-shared-expression-grammar.sh
      - name: GNU source frame macro, repeat and end ownership
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-common-skipped-macro-repeat-gnu.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-common-source-end-gnu.sh
      - name: Run complete A0 including ISA/ABI and macro relaxation regressions
        run: make MODE=release check-minias-a0
      - name: GNU RISC-V target-shared MC operand lexer and rejected mismatched groups
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-operand-lexer.sh
      - name: Run strict RV32I GNU byte oracle and real ELF32/QEMU smoke
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv32i-elf32.sh
      - name: Assert fragment-owned, directive and synthesized relocation offsets
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-fragment-fixup-ownership.sh
      - name: Validate ELF SHT_GROUP and GNU COMDAT real linker semantics
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-comdat-groups.sh
      - name: Same-pass branch relaxation and forward-data fragment fixed point
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-deferred-fragment-relax.sh
      - name: Fixed GNU .org and lexical directives stay in persistent MCLayout
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-org-lexical-layout.sh
      - name: GNU RISC-V fixed .org and forward DATA share one layout fixed point
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-org-data-fixedpoint.sh
      - name: GNU RISC-V retained variable MCExpr and explicit legacy fallback
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mcexpr-variable-fixedpoint.sh
      - name: GNU RISC-V function .size signed end anchor after branch relaxation
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mcexpr-size-end-anchor.sh
      - name: MCExpr data oracle in all A0 and ISA tests
        run: grep -q "MINIAS_MC_EXPR_DIFFERENCE" assembler/src/minias_internal.h
      - name: Verify atomic MCFragment transactions across four CodeEmitters
        run: bash tests/assembler/probe-mc-fragment-transaction.sh
      - name: Validate MCExpr stable interned Symbol IDs and 1024-relocation GNU oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-mcexpr-symbol-ids.sh
      - name: GNU RV64 raw CFI bytecode retained as a single fragment event
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-cfi-escape-blob.sh
      - name: GNU RV32 and RV64 extended CFI nested state
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-cfi-extended-gnu.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv32 \
            bash tests/assembler/probe-cfi-extended-gnu.sh
      - name: Real RV64/RV32 implicit EH GNU oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-cfi-eh-frame.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv32 \
            bash tests/assembler/probe-cfi-eh-frame.sh
      - name: GNU RV32/RV64 dual CFI frame section contract
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-cfi-dual-frame.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv32 \
            bash tests/assembler/probe-cfi-dual-frame.sh
      - name: Check real RV64 .debug_frame CIE/FDE against GNU GAS
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-cfi-debug-frame.sh
      - name: Check real RV32 ELF32 DWARF CIE/FDE ABI against GNU GAS
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv32 \
            bash tests/assembler/probe-cfi-debug-frame.sh
      - name: GNU RV64I MCExpr data-byte and relocation oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-common-mcexpr-four-arch.sh
      - name: GNU RV64I one-pass immutable INCBIN binary DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-immutable-incbin.sh
      - name: GNU RV64I immutable signed LEB, unsigned LEB and string DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mc-immutable-literal-data.sh
      - name: GNU RV64I lexical .set expressions retain immutable MC fields
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-mcexpr-lexical-sets.sh
      - name: GNU RV64 typed variable DATA and long-branch relayout
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=riscv \
            bash tests/assembler/probe-typed-variable-data-relax.sh
      - name: GCC C-to-S RV64I base ISA versus inline-asm extension gate
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-rv64i-gcc-compiler-source.sh


  aarch64-vertical:
    name: AArch64 native instruction, relocation, real LD and QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Assert evaluated source is exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "MINIAS_EXACT_HEAD=PASS sha=$actual"
      - name: Install GNU AArch64 assembler, linker and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu qemu-user
      - name: Build MiniAS on exact head
        run: make -j2 MODE=release CFLAGS=-Werror build/release/bin/minic-as
      - name: GNU AArch64 grouped MC operand tokenizer and invalid nesting
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-mc-operand-lexer.sh
      - name: GNU AArch64 scalar load/store encoding table and illegal forms
        run: |
          command -v aarch64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-scalar-memory-table.sh
      - name: GNU AArch64 deferred scalar memory operands retain target descriptors
        run: |
          command -v aarch64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-deferred-memory-descriptor.sh
      - name: GNU AArch64 typed Memory and ALU branch composite deferred operands
        run: |
          command -v aarch64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-typed-composite-memory-gnu.sh
      - name: AArch64 scalar lo12 relocations share the typed memory descriptor
        run: |
          command -v aarch64-linux-gnu-as
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-relocated-scalar-memory-table.sh
      - name: GNU AArch64 MCExpr data-byte and relocation oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-common-mcexpr-four-arch.sh
      - name: GNU AArch64 160-typed-fragment relaxation stress
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-typed-relax-four-target-stress.sh
      - name: GNU AArch64 one-pass immutable binary DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-mc-immutable-incbin.sh
      - name: GNU AArch64 immutable LEB and string DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-mc-immutable-literal-data.sh
      - name: GNU AArch64 immutable parse-site MCExpr
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-mcexpr-lexical-sets.sh
      - name: GNU AArch64 raw CFI bytecode retained as a single fragment event
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-cfi-escape-blob.sh
      - name: GNU AArch64 extended CFI nested state
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-cfi-extended-gnu.sh
      - name: Real AArch64 implicit EH GNU oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-cfi-eh-frame.sh
      - name: GNU AArch64 dual CFI frame section contract
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-cfi-dual-frame.sh
      - name: GNU AArch64 late fragment symbol differences in machine operands
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-retained-delta.sh
      - name: GNU AArch64 typed literal pool mixed-width identity and relocation
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-literal-pool-order.sh
      - name: GNU AArch64 fixed .org and forward DATA layout
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-mc-org-data-fixedpoint.sh
      - name: GNU AArch64 retained variable MCExpr fixed point
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-mcexpr-variable-fixedpoint.sh
      - name: GNU AArch64 .size signed end-anchor and forward DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-mcexpr-size-end-anchor.sh
      - name: Check AArch64 real .debug_frame CIE/FDE against GNU GAS
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=aarch64 \
            bash tests/assembler/probe-cfi-debug-frame.sh
      - name: AArch64 .req aliases only resolve in typed register positions
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-typed-register-alias.sh
      - name: Test independent AArch64 backend through shared ELF engine
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-aarch64-elf64.sh
