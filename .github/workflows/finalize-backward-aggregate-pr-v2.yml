name: Finalize Backward Aggregate PR V2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  productize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'product/final-backward-aggregate-v1' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/final-backward-aggregate-v1
          fetch-depth: 0
      - name: Execute minimal current-main finalizer
        run: |
          set -Eeuo pipefail
          git show origin/main:.github/workflows/finalize-backward-aggregate-pr-v1.yml > /tmp/finalizer-v1.yml
          python3 - <<'PY'
          from pathlib import Path

          src = Path('/tmp/finalizer-v1.yml').read_text().splitlines()
          wanted = [
              'Apply current-main backward aggregate semantics',
              'Validate current-main product slice',
              'Commit clean product tree',
          ]
          chunks = []
          for name in wanted:
              marker = f'      - name: {name}'
              try:
                  i = src.index(marker)
              except ValueError:
                  raise SystemExit(f'missing v1 step: {name}')
              if i + 1 >= len(src) or src[i + 1].strip() != 'run: |':
                  raise SystemExit(f'malformed v1 step: {name}')
              i += 2
              block = []
              while i < len(src) and not src[i].startswith('      - name: '):
                  line = src[i]
                  if line.startswith('          '):
                      line = line[10:]
                  block.append(line)
                  i += 1
              chunks.append('\n'.join(block).rstrip() + '\n')

          prune = r'''python3 - <<'PY2'
          from pathlib import Path

          p = Path('src/frontend/parser_global.c')
          lines = p.read_text().splitlines(keepends=True)
          needle = 'minic_parser_replace_zero_bounded_string_literal_initializer'
          call_matches = [i for i, line in enumerate(lines) if needle in line]
          if len(call_matches) != 1:
              raise SystemExit(f'char-string helper call count={len(call_matches)}')
          call_i = call_matches[0]
          start_i = None
          for i in range(call_i, -1, -1):
              if 'if (field->is_array && minic_type_is_char_integer(field->type)' in lines[i]:
                  start_i = i
                  break
          if start_i is None:
              raise SystemExit('char-string backward branch start missing')
          indent = lines[start_i][:len(lines[start_i]) - len(lines[start_i].lstrip())]
          end_i = None
          for i in range(call_i, len(lines)):
              if lines[i].startswith(indent) and lines[i].strip() == '}':
                  end_i = i
                  break
          if end_i is None:
              raise SystemExit('char-string backward branch end missing')
          p.write_text(''.join(lines[:start_i] + lines[end_i + 1:]))
          PY2
          '''
          script = chunks[0] + '\n' + prune + '\n' + chunks[1] + '\n' + chunks[2]
          Path('/tmp/finalize-backward-v2.sh').write_text(script)
          PY
          bash -eux /tmp/finalize-backward-v2.sh
