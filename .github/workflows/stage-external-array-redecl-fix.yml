name: Stage External Array Redeclaration Fix

on: push

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/external-array-routing-redecl-fix
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euxo pipefail
          python3 tools/maintenance/stage_external_array_redecl_fix.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Validate
        run: |
          set -euxo pipefail
          make -j4 MODE=release BUILD_DIR=build/stage-external-array
          MINIC="$PWD/build/stage-external-array/bin/minic" BUILD_DIR="$PWD/build/stage-external-array" sh tests/compiler/c0/run-external-array-declarator-routing.sh
          make -j4 MODE=release BUILD_DIR=build/stage-external-array check-fast
          MINIC="$PWD/build/stage-external-array/bin/minic" BUILD_DIR="$PWD/build/stage-external-array" sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish product patch
        run: |
          set -euxo pipefail
          rm .github/workflows/stage-external-array-redecl-fix.yml
          rm tools/maintenance/stage_external_array_redecl_fix.py
          git config user.name "LiYang Dong"
          git config user.email "119646676+yituanxing@users.noreply.github.com"
          git add -A
          git commit -m "frontend: preserve array redeclaration compatibility"
          git push origin HEAD:staging/external-array-routing-redecl-fix
