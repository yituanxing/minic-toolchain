name: Core Pointer Arithmetic Rvalue 11 Productizer Active

on:
  pull_request:

permissions:
  contents: write

jobs:
  pointer-arith-rvalue-11:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized family
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M116_POINTER_ARITH_RVALUE_TYPE' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply pointer arithmetic rvalue canonicalization
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m116-pointer-arith-rvalue.py
          git diff --check
          grep -F 'M116_POINTER_ARITH_RVALUE_TYPE' src/core/core_lower.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/pointer-arith11-compiler

      - name: Run fast host regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/pointer-arith11-check

      - name: Replay all iomap_inline_data family TUs
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/pointer-arith11-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/pointer-arith11"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '380,381,382,383,384,385,386,435,437,443,444'
          replay_status=$?
          set -e
          printf 'CORE_POINTER_ARITH11_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 11 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 11 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/pointer-arith11')
          rows = json.loads((work / 'batch-results.json').read_text())
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if len(rows) != 11:
              raise SystemExit(f'expected 11 rows, got {len(rows)}')
          if summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f"pointer-arith11 ERROR/missing: error={summary['error']} missing={summary['preprocess_missing']}")
          remaining = [b for b in summary.get('blockers', []) if b.get('function') == 'iomap_inline_data']
          if remaining:
              raise SystemExit(f'old iomap_inline_data blocker remains: {remaining}')
          print(f"CORE_POINTER_ARITH11_ACCEPT pass={summary['pass']} unsupported={summary['unsupported']} error=0 selected=11")
          print('CORE_POINTER_ARITH11_NEW_FRONTIER ' + json.dumps(summary.get('blockers', [])[:16], sort_keys=True))
          print((work / 'progress-summary.txt').read_text())
          PY

      - name: Commit pointer arithmetic semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c
          git diff --cached --quiet && { echo 'no semantic changes to productize'; exit 1; }
          git commit -m 'core: canonicalize pointer arithmetic rvalues'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist pointer arithmetic cohort
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-pointer-arith11-${{ github.sha }}
          path: |
            build/pointer-arith11/batch-results.json
            build/pointer-arith11/frontier-summary.json
            build/pointer-arith11/progress-summary.json
            build/pointer-arith11/progress-summary.txt
            build/pointer-arith11/minic-stderr/**
          if-no-files-found: warn
