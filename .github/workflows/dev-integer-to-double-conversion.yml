name: Dev integer to double conversion patch

on:
  push:
    branches:
      - frontend/integer-to-double-conversion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/integer-to-double-conversion
          fetch-depth: 0
      - name: Apply exact compiler patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/frontend/ast.h",
              '''    MINIC_EXPRESSION_CAST,\n    MINIC_EXPRESSION_BITCAST,\n    MINIC_EXPRESSION_SUBSCRIPT,''',
              '''    MINIC_EXPRESSION_CAST,\n    MINIC_EXPRESSION_BITCAST,\n    MINIC_EXPRESSION_CONVERSION,\n    MINIC_EXPRESSION_SUBSCRIPT,''')

          replace_once(
              "src/frontend/type.c",
              '''bool minic_type_cast_compatible(MinicType target, MinicType source) {\n    if (minic_type_is_integer(target) && minic_type_is_integer(source)) {\n        return true;\n    }\n    return minic_type_is_pointer(target) && minic_type_is_pointer(source);\n}''',
              '''bool minic_type_cast_compatible(MinicType target, MinicType source) {\n    if (minic_type_is_integer(target) && minic_type_is_integer(source)) {\n        return true;\n    }\n    if (minic_type_is_double(target) && minic_type_is_integer(source)) {\n        return true;\n    }\n    return minic_type_is_pointer(target) && minic_type_is_pointer(source);\n}''')

          replace_once(
              "src/frontend/parser_statement.c",
              '''static bool expression_is_modifiable_lvalue(const MinicExpression *expression) {\n    return expression != NULL && expression->value_category == MINIC_VALUE_LVALUE &&\n           !minic_type_is_const(expression->type);\n}\n\nstatic bool parse_local_declarator''',
              '''static bool expression_is_modifiable_lvalue(const MinicExpression *expression) {\n    return expression != NULL && expression->value_category == MINIC_VALUE_LVALUE &&\n           !minic_type_is_const(expression->type);\n}\n\nstatic bool apply_assignment_conversion(MinicParser *parser,\n                                        MinicType target_type,\n                                        MinicExpressionId *expression_id) {\n    const MinicExpression *source;\n    MinicExpression conversion;\n    MinicExpressionId source_id;\n\n    if (parser == NULL || expression_id == NULL) {\n        return false;\n    }\n    source_id = *expression_id;\n    source = minic_c0_program_expression(parser->program, source_id);\n    if (source == NULL) {\n        minic_parser_error(parser, "invalid assignment conversion source");\n        return false;\n    }\n    if (minic_c0_assignment_compatible(parser->program, target_type, source_id)) {\n        return true;\n    }\n    if (!minic_type_is_double(target_type) || !minic_type_is_integer(source->type)) {\n        return true;\n    }\n\n    (void)memset(&conversion, 0, sizeof(conversion));\n    conversion.kind = MINIC_EXPRESSION_CAST;\n    conversion.span = source->span;\n    conversion.type = target_type;\n    conversion.value_category = MINIC_VALUE_RVALUE;\n    conversion.value.unary.operand = source_id;\n    return minic_parser_add_expression(parser, &conversion, expression_id);\n}\n\nstatic bool parse_local_declarator''')

          replace_once(
              "src/frontend/parser_statement.c",
              '''            !minic_parser_advance(parser) ||\n            !minic_parser_parse_expression(parser, &statement.expression, 0U)) {\n            return false;\n        }\n        initializer = minic_c0_program_expression(parser->program, statement.expression);\n        if (initializer == NULL ||''',
              '''            !minic_parser_advance(parser) ||\n            !minic_parser_parse_expression(parser, &statement.expression, 0U) ||\n            !apply_assignment_conversion(parser, local.type, &statement.expression)) {\n            return false;\n        }\n        initializer = minic_c0_program_expression(parser->program, statement.expression);\n        if (initializer == NULL ||''')

          replace_once(
              "src/frontend/parser_statement.c",
              '''    if (!minic_parser_advance(parser) ||\n        !minic_parser_parse_expression(parser, &statement.expression, 0U)) {\n        return false;\n    }\n    {\n        const MinicExpression *assigned_expression;''',
              '''    if (!minic_parser_advance(parser) ||\n        !minic_parser_parse_expression(parser, &statement.expression, 0U)) {\n        return false;\n    }\n    if (statement.kind == MINIC_STATEMENT_ASSIGN &&\n        !apply_assignment_conversion(parser, first_type, &statement.expression)) {\n        return false;\n    }\n    {\n        const MinicExpression *assigned_expression;''')

          replace_once(
              "src/frontend/parser_statement.c",
              '''        if (!minic_parser_parse_expression(parser, &statement.expression, 0U)) {\n            return false;\n        }\n        returned_expression = minic_c0_program_expression(parser->program, statement.expression);''',
              '''        if (!minic_parser_parse_expression(parser, &statement.expression, 0U) ||\n            !apply_assignment_conversion(parser, function->return_type, &statement.expression)) {\n            return false;\n        }\n        returned_expression = minic_c0_program_expression(parser->program, statement.expression);''')

          replace_once(
              "src/frontend/cast_normalization.c",
              '''    case MINIC_EXPRESSION_ADDRESS_OF:\n    case MINIC_EXPRESSION_DEREFERENCE:\n    case MINIC_EXPRESSION_BITCAST:\n    case MINIC_EXPRESSION_UNARY:''',
              '''    case MINIC_EXPRESSION_ADDRESS_OF:\n    case MINIC_EXPRESSION_DEREFERENCE:\n    case MINIC_EXPRESSION_BITCAST:\n    case MINIC_EXPRESSION_CONVERSION:\n    case MINIC_EXPRESSION_UNARY:''')

          replace_once(
              "src/frontend/cast_normalization.c",
              '''    operand_expression = &rewritten->expressions[mapped_operand];\n\n    if (minic_type_is_pointer(cast_expression->type) &&''',
              '''    operand_expression = &rewritten->expressions[mapped_operand];\n\n    if (minic_type_is_double(cast_expression->type) &&\n        minic_type_is_integer(operand_expression->type)) {\n        MinicExpression conversion;\n\n        (void)memset(&conversion, 0, sizeof(conversion));\n        conversion.kind = MINIC_EXPRESSION_CONVERSION;\n        conversion.span = cast_expression->span;\n        conversion.type = cast_expression->type;\n        conversion.value_category = MINIC_VALUE_RVALUE;\n        conversion.value.unary.operand = mapped_operand;\n        return minic_c0_program_add_expression(rewritten, &conversion, normalized_id);\n    }\n\n    if (minic_type_is_pointer(cast_expression->type) &&''')

          replace_once(
              "src/frontend/ast_verifier.c",
              '''    case MINIC_EXPRESSION_BITCAST:\n        operand = expression_before(program, expression->value.unary.operand, expression_index);\n        return form == MINIC_C0_AST_NORMALIZED && operand != NULL &&\n               expression->value_category == MINIC_VALUE_RVALUE &&\n               minic_type_is_pointer(expression->type) &&\n               ((minic_type_is_pointer(operand->type) &&\n                 minic_type_cast_compatible(expression->type, operand->type)) ||\n                expression_is_integer_zero(operand));\n    case MINIC_EXPRESSION_SUBSCRIPT:''',
              '''    case MINIC_EXPRESSION_BITCAST:\n        operand = expression_before(program, expression->value.unary.operand, expression_index);\n        return form == MINIC_C0_AST_NORMALIZED && operand != NULL &&\n               expression->value_category == MINIC_VALUE_RVALUE &&\n               minic_type_is_pointer(expression->type) &&\n               ((minic_type_is_pointer(operand->type) &&\n                 minic_type_cast_compatible(expression->type, operand->type)) ||\n                expression_is_integer_zero(operand));\n    case MINIC_EXPRESSION_CONVERSION:\n        operand = expression_before(program, expression->value.unary.operand, expression_index);\n        return form == MINIC_C0_AST_NORMALIZED && operand != NULL &&\n               expression->value_category == MINIC_VALUE_RVALUE &&\n               minic_type_is_double(expression->type) && minic_type_is_integer(operand->type);\n    case MINIC_EXPRESSION_SUBSCRIPT:''')

          replace_once(
              "src/target/riscv64/codegen_expression.c",
              '''    case MINIC_EXPRESSION_BITCAST:\n        return minic_riscv64_emit_expression(\n            file, program, function, expression->value.unary.operand);\n    case MINIC_EXPRESSION_ADDRESS_OF:''',
              '''    case MINIC_EXPRESSION_BITCAST:\n        return minic_riscv64_emit_expression(\n            file, program, function, expression->value.unary.operand);\n    case MINIC_EXPRESSION_CONVERSION: {\n        const MinicExpression *operand;\n        const char *instruction;\n\n        operand = minic_c0_program_expression(program, expression->value.unary.operand);\n        if (operand == NULL || !minic_type_is_double(expression->type) ||\n            !minic_type_is_integer(operand->type)) {\n            return false;\n        }\n        if (minic_type_is_long_integer(operand->type)) {\n            instruction = minic_type_is_unsigned_integer(operand->type) ? "fcvt.d.lu" : "fcvt.d.l";\n        } else {\n            instruction = minic_type_is_unsigned_integer(operand->type) ? "fcvt.d.wu" : "fcvt.d.w";\n        }\n        return minic_riscv64_emit_expression(\n                   file, program, function, expression->value.unary.operand) &&\n               fprintf(file,\n                       "  %s ft0, a0\\n"\n                       "  fmv.x.d a0, ft0\\n",\n                       instruction) >= 0;\n    }\n    case MINIC_EXPRESSION_ADDRESS_OF:''')

          cast_fixture = Path("tests/compiler/c0/invalid_cast_integer_to_double.c")
          if not cast_fixture.exists():
              raise SystemExit("missing old int-to-double cast boundary fixture")
          cast_target = Path("tests/compiler/c0/cast_integer_to_double.c")
          if cast_target.exists():
              raise SystemExit("cast_integer_to_double.c already exists")
          cast_fixture.rename(cast_target)
          cast_target.write_text('''double convert_to_double(int value)\n{\n    return (double)value;\n}\n\nint main(void)\n{\n    return 0;\n}\n''')

          replace_once(
              "tests/compiler/c0/run-cast-expressions.sh",
              '''compile_success cast_plain_char\n\n"$host_cc" -E -P -x c''',
              '''compile_success cast_plain_char\ncompile_success cast_integer_to_double\ngrep -F "  fcvt.d.w ft0, a0" "$work/cast_integer_to_double.s" >/dev/null\nprintf '%s\\n' "PASS compiler/c0/cast_integer_to_double_lowering"\n\n"$host_cc" -E -P -x c''')

          replace_once(
              "tests/compiler/c0/run-cast-expressions.sh",
              '''expect_failure \\\n    invalid_cast_integer_to_float \\\n    "unsupported cast between these types"\nexpect_failure \\\n    invalid_cast_integer_to_double \\\n    "unsupported cast between these types"\nexpect_failure \\\n    invalid_cast_assignment_target''',
              '''expect_failure \\\n    invalid_cast_integer_to_float \\\n    "unsupported cast between these types"\nexpect_failure \\\n    invalid_cast_assignment_target''')

          test = Path("tests/programs/c0/integer_to_double_conversion.c")
          if test.exists():
              raise SystemExit(f"{test}: already exists")
          test.write_text('''static double return_integer_as_double(int value)\n{\n    return value;\n}\n\nstatic int matches_bytes(unsigned char *bytes,\n                         int byte2,\n                         int byte3,\n                         int byte4,\n                         int byte5,\n                         int byte6,\n                         int byte7)\n{\n    if ((bytes[0] != 0) || (bytes[1] != 0))\n    {\n        return 0;\n    }\n    return (bytes[2] == byte2) && (bytes[3] == byte3) && (bytes[4] == byte4) &&\n           (bytes[5] == byte5) && (bytes[6] == byte6) && (bytes[7] == byte7);\n}\n\nint main(void)\n{\n    int signed_word = -3;\n    unsigned int unsigned_word = 0;\n    long signed_long = -5;\n    unsigned long unsigned_long = 0;\n    double word_value = signed_word;\n    double unsigned_word_value;\n    double long_value = (double)signed_long;\n    double unsigned_long_value;\n    double returned_value;\n    unsigned char *bytes = (unsigned char *)&word_value;\n\n    if (!matches_bytes(bytes, 0, 0, 0, 0, 8, 192))\n    {\n        return 1;\n    }\n\n    unsigned_word = unsigned_word - 1;\n    unsigned_word_value = unsigned_word;\n    bytes = (unsigned char *)&unsigned_word_value;\n    if (!matches_bytes(bytes, 224, 255, 255, 255, 239, 65))\n    {\n        return 2;\n    }\n\n    bytes = (unsigned char *)&long_value;\n    if (!matches_bytes(bytes, 0, 0, 0, 0, 20, 192))\n    {\n        return 3;\n    }\n\n    unsigned_long = unsigned_long - 1;\n    unsigned_long_value = unsigned_long;\n    bytes = (unsigned char *)&unsigned_long_value;\n    if (!matches_bytes(bytes, 0, 0, 0, 0, 240, 67))\n    {\n        return 4;\n    }\n\n    returned_value = return_integer_as_double(7);\n    bytes = (unsigned char *)&returned_value;\n    if (!matches_bytes(bytes, 0, 0, 0, 0, 28, 64))\n    {\n        return 5;\n    }\n    return 0;\n}\n''')

          manifest = Path("tests/programs/c0/manifest.txt")
          text = manifest.read_text()
          if "integer_to_double_conversion\n" in text:
              raise SystemExit("manifest already contains integer_to_double_conversion")
          if not text.endswith("\n"):
              raise SystemExit("manifest must end in newline")
          manifest.write_text(text + "integer_to_double_conversion\n")
          PY

          if ! command -v clang-format-18 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang-format-18
          fi
          clang-format-18 -i \
            src/frontend/ast.h \
            src/frontend/type.c \
            src/frontend/parser_statement.c \
            src/frontend/cast_normalization.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_expression.c \
            tests/compiler/c0/cast_integer_to_double.c \
            tests/programs/c0/integer_to_double_conversion.c

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-integer-to-double-conversion.yml
          git add -A
          git diff --cached --check
          git commit -m "frontend: add integer to double conversion"
          git push origin HEAD:frontend/integer-to-double-conversion
