name: PR125 Materialize Static Global Section
on:
  push:
    branches: [agent/static-global-object-metadata-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize static global section metadata
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr125-materialize.py
          chmod +x tests/compiler/c0/run-static-global-object-section.sh
          clang-format-18 -i \
            src/frontend/parser_function.c \
            tests/compiler/c0/static_global_object_section.c \
            tests/compiler/c0/invalid_static_global_alignment.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr125-focused" \
            sh tests/compiler/c0/run-static-global-object-section.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr125-materialize.py .github/workflows/pr125-materialize-static-section.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): persist static global section metadata'
          git push origin HEAD:agent/static-global-object-metadata-v0
