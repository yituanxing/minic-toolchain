name: Core M134 Unreachable Tail Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Stage M133 candidate when not yet productized
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! grep -Fq 'M133_CONSTANT_TRUE_LOOP_REACHABILITY' src/core/core_lower.c; then
            python3 tools/ci/apply-m133-constant-true-loop-reachability.py
          fi

      - name: Apply M134 unreachable-tail census
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m134-unreachable-tail-census.py
          git diff --check
          grep -Fq 'M134_UNREACHABLE_TAIL_CENSUS' src/core/core_lower.c

      - name: Build exact diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m134-census-compiler

      - name: Replay six silent/body-phase frontier TUs
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m134-census-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m134-census"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '95,130,239,288,348,414'
          replay_status=$?
          set -e
          printf 'CORE_M134_CENSUS_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m134-census')
          rows=json.loads((work/'batch-results.json').read_text())
          for row in rows:
              p=work/'minic-stderr'/f"{row['input']}.stderr"
              text=p.read_text(errors='replace') if p.exists() else ''
              hits=[line for line in text.splitlines() if 'CORE_M134_UNREACHABLE_TAIL' in line]
              print(f"CORE_M134_INDEX_{row['index']} status={row['status']} function={row.get('message','')}")
              for hit in hits:
                  print(hit)
          PY

      - name: Persist M134 census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m134-unreachable-tail-${{ github.sha }}
          path: build/m134-census/**
          if-no-files-found: warn
