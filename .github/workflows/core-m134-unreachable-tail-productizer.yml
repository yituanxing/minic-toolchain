name: Core M134 Unreachable Tail Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M134
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M134_UNREACHABLE_TAIL_OWNER' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M134 unreachable-tail owner
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m134-unreachable-tail-owner.py
          git diff --check
          grep -Fq 'M134_UNREACHABLE_TAIL_OWNER' src/core/core_lower.c
          test -s tests/compiler/c0/m134_unreachable_tail.c
          test -s tests/compiler/c0/m134_unreachable_nested_label.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m134-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m134-product-check

      - name: Run isolated M134 strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m134-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m134-product-regression"
          mkdir -p "$work"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m134_unreachable_tail.c -o "$work/unreachable-tail.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/unreachable-tail.i" -o "$work/unreachable-tail.s"
          grep -F 'unreachable_expression:' "$work/unreachable-tail.s" >/dev/null
          grep -F 'unreachable_if:' "$work/unreachable-tail.s" >/dev/null
          grep -F 'unreachable_while:' "$work/unreachable-tail.s" >/dev/null
          grep -F 'top_level_label_reentry:' "$work/unreachable-tail.s" >/dev/null

          cc -E -P -std=gnu11 -x c tests/compiler/c0/m134_unreachable_nested_label.c -o "$work/nested-label.i"
          set +e
          MINIC_CORE_IR=strict "$compiler" -S "$work/nested-label.i" -o "$work/nested-label.s" \
            >"$work/nested-label.stdout" 2>"$work/nested-label.stderr"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F 'Core IR shadow lowering failed for function' "$work/nested-label.stderr" >/dev/null
          printf '%s\n' 'CORE_M134_STRICT_REGRESSION unreachable-tail=PASS nested-label=FAIL-CLOSED'

      - name: Replay M134 focused frontier
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m134-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m134-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '95,130,239,288,348'
          replay_status=$?
          set -e
          printf 'CORE_M134_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 15 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m134-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 5 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M134 focused ERROR/missing: {summary}')
          by_index={int(row['index']):row for row in rows}
          for index in (130,239,288,348):
              row=by_index[index]
              print(f"CORE_M134_INDEX_{index} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
              if row['status'] != 'PASS':
                  raise SystemExit(f'M134 expected proven unreachable-tail TU PASS at index {index}: {row}')
          probe=by_index[95]
          print(f"CORE_M134_INDEX_95_PROBE status={probe['status']} line={probe.get('first_error_line')} message={probe.get('message')}")
          print('CORE_M134_PRODUCT_FOCUSED selected=5 required_pass=4 error=0 probe=95')
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m134-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m134-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M134_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m134-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M134 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 483:
              raise SystemExit(f"M134 produced no strict500 gain: pass={summary['pass']} baseline=483")
          print(f"CORE_M134_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M134 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
            tests/compiler/c0/m134_unreachable_tail.c \
            tests/compiler/c0/m134_unreachable_nested_label.c
          git diff --cached --quiet && { echo 'no M134 semantic changes'; exit 1; }
          git commit -m 'core: skip unreachable non-label statement tails'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M134 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m134-unreachable-tail-${{ github.sha }}
          path: |
            build/m134-product-regression/**
            build/m134-product-focused/**
            build/m134-product-full500/**
          if-no-files-found: warn
