name: Diagnostic External Pointer First100 Pair V1

on:
  push:
    branches:
      - diagnostic/external-pointer-first100-pair-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore diagnostic batch probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh \
            > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Build compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/pair-compiler

      - name: Materialize paired failing translation units
        shell: bash
        run: |
          set -Eeuo pipefail
          for spec in '20:reset' '32:vdso'; do
            offset=${spec%%:*}
            tag=${spec##*:}
            set +e
            MINIC="$GITHUB_WORKSPACE/build/pair-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/pair-$tag" \
            LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
            CROSS_COMPILE=riscv64-linux-gnu- \
            LINUX_BATCH_OFFSET="$offset" LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
              sh tests/external/linux/batch_probe.sh
            status=$?
            set -e
            cat "build/pair-$tag/batch-summary.txt"
            test "$status" -eq 1
          done

      - name: Print exact initializer contexts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cases = [
              ('reset', Path('build/pair-reset/kbuild/arch/riscv/kernel/reset.i'), 16026),
              ('vdso', Path('build/pair-vdso/kbuild/arch/riscv/kernel/vdso.i'), 47971),
          ]
          for tag, path, target in cases:
              lines = path.read_text(errors='replace').splitlines()
              print(f'{tag.upper()}_CONTEXT_BEGIN')
              lo = max(0, target - 1 - 45)
              hi = min(len(lines), target - 1 + 46)
              for i in range(lo, hi):
                  print(f'{i+1}: {lines[i]}')
              print(f'TARGET_LINE={lines[target-1]}')
              # Find the nearest likely declaration/initializer start before the reported token.
              start = max(0, target - 1 - 200)
              for i in range(target - 1, start - 1, -1):
                  s = lines[i].strip()
                  if '=' in s and ';' not in s.split('=', 1)[0]:
                      start = i
                      break
              print(f'{tag.upper()}_DECL_WINDOW_BEGIN')
              for i in range(start, min(len(lines), target - 1 + 80)):
                  print(f'{i+1}: {lines[i]}')
              print(f'{tag.upper()}_DECL_WINDOW_END')
              print(f'{tag.upper()}_CONTEXT_END')
          PY
