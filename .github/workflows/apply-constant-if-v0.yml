name: Apply Constant If V0

on:
  push:
    branches:
      - agent/busybox-constant-if-v1

permissions:
  contents: write

concurrency:
  group: apply-constant-if-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/busybox-constant-if-v1
          fetch-depth: 0

      - name: Install RV64 runtime prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Apply constant-if Core patch
        run: python3 tools/dev/patch-busybox-constant-if-v1.py

      - name: Build current Mini toolchain
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/constant-if-v0 all

      - name: Validate live-function constant-if pruning
        run: |
          MINIC="$GITHUB_WORKSPACE/build/constant-if-v0/bin/minic" \
          MINIAS="$GITHUB_WORKSPACE/build/constant-if-v0/bin/minic-as" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/constant-if-v0" \
          RISCV_LD=riscv64-linux-gnu-ld \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/driver/run-constant-if-link-v0.sh

      - name: Commit validated Core patch
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/core_lower.c
          git diff --cached --quiet && exit 0
          git commit -m 'core: prune compile-time constant if branches'
          git push origin HEAD:agent/busybox-constant-if-v1
