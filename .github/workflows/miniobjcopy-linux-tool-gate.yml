name: MiniObjcopy Linux Tool Gate

on:
  push:
    branches:
      - "toolchain/miniobjcopy-elf-a1"
      - "toolchain/minicstrip-m0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-user bc bison flex libssl-dev libelf-dev make curl xz-utils file

      - name: Build toolchain and focused gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool check-miniobjcopy-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool check-miniobjcopy-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool check-miniobjcopy-a2
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool check-minild-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool check-minild-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool check-minild-a2
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-linux-tool check-minild-a3

      - name: Prepare Linux 6.6.143
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/miniobjcopy-linux-tool-work"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz \
            -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig

      - name: Install MiniLD and MiniObjcopy wrappers
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/miniobjcopy-linux-tool-work"

          ld_wrapper="$work/riscv64-linux-gnu-ld-static-final"
          cat >"$ld_wrapper" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${MINILD:?MINILD is not set}"
          : "${MINILD_TRACE:?MINILD_TRACE is not set}"
          args=("$@")
          output=
          for ((i=0; i<${#args[@]}; ++i)); do
            if [[ "${args[i]}" == "-o" && $((i+1)) -lt ${#args[@]} ]]; then
              output="${args[i+1]}"
              break
            fi
          done
          case "$output" in
            .tmp_vmlinux.kallsyms1|.tmp_vmlinux.kallsyms2|vmlinux)
              {
                printf 'minild'
                printf ' %q' "$@"
                printf '\n'
              } >>"$MINILD_TRACE"
              exec "$MINILD" "$@"
              ;;
            *)
              {
                printf 'gnu-ld'
                printf ' %q' "$@"
                printf '\n'
              } >>"$MINILD_TRACE"
              exec /usr/bin/riscv64-linux-gnu-ld "$@"
              ;;
          esac
          SH
          chmod +x "$ld_wrapper"

          objcopy_wrapper="$work/riscv64-linux-gnu-objcopy-mini"
          cat >"$objcopy_wrapper" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${MINIOBJCOPY:?MINIOBJCOPY is not set}"
          : "${MINIOBJCOPY_TRACE:?MINIOBJCOPY_TRACE is not set}"
          {
            printf 'miniobjcopy'
            printf ' %q' "$@"
            printf '\n'
          } >>"$MINIOBJCOPY_TRACE"
          exec "$MINIOBJCOPY" "$@"
          SH
          chmod +x "$objcopy_wrapper"

          : >"$work/minild.trace"
          : >"$work/miniobjcopy.trace"

      - name: Build Linux Image with MiniObjcopy everywhere
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/miniobjcopy-linux-tool-work"
          src="$work/linux-6.6.143"
          out="$work/out"
          ld_wrapper="$work/riscv64-linux-gnu-ld-static-final"
          objcopy_wrapper="$work/riscv64-linux-gnu-objcopy-mini"

          export MINILD="$GITHUB_WORKSPACE/build/miniobjcopy-linux-tool/bin/minic-ld"
          export MINILD_TRACE="$work/minild.trace"
          export MINIOBJCOPY="$GITHUB_WORKSPACE/build/miniobjcopy-linux-tool/bin/minic-objcopy"
          export MINIOBJCOPY_TRACE="$work/miniobjcopy.trace"

          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            LD="$ld_wrapper" OBJCOPY="$objcopy_wrapper" -j4 Image \
            >"$work/kbuild.log" 2>&1
          status=$?
          set -e

          if test "$status" -ne 0; then
            echo "MINIOBJCOPY_LINUX_TOOL_FRONTIER=FAIL status=$status" >&2
            echo "--- last objcopy calls ---" >&2
            tail -n 40 "$work/miniobjcopy.trace" >&2 || true
            echo "--- kbuild tail ---" >&2
            tail -n 160 "$work/kbuild.log" >&2 || true
            exit "$status"
          fi

          test -s "$out/vmlinux"
          test -s "$out/arch/riscv/boot/Image"
          test "$(grep -c '^minild ' "$work/minild.trace")" -eq 3

          calls=$(grep -c '^miniobjcopy ' "$work/miniobjcopy.trace")
          test "$calls" -gt 0
          grep -q -- '-O binary' "$work/miniobjcopy.trace"
          grep -q -- '-S' "$work/miniobjcopy.trace"
          grep -q -- '-G __vdso_' "$work/miniobjcopy.trace"

          image_bytes=$(stat -c %s "$out/arch/riscv/boot/Image")
          image_sha=$(sha256sum "$out/arch/riscv/boot/Image" | awk '{print $1}')
          printf 'MINIOBJCOPY_LINUX_TOOL=PASS kernel=6.6.143 objcopy_calls=%s minild_final_calls=3 image_bytes=%s image_sha256=%s\n' \
            "$calls" "$image_bytes" "$image_sha"

      - name: Preserve Linux MiniObjcopy frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniobjcopy-linux-tool-frontier
          path: |
            build/miniobjcopy-linux-tool-work/miniobjcopy.trace
            build/miniobjcopy-linux-tool-work/minild.trace
            build/miniobjcopy-linux-tool-work/kbuild.log
            build/miniobjcopy-linux-tool-work/out/arch/riscv/kernel/vdso/vdso.so
            build/miniobjcopy-linux-tool-work/out/arch/riscv/kernel/vdso/vdso.so.dbg
            build/miniobjcopy-linux-tool-work/out/arch/riscv/boot/Image
            build/miniobjcopy-linux-tool-work/out/vmlinux
          if-no-files-found: ignore
          retention-days: 3
