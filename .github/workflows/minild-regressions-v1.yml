name: MiniLD A0-A6 Regressions V1

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minild-regressions-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 linker and dynamic runtime oracles
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-riscv64-cross libc6-dev-riscv64-cross qemu-user

      - name: Build current Mini toolchain once
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 all
          test -x build/minild-regressions-v1/bin/minic-ld

      - name: Validate shared ELF writer reader and linker-script contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minielf-reader-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minias-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-script-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-script-a1

      - name: Validate MiniLD static A0-A3 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-a2
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-a3

      - name: Validate MiniLD dynamic A4-A6 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-a4
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-a5
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-regressions-v1 check-minild-a6

      - name: Validate MiniLD section GC contract
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/minild-regressions-v1/bin/minic" \
          MINIAS="$GITHUB_WORKSPACE/build/minild-regressions-v1/bin/minic-as" \
          MINILD="$GITHUB_WORKSPACE/build/minild-regressions-v1/bin/minic-ld" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/minild-regressions-v1" \
          RISCV_READELF=riscv64-linux-gnu-readelf \
          RISCV_NM=riscv64-linux-gnu-nm \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/linker/run-gc-v0.sh

      - name: Publish canonical verdict
        run: echo "MINILD_REGRESSIONS_V1=PASS elf-reader=PASS et-rel-writer=PASS minias=A0 scripts=A0-A1 static=A0-A3 dynamic=A4-A6 gc=PASS"
