name: Materialize precise local function-pointer declarator

on:
  push:
    branches:
      - staging/local-function-pointer-declarator-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize product delta
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-local-function-pointer-declarator-v2.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and focused validation
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/local-function-pointer-v2
          MINIC="$GITHUB_WORKSPACE/build/local-function-pointer-v2/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/local-function-pointer-v2-shared" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-shared-function-declarator.sh
          MINIC="$GITHUB_WORKSPACE/build/local-function-pointer-v2/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/local-function-pointer-v2-for-decl" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-for-declaration-initializers.sh
          make check-fast

      - name: Commit materialized product files
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/frontend/parser_statement.c \
            tests/compiler/c0/shared_function_declarator.c \
            tests/compiler/c0/run-shared-function-declarator.sh
          git commit -m 'feat: share direct local function-pointer declarators [materialized v2]'
          git push origin HEAD:staging/local-function-pointer-declarator-v2
