name: Agent Offsetof Layout Query

on:
  push:
    branches:
      - refactor/offsetof-layout-query-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-offsetof-layout-query-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: refactor/offsetof-layout-query-v1
          fetch-depth: 0

      - name: Materialize narrow ownership cut
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_offsetof_layout_query_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and run focused gates
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/offsetof-layout-query
          MINIC="$GITHUB_WORKSPACE/build/offsetof-layout-query/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/offsetof-layout-query-focused" \
            sh tests/compiler/c0/run-builtin-offsetof.sh
          make -j4 MODE=release BUILD_DIR=build/offsetof-layout-query check-fast

      - name: Publish generated product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git add \
            src/frontend/ast.h \
            src/frontend/parser_expression.c \
            src/frontend/const_eval.c \
            src/target/riscv64/codegen_expression.c \
            tests/compiler/c0/run-builtin-offsetof.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            printf '%s\n' 'PASS offsetof/layout-query staging already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: keep offsetof layout queries semantic' \
            -m 'Represent promoted-member offsetof as a sum of field-identity query leaves and array indexing as index * sizeof(type). Remove target-derived anonymous-prefix bytes from the AST so Parser no longer performs DataLayout work; ConstEval and RV64 resolve each field query through the canonical layout owner.'
          git push origin HEAD:refactor/offsetof-layout-query-v1
