name: Linux Runtime RCU Softirq Rest Init V4

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-rcu-owner-v0.yml"
      - "tools/ci/linux-runtime-rest-init-frontier-v0.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-rcu-softirq-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rcu-softirq-owner-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified fixtures
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-rcu-owner-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -Fx 'apply-riscv64-core-object-slot-reuse-v0.py' "$ev/profile/minic-profile.txt"
          echo 'RUNTIME_OWNER_PROFILE=PASS slot_reuse=current'

      - name: Capture cached kallsyms owner
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          test -s "$out/kernel/kallsyms.o"
          cp "$out/kernel/kallsyms.o" "$ev/kallsyms.before.o"
          riscv64-linux-gnu-objdump -dr "$ev/kallsyms.before.o" >"$ev/kallsyms.before.objdump.txt"
          riscv64-linux-gnu-nm -an "$ev/kallsyms.before.o" >"$ev/kallsyms.before.nm.txt"
          echo 'KALLSYMS_CONFIG_BEGIN'
          grep -E '^CONFIG_KALLSYMS|^# CONFIG_KALLSYMS' "$out/.config" || true
          echo 'KALLSYMS_CONFIG_END'

      - name: Refresh certified runtime owners through kallsyms
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-rcu-owner-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$out/$pi_base.minic-stage2.s" >/dev/null
          echo 'PI_OWNER_REFRESH=PASS local_string=lla'

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock-debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build-utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build-policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log
          refresh_obj kernel/kallsyms.o kallsyms-refresh.log

          cp "$out/kernel/kallsyms.o" "$ev/kallsyms.after.o"
          cp "$out/kernel/kallsyms.minic-stage2.s" "$ev/kallsyms.minic-stage2.s"
          riscv64-linux-gnu-objdump -dr "$ev/kallsyms.after.o" >"$ev/kallsyms.after.objdump.txt"
          riscv64-linux-gnu-nm -an "$ev/kallsyms.after.o" >"$ev/kallsyms.after.nm.txt"

          python3 - "$ev" <<'PY'
          import re, sys
          from pathlib import Path
          ev = Path(sys.argv[1])
          for tag in ('before', 'after'):
              lines=(ev/f'kallsyms.{tag}.objdump.txt').read_text(errors='replace').splitlines()
              start=next((i for i,l in enumerate(lines) if '<get_symbol_pos>:' in l), None)
              print(f'KALLSYMS_{tag.upper()}_FOUND={int(start is not None)}')
              if start is None:
                  continue
              end=next((i for i in range(start+1,len(lines)) if re.match(r'^\s*[0-9a-f]+ <[^>]+>:$', lines[i]) and '<.L' not in lines[i]), min(len(lines),start+320))
              body=lines[start:end]
              print(f'KALLSYMS_{tag.upper()}_GET_SYMBOL_POS_BEGIN')
              print('\n'.join(body))
              print(f'KALLSYMS_{tag.upper()}_GET_SYMBOL_POS_END')
              for line in body:
                  m=re.match(r'^\s*([0-9a-f]+):.*\bebreak\b', line)
                  if m:
                      print(f'KALLSYMS_{tag.upper()}_EBREAK_OFFSET=0x{int(m.group(1),16):x}')
          PY

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"
          echo 'FRONTIER_SYMBOLS_BEGIN'
          grep -E '[[:space:]][Tt][[:space:]]+(console_init|fork_init|arch_call_rest_init|get_symbol_pos)$' "$ev/early/nm.txt" || true
          echo 'FRONTIER_SYMBOLS_END'

      - name: Execute QEMU current init-IRQ frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-init-irq-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Execute and diagnose QEMU fork-init frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-rcu-owner-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-rest-init-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch-rest" --timeout-ms 30000 --poll-ms 100 | tee "$ev/watch-rest.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e

          cat "$ev/watch-rest/frontier-summary.txt" || true
          echo 'QEMU_REST_CONSOLE_TAIL_BEGIN'
          tail -n 160 "$ev/watch-rest/qemu.console.log" || true
          echo 'QEMU_REST_CONSOLE_TAIL_END'

          echo 'QEMU_REST_INTERRUPT_MAP_BEGIN'
          python3 - "$ev/early/nm.txt" "$ev/watch-rest/qemu.interrupts.txt" <<'PY'
          import bisect, re, sys
          from pathlib import Path
          nm_path = Path(sys.argv[1]); int_path = Path(sys.argv[2])
          symbols=[]
          for line in nm_path.read_text(errors='replace').splitlines():
              p=line.split()
              if len(p)<3: continue
              try: addr=int(p[0],16)
              except ValueError: continue
              symbols.append((addr,p[2]))
          symbols.sort(); addrs=[x[0] for x in symbols]
          def resolve(addr):
              i=bisect.bisect_right(addrs,addr)-1
              if i<0: return '?',0
              base,name=symbols[i]; return name,addr-base
          events=[]; rx=re.compile(r'epc:0x([0-9a-fA-F]+).*desc=(\S+)')
          for line in int_path.read_text(errors='replace').splitlines():
              m=rx.search(line)
              if m: events.append((int(m.group(1),16),m.group(2)))
          for epc,desc in events[-48:]:
              name,off=resolve(epc); print(f'INTERRUPT_MAP desc={desc} epc=0x{epc:x} symbol={name}+0x{off:x}')
          seen=set()
          for epc,desc in events:
              if desc!='breakpoint' or epc in seen: continue
              seen.add(epc); name,off=resolve(epc)
              print(f'BREAKPOINT_MAP epc=0x{epc:x} symbol={name}+0x{off:x}')
          PY
          echo 'QEMU_REST_INTERRUPT_MAP_END'
          exit "$rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-rcu-softirq-rest-init-v4-${{ github.sha }}
          path: |
            build/linux-runtime-rcu-owner-v0/profile/patch.log
            build/linux-runtime-rcu-owner-v0/profile/minic-profile.txt
            build/linux-runtime-rcu-owner-v0/*-refresh.log
            build/linux-runtime-rcu-owner-v0/kallsyms.*
            build/linux-runtime-rcu-owner-v0/early/nm.txt
            build/linux-runtime-rcu-owner-v0/watch/frontier-result.json
            build/linux-runtime-rcu-owner-v0/watch/frontier-summary.txt
            build/linux-runtime-rcu-owner-v0/watch/watch-result.json
            build/linux-runtime-rcu-owner-v0/watch/qemu.interrupts.txt
            build/linux-runtime-rcu-owner-v0/watch-rest/frontier-result.json
            build/linux-runtime-rcu-owner-v0/watch-rest/frontier-summary.txt
            build/linux-runtime-rcu-owner-v0/watch-rest/watch-result.json
            build/linux-runtime-rcu-owner-v0/watch-rest/qemu.console.log
            build/linux-runtime-rcu-owner-v0/watch-rest/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
