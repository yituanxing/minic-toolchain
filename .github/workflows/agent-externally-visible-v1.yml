name: Agent Externally Visible V1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0
      - name: Generate externally visible source
        run: python3 tools/dev/agent_externally_visible_v1.py
      - name: Format generated source
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-externally-visible
      - name: Run prefix function attribute focused contract
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-externally-visible/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-externally-visible-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-prefix-function-attributes.sh
      - name: Run Foundation focused contracts
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-externally-visible/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-externally-visible-foundation" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh
      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-externally-visible check-fast
      - name: Publish generated source to scratch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/attribute.h \
                  src/frontend/attribute.c \
                  tests/compiler/c0/gnu_prefix_function_attributes.c \
                  tests/compiler/c0/run-gnu-prefix-function-attributes.sh
          git commit -m 'frontend: classify GNU externally visible attributes'
          git push --force origin HEAD:agent/externally-visible-v1
