name: Productize Static Local Prefix Attributes V1
on:
  push:
    branches: [product/static-local-prefix-attributes-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/static-local-prefix-attributes-v1
          fetch-depth: 0
      - name: Apply validate and persist
        shell: bash
        run: |
          set -u
          out=diagnostics/static-local-prefix-attributes-v1
          mkdir -p "$out"
          status=0
          stage=materialize
          mat=tools/dev/.productize-static-local-prefix-attributes-v1.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-static-local-prefix-attributes-v1.py > "$mat" 2>"$out/materialize-fetch.txt" || status=$?
          if [ "$status" -eq 0 ]; then python3 "$mat" >"$out/materialize.txt" 2>&1 || status=$?; fi
          rm -f "$mat"
          if [ "$status" -eq 0 ]; then
            stage=regression-source
            cat > tests/compiler/c0/static_local_prefix_attributes.c <<'EOF'
          struct key { long value; };
          static long run(void) {
              static __attribute__((__unused__)) struct key key_value;
              static __attribute__((unused)) long scalar;
              return key_value.value + scalar;
          }
          int main(void) { return (int)run(); }
          EOF
            cat > tests/compiler/c0/run-static-local-prefix-attributes.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/static-local-prefix-attributes
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/static_local_prefix_attributes.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
            chmod +x tests/compiler/c0/run-static-local-prefix-attributes.sh
            cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-static-local-prefix-attributes.sh"
          EOF
            clang-format-18 -i src/frontend/parser_statement.c tests/compiler/c0/static_local_prefix_attributes.c >"$out/format.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=build
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/static-local-prefix-v1 >"$out/build.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=focused
            MINIC="$GITHUB_WORKSPACE/build/static-local-prefix-v1/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/static-local-prefix-v1" \
              sh -x tests/compiler/c0/run-static-local-prefix-attributes.sh >"$out/focused.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=check-fast
            make -j4 check-fast MODE=release BUILD_DIR=build/static-local-prefix-v1-fast >"$out/check-fast.txt" 2>&1 || status=$?
          fi
          printf 'final_stage=%s\nfinal_status=%s\n' "$stage" "$status" > "$out/status.txt"
          git diff -- src/frontend/parser_statement.c tests/compiler/c0 > "$out/product.patch" || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -eq 0 ]; then
            git rm .github/workflows/productize-static-local-prefix-attributes-v1.yml
            rm -rf "$out"
            git add src/frontend/parser_statement.c tests/compiler/c0/static_local_prefix_attributes.c tests/compiler/c0/run-static-local-prefix-attributes.sh tests/compiler/c0/run.sh
            git commit -m 'frontend: accept GNU attributes after static local storage'
          else
            git add "$out"
            git commit -m 'diagnostic: record static-local prefix attribute failure' || true
          fi
          git push origin HEAD:product/static-local-prefix-attributes-v1
          exit 0
