name: Productize Backward Static Record Overlay V1
on:
  push:
    branches: [product/backward-static-record-overlay-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/backward-static-record-overlay-v1
          fetch-depth: 0
      - name: Apply validate and persist
        shell: bash
        run: |
          set -u
          out=diagnostics/backward-static-record-overlay-v1
          mkdir -p "$out"
          status=0
          stage=patch
          python3 - <<'PY' >"$out/patch.txt" 2>&1 || status=$?
          from pathlib import Path
          p=Path('src/frontend/parser_global.c')
          s=p.read_text()
          marker='''static bool parse_static_record_constant(MinicParser *parser,\n                                         MinicGlobalObjectId object_id,\n                                         const MinicRecord *record) {\n'''
          helper=r'''static bool overwrite_static_zero_record_constant(MinicParser *parser,
                                                  MinicGlobalObjectId object_id,
                                                  const MinicRecord *record,
                                                  size_t record_base_slot);

static bool overwrite_static_zero_field_value(MinicParser *parser,
                                              MinicGlobalObjectId object_id,
                                              const MinicRecordField *field,
                                              size_t field_base_slot) {
    if (parser == NULL || field == NULL || field->element_count == 0U || field->is_flexible_array) {
        return false;
    }
    if (field->element_count == 1U && !field->is_array) {
        if (minic_type_is_integer(field->type) || minic_type_is_pointer(field->type)) {
            return parse_static_scalar_constant_at(
                parser, object_id, field->type, true, field_base_slot);
        }
        if (minic_type_is_record(field->type)) {
            const MinicRecord *nested_record;

            nested_record = minic_c0_program_record(parser->program, field->type.record_id);
            return nested_record != NULL && overwrite_static_zero_record_constant(
                                                parser, object_id, nested_record, field_base_slot);
        }
    }
    minic_parser_error(parser,
                       "backward aggregate designator currently requires a scalar or record zero "
                       "subobject");
    return false;
}

static bool overwrite_static_zero_record_constant(MinicParser *parser,
                                                  MinicGlobalObjectId object_id,
                                                  const MinicRecord *record,
                                                  size_t record_base_slot) {
    size_t field_index;
    size_t field_limit;

    if (parser == NULL || record == NULL || !record->is_complete ||
        !minic_parser_expect(parser, MINIC_TOKEN_LBRACE, "expected '{' in record initializer")) {
        return false;
    }
    field_limit = record->is_union ? 1U : record->field_count;
    field_index = 0U;
    while (parser->current.kind != MINIC_TOKEN_RBRACE) {
        const MinicRecordField *field;
        size_t relative_slot;
        size_t field_base_slot;

        if (parser->current.kind == MINIC_TOKEN_DOT) {
            MinicRecordFieldPath field_path;
            MinicSourceSpan designator_span;

            if (!minic_parser_advance(parser) || parser->current.kind != MINIC_TOKEN_IDENTIFIER) {
                minic_parser_error(parser, "expected member name after '.' in initializer");
                return false;
            }
            designator_span = parser->current.span;
            if (!minic_parser_find_record_field_path(
                    parser, record, designator_span, &field_path) ||
                !field_path.found || field_path.ambiguous || field_path.depth != 1U) {
                minic_parser_error(
                    parser, "backward aggregate initializer requires a direct unambiguous member");
                return false;
            }
            field_index = field_path.field_indices[0];
            if (!minic_parser_advance(parser) ||
                !minic_parser_expect(
                    parser, MINIC_TOKEN_EQUAL, "expected '=' after static record designator")) {
                return false;
            }
        }
        if (field_index >= field_limit) {
            minic_parser_error(parser, "too many backward aggregate initializer fields");
            return false;
        }
        field = &record->fields[field_index];
        if (!minic_c0_global_record_field_initializer_slot(
                parser->program, record, field_index, &relative_slot) ||
            record_base_slot > SIZE_MAX - relative_slot) {
            minic_parser_error(parser, "cannot locate backward aggregate initializer field slot");
            return false;
        }
        field_base_slot = record_base_slot + relative_slot;
        if (!overwrite_static_zero_field_value(parser, object_id, field, field_base_slot)) {
            return false;
        }
        field_index += 1U;
        if (parser->current.kind == MINIC_TOKEN_COMMA) {
            if (!minic_parser_advance(parser)) {
                return false;
            }
            if (parser->current.kind == MINIC_TOKEN_RBRACE) {
                break;
            }
        } else if (parser->current.kind != MINIC_TOKEN_RBRACE) {
            minic_parser_error(parser, "expected ',' or '}' in backward aggregate initializer");
            return false;
        }
    }
    return minic_parser_expect(
        parser, MINIC_TOKEN_RBRACE, "expected '}' after backward aggregate initializer");
}

'''
          if s.count(marker)!=1:
              raise SystemExit(f'parse_static_record_constant marker count={s.count(marker)}')
          s=s.replace(marker,helper+marker,1)
          old=r'''        if (overwrite_materialized_field) {
            size_t relative_slot;
            size_t slot_index;

            if (field->element_count != 1U ||
                (!minic_type_is_integer(field->type) && !minic_type_is_pointer(field->type)) ||
                !minic_c0_global_record_field_initializer_slot(
                    parser->program, record, field_index, &relative_slot) ||
                record_base_slot > SIZE_MAX - relative_slot) {
                minic_parser_error(
                    parser,
                    "backward static record designator currently requires a direct scalar field");
                return false;
            }
            slot_index = record_base_slot + relative_slot;
            if (!parse_static_scalar_constant_at(
                    parser, object_id, field->type, true, slot_index)) {
                return false;
            }
        } else {
'''
          new=r'''        if (overwrite_materialized_field) {
            size_t relative_slot;
            size_t slot_index;

            if (!minic_c0_global_record_field_initializer_slot(
                    parser->program, record, field_index, &relative_slot) ||
                record_base_slot > SIZE_MAX - relative_slot) {
                minic_parser_error(parser, "cannot locate backward aggregate initializer field slot");
                return false;
            }
            slot_index = record_base_slot + relative_slot;
            if (!overwrite_static_zero_field_value(parser, object_id, field, slot_index)) {
                return false;
            }
        } else {
'''
          if s.count(old)!=1:
              raise SystemExit(f'backward scalar branch count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY

          if [ "$status" -eq 0 ]; then
            stage=regression-source
            cat > tests/compiler/c0/backward_static_record_overlay.c <<'EOF'
          struct pair { long left; long right; };
          struct holder { struct pair pair; long tail; };
          static struct holder object = {
              .tail = 9,
              .pair = { 7, 8 },
          };
          int main(void) { return 0; }
          EOF
            cat > tests/compiler/c0/run-backward-static-record-overlay.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/backward-static-record-overlay
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/backward_static_record_overlay.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
            chmod +x tests/compiler/c0/run-backward-static-record-overlay.sh
            cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-backward-static-record-overlay.sh"
          EOF
            clang-format-18 -i src/frontend/parser_global.c tests/compiler/c0/backward_static_record_overlay.c >"$out/format.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=build
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/backward-record-overlay-v1 >"$out/build.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=focused
            MINIC="$GITHUB_WORKSPACE/build/backward-record-overlay-v1/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/backward-record-overlay-v1" \
              sh -x tests/compiler/c0/run-backward-static-record-overlay.sh >"$out/focused.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=check-fast
            make -j4 check-fast MODE=release BUILD_DIR=build/backward-record-overlay-v1-fast >"$out/check-fast.txt" 2>&1 || status=$?
          fi
          printf 'final_stage=%s\nfinal_status=%s\n' "$stage" "$status" > "$out/status.txt"
          git diff -- src/frontend/parser_global.c tests/compiler/c0 > "$out/product.patch" || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -eq 0 ]; then
            git rm .github/workflows/productize-backward-static-record-overlay-v1.yml
            rm -rf "$out"
            git add src/frontend/parser_global.c tests/compiler/c0/backward_static_record_overlay.c tests/compiler/c0/run-backward-static-record-overlay.sh tests/compiler/c0/run.sh
            git commit -m 'frontend: overwrite zero-materialized static record fields'
          else
            git add "$out"
            git commit -m 'diagnostic: record backward static record overlay failure' || true
          fi
          git push origin HEAD:product/backward-static-record-overlay-v1
          exit 0
