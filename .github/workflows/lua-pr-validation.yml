name: Lua PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lua-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lua-compile:
    name: lua-compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage current discovery semantics and build MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          sh tools/dev/pr75-stage.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/lua-compiler
          make -j4 MODE=sanitize BUILD_DIR=build/lua-sanitize

      - name: Verify focused Lua-driven semantics
        shell: bash
        run: |
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-signed-char-semantics.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-extern-incomplete-arrays.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-extern-parenthesized-functions.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-anonymous-record-field-types.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-typedef-enum-definitions.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-record-forward-declarations.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-record-multi-declarators.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-volatile-qualifiers.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-array-bound-sizeof.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-record-multidimensional-arrays.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-record-length-one-arrays.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-pointer-compound-subtraction.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-builtin-offsetof.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-pointer-integer-casts.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-comma-operator.sh
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/lua-focused" HOST_CC=cc sh tests/compiler/c0/run-cast-type-classification.sh

      - name: Compile official Lua 5.5.0 translation units
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/lua-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/lua-discovery" \
          HOST_CC=cc \
            sh tests/external/lua/probe.sh
          status=$?
          set -e

          if test "$status" -ge 128; then
            echo "LUA_SANITIZER_NOTE release_status=$status"
          fi
          exit "$status"
