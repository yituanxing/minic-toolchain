name: Lua PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: foundation-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lua-compile:
    name: foundation-one-shot-migration
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1

      - name: Apply audited one-shot migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/maintenance/foundation-one-shot.py

      - name: Format candidate source
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Build and run fast gates
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-one-shot
          make -j4 MODE=release BUILD_DIR=build/foundation-one-shot check-fast

      - name: Run frozen Lua and Linux focused gates
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/foundation-one-shot/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/foundation-one-shot-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Commit validated migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          if git diff --cached --quiet; then
            echo 'no source/test migration to commit'
            exit 0
          fi
          git commit -m 'refactor: align materialized frontend contracts'
          git push origin HEAD:refactor/foundation-v1
