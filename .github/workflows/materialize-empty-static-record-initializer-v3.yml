name: Validate empty static-record initializer support

on:
  push:
    branches:
      - staging/static-local-record-shared-initializer-v3

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/static-local-record-shared-initializer-v3
          fetch-depth: 0
      - name: Materialize shared-owner correction
        run: python3 tools/dev/materialize-empty-static-record-initializer-v3.py
      - name: Build and focused validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/static-local-record-shared-v3
          MINIC="$GITHUB_WORKSPACE/build/static-local-record-shared-v3/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/static-local-record-shared-v3-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-static-local-record-initializers.sh
          MINIC="$GITHUB_WORKSPACE/build/static-local-record-shared-v3/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/static-local-record-shared-v3-aggregate-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-static-aggregate-initializers.sh
          MINIC="$GITHUB_WORKSPACE/build/static-local-record-shared-v3/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/static-local-record-shared-v3-empty-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-empty-records.sh
          make check-fast
          git diff --check
      - name: Commit corrected product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_global.c \
                  tests/compiler/c0/static_local_record_initializer.c \
                  tests/compiler/c0/run-static-local-record-initializers.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: allow empty static record initializers [materialized v3]'
          git push origin HEAD:staging/static-local-record-shared-initializer-v3
