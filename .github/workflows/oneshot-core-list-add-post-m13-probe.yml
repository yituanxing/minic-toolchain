name: One-shot Core List Add Post M13 Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Apply M13 and build
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-core-scalar-not-equal-v1.py
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-post-m13-probe-compiler

      - name: Probe bool and compound-assignment layers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-post-m13-probe-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-post-m13-probe"
          mkdir -p "$work"

          cat >"$work/a-bool-init.i" <<'EOF'
          _Bool probe_bool_init(void) {
              _Bool ret = 1;
              return ret;
          }
          EOF

          cat >"$work/b-bool-assign.i" <<'EOF'
          _Bool probe_bool_assign(void) {
              _Bool ret = 1;
              ret = 0;
              return ret;
          }
          EOF

          cat >"$work/c-int-and-assign.i" <<'EOF'
          int external_bool(void);
          int probe_int_and_assign(void) {
              int ret = 1;
              ret &= external_bool();
              return ret;
          }
          EOF

          cat >"$work/d-bool-and-assign.i" <<'EOF'
          _Bool external_bool(void);
          _Bool probe_bool_and_assign(void) {
              _Bool ret = 1;
              ret &= external_bool();
              return ret;
          }
          EOF

          cat >"$work/e-list-prefix.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          _Bool probe_list_prefix(struct list_head *new_node,
                                  struct list_head *prev,
                                  struct list_head *next) {
              _Bool ret = 1;
              if (__builtin_expect(!!(next->prev == prev && prev->next == next &&
                                      new_node != prev && new_node != next), 1))
                  return 1;
              ret = 0;
              return ret;
          }
          EOF

          cat >"$work/f-list-full.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          _Bool report_list(struct list_head *, struct list_head *, struct list_head *);
          _Bool probe_list_full(struct list_head *new_node,
                                struct list_head *prev,
                                struct list_head *next) {
              _Bool ret = 1;
              if (__builtin_expect(!!(next->prev == prev && prev->next == next &&
                                      new_node != prev && new_node != next), 1))
                  return 1;
              ret = 0;
              ret &= report_list(new_node, prev, next);
              return ret;
          }
          EOF

          for input in "$work"/*.i; do
            name=$(basename "$input" .i)
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name.s" \
              >"$work/$name.out" 2>"$work/$name.err"
            rc=$?
            set -e
            printf 'CORE_POST_M13_SHAPE name=%s rc=%d\n' "$name" "$rc"
            sed 's/^/CORE_POST_M13_DIAG /' "$work/$name.err"
          done
