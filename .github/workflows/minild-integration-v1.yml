name: MiniLD Integration - Dynamic, Linux REL and Static

on:
  push:
    branches:
      - "agent/linux-perf-boolean-domain-v1"
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the MiniLD integration contract"
        required: true
        type: choice
        default: dynamic
        options:
          - dynamic
          - linux-rel
          - static
          - all

permissions:
  contents: read

jobs:

  dynamic-integration:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dynamic' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[minild-dynamic-integration]'))
    concurrency:
      group: minild-dynamic-integration-v1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 musl prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-riscv64-cross libc6-dev-riscv64-cross qemu-user \
            curl ca-certificates python3

      - name: Build current MiniLD once
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-dynamic-integration-v1-toolchain all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-dynamic-integration-v1-toolchain check-minild-a6
          test -x build/minild-dynamic-integration-v1-toolchain/bin/minic-ld

      - name: Build pristine musl and MiniLD loader once
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-dynamic-integration-v1"
          toolchain="$GITHUB_WORKSPACE/build/minild-dynamic-integration-v1-toolchain"
          mkdir -p "$work"

          curl -fsSL https://musl.libc.org/releases/musl-1.2.5.tar.gz \
            -o "$work/musl-1.2.5.tar.gz"
          printf '%s  %s\n' \
            a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4 \
            "$work/musl-1.2.5.tar.gz" | sha256sum -c -
          tar -xzf "$work/musl-1.2.5.tar.gz" -C "$work"

          src="$work/musl-1.2.5"
          out="$work/musl-build"
          mkdir -p "$out"
          cd "$out"
          CC=riscv64-linux-gnu-gcc \
          AR=riscv64-linux-gnu-ar \
          RANLIB=riscv64-linux-gnu-ranlib \
            "$src/configure" \
              --target=riscv64-linux-gnu \
              --enable-shared \
              --prefix=/usr \
            >"$work/configure.log" 2>&1

          make -j4 V=1 lib/libc.so lib/Scrt1.o lib/crti.o lib/crtn.o \
            >"$work/make.log" 2>&1

          python3 - "$work/make.log" "$work/input-list.txt" <<'PY'
          import shlex, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          for i, line in enumerate(lines):
              if " -nostdlib -shared " not in line:
                  continue
              full = line.rstrip()
              j = i + 1
              while full.endswith("\\") and j < len(lines):
                  full = full[:-1] + " " + lines[j].strip()
                  j += 1
              words = shlex.split(full)
              objs = [w for w in words if w.endswith(".lo")]
              if len(objs) >= 1000:
                  open(sys.argv[2], "w").write("\n".join(objs) + "\n")
                  print("MINILD_DYNAMIC_MUSL_LINK_OBJECTS=%d" % len(objs))
                  break
          else:
              raise SystemExit("shared musl link command not found")
          PY

          minild="$toolchain/bin/minic-ld"
          dynamic_list="$src/dynamic.list"
          libgcc="$(riscv64-linux-gnu-gcc -print-libgcc-file-name)"
          libgcc_eh="$(riscv64-linux-gnu-gcc -print-file-name=libgcc_eh.a)"
          mapfile -t rel_inputs <"$work/input-list.txt"
          inputs=()
          for p in "${rel_inputs[@]}"; do
            test -s "$out/$p"
            inputs+=("$out/$p")
          done
          test "${#inputs[@]}" -ge 1000

          "$minild" -melf64lriscv -shared -e _dlstart \
            --dynamic-list="$dynamic_list" \
            -o "$work/libc-minild.so" \
            "${inputs[@]}" "$libgcc" "$libgcc_eh" \
            >"$work/loader-link.stdout" 2>"$work/loader-link.stderr"

          chmod +x "$work/libc-minild.so"
          set +e
          qemu-riscv64 "$work/libc-minild.so" \
            >"$work/loader.stdout" 2>"$work/loader.stderr"
          loader_rc=$?
          set -e
          test "$loader_rc" -eq 1
          echo "MINILD_DYNAMIC_LOADER=PASS rc=$loader_rc"

      - name: Build shared PIE input and runtime root
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-dynamic-integration-v1"

          cat >"$work/app.c" <<'C'
          extern void *malloc(unsigned long);
          extern void free(void *);
          extern long write(int, const void *, unsigned long);

          int main(void)
          {
              static const char msg[] = "MINILD_DYNAMIC_EXEC_OK\n";
              unsigned long n = sizeof(msg) - 1;
              char *p = malloc(n);
              unsigned long i;

              if (!p) return 2;
              for (i = 0; i < n; ++i) p[i] = msg[i];
              if (write(1, p, n) != (long)n) {
                  free(p);
                  return 3;
              }
              free(p);
              return 0;
          }
          C

          riscv64-linux-gnu-gcc -O0 -fPIE -fno-stack-protector -fno-builtin \
            -c "$work/app.c" -o "$work/app.o"

          root="$work/root"
          mkdir -p "$root/lib"
          cp "$work/libc-minild.so" "$root/lib/ld-musl-riscv64.so.1"
          cp "$work/libc-minild.so" "$root/lib/libc.so"
          chmod +x "$root/lib/ld-musl-riscv64.so.1" "$root/lib/libc.so"

      - name: Validate explicit DT_NEEDED MiniLD PIE
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-dynamic-integration-v1"
          out="$work/musl-build"
          minild="$GITHUB_WORKSPACE/build/minild-dynamic-integration-v1-toolchain/bin/minic-ld"
          app="$work/app-explicit"

          "$minild" -melf64lriscv -pie -e _start \
            --needed=libc.so \
            --dynamic-linker=/lib/ld-musl-riscv64.so.1 \
            -o "$app" \
            "$out/lib/Scrt1.o" "$out/lib/crti.o" \
            "$work/app.o" "$out/lib/crtn.o" \
            >"$work/explicit-link.stdout" 2>"$work/explicit-link.stderr"

          riscv64-linux-gnu-readelf -h "$app" >"$work/explicit.header"
          riscv64-linux-gnu-readelf -lW "$app" >"$work/explicit.programs"
          riscv64-linux-gnu-readelf -d "$app" >"$work/explicit.dynamic"
          riscv64-linux-gnu-readelf -Wr "$app" >"$work/explicit.relocations"
          riscv64-linux-gnu-readelf -Ws "$app" >"$work/explicit.symbols"

          grep -q 'DYN (Position-Independent Executable file)' "$work/explicit.header"
          grep -q '^[[:space:]]*PHDR[[:space:]]' "$work/explicit.programs"
          grep -q 'Requesting program interpreter: /lib/ld-musl-riscv64.so.1' "$work/explicit.programs"
          grep -q '(NEEDED).*\[libc.so\]' "$work/explicit.dynamic"
          grep -q '(FLAGS_1).*PIE' "$work/explicit.dynamic"
          grep -q '_start' "$work/explicit.symbols"
          grep -q '__libc_start_main' "$work/explicit.symbols"
          grep -q 'malloc' "$work/explicit.symbols"
          grep -q 'write' "$work/explicit.symbols"
          grep -q 'free' "$work/explicit.symbols"

          set +e
          timeout 5s qemu-riscv64 "$work/libc-minild.so" "$app" \
            >"$work/explicit-loader.stdout" 2>"$work/explicit-loader.stderr"
          loader_rc=$?
          timeout 5s qemu-riscv64 -L "$work/root" "$app" \
            >"$work/explicit-direct.stdout" 2>"$work/explicit-direct.stderr"
          direct_rc=$?
          set -e

          test "$loader_rc" -eq 0
          test "$direct_rc" -eq 0
          grep -qx 'MINILD_DYNAMIC_EXEC_OK' "$work/explicit-loader.stdout"
          cmp "$work/explicit-loader.stdout" "$work/explicit-direct.stdout"
          echo "MINILD_DYNAMIC_EXPLICIT_NEEDED=PASS loader_rc=$loader_rc direct_rc=$direct_rc"

      - name: Validate DSO input and automatic DT_NEEDED MiniLD PIE
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-dynamic-integration-v1"
          out="$work/musl-build"
          minild="$GITHUB_WORKSPACE/build/minild-dynamic-integration-v1-toolchain/bin/minic-ld"
          app="$work/app-dso"

          "$minild" -melf64lriscv -pie -e _start \
            --dynamic-linker=/lib/ld-musl-riscv64.so.1 \
            -o "$app" \
            "$out/lib/Scrt1.o" "$out/lib/crti.o" \
            "$work/app.o" "$out/lib/crtn.o" \
            -L"$out/lib" -lc \
            >"$work/dso-link.stdout" 2>"$work/dso-link.stderr"

          riscv64-linux-gnu-readelf -h "$app" >"$work/dso.header"
          riscv64-linux-gnu-readelf -lW "$app" >"$work/dso.programs"
          riscv64-linux-gnu-readelf -d "$app" >"$work/dso.dynamic"
          riscv64-linux-gnu-readelf -Wr "$app" >"$work/dso.relocations"
          riscv64-linux-gnu-readelf -Ws "$app" >"$work/dso.symbols"

          grep -q 'DYN (Position-Independent Executable file)' "$work/dso.header"
          grep -q '^[[:space:]]*PHDR[[:space:]]' "$work/dso.programs"
          grep -q 'Requesting program interpreter: /lib/ld-musl-riscv64.so.1' "$work/dso.programs"
          grep -q '(NEEDED).*\[libc.so\]' "$work/dso.dynamic"
          grep -q '(FLAGS_1).*PIE' "$work/dso.dynamic"
          grep -q '_start' "$work/dso.symbols"
          grep -q '__libc_start_main' "$work/dso.symbols"
          grep -q 'malloc' "$work/dso.symbols"
          grep -q 'write' "$work/dso.symbols"
          grep -q 'free' "$work/dso.symbols"

          set +e
          timeout 5s qemu-riscv64 "$work/libc-minild.so" "$app" \
            >"$work/dso-loader.stdout" 2>"$work/dso-loader.stderr"
          loader_rc=$?
          timeout 5s qemu-riscv64 -L "$work/root" "$app" \
            >"$work/dso-direct.stdout" 2>"$work/dso-direct.stderr"
          direct_rc=$?
          set -e

          test "$loader_rc" -eq 0
          test "$direct_rc" -eq 0
          grep -qx 'MINILD_DYNAMIC_EXEC_OK' "$work/dso-loader.stdout"
          cmp "$work/dso-loader.stdout" "$work/dso-direct.stdout"
          echo "MINILD_DYNAMIC_DSO_INPUT=PASS library_search=-L,-l automatic_needed=PASS loader_rc=$loader_rc direct_rc=$direct_rc"

      - name: Publish combined dynamic verdict
        run: echo "MINILD_DYNAMIC_INTEGRATION_V1=PASS explicit-needed=PASS dso-input=PASS library-search=PASS automatic-needed=PASS direct-qemu=PASS"

      - name: Preserve dynamic integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minild-dynamic-integration-v1
          path: |
            build/minild-dynamic-integration-v1/configure.log
            build/minild-dynamic-integration-v1/make.log
            build/minild-dynamic-integration-v1/input-list.txt
            build/minild-dynamic-integration-v1/loader-link.stdout
            build/minild-dynamic-integration-v1/loader-link.stderr
            build/minild-dynamic-integration-v1/loader.stdout
            build/minild-dynamic-integration-v1/loader.stderr
            build/minild-dynamic-integration-v1/app.c
            build/minild-dynamic-integration-v1/explicit-*
            build/minild-dynamic-integration-v1/explicit.*
            build/minild-dynamic-integration-v1/dso-*
            build/minild-dynamic-integration-v1/dso.*
          if-no-files-found: ignore
          retention-days: 3


  linux-rel-boundaries:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'linux-rel' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[minild-linux-rel-boundaries]'))
    concurrency:
      group: minild-linux-rel-boundaries-v1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux build prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils file

      - name: Build current MiniLD once
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-linux-rel-v1-toolchain all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-linux-rel-v1-toolchain check-minild-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-linux-rel-v1-toolchain check-minild-a1
          test -x build/minild-linux-rel-v1-toolchain/bin/minic-ld

      - name: Prepare Linux 6.6.143 once
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-linux-rel-v1"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz \
            -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig

      - name: Install two-boundary MiniLD wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-linux-rel-v1"
          wrapper="$work/riscv64-linux-gnu-ld-minild-rel-boundaries"
          cat >"$wrapper" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${MINILD:?MINILD is not set}"
          : "${MINILD_TRACE:?MINILD_TRACE is not set}"

          args=("$@")
          output=
          for ((i=0; i<${#args[@]}; ++i)); do
            if [[ "${args[i]}" == "-o" && $((i+1)) -lt ${#args[@]} ]]; then
              output="${args[i+1]}"
              break
            fi
          done

          case "$output" in
            */purgatory.ro|*/vmlinux.o)
              printf '%s\n' "$output" >>"$MINILD_TRACE"
              exec "$MINILD" "${args[@]}"
              ;;
            *)
              exec riscv64-linux-gnu-ld "${args[@]}"
              ;;
          esac
          SH
          chmod +x "$wrapper"

      - name: Build one Linux Image through both MiniLD boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-linux-rel-v1"
          src="$work/linux-6.6.143"
          out="$work/out"
          wrapper="$work/riscv64-linux-gnu-ld-minild-rel-boundaries"
          trace="$work/minild-boundaries.log"
          : >"$trace"

          MINILD="$GITHUB_WORKSPACE/build/minild-linux-rel-v1-toolchain/bin/minic-ld" \
          MINILD_TRACE="$trace" \
          make -C "$src" O="$out" -j2 ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            LD="$wrapper" Image

          test -s "$out/arch/riscv/boot/Image"
          grep -q '/purgatory.ro$' "$trace"
          grep -q '/vmlinux.o$' "$trace"
          test "$(wc -l <"$trace")" -eq 2
          file "$out/arch/riscv/boot/Image"
          printf 'MINILD_LINUX_REL_BOUNDARIES_V1=PASS\n'

      - name: Preserve Linux boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minild-linux-rel-boundaries-v1
          path: |
            build/minild-linux-rel-v1/minild-boundaries.log
            build/minild-linux-rel-v1/out/arch/riscv/boot/Image
          if-no-files-found: ignore
          retention-days: 3


  musl-lua-static:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'static' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[static-runtime]'))
    concurrency:
      group: minild-static-runtime-v1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 build/runtime prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-user curl ca-certificates

      - name: Build current MiniLD once
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-static-runtime-v1 all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-static-runtime-v1 check-minild-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-static-runtime-v1 check-minild-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-static-runtime-v1 check-minild-a2
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-static-runtime-v1 check-minild-a3
          test -x build/minild-static-runtime-v1/bin/minic-ld

      - name: Build pristine musl 1.2.5 static producer once
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-static-runtime-v1"
          mkdir -p "$work"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz \
            -o "$work/musl-1.2.5.tar.gz"
          printf '%s  %s\n' \
            a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4 \
            "$work/musl-1.2.5.tar.gz" | sha256sum -c -
          tar -xzf "$work/musl-1.2.5.tar.gz" -C "$work"

          src="$work/musl-1.2.5"
          out="$work/musl-build"
          sysroot="$work/musl-sysroot"
          mkdir -p "$out" "$sysroot"
          cd "$out"
          CFLAGS="-O2 -fno-pic -fno-pie" \
          CC=riscv64-linux-gnu-gcc \
          AR=riscv64-linux-gnu-ar \
          RANLIB=riscv64-linux-gnu-ranlib \
            "$src/configure" \
              --target=riscv64-linux-gnu \
              --disable-shared \
              --prefix=/usr
          make -j4
          make DESTDIR="$sysroot" install-headers

          test -s lib/libc.a
          test -s obj/crt/crt1.o
          test -s obj/crt/crti.o
          test -s obj/crt/crtn.o
          test -s "$sysroot/usr/include/stdio.h"
          riscv64-linux-gnu-readelf -Wr lib/libc.a >"$work/musl-libc.relocations"
          if grep -q 'R_RISCV_GOT_HI20' "$work/musl-libc.relocations"; then
            echo "STATIC_RUNTIME_MUSL_ERROR=GOT_HI20_PRESENT" >&2
            exit 1
          fi
          printf 'STATIC_RUNTIME_MUSL=PASS objects=%s libc_bytes=%s\n' \
            "$(find obj -type f -name '*.o' | wc -l)" \
            "$(stat -c %s lib/libc.a)"

      - name: Validate explicit musl malloc/free contract with GNU and MiniLD
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-static-runtime-v1"
          musl="$work/musl-build"
          libgcc="$(riscv64-linux-gnu-gcc -print-libgcc-file-name)"
          minild="$GITHUB_WORKSPACE/build/minild-static-runtime-v1/bin/minic-ld"

          cat >"$work/malloc_free_test.c" <<'C'
          typedef unsigned long size_t;
          void *malloc(size_t);
          void free(void *);
          int main(void) {
              unsigned long *p = (unsigned long *)malloc(4 * sizeof(unsigned long));
              unsigned long sum;
              if (!p) return 11;
              p[0] = 7;
              p[1] = 11;
              p[2] = 13;
              p[3] = 11;
              sum = p[0] + p[1] + p[2] + p[3];
              free(p);
              return sum == 42 ? 0 : 12;
          }
          C
          riscv64-linux-gnu-gcc -O2 -fno-pie -fno-pic -c \
            "$work/malloc_free_test.c" -o "$work/malloc_free_test.o"

          riscv64-linux-gnu-ld -melf64lriscv -static -e _start \
            -o "$work/musl-reference" \
            "$musl/obj/crt/crt1.o" "$musl/obj/crt/crti.o" "$work/malloc_free_test.o" \
            --start-group "$musl/lib/libc.a" "$libgcc" --end-group \
            "$musl/obj/crt/crtn.o"
          qemu-riscv64 "$work/musl-reference"

          "$minild" -melf64lriscv -static -e _start \
            -o "$work/musl-product" \
            "$musl/obj/crt/crt1.o" "$musl/obj/crt/crti.o" "$work/malloc_free_test.o" \
            --start-group "$musl/lib/libc.a" "$libgcc" --end-group \
            "$musl/obj/crt/crtn.o" \
            >"$work/musl-minild.stdout" 2>"$work/musl-minild.stderr"
          qemu-riscv64 -strace "$work/musl-product" \
            >"$work/musl-qemu.stdout" 2>"$work/musl-qemu.stderr"
          echo "MINILD_MUSL_STATIC=PASS malloc=PASS free=PASS"

      - name: Build pristine Lua 5.5.0 into RV64 objects
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-static-runtime-v1"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://www.lua.org/ftp/lua-5.5.0.tar.gz \
            -o "$work/lua-5.5.0.tar.gz"
          printf '%s  %s\n' \
            57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d \
            "$work/lua-5.5.0.tar.gz" | sha256sum -c -
          tar -xzf "$work/lua-5.5.0.tar.gz" -C "$work"

          src="$work/lua-5.5.0/src"
          obj="$work/lua-obj"
          sysroot="$work/musl-sysroot"
          mkdir -p "$obj"
          sources="lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c lua.c"
          count=0
          for source in $sources; do
            base=${source%.c}
            riscv64-linux-gnu-gcc \
              --sysroot="$sysroot" \
              -std=c99 -O2 -fno-pic -fno-pie -DLUA_USE_LINUX \
              -I"$src" \
              -c "$src/$source" -o "$obj/$base.o"
            count=$((count + 1))
          done
          test "$count" -eq 33
          (
            cd "$obj"
            riscv64-linux-gnu-ar rcsD liblua.a \
              lapi.o lcode.o lctype.o ldebug.o ldo.o ldump.o lfunc.o lgc.o \
              llex.o lmem.o lobject.o lopcodes.o lparser.o lstate.o lstring.o \
              ltable.o ltm.o lundump.o lvm.o lzio.o lauxlib.o lbaselib.o \
              lcorolib.o ldblib.o liolib.o lmathlib.o loadlib.o loslib.o \
              lstrlib.o ltablib.o lutf8lib.o linit.o
          )
          test "$(riscv64-linux-gnu-ar t "$obj/liblua.a" | wc -l)" -eq 32
          riscv64-linux-gnu-readelf -Wr "$obj/liblua.a" >"$work/lua-lib.relocations"
          if grep -q 'R_RISCV_GOT_HI20' "$work/lua-lib.relocations"; then
            echo "STATIC_RUNTIME_LUA_ERROR=GOT_HI20_PRESENT" >&2
            exit 1
          fi
          echo "LUA_STATIC_PRODUCER=PASS translation_units=33 archive_members=32"

      - name: Validate Lua GNU reference and MiniLD product
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minild-static-runtime-v1"
          musl="$work/musl-build"
          obj="$work/lua-obj"
          libgcc="$(riscv64-linux-gnu-gcc -print-libgcc-file-name)"
          minild="$GITHUB_WORKSPACE/build/minild-static-runtime-v1/bin/minic-ld"

          cat >"$work/runtime-smoke.lua" <<'LUA'
          local sum = 0
          for i = 1, 10000 do sum = sum + i end
          assert(sum == 50005000)
          local t = {alpha = 7, beta = 35}
          assert(t.alpha + t.beta == 42)
          assert(string.upper("lua") == "LUA")
          assert(math.floor(3.9) == 3)
          local function fib(n)
            if n < 2 then return n end
            return fib(n - 1) + fib(n - 2)
          end
          assert(fib(10) == 55)
          collectgarbage("collect")
          print("LUA_MINILD_STATIC_OK", _VERSION, sum)
          LUA

          riscv64-linux-gnu-ld -melf64lriscv -static -e _start \
            -o "$work/lua-reference" \
            "$musl/obj/crt/crt1.o" "$musl/obj/crt/crti.o" \
            "$obj/lua.o" "$obj/liblua.a" \
            --start-group "$musl/lib/libc.a" "$libgcc" --end-group \
            "$musl/obj/crt/crtn.o"
          qemu-riscv64 "$work/lua-reference" "$work/runtime-smoke.lua" \
            >"$work/lua-reference.stdout" 2>"$work/lua-reference.stderr"
          grep -q 'LUA_MINILD_STATIC_OK' "$work/lua-reference.stdout"

          "$minild" -melf64lriscv -static -e _start \
            -o "$work/lua-product" \
            "$musl/obj/crt/crt1.o" "$musl/obj/crt/crti.o" \
            "$obj/lua.o" "$obj/liblua.a" \
            --start-group "$musl/lib/libc.a" "$libgcc" --end-group \
            "$musl/obj/crt/crtn.o" \
            >"$work/lua-minild.stdout" 2>"$work/lua-minild.stderr"
          qemu-riscv64 "$work/lua-product" "$work/runtime-smoke.lua" \
            >"$work/lua-product.stdout" 2>"$work/lua-product.stderr"
          grep -q 'LUA_MINILD_STATIC_OK' "$work/lua-product.stdout"
          diff -u "$work/lua-reference.stdout" "$work/lua-product.stdout"
          echo "MINILD_LUA_STATIC=PASS"

      - name: Publish canonical verdict
        run: echo "MINILD_STATIC_RUNTIME_V1=PASS musl-malloc-free=PASS lua-5.5=PASS"

      - name: Preserve static runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minild-static-runtime-v1-evidence
          path: |
            build/minild-static-runtime-v1/musl-libc.relocations
            build/minild-static-runtime-v1/musl-minild.stdout
            build/minild-static-runtime-v1/musl-minild.stderr
            build/minild-static-runtime-v1/musl-qemu.stdout
            build/minild-static-runtime-v1/musl-qemu.stderr
            build/minild-static-runtime-v1/lua-lib.relocations
            build/minild-static-runtime-v1/lua-reference.stdout
            build/minild-static-runtime-v1/lua-reference.stderr
            build/minild-static-runtime-v1/lua-product.stdout
            build/minild-static-runtime-v1/lua-product.stderr
            build/minild-static-runtime-v1/lua-minild.stdout
            build/minild-static-runtime-v1/lua-minild.stderr
            build/minild-static-runtime-v1/runtime-smoke.lua
          if-no-files-found: ignore
          retention-days: 3
