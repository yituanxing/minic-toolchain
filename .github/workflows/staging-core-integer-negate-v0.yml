name: Staging Core Integer Negate V0

on:
  push:
    branches: [staging/core-integer-negate-v0]

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize integer-negate candidate
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/core_ir.h')
          s = p.read_text()
          token = '    MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO,\n'
          assert s.count(token) == 1, s.count(token)
          p.write_text(s.replace(token, '    MINIC_CORE_INSTRUCTION_INTEGER_NEGATE,\n' + token, 1))

          p = Path('src/core/core_ir.c')
          s = p.read_text()
          token = '    case MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO:'
          positions = []
          cursor = 0
          while True:
              pos = s.find(token, cursor)
              if pos < 0:
                  break
              positions.append(pos)
              cursor = pos + 1
          assert len(positions) == 2, positions
          verifier = '''    case MINIC_CORE_INSTRUCTION_INTEGER_NEGATE:
              return instruction_result_is_valid(function, instruction) &&
                     minic_type_is_integer(instruction->type) &&
                     instruction->value.operand < function->value_count &&
                     available_values[instruction->value.operand] &&
                     minic_type_equal(function->values[instruction->value.operand].type,
                                      instruction->type);
          '''
          s = s[:positions[0]] + verifier + s[positions[0]:]
          positions = []
          cursor = 0
          while True:
              pos = s.find(token, cursor)
              if pos < 0:
                  break
              positions.append(pos)
              cursor = pos + 1
          assert len(positions) == 2, positions
          dump = '''    case MINIC_CORE_INSTRUCTION_INTEGER_NEGATE:
              return fprintf(output,
                             "  %%%" PRIu32 " = ineg %%%" PRIu32 "\\n",
                             instruction->result,
                             instruction->value.operand) >= 0;
          '''
          s = s[:positions[1]] + dump + s[positions[1]:]
          p.write_text(s)

          p = Path('src/core/core_lower.c')
          s = p.read_text()
          op = 'expression->value.unary.operator_kind == MINIC_UNARY_LOGICAL_NOT'
          op_pos = s.index(op)
          insert_pos = s.rfind('    if (', 0, op_pos)
          assert insert_pos >= 0
          lowering = '''    if (expression->kind == MINIC_EXPRESSION_UNARY &&
              expression->value.unary.operator_kind == MINIC_UNARY_NEGATE) {
              MinicCoreValueId operand_value;
              MinicCoreLowerStatus status;

              if (!minic_type_is_integer(expression->type)) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              status = lower_expression(context, expression->value.unary.operand, &operand_value);
              if (status != MINIC_CORE_LOWER_OK) {
                  return status;
              }
              if (operand_value >= context->function->value_count ||
                  !minic_type_equal(context->function->values[operand_value].type,
                                    expression->type)) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
              (void)memset(&instruction, 0, sizeof(instruction));
              instruction.kind = MINIC_CORE_INSTRUCTION_INTEGER_NEGATE;
              instruction.span = expression->span;
              instruction.type = expression->type;
              instruction.result = MINIC_CORE_VALUE_INVALID;
              instruction.value.operand = operand_value;
              return minic_core_function_append_value_instruction(
                         context->function, context->block_id, &instruction, value_id)
                         ? MINIC_CORE_LOWER_OK
                         : MINIC_CORE_LOWER_ERROR;
          }
          '''
          p.write_text(s[:insert_pos] + lowering + s[insert_pos:])

          p = Path('tests/core/run-core-ir-shadow.sh')
          s = p.read_text()
          anchor = 'cat >"$work_dir/indirect-call-unsupported.i" <<\'EOF\'\n'
          assert s.count(anchor) == 1, s.count(anchor)
          fixture = '''cat >"$work_dir/integer-negate-v0.i" <<'EOF'
          int negate_int(int value) {
              return -value;
          }

          long negate_long(long value) {
              return -value;
          }

          int source_value(void);

          int negate_call_result(void) {
              return -source_value();
          }

          int double_negate(int value) {
              return -(-value);
          }
          EOF
          check_strict_case integer-negate-v0

          '''
          p.write_text(s.replace(anchor, fixture + anchor, 1))
          PY
          clang-format -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c

      - name: Verify canonical formatting
        run: clang-format --dry-run --Werror src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c

      - name: Build Core IR unit contract with Werror
        run: |
          set -Eeuo pipefail
          mkdir -p build/core-integer-negate
          cc -std=c11 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror \
            -Iinclude -Isrc \
            src/core/core_ir.c src/core/core_lower.c \
            src/frontend/ast.c src/frontend/expression_semantics.c \
            src/frontend/ast_global.c src/frontend/ast_traversal.c \
            src/frontend/ast_verifier.c src/frontend/function_body.c \
            src/frontend/type.c src/target/data_layout.c src/target/target_info.c \
            tests/core/core_ir_shadow_test.c \
            -o build/core-integer-negate/core-ir-shadow-test
          build/core-integer-negate/core-ir-shadow-test

      - name: Build Release compiler with Werror
        run: make -j4 MODE=release CFLAGS=-Werror

      - name: Run Core IR strict and shadow contract
        run: |
          MINIC="$PWD/build/release/bin/minic" \
          BUILD_DIR="$PWD/build/core-integer-negate" \
          bash tests/core/run-core-ir-shadow.sh

      - name: Run broad C0 fast gate
        run: make check-fast

      - name: Run Foundation focused suite
        run: |
          MINIC="$PWD/build/release/bin/minic" \
          BUILD_DIR="$PWD/build/core-integer-negate-foundation" \
          bash tests/compiler/c0/run-foundation-focused.sh

      - name: Publish clean product branch
        if: success()
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/core-negate-product/src/core /tmp/core-negate-product/tests/core
          cp src/core/core_ir.h /tmp/core-negate-product/src/core/core_ir.h
          cp src/core/core_ir.c /tmp/core-negate-product/src/core/core_ir.c
          cp src/core/core_lower.c /tmp/core-negate-product/src/core/core_lower.c
          cp tests/core/run-core-ir-shadow.sh /tmp/core-negate-product/tests/core/run-core-ir-shadow.sh
          git fetch origin main
          git reset --hard HEAD
          git checkout --detach origin/main
          cp /tmp/core-negate-product/src/core/core_ir.h src/core/core_ir.h
          cp /tmp/core-negate-product/src/core/core_ir.c src/core/core_ir.c
          cp /tmp/core-negate-product/src/core/core_lower.c src/core/core_lower.c
          cp /tmp/core-negate-product/tests/core/run-core-ir-shadow.sh tests/core/run-core-ir-shadow.sh
          git config user.name "LiYang Dong"
          git config user.email "119646676+yituanxing@users.noreply.github.com"
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git commit -m "core: add integer negate v0 [publish-v1]"
          git push --force origin HEAD:refs/heads/agent/core-integer-negate-v0
