name: Agent Array Bound Typed ConstEval V1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0
      - name: Generate typed array-bound consteval source
        run: python3 tools/dev/agent_array_bound_typed_consteval_v1.py
      - name: Format generated source
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-array-bound-typed-consteval
      - name: Run array bound constant-expression contracts
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-array-bound-typed-consteval/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-array-bound-typed-consteval-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-array-bound-constant-expressions.sh
          MINIC="$GITHUB_WORKSPACE/build/agent-array-bound-typed-consteval/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-array-bound-typed-consteval-casts" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-array-bound-integer-casts.sh
      - name: Run Foundation focused contracts
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-array-bound-typed-consteval/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-array-bound-typed-consteval-foundation" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh
      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-array-bound-typed-consteval check-fast
      - name: Publish generated source to scratch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_core.c \
                  tests/compiler/c0/array_bound_constant_expression.c \
                  tests/compiler/c0/run-array-bound-constant-expressions.sh \
                  tests/compiler/c0/run-array-bound-integer-casts.sh
          git commit -m 'frontend: evaluate array bounds through typed ConstEval'
          git push --force origin HEAD:agent/array-bound-typed-consteval-v1
