name: Productize Backward Static Aggregate Overlay V5
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'product/backward-static-aggregate-overlay-v5' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/backward-static-aggregate-overlay-v5
          fetch-depth: 0
      - name: Apply backward aggregate owner
        run: |
          set -Eeuo pipefail
          git fetch origin d66826cd6cf82e63f171fb2cd3f231ca7679ae7a
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/frontend/parser_global.c')
          s = p.read_text()
          marker = '''static bool parse_static_record_constant(MinicParser *parser,
                                         MinicGlobalObjectId object_id,
                                         const MinicRecord *record) {
'''
          helper = '''static bool overwrite_static_zero_record_constant(MinicParser *parser,
                                                  MinicGlobalObjectId object_id,
                                                  const MinicRecord *record,
                                                  size_t record_base_slot);

static bool overwrite_static_zero_field_value(MinicParser *parser,
                                              MinicGlobalObjectId object_id,
                                              const MinicRecordField *field,
                                              size_t field_base_slot) {
    if (parser == NULL || field == NULL || field->element_count == 0U || field->is_flexible_array) {
        return false;
    }
    if (field->element_count == 1U && !field->is_array) {
        if (minic_type_is_integer(field->type) || minic_type_is_pointer(field->type)) {
            return parse_static_scalar_constant_at(
                parser, object_id, field->type, true, field_base_slot);
        }
        if (minic_type_is_record(field->type)) {
            const MinicRecord *nested_record;

            nested_record = minic_c0_program_record(parser->program, field->type.record_id);
            return nested_record != NULL && overwrite_static_zero_record_constant(
                                                parser, object_id, nested_record, field_base_slot);
        }
    }
    if (field->is_array && minic_type_is_char_integer(field->type) &&
        parser->current.kind == MINIC_TOKEN_STRING_LITERAL) {
        return minic_parser_replace_zero_bounded_string_literal_initializer(
            parser, object_id, field_base_slot, field->element_count);
    }
    minic_parser_error(parser,
                       "backward aggregate designator currently requires scalar, record, or "
                       "character-array zero subobjects");
    return false;
}

static bool overwrite_static_zero_record_constant(MinicParser *parser,
                                                  MinicGlobalObjectId object_id,
                                                  const MinicRecord *record,
                                                  size_t record_base_slot) {
    size_t field_index;
    size_t field_limit;

    if (parser == NULL || record == NULL || !record->is_complete ||
        !minic_parser_expect(parser, MINIC_TOKEN_LBRACE, "expected '{' in record initializer")) {
        return false;
    }
    field_limit = record->is_union ? 1U : record->field_count;
    field_index = 0U;
    while (parser->current.kind != MINIC_TOKEN_RBRACE) {
        const MinicRecordField *field;
        size_t relative_slot;
        size_t field_base_slot;

        if (parser->current.kind == MINIC_TOKEN_DOT) {
            MinicRecordFieldPath field_path;
            MinicSourceSpan designator_span;

            if (!minic_parser_advance(parser) || parser->current.kind != MINIC_TOKEN_IDENTIFIER) {
                minic_parser_error(parser, "expected member name after '.' in initializer");
                return false;
            }
            designator_span = parser->current.span;
            if (!minic_parser_find_record_field_path(parser, record, designator_span, &field_path) ||
                !field_path.found || field_path.ambiguous || field_path.depth != 1U) {
                minic_parser_error(
                    parser, "backward aggregate initializer requires a direct unambiguous member");
                return false;
            }
            field_index = field_path.field_indices[0];
            if (!minic_parser_advance(parser) ||
                !minic_parser_expect(
                    parser, MINIC_TOKEN_EQUAL, "expected '=' after static record designator")) {
                return false;
            }
        }
        if (field_index >= field_limit) {
            minic_parser_error(parser, "too many backward aggregate initializer fields");
            return false;
        }
        field = &record->fields[field_index];
        if (!minic_c0_global_record_field_initializer_slot(
                parser->program, record, field_index, &relative_slot) ||
            record_base_slot > SIZE_MAX - relative_slot) {
            minic_parser_error(parser, "cannot locate backward aggregate initializer field slot");
            return false;
        }
        field_base_slot = record_base_slot + relative_slot;
        if (!overwrite_static_zero_field_value(parser, object_id, field, field_base_slot)) {
            return false;
        }
        field_index += 1U;
        if (parser->current.kind == MINIC_TOKEN_COMMA) {
            if (!minic_parser_advance(parser)) {
                return false;
            }
            if (parser->current.kind == MINIC_TOKEN_RBRACE) {
                break;
            }
        } else if (parser->current.kind != MINIC_TOKEN_RBRACE) {
            minic_parser_error(parser, "expected ',' or '}' in backward aggregate initializer");
            return false;
        }
    }
    return minic_parser_expect(
        parser, MINIC_TOKEN_RBRACE, "expected '}' after backward aggregate initializer");
}

'''
          if s.count(marker) != 1:
              raise SystemExit(f'record initializer marker count={s.count(marker)}')
          s = s.replace(marker, helper + marker, 1)

          start_marker = '''        if (overwrite_materialized_field) {
            size_t relative_slot;
            size_t slot_index;
'''
          end_marker = '''        } else {
            if (field_index != materialized_field_limit) {
'''
          start = s.index(start_marker, s.index(marker))
          end = s.index(end_marker, start)
          replacement = '''        if (overwrite_materialized_field) {
            size_t relative_slot;
            size_t slot_index;

            if (!minic_c0_global_record_field_initializer_slot(
                    parser->program, record, field_index, &relative_slot) ||
                record_base_slot > SIZE_MAX - relative_slot) {
                minic_parser_error(parser, "cannot locate backward static record designator slot");
                return false;
            }
            slot_index = record_base_slot + relative_slot;
            if (!overwrite_static_zero_field_value(parser, object_id, field, slot_index)) {
                return false;
            }
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

          git show d66826cd6cf82e63f171fb2cd3f231ca7679ae7a:tools/dev/materialize-backward-record-compound-literal-v1.py > tools/dev/materialize-backward-record-compound-literal-v1.py
          python3 tools/dev/materialize-backward-record-compound-literal-v1.py
          rm tools/dev/materialize-backward-record-compound-literal-v1.py
          git show d66826cd6cf82e63f171fb2cd3f231ca7679ae7a:tools/dev/materialize-backward-static-array-overlay-v1.py > tools/dev/materialize-backward-static-array-overlay-v1.py
          python3 tools/dev/materialize-backward-static-array-overlay-v1.py
          rm tools/dev/materialize-backward-static-array-overlay-v1.py

          cat > tests/compiler/c0/backward_static_aggregate_overlay.c <<'EOF'
          struct node { long value; };
          struct pair { long left; long right; };
          struct holder {
              struct node *slots[2];
              struct pair pair;
              long tail;
          };
          static struct node node0 = { 7 };
          static struct holder object = {
              .tail = 9,
              .slots = { &node0, &node0 },
              .pair = (struct pair){ 3, 5 },
          };
          int main(void) {
              return (int)(object.slots[0]->value + object.slots[1]->value +
                           object.pair.left + object.pair.right + object.tail - 31);
          }
          EOF
          cat > tests/compiler/c0/run-backward-static-aggregate-overlay.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/backward-static-aggregate-overlay
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c "$root/tests/compiler/c0/backward_static_aggregate_overlay.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-backward-static-aggregate-overlay.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/compiler/c0/run.sh')
          s = p.read_text()
          if 'run-backward-static-aggregate-overlay.sh' not in s:
              p.write_text(s + '\nMINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \\\n  sh "$root/tests/compiler/c0/run-backward-static-aggregate-overlay.sh"\n')
          PY
          rm .github/workflows/productize-backward-static-aggregate-overlay-v5.yml
      - name: Validate aggregate overlay
        run: |
          set -Eeuo pipefail
          clang-format-18 -i src/frontend/ast.h src/frontend/ast_global.c src/frontend/parser_global.c tests/compiler/c0/backward_static_aggregate_overlay.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-backward-aggregate
          MINIC="$GITHUB_WORKSPACE/build/product-backward-aggregate/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-backward-aggregate" sh tests/compiler/c0/run-backward-static-aggregate-overlay.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-backward-aggregate-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/ast.h src/frontend/ast_global.c src/frontend/parser_global.c tests/compiler/c0/backward_static_aggregate_overlay.c tests/compiler/c0/run-backward-static-aggregate-overlay.sh tests/compiler/c0/run.sh .github/workflows/productize-backward-static-aggregate-overlay-v5.yml
          git commit -m 'frontend: overlay backward static aggregate subobjects'
          git push origin HEAD:product/backward-static-aggregate-overlay-v5
