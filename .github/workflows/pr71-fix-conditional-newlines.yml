name: PR71 Fix Conditional Newlines

on:
  push:
    branches:
      - frontend/additive-update-pointer-difference

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Repair escaped assembly newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/target/riscv64/codegen_expression.c')
          text = path.read_text()
          old = r'\\n'
          new = r'\n'
          count = text.count(old)
          if count == 0:
              raise SystemExit('no doubled assembly newline escapes found')
          path.write_text(text.replace(old, new))
          print(f'repaired {count} doubled assembly newline escapes')
          PY
          clang-format-18 -i src/target/riscv64/codegen_expression.c

      - name: Host validation
        run: make -j2 BUILD_DIR=build/pr71-newline-fix check

      - name: Commit repair
        env:
          BRANCH: frontend/additive-update-pointer-difference
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/target/riscv64/codegen_expression.c
          git rm .github/workflows/pr71-fix-conditional-newlines.yml
          git commit -m 'target: fix conditional assembly newlines'
          git push origin HEAD:"$BRANCH"
