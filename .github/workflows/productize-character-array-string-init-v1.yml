name: Productize character array string init v1

on:
  pull_request:
    paths:
      - 'tools/dev/materialize-character-array-string-init-v1.py'
      - 'tools/dev/finalize-character-array-string-init-v1.py'
      - '.github/workflows/productize-character-array-string-init-v1.yml'
      - 'src/frontend/parser_internal.h'
      - 'src/frontend/parser_string.c'
      - 'src/frontend/parser_global.c'
      - 'src/frontend/parser_statement.c'
      - 'tests/programs/c0/character_array_string_initializer.c'
      - 'tests/programs/c0/manifest.txt'
      - 'tests/compiler/c0/run-character-array-string-initializer.sh'
      - 'tests/compiler/c0/run.sh'

permissions:
  contents: read

jobs:
  productize:
    name: Materialize character array string init
    if: ${{ github.head_ref == 'frontend/character-array-string-init-v1' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout capability branch
        uses: actions/checkout@v4
        with:
          ref: frontend/character-array-string-init-v1
          fetch-depth: 0

      - name: Materialize canonical capability
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-character-array-string-init-v1.py
          python3 tools/dev/finalize-character-array-string-init-v1.py
          rm tools/dev/materialize-character-array-string-init-v1.py
          rm tools/dev/finalize-character-array-string-init-v1.py
          rm .github/workflows/productize-character-array-string-init-v1.yml

      - name: Format and validate focused ownership
        run: |
          set -Eeuo pipefail
          mapfile -t changed_c < <(git diff --name-only -- '*.c' '*.h')
          if (( ${#changed_c[@]} != 0 )); then
            clang-format-18 -i "${changed_c[@]}"
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-character-array-string-init
          MINIC="$GITHUB_WORKSPACE/build/product-character-array-string-init/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-character-array-string-init" \
            sh tests/compiler/c0/run-character-array-string-initializer.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-character-array-string-init-fast

      - name: Publish clean product slice
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: initialize character arrays from string literals'
          git push origin HEAD:frontend/character-array-string-init-v1
