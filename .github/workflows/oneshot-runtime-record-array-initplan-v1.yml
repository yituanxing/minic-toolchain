name: One-shot Runtime Record Array InitPlan

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Validate pre-migration behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-runtime-record-array-initplan-v1.py
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/record-array-pre
          MINIC="$GITHUB_WORKSPACE/build/record-array-pre/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-array-pre" \
            sh tests/compiler/c0/run-runtime-record-array-initializers.sh

      - name: Apply planner-backed migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-runtime-record-array-initplan-v1.py
          clang-format-18 -i src/frontend/parser_statement.c
          ! grep -F 'parse_fixed_runtime_record_array_initializer_legacy' src/frontend/parser_statement.c
          grep -F 'minic_array_initializer_plan_add_designated(&plan' src/frontend/parser_statement.c >/dev/null
          grep -F 'minic_array_initializer_plan_add_positional(&plan' src/frontend/parser_statement.c >/dev/null

      - name: Validate post-migration behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/record-array-post
          MINIC="$GITHUB_WORKSPACE/build/record-array-post/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-array-post" \
            sh tests/compiler/c0/run-runtime-record-array-initializers.sh
          MINIC="$GITHUB_WORKSPACE/build/record-array-post/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-array-post" \
            sh tests/compiler/c0/run-gnu-array-range-initializer.sh
          cc -std=c11 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror \
            -Iinclude -Isrc \
            src/frontend/initializer.c \
            tests/frontend/initializer_plan_test.c \
            -o build/record-array-post/initializer-plan-test
          build/record-array-post/initializer-plan-test

      - name: Publish source migration
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-runtime-record-array-initplan-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c tools/dev/patch-runtime-record-array-initplan-v1.py
          git diff --cached --check
          git commit -m 'frontend: route runtime record arrays through InitPlan'
          git push origin HEAD:refactor/declaration-sema-v1
