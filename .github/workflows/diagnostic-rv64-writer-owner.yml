name: Diagnostic RV64 Writer Owner

on:
  push:
    branches: [diagnostic/rv64-writer-owner-v1]

permissions:
  contents: read

concurrency:
  group: diagnostic-rv64-writer-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Instrument RV64 writer owner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/target/riscv64/codegen_function.c')
          text = path.read_text()
          needle = "        if (!success) {\n        }\n"
          if text.count(needle) != 2:
              raise SystemExit(f'unexpected empty writer-failure hook count: {text.count(needle)}')
          global_hook = "        if (!success) {\n            const MinicGlobalObject *failed_object = &program->global_objects[global_index];\n            fprintf(stderr,\n                    \"RV64_WRITER_FAIL kind=global index=%zu name=%s\\\\n\",\n                    global_index,\n                    failed_object->name != NULL ? failed_object->name : \"<null>\");\n        }\n"
          function_hook = "        if (!success) {\n            const char *failed_name = minic_c0_function_symbol_name(function);\n            fprintf(stderr,\n                    \"RV64_WRITER_FAIL kind=function index=%zu name=%s\\\\n\",\n                    function_index,\n                    failed_name != NULL ? failed_name : \"<null>\");\n        }\n"
          text = text.replace(needle, global_hook, 1)
          text = text.replace(needle, function_hook, 1)
          path.write_text(text)
          PY

      - name: Build instrumented MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/linux-writer-diagnostic

      - name: Drive fixed first-100 Linux batch
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/linux-writer-diagnostic/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-writer-diagnostic-batch" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 \
          LINUX_BATCH_LIMIT=100 \
          LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh

      - name: Show writer failure identities
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'RV64 writer failure identities:'
          if test -d build/linux-writer-diagnostic-batch/minic-stderr; then
            grep -R -H 'RV64_WRITER_FAIL' build/linux-writer-diagnostic-batch/minic-stderr || true
          fi
          printf '%s\n' 'Batch summary:'
          cat build/linux-writer-diagnostic-batch/batch-summary.txt || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv64-writer-owner-${{ github.run_id }}
          path: |
            build/linux-writer-diagnostic-batch/batch-summary.txt
            build/linux-writer-diagnostic-batch/failure-contexts.txt
            build/linux-writer-diagnostic-batch/minic-stderr/**/*.stderr
          if-no-files-found: ignore
          retention-days: 3
