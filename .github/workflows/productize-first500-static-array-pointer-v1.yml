name: Productize first500 static array pointer v1

on:
  push:
    branches:
      - frontend/first500-static-array-pointer-v1
    paths:
      - 'tools/dev/materialize-first500-static-array-pointer-v1.py'
      - '.github/scripts/productize-first500-static-array-pointer-v1.sh'
      - '.github/workflows/productize-first500-static-array-pointer-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: productize-first500-static-array-pointer-v1
  cancel-in-progress: true

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout capability branch
        uses: actions/checkout@v4
        with:
          ref: frontend/first500-static-array-pointer-v1
          fetch-depth: 0

      - name: Materialize, validate, and publish first500 static mechanisms
        run: bash .github/scripts/productize-first500-static-array-pointer-v1.sh
