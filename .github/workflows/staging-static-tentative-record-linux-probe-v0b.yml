name: Staging Static Tentative Record Linux Probe V0B

on:
  push:
    branches:
      - staging/static-tentative-record-linux-probe-v0b

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout product staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Restore diagnostic-only batch probe without committing it
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh \
            > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          git status --short

      - name: Install Linux probe dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Build exact staging compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/static-tentative-linux-compiler

      - name: Probe unchanged kernel sched build_utility
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          MINIC="$GITHUB_WORKSPACE/build/static-tentative-linux-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-tentative-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=98 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/static-tentative-linux/batch-summary.txt
          printf 'BATCH_STATUS=%s\n' "$status"
          test "$status" -eq 0 -o "$status" -eq 1
