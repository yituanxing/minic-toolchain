name: Foundation Attribute Registry Migration

on:
  push:
    branches:
      - refactor/foundation-v1
    paths:
      - .github/workflows/foundation-attribute-registry-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1

      - name: Route function attribute classification through registry
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path('Makefile')
          text = makefile.read_text()
          anchor = 'MINIC_SOURCES := \\\n\tsrc/compiler/compiler.c \\\n'
          replacement = anchor + '\tsrc/frontend/attribute.c \\\n'
          if 'src/frontend/attribute.c' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('attribute registry Makefile anchor is not unique')
              text = text.replace(anchor, replacement, 1)
              makefile.write_text(text)

          path = Path('src/frontend/parser_function.c')
          text = path.read_text()
          include_anchor = '#include "frontend/parser.h"\n'
          if '#include "frontend/attribute.h"' not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit('parser_function include anchor is not unique')
              text = text.replace(
                  include_anchor,
                  '#include "frontend/attribute.h"\n' + include_anchor,
                  1,
              )

          start_marker = 'static bool function_attribute_name_is'
          end_marker = 'static bool parse_gnu_attribute_arguments'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('cannot locate legacy function attribute classification block')

          replacement = r'''static const MinicAttributeDescriptor *current_function_attribute(
              const MinicParser *parser) {
              size_t name_length;

              if (parser == NULL || parser->current.kind == MINIC_TOKEN_EOF) {
                  return NULL;
              }
              name_length = minic_parser_span_length(parser->current.span);
              return minic_attribute_lookup(
                  parser->source + parser->current.span.begin.offset, name_length);
          }

          static bool gnu_function_attribute_is_metadata(const MinicParser *parser) {
              const MinicAttributeDescriptor *descriptor;

              descriptor = current_function_attribute(parser);
              if (!minic_attribute_allowed_on(descriptor, MINIC_ATTRIBUTE_TARGET_FUNCTION)) {
                  return false;
              }
              return descriptor->semantic_class == MINIC_ATTRIBUTE_CLASS_INFORMATIONAL ||
                     descriptor->semantic_class == MINIC_ATTRIBUTE_CLASS_OPTIMIZATION ||
                     descriptor->semantic_class == MINIC_ATTRIBUTE_CLASS_CONTROL_FLOW;
          }

          static bool gnu_function_attribute_is_diagnostic(const MinicParser *parser) {
              const MinicAttributeDescriptor *descriptor;

              descriptor = current_function_attribute(parser);
              return minic_attribute_allowed_on(descriptor, MINIC_ATTRIBUTE_TARGET_FUNCTION) &&
                     descriptor->semantic_class == MINIC_ATTRIBUTE_CLASS_DIAGNOSTIC;
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY

          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Build migrated compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/attribute-registry-compiler

      - name: Run frozen Lua and Linux focused gates
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/attribute-registry-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/attribute-registry-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Commit registry migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Makefile src/frontend/attribute.c src/frontend/attribute.h src/frontend/parser_function.c
          git commit -m 'frontend: route function attributes through registry'
          git push origin HEAD:refactor/foundation-v1
