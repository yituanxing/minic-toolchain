name: Materialize External Object Declaration List V1
on:
  push:
    branches: [staging/string-octal-v1]
    paths:
      - tools/dev/materialize-external-object-declaration-list-v1.py
      - .github/workflows/materialize-external-object-declaration-list-v1.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-external-object-declaration-list-v1.py
          clang-format-18 -i src/frontend/parser_function.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/external-list
      - name: Focused external object declaration lists
        run: |
          set -Eeuo pipefail
          cat > /tmp/external-list.c <<'EOF'
          unsigned long a, b;
          unsigned long c, *d;
          const int x, y __attribute__((weak));
          int main(void) { return (int)(a + b + c + x + y + (d != 0)); }
          EOF
          build/external-list/bin/minic -S /tmp/external-list.c -o /tmp/external-list.s
          grep -Fx '.globl a' /tmp/external-list.s
          grep -Fx '.globl b' /tmp/external-list.s
          grep -Fx '.globl c' /tmp/external-list.s
          grep -Fx '.globl d' /tmp/external-list.s
          grep -Fx '.weak y' /tmp/external-list.s
      - name: Install Linux probe tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Probe unchanged do_mounts_initrd.i
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          set +e
          MINIC="$GITHUB_WORKSPACE/build/external-list/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/external-initrd" CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=3 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/external-initrd/batch-summary.txt
          echo "INITRD_PROBE_STATUS=$status"
      - name: Commit product only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-external-object-declaration-list-v1.py .github/workflows/materialize-external-object-declaration-list-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_function.c tools/dev/materialize-external-object-declaration-list-v1.py .github/workflows/materialize-external-object-declaration-list-v1.yml
          git diff --cached --check
          git commit -m 'frontend: support external object declaration lists'
          git push origin HEAD:staging/string-octal-v1
