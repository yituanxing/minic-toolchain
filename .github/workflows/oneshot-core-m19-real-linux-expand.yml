name: One-shot Core M19 Real Linux Expansion

on:
  pull_request:

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Dump exact list_empty_careful expansion
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('build/linux-focus-corpus')
          manifest = root / 'selected-tus.txt'
          row = None
          for line in manifest.read_text().splitlines():
              fields = line.split('\t', 3)
              if int(fields[0]) == 31:
                  row = fields
                  break
          if row is None:
              raise SystemExit('frozen corpus index 31 missing')
          path = root / 'kbuild' / row[2]
          text = path.read_text(errors='replace')
          print(f'CORE_M19_REAL_INPUT index=31 path={row[2]} bytes={len(text)}')
          matches = list(re.finditer(r'\blist_empty_careful\s*\(', text))
          print(f'CORE_M19_REAL_MATCHES count={len(matches)}')
          if not matches:
              raise SystemExit('list_empty_careful absent from frozen index 31')
          for n, match in enumerate(matches[:8]):
              start = max(0, match.start() - 1800)
              end = min(len(text), match.start() + 7000)
              print(f'CORE_M19_REAL_BEGIN match={n} offset={match.start()}')
              print(text[start:end])
              print(f'CORE_M19_REAL_END match={n}')
          PY

      - name: Diagnose exact frozen function status
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-core-logical-and-value-m19.py
          python3 tools/dev/instrument-core-m19-status.py
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m19-real-diag
          compiler="$GITHUB_WORKSPACE/build/core-m19-real-diag/bin/minic"
          input=$(python3 - <<'PY'
          from pathlib import Path
          root = Path('build/linux-focus-corpus')
          for line in (root / 'selected-tus.txt').read_text().splitlines():
              fields = line.split('\t', 3)
              if int(fields[0]) == 31:
                  print(root / 'kbuild' / fields[2])
                  break
          else:
              raise SystemExit('frozen corpus index 31 missing')
          PY
          )
          set +e
          MINIC_CORE_IR=strict "$compiler" -S "$input" -o build/core-m19-real-diag/out.s \
            >build/core-m19-real-diag/stdout.log 2>build/core-m19-real-diag/stderr.log
          rc=$?
          set -e
          printf 'CORE_M19_REAL_RC=%d\n' "$rc"
          grep -F 'CORE_M19_DIAG function=list_empty_careful' build/core-m19-real-diag/stderr.log || true
          grep -F "Core IR shadow" build/core-m19-real-diag/stderr.log | head -n 4 || true
          test "$rc" -ne 0

      - name: Reduce exact macro shape
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m19-real-diag/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-m19-real-reduce"
          mkdir -p "$work"

          cat >"$work/a-cfg-statement.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          extern void bad(void);
          int probe_a(const struct node *head) {
              struct node *next = ({
                  struct node *value = ({
                      do { if (!(sizeof(head->next) == sizeof(long))) bad(); } while (0);
                      (*(struct node * const volatile *)&(head->next));
                  });
                  value;
              });
              return next != (void *)0;
          }
          EOF

          cat >"$work/b-generic-statement.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_b(const struct node *head) {
              struct node *next = ({
                  struct node *value = ({
                      (*(const volatile typeof(_Generic((head->next), char: (char)0, default: (head->next))) *)&(head->next));
                  });
                  value;
              });
              return next != (void *)0;
          }
          EOF

          cat >"$work/c-cfg-generic-statement.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          extern void bad(void);
          int probe_c(const struct node *head) {
              struct node *next = ({
                  typeof(*&head->next) value = ({
                      do { if (!(sizeof(*&head->next) == sizeof(long))) bad(); } while (0);
                      (*(const volatile typeof(_Generic((*&head->next), char: (char)0, default: (*&head->next))) *)&(*&head->next));
                  });
                  value;
              });
              return next != (void *)0;
          }
          EOF

          cat >"$work/d-rhs-equality.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          extern void bad(void);
          int probe_d(const struct node *head, struct node *next) {
              return next == ({
                  do { if (!(sizeof(head->prev) == sizeof(long))) bad(); } while (0);
                  (*(const volatile typeof(_Generic((head->prev), char: (char)0, default: (head->prev))) *)&(head->prev));
              });
          }
          EOF

          cat >"$work/e-rhs-and.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          extern void bad(void);
          int probe_e(const struct node *head, struct node *next) {
              return (next == head) && (next == ({
                  do { if (!(sizeof(head->prev) == sizeof(long))) bad(); } while (0);
                  (*(const volatile typeof(_Generic((head->prev), char: (char)0, default: (head->prev))) *)&(head->prev));
              }));
          }
          EOF

          cat >"$work/f-full.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          extern void bad(void);
          int is_head(const struct node *list, const struct node *head) { return list == head; }
          int probe_f(const struct node *head) {
              struct node *next = ({
                  typeof(*&head->next) p = ({
                      do { if (!(sizeof(*&head->next) == sizeof(long))) bad(); } while (0);
                      (*(const volatile typeof(_Generic((*&head->next), char: (char)0, default: (*&head->next))) *)&(*&head->next));
                  });
                  do { if (!(sizeof(*&head->next) == sizeof(long))) bad(); } while (0);
                  __asm__ __volatile__("fence r,rw" : : : "memory");
                  p;
              });
              return is_head(next, head) && (next == ({
                  do { if (!(sizeof(head->prev) == sizeof(long))) bad(); } while (0);
                  (*(const volatile typeof(_Generic((head->prev), char: (char)0, default: (head->prev))) *)&(head->prev));
              }));
          }
          EOF

          for input in "$work"/*.i; do
            name=$(basename "$input" .i)
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name.s" \
              >"$work/$name.out" 2>"$work/$name.err"
            rc=$?
            set -e
            printf 'CORE_M19_REDUCE name=%s rc=%d\n' "$name" "$rc"
            grep -E 'CORE_M19_DIAG function=probe_|Core IR shadow' "$work/$name.err" || true
          done
