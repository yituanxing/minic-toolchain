name: Linux EFI Stub and vDSO Focused Oracles

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/linux-perf-boolean-domain-v1"
    paths:
      - '.github/workflows/linux-efi-vdso-focused-v1.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "Select independent Linux ELF/codegen focused oracle"
        type: choice
        required: true
        default: efi
        options:
          - efi
          - vdso
          - all

permissions:
  contents: read

jobs:

  efistub-diff:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'efi' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-efistub-diff]'))
    concurrency:
      group: linux-efistub-diff-v0-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 Linux prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Build current Mini toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/linux-efistub-diff-v0/toolchain"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" all
          test -x "$build/bin/minic"
          echo "LINUX_EFISTUB_TOOLCHAIN=PASS head=${GITHUB_SHA}"

      - name: Prepare pinned Linux 6.6.143 with EFI stub
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-efistub-diff-v0"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          cfg="$work/config-out"
          mkdir -p "$work"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz \
            -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$cfg" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$cfg/.config" \
            -e EFI -e EFI_STUB \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$cfg" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          grep -E '^CONFIG_EFI(=|_)' "$cfg/.config" | sort >"$work/efi-config.txt" || true
          cat "$work/efi-config.txt"
          mkdir -p "$work/out-gcc" "$work/out-mini" "$work/evidence"
          cp "$cfg/.config" "$work/out-gcc/.config"
          cp "$cfg/.config" "$work/out-mini/.config"
          cp "$work/efi-config.txt" "$work/evidence/efi-config.txt"
          echo "LINUX_EFISTUB_SOURCE=PASS release=6.6.143"

      - name: Build GCC EFI stub reference sample
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-efistub-diff-v0"
          src="$work/linux-6.6.143"
          out="$work/out-gcc"
          prefix=drivers/firmware/efi/libstub
          bases=(efi-stub-helper gop secureboot file mem random efi-stub string systable kaslr riscv riscv-stub)
          targets=()
          for base in "${bases[@]}"; do targets+=("$prefix/$base.stub.o"); done
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            -j1 V=1 "${targets[@]}" >"$work/evidence/gcc-kbuild.log" 2>&1
          for target in "${targets[@]}"; do test -s "$out/$target"; done
          echo "LINUX_EFISTUB_GCC=PASS objects=${#targets[@]}"

      - name: Build MiniC EFI stub sample
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-efistub-diff-v0"
          src="$work/linux-6.6.143"
          out="$work/out-mini"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          prefix=drivers/firmware/efi/libstub
          bases=(efi-stub-helper gop secureboot file mem random efi-stub string systable kaslr riscv riscv-stub)
          targets=()
          for base in "${bases[@]}"; do targets+=("$prefix/$base.stub.o"); done
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare
          MINIC="$work/toolchain/bin/minic" \
          REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 \
          MINIC_KBUILD_TRACE="$work/evidence/minic-kbuild.trace" \
          CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j1 V=1 "${targets[@]}" \
              >"$work/evidence/mini-kbuild.log" 2>&1
          for target in "${targets[@]}"; do test -s "$out/$target"; done
          echo "LINUX_EFISTUB_MINI=PASS objects=${#targets[@]}"

      - name: Compare EFI stub undefined symbols
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-efistub-diff-v0"
          ev="$work/evidence"
          prefix=drivers/firmware/efi/libstub
          bases=(efi-stub-helper gop secureboot file mem random efi-stub string systable kaslr riscv riscv-stub)
          bad=0
          for base in "${bases[@]}"; do
            for lane in gcc mini; do
              obj="$work/out-$lane/$prefix/$base.stub.o"
              riscv64-linux-gnu-nm -u "$obj" \
                | sed -E 's/^[[:space:]]*[A-Za-z]?[[:space:]]*//' \
                | sed '/^$/d' | sort -u >"$ev/$lane-$base.undefined"
              riscv64-linux-gnu-readelf -Wr "$obj" >"$ev/$lane-$base.relocs"
            done
            comm -13 "$ev/gcc-$base.undefined" "$ev/mini-$base.undefined" >"$ev/$base.only-mini"
            comm -23 "$ev/gcc-$base.undefined" "$ev/mini-$base.undefined" >"$ev/$base.only-gcc"
            gcc_n=$(wc -l < "$ev/gcc-$base.undefined")
            mini_n=$(wc -l < "$ev/mini-$base.undefined")
            mini_only_n=$(wc -l < "$ev/$base.only-mini")
            gcc_only_n=$(wc -l < "$ev/$base.only-gcc")
            echo "EFISTUB_DIFF base=$base gcc=$gcc_n mini=$mini_n mini_only=$mini_only_n gcc_only=$gcc_only_n"
            if test "$mini_only_n" -ne 0 || test "$gcc_only_n" -ne 0; then
              echo "--- $base Mini-only ---"
              cat "$ev/$base.only-mini"
              echo "--- $base GCC-only ---"
              cat "$ev/$base.only-gcc"
              bad=$((bad + 1))
            fi
          done
          test "$bad" -eq 0
          echo "LINUX_EFISTUB_UNDEFINED_DIFF=PASS exact=${#bases[@]}/${#bases[@]}"

      - name: Preserve EFI stub evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-efistub-diff-v0
          path: build/linux-efistub-diff-v0/evidence/
          if-no-files-found: ignore
          retention-days: 7


  vdso:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'vdso' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-vdso-focused]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install focused prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            binutils-riscv64-linux-gnu bc bison flex libssl-dev libelf-dev \
            make curl xz-utils file

      - name: Prepare Linux and GCC vDSO reference
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-vdso-focused"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work/reference"

          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 \
            arch/riscv/kernel/vdso/vdso.so.dbg

          cp "$out/arch/riscv/kernel/vdso/vgettimeofday.o" "$work/reference/vgettimeofday.gcc.o"
          cp "$out/arch/riscv/kernel/vdso/hwprobe.o" "$work/reference/hwprobe.gcc.o"
          cp "$out/arch/riscv/kernel/vdso/vdso.so.dbg" "$work/reference/vdso.gcc.so.dbg"

          for file in "$work/reference/"*.o "$work/reference/"*.so.dbg; do
            riscv64-linux-gnu-size -A "$file" >"$file.size.txt"
            riscv64-linux-gnu-readelf -SW "$file" >"$file.sections.txt"
            riscv64-linux-gnu-readelf -sW "$file" >"$file.symbols.txt"
          done
          echo "LINUX_VDSO_GCC_REFERENCE=PASS"

      - name: Build exact MiniC
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-vdso-focused-compiler

      - name: Rebuild only native vDSO C through MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-vdso-focused"
          src="$work/linux-6.6.143"
          out="$work/out"
          vdso="$out/arch/riscv/kernel/vdso"

          rm -f \
            "$vdso/vgettimeofday.o" "$vdso/hwprobe.o" \
            "$vdso/vdso.so" "$vdso/vdso.so.dbg" "$vdso/vdso.so.dbg.tmp" \
            "$vdso/.vgettimeofday.o.cmd" "$vdso/.hwprobe.o.cmd" \
            "$vdso/.vdso.so.cmd" "$vdso/.vdso.so.dbg.cmd"

          export MINIC="$GITHUB_WORKSPACE/build/linux-vdso-focused-compiler/bin/minic"
          export REAL_CC=riscv64-linux-gnu-gcc
          export MINIC_KEEP_INTERMEDIATES=1
          export MINIC_KBUILD_TRACE="$work/minic-vdso.trace"

          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            CC="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh" \
            -j1 arch/riscv/kernel/vdso/vdso.so.dbg \
            >"$work/minic-vdso.log" 2>&1
          status=$?
          set -e

          test -s "$vdso/vgettimeofday.o"
          test -s "$vdso/hwprobe.o"
          cp "$vdso/vgettimeofday.o" "$work/vgettimeofday.minic.o"
          cp "$vdso/hwprobe.o" "$work/hwprobe.minic.o"
          for file in "$work/"*.minic.o; do
            riscv64-linux-gnu-size -A "$file" >"$file.size.txt"
            riscv64-linux-gnu-readelf -SW "$file" >"$file.sections.txt"
            riscv64-linux-gnu-readelf -sW "$file" >"$file.symbols.txt"
          done

          python3 - "$work" "$status" <<'PY'
          from pathlib import Path
          import re, sys
          work=Path(sys.argv[1])
          status=int(sys.argv[2])

          def section_size(path: Path, section: str) -> int:
              text=path.read_text(errors="replace")
              for line in text.splitlines():
                  parts=line.split()
                  if len(parts) >= 2 and parts[0] == section:
                      return int(parts[1], 10)
              return 0

          pairs=[
              ("vgettimeofday", work/"reference/vgettimeofday.gcc.o.size.txt", work/"vgettimeofday.minic.o.size.txt"),
              ("hwprobe", work/"reference/hwprobe.gcc.o.size.txt", work/"hwprobe.minic.o.size.txt"),
          ]
          for name,gcc,mini in pairs:
              gt=section_size(gcc, ".text")
              mt=section_size(mini, ".text")
              ratio=(mt/gt) if gt else 0.0
              print(f"LINUX_VDSO_SIZE object={name} gcc_text={gt} minic_text={mt} ratio={ratio:.3f}")

          log=(work/"minic-vdso.log").read_text(errors="replace")
          if status == 0:
              print("LINUX_VDSO_FOCUSED=PASS minic_link=PASS")
          elif "overlaps section" in log and ".eh_frame" in log:
              print("LINUX_VDSO_FOCUSED=CLASSIFIED class=metadata-reserve-overlap")
          else:
              print(f"LINUX_VDSO_FOCUSED=UNEXPECTED status={status}")
              sys.exit(status or 1)
          PY

          tail -n 120 "$work/minic-vdso.log"

      - name: Preserve vDSO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-vdso-focused
          path: |
            build/linux-vdso-focused/reference/*
            build/linux-vdso-focused/*.minic.o
            build/linux-vdso-focused/*.txt
            build/linux-vdso-focused/*.log
            build/linux-vdso-focused/minic-vdso.trace
            build/linux-vdso-focused/out/arch/riscv/kernel/vdso/*.minic-stage2.s
          if-no-files-found: ignore
          retention-days: 2
