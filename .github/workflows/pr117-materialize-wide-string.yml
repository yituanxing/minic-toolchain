name: PR117 Materialize Wide String
on:
  push:
    branches: [agent/wide-string-literal-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize target-aware wide strings
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr117-materialize.py
          clang-format-18 -i \
            src/frontend/token.h \
            src/frontend/token.c \
            src/frontend/lexer.c \
            src/target/target_info.h \
            src/target/target_info.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_core.c \
            src/frontend/parser_string.c \
            src/frontend/parser_postfix.c \
            tests/frontend/lexer_test.c \
            tests/compiler/c0/wide_string_literal.c \
            tests/compiler/c0/invalid_indirect_nested_diagnostic.c \
            tests/compiler/c0/invalid_mixed_string_encoding.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr117-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-wide-string-literal.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr117-materialize.py .github/workflows/pr117-materialize-wide-string.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): model target-aware wide string literals'
          git push origin HEAD:agent/wide-string-literal-v0
