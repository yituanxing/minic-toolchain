              >"$root/evidence/core-lazy-$safe.stdout" \
              2>"$root/evidence/core-lazy-$safe.log"
            python3 - "$root/core-lazy-ab/$safe" \
              "$root/evidence/core-lazy-$safe.log" "$owner" <<'PYAUDIT'
          import hashlib,json,re,sys
          from pathlib import Path
          folder,log,owner=Path(sys.argv[1]),Path(sys.argv[2]),sys.argv[3]
          expected=json.loads((folder/"paired-result.json").read_text())["assembly_sha256"]
          assert hashlib.sha256((folder/"lazy-audit.s").read_bytes()).hexdigest()==expected
          matches=re.findall(r"^MINIC_CORE_REENTRY_INDEX ready=([01]) incoming=(\d+) "
                             r"indexed_if=(\d+) indexed_loop=(\d+) "
                             r"statements=(\d+) expressions=(\d+)$",
                             log.read_text(),re.MULTILINE)
          assert len(matches)==1, "need one ready=0/1 index census"
          ready,incoming,queries_if,queries_loop,statements,expressions=map(int,matches[0])
          # Proven previous eager baseline had zero queries on all three
          # controls; this new policy must avoid building for exactly those TUs.
          if owner in ("mm/shmem_quota.o","fs/ext4/xattr_security.o",
                       "arch/riscv/purgatory/ctype.o"):
              assert ready==0, "lazy must not construct a never-used index"
          else:
              assert ready==1, "active Core query unexpectedly lost its index"
          print("MINIC_CORE_LAZY_CENSUS=PASS owner=%s ready=%d incoming=%d "
                "indexed_if=%d indexed_loop=%d statements=%d expressions=%d"%
                (owner,ready,incoming,queries_if,queries_loop,statements,expressions))
          PYAUDIT
          done < "$root/evidence/core-lazy-inputs.tsv"
          python3 - "$root/core-lazy-ab" <<'PY' \
            | tee "$root/evidence/core-lazy-summary.txt"
          import json,sys
          from pathlib import Path
