          stage2="$GITHUB_WORKSPACE/build/bootstrap-stage2-realprograms/artifact/build/bootstrap-current-b1/stage2/minic-stage2-rv64"
          printf '%s  %s\n' 17e76f14befdd46b18d62b4ab90cbf15cd724e281b216039a252528208b6f94d "$stage2" \
