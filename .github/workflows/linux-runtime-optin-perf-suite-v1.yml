          grep -Fq 'BOOTSTRAP_STAGE2_NATIVE_RUNTIME=PASS tools=8 suites=8 runtime_chain=42 all_mini_pp_cc_as_ld=true nm_strip_oracles=true driver_chain=42' \
            "$GITHUB_WORKSPACE/build/bootstrap-stage2-native/verdict.log"

      # Stage3 76/77 matched musl ABI objects from #39058200575 are SHA-pinned;
