          test -x "$root/baseline-toolchain/bin/minic" && test -x "$root/toolchain/bin/minic"
          old_sha=$(sha256sum "$root/baseline-toolchain/bin/minic-cc" | cut -d' ' -f1)
          new_sha=$(sha256sum "$root/toolchain/bin/minic-cc" | cut -d' ' -f1)
          test "$old_sha" != "$new_sha" || {
            echo 'MINIC_BROAD_AB=FAIL identical_compilers' >&2
            exit 9
          }
          echo "MINIC_BROAD_AB=BUILT old_sha=$old_sha current_sha=$new_sha historical=$historical" | tee "$root/evidence/oldnew-identities.txt"

      # Exact one-factor Parser A/B: the pristine parent differs only in
      # parser_type.c. Reuse the same already-certified runtime toolchain
      # builder and frozen first500 .i inputs; NEVER launch a 2064-owner build.
      - name: Build parent/current MiniC from one source change under identical profile
        if: contains(github.event.head_commit.message, '[minic-parser-copy-ab]') || contains(github.event.head_commit.message, '[minic-integer-owner-ab]') || contains(github.event.head_commit.message, '[minic-integer-owner-ab500]') || contains(github.event.head_commit.message, '[minic-core-reentry-ab]') || contains(github.event.head_commit.message, '[minic-core-reentry-ab500]') || contains(github.event.head_commit.message, '[minic-core-regression-triage]') || contains(github.event.head_commit.message, '[minic-core-lazy-ab]') || contains(github.event.head_commit.message, '[minic-core-lazy-ab500]') || contains(github.event.head_commit.message, '[minic-boolean-owner-ab]') || contains(github.event.head_commit.message, '[minic-boolean-owner-ab500]') || contains(github.event.head_commit.message, '[minic-boolean-regression-triage]')
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
