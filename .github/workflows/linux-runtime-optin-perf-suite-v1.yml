          owners=("kernel/bpf/btf.o","fs/ext4/fsync.o","mm/memcontrol.o",
                  "kernel/events/core.o","fs/ext4/super.o")
          with (root/"evidence"/(trial+"-inputs.tsv")).open("w") as f:
              for owner in owners:
                  if owner not in selected: raise SystemExit("missing owner "+owner)
                  source=(corpus/"kbuild"/selected[owner]).resolve()
                  assert source.is_file() and source.is_relative_to((corpus/"kbuild").resolve())
                  print(owner+"\t"+str(source),file=f)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
