          git show "$parent:$source_file" > "$source_file"
          if [[ "$trial" == integer-owner ]]; then
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          if [[ "$trial" == boolean-owner ]]; then
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          if [[ "$trial" == core-lazy ]]; then
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          if [[ "$trial" == core-reentry ]]; then
            # Restore ALL three changed production files, not just core_lower.c.
            # Both compilers must use their own exact SHA-pinned native profile.
            git show "$parent:src/core/core_lower.h" > src/core/core_lower.h
            git show "$parent:src/compiler/compiler.c" > src/compiler/compiler.c
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          git diff --check
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-before" "$root/evidence/$trial-before"
          git reset --hard HEAD
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-after" "$root/evidence/$trial-after"
          git diff --check
          before=$(sha256sum "$root/$trial-before/bin/minic-cc" | cut -d' ' -f1)
          after=$(sha256sum "$root/$trial-after/bin/minic-cc" | cut -d' ' -f1)
          test "$before" != "$after"
          echo "MINIC_SINGLE_FACTOR_BINARIES=PASS trial=$trial base_commit=$parent before_cc_sha=$before after_cc_sha=$after" \
            | tee "$root/evidence/$trial-binaries.txt"

      # One-factor candidate: keep production C sources unchanged in Git.
      # Reuse the historical paired 2-TU parser A/B lane, old frozen .i cache,
      # and the same runtime profile, but apply the lookahead patch only in
      # this disposable Actions checkout after the baseline binary is built.
      - name: Build unmodified and lexer-only lookahead Parser MiniC
        if: contains(github.event.head_commit.message, '[minic-parser-lexer-lookahead-ab]') || contains(github.event.head_commit.message, '[minic-parser-enum-bind-ab]')
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          if [[ "${{ contains(github.event.head_commit.message, '[minic-parser-enum-bind-ab]') && '1' || '0' }}" == 1 ]]; then
            trial=parser-enum-bind
            source_file=src/frontend/parser_enum.c
            patch=tools/ci/apply-perf-parser-enum-binding-global-index-v1.py
          else
            trial=parser-lookahead
            source_file=src/frontend/parser_function.c
            patch=tools/ci/apply-perf-parser-top-level-lexer-lookahead-v1.py
          fi
          git diff --exit-code -- "$source_file"
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-before" "$root/evidence/$trial-before"
          python3 "$patch"
          git diff --check
          test "$(git diff --name-only -- src include)" = "$source_file"
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-after" "$root/evidence/$trial-after"
          before=$(sha256sum "$root/$trial-before/bin/minic-cc" | cut -d' ' -f1)
          after=$(sha256sum "$root/$trial-after/bin/minic-cc" | cut -d' ' -f1)
          test "$before" != "$after"
          echo "MINIC_PARSER_LOOKAHEAD_BUILT=PASS trial=$trial before_cc_sha=$before after_cc_sha=$after" \
            | tee "$root/evidence/$trial-binaries.txt"

      # Opt-in candidate only. The deployed compiler source remains unchanged.
      # Build the certified native runtime profile once, then patch just one
      # C source in this disposable Actions checkout and rebuild to a new dir.
      # This avoids the manifest's production-source SHA gate claiming the
      # experimental source is already QEMU/P1-certified.
      - name: Build existing versus Core reachability name-index MiniC
        if: contains(github.event.head_commit.message, '[minic-core-name-index-ab]') || contains(github.event.head_commit.message, '[minic-core-name-index-ab500]') || contains(github.event.head_commit.message, '[minic-parser-string-lexer-ab]') || contains(github.event.head_commit.message, '[minic-ast-array-owner-ab]') || contains(github.event.head_commit.message, '[minic-ast-array-owner-ab500]') || contains(github.event.head_commit.message, '[minic-ast-array-regression-triage]')
        timeout-minutes: 14
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          if [[ "${{ contains(github.event.head_commit.message, '[minic-ast-array-regression-triage]') && '1' || '0' }}" == 1 ]]; then
            trial=ast-array-triage
            source_file=src/frontend/ast_verifier.c
            patch=tools/ci/revert-perf-ast-array-owner-pass-for-ab-v1.py
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-ast-array-owner-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-ast-array-owner-ab500]') && '1' || '0' }}" == 1 ]]; then
            trial=ast-array-owner
            source_file=src/frontend/ast_verifier.c
            patch=tools/ci/apply-perf-ast-array-owner-pass-v1.py
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-parser-string-lexer-ab]') && '1' || '0' }}" == 1 ]]; then
            trial=parser-string-lexer
            source_file=src/frontend/parser_string.c
            patch=tools/ci/apply-perf-parser-string-lexer-lookahead-v1.py
          else
            trial=core-name-index
            source_file=src/compiler/compiler.c
            patch=tools/ci/apply-perf-core-reachability-name-index-v1.py
          fi
          git diff --exit-code -- "$source_file"
          if [[ "$trial" == ast-array-triage ]]; then
            python3 "$patch"
            test "$(git hash-object "$source_file")" = f3e023c69f5bcbd7093cffb8f68cf6ced46d5d49
          fi
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-before" "$root/evidence/$trial-before"
          if [[ "$trial" == ast-array-triage ]]; then
            git reset --hard HEAD
            MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
              bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
                "$root/$trial-after" "$root/evidence/$trial-after"
            # Verify AST rejection contracts independently of 500 positive compiles.
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$root/$trial-after" \
              check-ast-contract >"$root/evidence/ast-array-contract-test.txt" 2>&1
            echo MINIC_AST_ARRAY_CONTRACT=PASS | tee -a "$root/evidence/ast-array-contract-test.txt"
          else
            python3 "$patch"
            git diff --check
            test "$(git diff --name-only -- src include)" = "$source_file"
            make -j4 MODE=release CFLAGS=-Werror \
              BUILD_DIR="$root/$trial-after" \
              "$root/$trial-after/bin/minic" "$root/$trial-after/bin/minic-cc" >/dev/null
          fi
          before=$(sha256sum "$root/$trial-before/bin/minic-cc" | cut -d' ' -f1)
          after=$(sha256sum "$root/$trial-after/bin/minic-cc" | cut -d' ' -f1)
          test "$before" != "$after"
          if [[ "$trial" == ast-array-triage ]]; then
            test "$before" = 3312167e34cd81f2454b9b00ce23e31b67309b3d3cc666b4e85b1c40b6210012
            test "$after" = 96e8f2dcaebd3c80852e57e734420bafdfebbb239618bb6d34c9be5b1c541ff4
            echo MINIC_AST_RECHECK_EXACT_BINARIES=PASS
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[minic-ast-array-owner-ab500]') && '1' || '0' }}" == 1 ]]; then
            ln -s "$root/$trial-before" "$root/baseline-toolchain"
            ln -s "$root/$trial-after" "$root/toolchain"
          fi
          # Alias the exact two built profiles for the preexisting 500-TU
          # differential test, rather than duplicate its CI job or scripts.
          if [[ "${{ contains(github.event.head_commit.message, '[minic-core-name-index-ab500]') && '1' || '0' }}" == 1 ]]; then
            ln -s "$root/$trial-before" "$root/baseline-toolchain"
            ln -s "$root/$trial-after" "$root/toolchain"
          fi
          printf 'MINIC_CORE_NAME_INDEX_PAIR=PASS base_sha=%s indexed_sha=%s\n' "$before" "$after" \
            | tee "$root/evidence/$trial-binaries.txt"

      - name: Build baseline and integrated optimization from clean sources
        if: "!contains(github.event.head_commit.message, '[minic-source-broad-ab]') && !contains(github.event.head_commit.message, '[minic-current-phase20]') && !contains(github.event.head_commit.message, '[minic-cpu-profile-only]') && !contains(github.event.head_commit.message, '[minic-parser-cold-switch-ab]') && !contains(github.event.head_commit.message, '[minic-parser-cold-switch-ab500]') && !contains(github.event.head_commit.message, '[minic-parser-cold-switch-triage]') && !contains(github.event.head_commit.message, '[minic-parser-cold-switch-safety]') && !contains(github.event.head_commit.message, '[minic-boolean-domain-ab20]') && !contains(github.event.head_commit.message, '[minic-boolean-domain-ab500]') && !contains(github.event.head_commit.message, '[minic-parser-copy-ab]') && !contains(github.event.head_commit.message, '[minic-parser-lexer-lookahead-ab]') && !contains(github.event.head_commit.message, '[minic-parser-enum-bind-ab]') && !contains(github.event.head_commit.message, '[minic-core-name-index-ab]') && !contains(github.event.head_commit.message, '[minic-parser-string-lexer-ab]') && !contains(github.event.head_commit.message, '[minic-ast-array-owner-ab]') && !contains(github.event.head_commit.message, '[minic-ast-array-owner-ab500]') && !contains(github.event.head_commit.message, '[minic-ast-array-regression-triage]') && !contains(github.event.head_commit.message, '[minic-ast-shape-census]') && !contains(github.event.head_commit.message, '[minic-functiontype-exact-ab]') && !contains(github.event.head_commit.message, '[minic-ast-call-inline8-ab]') && !contains(github.event.head_commit.message, '[minic-ast-call-inline8-ab500]') && !contains(github.event.head_commit.message, '[minic-ast-call-inline8-safety]') && !contains(github.event.head_commit.message, '[minic-function-param-exact-ab]') && !contains(github.event.head_commit.message, '[minic-function-param-exact-ab500]') && !contains(github.event.head_commit.message, '[minic-function-param-exact-triage]') && !contains(github.event.head_commit.message, '[minic-function-param-contract]') && !contains(github.event.head_commit.message, '[minic-ast-packed-call-ab]') && !contains(github.event.head_commit.message, '[minic-ast-packed-call-ab500]') && !contains(github.event.head_commit.message, '[minic-ast-packed-call-edge]') && !contains(github.event.head_commit.message, '[minic-ast-packed-call-regression]') && !contains(github.event.head_commit.message, '[minic-type-layout-ab]') && !contains(github.event.head_commit.message, '[minic-type-layout-ab500]') && !contains(github.event.head_commit.message, '[minic-type-layout-regression]') && !contains(github.event.head_commit.message, '[minic-core-name-index-ab500]') && !contains(github.event.head_commit.message, '[minic-integer-owner-ab]') && !contains(github.event.head_commit.message, '[minic-integer-owner-ab500]') && !contains(github.event.head_commit.message, '[minic-next-stage-audit]') && !contains(github.event.head_commit.message, '[minic-core-reentry-ab]') && !contains(github.event.head_commit.message, '[minic-core-reentry-ab500]') && !contains(github.event.head_commit.message, '[minic-core-regression-triage]') && !contains(github.event.head_commit.message, '[minic-core-lazy-ab]') && !contains(github.event.head_commit.message, '[minic-core-lazy-ab500]') && !contains(github.event.head_commit.message, '[minic-boolean-owner-ab]') && !contains(github.event.head_commit.message, '[minic-boolean-owner-ab500]') && !contains(github.event.head_commit.message, '[minic-boolean-regression-triage]') && !contains(github.event.head_commit.message, '[minic-symbolic-source-call-ab]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$work/evidence"
          # Both profiles are rebuilt independently: headers such as
          # parser_internal.h change MinicParser layout (ABI).
          MINIC_PERF_SKIP_VERIFIED_OPTIMIZATIONS=1 \
            bash tools/ci/linux-perf-build-minic-profile-v1.sh \
            "$work/baseline-toolchain" "$work/evidence/baseline-profile"
          grep -qx 'apply-perf-core-lower-statement-workspace-v1.py' \
            "$work/evidence/baseline-profile/minic-profile.txt"
          grep -qx 'SKIPPED_VERIFIED_PERF_PATCH=apply-inline-specialization-local-boolean-domain-scoped-v1.py' \
            "$work/evidence/baseline-profile/patch.log"
          grep -qx 'SKIPPED_VERIFIED_PERF_PATCH=apply-perf-parser-typedef-index-v1.py' \
            "$work/evidence/baseline-profile/patch.log"
          # This resets only the disposable Actions checkout; cached build/linux
          # input artifacts are untracked and not touched.
          git reset --hard HEAD
          bash tools/ci/linux-perf-build-minic-profile-v1.sh \
            "$work/toolchain" "$work/evidence/integrated-profile"
          grep -qx 'apply-inline-specialization-local-boolean-domain-scoped-v1.py' \
            "$work/evidence/integrated-profile/minic-profile.txt"
          grep -qx 'apply-perf-parser-typedef-index-v1.py' \
            "$work/evidence/integrated-profile/minic-profile.txt"
          git diff --check
          sha256sum "$work/baseline-toolchain/bin/minic" "$work/baseline-toolchain/bin/minic-cc" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" \
            | tee "$work/evidence/paired-binary.sha256"
          ! cmp -s "$work/baseline-toolchain/bin/minic-cc" "$work/toolchain/bin/minic-cc"

      - name: Restore certified first500 inputs
        id: corpus-restore
        uses: actions/cache/restore@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}

      - name: Verify restored first500 inputs
        id: corpus-verify
        shell: bash
        run: |
          set -Eeuo pipefail
          corpus=build/linux-perf-corpus
          if test -s "$corpus/selected-tus.txt" &&
             test "$(grep -cve '^[[:space:]]*$' "$corpus/selected-tus.txt")" -eq 500 &&
             test -s "$corpus/inputs.sha256" &&
             test "$(wc -l < "$corpus/inputs.sha256")" -eq 500 &&
             sha256sum --status --check "$corpus/inputs.sha256"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "PERF_CORPUS_CACHE=VERIFIED selected=500"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "PERF_CORPUS_CACHE=MISS_OR_INVALID"
            rm -rf "$corpus"
          fi

      - name: Install Linux prerequisites only on cache miss
        if: steps.corpus-verify.outputs.valid != 'true'
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends             build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu             libc6-dev-riscv64-cross bc bison flex libssl-dev libelf-dev             make curl xz-utils python3
          riscv64-linux-gnu-gcc --version | head -n1

      - name: Materialize exact historical first500 inputs
        if: steps.corpus-verify.outputs.valid != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$GITHUB_WORKSPACE/build/linux-cache"
          archive="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors             https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          echo "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932  $archive" | sha256sum -c -
          selection=$(grep -Ev '^[[:space:]]*(#|$)' tests/external/linux/replay-indices.txt | paste -sd, - || true)
          start_ns=$(date +%s%N)
          set +e
          MINIC="$work/toolchain/bin/minic"           BUILD_DIR="$GITHUB_WORKSPACE/build/linux-perf-materialize"           LINUX_ARCHIVE_CACHE="$archive"           CROSS_COMPILE=riscv64-linux-gnu-           LINUX_BATCH_OFFSET=0           LINUX_BATCH_LIMIT=500           LINUX_BATCH_JOBS=4           LINUX_BATCH_SELECTION="$selection"           LINUX_BATCH_MATERIALIZE_ONLY=1             sh tests/external/linux/batch_probe.sh
          materialize_rc=$?
          set -e
          end_ns=$(date +%s%N)
          echo "MATERIALIZE_ONLY=1 MATERIALIZE_RC=$materialize_rc MATERIALIZE_WALL_MS=$(((end_ns-start_ns)/1000000))"             | tee "$work/evidence/materialize.txt"
          test -s "$GITHUB_WORKSPACE/build/linux-perf-materialize/selected-tus.txt"
          test "$(grep -cve '^[[:space:]]*$' "$GITHUB_WORKSPACE/build/linux-perf-materialize/selected-tus.txt")" -eq 500
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path("build/linux-perf-materialize")
          dst=Path("build/linux-perf-corpus")
          shutil.rmtree(dst,ignore_errors=True)
          (dst/"kbuild").mkdir(parents=True)
          selected=src/"selected-tus.txt"
          shutil.copy2(selected,dst/"selected-tus.txt")
          manifest=src/"tu-manifest.txt"
          if manifest.is_file():
              shutil.copy2(manifest,dst/"tu-manifest.txt")
          for row in selected.read_text().splitlines():
              _,_,rel_i,_=row.split("\t",3)
              s=src/"kbuild"/rel_i
              d=dst/"kbuild"/rel_i
              if not s.is_file() or s.stat().st_size==0:
                  raise SystemExit(f"missing frozen input: {s}")
              d.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(s,d)
          print("PERF_CORPUS_FROZEN selected=500")
          PY
          find build/linux-perf-corpus/kbuild -type f -name '*.i' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > build/linux-perf-corpus/inputs.sha256
          test "$(wc -l < build/linux-perf-corpus/inputs.sha256)" -eq 500

      - name: Save verified first500 corpus
        if: steps.corpus-verify.outputs.valid != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}

      # One-factor source-scoped Symbolic CALL buckets, not the already
      # rejected PERF-023 global CALL-only index. Uses the existing job/corpus.
      - name: Five-owner source-scoped Symbolic CALL buckets A/B
        if: contains(github.event.head_commit.message, '[minic-symbolic-source-call-ab]')
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make time >/dev/null
          bash tools/ci/linux-perf-symbolic-source-bucket-screen-v1.sh \
            "$root" "$corpus" | tee "$root/evidence/symbolic-source-call-screen.log"
          grep -Fq 'MINIC_SYMBOLIC_SOURCE_BUCKET_AB=PASS' \
            "$root/evidence/symbolic-source-call-screen.log"

      # Ownership safety gate before any production change: the only
      # original switch storage owner is the top-level Parser; speculative
      # lexer snapshots must not change cases. Negative syntax paths must
      # free it. Use the existing perf500 job, not a new workflow/job.
      - name: ASan and UBSan Parser cold switch nested and failure contracts
        if: contains(github.event.head_commit.message, '[minic-parser-cold-switch-safety]')
        timeout-minutes: 19
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          trial=parser-cold-switch-safety
          mkdir -p "$root/evidence" "$root/$trial"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial/before" "$root/evidence/$trial-before"
          python3 tools/ci/apply-perf-parser-cold-switch-context-v1.py
          git diff --check
          test "$(git diff --name-only -- src include | wc -l)" -eq 3
          make -j4 MODE=release CFLAGS=-Werror \
            BUILD_DIR="$root/$trial/after" \
            "$root/$trial/after/bin/minic" "$root/$trial/after/bin/minic-cc" \
            check-ast-contract check-type \
            >"$root/evidence/$trial-release-contract.log" 2>&1 || {
              tail -n 100 "$root/evidence/$trial-release-contract.log";exit 41
            }
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            make -j4 MODE=sanitize CFLAGS=-Werror \
              BUILD_DIR="$root/$trial/sanitized" \
              "$root/$trial/sanitized/bin/minic" \
              "$root/$trial/sanitized/bin/minic-cc" \
              check-ast-contract check-type \
            >"$root/evidence/$trial-sanitized-contract.log" 2>&1 || {
              tail -n 140 "$root/evidence/$trial-sanitized-contract.log";exit 42
            }
          echo "MINIC_PARSER_COLD_SWITCH_SANITIZER_CONTRACT=PASS"
          python3 tools/ci/linux-perf-parser-cold-switch-safety-v1.py \
            --baseline-driver "$root/$trial/before/bin/minic-cc" \
            --candidate-driver "$root/$trial/after/bin/minic-cc" \
            --sanitize-driver "$root/$trial/sanitized/bin/minic-cc" \
            --out "$root/$trial/fixtures" \
            | tee "$root/evidence/$trial-results.txt"
          grep -Fq 'MINIC_PARSER_COLD_SWITCH_SAFETY=PASS cases=9 arms=3' \
            "$root/evidence/$trial-results.txt"

      # New cost model, distinct from the rejected parser_string and
      # record lookahead spot-fixes: 16*512*2 fixed switch-case uint64s
      # are embedded in EVERY MinicParser (~133KiB), even for lexer-only
      # snapshots. Profile #39014430010 found 1.546/2.667 GiB nominal
      # Parser copies on the same source; trial relocates only cold cases.
      - name: Whitebox A/B cold switch contexts, 5 frozen owners and switch edge
        if: contains(github.event.head_commit.message, '[minic-parser-cold-switch-ab]') || contains(github.event.head_commit.message, '[minic-parser-cold-switch-ab500]')
        timeout-minutes: 26
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          trial=parser-cold-switch
          mkdir -p "$root/evidence" "$root/$trial-ab"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make time >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-before" "$root/evidence/$trial-before"
          cat > "$root/$trial-ab/layout_sizes.c" <<'CSIZES'
          #include "frontend/parser_internal.h"
          #include <stdio.h>
          int main(void) {
              printf("parser=%zu context=%zu total_old_cases=%zu\n",
                     sizeof(MinicParser),sizeof(MinicParserSwitchContext),
                     (size_t)MINIC_PARSER_MAX_SWITCH_DEPTH*sizeof(MinicParserSwitchContext));
              return 0;
          }
          CSIZES
          cc -Isrc -Iinclude -o "$root/$trial-ab/size-before" "$root/$trial-ab/layout_sizes.c"
          "$root/$trial-ab/size-before" | tee "$root/evidence/$trial-before-sizes.txt"
          python3 tools/ci/apply-perf-parser-cold-switch-context-v1.py
          git diff --check
          test "$(git diff --name-only -- src include | wc -l)" -eq 3
          cc -Isrc -Iinclude -o "$root/$trial-ab/size-after" "$root/$trial-ab/layout_sizes.c"
          "$root/$trial-ab/size-after" | tee "$root/evidence/$trial-after-sizes.txt"
          python3 - "$root/evidence/$trial-before-sizes.txt" "$root/evidence/$trial-after-sizes.txt" <<'PY'
          from pathlib import Path
          import sys,re
          before=int(re.search(r"parser=(\d+)",Path(sys.argv[1]).read_text()).group(1))
          after=int(re.search(r"parser=(\d+)",Path(sys.argv[2]).read_text()).group(1))
          assert before>131072 and after<4096,(before,after)
          print(f"MINIC_PARSER_COLD_SWITCH_SIZE=PASS before={before} after={after}")
          PY
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$root/$trial-after" \
            "$root/$trial-after/bin/minic" "$root/$trial-after/bin/minic-cc" \
            check-ast-contract check-type \
            >"$root/evidence/$trial-build-contract.log" 2>&1 || {
              tail -n 100 "$root/evidence/$trial-build-contract.log";exit 53
            }
          echo 'MINIC_PARSER_COLD_SWITCH_CONTRACT=PASS'
          cat > "$root/$trial-ab/switch-edge.i" <<'CFILE'
          long nested_switch(long x, long y) {
              switch (x) {
                  case -1: return 1;
                  case 0:
                      switch (y) {
                          case -1: return -2;
                          case 0x100000000L: return 7;
                          default: return 8;
                      }
                  case 0x100000000L: return 3;
                  default: return x;
              }
          }
          CFILE
          for mode in before after; do
            "$root/$trial-$mode/bin/minic-cc" -S "$root/$trial-ab/switch-edge.i" \
              -o "$root/$trial-ab/switch-edge-$mode.s"
          done
          cmp "$root/$trial-ab/switch-edge-before.s" "$root/$trial-ab/switch-edge-after.s"
          echo 'MINIC_PARSER_COLD_SWITCH_EDGE=PASS nested=true int64_cases=true assembly_identical=true'
          if [[ "${{ contains(github.event.head_commit.message, '[minic-parser-cold-switch-ab500]') && '1' || '0' }}" == 1 ]]; then
            ln -s "$root/$trial-before" "$root/baseline-toolchain"
            ln -s "$root/$trial-after" "$root/toolchain"
            echo "MINIC_PARSER_COLD_SWITCH_FIRST500_READY=PASS base_current=true cold_pointer_only=true"
            exit 0
          fi
          python3 - "$corpus" "$root" "$trial" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:3]);trial=sys.argv[3]
          entries={}
          for row in (corpus/"selected-tus.txt").read_text().splitlines():
              p=row.split("\t",3)
              if len(p)!=4:raise SystemExit("bad pinned manifest")
              entries[p[1]]=p[2]
          assert len(entries)==500
          owners=("fs/ext4/fsync.o","kernel/bpf/btf.o","kernel/events/core.o",
                  "mm/memcontrol.o","arch/riscv/purgatory/ctype.o")
          with (root/"evidence"/(trial+"-inputs.tsv")).open("w") as f:
              for owner in owners:
                  if owner not in entries:raise SystemExit("missing owner "+owner)
                  source=(corpus/"kbuild"/entries[owner]).resolve()
                  assert source.is_file() and source.is_relative_to((corpus/"kbuild").resolve())
                  print(owner+"\t"+str(source),file=f)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_};safe=${safe%.o}
            python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
              --input "$frozen" \
              --baseline-driver "$root/$trial-before/bin/minic" \
              --candidate-driver "$root/$trial-after/bin/minic" \
              --out "$root/$trial-ab/$safe" --repeats 4 \
              | tee "$root/evidence/$trial-$safe.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$root/evidence/$trial-$safe.txt"
            for mode in before after; do
              /usr/bin/time -f '%M %U %S %e' -o "$root/$trial-ab/$safe/$mode-rss-cpu.txt" \
                "$root/$trial-$mode/bin/minic-cc" -S "$frozen" \
                -o "$root/$trial-ab/$safe/$mode-rss.s" \
                >"$root/$trial-ab/$safe/$mode.stdout" \
                2>"$root/$trial-ab/$safe/$mode.stderr"
            done
            cmp "$root/$trial-ab/$safe/before-rss.s" "$root/$trial-ab/$safe/after-rss.s"
          done < "$root/evidence/$trial-inputs.tsv"
          python3 - "$root/$trial-ab" <<'PYSUM'
          from pathlib import Path
          import json,sys
          root=Path(sys.argv[1]);rows=[]
          for path in sorted(root.iterdir()):
              if not path.is_dir():continue
              doc=json.loads((path/"paired-result.json").read_text())
              assert doc["assembly_identical"] and doc["repeat_per_arm"]==4
              rss={}
              for mode in ("before","after"):
                  memory,user,system,wall=map(float,(path/(mode+"-rss-cpu.txt")).read_text().split())
                  rss[mode]=dict(max_rss_kib=int(memory),user_s=user,sys_s=system,wall_s=wall)
              row=dict(owner=path.name,before_ms=doc["baseline_median_ms"],
                       after_ms=doc["candidate_median_ms"],
                       speedup=doc["baseline_median_ms"]/doc["candidate_median_ms"],rss=rss)
              rows.append(row)
              print("MINIC_PARSER_COLD_SWITCH_OWNER="+json.dumps(row,separators=(',',':')),flush=True)
          assert len(rows)==5
          old=sum(x["before_ms"] for x in rows);new=sum(x["after_ms"] for x in rows)
          (root/"summary.json").write_text(json.dumps(dict(owners=rows,old_sum_ms=old,new_sum_ms=new,speedup=old/new),indent=2)+"\n")
          print("MINIC_PARSER_COLD_SWITCH_AB=PASS owners=5 identical=5/5 old_sum_ms=%.3f new_sum_ms=%.3f speedup=%.5f"%(old,new,old/new))
          PYSUM

      # Post packed-CALL + 72-byte MinicType current Function arity census;
      # existing seven-owner SHA-frozen inputs, no new compiler algorithm.
      # Read-only current-source AST shape census: no source algorithm
      # changes, exact same SHA-pinned first500 .i and .s identity gate.
      # Direct ownership API regression: Program header realloc, borrowed
      # Function copies, clone deep-copy, setter aliasing, 0/64, invalid
      # signature rollback. No new workflow or job and no Linux rebuild.
      - name: Run Function parameter lifetime and AST unit contract
        if: contains(github.event.head_commit.message, '[minic-function-param-contract]')
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          make -j4 MODE=release CFLAGS=-Werror \
            BUILD_DIR="$root/function-param-contract" \
            check-ast-contract \
            > "$root/evidence/function-param-ownership-contract.txt" 2>&1 || {
              tail -n 110 "$root/evidence/function-param-ownership-contract.txt"
              exit 61
            }
          echo "MINIC_FUNCTION_PARAM_OWNERSHIP_CONTRACT=PASS" \
            | tee -a "$root/evidence/function-param-ownership-contract.txt"

      # First500 exact-length Function 20/500 one-run negatives. Verify the
      # eight largest with 8+8 wall/user/sys paired clocks before promoting.
      - name: Triage Function parameter exact-allocation 500 wall outliers
        if: contains(github.event.head_commit.message, '[minic-function-param-exact-triage]')
        timeout-minutes: 31
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          mkdir -p "$root/evidence" "$root/function-param-triage/recheck"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/function-param-triage/before" "$root/evidence/function-param-triage-before"
          python3 tools/ci/apply-perf-function-parameter-exact-allocation-v1.py
          git diff --check
          test "$(git diff --name-only -- src include | wc -l)" -eq 2
          make -j4 MODE=release CFLAGS=-Werror \
            BUILD_DIR="$root/function-param-triage/after" \
            "$root/function-param-triage/after/bin/minic" \
            "$root/function-param-triage/after/bin/minic-cc" >/dev/null
          python3 tools/ci/linux-perf-packed-call-regression-review-v1.py \
            --corpus "$corpus" \
            --baseline-driver "$root/function-param-triage/before/bin/minic" \
            --candidate-driver "$root/function-param-triage/after/bin/minic" \
            --out "$root/function-param-triage/recheck" \
            --label MINIC_FUNCTION_PARAM_EXACT_TRIAGE \
            --owner fs/nfs/client.o \
            --owner kernel/cgroup/legacy_freezer.o \
            --owner kernel/events/callchain.o \
            --owner fs/nfs/blocklayout/extent_tree.o \
            --owner init/do_mounts_initrd.o \
            --owner kernel/bpf/bpf_task_storage.o \
            --owner fs/nfs_common/common.o \
            --owner kernel/time/vsyscall.o \
            --owner kernel/bpf/btf.o \
            --owner fs/ext4/fsync.o \
            | tee "$root/evidence/function-param-exact-triage.txt"
          grep -Fq 'MINIC_FUNCTION_PARAM_EXACT_TRIAGE=PASS owners=10 old_new_pairs=8_each' \
            "$root/evidence/function-param-exact-triage.txt"

      # Third space experiment: private exact-size Function parameter arrays
      # rather than 64*72B embedded in every 6016B Function. This is
      # deliberately a screen of heap allocation overhead; not promoted.
      - name: Benchmark Function exact-length parameter storage with clone and AST contracts
        if: contains(github.event.head_commit.message, '[minic-function-param-exact-ab]') || contains(github.event.head_commit.message, '[minic-function-param-exact-ab500]')
        timeout-minutes: 28
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          trial=function-param-exact
          mkdir -p "$root/evidence" "$root/$trial-ab"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make time >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-before" "$root/evidence/$trial-before"
          cat > "$root/$trial-ab/sizeof.c" <<'CSIZES'
          #include "frontend/ast.h"
          #include <stdio.h>
          int main(void) {
              printf("sizeof_function=%zu sizeof_type=%zu\n",sizeof(MinicFunction),sizeof(MinicType));
              return 0;
          }
          CSIZES
          cc -Isrc -Iinclude -o "$root/$trial-ab/size-before" "$root/$trial-ab/sizeof.c"
          "$root/$trial-ab/size-before" | tee "$root/evidence/$trial-before-sizes.txt"
          python3 tools/ci/apply-perf-function-parameter-exact-allocation-v1.py
          git diff --check
          test "$(git diff --name-only -- src include | wc -l)" -eq 2
          cc -Isrc -Iinclude -o "$root/$trial-ab/size-after" "$root/$trial-ab/sizeof.c"
          "$root/$trial-ab/size-after" | tee "$root/evidence/$trial-after-sizes.txt"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$root/$trial-after" \
            "$root/$trial-after/bin/minic" "$root/$trial-after/bin/minic-cc" \
            check-ast-contract >"$root/evidence/$trial-build-contract.log" 2>&1 || {
              tail -n 140 "$root/evidence/$trial-build-contract.log";exit 51
            }
          echo "MINIC_FUNCTION_PARAM_EXACT_CONTRACT=PASS"
          if [[ "${{ contains(github.event.head_commit.message, '[minic-function-param-exact-ab500]') && '1' || '0' }}" == 1 ]]; then
            ln -s "$root/$trial-before" "$root/baseline-toolchain"
            ln -s "$root/$trial-after" "$root/toolchain"
            echo "MINIC_FUNCTION_PARAM_EXACT_FIRST500_READY=PASS"
            exit 0
          fi
          python3 - "$corpus" "$root" "$trial" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:3]);trial=sys.argv[3]
          selected={}
          for row in (corpus/"selected-tus.txt").read_text().splitlines():
              cols=row.split("\t",3)
              if len(cols)!=4:raise SystemExit("bad input manifest")
              selected[cols[1]]=cols[2]
          assert len(selected)==500
          owners=("kernel/bpf/btf.o","fs/ext4/fsync.o",
                  "kernel/events/core.o","mm/memcontrol.o",
                  "arch/riscv/purgatory/ctype.o")
          with (root/"evidence"/(trial+"-inputs.tsv")).open("w") as out:
              for name in owners:
                  if name not in selected:raise SystemExit("absent frozen input: "+name)
                  src=(corpus/"kbuild"/selected[name]).resolve()
                  assert src.is_file() and src.is_relative_to((corpus/"kbuild").resolve())
                  print(name+"\t"+str(src),file=out)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_};safe=${safe%.o}
            python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
              --input "$frozen" \
              --baseline-driver "$root/$trial-before/bin/minic" \
              --candidate-driver "$root/$trial-after/bin/minic" \
              --out "$root/$trial-ab/$safe" --repeats 4 \
              | tee "$root/evidence/$trial-$safe.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$root/evidence/$trial-$safe.txt"
            for mode in before after; do
              /usr/bin/time -f '%M %U %S %e' -o "$root/$trial-ab/$safe/$mode-rss-cpu.txt" \
                "$root/$trial-$mode/bin/minic-cc" -S "$frozen" \
                -o "$root/$trial-ab/$safe/$mode-rss.s" \
                >"$root/$trial-ab/$safe/$mode.stdout" \
                2>"$root/$trial-ab/$safe/$mode.stderr"
            done
            cmp "$root/$trial-ab/$safe/before-rss.s" "$root/$trial-ab/$safe/after-rss.s"
          done < "$root/evidence/$trial-inputs.tsv"
          python3 - "$root/$trial-ab" <<'PYSUM'
          from pathlib import Path
          import json,sys
          root=Path(sys.argv[1]);rows=[]
          for path in sorted(root.iterdir()):
              if not path.is_dir():continue
              doc=json.loads((path/"paired-result.json").read_text())
              assert doc["assembly_identical"] and doc["repeat_per_arm"]==4
              rss={}
              for mode in ("before","after"):
                  m,u,s,w=map(float,(path/(mode+"-rss-cpu.txt")).read_text().split())
                  rss[mode]=dict(max_rss_kib=int(m),user_s=u,sys_s=s,wall_s=w)
              item=dict(owner=path.name,before_ms=doc["baseline_median_ms"],
                        after_ms=doc["candidate_median_ms"],
                        speedup=doc["baseline_median_ms"]/doc["candidate_median_ms"],
                        rss=rss)
              rows.append(item)
              print("MINIC_FUNCTION_PARAM_EXACT_OWNER="+json.dumps(item,separators=(',',':')),flush=True)
          assert len(rows)==5
