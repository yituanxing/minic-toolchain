                          old_user_ms=round(ou,3),new_user_ms=round(nu,3),
                          delta_wall_ms=round(ws,3),delta_user_ms=round(us,3),
                          old_mad_ms=round(om,3),new_mad_ms=round(nm,3),
                          classification=classification)
              (owner/"triage.json").write_text(json.dumps(result,indent=2)+"\n")
              print("MINIC_AST_REGRESSION_OWNER="+json.dumps(result,separators=(',',':')))
              cases.append(result)
          assert len(cases)==11, len(cases)
          cats={x:sum(v["classification"]==x for v in cases)
                for x in ("reproduced_wall_and_cpu_slowdown_suspect","mixed_or_noisy","not_reproduced")}
          (root/"triage-summary.json").write_text(json.dumps(dict(cases=cases,counts=cats),indent=2)+"\n")
          print("MINIC_AST_REGRESSION_TRIAGE=PASS owners=%d old_new_pairs=8_each counts=%s"%
                (len(cases),json.dumps(cats,sort_keys=True)))
