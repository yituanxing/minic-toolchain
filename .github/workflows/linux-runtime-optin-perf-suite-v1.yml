            libc6-dev-riscv64-cross python3 make >/dev/null
          if [[ "${{ contains(github.event.head_commit.message, '[minic-boolean-owner-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-boolean-owner-ab500]') && '1' || '0' }}" == 1 ||
