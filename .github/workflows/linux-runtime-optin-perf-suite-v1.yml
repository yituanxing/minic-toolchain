      - name: Execute Stage2-built native suites and GNU-free-AS-LD return42
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-native-runtime]')
        shell: bash
        timeout-minutes: 31
        run: |
          set -Eeuo pipefail
          seed_commit=3b6c1e335342b042f5f3c0b922f31843e6824bc9
          if ! git cat-file -e "$seed_commit^{commit}" 2>/dev/null; then
