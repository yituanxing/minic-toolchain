              --baseline-driver "$root/$trial-before/bin/minic" \
              --candidate-driver "$root/$trial-after/bin/minic" \
              --out "$root/$trial-ab/$safe" --repeats 4 \
              | tee "$root/evidence/$trial-$safe.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$root/evidence/$trial-$safe.txt"
            for mode in before after; do
              /usr/bin/time -f '%M %U %S %e' -o "$root/$trial-ab/$safe/$mode-rss-cpu.txt" \
                "$root/$trial-$mode/bin/minic-cc" -S "$frozen" \
                -o "$root/$trial-ab/$safe/$mode-rss.s" \
                >"$root/$trial-ab/$safe/$mode.stdout" \
                2>"$root/$trial-ab/$safe/$mode.stderr"
            done
            cmp "$root/$trial-ab/$safe/before-rss.s" "$root/$trial-ab/$safe/after-rss.s"
          done < "$root/evidence/$trial-inputs.tsv"
          python3 - "$root/$trial-ab" <<'PYSUM'
          from pathlib import Path
          import json,sys
          root=Path(sys.argv[1]);rows=[]
          for path in sorted(root.iterdir()):
              if not path.is_dir():continue
              doc=json.loads((path/"paired-result.json").read_text())
              assert doc["assembly_identical"] and doc["repeat_per_arm"]==4
              old=doc["baseline_median_ms"];new=doc["candidate_median_ms"]
              rss={}
              for mode in ("before","after"):
                  memory,user,system,wall=map(float,(path/(mode+"-rss-cpu.txt")).read_text().split())
                  rss[mode]=dict(max_rss_kib=int(memory),user_s=user,sys_s=system,wall_s=wall)
              item=dict(owner=path.name,before_ms=old,after_ms=new,speedup=old/new,rss=rss)
              rows.append(item)
              print("MINIC_TYPE_LAYOUT_OWNER="+json.dumps(item,separators=(',',':')),flush=True)
          assert len(rows)==5
          before=sum(x["before_ms"] for x in rows)
          after=sum(x["after_ms"] for x in rows)
          (root/"summary.json").write_text(json.dumps(dict(owners=rows,before_sum_ms=before,after_sum_ms=after,speedup=before/after),indent=2)+"\n")
          print("MINIC_TYPE_LAYOUT_AB=PASS owners=5 asm_identical=5/5 before_sum_ms=%.3f after_sum_ms=%.3f speedup=%.5f"%(before,after,before/after))
          PYSUM

