            # Comparing against the exact 2064/QEMU-certified eager Core
            # baseline, not against the rejected lazy Core revision.
            parent=b45298017b90569385b24a7e7636be666cef8cd2
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-core-lazy-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-core-lazy-ab500]') && '1' || '0' }}" == 1 ]]; then
            trial=core-lazy
            source_file=src/core/core_lower.c
            # The last QEMU-certified eager index source: no unrelated diff.
            parent=b45298017b90569385b24a7e7636be666cef8cd2
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-core-reentry-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-core-reentry-ab500]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-core-regression-triage]') && '1' || '0' }}" == 1 ]]; then
            trial=core-reentry
            source_file=src/core/core_lower.c
            parent=3bcb2594b2a0fe9a5c34ea2937363e595d9fe172
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-integer-owner-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-integer-owner-ab500]') && '1' || '0' }}" == 1 ]]; then
            trial=integer-owner
            source_file=src/compiler/compiler.c
            parent=9bbe1b37bd1d00dff34dc389c28ad04f371b9667
          else
            trial=parser-copy
            source_file=src/frontend/parser_type.c
            parent=98ff01edb0e6a9df0ef74537a9ef45df7f6f1e79
          fi
          git cat-file -e "$parent^{commit}"
          test "$(git show "$parent:$source_file" | sha256sum | cut -d' ' -f1)" != \
            "$(sha256sum "$source_file" | cut -d' ' -f1)"
          # Build the exact old source using the same native checksum
