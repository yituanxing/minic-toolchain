      - name: Recheck AST verifier one-pass regressions with CPU clocks
        if: contains(github.event.head_commit.message, '[minic-ast-array-regression-triage]')
        timeout-minutes: 35
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          sha256sum --status --check "$corpus/inputs.sha256"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          python3 - "$corpus" "$root" <<'PYOWNERS'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:])
          entries={}
          for row in (corpus/"selected-tus.txt").read_text().splitlines():
              parts=row.split("\t",3)
              if len(parts)!=4: raise SystemExit("bad source manifest")
              entries[parts[1]]=parts[2]
          assert len(entries)==500
          owners=("fs/nfs/client.o","kernel/events/core.o",
                  "kernel/cgroup/legacy_freezer.o","arch/riscv/kernel/alternative.o",
                  "fs/isofs/dir.o","fs/proc/thread_self.o",
                  "arch/riscv/kernel/sbi.o","arch/riscv/kernel/cpu.o",
                  "kernel/bpf/btf.o","fs/ext4/fsync.o","mm/memcontrol.o")
          with (root/"evidence"/"ast-regression-owners.tsv").open("w") as out:
              for owner in owners:
                  if owner not in entries: raise SystemExit("unfrozen owner "+owner)
                  source=(corpus/"kbuild"/entries[owner]).resolve()
                  assert source.is_relative_to((corpus/"kbuild").resolve()) and source.is_file()
                  print(owner+"\t"+str(source),file=out)
          PYOWNERS
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_}
            safe=${safe%.o}
            for batch in a b; do
              python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
                --input "$frozen" \
                --baseline-driver "$root/ast-array-triage-before/bin/minic" \
                --candidate-driver "$root/ast-array-triage-after/bin/minic" \
                --out "$root/ast-regression/$safe/$batch" --repeats 4 \
                | tee "$root/evidence/ast-regression-$safe-$batch.txt"
              grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$root/evidence/ast-regression-$safe-$batch.txt"
            done
          done < "$root/evidence/ast-regression-owners.tsv"
          python3 - "$root/ast-regression" <<'PYSUM'
          from pathlib import Path
          import json,statistics,sys
          root=Path(sys.argv[1]); cases=[]
          for owner in sorted(root.iterdir()):
              if not owner.is_dir(): continue
              arms=[json.loads((owner/k/"paired-result.json").read_text()) for k in ("a","b")]
              assert len(arms)==2 and all(x["assembly_identical"] and x["repeat_per_arm"]==4 for x in arms)
              assert arms[0]["assembly_sha256"]==arms[1]["assembly_sha256"]
              old=[r for a in arms for r in a["records"] if r["mode"]=="before"]
              new=[r for a in arms for r in a["records"] if r["mode"]=="after"]
              assert len(old)==8 and len(new)==8
              def summary(rows,k):
                  vals=[float(r[k]) for r in rows]; median=statistics.median(vals)
                  return (median,statistics.median(abs(v-median) for v in vals))
              ow,om=summary(old,"wall_ms"); nw,nm=summary(new,"wall_ms")
              ou,_=summary(old,"user_ms"); nu,_=summary(new,"user_ms")
              ws=nw-ow; us=nu-ou
              limit=max(5.0,2.5*(om+nm),.03*ow)
