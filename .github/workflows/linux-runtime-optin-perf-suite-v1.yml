        if: contains(github.event.head_commit.message, '[minic-bootstrap-full-native]') && contains(github.event.head_commit.message, '[minic-bootstrap-stage2-native-runtime]')
        shell: bash
        timeout-minutes: 85
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends strace >/dev/null
          stage2="$GITHUB_WORKSPACE/build/bootstrap-stage2-realprograms/artifact/build/bootstrap-current-b1/stage2/minic-stage2-rv64"
          artifact="$GITHUB_WORKSPACE/build/bootstrap-stage2-native/artifact/output"
