          python3 -m py_compile tools/ci/minic-bootstrap-stage2-native-runtime-v1.py
          work="$GITHUB_WORKSPACE/build/bootstrap-stage2-native/qualification"
          python3 tools/ci/minic-bootstrap-stage2-native-runtime-v1.py \
            --toolchain "$artifact" --stage2 "$stage2" --out "$work" \
