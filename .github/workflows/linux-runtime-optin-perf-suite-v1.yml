          assert counters["skipped_other_owner"]<=counters["candidates"]
          report={"schema":"minic-boolean-regression-12-owner-v1",
                  "owner":owner,"clock":records,"index":counters,
                  "classification":classification,"delta_wall_ms":round(new-old,3),
                  "delta_cpu_user_ms":round(cpu1-cpu0,3),
                  "delta_pct":round((new-old)/old*100,3)}
          (base/"triage.json").write_text(json.dumps(report,indent=2)+"\n")
          print("MINIC_BOOLEAN_REGRESSION=PASS owner=%s class=%s "
                "old_wall=%.3f new_wall=%.3f delta_wall=%.3f "
                "delta_cpu=%.3f callers=%d skipped=%d"%
                (owner,classification,old,new,new-old,cpu1-cpu0,
                 counters["callers"],counters["skipped_other_owner"]))
          PYAUDIT
          done < "$root/evidence/boolean-regress-inputs.tsv"
          python3 - "$root/boolean-regression" <<'PY' \
            | tee "$root/evidence/boolean-regression-summary.txt"
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          rows=[json.loads(p.read_text()) for p in sorted(root.glob("*/triage.json"))]
          assert len(rows)==12
