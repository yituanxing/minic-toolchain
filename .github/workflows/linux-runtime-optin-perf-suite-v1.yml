          fi
          if [[ "${{ contains(github.event.head_commit.message, '[minic-bootstrap-native-musl-selfhost]') }}" == true ]]; then
            probe_args+=(--musl-build "$GITHUB_WORKSPACE/build/bootstrap-stage2-native/musl-restore/musl-seed/musl-build")
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[minic-bootstrap-native-musl-headers]') }}" == true ]]; then
