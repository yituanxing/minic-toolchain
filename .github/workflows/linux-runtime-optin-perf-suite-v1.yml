name: Linux Runtime Opt-in Performance and Semantics Suite

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select candidate qualification"
        required: true
        type: choice
        default: first500
        options:
          - first500
          - all3352
          - constant-p
          - all
  # Reuse the existing perf500 job for explicit, scoped production-source
  # comparisons. No other job is eligible for this one push marker.
  push:
    branches: [main]
    paths:
      - ".github/workflows/linux-runtime-optin-perf-suite-v1.yml"

permissions:
  contents: read

jobs:

  shard:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all3352' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-perf3352]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {label: a, offset: 0, count: 500}
          - {label: b, offset: 500, count: 500}
          - {label: c, offset: 1000, count: 500}
          - {label: d, offset: 1500, count: 500}
          - {label: e, offset: 2000, count: 500}
          - {label: f, offset: 2500, count: 500}
          - {label: g, offset: 3000, count: 352}
    env:
      DEBIAN_FRONTEND: noninteractive
      OFFSET: ${{ matrix.offset }}
      COUNT: ${{ matrix.count }}
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross bc bison flex libssl-dev make curl xz-utils python3 >/dev/null
          riscv64-linux-gnu-gcc --version | head -n1
          df -h "$GITHUB_WORKSPACE"
      - name: Build latest Canonical MiniC
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/all3352-wall"
          mkdir -p "$root/evidence"
          bash tools/ci/linux-perf-build-minic-profile-v1.sh "$root/toolchain" "$root/evidence/profile"
          grep -qx 'apply-perf-core-object-interval-onepass-v1.py' "$root/evidence/profile/minic-profile.txt"
          grep -qx 'apply-perf-parser-nearest-ordinary-scope-v1.py' "$root/evidence/profile/minic-profile.txt"
          grep -qx 'apply-correctness-constant-p-ice-v1.py' "$root/evidence/profile/minic-profile.txt"
          sha256sum "$root/toolchain/bin/minic" | tee "$root/evidence/minic.sha256"
      - name: Materialize this Kbuild C TU range (not part of MiniC time)
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/all3352-wall"
          begin=$(date +%s)
          MINIC="$root/toolchain/bin/minic" \
          BUILD_DIR="$root/input" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET="$OFFSET" LINUX_BATCH_LIMIT="$COUNT" \
          LINUX_BATCH_MATERIALIZE_ONLY=1 LINUX_BATCH_MATERIALIZE_MAKE_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          echo "MATERIALIZE_SECONDS=$(($(date +%s)-begin))" | tee "$root/evidence/materialize-time.txt"
          test "$(wc -l < "$root/input/tu-manifest.txt")" -eq 3352
          test "$(wc -l < "$root/input/selected-tus.txt")" -eq "$COUNT"
          ROOT="$root" python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          rows=[s.split("\t",3) for s in (root/"input/selected-tus.txt").read_text().splitlines()]
          off=int(os.environ["OFFSET"]); n=int(os.environ["COUNT"])
          assert [int(r[0]) for r in rows]==list(range(off,off+n))
          assert all((root/"input/kbuild"/r[2]).stat().st_size>0 for r in rows)
          print(f"ALL3352_MATERIALIZED off={off} count={n} verified=yes")
          PY
          df -h "$GITHUB_WORKSPACE"
      - name: Verify both historically damaged preprocessed inputs with GCC
        if: matrix.label == 'f'
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/all3352-wall"
          for unit in serio.i libps2.i; do
            input="$root/input/kbuild/drivers/input/serio/$unit"
            test -s "$input"
            if riscv64-linux-gnu-gcc -x cpp-output -fsyntax-only -w "$input" >"$root/evidence/$unit.gcc-cpp-output.txt" 2>&1; then
              echo "GCC_PREPROCESSED_VALID input=$unit"
            else
              echo "GCC_PREPROCESSED_INVALID input=$unit"
              tail -n 35 "$root/evidence/$unit.gcc-cpp-output.txt"
              exit 1
            fi
          done
      - name: Measure MiniC -S only, using four parallel workers
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/all3352-wall"
          set +e
          CORE_FAST_TRACE=0 python3 tests/external/linux/corpus_replay.py \
            --minic "$root/toolchain/bin/minic" --corpus "$root/input" \
            --work "$root/replay" --jobs 4 --offset 0 --limit 0 --sample-count 0 \
              >"$root/evidence/replay.log" 2>&1
          rc=$?
          set -e
          echo "REPLAY_RC=$rc" | tee "$root/evidence/returncode.txt"
          tail -n 15 "$root/evidence/replay.log"
          test -s "$root/replay/batch-results.json"
          cp "$root/replay/batch-results.json" "$root/evidence/"
          cp "$root/replay/batch-summary.txt" "$root/evidence/"
          test "$rc" -eq 0 # Never treat failed compiler subprocesses as a green shard
      - name: Export exact per-TU timing, slowest objects and status
        if: always()
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE/build/all3352-wall/evidence" python3 - <<'PY'
          import json,os,re
          from collections import Counter
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          if not (root/"batch-results.json").is_file():
              print("ALL3352_SHARD_FAILED before MiniC replay")
              raise SystemExit(1)
          rows=json.loads((root/"batch-results.json").read_text())
          off=int(os.environ["OFFSET"]); n=int(os.environ["COUNT"])
          assert len(rows)==n
          assert sorted(int(r["index"]) for r in rows)==list(range(off,off+n))
          cnt=Counter(x["status"] for x in rows)
          m=re.search(r"^replay_seconds=([0-9.]+)$",(root/"batch-summary.txt").read_text(),re.M)
          assert m is not None
          result={"offset":off,"count":n,"pass":cnt["PASS"],"fail":cnt["FAIL"],
                  "missing":cnt["PREPROCESS_MISSING"],"compile_sum_s":sum(float(r["seconds"]) for r in rows),
                  "four_worker_replay_s":float(m.group(1))}
          (root/"shard.json").write_text(json.dumps(result,indent=2))
          print("ALL3352_SHARD_RESULT "+json.dumps(result,sort_keys=True))
          for row in rows:
              if row["status"] != "PASS":
                  print("ALL3352_FAILED_TU "+json.dumps(row,sort_keys=True))
          for row in sorted(rows,key=lambda x:float(x["seconds"]),reverse=True)[:10]:
              print(f"ALL3352_SLOW index={row['index']} input={row['input']} seconds={row['seconds']:.3f} status={row['status']}")
          PY
      - name: Upload shard evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all3352-constant-p-shard-${{ matrix.label }}
          path: build/all3352-wall/evidence/
          retention-days: 14
  aggregate:
    needs: shard
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'all3352' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-perf3352]')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: all3352-constant-p-shard-*
          path: evidence
      - name: Aggregate 3352 unique TU results
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee all3352-final.txt
          import json
          from pathlib import Path
          data=sorted((json.loads(f.read_text()) for f in Path("evidence").glob("*/shard.json")),key=lambda d:d["offset"])
          for d in data:
              print("ALL3352_SHARD "+json.dumps(d,sort_keys=True))
          total=sum(d["compile_sum_s"] for d in data)
          wall=sum(d["four_worker_replay_s"] for d in data)
          passed=sum(d["pass"] for d in data)
          failed=sum(d["fail"] for d in data)
          missing=sum(d["missing"] for d in data)
          print(f"ALL3352_SUM_TU_SECONDS={total:.3f}")
          print(f"ALL3352_FOUR_WORKER_SEQUENTIAL_SHARDS_SECONDS={wall:.3f}")
          print(f"ALL3352_FOUR_WORKER_LOWER_BOUND_SECONDS={total/4:.3f}")
          print(f"ALL3352_COUNTS pass={passed} fail={failed} missing={missing}")
          indexes=[i for d in data for i in range(d["offset"],d["offset"]+d["count"])]
          if len(data)!=7 or indexes!=list(range(3352)):
              raise SystemExit("ALL3352_INVALID_COVERAGE")
          print("ALL3352_COVERAGE=3352/3352")
          if passed != 3352 or failed or missing:
              raise SystemExit("ALL3352_COMPILE_FAILURES")
          print("ALL3352_COMPILE_STATUS=PASS")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all3352-constant-p-final-report
          path: all3352-final.txt
          retention-days: 14


  semantics:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'constant-p' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-constant-p]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build control and candidate with identical Canonical patches
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/constant-p-regression"
          mkdir -p "$work"
          MINIC_CORRECTNESS_SKIP_CONSTANT_P_ICE=1 \
            bash tools/ci/linux-perf-build-minic-profile-v1.sh \
              "$work/baseline" "$work/baseline-profile"
          grep -qx 'SKIPPED_CONSTANT_P_ICE=apply-correctness-constant-p-ice-v1.py' \
            "$work/baseline-profile/patch.log"
          git reset --hard HEAD
          bash tools/ci/linux-perf-build-minic-profile-v1.sh \
            "$work/candidate" "$work/candidate-profile"
          grep -qx 'apply-correctness-constant-p-ice-v1.py' \
            "$work/candidate-profile/minic-profile.txt"
          git diff --check
      - name: Install RISC-V assembler and emulator
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user >/dev/null
      - name: Compare GCC frontend, baseline rejection and fixed QEMU behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/constant-p-regression"
          valid="$GITHUB_WORKSPACE/tests/compiler/c0/gnu_constant_p_ice_regression.c"
          invalid="$GITHUB_WORKSPACE/tests/compiler/c0/gnu_choose_dynamic_condition_reject.c"
          cc -std=gnu11 -fsyntax-only "$valid"
          cc -std=gnu11 -E -P -x c "$valid" -o "$work/valid.i"
          set +e
          "$work/baseline/bin/minic" -S "$work/valid.i" -o "$work/baseline.s" \
            >"$work/baseline.log" 2>&1
          baseline_rc=$?
          set -e
          echo "CONSTANT_P_ICE_BASELINE_RC=$baseline_rc"
          "$work/candidate/bin/minic" -S "$work/valid.i" -o "$work/candidate.s" \
            >"$work/candidate.log" 2>&1
          test -s "$work/candidate.s"
          riscv64-linux-gnu-gcc -static "$work/candidate.s" -o "$work/program.rv64"
          qemu-riscv64 "$work/program.rv64"
          echo "CONSTANT_P_ICE_RISCV_QEMU=PASS"
          test "$baseline_rc" -ne 0
          set +e
          cc -std=gnu11 -fsyntax-only "$invalid" >"$work/invalid-gcc.log" 2>&1
          gcc_rc=$?
          cc -std=gnu11 -E -P -x c "$invalid" -o "$work/invalid.i"
          "$work/candidate/bin/minic" -S "$work/invalid.i" -o "$work/invalid.s" \
            >"$work/invalid-minic.log" 2>&1
          minic_rc=$?
          set -e
          echo "CONSTANT_P_ICE_NON_ICE_REJECT gcc_rc=$gcc_rc minic_rc=$minic_rc"
          test "$gcc_rc" -ne 0
          test "$minic_rc" -ne 0
          echo CONSTANT_P_ICE_REGRESSIONS=PASS
      - name: Upload control and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-optin-perf-constant-p-ice-v1
          path: |
            build/constant-p-regression/*.log
            build/constant-p-regression/candidate-profile/minic-profile.txt
          retention-days: 7


  perf500:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'first500' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[linux-perf500]') || contains(github.event.head_commit.message, '[minic-source-broad-ab]') || contains(github.event.head_commit.message, '[minic-current-phase20]') || contains(github.event.head_commit.message, '[minic-cpu-profile-only]') || contains(github.event.head_commit.message, '[minic-boolean-domain-ab20]') || contains(github.event.head_commit.message, '[minic-boolean-domain-ab500]') || contains(github.event.head_commit.message, '[minic-parser-copy-ab]') || contains(github.event.head_commit.message, '[minic-integer-owner-ab]') || contains(github.event.head_commit.message, '[minic-integer-owner-ab500]') || contains(github.event.head_commit.message, '[minic-next-stage-audit]') || contains(github.event.head_commit.message, '[minic-core-reentry-ab]') || contains(github.event.head_commit.message, '[minic-core-reentry-ab500]') || contains(github.event.head_commit.message, '[minic-core-regression-triage]') || contains(github.event.head_commit.message, '[minic-core-lazy-ab]') || contains(github.event.head_commit.message, '[minic-core-lazy-ab500]') || contains(github.event.head_commit.message, '[minic-boolean-owner-ab]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          # Parent source is needed for one-factor Parser A/B without downloading
          # another corpus or creating another job.
          fetch-depth: 8

      # Opt-in current-source profile; no 500-owner paired retest.
      - name: Build current Linux MiniC and diagnostics-only -O2 traced copy
        if: contains(github.event.head_commit.message, '[minic-current-phase20]') || contains(github.event.head_commit.message, '[minic-cpu-profile-only]')
        timeout-minutes: 12
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross make python3 >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/toolchain" "$root/evidence/phase20-source-profile"
          # CPU-only mode profiles the exact same algorithms with debug
          # symbols but without per-stage instrumentation.
          if [[ "${{ contains(github.event.head_commit.message, '[minic-current-phase20]') && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-perf-specialization-phase-trace-v0.py
            python3 tools/ci/apply-perf-boolean-scan-census-v1.py
            python3 -m py_compile \
              tools/ci/apply-perf-boolean-scan-census-v1.py \
              tools/ci/linux-perf-phase-trace-v1.py \
              tools/ci/linux-perf-current-phase20-v1.py
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[minic-cpu-profile-only]') && '1' || '0' }}" == 1 ]]; then
            # Callsite counters affect only the diagnostics compiler compiled
            # below, NEVER the already built source-identical release reference.
            python3 tools/ci/linux-perf-host-hotspot-profiler-v1.py --instrument-parser-probes
          fi
          git diff --check
          make -j4 MODE=release CFLAGS="-Werror -g -fno-omit-frame-pointer" \
            BUILD_DIR="$root/phase20-traced" \
            "$root/phase20-traced/bin/minic" \
            "$root/phase20-traced/bin/minic-cc" >/dev/null
          test -x "$root/toolchain/bin/minic" && test -x "$root/phase20-traced/bin/minic"
          sha256sum "$root/toolchain/bin/minic-cc" "$root/phase20-traced/bin/minic-cc" \
            | tee "$root/evidence/phase20-compiler-identities.sha256"
          python3 tools/ci/linux-perf-phase-trace-v1.py --self-test \
            | tee "$root/evidence/phase20-trace-parser-selftest.txt"
          grep -Fq 'boolean_count_parser=1' \
            "$root/evidence/phase20-trace-parser-selftest.txt"
          echo 'MINIC_PHASE20_PROFILE_BUILD=PASS current_native=true instrumentation_only=true'

      # Reuse the previously validated scoped Boolean Domain cache candidate,
      # but requalify it against the CURRENT full-native MiniC source and
      # strictly SHA-pinned Kbuild .i in this single runner. No new job.
      - name: Build exact current and indexed Boolean Domain MiniC pair
        if: contains(github.event.head_commit.message, '[minic-boolean-domain-ab20]') || contains(github.event.head_commit.message, '[minic-boolean-domain-ab500]')
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/baseline-toolchain" "$root/evidence/boolean20-baseline-build"
          git diff --check
          python3 tools/ci/apply-inline-specialization-local-boolean-domain-scoped-v1.py
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror \
            BUILD_DIR="$root/boolean-indexed-toolchain" \
            "$root/boolean-indexed-toolchain/bin/minic" \
            "$root/boolean-indexed-toolchain/bin/minic-cc" >/dev/null
          old_sha=$(sha256sum "$root/baseline-toolchain/bin/minic-cc" | cut -d' ' -f1)
          new_sha=$(sha256sum "$root/boolean-indexed-toolchain/bin/minic-cc" | cut -d' ' -f1)
          test "$old_sha" != "$new_sha" || { echo 'BOOLEAN_DOMAIN_AB20=FAIL identical_compiler'; exit 9; }
          echo "MINIC_BOOLEAN_DOMAIN_AB20_BINARIES=PASS baseline_sha=$old_sha candidate_sha=$new_sha historical_patch_reused=true" \
            | tee "$root/evidence/boolean20-compiler-identities.txt"

      - name: Build old and current native MiniC from certified source revisions
        if: contains(github.event.head_commit.message, '[minic-source-broad-ab]')
        shell: bash
        run: |
          set -Eeuo pipefail
          # The runtime profile preflights its own GNU RISC-V compiler; the
          # original first500 lane only installed this on a corpus-cache miss.
          # For an old/new source A/B the compiler is required even on a hit.
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          command -v riscv64-linux-gnu-gcc >/dev/null
          historical=24b0247401d1f973c4aa4f3495d7298cc7dd4cc1
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          git fetch --quiet --no-tags --depth=1 origin "$historical"
          changed=$(git diff --name-only "$historical" "$GITHUB_SHA" -- src include)
          test "$changed" = src/compiler/compiler.c || {
            echo "MINIC_BROAD_AB=FAIL changed_production_sources=$changed" >&2
            exit 9
          }
          git -c advice.detachedHead=false worktree add --quiet --detach "$root/historical-source" "$historical"
          (
            cd "$root/historical-source"
            MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
              bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/baseline-toolchain" "$root/evidence/old-build"
          )
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$root/toolchain" "$root/evidence/current-build"
          test -x "$root/baseline-toolchain/bin/minic" && test -x "$root/toolchain/bin/minic"
          old_sha=$(sha256sum "$root/baseline-toolchain/bin/minic-cc" | cut -d' ' -f1)
          new_sha=$(sha256sum "$root/toolchain/bin/minic-cc" | cut -d' ' -f1)
          test "$old_sha" != "$new_sha" || {
            echo 'MINIC_BROAD_AB=FAIL identical_compilers' >&2
            exit 9
          }
          echo "MINIC_BROAD_AB=BUILT old_sha=$old_sha current_sha=$new_sha historical=$historical" | tee "$root/evidence/oldnew-identities.txt"

      # Exact one-factor Parser A/B: the pristine parent differs only in
      # parser_type.c. Reuse the same already-certified runtime toolchain
      # builder and frozen first500 .i inputs; NEVER launch a 2064-owner build.
      - name: Build parent/current MiniC from one source change under identical profile
        if: contains(github.event.head_commit.message, '[minic-parser-copy-ab]') || contains(github.event.head_commit.message, '[minic-integer-owner-ab]') || contains(github.event.head_commit.message, '[minic-integer-owner-ab500]') || contains(github.event.head_commit.message, '[minic-core-reentry-ab]') || contains(github.event.head_commit.message, '[minic-core-reentry-ab500]') || contains(github.event.head_commit.message, '[minic-core-regression-triage]') || contains(github.event.head_commit.message, '[minic-core-lazy-ab]') || contains(github.event.head_commit.message, '[minic-core-lazy-ab500]') || contains(github.event.head_commit.message, '[minic-boolean-owner-ab]')
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$root/evidence"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          if [[ "${{ contains(github.event.head_commit.message, '[minic-boolean-owner-ab]') && '1' || '0' }}" == 1 ]]; then
            trial=boolean-owner
            source_file=src/compiler/compiler.c
            # Comparing against the exact 2064/QEMU-certified eager Core
            # baseline, not against the rejected lazy Core revision.
            parent=b45298017b90569385b24a7e7636be666cef8cd2
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-core-lazy-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-core-lazy-ab500]') && '1' || '0' }}" == 1 ]]; then
            trial=core-lazy
            source_file=src/core/core_lower.c
            # The last QEMU-certified eager index source: no unrelated diff.
            parent=b45298017b90569385b24a7e7636be666cef8cd2
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-core-reentry-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-core-reentry-ab500]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-core-regression-triage]') && '1' || '0' }}" == 1 ]]; then
            trial=core-reentry
            source_file=src/core/core_lower.c
            parent=3bcb2594b2a0fe9a5c34ea2937363e595d9fe172
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-integer-owner-ab]') && '1' || '0' }}" == 1 ||
                "${{ contains(github.event.head_commit.message, '[minic-integer-owner-ab500]') && '1' || '0' }}" == 1 ]]; then
            trial=integer-owner
            source_file=src/compiler/compiler.c
            parent=9bbe1b37bd1d00dff34dc389c28ad04f371b9667
          else
            trial=parser-copy
            source_file=src/frontend/parser_type.c
            parent=98ff01edb0e6a9df0ef74537a9ef45df7f6f1e79
          fi
          git cat-file -e "$parent^{commit}"
          test "$(git show "$parent:$source_file" | sha256sum | cut -d' ' -f1)" != \
            "$(sha256sum "$source_file" | cut -d' ' -f1)"
          # Build the exact old source using the same native checksum
          # manifest, then restore HEAD before building the candidate.
          # The candidate manifest is refreshed when compiler.c changes;
          # therefore restore the old version during its paired baseline.
          git show "$parent:$source_file" > "$source_file"
          if [[ "$trial" == integer-owner ]]; then
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          if [[ "$trial" == boolean-owner ]]; then
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          if [[ "$trial" == core-lazy ]]; then
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          if [[ "$trial" == core-reentry ]]; then
            # Restore ALL three changed production files, not just core_lower.c.
            # Both compilers must use their own exact SHA-pinned native profile.
            git show "$parent:src/core/core_lower.h" > src/core/core_lower.h
            git show "$parent:src/compiler/compiler.c" > src/compiler/compiler.c
            git show "$parent:docs/ci/native-runtime44-perf4-validated-sha1.txt" \
              > docs/ci/native-runtime44-perf4-validated-sha1.txt
          fi
          git diff --check
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-before" "$root/evidence/$trial-before"
          git reset --hard HEAD
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-after" "$root/evidence/$trial-after"
          git diff --check
          before=$(sha256sum "$root/$trial-before/bin/minic-cc" | cut -d' ' -f1)
          after=$(sha256sum "$root/$trial-after/bin/minic-cc" | cut -d' ' -f1)
          test "$before" != "$after"
          echo "MINIC_SINGLE_FACTOR_BINARIES=PASS trial=$trial base_commit=$parent before_cc_sha=$before after_cc_sha=$after" \
            | tee "$root/evidence/$trial-binaries.txt"

      - name: Build baseline and integrated optimization from clean sources
        if: "!contains(github.event.head_commit.message, '[minic-source-broad-ab]') && !contains(github.event.head_commit.message, '[minic-current-phase20]') && !contains(github.event.head_commit.message, '[minic-cpu-profile-only]') && !contains(github.event.head_commit.message, '[minic-boolean-domain-ab20]') && !contains(github.event.head_commit.message, '[minic-boolean-domain-ab500]') && !contains(github.event.head_commit.message, '[minic-parser-copy-ab]') && !contains(github.event.head_commit.message, '[minic-integer-owner-ab]') && !contains(github.event.head_commit.message, '[minic-integer-owner-ab500]') && !contains(github.event.head_commit.message, '[minic-next-stage-audit]') && !contains(github.event.head_commit.message, '[minic-core-reentry-ab]') && !contains(github.event.head_commit.message, '[minic-core-reentry-ab500]') && !contains(github.event.head_commit.message, '[minic-core-regression-triage]') && !contains(github.event.head_commit.message, '[minic-core-lazy-ab]') && !contains(github.event.head_commit.message, '[minic-core-lazy-ab500]') && !contains(github.event.head_commit.message, '[minic-boolean-owner-ab]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$work/evidence"
          # Both profiles are rebuilt independently: headers such as
          # parser_internal.h change MinicParser layout (ABI).
          MINIC_PERF_SKIP_VERIFIED_OPTIMIZATIONS=1 \
            bash tools/ci/linux-perf-build-minic-profile-v1.sh \
            "$work/baseline-toolchain" "$work/evidence/baseline-profile"
          grep -qx 'apply-perf-core-lower-statement-workspace-v1.py' \
            "$work/evidence/baseline-profile/minic-profile.txt"
          grep -qx 'SKIPPED_VERIFIED_PERF_PATCH=apply-inline-specialization-local-boolean-domain-scoped-v1.py' \
            "$work/evidence/baseline-profile/patch.log"
          grep -qx 'SKIPPED_VERIFIED_PERF_PATCH=apply-perf-parser-typedef-index-v1.py' \
            "$work/evidence/baseline-profile/patch.log"
          # This resets only the disposable Actions checkout; cached build/linux
          # input artifacts are untracked and not touched.
          git reset --hard HEAD
          bash tools/ci/linux-perf-build-minic-profile-v1.sh \
            "$work/toolchain" "$work/evidence/integrated-profile"
          grep -qx 'apply-inline-specialization-local-boolean-domain-scoped-v1.py' \
            "$work/evidence/integrated-profile/minic-profile.txt"
          grep -qx 'apply-perf-parser-typedef-index-v1.py' \
            "$work/evidence/integrated-profile/minic-profile.txt"
          git diff --check
          sha256sum "$work/baseline-toolchain/bin/minic" "$work/baseline-toolchain/bin/minic-cc" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" \
            | tee "$work/evidence/paired-binary.sha256"
          ! cmp -s "$work/baseline-toolchain/bin/minic-cc" "$work/toolchain/bin/minic-cc"

      - name: Restore certified first500 inputs
        id: corpus-restore
        uses: actions/cache/restore@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}

      - name: Verify restored first500 inputs
        id: corpus-verify
        shell: bash
        run: |
          set -Eeuo pipefail
          corpus=build/linux-perf-corpus
          if test -s "$corpus/selected-tus.txt" &&
             test "$(grep -cve '^[[:space:]]*$' "$corpus/selected-tus.txt")" -eq 500 &&
             test -s "$corpus/inputs.sha256" &&
             test "$(wc -l < "$corpus/inputs.sha256")" -eq 500 &&
             sha256sum --status --check "$corpus/inputs.sha256"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "PERF_CORPUS_CACHE=VERIFIED selected=500"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "PERF_CORPUS_CACHE=MISS_OR_INVALID"
            rm -rf "$corpus"
          fi

      - name: Install Linux prerequisites only on cache miss
        if: steps.corpus-verify.outputs.valid != 'true'
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends             build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu             libc6-dev-riscv64-cross bc bison flex libssl-dev libelf-dev             make curl xz-utils python3
          riscv64-linux-gnu-gcc --version | head -n1

      - name: Materialize exact historical first500 inputs
        if: steps.corpus-verify.outputs.valid != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          mkdir -p "$GITHUB_WORKSPACE/build/linux-cache"
          archive="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors             https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          echo "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932  $archive" | sha256sum -c -
          selection=$(grep -Ev '^[[:space:]]*(#|$)' tests/external/linux/replay-indices.txt | paste -sd, - || true)
          start_ns=$(date +%s%N)
          set +e
          MINIC="$work/toolchain/bin/minic"           BUILD_DIR="$GITHUB_WORKSPACE/build/linux-perf-materialize"           LINUX_ARCHIVE_CACHE="$archive"           CROSS_COMPILE=riscv64-linux-gnu-           LINUX_BATCH_OFFSET=0           LINUX_BATCH_LIMIT=500           LINUX_BATCH_JOBS=4           LINUX_BATCH_SELECTION="$selection"           LINUX_BATCH_MATERIALIZE_ONLY=1             sh tests/external/linux/batch_probe.sh
          materialize_rc=$?
          set -e
          end_ns=$(date +%s%N)
          echo "MATERIALIZE_ONLY=1 MATERIALIZE_RC=$materialize_rc MATERIALIZE_WALL_MS=$(((end_ns-start_ns)/1000000))"             | tee "$work/evidence/materialize.txt"
          test -s "$GITHUB_WORKSPACE/build/linux-perf-materialize/selected-tus.txt"
          test "$(grep -cve '^[[:space:]]*$' "$GITHUB_WORKSPACE/build/linux-perf-materialize/selected-tus.txt")" -eq 500
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path("build/linux-perf-materialize")
          dst=Path("build/linux-perf-corpus")
          shutil.rmtree(dst,ignore_errors=True)
          (dst/"kbuild").mkdir(parents=True)
          selected=src/"selected-tus.txt"
          shutil.copy2(selected,dst/"selected-tus.txt")
          manifest=src/"tu-manifest.txt"
          if manifest.is_file():
              shutil.copy2(manifest,dst/"tu-manifest.txt")
          for row in selected.read_text().splitlines():
              _,_,rel_i,_=row.split("\t",3)
              s=src/"kbuild"/rel_i
              d=dst/"kbuild"/rel_i
              if not s.is_file() or s.stat().st_size==0:
                  raise SystemExit(f"missing frozen input: {s}")
              d.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(s,d)
          print("PERF_CORPUS_FROZEN selected=500")
          PY
          find build/linux-perf-corpus/kbuild -type f -name '*.i' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > build/linux-perf-corpus/inputs.sha256
          test "$(wc -l < build/linux-perf-corpus/inputs.sha256)" -eq 500

      - name: Save verified first500 corpus
        if: steps.corpus-verify.outputs.valid != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}

      # Lightweight after-Integer-owner attribution, using the same first500
      # frozen Linux cache and existing compiler stage timers. No Callgrind.
      - name: Attribute current MiniC post-Integer-owner stage hotspots
        if: contains(github.event.head_commit.message, '[minic-next-stage-audit]')
        timeout-minutes: 17
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          mkdir -p "$root/evidence"
          sha256sum --status --check "$corpus/inputs.sha256"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/next-phase-native" "$root/evidence/next-phase-build"
          # Temporary checkout only: existing proven begin/end probes.
          python3 tools/ci/apply-perf-specialization-phase-trace-v0.py
          python3 tools/ci/apply-perf-integer-loop-trace-v0.py
          python3 tools/ci/apply-perf-core-lower-hotspot-census-v1.py
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$root/next-phase-traced" \
            "$root/next-phase-traced/bin/minic" \
            "$root/next-phase-traced/bin/minic-cc" >/dev/null
          python3 tools/ci/linux-perf-phase-trace-v1.py --self-test
          python3 - "$corpus" "$root" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:])
          selected={}
          for line in (corpus/"selected-tus.txt").read_text().splitlines():
              parts=line.split("\t",3)
              if len(parts)!=4: raise SystemExit("malformed selected TUs")
              selected[parts[1]]=parts[2]
          if len(selected)!=500: raise SystemExit("frozen corpus not 500")
          # Seven exact entries preverified in the frozen first500 manifest;
          # other real 2064 objects (e.g. net/core/dev.o) are NOT in this cache.
          targets=("fs/ext4/fsync.o","kernel/bpf/btf.o","kernel/events/core.o",
                   "mm/memcontrol.o","mm/hugetlb.o","mm/vmscan.o",
                   "fs/ext4/super.o")
          with (root/"evidence"/"next-phase-inputs.tsv").open("w") as out:
              for owner in targets:
                  if owner not in selected: raise SystemExit("missing "+owner)
                  p=(corpus/"kbuild"/selected[owner]).resolve()
                  if not p.is_relative_to((corpus/"kbuild").resolve()) or not p.is_file():
                      raise SystemExit("bad frozen input "+owner)
                  print(owner+"\t"+str(p),file=out)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_}
            safe=${safe%.o}
            python3 tools/ci/linux-perf-phase-trace-v1.py \
              --input "$frozen" \
              --baseline "$root/next-phase-traced/bin/minic" \
              --candidate "$root/next-phase-traced/bin/minic" \
              --expect-specialization --expect-integer-loops \
              --out "$root/next-phase/$safe" \
              | tee "$root/evidence/next-phase-$safe.txt"
            grep -Fq 'MINIC_SPEC_PHASE_GROUP=PASS' "$root/evidence/next-phase-$safe.txt"
            MINIC_CORE_LOWER_CENSUS=1 "$root/next-phase-traced/bin/minic" \
              -S "$frozen" -o "$root/next-phase/$safe/census.s" \
              >"$root/evidence/next-core-$safe.stdout" \
              2>"$root/evidence/next-core-$safe.log"
            grep -Eq '^MINIC_CORE_LOWER_CENSUS map_calls=[0-9]+ ' \
              "$root/evidence/next-core-$safe.log"
            python3 - "$root/next-phase/$safe" <<'PYCORE'
          import hashlib,json,sys
          from pathlib import Path
          folder=Path(sys.argv[1])
          x=json.loads((folder/"phases.json").read_text())
          actual=hashlib.sha256((folder/"census.s").read_bytes()).hexdigest()
          assert actual==x["results"]["after"]["assembly_sha"]
          print("MINIC_CORE_CENSUS_ASM=PASS owner="+folder.name+" sha256="+actual)
          PYCORE
          done < "$root/evidence/next-phase-inputs.tsv"
          python3 - "$root/next-phase" <<'PY' | tee "$root/evidence/next-phase-summary.txt"
          import json,sys
          from pathlib import Path
          base=Path(sys.argv[1])
          rows=[]
          for f in sorted(base.glob("*/phases.json")):
              x=json.loads(f.read_text())["results"]["after"]
              spec=x["specialization_ms"]
              row={"owner":f.parent.name,"wall_ms":x["wall_ms"],
                   "parse_ms":x["stage_ms"]["parse"],
                   "core_set_ms":x["stage_ms"]["core-set"],
                   "core_validate_ms":x["stage_ms"]["core-validate"],
                   "codegen_ms":x["stage_ms"]["codegen"],
                   "spec_integer_ms":spec["spec-integer"]["ms"],
                   "spec_integer_transitive_ms":spec["spec-integer-transitive"]["ms"],
                   "spec_symbolic_ms":spec["spec-symbolic"]["ms"],
                   "spec_boolean_ms":spec["spec-boolean"]["ms"],
                   "spec_finalize_ms":spec["spec-finalize"]["ms"],
                   "normalize_core_gap_ms":x["interstage_gap_ms"]["normalize-to-core-set"]}
              import re
              core_log=(base.parent/"evidence"/("next-core-"+row["owner"]+".log")).read_text()
              matches=re.findall(r"^MINIC_CORE_LOWER_CENSUS (.+)$",core_log,re.MULTILINE)
              assert len(matches)==1
              core_data=dict((k,int(v)) for k,v in (
                  entry.split("=",1) for entry in matches[0].split()))
              expected=("map_calls","map_slots","if_calls","if_scan_statements",
                        "if_scan_expressions","switch_calls",
                        "switch_scan_statements","switch_scan_expressions",
                        "unreachable_calls","unreachable_scan_statements",
                        "loop_label_calls","loop_label_scan_statements",
                        "loop_label_scan_expressions")
              assert set(core_data)==set(expected)
              row["core_census"]=core_data
              rows.append(row)
              print("MINIC_CORE_CENSUS_OWNER owner="+row["owner"]+" "+
                    " ".join("%s=%d"%(k,v) for k,v in core_data.items()))
              print("MINIC_NEXT_HOTSPOT_OWNER "+" ".join("%s=%s"%(k,v) for k,v in row.items()))
          assert len(rows)==7
          (base/"ranked-summary.json").write_text(json.dumps({
              "schema":"minic-post-integer-owner-seven-TU-phase-attribution-v1",
              "scope":"diagnostic-only, not paired performance or QEMU",
              "owners":rows},indent=2)+"\n")
          for key in ("parse_ms","core_set_ms","core_validate_ms",
                      "codegen_ms","spec_integer_ms","spec_symbolic_ms",
                      "spec_boolean_ms","spec_finalize_ms"):
              print("MINIC_NEXT_HOTSPOT_SUM %s=%.3f"%(key,sum(x[key] for x in rows)))
          print("MINIC_NEXT_HOTSPOT_AUDIT=PASS owners=7 measured_current=true core_counters=true")
          PY

      # Reuse the existing SHA-frozen 500 owner corpus and paired driver.
      # No new job; comparing only the control-flow index change.
      - name: Frozen Core reentry one-factor old/new A/B
        if: contains(github.event.head_commit.message, '[minic-core-reentry-ab]')
        timeout-minutes: 22
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          test -x "$root/core-reentry-before/bin/minic"
          test -x "$root/core-reentry-after/bin/minic"
          sha256sum --status --check "$corpus/inputs.sha256"
          python3 - "$corpus" "$root" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:])
          items={}
          for record in (corpus/"selected-tus.txt").read_text().splitlines():
              p=record.split("\t",3)
              if len(p)!=4: raise SystemExit("malformed frozen TU row")
              items[p[1]]=p[2]
          if len(items)!=500: raise SystemExit("frozen corpus not 500")
          owners=("fs/ext4/fsync.o","kernel/bpf/btf.o",
                  "kernel/events/core.o","mm/memcontrol.o","fs/ext4/super.o")
          with (root/"evidence"/"core-reentry-inputs.tsv").open("w") as out:
              for owner in owners:
                  if owner not in items: raise SystemExit("missing frozen owner "+owner)
                  p=(corpus/"kbuild"/items[owner]).resolve()
                  assert p.is_relative_to((corpus/"kbuild").resolve()) and p.is_file()
                  print(owner+"\t"+str(p),file=out)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_}
            safe=${safe%.o}
            python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
              --input "$frozen" \
              --baseline-driver "$root/core-reentry-before/bin/minic" \
              --candidate-driver "$root/core-reentry-after/bin/minic" \
              --out "$root/core-reentry-ab/$safe" --repeats 4 \
              | tee "$root/evidence/core-reentry-$safe.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$root/evidence/core-reentry-$safe.txt"
            MINIC_CORE_REENTRY_INDEX_PERF=1 "$root/core-reentry-after/bin/minic" \
              -S "$frozen" -o "$root/core-reentry-ab/$safe/index-audit.s" \
              >"$root/evidence/core-reentry-$safe.stdout" \
              2>"$root/evidence/core-reentry-$safe.log"
            grep -Eq '^MINIC_CORE_REENTRY_INDEX ready=1 incoming=[0-9]+ ' \
              "$root/evidence/core-reentry-$safe.log"
            python3 - "$root/core-reentry-ab/$safe" <<'PYAUDIT'
          import hashlib,json,sys
          from pathlib import Path
          folder=Path(sys.argv[1])
          expected=json.loads((folder/"paired-result.json").read_text())["assembly_sha256"]
          actual=hashlib.sha256((folder/"index-audit.s").read_bytes()).hexdigest()
          assert actual == expected, "audit mode changed the generated assembly"
          print("MINIC_CORE_REENTRY_AUDIT=PASS owner="+folder.name)
          PYAUDIT
          done < "$root/evidence/core-reentry-inputs.tsv"
          python3 - "$root/core-reentry-ab" <<'PY' | tee "$root/evidence/core-reentry-summary.txt"
          import json,sys
          from pathlib import Path
          base=Path(sys.argv[1])
          rows=[]
          for p in sorted(base.glob("*/paired-result.json")):
              d=json.loads(p.read_text())
              assert d["assembly_identical"] and d["repeat_per_arm"]==4
              rows.append((p.parent.name,d["baseline_median_ms"],d["candidate_median_ms"]))
          assert len(rows)==5
          old=sum(x[1] for x in rows)
          new=sum(x[2] for x in rows)
          assert old>0 and new>0
          print("MINIC_CORE_REENTRY_AB=PASS identical=5/5 before_p50_sum_ms=%.3f "
                "after_p50_sum_ms=%.3f speedup=%.4f"%(old,new,old/new))
          for owner,before,after in rows:
              print("MINIC_CORE_REENTRY_OWNER owner=%s old_ms=%.3f new_ms=%.3f speedup=%.4f"%
                    (owner,before,after,before/after))
          PY

      # Exactly the same frozen first500 .i and compiler pair as the proven
      # five-file trial. Uses only the preexisting perf500 job + diff script.
      - name: Certify Core reentry index over all 500 immutable Linux TUs
        if: contains(github.event.head_commit.message, '[minic-core-reentry-ab500]')
        timeout-minutes: 45
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          test -x "$root/core-reentry-before/bin/minic"
          test -x "$root/core-reentry-after/bin/minic"
          python3 tools/ci/linux-perf-frozen-corpus-differential-v1.py \
            --corpus "$corpus" \
            --baseline-driver "$root/core-reentry-before/bin/minic" \
            --candidate-driver "$root/core-reentry-after/bin/minic" \
            --jobs 4 --balanced-order --out "$root/core-reentry-ab500" \
            | tee "$root/evidence/core-reentry-ab500-verdict.txt"
          grep -Fq 'MINIC_FROZEN_DIFF=PASS selected=500 identical=500' \
            "$root/evidence/core-reentry-ab500-verdict.txt"
          grep -Fq 'MINIC_FROZEN_PAIRED=PASS owners=500 balanced_order=true' \
            "$root/evidence/core-reentry-ab500-verdict.txt"
          python3 - "$root/core-reentry-ab500/differential.json" <<'PY' \
            | tee "$root/evidence/core-reentry-ab500-summary.txt"
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          rows=d["results"]
          assert len(rows)==500 and d["identical"]==500 and d["mismatch_count"]==0
          old=sum(x["baseline"]["wall_ms"] for x in rows)
          new=sum(x["candidate"]["wall_ms"] for x in rows)
          assert old>0 and new>0
          print("MINIC_CORE_REENTRY_AB500=PASS identical=500/500 "
                "before_sum_ms=%.3f after_sum_ms=%.3f speedup=%.5f"%
                (old,new,old/new))
          rank=sorted(rows,key=lambda x:x["baseline"]["wall_ms"]-
                      x["candidate"]["wall_ms"],reverse=True)
          for x in rank[:10]:
              print("MINIC_CORE_REENTRY_AB500_WIN owner=%s before_ms=%.3f after_ms=%.3f"%
                    (x["object"],x["baseline"]["wall_ms"],x["candidate"]["wall_ms"]))
          for x in rank[-6:]:
              print("MINIC_CORE_REENTRY_AB500_REGRESSION owner=%s before_ms=%.3f after_ms=%.3f"%
                    (x["object"],x["baseline"]["wall_ms"],x["candidate"]["wall_ms"]))
          PY

      # A single noisy result is not evidence of a real regression.
      # Reuse fixed source baselines, the first500 SHA-frozen inputs and the
      # existing serial paired timing script for 16 sentinel TUs. Eight timed
      # runs per arm, with old/new balanced in each of two four-round batches.
      # No kernel or Callgrind rerun; old/new .s must stay byte-identical.
      - name: Recheck per-TU Core reentry regressions with CPU clocks and index census
        if: contains(github.event.head_commit.message, '[minic-core-regression-triage]')
        timeout-minutes: 36
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          python3 -m py_compile tools/ci/linux-perf-pinned-single-paired-ab-v1.py
          python3 - "$corpus" "$root" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:])
          by_owner={}
          for row in (corpus/"selected-tus.txt").read_text().splitlines():
              parts=row.split("\t",3)
              if len(parts)!=4: raise SystemExit("bad selected-tus row")
              by_owner[parts[1]]=parts[2]
          assert len(by_owner)==500
          # Twelve observed single-pass slowdowns, three meaningful wins and
          # one near-neutral control. Tiny-TU controls distinguish fixed setup
          # cost from runtime jitter. Ordered by original observed delta.
          owners=(
              "fs/nfs/client.o",
              "kernel/time/sched_clock.o",
              "kernel/bpf/map_in_map.o",
              "mm/shmem_quota.o",
              "kernel/bpf/prog_iter.o",
              "arch/riscv/kvm/main.o",
              "fs/ext4/xattr_security.o",
              "kernel/dma/remap.o",
              "kernel/bpf/queue_stack_maps.o",
              "fs/isofs/dir.o",
              "arch/riscv/purgatory/ctype.o",
              "arch/riscv/kernel/pi/fdt_early.o",
              "kernel/events/core.o",
              "kernel/bpf/verifier.o",
              "mm/memcontrol.o",
              "fs/ext4/fsync.o",
          )
          with (root/"evidence"/"core-regression-selected.tsv").open("w") as out:
              for owner in owners:
                  if owner not in by_owner: raise SystemExit("not in frozen 500 "+owner)
                  f=(corpus/"kbuild"/by_owner[owner]).resolve()
                  assert f.is_relative_to((corpus/"kbuild").resolve()) and f.is_file()
                  print(owner+"\t"+str(f),file=out)
          print("MINIC_REGRESSION_SENTINELS=PASS selected=%d"%(len(owners)))
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_}
            safe=${safe%.o}
            for batch in a b; do
              python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
                --input "$frozen" \
                --baseline-driver "$root/core-reentry-before/bin/minic" \
                --candidate-driver "$root/core-reentry-after/bin/minic" \
                --out "$root/core-regression/$safe/$batch" --repeats 4 \
                | tee "$root/evidence/core-regression-$safe-$batch.txt"
              grep -Fq 'MINIC_ONE_OWNER_AB=PASS' \
                "$root/evidence/core-regression-$safe-$batch.txt"
            done
            MINIC_CORE_REENTRY_INDEX_PERF=1 "$root/core-reentry-after/bin/minic" \
              -S "$frozen" -o "$root/core-regression/$safe/census.s" \
              >"$root/evidence/core-regression-$safe.stdout" \
              2>"$root/evidence/core-regression-$safe.log"
            python3 - "$root/core-regression/$safe" \
              "$root/evidence/core-regression-$safe.log" "$owner" <<'PYOWNER'
          from pathlib import Path
          import json,re,statistics,sys,hashlib
          work,log,owner=Path(sys.argv[1]),Path(sys.argv[2]),sys.argv[3]
          batches=[json.loads((work/x/"paired-result.json").read_text()) for x in ("a","b")]
          assert all(x["assembly_identical"] and x["repeat_per_arm"]==4 for x in batches)
          assert batches[0]["assembly_sha256"]==batches[1]["assembly_sha256"]
          asm_hash=hashlib.sha256((work/"census.s").read_bytes()).hexdigest()
          assert asm_hash==batches[0]["assembly_sha256"]
          stats={}
          for name,mode in (("old","before"),("new","after")):
              samples=[row for x in batches for row in x["records"] if row["mode"]==mode]
              assert len(samples)==8 and all("user_ms" in t and "sys_ms" in t for t in samples)
              stats[name]={}
              for metric in ("wall_ms","user_ms","sys_ms"):
                  vals=[float(y[metric]) for y in samples]
                  med=statistics.median(vals)
                  stats[name][metric]={"median":round(med,3),
                      "mad":round(statistics.median(abs(v-med) for v in vals),3),
                      "min":round(min(vals),3),"max":round(max(vals),3)}
              stats[name]["samples"]=samples
          old,new=stats["old"]["wall_ms"]["median"],stats["new"]["wall_ms"]["median"]
          user_old,user_new=(stats[z]["user_ms"]["median"] for z in ("old","new"))
          delta=new-old
          noise=max(5.,2.5*(stats["old"]["wall_ms"]["mad"]+
                            stats["new"]["wall_ms"]["mad"]))
          wall_regressed=(delta>max(noise,.03*old))
          cpu_regressed=(user_new-user_old>max(5.,.03*user_old))
          classification=("reproduced_cpu_and_wall_slowdown_suspect"
                          if wall_regressed and cpu_regressed else
                          "mixed_or_noisy" if delta>0 else "not_reproduced")
          m=re.findall(r"^MINIC_CORE_REENTRY_INDEX ready=1 incoming=(\d+) "
                       r"indexed_if=(\d+) indexed_loop=(\d+) "
                       r"statements=(\d+) expressions=(\d+)$",
                       log.read_text(),re.MULTILINE)
          assert len(m)<=1
          index_data=(dict(zip(("incoming","indexed_if","indexed_loop",
                                "statements","expressions"),map(int,m[0])))
                      if m else {"ready":0})
          if m:index_data["ready"]=1
          report={"owner":owner,"schema":"minic-core-reentry-regression-triage-v1",
                  "asm_sha256":asm_hash,"old_new":stats,"index":index_data,
                  "delta_wall_ms":round(delta,3),
                  "delta_pct":round(100*delta/old,3),
                  "delta_user_ms":round(user_new-user_old,3),
                  "effective_noise_floor_ms":round(noise,3),
                  "classification":classification}
          (work/"triage.json").write_text(json.dumps(report,indent=2)+"\n")
          print("MINIC_CORE_REGRESSION=PASS owner=%s old_p50=%.3f new_p50=%.3f "
                "delta_ms=%.3f change_pct=%.3f delta_cpu_user_ms=%.3f "
                "classification=%s index=%s"%
                (owner,old,new,delta,100*delta/old,user_new-user_old,
                 classification,index_data))
          PYOWNER
          done < "$root/evidence/core-regression-selected.tsv"
          python3 - "$root/core-regression" <<'PY' \
            | tee "$root/evidence/core-regression-triage-summary.txt"
          from pathlib import Path
          import json,sys
          base=Path(sys.argv[1])
          rows=[json.loads(p.read_text()) for p in sorted(base.glob("*/triage.json"))]
          assert len(rows)==16
          groups={}
          for r in rows:
              groups.setdefault(r["classification"],[]).append(r)
          for k in sorted(groups):
              print("MINIC_CORE_REGRESSION_CLASS class=%s count=%d"%
                    (k,len(groups[k])))
          for r in rows:
              ix=r["index"]
              print("MINIC_CORE_REGRESSION_OUTCOME owner=%s class=%s "
                    "old_ms=%.3f new_ms=%.3f delta_pct=%.2f "
                    "indexed_if=%d indexed_loop=%d statements=%s expressions=%s"%
                    (r["owner"],r["classification"],
                     r["old_new"]["old"]["wall_ms"]["median"],
                     r["old_new"]["new"]["wall_ms"]["median"],
                     r["delta_pct"],ix.get("indexed_if",0),
                     ix.get("indexed_loop",0),ix.get("statements"),
                     ix.get("expressions")))
          (base/"triage-summary.json").write_text(json.dumps(
              {"schema":"minic-core-reentry-regression-summary-v1",
               "scope":"16 selected inputs, 2*4 serial paired warm benchmark",
               "groups":{k:len(v) for k,v in groups.items()},
               "rows":rows},indent=2)+"\n")
          print("MINIC_CORE_REGRESSION_TRIAGE=PASS owners=16 repeated=8_each")
          PY

      # Causal follow-up: eager reentry index always walks all TU statements /
      # expressions, including functions with zero queries. Build it on first
      # real query, but never alter fallback when building the index fails.
      - name: Same-runner Core reentry eager versus lazy one-factor A/B
        if: contains(github.event.head_commit.message, '[minic-core-lazy-ab]')
        timeout-minutes: 19
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          sha256sum --status --check "$corpus/inputs.sha256"
          python3 - "$corpus" "$root" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:])
          items={}
          for r in (corpus/"selected-tus.txt").read_text().splitlines():
              q=r.split("\t",3)
              if len(q)!=4: raise SystemExit("bad frozen row")
              items[q[1]]=q[2]
          assert len(items)==500
          # Zero-query overhead, one-query controls, and heavy indexed
          # beneficiaries must all survive the construction timing change.
          owners=("mm/shmem_quota.o","fs/ext4/xattr_security.o",
                  "arch/riscv/purgatory/ctype.o","fs/nfs/client.o",
                  "kernel/events/core.o","kernel/bpf/verifier.o",
                  "mm/memcontrol.o","kernel/bpf/map_in_map.o")
          with (root/"evidence"/"core-lazy-inputs.tsv").open("w") as out:
              for owner in owners:
                  if owner not in items:raise SystemExit("frozen owner missing "+owner)
                  f=(corpus/"kbuild"/items[owner]).resolve()
                  assert f.is_relative_to((corpus/"kbuild").resolve()) and f.is_file()
                  print(owner+"\t"+str(f),file=out)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_}
            safe=${safe%.o}
            python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
              --input "$frozen" \
              --baseline-driver "$root/core-lazy-before/bin/minic" \
              --candidate-driver "$root/core-lazy-after/bin/minic" \
              --out "$root/core-lazy-ab/$safe" --repeats 4 \
              | tee "$root/evidence/core-lazy-$safe.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$root/evidence/core-lazy-$safe.txt"
            MINIC_CORE_REENTRY_INDEX_PERF=1 "$root/core-lazy-after/bin/minic" \
              -S "$frozen" -o "$root/core-lazy-ab/$safe/lazy-audit.s" \
              >"$root/evidence/core-lazy-$safe.stdout" \
              2>"$root/evidence/core-lazy-$safe.log"
            python3 - "$root/core-lazy-ab/$safe" \
              "$root/evidence/core-lazy-$safe.log" "$owner" <<'PYAUDIT'
          import hashlib,json,re,sys
          from pathlib import Path
          folder,log,owner=Path(sys.argv[1]),Path(sys.argv[2]),sys.argv[3]
          expected=json.loads((folder/"paired-result.json").read_text())["assembly_sha256"]
          assert hashlib.sha256((folder/"lazy-audit.s").read_bytes()).hexdigest()==expected
          matches=re.findall(r"^MINIC_CORE_REENTRY_INDEX ready=([01]) incoming=(\d+) "
                             r"indexed_if=(\d+) indexed_loop=(\d+) "
                             r"statements=(\d+) expressions=(\d+)$",
                             log.read_text(),re.MULTILINE)
          assert len(matches)==1, "need one ready=0/1 index census"
          ready,incoming,queries_if,queries_loop,statements,expressions=map(int,matches[0])
          # Proven previous eager baseline had zero queries on all three
          # controls; this new policy must avoid building for exactly those TUs.
          if owner in ("mm/shmem_quota.o","fs/ext4/xattr_security.o",
                       "arch/riscv/purgatory/ctype.o"):
              assert ready==0, "lazy must not construct a never-used index"
          else:
              assert ready==1, "active Core query unexpectedly lost its index"
          print("MINIC_CORE_LAZY_CENSUS=PASS owner=%s ready=%d incoming=%d "
                "indexed_if=%d indexed_loop=%d statements=%d expressions=%d"%
                (owner,ready,incoming,queries_if,queries_loop,statements,expressions))
          PYAUDIT
          done < "$root/evidence/core-lazy-inputs.tsv"
          python3 - "$root/core-lazy-ab" <<'PY' \
            | tee "$root/evidence/core-lazy-summary.txt"
          import json,sys
          from pathlib import Path
          base=Path(sys.argv[1])
          rows=[]
          for f in sorted(base.glob("*/paired-result.json")):
              r=json.loads(f.read_text())
              assert r["assembly_identical"] and r["repeat_per_arm"]==4
              rows.append((f.parent.name,r["baseline_median_ms"],
                           r["candidate_median_ms"]))
          assert len(rows)==8
          before=sum(r[1] for r in rows);after=sum(r[2] for r in rows)
          print("MINIC_CORE_LAZY_AB=PASS identical=8/8 "
                "old_p50_sum_ms=%.3f new_p50_sum_ms=%.3f speedup=%.5f"%
                (before,after,before/after))
          for owner,old,new in rows:
              print("MINIC_CORE_LAZY_OWNER owner=%s old_ms=%.3f "
                    "new_ms=%.3f speedup=%.4f"%(owner,old,new,old/new))
          PY

      # Explicit opt-in, no new workflow/job and no rebuild of Linux .o.
      # Eager baseline is exact full-2064/QEMU certified source b4529801,
