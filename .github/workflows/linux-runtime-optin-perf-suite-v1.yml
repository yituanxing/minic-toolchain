      # Post-Function owned-storage census shows only 2.29-4.59 MiB
      # FunctionType capacity per large owner, vs ~104 MiB Expression.
      # Screen real compile-time impact before considering full500.
      # Current frozen seven-TU census: Expr cap 676MiB total, 104MiB
      # each large owner, <=8 args in nearly all CALLs. This is separate
      # from accepted 32-bit IDs; only stage safe inline8 overflow in a
      # throwaway CI checkout with exact assembly & AST contract checks.
      - name: Benchmark CALL-inline8 sparse overflow payload with owned AST normalization
        if: contains(github.event.head_commit.message, '[minic-ast-call-inline8-ab]') || contains(github.event.head_commit.message, '[minic-ast-call-inline8-ab500]') || contains(github.event.head_commit.message, '[minic-ast-call-inline8-safety]')
        timeout-minutes: 25
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          trial=ast-call-inline8
          mkdir -p "$root/evidence" "$root/$trial-ab"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make time >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$root/$trial-before" "$root/evidence/$trial-before"
          cat > "$root/$trial-ab/sizeof.c" <<'CSIZES'
          #include "frontend/ast.h"
          #include <stdio.h>
          int main(void) {
              printf("sizeof_expression=%zu sizeof_function=%zu\n",
                  sizeof(MinicExpression),sizeof(MinicFunction));
              return 0;
          }
          CSIZES
          cc -Isrc -Iinclude -o "$root/$trial-ab/size-before" "$root/$trial-ab/sizeof.c"
          "$root/$trial-ab/size-before" | tee "$root/evidence/$trial-before-sizes.txt"
          python3 tools/ci/apply-perf-ast-call-inline8-overflow-v1.py
          git diff --check
          test "$(git diff --name-only -- src include | wc -l)" -eq 9
          if grep -R -n -F 'value.call.arguments[' src --include='*.c'; then
            echo "MINIC_AST_CALL_INLINE8=FAIL unconverted AST CALL array consumers"
            exit 72
          fi
          cc -Isrc -Iinclude -o "$root/$trial-ab/size-after" "$root/$trial-ab/sizeof.c"
          "$root/$trial-ab/size-after" | tee "$root/evidence/$trial-after-sizes.txt"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$root/$trial-after" \
            "$root/$trial-after/bin/minic" "$root/$trial-after/bin/minic-cc" \
            check-ast-contract check-type \
            >"$root/evidence/$trial-contract.txt" 2>&1 || {
              tail -n 120 "$root/evidence/$trial-contract.txt"; exit 71
            }
          echo "MINIC_AST_CALL_INLINE8_CONTRACT=PASS"
          # Explicit 0/1/2/8/9/63/64 accepted args, 65 rejected.
          # Each test checks old/new exact .s, including indirect/variadic
          # when present in the fixture. Also exercises cast normalization.
          python3 tools/ci/linux-perf-packed-call-edge-cases-v1.py \
            --baseline-driver "$root/$trial-before/bin/minic" \
            --candidate-driver "$root/$trial-after/bin/minic" \
            --out "$root/$trial-ab/call-boundary" \
            | tee "$root/evidence/$trial-call-boundary.txt"
          grep -Fq 'MINIC_PACKED_EDGE=PASS cases=2' "$root/evidence/$trial-call-boundary.txt"
          if [[ "${{ contains(github.event.head_commit.message, '[minic-ast-call-inline8-safety]') && '1' || '0' }}" == 1 ]]; then
            # Reuse the expanded ast-contract-test including 64-arg cast
            # normalization and Program-owned overflow clone semantics.
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
              make -j4 MODE=sanitize CFLAGS=-Werror \
                BUILD_DIR="$root/$trial-sanitize" check-ast-contract \
                >"$root/evidence/$trial-sanitize-contract.log" 2>&1 || {
                  tail -n 100 "$root/evidence/$trial-sanitize-contract.log"; exit 81
                }
            echo "MINIC_AST_CALL_INLINE8_SANITIZE=PASS"
            python3 tools/ci/linux-perf-packed-call-regression-review-v1.py \
              --corpus "$corpus" \
              --baseline-driver "$root/$trial-before/bin/minic" \
              --candidate-driver "$root/$trial-after/bin/minic" \
              --out "$root/$trial-ab/recheck" \
              --label MINIC_AST_CALL_INLINE8_TRIAGE \
              --owner fs/nfs/client.o \
              --owner fs/nfs/blocklayout/extent_tree.o \
              --owner kernel/irq/manage.o \
              --owner kernel/sys_ni.o \
              --owner kernel/bpf/btf.o \
              --owner fs/ext4/fsync.o \
              | tee "$root/evidence/$trial-recheck.txt"
            grep -Fq 'MINIC_AST_CALL_INLINE8_TRIAGE=PASS owners=6 old_new_pairs=8_each' \
              "$root/evidence/$trial-recheck.txt"
            echo "MINIC_AST_CALL_INLINE8_SAFETY=PASS"
            exit 0
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[minic-ast-call-inline8-ab500]') && '1' || '0' }}" == 1 ]]; then
            ln -s "$root/$trial-before" "$root/baseline-toolchain"
            ln -s "$root/$trial-after" "$root/toolchain"
            echo "MINIC_AST_CALL_INLINE8_500_READY=PASS old=416B new=208B boundaries=pass"
            exit 0
          fi
          python3 - "$corpus" "$root" "$trial" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:3]);trial=sys.argv[3]
          chosen={}
          for row in (corpus/"selected-tus.txt").read_text().splitlines():
              parts=row.split("\t",3)
              if len(parts)!=4: raise SystemExit("bad frozen source manifest")
              chosen[parts[1]]=parts[2]
          assert len(chosen)==500
          owners=("kernel/bpf/btf.o","kernel/events/core.o","mm/memcontrol.o",
                  "fs/ext4/fsync.o","fs/ext4/super.o")
          with (root/"evidence"/(trial+"-inputs.tsv")).open("w") as f:
              for owner in owners:
                  if owner not in chosen: raise SystemExit("missing frozen owner "+owner)
                  src=(corpus/"kbuild"/chosen[owner]).resolve()
                  assert src.is_file() and src.is_relative_to((corpus/"kbuild").resolve())
                  print(owner+"\t"+str(src),file=f)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_};safe=${safe%.o}
            python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
              --input "$frozen" \
              --baseline-driver "$root/$trial-before/bin/minic" \
              --candidate-driver "$root/$trial-after/bin/minic" \
              --out "$root/$trial-ab/$safe" --repeats 4 \
              | tee "$root/evidence/$trial-$safe.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$root/evidence/$trial-$safe.txt"
            for mode in before after; do
              /usr/bin/time -f '%M %U %S %e' -o "$root/$trial-ab/$safe/$mode-rss-cpu.txt" \
                "$root/$trial-$mode/bin/minic-cc" -S "$frozen" \
                -o "$root/$trial-ab/$safe/$mode-rss.s" \
                >"$root/$trial-ab/$safe/$mode.stdout" \
                2>"$root/$trial-ab/$safe/$mode.stderr"
            done
            cmp "$root/$trial-ab/$safe/before-rss.s" "$root/$trial-ab/$safe/after-rss.s"
          done < "$root/evidence/$trial-inputs.tsv"
          python3 - "$root/$trial-ab" <<'PYSUM'
          from pathlib import Path
          import json,sys
          root=Path(sys.argv[1]);rows=[]
          for path in sorted(root.iterdir()):
              if not path.is_dir() or path.name=="call-boundary":continue
              doc=json.loads((path/"paired-result.json").read_text())
              assert doc["assembly_identical"] and doc["repeat_per_arm"]==4
              rss={}
              for mode in ("before","after"):
                  mem,user,sy,wall=map(float,(path/(mode+"-rss-cpu.txt")).read_text().split())
                  rss[mode]=dict(max_rss_kib=int(mem),user_s=user,sys_s=sy,wall_s=wall)
              item=dict(owner=path.name,before_ms=doc["baseline_median_ms"],
                        after_ms=doc["candidate_median_ms"],
                        speedup=doc["baseline_median_ms"]/doc["candidate_median_ms"],rss=rss)
              rows.append(item)
              print("MINIC_AST_CALL_INLINE8_OWNER="+json.dumps(item,separators=(',',':')),flush=True)
          assert len(rows)==5
          old=sum(x["before_ms"] for x in rows);new=sum(x["after_ms"] for x in rows)
          (root/"summary.json").write_text(json.dumps(dict(owners=rows,old_sum_ms=old,new_sum_ms=new,speedup=old/new),indent=2)+"\n")
          print("MINIC_AST_CALL_INLINE8_AB=PASS owners=5 identical=5/5 old_sum_ms=%.3f new_sum_ms=%.3f speedup=%.5f"%(old,new,old/new))
          PYSUM

