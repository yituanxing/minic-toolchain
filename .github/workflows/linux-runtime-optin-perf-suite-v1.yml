      # Production MiniAS has portable constant fallbacks now; reuse those 76
      # only with exact seed/runtime SHA and fresh identical MiniPP input bytes.
      # Run the entire 77-TU nine-tool self-rebuild and fixed-point now.
      # C11 hosted-ABI macros and explicit external runtime headers are pinned.
      # Mini stage builds run with GCC/AS/LD execve forbidden.
      # Stage2-built MiniPP/AS/LD and fixed-point MiniC rebuild all NINE
      # current tool executables from C source, twice. A separate milestone:
      # original Stage2-built ELF creation used GNU; these two rebuilds do not.
      # Native runtime libraries are still declared external binary seeds.
      # The previous complete 77-TU run has 76 certified source-level .i/.s/.o
      # objects. SHA-check source inputs, compiler seeds, external runtime, and
      # previous output bytes before reusing; only oversized core_lower.s is rerun.
      - name: Restore prior 76-of-77 native Stage3 objects as checked evidence
        if: contains(github.event.head_commit.message, '[minic-bootstrap-full-native]') && contains(github.event.head_commit.message, '[minic-bootstrap-stage2-native-runtime]')
        uses: actions/download-artifact@v4
        with:
          name: minic-current-bootstrap-stage2-native-runtime-v1
          repository: yituanxing/minic-toolchain
          run-id: 39058200575
          github-token: ${{ github.token }}
          path: build/bootstrap-stage2-native/previous

      # Isolate the external runtime seed problem WITHOUT modifying MiniLD:
      # cross-glibc libc.a contains SHT_GROUP (type 17), which our certified
      # MiniLD explicitly rejects. Pinned musl 1.2.5 static was validated by
      # existing MiniLD integration tests. This is an externally generated
      # bootstrap seed; its GNU producer is NOT hidden or counted as selfhost.
      - name: Prepare SHA-pinned musl 1.2.5 external runtime seed
        if: contains(github.event.head_commit.message, '[minic-bootstrap-native-musl-probe]')
        shell: bash
        timeout-minutes: 25
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/bootstrap-stage2-native/musl-seed"
          mkdir -p "$root"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz -o "$root/musl-1.2.5.tar.gz"
          printf '%s  %s\n' \
            a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4 \
            "$root/musl-1.2.5.tar.gz" | sha256sum -c -
          tar -xzf "$root/musl-1.2.5.tar.gz" -C "$root"
          src="$root/musl-1.2.5"
          out="$root/musl-build"
          mkdir -p "$out"
          cd "$out"
          CFLAGS="-O2 -fno-pic -fno-pie" \
          CC=riscv64-linux-gnu-gcc \
          AR=riscv64-linux-gnu-ar \
          RANLIB=riscv64-linux-gnu-ranlib \
            "$src/configure" --target=riscv64-linux-gnu --disable-shared --prefix=/usr \
            >"$root/configure.log" 2>&1
          make -j4 lib/libc.a obj/crt/crt1.o obj/crt/crti.o obj/crt/crtn.o \
            >"$root/make.log" 2>&1 || { tail -n 70 "$root/make.log"; exit 1; }
          for f in lib/libc.a obj/crt/crt1.o obj/crt/crti.o obj/crt/crtn.o; do
            test -s "$f"
            sha256sum "$f"
          done | tee "$root/runtime-sha256.txt"
          # The same musl producer must supply BOTH headers and runtime:
          # glibc struct stat/FILE layouts may not match musl despite linking.
          make DESTDIR="$root/sysroot" install-headers >"$root/headers-install.log" 2>&1
          test -s "$root/sysroot/usr/include/stdio.h"
          test -s "$root/sysroot/usr/include/sys/stat.h"
          (
            cd "$root/sysroot/usr/include"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$root/headers.sha256"
          test "$(wc -l < "$root/headers.sha256")" -gt 100
          echo "MUSL_SEED=PASS external_GNU_producer_disclosed=true native_link_invokes_GNU=false headers_and_libc_same_musl_source=true"

