      - name: Preserve Stage2-built native CLI runtime and differential evidence
        if: always() && contains(github.event.head_commit.message, '[minic-bootstrap-stage2-native-runtime]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-current-bootstrap-stage2-native-runtime-v1
          path: |
            build/bootstrap-stage2-native/verdict.log
