        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee build/linux-perf-audit-v1/evidence/paired-ab-analysis.txt
          import json, statistics
          from pathlib import Path
          rows=json.loads(Path("build/linux-perf-audit-v1/paired/paired-results.json").read_text())
          for kind in ("baseline","candidate"):
              secs=sorted(float(row[kind]["seconds"]) for row in rows)
              print(f"{kind}: sum={sum(secs):.3f}s median={statistics.median(secs):.4f}s "
                    f"p95={secs[474]:.4f}s p99={secs[494]:.4f}s max={secs[-1]:.4f}s")
          print("TOP30_CANDIDATE")
          for row in sorted(rows,key=lambda r:r["candidate"]["seconds"],reverse=True)[:30]:
              print(f'{row["candidate"]["seconds"]:8.3f}s before={row["baseline"]["seconds"]:8.3f}s '
                    f'index={row["index"]} input={row["input"]}')
          PY

      - name: Real frozen Linux first500 same-runner old versus current A/B
        if: contains(github.event.head_commit.message, '[minic-source-broad-ab]')
        shell: bash
        timeout-minutes: 45
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status -c "$corpus/inputs.sha256"
          python3 tools/ci/linux-perf-frozen-corpus-differential-v1.py \
            --corpus "$corpus" \
            --baseline-driver "$work/baseline-toolchain/bin/minic" \
            --candidate-driver "$work/toolchain/bin/minic" \
            --jobs 4 --balanced-order --out "$work/oldnew500" \
            | tee "$work/evidence/oldnew500-verdict.txt"
          grep -Fq 'MINIC_FROZEN_DIFF=PASS selected=500 identical=500' "$work/evidence/oldnew500-verdict.txt"
          grep -Fq 'MINIC_FROZEN_PAIRED=PASS owners=500 balanced_order=true' "$work/evidence/oldnew500-verdict.txt"
          cp "$work/oldnew500/differential.json" "$work/evidence/oldnew500-differential.json"
          python3 - "$work/evidence/oldnew500-differential.json" <<'PY' | tee "$work/evidence/oldnew500-summary.txt"
          import json,statistics,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          rows=d["results"]
          assert len(rows)==500 and d["identical"]==500 and d["mismatch_count"]==0
          old=sum(r["baseline"]["wall_ms"] for r in rows)
          new=sum(r["candidate"]["wall_ms"] for r in rows)
          print("MINIC_500_AB=PASS objects=500 old_total_ms=%.3f new_total_ms=%.3f speedup=%.5f" % (old,new,old/new))
          print("MINIC_500_AB=COUNTS baseline_first=%d candidate_first=%d regressions=%d" % (
              sum(r["first"]=="baseline" for r in rows),
              sum(r["first"]=="candidate" for r in rows),
              sum(r["candidate"]["wall_ms"]>r["baseline"]["wall_ms"] for r in rows)))
          ratios=[r["baseline"]["wall_ms"]/r["candidate"]["wall_ms"] for r in rows]
          print("MINIC_500_AB=RATIO_MEDIAN %.5f" % statistics.median(ratios))
          for row in sorted(rows,key=lambda r:r["candidate"]["wall_ms"]-r["baseline"]["wall_ms"],reverse=True)[:8]:
              print("MINIC_500_AB_REGRESSION owner=%s old_ms=%.3f new_ms=%.3f" % (
                  row["object"],row["baseline"]["wall_ms"],row["candidate"]["wall_ms"]))
          PY

      # Factor isolation extension: opt-in only; the archived perf500 job
      # above and the original artifact uploader below are left untouched.
      - name: Build two one-factor-off compilers from immutable source
        if: contains(github.event.head_commit.message, '[linux-perf-factorial]')
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          test -s "$work/evidence/paired-results.json"
          git reset --hard HEAD
          MINIC_PERF_SKIP_TYPEDEF_INDEX=1 bash tools/ci/linux-perf-build-minic-profile-v1.sh \
            "$work/boolean-only" "$work/evidence/boolean-only-profile"
          grep -qx 'SKIPPED_FACTOR_PATCH=apply-perf-parser-typedef-index-v1.py' \
            "$work/evidence/boolean-only-profile/patch.log"
          git reset --hard HEAD
          MINIC_PERF_SKIP_BOOLEAN_SCOPED=1 bash tools/ci/linux-perf-build-minic-profile-v1.sh \
            "$work/typedef-only" "$work/evidence/typedef-only-profile"
          grep -qx 'SKIPPED_FACTOR_PATCH=apply-inline-specialization-local-boolean-domain-scoped-v1.py' \
            "$work/evidence/typedef-only-profile/patch.log"
          test -x "$work/toolchain/bin/minic"
          test -x "$work/boolean-only/bin/minic"
          test -x "$work/typedef-only/bin/minic"

      - name: Reuse frozen first500 paired A-B for each independent factor
        if: contains(github.event.head_commit.message, '[linux-perf-factorial]')
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          sha256sum --status -c "$corpus/inputs.sha256"
          for factor in boolean-only typedef-only; do
            # Same original paired runner, same 500 SHA-pinned .i files, same
            # four workers; candidate always has BOTH optimizations enabled.
            MINIC_TYPEDEF_INDEX_PERF=1 CORE_FAST_TRACE=0 \
              python3 tools/ci/linux-perf-typedef-paired-ab-v1.py \
                --baseline "$work/$factor/bin/minic" \
                --candidate "$work/toolchain/bin/minic" \
                --corpus "$corpus" --work "$work/factor-$factor" \
                --hotspots-from "$work/evidence/paired-results.json" --sample-count 48 \
                --jobs 4 | tee "$work/evidence/factor-$factor.txt"
            cp "$work/factor-$factor/paired-results.json" \
              "$work/evidence/factor-$factor-results.json"
          done
          echo 'MINIC_FACTORIAL=PASS original_test_reused=true new_full_kernel_build=false'

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-current-profile-first500-perf-v1
          path: |
            build/linux-perf-audit-v1/evidence
            build/linux-perf-audit-v1/boolean-domain-ab500/differential.json
            build/linux-perf-audit-v1/boolean-domain-ab20/boolean-domain-paired20.json
            build/linux-perf-audit-v1/boolean-domain-ab20/*/paired-result.json
            build/linux-perf-audit-v1/current-phase20/phase20.json
            build/linux-perf-audit-v1/current-phase20/phase20.csv
            build/linux-perf-audit-v1/current-phase20/*/phases.json
            build/linux-perf-audit-v1/current-phase20/*/trace.log
            build/linux-perf-audit-v1/current-phase20/cpu/*.txt
            build/linux-perf-audit-v1/current-phase20/cpu/*.json
            build/linux-perf-audit-v1/current-phase20/cpu/*/*.txt
            build/linux-perf-audit-v1/current-phase20/cpu/*/*.json
            build/linux-perf-audit-v1/parser-copy-ab/*/paired-result.json
            build/linux-perf-audit-v1/integer-owner-ab/*/paired-result.json
            build/linux-perf-audit-v1/integer-owner-ab500/differential.json
            build/linux-perf-audit-v1/core-reentry-ab/*/paired-result.json
            build/linux-perf-audit-v1/core-reentry-ab500/differential.json
            build/linux-perf-audit-v1/core-regression/*/triage.json
            build/linux-perf-audit-v1/core-regression/triage-summary.json
            build/linux-perf-audit-v1/core-lazy-ab/*/paired-result.json
            build/linux-perf-audit-v1/core-lazy-ab500/differential.json
            build/linux-perf-audit-v1/boolean-owner-ab/*/paired-result.json
            build/linux-perf-audit-v1/next-phase/*/phases.json
            build/linux-perf-audit-v1/next-phase/ranked-summary.json
            build/linux-perf-audit-v1/oldnew500/differential.json
            build/linux-perf-materialize/batch-summary.txt
          retention-days: 7
