      - name: Measure current AST payload sizes, call ratio, and actual peak RSS
        if: contains(github.event.head_commit.message, '[minic-ast-shape-census]')
        timeout-minutes: 23
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-perf-audit-v1"
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          out="$root/ast-shape-census"
          mkdir -p "$out"
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make time >/dev/null
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$out/current" "$out/current-build"
          python3 tools/ci/apply-perf-ast-shape-census-v1.py
          git diff --check
          test "$(git diff --name-only -- src include)" = src/compiler/compiler.c
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$out/instrumented" \
            "$out/instrumented/bin/minic-cc" >/dev/null
          python3 - "$corpus" "$out" <<'PY'
          from pathlib import Path
          import sys
          corpus,out=map(Path,sys.argv[1:])
          names=("fs/ext4/fsync.o","kernel/bpf/btf.o","kernel/events/core.o",
                 "mm/memcontrol.o","fs/ext4/super.o","mm/hugetlb.o","mm/vmscan.o")
          index={}
          for line in (corpus/"selected-tus.txt").read_text().splitlines():
              parts=line.split("\t",3)
              if len(parts)!=4: raise SystemExit("bad selected-tus record")
              index[parts[1]]=parts[2]
          assert len(index)==500
          with (out/"selected-inputs.tsv").open("w") as stream:
              for name in names:
                  assert name in index,name
                  source=(corpus/"kbuild"/index[name]).resolve()
                  assert source.is_relative_to((corpus/"kbuild").resolve()) and source.is_file()
                  print(name+"\t"+str(source),file=stream)
          PY
          while IFS="$(printf '\t')" read -r owner frozen; do
            safe=${owner//\//_}
            safe=${safe%.o}
            /usr/bin/time -f '%M' -o "$out/$safe.original-rss-kib" \
              "$out/current/bin/minic-cc" -S "$frozen" -o "$out/$safe.original.s" \
              >"$out/$safe.original.stdout" 2>"$out/$safe.original.log"
            MINIC_AST_SHAPE_CENSUS=1 /usr/bin/time -f '%M' \
              -o "$out/$safe.census-rss-kib" \
              "$out/instrumented/bin/minic-cc" -S "$frozen" -o "$out/$safe.census.s" \
              >"$out/$safe.census.stdout" 2>"$out/$safe.census.log"
            cmp -s "$out/$safe.original.s" "$out/$safe.census.s"
            test "$(grep -c '^MINIC_AST_SHAPE stage=' "$out/$safe.census.log")" -eq 2
            test "$(cat "$out/$safe.original-rss-kib")" -gt 0
            test "$(cat "$out/$safe.census-rss-kib")" -gt 0
            echo "MINIC_AST_SHAPE_ASM=PASS owner=$owner sha=$(sha256sum "$out/$safe.original.s" | cut -c1-64)"
          done < "$out/selected-inputs.tsv"
          python3 - "$out" <<'PYSUM'
          import json,re,statistics,sys
          from pathlib import Path
          out=Path(sys.argv[1]); rows=[]
          for line in (out/"selected-inputs.tsv").read_text().splitlines():
              owner,_=line.split("\t",1)
              safe=owner.replace("/","_").removesuffix(".o")
              log=(out/(safe+".census.log")).read_text()
              stages={}
              for event in re.findall(r"^MINIC_AST_SHAPE (.*)$",log,re.MULTILINE):
                  parts=dict(item.split("=",1) for item in event.split(" "))
                  stage=parts.pop("stage")
                  assert stage not in stages
                  stages[stage]={k:int(v) for k,v in parts.items()}
              assert set(stages)=={"parsed","final"},(owner,stages)
              data=stages["final"]; initial=stages["parsed"]
              assert initial["expression_size"]==data["expression_size"]
              assert data["expression_count"]>=initial["expression_count"]
              assert data["call_count"]<=data["expression_count"]
              assert sum(data["call_"+k] for k in ("0","1","2","3to4","5to8","9plus"))==data["call_count"]
              alloc_mib=data["expression_capacity"]*data["expression_size"]/1048576
              live_mib=data["expression_count"]*data["expression_size"]/1048576
              function_alloc_mib=data["function_capacity"]*data["function_size"]/1048576
              function_type_alloc_mib=data["function_type_capacity"]*data["function_type_size"]/1048576
              local_alloc_mib=data["local_capacity"]*data["local_size"]/1048576
              statement_alloc_mib=data["statement_capacity"]*data["statement_size"]/1048576
              record_alloc_mib=data["record_capacity"]*data["record_size"]/1048576
              row=dict(owner=owner,input_sha=None,parsed=initial,final=data,
                       expr_alloc_mib=round(alloc_mib,2),expr_live_mib=round(live_mib,2),
                       function_alloc_mib=round(function_alloc_mib,2),
                       function_type_alloc_mib=round(function_type_alloc_mib,2),
                       local_alloc_mib=round(local_alloc_mib,2),
                       statement_alloc_mib=round(statement_alloc_mib,2),
                       record_alloc_mib=round(record_alloc_mib,2),
                       function_type_param_mean=round(data["function_type_params"]/max(data["function_type_count"],1),4),
                       call_ratio=round(data["call_count"]/max(1,data["expression_count"]),5),
                       original_maxrss_kib=int((out/(safe+".original-rss-kib")).read_text()),
                       census_maxrss_kib=int((out/(safe+".census-rss-kib")).read_text()))
              rows.append(row)
              print("MINIC_AST_SHAPE_OWNER="+json.dumps(row,separators=(',',':')))
          result=dict(schema="minic-ast-shape-census-v1",rows=rows,
                      total_expr_live_mib=round(sum(v["expr_live_mib"] for v in rows),2),
                      total_expr_alloc_mib=round(sum(v["expr_alloc_mib"] for v in rows),2),
                      median_call_ratio=round(statistics.median(v["call_ratio"] for v in rows),5),
                      interpretation="RSS = OS peak process RSS, struct bytes = nominal allocator capacity. Neither equals memcpy traffic.")
          (out/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("MINIC_AST_SHAPE_CENSUS=PASS owners=7 assembly_equal=7/7 "+
                "expr_alloc_mib="+str(result["total_expr_alloc_mib"])+
                " median_call_ratio="+str(result["median_call_ratio"]))
          for metric in ("expr_alloc_mib","function_alloc_mib","function_type_alloc_mib",
                         "local_alloc_mib","statement_alloc_mib","record_alloc_mib"):
              print("MINIC_CURRENT_STORAGE_TOTAL="+metric+" mib="+
                    str(round(sum(row[metric] for row in rows),3)))
          for row in rows:
              print("MINIC_CURRENT_STORAGE_OWNER="+json.dumps(
                  {k:row[k] for k in ("owner","expr_alloc_mib","function_alloc_mib",
                  "function_type_alloc_mib","local_alloc_mib","statement_alloc_mib",
                  "record_alloc_mib","function_type_param_mean","original_maxrss_kib")},
                  separators=(",",":")))
          PYSUM

