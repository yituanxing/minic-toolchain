name: Linux Runtime Opt-in Performance and Semantics Suite

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select candidate qualification"
        required: true
        type: choice
        default: first500
        options:
          - first500
          - all3352
          - constant-p
          - all
  # Reuse the existing perf500 job for explicit, scoped production-source
  # comparisons. No other job is eligible for this one push marker.
  # Current phase20 opt-in also reads preexisting Integer-owner / Parser-lookup
  # diagnostics; no new job or production compiler changes (2026-10-17).
  # Metrics are explicitly opted in; generic historical stage A/B stays compatible.
  # Current Core reentry index counters are now included in the same opt-in
  # phase20 census, using preexisting C telemetry [minic-current-phase20].
  push:
    branches: [main]
    paths:
      - ".github/workflows/linux-runtime-optin-perf-suite-v1.yml"

permissions:
  contents: read
  actions: read # download attested Stage2 artifact from already-passed self-host CI

jobs:

  shard:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all3352' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-perf3352]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {label: a, offset: 0, count: 500}
          - {label: b, offset: 500, count: 500}
          - {label: c, offset: 1000, count: 500}
          - {label: d, offset: 1500, count: 500}
          - {label: e, offset: 2000, count: 500}
          - {label: f, offset: 2500, count: 500}
          - {label: g, offset: 3000, count: 352}
    env:
      DEBIAN_FRONTEND: noninteractive
      OFFSET: ${{ matrix.offset }}
      COUNT: ${{ matrix.count }}
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      # Canonical Linux configs.o .incbin sidecar was absent from historical
      # frozen .i cache; we use historic B4 empty stub for parity only.
      # Reuse existing seven shard runners for the *same* frozen first500 .i.
      # All 500 verified per runner; Stage0 vs QEMU Stage2 .s/.o SHA.
      # First real full 7-runner Stage2 bootstrap qualification, reusing the
      # fixed-point ELF (39040013459), the certified cache and immutable
      # Stage0 source fingerprint. Separate this gate from full 2064 P1.
      - name: Restore SHA-certified frozen first500 source corpus
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')
        uses: actions/cache/restore@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Download 47-TU fixed-point Stage2 compiler
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')
        uses: actions/download-artifact@v4
        with:
          name: minic-current-bootstrap-b1-stage2-v1
          repository: yituanxing/minic-toolchain
          run-id: 39040013459
          github-token: ${{ github.token }}
          path: build/bootstrap-stage2-linux500/artifact

      - name: Linux first500 real Stage2 CI-shard differential
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')
        timeout-minutes: 95
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/minic-bootstrap-stage2-linux500-shard-v1.sh "$LABEL"

      - name: Save Stage2 Linux500 per-object evidence
        if: always() && contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-bootstrap-stage2-linux500-${{ matrix.label }}
          path: |
            build/bootstrap-stage2-linux500/${{ matrix.label }}/verdict.log
            build/bootstrap-stage2-linux500/${{ matrix.label }}/stage0-build.log
            build/bootstrap-stage2-linux500/${{ matrix.label }}/auxiliary.txt
            build/bootstrap-stage2-linux500/${{ matrix.label }}/differential/verdict.json
            build/bootstrap-stage2-linux500/${{ matrix.label }}/differential/stage0/batch-results.json
            build/bootstrap-stage2-linux500/${{ matrix.label }}/differential/stage2/batch-results.json
            build/bootstrap-stage2-linux500/${{ matrix.label }}/differential/stage0/assemble-results.json
            build/bootstrap-stage2-linux500/${{ matrix.label }}/differential/stage2/assemble-results.json
            build/bootstrap-stage2-linux500/${{ matrix.label }}/differential/stage2/failure-contexts.txt
            build/bootstrap-stage2-linux500/${{ matrix.label }}/differential/stage2/minic-stderr
          if-no-files-found: warn
          retention-days: 7

      # Seven Stage4 first500 producer artifacts from #39062218853 are all green;
      # the isolated evidence-only aggregate recomputes 500 unique .s/.o
      # identities with the repaired candidate_* manifest schema, NO rebuild.
      # Reuse the SAME seven runners, immutable first500 Kbuild .i and
      # original Stage0 oracle. Candidate is the REAL Stage4 RV64 compiler,
      # certified by matched-musl nine-tool fixedpoint #39058935623.
      # This gate uses GNU AS as an external object oracle only. It does NOT
      # pretend to prove native MiniAS/LD for a full Linux Image.
      - name: Restore frozen Linux first500 for Stage4 native compiler differential
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')
        uses: actions/cache/restore@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Restore SHA-certified nine-tool Stage4 build evidence
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')
        uses: actions/download-artifact@v4
        with:
          name: minic-current-bootstrap-stage2-native-runtime-v1
          repository: yituanxing/minic-toolchain
          run-id: 39058935623
          github-token: ${{ github.token }}
          path: build/bootstrap-stage4-linux500/artifact

      - name: Stage4 native MiniC versus Stage0 Linux first500 exact object parity
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')
        timeout-minutes: 95
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/minic-bootstrap-stage4-linux500-shard-v1.sh "$LABEL"

      - name: Preserve Stage4 frozen Linux first500 parity evidence
        if: always() && contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-bootstrap-stage4-linux500-${{ matrix.label }}
          path: |
            build/bootstrap-stage4-linux500/${{ matrix.label }}/verdict.log
            build/bootstrap-stage4-linux500/${{ matrix.label }}/stage0-build.log
            build/bootstrap-stage4-linux500/${{ matrix.label }}/stage4-help.log
            build/bootstrap-stage4-linux500/${{ matrix.label }}/auxiliary.txt
            build/bootstrap-stage4-linux500/${{ matrix.label }}/differential/verdict.json
            build/bootstrap-stage4-linux500/${{ matrix.label }}/differential/stage0/batch-results.json
            build/bootstrap-stage4-linux500/${{ matrix.label }}/differential/stage4/batch-results.json
            build/bootstrap-stage4-linux500/${{ matrix.label }}/differential/stage0/assemble-results.json
            build/bootstrap-stage4-linux500/${{ matrix.label }}/differential/stage4/assemble-results.json
            build/bootstrap-stage4-linux500/${{ matrix.label }}/differential/stage4/minic-stderr
          if-no-files-found: warn
          retention-days: 7

      - name: Install RISC-V prerequisites
        if: "!contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')"
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross bc bison flex libssl-dev make curl xz-utils python3 >/dev/null
          riscv64-linux-gnu-gcc --version | head -n1
          df -h "$GITHUB_WORKSPACE"
      - name: Build latest Canonical MiniC
        if: "!contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')"
        run: |
          echo 'HISTORICAL_PERF_RETIRED: stacked source overlay no longer builds current MiniC; replay at 59ad3648637eba4991c0fb8ce27f121cc852b4fa. No current-source PASS.' >&2
          exit 78
      - name: Materialize this Kbuild C TU range (not part of MiniC time)
        if: "!contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')"
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/all3352-wall"
          begin=$(date +%s)
          MINIC="$root/toolchain/bin/minic" \
          BUILD_DIR="$root/input" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET="$OFFSET" LINUX_BATCH_LIMIT="$COUNT" \
          LINUX_BATCH_MATERIALIZE_ONLY=1 LINUX_BATCH_MATERIALIZE_MAKE_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          echo "MATERIALIZE_SECONDS=$(($(date +%s)-begin))" | tee "$root/evidence/materialize-time.txt"
          test "$(wc -l < "$root/input/tu-manifest.txt")" -eq 3352
          test "$(wc -l < "$root/input/selected-tus.txt")" -eq "$COUNT"
          ROOT="$root" python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          rows=[s.split("\t",3) for s in (root/"input/selected-tus.txt").read_text().splitlines()]
          off=int(os.environ["OFFSET"]); n=int(os.environ["COUNT"])
          assert [int(r[0]) for r in rows]==list(range(off,off+n))
          assert all((root/"input/kbuild"/r[2]).stat().st_size>0 for r in rows)
          print(f"ALL3352_MATERIALIZED off={off} count={n} verified=yes")
          PY
          df -h "$GITHUB_WORKSPACE"
      - name: Verify both historically damaged preprocessed inputs with GCC
        if: matrix.label == 'f' && !contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/all3352-wall"
          for unit in serio.i libps2.i; do
            input="$root/input/kbuild/drivers/input/serio/$unit"
            test -s "$input"
            if riscv64-linux-gnu-gcc -x cpp-output -fsyntax-only -w "$input" >"$root/evidence/$unit.gcc-cpp-output.txt" 2>&1; then
              echo "GCC_PREPROCESSED_VALID input=$unit"
            else
              echo "GCC_PREPROCESSED_INVALID input=$unit"
              tail -n 35 "$root/evidence/$unit.gcc-cpp-output.txt"
              exit 1
            fi
          done
      - name: Measure MiniC -S only, using four parallel workers
        if: "!contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')"
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/all3352-wall"
          set +e
          CORE_FAST_TRACE=0 python3 tests/external/linux/corpus_replay.py \
            --minic "$root/toolchain/bin/minic" --corpus "$root/input" \
            --work "$root/replay" --jobs 4 --offset 0 --limit 0 --sample-count 0 \
              >"$root/evidence/replay.log" 2>&1
          rc=$?
          set -e
          echo "REPLAY_RC=$rc" | tee "$root/evidence/returncode.txt"
          tail -n 15 "$root/evidence/replay.log"
          test -s "$root/replay/batch-results.json"
          cp "$root/replay/batch-results.json" "$root/evidence/"
          cp "$root/replay/batch-summary.txt" "$root/evidence/"
          test "$rc" -eq 0 # Never treat failed compiler subprocesses as a green shard
      - name: Export exact per-TU timing, slowest objects and status
        if: always() && !contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE/build/all3352-wall/evidence" python3 - <<'PY'
          import json,os,re
          from collections import Counter
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          if not (root/"batch-results.json").is_file():
              print("ALL3352_SHARD_FAILED before MiniC replay")
              raise SystemExit(1)
          rows=json.loads((root/"batch-results.json").read_text())
          off=int(os.environ["OFFSET"]); n=int(os.environ["COUNT"])
          assert len(rows)==n
          assert sorted(int(r["index"]) for r in rows)==list(range(off,off+n))
          cnt=Counter(x["status"] for x in rows)
          m=re.search(r"^replay_seconds=([0-9.]+)$",(root/"batch-summary.txt").read_text(),re.M)
          assert m is not None
          result={"offset":off,"count":n,"pass":cnt["PASS"],"fail":cnt["FAIL"],
                  "missing":cnt["PREPROCESS_MISSING"],"compile_sum_s":sum(float(r["seconds"]) for r in rows),
                  "four_worker_replay_s":float(m.group(1))}
          (root/"shard.json").write_text(json.dumps(result,indent=2))
          print("ALL3352_SHARD_RESULT "+json.dumps(result,sort_keys=True))
          for row in rows:
              if row["status"] != "PASS":
                  print("ALL3352_FAILED_TU "+json.dumps(row,sort_keys=True))
          for row in sorted(rows,key=lambda x:float(x["seconds"]),reverse=True)[:10]:
              print(f"ALL3352_SLOW index={row['index']} input={row['input']} seconds={row['seconds']:.3f} status={row['status']}")
          PY
      - name: Upload shard evidence only
        if: always() && !contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]')
        uses: actions/upload-artifact@v4
        with:
          name: all3352-constant-p-shard-${{ matrix.label }}
          path: build/all3352-wall/evidence/
          retention-days: 14
  aggregate:
    needs: shard
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'all3352' || inputs.mode == 'all')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[linux-perf3352]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500-aggregate-only]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-dispatch-audit-selftest]') || contains(github.event.head_commit.message, '[minic-bootstrap-native-asm-census]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064-receipt]'))))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-dispatch-audit-selftest]')
      - name: Validate Stage2/Stage4 Linux Kbuild dispatch audit without real compiler rebuild
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-dispatch-audit-selftest]')
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/ci/minic-bootstrap-stage2-2064-shard-audit-v1.py
          python3 tools/ci/minic-bootstrap-stage2-2064-shard-audit-v1.py --self-test
      # Reuse the existing aggregate runner as a pure read-only source of
      # generated-code evidence. Never rebuild the 77 sources or 2064 Linux C
      # objects here, and never alter the fixedpoint/production compiler.
      - uses: actions/checkout@v4
        if: contains(github.event.head_commit.message, '[minic-bootstrap-native-asm-census]')
      - name: Restore immutable green native Stage4 compiler and all 77 assembly inputs
        if: contains(github.event.head_commit.message, '[minic-bootstrap-native-asm-census]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39058935623
          name: minic-current-bootstrap-stage2-native-runtime-v1
          github-token: ${{ github.token }}
          path: build/bootstrap-stage2-native/asm-census-seed
      - name: Quantify Stage4 generated instruction and register-spill overhead
        if: contains(github.event.head_commit.message, '[minic-bootstrap-native-asm-census]')
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/ci/minic-native-asm-instruction-census-v1.py
          python3 tools/ci/minic-native-asm-instruction-census-v1.py \
            --artifact-dir build/bootstrap-stage2-native/asm-census-seed \
            --output build/bootstrap-stage2-native/asm-census-results.json \
            | tee build/bootstrap-stage2-native/asm-census-verdict.txt
          grep -Fq 'MINIC_NATIVE_ASM_CENSUS=PASS sources=77' build/bootstrap-stage2-native/asm-census-verdict.txt
      - name: Preserve exact certified Stage4 assembly efficiency census
        if: always() && contains(github.event.head_commit.message, '[minic-bootstrap-native-asm-census]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-bootstrap-stage4-asm-instruction-census
          path: |
            build/bootstrap-stage2-native/asm-census-results.json
            build/bootstrap-stage2-native/asm-census-verdict.txt
          if-no-files-found: error
          retention-days: 14

      # Re-certify the immutable Stage4 Linux 2064 + QEMU P1 run using the
      # existing aggregate job: no Linux recompiles and no guest QEMU reboot.
      # Seven producer artifacts, receiver Image and Stage4 binary are all
      # checked against their prior SHA manifests; original CI #39063287653
      # ran P1 successfully but its extra postcheck counted a # comment as TU.
      - uses: actions/checkout@v4
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064-receipt]')
      - name: Restore seven prior native Stage4 Kbuild producer object pools
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064-receipt]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39063287653
          github-token: ${{ github.token }}
          pattern: shard-*
          path: stage4-2064-evidence/producers
      - name: Restore prior full Linux Image and QEMU P1 receiver evidence
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064-receipt]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39063287653
          github-token: ${{ github.token }}
          name: sharded-gnu-minic-QEMU-dc8aefdd6d058e4564e997bc749bdd8fc2f53aff
          path: stage4-2064-evidence/receiver
      - name: Restore nine-tool Stage4 native compiler SHA provenance
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064-receipt]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39058935623
          github-token: ${{ github.token }}
          name: minic-current-bootstrap-stage2-native-runtime-v1
          path: stage4-2064-evidence/native
      - name: Verify 2064 unique actual Stage4 objects, guest traces and QEMU P1
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064-receipt]')
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/ci/minic-bootstrap-stage4-2064-receipt-v1.py
          python3 tools/ci/minic-bootstrap-stage4-2064-receipt-v1.py \
            --receiver stage4-2064-evidence/receiver \
            --producers stage4-2064-evidence/producers \
            --native stage4-2064-evidence/native \
            --output stage4-2064-evidence/receipt.json \
            | tee stage4-2064-evidence/verdict.txt
          grep -Fq 'BOOTSTRAP_STAGE4_LINUX2064=PASS' stage4-2064-evidence/verdict.txt
      - name: Preserve verified Stage4 2064 full Linux QEMU acceptance receipt
        if: always() && contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064-receipt]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-bootstrap-stage4-linux2064-certified-final
          path: |
            stage4-2064-evidence/receipt.json
            stage4-2064-evidence/verdict.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Retrieve seven Stage2 first500 Linux object manifests
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')
        uses: actions/download-artifact@v4
        with:
          pattern: minic-bootstrap-stage2-linux500-*
          path: stage2-first500-shards

      - name: Certify unique 500/500 Stage2 Linux .s and .o across seven runners
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.shard.result }}" = success
          python3 tools/ci/minic-bootstrap-stage2-linux500-aggregate-v1.py \
            stage2-first500-shards bootstrap-stage2-linux500-final.json \
            | tee bootstrap-stage2-linux500-final.txt
          grep -Fq 'BOOTSTRAP_STAGE2_LINUX500=PASS owners=500/500' bootstrap-stage2-linux500-final.txt

      - name: Preserve full 500-object Stage2 Linux aggregate
        if: always() && contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux500]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-bootstrap-stage2-linux500-final
          path: |
            bootstrap-stage2-linux500-final.json
            bootstrap-stage2-linux500-final.txt
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/checkout@v4
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500-aggregate-only]')
      - name: Restore seven Stage4 Linux500 verified object manifests
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500-aggregate-only]')
        uses: actions/download-artifact@v4
        with:
          pattern: minic-bootstrap-stage4-linux500-*
          path: stage4-first500-shards
      - name: Restore immutable seven Stage4 shard artifacts without recompilation
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500-aggregate-only]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39062218853
          github-token: ${{ github.token }}
          pattern: minic-bootstrap-stage4-linux500-*
          path: stage4-first500-shards
      - name: Independently aggregate 500 unique Stage4 vs Stage0 Linux objects
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500-aggregate-only]')
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux500-aggregate-only]') }}" == true ]]; then
            test "${{ needs.shard.result }}" = skipped
          else
            test "${{ needs.shard.result }}" = success
          fi
          python3 tools/ci/minic-bootstrap-stage2-linux500-aggregate-v1.py \
            stage4-first500-shards bootstrap-stage4-linux500-final.json --stage4 \
            | tee bootstrap-stage4-linux500-final.txt
