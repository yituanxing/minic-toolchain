          elif [[ "${{ contains(github.event.head_commit.message, '[minic-bootstrap-musl-as-portability]') }}" == true ]]; then
            grep -Fq 'FULL_NATIVE_PROBE=PASS source_tus=1' "$work/verdict.log"
          elif [[ "${{ contains(github.event.head_commit.message, '[minic-bootstrap-full-native-probe]') }}" == true ]]; then
            grep -Fq 'FULL_NATIVE_PROBE=PASS source_tus=4' "$work/verdict.log"
