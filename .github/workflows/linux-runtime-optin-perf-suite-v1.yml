            }
          echo "MINIC_TYPE_LAYOUT_CONTRACT=PASS original=$before_type optimized=$after_type"
          if [[ "${{ contains(github.event.head_commit.message, '[minic-type-layout-ab500]') && '1' || '0' }}" == 1 ]]; then
            ln -s "$root/$trial-before" "$root/baseline-toolchain"
            ln -s "$root/$trial-after" "$root/toolchain"
            echo "MINIC_TYPE_LAYOUT_FIRST500_READY=PASS original_type=$before_type packed_type=$after_type"
            exit 0
          fi
          python3 - "$corpus" "$root" "$trial" <<'PY'
          from pathlib import Path
          import sys
          corpus,root=map(Path,sys.argv[1:3]);trial=sys.argv[3]
          selected={}
          for row in (corpus/"selected-tus.txt").read_text().splitlines():
              parts=row.split("\t",3)
              if len(parts)!=4: raise SystemExit("bad selected-tus row")
              selected[parts[1]]=parts[2]
