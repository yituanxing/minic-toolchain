name: PR137 Materialize Static Nested Record Designator
on:
  push:
    branches: [agent/static-nested-record-designator-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize nested static record designators
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr137-materialize.py
          chmod +x tests/compiler/c0/run-static-nested-record-designator.sh
          clang-format-18 -i \
            src/frontend/parser_global.c \
            tests/programs/c0/static_nested_record_designator.c \
            tests/compiler/c0/invalid_static_nested_record_designator_backward.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr137-focused" \
            sh tests/compiler/c0/run-static-nested-record-designator.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr137-materialize.py \
            .github/workflows/pr137-materialize-static-nested-designator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): support nested static record designators'
          git push origin HEAD:agent/static-nested-record-designator-v0
