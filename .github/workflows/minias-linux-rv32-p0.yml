name: MiniAS RV32 GNU Linux 6.6.143 real QEMU P0

on:
  workflow_dispatch:
  push:
    branches: [refactor/minias-target-isa-abi-core]
    paths:
      - '.github/workflows/minias-linux-rv32-p0.yml'
      - 'tests/external/linux/minias_rv32_linux.sh'
      - 'tools/ci/linux-rv32i-qemu-p0-v1.sh'
      - 'tests/external/linux/minias_as_provenance_check.py'

permissions:
  contents: read

jobs:
  rv32-mini-as-only-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install GNU cross Kbuild, RV32 QEMU, firmware and DTB tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils cpio gzip \
            qemu-system-misc opensbi device-tree-compiler
          command -v qemu-system-riscv32
          test -s /usr/lib/riscv32-linux-gnu/opensbi/generic/fw_dynamic.bin
      - name: Build exact-head MiniAS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          make -j4 MODE=release CFLAGS=-Werror build/release/bin/minic-as
      - name: GNU original RV32 Image control, MiniAS-only Kbuild and actual QEMU P0
        shell: bash
        timeout-minutes: 105
        env:
          MINIAS: ${{ github.workspace }}/build/release/bin/minic-as
          WORK_DIR: ${{ github.workspace }}/build/minias-linux-rv32
          LINUX_VERSION: 6.6.143
        run: bash tests/external/linux/minias_rv32_linux.sh
      - name: Preserve original GNU baseline, MiniAS traces, Kconfig and guest proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minias-linux-rv32-p0-${{ github.sha }}
          path: |
            build/minias-linux-rv32/evidence/**
            build/minias-linux-rv32/minias-as.trace
            build/minias-linux-rv32/failure-inputs/*.s
            build/minias-linux-rv32/failure-inputs/*.replay.txt
            build/minias-linux-rv32/qemu-gnu/*.log
            build/minias-linux-rv32/qemu-gnu/provenance.txt
            build/minias-linux-rv32/qemu-minias/*.log
            build/minias-linux-rv32/qemu-minias/provenance.txt
            build/minias-linux-rv32/qemu-gnu/initramfs.cpio.gz
            build/minias-linux-rv32/qemu-minias/initramfs.cpio.gz
            build/minias-linux-rv32/mini-out/**/.*.cmd
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
