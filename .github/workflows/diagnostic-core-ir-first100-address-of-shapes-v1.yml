name: Diagnostic Core IR First100 Address Of Shapes V1

on:
  push:
    branches:
      - diagnostic/core-ir-first100-address-of-shapes-v1

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install Linux Kbuild dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Instrument address-of operand shapes
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/core_lower.c')
          s = p.read_text()
          old = '#include <stdlib.h>\n#include <string.h>\n'
          assert s.count(old) == 1
          s = s.replace(old, '#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n', 1)
          old = '''    return MINIC_CORE_LOWER_UNSUPPORTED;
          }

          static MinicCoreLowerStatus lower_assignment_pair'''
          new = '''    if (expression->kind == MINIC_EXPRESSION_ADDRESS_OF) {
                  const MinicExpression *operand;
                  const char *type_class;

                  operand = minic_c0_program_expression(context->body->program,
                                                        expression->value.unary.operand);
                  if (operand == NULL) {
                      return MINIC_CORE_LOWER_ERROR;
                  }
                  type_class = minic_type_is_pointer(operand->type)
                                   ? "ptr"
                                   : (minic_type_is_integer(operand->type)
                                          ? "int"
                                          : (minic_type_is_record(operand->type)
                                                 ? "record"
                                                 : (minic_type_is_array(operand->type)
                                                        ? "array"
                                                        : (minic_type_is_function(operand->type)
                                                               ? "function"
                                                               : "other"))));
                  (void)fprintf(stderr,
                                "MINIC_CORE_ADDRESS_SHAPE operand_kind=%d category=%d type=%s\\n",
                                (int)operand->kind,
                                (int)operand->value_category,
                                type_class);
              }
              return MINIC_CORE_LOWER_UNSUPPORTED;
          }

          static MinicCoreLowerStatus lower_assignment_pair'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build diagnostic compiler
        run: make -j4 MODE=release BUILD_DIR=build/core-address-shapes-compiler

      - name: Drive fixed first100 with Core shadow
        continue-on-error: true
        env:
          MINIC_CORE_IR: shadow
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-address-shapes-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-address-shapes-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh

      - name: Aggregate address-of shapes
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          expression_names = [
              'INTEGER','FLOATING','LOCAL','GLOBAL_OBJECT','FIXED_REGISTER','FUNCTION',
              'LABEL_ADDRESS','CALL_FRAME_ADDRESS','BUILTIN_UNREACHABLE','SIZEOF','OFFSETOF',
              'ADDRESS_OF','DEREFERENCE','CAST','BITCAST','CONVERSION','DISCARD','SUBSCRIPT',
              'MEMBER','LVALUE_READ','ASSIGNMENT','COMPOUND_ASSIGNMENT','UNARY','BINARY',
              'CONDITIONAL','CALL','COMPOUND_LITERAL','STATEMENT','BUILTIN_UNARY','BUILTIN_OVERFLOW'
          ]
          category_names = ['LVALUE','RVALUE']
          pat = re.compile(r'^MINIC_CORE_ADDRESS_SHAPE operand_kind=(-?\d+) category=(-?\d+) type=(\S+)$')
          counts = Counter()
          root = Path('build/core-address-shapes-linux/minic-stderr')
          for path in root.rglob('*.stderr') if root.is_dir() else []:
              for line in path.read_text(errors='replace').splitlines():
                  m = pat.match(line.strip())
                  if not m:
                      continue
                  raw_kind, raw_category, type_class = m.groups()
                  kind = int(raw_kind)
                  category = int(raw_category)
                  kname = expression_names[kind] if 0 <= kind < len(expression_names) else f'EXPR_{kind}'
                  cname = category_names[category] if 0 <= category < len(category_names) else f'CAT_{category}'
                  counts[(kname, cname, type_class)] += 1
          total = sum(counts.values())
          lines = ['MINIC_CORE_FIRST100_ADDRESS_OF_SHAPES', f'total_address_of={total}']
          for (kind, category, type_class), count in counts.most_common():
              pct = 100.0 * count / total if total else 0.0
              lines.append(f'operand={kind} category={category} type={type_class} count={count} pct={pct:.2f}')
          text = '\n'.join(lines) + '\n'
          out = Path('build/core-address-shapes-linux/core-address-of-shapes.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text)
          print(text, end='')
          PY
          test -s build/core-address-shapes-linux/batch-summary.txt && cat build/core-address-shapes-linux/batch-summary.txt || true

      - name: Upload address-of evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ir-first100-address-of-shapes-${{ github.run_id }}
          path: |
            build/core-address-shapes-linux/core-address-of-shapes.txt
            build/core-address-shapes-linux/batch-summary.txt
          if-no-files-found: ignore
          retention-days: 7
