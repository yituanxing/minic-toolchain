name: MiniPP Linux Cached Focus V1

concurrency:
  group: minipp-linux-focus-v1-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/ci-runtime-cleanup-v1"
    paths:
      - 'preprocessor/**'
      - 'tools/minic-cpp/**'
      - 'tests/preprocessor/**'
      - '.github/workflows/minipp-linux-focus-v1.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  MINIPP_LINUX_ARCHIVE_SHA256: dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

jobs:
  cached-focus:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minipp-focus]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: second500
            range: 500-999
            build_id: focus500b
            cache_path: build/minipp-linux-ref500b-corpus
            cache_key: minipp-linux-ref500b-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-202aaedea66c38df0c121ec50b8862335f8f0f0fac11d96e5167f76280cf1fc0-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-a4ddb411938926d3e95625a210030a14317e4bc20b881416269e4698576a8e8e
            indices: tests/preprocessor/linux-second500-focus-indices.txt
            jobs: 7
            replay_label: focus7-500-999
            artifact: minipp-linux-focus-500-999
          - id: third500
            range: 1000-1499
            build_id: focus500c
            cache_path: build/minipp-linux-ref500c-corpus
            cache_key: minipp-linux-ref500c-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-b3487f3cf001d085a4a5ba55124fa0ec2c3929ab162bc780a5848ddd3934cbf7-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-a4ddb411938926d3e95625a210030a14317e4bc20b881416269e4698576a8e8e
            indices: tests/preprocessor/linux-third500-focus-indices.txt
            jobs: 4
            replay_label: focus4-500-999
            artifact: minipp-linux-focus-1000-1499
          - id: fourth500
            range: 1500-1999
            build_id: focus500d
            cache_path: build/minipp-linux-ref500d-corpus
            cache_key: minipp-linux-ref500d-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-ed1b980a38c94e9fa9423fd7d1caf990edd3e32700d843bd2bf59efb3bf53781-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-102f50b8cf781eb2c6def994961ae9b082aefc09b8660776e56ae748c34a8839
            indices: tests/preprocessor/linux-fourth500-focus-indices.txt
            jobs: 4
            replay_label: focus4-1500-1999
            artifact: minipp-linux-focus-1500-1999
          - id: mega1000
            range: 2000-2999
            build_id: focus1000e
            cache_path: build/minipp-linux-ref1000e-corpus
            cache_key: minipp-linux-ref1000e-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-be2cea1f0b44afa0cc8ea7087ef0d2fa910c799333064e2d695d15e63ccba773-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-102f50b8cf781eb2c6def994961ae9b082aefc09b8660776e56ae748c34a8839
            indices: tests/preprocessor/linux-mega1000-focus-indices.txt
            jobs: 8
            replay_label: focusmega-2000-2999
            artifact: minipp-linux-focus-2000-2999
          - id: final352
            range: 3000-3351
            build_id: focus352f
            cache_path: build/minipp-linux-ref352f-corpus
            cache_key: minipp-linux-ref352f-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-8c205c3e5a1662b0d3c07bc8495eef7384681ff698a23ef9b3a3147df17cfb4b-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-102f50b8cf781eb2c6def994961ae9b082aefc09b8660776e56ae748c34a8839
            indices: tests/preprocessor/linux-final352-focus-indices.txt
            jobs: 8
            replay_label: focusfinal-3000-3351
            artifact: minipp-linux-focus-3000-3351
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install focused replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross make curl xz-utils

      - name: Build independent MiniPP
        shell: bash
        run: |
          set -Eeuo pipefail
          build="build/minipp-linux-${{ matrix.build_id }}"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" all
          test -x "$build/bin/minic-cpp"

      - name: Prepare immutable Linux source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-${{ matrix.build_id }}-work"
          archive="$work/linux-6.6.143.tar.xz"
          mkdir -p "$work"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz \
            -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"

      - name: Restore frozen GCC corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.cache_path }}
          key: ${{ matrix.cache_key }}
          fail-on-cache-miss: true

      - name: Replay focused cached pool
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-${{ matrix.build_id }}-work"
          corpus="$GITHUB_WORKSPACE/${{ matrix.cache_path }}"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$corpus/contract.jsonl" \
            --corpus "$corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-${{ matrix.build_id }}/bin/minic-cpp" \
            --work "$work/replay" \
            --indices "$GITHUB_WORKSPACE/${{ matrix.indices }}" \
            --jobs ${{ matrix.jobs }} \
            --label "${{ matrix.replay_label }}"
          echo "MINIPP_CACHED_FOCUS_V1=PASS range=${{ matrix.range }} id=${{ matrix.id }}"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/minipp-linux-${{ matrix.build_id }}-work/replay/headline.txt
            build/minipp-linux-${{ matrix.build_id }}-work/replay/results.tsv
            build/minipp-linux-${{ matrix.build_id }}-work/replay/results.json
            build/minipp-linux-${{ matrix.build_id }}-work/replay/failure-pool.tsv
            build/minipp-linux-${{ matrix.build_id }}-work/replay/diff/**
            build/minipp-linux-${{ matrix.build_id }}-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3
