name: Chained Record Designator Productizer

on:
  push:
    branches:
      - frontend/chained-record-designator-v1

permissions:
  contents: write

concurrency:
  group: chained-record-designator-productizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  productize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout capability branch
        uses: actions/checkout@v4
        with:
          ref: frontend/chained-record-designator-v1
          fetch-depth: 0

      - name: Materialize coherent frontend capability
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-chained-record-designator-v1.py

      - name: Build release compiler with warnings as errors
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/chained-record-designator

      - name: Run focused record initializer gate
        run: |
          MINIC="$GITHUB_WORKSPACE/build/chained-record-designator/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/chained-record-designator-focused" \
            sh tests/compiler/c0/run-record-local-initializers.sh

      - name: Run fast regression gate
        run: make -j4 BUILD_DIR=build/chained-record-designator-fast check-fast

      - name: Commit materialized product
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- src/frontend/parser_statement.c; then
            printf '%s\n' 'Product source already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c
          git commit -m 'frontend: support chained runtime record designators'
          git push origin HEAD:frontend/chained-record-designator-v1
