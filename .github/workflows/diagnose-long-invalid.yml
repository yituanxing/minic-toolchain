name: Diagnose long invalid cases

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-long-invalid.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
      - name: Apply pending long slice
        shell: bash
        run: |
          awk '
            /python3 - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-long-type-slice.yml > /tmp/apply.py
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/frontend/ast_verifier.c')
          text = p.read_text()
          pattern = re.compile(r'\(type\.integer_rank == MINIC_INTEGER_RANK_CHAR \|\|\s*type\.integer_rank == MINIC_INTEGER_RANK_INT\);')
          text, count = pattern.subn('(type.integer_rank == MINIC_INTEGER_RANK_CHAR ||\n                type.integer_rank == MINIC_INTEGER_RANK_INT ||\n                type.integer_rank == MINIC_INTEGER_RANK_LONG);', text, count=1)
          if count != 1:
              raise SystemExit(count)
          p.write_text(text)
          PY
          make -j2
      - name: Print exact invalid diagnostics
        shell: bash
        run: |
          set +e
          root=$PWD
          work=$PWD/build/diagnose-long
          mkdir -p "$work"
          for name in invalid_long_long invalid_signed_unsigned invalid_long_char; do
            cc -E -P -x c "tests/compiler/c0/$name.c" -o "$work/$name.i"
            build/debug/bin/minic -S "$work/$name.i" -o "$work/$name.s" \
              >"$work/$name.stdout" 2>"$work/$name.stderr"
            status=$?
            printf '%s\n' "CASE=$name STATUS=$status"
            cat "$work/$name.stderr"
          done
          exit 1
