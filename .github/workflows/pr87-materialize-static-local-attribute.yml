name: PR87 Materialize Static Local Attribute

on:
  push:
    branches:
      - agent/static-local-interleaved-attribute-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/static-local-interleaved-attribute-v0
          fetch-depth: 0

      - name: Materialize static-local attribute placement
        shell: bash
        run: |
          set -Eeuo pipefail
          python tools/dev/pr87-materialize-static-local-attribute.py
          chmod +x tests/compiler/c0/run-gnu-static-local-interleaved-attribute.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check

      - name: Build and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-gnu-static-local-interleaved-attribute.sh
          make check

      - name: Commit product source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr87-materialize-static-local-attribute.py
          rm -f .github/workflows/pr87-materialize-static-local-attribute.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: accept informational static-local object attributes'
          git push origin HEAD:agent/static-local-interleaved-attribute-v0
