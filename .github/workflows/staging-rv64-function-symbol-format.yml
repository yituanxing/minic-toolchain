name: Staging RV64 Function Symbol Format

on:
  push:
    branches:
      - staging/rv64-function-symbol-contract-v0

permissions:
  contents: write

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical clang-format
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff -- src/target/riscv64/core_codegen.c \
            src/target/riscv64/core_codegen.h \
            src/target/riscv64/function_symbol.h \
            tests/target/riscv64/core_frontend_emitter_test.c
          if git diff --quiet -- include src tools/minic; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/target/riscv64/core_codegen.c \
            src/target/riscv64/core_codegen.h \
            src/target/riscv64/function_symbol.h \
            tests/target/riscv64/core_frontend_emitter_test.c
          git commit -m "style(target): apply canonical RV64 symbol formatting"
          git push origin HEAD:staging/rv64-function-symbol-contract-v0
