name: Materialize Runtime Record Zero V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-zero-v1.py
          clang-format-18 -i src/frontend/parser_statement.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/runtime-record-zero
      - name: Focused aggregate zero semantics
        run: |
          set -Eeuo pipefail
          cat > /tmp/runtime-record-zero.c <<'EOF'
          struct inner { long x; int y[2]; };
          struct outer { struct inner nested; void *ptr; unsigned long tail; };
          int f(void) {
              struct outer a = { 0 };
              struct outer b = { 0U, };
              return (int)(a.nested.x + a.nested.y[0] + a.nested.y[1] +
                           (a.ptr != 0) + a.tail + b.nested.x + (b.ptr != 0));
          }
          EOF
          build/runtime-record-zero/bin/minic -S /tmp/runtime-record-zero.c -o /tmp/runtime-record-zero.s
          test -s /tmp/runtime-record-zero.s
          printf '%s\n' 'PASS runtime-record aggregate-zero nested-record+array+pointer trailing-comma'
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Probe unchanged suspend.i
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/runtime-record-zero/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/runtime-record-zero-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=39 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          cat build/runtime-record-zero-linux/batch-summary.txt
      - name: Probe fixed Linux first100
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/runtime-record-zero/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/runtime-record-zero-first100" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/runtime-record-zero-first100/batch-summary.txt
          test "$status" -eq 1 || test "$status" -eq 0
      - name: Commit product only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-runtime-record-zero-v1.py .github/workflows/materialize-runtime-record-zero-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c tools/dev/materialize-runtime-record-zero-v1.py .github/workflows/materialize-runtime-record-zero-v1.yml
          git diff --cached --check
          git commit -m 'frontend: recognize runtime aggregate zero initializers'
          git push origin HEAD:staging/string-octal-v1
