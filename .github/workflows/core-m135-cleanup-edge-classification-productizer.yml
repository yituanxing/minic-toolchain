name: Core M135 Cleanup Edge Classification Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M135
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M135 cleanup edge classification
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m135-cleanup-edge-classification.py
          git diff --check
          grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c
          test -s tests/compiler/c0/m135_cleanup_metadata_nonedge.c
          test -s tests/compiler/c0/m135_cleanup_break_edge.c
          test -s tests/compiler/c0/m135_cleanup_goto_edge.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m135-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m135-product-check

      - name: Run isolated M135 strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m135-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m135-product-regression"
          mkdir -p "$work"

          cc -E -P -std=gnu11 -x c tests/compiler/c0/m135_cleanup_metadata_nonedge.c -o "$work/nonedge.i"
          CORE_FAST_TRACE=1 MINIC_CORE_IR=strict "$compiler" -S "$work/nonedge.i" -o "$work/nonedge.s" \
            >"$work/nonedge.stdout" 2>"$work/nonedge.stderr"
          grep -F 'cleanup_record_assignment:' "$work/nonedge.s" >/dev/null
          grep -F 'cleanup_scope_label:' "$work/nonedge.s" >/dev/null
          if grep -Fq 'reason=cleanup-context' "$work/nonedge.stderr"; then
            echo 'ordinary cleanup metadata was still treated as an executable edge' >&2
            cat "$work/nonedge.stderr" >&2
            exit 1
          fi

          for kind in break goto; do
            cc -E -P -std=gnu11 -x c "tests/compiler/c0/m135_cleanup_${kind}_edge.c" -o "$work/${kind}.i"
            set +e
            CORE_FAST_TRACE=1 MINIC_CORE_IR=strict "$compiler" -S "$work/${kind}.i" -o "$work/${kind}.s" \
              >"$work/${kind}.stdout" 2>"$work/${kind}.stderr"
            rc=$?
            set -e
            test "$rc" -ne 0
            grep -F 'reason=cleanup-context' "$work/${kind}.stderr" >/dev/null
          done
          printf '%s\n' 'CORE_M135_STRICT_REGRESSION nonedge=PASS break=FAIL-CLOSED goto=FAIL-CLOSED'

      - name: Replay M135 focused frontier
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m135-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m135-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '95,98'
          replay_status=$?
          set -e
          printf 'CORE_M135_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 10 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m135-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 2 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M135 focused ERROR/missing: {summary}')
          if summary['pass'] < 1:
              raise SystemExit(f'M135 cleanup owner produced no focused PASS: {summary}')
          for row in rows:
              print(f"CORE_M135_INDEX_{row['index']} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
          print(f"CORE_M135_PRODUCT_FOCUSED selected=2 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m135-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m135-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M135_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m135-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M135 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 487:
              raise SystemExit(f"M135 produced no strict500 gain: pass={summary['pass']} baseline=487")
          print(f"CORE_M135_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M135 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
            tests/compiler/c0/m135_cleanup_metadata_nonedge.c \
            tests/compiler/c0/m135_cleanup_break_edge.c \
            tests/compiler/c0/m135_cleanup_goto_edge.c
          git diff --cached --quiet && { echo 'no M135 semantic changes'; exit 1; }
          git commit -m 'core: classify executable cleanup edges by control transfer'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M135 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m135-cleanup-edge-${{ github.sha }}
          path: |
            build/m135-product-regression/**
            build/m135-product-focused/**
            build/m135-product-full500/**
          if-no-files-found: warn
