name: Diagnostic Core Scalar Is Zero Coverage V1

on:
  push:
    branches:
      - diagnostic/core-scalar-is-zero-coverage-v1

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install Linux Kbuild dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Materialize scalar is-zero experiment and coverage markers
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, marker, replacement, label):
              count = text.count(marker)
              assert count == 1, f'{label}: expected one marker, found {count}'
              return text.replace(marker, replacement, 1)

          p = Path('src/core/core_ir.h')
          s = p.read_text()
          marker = "    MINIC_CORE_INSTRUCTION_PARAMETER,\n"
          insertion = "    MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO,\n"
          p.write_text(replace_once(s, marker, insertion + marker, 'core_ir.h enum'))

          p = Path('src/core/core_ir.c')
          s = p.read_text()
          verifier_marker = (
              "    case MINIC_CORE_INSTRUCTION_PARAMETER:\n"
              "        return instruction_result_is_valid(function, instruction) &&\n"
          )
          verifier_insertion = (
              "    case MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO:\n"
              "        return instruction_result_is_valid(function, instruction) &&\n"
              "               minic_type_equal(instruction->type, minic_type_int()) &&\n"
              "               instruction->value.operand < function->value_count &&\n"
              "               available_values[instruction->value.operand] &&\n"
              "               (minic_type_is_integer(function->values[instruction->value.operand].type) ||\n"
              "                minic_type_is_pointer(function->values[instruction->value.operand].type));\n"
          )
          s = replace_once(
              s,
              verifier_marker,
              verifier_insertion + verifier_marker,
              'core_ir.c verifier',
          )
          dump_marker = (
              "    case MINIC_CORE_INSTRUCTION_PARAMETER:\n"
              "        return fprintf(output,\n"
          )
          dump_insertion = (
              "    case MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO:\n"
              "        return fprintf(output,\n"
              "                       \"  %%%\" PRIu32 \" = scalar.is_zero %%%\" PRIu32 \"\\n\",\n"
              "                       instruction->result,\n"
              "                       instruction->value.operand) >= 0;\n"
          )
          p.write_text(
              replace_once(s, dump_marker, dump_insertion + dump_marker, 'core_ir.c dump')
          )

          p = Path('src/core/core_lower.c')
          s = p.read_text()
          call_marker = (
              "    if (expression->kind == MINIC_EXPRESSION_CALL) {\n"
              "        return lower_direct_call(context, expression, value_id);\n"
              "    }\n"
          )
          logical_not = (
              "    if (expression->kind == MINIC_EXPRESSION_UNARY &&\n"
              "        expression->value.unary.operator_kind == MINIC_UNARY_LOGICAL_NOT) {\n"
              "        MinicCoreValueId operand_value;\n"
              "        MinicCoreLowerStatus status;\n"
              "\n"
              "        if (!minic_type_equal(expression->type, minic_type_int())) {\n"
              "            return MINIC_CORE_LOWER_ERROR;\n"
              "        }\n"
              "        status = lower_expression(context, expression->value.unary.operand, &operand_value);\n"
              "        if (status != MINIC_CORE_LOWER_OK) {\n"
              "            return status;\n"
              "        }\n"
              "        if (operand_value >= context->function->value_count ||\n"
              "            !core_memory_scalar_type(context->function->values[operand_value].type)) {\n"
              "            return MINIC_CORE_LOWER_UNSUPPORTED;\n"
              "        }\n"
              "        {\n"
              "            MinicCoreInstruction instruction;\n"
              "\n"
              "            (void)memset(&instruction, 0, sizeof(instruction));\n"
              "            instruction.kind = MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO;\n"
              "            instruction.span = expression->span;\n"
              "            instruction.type = expression->type;\n"
              "            instruction.result = MINIC_CORE_VALUE_INVALID;\n"
              "            instruction.value.operand = operand_value;\n"
              "            return minic_core_function_append_value_instruction(\n"
              "                       context->function, context->block_id, &instruction, value_id)\n"
              "                       ? MINIC_CORE_LOWER_OK\n"
              "                       : MINIC_CORE_LOWER_ERROR;\n"
              "        }\n"
              "    }\n"
          )
          p.write_text(
              replace_once(s, call_marker, call_marker + logical_not, 'core_lower.c logical-not')
          )

          p = Path('src/compiler/compiler.c')
          s = p.read_text()
          marker = "        minic_core_function_destroy(&core);\n"
          coverage = (
              "        (void)fprintf(stderr,\n"
              "                      \"MINIC_CORE_COVERAGE status=%s function=%s\\n\",\n"
              "                      status == MINIC_CORE_LOWER_OK\n"
              "                          ? \"OK\"\n"
              "                          : (status == MINIC_CORE_LOWER_UNSUPPORTED ? \"UNSUPPORTED\" : \"ERROR\"),\n"
              "                      function->name != NULL ? function->name : \"<unnamed>\");\n"
          )
          p.write_text(replace_once(s, marker, coverage + marker, 'compiler.c coverage'))
          PY

      - name: Build diagnostic compiler
        run: make -j4 MODE=release BUILD_DIR=build/core-is-zero-compiler

      - name: Drive fixed first100 with Core shadow
        continue-on-error: true
        env:
          MINIC_CORE_IR: shadow
        run: |
          MINIC="$GITHUB_WORKSPACE/build/core-is-zero-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-is-zero-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh

      - name: Aggregate coverage
        if: always()
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          root = Path('build/core-is-zero-linux/minic-stderr')
          pat = re.compile(r'^MINIC_CORE_COVERAGE status=(OK|UNSUPPORTED|ERROR) function=(.*)$')
          counts = Counter()
          for path in root.rglob('*.stderr') if root.is_dir() else []:
              for line in path.read_text(errors='replace').splitlines():
                  match = pat.match(line.strip())
                  if match:
                      counts[match.group(1)] += 1
          total = sum(counts.values())
          pct = 100.0 * counts['OK'] / total if total else 0.0
          text = (
              'MINIC_CORE_SCALAR_IS_ZERO_COVERAGE\n'
              f'functions_observed={total}\n'
              f'core_ok={counts["OK"]}\n'
              f'core_unsupported={counts["UNSUPPORTED"]}\n'
              f'core_error={counts["ERROR"]}\n'
              f'function_coverage_percent={pct:.2f}\n'
          )
          out = Path('build/core-is-zero-linux/scalar-is-zero-coverage.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text)
          print(text, end='')
          PY
          test -s build/core-is-zero-linux/batch-summary.txt && cat build/core-is-zero-linux/batch-summary.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-scalar-is-zero-coverage-${{ github.run_id }}
          path: |
            build/core-is-zero-linux/scalar-is-zero-coverage.txt
            build/core-is-zero-linux/batch-summary.txt
          retention-days: 7
