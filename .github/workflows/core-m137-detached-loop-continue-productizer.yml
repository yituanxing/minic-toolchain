name: Core M137 Detached Loop Continue Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M137
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M137_DETACHED_LOOP_CONTINUE_OWNER' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M135 plus M137 semantic bundle
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m135-cleanup-edge-classification.py
          python3 tools/ci/apply-m137-detached-loop-continue-owner.py
          git diff --check
          grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c
          grep -Fq 'M137_DETACHED_LOOP_CONTINUE_OWNER' src/core/core_lower.c
          test -s tests/compiler/c0/m135_cleanup_non_edge.c
          test -s tests/compiler/c0/m137_detached_loop_continue.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m137-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m137-product-check

      - name: Run isolated M135 plus M137 strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m137-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m137-product-regression"
          mkdir -p "$work"

          cc -E -P -std=gnu11 -x c tests/compiler/c0/m135_cleanup_non_edge.c -o "$work/m135.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/m135.i" -o "$work/m135.s"

          cc -E -P -std=gnu11 -x c tests/compiler/c0/m137_detached_loop_continue.c -o "$work/m137.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/m137.i" -o "$work/m137.s"
          grep -F 'nested_while_continue:' "$work/m137.s" >/dev/null
          grep -F 'double_nested_continue:' "$work/m137.s" >/dev/null

          cc -E -P -std=gnu11 -x c tests/compiler/c0/m134_unreachable_nested_label.c -o "$work/m134-negative.i"
          set +e
          MINIC_CORE_IR=strict "$compiler" -S "$work/m134-negative.i" -o "$work/m134-negative.s" \
            >"$work/m134-negative.stdout" 2>"$work/m134-negative.stderr"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F 'Core IR shadow lowering failed for function' "$work/m134-negative.stderr" >/dev/null
          printf '%s\n' 'CORE_M137_STRICT_REGRESSION m135=PASS detached-loop=PASS external-reentry=FAIL-CLOSED'

      - name: Replay M137 focused frontier
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m137-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m137-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 2 \
            --indices '95,98'
          replay_status=$?
          set -e
          printf 'CORE_M137_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 10 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m137-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 2 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M137 focused ERROR/missing: {summary}')
          by_index={int(row['index']):row for row in rows}
          for index in (95,98):
              row=by_index[index]
              print(f"CORE_M137_INDEX_{index} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
          if summary['pass'] < 1:
              raise SystemExit(f'M137 detached-loop owner produced no focused PASS: {summary}')
          print(f"CORE_M137_PRODUCT_FOCUSED selected=2 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m137-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m137-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M137_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m137-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M137 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 487:
              raise SystemExit(f"M137 produced no strict500 gain: pass={summary['pass']} baseline=487")
          print(f"CORE_M137_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M135 plus M137 semantic bundle
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
            tests/compiler/c0/m135_cleanup_non_edge.c \
            tests/compiler/c0/m137_detached_loop_continue.c
          git diff --cached --quiet && { echo 'no M137 semantic changes'; exit 1; }
          git commit -m 'core: recover detached loop continue targets'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M137 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m137-detached-loop-continue-${{ github.sha }}
          path: |
            build/m137-product-regression/**
            build/m137-product-focused/**
            build/m137-product-full500/**
          if-no-files-found: warn
