name: PR138 Fast Frontier

on:
  push:
    branches:
      - probe/pr138-fast-frontier

permissions:
  actions: read
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch authoritative unchanged init main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/prior-frontier
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9165241854/zip > build/prior-frontier.zip
          unzip -q build/prior-frontier.zip -d build/prior-frontier
          test -s build/prior-frontier/kbuild/init/main.i
          test "$(wc -l < build/prior-frontier/kbuild/init/main.i | tr -d ' ')" = 90928
      - name: Build exact release compiler
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/fast-compiler CFLAGS=-Werror
      - name: Verify focused static aggregate semantics
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/fast-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/fast-focused" \
            sh tests/compiler/c0/run-static-aggregate-initializers.sh
      - name: Compile authoritative unchanged init main
        run: |
          set +e
          build/fast-compiler/bin/minic -S build/prior-frontier/kbuild/init/main.i \
            -o build/fast-main.s >build/fast-main.stdout 2>build/fast-main.stderr
          status=$?
          set -e
          cat build/fast-main.stderr
          printf 'compile_status=%s\n' "$status" > build/fast-frontier.txt
          if test -s build/fast-main.stderr; then
            frontier_line=$(sed -n 's/.*init\/main\.i:\([0-9][0-9]*\):.*/\1/p' build/fast-main.stderr | head -n 1)
            printf 'frontier_line=%s\n' "${frontier_line:-unknown}" >> build/fast-frontier.txt
            sed -n '1,30p' build/fast-main.stderr >> build/fast-frontier.txt
          else
            printf '%s\n' 'frontier_line=passed' >> build/fast-frontier.txt
          fi
          cat build/fast-frontier.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr138-fast-frontier-${{ github.run_id }}
          path: build/fast-frontier.txt
          retention-days: 7
