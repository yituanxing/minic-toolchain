name: PR88 Clean Array Parameter Source

on:
  push:
    branches:
      - agent/array-parameter-adjustment-v0

permissions:
  contents: write

jobs:
  clean-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/array-parameter-adjustment-v0
          fetch-depth: 0
      - name: Replace accidental NUL byte and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/frontend/parser_function.c')
          data = path.read_bytes()
          old = b"message[0] == '\x00'"
          new = b"message[0] == '\\0'"
          if data.count(old) != 1:
              raise SystemExit(f'expected exactly one NUL literal, found {data.count(old)}')
          path.write_bytes(data.replace(old, new, 1))
          PY
          if grep -nP '\x00' src/frontend/parser_function.c; then
            echo 'NUL byte remains in parser_function.c' >&2
            exit 1
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4 MODE=debug
          sh tests/compiler/c0/run-array-parameter-adjustment.sh
          make check
      - name: Commit clean product source
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/pr88-clean-null-literal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'cleanup: normalize array parameter diagnostic literal'
          git push origin HEAD:agent/array-parameter-adjustment-v0
