name: PR111 Materialize Pragma Pack
on:
  push:
    branches: [agent/pragma-pack-record-layout-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize pragma pack semantics
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr111-materialize.py
          chmod +x tests/compiler/c0/run-pragma-pack-record-layout.sh
          clang-format-18 -i \
            src/frontend/token.h \
            src/frontend/token.c \
            src/frontend/lexer.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_function.c \
            src/frontend/parser_record.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr111-focused" sh tests/compiler/c0/run-pragma-pack-record-layout.sh
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr111-line-markers" sh tests/compiler/c0/run-preprocessed-line-markers.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --exit-code --check
      - name: Commit product source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr111-materialize.py .github/workflows/pr111-materialize-pragma-pack.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): model pragma pack record layout'
          git push origin HEAD:agent/pragma-pack-record-layout-v0
