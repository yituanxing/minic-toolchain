name: Linux Runtime Notifier Owner V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-notifier-v0.yml"
      - "tools/ci/runtime-notifier-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-notifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notifier-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-notifier-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-notifier-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh current runtime owners and notifier
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-notifier-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-notifier-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"
            log="$2"
            base="${target%.o}"
            dir="${target%/*}"
            stem="${target##*/}"
            stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" \
              "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
            "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" \
            >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$out/$pi_base.minic-stage2.s" >/dev/null
          echo 'PI_OWNER_REFRESH=PASS local_string=lla'

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock-debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build-utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log

          cp "$out/kernel/notifier.o" "$ev/notifier.before.o"
          riscv64-linux-gnu-objdump -dr "$ev/notifier.before.o" >"$ev/notifier.before.objdump.txt"
          riscv64-linux-gnu-nm -an "$ev/notifier.before.o" >"$ev/notifier.before.nm.txt"

          refresh_obj kernel/notifier.o notifier-refresh.log
          test -s "$out/kernel/notifier.minic-stage2.s"
          cp "$out/kernel/notifier.minic-stage2.s" "$ev/notifier.minic-stage2.s"
          riscv64-linux-gnu-objdump -dr "$out/kernel/notifier.o" >"$ev/notifier.after.objdump.txt"
          riscv64-linux-gnu-nm -an "$out/kernel/notifier.o" >"$ev/notifier.after.nm.txt"

          python3 - <<'PY'
          import re
          from pathlib import Path
          ev=Path('build/linux-runtime-notifier-v0')
          for tag in ('before','after'):
              lines=(ev/f'notifier.{tag}.objdump.txt').read_text(errors='replace').splitlines()
              start=next((i for i,l in enumerate(lines) if '<notifier_call_chain>:' in l),None)
              print(f'NOTIFIER_{tag.upper()}_FOUND={int(start is not None)}')
              if start is None:
                  continue
              head=re.search(r'^\s*([0-9a-f]+)',lines[start])
              base=int(head.group(1),16)
              end=next((i for i in range(start+1,len(lines)) if re.match(r'^\s*[0-9a-f]+ <[^>]+>:$',lines[i]) and '<.L' not in lines[i]),min(len(lines),start+260))
              body=lines[start:end]
              text='\n'.join(body[:24])
              m=re.search(r'addi\s+sp,sp,-(\d+)', text)
              print(f'NOTIFIER_{tag.upper()}_BASE=0x{base:x}')
              print(f'NOTIFIER_{tag.upper()}_FRAME=' + (m.group(1) if m else 'complex_or_unknown'))
              target=base+0x16
              print(f'NOTIFIER_{tag.upper()}_TARGET=0x{target:x}')
              for l in body:
                  mm=re.match(r'^\s*([0-9a-f]+):',l)
                  if mm and abs(int(mm.group(1),16)-target) <= 24:
                      print(f'{tag.upper()} {l}')
              print(f'NOTIFIER_{tag.upper()}_PROLOGUE_BEGIN')
              print('\n'.join(body[:44]))
              print(f'NOTIFIER_{tag.upper()}_PROLOGUE_END')
          PY

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-notifier-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"

      - name: Execute QEMU current frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-notifier-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-init-irq-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          echo 'QEMU_INTERRUPTS_BEGIN'
          cat "$ev/watch/qemu.interrupts.txt" || true
          echo 'QEMU_INTERRUPTS_END'
          exit "$rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-notifier-v0-${{ github.sha }}
          path: |
            build/linux-runtime-notifier-v0/profile/patch.log
            build/linux-runtime-notifier-v0/*-refresh.log
            build/linux-runtime-notifier-v0/notifier.*
            build/linux-runtime-notifier-v0/watch/frontier-result.json
            build/linux-runtime-notifier-v0/watch/frontier-summary.txt
            build/linux-runtime-notifier-v0/watch/watch-result.json
            build/linux-runtime-notifier-v0/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
