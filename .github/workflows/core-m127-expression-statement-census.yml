name: Core M127 Expression Statement Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply read-only M127 census
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m127-expression-statement-census.py
          git diff --check
          grep -Fq 'CORE_M127_VOID_STMT_EXPR_ENTER' src/core/core_lower.c
          grep -Fq 'CORE_M127_VOID_STMT_EXPR_EXIT' src/core/core_lower.c

      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m127-census-compiler

      - name: Replay thirteen generic expression-statement blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m127-census-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m127-census"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '307,388,390,408,409,410,415,424,444,471,473,478,484'
          status=$?
          set -e
          printf 'CORE_M127_CENSUS_REPLAY_STATUS=%d\n' "$status"
          grep -RhE 'CORE_M127_VOID_STMT_EXPR_(ENTER|EXIT)|CORE_EXPR_STMT_DETAIL|CORE_FAST_TRACE stage=statement' "$work/minic-stderr" \
            | sort | tee "$work/m127-block-census.txt" || true
          python3 - <<'PY'
          import collections, json, re
          from pathlib import Path
          work = Path('build/m127-census')
          p = work / 'm127-block-census.txt'
          rows = p.read_text().splitlines() if p.exists() else []
          markers = collections.Counter()
          block_statuses = collections.Counter()
          for row in rows:
              if 'CORE_M127_VOID_STMT_EXPR_ENTER' in row:
                  markers['enter'] += 1
              elif 'CORE_M127_VOID_STMT_EXPR_EXIT' in row:
                  markers['exit'] += 1
                  m = re.search(r'block_status=(\d+)', row)
                  if m:
                      block_statuses[int(m.group(1))] += 1
              elif 'CORE_EXPR_STMT_DETAIL' in row:
                  markers['expr_detail'] += 1
              elif 'CORE_FAST_TRACE stage=statement' in row:
                  markers['statement_trace'] += 1
          print('CORE_M127_MARKER_CENSUS', dict(markers))
          print('CORE_M127_BLOCK_STATUS_CENSUS', dict(sorted(block_statuses.items())))
          print('CORE_M127_TRACE_ROWS', len(rows))
          if markers['enter'] == 0 or markers['exit'] == 0:
              raise SystemExit('M127 deep census produced no statement-expression enter/exit rows')

          results = json.loads((work / 'batch-results.json').read_text())
          if len(results) != 13:
              raise SystemExit(f'expected 13 replay rows, got {len(results)}')
          contexts = []
          corpus = Path('build/linux-focus-corpus/kbuild')
          for item in results:
              line = int(item['first_error_line'])
              src = corpus / item['input']
              lines = src.read_text(errors='replace').splitlines()
              lo = max(1, line - 4)
              hi = min(len(lines), line + 4)
              contexts.append(f"=== index={item['index']} input={item['input']} line={line} ===")
              for n in range(lo, hi + 1):
                  contexts.append(f'{n}: {lines[n-1]}')
          (work / 'm127-source-context.txt').write_text('\n'.join(contexts) + '\n')
          print((work / 'm127-source-context.txt').read_text())
          PY

      - name: Persist census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m127-expression-statement-census-${{ github.sha }}
          path: |
            build/m127-census/batch-results.json
            build/m127-census/m127-block-census.txt
            build/m127-census/m127-source-context.txt
            build/m127-census/minic-stderr/**
          if-no-files-found: warn
