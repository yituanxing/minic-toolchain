name: Core M127 Expression Statement Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply read-only M127 census
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m127-expression-statement-census.py
          git diff --check
          grep -Fq 'CORE_M127_VOID_STMT_EXPR_RESULT' src/core/core_lower.c

      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m127-census-compiler

      - name: Replay thirteen generic expression-statement blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m127-census-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m127-census"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '307,388,390,408,409,410,415,424,444,471,473,478,484'
          status=$?
          set -e
          printf 'CORE_M127_CENSUS_REPLAY_STATUS=%d\n' "$status"
          grep -Rh 'CORE_M127_VOID_STMT_EXPR_RESULT' "$work/minic-stderr" \
            | sort | tee "$work/m127-result-census.txt" || true
          python3 - <<'PY'
          import collections, re
          from pathlib import Path
          p = Path('build/m127-census/m127-result-census.txt')
          rows = p.read_text().splitlines() if p.exists() else []
          kinds = collections.Counter()
          statuses = collections.Counter()
          for row in rows:
              m = re.search(r'status=(\d+).*result_kind=(\d+)', row)
              if m:
                  statuses[int(m.group(1))] += 1
                  kinds[int(m.group(2))] += 1
          print('CORE_M127_RESULT_KIND_CENSUS', dict(sorted(kinds.items())))
          print('CORE_M127_RESULT_STATUS_CENSUS', dict(sorted(statuses.items())))
          print('CORE_M127_RESULT_ROWS', len(rows))
          if len(rows) != 13:
              raise SystemExit(f'expected 13 M127 rows, got {len(rows)}')
          PY

      - name: Persist census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m127-expression-statement-census-${{ github.sha }}
          path: |
            build/m127-census/batch-results.json
            build/m127-census/m127-result-census.txt
            build/m127-census/minic-stderr/**
          if-no-files-found: warn
