name: Agent Empty Record Initializer V1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0
      - name: Generate empty record initializer source
        run: python3 tools/dev/agent_empty_record_initializer_v1.py
      - name: Format generated source
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-empty-record-initializer
      - name: Run record compound literal focused contract
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-empty-record-initializer/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-empty-record-initializer-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-record-compound-literal.sh
      - name: Run Foundation focused contracts
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-empty-record-initializer/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-empty-record-initializer-foundation" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh
      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-empty-record-initializer check-fast
      - name: Publish generated source to scratch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c \
                  tests/compiler/c0/gnu_record_compound_literal.c \
                  tests/compiler/c0/run-gnu-record-compound-literal.sh
          git commit -m 'frontend: accept empty record initializers'
          git push --force origin HEAD:agent/empty-record-initializer-v1
