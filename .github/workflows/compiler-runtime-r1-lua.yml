name: Compiler Runtime R1 Lua

on:
  push:
    branches:
      - refactor/declaration-sema-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[runtime-r1-lua]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install host and RV64 toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user \
            curl ca-certificates make file

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/runtime-r1-lua-compiler

      - name: Compile official Lua 5.5.0 through MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          CORE_FAST_TRACE=1 \
          MINIC="$GITHUB_WORKSPACE/build/runtime-r1-lua-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/runtime-r1-lua" \
          HOST_CC=cc \
          TARGET_CC=riscv64-linux-gnu-gcc \
            sh tests/external/lua/probe.sh
          echo "RUNTIME_R1_LUA_COMPILE=PASS head=$GITHUB_SHA"

      - name: Link GCC and MiniC Lua RV64 executables
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/runtime-r1-lua"
          src="$work/lua-5.5.0"
          if test -d "$src/src"; then
            src="$src/src"
          fi

          sources="lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c lua.c"

          gcc_inputs=""
          asm_inputs=""
          for source in $sources; do
            base=${source%.c}
            gcc_inputs="$gcc_inputs $src/$source"
            asm_inputs="$asm_inputs $work/$base.s"
          done

          riscv64-linux-gnu-gcc -std=c99 -O2 -DLUA_USE_LINUX -I"$src" -static \
            $gcc_inputs -lm -ldl -o "$work/lua-gcc-rv64"
          riscv64-linux-gnu-gcc -static \
            $asm_inputs -lm -ldl -o "$work/lua-minic-rv64"

          file "$work/lua-gcc-rv64" "$work/lua-minic-rv64"
          echo "RUNTIME_R1_LUA_LINK=PASS head=$GITHUB_SHA"

      - name: Run Lua RV64 differential smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/runtime-r1-lua"

          cat >"$work/runtime-smoke.lua" <<'LUA'
          print(_VERSION)
          print("arith", 7 * 6, 1.5 + 2.25)
          local t = {alpha = 11, 2, 3, 5}
          print("table", t.alpha, #t, t[3])
          local function fib(n)
            if n < 2 then return n end
            return fib(n - 1) + fib(n - 2)
          end
          print("function", fib(10))
          print("string", string.upper("minic"), string.sub("runtime", 2, 5))
          local s = 0
          for i = 1, 100 do
            s = s + i
          end
          print("loop", s)
          collectgarbage("collect")
          print("gc", collectgarbage("count") > 0)
          print("args", #arg, arg[1], arg[2])
          LUA

          run_one() {
            name=$1
            exe=$2
            shift 2
            set +e
            qemu-riscv64 "$exe" "$@" >"$work/$name.stdout" 2>"$work/$name.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" >"$work/$name.status"
          }

          run_one gcc-version "$work/lua-gcc-rv64" -v
          run_one minic-version "$work/lua-minic-rv64" -v
          diff -u "$work/gcc-version.status" "$work/minic-version.status"
          diff -u "$work/gcc-version.stdout" "$work/minic-version.stdout"
          diff -u "$work/gcc-version.stderr" "$work/minic-version.stderr"

          run_one gcc-smoke "$work/lua-gcc-rv64" "$work/runtime-smoke.lua" alpha beta
          run_one minic-smoke "$work/lua-minic-rv64" "$work/runtime-smoke.lua" alpha beta
          diff -u "$work/gcc-smoke.status" "$work/minic-smoke.status"
          diff -u "$work/gcc-smoke.stdout" "$work/minic-smoke.stdout"
          diff -u "$work/gcc-smoke.stderr" "$work/minic-smoke.stderr"

          test "$(cat "$work/minic-smoke.status")" -eq 0
          grep -E '^function[[:space:]]+55$' "$work/minic-smoke.stdout" >/dev/null
          grep -E '^loop[[:space:]]+5050$' "$work/minic-smoke.stdout" >/dev/null
          grep -E '^string[[:space:]]+MINIC[[:space:]]+unti$' "$work/minic-smoke.stdout" >/dev/null
          echo "RUNTIME_R1_LUA_QEMU=PASS differential=gcc-vs-minic head=$GITHUB_SHA"

      - name: Preserve Lua blocker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-r1-lua-blocker
          path: |
            build/runtime-r1-lua/*.i
            build/runtime-r1-lua/*.s
            build/runtime-r1-lua/*.status
            build/runtime-r1-lua/*.stdout
            build/runtime-r1-lua/*.stderr
            build/runtime-r1-lua/runtime-smoke.lua
            build/runtime-r1-lua/lua-*-rv64
          if-no-files-found: ignore
          retention-days: 1
