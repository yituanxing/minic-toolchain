name: Staging Static Address Addend V1

on:
  push:
    branches: [staging/static-address-addend-v1]

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: "!contains(github.event.head_commit.message, '[publish-v1]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Apply product patch
        run: python3 tools/dev/staging-static-address-addend-v1.py
      - name: Canonical formatting
        run: |
          clang-format-18 -i \
            src/frontend/ast.h \
            src/frontend/ast_global.c \
            src/frontend/parser_global.c \
            src/frontend/ast_verifier.c \
            src/target/data_layout.h \
            src/target/data_layout.c \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/static_object_address_relocation.c
      - name: Release Werror build
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/staging-static-addend-v1
      - name: Focused static address relocation regression
        run: |
          MINIC="$GITHUB_WORKSPACE/build/staging-static-addend-v1/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-static-addend-v1-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-static-object-address-relocation.sh
      - name: Broad C0 suite
        run: make -j4 MODE=release BUILD_DIR=build/staging-static-addend-v1 check-fast
      - name: Foundation focused suite
        run: |
          MINIC="$GITHUB_WORKSPACE/build/staging-static-addend-v1/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-static-addend-v1-foundation" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-foundation-focused.sh
      - name: Publish validated product diff
        run: |
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add \
            src/frontend/ast.h \
            src/frontend/ast_global.c \
            src/frontend/parser_global.c \
            src/frontend/ast_verifier.c \
            src/target/data_layout.h \
            src/target/data_layout.c \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/static_object_address_relocation.c \
            tests/compiler/c0/run-static-object-address-relocation.sh
          git rm tests/compiler/c0/invalid_static_object_address_addend.c
          git diff --cached --check
          git commit -m 'frontend: support static symbol address addends [publish-v1]'
          git push origin HEAD:staging/static-address-addend-v1
