name: PR131 Format Cleanup
on:
  push:
    branches: [agent/unified-global-symbol-relocations-v0]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format and commit clean product
        run: |
          set -Eeuo pipefail
          clang-format-18 -i \
            src/frontend/ast_global.c \
            tests/compiler/c0/static_local_inferred_pointer_array.c
          rm -f .github/workflows/pr131-format-cleanup.yml
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(frontend): format inferred relocation lifecycle fix'
          git push origin HEAD:agent/unified-global-symbol-relocations-v0
