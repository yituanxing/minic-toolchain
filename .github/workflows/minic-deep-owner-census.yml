name: MiniC live ownership semantic census - temporary
on:
  push:
    branches: [cleanup/minic-semantic-deep-20261125]
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect complete test file and workflow caller graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess, json, collections, hashlib
          root=pathlib.Path(".")
          paths=[x.decode() for x in subprocess.check_output(["git","ls-files","-z"]).split(b"\0") if x]
          blob={}
          for p in paths:
              try:blob[p]=pathlib.Path(p).read_text(encoding="utf-8")
              except Exception:pass
          scripts={p:s for p,s in blob.items() if p.startswith("tests/") and p.endswith(".sh")}
          sources={p:s for p,s in blob.items() if p.startswith("tests/compiler/c0/") and p.endswith((".c",".i",".h"))}
          drivers={p:s for p,s in blob.items() if p.endswith((".sh",".py",".json",".yml",".yaml",".mk")) or p=="Makefile"}
          # Exclude audit itself, historical textual grep in workflows is not invocations
          drivers={p:s for p,s in drivers.items() if not p.endswith("minic-deep-owner-census.yml")}
          def tokens(n):
              return [w for w in re.split(r"[_\-.]+",n) if len(w)>=3 and w not in "run check probe test native linux strict original current source runtime compiler target x86 x86_64 riscv64 riscv32 loongarch64 aarch64 gnu gcc four five machine".split()]
          def best_siblings(p,top=3):
              b=set(tokens(pathlib.Path(p).stem))
              scored=[]
              for q,s in scripts.items():
                  if p==q:continue
                  k=set(tokens(pathlib.Path(q).stem))
                  sim=len(k&b)/len(k|b) if b|k else 0
                  if sim>.22:scored.append((round(sim,2),q))
              scored.sort(reverse=True)
              return scored[:top]
          def invocation_callers(p):
              stem=pathlib.Path(p).stem
              bn=pathlib.Path(p).name
              owners=[]
              for o,s in drivers.items():
                  if o==p:continue
                  # Full file name or stem is useful as a conservative approximate call graph.
                  if p in s or bn in s or stem in s:owners.append(o)
              return owners
          orphans=[p for p in scripts if not invocation_callers(p)]
          def prof(p):
              s=scripts[p]
              refs=sorted(set(re.findall(r"(?:tests/compiler/c0/|tests/target/)[\w./-]+\.(?:c|i|h|sh)",s)))
              named=re.findall(r"\b[A-Z][A-Z0-9_]+=(?:PASS|FAIL)\b|PASS[^\n]{0,75}",s)
              test=re.findall(r"(?m)^[ \t]*(?:if |test |grep |diff |cmp |readelf |objdump |nm |(?:\$\w+|\$\{[^}]+\}).*)",s)
              return {"path":p,"lines":len(s.splitlines()),"bytes":len(s.encode()),"sources":refs[:18],"assertions":len(test),"negative":bool(re.search(r"negative|invalid|bad_|reject|fail.closed|FAIL",s,re.I)),"cross":bool(re.search(r"qemu|riscv.*gcc|aarch64.*gcc|loongarch.*gcc",s,re.I)),"marker":named[-2:],"siblings":best_siblings(p,3)}
          kinds=collections.Counter()
          for p in orphans:
              n=pathlib.Path(p).name
              kind="probe" if n.startswith("probe-") else "run" if n.startswith("run-") else "other"
              kinds[kind]+=1
          print("OWNER_AUDIT_INVENTORY",json.dumps({"tracked":len(paths),"scripts":len(scripts),"C0_sources":len(sources),"orphans":len(orphans),"orphanCats":kinds}),flush=True)
          for item in sorted(map(prof,orphans),key=lambda x:x["path"]):
              print("ORPHAN_SCRIPT",json.dumps(item),flush=True)
          # Parse all shell-internal dynamic invocation string interpolation that static
          # name check cannot detect. Show function location and surrounding case dispatch.
          for p,s in scripts.items():
              lines=s.splitlines()
              for i,line in enumerate(lines):
                  if re.search(r"(?:sh|bash|\.)\s+[^#\n]{0,150}(?:\$[A-Za-z_{]|\*)(?:[^ \n]{0,80})\.sh|(?:sh|bash)\s+\"[^\"\n]*\$\w+\"",line):
                      print("DYNAMIC_SCRIPT_CALL",json.dumps({"p":p,"line":i+1,"cmd":line.strip()[:220]}),flush=True)
          # Unlike exact AST equality, we care about common semantics, fixture owners,
          # and independently asserted negative/output contracts.
          pattern=re.compile(r"(?<![A-Za-z0-9])(?:tests/[A-Za-z0-9_./-]+\.(?:c|i)|[A-Za-z_][\w-]*\.c)(?![A-Za-z0-9])")
          source_refs={p:set(pattern.findall(s)) for p,s in scripts.items()}
          for p,r1 in source_refs.items():
              group=[]
              for q,r2 in source_refs.items():
                  if p>=q:continue
                  overlap=len(r1 & r2)
                  if overlap and overlap >= max(2, min(len(r1),len(r2))*.7):
                      group.append((q,overlap,len(r1),len(r2)))
              if group:print("SOURCE_SHARED_SCRIPTS",json.dumps({"p":p,"pairs":group[:15]}),flush=True)
          # Test fixtures with neither literal path nor exact stem anywhere in active drivers.
          used_stems=set()
          c0_dark=[]
          for p in sources:
              stem=pathlib.Path(p).stem
              if not any(stem in s for s in drivers.values()):
                  c0_dark.append(p)
          print("DARK_C0_PATHS",json.dumps({"count":len(c0_dark),"paths":c0_dark[:250]}),flush=True)
          # CI-side script inventory: scan every tracked text owner (including docs)
          # and distinguish live executors from one-shot source rewriters.
          toolfiles={p:v for p,v in blob.items() if p.startswith("tools/ci/") and p.endswith((".py",".sh"))}
          tool_reports=[]
          for p,v in toolfiles.items():
              base=pathlib.Path(p).name
              stem=pathlib.Path(p).stem
              candidate=[(o, "exact" if p in t or base in t else "stem") for o,t in blob.items()
                         if o!=p and (p in t or base in t or stem in t)]
              if not candidate:
                  tool_reports.append((p,len(v),v.splitlines()[:8]))
              if base.startswith("apply-"):
                  print("ONE_SHOT_APPLY",json.dumps({"p":p,"bytes":len(v),"callers":candidate[:25]}),flush=True)
          print("TOOL_ORPHANS",json.dumps({"total":len(toolfiles),"unreferenced":len(tool_reports),"scripts":tool_reports}),flush=True)
          # Token/trigger-history use audit before compacting. These files might be
          # consumed as exact SHA content, not merely changed-path triggers.
          targets=["tools/ci/linux-three-isa-trigger.txt",
                   "tools/ci/linux-rv64-runtime-trigger.txt",
                   "tools/ci/linux-rv64-p1-eight-trigger.txt",
                   "tools/ci/linux-perf-lexer-rescan-census-v1.sh",
                   "tools/ci/linux-perf-integrated-full-profile-v1.sh"]
          for target in targets:
              base=pathlib.Path(target).name
              owners=[]
              for p,s in blob.items():
                  if p==target:continue
                  for line_no,line in enumerate(s.splitlines(),1):
                      if base in line or target in line:
                          owners.append((p,line_no,line.strip()[:350]))
              print("TARGET_OWNERS",json.dumps({"path":target,"count":len(owners),"owners":owners[:160]}),flush=True)
          doc_targets=[
          "docs/ci/active-workflow-inventory-2026-10-09.tsv",
          "docs/ci/ci-push-skip-audit-2026-10-09.md",
          "docs/ci/ci-architecture-audit-findings-2026-10-09.md",
          "docs/ci/minic-perf-decision-index-2026-10-17.md",
          ]
          for target in doc_targets:
              base=pathlib.Path(target).name
              stem=pathlib.Path(target).stem
              owners=[]
              for p,s in blob.items():
                  if p==target:continue
                  for n,line in enumerate(s.splitlines(),1):
                      if base in line or target in line:
                          owners.append((p,n,line.strip()[:280]))
              print("OLD_DOC_REFERENCES",json.dumps({"path":target,"bytes":len(blob.get(target,"")),"references":owners[:70]}),flush=True)
          # Enumerate all action event contracts and external references; do not infer
          # routing from filename or a path-filter alone.
          workflows={p:s for p,s in blob.items() if p.startswith(".github/workflows/") and p.endswith((".yml",".yaml"))}
          for p,s in sorted(workflows.items()):
              if p.endswith("minic-deep-owner-census.yml"):continue
              header=s.split("\njobs:\n",1)[0]
              events=re.findall(r"(?m)^  (pull_request|pull_request_target|push|workflow_dispatch|workflow_call|schedule|repository_dispatch):",header)
              top=re.findall(r"(?m)^on:\s*(.*)$",header)
              pcall=re.findall(r"(?m)^\s+branches:\s*\n((?:\s+-\s+[^\n]+\n)+)",header)
              scopes=[x.strip() for chunk in pcall for x in re.findall(r"(?m)^\s+-\s+([^\n]+)",chunk)]
              # Stronger evidence than incidental filename mention: same relative action
              # has to be in a uses step or an executable script command.
              referrer=[]
              for other,body in blob.items():
                  if other==p or other.endswith("minic-deep-owner-census.yml"):continue
                  bn=pathlib.Path(p).name
                  if p in body or bn in body:
                      snippets=[(i+1,line.strip()[:170]) for i,line in enumerate(body.splitlines()) if p in line or bn in line]
                      referrer.append((other,snippets[:5]))
              jobs=re.findall(r"(?m)^  ([a-zA-Z][\w-]*):\s*$",s.split("\njobs:\n",1)[1]) if "\njobs:\n" in s else []
              print("WORKFLOW_ROUTING",json.dumps({"p":p,"bytes":len(s),"lines":len(s.splitlines()),"events":events or top,"branches":scopes,"jobs":len(jobs),"referencers":referrer[:15]}),flush=True)
          # Resolve conservative literal stem prefixes inside real executable callers.
          # Dynamic basename construction can survive full-name grep but MUST have an
          # identifiable source-root prefix, basename variable, glob, or finite case list.
          executable={p:v for p,v in blob.items() if
                      p.endswith((".sh",".py",".yml",".yaml",".mk")) or p=="Makefile"}
          def prefix_refs(stem):
              parts=re.split(r"[_-]",stem)
              prefs=["_".join(parts[:i]) for i in range(1,len(parts)) if len("_".join(parts[:i]))>=12]
              prefs += ["-".join(parts[:i]) for i in range(1,len(parts)) if len("-".join(parts[:i]))>=12]
              result=[]
              for p,s in executable.items():
                  if p.endswith("minic-deep-owner-census.yml"):continue
                  if "/audit/" in p and "historical" in p:continue
                  for i,line in enumerate(s.splitlines(),1):
                      for term in sorted(prefs,key=len,reverse=True):
                          if term in line and not line.strip().startswith("#"):
                              result.append((p,i,term,line.strip()[:210]))
                              break
              return sorted(result,key=lambda x:-len(x[2]))[:16]
          for p in c0_dark:
              n=pathlib.Path(p).name
              if n.startswith(("core_","aarch64_gnu_inline_lazy_","aarch64_gnu_neon_inline_","incomplete_function_pointer_array_")):continue
              print("DARK_C0_SEMANTIC_REFS",json.dumps({"path":p,"refs":prefix_refs(pathlib.Path(p).stem)}),flush=True)
          print("OWNER_AUDIT_COMPLETE",flush=True)
          PY
