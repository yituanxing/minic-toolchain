name: PR118 Materialize Runtime Record Array
on:
  push:
    branches: [agent/runtime-record-array-initializer-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize runtime record array initializer
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr118-materialize.py
          python3 tools/dev/pr118-compat.py
          clang-format-18 -i \
            src/frontend/parser_statement.c \
            tests/programs/c0/runtime_record_array_initializer.c \
            tests/compiler/c0/runtime_record_array_initializer.c \
            tests/compiler/c0/invalid_record_array_brace_elision.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr118-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-runtime-record-array-initializers.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr118-materialize.py tools/dev/pr118-compat.py .github/workflows/pr118-materialize-runtime-record-array.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): initialize fixed record array members'
          git push origin HEAD:agent/runtime-record-array-initializer-v0
