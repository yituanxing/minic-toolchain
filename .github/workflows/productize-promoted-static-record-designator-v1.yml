name: Productize character array string on static pointer v1

on:
  pull_request:
    branches:
      - frontend/static-pointer-constant-v1
    paths:
      - 'tools/dev/materialize-character-array-string-on-static-pointer-v1.py'
      - '.github/workflows/productize-promoted-static-record-designator-v1.yml'

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: frontend/character-array-string-init-on-static-pointer-v1
          fetch-depth: 0

      - name: Port proven character array product
        run: |
          set -Eeuo pipefail
          git fetch origin frontend/character-array-string-init-v1
          git checkout origin/frontend/character-array-string-init-v1 -- \
            src/frontend/parser_internal.h \
            src/frontend/parser_statement.c \
            src/frontend/parser_string.c \
            tests/compiler/c0/run-character-array-string-initializer.sh \
            tests/compiler/c0/run.sh \
            tests/programs/c0/character_array_string_initializer.c \
            tests/programs/c0/manifest.txt
          python3 tools/dev/materialize-character-array-string-on-static-pointer-v1.py
          rm tools/dev/materialize-character-array-string-on-static-pointer-v1.py
          clang-format-18 -i \
            src/frontend/parser_global.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_statement.c \
            src/frontend/parser_string.c \
            tests/programs/c0/character_array_string_initializer.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and focused gate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-character-array-string
          timeout 30s env \
            MINIC="$GITHUB_WORKSPACE/build/product-character-array-string/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/product-character-array-string" \
            sh tests/compiler/c0/run-character-array-string-initializer.sh

      - name: Publish clean product
        run: |
          set -Eeuo pipefail
          git fetch origin frontend/static-pointer-constant-v1
          git checkout origin/frontend/static-pointer-constant-v1 -- \
            .github/workflows/productize-promoted-static-record-designator-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'frontend: initialize character arrays from string literals'
          git push origin HEAD:frontend/character-array-string-init-on-static-pointer-v1
