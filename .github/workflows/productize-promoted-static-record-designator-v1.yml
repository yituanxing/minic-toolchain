name: Productize static-storage scalar-array owner v1

on:
  pull_request:
    branches:
      - frontend/character-array-string-init-on-static-pointer-v1
    paths:
      - 'tools/dev/materialize-static-storage-scalar-array-owner-v1.py'
      - 'tools/dev/register-static-storage-scalar-array-owner-v1.py'
      - 'tests/compiler/c0/static_storage_scalar_array_owner.c'
      - 'tests/compiler/c0/run-static-storage-scalar-array-owner.sh'
      - '.github/workflows/productize-promoted-static-record-designator-v1.yml'

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: frontend/static-storage-scalar-array-owner-v1
          fetch-depth: 0

      - name: Materialize shared ownership
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-static-storage-scalar-array-owner-v1.py
          python3 tools/dev/register-static-storage-scalar-array-owner-v1.py
          rm tools/dev/materialize-static-storage-scalar-array-owner-v1.py
          rm tools/dev/register-static-storage-scalar-array-owner-v1.py
          clang-format-18 -i \
            src/frontend/parser_function.c \
            src/frontend/parser_statement.c \
            tests/compiler/c0/static_storage_scalar_array_owner.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and focused gate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-static-storage-array-owner
          timeout 30s env \
            MINIC="$GITHUB_WORKSPACE/build/product-static-storage-array-owner/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/product-static-storage-array-owner" \
            sh tests/compiler/c0/run-static-storage-scalar-array-owner.sh

      - name: Publish clean product
        run: |
          set -Eeuo pipefail
          git fetch origin frontend/character-array-string-init-on-static-pointer-v1
          git checkout origin/frontend/character-array-string-init-on-static-pointer-v1 -- \
            .github/workflows/productize-promoted-static-record-designator-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'frontend: share static-storage scalar-array initializer ownership'
          git push origin HEAD:frontend/static-storage-scalar-array-owner-v1
