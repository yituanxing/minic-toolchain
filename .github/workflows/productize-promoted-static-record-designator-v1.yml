name: Productize static pointer constant v1

on:
  pull_request:
    branches:
      - frontend/static-subobject-address-constant-v1
    paths:
      - 'tools/dev/materialize-static-pointer-constant-v1.py'
      - 'tools/dev/fix-static-pointer-constant-test-v1.py'
      - '.github/workflows/productize-promoted-static-record-designator-v1.yml'

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: frontend/static-pointer-constant-v1
          fetch-depth: 0

      - name: Materialize static pointer constants
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-static-pointer-constant-v1.py
          python3 tools/dev/fix-static-pointer-constant-test-v1.py
          rm tools/dev/materialize-static-pointer-constant-v1.py
          rm tools/dev/fix-static-pointer-constant-test-v1.py
          clang-format-18 -i \
            src/frontend/parser_global.c \
            tests/compiler/c0/static_pointer_constant_conditional.c \
            tests/compiler/c0/invalid_static_pointer_nonconstant_conditional.c
          git diff --check

      - name: Build and isolate nontermination
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-static-pointer-constant
          minic="$GITHUB_WORKSPACE/build/product-static-pointer-constant/bin/minic"
          mkdir -p build/static-pointer-probes
          cat > build/static-pointer-probes/absolute-arithmetic.c <<'EOF'
          static void *p = (void *)0x300UL + 0xdead000000000000UL;
          int main(void) { return p == 0; }
          EOF
          cat > build/static-pointer-probes/full-width-bits.c <<'EOF'
          static void *p = (void *)(0xeB9FUL + 0xdead000000000000UL);
          int main(void) { return p == 0; }
          EOF
          cat > build/static-pointer-probes/identical-function-arms.c <<'EOF'
          static int f(void) { return 0; }
          static void *p = f == (void *)0 ? (void *)&f : (void *)&f;
          int main(void) { return p == 0; }
          EOF
          cat > build/static-pointer-probes/old-ice-conditional.c <<'EOF'
          static int value;
          static int *p = 1 ? &value : 0;
          int main(void) { return p == &value ? 0 : 1; }
          EOF
          status=0
          for probe in absolute-arithmetic full-width-bits identical-function-arms old-ice-conditional; do
            printf 'STATIC_POINTER_PROBE begin=%s\n' "$probe"
            set +e
            timeout 5s "$minic" -S "build/static-pointer-probes/$probe.c" \
              -o "build/static-pointer-probes/$probe.s" \
              >"build/static-pointer-probes/$probe.stdout" \
              2>"build/static-pointer-probes/$probe.stderr"
            rc=$?
            set -e
            printf 'STATIC_POINTER_PROBE end=%s rc=%d\n' "$probe" "$rc"
            if test -s "build/static-pointer-probes/$probe.stderr"; then
              tail -n 20 "build/static-pointer-probes/$probe.stderr"
            fi
            if [[ $rc -eq 124 ]]; then
              printf 'STATIC_POINTER_PROBE HANG=%s\n' "$probe"
              status=1
            fi
          done
          exit "$status"
