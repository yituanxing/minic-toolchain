name: Productize promoted static record designator v1

on:
  pull_request:
    branches:
      - tests/linux-batch-pressure-convergence-v1
    paths:
      - 'tools/dev/materialize-promoted-static-record-designator-v1.py'
      - 'tests/compiler/c0/promoted_static_record_designator.c'
      - '.github/workflows/productize-promoted-static-record-designator-v1.yml'

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: frontend/promoted-static-record-designator-v1

      - name: Materialize promoted member paths
        run: |
          python3 tools/dev/materialize-promoted-static-record-designator-v1.py
          clang-format -i src/frontend/parser_global.c

      - name: Build and focused gate
        run: |
          make -j4 CFLAGS=-Werror
          cc -E -P -std=gnu11 -x c tests/compiler/c0/promoted_static_record_designator.c \
            -o build/debug/tests/promoted_static_record_designator.i
          build/debug/bin/minic -S build/debug/tests/promoted_static_record_designator.i \
            -o build/debug/tests/promoted_static_record_designator.s
          test -s build/debug/tests/promoted_static_record_designator.s
          git diff --check

      - name: Commit product
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_global.c
          if git diff --cached --quiet; then
            echo 'promoted record designator product already materialized'
            exit 0
          fi
          git commit -m 'frontend: support promoted static record designators'
          git push origin HEAD:frontend/promoted-static-record-designator-v1
