name: Productize static pointer constant v1

on:
  pull_request:
    branches:
      - frontend/static-subobject-address-constant-v1
    paths:
      - 'tools/dev/materialize-static-pointer-constant-v1.py'
      - 'tools/dev/fix-static-pointer-constant-test-v1.py'
      - '.github/workflows/productize-promoted-static-record-designator-v1.yml'

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: frontend/static-pointer-constant-v1
          fetch-depth: 0

      - name: Materialize static pointer constants
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-static-pointer-constant-v1.py
          python3 tools/dev/fix-static-pointer-constant-test-v1.py
          rm tools/dev/materialize-static-pointer-constant-v1.py
          rm tools/dev/fix-static-pointer-constant-test-v1.py
          clang-format-18 -i \
            src/frontend/parser_global.c \
            tests/compiler/c0/static_pointer_constant_conditional.c \
            tests/compiler/c0/invalid_static_pointer_nonconstant_conditional.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and focused gate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-static-pointer-constant
          MINIC="$GITHUB_WORKSPACE/build/product-static-pointer-constant/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/product-static-pointer-constant" \
            sh tests/compiler/c0/run-static-pointer-constant-conditional.sh

      - name: Publish clean product
        run: |
          set -Eeuo pipefail
          git fetch origin frontend/static-subobject-address-constant-v1
          git checkout origin/frontend/static-subobject-address-constant-v1 -- \
            .github/workflows/productize-promoted-static-record-designator-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'frontend: normalize static pointer constant expressions'
          git push origin HEAD:frontend/static-pointer-constant-v1
