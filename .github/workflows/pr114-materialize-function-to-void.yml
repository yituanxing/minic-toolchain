name: PR114 Materialize GNU Function To Void Call
on:
  push:
    branches: [agent/gnu-function-to-void-call-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize GNU function-to-void call conversion
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr114-materialize.py
          clang-format-18 -i src/frontend/parser_expression.c tests/compiler/c0/gnu_function_pointer_to_void_call.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr114-focused" HOST_CC=cc sh tests/compiler/c0/run-gnu-function-pointer-bridge-call.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr114-materialize.py .github/workflows/pr114-materialize-function-to-void.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): convert GNU function pointers to void call arguments'
          git push origin HEAD:agent/gnu-function-to-void-call-v0
