name: One-shot Core Integer Less M26

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Prove M26 strict gap before patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m26-before
          c="$GITHUB_WORKSPACE/build/core-m26-before/bin/minic"
          cat > build/core-m26-before.i <<'EOF'
          int probe(unsigned long left, unsigned long right) { return left < right; }
          EOF
          if MINIC_CORE_IR=strict "$c" -S build/core-m26-before.i -o /tmp/m26-before.s 2>/tmp/m26-before.err; then
              echo 'M26 integer less-than gap unexpectedly absent' >&2
              exit 1
          fi
          cat /tmp/m26-before.err
          grep -F "Core IR shadow does not yet support function 'probe'" /tmp/m26-before.err >/dev/null

      - name: Apply M26 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-integer-less-m26.py
          python3 tools/dev/patch-core-integer-less-m26.py
          clang-format-18 -i \
            src/core/core_ir.h \
            src/core/core_ir.c \
            src/core/core_lower.c \
            src/target/riscv64/core_codegen.c \
            tests/compiler/c0/core_integer_less_m26.c \
            tests/compiler/c0/core_integer_less_m26_runtime.c
          chmod +x tests/compiler/c0/run-core-integer-less-m26.sh
          sh -n tests/compiler/c0/run-core-integer-less-m26.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check

      - name: Focused and regression validation
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m26-compiler
          c="$GITHUB_WORKSPACE/build/core-m26-compiler/bin/minic"
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m26-focused" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-less-m26.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m26-m25b" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-binary-preservation-m25b.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m26-m25" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-discard-expression-m25.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m26-m24" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-postfix-update-m24.sh
          MINIC="$c" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m26-m23" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-conditional-m23.sh
          MINIC="$c" bash tests/core/run-core-ir-shadow.sh

      - name: Frozen strict first500 gate
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m26-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-m26-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$c" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 5 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices ''
          replay_status=$?
          set -e
          printf 'CORE_M26_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('build/core-m26-strict500/frontier-summary.json').read_text())
          blockers = {row['function']: row['count'] for row in s['blockers']}
          print('CORE_M26_PASS', s['pass'])
          print('CORE_M26_UNSUPPORTED', s['unsupported'])
          print('CORE_M26_ERROR', s['error'])
          print('CORE_M26_BLOCKERS', s['blockers'][:12])
          if s['selected'] != 500:
              raise SystemExit(f"M26 expected 500 TUs, got {s['selected']}")
          if s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit('M26 introduced non-UNSUPPORTED strict failures')
          if blockers.get('cpu_to_be32_array', 0) != 0:
              raise SystemExit(f"M26 did not pierce cpu_to_be32_array: {blockers.get('cpu_to_be32_array')}")
          if s['pass'] + s['unsupported'] != 500:
              raise SystemExit('M26 strict500 accounting mismatch')
          PY

      - name: Productize proven M26
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm tools/dev/patch-core-integer-less-m26.py \
                 .github/workflows/oneshot-core-integer-less-m26.yml \
                 .github/workflows/oneshot-core-frontier-batch-m26.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h \
                  src/core/core_ir.c \
                  src/core/core_lower.c \
                  src/target/riscv64/core_codegen.c \
                  .github/scripts/compiler-c0-full-gate.sh \
                  tests/compiler/c0/core_integer_less_m26.c \
                  tests/compiler/c0/core_integer_less_m26_runtime.c \
                  tests/compiler/c0/run-core-integer-less-m26.sh
          git diff --cached --check
          git commit -m 'core: lower integer less-than comparisons'
          git push origin HEAD:refactor/declaration-sema-v1
