name: Canonicalize RV64 Small Record Copy Return
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'product/rv64-small-record-copy-return-v4' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/rv64-small-record-copy-return-v4
          fetch-depth: 0
      - name: Canonicalize and validate
        run: |
          set -Eeuo pipefail
          clang-format-18 -i src/target/riscv64/codegen_internal.h src/target/riscv64/codegen_expression.c src/target/riscv64/codegen_statement.c tests/compiler/c0/small_record_copy_return.c
          rm .github/workflows/format-rv64-small-record-copy-return-v1.yml
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-small-record-format
          MINIC="$GITHUB_WORKSPACE/build/product-small-record-format/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-small-record-format" sh tests/compiler/c0/run-small-record-copy-return.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-small-record-format-fast
      - name: Commit canonical product tree
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/target/riscv64/codegen_internal.h src/target/riscv64/codegen_expression.c src/target/riscv64/codegen_statement.c tests/compiler/c0/small_record_copy_return.c .github/workflows/format-rv64-small-record-copy-return-v1.yml
          git commit -m 'style: canonicalize RV64 small-record return slice'
          git push origin HEAD:product/rv64-small-record-copy-return-v4
