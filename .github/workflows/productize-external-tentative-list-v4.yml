name: Productize External Tentative List V4
on:
  push:
    branches: [product/external-tentative-declarator-list-v4]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/external-tentative-declarator-list-v4
          fetch-depth: 0
      - name: Apply product slice
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/frontend/parser_function.c')
          s = p.read_text()
          start = s.index('static bool parse_external_tentative_object(')
          end = s.index('\nstatic bool parse_external_object_definition(', start)
          block = s[start:end].replace('static bool parse_external_tentative_object(', 'static bool record_external_tentative_object(', 1)
          sig_old = '''                                            MinicSymbolVisibility visibility,\n                                            bool has_visibility) {\n    MinicGlobalObjectId object_id;\n'''
          sig_new = '''                                             MinicSymbolVisibility visibility,\n                                             bool has_visibility,\n                                             MinicGlobalObjectId *object_id_out) {\n    MinicGlobalObjectId object_id;\n'''
          if sig_old not in block:
              raise SystemExit('tentative signature anchor missing')
          block = block.replace(sig_old, sig_new, 1)
          cond_old = '''    if (parser == NULL || parser->current.kind != MINIC_TOKEN_SEMICOLON ||\n        !minic_c0_type_is_complete_object(parser->program, object_type)) {\n'''
          cond_new = '''    if (parser == NULL || object_id_out == NULL ||\n        !minic_c0_type_is_complete_object(parser->program, object_type)) {\n'''
          if cond_old not in block:
              raise SystemExit('tentative condition anchor missing')
          block = block.replace(cond_old, cond_new, 1)
          tail_old = '''    return minic_parser_advance(parser);\n}\n'''
          if block.count(tail_old) != 1:
              raise SystemExit('tentative tail anchor mismatch')
          block = block.replace(tail_old, '''    *object_id_out = object_id;\n    return true;\n}\n''', 1)
          helpers = r'''

static bool parse_external_tentative_object(MinicParser *parser,
                                            MinicType object_type,
                                            MinicSourceSpan name_span,
                                            const char *section_name,
                                            size_t section_name_length,
                                            bool has_section,
                                            size_t explicit_alignment,
                                            MinicSymbolVisibility visibility,
                                            bool has_visibility) {
    MinicGlobalObjectId object_id;

    if (parser == NULL || parser->current.kind != MINIC_TOKEN_SEMICOLON ||
        !record_external_tentative_object(parser,
                                          object_type,
                                          name_span,
                                          section_name,
                                          section_name_length,
                                          has_section,
                                          explicit_alignment,
                                          visibility,
                                          has_visibility,
                                          &object_id)) {
        return false;
    }
    (void)object_id;
    return minic_parser_advance(parser);
}

static bool parse_external_tentative_declaration_list_after_head(
    MinicParser *parser,
    MinicType base_type,
    MinicType first_type,
    MinicSourceSpan first_name,
    const char *first_section_name,
    size_t first_section_name_length,
    bool first_has_section,
    size_t first_explicit_alignment,
    MinicSymbolVisibility first_visibility,
    bool first_has_visibility) {
    MinicGlobalObjectId object_id;

    if (parser == NULL || parser->current.kind != MINIC_TOKEN_COMMA ||
        !record_external_tentative_object(parser,
                                          first_type,
                                          first_name,
                                          first_section_name,
                                          first_section_name_length,
                                          first_has_section,
                                          first_explicit_alignment,
                                          first_visibility,
                                          first_has_visibility,
                                          &object_id)) {
        return false;
    }
    while (parser->current.kind == MINIC_TOKEN_COMMA) {
        MinicSourceSpan name_span;
        MinicType object_type;
        char section_name[256];
        size_t section_name_length;
        size_t explicit_alignment;
        MinicSymbolVisibility visibility;
        bool has_section;
        bool has_visibility;
        bool is_array;

        if (!minic_parser_advance(parser)) {
            return false;
        }
        object_type = base_type;
        if (!minic_parser_parse_pointer_declarator(parser, object_type, &object_type) ||
            !minic_parser_parse_direct_declarator_name(parser, &name_span) ||
            !minic_parser_parse_array_declarator_suffix(
                parser, object_type, true, &object_type, &is_array)) {
            return false;
        }
        (void)is_array;
        (void)memset(section_name, 0, sizeof(section_name));
        section_name_length = 0U;
        explicit_alignment = 0U;
        visibility = first_visibility;
        has_section = false;
        has_visibility = first_has_visibility;
        if (!minic_parser_parse_gnu_object_attribute_lists_with_visibility(
                parser,
                section_name,
                sizeof(section_name),
                &section_name_length,
                &has_section,
                &explicit_alignment,
                &visibility,
                &has_visibility)) {
            return false;
        }
        if (parser->current.kind == MINIC_TOKEN_EQUAL) {
            minic_parser_error(
                parser, "mixed initialized external declarator lists are not supported yet");
            return false;
        }
        if (!record_external_tentative_object(parser,
                                              object_type,
                                              name_span,
                                              section_name,
                                              section_name_length,
                                              has_section,
                                              explicit_alignment,
                                              visibility,
                                              has_visibility,
                                              &object_id)) {
            return false;
        }
    }
    return minic_parser_expect(
        parser, MINIC_TOKEN_SEMICOLON, "expected ';' after external object declaration list");
}
'''
          s = s[:start] + block + helpers + s[end:]
          old = '''        if (parser->current.kind == MINIC_TOKEN_LBRACKET) {\n            return parse_visible_external_array(parser,\n'''
          new = '''        if (parser->current.kind == MINIC_TOKEN_COMMA) {\n            return parse_external_tentative_declaration_list_after_head(parser,\n                                                                        base_type,\n                                                                        return_type,\n                                                                        name_span,\n                                                                        section_name,\n                                                                        section_name_length,\n                                                                        has_section,\n                                                                        object_explicit_alignment,\n                                                                        visibility,\n                                                                        has_visibility);\n        }\n        if (parser->current.kind == MINIC_TOKEN_LBRACKET) {\n            return parse_visible_external_array(parser,\n'''
          if s.count(old) != 1:
              raise SystemExit(f'external dispatch anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          cat > tests/compiler/c0/external_tentative_declarator_list.c <<'EOF'
          unsigned long first_value, second_value;
          int *first_pointer, *second_pointer;
          int main(void) {
              return (int)(first_value + second_value) +
                     (first_pointer != 0) + (second_pointer != 0);
          }
          EOF
          cat > tests/compiler/c0/run-external-tentative-declarator-list.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/external-tentative-declarator-list
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/external_tentative_declarator_list.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-external-tentative-declarator-list.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-external-tentative-declarator-list.sh"
          EOF
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/external_tentative_declarator_list.c
          git diff --check
      - name: Validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/external-list-v4
          MINIC="$GITHUB_WORKSPACE/build/external-list-v4/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/external-list-v4-focused" sh tests/compiler/c0/run-external-tentative-declarator-list.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/external-list-v4-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-external-tentative-list-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_function.c tests/compiler/c0/external_tentative_declarator_list.c tests/compiler/c0/run-external-tentative-declarator-list.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: parse external tentative declarator lists'
          git push origin HEAD:product/external-tentative-declarator-list-v4
