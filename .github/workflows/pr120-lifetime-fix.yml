name: PR120 Offsetof Lifetime Fix
on:
  push:
    branches: [agent/offsetof-nested-designator-v0]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot offsetof index semantics
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr120-lifetime-fix.py
          clang-format-18 -i src/frontend/parser_expression.c
      - name: Validate product
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr120-focused" HOST_CC=cc sh tests/compiler/c0/run-builtin-offsetof.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr120-lifetime-fix.py .github/workflows/pr120-lifetime-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(frontend): snapshot offsetof index semantics before pool growth'
          git push origin HEAD:agent/offsetof-nested-designator-v0
