name: One-shot Core Statement Expression M17

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Prove M17 statement-expression gap
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m17-before-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m17-before-compiler/bin/minic"
          cat > build/core-m17-direct.i <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int core_m17_direct(const struct node *head) { return head->next == head; }
          EOF
          MINIC_CORE_IR=strict "$compiler" -S build/core-m17-direct.i -o build/core-m17-direct.s
          cat > build/core-m17-before.i <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int core_m17_before(const struct node *head) {
              return ({ (*(struct node * const volatile *)&(head->next)); }) == head;
          }
          EOF
          if MINIC_CORE_IR=strict "$compiler" -S build/core-m17-before.i \
              -o build/core-m17-before.s 2>build/core-m17-before.err; then
            echo 'M17 statement-expression gap unexpectedly absent before patch' >&2
            exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'core_m17_before'" \
            build/core-m17-before.err >/dev/null
          printf '%s\n' 'PROVED core/m17 statement-expression result forwarding gap'

      - name: Apply M17
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-statement-expression-m17.py
          python3 tools/dev/patch-core-statement-expression-m17.py
          clang-format-18 -i \
            src/core/core_lower.c \
            tests/compiler/c0/core_statement_expression.c \
            tests/compiler/c0/core_statement_expression_runtime.c
          sh -n tests/compiler/c0/run-core-statement-expression.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check
          grep -F 'expression->kind == MINIC_EXPRESSION_STATEMENT' src/core/core_lower.c >/dev/null
          grep -F 'expression->value.statement_expression.result' src/core/core_lower.c >/dev/null
          grep -F 'lower_block(context, statement_block, &terminated)' src/core/core_lower.c >/dev/null

      - name: Build and validate M17
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m17-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m17-compiler/bin/minic"
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m17-focused" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-statement-expression.sh
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m17-pointer-equality-regression" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-pointer-equality-qualifiers.sh
          MINIC="$compiler" bash tests/core/run-core-ir-shadow.sh

      - name: Replay frozen strict frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m17-compiler/bin/minic"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$GITHUB_WORKSPACE/build/core-m17-strict" \
            --jobs 4 --offset 0 --limit 500 --sample-count 64 --indices ''
          replay_status=$?
          set -e
          printf 'CORE_M17_REPLAY_STATUS=%d\n' "$replay_status"
          python3 - <<'PY'
          from collections import Counter
          import json, re
          from pathlib import Path
          rows = json.loads(Path('build/core-m17-strict/batch-results.json').read_text())
          unsupported_re = re.compile(r"^Core IR shadow does not yet support function '([^']+)'$")
          unsupported = Counter()
          errors = []
          passes = 0
          for row in rows:
              if row['status'] == 'PASS':
                  passes += 1
                  continue
              message = str(row['message'])
              match = unsupported_re.match(message)
              if match:
                  unsupported[match.group(1)] += 1
              else:
                  errors.append((row['index'], message))
          print(f'CORE_M17_FRONTIER selected={len(rows)} pass={passes} unsupported={sum(unsupported.values())} error={len(errors)}')
          for function, count in unsupported.most_common():
              print(f'CORE_M17_BLOCKER count={count} function={function}')
          for index, message in errors:
              print(f'CORE_M17_ERROR index={index} message={message}')
          if errors:
              raise SystemExit('M17 introduced non-UNSUPPORTED strict failures')
          PY

      - name: Publish M17 product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-statement-expression-m17.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_lower.c \
            tests/compiler/c0/core_statement_expression.c \
            tests/compiler/c0/core_statement_expression_runtime.c \
            tests/compiler/c0/run-core-statement-expression.sh \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-statement-expression-m17.py
          git diff --cached --check
          git commit -m 'core: lower GNU statement expression values'
          git push origin HEAD:refactor/declaration-sema-v1
