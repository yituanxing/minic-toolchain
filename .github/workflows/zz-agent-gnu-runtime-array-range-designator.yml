name: Agent GNU runtime array range designators

on:
  push:
    branches:
      - agent/gnu-runtime-array-range-designator-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build baseline MiniC
        run: make -j4 BUILD_DIR=build/agent-range-baseline

      - name: Prove baseline rejects Linux-shaped range designator
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/agent-range-repro
          cat > build/agent-range-repro/repro.c <<'EOF'
          typedef struct {
              unsigned long bits[1];
          } nodemask_t;
          void fill(nodemask_t *targets)
          {
              *targets = (nodemask_t) { { [0 ... 0] = 0UL } };
          }
          EOF
          cc -E -P -std=gnu11 -x c build/agent-range-repro/repro.c \
            -o build/agent-range-repro/repro.i
          if build/agent-range-baseline/bin/minic -S build/agent-range-repro/repro.i \
              -o build/agent-range-repro/baseline.s \
              >build/agent-range-repro/baseline.stdout \
              2>build/agent-range-repro/baseline.stderr; then
            echo 'baseline unexpectedly accepted GNU runtime array range designator' >&2
            exit 1
          fi
          grep -F 'expected expression' build/agent-range-repro/baseline.stderr >/dev/null

      - name: Apply bounded range-designator patch
        run: |
          python3 tools/dev/agent-gnu-runtime-array-range-designator.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build patched MiniC with Werror
        run: make -j4 MODE=release BUILD_DIR=build/agent-range-patched CFLAGS=-Werror

      - name: Re-run Linux-shaped reproducer
        shell: bash
        run: |
          set -Eeuo pipefail
          build/agent-range-patched/bin/minic -S build/agent-range-repro/repro.i \
            -o build/agent-range-repro/patched.s
          test -s build/agent-range-repro/patched.s
          grep -F 'fill:' build/agent-range-repro/patched.s >/dev/null

      - name: Run focused record compound-literal contract
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-range-patched/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-range-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-record-compound-literal.sh

      - name: Run fast regression gate
        run: make -j4 BUILD_DIR=build/agent-range-fast check-fast

      - name: Commit product-only result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add src/frontend/parser_statement.c \
                  tests/compiler/c0/gnu_record_compound_literal.c \
                  tests/compiler/c0/run-gnu-record-compound-literal.sh
          git rm .github/workflows/zz-agent-gnu-runtime-array-range-designator.yml \
                 tools/dev/agent-gnu-runtime-array-range-designator.py
          git commit -m 'feat: support GNU runtime array range designators'
          git push origin HEAD:agent/gnu-runtime-array-range-designator-v1
