              "tools/ci/apply-perf-core-object-address-use-index-v1.py",
              "tools/ci/apply-riscv64-p1-defined-before-use-crossblock-v1.py",
              "tools/ci/apply-riscv64-p1-frame-diagnostic-v1.py",
              "tools/ci/apply-riscv64-p1-nonreuse-reasons-v1.py",
          }
          old_layout_snapshot = "93a601f35a93edebcc7c3b85751c90f2bec5c7e7"
          old_layout_tree = set(git("ls-tree", "-r", "--name-only", old_layout_snapshot).decode().splitlines())
          assert (retired_rv64_labels | retired_missing_source) <= old_layout_tree
          assert not pathlib.Path("src/target/riscv64/core_codegen.c").exists()
          assert not pathlib.Path("src/core/core_lower.c").exists()
          for path in retired_missing_source:
              proc = subprocess.run(["python3", path], capture_output=True, text=True)
              assert proc.returncode == 78 and "HISTORICAL_PROFILE_RETIRED:" in proc.stderr
          expected |= retired_rv64_labels
          metadata |= retired_missing_source
          metadata |= {
              ".github/workflows/linux-expanded-pi-p1-runtime-v1.yml",
              ".github/workflows/linux-runtime-focused-faults-v1.yml",
              "tools/ci/historical_workflows.py",
              "tools/ci/check_linux_expanded_pi_p1_convergence_v1.py",
              "tools/ci/check_linux_early_runtime_union_v1.py",
              "tools/ci/check_linux_runtime_focused_faults_convergence_v1.py",
              "tools/ci/check_linux_runtime_frontier_diagnostics_convergence_v1.py",
              "tools/ci/check_linux_runtime_diagnostic_union_v1.py",
              "tools/ci/audit_active_workflow_routing_v1.py",
              "tools/ci/check_linux_legacy_tag_router_v1.py",
          }
          metadata |= {"docs/ci/linux-runtime-isolation.md"}
          metadata |= {"tools/ci/linux-perf-build-minic-profile-v1.sh", "tools/ci/linux-perf-ast-growth-ab-v1.sh"}
          metadata |= {"tools/ci/linux-runtime-build-minic-profile-v1.sh", "tools/ci/linux-runtime-profile-cache-id-v1.py"}
          deleted = changed_paths(base, "HEAD", "--diff-filter=D")
          changed = changed_paths(base, "HEAD")
          if len(expected) != 922 or deleted != expected or changed != expected | metadata:
              raise SystemExit("RETIREMENT_SCOPE=FAIL: unexpected tree changes")
          # Preserve the full closure in a historical checkout, not a successful
          # no-op overlay on a different source architecture.
          replay = "eb583f9dd9bf9cb2ebf530a8579930311b8539d9"
          assert retired_overlay <= set(git("ls-tree", "-r", "--name-only", replay).decode().splitlines())
          for command in (["python3", "tools/ci/apply-inline-asm-symbolic-specialization-v0.py"],
                          ["bash", "tools/ci/linux-runtime-earlycon-profile-probe-v1.sh"]):
              result = subprocess.run(command, capture_output=True, text=True)
              assert result.returncode == 78 and replay in result.stderr and "HISTORICAL_PROFILE_RETIRED" in result.stderr
          print("HISTORICAL_OVERLAY_RETIREMENT=PASS historical_files=31 fail_closed=2")
          runtime_path = "tools/ci/linux-runtime-build-minic-profile-v1.sh"
          runtime_text = pathlib.Path(runtime_path).read_text()
          old_runtime_text = git("show", accepted + ":" + runtime_path).decode()
          def patch_labels(content):
              block = content.split("patches=(\n", 1)[1].split("\n)", 1)[0]
              return [line.strip().split(" #", 1)[0] for line in block.splitlines()
                      if line.strip().startswith("apply-")]
          assert len(patch_labels(runtime_text)) == 44
          assert patch_labels(runtime_text) == patch_labels(old_runtime_text)
          historical_labels = {"  " + pathlib.PurePosixPath(p).name + " # historical-only"
                               for p in retired_runtime | retired_stack | retired_rv64_labels
                               if pathlib.PurePosixPath(p).name in patch_labels(runtime_text)}
          assert set(line for line in runtime_text.splitlines() if line.endswith(" # historical-only")) == historical_labels
          assert 'python3 "tools/ci/$p"' not in runtime_text and 'native_profile=' not in runtime_text
          assert retired_runtime <= set(git("ls-tree", "-r", "--name-only", "59ad3648637eba4991c0fb8ce27f121cc852b4fa").decode().splitlines())
          print("NATIVE_RUNTIME_RETIREMENT=PASS labels=44 archived_inputs=10 historical_fallback=retired")
          import sys
          sys.path.insert(0, "tools/ci")
          from historical_workflows import RETIRED_JOBS, historical_job_view
          for path in RETIRED_JOBS:
              historical_job_view(pathlib.Path(path))
          print("HISTORICAL_JOB_RETIREMENT=PASS retired_jobs=4 unrelated_jobs_unchanged=10 archived_stack_inputs=" + str(len(retired_stack)))
          perf_replay = "59ad3648637eba4991c0fb8ce27f121cc852b4fa"
          historical_tree = set(git("ls-tree", "-r", "--name-only", perf_replay).decode().splitlines())
          assert retired_perf <= historical_tree
          for entry in ("tools/ci/linux-perf-build-minic-profile-v1.sh", "tools/ci/linux-perf-ast-growth-ab-v1.sh"):
              result = subprocess.run(["bash", entry, "unused-build", "unused-evidence"], capture_output=True, text=True)
              assert result.returncode == 78 and "HISTORICAL_PERF_RETIRED" in result.stderr and perf_replay in result.stderr
          print("HISTORICAL_PERF_RETIREMENT=PASS private_inputs=5 shared_labels=3 fail_closed=2")
          files = [p.decode() for p in git("ls-files", "-z").split(b"\0") if p]
          candidates = {
              p: ("disabled-ci" if p.startswith(".github/workflows-disabled/") else
                  "ci-rewriter" if p.startswith("tools/ci/") and pathlib.PurePosixPath(p).name.startswith(("apply-", "patch-")) else
                  "ci-helper" if p.startswith(("tools/ci/", "tools/dev/")) else
                  "historical-doc")
              for p in files
              if (p.startswith(".github/workflows-disabled/") and p.endswith((".yml", ".yaml"))) or
                 (p.startswith(("tools/ci/", "tools/dev/")) and p.endswith((".py", ".sh", ".patch"))) or
                 p.startswith(("docs/architecture/review-", "docs/milestones/")) or
                 (p.startswith("docs/ci/") and p.endswith(".md"))
          }
          targets = defaultdict(set)
          for p in (deleted - shared_fixtures) | set(candidates):
              targets[pathlib.PurePosixPath(p).name].add(p)
          rx = re.compile("|".join(re.escape(n) for n in sorted(targets, key=len, reverse=True)))
          broad = re.compile(r"tools/dev/(?:pr(?:71|75|76|77)[^a-zA-Z0-9]|(?:patch-core-frontier|run-core-frontier|materialize)[-*?]|[*?])")
          dynamic = re.compile(r"workflows-disabled|tools/ci/(?:apply-|patch-)[*?]|tools/dev/[*?]")
          active, archived, docs = [], [], []
          consumers = defaultdict(set)
          dynamic_lines = []
          # Only audited, pre-existing guard/trigger/comment lines may name a
          # Git-only historical YAML. Current active YAMLs with the same basename
          # remain untouched. New consumers or modified reference lines still fail.
          archive_consumers = {
              ".github/workflows/linux-core-all3352.yml",
              ".github/workflows/linux-legacy-tag-router-v1.yml",
              ".github/workflows/linux-runtime-fdt-isolation-v1.yml",
              ".github/workflows/linux-runtime-spinlock-context-v0.yml",
              ".github/workflows/minipp-linux-frozen-v1.yml",
              ".github/workflows/toolchain-focused-regressions-v1.yml",
              ".github/workflows/toolchain-m0-structure.yml",
