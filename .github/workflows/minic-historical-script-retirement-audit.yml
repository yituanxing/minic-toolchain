                continue
              fi
              case "$file" in
                *.elf|*-rv64)
                  echo "CORE_BASIC_RUNTIME_ELF_RAW_DIFF case=$name file=$file"
                  riscv64-linux-gnu-objcopy --strip-all "$before/$file" "$work/old.stripped"
                  riscv64-linux-gnu-objcopy --strip-all "$BUILD_DIR/$file" "$work/new.stripped"
                  if ! cmp -s "$work/old.stripped" "$work/new.stripped"; then
                    # Permit only a validated GNU build-id descriptor difference.
                    # No other stripped byte is ignored.
                    python3 - "$work/old.stripped" "$work/new.stripped" <<'PY'
          import pathlib, struct, sys
          def normalize(path):
              data = bytearray(pathlib.Path(path).read_bytes())
              assert data[:6] == b"\x7fELF\x02\x01", "not ELF64 little-endian"
              shoff = struct.unpack_from("<Q", data, 40)[0]
              entsize, count, names_index = struct.unpack_from("<HHH", data, 58)
              assert entsize == 64 and 0 < names_index < count
              sections = [struct.unpack_from("<IIQQQQIIQQ", data, shoff+i*entsize) for i in range(count)]
              names_section = sections[names_index]
              names = data[names_section[4]:names_section[4]+names_section[5]]
              found = []
              for section in sections:
                  name = names[section[0]:].split(b"\0", 1)[0]
                  if name == b".note.gnu.build-id":
                      assert section[1] == 7 and section[5] == 36, "unexpected build-id note"
                      offset = section[4]
                      assert struct.unpack_from("<III", data, offset) == (4,20,3)
                      assert data[offset+12:offset+16] == b"GNU\0"
                      found.append(bytes(data[offset+16:offset+36]).hex())
                      data[offset+16:offset+36] = bytes(20)
              assert len(found) == 1, "expected one GNU build-id"
              return data, found[0]
          old, old_id = normalize(sys.argv[1])
          new, new_id = normalize(sys.argv[2])
          if old != new:
              diffs = [i for i,(a,b) in enumerate(zip(old,new)) if a != b]
              raise SystemExit(f"ELF_NON_BUILD_ID_DIFFERENCE lengths={len(old)},{len(new)} offsets={diffs[:20]}")
          assert old_id != new_id, "raw mismatch was not build-id"
          print(f"CORE_BASIC_RUNTIME_BUILD_ID_ONLY=PASS old={old_id} new={new_id}")
          PY
                  fi
                  riscv64-linux-gnu-readelf -Ws "$before/$file" > "$work/old.symbols.raw"
