name: MiniC historical script retirement audit
on:
  pull_request:
    branches:
      - cleanup/minic-c50-registry-20261124
    paths:
      - 'tests/compiler/c0/**'
      - 'tests/programs/c0/**'
      - 'tools/dev/**'
      - 'tools/ci/**'
      - 'docs/milestones/**'
      - 'docs/architecture/**'
      - '.github/workflows-disabled/**'
      - '.github/workflows/minic-historical-script-retirement-audit.yml'
permissions:
  contents: read
jobs:
  retired-script-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify retirement and inventory remaining historical dependencies
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          from collections import defaultdict, Counter
          
          base = "de72e2982e9576ec36a8110a371287300ed29937"
          audit = ".github/workflows/minic-historical-script-retirement-audit.yml"
          def git(*args):
              return subprocess.check_output(["git", *args])
          # Accepted exact tree plus native Runtime-only retirement.
          accepted = "9471bb1d1800dfbef52d7e86824ac81042d24ae5"
          def changed_paths(before, after, *options):
              return set(git("diff", "--no-renames", "--name-only", *options,
                             before, after).decode().splitlines())
          expected = changed_paths(base, accepted, "--diff-filter=D")
          metadata = changed_paths(base, accepted) - expected
          assert len(expected) == 858
          shared_fixtures = {
              "tests/programs/c0/cast_expressions.c",
              "tests/programs/c0/hexadecimal_expression.c",
              "tests/programs/c0/integer_bit_operations.c",
              "tests/programs/c0/prefix_decrement_update.c",
              "tests/programs/c0/unbounded_for_break.c",
          }
          historical_snapshot = "cd8786f4341c9de1049fe839fe37392b01faaa4a"
          historical_archives = {
              p for p in git("ls-tree", "-r", "--name-only", historical_snapshot,
                             "--", ".github/workflows-disabled/").decode().splitlines()
              if p.endswith(".yml")
          }
          assert len(historical_archives) == 68
          assert shared_fixtures <= expected and historical_archives <= expected
          retired_overlay = {
              "tools/ci/apply-cfg-annihilator-priority-v0.py",
              "tools/ci/apply-constant-call-leading-if-v0.py",
              "tools/ci/apply-constant-call-parameter-facts-v0.py",
              "tools/ci/apply-constant-cfg-product-v0.py",
              "tools/ci/apply-constant-if-external-reentry-v0.py",
              "tools/ci/apply-constant-inline-call-cfg-probe-v0.py",
              "tools/ci/apply-constant-inline-call-cfg-v0.py",
              "tools/ci/apply-constant-inline-call-cfg-v1.py",
              "tools/ci/apply-constant-inline-multireturn-v0.py",
              "tools/ci/apply-constant-internal-call-cfg-v0.py",
              "tools/ci/apply-core-unreachable-reentry-v0.py",
              "tools/ci/apply-empty-internal-void-call-elision-v0.py",
              "tools/ci/apply-if-local-fact-meet-v0.py",
              "tools/ci/apply-inline-specialization-boolean-range-v0.py",
              "tools/ci/apply-inline-specialization-boolean-range-v1.py",
              "tools/ci/apply-inline-specialization-local-boolean-domain-v0.py",
              "tools/ci/apply-local-integer-arithmetic-closure-v0.py",
              "tools/ci/apply-local-null-pointer-conditions-v0.py",
              "tools/ci/apply-loop-invariant-local-facts-v0.py",
              "tools/ci/apply-null-helper-first-return-v0.py",
              "tools/ci/apply-pointer-bitcast-integer-cfg-v0.py",
              "tools/ci/apply-pure-dereference-cfg-v0.py",
              "tools/ci/apply-residual-constant-closure-v0.py",
              "tools/ci/apply-rv64-static-pcrel-global-address-v0.py",
              "tools/ci/apply-small-constant-array-loop-cfg-v0.py",
              "tools/ci/apply-small-constant-loop-probe-v0.py",
              "tools/ci/apply-small-loop-for-init-expression-v0.py",
              "tools/ci/apply-statement-expression-constant-cfg-v0.py",
              "tools/ci/apply-statement-expression-postlower-fact-v0.py",
              "tools/ci/apply-static-const-global-cfg-v0.py",
              "tools/ci/apply-tail-cfg-closure-v0.py",
