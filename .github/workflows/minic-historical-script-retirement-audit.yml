              "tools/ci/apply-inline-specialization-symbolic-closed-integers-v0.py",
              "tools/ci/apply-inline-specialization-symbolic-integer-closure-v0.py",
              "tools/ci/apply-inline-specialization-symbolic-nested-array-v0.py",
              "tools/ci/apply-inline-specialization-symbolic-transitive-rewrite-v0.py",
              "tools/ci/apply-inline-specialization-transitive-integer-v0.py",
