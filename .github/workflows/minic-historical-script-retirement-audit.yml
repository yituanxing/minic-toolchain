              "tools/ci/apply-local-integer-constants-v0.py",
              "tools/ci/apply-local-integer-guard-facts-v0.py",
              "tools/ci/apply-local-integer-logical-conditions-v0.py",
              "tools/ci/apply-local-null-pointer-facts-v0.py",
              "tools/ci/apply-riscv64-default-text-section-v0.py",
              "tools/ci/apply-riscv64-explicit-section-flags-v0.py",
              "tools/ci/perf-v1-overrides/apply-inline-specialization-base-callee-integer-v0.py",
              "tools/ci/perf-v1-overrides/apply-inline-specialization-capacity-v0.py",
              "tools/ci/perf-v1-overrides/apply-inline-specialization-transitive-integer-v0.py",
          }
          assert retired_stack <= set(git("ls-tree", "-r", "--name-only", "fe0a83481864b2808f62098510b08df579ff42a5").decode().splitlines())
          expected |= retired_stack
          retired_perf_labels = {
              "tools/ci/apply-perf-parser-nearest-ordinary-scope-v1.py",
              "tools/ci/apply-perf-parser-typedef-index-v1.py",
          }
          assert retired_perf_labels <= set(git("ls-tree", "-r", "--name-only", "6fab77605806de54c2d73dfc0e81b799674d6a29").decode().splitlines())
          expected |= retired_perf_labels
          retired_rv64_labels = {
              "tools/ci/apply-riscv64-core-object-slot-reuse-cfg-hotfix-v0.py",
              "tools/ci/apply-riscv64-core-object-slot-reuse-v0.py",
              "tools/ci/apply-riscv64-core-value-slot-pack-v0.py",
              "tools/ci/apply-riscv64-core-value-slot-reuse-v0.py",
              "tools/ci/apply-riscv64-pi-local-symbol-address-v0.py",
              "tools/ci/apply-riscv64-structured-asm-used-callee-save-v0.py",
              "tools/ci/apply-perf-core-object-interval-onepass-v1.py",
          }
          retired_missing_source = {
