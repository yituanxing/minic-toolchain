            (cd "$before"; find . -type f | LC_ALL=C sort) > "$work/$name.old.files"
            (cd "$BUILD_DIR"; find . -type f | LC_ALL=C sort) > "$work/$name.new.files"
            cmp "$work/$name.old.files" "$work/$name.new.files"
            while IFS= read -r file; do
