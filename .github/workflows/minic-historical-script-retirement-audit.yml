              "tools/ci/apply-inline-specialization-label-alias-v0.py",
              "tools/ci/apply-inline-specialization-local-facts-v0.py",
              "tools/ci/apply-inline-specialization-original-reachability-v0.py",
              "tools/ci/apply-inline-specialization-resolved-asm-goto-v0.py",
              "tools/ci/apply-inline-specialization-stable-parameter-facts-v0.py",
