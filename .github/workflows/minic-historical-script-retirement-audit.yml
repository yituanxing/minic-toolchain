              "tools/ci/check_ci_miniobjcopy_elf_route_v1.py",
              "tools/ci/check_ci_regression_path_isolation_v1.py",
              "tools/ci/check_ci_trigger_coverage_v1.py",
              "tools/ci/check_early_runtime_dispatch_v1.py",
              "tools/ci/check_linux_core_3352_first500_union_v1.py",
              "tools/ci/check_linux_early_runtime_union_v1.py",
              "tools/ci/check_linux_efi_vdso_convergence_v1.py",
              "tools/ci/check_linux_expanded_pi_p1_convergence_v1.py",
              "tools/ci/check_linux_legacy_tag_router_v1.py",
              "tools/ci/check_linux_perf_optin_convergence_v1.py",
              "tools/ci/check_linux_runtime_contract_oracles_convergence_v1.py",
              "tools/ci/check_linux_runtime_diagnostic_union_v1.py",
              "tools/ci/check_linux_runtime_fdt_kallsyms_union_v1.py",
              "tools/ci/check_linux_runtime_fixture_producers_convergence_v1.py",
              "tools/ci/check_linux_runtime_fixture_restore_v1.py",
              "tools/ci/check_linux_runtime_focused_faults_convergence_v1.py",
              "tools/ci/check_linux_runtime_frontier_diagnostics_convergence_v1.py",
              "tools/ci/check_minias_semantic_convergence_v1.py",
              "tools/ci/check_minild_integration_convergence_v1.py",
              "tools/ci/check_minipp_frozen_convergence_v1.py",
              "tools/ci/check_minipp_live_frozen_merge_v1.py",
              "tools/ci/check_runtime_focused_owner_convergence_v1.py",
          }
          archive_reference_lines = {
              p: set(git("show", historical_snapshot + ":" + p).decode().splitlines())
              for p in archive_consumers
          }
          pinned_refs = []
          scanned = 0
          for path in files:
              if path == audit:
                  continue
              f = pathlib.Path(path)
              if not f.is_file():
                  raise SystemExit("Missing retained file: " + path)
              data = f.read_bytes()
              if b"\0" in data:
                  continue
              scanned += 1
              historical = path.startswith(".github/workflows-disabled/")
              document = path.startswith("docs/") or f.suffix.lower() in (".md", ".rst")
              for num, line in enumerate(data.decode("utf-8", errors="replace").splitlines(), 1):
                  found = set(rx.findall(line))
                  hits = {p for n in found for p in targets[n] if p != path}
                  removed = (hits & deleted) | {p for p in shared_fixtures if p in line}
                  if path in archive_reference_lines and line in archive_reference_lines[path]:
                      pinned = removed & historical_archives
                      if pinned:
                          pinned_refs.append(f"{path}:{num}: " + ", ".join(sorted(pinned)))
                          removed -= pinned
                  # These exact active-workflow keys refer to the live file,
                  # not its same-basename historical disabled YAML. The full
                  # live transformation was checked by historical_job_view.
                  if path == "tools/ci/historical_workflows.py":
                      for live_path in RETIRED_JOBS:
                          if line.strip() == f'"{live_path}": ' + ( '{"pi-runtime"},' if live_path.endswith("linux-expanded-pi-p1-runtime-v1.yml") else '{"cpu-stall", "fork-stack", "candidate"},'):
                              removed.discard(".github/workflows-disabled/" + pathlib.PurePosixPath(live_path).name)
                  # These immutable label-only checks read a receipt or reject
                  # an obsolete trigger path, never load a retired script.
                  if path == ".github/workflows/linux-expanded-kbuild-v0.yml":
                      for label in retired_rv64_labels:
                          if line.strip() == "grep -F '" + pathlib.PurePosixPath(label).name + "' \"$ev/profile/minic-profile.txt\"":
                              removed.discard(label)
                  if path == ".github/workflows/linux-runtime-focused-owners-v1.yml" and line.strip() == "grep -Fx 'apply-riscv64-core-object-slot-reuse-v0.py' \"$ev/profile/minic-profile.txt\"":
                      removed.discard("tools/ci/apply-riscv64-core-object-slot-reuse-v0.py")
                  if path == "tools/ci/check_ci_regression_path_isolation_v1.py" and line.strip().startswith('for bad in ("tools/ci/runtime-init-irq-trigger.txt","tools/ci/check_ci_trigger_coverage_v1.py","tools/ci/apply-perf-core-object-interval-onepass-v1.py",'):
                      removed.discard("tools/ci/apply-perf-core-object-interval-onepass-v1.py")
                  # Exact inert metadata labels are not executable callers.
                  if path == runtime_path and line in historical_labels:
                      removed -= retired_runtime | retired_stack | retired_rv64_labels
                  if removed or broad.search(line):
                      record = f"{path}:{num}: " + (", ".join(sorted(removed)) if removed else "possible dynamic path")
                      (archived if historical else docs if document else active).append(record)
                  for candidate in hits & set(candidates):
                      consumers[candidate].add(path)
                  if not historical and not document and dynamic.search(line):
                      dynamic_lines.append(f"{path}:{num}: {line.strip()[:220]}")
          for label, items in (("ACTIVE", active), ("ARCHIVE", archived), ("DOC", docs)):
              print(f"{label}_REFERENCES={len(items)}")
              for item in items:
                  print(item)
          print(f"PINNED_ARCHIVE_REFERENCES={len(pinned_refs)}")
          print(f"RETIREMENT_SCOPE=PASS deleted={len(deleted)} retained_text_scanned={scanned}")
          # Every nonretired performance step must keep its original executable
          # content. Ignore only blank/comment separators; the new guard is
          # deliberately fail-closed, not a PASS substitute for old experiments.
          perf_path = ".github/workflows/linux-runtime-optin-perf-suite-v1.yml"
          old_perf = git("show", "abae0fe2ab1c3d6c92058f33c299c57340d61432:" + perf_path).decode()
