name: MiniC historical script retirement audit
on:
  pull_request:
    branches:
      - cleanup/minic-repository-hygiene-20261124
    paths:
      - '.github/workflows-disabled/**'
      - 'tools/ci/**'
      - '.github/workflows/minic-historical-script-retirement-audit.yml'
permissions:
  contents: read
jobs:
  retired-script-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check retirement scope and references across all retained files
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          from collections import Counter

          base = "2b2cbd82b92460d5cde928e1e71e8662d976dbef"
          audit = ".github/workflows/minic-historical-script-retirement-audit.yml"
          def git(*args):
              return subprocess.check_output(["git", *args]).decode()
          deleted = set(git("diff", "--name-only", "--diff-filter=D", base, "HEAD").splitlines())
          changed = set(git("diff", "--name-only", base, "HEAD").splitlines())
          counts = Counter("archive" if p.startswith(".github/workflows-disabled/") and p.endswith(".yml")
                           else "rewrite" if p.startswith("tools/ci/apply-") and p.endswith(".py")
                           else "unexpected" for p in deleted)
          if counts != {"archive": 158, "rewrite": 4} or changed != deleted | {audit}:
              raise SystemExit(f"RETIREMENT_SCOPE=FAIL {counts}")
          names = {pathlib.PurePosixPath(p).name for p in deleted}
          rx = re.compile("|".join(re.escape(n) for n in sorted(names, key=len, reverse=True)))
          refs = []
          scanned = 0
          for p in git("ls-files", "-z").split("\0"):
              if not p or p == audit:
                  continue
              data = pathlib.Path(p).read_bytes()
              if b"\0" in data:
                  continue
              scanned += 1
              for n, line in enumerate(data.decode("utf-8", errors="replace").splitlines(), 1):
                  hits = set(rx.findall(line))
                  if hits:
                      refs.append(f"{p}:{n}: {', '.join(sorted(hits))}")
          print(f"RETIREMENT_SCOPE=PASS deleted={len(deleted)} retained_text_scanned={scanned}")
          for ref in refs:
              print(ref)
          if refs:
              raise SystemExit("RETIREMENT_REFERENCES=FAIL")
          print("RETIREMENT_REFERENCES=PASS no retained literal basename references")
          PY
