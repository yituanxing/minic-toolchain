          retired_runtime = {
              "tools/ci/apply-core-goto-label-fact-barrier-v0.py",
              "tools/ci/apply-core-if-condition-dominance-barrier-v0.py",
              "tools/ci/apply-local-asm-if-fact-barrier-v0.py",
