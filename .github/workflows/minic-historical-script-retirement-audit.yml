name: MiniC historical script retirement audit
on:
  pull_request:
    branches:
      - cleanup/minic-c50-registry-20261124
    paths:
      - 'tests/compiler/c0/**'
      - 'tests/programs/c0/**'
      - 'tools/dev/**'
      - 'tools/ci/**'
      - 'docs/milestones/**'
      - 'docs/architecture/**'
      - '.github/workflows-disabled/**'
      - '.github/workflows/minic-historical-script-retirement-audit.yml'
permissions:
  contents: read
jobs:
  retired-script-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
