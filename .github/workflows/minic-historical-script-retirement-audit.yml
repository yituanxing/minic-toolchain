            sh "tests/compiler/c0/$driver" "$name" > "$work/$name.new.stdout" 2> "$work/$name.new.stderr" || new_rc=$?
            test "$old_rc" -eq "$new_rc"
            before="$work/$name.old"
            (cd "$before"; find . -type f | LC_ALL=C sort) > "$work/$name.old.files"
            (cd "$BUILD_DIR"; find . -type f | LC_ALL=C sort) > "$work/$name.new.files"
            cmp "$work/$name.old.files" "$work/$name.new.files"
            while IFS= read -r file; do
              if cmp -s "$before/$file" "$BUILD_DIR/$file"; then continue; fi
              case "$name:$file" in
                gnu-record-compound-literal:*/minic-runtime|gnu-record-compound-literal:*/gcc-runtime)
                  bash "$RUNNER_TEMP/minic-compare-linked-elf.sh" riscv64-linux-gnu- "$before/$file" "$BUILD_DIR/$file" ;;
                record-array-range-once:*/x86|record-rvalue-array-member:*/input)
                  bash "$RUNNER_TEMP/minic-compare-linked-elf.sh" "" "$before/$file" "$BUILD_DIR/$file" ;;
                *) cmp "$before/$file" "$BUILD_DIR/$file" ;;
              esac
            done < "$work/$name.old.files"
            cmp "$work/$name.old.stdout" "$work/$name.new.stdout"
            cmp "$work/$name.old.stderr" "$work/$name.new.stderr"
            if test "$old_rc" -eq 0; then
              passed=$((passed+1))
            else
              baseline_failures=$((baseline_failures+1))
            fi
            echo "SOURCE_ASSEMBLY_EQUIVALENCE=PASS case=$name original_exit=$old_rc"
          done
          echo "SOURCE_ASSEMBLY_COMPARISON passed=$passed unchanged_baseline_fail=$baseline_failures"
          git diff --exit-code

      - name: Compare 21 original target probes with shared target driver
        shell: bash
        run: |
          set -Eeuo pipefail
          export MINIC_CC="$PWD/build/retirement-oracle/bin/minic-cc" HOST_CC=cc
          sh -n tests/compiler/c0/run-target-probe-case.sh
          work="$PWD/build/retirement-target-probe"
          mkdir -p "$work/bin"
          # Reuse identical temporary directory names on both arms, so
          # compiler diagnostics and assembly paths stay directly comparable.
          export PROBE_FIXED_TMP="$work/probe-work"
          cat > "$work/bin/mktemp" <<'SH'
          #!/bin/sh
          if [ "$#" -eq 1 ] && [ "$1" = -d ]; then
              mkdir -- "$PROBE_FIXED_TMP" || exit 1
              printf '%s\n' "$PROBE_FIXED_TMP"
          else
              exec /usr/bin/mktemp "$@"
          fi
          SH
          chmod +x "$work/bin/mktemp"
          export PATH="$work/bin:$PATH"
          passed=0
          baseline_failures=0
          for name in aarch64-linux-apple-aic-sysregs aarch64-linux-bpf-enum-acqrel aarch64-linux-lse-atomic-full aarch64-linux-debug-pmu-mrs-banks aarch64-linux-hyp-debug-qcom-sysregs aarch64-linux-hyp-spinlock-lse aarch64-linux-kvm-gic-registers aarch64-linux-kvm-kern-hyp-va-callback aarch64-linux-kvm-tlbi-range aarch64-linux-kvm-tlbi aarch64-linux-pstate-pan-tco-alternatives aarch64-linux-rcu-record-acquire-release aarch64-linux-efi-implicit-cache aarch64-linux-smmu-dynamic-dmb aarch64-linux-mrs-read-family aarch64-linux-smccc-v11-full aarch64-linux-tegra-ndiv-sysreg float32-const-eval runtime-designated-positional gnu-linux-nf-conntrack-size gnu-linux-task-mmu-swp-pfn-guard; do
            script="tests/compiler/c0/probe-$name.sh"
            test ! -e "$script"
            git show b424e87ac89e9ae5162a0fdcdb3af8d544c13e62:"$script" > "$script"
            test ! -e "$PROBE_FIXED_TMP"
            old_rc=0
            sh "$script" > "$work/$name.old.stdout" 2> "$work/$name.old.stderr" || old_rc=$?
            rm "$script"
            test ! -e "$PROBE_FIXED_TMP"
            new_rc=0
            sh tests/compiler/c0/run-target-probe-case.sh "$name" > "$work/$name.new.stdout" 2> "$work/$name.new.stderr" || new_rc=$?
            test ! -e "$PROBE_FIXED_TMP"
            test "$old_rc" -eq "$new_rc"
            cmp "$work/$name.old.stdout" "$work/$name.new.stdout"
            cmp "$work/$name.old.stderr" "$work/$name.new.stderr"
            if test "$old_rc" -eq 0; then passed=$((passed+1)); else baseline_failures=$((baseline_failures+1)); fi
            echo "TARGET_PROBE_EQUIVALENCE=PASS case=$name original_exit=$old_rc"
          done
          echo "TARGET_PROBE_COMPARISON passed=$passed unchanged_baseline_fail=$baseline_failures"
          git diff --exit-code

  full-source-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Whole-tree normalized and cross-target function clone census
        run: |
          python3 - <<'PY'
          import collections, difflib, hashlib, json, pathlib, re, subprocess
          files=subprocess.check_output(["git","ls-files","-z"]).decode().strip("\0").split("\0")
          sources=[p for p in files if p.startswith(("src/","include/","tools/minic/","tools/minic-cc/")) and p.endswith((".c",".h",".def"))]
          lex=re.compile(r'//[^\n]*|/\*[\s\S]*?\*/|"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'|[A-Za-z_]\w*|0[xX][0-9A-Fa-f]+|\d+|[^\s]')
          keywords=set("if else for while do switch case default break continue goto return sizeof struct union enum typedef const volatile static inline unsigned signed int long short char float double void bool true false NULL".split())
          functions=[]
          for p in sources:
              if not p.endswith((".c",".h")):continue
              s=pathlib.Path(p).read_text()
              ts=[m for m in lex.finditer(s) if not m.group().startswith(("//","/*"))]
              vals=[m.group() for m in ts]
              depth=0
              start=None
              for i,v in enumerate(vals):
                  if v=="{":
                      if depth==0 and i>2 and vals[i-1]==")":
                          j=i-1
                          par=1
                          while j>0 and par:
                              j-=1
                              par+=(vals[j]==")")-(vals[j]=="(")
                          if j>0 and re.fullmatch(r"[A-Za-z_]\w*",vals[j-1]):
                              start=(i,j-1,vals[j-1])
                      depth+=1
                  elif v=="}":
                      depth-=1
                      if depth==0 and start is not None:
                          a,j,name=start
                          if i-a>=35:
                              tokens=vals[a:i+1]
                              line=s.count("\n",0,ts[j].start())+1
                              end=s.count("\n",0,ts[i].end())+1
                              functions.append({"path":p,"name":name,"line":line,"end":end,"tokens":tokens})
                          start=None
          def shape(tokens,mode):
              identities={}
              out=[]
              for i,v in enumerate(tokens):
                  if not re.fullmatch(r"[A-Za-z_]\w*",v) or v in keywords or v.isupper():
                      out.append(v);continue
                  if mode=="safe" and (i+1<len(tokens) and tokens[i+1]=="(" or i and tokens[i-1] in (".",">")):
                      out.append(v);continue
                  if mode=="arch" and (i+1<len(tokens) and tokens[i+1]=="(" or i and tokens[i-1] in (".",">")):
                      out.append(re.sub(r'(?:minic_)?(?:rv32|rv64|riscv32|riscv64|riscv|aarch64|aarch|loongarch64|loong|x86_64|x86)_', '<target>_',v));continue
                  if v not in identities:identities[v]=len(identities)
                  out.append("ID"+str(identities[v]))
              return out
          groups=collections.defaultdict(list)
          for f in functions:
              for mode in ("safe","arch","shape"):
                  key=hashlib.sha256(" ".join(shape(f["tokens"],mode)).encode()).hexdigest()
                  groups[(mode,key)].append(f)
          seen=set()
          def desc(f):
              return {k:v for k,v in f.items() if k!="tokens"}
          def saved(g):
              return sum(f["end"]-f["line"]+1 for f in g)-max(f["end"]-f["line"]+1 for f in g)
          for (mode,key),g in sorted(groups.items(),key=lambda kv:-saved(kv[1])):
              if len(g)<2 or saved(g)<8:continue
              sig=tuple(sorted((f["path"],f["line"]) for f in g))
              if sig in seen:continue
              seen.add(sig)
              print("SOURCE_CLONE "+json.dumps({"mode":mode,"saved_upper_bound":saved(g),"functions":[desc(f) for f in g]},separators=(",",":")))
          # Cross-target similarly named long functions: compare token-shape sequences
          # without hiding literals, operators, control flow or target-only callbacks.
          by_name=collections.defaultdict(list)
          for f in functions:
              if not f["path"].startswith("src/target/") or len(f["tokens"])<70:continue
              name=re.sub(r'^(?:minic_)?(?:rv32|rv64|riscv32|riscv64|riscv|aarch64|aarch|loongarch64|loong|x86_64|x86)_','',f["name"])
              by_name[name].append(f)
          near=[]
          for name,g in by_name.items():
              if not 2<=len(g)<=12:continue
              for i,f in enumerate(g):
                  for h in g[i+1:]:
                      if f["path"]==h["path"]:continue
                      if not .7<=len(f["tokens"])/len(h["tokens"])<=1.43:continue
                      a,b=shape(f["tokens"],"arch"),shape(h["tokens"],"arch")
                      if len(a)>2000 or len(b)>2000:continue
                      ratio=difflib.SequenceMatcher(None,a,b,autojunk=False).ratio()
                      if ratio>=.78:
                          near.append((ratio,min(f["end"]-f["line"],h["end"]-h["line"]),f,h))
          for ratio,lines,f,h in sorted(near,key=lambda x:-x[0]*x[1])[:80]:
              print("SOURCE_NEAR "+json.dumps({"ratio":round(ratio,3),"lines":lines,"functions":[desc(f),desc(h)]},separators=(",",":")))
          print("SOURCE_CLONE_COUNTS "+json.dumps({"files":len(sources),"function_bodies":len(functions),"normalized_groups":len(seen),"near_pairs":len(near)}))
          # Full reference closure for duplicate machine-option entry points and small
          # files that may be folded without modifying unrelated build/test consumers.
          needles=["src/target/machine_options/aarch64.c","src/target/riscv32/machine_register.c","src/target/riscv64/machine_register.c","src/target/aarch64/machine_gnu_asm.c","src/target/loongarch64/machine_gnu_asm.c","minic_machine_options_aarch64","minic_machine_options_riscv32","minic_machine_options_riscv64","minic_riscv32_machine_fixed_register_read","minic_riscv64_machine_fixed_register_read","machine_options/target_policies.h"]
          rx=re.compile("|".join(re.escape(x) for x in needles))
          for p in files:
              if p==".github/workflows/minic-historical-script-retirement-audit.yml":continue
              data=pathlib.Path(p).read_bytes()
              if b"\0" in data:continue
              for n,l in enumerate(data.decode("utf-8",errors="replace").splitlines(),1):
                  if rx.search(l):print("SOURCE_PATH_REF "+json.dumps([p,n,l.strip()],ensure_ascii=True))
          PY
