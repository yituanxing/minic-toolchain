                  sed -E '/[[:space:]]FILE[[:space:]]/s@cc[[:alnum:]]+\.(o|s)$@<gcc-temporary>@' "$work/old.symbols.raw" > "$work/old.symbols"
                  sed -E '/[[:space:]]FILE[[:space:]]/s@cc[[:alnum:]]+\.(o|s)$@<gcc-temporary>@' "$work/new.symbols.raw" > "$work/new.symbols"
                  diff -u "$work/old.symbols" "$work/new.symbols"
                  echo "CORE_BASIC_RUNTIME_ELF_NORMALIZED_EQUIVALENCE=PASS case=$name file=$file"
