name: Materialize array-parameter adjustment lifetime

on:
  push:
    branches: [agent/linux-tail-pointer-array-v1]
    paths:
      - tools/dev/materialize-array-parameter-adjustment.py
      - .github/workflows/materialize-array-parameter-adjustment.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linux-tail-pointer-array-v1
          fetch-depth: 0
      - name: Materialize product code
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-array-parameter-adjustment.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build and run focused gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/array-param
          MINIC="$GITHUB_WORKSPACE/build/array-param/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/array-param-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-array-parameter-adjustment.sh
          MINIC="$GITHUB_WORKSPACE/build/array-param/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-array-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-static-pointer-arrays.sh
      - name: Write clean product commit
        run: |
          set -Eeuo pipefail
          git rm tools/dev/materialize-array-parameter-adjustment.py \
                 .github/workflows/materialize-array-parameter-adjustment.yml
          git add src/frontend/parser_declarator.c \
                  src/frontend/parser_internal.h \
                  src/frontend/parser_function.c \
                  tests/compiler/c0/array_parameter_adjustment.c \
                  tests/compiler/c0/run-array-parameter-adjustment.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(frontend): adjust array parameters without orphan types'
          git push origin HEAD:agent/linux-tail-pointer-array-v1
