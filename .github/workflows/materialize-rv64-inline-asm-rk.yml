name: Materialize RISC-V GNU asm rK alternative

on:
  push:
    branches: [agent/linux-tail-pointer-array-v1]
    paths:
      - tools/dev/materialize-rv64-inline-asm-rk.py
      - .github/workflows/materialize-rv64-inline-asm-rk.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linux-tail-pointer-array-v1
          fetch-depth: 0
      - name: Materialize product code
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-rv64-inline-asm-rk.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build and run focused gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/asm-rk
          MINIC="$GITHUB_WORKSPACE/build/asm-rk/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/asm-operands-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-inline-asm-operands.sh
          MINIC="$GITHUB_WORKSPACE/build/asm-rk/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/asm-goto-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-inline-asm-goto.sh
      - name: Write clean product commit
        run: |
          set -Eeuo pipefail
          git rm tools/dev/materialize-rv64-inline-asm-rk.py \
                 .github/workflows/materialize-rv64-inline-asm-rk.yml
          git add src/target/riscv64/codegen_inline_asm.c \
                  tests/compiler/c0/gnu_inline_asm_operands.c \
                  tests/compiler/c0/run-gnu-inline-asm-operands.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(riscv64): support GNU asm rK alternatives'
          git push origin HEAD:agent/linux-tail-pointer-array-v1
