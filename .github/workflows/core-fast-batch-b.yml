name: Core Fast Batch B

on:
  pull_request:

permissions:
  contents: write

jobs:
  batch-b:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-b-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply Batch B production changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-batch-b.py

      - name: Build exact patched compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-b-compiler

      - name: Focused CFG and aggregate regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-b-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-b-focused"
          mkdir -p "$work"

          cat >"$work/goto.i" <<'EOF'
          int goto_forward(int x) {
              if (x)
                  goto out;
              return 1;
          out:
              return 2;
          }

          int goto_backedge(int x) {
          again:
              if (x-- > 0)
                  goto again;
              return x;
          }
          EOF
          "$compiler" -S "$work/goto.i" -o "$work/goto-normal.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/goto.i" -o "$work/goto-strict.s"
          cmp "$work/goto-normal.s" "$work/goto-strict.s"
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 "$compiler" \
            -S "$work/goto.i" -o "$work/goto-core.s"

          cat >"$work/record-compound-return.i" <<'EOF'
          struct fd_like {
              void *file;
              unsigned int flags;
          };

          struct fd_like make_fd(unsigned long value) {
              return (struct fd_like){
                  (void *)(value & ~3UL),
                  (unsigned int)(value & 3UL)
              };
          }
          EOF
          "$compiler" -S "$work/record-compound-return.i" \
            -o "$work/record-compound-return-normal.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/record-compound-return.i" \
            -o "$work/record-compound-return-strict.s"
          cmp "$work/record-compound-return-normal.s" \
            "$work/record-compound-return-strict.s"
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 "$compiler" \
            -S "$work/record-compound-return.i" \
            -o "$work/record-compound-return-core.s"

          echo CORE_BATCH_B_FOCUSED_PASS

      - name: Strict sixteen frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-b-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-b-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 16 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '0,1,2,3,4,7,9,20,42,66,95,155,165,280,288,299'
          probe_status=$?
          set -e
          printf 'CORE_BATCH_B_STRICT16_STATUS=%d\n' "$probe_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 16 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 16 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-b-frontier/frontier-summary.json').read_text())
          p = json.loads(Path('build/core-batch-b-frontier/progress-summary.json').read_text())
          blockers = {b.get('function') for b in f.get('blockers', [])}
          print(
              'CORE_BATCH_B_RESULT '
              f"selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} "
              f"error={f['error']} distinct_blockers={len(f.get('blockers', []))} "
              f"tu_mean={p['tu_mean_progress'] * 100.0:.2f}% "
              f"tu_median={p['tu_median_progress'] * 100.0:.2f}% "
              f"line_weighted={p['line_weighted_progress'] * 100.0:.2f}%"
          )
          if f['selected'] != 16:
              raise SystemExit(f"expected 16 probes, got {f['selected']}")
          if f['error'] != 0:
              raise SystemExit(f"Batch B introduced Core lowering ERRORs: {f.get('errors', [])}")
          stale = blockers.intersection({'strncasecmp', 'seccomp_get_filter', '__to_fd'})
          if stale:
              raise SystemExit(f"Batch B target blockers did not clear: {sorted(stale)}")
          PY

      - name: Upload Batch B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-fast-batch-b-${{ github.run_id }}
          path: |
            build/core-batch-b-frontier/batch-results.json
            build/core-batch-b-frontier/batch-results.tsv
            build/core-batch-b-frontier/batch-summary.txt
            build/core-batch-b-frontier/failure-contexts.txt
            build/core-batch-b-frontier/frontier-summary.json
            build/core-batch-b-frontier/progress-summary.json
            build/core-batch-b-frontier/progress-summary.txt
            build/core-batch-b-frontier/minic-stderr
          if-no-files-found: warn

      - name: Persist qualified Batch B production tree
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/core/core_lower.c
          if git diff --cached --quiet; then
            echo CORE_BATCH_B_ALREADY_PERSISTED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'core: lower static goto and compound record returns'
          git push origin HEAD:refactor/declaration-sema-v1
