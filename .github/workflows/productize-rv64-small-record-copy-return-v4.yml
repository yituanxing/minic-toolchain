name: Productize RV64 Small Record Copy Return V4
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'product/rv64-small-record-copy-return-v4' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/rv64-small-record-copy-return-v4
          fetch-depth: 0
      - name: Apply proven product slice
        run: |
          set -Eeuo pipefail
          git fetch origin d66826cd6cf82e63f171fb2cd3f231ca7679ae7a
          git show d66826cd6cf82e63f171fb2cd3f231ca7679ae7a:tools/dev/materialize-rv64-small-record-copy-return-v1.py > tools/dev/materialize-rv64-small-record-copy-return-v1.py
          python3 tools/dev/materialize-rv64-small-record-copy-return-v1.py
          rm tools/dev/materialize-rv64-small-record-copy-return-v1.py
          cat > tests/compiler/c0/small_record_copy_return.c <<'EOF'
          typedef struct { unsigned value; } one_t;
          typedef struct { unsigned lo; unsigned hi; } two_t;
          static one_t make_one(unsigned value) {
              one_t out = { value };
              return out;
          }
          one_t choose_one(int condition, const one_t *stored) {
              return condition ? *stored : make_one(7U);
          }
          two_t assign_and_return(two_t *dst, two_t *src) {
              return *dst = *src;
          }
          int main(void) {
              one_t one = { 3U };
              two_t a = { 1U, 2U };
              two_t b = { 4U, 5U };
              one_t r = choose_one(1, &one);
              two_t p = assign_and_return(&a, &b);
              return (int)(r.value + p.lo + p.hi - 12U);
          }
          EOF
          cat > tests/compiler/c0/run-small-record-copy-return.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/small-record-copy-return
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/small_record_copy_return.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-small-record-copy-return.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'
          
          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-small-record-copy-return.sh"
          EOF
          rm .github/workflows/productize-rv64-small-record-copy-return-v4.yml
      - name: Validate product slice
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-small-record
          MINIC="$GITHUB_WORKSPACE/build/product-small-record/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-small-record" sh tests/compiler/c0/run-small-record-copy-return.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-small-record-fast
          git diff --check
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/target/riscv64/codegen_internal.h src/target/riscv64/codegen_expression.c src/target/riscv64/codegen_statement.c tests/compiler/c0/small_record_copy_return.c tests/compiler/c0/run-small-record-copy-return.sh tests/compiler/c0/run.sh .github/workflows/productize-rv64-small-record-copy-return-v4.yml
          git commit -m 'target: return small copied records in RV64 ABI registers'
          git push origin HEAD:product/rv64-small-record-copy-return-v4
