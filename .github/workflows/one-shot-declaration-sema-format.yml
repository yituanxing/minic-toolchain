name: One-shot Declaration Sema Format

on:
  push:
    branches:
      - refactor/declaration-sema-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Apply repository clang-format to touched frontend sources
        shell: bash
        run: |
          clang-format --version
          clang-format -i src/frontend/declaration_sema.h src/frontend/parser_global.c
          rm .github/workflows/one-shot-declaration-sema-format.yml
          git diff --check
          git diff -- src/frontend/declaration_sema.h src/frontend/parser_global.c
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format declaration sema production wiring"
          git push origin HEAD:refactor/declaration-sema-v1
