name: PR117 Clean Wide String Diff
on:
  push:
    branches: [agent/wide-string-literal-v0]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore narrow lexer test diff
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr117-cleanup.py
      - name: Validate clean product
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr117-clean-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-wide-string-literal.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr117-cleanup.py .github/workflows/pr117-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(frontend): keep wide string lexer coverage focused'
          git push origin HEAD:agent/wide-string-literal-v0
