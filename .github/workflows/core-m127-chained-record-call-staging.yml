name: Core M127 Chained Record Call Staging

on:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M127 chained record call patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m127-chained-record-call.py
          git diff --check
          grep -Fq 'M127_CHAINED_RECORD_MATERIALIZED_RHS' src/core/core_lower.c

      - name: Build patched compiler with Werror
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m127-compiler

      - name: Run strict chained-record-call regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > build/m127-chained-record-call.c <<'EOF'
          struct Stamp { long sec; long nsec; };
          struct Holder { struct Stamp first; struct Stamp second; };
          extern struct Stamp make_stamp(long);
          void assign_both(struct Holder *h, long x) {
              h->first = h->second = make_stamp(x);
          }
          EOF
          cc -E -P -x c build/m127-chained-record-call.c -o build/m127-chained-record-call.i
          MINIC_CORE_IR=strict build/m127-compiler/bin/minic -S \
            build/m127-chained-record-call.i -o build/m127-chained-record-call.s
          grep -Fq 'assign_both:' build/m127-chained-record-call.s
          printf '%s\n' 'PASS core/m127/chained-record-call strict=1'

      - name: Replay M127 eleven-TU cohort
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m127-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m127-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '307,388,390,408,409,410,415,471,473,478,484'
          status=$?
          set -e
          cat "$work/batch-results.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('build/m127-focused/batch-results.json').read_text())
          passed=sum(r['status']=='PASS' for r in rows)
          failed=len(rows)-passed
          errors=sum(r.get('locator') not in ('core_trace', None, '') for r in rows if r['status']!='PASS')
          print(f'CORE_M127_FOCUSED_EXACT selected={len(rows)} pass={passed} fail={failed} errors={errors}')
          if len(rows)!=11 or passed!=11:
              raise SystemExit('M127 focused cohort not 11/11 PASS')
          PY
          test "$status" -eq 0

      - name: Replay strict full500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m127-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m127-full500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4
          status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('build/m127-full500/batch-results.json').read_text())
          passed=sum(r['status']=='PASS' for r in rows)
          unsupported=sum(r['status']!='PASS' and r.get('locator')=='core_trace' for r in rows)
          errors=len(rows)-passed-unsupported
          print(f'CORE_M127_FULL500_EXACT selected={len(rows)} pass={passed} unsupported={unsupported} error={errors}')
          if len(rows)!=500 or errors!=0 or passed<454:
              raise SystemExit('M127 full500 regression')
          PY
          # corpus_replay returns nonzero while unsupported TUs remain; exact JSON owns the gate.

      - name: Persist qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m127-chained-record-call-${{ github.sha }}
          path: |
            build/m127-focused/batch-results.json
            build/m127-focused/minic-stderr/**
            build/m127-full500/batch-results.json
            build/m127-full500/minic-stderr/**
            build/m127-chained-record-call.s
          if-no-files-found: warn
