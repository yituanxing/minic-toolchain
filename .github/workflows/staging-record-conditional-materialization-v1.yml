name: Staging Record Conditional Materialization V1

on:
  push:
    branches: [staging/record-conditional-materialization-v1]

permissions:
  contents: write

concurrency:
  group: staging-record-conditional-materialization-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18 gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Apply record conditional materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/stage-record-conditional-materialization.py
          chmod +x tests/compiler/c0/run-record-conditional-materialization.sh

      - name: Canonical formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          clang-format-18 -i \
            src/frontend/ast.c \
            src/target/riscv64/codegen_expression.c \
            tests/compiler/c0/record_conditional_materialization.c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/compiler/c0/run.sh')
          path.write_text(path.read_text().rstrip() + '\n')
          PY

      - name: Release Werror build
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/staging-record-conditional

      - name: Focused record conditional regression
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/staging-record-conditional/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-record-conditional-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-record-conditional-materialization.sh

      - name: Preserve existing record rvalue paths
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/staging-record-conditional/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-record-rvalue-member" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-record-rvalue-member.sh
          MINIC="$GITHUB_WORKSPACE/build/staging-record-conditional/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-statement-record-value" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-statement-record-value.sh

      - name: Broad C0 suite
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/staging-record-conditional check-fast

      - name: Foundation focused suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/staging-record-conditional/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-record-conditional-foundation" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish validated product diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add \
            src/frontend/ast.c \
            src/target/riscv64/codegen_expression.c \
            tests/compiler/c0/record_conditional_materialization.c \
            tests/compiler/c0/run-record-conditional-materialization.sh \
            tests/compiler/c0/run.sh
          git diff --cached --check
          git commit -m 'frontend: materialize conditional record rvalues [publish-v1]'
          git push origin HEAD:staging/record-conditional-materialization-v1
