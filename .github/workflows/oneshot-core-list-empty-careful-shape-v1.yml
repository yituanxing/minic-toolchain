name: One-shot Core list_empty_careful Shape Probe

on:
  pull_request:

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-list-empty-careful-probe-compiler
      - name: Probe list_empty_careful layers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-list-empty-careful-probe-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-list-empty-careful-probe"
          mkdir -p "$work"

          cat >"$work/a-local-pointer.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_local_pointer(const struct node *head) {
              struct node *next = head->next;
              return next == head;
          }
          EOF

          cat >"$work/b-read-once-local.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_read_once_local(const struct node *head) {
              struct node *next = ({ (*(struct node * const volatile *)&(head->next)); });
              return next == head;
          }
          EOF

          cat >"$work/c-acquire-local.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_acquire_local(const struct node *head) {
              struct node *next = ({
                  struct node *value = ({ (*(struct node * const volatile *)&(head->next)); });
                  __asm__ __volatile__("fence r,rw" : : : "memory");
                  value;
              });
              return next == head;
          }
          EOF

          cat >"$work/d-logical-and.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_logical_and(const struct node *head) {
              struct node *next = head->next;
              return (next == head) && (next == head->prev);
          }
          EOF

          cat >"$work/e-equivalent-if.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_equivalent_if(const struct node *head) {
              struct node *next = head->next;
              if (next != head)
                  return 0;
              return next == head->prev;
          }
          EOF

          cat >"$work/f-full-shape.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_full_shape(const struct node *head) {
              struct node *next = ({
                  struct node *value = ({ (*(struct node * const volatile *)&(head->next)); });
                  __asm__ __volatile__("fence r,rw" : : : "memory");
                  value;
              });
              return (next == head) &&
                     (next == ({ (*(struct node * const volatile *)&(head->prev)); }));
          }
          EOF

          for input in "$work"/*.i; do
            name=$(basename "$input" .i)
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name.s" \
              >"$work/$name.out" 2>"$work/$name.err"
            rc=$?
            set -e
            printf 'CORE_LIST_EMPTY_CAREFUL_SHAPE name=%s rc=%d\n' "$name" "$rc"
            sed 's/^/CORE_LIST_EMPTY_CAREFUL_DIAG /' "$work/$name.err"
          done

          test -s "$work/a-local-pointer.s"
          test -s "$work/b-read-once-local.s"
          test -s "$work/c-acquire-local.s"
          test ! -s "$work/d-logical-and.s"
          test -s "$work/e-equivalent-if.s"
          test ! -s "$work/f-full-shape.s"
          printf '%s\n' 'PASS core/list-empty-careful-shape logical-and-isolated'