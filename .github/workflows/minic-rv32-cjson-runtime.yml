name: MiniC RV32I Real Software Runtime

on:
  pull_request:
    paths:
      # All shared MiniC semantics can affect RV32 ILP32 real software.
      - "src/frontend/**"
      - "src/core/**"
      - "src/compiler/**"
      - "src/target/common/**"
      - "src/target/target_info*"
      - "src/target/data_layout*"
      - "include/minic/**"
      - "tools/minic/**"
      - "tools/minic-cc/**"
      - "src/target/riscv/**"
      - "src/target/riscv32/**"
      # Re-qualify shared Core admission for RV32 psABI frames.
      - 'src/target/common/core_function_facts.c'
      - 'src/target/common/core_function_facts.h'
      - 'src/target/common/core_function_plan.c'
      - "src/target/riscv64/isa.c"
      - "src/target/riscv64/isa.h"
      - "tests/compiler/c0/probe-riscv-shared-word-operations.sh"
      - "tests/compiler/c0/probe-rv32-pic-gnu-elf-qemu.sh"
      - "tests/compiler/c0/elf_hidden_undefined_pic.c"
      - "tests/compiler/c0/elf_hidden_undefined_pic_owner.c"
      - ".github/workflows/minic-rv32-cjson-runtime.yml"
  push:
    branches: [main]
    paths:
      - "src/compiler/**"
      - "src/target/common/**"
      - "src/target/target_info*"
      - "src/target/data_layout*"
      - "include/minic/**"
      - "tools/minic/**"
      - "tools/minic-cc/**"
      - "src/core/**"
      - "src/frontend/**"
      - "src/target/riscv32/**"
      - "src/target/riscv64/isa.c"
      - "src/target/riscv64/isa.h"
      - "src/target/riscv/**"
      - "tests/compiler/c0/probe-rv32-cjson-picolibc-qemu.sh"
      - "tests/compiler/c0/probe-rv32-cjson-frontier.sh"
      - "tests/compiler/c0/rv32-linux-picolibc-start.S"
      - "tests/compiler/c0/rv32-linux-picolibc-syscalls.c"
      - "tests/external/cjson/**"
      - "tests/compiler/c0/probe-rv32-zlib-picolibc-qemu.sh"
      - "tests/compiler/c0/probe-rv32-lua-picolibc-qemu.sh"
      - "tests/compiler/c0/probe-rv32-zstd-picolibc-qemu.sh"
      - "tests/compiler/c0/probe-rv32-musl-busybox-kbuild.sh"
      - "tests/compiler/c0/probe-rv32-dynamic-frame-qemu.sh"
      - "tests/compiler/c0/probe-rv32-pic-gnu-elf-qemu.sh"
      - "tests/compiler/c0/elf_hidden_undefined_pic.c"
      - "tests/compiler/c0/elf_hidden_undefined_pic_owner.c"
      - "tests/compiler/c0/probe-core-volatile-update-qemu.sh"
      - "tests/external/lua/**"
      - "tests/compiler/c0/probe-rv32-variadic-gcc-qemu.sh"
      - "tests/compiler/c0/rv32-linux-picolibc-posix.c"
      - "tests/compiler/c0/rv32-linux-picolibc-errno.c"
      - "tests/vendor/cjson/upstream/**"
      - "tests/external/zlib/**"
      - ".github/workflows/minic-rv32-cjson-runtime.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rv32-cjson-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream-picolibc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install external ILP32 libc and QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          for src in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$src" ]; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$src"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf \
            linux-libc-dev-riscv64-cross
          riscv64-unknown-elf-gcc --print-multi-lib | grep 'rv32i/ilp32'
      - name: Strictly build MiniC and MiniAS once
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/rv32cjson all
      - name: RV32 ELF32 PIC hidden/default GNU AS LD QEMU differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
            bash tests/compiler/c0/probe-rv32-pic-gnu-elf-qemu.sh
      - name: RV32 dynamic frame and 12-argument stack-call GCC/MiniC QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
          MINIAS="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-as" \
            bash tests/compiler/c0/probe-rv32-dynamic-frame-qemu.sh
      - name: Core volatile pre/post scalar update x86/RV32 differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
          MINIAS="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-as" \
            bash tests/compiler/c0/probe-core-volatile-update-qemu.sh
      - name: Upstream cJSON full GNU/MiniC QEMU differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
          MINIAS="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-as" \
            bash tests/compiler/c0/probe-rv32-cjson-picolibc-qemu.sh
      - name: Upstream zlib all 15 TUs real QEMU differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
          MINIAS="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-as" \
            bash tests/compiler/c0/probe-rv32-zlib-picolibc-qemu.sh
      - name: Official Zstandard 1.5.7 full portable library GNU and MiniC QEMU differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
          MINIAS="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-as" \
            bash tests/compiler/c0/probe-rv32-zstd-picolibc-qemu.sh
      - name: ACCEPTANCE genuine RV32 musl BusyBox Kbuild MiniC owners and QEMU
        # Full 145/145 persistent C-owner SHA+receipt+GNU/QEMU acceptance is
        # blocking. Transient GNU compiler-feature probes are not program owners.
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
            bash tests/compiler/c0/probe-rv32-musl-busybox-kbuild.sh
      - name: Original Lua 5.5.0 full 34-TU RV32I interpreter differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-cc" \
          MINIAS="$GITHUB_WORKSPACE/build/rv32cjson/bin/minic-as" \
            bash tests/compiler/c0/probe-rv32-lua-picolibc-qemu.sh
