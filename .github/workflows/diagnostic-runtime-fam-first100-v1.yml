name: Diagnostic Runtime FAM First100 V1

on:
  push:
    branches:
      - diagnostic/runtime-fam-first100-v1

permissions:
  contents: read

jobs:
  first100:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout clean product candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore diagnostic batch probe only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh \
            > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Build clean candidate and run fixed first100
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/first100-compiler
          set +e
          MINIC="$GITHUB_WORKSPACE/build/first100-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/first100-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/first100-linux/batch-summary.txt
          printf 'FIRST100_STATUS=%s\n' "$status"
          test "$status" -eq 1
          grep -F 'selected_c_tus=100' build/first100-linux/batch-summary.txt >/dev/null
          grep -F 'pass=81' build/first100-linux/batch-summary.txt >/dev/null
          grep -F 'fail=19' build/first100-linux/batch-summary.txt >/dev/null
