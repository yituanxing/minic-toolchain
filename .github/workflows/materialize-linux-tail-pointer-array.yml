name: Materialize Linux tail pointer-array family

on:
  push:
    branches:
      - agent/linux-tail-pointer-array-v1
    paths:
      - tools/dev/materialize-linux-tail-pointer-array.py
      - .github/workflows/materialize-linux-tail-pointer-array.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linux-tail-pointer-array-v1
          fetch-depth: 0
      - name: Materialize product code
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-linux-tail-pointer-array.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/compiler/c0/run-static-pointer-arrays.sh')
          text = path.read_text()
          old = "grep -F '  .dword .Lminic_string_0' \"$work/static_pointer_array.s\" >/dev/null\ngrep -F '  .dword .Lminic_string_1' \"$work/static_pointer_array.s\" >/dev/null\n"
          new = "test \"$(grep -Fc '  .dword .Lminic_string_' \"$work/static_pointer_array.s\")\" -eq 2\n"
          if text.count(old) != 1:
              raise SystemExit('string relocation assertions: expected one match')
          path.write_text(text.replace(old, new, 1))
          PY
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build and run focused gate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/tail-pointer-array
          MINIC="$GITHUB_WORKSPACE/build/tail-pointer-array/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/tail-pointer-array-focused" \
          HOST_CC=cc \
            sh -x tests/compiler/c0/run-static-pointer-arrays.sh
      - name: Write clean product commit
        run: |
          set -Eeuo pipefail
          git rm tools/dev/materialize-linux-tail-pointer-array.py \
                 .github/workflows/materialize-linux-tail-pointer-array.yml
          git add src/frontend/parser_global.c \
                  tests/compiler/c0/static_pointer_array.c \
                  tests/compiler/c0/run-static-pointer-arrays.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(frontend): generalize static pointer-array initializers'
          git push origin HEAD:agent/linux-tail-pointer-array-v1
