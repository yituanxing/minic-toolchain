name: Apply long type slice

on:
  push:
    branches:
      - frontend/rv64-long-integers
    paths:
      - '.github/workflows/apply-long-type-slice.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
          fetch-depth: 0

      - name: Apply focused long type changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/frontend/token.h",
              "    MINIC_TOKEN_KW_LONG,\n    MINIC_TOKEN_KW_UNSIGNED,",
              "    MINIC_TOKEN_KW_LONG,\n    MINIC_TOKEN_KW_SIGNED,\n    MINIC_TOKEN_KW_UNSIGNED,",
          )
          replace_once(
              "src/frontend/token.c",
              "    case MINIC_TOKEN_KW_LONG:\n        return \"long\";\n    case MINIC_TOKEN_KW_UNSIGNED:",
              "    case MINIC_TOKEN_KW_LONG:\n        return \"long\";\n    case MINIC_TOKEN_KW_SIGNED:\n        return \"signed\";\n    case MINIC_TOKEN_KW_UNSIGNED:",
          )
          replace_once(
              "src/frontend/lexer.c",
              "    if (length == 4U && memcmp(text, \"long\", 4U) == 0) {\n        return MINIC_TOKEN_KW_LONG;\n    }\n    if (length == 8U && memcmp(text, \"unsigned\", 8U) == 0) {",
              "    if (length == 4U && memcmp(text, \"long\", 4U) == 0) {\n        return MINIC_TOKEN_KW_LONG;\n    }\n    if (length == 6U && memcmp(text, \"signed\", 6U) == 0) {\n        return MINIC_TOKEN_KW_SIGNED;\n    }\n    if (length == 8U && memcmp(text, \"unsigned\", 8U) == 0) {",
          )
          replace_once(
              "tests/frontend/token_model_test.c",
              "        expect_name(MINIC_TOKEN_KW_LONG, \"long\") != 0 ||",
              "        expect_name(MINIC_TOKEN_KW_LONG, \"long\") != 0 ||\n        expect_name(MINIC_TOKEN_KW_SIGNED, \"signed\") != 0 ||",
          )
          lexer_path = Path("tests/frontend/lexer_test.c")
          lexer_text = lexer_path.read_text()
          marker = "static int test_long_keyword_boundaries(void)\n"
          if lexer_text.count(marker) != 1:
              raise SystemExit("lexer long test marker mismatch")
          signed_test = '''static int test_signed_keyword_boundaries(void)
{
    static const char source[] = "signed signed_value signedness";
    MinicLexer lexer;

    minic_lexer_initialize(&lexer, "signed.c", source, sizeof(source) - 1U);
    if (expect_token(&lexer, MINIC_TOKEN_KW_SIGNED, 1U, 1U) != 0 ||
        expect_token(&lexer, MINIC_TOKEN_IDENTIFIER, 1U, 8U) != 0 ||
        expect_token(&lexer, MINIC_TOKEN_IDENTIFIER, 1U, 21U) != 0 ||
        expect_token(&lexer, MINIC_TOKEN_EOF, 1U, 31U) != 0) {
        return 1;
    }
    return 0;
}

'''
          lexer_text = lexer_text.replace(marker, signed_test + marker, 1)
          if lexer_text.count("        test_long_keyword_boundaries() != 0 ||") != 1:
              raise SystemExit("lexer main long marker mismatch")
          lexer_text = lexer_text.replace(
              "        test_long_keyword_boundaries() != 0 ||",
              "        test_signed_keyword_boundaries() != 0 ||\n        test_long_keyword_boundaries() != 0 ||",
              1,
          )
          lexer_path.write_text(lexer_text)

          replace_once(
              "src/frontend/type.h",
              "    MINIC_INTEGER_RANK_CHAR,\n    MINIC_INTEGER_RANK_INT",
              "    MINIC_INTEGER_RANK_CHAR,\n    MINIC_INTEGER_RANK_INT,\n    MINIC_INTEGER_RANK_LONG",
          )
          replace_once(
              "src/frontend/type.h",
              "MinicType minic_type_int(void);\nMinicType minic_type_unsigned_int(void);",
              "MinicType minic_type_int(void);\nMinicType minic_type_unsigned_int(void);\nMinicType minic_type_long(void);\nMinicType minic_type_unsigned_long(void);",
          )
          replace_once(
              "src/frontend/type.h",
              "bool minic_type_is_char_integer(MinicType type);",
              "bool minic_type_is_char_integer(MinicType type);\nbool minic_type_is_long_integer(MinicType type);",
          )

          type_path = Path("src/frontend/type.c")
          type_text = type_path.read_text()
          replace = '''MinicType minic_type_unsigned_int(void) {
    return minic_type_integer(MINIC_INTEGER_SIGN_UNSIGNED, MINIC_INTEGER_RANK_INT);
}

MinicType minic_type_long(void) {
    return minic_type_integer(MINIC_INTEGER_SIGN_SIGNED, MINIC_INTEGER_RANK_LONG);
}

MinicType minic_type_unsigned_long(void) {
    return minic_type_integer(MINIC_INTEGER_SIGN_UNSIGNED, MINIC_INTEGER_RANK_LONG);
}'''
          old = '''MinicType minic_type_unsigned_int(void) {
    return minic_type_integer(MINIC_INTEGER_SIGN_UNSIGNED, MINIC_INTEGER_RANK_INT);
}'''
          if type_text.count(old) != 1:
              raise SystemExit("type constructors marker mismatch")
          type_text = type_text.replace(old, replace, 1)

          promotion_pattern = re.compile(
              r"bool minic_type_integer_promotion\(MinicType type, MinicType \*result\) \{.*?\n\}\n\nbool minic_type_integer_common\(MinicType left, MinicType right, MinicType \*result\) \{.*?\n\}",
              re.S,
          )
          promotion_replacement = '''bool minic_type_integer_promotion(MinicType type, MinicType *result) {
    if (result == NULL || !minic_type_is_integer(type)) {
        return false;
    }
    if (type.integer_rank == MINIC_INTEGER_RANK_CHAR) {
        *result = minic_type_int();
        return true;
    }
    if (type.integer_rank == MINIC_INTEGER_RANK_INT ||
        type.integer_rank == MINIC_INTEGER_RANK_LONG) {
        *result = type;
        return true;
    }
    return false;
}

static MinicType minic_type_integer_with_rank(MinicIntegerSign sign, MinicIntegerRank rank) {
    return minic_type_integer(sign, rank);
}

bool minic_type_integer_common(MinicType left, MinicType right, MinicType *result) {
    MinicType promoted_left;
    MinicType promoted_right;
    MinicType signed_type;
    MinicType unsigned_type;

    if (result == NULL || !minic_type_integer_promotion(left, &promoted_left) ||
        !minic_type_integer_promotion(right, &promoted_right)) {
        return false;
    }
    if (minic_type_equal(promoted_left, promoted_right)) {
        *result = promoted_left;
        return true;
    }
    if (promoted_left.integer_sign == promoted_right.integer_sign) {
        *result = promoted_left.integer_rank > promoted_right.integer_rank ? promoted_left
                                                                           : promoted_right;
        return true;
    }

    signed_type = minic_type_is_signed_integer(promoted_left) ? promoted_left : promoted_right;
    unsigned_type = minic_type_is_unsigned_integer(promoted_left) ? promoted_left : promoted_right;
    if (unsigned_type.integer_rank >= signed_type.integer_rank) {
        *result = minic_type_integer_with_rank(
            MINIC_INTEGER_SIGN_UNSIGNED, unsigned_type.integer_rank);
        return true;
    }

    /* On the active RV64 data model, signed long represents every unsigned int value. */
    if (signed_type.integer_rank == MINIC_INTEGER_RANK_LONG &&
        unsigned_type.integer_rank == MINIC_INTEGER_RANK_INT) {
        *result = signed_type;
        return true;
    }

    *result = minic_type_integer_with_rank(
        MINIC_INTEGER_SIGN_UNSIGNED, signed_type.integer_rank);
    return true;
}'''
          type_text, count = promotion_pattern.subn(promotion_replacement, type_text, count=1)
          if count != 1:
              raise SystemExit("type promotion/common block mismatch")
          type_text = type_text.replace(
              "           (type.integer_rank == MINIC_INTEGER_RANK_CHAR ||\n            type.integer_rank == MINIC_INTEGER_RANK_INT) &&",
              "           (type.integer_rank == MINIC_INTEGER_RANK_CHAR ||\n            type.integer_rank == MINIC_INTEGER_RANK_INT ||\n            type.integer_rank == MINIC_INTEGER_RANK_LONG) &&",
              1,
          )
          type_text = type_text.replace(
              "bool minic_type_is_char_integer(MinicType type) {\n    return minic_type_is_integer(type) && type.integer_rank == MINIC_INTEGER_RANK_CHAR;\n}",
              "bool minic_type_is_char_integer(MinicType type) {\n    return minic_type_is_integer(type) && type.integer_rank == MINIC_INTEGER_RANK_CHAR;\n}\n\nbool minic_type_is_long_integer(MinicType type) {\n    return minic_type_is_integer(type) && type.integer_rank == MINIC_INTEGER_RANK_LONG;\n}",
              1,
          )
          type_path.write_text(type_text)

          parser_path = Path("src/frontend/parser_type.c")
          parser_text = parser_path.read_text()
          function_pattern = re.compile(
              r"bool minic_parser_parse_type_specifiers\(MinicParser \*parser, MinicType \*type\) \{.*?\n\}\n\nbool minic_parser_parse_pointer_declarator",
              re.S,
          )
          function_replacement = '''static bool minic_parser_is_integer_type_specifier(MinicTokenKind kind) {
    return kind == MINIC_TOKEN_KW_CHAR || kind == MINIC_TOKEN_KW_INT ||
           kind == MINIC_TOKEN_KW_LONG || kind == MINIC_TOKEN_KW_SIGNED ||
           kind == MINIC_TOKEN_KW_UNSIGNED;
}

bool minic_parser_parse_type_specifiers(MinicParser *parser, MinicType *type) {
    MinicType parsed_type;
    bool is_const;

    if (type == NULL) {
        minic_parser_error(parser, "internal error: missing parsed type output");
        return false;
    }

    is_const = false;
    if (parser->current.kind == MINIC_TOKEN_KW_CONST) {
        is_const = true;
        if (!minic_parser_advance(parser)) {
            return false;
        }
    }

    if (minic_parser_is_integer_type_specifier(parser->current.kind)) {
        bool saw_char = false;
        bool saw_int = false;
        bool saw_long = false;
        bool saw_signed = false;
        bool saw_unsigned = false;

        while (minic_parser_is_integer_type_specifier(parser->current.kind)) {
            switch (parser->current.kind) {
            case MINIC_TOKEN_KW_CHAR:
                if (saw_char) {
                    minic_parser_error(parser, "duplicate char type specifier");
                    return false;
                }
                saw_char = true;
                break;
            case MINIC_TOKEN_KW_INT:
                if (saw_int) {
                    minic_parser_error(parser, "duplicate int type specifier");
                    return false;
                }
                saw_int = true;
                break;
            case MINIC_TOKEN_KW_LONG:
                if (saw_long) {
                    minic_parser_error(parser, "long long is not supported");
                    return false;
                }
                saw_long = true;
                break;
            case MINIC_TOKEN_KW_SIGNED:
                if (saw_signed) {
                    minic_parser_error(parser, "duplicate signed type specifier");
                    return false;
                }
                saw_signed = true;
                break;
            case MINIC_TOKEN_KW_UNSIGNED:
                if (saw_unsigned) {
                    minic_parser_error(parser, "duplicate unsigned type specifier");
                    return false;
                }
                saw_unsigned = true;
                break;
            default:
                return false;
            }
            if (!minic_parser_advance(parser)) {
                return false;
            }
        }

        if (saw_signed && saw_unsigned) {
            minic_parser_error(parser, "conflicting signed and unsigned type specifiers");
            return false;
        }
        if (saw_char) {
            if (saw_long || saw_int) {
                minic_parser_error(parser, "char cannot be combined with int or long");
                return false;
            }
            if (saw_signed) {
                minic_parser_error(parser, "signed char is not supported");
                return false;
            }
            if (!saw_unsigned) {
                minic_parser_error(parser, "expected type name");
                return false;
            }
            parsed_type = minic_type_unsigned_char();
        } else if (saw_long) {
            parsed_type = saw_unsigned ? minic_type_unsigned_long() : minic_type_long();
        } else {
            parsed_type = saw_unsigned ? minic_type_unsigned_int() : minic_type_int();
        }
    } else if (parser->current.kind == MINIC_TOKEN_KW_VOID) {
        parsed_type = minic_type_void();
        if (!minic_parser_advance(parser)) {
            return false;
        }
    } else if (parser->current.kind == MINIC_TOKEN_KW_STRUCT) {
        MinicRecordId record_id;
        const MinicRecord *record;

        if (!minic_parser_advance(parser) || parser->current.kind != MINIC_TOKEN_IDENTIFIER) {
            minic_parser_error(parser, "expected record tag after 'struct'");
            return false;
        }
        record_id = minic_parser_find_record(parser, parser->current.span);
        record = minic_c0_program_record(parser->program, record_id);
        if (record == NULL || !record->is_complete) {
            minic_parser_error(parser, "use of undeclared record tag");
            return false;
        }
        parsed_type = minic_type_record(record_id);
        if (!minic_parser_advance(parser)) {
            return false;
        }
    } else if (parser->current.kind == MINIC_TOKEN_IDENTIFIER) {
        MinicTypeAliasId alias_id;
        const MinicTypeAlias *alias;

        alias_id = minic_parser_find_type_alias(parser, parser->current.span);
        alias = minic_c0_program_type_alias(parser->program, alias_id);
        if (alias == NULL) {
            minic_parser_error(parser, "expected type name");
            return false;
        }
        parsed_type = alias->type;
        if (!minic_parser_advance(parser)) {
            return false;
        }
    } else {
        minic_parser_error(parser, "expected type name");
        return false;
    }

    if (is_const && !minic_type_add_const(parsed_type, &parsed_type)) {
        minic_parser_error(parser, "cannot apply const qualifier");
        return false;
    }
    *type = parsed_type;
    return true;
}

bool minic_parser_parse_pointer_declarator'''
          parser_text, count = function_pattern.subn(function_replacement, parser_text, count=1)
          if count != 1:
              raise SystemExit("parser type function block mismatch")
          parser_path.write_text(parser_text)

          replace_once(
              "src/target/riscv64/layout.c",
              "        if (minic_type_is_char_integer(type)) {\n            *size = 1U;\n            *alignment = 1U;\n        } else {\n            *size = 4U;\n            *alignment = 4U;\n        }",
              "        if (minic_type_is_char_integer(type)) {\n            *size = 1U;\n            *alignment = 1U;\n        } else if (minic_type_is_long_integer(type)) {\n            *size = 8U;\n            *alignment = 8U;\n        } else {\n            *size = 4U;\n            *alignment = 4U;\n        }",
          )

          type_test = Path("tests/frontend/type_test.c")
          text = type_test.read_text()
          text = text.replace(
              "    MinicType unsigned_integer_type;\n    MinicType unsigned_pointer_type;",
              "    MinicType unsigned_integer_type;\n    MinicType signed_long_type;\n    MinicType unsigned_long_type;\n    MinicType unsigned_pointer_type;",
              1,
          )
          marker = "    unsigned_char_type = minic_type_unsigned_char();\n"
          block = '''    signed_long_type = minic_type_long();
    unsigned_long_type = minic_type_unsigned_long();
    if (!minic_type_is_integer(signed_long_type) ||
        !minic_type_is_long_integer(signed_long_type) ||
        !minic_type_is_signed_integer(signed_long_type) ||
        minic_type_is_unsigned_integer(signed_long_type) ||
        !minic_type_is_integer(unsigned_long_type) ||
        !minic_type_is_long_integer(unsigned_long_type) ||
        minic_type_is_signed_integer(unsigned_long_type) ||
        !minic_type_is_unsigned_integer(unsigned_long_type) ||
        minic_type_equal(signed_long_type, integer_type) ||
        minic_type_equal(unsigned_long_type, unsigned_integer_type) ||
        minic_type_equal(signed_long_type, unsigned_long_type)) {
        return fail("long integer identity");
    }

'''
          if text.count(marker) != 1:
              raise SystemExit("type test insertion marker mismatch")
          text = text.replace(marker, block + marker, 1)
          text = text.replace(
              "        !minic_type_integer_promotion(unsigned_integer_type, &promoted_type) ||\n        !minic_type_equal(promoted_type, unsigned_integer_type) ||",
              "        !minic_type_integer_promotion(unsigned_integer_type, &promoted_type) ||\n        !minic_type_equal(promoted_type, unsigned_integer_type) ||\n        !minic_type_integer_promotion(signed_long_type, &promoted_type) ||\n        !minic_type_equal(promoted_type, signed_long_type) ||\n        !minic_type_integer_promotion(unsigned_long_type, &promoted_type) ||\n        !minic_type_equal(promoted_type, unsigned_long_type) ||",
              1,
          )
          common_marker = "        !minic_type_equal(common_type, unsigned_integer_type) ||\n        minic_type_integer_common(integer_type, void_type, &common_type) ||"
          common_replacement = '''        !minic_type_equal(common_type, unsigned_integer_type) ||
        !minic_type_integer_common(integer_type, signed_long_type, &common_type) ||
        !minic_type_equal(common_type, signed_long_type) ||
        !minic_type_integer_common(unsigned_integer_type, signed_long_type, &common_type) ||
        !minic_type_equal(common_type, signed_long_type) ||
        !minic_type_integer_common(integer_type, unsigned_long_type, &common_type) ||
        !minic_type_equal(common_type, unsigned_long_type) ||
        !minic_type_integer_common(signed_long_type, unsigned_long_type, &common_type) ||
        !minic_type_equal(common_type, unsigned_long_type) ||
        minic_type_integer_common(integer_type, void_type, &common_type) ||'''
          if text.count(common_marker) != 1:
              raise SystemExit("type common test marker mismatch")
          text = text.replace(common_marker, common_replacement, 1)
          type_test.write_text(text)

          layout_test = Path("tests/target/riscv64/layout_test.c")
          text = layout_test.read_text()
          text = text.replace(
              "    size_t byte_size;\n    size_t byte_alignment;",
              "    size_t byte_size;\n    size_t byte_alignment;\n    size_t long_size;\n    size_t long_alignment;",
              1,
          )
          marker = "    if (!minic_c0_program_add_record(\n"
          block = '''    if (!minic_riscv64_type_layout(
            &program,
            minic_type_long(),
            &long_size,
            &long_alignment) ||
        long_size != 8U || long_alignment != 8U ||
        !minic_riscv64_type_layout(
            &program,
            minic_type_unsigned_long(),
            &long_size,
            &long_alignment) ||
        long_size != 8U || long_alignment != 8U) {
        minic_c0_program_destroy(&program);
        return fail("RV64 long scalar layout");
    }

'''
          if text.count(marker) != 1:
              raise SystemExit("layout test marker mismatch")
          text = text.replace(marker, block + marker, 1)
          layout_test.write_text(text)

          Path("tests/compiler/c0/long_type_specifiers.c").write_text('''typedef long signed int signed_long_a;
typedef signed long signed_long_b;
typedef unsigned long int unsigned_long_a;
typedef long unsigned int size_word;

static signed_long_a identity_signed(signed_long_b value)
{
    return value;
}

static unsigned_long_a identity_unsigned(size_word value)
{
    return value;
}

int main(void)
{
    signed_long_a left = 3;
    size_word right = 4;
    return (int)(identity_signed(left) + identity_unsigned(right));
}
''')
          Path("tests/compiler/c0/invalid_long_long.c").write_text('''int main(void)
{
    long long value = 0;
    return (int)value;
}
''')
          Path("tests/compiler/c0/invalid_signed_unsigned.c").write_text('''int main(void)
{
    signed unsigned int value = 0;
    return value;
}
''')
          Path("tests/compiler/c0/invalid_long_char.c").write_text('''int main(void)
{
    unsigned long char value = 0;
    return value;
}
''')
          Path("tests/compiler/c0/run-long-types.sh").write_text('''#!/bin/sh
set -eu

root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
minic=${MINIC:-"$root/build/debug/bin/minic"}
host_cc=${HOST_CC:-${CC:-cc}}
work=${BUILD_DIR:-"$root/build/debug"}/tests/compiler-c0-long-types

mkdir -p "$work"

"$host_cc" -E -P -x c "$root/tests/compiler/c0/long_type_specifiers.c" \
    -o "$work/long_type_specifiers.i"
"$minic" -S "$work/long_type_specifiers.i" -o "$work/long_type_specifiers.s"
grep -F ".globl main" "$work/long_type_specifiers.s" >/dev/null
grep -F "identity_signed:" "$work/long_type_specifiers.s" >/dev/null
grep -F "identity_unsigned:" "$work/long_type_specifiers.s" >/dev/null
printf '%s\\n' "PASS compiler/c0/long_type_specifiers"

check_invalid() {
    name=$1
    expected=$2
    "$host_cc" -E -P -x c "$root/tests/compiler/c0/$name.c" -o "$work/$name.i"
    if "$minic" -S "$work/$name.i" -o "$work/$name.s" \
        >"$work/$name.stdout" 2>"$work/$name.stderr"; then
        printf '%s\\n' "FAIL compiler/c0/$name: compilation unexpectedly succeeded" >&2
        exit 1
    fi
    grep -F "$expected" "$work/$name.stderr" >/dev/null
    printf '%s\\n' "PASS compiler/c0/$name"
}

check_invalid invalid_long_long "long long is not supported"
check_invalid invalid_signed_unsigned "conflicting signed and unsigned type specifiers"
check_invalid invalid_long_char "char cannot be combined with int or long"
''')

          makefile = Path("Makefile")
          text = makefile.read_text()
          text = text.replace(
