name: Materialize top-level comma expression statements

on:
  push:
    branches:
      - staging/top-level-comma-expression-statement-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/top-level-comma-expression-statement-v1
          fetch-depth: 0
      - name: Materialize product delta
        run: python3 tools/dev/materialize-top-level-comma-expression-statement-v1.py
      - name: Build and focused validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/materialize-top-level-comma-expression-statement
          MINIC="$GITHUB_WORKSPACE/build/materialize-top-level-comma-expression-statement/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/materialize-top-level-comma-expression-statement-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-comma-operator.sh
          MINIC="$GITHUB_WORKSPACE/build/materialize-top-level-comma-expression-statement/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/materialize-top-level-comma-expression-statement-expression-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-expression-statements.sh
          make check-fast
          git diff --check
      - name: Commit materialized product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_expression.c \
                  src/frontend/parser_internal.h \
                  src/frontend/parser_statement.c \
                  tests/compiler/c0/comma_operator.c \
                  tests/compiler/c0/run-comma-operator.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: parse top-level comma expression statements [materialized]'
          git push origin HEAD:staging/top-level-comma-expression-statement-v1
