name: Linux Core Assemble Sample112

on:
  push:
    branches:
      - refactor/declaration-sema-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first500:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-assemble-sample]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore frozen first500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      - name: Install RV64 assembler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-assemble-sample-first500-compiler

      - name: Compile and assemble 16 spread samples
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-assemble-sample-first500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-assemble-sample-first500"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 --offset 0 --limit 500 --sample-count 16
          python3 - "$work/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==16 and not bad, (len(rows), bad[:3])
          PY
          python3 tests/external/linux/assemble_replay.py --work "$work" --jobs 4
          echo "LINUX_ASSEMBLE_SAMPLE shard=first500 selected=16 pass=16"

  shards:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-assemble-sample]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: new500
            corpus_dir: linux-new500-corpus
            cache_key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
            limit: 500
          - label: next500
            corpus_dir: linux-next500-corpus
            cache_key: linux-next500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1000-1499
            limit: 500
          - label: next500b
            corpus_dir: linux-next500b-corpus
            cache_key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
            limit: 500
          - label: next500c
            corpus_dir: linux-next500c-corpus
            cache_key: linux-next500c-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-2000-2499
            limit: 500
          - label: next500d
            corpus_dir: linux-next500d-corpus
            cache_key: linux-next500d-corpus-v4-6.6.143-rv64-defconfig-gcc13.3.0-indices-2500-2999
            limit: 500
          - label: final352
            corpus_dir: linux-final352-corpus
            cache_key: linux-final352-corpus-v2-6.6.143-rv64-defconfig-gcc13.3.0-indices-3000-3351
            limit: 352
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore frozen shard corpus
        uses: actions/cache/restore@v4
        with:
          path: build/${{ matrix.corpus_dir }}
          key: ${{ matrix.cache_key }}
          fail-on-cache-miss: true

      - name: Install RV64 assembler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-assemble-sample-${{ matrix.label }}-compiler

      - name: Compile and assemble 16 spread samples
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          compiler="$GITHUB_WORKSPACE/build/linux-assemble-sample-$label-compiler/bin/minic"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/linux-assemble-sample-$label"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$corpus" --work "$work" \
            --jobs 4 --offset 0 --limit ${{ matrix.limit }} --sample-count 16
          python3 - "$work/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==16 and not bad, (len(rows), bad[:3])
          PY
          python3 tests/external/linux/assemble_replay.py --work "$work" --jobs 4
          echo "LINUX_ASSEMBLE_SAMPLE shard=$label selected=16 pass=16"

  sample112:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-assemble-sample]'))
    needs: [first500, shards]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every sample shard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.first500.result }}" = success
          test "${{ needs.shards.result }}" = success
          echo "LINUX_ASSEMBLE_SAMPLE112=PASS selected=112 pass=112 fail=0 head=$GITHUB_SHA"
