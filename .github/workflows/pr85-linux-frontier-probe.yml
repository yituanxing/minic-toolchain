name: PR85 Linux Frontier Probe

on:
  push:
    branches:
      - agent/gnu-void-return-expression-v0

permissions:
  contents: write

concurrency:
  group: pr85-linux-frontier
  cancel-in-progress: true

jobs:
  linux-frontier:
    name: riscv-defconfig-init-main
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gnu-void-return-expression-v0
          fetch-depth: 0

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Build committed MiniC source
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --exit-code -- include src tools/minic
          make -j4 MODE=release BUILD_DIR=build/linux-compiler

      - name: Verify focused GNU void return semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/linux-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-void-return-expression.sh

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Drive MiniC with unchanged Linux 6.6.143 init/main.i
        id: linux-probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/linux-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-discovery" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print frontier
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-discovery"
          if test -s "$work/minic.stderr"; then
            frontier_line=$(sed -n 's/.*init\/main\.i:\([0-9][0-9]*\):.*/\1/p' "$work/minic.stderr" | head -n 1)
            printf '%s\n' "frontier_line=${frontier_line:-unknown}"
            sed -n '1,20p' "$work/minic.stderr"
            if test -n "${frontier_line:-}" && test -s "$work/kbuild/init/main.i"; then
              start=$((frontier_line > 8 ? frontier_line - 8 : 1))
              end=$((frontier_line + 8))
              nl -ba "$work/kbuild/init/main.i" | sed -n "${start},${end}p"
            fi
          else
            printf '%s\n' 'No MiniC diagnostic; probe may have passed main.i.'
          fi

      - name: Upload frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr85-linux-frontier-${{ github.run_id }}
          path: |
            build/linux-discovery/minic.stderr
            build/linux-discovery/main-i-inventory.txt
            build/linux-discovery/kbuild/init/main.i
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove one-off probe workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/pr85-linux-frontier-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'cleanup: remove PR85 Linux probe'
          git push origin HEAD:agent/gnu-void-return-expression-v0

      - name: Preserve probe result
        if: always()
        shell: bash
        run: |
          test "${{ steps.linux-probe.outputs.status }}" -eq 0
