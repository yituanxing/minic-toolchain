name: One-shot Core le32_to_cpu_array Shape M25

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Build release compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m25-shape

      - name: Extract exact le32_to_cpu_array body
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('build/linux-focus-corpus/kbuild')
          needle = 'le32_to_cpu_array'
          matches = []
          for p in root.rglob('*.i'):
              try:
                  s = p.read_text(errors='replace')
              except OSError:
                  continue
              pos = s.find(needle)
              if pos >= 0:
                  matches.append((p, s, pos))
                  break
          if not matches:
              raise SystemExit('le32_to_cpu_array not found in frozen corpus')

          p, s, pos = matches[0]
          # Walk back far enough to include the complete signature, then extract the
          # balanced function body. This is diagnostic output only.
          sig_start = s.rfind('\n', 0, max(0, pos - 1200)) + 1
          brace = s.find('{', pos)
          if brace < 0:
              raise SystemExit('opening brace not found')
          depth = 0
          end = None
          for i in range(brace, len(s)):
              c = s[i]
              if c == '{':
                  depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('closing brace not found')

          print('CORE_M25_FILE', p)
          print('CORE_M25_EXACT_BEGIN')
          print(s[sig_start:end])
          print('CORE_M25_EXACT_END')
          PY

      - name: Split candidate mechanisms
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m25-shape/bin/minic"
          w="$GITHUB_WORKSPACE/build/core-m25-shapes"
          mkdir -p "$w"

          cat > "$w/loop_pointer_postinc.i" <<'EOF'
          void probe(unsigned int *buf, unsigned int words) {
              while (words--) {
                  buf++;
              }
          }
          EOF

          cat > "$w/direct_void_call.i" <<'EOF'
          void helper(unsigned int *p) { *p = *p; }
          void probe(unsigned int *buf) { helper(buf); }
          EOF

          cat > "$w/loop_call_postinc.i" <<'EOF'
          void helper(unsigned int *p) { *p = *p; }
          void probe(unsigned int *buf, unsigned int words) {
              while (words--) {
                  helper(buf);
                  buf++;
              }
          }
          EOF

          cat > "$w/load_convert_store.i" <<'EOF'
          void probe(unsigned int *p) {
              unsigned int x = *p;
              *p = x;
          }
          EOF

          cat > "$w/casted_load_store.i" <<'EOF'
          void probe(unsigned int *p) {
              *p = (unsigned int)*p;
          }
          EOF

          for n in loop_pointer_postinc direct_void_call loop_call_postinc load_convert_store casted_load_store; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "$w/$n.i" -o "$w/$n.s" 2>"$w/$n.err"
              rc=$?
              set -e
              printf 'CORE_M25_SHAPE name=%s rc=%d message=' "$n" "$rc"
              tr '\n' ' ' < "$w/$n.err"
              printf '\n'
          done
