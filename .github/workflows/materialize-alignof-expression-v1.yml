name: Materialize Alignof Expression V1
on:
  push:
    branches: [staging/string-octal-v1]
    paths:
      - tools/dev/materialize-alignof-expression-v1.py
      - .github/workflows/materialize-alignof-expression-v1.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-alignof-expression-v1.py
          clang-format-18 -i src/frontend/parser_expression.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/alignof-expression
      - name: Focused alignof expression semantics
        run: |
          set -Eeuo pipefail
          cat > /tmp/alignof-expression.c <<'EOF'
          struct Pair { char c; long x; };
          int main(void) {
              struct Pair p;
              long a[3];
              return (__alignof__(p.x) == __alignof__(long) &&
                      __alignof__(a) == __alignof__(long)) ? 0 : 1;
          }
          EOF
          build/alignof-expression/bin/minic -S /tmp/alignof-expression.c -o /tmp/alignof-expression.s
      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Probe unchanged sha256.i
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          set +e
          MINIC="$GITHUB_WORKSPACE/build/alignof-expression/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/alignof-sha256" CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=65 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/alignof-sha256/batch-summary.txt
          test "$status" -eq 0
      - name: Commit product only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-alignof-expression-v1.py .github/workflows/materialize-alignof-expression-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_expression.c tools/dev/materialize-alignof-expression-v1.py .github/workflows/materialize-alignof-expression-v1.yml
          git commit -m 'frontend: support GNU alignof expression operands'
          git push origin HEAD:staging/string-octal-v1
