name: Variadic Default Promotions V0

on:
  push:
    branches:
      - compiler/variadic-default-promotions-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variadic-promotions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 runtime prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Build MiniC
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/variadic-promotions all

      - name: Validate variadic default promotions
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/variadic-promotions/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/variadic-promotions" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
          REQUIRE_RISCV_RUNTIME=1 \
            sh tests/compiler/c0/run-variadic-direct-calls.sh
