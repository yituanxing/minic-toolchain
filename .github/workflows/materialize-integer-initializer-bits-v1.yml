name: Materialize integer initializer bits consumers

on:
  push:
    branches:
      - staging/integer-initializer-bits-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/integer-initializer-bits-v1
          fetch-depth: 0
      - name: Materialize product delta
        run: python3 tools/dev/materialize-integer-initializer-bits-v1.py
      - name: Build and focused validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/integer-initializer-bits
          MINIC="$GITHUB_WORKSPACE/build/integer-initializer-bits/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/integer-initializer-bits-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-external-scalar-definitions.sh
          make check-fast
          git diff --check
      - name: Commit materialized product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/frontend/parser_core.c \
                     src/frontend/parser_internal.h \
                     src/frontend/parser_global.c \
                     src/frontend/parser_function.c \
                     tests/compiler/c0/external_scalar_definition.c \
                     tests/compiler/c0/run-external-scalar-definitions.sh \
                     tests/compiler/c0/invalid_external_integer_payload_range.c
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: persist typed integer initializer bits [materialized]'
          git push origin HEAD:staging/integer-initializer-bits-v1
