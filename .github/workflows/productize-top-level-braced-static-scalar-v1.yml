name: Productize Top Level Braced Static Scalar V1
on:
  push:
    branches: [product/top-level-braced-static-scalar-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/top-level-braced-static-scalar-v1
          fetch-depth: 0
      - name: Materialize source and permanent contract
        run: |
          set -Eeuo pipefail
          git show origin/staging/string-octal-v1:tools/dev/materialize-top-level-braced-static-scalar-v1.py > tools/dev/.productize-top-level-braced-static-scalar-v1.py
          python3 tools/dev/.productize-top-level-braced-static-scalar-v1.py
          rm tools/dev/.productize-top-level-braced-static-scalar-v1.py
          cat > tests/compiler/c0/braced_static_scalar.c <<'EOF'
          static unsigned long value = { 7 };
          static int *pointer = { 0, };
          int main(void) { return value == 7 && pointer == 0 ? 0 : 1; }
          EOF
          cat > tests/compiler/c0/invalid_braced_static_scalar_extra.c <<'EOF'
          static int value = { 1, 2 };
          EOF
          cat > tests/compiler/c0/run-braced-static-scalar.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          cc=${HOST_CC:-cc}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/braced-static-scalar
          mkdir -p "$work"
          "$cc" -E -P -std=gnu11 -x c "$root/tests/compiler/c0/braced_static_scalar.c" -o "$work/positive.i"
          "$minic" -S "$work/positive.i" -o "$work/positive.s"
          grep -F 'value:' "$work/positive.s" >/dev/null
          grep -F 'pointer:' "$work/positive.s" >/dev/null
          "$cc" -E -P -std=gnu11 -x c "$root/tests/compiler/c0/invalid_braced_static_scalar_extra.c" -o "$work/negative.i"
          if "$minic" -S "$work/negative.i" -o "$work/negative.s" 2>"$work/negative.err"; then exit 1; fi
          grep -F "expected '}' after static scalar initializer" "$work/negative.err" >/dev/null
          printf '%s\n' 'PASS compiler/c0/braced-static-scalar scalar=integer,pointer trailing-comma=1 excess=reject'
          EOF
          chmod +x tests/compiler/c0/run-braced-static-scalar.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" \
          BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
          sh "$root/tests/compiler/c0/run-braced-static-scalar.sh"
          EOF
          clang-format-18 -i src/frontend/parser_global.c tests/compiler/c0/braced_static_scalar.c tests/compiler/c0/invalid_braced_static_scalar_extra.c
          git diff --check
      - name: Validate Werror focused and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-braced-scalar
          MINIC="$GITHUB_WORKSPACE/build/product-braced-scalar/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/product-braced-scalar" sh tests/compiler/c0/run-braced-static-scalar.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-braced-scalar-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-top-level-braced-static-scalar-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: accept braced static scalar initializers'
          git push origin HEAD:product/top-level-braced-static-scalar-v1
