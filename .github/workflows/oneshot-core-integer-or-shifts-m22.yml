name: One-shot Core Integer OR Shifts M22

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0
      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Prove M22 gap
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m22-before
          compiler="$GITHUB_WORKSPACE/build/core-m22-before/bin/minic"
          cat > build/core-m22-before.i <<'EOF'
          typedef unsigned short u16;
          u16 probe(u16 val) {
              return (u16)((((u16)val & (u16)0x00ffU) << 8) |
                           (((u16)val & (u16)0xff00U) >> 8));
          }
          EOF
          if MINIC_CORE_IR=strict "$compiler" -S build/core-m22-before.i -o /tmp/m22.s 2>/tmp/m22.err; then
            echo 'M22 __fswab16 gap unexpectedly absent' >&2
            exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'probe'" /tmp/m22.err >/dev/null
      - name: Apply M22
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-integer-or-shifts-m22.py
          python3 tools/dev/patch-core-integer-or-shifts-m22.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c tests/compiler/c0/core_integer_or_shifts_m22.c tests/compiler/c0/core_integer_or_shifts_m22_runtime.c
          sh -n tests/compiler/c0/run-core-integer-or-shifts-m22.sh
          git diff --check
          grep -F 'MINIC_CORE_INSTRUCTION_INTEGER_BITWISE_OR' src/core/core_ir.h >/dev/null
          grep -F 'MINIC_CORE_INSTRUCTION_INTEGER_SHIFT_LEFT' src/core/core_ir.h >/dev/null
          grep -F 'MINIC_CORE_INSTRUCTION_INTEGER_SHIFT_RIGHT' src/core/core_ir.h >/dev/null
      - name: Build and validate M22
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m22-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m22-compiler/bin/minic"
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m22-focused" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-or-shifts-m22.sh
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m22-m21" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-pointer-condition-m21.sh
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m22-m20" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-for-postincrement-m20.sh
          MINIC="$compiler" bash tests/core/run-core-ir-shadow.sh
      - name: Replay frozen strict frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m22-compiler/bin/minic"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$GITHUB_WORKSPACE/build/core-m22-strict" --jobs 4 --offset 0 --limit 500 --sample-count 64 --indices ''
          replay_status=$?
          set -e
          printf 'CORE_M22_REPLAY_STATUS=%d\n' "$replay_status"
          python3 - <<'PY'
          from collections import Counter
          import json, re
          from pathlib import Path
          rows = json.loads(Path('build/core-m22-strict/batch-results.json').read_text())
          unsupported_re = re.compile(r"^Core IR shadow does not yet support function '([^']+)'$")
          unsupported = Counter()
          errors = []
          passes = 0
          for row in rows:
              if row['status'] == 'PASS':
                  passes += 1
                  continue
              message = str(row['message'])
              match = unsupported_re.match(message)
              if match:
                  unsupported[match.group(1)] += 1
              else:
                  errors.append((row['index'], message))
          print(f'CORE_M22_FRONTIER selected={len(rows)} pass={passes} unsupported={sum(unsupported.values())} error={len(errors)}')
          for function, count in unsupported.most_common():
              print(f'CORE_M22_BLOCKER count={count} function={function}')
          for index, message in errors:
              print(f'CORE_M22_ERROR index={index} message={message}')
          if errors:
              raise SystemExit('M22 introduced non-UNSUPPORTED strict failures')
          if unsupported.get('__fswab16', 0) != 0:
              raise SystemExit('M22 did not pierce __fswab16')
          PY
      - name: Publish M22 product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-integer-or-shifts-m22.py .github/workflows/oneshot-core-integer-or-shifts-m22.yml .github/workflows/oneshot-core-fswab16-shape-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c tests/compiler/c0/core_integer_or_shifts_m22.c tests/compiler/c0/core_integer_or_shifts_m22_runtime.c tests/compiler/c0/run-core-integer-or-shifts-m22.sh tools/dev/patch-core-integer-or-shifts-m22.py .github/workflows/oneshot-core-integer-or-shifts-m22.yml .github/workflows/oneshot-core-fswab16-shape-v1.yml
          git diff --cached --check
          git commit -m 'core: lower integer OR and shifts'
          git push origin HEAD:refactor/declaration-sema-v1
