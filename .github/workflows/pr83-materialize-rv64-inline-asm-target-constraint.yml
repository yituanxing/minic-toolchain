    size_t operand_count;
''',
              '''    const MinicInlineAsm *inline_asm;
    const char *operand_registers[MINIC_RISCV64_INLINE_ASM_MAX_OPERANDS];
    size_t operand_count;
''',
              'operand register map storage')

          replace_once(
