name: PR120 Materialize Offsetof Designator
on:
  push:
    branches: [agent/offsetof-nested-designator-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize nested offsetof designators
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr120-materialize.py
          clang-format-18 -i src/frontend/parser_expression.c tests/compiler/c0/builtin_offsetof.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr120-focused" HOST_CC=cc sh tests/compiler/c0/run-builtin-offsetof.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr120-materialize.py .github/workflows/pr120-materialize-offsetof-designator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): support nested offsetof designators'
          git push origin HEAD:agent/offsetof-nested-designator-v0
