name: RV64 Local Placement Side-State v1 Validation

on:
  push:
    branches: [refactor/rv64-local-placement-side-state-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv64-local-placement-side-state-v1-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Materialize local placement migration
        run: |
          set -Eeuo pipefail
          python3 tools/dev/run-materialize-rv64-local-placement-side-state-v1.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check

      - name: Assert AST placement mirrors are gone
        run: |
          set -Eeuo pipefail
          if grep -R -n --include='*.c' --include='*.h' '\<local_storage_size\>' src/frontend; then
            echo 'frontend local_storage_size mirror remains' >&2
            exit 1
          fi
          if grep -R -n --include='*.c' --include='*.h' '\<local_storage_size\>' src/target/riscv64 \
              | grep -v 'src/target/riscv64/layout.c:' \
              | grep -v 'src/target/riscv64/layout.h:' \
              | grep -v 'function_layout->local_storage_size'; then
            echo 'legacy backend local_storage_size reference remains' >&2
            exit 1
          fi
          if grep -R -n --include='*.c' --include='*.h' 'local->storage_offset\|object->storage_offset' src/target/riscv64; then
            echo 'local storage_offset consumer remains' >&2
            exit 1
          fi
          if grep -R -n --include='*.c' --include='*.h' 'minic_riscv64_frame_layout(program' src/target/riscv64; then
            echo 'legacy FrameLayout compatibility call remains' >&2
            exit 1
          fi
          grep -F 'const MinicRiscv64FunctionLayout *function_layout' \
            src/target/riscv64/codegen_expression.c >/dev/null
          grep -F 'const MinicRiscv64FunctionLayout *function_layout' \
            src/target/riscv64/codegen_statement.c >/dev/null
          grep -F 'const MinicRiscv64FunctionLayout *function_layout' \
            src/target/riscv64/codegen_inline_asm.c >/dev/null

      - name: Production source inventory
        run: sh tools/maintenance/check-production-source-inventory.sh

      - name: Focused layout build
        run: make -j2 BUILD_DIR=build/local-placement-debug check-layout

      - name: Release compiler build
        run: make -j2 MODE=release BUILD_DIR=build/local-placement-release CFLAGS=-Werror check-fast

      - name: Sanitized AST contract
        run: make -j2 MODE=sanitize BUILD_DIR=build/local-placement-sanitize check-ast-contract
