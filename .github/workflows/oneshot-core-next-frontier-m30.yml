name: One-shot Core Next Frontier M30

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Probe timespec64_add frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/kbuild/init/do_mounts.i
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m30-probe
          c="$GITHUB_WORKSPACE/build/m30-probe/bin/minic"
          w="$GITHUB_WORKSPACE/build/m30-shapes"
          mkdir -p "$w"

          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('build/linux-focus-corpus/kbuild/init/do_mounts.i')
          text = p.read_text(errors='replace')

          def definition(name):
              for m in re.finditer(r'\b' + re.escape(name) + r'\s*\(', text):
                  paren = text.find('(', m.start())
                  depth = 0
                  end_paren = None
                  for i in range(paren, len(text)):
                      if text[i] == '(':
                          depth += 1
                      elif text[i] == ')':
                          depth -= 1
                          if depth == 0:
                              end_paren = i + 1
                              break
                  if end_paren is None:
                      continue
                  semi = text.find(';', end_paren)
                  brace = text.find('{', end_paren)
                  if brace < 0 or (semi >= 0 and semi < brace):
                      continue
                  start = text.rfind('\n', 0, max(0, m.start() - 700)) + 1
                  depth = 0
                  for i in range(brace, len(text)):
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              return text[start:i + 1]
              return None

          for name in ['timespec64_add', 'set_normalized_timespec64']:
              body = definition(name)
              if body is None:
                  print(f'M30_EXACT_MISSING name={name}')
              else:
                  print(f'M30_EXACT_BEGIN name={name} file={p}')
                  print(body)
                  print(f'M30_EXACT_END name={name}')
          PY

          cat > "$w/record_param_read.i" <<'EOF'
          struct M30P { long a; long b; };
          long m30_record_param_read(struct M30P p) { return p.a + p.b; }
          EOF

          cat > "$w/record_return_local.i" <<'EOF'
          struct M30R { long a; long b; };
          struct M30R m30_record_return_local(long a, long b) { struct M30R r; r.a = a; r.b = b; return r; }
          EOF

          cat > "$w/record_param_return.i" <<'EOF'
          struct M30I { long a; long b; };
          struct M30I m30_record_param_return(struct M30I p) { return p; }
          EOF

          cat > "$w/record_pointer_helper.i" <<'EOF'
          struct M30H { long a; long b; };
          static void m30_norm(struct M30H *p, long a, long b) { p->a = a; p->b = b; }
          long m30_record_pointer_helper(long a, long b) { struct M30H r; m30_norm(&r, a, b); return r.a + r.b; }
          EOF

          cat > "$w/timespec_style.i" <<'EOF'
          struct M30T { long tv_sec; long tv_nsec; };
          static void m30_set(struct M30T *ts, long sec, long nsec) { ts->tv_sec = sec; ts->tv_nsec = nsec; }
          struct M30T m30_timespec_style(struct M30T lhs, struct M30T rhs) {
              struct M30T delta;
              m30_set(&delta, lhs.tv_sec + rhs.tv_sec, lhs.tv_nsec + rhs.tv_nsec);
              return delta;
          }
          EOF

          cat > "$w/record_call_result.i" <<'EOF'
          struct M30C { long a; long b; };
          static struct M30C m30_make(long a, long b) { struct M30C r; r.a = a; r.b = b; return r; }
          long m30_record_call_result(long a, long b) { return m30_make(a, b).a; }
          EOF

          for n in record_param_read record_return_local record_param_return record_pointer_helper timespec_style record_call_result; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "$w/$n.i" -o "$w/$n.s" 2>"$w/$n.err"
              rc=$?
              set -e
              printf 'M30_SHAPE name=%s rc=%d message=' "$n" "$rc"
              tr '\n' ' ' < "$w/$n.err"
              printf '\n'
          done

          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/do_mounts.i -o "$w/do_mounts.s" 2>"$w/do_mounts.err"
          rc=$?
          set -e
          printf 'M30_FROZEN rc=%d message=' "$rc"
          tr '\n' ' ' < "$w/do_mounts.err"
          printf '\n'
