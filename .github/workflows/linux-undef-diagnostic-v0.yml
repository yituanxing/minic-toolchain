name: Linux Undef Diagnostic V0

on:
  push:
    branches: ["agent/linux-undef-diagnostic-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-undef-diagnostic-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore prepared Linux baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-asm-symbolic-pool-v0/linux-6.6.143
            build/linux-asm-symbolic-pool-v0/base-out
          key: linux-asm-symbolic-base-v1-6.6.143-riscv-defconfig-${{ runner.os }}

      - name: Install RV64 prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Build patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-asm-symbolic-pool-v0"
          build="$work/toolchain-diagnostic"
          rm -rf "$build"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
            apply-constant-inline-call-cfg-v1.py
            apply-local-integer-arithmetic-closure-v0.py
            apply-constant-cfg-product-v0.py
          )
          for patch in "${patches[@]}"; do python3 "tools/ci/$patch"; done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" "$build/bin/minic" "$build/bin/minic-cc"

      - name: Compile representative unresolved objects with intermediates
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-asm-symbolic-pool-v0"
          src="$work/linux-6.6.143"
          base="$work/base-out"
          out="$work/out-diagnostic"
          ev="$work/evidence-diagnostic"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          rm -rf "$out" "$ev"
          mkdir -p "$ev"
          cp -a --reflink=auto "$base" "$out"
          targets=(
            block/bio.o
            drivers/nvdimm/bus.o
            mm/memory.o
            kernel/dma/pool.o
            fs/ext4/inode.o
            drivers/net/phy/phy_device.o
          )
          MINIC="$work/toolchain-diagnostic/bin/minic" \
          REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 \
          MINIC_KBUILD_TRACE="$ev/minic.trace" \
          CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/kbuild.log" 2>&1

          patterns='bio_has_crypt_ctx|bio_crypt_advance|__bio_crypt_|is_nd_pfn|is_nd_dax|to_nd_pfn|to_nd_dax|transparent_hugepage|transhuge|do_huge_pmd|copy_huge|zap_huge|pte_mkdevmap|cma_get_base|cma_get_size|dax_zero_range|led_classdev_register_ext|led_classdev_unregister|__compiletime_assert'
          : >"$ev/preprocessed-excerpts.txt"
          : >"$ev/assembly-excerpts.txt"
          while IFS= read -r f; do
            echo "===== $f =====" >>"$ev/preprocessed-excerpts.txt"
            grep -n -E -B6 -A12 "$patterns" "$f" | head -n 1400 >>"$ev/preprocessed-excerpts.txt" || true
          done < <(find "$out" -type f -name '*.minic-stage2.i' | sort)
          while IFS= read -r f; do
            echo "===== $f =====" >>"$ev/assembly-excerpts.txt"
            grep -n -E -B8 -A12 '__bio_crypt_|to_nd_(pfn|dax)|do_huge_pmd|copy_huge|zap_huge|pte_mkdevmap|cma_get_(base|size)|dax_zero_range|led_classdev_(register_ext|unregister)|__compiletime_assert_' "$f" | head -n 1400 >>"$ev/assembly-excerpts.txt" || true
          done < <(find "$out" -type f -name '*.minic-stage2.s' | sort)
          for target in "${targets[@]}"; do
            echo "===== $target =====" >>"$ev/undefined.txt"
            riscv64-linux-gnu-nm -u "$out/$target" >>"$ev/undefined.txt" || true
          done

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-undef-diagnostic-v0
          path: build/linux-asm-symbolic-pool-v0/evidence-diagnostic/
          if-no-files-found: ignore
          retention-days: 7
