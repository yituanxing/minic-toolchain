name: PR81 Materialize Shared Pointer Semantics

on:
  pull_request:
    paths:
      - 'tools/dev/pr81-shared-pointer-sema.patch'
      - '.github/workflows/pr81-materialize-pointer-sema.yml'
      - 'src/frontend/**'

permissions:
  contents: write

concurrency:
  group: pr81-pointer-sema-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/gnu-void-pointer-relational-v0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize shared semantic query
        shell: bash
        run: |
          set -Eeuo pipefail
          patch=tools/dev/pr81-shared-pointer-sema.patch
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'Shared pointer semantics already materialized.'
          else
            echo 'Pointer semantic patch no longer matches current source.' >&2
            exit 1
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/pr81-shared check

      - name: Commit materialized source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/ast.c src/frontend/ast.h \
                  src/frontend/parser_expression.c src/frontend/ast_verifier.c
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'frontend: share pointer semantic compatibility'
          git push origin HEAD:${{ github.head_ref }}
