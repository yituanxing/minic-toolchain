          start=$(date +%s%N)
          sudo apt-get -o Acquire::Retries=3 update >/dev/null
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3 \
            qemu-system-misc opensbi file >/dev/null
          end=$(date +%s%N)
          echo "TIMING install_ms=$(((end-start)/1000000))" | tee -a "$ev/timing.txt"

      - name: Build current reuse candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-frontier-v1"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-asm-rk-early-v0.py
            apply-inline-asm-rk-early-hotfix-v0.py
            apply-inline-asm-rk-tail-rollback-v0.py
            apply-inline-asm-rk-cast-tail-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
            apply-riscv64-core-value-slot-pack-v0.py
            apply-riscv64-core-value-slot-reuse-v0.py
          )
          start=$(date +%s%N)
          for p in "${patches[@]}"; do
            python3 "tools/ci/$p" >>"$ev/patch.log"
          done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain-frontier-v1" \
            "$work/toolchain-frontier-v1/bin/minic" \
            "$work/toolchain-frontier-v1/bin/minic-cc" >/dev/null
          end=$(date +%s%N)
          echo "TIMING toolchain_ms=$(((end-start)/1000000))" | tee -a "$ev/timing.txt"

      - name: Refresh current frontier owners and freeze inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          archive="$work/linux-6.6.143.tar.xz"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-frontier-v1"
          frozen="$ev/frozen"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          test -s "$out/.config"

          source_start=$(date +%s%N)
          if [[ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]]; then
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
            printf '%s  %s\n' \
              dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
              "$archive" | sha256sum -c -
            rm -rf "$src"
            tar -xJf "$archive" -C "$work"
            source_mode=seed
          else
            test -s "$src/Makefile"
            grep -q '^VERSION = 6$' "$src/Makefile"
            grep -q '^PATCHLEVEL = 6$' "$src/Makefile"
            source_mode=cache
          fi
          source_end=$(date +%s%N)
          echo "TIMING source_prepare_ms=$(((source_end-source_start)/1000000)) mode=$source_mode" | tee -a "$ev/timing.txt"

          targets=(lib/idr.o lib/xarray.o)
          printf '%s\n' "${targets[@]}" >"$ev/targets.txt"
          touch "$ev/rebuild-start.stamp"
          for obj in "${targets[@]}"; do
            rm -f "$out/$obj" "$out/$(dirname "$obj")/.$(basename "$obj" .o).o.cmd"
          done

          start=$(date +%s%N)
          MINIC="$work/toolchain-frontier-v1/bin/minic" \
          REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 \
          MINIC_KBUILD_TRACE="$ev/refresh.trace" \
          MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/refresh.log" 2>&1
          end=$(date +%s%N)
          echo "TIMING refresh_ms=$(((end-start)/1000000)) objects=2" | tee -a "$ev/timing.txt"

          rm -rf "$frozen"
          mkdir -p "$frozen"
          : >"$frozen/manifest.sha256"
          for obj in "${targets[@]}"; do
            dir=$(dirname "$obj")
            stem=$(basename "$obj" .o)
            key=${obj//\//__}
            key=${key%.o}
            input="$out/$dir/$stem.minic-stage2.i"
            cmd="$out/$dir/.$stem.o.cmd"
            test -s "$input"
            test -s "$cmd"
            cp -f "$input" "$frozen/$key.i"
            cp -f "$cmd" "$frozen/$key.cmd"
            sha256sum "$frozen/$key.i" "$frozen/$key.cmd" "$out/$obj" >>"$frozen/manifest.sha256"
          done
          cp -f "$ev/refresh.trace" "$frozen/refresh.trace"
          sha256sum "$out/.config" >"$frozen/config.sha256"
          printf '%s\n' \
            'linux_version=6.6.143' \
            'linux_archive_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932' \
            'linked_fixture=linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88' \
            >"$frozen/fixture.txt"

          find "$out" -type f -name '*.minic.stderr' -newer "$ev/rebuild-start.stamp" -print0 2>/dev/null \
            | xargs -0 -r cat >"$ev/minic-frame-trace.txt" || true

      - name: Save pinned Linux source tree
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1

      - name: Relink, execute and classify frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-frontier-v1"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          start=$(date +%s%N)
          MINIC="$work/toolchain-frontier-v1/bin/minic" \
          REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=0 \
          MINIC_KBUILD_TRACE="$ev/relink.trace" CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 Image >"$ev/relink.log" 2>&1
          end=$(date +%s%N)
          echo "TIMING relink_ms=$(((end-start)/1000000))" | tee -a "$ev/timing.txt"
          test -s "$out/arch/riscv/boot/Image"
          riscv64-linux-gnu-nm -n "$out/vmlinux" >"$ev/vmlinux.nm.txt"

          start=$(date +%s%N)
          set +e
          timeout --signal=TERM 8s qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$out/arch/riscv/boot/Image" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -d int,in_asm -D "$ev/qemu.trace.log" \
            >"$ev/qemu.console.log" 2>&1
          qemu_rc=$?
          set -e
          end=$(date +%s%N)
          echo "TIMING qemu_ms=$(((end-start)/1000000)) rc=$qemu_rc" | tee -a "$ev/timing.txt"

          grep -a 'riscv_cpu_do_interrupt' "$ev/qemu.trace.log" >"$ev/qemu.interrupts.txt" || true
          tail -n 300 "$ev/qemu.console.log" >"$ev/qemu.console.tail.txt" || true

          set +e
          python3 tools/ci/linux-runtime-frontier-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --interrupts "$ev/qemu.interrupts.txt" \
            --nm "$ev/vmlinux.nm.txt" \
            --trace "$ev/qemu.trace.log" \
            --console "$ev/qemu.console.log" \
            --qemu-rc "$qemu_rc" \
            --json-out "$ev/frontier-result.json" \
            --text-out "$ev/frontier-summary.txt"
          classifier_rc=$?
          set -e

          {
            echo '## Linux Runtime Frontier V1'
            echo
            echo '```text'
            cat "$ev/frontier-summary.txt"
            cat "$ev/timing.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

          exit "$classifier_rc"

      - name: Preserve frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-frontier-v1-${{ github.sha }}
          path: |
            build/linux-runtime-frontier-v1/frontier-result.json
            build/linux-runtime-frontier-v1/frontier-summary.txt
            build/linux-runtime-frontier-v1/timing.txt
            build/linux-runtime-frontier-v1/targets.txt
            build/linux-runtime-frontier-v1/qemu.console.tail.txt
            build/linux-runtime-frontier-v1/qemu.interrupts.txt
            build/linux-runtime-frontier-v1/refresh.log
            build/linux-runtime-frontier-v1/refresh.trace
            build/linux-runtime-frontier-v1/relink.log
            build/linux-runtime-frontier-v1/relink.trace
            build/linux-runtime-frontier-v1/minic-frame-trace.txt
            build/linux-runtime-frontier-v1/frozen/**
          if-no-files-found: warn
          retention-days: 7


  frontier-fast-v5:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'fast' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-frontier-fast-v5]'))
    concurrency:
      group: linux-runtime-frontier-fast-v5-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified compact linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-link-v1/out
          key: linux-runtime-link-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Restore certified frozen frontier inputs
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Prove oracle and fixture contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-runtime-frontier-v1.py --self-test
          bash tools/ci/linux-runtime-frozen-verify-v1.sh build/linux-runtime-frozen-v1
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          (cd "$out" && sha256sum -c link-files.sha256 >/dev/null)
          test "$(sha256sum "$out/.config" | awk '{print $1}')" = e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          echo "COMPACT_FIXTURE_VERIFY=PASS files=$(wc -l <"$out/link-files.txt")"
          python3 - <<'PY'
          import json
          c=json.load(open('tools/ci/linux-runtime-frontier-v1.json'))
          markers=c['progress_markers']
          names=[m['name'] for m in markers]
          symbols={m['symbol']: i for i,m in enumerate(markers)}
          baseline=c['baseline']['progress_marker']
          fault=c['baseline'].get('fault') or {}
          cert=c['baseline'].get('certified_by') or {}
          if baseline not in names:
              raise SystemExit(f'FAST_V5_CONTRACT=FAIL baseline_missing={baseline}')
          if not all(fault.get(k) for k in ('desc','symbol','offset')):
              raise SystemExit('FAST_V5_CONTRACT=FAIL baseline_fault_incomplete')
          if not cert.get('workflow_run') or not cert.get('commit'):
              raise SystemExit('FAST_V5_CONTRACT=FAIL baseline_certification_incomplete')
          base_i=names.index(baseline)
          pass_symbols=c.get('pass_markers',{}).get('symbol_any',[])
          later=[s for s in pass_symbols if s in symbols and symbols[s] > base_i]
          if not later:
              raise SystemExit(
                  f'FAST_V5_CONTRACT=FAIL no_pass_marker_after_baseline baseline={baseline} '
                  f'pass_symbols={pass_symbols}'
              )
          print(
              f'FAST_V5_CONTRACT=PASS baseline={baseline} '
              f'pass_after={",".join(later)}'
          )
          PY

      - name: Install minimal cross and runtime prerequisites
        shell: bash
