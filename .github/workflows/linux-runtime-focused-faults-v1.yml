          watch_rc=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/linux-runtime-satp-refresh-v0/pi-only-watch/frontier-result.json")
          r=json.loads(p.read_text())
          verdict=r.get("verdict")
          fault=r.get("fault") or {}
          symbol=fault.get("symbol")
          print(f"PI_ONLY_VERDICT={verdict} fault_symbol={symbol}")
          if verdict != "REGRESSED" or symbol != "set_satp_mode":
              raise SystemExit(
                  f"PI_ONLY_DIFFERENTIAL=FAIL expected REGRESSED at set_satp_mode, "
                  f"got verdict={verdict} symbol={symbol}"
              )
          print("PI_ONLY_DIFFERENTIAL=PASS expected_regression=set_satp_mode")
          PY
