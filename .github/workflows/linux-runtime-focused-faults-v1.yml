name: Linux Runtime Focused Fault and Frontier Diagnostics

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select a fault/owner diagnostic (all runs independent verdicts)"
        required: true
        type: choice
        default: fault-context
        options:
          - fault-context
          - cpu-stall
          - fork-stack
          - satp
          - fast
          - full
          - qemu
          - all

permissions:
  contents: read

jobs:

  cpu-stall:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'cpu-stall' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-check-cpu-stall-runtime-v0]'))
    concurrency:
      group: linux-check-cpu-stall-runtime-v0-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore linked Linux cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update >/dev/null
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3 \
            qemu-system-misc opensbi file >/dev/null

      - name: Build current patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          ev="$GITHUB_WORKSPACE/build/linux-check-cpu-stall-runtime-v0/evidence"
          mkdir -p "$ev"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-asm-rk-early-v0.py
            apply-inline-asm-rk-early-hotfix-v0.py
            apply-inline-asm-rk-tail-rollback-v0.py
            apply-inline-asm-rk-cast-tail-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
            apply-riscv64-core-value-slot-pack-v0.py
            apply-riscv64-core-value-slot-reuse-v0.py
          )
          start=$(date +%s%N)
          for p in "${patches[@]}"; do python3 "tools/ci/$p" >>"$ev/patch.log"; done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" >/dev/null
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING toolchain_ms={(b-a)//1_000_000}")
          PY

      - name: Rebuild runtime failure pool plus RCU stall owner
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          archive="$work/linux-6.6.143.tar.xz"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-check-cpu-stall-runtime-v0/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          test -s "$out/.config"

          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          rm -rf "$src" && tar -xJf "$archive" -C "$work"

          targets=(arch/riscv/mm/init.o)
          rm -f "$out/arch/riscv/mm/init.o" "$out/arch/riscv/mm/.init.o.cmd"
          for base in cmdline_early fdt_early string ctype lib-fdt lib-fdt_ro; do
            rm -f "$out/arch/riscv/kernel/pi/${base}.o" "$out/arch/riscv/kernel/pi/${base}.pi.o" \
                  "$out/arch/riscv/kernel/pi/.${base}.o.cmd" "$out/arch/riscv/kernel/pi/.${base}.pi.o.cmd"
            targets+=("arch/riscv/kernel/pi/${base}.pi.o")
          done
          focused=(
            arch/riscv/kernel/traps.o
            kernel/softirq.o
            kernel/locking/spinlock.o
            kernel/locking/spinlock_debug.o
            kernel/time/timekeeping.o
            kernel/time/vsyscall.o
            kernel/time/hrtimer.o
            kernel/sched/core.o
            kernel/sched/build_policy.o
            kernel/rcu/tree.o
          )
          for obj in "${focused[@]}"; do
            rm -f "$out/$obj" "$out/$(dirname "$obj")/.$(basename "$obj" .o).o.cmd"
            targets+=("$obj")
          done

          stamp="$ev/rebuild-start.stamp"
          touch "$stamp"
          start=$(date +%s%N)
          MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/refresh.trace" \
          MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/refresh.log" 2>&1
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING refresh_ms={(b-a)//1_000_000} objects=17")
          PY

          find "$out" -type f -name '*.minic.stderr' -newer "$stamp" -print0 | xargs -0 -r cat >"$ev/minic-frame-trace.txt"
          grep -E 'CORE_FRAME_REUSE function=(do_irq|handle_riscv_irq|irq_enter_rcu|arch_spin_lock|do_raw_spin_lock|check_cpu_stall|hrtimer_interrupt|update_rq_clock_pelt|update_rq_clock_task|update_rq_clock)' \
            "$ev/minic-frame-trace.txt" | tee "$ev/focused-core-frames.txt" || true
          riscv64-linux-gnu-objdump -dr --disassemble=check_cpu_stall "$out/kernel/rcu/tree.o" >"$ev/check_cpu_stall.disasm.txt"
          riscv64-linux-gnu-nm -n "$out/kernel/rcu/tree.o" >"$ev/tree.nm.txt"

      - name: Relink and run QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-check-cpu-stall-runtime-v0/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          start=$(date +%s%N)
          MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=0 MINIC_KBUILD_TRACE="$ev/relink.trace" CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 Image >"$ev/relink.log" 2>&1
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING relink_ms={(b-a)//1_000_000}")
          PY
          test -s "$out/arch/riscv/boot/Image"
          riscv64-linux-gnu-nm -n "$out/vmlinux" >"$ev/vmlinux.nm.txt"

          set +e
          timeout --signal=TERM 8s qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$out/arch/riscv/boot/Image" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -d int,in_asm -D "$ev/qemu.trace.log" \
            >"$ev/qemu.console.log" 2>&1
          qemu_rc=$?
          set -e
          grep -a 'riscv_cpu_do_interrupt' "$ev/qemu.trace.log" >"$ev/qemu.interrupts.txt" || true
          tail -n 300 "$ev/qemu.console.log" >"$ev/qemu.console.tail.txt" || true

          python3 - "$ev/qemu.interrupts.txt" "$ev/vmlinux.nm.txt" "$qemu_rc" <<'PY' | tee "$ev/runtime-summary.txt"
          import bisect,re,sys
          ints=open(sys.argv[1],errors='replace').read().splitlines()
          syms=[]
          for line in open(sys.argv[2],errors='replace'):
              p=line.split()
              if len(p) < 3: continue
              try: a=int(p[0],16)
              except ValueError: continue
              syms.append((a,p[2]))
          add=[a for a,_ in syms]
          faults=[]
          for line in ints:
              if 'page_fault' not in line: continue
              m=re.search(r'epc:0x([0-9a-fA-F]+).*tval:0x([0-9a-fA-F]+).*desc=([^ ]+)',line)
              if not m: continue
              epc=int(m.group(1),16); tval=int(m.group(2),16); desc=m.group(3)
              i=bisect.bisect_right(add,epc)-1
              sym='?'; off=0
              if i>=0: sym=syms[i][1]; off=epc-syms[i][0]
              faults.append((epc,tval,desc,sym,off))
          guard=[f for f in faults if f[2] in ('store_page_fault','load_page_fault') and 0xff1ffffffff00000 <= f[1] < 0xff20000000000000]
          nulls=[f for f in faults if f[1] == 0]
          print(f'QEMU_RC={sys.argv[3]}')
          print(f'PAGE_FAULTS={len(faults)}')
          print(f'IRQ_GUARD_RANGE_FAULTS={len(guard)}')
          print(f'NULL_PAGE_FAULTS={len(nulls)}')
          for epc,tval,desc,sym,off in faults[-12:]:
              print(f'FAULT desc={desc} epc=0x{epc:016x} tval=0x{tval:016x} symbol={sym}+0x{off:x}')
          if guard:
              raise SystemExit(1)
          PY

      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-check-cpu-stall-runtime-v0
          path: build/linux-check-cpu-stall-runtime-v0/evidence/
          if-no-files-found: ignore
          retention-days: 7


  fork-stack:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'fork-stack' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-fork-stack-runtime-v0]'))
    concurrency:
      group: linux-fork-stack-runtime-v0-${{ github.ref }}-${{ matrix.case }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [baseline-early, baseline-irq, baseline-time, baseline-sched, baseline-fork, reuse-early]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore known linked Linux cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update >/dev/null
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3 \
            qemu-system-misc opensbi file >/dev/null

      - name: Build selected MiniC mode
        shell: bash
        run: |
          set -Eeuo pipefail
          case_name='${{ matrix.case }}'
          mode=${case_name%%-*}
          if [[ "$case_name" == reuse-* ]]; then mode=reuse; else mode=baseline; fi
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          ev="$GITHUB_WORKSPACE/build/linux-fork-stack-runtime-v0/$case_name"
          mkdir -p "$ev"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-asm-rk-early-v0.py
            apply-inline-asm-rk-early-hotfix-v0.py
            apply-inline-asm-rk-tail-rollback-v0.py
            apply-inline-asm-rk-cast-tail-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
          )
          if [[ "$mode" == reuse ]]; then
            patches+=(apply-riscv64-core-value-slot-pack-v0.py apply-riscv64-core-value-slot-reuse-v0.py)
          fi
          start=$(date +%s%N)
          for p in "${patches[@]}"; do python3 "tools/ci/$p" >>"$ev/patch.log"; done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain-$mode" \
            "$work/toolchain-$mode/bin/minic" "$work/toolchain-$mode/bin/minic-cc" >/dev/null
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING toolchain_ms={(b-a)//1_000_000}")
          PY
          echo "MODE=$mode" | tee "$ev/mode.txt"

      - name: Replace only selected cache object group
        shell: bash
        run: |
          set -Eeuo pipefail
          case_name='${{ matrix.case }}'
          if [[ "$case_name" == reuse-* ]]; then mode=reuse; else mode=baseline; fi
          group=${case_name#*-}
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          archive="$work/linux-6.6.143.tar.xz"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-fork-stack-runtime-v0/$case_name"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          test -s "$out/.config"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          rm -rf "$src" && tar -xJf "$archive" -C "$work"

          targets=()
          case "$group" in
            early)
              targets+=(arch/riscv/mm/init.o)
              for base in cmdline_early fdt_early string ctype lib-fdt lib-fdt_ro; do
                targets+=("arch/riscv/kernel/pi/${base}.pi.o")
              done
              ;;
            irq)
              targets+=(arch/riscv/kernel/traps.o kernel/softirq.o kernel/locking/spinlock.o kernel/locking/spinlock_debug.o)
              ;;
            time)
              targets+=(kernel/time/timekeeping.o kernel/time/vsyscall.o kernel/time/hrtimer.o)
              ;;
            sched)
              targets+=(kernel/sched/core.o kernel/sched/build_policy.o kernel/rcu/tree.o)
              ;;
            fork)
              targets+=(kernel/fork.o)
              ;;
            *) echo "unknown group=$group" >&2; exit 2 ;;
          esac

          : >"$ev/targets.txt"
          for obj in "${targets[@]}"; do
            echo "$obj" >>"$ev/targets.txt"
            rm -f "$out/$obj" "$out/$(dirname "$obj")/.$(basename "$obj" .o).o.cmd"
          done
          start=$(date +%s%N)
          MINIC="$work/toolchain-$mode/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/refresh.trace" \
          MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/refresh.log" 2>&1
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING refresh_ms={(b-a)//1_000_000}")
          PY
          : >"$ev/selected-symbols.nm.txt"
          for obj in "${targets[@]}"; do
            if [[ -f "$out/$obj" ]]; then
              riscv64-linux-gnu-nm -n "$out/$obj" | sed "s#^#$obj #" >>"$ev/selected-symbols.nm.txt" || true
            fi
          done
          find "$out" -type f -name '*.minic.stderr' -newer "$ev/targets.txt" -print0 2>/dev/null | xargs -0 -r cat >"$ev/minic-frame-trace.txt" || true

      - name: Relink from mixed cache and run first-fault oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          case_name='${{ matrix.case }}'
          if [[ "$case_name" == reuse-* ]]; then mode=reuse; else mode=baseline; fi
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-fork-stack-runtime-v0/$case_name"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          start=$(date +%s%N)
          MINIC="$work/toolchain-$mode/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=0 MINIC_KBUILD_TRACE="$ev/relink.trace" CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 Image >"$ev/relink.log" 2>&1
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING relink_ms={(b-a)//1_000_000}")
          PY
          test -s "$out/arch/riscv/boot/Image"
          riscv64-linux-gnu-nm -n "$out/vmlinux" >"$ev/vmlinux.nm.txt"

          start=$(date +%s%N)
          set +e
          timeout --signal=TERM 8s qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$out/arch/riscv/boot/Image" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -d int,in_asm -D "$ev/qemu.trace.log" \
            >"$ev/qemu.console.log" 2>&1
          qemu_rc=$?
          set -e
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING qemu_ms={(b-a)//1_000_000}")
          PY
          grep -a 'riscv_cpu_do_interrupt' "$ev/qemu.trace.log" >"$ev/qemu.interrupts.txt" || true
          tail -n 300 "$ev/qemu.console.log" >"$ev/qemu.console.tail.txt" || true
          set +e
          python3 tools/ci/linux-first-fault-analyzer-v1.py \
            --interrupts "$ev/qemu.interrupts.txt" \
            --nm "$ev/vmlinux.nm.txt" \
            --trace "$ev/qemu.trace.log" \
            --console "$ev/qemu.console.log" \
            --qemu-rc "$qemu_rc" | tee "$ev/runtime-summary.txt"
          analyzer_rc=${PIPESTATUS[0]}
          set -e
          echo "CASE=$case_name" | tee -a "$ev/runtime-summary.txt"
          echo "ANALYZER_RC=$analyzer_rc" | tee -a "$ev/runtime-summary.txt"
          exit "$analyzer_rc"

      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fork-stack-runtime-v0-${{ matrix.case }}
          path: build/linux-fork-stack-runtime-v0/${{ matrix.case }}/
          if-no-files-found: ignore
          retention-days: 7


  fault-context:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'fault-context' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-fault-context-v1]'))
    concurrency:
      group: linux-runtime-fault-context-v1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
