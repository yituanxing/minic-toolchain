name: Linux Runtime Focused Fault and Frontier Diagnostics

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select a fault/owner diagnostic (all runs independent verdicts)"
        required: true
        type: choice
        default: fault-context
        options:
          - fault-context
          - cpu-stall
          - fork-stack
          - satp
          - fast
          - full
          - qemu
          - all

permissions:
  contents: read

jobs:

  cpu-stall:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'cpu-stall' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-check-cpu-stall-runtime-v0]'))
    concurrency:
      group: linux-check-cpu-stall-runtime-v0-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject retired pre-split compiler overlay
        shell: bash
        run: |
          echo 'HISTORICAL_PROFILE_RETIRED: exact pre-split overlay replay requires historical checkout eb583f9dd9bf9cb2ebf530a8579930311b8539d9; no current compiler or runtime PASS.' >&2
          exit 78

  fork-stack:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'fork-stack' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-fork-stack-runtime-v0]'))
    concurrency:
      group: linux-fork-stack-runtime-v0-${{ github.ref }}-${{ matrix.case }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [baseline-early, baseline-irq, baseline-time, baseline-sched, baseline-fork, reuse-early]

    steps:
      - name: Reject retired pre-split compiler overlay
        shell: bash
        run: |
          echo 'HISTORICAL_PROFILE_RETIRED: exact pre-split overlay replay requires historical checkout eb583f9dd9bf9cb2ebf530a8579930311b8539d9; no current compiler or runtime PASS.' >&2
          exit 78

  fault-context:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'fault-context' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-fault-context-v1]'))
    concurrency:
      group: linux-runtime-fault-context-v1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified compact linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-link-v1/out
          key: linux-runtime-link-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Restore certified frozen frontier inputs
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites without update
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fault-context-v1"
          mkdir -p "$ev"
          mode=no-update
          if ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >"$ev/apt.stdout.txt" 2>"$ev/apt.stderr.txt"; then
            mode=fallback-update
            sudo apt-get -o Acquire::Retries=3 update >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
          fi
          echo "INSTALL_MODE=$mode"

      - name: Build current MiniC profile and replay current owners
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fault-context-v1"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-fault-context-v1"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          mapfile -t asm_args <"$frozen/asm-args.txt"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/replay.trace" \
            "$wrapper" "${asm_args[@]}" -c -o "$out/lib/idr.o" "$frozen/lib__idr.i"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/replay.trace" \
            "$wrapper" "${asm_args[@]}" -c -o "$out/lib/xarray.o" "$frozen/lib__xarray.i"
          sha256sum "$out/lib/idr.o" "$out/lib/xarray.o" | tee "$ev/objects.sha256"

      - name: Build exact current early image
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fault-context-v1"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early"

      - name: Capture first fault and dynamic caller context
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fault-context-v1"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 \
            | tee "$ev/watch.stdout.txt"
          watch_rc=${PIPESTATUS[0]}
          set -e
          test "$watch_rc" -eq 1
          python3 tools/ci/linux-runtime-fault-context-v1.py \
            --nm "$ev/early/nm.txt" \
            --trace "$ev/watch/qemu.trace.log" \
            --frontier-json "$ev/watch/frontier-result.json" \
            --vmlinux "$ev/early/vmlinux.early" \
            --out "$ev/fault-context.json" \
            | tee "$ev/fault-context.txt"
          {
            echo '## Linux Runtime Fault Context V1'
            echo
            echo '```text'
            cat "$ev/watch/frontier-summary.txt"
            cat "$ev/fault-context.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-fault-context-v1-${{ github.sha }}
          path: |
            build/linux-runtime-fault-context-v1/fault-context.json
            build/linux-runtime-fault-context-v1/fault-context.txt
            build/linux-runtime-fault-context-v1/watch/frontier-result.json
            build/linux-runtime-fault-context-v1/watch/frontier-summary.txt
            build/linux-runtime-fault-context-v1/watch/watch-result.json
            build/linux-runtime-fault-context-v1/watch/qemu.interrupts.txt
            build/linux-runtime-fault-context-v1/objects.sha256
            build/linux-runtime-fault-context-v1/replay.trace
          if-no-files-found: warn
          retention-days: 7


  satp-refresh:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'satp' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-satp-refresh-v0]'))
    concurrency:
      group: linux-runtime-satp-refresh-v0-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites without update
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          mkdir -p "$ev"
          if ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
              >"$ev/apt.stdout.txt" 2>"$ev/apt.stderr.txt"; then
            sudo apt-get -o Acquire::Retries=3 update >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
              >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
          fi

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-satp-refresh-v0"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Rebuild real PI string owner with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-satp-refresh-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=arch/riscv/kernel/pi/cmdline_early.pi.o
          base=arch/riscv/kernel/pi/cmdline_early
          mkdir -p "$ev"
          sha256sum "$out/$target" >"$ev/pi-owner.before.sha256"
          rm -f \
            "$out/$base.o" "$out/$target" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
            "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s" \
            "$out/$base.minic-stage2.minic.stdout" "$out/$base.minic-stage2.minic.stderr"
          start=$(date +%s%N)
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/pi-owner-refresh.trace" \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j2 V=1 "$target" >"$ev/pi-owner-refresh.log" 2>&1
          end=$(date +%s%N)
          echo "TIMING pi_owner_refresh_ms=$(((end-start)/1000000)) target=$target" | tee "$ev/timing.txt"
          test -s "$out/$base.o"
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.s"
          sha256sum "$out/$target" >"$ev/pi-owner.after.sha256"
          cp "$out/$base.minic-stage2.i" "$ev/cmdline_early.minic-stage2.i"
          cp "$out/$base.minic-stage2.s" "$ev/cmdline_early.minic-stage2.s"
          riscv64-linux-gnu-objdump -dr "$out/$base.o" >"$ev/cmdline_early.objdump.txt"
          riscv64-linux-gnu-objdump -dr "$out/$target" >"$ev/cmdline_early.pi.objdump.txt"
          riscv64-linux-gnu-readelf -rW "$out/$base.o" >"$ev/cmdline_early.relocs.txt"
          riscv64-linux-gnu-nm -an "$out/$base.o" >"$ev/cmdline_early.nm.txt"
          riscv64-linux-gnu-nm -an "$out/$target" >"$ev/cmdline_early.pi.nm.txt"
          sha256sum "$out/$base.o" "$out/$target" >"$ev/pi-owner.objects.sha256"
          grep -nE '\.Lminic_string_|\blla\b|\bla\b' "$ev/cmdline_early.minic-stage2.s" \
            >"$ev/local-string-address-lines.txt" || true
          grep -nE 'Lminic_string|PCREL|GOT_HI20|HI20' "$ev/cmdline_early.relocs.txt" \
            >"$ev/local-string-relocs.txt" || true
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' \
            "$ev/cmdline_early.minic-stage2.s" >/dev/null || {
              echo 'PI_OWNER_ASM=FAIL no PC-relative local string address' >&2
              exit 71
            }
          grep -Fq 'cmdline_early.minic-stage2.s' "$ev/pi-owner-refresh.log" || \
            grep -Fq 'stage2_kbuild_cc.sh' "$ev/pi-owner-refresh.log"
          echo 'PI_OWNER_ASM=PASS local_string=lla'
          echo 'PI_FRESH_OWNER=PASS'

      - name: Checkpoint PI-only runtime differential
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          rm -rf "$ev/pi-only-early" "$ev/pi-only-watch"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/pi-only-early"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/pi-only-early/nm.txt" --image "$ev/pi-only-early/Image.early" \
            --evidence-dir "$ev/pi-only-watch" --timeout-ms 8000 --poll-ms 100 \
            | tee "$ev/pi-only-watch.stdout.txt"
          watch_rc=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/linux-runtime-satp-refresh-v0/pi-only-watch/frontier-result.json")
          r=json.loads(p.read_text())
          verdict=r.get("verdict")
          fault=r.get("fault") or {}
          symbol=fault.get("symbol")
          print(f"PI_ONLY_VERDICT={verdict} fault_symbol={symbol}")
          if verdict != "REGRESSED" or symbol != "set_satp_mode":
              raise SystemExit(
                  f"PI_ONLY_DIFFERENTIAL=FAIL expected REGRESSED at set_satp_mode, "
                  f"got verdict={verdict} symbol={symbol}"
              )
          print("PI_ONLY_DIFFERENTIAL=PASS expected_regression=set_satp_mode")
          PY
          echo "PI_ONLY_WATCH_RC=$watch_rc" | tee -a "$ev/timing.txt"

      - name: Rebuild real SATP owner with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-satp-refresh-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=arch/riscv/mm/init.o
          base=arch/riscv/mm/init
          mkdir -p "$ev"
          sha256sum "$out/$target" >"$ev/init.before.sha256"
          rm -f "$out/$target" "$out/arch/riscv/mm/.init.o.cmd" \
            "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s" \
            "$out/$base.minic-stage2.minic.stdout" "$out/$base.minic-stage2.minic.stderr"
          start=$(date +%s%N)
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_LOCAL_FACT_TRACE=1 \
          MINIC_KBUILD_TRACE="$ev/init-refresh.trace" \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j2 V=1 "$target" >"$ev/init-refresh.log" 2>&1
          end=$(date +%s%N)
          echo "TIMING init_refresh_ms=$(((end-start)/1000000)) target=$target" | tee -a "$ev/timing.txt"
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.i"
          test -s "$out/$base.minic-stage2.s"
          sha256sum "$out/$target" >"$ev/init.after.sha256"
          cp "$out/$base.minic-stage2.s" "$ev/init.minic-stage2.s"
          riscv64-linux-gnu-objdump -dr "$out/$target" >"$ev/init.objdump.txt"
          grep -n -E 'RK_EARLY_(TAIL|REWIND|GLOBAL_ROLLBACK)' "$ev/init-refresh.log" >"$ev/rk-early-trace.txt" || true

      - name: Rebuild setup_arch owner with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-satp-refresh-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=arch/riscv/kernel/setup.o
          base=arch/riscv/kernel/setup
          mkdir -p "$ev"
          test -s "$out/$target"
          sha256sum "$out/$target" >"$ev/setup.before.sha256"
          rm -f "$out/$target" "$out/arch/riscv/kernel/.setup.o.cmd" \
            "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s" \
            "$out/$base.minic-stage2.minic.stdout" "$out/$base.minic-stage2.minic.stderr"
          start=$(date +%s%N)
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/setup-refresh.trace" \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j2 V=1 "$target" >"$ev/setup-refresh.log" 2>&1
          end=$(date +%s%N)
          echo "TIMING setup_refresh_ms=$(((end-start)/1000000)) target=$target" | tee -a "$ev/timing.txt"
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.i"
          test -s "$out/$base.minic-stage2.s"
          sha256sum "$out/$target" >"$ev/setup.after.sha256"
          cp "$out/$base.minic-stage2.s" "$ev/setup.minic-stage2.s"
          riscv64-linux-gnu-objdump -dr "$out/$target" >"$ev/setup.objdump.txt"
          echo 'SETUP_OWNER_REFRESH=PASS target=arch/riscv/kernel/setup.o'

      - name: Inspect set_satp_mode CSR window
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          python3 - <<'PY' | tee "$ev/satp-window.txt"
          import re
          from pathlib import Path
          text = Path("build/linux-runtime-satp-refresh-v0/init.objdump.txt").read_text(errors="replace").splitlines()
          start = next((i for i,l in enumerate(text) if '<set_satp_mode>:' in l), None)
          if start is None:
              raise SystemExit("SATP_WINDOW=FAIL no set_satp_mode symbol")
          end = len(text)
          for i in range(start + 1, len(text)):
              m = re.match(r'^([0-9a-f]+) <([^>]+)>:$', text[i].strip())
              if m and not m.group(2).startswith('.L'):
                  end = i
                  break
          body = text[start:end]
          first = next((i for i,l in enumerate(body) if re.search(r'\bcsrw\s+satp\b', l)), None)
          second = None if first is None else next((i for i,l in enumerate(body[first+1:], first+1) if re.search(r'\bcsrrwi?\b.*\bsatp\b', l)), None)
          print(f"SET_SATP_MODE_LINES={len(body)} FIRST_CSRW={first} NEXT_CSRRW={second}")
          if first is None or second is None:
              raise SystemExit("SATP_WINDOW=FAIL missing CSR pair")
          for line in body[max(0, first-8):min(len(body), second+9)]:
              print(line)
          window = body[first+1:second]
          stack_mem=[l for l in window if re.search(r'\b(?:lb|lbu|lh|lhu|lw|lwu|ld|sb|sh|sw|sd)\b[^\n]*\(sp\)', l)]
          print(f"SATP_INTER_CSR_STACK_MEM={len(stack_mem)}")
          for line in stack_mem:
              print("SATP_STACK_MEM", line)
          if stack_mem:
              raise SystemExit("SATP_WINDOW=FAIL stack memory between CSR writes")
          print("SATP_WINDOW=PASS")
          PY

          # Preserve the stricter historical linux-pi-real-init-gate-v0
          # assertion as well: between the real source-level SATP CSR pair,
          # no instruction may reference sp at all.
          python3 - "$ev/init.minic-stage2.s" <<'PY' | tee "$ev/satp-real-window.txt"
          import re, sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          csr = r'(?:satp|0x180)'
          windows=[]
          for i,line in enumerate(lines):
              if not re.search(r'\bcsrw\s+' + csr + r'\s*,', line):
                  continue
              end=None
              for j in range(i+1, min(len(lines), i+160)):
                  if re.search(r'\bcsrrw(?:i)?\s+[^,]+\s*,\s*' + csr + r'\s*,', lines[j]):
                      end=j
                      break
              if end is None:
                  continue
              unsafe=[]
              for k in range(i+1,end):
                  if re.search(r'\bsp\b', lines[k]):
                      unsafe.append((k+1,lines[k]))
              windows.append((i+1,end+1,unsafe))
          print(f'REAL_SATP_WINDOWS={len(windows)}')
          total=sum(len(x[2]) for x in windows)
          print(f'REAL_SATP_STACK_TOUCHES={total}')
          for n,(a,b,unsafe) in enumerate(windows):
              print(f'REAL_SATP_WINDOW index={n} begin={a} end={b} stack_touches={len(unsafe)}')
              for ln,text in unsafe[:32]:
                  print(f'REAL_SATP_STACK_TOUCH line={ln} text={text.strip()}')
          if not windows:
              raise SystemExit(2)
          if total:
              raise SystemExit(1)
          print('REAL_SATP_WINDOW=PASS')
          PY

      - name: Build early image after PI SATP and setup owner refresh
