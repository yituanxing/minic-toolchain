          printf '%s\n' 'lib/idr.o' 'lib/xarray.o' >"$ev/targets.txt"
          start=$(date +%s%N)
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/replay.trace" \
          MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
            "$wrapper" "${asm_args[@]}" -c -o "$out/lib/idr.o" "$frozen/lib__idr.i"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/replay.trace" \
          MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
            "$wrapper" "${asm_args[@]}" -c -o "$out/lib/xarray.o" "$frozen/lib__xarray.i"
          end=$(date +%s%N)
          echo "TIMING frozen_replay_ms=$(((end-start)/1000000)) objects=2" | tee -a "$ev/timing.txt"
          sha256sum "$out/lib/idr.o" "$out/lib/xarray.o" >"$ev/objects.sha256"
          cat "$out/lib/idr.minic-stage2.minic.stderr" "$out/lib/xarray.minic-stage2.minic.stderr" \
            >"$ev/minic-frame-trace.txt" 2>/dev/null || true

      - name: Build certified early runtime Image V2
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-frontier-fast-v5"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early"
          cat "$ev/early/timing.txt" >>"$ev/timing.txt"

      - name: Execute with certified event-driven frontier watcher
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-frontier-fast-v5"
          start=$(date +%s%N)
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 \
            | tee "$ev/watch.stdout.txt"
          classifier_rc=${PIPESTATUS[0]}
          set -e
          end=$(date +%s%N)
          echo "TIMING qemu_watch_wall_ms=$(((end-start)/1000000)) classifier_rc=$classifier_rc" | tee -a "$ev/timing.txt"
          cat "$ev/watch/watch-result.json" | tee -a "$ev/timing.txt"
          cp "$ev/watch/frontier-result.json" "$ev/frontier-result.json"
          cp "$ev/watch/frontier-summary.txt" "$ev/frontier-summary.txt"
          tail -n 200 "$ev/watch/qemu.console.log" >"$ev/qemu.console.tail.txt" || true
          {
            echo '## Linux Runtime Frontier Fast V5'
            echo
            echo '```text'
            cat "$ev/frontier-summary.txt"
            cat "$ev/timing.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$classifier_rc"

      - name: Preserve compact frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-frontier-fast-v5-${{ github.sha }}
          path: |
            build/linux-runtime-frontier-fast-v5/frontier-result.json
            build/linux-runtime-frontier-fast-v5/frontier-summary.txt
            build/linux-runtime-frontier-fast-v5/timing.txt
            build/linux-runtime-frontier-fast-v5/targets.txt
            build/linux-runtime-frontier-fast-v5/objects.sha256
            build/linux-runtime-frontier-fast-v5/qemu.console.tail.txt
            build/linux-runtime-frontier-fast-v5/replay.trace
            build/linux-runtime-frontier-fast-v5/minic-frame-trace.txt
            build/linux-runtime-frontier-fast-v5/early/timing.txt
            build/linux-runtime-frontier-fast-v5/early/fixture.txt
            build/linux-runtime-frontier-fast-v5/early/ld.stderr.txt
            build/linux-runtime-frontier-fast-v5/profile/minic.sha256
            build/linux-runtime-frontier-fast-v5/watch/watch-result.json
            build/linux-runtime-frontier-fast-v5/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7


  qemu-runtime:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'qemu' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-image-qemu-runtime-v0]'))
    concurrency:
      group: linux-image-qemu-runtime-v0-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute stable current-profile cache identity
        id: profile-cache
        shell: bash
        run: |
          set -Eeuo pipefail
          digest=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          printf 'LINUX_RUNTIME_PROFILE_CACHE_ID=%s\n' "$digest"

      - name: Restore latest Linux Image cache
        id: kbuild-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-image-v3-6.6.143-${{ runner.os }}-${{ steps.profile-cache.outputs.digest }}-${{ hashFiles('tools/ci/linux-expanded-owner-targets-v1.txt', 'tools/ci/linux-expanded-owner-refresh-v1.sh') }}
          fail-on-cache-miss: true

      - name: Install RV64 QEMU runtime prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            qemu-system-misc opensbi cpio gzip gcc-riscv64-linux-gnu libc6-dev-riscv64-cross device-tree-compiler python3
          chmod +x tests/external/linux/qemu_explicit_initrd_wrapper.py
          qemu-system-riscv64 --version
          riscv64-linux-gnu-gcc --version | head -n1

      - name: Verify cached Linux Image exists
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          image="$work/out/arch/riscv/boot/Image"
          mkdir -p "$work/runtime-evidence"
          test "${{ steps.kbuild-cache.outputs.cache-hit }}" = "true"
          printf 'QEMU_CACHE_HIT=%s\nQEMU_CACHE_MATCHED_KEY=%s\n' \
            "${{ steps.kbuild-cache.outputs.cache-hit }}" \
            "${{ steps.kbuild-cache.outputs.cache-matched-key }}" \
            | tee "$work/runtime-evidence/cache.txt"
          test -s "$image"
          stat -c 'LINUX_RUNTIME_IMAGE bytes=%s path=%n' "$image" \
            | tee "$work/runtime-evidence/image.txt"
          sha256sum "$image" | tee "$work/runtime-evidence/image.sha256"

      - name: Build minimal RV64 initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          root="$work/runtime-root"
          ev="$work/runtime-evidence"
          rm -rf "$root"
          mkdir -p "$root"/{dev,proc,sys,tmp}
          cat >"$work/init.c" <<'EOF'
          #include <unistd.h>
          #include <sys/reboot.h>
          #include <linux/reboot.h>
          #include <string.h>

          int main(void) {
              static const char marker[] = "MINIC_LINUX_RUNTIME_PASS\n";
              (void)write(STDOUT_FILENO, marker, sizeof(marker) - 1U);
              sync();
              (void)reboot(LINUX_REBOOT_CMD_POWER_OFF);
              for (;;) pause();
          }
          EOF
          riscv64-linux-gnu-gcc -static -Os -s "$work/init.c" -o "$root/init"
          file "$root/init" | tee "$ev/init-file.txt"
          (cd "$root" && find . -print0 | cpio --null -ov --format=newc 2>"$ev/cpio.log" | gzip -9 >"$work/initramfs.cpio.gz")
          test -s "$work/initramfs.cpio.gz"
          stat -c 'LINUX_RUNTIME_INITRAMFS bytes=%s' "$work/initramfs.cpio.gz" | tee "$ev/initramfs.txt"

      - name: Boot MiniC-built Linux Image in QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          image="$work/out/arch/riscv/boot/Image"
          initrd="$work/initramfs.cpio.gz"
          ev="$work/runtime-evidence"
          log="$ev/qemu.log"
          start=$(date +%s)
          set +e
          QEMU_REAL_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_EXPLICIT_DTB_DIR="$work/runtime-dtb" \
          timeout 90s python3 tests/external/linux/qemu_explicit_initrd_wrapper.py \
            -machine virt \
            -cpu max \
            -m 512M \
            -smp 1 \
            -nographic \
            -no-reboot \
            -bios default \
            -kernel "$image" \
            -initrd "$initrd" \
            -append 'console=ttyS0 earlycon=sbi rdinit=/init panic=-1' \
            >"$log" 2>&1
          rc=$?
          set -e
          elapsed=$(($(date +%s) - start))
          printf 'QEMU_EXIT_RC=%s\nQEMU_ELAPSED_S=%s\n' "$rc" "$elapsed" | tee "$ev/runtime.txt"
          tail -n 160 "$log" | tee "$ev/qemu-tail.log"
          grep -a -F 'MINIC_LINUX_RUNTIME_PASS' "$log"
          if grep -a -E 'Kernel panic|Oops:|BUG:|Unable to handle kernel|unhandled signal' "$log"; then
            echo 'LINUX_QEMU_RUNTIME=FAIL_FATAL_KERNEL_PATTERN' | tee -a "$ev/runtime.txt"
            exit 1
          fi
          echo 'LINUX_QEMU_RUNTIME=PASS' | tee -a "$ev/runtime.txt"

      - name: Preserve QEMU runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-image-qemu-runtime-v0
          path: build/linux-expanded-kbuild-v0/runtime-evidence/
          if-no-files-found: ignore
          retention-days: 7
