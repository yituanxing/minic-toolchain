          grep -Fq 'cmdline_early.minic-stage2.s' "$ev/pi-owner-refresh.log" || \
            grep -Fq 'stage2_kbuild_cc.sh' "$ev/pi-owner-refresh.log"
          echo 'PI_OWNER_ASM=PASS local_string=lla'
          echo 'PI_FRESH_OWNER=PASS'

      - name: Checkpoint PI-only runtime differential
        shell: bash
        run: |
