          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1

      - name: Prove frontier classifier invariants
        run: python3 tools/ci/linux-runtime-frontier-v1.py --self-test

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
