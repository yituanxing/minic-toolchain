      - name: Inspect set_satp_mode CSR window
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-satp-refresh-v0"
          python3 - <<'PY' | tee "$ev/satp-window.txt"
          import re
          from pathlib import Path
          text = Path("build/linux-runtime-satp-refresh-v0/init.objdump.txt").read_text(errors="replace").splitlines()
          start = next((i for i,l in enumerate(text) if '<set_satp_mode>:' in l), None)
          if start is None:
              raise SystemExit("SATP_WINDOW=FAIL no set_satp_mode symbol")
          end = len(text)
          for i in range(start + 1, len(text)):
              m = re.match(r'^([0-9a-f]+) <([^>]+)>:$', text[i].strip())
              if m and not m.group(2).startswith('.L'):
                  end = i
                  break
          body = text[start:end]
          first = next((i for i,l in enumerate(body) if re.search(r'\bcsrw\s+satp\b', l)), None)
          second = None if first is None else next((i for i,l in enumerate(body[first+1:], first+1) if re.search(r'\bcsrrwi?\b.*\bsatp\b', l)), None)
          print(f"SET_SATP_MODE_LINES={len(body)} FIRST_CSRW={first} NEXT_CSRRW={second}")
          if first is None or second is None:
              raise SystemExit("SATP_WINDOW=FAIL missing CSR pair")
          for line in body[max(0, first-8):min(len(body), second+9)]:
              print(line)
          window = body[first+1:second]
          stack_mem=[l for l in window if re.search(r'\b(?:lb|lbu|lh|lhu|lw|lwu|ld|sb|sh|sw|sd)\b[^\n]*\(sp\)', l)]
          print(f"SATP_INTER_CSR_STACK_MEM={len(stack_mem)}")
          for line in stack_mem:
              print("SATP_STACK_MEM", line)
          if stack_mem:
              raise SystemExit("SATP_WINDOW=FAIL stack memory between CSR writes")
          print("SATP_WINDOW=PASS")
          PY

          # Preserve the stricter historical linux-pi-real-init-gate-v0
          # assertion as well: between the real source-level SATP CSR pair,
          # no instruction may reference sp at all.
          python3 - "$ev/init.minic-stage2.s" <<'PY' | tee "$ev/satp-real-window.txt"
          import re, sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          csr = r'(?:satp|0x180)'
          windows=[]
          for i,line in enumerate(lines):
              if not re.search(r'\bcsrw\s+' + csr + r'\s*,', line):
                  continue
              end=None
              for j in range(i+1, min(len(lines), i+160)):
                  if re.search(r'\bcsrrw(?:i)?\s+[^,]+\s*,\s*' + csr + r'\s*,', lines[j]):
                      end=j
                      break
              if end is None:
                  continue
              unsafe=[]
              for k in range(i+1,end):
                  if re.search(r'\bsp\b', lines[k]):
                      unsafe.append((k+1,lines[k]))
              windows.append((i+1,end+1,unsafe))
          print(f'REAL_SATP_WINDOWS={len(windows)}')
          total=sum(len(x[2]) for x in windows)
          print(f'REAL_SATP_STACK_TOUCHES={total}')
          for n,(a,b,unsafe) in enumerate(windows):
              print(f'REAL_SATP_WINDOW index={n} begin={a} end={b} stack_touches={len(unsafe)}')
              for ln,text in unsafe[:32]:
                  print(f'REAL_SATP_STACK_TOUCH line={ln} text={text.strip()}')
          if not windows:
              raise SystemExit(2)
          if total:
              raise SystemExit(1)
          print('REAL_SATP_WINDOW=PASS')
          PY

