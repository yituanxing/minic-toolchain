            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          watch_rc=${PIPESTATUS[0]}
          set -e
          context_rc=0
          if test -s "$ev/watch/frontier-result.json" && test -s "$ev/watch/qemu.trace.log"; then
            set +e
            python3 tools/ci/linux-runtime-fault-context-v1.py \
              --nm "$ev/early/nm.txt" --trace "$ev/watch/qemu.trace.log" \
              --frontier-json "$ev/watch/frontier-result.json" --vmlinux "$ev/early/vmlinux.early" \
              --out "$ev/fault-context.json" | tee "$ev/fault-context.txt"
            context_rc=${PIPESTATUS[0]}
            set -e
          fi
          { echo '## Linux Runtime SATP Refresh V0'; echo; echo '```text'; \
            cat "$ev/satp-window.txt" || true; cat "$ev/watch/frontier-summary.txt" || true; \
