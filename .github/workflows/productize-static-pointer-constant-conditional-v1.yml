name: Productize Static Pointer Constant Conditional V1
on:
  push:
    branches: [product/static-pointer-constant-conditional-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/static-pointer-constant-conditional-v1
          fetch-depth: 0
      - name: Materialize clean source and contract
        run: |
          set -Eeuo pipefail
          git show origin/staging/string-octal-v1:tools/dev/materialize-static-pointer-constant-conditional-v1.py > tools/dev/.productize-static-pointer-constant-conditional-v1.py
          python3 tools/dev/.productize-static-pointer-constant-conditional-v1.py
          rm tools/dev/.productize-static-pointer-constant-conditional-v1.py
          cat > tests/compiler/c0/static_pointer_constant_conditional.c <<'EOF'
          static int value;
          static int *selected = 1 ? &value : 0;
          static int *null_selected = 0 ? &value : 0;
          int main(void) { return selected == &value && null_selected == 0 ? 0 : 1; }
          EOF
          cat > tests/compiler/c0/run-static-pointer-constant-conditional.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/static-pointer-constant-conditional
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c "$root/tests/compiler/c0/static_pointer_constant_conditional.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          grep -F 'selected:' "$work/output.s" >/dev/null
          grep -F 'null_selected:' "$work/output.s" >/dev/null
          grep -F '  .dword value' "$work/output.s" >/dev/null
          grep -F '  .dword 0' "$work/output.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/static-pointer-constant-conditional symbol+null selected-by-ICE'
          EOF
          chmod +x tests/compiler/c0/run-static-pointer-constant-conditional.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" \
          BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
          sh "$root/tests/compiler/c0/run-static-pointer-constant-conditional.sh"
          EOF
          clang-format-18 -i src/frontend/parser_global.c tests/compiler/c0/static_pointer_constant_conditional.c
          git diff --check
      - name: Validate Werror focused and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-static-pointer-conditional
          MINIC="$GITHUB_WORKSPACE/build/product-static-pointer-conditional/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/product-static-pointer-conditional" sh tests/compiler/c0/run-static-pointer-constant-conditional.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-static-pointer-conditional-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-static-pointer-constant-conditional-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: fold ICE conditionals in static pointer initializers'
          git push origin HEAD:product/static-pointer-constant-conditional-v1
