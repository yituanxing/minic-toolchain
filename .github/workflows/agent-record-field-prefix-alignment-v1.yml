name: Agent Record Field Prefix Alignment V1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0
      - name: Generate record field prefix alignment source
        run: python3 tools/dev/agent_record_field_prefix_alignment_v1.py
      - name: Format generated source
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-record-field-prefix-alignment
      - name: Run aligned record field focused contract
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-record-field-prefix-alignment/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-record-field-prefix-alignment-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-aligned-record-fields.sh
      - name: Run Foundation focused contracts
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-record-field-prefix-alignment/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-record-field-prefix-alignment-foundation" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh
      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-record-field-prefix-alignment check-fast
      - name: Publish generated source to scratch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_record.c \
                  tests/compiler/c0/gnu_aligned_record_field.c \
                  tests/compiler/c0/run-gnu-aligned-record-fields.sh
          git commit -m 'frontend: accept pre-declarator record field alignment'
          git push --force origin HEAD:agent/record-field-prefix-alignment-v1
