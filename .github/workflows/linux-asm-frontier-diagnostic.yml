name: Linux Assembly Frontier Diagnostic

on:
  push:
    branches: [tests/linux-asm-frontier-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Build MiniC candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/linux-batch-compiler

      - name: Drive fixed first-100 Linux batch
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/linux-batch-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-batch" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 \
          LINUX_BATCH_LIMIT=100 \
          LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh

      - name: Retain KVM assembly-frontier evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/linux-batch/asm-frontier/arch/riscv/kvm
          for rel in arch/riscv/kvm/vm.i arch/riscv/kvm/vcpu.i; do
            src="build/linux-batch/kbuild/$rel"
            out="build/linux-batch/minic-out/$rel.s"
            if test -f "$src"; then
              gzip -c "$src" > "build/linux-batch/asm-frontier/$rel.gz"
            fi
            if test -f "$out"; then
              cp "$out" "build/linux-batch/asm-frontier/$rel.s"
              printf '%s\n' "=== tail $rel.s ==="
              tail -n 120 "$out" || true
            fi
          done
          cat build/linux-batch/batch-summary.txt || true

      - name: Upload assembly-frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-asm-frontier-${{ github.run_id }}
          path: |
            build/linux-batch/batch-summary.txt
            build/linux-batch/batch-results.json
            build/linux-batch/failure-contexts.txt
            build/linux-batch/minic-stderr/arch/riscv/kvm/vm.i.stderr
            build/linux-batch/minic-stderr/arch/riscv/kvm/vcpu.i.stderr
            build/linux-batch/asm-frontier/**
          if-no-files-found: ignore
          retention-days: 7
