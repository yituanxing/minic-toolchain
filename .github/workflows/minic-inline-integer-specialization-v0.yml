name: MiniC Inline Integer Specialization V0

on:
  push:
    branches:
      - agent/linux-local-integer-isolate-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install RV64 tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross qemu-user python3
      - name: Build specialization prototype
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/inline-integer-specialization-v0"
          build="$work/toolchain"
          mkdir -p "$work"
          python3 tools/ci/apply-local-integer-assignment-v2.py | tee "$work/local-integer-patch.log"
          python3 tools/ci/apply-local-integer-logical-conditions-v0.py | tee "$work/logical-conditions-patch.log"
          python3 tools/ci/apply-inline-integer-specialization-v0.py | tee "$work/specialization-patch.log"
          python3 tools/ci/apply-inline-specialization-local-facts-v0.py | tee "$work/specialization-local-facts-patch.log"
          python3 tools/ci/apply-inline-specialization-stable-parameter-facts-v0.py | tee "$work/specialization-stable-parameter-facts-patch.log"
          python3 tools/ci/apply-inline-specialization-transitive-integer-v0.py | tee "$work/specialization-transitive-integer-patch.log"
          python3 tools/ci/apply-inline-specialization-label-alias-v0.py | tee "$work/specialization-label-alias-patch.log"
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" all

          cat >"$work/probe.c" <<'C'
          static inline __attribute__((always_inline))
          int helper(int dynamic, int value, int compile_time) {
              if (dynamic == 12345)
                  return 6;
              if (!0 && compile_time) {
                  extern void __compiletime_assert_probe(void)
                      __attribute__((error("specialized dead path survived")));
                  if (!(value < 10))
                      __compiletime_assert_probe();
                  goto selected;
              }
              return 7;
          selected:
              return value;
          }

          int main(int argc, char **argv) {
              (void)argv;
              int a = helper(argc, 3, 1);
              int b = helper(argc, 99, 0);
              return (a == 3 && b == 7) ? 0 : 1;
          }
          C
          riscv64-linux-gnu-gcc -E -P -std=gnu11 -x c "$work/probe.c" -o "$work/probe.i"
          MINIC_LOCAL_FACT_TRACE=1 "$build/bin/minic" -S "$work/probe.i" -o "$work/probe.s" 2>"$work/probe.trace"
          grep -F 'MINIC_INLINE_INTEGER_SPECIALIZATION_V0 clones=' "$work/probe.trace"
          grep -F 'INLINE_SPEC_PARAMETER_FACT' "$work/probe.trace"
          if grep -F '__compiletime_assert_probe' "$work/probe.s"; then
            echo 'specialized dead compile-time error path survived after logical condition' >&2
            exit 1
          fi
          grep -F '__minic_inline_spec_' "$work/probe.s"
          test "$(grep -Ec '^\\.Luser_[0-9]+:$' "$work/probe.s" || true)" -le 1
          riscv64-linux-gnu-gcc -static "$work/probe.s" -o "$work/probe"
          qemu-riscv64 "$work/probe"

          cat >"$work/transitive.c" <<'C'
          static inline __attribute__((always_inline))
          int leaf(int value, int compile_time) {
              if (value <= 10)
                  return value;
              if (!0 && compile_time) {
                  extern void __compiletime_assert_nested(void)
                      __attribute__((error("nested specialized dead path survived")));
                  __compiletime_assert_nested();
              }
              return 77;
          }

          static inline __attribute__((always_inline))
          int outer(int dynamic, int value) {
              if (dynamic == 12345)
                  return 6;
              return leaf(value, 1);
          }

          int main(int argc, char **argv) {
              (void)argv;
              return outer(argc, 3) == 3 ? 0 : 1;
          }
          C
          riscv64-linux-gnu-gcc -E -P -std=gnu11 -x c "$work/transitive.c" -o "$work/transitive.i"
          MINIC_INLINE_SPEC_TRANSITIVE_TRACE=1 "$build/bin/minic" -S "$work/transitive.i" -o "$work/transitive.s" 2>"$work/transitive.trace"
          grep -F 'MINIC_INLINE_INTEGER_SPECIALIZATION_TRANSITIVE_V0 refined=' "$work/transitive.trace"
          grep -F 'INLINE_SPEC_TRANSITIVE_SELECT ' "$work/transitive.trace"
          if grep -F '__compiletime_assert_nested' "$work/transitive.s"; then
            echo 'nested specialized dead compile-time error path survived' >&2
            exit 1
          fi
          riscv64-linux-gnu-gcc -static "$work/transitive.s" -o "$work/transitive"
          qemu-riscv64 "$work/transitive"
          echo 'MINIC_INLINE_INTEGER_SPECIALIZATION_V0=PASS variants=PASS unknown_join=PASS logical_condition=PASS transitive=PASS label_alias=PASS runtime=PASS'
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-inline-integer-specialization-v0
          path: build/inline-integer-specialization-v0/
          if-no-files-found: ignore
          retention-days: 5
