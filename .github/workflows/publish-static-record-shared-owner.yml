name: Publish static record shared owner

on:
  push:
    branches:
      - frontend/static-record-shared-owner-staging

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/parser_global.c')
          text = path.read_text()

          start = text.index('static bool static_record_has_direct_function_pointer')
          end = text.index('static bool\nappend_static_constant_zero', start)
          text = text[:start] + text[end:]

          start = text.index('static bool ensure_static_record_base_value')
          end = text.index('static bool count_static_array_initializer_elements', start)
          text = text[:start] + text[end:]

          start = text.index('static bool parse_static_record(')
          end = text.index('static bool parse_extern_function_pointer_object_declarator', start)
          replacement = '''static bool parse_static_record(MinicParser *parser, MinicType type, MinicSourceSpan name_span) {
              const MinicRecord *record;

              record = minic_c0_program_record(parser->program, type.record_id);
              if (record == NULL || !record->is_complete) {
                  minic_parser_error(parser, "static record global requires a complete record type");
                  return false;
              }
              if (parser->current.kind == MINIC_TOKEN_LBRACKET) {
                  return parse_static_record_array(parser, type, name_span);
              }
              return parse_static_nested_record_object(parser, type, name_span);
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          case = Path('tests/compiler/c0/static_mixed_symbol_relocations.c')
          source = case.read_text()
          old = 'static struct setup_entry entry = {setup_name, setup_fn, 1};'
          new = '''static struct setup_entry entry = {
              .name = setup_name,
              .fn = setup_fn,
              .early = 1,
          };'''
          if old not in source:
              raise SystemExit('static mixed relocation regression shape changed')
          case.write_text(source.replace(old, new, 1))

          focused = Path('tests/compiler/c0/run-foundation-focused.sh')
          source = focused.read_text()
          anchor = '    run-static-nested-record-initializers.sh \\\n'
          insert = anchor + '    run-static-mixed-symbol-relocations.sh \\\n'
          if anchor not in source:
              raise SystemExit('Foundation focused insertion anchor changed')
          focused.write_text(source.replace(anchor, insert, 1))
          PY

          clang-format-18 -i src/frontend/parser_global.c tests/compiler/c0/static_mixed_symbol_relocations.c
          clang-format-18 --dry-run --Werror src/frontend/parser_global.c tests/compiler/c0/static_mixed_symbol_relocations.c

      - name: Focused sanitizer regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=sanitize BUILD_DIR=build/static-record-owner-sanitize
          MINIC="$PWD/build/static-record-owner-sanitize/bin/minic" \
          BUILD_DIR="$PWD/build/static-record-owner-sanitize" \
            sh tests/compiler/c0/run-static-mixed-symbol-relocations.sh

      - name: Foundation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/static-record-owner-release
          MINIC="$PWD/build/static-record-owner-release/bin/minic" \
          BUILD_DIR="$PWD/build/static-record-owner-release" \
            sh tests/compiler/c0/run-foundation-focused.sh

      - name: Commit product-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git rm .github/workflows/publish-static-record-shared-owner.yml
          git add src/frontend/parser_global.c \
                  tests/compiler/c0/static_mixed_symbol_relocations.c \
                  tests/compiler/c0/run-foundation-focused.sh
          git commit -m 'refactor(frontend): unify static record initializer ownership' \
            -m 'Route every non-array static record through the canonical static-storage initializer owner. Remove the legacy direct-function-pointer record path so designated function-symbol members reuse the same semantic relocation machinery as nested/static aggregate initialization.' \
            -m '中文说明：所有非数组 static record 统一走 canonical static-storage initializer owner；删除旧的 direct-function-pointer record 专用路径，使 designated function-symbol member 与其他静态聚合初始化共享同一套语义 relocation 机制。'
          git push origin HEAD:frontend/static-record-shared-owner-staging
