name: Core M175B Scalar Double Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect M175B state
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M175B_SCALAR_DOUBLE_BRIDGE' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
            echo "M175B_ALREADY_PRODUCTIZED head=$(git rev-parse HEAD)"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
            echo "M175B_SOURCE_HEAD=$(git rev-parse HEAD)"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Materialize M175B qualification candidate
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m175b-qualification.py
          git diff --check
          grep -Fq 'M175B_SCALAR_DOUBLE_BRIDGE' src/core/core_lower.c
          grep -Fq 'M175B_SCALAR_RETURN_OWNER' src/core/core_lower.c
          grep -Fq 'M175C_LOCAL_COMPLETE_OBJECT_OWNER' src/frontend/parser_statement.c
          grep -Fq 'MINIC_CORE_INSTRUCTION_FLOATING_CONSTANT' src/core/core_ir.h
          grep -Fq 'MINIC_CORE_INSTRUCTION_INTEGER_TO_DOUBLE' src/core/core_ir.h
          grep -Fq 'MINIC_CORE_INSTRUCTION_DOUBLE_TO_INTEGER' src/core/core_ir.h

      - name: Build patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m175b-compiler

      - name: Run cast fast target
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-cast-expressions MODE=release CFLAGS=-Werror BUILD_DIR=build/m175b-cast

      - name: Run isolated scalar double strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175b-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175b-regression"
          mkdir -p "$work"

          cc -E -P -std=gnu11 -x c tests/compiler/c0/cast_integer_to_double.c -o "$work/int-to-double.i"
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 "$compiler" -S "$work/int-to-double.i" -o "$work/int-to-double.s"
          grep -E '^[[:space:]]+fcvt\.d\.w[[:space:]]+' "$work/int-to-double.s" >/dev/null
          grep -E '^[[:space:]]+fmv\.d\.x[[:space:]]+fa0,' "$work/int-to-double.s" >/dev/null
          grep -F '.Lconvert_to_double_core_return:' "$work/int-to-double.s" >/dev/null

          cc -E -P -std=gnu11 -x c tests/compiler/c0/cast_double_to_integer.c -o "$work/double-to-int.i"
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 "$compiler" -S "$work/double-to-int.i" -o "$work/double-to-int.s"
          grep -E '^[[:space:]]+fcvt\.w\.d[[:space:]]+[^,]+,[[:space:]]*[^,]+,[[:space:]]*rtz$' "$work/double-to-int.s" >/dev/null
          grep -F '.Lmain_core_return:' "$work/double-to-int.s" >/dev/null
          printf '%s\n' 'CORE_M175B_STRICT_REGRESSION int-to-double=PASS double-local=PASS double-to-int=PASS double-return=PASS'

      - name: Qualify local complete object diagnostics
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-pointer-members MODE=release CFLAGS=-Werror BUILD_DIR=build/m175b-pointer

      - name: Materialize Core fast contracts
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-core-fast-contracts.py
          git diff --check
          grep -Fq 'normalized=core-contract' tests/compiler/c0/run.sh
          grep -Fq '.Lmain_core_return:' tests/compiler/c0/run.sh

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175b-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175b-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M175B_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/m175b-full500')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['pass'] != 500 or summary['unsupported'] != 0 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M175B requires exact strict500 500/500: {summary}')
          print('CORE_M175B_FULL500 selected=500 pass=500 unsupported=0 error=0')
          PY

      - name: Run Core-default check-fast
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m175b-fast

      - name: Productize M175B
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c src/frontend/parser_statement.c tests/compiler/c0/run.sh
          git diff --cached --quiet && { echo 'no M175B semantic or Core contract changes'; exit 1; }
          git commit -m 'core: add narrow scalar double bridge'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M175B evidence
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m175b-scalar-double-${{ github.sha }}
          path: |
            build/m175b-regression/**
            build/m175b-full500/**
          if-no-files-found: warn
