name: MiniLD A3 Static Runtime Archive

on:
  push:
    branches:
      - "toolchain/minild-static-a3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minild-a3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V static oracle/runtime
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils-riscv64-linux-gnu qemu-user

      - name: Build MiniLD with strict warnings
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a3 all

      - name: Keep A0 through A2 green
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a3 check-minild-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a3 check-minild-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a3 check-minild-a2

      - name: Run regular archive malloc/free runtime gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a3 check-minild-a3
