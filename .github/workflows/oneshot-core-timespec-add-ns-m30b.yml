name: One-shot Core timespec64_add_ns M30b

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Probe next timespec frontier on M30 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 tools/dev/patch-core-aggregate-boundary-m30.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m30b-probe
          c="$GITHUB_WORKSPACE/build/m30b-probe/bin/minic"
          w="$GITHUB_WORKSPACE/build/m30b-shapes"
          mkdir -p "$w"

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('build/linux-focus-corpus/kbuild/init/do_mounts.i')
          text = p.read_text(errors='replace')
          name = 'timespec64_add_ns'
          for m in re.finditer(r'\b' + name + r'\s*\(', text):
              paren = text.find('(', m.start())
              depth = 0
              end_paren = None
              for i in range(paren, len(text)):
                  if text[i] == '(':
                      depth += 1
                  elif text[i] == ')':
                      depth -= 1
                      if depth == 0:
                          end_paren = i + 1
                          break
              if end_paren is None:
                  continue
              semi = text.find(';', end_paren)
              brace = text.find('{', end_paren)
              if brace < 0 or (semi >= 0 and semi < brace):
                  continue
              start = text.rfind('\n', 0, max(0, m.start() - 700)) + 1
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          print(f'M30B_EXACT_BEGIN name={name} file={p}')
                          print(text[start:i+1])
                          print(f'M30B_EXACT_END name={name}')
                          raise SystemExit(0)
          raise SystemExit('M30B exact timespec64_add_ns missing')
          PY

          cat > "$w/pointer_record_member_update.i" <<'EOF'
          struct M30N { long sec; long nsec; };
          void m30_pointer_record_member_update(struct M30N *p, long ns) { p->nsec += ns; }
          EOF

          cat > "$w/record_pointer_member_update.i" <<'EOF'
          struct M30N2 { long sec; long nsec; };
          void m30_record_pointer_member_update(struct M30N2 *p, long ns) {
              p->nsec = p->nsec + ns;
              p->sec = p->sec + p->nsec / 1000000000L;
          }
          EOF

          cat > "$w/record_pointer_if_update.i" <<'EOF'
          struct M30N3 { long sec; long nsec; };
          void m30_record_pointer_if_update(struct M30N3 *p, long ns) {
              p->nsec += ns;
              if (p->nsec >= 1000000000L) { p->sec++; p->nsec -= 1000000000L; }
          }
          EOF

          for n in pointer_record_member_update record_pointer_member_update record_pointer_if_update; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "$w/$n.i" -o "$w/$n.s" 2>"$w/$n.err"
              rc=$?
              set -e
              printf 'M30B_SHAPE name=%s rc=%d message=' "$n" "$rc"
              tr '\n' ' ' < "$w/$n.err"
              printf '\n'
          done

          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/do_mounts.i -o "$w/do_mounts.s" 2>"$w/do_mounts.err"
          rc=$?
          set -e
          printf 'M30B_FROZEN rc=%d message=' "$rc"
          tr '\n' ' ' < "$w/do_mounts.err"
          printf '\n'
