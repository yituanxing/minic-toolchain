name: Productize Runtime Record Array V5
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/runtime-record-array-v5
          fetch-depth: 0
      - name: Apply proven runtime record-array semantics
        run: |
          set -Eeuo pipefail
          git show origin/staging/string-octal-v1:tools/dev/materialize-runtime-record-array-v1.py > tools/dev/.productize-runtime-record-array-v5.py
          python3 tools/dev/.productize-runtime-record-array-v5.py
          rm tools/dev/.productize-runtime-record-array-v5.py
      - name: Preserve arena pointer lifetime across growth
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/frontend/parser_statement.c')
          s = p.read_text()
          decl = '''    MinicExpression index_expression;\n    MinicExpression subscript;\n    MinicExpressionId index_id;\n'''
          repl = '''    MinicExpression index_expression;\n    MinicExpression subscript;\n    MinicExpressionId index_id;\n    MinicSourceSpan base_span;\n'''
          if s.count(decl) != 1:
              raise SystemExit('element-lvalue declaration anchor mismatch')
          s = s.replace(decl, repl, 1)
          anchor = '''        return false;\n    }\n\n    (void)memset(&index_expression, 0, sizeof(index_expression));\n'''
          replacement = '''        return false;\n    }\n    /* Expression storage is a growable arena. Copy values needed after the next\n       add_expression call instead of retaining an interior pointer across realloc. */\n    base_span = base->span;\n\n    (void)memset(&index_expression, 0, sizeof(index_expression));\n'''
          if s.count(anchor) < 1:
              raise SystemExit('element-lvalue span anchor missing')
          function_start = s.index('static bool add_array_object_element_lvalue(')
          anchor_pos = s.index(anchor, function_start)
          s = s[:anchor_pos] + replacement + s[anchor_pos + len(anchor):]
          old = '    subscript.span.begin = base->span.begin;\n'
          if old not in s[function_start:]:
              raise SystemExit('stale base span access missing')
          pos = s.index(old, function_start)
          s = s[:pos] + '    subscript.span.begin = base_span.begin;\n' + s[pos + len(old):]
          p.write_text(s)
          PY
      - name: Extend permanent focused contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tests/compiler/c0/runtime_record_array_initializer.c')
          src.write_text(src.read_text() + '''\nstruct timespec64_probe {\n    long tv_sec;\n    long tv_nsec;\n};\n\nlong runtime_record_array_local(long mtime) {\n    struct timespec64_probe t[2] = {{.tv_sec = mtime}, {.tv_sec = mtime}};\n    return t[0].tv_sec + t[1].tv_sec;\n}\n''')
          runner = Path('tests/compiler/c0/run-runtime-record-array-initializers.sh')
          text = runner.read_text()
          anchor = "grep -F 'linux_guid_compound_literal:' \"$work/runtime_record_array_initializer.s\" >/dev/null\n"
          if anchor not in text:
              raise SystemExit('runtime-record-array runner anchor missing')
          runner.write_text(text.replace(anchor, anchor + "grep -F 'runtime_record_array_local:' \"$work/runtime_record_array_initializer.s\" >/dev/null\n", 1))
          PY
          clang-format-18 -i src/frontend/parser_statement.c tests/compiler/c0/runtime_record_array_initializer.c
          git diff --check
      - name: Validate product slice and arena lifetime
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-runtime-record-array-v5
          MINIC="$GITHUB_WORKSPACE/build/product-runtime-record-array-v5/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-runtime-record-array-v5-focused" \
            sh tests/compiler/c0/run-runtime-record-array-initializers.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-runtime-record-array-v5-fast
          make -j4 MODE=debug \
            CFLAGS='-O1 -g3 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined' \
            BUILD_DIR=build/product-runtime-record-array-v5-asan
          ASAN_OPTIONS=detect_leaks=0 \
          MINIC="$GITHUB_WORKSPACE/build/product-runtime-record-array-v5-asan/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-runtime-record-array-v5-asan-focused" \
            sh tests/compiler/c0/run-runtime-record-array-initializers.sh
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/productize-runtime-record-array-v5.yml
          git add src/frontend/parser_statement.c tests/compiler/c0/runtime_record_array_initializer.c \
                  tests/compiler/c0/run-runtime-record-array-initializers.sh
          git commit -m 'frontend: initialize runtime arrays of records safely'
          git push origin HEAD:product/runtime-record-array-v5
