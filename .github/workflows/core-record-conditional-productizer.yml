name: Core M175B Strict500 Fast Lane

on:
  pull_request:
    branches:
      - ci/m175b-strict500-fast-20260826
  push:
    branches:
      - ci/m175b-strict500-fast-20260826

permissions:
  contents: read

jobs:
  strict500:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          echo "M175B_FAST_SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Materialize exact M175B candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          before_test_hash=$(git hash-object tests/compiler/c0/run.sh)
          python3 tools/ci/apply-m175b-qualification.py
          python3 tools/ci/apply-m175-core-only-cut.py
          git diff --check
          test "$before_test_hash" = "$(git hash-object tests/compiler/c0/run.sh)"
          grep -Fq 'M175B_SCALAR_DOUBLE_BRIDGE' src/core/core_lower.c
          grep -Fq 'M175B_SCALAR_RETURN_OWNER' src/core/core_lower.c
          grep -Fq 'M175C_LOCAL_COMPLETE_OBJECT_OWNER' src/frontend/parser_statement.c
          ! git grep -n 'minic_riscv64_write_c0_program(' -- src
          ! git grep -n 'minic_riscv64_emit_function(' -- src
          echo 'M175B_FAST_CORE_ONLY_CUT=PASS tests=UNCHANGED'

      - name: Build candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m175b-fast500-compiler

      - name: Qualify scalar double focused
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-cast-expressions MODE=release CFLAGS=-Werror BUILD_DIR=build/m175b-fast500-cast
          compiler="$GITHUB_WORKSPACE/build/m175b-fast500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175b-fast500-regression"
          mkdir -p "$work"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/cast_integer_to_double.c -o "$work/int-to-double.i"
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 "$compiler" -S "$work/int-to-double.i" -o "$work/int-to-double.s"
          grep -E '^[[:space:]]+fcvt\.d\.w[[:space:]]+' "$work/int-to-double.s" >/dev/null
          cc -E -P -std=gnu11 -x c tests/compiler/c0/cast_double_to_integer.c -o "$work/double-to-int.i"
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 "$compiler" -S "$work/double-to-int.i" -o "$work/double-to-int.s"
          grep -E '^[[:space:]]+fcvt\.w\.d[[:space:]]+[^,]+,[[:space:]]*[^,]+,[[:space:]]*rtz$' "$work/double-to-int.s" >/dev/null
          echo 'M175B_FAST_DOUBLE_FOCUSED=PASS'

      - name: Qualify local complete object diagnostics
        run: make -j4 check-pointer-members MODE=release CFLAGS=-Werror BUILD_DIR=build/m175b-fast500-pointer

      - name: Replay strict full500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175b-fast500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175b-fast500-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 --offset 0 --limit 500 --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M175B_FAST_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/m175b-fast500-full500')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          print('CORE_M175B_FAST_FULL500', summary)
          if summary['selected'] != 500 or summary['pass'] != 500 or summary['unsupported'] != 0 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M175B fast lane requires exact strict500 500/500: {summary}')
          print('CORE_M175B_FAST_FULL500_EXACT selected=500 pass=500 unsupported=0 error=0')
          PY

      - name: Persist fast-lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m175b-strict500-fast-${{ github.sha }}
          path: |
            build/m175b-fast500-regression/**
            build/m175b-fast500-full500/**
          if-no-files-found: warn
