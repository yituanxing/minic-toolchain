name: MiniC BusyBox musl Four ISA Full Kbuild Matrix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/minic-busybox-musl-matrix.yml'
      - 'tests/external/busybox/probe-musl-four-isa.sh'
      - 'tests/external/busybox/musl-gcc-oracle.py'
      - 'src/frontend/attribute.c'
      - 'src/frontend/attribute.h'
      - 'src/target/common/global_emit.c'
      - 'src/target/common/global_emit.h'
      - 'src/target/x86_64/global_emit.c'
concurrency:
  group: minic-busybox-musl-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  musl-four:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, gcc: gcc, prefix: "", qemu: qemu-x86_64, packages: ""}
          - {arch: riscv64, gcc: riscv64-linux-gnu-gcc, prefix: riscv64-linux-gnu-, qemu: qemu-riscv64, packages: "gcc-riscv64-linux-gnu libc6-dev-riscv64-cross"}
          - {arch: aarch64, gcc: aarch64-linux-gnu-gcc, prefix: aarch64-linux-gnu-, qemu: qemu-aarch64, packages: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross"}
          - {arch: loongarch64, gcc: loongarch64-linux-gnu-gcc-13, prefix: loongarch64-linux-gnu-, qemu: qemu-loongarch64, packages: "gcc-13-loongarch64-linux-gnu libc6-dev-loong64-cross"}
    steps:
      - uses: actions/checkout@v4
      - name: Cross GNU and QEMU prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          timeout 200s sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends qemu-user ${{ matrix.packages }}
          command -v "${{ matrix.gcc }}"
          command -v "${{ matrix.qemu }}"
      - name: Build current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/busybox-musl-four all
          test -s build/busybox-musl-four/bin/minic-cc
      - name: Original pinned BusyBox, static musl, all Kbuild MiniC objects and QEMU
        id: smoke
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/busybox-musl-four/bin/minic-cc
        run: |
          set -Eeuo pipefail
          bash -n tests/external/busybox/probe-musl-four-isa.sh
          python3 -m py_compile tests/external/busybox/musl-gcc-oracle.py
          bash tests/external/busybox/probe-musl-four-isa.sh \
            "${{ matrix.arch }}" "${{ matrix.gcc }}" "${{ matrix.prefix }}" "${{ matrix.qemu }}"
      - name: Record per-ISA musl status without claiming full BusyBox
        if: always()
        run: |
          echo "BUSYBOX_TWO_LIBC_STAGE arch=${{ matrix.arch }} musl_full_Kbuild=${{ steps.smoke.outcome }} glibc_all_owner=HISTORICALLY_PASS"
