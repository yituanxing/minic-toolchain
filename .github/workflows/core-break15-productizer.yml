name: Core Break15 Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  break15:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized break CFG fix
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M119_GENERAL_DO_WHILE_ZERO_CFG' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply general do-while-zero CFG fix
        if: steps.state.outputs.needs_patch == 'true'
        run: python3 tools/ci/apply-m119-retire-do-while-zero-shortcut.py

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/break15-compiler

      - name: Run fast host regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/break15-check

      - name: Replay break15 cohort
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/break15-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/break15"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '113,120,135,137,185,192,232,240,261,352,372,374,416,465,470'
          replay_status=$?
          set -e
          printf 'CORE_BREAK15_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 15 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 15 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          work = Path('build/break15')
          rows = json.loads((work / 'batch-results.json').read_text())
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if len(rows) != 15:
              raise SystemExit(f'expected 15 rows, got {len(rows)}')
          if summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(
                  f"break15 ERROR/missing: error={summary['error']} missing={summary['preprocess_missing']}"
              )
          stale = [family for family in summary.get('feature_families', [])
                   if family.get('family') == 'statement:MINIC_STATEMENT_BREAK']
          if stale:
              raise SystemExit(f'old BREAK frontier remains: {stale}')
          print(
              f"CORE_BREAK15_ACCEPT pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error=0 selected=15"
          )
          print('CORE_BREAK15_NEW_FEATURES ' +
                json.dumps(summary.get('feature_families', [])[:10], sort_keys=True))
          print((work / 'progress-summary.txt').read_text())
          PY

      - name: Commit general do-while-zero CFG semantic fix
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c
          git diff --cached --quiet && { echo 'no semantic changes to productize'; exit 1; }
          git commit -m 'core: route do-while-zero through general CFG'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist break15 result
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-break15-${{ github.sha }}
          path: |
            build/break15/batch-results.json
            build/break15/frontier-summary.json
            build/break15/progress-summary.json
            build/break15/progress-summary.txt
            build/break15/reason-summary.txt
            build/break15/minic-stderr/**
          if-no-files-found: warn
