name: Materialize RV64 record statement assignment

on:
  push:
    branches: [agent/linux-tail-pointer-array-v1]
    paths:
      - tools/dev/materialize-rv64-record-statement-assignment.py
      - .github/workflows/materialize-rv64-record-statement-assignment.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linux-tail-pointer-array-v1
          fetch-depth: 0
      - name: Materialize product code
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-rv64-record-statement-assignment.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build and run focused gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/record-assign
          MINIC="$GITHUB_WORKSPACE/build/record-assign/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/record-assign-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-record-assignment-expressions.sh
          MINIC="$GITHUB_WORKSPACE/build/record-assign/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/aggregate-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-rv64-integer-aggregate-return.sh
      - name: Write clean product commit
        run: |
          set -Eeuo pipefail
          git rm tools/dev/materialize-rv64-record-statement-assignment.py \
                 .github/workflows/materialize-rv64-record-statement-assignment.yml
          git add src/target/riscv64/codegen_statement.c \
                  tests/compiler/c0/record_assignment_expression.c \
                  tests/compiler/c0/run-record-assignment-expressions.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(riscv64): lower record statement assignments'
          git push origin HEAD:agent/linux-tail-pointer-array-v1
