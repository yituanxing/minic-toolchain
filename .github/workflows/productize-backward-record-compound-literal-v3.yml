name: Diagnose Backward Record Compound Literal V3
on:
  push:
    branches: [product/backward-record-compound-literal-v3]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/backward-record-compound-literal-v3
          fetch-depth: 0
      - name: Apply, validate, and persist result
        shell: bash
        run: |
          set -u
          out=diagnostics/backward-record-compound-literal-v3-r2
          mkdir -p "$out" tools/dev
          stage=materialize
          status=0
          mat=tools/dev/.diagnose-backward-record-v3.py

          git show origin/staging/string-octal-v1:tools/dev/materialize-backward-record-compound-literal-v1.py > "$mat" 2>"$out/git-show.err" || status=$?
          if [ "$status" -eq 0 ]; then
            python3 "$mat" >"$out/materialize.log" 2>&1 || status=$?
          fi
          rm -f "$mat"
          printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"
          if [ "$status" -eq 0 ]; then
            stage=format
            clang-format-18 -i src/frontend/parser_global.c >"$out/format.log" 2>&1 || status=$?
            printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"
          fi
          if [ "$status" -eq 0 ]; then
            stage=build
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/backward-record-v3-r2 >"$out/build.log" 2>&1 || status=$?
            printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"
          fi
          if [ "$status" -eq 0 ]; then
            stage=check-fast
            make -j4 check-fast MODE=release BUILD_DIR=build/backward-record-v3-r2-fast >"$out/check-fast.log" 2>&1 || status=$?
            printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"
          fi
          git diff -- src/frontend/parser_global.c > "$out/product.patch" || true
          printf '\nfinal_stage=%s\nfinal_status=%s\n' "$stage" "$status" >> "$out/status.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out"
          git commit -m 'diagnostic: record backward record v3 rerun' || true
          git push origin HEAD:product/backward-record-compound-literal-v3
          exit 0
