name: PR83 Materialize GNU Fallthrough Statement

on:
  pull_request:
    paths:
      - 'tools/dev/pr83-gnu-fallthrough-statement.patch'
      - '.github/workflows/pr83-materialize-gnu-fallthrough.yml'
      - 'src/frontend/attribute.c'
      - 'src/frontend/attribute.h'
      - 'src/frontend/parser_statement.c'
      - 'tests/compiler/c0/**fallthrough**'
      - 'tests/compiler/c0/run-switch-control-flow.sh'

permissions:
  contents: write

concurrency:
  group: pr83-gnu-fallthrough-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/gnu-fallthrough-statement-v0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize bounded statement-attribute slice
        shell: bash
        run: |
          set -Eeuo pipefail
          patch=tools/dev/pr83-gnu-fallthrough-statement.patch
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'GNU fallthrough statement v0 already materialized.'
          else
            echo 'GNU fallthrough patch no longer matches current source.' >&2
            exit 1
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/pr83 check
          MINIC="$GITHUB_WORKSPACE/build/pr83/bin/minic" \
          HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/pr83" \
            sh tests/compiler/c0/run-switch-control-flow.sh

      - name: Commit materialized source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/attribute.c src/frontend/attribute.h \
                  src/frontend/parser_statement.c \
                  tests/compiler/c0/gnu_fallthrough_statement.c \
                  tests/compiler/c0/invalid_fallthrough_outside_switch.c \
                  tests/compiler/c0/invalid_statement_attribute_target.c \
                  tests/compiler/c0/run-switch-control-flow.sh
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'frontend: model GNU fallthrough statements'
          git push origin HEAD:${{ github.head_ref }}
