name: Productize Record Conditional Type V3
on:
  push:
    branches: [product/record-conditional-type-v3]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/record-conditional-type-v3
          fetch-depth: 0
      - name: Apply proven record conditional type semantics
        run: |
          set -Eeuo pipefail
          git fetch origin 'refs/heads/staging/string-octal-v1:refs/remotes/origin/staging/string-octal-v1' --no-tags
          git show origin/staging/string-octal-v1:tools/dev/materialize-record-conditional-type-v1.py > tools/dev/.productize-record-conditional-type-v1.py
          python3 tools/dev/.productize-record-conditional-type-v1.py
          rm tools/dev/.productize-record-conditional-type-v1.py
      - name: Extend permanent conditional contract
        run: |
          set -Eeuo pipefail
          cat >> tests/compiler/c0/conditional_null_pointer_constant.c <<'EOF'

int choose_record_value(int condition) {
    struct node left = {"left", 11};
    const struct node right = {"right", 22};
    struct node value = condition ? left : right;
    return value.value;
}
EOF
      - name: Validate product slice
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-record-conditional
          MINIC="$GITHUB_WORKSPACE/build/product-record-conditional/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-record-conditional-focused" \
            sh tests/compiler/c0/run-conditional-null-pointer-constant.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-record-conditional-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/productize-record-conditional-type-v3.yml
          git add src/frontend/expression_semantics.c tests/compiler/c0/conditional_null_pointer_constant.c
          git commit -m 'frontend: type compatible record conditionals'
          git push origin HEAD:product/record-conditional-type-v3
