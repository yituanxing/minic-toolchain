      - name: AArch64 Linux NZCV GNU-ASM contract, independent GNU/QEMU oracle
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          set -Eeuo pipefail
          source=tests/compiler/c0/aarch64-nzcv-nospec.i
          cc=build/runtime-ci/bin/minic-cc
          mkdir -p build/aarch64-nzcv
          aarch64-linux-gnu-gcc -static -x c "$source" -o build/aarch64-nzcv/gnu.elf
          set +e
          qemu-aarch64 build/aarch64-nzcv/gnu.elf
          gnu_actual=$?
          set -e
          test "$gnu_actual" -eq 42 || { echo 'FAIL GNU NZCV oracle'; exit 1; }
          "$cc" --target=aarch64-linux -S "$source" -o build/aarch64-nzcv/minic.s
          grep -F '  cmp x10, x11' build/aarch64-nzcv/minic.s
          grep -F '  sbc x9, xzr, xzr' build/aarch64-nzcv/minic.s
          grep -F '  mov x9, sp' build/aarch64-nzcv/minic.s
          grep -F '  ldr x9, [sp, #' build/aarch64-nzcv/minic.s
          aarch64-linux-gnu-gcc -static -x assembler build/aarch64-nzcv/minic.s \
            -o build/aarch64-nzcv/minic.elf
          set +e
          qemu-aarch64 build/aarch64-nzcv/minic.elf
          actual=$?
          set -e
          test "$actual" -eq 42
          echo 'AARCH64_NZCV_ASM_GNU_QEMU=PASS original_C=1 live_sp=1 saved_LR=1 compiler_abi=1 exit=42'
          # An unrelated instruction or operand policy cannot be admitted
          # merely because AArch64 recognizes the cc/NZCV clobber token.
          sed 's/sbc %0, xzr, xzr/sbc %0, xzr, xzr; nop/' "$source" \
            > build/aarch64-nzcv/unknown.i
          if "$cc" --target=aarch64-linux -S build/aarch64-nzcv/unknown.i \
                -o build/aarch64-nzcv/unknown.s \
                >build/aarch64-nzcv/unknown.stdout \
                2>build/aarch64-nzcv/unknown.stderr; then
            echo 'FAIL: unqualified AArch64 ASM instruction admitted' >&2
            exit 1
          fi
          echo 'AARCH64_NZCV_ASM_UNQUALIFIED=REJECTED'
          # Genuine AArch64 Linux get_current: EL1 MRS sp_el0. Compile
          # target code and GNU assembler, but do NOT execute privileged
          # MRS in user-mode QEMU.
          cat > build/aarch64-nzcv/sysreg.i <<'EOF'
          unsigned long read_sp_el0(void) {
            unsigned long x; asm("mrs %0, sp_el0" : "=r"(x)); return x;
          }
          unsigned long read_tpidr_el1(void) {
            unsigned long x; asm("mrs %0, tpidr_el1" : "=r"(x)); return x;
          }
          unsigned long read_tpidr_el2(void) {
            unsigned long x; asm("mrs %0, tpidr_el2" : "=r"(x)); return x;
          }
          EOF
          "$cc" --target=aarch64-linux -S build/aarch64-nzcv/sysreg.i \
            -o build/aarch64-nzcv/sysreg.s
          for reg in sp_el0 tpidr_el1 tpidr_el2; do
            grep -F "  mrs x9, $reg" build/aarch64-nzcv/sysreg.s
          done
          aarch64-linux-gnu-gcc -c -x assembler build/aarch64-nzcv/sysreg.s \
            -o build/aarch64-nzcv/sysreg.mini.o
          aarch64-linux-gnu-gcc -c -x c build/aarch64-nzcv/sysreg.i \
            -o build/aarch64-nzcv/sysreg.gnu.o
          sed 's/tpidr_el2/daif/' build/aarch64-nzcv/sysreg.i \
            > build/aarch64-nzcv/unknown-reg.i
          if "$cc" --target=aarch64-linux -S build/aarch64-nzcv/unknown-reg.i \
            -o build/aarch64-nzcv/unknown-reg.s \
            >build/aarch64-nzcv/unknown-reg.log 2>&1; then
            echo 'FAIL: unrelated AArch64 privileged MRS admitted' >&2
            exit 1
          fi
          echo 'AARCH64_LINUX_MRS_GNU_AS=PASS system_regs=3 privileged_execution=not_run negative_unqualified=rejected'

