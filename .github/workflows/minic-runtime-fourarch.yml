name: MiniC Compiler Runtime - Four Architecture

on:
  pull_request:
    paths:
      # Every MiniC frontend/Core/backend/codegen owner affects at least
      # one of the four native compiler-runtime target probes. Previously
      # only RISC-V PRs entered this gate.
      - "src/**"
      - "include/minic/**"
      - "tools/minic/**"
      - "tools/minic-cc/**"
      - "Makefile"
      - "src/target/riscv/**"
      - "src/target/riscv32/**"
      - "src/target/riscv64/**"
      - "tests/compiler/c0/probe-riscv-shared-word-operations.sh"
      - "tests/compiler/c0/probe-four-backend-dynamic-stack.sh"
      - "tests/compiler/c0/dynamic_stack_wide_spill.c"
      - "tests/compiler/c0/dynamic_stack_wide_spill_helper.c"
      - ".github/workflows/minic-runtime-fourarch.yml"
  push:
    branches: [main]
    paths:
      # Global MiniC semantic/runtime gate. Earlier enumerated push paths
      # missed e.g. AArch64 fp_emit/memory_emit/asm_legalize and LoongArch
      # frame/codegen; keep source wildcard as the single coverage invariant.
      - "src/**"
      - "include/minic/**"
      - "tools/minic/**"
      - "tools/minic-cc/**"
      # All Core semantics flow into every registered machine backend. A
      # change to a previously unlisted Core owner must run the full runtime
      # matrix instead of silently relying on an ancestor's green verdict.
      - "src/core/**"
      - ".github/workflows/minic-runtime-fourarch.yml"
      - "runtime/manifest.json"
      - "tools/runtime/**"
      - "third_party/llvm-compiler-rt-19.1.7/**"
      - "third_party/gcc-riscv-14.2.0/**"
      - "src/target/common/lp64_scalar.c"
      - "src/target/common/direct_call_plan.c"
      - "tests/compiler/c0/probe-aarch64-linux-pointer-release-acquire.sh"
      - "tests/compiler/c0/probe-aarch64-linux-acquire-load.sh"
      - "tests/compiler/c0/probe-aarch64-linux-sysreg-writes.sh"
      - "tests/compiler/c0/probe-aarch64-large-structured-asm-spills.sh"
      - "tests/compiler/c0/probe-aarch64-linux-volatile-mrs.sh"
      - "tests/compiler/c0/probe-direct-lp64-weak-section-qemu.sh"
      - "tests/compiler/c0/probe-lp64-indirect-record-abi-qemu.sh"
      - "tests/compiler/c0/probe-lp64-core-record-snapshot-qemu.sh"
      - "tests/compiler/c0/probe-lp64-packed-integer-record-qemu.sh"
      - "tests/compiler/c0/probe-aarch64-linux-zero-operand-hints.sh"
      - "tests/compiler/c0/probe-loong-linux-zero-operand-dbar.sh"
      - "tests/compiler/c0/probe-loong-linux-cmpxchg-qemu.sh"
      - "tests/compiler/c0/probe-loong-linux-xchg-qemu.sh"
      - "src/target/aarch64/call_emit.c"
      - "src/target/aarch64/integer_emit.c"
      - "src/target/aarch64/residual_emit.c"
      - "src/target/loongarch64/residual_emit.c"
      - "src/target/common/direct_residual_plan.c"
      - "src/target/common/direct_residual_plan.h"
      - "src/target/loongarch64/integer_emit.c"
      - "src/target/loongarch64/call_emit.c"
      - "src/target/aarch64/block_emit.c"
      - "src/target/loongarch64/block_emit.c"
      - "src/target/riscv/**"
      - "src/target/riscv32/**"
      - "src/target/riscv64/abi.c"
      - "src/target/common/core_call_view.c"
      - "tests/compiler/c0/check-riscv-gpr-abi.c"
      - "tests/compiler/c0/check-riscv-machine-selection.c"
      - "src/target/riscv64/runtime_libcall.c"
      - "src/target/riscv64/scalar_emit.c"
      - "src/target/riscv64/isa.c"
      - "src/target/riscv64/fp_emit.c"
      - "src/frontend/parser_builtins.c"
      - "src/frontend/ast.h"
      - "src/frontend/ast_verifier.c"
      - "src/core/core_lower_expr_scalar.c"
      - "src/core/core_lower_expression.c"
      - "src/core/core_lower_scalar_values.c"
      - "src/target/x86_64/call_plan.h"
      - "src/target/x86_64/call_plan.c"
      - "src/target/x86_64/machine_emit.c"
      - "src/target/x86_64/machine_call.c"
      - "src/target/x86_64/codegen.c"
      - "src/target/x86_64/frame.h"
      - "src/target/x86_64/frame.c"
      - "tests/compiler/c0/probe-x86-int128-runtime-abi.sh"
      - "tests/compiler/c0/probe-x86-compiler-rt-native.sh"
      - "tests/compiler/c0/probe-lp64-compiler-rt-qemu.sh"
      - "tests/compiler/c0/probe-four-backend-dynamic-stack.sh"
      - "tests/compiler/c0/dynamic_stack_wide_spill.c"
      - "tests/compiler/c0/dynamic_stack_wide_spill_helper.c"
      - "tests/compiler/c0/probe-runtime-isnan.sh"
      - "tests/compiler/c0/probe-rv64i-int128-pairs-qemu.sh"
      - "tests/compiler/c0/probe-rv64i-kbuild-abi.sh"
      - "tests/assembler/probe-rv32i-elf32.sh"
      - "assembler/src/**"
      - "tools/minic-as/main.c"
      - "src/target/data_layout.c"
      - "src/target/data_layout.h"
      - "src/target/target_info.c"
      - "src/target/target_info.h"
      - "tests/compiler/c0/check-four-target-model-m0.c"
      - "tests/compiler/c0/run-target-selection-m0.sh"
      - "tests/compiler/c0/probe-rv32-target-gate.sh"
      - "src/target/riscv64/memory_emit.c"
      - "tests/compiler/c0/probe-rv32-core-qemu.sh"
      - "tests/compiler/c0/probe-rv32-wide-alu-qemu.sh"
      - "tests/compiler/c0/probe-rv32-tinyaes-frontier.sh"
      - "tests/compiler/c0/probe-rv32-cjson-frontier.sh"
      - "tests/external/cjson/probe.sh"
      - "tests/compiler/c0/build-rv32-gcc-runtime.sh"
      - "third_party/gcc-riscv-14.2.0/div.S"
      - "third_party/gcc-riscv-14.2.0/muldi3.S"
      - "tests/external/linux/stage2_kbuild_cc.sh"
      - "tests/compiler/c0/probe-rv64i-softfloat-runtime-qemu.sh"
      - "tests/compiler/c0/probe-runtime-typed-overflow.sh"
      - ".github/workflows/minic-runtime-fourarch.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fourarch-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  four-arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, riscv64, aarch64, loongarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Install target-independent LLVM compiler and tools
        run: |
          set -Eeuo pipefail
          # Runner apt uses mirror+file:/etc/apt/apt-mirrors.txt; the Azure
          # mirror has repeatedly stalled 45-minute cross-target builds.
          # Our accepted Linux receiver used the signed official Ubuntu
          # archive and fetched QEMU in seconds. Reuse the same repair here.
          for sources in /etc/apt/apt-mirrors.txt \
                         /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]] &&
               grep -q 'azure.archive.ubuntu.com' "$sources"; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$sources"
              echo "FOURARCH_APT_SOURCE=OFFICIAL_UBUNTU file=$sources"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 \
               -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            clang llvm
          if [[ "${{ matrix.target }}" == riscv64 ]]; then
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
          elif [[ "${{ matrix.target }}" == aarch64 ]]; then
            # Exact-head AAPCS64 GNU/QEMU CALL ABI differential owns the
            # 960-byte wide-argument / dynamic alloca stress fixture.
            # --no-install-recommends otherwise omits Scrt1.o/crti.o:
            # install the cross libc development startup files explicitly.
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross lld qemu-user
          elif [[ "${{ matrix.target }}" == loongarch64 ]]; then
            # Existing freestanding LLVM/LLD/QEMU plus a narrowly scoped
            # original-GNU ABI oracle for the real CPUCFG builtin. Do not
            # install a cross toolchain on the other matrix targets.
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              lld qemu-user gcc-13-loongarch64-linux-gnu libc6-dev-loong64-cross
          fi
      - name: Check manifest and build MiniC exactly once per shard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/runtime/build_runtime.py
          python3 tools/runtime/build_runtime.py --print-sources
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/runtime-ci all
      - name: Prove RV32 ILP32 target model and strict ELF32 assembler
        if: matrix.target == 'riscv64'
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/runtime-ci \
            check-four-target-model-m0
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc \
            tests/compiler/c0/check-riscv-gpr-abi.c \
            -o build/runtime-ci/tests/target/riscv-gpr-abi
          build/runtime-ci/tests/target/riscv-gpr-abi
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -Isrc \
            tests/compiler/c0/check-riscv-machine-selection.c \
            -o build/runtime-ci/tests/target/riscv-machine-selection
          build/runtime-ci/tests/target/riscv-machine-selection
          MINIC_CC="$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            sh tests/compiler/c0/probe-rv32-target-gate.sh
          MINIAS="$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-as" \
            bash tests/assembler/probe-rv32i-elf32.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            bash tests/compiler/c0/probe-rv32-core-qemu.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            bash tests/compiler/c0/probe-rv32-wide-alu-qemu.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            bash tests/compiler/c0/probe-rv32-tinyaes-frontier.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            bash tests/compiler/c0/probe-rv32-cjson-frontier.sh
      - name: Reference compiler compile of identical runtime source set
        id: reference
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/runtime/build_runtime.py \
            --backend reference --targets "${{ matrix.target }}" \
            --build-dir build/runtime-verdict --jobs 4
      - name: MiniC compile of identical runtime source set
        if: always() && steps.reference.outcome != 'cancelled'
        id: minic
        shell: bash
        env:
          MINIC_RV64I_CORE_REJECT_TRACE: '1'
          MINIC_M1_TRACE: '1'
        run: |
          set -Eeuo pipefail
          python3 tools/runtime/build_runtime.py \
            --backend minic --targets "${{ matrix.target }}" \
            --minic "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            --build-dir build/runtime-verdict --jobs 4
      - name: GNU Linux empty volatile ASM Core effect on four native ISAs
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_EMPTY_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-gnu-empty-volatile-core-family.sh
      - name: GNU original x86 Linux PREFETCHW CPU ALTERNATIVE native patch-table ELF verification
        if: matrix.target == 'x86_64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-linux-prefetchw-alt-gcc-native.sh
      - name: Original Linux x86 GS per-CPU tied-seed ALU ten native GNU hardware variants
        if: matrix.target == 'x86_64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-linux-gs-tied-alu-gcc-native.sh
      - name: Original x86 GNU Linux SMP lock barriers and hardware fence six-way native oracle
        if: matrix.target == 'x86_64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-linux-zero-operand-barrier-gcc-native.sh
      - name: Original GNU Linux _THIS_IP_ x86 RIP-relative LEA and SSA output oracle
        if: matrix.target == 'x86_64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-linux-rip-ip-gcc-native.sh
      - name: GNU Linux %c immediate and symbolic BUG table assembly oracle
        if: matrix.target == 'x86_64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
        run: |
          set -Eeuo pipefail
          sh tests/compiler/c0/probe-gnu-immediate-c-modifier-linux.sh
      - name: Exercise all typed overflow builtins across four targets
        if: always() && matrix.target == 'x86_64'
        shell: bash
        env:
          MINIC_CC: build/runtime-ci/bin/minic-cc
        run: |
          bash tests/compiler/c0/probe-runtime-typed-overflow.sh
          bash tests/compiler/c0/probe-runtime-isnan.sh
          bash tests/compiler/c0/probe-x86-rsp-readwrite-output.sh             "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-return-frame-pc-native.sh "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-bit-scan-native.sh "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
          bash tests/compiler/c0/probe-gnu-bswap-case-ice.sh             "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
          bash tests/compiler/c0/probe-gnu-asm-names.sh "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" x86_64
          bash tests/compiler/c0/probe-native-local-hardreg-declarations.sh             "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" x86_64
      - name: GNU ASM register-name adjacent strings under QEMU RV64
        if: matrix.target == 'riscv64'
        shell: bash
        run: |
          bash tests/compiler/c0/probe-gnu-asm-names.sh "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" riscv64
      - name: Audit real Kbuild MiniC strict-I and original kernel inline ASM
        if: matrix.target == 'riscv64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-rv64i-kbuild-abi.sh \
            "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic"
      - name: AArch64 original Linux raw MMIO store hardware GNU/QEMU differential
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-aarch64-linux-raw-mmio.sh \
            "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
      - name: Original Linux AArch64 DAIF/CSDB/YIELD exact GNU hardware ISA
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-aarch64-linux-zero-operand-hints.sh "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
      - name: Original Linux arm64 acquire-load 1-2-4-8 byte GNU QEMU differential
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-aarch64-linux-acquire-load.sh \
            "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
      - name: Original Linux RCU pointer release/acquire GNU AArch64 QEMU
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-aarch64-linux-pointer-release-acquire.sh \
            "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
      - name: GNU original local fixed-register declarations under real AArch64 QEMU
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          bash tests/compiler/c0/probe-native-local-hardreg-declarations.sh             "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" aarch64
      - name: QEMU differential verify 16 RV64I i128 ABI operations
        if: always() && matrix.target == 'riscv64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-rv64i-int128-pairs-qemu.sh \
            "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            "$GITHUB_WORKSPACE/build/runtime-verdict/reference/riscv64/libminic-rt.a"
          echo "RUNTIME_QEMU_LIBRARY=MiniC-built"
          bash tests/compiler/c0/probe-rv64i-int128-pairs-qemu.sh \
            "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            "$GITHUB_WORKSPACE/build/runtime-verdict/minic/riscv64/libminic-rt.a"
      # Failures in RV64I compiler-rt should be diagnosable without waiting
      # for the slower cross-GNU toolchain installation on the RV64 matrix.
      - name: Diagnose RV64I software-FP Core selection on host shard
        if: always() && matrix.target == 'x86_64'
        shell: bash
        env:
          MINIC_RV64I_CORE_REJECT_TRACE: '1'
        run: |
          set -Eeuo pipefail
          rc=0
          python3 tools/runtime/build_runtime.py \
            --backend minic --targets riscv64 --groups soft_float \
            --no-primitives --minic "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc" \
            --build-dir build/runtime-diagnostic --jobs 4 || rc=$?
          echo "RUNTIME_RV64_SOFTFP_DIAGNOSTIC_EXIT=$rc"
          for log in build/runtime-diagnostic/minic/riscv64/logs/*.minic.log; do
            grep -E 'RV64I_CORE_REJECT|<riscv-isa>|Core IR does not yet' "$log" | head -n 8 || :
          done
      - name: Save cross-RV64I diagnostic logs
        if: always() && matrix.target == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: compiler-rt-rv64i-softfp-debug-${{ github.sha }}
          path: build/runtime-diagnostic/
          retention-days: 7
          if-no-files-found: warn
      - name: QEMU verify IEEE-754 bit-exact softfloat against both libraries
        if: always() && matrix.target == 'riscv64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-rv64i-softfloat-runtime-qemu.sh \
            "$GITHUB_WORKSPACE/build/runtime-verdict/reference/riscv64/libminic-rt.a" \
            "$GITHUB_WORKSPACE/build/runtime-verdict/minic/riscv64/libminic-rt.a"
      - name: Validate x86-64 SysV TI ABI against GNU C driver
        if: always() && matrix.target == 'x86_64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-int128-runtime-abi.sh \
            "$GITHUB_WORKSPACE/build/runtime-ci/bin/minic-cc"
      - name: Execute twenty real x86-64 MiniC-runtime numerical cases
        if: always() && matrix.target == 'x86_64'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-compiler-rt-native.sh \
            "$GITHUB_WORKSPACE/build/runtime-verdict/minic/x86_64/libminic-rt.a"
      - name: GNU LP64 natural integer bitfield return/argument record ABI
        if: matrix.target == 'aarch64' || matrix.target == 'loongarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_BITFIELD_RECORD_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-direct-lp64-integral-bitfield-record-abi.sh
      - name: GNU LP64 natural integral fixed-array and nested-record ABI in both directions
        if: matrix.target == 'aarch64' || matrix.target == 'loongarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_ARRAY_RECORD_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-direct-lp64-integral-array-aggregate-abi.sh
      - name: Two native FP-register HFA return fields with inverse GNU ABI oracles
        if: matrix.target == 'aarch64' || matrix.target == 'loongarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_FP_RETURN_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-direct-lp64-fp-record-return.sh
      - name: GNU caller and MiniC caller pairwise LP64 record return ABI
        if: matrix.target == 'aarch64' || matrix.target == 'loongarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_RECORD_RETURN_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-direct-lp64-gp-record-return.sh
      - name: Original Linux no-operand opaque ISA with GNU GAS and safe QEMU
        if: matrix.target == 'aarch64' || matrix.target == 'loongarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_OPAQUE_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-direct-lp64-zero-operand-opaque-isa.sh
      - name: Linux GNU BUG/WARN section relocations for direct LP64 machines
        if: matrix.target == 'aarch64' || matrix.target == 'loongarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_LINUX_BUG_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          sh tests/compiler/c0/probe-direct-lp64-linux-bug-table.sh
      - name: Original GNU computed-goto Core BLOCK_ADDRESS and static label differential
        if: matrix.target == 'aarch64' || matrix.target == 'loongarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
          MINIC_COMPUTED_GOTO_TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          sh tests/compiler/c0/probe-four-backend-computed-goto.sh
      - name: AAPCS64 exact-head GNU/QEMU dynamic wide CALL ABI
        if: matrix.target == 'aarch64'
        shell: bash
        env:
          MINIC_CC: ${{ github.workspace }}/build/runtime-ci/bin/minic-cc
        run: |
          set -Eeuo pipefail
          sh tests/compiler/c0/probe-four-backend-dynamic-stack.sh \
