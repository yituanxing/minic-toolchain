name: Agent Local Interleaved Informational Attribute

on:
  push:
    branches:
      - compiler/local-interleaved-informational-attribute-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-local-interleaved-informational-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: compiler/local-interleaved-informational-attribute-v1
          fetch-depth: 0

      - name: Materialize narrow parser seam
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_local_interleaved_informational_attribute_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and run focused gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/local-interleaved-informational
          MINIC="$GITHUB_WORKSPACE/build/local-interleaved-informational/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/local-interleaved-informational-focused" \
            sh tests/compiler/c0/run-gnu-local-interleaved-informational-attribute.sh
          make -j4 MODE=release BUILD_DIR=build/local-interleaved-informational check-fast

      - name: Publish generated product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git add \
            src/frontend/parser_statement.c \
            tests/compiler/c0/run-foundation-focused.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            printf '%s\n' 'PASS local declaration-head attribute staging already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: accept informational local declaration attributes' \
            -m 'Consume type-before-declarator GNU object attributes through the existing local-object registry with no declarator semantic context. Informational attributes such as unused remain parse-only, while cleanup stays declarator-owned and fails closed at this placement.'
          git push origin HEAD:compiler/local-interleaved-informational-attribute-v1
