name: LoongArch64 GNU Linux 6.6.143 P2 17 real / 1 structural blocked

# Opt-in to this LoongArch-only source delta: unrelated x86/AArch64/RV32
# compiler commits must NOT launch a separate expensive GNU kernel build.
# A green job is NOT an 18/18 P2 PASS. The only acceptable verdict is
# STRUCTURAL_BLOCKED with all 17 implementable guest operations actually PASS.
on:
  pull_request:
    paths:
      - '.github/workflows/minic-linux-loongarch64-p2-gnu-17-v1.yml'
      - 'tests/external/linux/runtime_initramfs/loongarch64_p2_17_init.c'
      - 'tests/external/linux/runtime_initramfs/loongarch64_p2_17_probe.c'
      - 'tools/ci/linux-loongarch64-p2-gnu-17-check-v1.py'
      - 'tools/ci/linux-loongarch64-p2-gnu-17-v1.sh'
      - 'tools/ci/test_linux_loongarch64_p2_gnu_17_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loongarch-gnu-p2-17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  loongarch64-gnu-p2-17:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KERNEL_URL: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz
      KERNEL_SHA256: dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
      LOONG_FIRMWARE_URL: https://raw.githubusercontent.com/loongson/Firmware/9e2b59f4f0d0c40258fade9769cd93c8034fd436/LoongArchVirtMachine/QEMU_EFI.fd
      LOONG_FIRMWARE_SHA256: b375639ebcf7a873d2cab67f0c9c1c6c208fc3f1bcba4083172fa20c4fb7e1ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Audit exact revision and cheap fail-closed oracle cases
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          python3 tools/ci/test_linux_loongarch64_p2_gnu_17_v1.py
          python3 tools/ci/linux-loongarch64-p2-gnu-17-check-v1.py --source-guard-only
          python3 -m py_compile tools/ci/linux-loongarch64-p2-gnu-17-check-v1.py
          bash -n tools/ci/linux-loongarch64-p2-gnu-17-v1.sh
          echo "LA64_P2_17_ORACLE=PASS exact_head=$(git rev-parse HEAD)"

      - name: Install original GNU target tools and real QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-13-loongarch64-linux-gnu binutils-loongarch64-linux-gnu \
            libc6-dev-loong64-cross qemu-system-misc build-essential \
            bc bison flex libelf-dev libssl-dev e2fsprogs cpio \
            gzip curl xz-utils make python3 file
          command -v loongarch64-linux-gnu-gcc-13
          command -v qemu-system-loongarch64
          qemu-system-loongarch64 -machine help
          df -h "$RUNNER_TEMP"

      - name: Fetch exact upstream Linux source and pinned Loongson EFI
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/loong-p2-17-input"
          curl --proto '=https' --tlsv1.2 -fL --retry 4 --retry-delay 2 \
            "$KERNEL_URL" -o "$RUNNER_TEMP/loong-p2-17-input/linux-6.6.143.tar.xz"
          printf '%s  %s\n' "$KERNEL_SHA256" \
            "$RUNNER_TEMP/loong-p2-17-input/linux-6.6.143.tar.xz" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -fL --retry 4 --retry-delay 2 \
            "$LOONG_FIRMWARE_URL" -o "$RUNNER_TEMP/loong-p2-17-input/QEMU_EFI.fd"
          printf '%s  %s\n' "$LOONG_FIRMWARE_SHA256" \
            "$RUNNER_TEMP/loong-p2-17-input/QEMU_EFI.fd" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/loong-p2-17-input/linux-6.6.143.tar.xz" \
            -C "$RUNNER_TEMP/loong-p2-17-input"
          test ! -e "$RUNNER_TEMP/loong-p2-17-input/linux-6.6.143/arch/loongarch/kvm"
          df -h "$RUNNER_TEMP"

      - name: GNU exact Kconfig 24 real plus 1 KVM structural block and QEMU
        shell: bash
        timeout-minutes: 70
        env:
          LA64_P2_BUILD_JOBS: '4'
          LA64_P2_QEMU_TIMEOUT_SECONDS: '900'
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-loongarch64-p2-gnu-17-v1.sh \
            "$RUNNER_TEMP/loong-p2-17-input/linux-6.6.143" \
            "$RUNNER_TEMP/loong-p2-17-input/QEMU_EFI.fd" \
            "$RUNNER_TEMP/loong-p2-17-run"
          test "$(sed -n 's/^oracle_rc=//p' "$RUNNER_TEMP/loong-p2-17-run/evidence/result.txt")" = 0
          grep -Fx 'LOONGARCH64_GNU_QEMU_P2=STRUCTURAL_BLOCKED p2=17/18 checks=39/40 kvm=linux-6.6.143-arch-absent qemu_rc=0 fail=0 skip=0' \
            "$RUNNER_TEMP/loong-p2-17-run/evidence/oracle.txt"
          echo 'LA64_P2_17_CI=STRUCTURAL_BLOCKED actual_17_of_18=1 full_p2_pass=0'

      - name: Upload exact build, guest and strict structural-block evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loongarch64-gnu-p2-17-structural-blocked
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/loong-p2-17-run/evidence/**
            ${{ runner.temp }}/loong-p2-17-run/build/.config
          compression-level: 6
