name: PR95 Materialize Parenthesized Local Declarator

on:
  push:
    branches:
      - agent/parenthesized-local-declarator-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parenthesized-local-declarator-v0
          fetch-depth: 0
      - name: Materialize shared direct declarator name
        run: |
          set -Eeuo pipefail
          python tools/dev/pr95-materialize-parenthesized-local.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-for-declaration-initializers.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr95-materialize-parenthesized-local.py
          rm -f .github/workflows/pr95-materialize-parenthesized-local.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: share parenthesized direct declarator names'
          git push origin HEAD:agent/parenthesized-local-declarator-v0
