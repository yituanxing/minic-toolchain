name: MiniNM M0 Gate

on:
  push:
    branches:
      - "toolchain/mininm-m0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mininm-a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV32 RV64 oracle toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Strict build
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/mininm all

      - name: Validate MiniELF reader
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/mininm check-minielf-reader-a0

      - name: Differentially validate minic-nm
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/mininm check-mininm-a0
