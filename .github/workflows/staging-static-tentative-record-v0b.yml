name: Staging Static Tentative Record V0B

on:
  push:
    branches:
      - staging/static-tentative-record-v0b

permissions:
  contents: write

jobs:
  materialize-and-probe:
    if: "${{ github.event.head_commit.message != 'static tentative product v0' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize static tentative record ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/parser_global.c')
          text = path.read_text()

          old = '''static bool
          parse_static_nested_record_object(MinicParser *parser, MinicType type, MinicSourceSpan name_span) {
              MinicGlobalObjectId object_id;

              if (!minic_c0_program_add_global_object(parser->program,
                                                      parser->source + name_span.begin.offset,
                                                      minic_parser_span_length(name_span),
                                                      type,
                                                      true,
                                                      minic_type_is_const(type),
                                                      &object_id) ||
                  !minic_parser_expect(parser, MINIC_TOKEN_EQUAL, "expected '='") ||
                  !minic_parser_parse_static_storage_initializer_value(parser, object_id, type)) {
                  if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\\0') {
                      minic_parser_error(parser, "cannot parse nested static record initializer");
                  }
                  return false;
              }
              return minic_parser_expect(parser, MINIC_TOKEN_SEMICOLON, "expected ';' after global object");
          }
          '''
          new = '''static bool
          parse_static_nested_record_object(MinicParser *parser, MinicType type, MinicSourceSpan name_span) {
              MinicGlobalObjectId object_id;
              const MinicGlobalObject *existing;

              object_id = minic_parser_find_global_object_entity(parser, name_span);
              if (object_id == MINIC_GLOBAL_OBJECT_INVALID) {
                  if (!minic_c0_program_add_global_object(parser->program,
                                                          parser->source + name_span.begin.offset,
                                                          minic_parser_span_length(name_span),
                                                          type,
                                                          true,
                                                          minic_type_is_const(type),
                                                          &object_id)) {
                      minic_parser_error(parser, "cannot create static record definition");
                      return false;
                  }
              } else {
                  existing = minic_c0_program_global_object(parser->program, object_id);
                  if (existing == NULL || !existing->is_internal ||
                      !minic_type_equal(existing->type, type) ||
                      !minic_c0_global_object_begin_definition(parser->program, object_id)) {
                      minic_parser_error(parser, "conflicting static record definition");
                      return false;
                  }
              }
              if (!minic_parser_expect(parser, MINIC_TOKEN_EQUAL, "expected '='") ||
                  !minic_parser_parse_static_storage_initializer_value(parser, object_id, type)) {
                  if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\\0') {
                      minic_parser_error(parser, "cannot parse nested static record initializer");
                  }
                  return false;
              }
              return minic_parser_expect(parser, MINIC_TOKEN_SEMICOLON, "expected ';' after global object");
          }
          '''
          if old not in text:
              raise SystemExit('static record definition owner anchor not found')
          text = text.replace(old, new, 1)

          old = '''static bool parse_static_zero_definition(MinicParser *parser,
                                                   MinicType object_type,
                                                   MinicSourceSpan name_span) {
              MinicGlobalObjectId object_id;

              if (parser == NULL || parser->current.kind != MINIC_TOKEN_SEMICOLON ||
                  (!minic_type_is_integer(object_type) && !minic_type_is_pointer(object_type) &&
                   !minic_type_is_record(object_type) && !minic_type_is_array(object_type))) {
                  return false;
              }
              if (!minic_c0_type_is_complete_object(parser->program, object_type)) {
                  minic_parser_error(parser, "static object requires a complete object type");
                  return false;
              }
              if (!minic_c0_program_add_global_object(
                      parser->program,
                      parser->source + name_span.begin.offset,
                      minic_parser_span_length(name_span),
                      object_type,
                      true,
                      static_object_type_is_read_only(parser->program, object_type),
                      &object_id) ||
                  !minic_c0_global_object_set_zero_initialized(parser->program, object_id)) {
                  minic_parser_error(parser, "cannot create zero-initialized static object");
                  return false;
              }
              return minic_parser_advance(parser);
          }
          '''
          new = '''static bool parse_static_zero_definition(MinicParser *parser,
                                                   MinicType object_type,
                                                   MinicSourceSpan name_span) {
              MinicGlobalObjectId object_id;
              const MinicGlobalObject *existing;

              if (parser == NULL || parser->current.kind != MINIC_TOKEN_SEMICOLON ||
                  (!minic_type_is_integer(object_type) && !minic_type_is_pointer(object_type) &&
                   !minic_type_is_record(object_type) && !minic_type_is_array(object_type))) {
                  return false;
              }
              if (!minic_c0_type_is_complete_object(parser->program, object_type)) {
                  minic_parser_error(parser, "static object requires a complete object type");
                  return false;
              }
              object_id = minic_parser_find_global_object_entity(parser, name_span);
              if (object_id == MINIC_GLOBAL_OBJECT_INVALID) {
                  if (!minic_c0_program_add_tentative_global_object(
                          parser->program,
                          parser->source + name_span.begin.offset,
                          minic_parser_span_length(name_span),
                          object_type,
                          true,
                          static_object_type_is_read_only(parser->program, object_type),
                          &object_id)) {
                      minic_parser_error(parser, "cannot create static tentative definition");
                      return false;
                  }
              } else {
                  existing = minic_c0_program_global_object(parser->program, object_id);
                  if (existing == NULL || !existing->is_internal ||
                      !minic_type_equal(existing->type, object_type) ||
                      !minic_c0_global_object_merge_tentative(parser->program, object_id)) {
                      minic_parser_error(parser, "conflicting static tentative definition");
                      return false;
                  }
              }
              return minic_parser_advance(parser);
          }
          '''
          if old not in text:
              raise SystemExit('static zero-definition anchor not found')
          text = text.replace(old, new, 1)

          old = '''    MinicType object_type;
              MinicGlobalObjectId object_id;
              if (parser == NULL ||
          '''
          new = '''    MinicType object_type;
              MinicGlobalObjectId object_id;
              MinicGlobalObjectId existing_object_id;
              if (parser == NULL ||
          '''
          if old not in text:
              raise SystemExit('static global locals anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if (minic_parser_find_global_object(parser, name_span) != MINIC_GLOBAL_OBJECT_INVALID) {
                  minic_parser_error(parser, "duplicate global object");
                  return false;
              }
              if (!minic_parser_parse_gnu_object_attribute_lists(parser,
          '''
          new = '''    existing_object_id = minic_parser_find_global_object_entity(parser, name_span);
              if (!minic_parser_parse_gnu_object_attribute_lists(parser,
          '''
          if old not in text:
              raise SystemExit('static duplicate precheck anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if (parser->current.kind == MINIC_TOKEN_SEMICOLON) {
                  return parse_static_zero_definition(parser, element_type, name_span);
              }
              if (minic_type_is_array(element_type)) {
          '''
          new = '''    if (parser->current.kind == MINIC_TOKEN_SEMICOLON) {
                  return parse_static_zero_definition(parser, element_type, name_span);
              }
              if (existing_object_id != MINIC_GLOBAL_OBJECT_INVALID &&
                  !(minic_type_is_record(element_type) &&
                    parser->current.kind != MINIC_TOKEN_LBRACKET)) {
                  minic_parser_error(parser, "duplicate global object");
                  return false;
              }
              if (minic_type_is_array(element_type)) {
          '''
          if old not in text:
              raise SystemExit('static post-attribute routing anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/frontend/parser_global.c

      - name: Build and focused semantic proof
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/static-tentative-record
          work=build/static-tentative-record-probe
          mkdir -p "$work"
          cat > "$work/probe.c" <<'EOF'
          struct probe_ops {
              int value;
          };

          static const struct probe_ops probe;

          static int read_probe(void)
          {
              return probe.value;
          }

          static const struct probe_ops probe = {
              .value = 37,
          };

          int main(void)
          {
              return read_probe() == 37 ? 0 : 1;
          }
          EOF
          cc -E -P -x c "$work/probe.c" -o "$work/probe.i"
          build/static-tentative-record/bin/minic -S "$work/probe.i" -o "$work/probe.s"
          test "$(grep -c '^probe:' "$work/probe.s")" -eq 1
          printf '%s\n' 'STATIC_TENTATIVE_RECORD_FRONTEND PASS'

      - name: Commit staging product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add src/frontend/parser_global.c
          git commit -m 'static tentative product v0'
          git push origin HEAD:staging/static-tentative-record-v0b

      - name: Install Linux probe dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Probe unchanged Linux build_utility frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          MINIC="$GITHUB_WORKSPACE/build/static-tentative-record/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-tentative-record-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=98 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/static-tentative-record-linux/batch-summary.txt
          test "$status" -eq 0 -o "$status" -eq 1
