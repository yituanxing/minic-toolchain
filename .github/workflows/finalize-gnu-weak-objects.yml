name: Finalize GNU Weak Objects

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'product/final-gnu-weak-objects-v1' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/final-gnu-weak-objects-v1
          fetch-depth: 0

      - name: Apply current-main weak semantics
        run: |
          set -Eeuo pipefail
          python3 tools/dev/finalize-gnu-weak-objects.py
          chmod +x tests/compiler/c0/run-gnu-weak-external-objects.sh

      - name: Canonicalize and validate
        run: |
          set -Eeuo pipefail
          clang-format-18 -i \
            src/frontend/ast.h \
            src/frontend/ast_global.c \
            src/frontend/ast_verifier.c \
            src/frontend/attribute.c \
            src/frontend/parser_attribute.c \
            src/frontend/parser_function.c \
            src/frontend/parser_internal.h \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/gnu_weak_external_objects.c \
            tests/compiler/c0/invalid_gnu_weak_internal_object.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-weak
          MINIC="$GITHUB_WORKSPACE/build/product-weak/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-weak" \
            sh tests/compiler/c0/run-gnu-weak-external-objects.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-weak-fast

      - name: Commit clean product tree
        run: |
          set -Eeuo pipefail
          rm -f diagnostics/final-weak-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/frontend/ast.h \
            src/frontend/ast_global.c \
            src/frontend/ast_verifier.c \
            src/frontend/attribute.c \
            src/frontend/parser_attribute.c \
            src/frontend/parser_function.c \
            src/frontend/parser_internal.h \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/gnu_weak_external_objects.c \
            tests/compiler/c0/invalid_gnu_weak_internal_object.c \
            tests/compiler/c0/run-gnu-weak-external-objects.sh \
            tests/compiler/c0/run.sh
          git add -A diagnostics/final-weak-trigger.txt
          git commit -m 'frontend: model GNU weak external objects'
          git push origin HEAD:product/final-gnu-weak-objects-v1
