name: Publish GNU Void Function Pointer Assignment

on:
  push:
    branches: [frontend/gnu-void-function-pointer-assignment]

permissions:
  contents: write

concurrency:
  group: publish-gnu-void-function-pointer-assignment
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add GNU void/function pointer assignment compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/ast.c')
          text = path.read_text()
          anchor = '''bool minic_c0_assignment_compatible(const MinicC0Program *program,\n                                    MinicType target_type,\n                                    MinicExpressionId source_expression_id) {\n'''
          helper = '''static bool minic_c0_gnu_void_function_pointer_assignment_compatible(MinicType target,\n                                                                         MinicType source) {\n    MinicType target_unqualified;\n    MinicType source_unqualified;\n    MinicType target_pointee;\n    MinicType source_pointee;\n\n    if (!minic_type_unqualified(target, &target_unqualified) ||\n        !minic_type_unqualified(source, &source_unqualified) ||\n        target_unqualified.pointer_depth != 1U || source_unqualified.pointer_depth != 1U ||\n        !minic_type_pointee(target_unqualified, &target_pointee) ||\n        !minic_type_pointee(source_unqualified, &source_pointee)) {\n        return false;\n    }\n    return (minic_type_is_void(target_pointee) && minic_type_is_function(source_pointee)) ||\n           (minic_type_is_function(target_pointee) && minic_type_is_void(source_pointee));\n}\n\n'''
          if helper not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('assignment semantic owner seam not found')
              text = text.replace(anchor, helper + anchor, 1)
          old = '''    if (minic_type_is_pointer(target_type) && minic_type_is_pointer(source->type) &&\n        minic_c0_types_compatible(program, target_type, source->type)) {\n        return true;\n    }\n'''
          new = '''    if (minic_type_is_pointer(target_type) && minic_type_is_pointer(source->type) &&\n        (minic_c0_types_compatible(program, target_type, source->type) ||\n         minic_c0_gnu_void_function_pointer_assignment_compatible(target_type, source->type))) {\n        return true;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('assignment compatibility pointer seam not found')
          path.write_text(text.replace(old, new, 1))

          runner = Path('tests/compiler/c0/run-foundation-focused.sh')
          data = runner.read_text()
          anchor = '    run-gnu-statement-expression.sh \\\n'
          addition = anchor + '    run-gnu-void-function-pointer-assignment.sh \\\n'
          if 'run-gnu-void-function-pointer-assignment.sh' not in data:
              if anchor not in data:
                  raise SystemExit('foundation runner insertion seam not found')
              runner.write_text(data.replace(anchor, addition, 1))
          PY

          cat > tests/compiler/c0/gnu_void_function_pointer_assignment.c <<'EOF'
          typedef long (*syscall_t)(unsigned long,
                                    unsigned long,
                                    unsigned long,
                                    unsigned long,
                                    unsigned long,
                                    unsigned long,
                                    unsigned long);

          extern void * const compat_sys_call_table[];

          struct early_entry {
              const void *data;
          };

          typedef void (*early_fn_t)(const void *);

          long linux_shaped_syscall_assignment(unsigned long syscall)
          {
              syscall_t fn;

              fn = compat_sys_call_table[syscall];
              return fn(0, 0, 0, 0, 0, 0, 0);
          }

          void linux_shaped_early_assignment(const struct early_entry *entry, const void *arg)
          {
              early_fn_t fn;

              fn = (void *)entry->data;
              fn(arg);
          }

          void *gnu_function_pointer_to_void(syscall_t fn)
          {
              void *value;

              value = fn;
              return value;
          }
          EOF

          cat > tests/compiler/c0/run-gnu-void-function-pointer-assignment.sh <<'EOF'
          #!/bin/sh
          set -eu

          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/compiler-c0-gnu-void-function-pointer-assignment

          rm -rf "$work"
          mkdir -p "$work"
          "$host_cc" -fsyntax-only -std=gnu11 -Werror -Wno-pedantic -x c \
            "$root/tests/compiler/c0/gnu_void_function_pointer_assignment.c"
          "$host_cc" -E -P -std=gnu11 -x c \
            "$root/tests/compiler/c0/gnu_void_function_pointer_assignment.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          grep -F 'linux_shaped_syscall_assignment:' "$work/output.s" >/dev/null
          grep -F 'linux_shaped_early_assignment:' "$work/output.s" >/dev/null
          grep -F 'gnu_function_pointer_to_void:' "$work/output.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/gnu_void_function_pointer_assignment both-directions=1 linux-shaped=1'
          EOF
          chmod +x tests/compiler/c0/run-gnu-void-function-pointer-assignment.sh

          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/ast.c \
            tests/compiler/c0/gnu_void_function_pointer_assignment.c
          rm .github/workflows/publish-gnu-void-function-pointer-assignment.yml
          git diff --check

      - name: Sanitizer focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=sanitize BUILD_DIR=build/gnu-void-fnptr-sanitize
          MINIC="$GITHUB_WORKSPACE/build/gnu-void-fnptr-sanitize/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-void-fnptr-sanitize" \
            sh tests/compiler/c0/run-gnu-void-function-pointer-assignment.sh

      - name: Release Foundation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/gnu-void-fnptr-release
          MINIC="$GITHUB_WORKSPACE/build/gnu-void-fnptr-release/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-void-fnptr-release" \
            sh tests/compiler/c0/run-foundation-focused.sh

      - name: Commit product-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: support GNU void and function pointer assignments' \
            -m 'Accept the GNU C implicit conversion between one-level void pointers and function pointers in the expression-aware assignment semantic owner. Keep ordinary type-level object-pointer compatibility unchanged, so ISO-style pointer qualification rules remain separate from this GNU extension. The AST records a semantically valid pointer assignment; future Core lowering can materialize the already-resolved bit-preserving pointer conversion without reinterpreting GNU C rules.' \
            -m '中文说明：在带表达式上下文的 assignment semantic owner 中支持 GNU C 的一级 void pointer 与 function pointer 双向隐式转换。底层普通 object-pointer 类型兼容规则保持不变，从而将 ISO 风格 qualifier 规则与 GNU extension 分离。AST 只记录已经判定合法的 pointer assignment；未来 Core lowering 只需物化已解析的位保持 pointer conversion，不再解释 GNU C 规则。' \
            -m 'Validation / 验证：host GCC gnu11 syntax PASS; focused sanitizer PASS; Foundation focused PASS; clang-format-18 canonical.'
          git push origin HEAD:frontend/gnu-void-function-pointer-assignment
