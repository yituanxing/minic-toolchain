name: Diagnostic Next First100 Frontiers V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: read
jobs:
  context:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize current convergence compiler
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-array-v1.py
          python3 tools/dev/materialize-fixed-call-character-pointer-v1.py
          python3 tools/dev/materialize-function-pointer-array-declarator-v1.py
          python3 tools/dev/materialize-preformed-static-array-v1.py
          python3 tools/dev/materialize-static-local-prefix-attributes-v1.py
          python3 tools/dev/materialize-top-level-braced-static-scalar-v1.py
          python3 tools/dev/materialize-parenthesized-pointer-array-v1.py
          python3 tools/dev/materialize-record-pointer-array-v1.py
          python3 tools/dev/materialize-gnu-function-void-pointer-equality-v1.py
          python3 tools/dev/materialize-gnu-signed-left-shift-ice-v1.py
          python3 tools/dev/materialize-record-value-initialize-v1.py
          python3 tools/dev/materialize-record-value-initialize-v1b.py
          clang-format-18 -i \
            src/frontend/ast.h src/frontend/ast.c src/frontend/ast_verifier.c \
            src/frontend/function_body.c src/frontend/parser_statement.c \
            src/frontend/parser_expression.c src/frontend/parser_declarator.c \
            src/frontend/parser_internal.h src/frontend/parser_global.c \
            src/frontend/parser_record.c src/frontend/const_eval.c \
            src/target/riscv64/codegen_expression.c src/target/riscv64/codegen_statement.c
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/convergence
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Probe do_mounts frontier with context
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/do-mounts-next" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=2 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          set -e
          stderr=build/do-mounts-next/minic-stderr/init/do_mounts.i.stderr
          input=build/do-mounts-next/kbuild/init/do_mounts.i
          cat "$stderr" || true
          frontier=$(sed -n 's/.*do_mounts\.i:\([0-9][0-9]*\):.*/\1/p' "$stderr" | head -n1)
          if test -n "$frontier"; then start=$((frontier>45?frontier-45:1)); end=$((frontier+45)); nl -ba "$input" | sed -n "${start},${end}p"; fi
      - name: Probe kvm_main frontier with context
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/kvm-main-next" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=68 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          set -e
          stderr=build/kvm-main-next/minic-stderr/virt/kvm/kvm_main.i.stderr
          input=build/kvm-main-next/kbuild/arch/riscv/kvm/../../../virt/kvm/kvm_main.i
          cat "$stderr" || true
          frontier=$(sed -n 's/.*kvm_main\.i:\([0-9][0-9]*\):.*/\1/p' "$stderr" | head -n1)
          if test -n "$frontier"; then start=$((frontier>45?frontier-45:1)); end=$((frontier+45)); nl -ba "$input" | sed -n "${start},${end}p"; fi
      - name: Probe build_policy frontier with context
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/build-policy-next" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=97 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          set -e
          stderr=build/build-policy-next/minic-stderr/kernel/sched/build_policy.i.stderr
          input=build/build-policy-next/kbuild/kernel/sched/build_policy.i
          cat "$stderr" || true
          frontier=$(sed -n 's/.*build_policy\.i:\([0-9][0-9]*\):.*/\1/p' "$stderr" | head -n1)
          if test -n "$frontier"; then start=$((frontier>45?frontier-45:1)); end=$((frontier+45)); nl -ba "$input" | sed -n "${start},${end}p"; fi
