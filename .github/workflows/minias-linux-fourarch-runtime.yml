name: MiniAS Linux 6.6.143 Multiarch Real Runtime

# GNU GCC generates every production assembly unit; MiniAS is substituted
# only for assembler invocations.  GNU Kbuild/binutils then link the kernel,
# and the same kernel is booted under system QEMU for P0 and P1 checks.
# The existing independently-certified RV64 lane remains in linux-single;
# this matrix extends that contract to the other three architectures.
on:
  workflow_dispatch:
    inputs:
      loong_replay_run_id:
        description: 'Optional prior Linux run ID: replay its linked LoongArch EFI without Kbuild'
        required: false
        type: string
      loong_replay_artifact:
        description: 'Exact artifact name containing loongarch64/{out,runtime-initramfs.cpio.gz,evidence}'
        required: false
        type: string
        default: minias-linux-real-loongarch64
      loong_replay_origin:
        description: 'Label for the assembler that produced the artifact; same QEMU/firmware for both'
        required: false
        type: choice
        options: [minias, gnu]
        default: minias
      loong_gnu_baseline_build:
        description: 'Build one GNU-as LoongArch kernel as a matched QEMU control (not a MiniAS pass)'
        required: false
        type: boolean
        default: false
  push:
    branches: [refactor/minias-target-isa-abi-core]
    paths:
      - '.github/workflows/minias-linux-fourarch-runtime.yml'
      - 'assembler/**'
      - 'elf/**'
      - 'tests/external/linux/minias_*_linux.sh'
      - 'tests/external/linux/minias_aarch64_object_*'
      - 'tests/external/linux/runtime_initramfs/**'

permissions:
  contents: read

jobs:
  gcc-minias-kbuild-qemu:
    if: (github.event_name == 'workflow_dispatch' && inputs.loong_replay_run_id == '' && !inputs.loong_gnu_baseline_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[minias-linux-four]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, loongarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install GNU Kbuild and cross-architecture QEMU dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc binutils make bc bison flex libssl-dev libelf-dev \
            curl xz-utils cpio gzip zstd file python3-pyelftools
          case '${{ matrix.arch }}' in
            x86_64)
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                qemu-system-x86 gcc-multilib libc6-dev-i386 ;;
            aarch64)
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
                libc6-dev-arm64-cross qemu-system-arm ;;
            loongarch64)
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-13-loongarch64-linux-gnu binutils-loongarch64-linux-gnu \
                libc6-dev-loong64-cross qemu-system-misc ;;
          esac

      - name: Build exact MiniAS revision (no native assembler replacement)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          make -j4 MODE=release CFLAGS=-Werror build/release/bin/minic-as

      - name: GNU byte, relocation and linker preflight for real Linux blockers
        shell: bash
        env:
          MINIAS: ${{ github.workspace }}/build/release/bin/minic-as
        run: |
          set -Eeuo pipefail
          case '${{ matrix.arch }}' in
            x86_64)
              bash tests/assembler/probe-x86-linux-code16-gnu.sh
              bash tests/assembler/probe-x86-vdso-eh-gnu.sh
              bash tests/assembler/probe-x86-boot-header-elf32-gnu.sh
              ;;
            aarch64) bash tests/assembler/probe-aarch64-branch-binding-gnu.sh ;;
            loongarch64) : ;;
          esac

      - name: Real Linux GNU Kbuild, GNU link, QEMU P0 and P1
        id: linux
        shell: bash
        timeout-minutes: 105
        env:
          MINIAS: ${{ github.workspace }}/build/release/bin/minic-as
          WORK_DIR: ${{ github.workspace }}/build/minias-linux-fourarch/${{ matrix.arch }}
          LINUX_VERSION: 6.6.143
        run: bash 'tests/external/linux/minias_${{ matrix.arch }}_linux.sh'

      - name: Preserve production assembly, Kbuild and guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minias-linux-real-${{ matrix.arch }}
          # Do not upload the unpacked Linux source or whole Kbuild tree.
          # Those are multi-gigabyte; the original failures and real guest
          # logs are the reproducible, actionable evidence.
          path: |
            build/minias-linux-fourarch/${{ matrix.arch }}/**/*.log
            build/minias-linux-fourarch/${{ matrix.arch }}/**/*.trace
            build/minias-linux-fourarch/${{ matrix.arch }}/**/failure-inputs/**/*.s
            build/minias-linux-fourarch/${{ matrix.arch }}/**/runtime-initramfs.cpio.gz
            build/minias-linux-fourarch/${{ matrix.arch }}/**/Image.sha256
            build/minias-linux-fourarch/${{ matrix.arch }}/**/bzImage.sha256
            build/minias-linux-fourarch/${{ matrix.arch }}/**/vmlinuz.efi.sha256
            build/minias-linux-fourarch/${{ matrix.arch }}/**/aarch64-object-oracle.tsv
            build/minias-linux-fourarch/${{ matrix.arch }}/**/aarch64-bisect-*.txt
            # Only the two AArch64 early-boot suspects isolated by real-QEMU
            # bisection, not 4,000+ sidecars. With optional bisection enabled,
            # saved originals are authoritative when out/*.o is substituted.
            build/minias-linux-fourarch/aarch64/asm-sources/arch/arm64/mm/proc.s
            build/minias-linux-fourarch/aarch64/gnu-as-objects/arch/arm64/mm/proc.o
            build/minias-linux-fourarch/aarch64/minias-original-objects/arch/arm64/mm/proc.o
            build/minias-linux-fourarch/aarch64/asm-sources/mm/sparse-vmemmap.s
            build/minias-linux-fourarch/aarch64/gnu-as-objects/mm/sparse-vmemmap.o
            build/minias-linux-fourarch/aarch64/minias-original-objects/mm/sparse-vmemmap.o
            build/minias-linux-fourarch/aarch64/out/mm/sparse-vmemmap.o
            # Preserve exactly the linked kernel to replay QEMU-only boot
            # diagnostics without another 15–20 minute Linux recompilation.
            build/minias-linux-fourarch/x86_64/mini-out/arch/x86/boot/bzImage
            build/minias-linux-fourarch/aarch64/out/arch/arm64/boot/Image
            build/minias-linux-fourarch/loongarch64/out/arch/loongarch/boot/vmlinuz.efi
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize exact-head real Linux execution
        if: always()
        run: |
          {
            echo '### MiniAS-only Linux 6.6.143: ${{ matrix.arch }}'
            echo 'GCC source and Kbuild + MiniAS production assembly + GNU link + system QEMU P0/P1.'
            echo 'Acceptance requires a linked kernel **and** guest runtime markers; ELF parity alone is not sufficient.'
            echo 'Result: `${{ steps.linux.outcome }}`'
          } >> "$GITHUB_STEP_SUMMARY"

  # One-time matched GNU control. Both variants use the same kernel release,
  # configuration, GCC, GNU linker, initramfs and the shared boot()/require()
  # function; only the production assembler backend differs.
  loong-gnu-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.loong_replay_run_id == '' && inputs.loong_gnu_baseline_build
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU LoongArch Kbuild and QEMU toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc binutils make bc bison flex libssl-dev libelf-dev \
            curl xz-utils cpio gzip zstd file python3-pyelftools \
            gcc-13-loongarch64-linux-gnu binutils-loongarch64-linux-gnu \
            libc6-dev-loong64-cross qemu-system-misc
      - name: Build and boot Linux 6.6.143 through GNU AS exclusively
        shell: bash
        timeout-minutes: 105
        env:
          WORK_DIR: ${{ github.workspace }}/build/minias-linux-fourarch/loongarch64
          LINUX_VERSION: 6.6.143
          LOONG_AS_BACKEND: gnu
        run: bash tests/external/linux/minias_loongarch64_linux.sh
      - name: Preserve GNU assembler baseline and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minias-linux-real-loongarch64-gnu
          path: |
            build/minias-linux-fourarch/loongarch64/evidence/*.log
            build/minias-linux-fourarch/loongarch64/evidence/vmlinuz.efi.sha256
            build/minias-linux-fourarch/loongarch64/runtime-initramfs.cpio.gz
            build/minias-linux-fourarch/loongarch64/out/arch/loongarch/boot/vmlinuz.efi
          if-no-files-found: warn
          retention-days: 14

  # The original kernel image and initramfs are preserved in the preceding
  # build artifact. Diagnose firmware/QEMU failures on those exact bytes in
  # minutes instead of repeating 10+ minutes of Kbuild for every iteration.
  # A GNU-built artifact with the same layout can be selected as the baseline:
  # both origins execute the very same boot()/require() code and pinned EFI.
  loong-qemu-artifact-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.loong_replay_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU runtime only (no GCC or GNU assembler)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            qemu-system-misc curl
      - name: Restore the original linked EFI and GNU-built initramfs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.loong_replay_artifact }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.loong_replay_run_id }}
          github-token: ${{ github.token }}
          path: build/minias-linux-fourarch
      - name: Replay original linked kernel under the same pinned EFI/QEMU
        shell: bash
        timeout-minutes: 12
        env:
          WORK_DIR: ${{ github.workspace }}/build/minias-linux-fourarch/loongarch64
          LINUX_VERSION: 6.6.143
          LOONG_QEMU_REPLAY_ONLY: '1'
          LOONG_QEMU_REPLAY_ORIGIN: ${{ inputs.loong_replay_origin }}
        run: bash tests/external/linux/minias_loongarch64_linux.sh
      - name: Preserve replay-specific QEMU/P0/P1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minias-loong-qemu-replay-${{ inputs.loong_replay_origin }}-${{ github.run_id }}
          path: build/minias-linux-fourarch/loongarch64/evidence/rdinit-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize original kernel provenance
        if: always()
        run: |
          {
            echo '### LoongArch64 QEMU-only EFI replay'
            echo 'Original Linux artifact: `${{ inputs.loong_replay_artifact }}` in run `${{ inputs.loong_replay_run_id }}`.'
            echo 'Assembler origin: `${{ inputs.loong_replay_origin }}`.'
            echo 'Only QEMU boot is executed; no recompilation, reassembly or relinking.'
          } >> "$GITHUB_STEP_SUMMARY"
