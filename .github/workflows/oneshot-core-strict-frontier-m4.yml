name: One-shot Core Strict Frontier M4

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Show representative real blocker bodies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('build/linux-focus-corpus/kbuild')
          targets = [
              ('arch/riscv/kernel/patch.i', 'INIT_LIST_HEAD'),
              ('arch/riscv/mm/pgtable.i', 'set_arch_panic_timeout'),
              ('arch/riscv/kernel/cpu.i', 'size_mul'),
              ('arch/riscv/kernel/signal.i', 'dma_get_cache_alignment'),
          ]

          def extract_function(text: str, name: str) -> str:
              pattern = re.compile(r'\b' + re.escape(name) + r'\s*\(')
              for match in pattern.finditer(text):
                  brace = text.find('{', match.end())
                  semi = text.find(';', match.end())
                  if brace < 0 or (semi >= 0 and semi < brace) or brace - match.end() > 4000:
                      continue
                  depth = 0
                  end = None
                  for index in range(brace, len(text)):
                      char = text[index]
                      if char == '{':
                          depth += 1
                      elif char == '}':
                          depth -= 1
                          if depth == 0:
                              end = index + 1
                              break
                  if end is None:
                      continue
                  start = text.rfind('\n', 0, max(0, match.start() - 800))
                  if start < 0:
                      start = max(0, match.start() - 800)
                  else:
                      start += 1
                  return text[start:end]
              raise SystemExit(f'cannot find definition for {name}')

          for rel, name in targets:
              path = root / rel
              text = path.read_text(errors='replace')
              body = extract_function(text, name)
              print(f'=== CORE_REAL_BLOCKER function={name} input={rel} chars={len(body)} ===')
              print(body[:20000])
              if len(body) > 20000:
                  print('... <truncated> ...')
              print(f'=== CORE_REAL_BLOCKER_END function={name} ===')
          PY
