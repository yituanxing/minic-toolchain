name: Parson PR Validation

on:
  pull_request:
    branches: [frontend/additive-update-pointer-difference]

jobs:
  parson:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage current compiler semantics and build MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          sh tools/dev/pr72-stage.sh
          make -j4 MODE=release BUILD_DIR=build/parson-compiler
          make -j4 MODE=sanitize BUILD_DIR=build/parson-sanitize

      - name: Compile unchanged Parson 1.5.3
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/parson-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/parson-discovery" \
          RISCV_CC=cc \
            sh tests/external/parson/probe.sh
          status=$?
          set -e

          if test "$status" -ge 128; then
            echo "PARSON_SANITIZER_RERUN release_status=$status"
            set +e
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              "$GITHUB_WORKSPACE/build/parson-sanitize/bin/minic" \
              -S "$GITHUB_WORKSPACE/build/parson-discovery/parson.i" \
              -o "$GITHUB_WORKSPACE/build/parson-discovery/parson-sanitize.s"
            sanitize_status=$?
            set -e
            echo "PARSON_SANITIZER_STATUS=$sanitize_status"
          fi
          exit "$status"
