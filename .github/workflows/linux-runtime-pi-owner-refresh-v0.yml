name: Linux Runtime PI Owner Refresh V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-pi-owner-refresh-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-owner-refresh:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-pi-owner-refresh-v0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites without update
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-owner-refresh-v0"
          mkdir -p "$ev"
          mode=no-update
          if ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
              >"$ev/apt.stdout.txt" 2>"$ev/apt.stderr.txt"; then
            mode=fallback-update
            sudo apt-get -o Acquire::Retries=3 update >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
              >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
          fi
          echo "INSTALL_MODE=$mode"

      - name: Build established MiniC runtime profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-owner-refresh-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-pi-owner-refresh-v0"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_RV64_STATIC_PCREL_GLOBAL_ADDRESS_V0=' "$ev/profile/patch.log"
          grep -F 'MINIC_RV64_STATIC_PCREL_FUNCTION_ADDRESS_V0=' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Rebuild true PI string owner only
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-owner-refresh-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-pi-owner-refresh-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=arch/riscv/kernel/pi/cmdline_early.pi.o
          base=arch/riscv/kernel/pi/cmdline_early
          mkdir -p "$ev"
          sha256sum "$out/$target" >"$ev/owner.before.sha256"
          rm -f \
            "$out/$base.o" "$out/$target" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
            "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s" \
            "$out/$base.minic-stage2.minic.stdout" "$out/$base.minic-stage2.minic.stderr"
          start=$(date +%s%N)
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/owner-refresh.trace" \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j2 V=1 "$target" >"$ev/owner-refresh.log" 2>&1
          end=$(date +%s%N)
          echo "TIMING owner_refresh_ms=$(((end-start)/1000000)) target=$target" | tee "$ev/timing.txt"
          test -s "$out/$base.o"
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.i"
          test -s "$out/$base.minic-stage2.s"
          sha256sum "$out/$target" >"$ev/owner.after.sha256"
          cp "$out/$base.minic-stage2.s" "$ev/cmdline_early.minic-stage2.s"
          cp "$out/$base.minic-stage2.i" "$ev/cmdline_early.minic-stage2.i"
          echo 'CMDLINE_LOCAL_ADDRESS_LINES_BEGIN' | tee "$ev/address-lines.txt"
          grep -E '^[[:space:]]+(la|lla)[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' \
            "$ev/cmdline_early.minic-stage2.s" | tee -a "$ev/address-lines.txt" || true
          echo 'CMDLINE_LOCAL_ADDRESS_LINES_END' | tee -a "$ev/address-lines.txt"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' \
            "$ev/cmdline_early.minic-stage2.s" >/dev/null || {
              echo 'PI_OWNER_ASM=FAIL no PC-relative local string address' >&2
              exit 71
            }
          echo 'PI_OWNER_ASM=PASS local_string=lla'

      - name: Build early image after owner refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-owner-refresh-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"
          cat "$ev/early/timing.txt" >>"$ev/timing.txt"

      - name: Execute until runtime oracle decides and capture fault context
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-owner-refresh-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 \
            | tee "$ev/watch.stdout.txt"
          watch_rc=${PIPESTATUS[0]}
          set -e

          context_rc=0
          if test -s "$ev/watch/frontier-result.json" && test -s "$ev/watch/qemu.trace.log"; then
            set +e
            python3 tools/ci/linux-runtime-fault-context-v1.py \
              --nm "$ev/early/nm.txt" \
              --trace "$ev/watch/qemu.trace.log" \
              --frontier-json "$ev/watch/frontier-result.json" \
              --vmlinux "$ev/early/vmlinux.early" \
              --out "$ev/fault-context.json" \
              | tee "$ev/fault-context.txt"
            context_rc=${PIPESTATUS[0]}
            set -e
          fi

          {
            echo '## Linux Runtime PI Owner Refresh V0'
            echo
            echo '```text'
            cat "$ev/watch/frontier-summary.txt" || true
            cat "$ev/fault-context.txt" || true
            cat "$ev/timing.txt" || true
            echo "WATCH_RC=$watch_rc"
            echo "FAULT_CONTEXT_RC=$context_rc"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$watch_rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-pi-owner-refresh-v0-${{ github.sha }}
          path: |
            build/linux-runtime-pi-owner-refresh-v0/profile/patch.log
            build/linux-runtime-pi-owner-refresh-v0/profile/minic-profile.txt
            build/linux-runtime-pi-owner-refresh-v0/owner.before.sha256
            build/linux-runtime-pi-owner-refresh-v0/owner.after.sha256
            build/linux-runtime-pi-owner-refresh-v0/owner-refresh.trace
            build/linux-runtime-pi-owner-refresh-v0/owner-refresh.log
            build/linux-runtime-pi-owner-refresh-v0/address-lines.txt
            build/linux-runtime-pi-owner-refresh-v0/cmdline_early.minic-stage2.s
            build/linux-runtime-pi-owner-refresh-v0/timing.txt
            build/linux-runtime-pi-owner-refresh-v0/fault-context.json
            build/linux-runtime-pi-owner-refresh-v0/fault-context.txt
            build/linux-runtime-pi-owner-refresh-v0/watch/frontier-result.json
            build/linux-runtime-pi-owner-refresh-v0/watch/frontier-summary.txt
            build/linux-runtime-pi-owner-refresh-v0/watch/watch-result.json
            build/linux-runtime-pi-owner-refresh-v0/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
