name: MiniC RV64I Origin Audit (7 frozen Linux shards)

on:
  # Exact-head regression on the follow-up PR. Seven expensive shards are
  # opted in only when the PR title carries [rv64i-seven].
  pull_request:
    paths:
      # Core and language ABI edits affect this exact-head GNU/QEMU smoke.
      # Expensive Linux shards still require the [rv64i-seven] title gate.
      - 'src/frontend/**'
      - 'src/core/**'
      - 'src/compiler/**'
      - 'src/target/common/**'
      - 'src/target/target_info*'
      - 'src/target/data_layout*'
      - 'include/minic/**'
      - 'tools/minic/**'
      - 'tools/minic-cc/**'
      - '.github/workflows/minic-rv64i-origin-audit-seven.yml'
      - 'src/target/riscv/**'
      - 'src/target/riscv64/**'
      - 'tests/target/riscv64/abi_test.c'
      # Changes in five-target semantic facts alter RV64 admission too.
      - 'src/target/common/core_function_facts.c'
      - 'src/target/common/core_function_facts.h'
      - 'src/target/common/core_function_plan.c'
      - 'tests/compiler/c0/probe-rv64i-asm-origin.sh'
      - 'tests/compiler/c0/run-rv64-core-call-transfer.sh'
      - 'tests/external/linux/corpus_replay.py'
      - 'tools/ci/audit-rv64i-asm-origin.py'
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'src/core/**'
      - 'src/compiler/**'
      - 'src/target/common/**'
      - 'src/target/target_info*'
      - 'src/target/data_layout*'
      - 'src/target/riscv/**'
      - 'src/target/riscv64/**'
      - 'include/minic/**'
      - 'tools/minic/**'
      - 'tools/minic-cc/**'
      - '.github/workflows/minic-rv64i-origin-audit-seven.yml'
      - 'tools/ci/audit-rv64i-asm-origin.py'
      - 'tools/ci/summarize-rv64i-seven-v1.py'
      - 'tests/compiler/c0/probe-rv64i-asm-origin.sh'
      - 'tests/compiler/c0/run-rv64-core-call-transfer.sh'
      - 'tests/external/linux/corpus_replay.py'
      - 'tests/compiler/c0/probe-rv64i-int128-libcalls.sh'
      - 'tests/compiler/c0/probe-rv64i-int128-pairs.sh'
      - 'src/frontend/parser_builtins.c'
      - 'src/target/riscv64/scalar_emit.c'
      - 'src/target/riscv64/runtime_libcall.c'
      - 'src/target/riscv64/isa.c'
      - 'third_party/llvm-compiler-rt-19.1.7/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # This is an explicitly opt-in 3352-owner *long* Linux audit. Other MiniC
  # commits may land while its seven frozen shards are compiling. Such commits
  # must not retrospectively cancel an exact-head evidence run; use a
  # commit-specific group while retaining the PR-title cost gate below.
  group: rv64i-origin-audit-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Source and evidence must be tied to the true PR head, not GitHub's
          # temporary synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Static audit checker validation
        run: |
          python3 -m py_compile tools/ci/audit-rv64i-asm-origin.py tools/ci/summarize-rv64i-seven-v1.py tests/external/linux/corpus_replay.py
          bash -n tests/compiler/c0/probe-rv64i-asm-origin.sh
          bash -n tests/compiler/c0/probe-rv64i-int128-libcalls.sh
          bash -n tests/compiler/c0/probe-rv64i-int128-pairs.sh
          python3 -m py_compile tests/external/linux/corpus_replay.py
          # The original Kbuild language flags must be supplied explicitly;
          # changing MiniC's default wchar_t would regress other C programs.
          grep -Fq -- '--minic-cflag=-fshort-wchar' .github/workflows/minic-rv64i-origin-audit-seven.yml
          grep -Fq -- '--minic-cflag=-funsigned-char' .github/workflows/minic-rv64i-origin-audit-seven.yml
          grep -Fq -- 'cancel-in-progress: false' .github/workflows/minic-rv64i-origin-audit-seven.yml
      - name: Compile MiniC and prove source-ASM provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/rv64i-origin-smoke all
          bash tests/compiler/c0/probe-rv64i-asm-origin.sh "$GITHUB_WORKSPACE/build/rv64i-origin-smoke/bin/minic-cc"
          bash tests/compiler/c0/probe-rv64i-int128-libcalls.sh "$GITHUB_WORKSPACE/build/rv64i-origin-smoke/bin/minic-cc"
          bash tests/compiler/c0/probe-rv64i-int128-pairs.sh "$GITHUB_WORKSPACE/build/rv64i-origin-smoke/bin/minic-cc"
          # Qualify GNU ICE constant-p fallback before the full Linux cohort.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cc -E -P -std=gnu11 -x c tests/compiler/c0/gnu_constant_p_ice_regression.c -o "$work/valid.i"
          build/rv64i-origin-smoke/bin/minic -march=rv64i -mabi=lp64 -S "$work/valid.i" -o "$work/valid.s"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/gnu_choose_dynamic_condition_reject.c -o "$work/invalid.i"
          if build/rv64i-origin-smoke/bin/minic -march=rv64i -mabi=lp64 -S "$work/invalid.i" -o "$work/invalid.s" 2>"$work/invalid.err"; then
            echo "RV64I_ICE_PROBE=FAIL arbitrary_dynamic_choose_allowed=1"
            exit 1
          fi
          echo "RV64I_ICE_PROBE=PASS builtin_constant_p=0 in ICE, direct_dynamic_choose=rejected"

      # Small L2 ABI differential must run before the expensive 7-shard
      # Linux tier. Uses the *exact PR head* and compares static GNU/MiniC
      # callers against GNU implementations in real RV64 QEMU.
      - name: Validate hard-float and soft-float two-XLEN ABI classification
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/rv64i-origin-smoke check-rv64-abi

      - name: RV64 direct and indirect wide CALL returns versus GNU in QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
          CORE_FAST_TRACE=1 MINIC_BOOTSTRAP_TRACE=1 \
          MINIC="$GITHUB_WORKSPACE/build/rv64i-origin-smoke/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/rv64i-origin-call-transfer" \
            bash tests/compiler/c0/run-rv64-core-call-transfer.sh

  linux-shard:
    # Seven full shards run only by explicit dispatch or tagged push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[rv64i-seven]') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, '[rv64i-seven]'))
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: first500
            corpus_dir: linux-focus-corpus
            cache_key: first500-dynamic
            offset: 0
            limit: 500
          - label: new500
            corpus_dir: linux-new500-corpus
            cache_key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
            offset: 500
            limit: 500
          - label: next500
            corpus_dir: linux-next500-corpus
            cache_key: linux-next500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1000-1499
            offset: 1000
            limit: 500
          - label: next500b
            corpus_dir: linux-next500b-corpus
            cache_key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
            offset: 1500
            limit: 500
          - label: next500c
            corpus_dir: linux-next500c-corpus
            cache_key: linux-next500c-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-2000-2499
            offset: 2000
            limit: 500
          - label: next500d
            corpus_dir: linux-next500d-corpus
            cache_key: linux-next500d-corpus-v4-6.6.143-rv64-defconfig-gcc13.3.0-indices-2500-2999
            offset: 2500
            limit: 500
          - label: final352
            corpus_dir: linux-final352-corpus
            cache_key: linux-final352-corpus-v2-6.6.143-rv64-defconfig-gcc13.3.0-indices-3000-3351
            offset: 3000
            limit: 352
    steps:
      - uses: actions/checkout@v4
        with:
          # Source and evidence must be tied to the true PR head, not GitHub's
          # temporary synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore exact Linux 6.6.143 preprocessed corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/${{ matrix.corpus_dir }}
          key: ${{ matrix.label == 'first500' && format('linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-{0}', hashFiles('tests/external/linux/replay-indices.txt')) || matrix.cache_key }}
      # Main cannot read caches produced only on now-deleted feature branches.
      # Reconstruct exact Kbuild .i on miss using the existing seven-shard
      # materializer; never substitute stale or differently configured inputs.
      - name: Fetch pinned Linux 6.6.143 source on cache miss
        if: steps.corpus.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          src="build/rv64i-origin-linux-${{ matrix.label }}"
          mkdir -p "$src"
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/gregkh/linux.git
          git -C "$src" fetch --depth=1 --no-tags origin d1cfde2d5d15be14123bdd1689162bd27f995a90
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = d1cfde2d5d15be14123bdd1689162bd27f995a90
      - name: Install pinned corpus cross-build dependencies on miss
        if: steps.corpus.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev
      - name: Regenerate exact original Kbuild TU window on cache miss
        if: steps.corpus.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          builder="$GITHUB_WORKSPACE/build/rv64i-origin-$label-materializer"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          export LINUX_BATCH_MATERIALIZE_ONLY=1
          export BUILD_DIR="$builder"
          export LINUX_SOURCE_TREE="$GITHUB_WORKSPACE/build/rv64i-origin-linux-$label"
          export CROSS_COMPILE=riscv64-linux-gnu-
          export LINUX_BATCH_OFFSET=${{ matrix.offset }}
          export LINUX_BATCH_LIMIT=${{ matrix.limit }}
          export LINUX_BATCH_JOBS=4
          if [[ "$label" == next500d || "$label" == final352 ]]; then
            export LINUX_BATCH_MATERIALIZE_MAKE_JOBS=1
          fi
          sh tests/external/linux/batch_probe.sh
          python3 - "$builder" "$corpus" "${{ matrix.offset }}" "${{ matrix.limit }}" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          builder, corpus = map(Path, sys.argv[1:3])
          offset, limit = map(int, sys.argv[3:5])
          lines = [x for x in (builder / "selected-tus.txt").read_text().splitlines() if x.strip()]
          assert len(lines) == limit, (len(lines), limit)
          indices = [int(line.split("\t", 1)[0]) for line in lines]
          assert indices == list(range(offset, offset + limit)), "wrong frozen TU window"
          shutil.rmtree(corpus, ignore_errors=True)
          (corpus / "kbuild").mkdir(parents=True)
          (corpus / "selected-tus.txt").write_text("\n".join(lines) + "\n")
          for line in lines:
              _, _, rel, _ = line.split("\t", 3)
              source = builder / "kbuild" / rel
              assert source.is_file() and source.stat().st_size, rel
              dest = corpus / "kbuild" / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, dest)
          print(f"RV64I_ORIGIN_CORPUS=REBUILT exact={limit} range={offset}-{offset+limit-1}")
          PY
      - name: Cache rebuilt corpus on main for future seven-way runs
        if: steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/${{ matrix.corpus_dir }}
          key: ${{ matrix.label == 'first500' && format('linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-{0}', hashFiles('tests/external/linux/replay-indices.txt')) || matrix.cache_key }}
      - name: Validate frozen manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest="build/${{ matrix.corpus_dir }}/selected-tus.txt"
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq ${{ matrix.limit }}
          test "$(head -1 "$manifest" | cut -f1)" -eq ${{ matrix.offset }}
      - name: Build MiniC (no assembler needed for textual audit)
        shell: bash
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/rv64i-origin-${{ matrix.label }} all
      - name: Produce every available MiniC .s, preserving inline M/A/Z
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          work="$GITHUB_WORKSPACE/build/rv64i-origin-$label-replay"
          compiler="$GITHUB_WORKSPACE/build/rv64i-origin-$label/bin/minic"
          # Select local 0..N indices; manifest indices already encode global offsets.
          # A nonzero replay exit means some Linux TUs could not compile.
          # Still scan every generated .s and preserve exact failed-TU evidence.
          # The global coverage aggregator fails separately on missing TUs.
          set +e
          python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}" \
            --work "$work" --jobs 4 \
            --offset 0 --limit ${{ matrix.limit }} \
            --sample-count 0 --rv64i-origin-audit \
            --minic-cflag=-fshort-wchar \
            --minic-cflag=-funsigned-char
          replay_rc=$?
          set -e
          echo "RV64I_ORIGIN_REPLAY_EXIT=$replay_rc shard=$label"
          test -s "$work/batch-results.json"
      # Keep .s and failed-translation-unit evidence even if a large textual
      # scanner process or runner later fails. Use a separate Actions step.
      - name: Preserve source .s before ISA analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv64i-sources-${{ matrix.label }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            build/rv64i-origin-${{ matrix.label }}-replay/minic-out/
            build/rv64i-origin-${{ matrix.label }}-replay/batch-results.json
            build/rv64i-origin-${{ matrix.label }}-replay/batch-results.tsv
      - name: Scan every generated assembly for compiler-origin non-I
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ matrix.label }}"
          work="$GITHUB_WORKSPACE/build/rv64i-origin-$label-replay"
          python3 tools/ci/audit-rv64i-asm-origin.py \
            --root "$work/minic-out" \
            --batch-results "$work/batch-results.json" \
            --json-out "$work/rv64i-origin-report.json" \
            --opcode-tsv-out "$work/rv64i-opcode-counts.tsv" \
            --fail-on-compiler-non-i
      - name: Upload scanned verdicts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv64i-origin-${{ matrix.label }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          path: |
            build/rv64i-origin-${{ matrix.label }}-replay/batch-results.json
            build/rv64i-origin-${{ matrix.label }}-replay/batch-results.tsv
            build/rv64i-origin-${{ matrix.label }}-replay/failure-contexts.txt
            build/rv64i-origin-${{ matrix.label }}-replay/rv64i-origin-report.json
            build/rv64i-origin-${{ matrix.label }}-replay/rv64i-opcode-counts.tsv
            build/rv64i-origin-${{ matrix.label }}-replay/minic-stderr/**/*.stderr
      - name: Publish exact shard coverage
        if: always()
        shell: bash
        run: |
          p="build/rv64i-origin-${{ matrix.label }}-replay/rv64i-origin-report.json"
          if [[ -s "$p" ]]; then
            python3 - "$p" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))["summary"]
          print("RV64I_ORIGIN_SHARD " + json.dumps(s, sort_keys=True)[:3000])
          PY
          else
            echo "RV64I_ORIGIN_SHARD=INCOMPLETE no_report=1"
          fi

  audit-summary:
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[rv64i-seven]') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, '[rv64i-seven]')))
    needs: [linux-shard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Source and evidence must be tied to the true PR head, not GitHub's
          # temporary synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download all seven evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rv64i-origin-*
          path: evidence
      - name: Aggregate exact 3352-index coverage, provenance and ISA counts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/summarize-rv64i-seven-v1.py \
            --evidence evidence \
            --json-out rv64i-seven-aggregate.json
      - name: Retain machine-readable seven-shard aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv64i-seven-aggregate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: rv64i-seven-aggregate.json
