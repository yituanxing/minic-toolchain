name: Toolchain Regression Ledger V0

on:
  push:
    branches:
      - "toolchain/regression-ledger-v0"
  pull_request:
    branches:
      - "toolchain/static-readiness"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 validation tools
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-riscv64-cross libc6-dev-riscv64-cross qemu-user python3

      - name: Run reusable core regression ledger
        run: |
          python3 tools/validation/run_toolchain_regression.py \
            --profile core \
            --json-out build/toolchain-regression-v0.json

      - name: Preserve regression ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-regression-ledger-v0
          path: build/toolchain-regression-v0.json
          if-no-files-found: error
          retention-days: 7
