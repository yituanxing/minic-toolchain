name: MiniPP Linux Freeze 500

on:
  push:
    branches:
      - 'toolchain/minipp-*'
    paths:
      - '.github/workflows/minipp-linux-freeze-500.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-first500:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minipp-linux-freeze500]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Kbuild planning prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils

      - name: Prepare Linux 6.6.143
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-freeze500"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts

      - name: Freeze Kbuild first500 C translation units
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-freeze500"
          src="$work/linux-6.6.143"
          out="$work/out"

          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/kbuild-plan.raw" 2>"$work/kbuild-plan.stderr"
          plan_status=$?
          set -e
          echo "MINIPP_LINUX_FREEZE500_PLAN_STATUS=$plan_status"

          python3 tests/preprocessor/freeze_linux_kbuild_manifest.py \
            --plan "$work/kbuild-plan.raw" \
            --src "$src" \
            --out "$out" \
            --limit 500 \
            --tsv "$work/linux-batch500.tsv" \
            --sources "$work/linux-batch500.txt" \
            --contract "$work/linux-first500-contract.jsonl"

          python3 - "$work/linux-batch500.tsv" <<'PY'
          from pathlib import Path
          import sys

          rows = [line for line in Path(sys.argv[1]).read_text().splitlines()[1:] if line.strip()]
          if len(rows) != 500:
              raise SystemExit(f"MINIPP_LINUX_FREEZE500 expected=500 actual={len(rows)}")
          print("MINIPP_LINUX_FREEZE500_CONTRACT=PASS selected=500")
          PY

          test "$(grep -cve '^[[:space:]]*$' "$work/linux-batch500.txt")" -eq 500
          sha256sum "$work/linux-batch500.txt" | tee "$work/linux-batch500.sha256"

      - name: Preserve frozen first500 manifest
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-first500-manifest
          path: |
            build/minipp-linux-freeze500/linux-batch500.txt
            build/minipp-linux-freeze500/linux-batch500.tsv
            build/minipp-linux-freeze500/linux-batch500.sha256
            build/minipp-linux-freeze500/linux-first500-contract.jsonl
            build/minipp-linux-freeze500/kbuild-plan.raw
            build/minipp-linux-freeze500/kbuild-plan.stderr
          retention-days: 7
