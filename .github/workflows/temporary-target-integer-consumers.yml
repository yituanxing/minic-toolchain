name: Temporary Target Integer Consumer Migration

on:
  push:
    branches:
      - 'refactor/target-integer-consumers'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/target-integer-consumers
          fetch-depth: 0

      - name: Install canonical formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Apply target integer consumer migration
        run: python3 tools/maintenance/apply-target-integer-consumers.py

      - name: Canonical formatting
        env:
          CLANG_FORMAT: clang-format-18
        run: bash tools/maintenance/run-format.sh write

      - name: Fast host validation
        run: |
          git diff --check
          make -j2 BUILD_DIR=build/target-integer-consumers check

      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/type.h \
            src/frontend/type.c \
            tests/frontend/type_test.c \
            src/frontend/ast.h \
            src/frontend/ast.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_statement.c \
            src/frontend/ast_verifier.c \
            src/frontend/const_eval.c \
            src/target/riscv64/codegen_expression.c \
            src/target/riscv64/codegen_statement.c
          git commit -m 'refactor(frontend): consume target integer semantics'
          git push origin HEAD:refactor/target-integer-consumers
