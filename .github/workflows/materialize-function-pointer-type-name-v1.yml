name: Materialize function-pointer type-name support

on:
  push:
    branches:
      - staging/function-pointer-type-name-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/function-pointer-type-name-v1
          fetch-depth: 0
      - name: Materialize product delta
        run: python3 tools/dev/materialize-function-pointer-type-name-v1.py
      - name: Build and focused validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/materialize-function-pointer-type-name
          MINIC="$GITHUB_WORKSPACE/build/materialize-function-pointer-type-name/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/materialize-function-pointer-type-name-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-shared-function-declarator.sh
          make check-fast
          git diff --check
      - name: Commit materialized product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_type.c \
                  tests/compiler/c0/shared_function_declarator.c \
                  tests/compiler/c0/run-shared-function-declarator.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: support function-pointer type names [materialized]'
          git push origin HEAD:staging/function-pointer-type-name-v1
