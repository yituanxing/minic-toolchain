name: Nested Case Core A/B

on:
  push:
    branches:
      - diagnostics/nested-case-core-ab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current compiler
        uses: actions/checkout@v4
        with:
          ref: 0eb1c8caffc545f6e07e38708f401923c70ca479
          path: current

      - name: Checkout immediate pre-Core-default compiler
        uses: actions/checkout@v4
        with:
          ref: 91a7da74665e9b1bb6b89fcd0773db1c9ac0da10
          path: legacy

      - name: Build both compilers
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C current -j4 MODE=release CFLAGS=-Werror \
            BUILD_DIR="$GITHUB_WORKSPACE/current-build" all
          make -C legacy -j4 MODE=release CFLAGS=-Werror \
            BUILD_DIR="$GITHUB_WORKSPACE/legacy-build" all
          test -x "$GITHUB_WORKSPACE/current-build/bin/minic"
          test -x "$GITHUB_WORKSPACE/legacy-build/bin/minic"

      - name: Compile minimal nested-case probe
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >"$GITHUB_WORKSPACE/nested_case.c" <<'EOF'
          static int probe(int selector, int enabled)
          {
              int value = 0;

              switch (selector) {
              case 2:
                  if (enabled) {
              case 1:
                      value = 7;
                  }
                  break;
              default:
                  value = 9;
                  break;
              }
              return value;
          }

          int main(void)
          {
              if (probe(1, 0) != 7)
                  return 1;
              if (probe(2, 1) != 7)
                  return 2;
              if (probe(2, 0) != 0)
                  return 3;
              return 0;
          }
          EOF
          cc -E -P -std=gnu11 "$GITHUB_WORKSPACE/nested_case.c" \
            -o "$GITHUB_WORKSPACE/nested_case.i"

          set +e
          "$GITHUB_WORKSPACE/legacy-build/bin/minic" -S "$GITHUB_WORKSPACE/nested_case.i" \
            -o "$GITHUB_WORKSPACE/legacy.s" \
            >"$GITHUB_WORKSPACE/legacy.stdout" 2>"$GITHUB_WORKSPACE/legacy.stderr"
          legacy_rc=$?
          "$GITHUB_WORKSPACE/current-build/bin/minic" -S "$GITHUB_WORKSPACE/nested_case.i" \
            -o "$GITHUB_WORKSPACE/current.s" \
            >"$GITHUB_WORKSPACE/current.stdout" 2>"$GITHUB_WORKSPACE/current.stderr"
          current_rc=$?
          set -e

          echo "NESTED_CASE_AB legacy_rc=$legacy_rc current_rc=$current_rc"
          echo "NESTED_CASE_LEGACY_STDERR_BEGIN"
          cat "$GITHUB_WORKSPACE/legacy.stderr"
          echo "NESTED_CASE_LEGACY_STDERR_END"
          echo "NESTED_CASE_CURRENT_STDERR_BEGIN"
          cat "$GITHUB_WORKSPACE/current.stderr"
          echo "NESTED_CASE_CURRENT_STDERR_END"

          test "$legacy_rc" -eq 0
          test -s "$GITHUB_WORKSPACE/legacy.s"
          test "$current_rc" -ne 0
          grep -q "Core IR does not yet support" "$GITHUB_WORKSPACE/current.stderr"
          echo "NESTED_CASE_CORE_MIGRATION_REGRESSION=CONFIRMED"
