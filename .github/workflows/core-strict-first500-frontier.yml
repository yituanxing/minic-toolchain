name: Core Strict First500 Frontier

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: core-strict-first500-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontier:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply current Linux frontier patches
        run: |
          python3 tools/dev/patch-core-frontier-m50-scalar-input-asm.py
          python3 tools/dev/patch-core-frontier-m50b-void-statement-expression.py
          python3 tools/dev/patch-core-frontier-m50c-output-input-asm.py
          python3 tools/dev/patch-core-frontier-m51-compound-shift.py
          python3 tools/dev/patch-core-frontier-m52-memory-rw-input-asm.py
          python3 tools/dev/patch-core-frontier-m53-void-conditional.py
          python3 tools/dev/patch-core-frontier-m54-void-conditional-statement.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-strict500-compiler

      - name: Fast Linux frontier probe
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-strict500-probe"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 1 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '3'
          probe_status=$?
          set -e
          printf 'CORE_STRICT_PROBE_STATUS=%d\n' "$probe_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/core-strict500-probe/frontier-summary.json').read_text())
          if summary['selected'] != 1:
              raise SystemExit(f"expected one Linux probe TU, got {summary['selected']}")
          remaining = [b for b in summary['blockers'] if b['function'] == '__set_bit_le']
          if remaining:
              raise SystemExit(f"Linux probe still blocked at __set_bit_le: {remaining}")
          print('LINUX_FRONTIER_PROBE_PASSED_OLD_BLOCKER')
          PY

      - name: Replay full frozen first500 and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-strict500-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 5 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices ''
          replay_status=$?
          set -e
          printf 'CORE_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/core-strict500-frontier/frontier-summary.json').read_text())
          if summary['selected'] != 500:
              raise SystemExit(f"expected 500 frozen TUs, got {summary['selected']}")
          forbidden = {
              'arch_local_irq_enable',
              'arch_local_irq_disable',
              'arch_local_irq_save',
              'arch_local_irq_restore',
              'arch_local_save_flags',
              'arch_irqs_disabled',
              'arch_irqs_disabled_flags',
              '__ffs',
              'test_and_set_bit',
              'arch_atomic_add',
              '__set_bit_le',
          }
          remaining = [b for b in summary['blockers'] if b['function'] in forbidden]
          if remaining:
              raise SystemExit(f"M54/earlier blocker remains: {remaining}")
          PY

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-strict-first500-frontier
          path: |
            build/core-strict500-probe/batch-results.json
            build/core-strict500-probe/batch-results.tsv
            build/core-strict500-probe/batch-summary.txt
            build/core-strict500-probe/failure-contexts.txt
            build/core-strict500-probe/frontier-summary.json
            build/core-strict500-frontier/batch-results.json
            build/core-strict500-frontier/batch-results.tsv
            build/core-strict500-frontier/batch-summary.txt
            build/core-strict500-frontier/failure-contexts.txt
            build/core-strict500-frontier/frontier-summary.json
          if-no-files-found: warn

      - name: Persist M53/M54 source changes
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            src/core/core_lower.c
          )
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'core: lower void conditional expression statements'
          git push origin HEAD:refactor/declaration-sema-v1
