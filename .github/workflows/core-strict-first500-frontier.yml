name: Core Strict First500 Frontier

on:
  pull_request:

permissions:
  contents: write

jobs:
  fast-frontier:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-strict-fast-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply current Linux frontier patches
        run: |
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-m50-scalar-input-asm.py
          python3 tools/dev/patch-core-frontier-m50b-void-statement-expression.py
          python3 tools/dev/patch-core-frontier-m50c-output-input-asm.py
          python3 tools/dev/patch-core-frontier-m51-compound-shift.py
          python3 tools/dev/patch-core-frontier-m52-memory-rw-input-asm.py
          python3 tools/dev/patch-core-frontier-m53-void-conditional.py
          python3 tools/dev/patch-core-frontier-m54-void-conditional-statement.py
          python3 tools/dev/patch-core-frontier-m55-scalar-conditional-conversion.py
          python3 tools/dev/patch-core-frontier-m56-prefix-update.py
          python3 tools/dev/patch-core-frontier-m57-constant-conditional.py
          python3 tools/dev/patch-core-frontier-m58-logical-or.py
          python3 tools/dev/patch-core-frontier-m59-empty-scalar-input-barrier.py
          python3 tools/dev/patch-core-frontier-m60-pointer-conditional.py
          python3 tools/dev/patch-core-frontier-m61-immediate-only-asm.py
          python3 tools/dev/patch-core-frontier-m62-pointer-return-conversion.py
          python3 tools/dev/patch-core-frontier-m63-qualified-scalar-update.py
          python3 tools/dev/patch-core-frontier-m64-local-label-address.py
          python3 tools/dev/patch-core-frontier-m65-assignment-expression.py
          python3 tools/dev/patch-core-frontier-m66-subscript-index-value-type.py
          python3 tools/dev/patch-core-frontier-m67-structured-inline-asm.py
          python3 tools/dev/patch-core-frontier-m68-structured-inline-asm-optional-inputs.py
          python3 tools/dev/patch-core-frontier-m69-structured-asm-register-or-zero.py
          python3 tools/dev/patch-core-frontier-m70-array-lvalue-pointer-decay.py
          python3 tools/dev/patch-core-frontier-m71-legacy-array-object-subscript.py
          python3 tools/dev/patch-core-frontier-m72-nested-break-target.py
          python3 tools/dev/patch-core-frontier-m73-comma-expression.py
          python3 tools/dev/patch-core-frontier-m74-global-record-address.py
          python3 tools/dev/patch-core-frontier-m75-pointer-compound-assignment.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-strict500-compiler

      - name: Focused Core frontier regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-frontier-focused"
          mkdir -p "$work"
          cat >"$work/comma-expression.i" <<'EOF'
          int comma_value(int value) {
              return (value = value + 1, value + 2);
          }

          int comma_condition(int value) {
              while ((value = value - 1, value > 0)) {
                  value = 0;
              }
              return value;
          }
          EOF
          "$compiler" -S "$work/comma-expression.i" -o "$work/comma-normal.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/comma-expression.i" -o "$work/comma-strict.s"
          cmp "$work/comma-normal.s" "$work/comma-strict.s"

          cat >"$work/global-record-address.i" <<'EOF'
          struct holder {
              unsigned long bits[1];
          };
          extern struct holder global_holder;

          unsigned long *global_record_array_address(void) {
              return (&global_holder)->bits;
          }
          EOF
          "$compiler" -S "$work/global-record-address.i" -o "$work/record-normal.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/global-record-address.i" -o "$work/record-strict.s"
          cmp "$work/record-normal.s" "$work/record-strict.s"

          cat >"$work/pointer-compound.i" <<'EOF'
          unsigned long *pointer_compound_sub(unsigned long *p, unsigned int n) {
              p -= n;
              return p;
          }

          unsigned long *pointer_compound_add(unsigned long *p, unsigned int n) {
              p += n;
              return p;
          }
          EOF
          "$compiler" -S "$work/pointer-compound.i" -o "$work/pointer-compound-normal.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/pointer-compound.i" -o "$work/pointer-compound-strict.s"
          cmp "$work/pointer-compound-normal.s" "$work/pointer-compound-strict.s"
          echo 'M73_M75_FOCUSED_PASS'

      - name: Fast Linux sixteen-frontier probe
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-strict500-probe"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 16 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '0,1,2,3,4,7,9,20,42,66,95,155,165,280,288,299'
          probe_status=$?
          set -e
          printf 'CORE_STRICT_PROBE_STATUS=%d\n' "$probe_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 16 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 16 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('build/core-strict500-probe/frontier-summary.json').read_text())
          if s['selected'] != 16:
              raise SystemExit(f"expected 16 Linux frontier probes, got {s['selected']}")
          unexpected_errors = [
              e for e in s.get('errors', [])
              if not (e.get('index') == 155 and 'timespec64_add_safe' in e.get('message', ''))
          ]
          if unexpected_errors:
              raise SystemExit(f"unexpected Linux probe errors: {unexpected_errors}")
          cleared = {
              'cpumask_first',
              'cpumask_any_but',
              'reset_cpu_possible_mask',
              'get_cpu_mask',
          }
          old_family = [b for b in s['blockers'] if b['function'] in cleared]
          if old_family:
              raise SystemExit(f"Linux probe still blocked in cleared frontier family: {old_family}")
          print(f"LINUX_SIXTEEN_FRONTIER_PASSED_M75 known_errors={len(s.get('errors', []))}")
          PY

      - name: Upload fast frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-strict-fast-${{ github.run_id }}
          path: |
            build/core-strict500-probe/batch-results.json
            build/core-strict500-probe/batch-results.tsv
            build/core-strict500-probe/batch-summary.txt
            build/core-strict500-probe/failure-contexts.txt
            build/core-strict500-probe/frontier-summary.json
            build/core-strict500-probe/progress-summary.json
            build/core-strict500-probe/progress-summary.txt
            build/core-strict500-probe/minic-stderr
          if-no-files-found: warn

      - name: Persist M72-M75 source changes
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- src/core/core_lower.c src/core/core_ir.c src/core/core_ir.h src/target/riscv64/core_codegen.c
          python3 tools/dev/patch-core-frontier-m72-nested-break-target.py
          python3 tools/dev/patch-core-frontier-m73-comma-expression.py
          python3 tools/dev/patch-core-frontier-m74-global-record-address.py
          python3 tools/dev/patch-core-frontier-m75-pointer-compound-assignment.py
          files=(src/core/core_lower.c src/core/core_ir.c src/core/core_ir.h src/target/riscv64/core_codegen.c)
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'core: lower pointer compound assignments'
          git push origin HEAD:refactor/declaration-sema-v1

  full500-background:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-strict-full500-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply current Linux frontier patches
        run: |
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-m50-scalar-input-asm.py
          python3 tools/dev/patch-core-frontier-m50b-void-statement-expression.py
          python3 tools/dev/patch-core-frontier-m50c-output-input-asm.py
          python3 tools/dev/patch-core-frontier-m51-compound-shift.py
          python3 tools/dev/patch-core-frontier-m52-memory-rw-input-asm.py
          python3 tools/dev/patch-core-frontier-m53-void-conditional.py
          python3 tools/dev/patch-core-frontier-m54-void-conditional-statement.py
          python3 tools/dev/patch-core-frontier-m55-scalar-conditional-conversion.py
          python3 tools/dev/patch-core-frontier-m56-prefix-update.py
          python3 tools/dev/patch-core-frontier-m57-constant-conditional.py
          python3 tools/dev/patch-core-frontier-m58-logical-or.py
          python3 tools/dev/patch-core-frontier-m59-empty-scalar-input-barrier.py
          python3 tools/dev/patch-core-frontier-m60-pointer-conditional.py
          python3 tools/dev/patch-core-frontier-m61-immediate-only-asm.py
          python3 tools/dev/patch-core-frontier-m62-pointer-return-conversion.py
          python3 tools/dev/patch-core-frontier-m63-qualified-scalar-update.py
          python3 tools/dev/patch-core-frontier-m64-local-label-address.py
          python3 tools/dev/patch-core-frontier-m65-assignment-expression.py
          python3 tools/dev/patch-core-frontier-m66-subscript-index-value-type.py
          python3 tools/dev/patch-core-frontier-m67-structured-inline-asm.py
          python3 tools/dev/patch-core-frontier-m68-structured-inline-asm-optional-inputs.py
          python3 tools/dev/patch-core-frontier-m69-structured-asm-register-or-zero.py
          python3 tools/dev/patch-core-frontier-m70-array-lvalue-pointer-decay.py
          python3 tools/dev/patch-core-frontier-m71-legacy-array-object-subscript.py
          python3 tools/dev/patch-core-frontier-m72-nested-break-target.py
          python3 tools/dev/patch-core-frontier-m73-comma-expression.py
          python3 tools/dev/patch-core-frontier-m74-global-record-address.py
          python3 tools/dev/patch-core-frontier-m75-pointer-compound-assignment.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-strict500-compiler

      - name: Replay full frozen first500 with frontier statistics
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-strict500-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 5 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices ''
          replay_status=$?
          set -e
          printf 'CORE_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 8 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          frontier = json.loads(Path('build/core-strict500-frontier/frontier-summary.json').read_text())
          progress = json.loads(Path('build/core-strict500-frontier/progress-summary.json').read_text())
          if frontier['selected'] != 500:
              raise SystemExit(f"expected 500 frozen TUs, got {frontier['selected']}")
          print(
              'LINUX_FULL500_BACKGROUND_COMPLETE '
              f"pass={frontier['pass']} unsupported={frontier['unsupported']} "
              f"error={frontier['error']} "
              f"tu_mean={progress['tu_mean_progress'] * 100.0:.2f}% "
              f"tu_median={progress['tu_median_progress'] * 100.0:.2f}% "
              f"line_weighted={progress['line_weighted_progress'] * 100.0:.2f}%"
          )
          PY

      - name: Upload full500 frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-strict-full500-${{ github.run_id }}
          path: |
            build/core-strict500-frontier/batch-results.json
            build/core-strict500-frontier/batch-results.tsv
            build/core-strict500-frontier/batch-summary.txt
            build/core-strict500-frontier/failure-contexts.txt
            build/core-strict500-frontier/frontier-summary.json
            build/core-strict500-frontier/progress-summary.json
            build/core-strict500-frontier/progress-summary.txt
          if-no-files-found: warn
