name: Core Strict First500 Frontier

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: core-strict-first500-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontier:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M50 scalar-input inline asm
        run: |
          python3 tools/dev/patch-core-frontier-m50-scalar-input-asm.py
          python3 tools/dev/patch-core-frontier-m50b-void-statement-expression.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-strict500-compiler

      - name: Replay full frozen first500 and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-strict500-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 5 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices ''
          replay_status=$?
          set -e
          printf 'CORE_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/core-strict500-frontier/frontier-summary.json').read_text())
          if summary['selected'] != 500:
              raise SystemExit(f"expected 500 frozen TUs, got {summary['selected']}")
          if any(blocker['function'] == 'arch_local_irq_enable' for blocker in summary['blockers']):
              raise SystemExit('M50 failed: arch_local_irq_enable remains a Core strict blocker')
          PY

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-strict-first500-frontier
          path: |
            build/core-strict500-frontier/batch-results.json
            build/core-strict500-frontier/batch-results.tsv
            build/core-strict500-frontier/batch-summary.txt
            build/core-strict500-frontier/failure-contexts.txt
            build/core-strict500-frontier/frontier-summary.json
          if-no-files-found: warn

      - name: Persist M50 source changes
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            src/core/core_ir.h
            src/core/core_ir.c
            src/core/core_lower.c
            src/target/riscv64/core_codegen.c
          )
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'core: lower scalar-input inline asm'
          git push origin HEAD:refactor/declaration-sema-v1
