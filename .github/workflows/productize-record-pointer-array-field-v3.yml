name: Productize Record Pointer Array Field V3
on:
  push:
    branches: [product/record-pointer-array-field-v3]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/record-pointer-array-field-v3
          fetch-depth: 0
      - name: Apply validated declarator support on current main
        run: |
          set -Eeuo pipefail
          mat=tools/dev/.productize-record-pointer-array-field-v3.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-record-pointer-array-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat > tests/compiler/c0/record_pointer_array_field.c <<'EOF'
          struct holder {
              char (*zero)[0];
              char (*one)[1];
              const unsigned char (*two)[2];
          };
          int main(void) { return 0; }
          EOF
          cat > tests/compiler/c0/run-record-pointer-array-field.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/record-pointer-array-field
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/record_pointer_array_field.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-record-pointer-array-field.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-record-pointer-array-field.sh"
          EOF
          clang-format-18 -i src/frontend/parser_record.c tests/compiler/c0/record_pointer_array_field.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/record-pointer-array-field-v3
          MINIC="$GITHUB_WORKSPACE/build/record-pointer-array-field-v3/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/record-pointer-array-field-v3" \
            sh tests/compiler/c0/run-record-pointer-array-field.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/record-pointer-array-field-v3-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-record-pointer-array-field-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_record.c tests/compiler/c0/record_pointer_array_field.c tests/compiler/c0/run-record-pointer-array-field.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: parse pointer-to-array record fields'
          git push origin HEAD:product/record-pointer-array-field-v3
