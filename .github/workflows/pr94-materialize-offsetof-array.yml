name: PR94 Materialize Offsetof Array Designator

on:
  push:
    branches:
      - agent/offsetof-array-designator-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offsetof-array-designator-v0
          fetch-depth: 0
      - name: Materialize offsetof array designator semantics
        run: |
          set -Eeuo pipefail
          python tools/dev/pr94-materialize-offsetof-array.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-builtin-offsetof.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr94-materialize-offsetof-array.py
          rm -f .github/workflows/pr94-materialize-offsetof-array.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: support offsetof array designators'
          git push origin HEAD:agent/offsetof-array-designator-v0
