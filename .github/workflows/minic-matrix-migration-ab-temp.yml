name: MiniC C0 eight-case legacy/new parity (temporary)
on:
  push:
    branches:
      - cleanup/minic-native-matrix-batch-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production MiniC exact head
        run: make -j4 MODE=release CFLAGS=-Werror build/release/bin/minic-cc build/release/bin/minic
      - name: Verify old-vs-new 8 cases byte-for-byte including compiler/native runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,tempfile
          root=pathlib.Path.cwd()
          cc=str(root/'build/release/bin/minic-cc')
          legacy=str(root/'build/release/bin/minic')
          names=[
            'run-first500-pareto-v1',
            'run-first500-static-array-pointer-v1',
            'run-expression-statement-entry',
            'run-character-array-string-initializer',
            'run-packed-zero-width-bitfield-barrier',
            'probe-zero-record-five-targets',
            'probe-rv32-pointer-widening-source',
            'run-gnu-runtime-if-effect-facts',
          ]
          failures=[]
          for name in names:
              with tempfile.TemporaryDirectory(prefix='minic-ab-') as temp:
                  base=pathlib.Path(temp)
                  env=dict(os.environ,MINIC_CC=cc,MINIC=legacy,HOST_CC='cc',CC='cc')
                  old_cmd=(['bash'] if name in ('run-packed-zero-width-bitfield-barrier','probe-rv32-pointer-widening-source') else ['sh'])+['tests/compiler/c0/'+name+'.sh']
                  if name=='run-packed-zero-width-bitfield-barrier': old_cmd.append(cc)
                  new_cmd=['sh','tests/compiler/c0/run-native-matrix.sh',name]
                  if name=='run-packed-zero-width-bitfield-barrier': new_cmd.append(cc)
                  outputs=[]
                  for phase,cmd in [('old',old_cmd),('new',new_cmd)]:
                      env['BUILD_DIR']=str(base/phase)
                      p=subprocess.run(cmd,cwd=root,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=220)
                      outputs.append(p)
                  a,b=outputs
                  print('PARITY',name,'old_rc',a.returncode,'new_rc',b.returncode,
                        'stdout',a.stdout==b.stdout,'stderr',a.stderr==b.stderr,flush=True)
                  if a.returncode or b.returncode or a.stdout!=b.stdout or a.stderr!=b.stderr:
                      print('OLD_OUTPUT',repr(a.stdout[-4000:]),repr(a.stderr[-4000:]),flush=True)
                      print('NEW_OUTPUT',repr(b.stdout[-4000:]),repr(b.stderr[-4000:]),flush=True)
                      failures.append(name)
                      continue
          print('MINIC_NATIVE_OLD_NEW_SUMMARY',len(names)-len(failures),'passed',failures,flush=True)
          if failures: raise SystemExit(1)
          PY
