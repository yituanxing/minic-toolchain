name: Core Fast64 Batch

on:
  pull_request:

jobs:
  fast64:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/fast64-compiler

      - name: Replay deterministic fast64
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/fast64-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/fast64"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 64
          replay_status=$?
          set -e
          printf 'CORE_FAST64_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 8 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 64 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/fast64')
          frontier = json.loads((work / 'frontier-summary.json').read_text())
          headline = f"CORE_FAST64_EXACT selected={frontier['selected']} pass={frontier['pass']} unsupported={frontier['unsupported']} error={frontier['error']}"
          print(headline)
          (work / 'headline.txt').write_text(headline + '\n')
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Core Fast64\n\n')
              f.write(f'`{headline}`\n\n')
              f.write((work / 'progress-summary.txt').read_text())
          PY

      - name: Persist fast64 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-fast64-${{ github.sha }}
          path: |
            build/fast64/batch-results.json
            build/fast64/frontier-summary.json
            build/fast64/progress-summary.json
            build/fast64/progress-summary.txt
            build/fast64/headline.txt
          if-no-files-found: warn

  neigh-output-error-cohort:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/neigh-error-compiler

      - name: Replay all neigh_output ERROR TUs with Core detail
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/neigh-error-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/neigh-error-cohort"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '194,195,197,212,215,219,229,230,250,281,357,410'
          replay_status=$?
          set -e
          printf 'CORE_NEIGH_ERROR_COHORT_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 12 \
            --json-out "$work/frontier-summary.json"
          echo CORE_NEIGH_ERROR_DETAIL_BEGIN
          grep -R -h -E 'CORE_LOWER_DETAIL|CORE_FAST_TRACE|Core IR shadow' "$work/minic-stderr" | tail -800 || true
          echo CORE_NEIGH_ERROR_DETAIL_END

      - name: Persist neigh_output cohort
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-neigh-output-errors-${{ github.sha }}
          path: |
            build/neigh-error-cohort/batch-results.json
            build/neigh-error-cohort/frontier-summary.json
            build/neigh-error-cohort/minic-stderr/**
          if-no-files-found: warn
