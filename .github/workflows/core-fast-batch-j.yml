name: Core Y60 Comma Discard Full500 Productize

on:
  pull_request:

permissions:
  contents: write

jobs:
  y60-comma-discard-full500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a24b427d110c2354135622834bc1f06ee8270e4
          fetch-depth: 0
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply qualified comma-discard candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''static MinicCoreLowerStatus lower_expression(MinicCoreLowerContext *context,\n                                             MinicExpressionId expression_id,\n                                             MinicCoreValueId *value_id);\n'''
          new=old+'''static MinicCoreLowerStatus lower_expression_statement(\n    MinicCoreLowerContext *context, const MinicStatement *statement);\n'''
          if s.count(old)!=1:
              raise SystemExit(f'forward anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''    if (expression->kind == MINIC_EXPRESSION_BINARY &&\n        expression->value.binary.operator_kind == MINIC_BINARY_COMMA) {\n        MinicCoreValueId discarded_left;\n        MinicCoreLowerStatus status;\n\n        status = lower_expression(context, expression->value.binary.left, &discarded_left);\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n        return lower_expression(context, expression->value.binary.right, value_id);\n    }\n'''
          new='''    if (expression->kind == MINIC_EXPRESSION_BINARY &&\n        expression->value.binary.operator_kind == MINIC_BINARY_COMMA) {\n        const MinicExpression *discarded_expression;\n        MinicStatement discarded_statement;\n        MinicCoreLowerStatus status;\n\n        discarded_expression = minic_c0_program_expression(\n            context->body->program, expression->value.binary.left);\n        if (discarded_expression == NULL) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        (void)memset(&discarded_statement, 0, sizeof(discarded_statement));\n        discarded_statement.kind = MINIC_STATEMENT_EXPRESSION;\n        discarded_statement.span = discarded_expression->span;\n        discarded_statement.expression = expression->value.binary.left;\n        status = lower_expression_statement(context, &discarded_statement);\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n        return lower_expression(context, expression->value.binary.right, value_id);\n    }\n'''
          if s.count(old)!=1:
              raise SystemExit(f'comma branch anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/comma-discard-record-assignment.i" <<'EOF'\nstruct core_comma_pair { int a; int b; };\nint comma_discard_record_assignment(void) {\n    struct core_comma_pair value;\n    return ((value = (struct core_comma_pair){ .a = 1, .b = 2 }), 1);\n}\nEOF\ncheck_strict_case comma-discard-record-assignment\n\n'''
          if s.count(anchor)!=1:
              raise SystemExit(f'test anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          print('CORE_Y60_CANDIDATE_APPLIED')
          PY
      - name: Build and exact Core regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y60-compiler
          MINIC="$GITHUB_WORKSPACE/build/core-y60-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-y60-regression" \
            bash tests/core/run-core-ir-shadow.sh
      - name: Frozen strict500 qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y60-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y60-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_Y60_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          w=Path('build/core-y60-full500')
          f=json.loads((w/'frontier-summary.json').read_text())
          p=json.loads((w/'progress-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          c=Counter(); examples={}
          for r in rows:
              if r.get('status') == 'PASS': continue
              msg=r.get('message','')
              marker="Core IR shadow does not yet support function '"
              fn=msg.split(marker,1)[1].split("'",1)[0] if marker in msg else (msg or '<unknown>')
              c[fn]+=1
              examples.setdefault(fn,[]).append(int(r.get('index',-1)))
          print(f"CORE_Y60_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct={len(c)}")
          print(f"CORE_Y60_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          for rank,(fn,count) in enumerate(c.most_common(20),1):
              print(f"CORE_Y60_BLOCKER rank={rank} count={count} function={fn} examples={examples[fn][:6]}")
          for i in (0,3,7,42,58,95,301):
              r=next((x for x in rows if int(x.get('index',-1))==i),None)
              if r:
                  print(f"CORE_Y60_INDEX index={i} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% message={r.get('message','')}")
          if f['selected'] != 500 or f['error'] != 0:
              raise SystemExit(f'Y60 qualification failed: {f}')
          if any('bio_segments' in r.get('message','') for r in rows):
              raise SystemExit('bio_segments survived full500')
          PY
      - name: Productize qualified semantic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff -- src/core/core_lower.c tests/core/run-core-ir-shadow.sh > /tmp/y60-semantic.patch
          test -s /tmp/y60-semantic.patch
          git reset --hard 0a24b427d110c2354135622834bc1f06ee8270e4
          git fetch origin refactor/declaration-sema-v1
          git diff --quiet 0a24b427d110c2354135622834bc1f06ee8270e4..origin/refactor/declaration-sema-v1 -- \
            src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git checkout -B y60-productize origin/refactor/declaration-sema-v1
          git apply /tmp/y60-semantic.patch
          python3 - <<'PY'
          import subprocess
          allowed={'src/core/core_lower.c','tests/core/run-core-ir-shadow.sh'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected semantic diff: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git commit -m 'core: share discarded comma expression lowering'
          git push origin HEAD:refactor/declaration-sema-v1
          echo CORE_Y60_SEMANTIC_COMMIT=$(git rev-parse HEAD)
