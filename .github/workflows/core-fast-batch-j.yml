name: Core Fast Batch Y18 Stale Test Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  batch-y18-stale-test-census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-y18-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Build current baseline compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y18-compiler
      - name: Census historical unsupported expectations
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y18-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y18-census"
          mkdir -p "$work"
          cat >"$work/indirect-call.i" <<'EOF'
          int indirect_caller(int (*callee)(int), int value) {
              return callee(value);
          }
          EOF
          cat >"$work/variadic-call.i" <<'EOF'
          int variadic_external(int first, ...);
          int variadic_caller(int value) {
              return variadic_external(value, value);
          }
          EOF
          cat >"$work/volatile-parameter.i" <<'EOF'
          unsigned long volatile_parameter(volatile unsigned long value) {
              return value;
          }
          EOF
          for name in indirect-call variadic-call volatile-parameter; do
            "$compiler" -S "$work/$name.i" -o "$work/$name-normal.s"
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$work/$name.i" -o "$work/$name-strict.s" 2>"$work/$name.err"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              if cmp "$work/$name-normal.s" "$work/$name-strict.s"; then
                echo "CORE_BATCH_Y18_CASE name=$name strict=SUPPORTED exact=YES"
              else
                echo "CORE_BATCH_Y18_CASE name=$name strict=SUPPORTED exact=NO"
                diff -u "$work/$name-normal.s" "$work/$name-strict.s" | head -n 80 || true
              fi
            else
              echo "CORE_BATCH_Y18_CASE name=$name strict=UNSUPPORTED status=$status"
              tail -n 8 "$work/$name.err" || true
            fi
          done
