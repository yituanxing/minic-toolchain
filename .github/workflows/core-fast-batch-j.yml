name: Core Fast Batch Y17 Refined Full500

on:
  pull_request:

permissions:
  contents: read

jobs:
  batch-y17-refined-full500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-y17-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply Y plus refined loop continue ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-batch-y.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()

          old_continue='''    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          new_continue='''    /* The parser-owned synthetic continue label is part of the loop body.\n       Keep it so explicit continue edges and fallthrough converge before the\n       canonical backedge is emitted. */\n    *iteration_body = *body;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          if old_continue not in s: raise SystemExit('normalized_for_continue_tail anchor not found')
          s=s.replace(old_continue,new_continue,1)

          old_update='''    *iteration_body = *body;\n    iteration_body->statement_count -= 2U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          new_update='''    /* Strip only the normalized update.  The preceding synthetic continue\n       label remains in the body and becomes the convergence point before the\n       update is lowered. */\n    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          if old_update not in s: raise SystemExit('normalized_for_update_tail anchor not found')
          s=s.replace(old_update,new_update,1)

          old_sig='''static MinicCoreLowerStatus\nlower_while(MinicCoreLowerContext *context, const MinicStatement *statement, bool *terminated) {'''
          new_sig='''static MinicCoreLowerStatus\nlower_while(MinicCoreLowerContext *context,\n            const MinicStatement *statement,\n            MinicStatementId continue_label_statement,\n            bool *terminated) {'''
          if old_sig not in s: raise SystemExit('lower_while signature anchor not found')
          s=s.replace(old_sig,new_sig,1)

          old_blocks='''    if (!minic_core_function_add_block(context->function, &condition_block) ||\n        !minic_core_function_add_block(context->function, &body_block) ||\n        !minic_core_function_add_block(context->function, &exit_block)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    status = set_branch(context, preheader_block, statement->span, condition_block);\n'''
          new_blocks='''    if (!minic_core_function_add_block(context->function, &condition_block) ||\n        !minic_core_function_add_block(context->function, &body_block) ||\n        !minic_core_function_add_block(context->function, &exit_block)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    if (continue_label_statement != MINIC_STATEMENT_INVALID) {\n        if (context->statement_blocks == NULL ||\n            continue_label_statement >= context->statement_block_count ||\n            context->statement_blocks[continue_label_statement] != MINIC_CORE_BLOCK_INVALID) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        /* A parser-owned while continue label denotes condition re-evaluation.\n           Bind the source label directly to the real condition block before\n           lowering the body, so continue does not manufacture an orphan block. */\n        context->statement_blocks[continue_label_statement] = condition_block;\n    }\n    status = set_branch(context, preheader_block, statement->span, condition_block);\n'''
          if old_blocks not in s: raise SystemExit('lower_while block creation anchor not found')
          s=s.replace(old_blocks,new_blocks,1)

          old_internal='''            if (internal_loop_label) {\n                status = lower_while(context, loop, &statement_terminated);\n                if (status != MINIC_CORE_LOWER_OK) return status;\n                statement_index += 1U;\n            } else {\n'''
          new_internal='''            if (internal_loop_label) {\n                status = lower_while(context,\n                                     loop,\n                                     source_block->statements[statement_index],\n                                     &statement_terminated);\n                if (status != MINIC_CORE_LOWER_OK) return status;\n                statement_index += 1U;\n            } else {\n'''
          if old_internal not in s: raise SystemExit('internal loop call anchor not found')
          s=s.replace(old_internal,new_internal,1)

          old_direct='''            case MINIC_STATEMENT_WHILE:\n                status = lower_while(context, statement, &statement_terminated);\n                break;\n'''
          new_direct='''            case MINIC_STATEMENT_WHILE:\n                status = lower_while(\n                    context, statement, MINIC_STATEMENT_INVALID, &statement_terminated);\n                break;\n'''
          if old_direct not in s: raise SystemExit('direct while call anchor not found')
          p.write_text(s.replace(old_direct,new_direct,1))
          print('CORE_BATCH_Y17_PATCHED refined loop continue ownership')
          PY
      - name: Build exact candidate compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y17-compiler
      - name: Full frozen strict500 refined replay
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y17-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y17-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y17_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py "$work/batch-results.json" --expect-selected 500 --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/core-batch-y17-full500')
          f=json.loads((work/'frontier-summary.json').read_text())
          p=json.loads((work/'progress-summary.json').read_text())
          print(f"CORE_BATCH_Y17_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          print(f"CORE_BATCH_Y17_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          errors=f.get('errors') or []
          print(f"CORE_BATCH_Y17_ERRORS count={len(errors)}")
          for i,e in enumerate(errors[:20],1):
              print('CORE_BATCH_Y17_ERROR',i,json.dumps(e,sort_keys=True,separators=(',',':')))
          if f['selected'] != 500 or f['error'] != 0 or f['pass'] < 14:
              raise SystemExit(f'refined full500 gate failed: {f}')
          PY
