name: Core Batch Y49 Local Array Ownership Shape

on:
  pull_request:

permissions:
  contents: read

jobs:
  y49-local-array-shape:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c231a968e4bc2d4da4d80bc4aa737c6d56bcdc6f
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Show source shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          echo CORE_BATCH_Y49_SOURCE_BEGIN
          grep -n -A8 -B3 -m1 'device_add_group(struct device' build/linux-focus-corpus/kbuild/init/do_mounts.i || true
          grep -n -A20 -B4 -m1 'int do_one_initcall' build/linux-focus-corpus/kbuild/init/main.i || true
          echo CORE_BATCH_Y49_SOURCE_END
      - name: Instrument local-array ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          anchor='''    local = minic_c0_program_local(context->body->program, local_id);\n    if (local == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n'''
          extra=anchor+'''    if (local->is_array && context->source_function != NULL &&\n        (strcmp(context->source_function->name, "device_add_group") == 0 ||\n         strcmp(context->source_function->name, "do_one_initcall") == 0)) {\n        (void)fprintf(stderr,\n                      "CORE_Y49_LOCAL_ARRAY function=%s local=%zu is_array=%d count=%zu "\n                      "type_base=%d type_sign=%d type_rank=%d ptr_depth=%u fixed=%d\\n",\n                      context->source_function->name, (size_t)local_id,\n                      local->is_array ? 1 : 0, local->element_count,\n                      (int)local->type.base_kind, (int)local->type.integer_sign,\n                      (int)local->type.integer_rank, local->type.pointer_depth,\n                      minic_c0_program_local_fixed_register_binding(\n                          context->body->program, local_id) != NULL ? 1 : 0);\n    }\n'''
          marker='''static MinicCoreLowerStatus lower_local_object(MinicCoreLowerContext *context,'''
          pos=s.find(marker)
          if pos < 0: raise SystemExit('lower_local_object marker')
          before=s[:pos]
          sub=s[pos:]
          if sub.count(anchor)<1: raise SystemExit('lower_local_object local fetch anchor')
          sub=sub.replace(anchor,extra,1)
          s=before+sub

          begin=s.find('''    if (expression->kind == MINIC_EXPRESSION_SUBSCRIPT) {''')
          end=s.find('''    if (expression->kind == MINIC_EXPRESSION_MEMBER) {''', begin)
          if begin < 0 or end < 0: raise SystemExit('subscript scope')
          sub=s[begin:end]
          anchor='''        if (base == NULL || index == NULL ||\n            !minic_c0_expression_array_object_info(context->body->program, base, &array_info) ||\n'''
          extra='''        if (base != NULL && context->source_function != NULL &&\n            (strcmp(context->source_function->name, "device_add_group") == 0 ||\n             strcmp(context->source_function->name, "do_one_initcall") == 0)) {\n            MinicArrayObjectInfo trace_info;\n            const MinicLocal *trace_local = NULL;\n            bool trace_ok = minic_c0_expression_array_object_info(\n                context->body->program, base, &trace_info);\n            if (base->kind == MINIC_EXPRESSION_LOCAL) {\n                trace_local = minic_c0_program_local(\n                    context->body->program, base->value.local_id);\n            }\n            (void)fprintf(stderr,\n                "CORE_Y49_SUBSCRIPT function=%s expr=%zu base_kind=%d base_cat=%d "\n                "base_type=%d base_ptr=%u info=%d materialized=%d count=%zu incomplete=%d "\n                "elem_base=%d elem_ptr=%u local=%zu local_array=%d local_count=%zu span=%zu:%zu\\n",\n                context->source_function->name, (size_t)expression_id, (int)base->kind,\n                (int)base->value_category, (int)base->type.base_kind, base->type.pointer_depth,\n                trace_ok ? 1 : 0, trace_ok && trace_info.has_materialized_type ? 1 : 0,\n                trace_ok ? trace_info.element_count : 0U,\n                trace_ok && trace_info.is_incomplete ? 1 : 0,\n                trace_ok ? (int)trace_info.element_type.base_kind : -1,\n                trace_ok ? trace_info.element_type.pointer_depth : 0U,\n                trace_local != NULL ? (size_t)base->value.local_id : SIZE_MAX,\n                trace_local != NULL && trace_local->is_array ? 1 : 0,\n                trace_local != NULL ? trace_local->element_count : 0U,\n                expression->span.begin.line, expression->span.begin.column);\n        }\n\n'''+anchor
          if sub.count(anchor)!=1: raise SystemExit(f'subscript guard anchor count={sub.count(anchor)}')
          sub=sub.replace(anchor,extra,1)
          p.write_text(s[:begin]+sub+s[end:])
          print('CORE_BATCH_Y49_INSTRUMENTED')
          PY
      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y49-compiler
      - name: Replay main and sprint representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y49-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y49"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '0,2,3'
          status=$?
          set -e
          echo CORE_BATCH_Y49_REPLAY_STATUS=$status
          echo CORE_BATCH_Y49_DETAILS_BEGIN
          grep -R -E 'CORE_Y49_|CORE_ASSIGN_STAGE|CORE_FAST_TRACE|device_add_group|do_one_initcall' \
            "$work/minic-stderr" | head -n 240 || true
          echo CORE_BATCH_Y49_DETAILS_END
