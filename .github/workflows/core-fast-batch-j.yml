name: Core Y52 Exact Head Frontier

on:
  pull_request:

permissions:
  contents: read

jobs:
  y52-exact-head-frontier:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 996066104f58d75bcc547847449186bcbc76b0f9
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Add replay progress metrics
        run: python3 tools/dev/patch-linux-replay-live-progress.py
      - name: Build exact semantic head
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y52-compiler
      - name: Frozen strict500 compact snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y52-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y52-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_Y52_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 20 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          w=Path('build/core-y52-full500')
          f=json.loads((w/'frontier-summary.json').read_text())
          p=json.loads((w/'progress-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          counts=Counter()
          examples={}
          for r in rows:
              if r.get('status') == 'PASS':
                  continue
              msg=r.get('message','')
              marker="Core IR shadow does not yet support function '"
              if marker in msg:
                  fn=msg.split(marker,1)[1].split("'",1)[0]
              else:
                  fn=msg or '<unknown>'
              counts[fn]+=1
              examples.setdefault(fn,[]).append(int(r.get('index',-1)))
          print(f"CORE_Y52_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct={len(counts)}")
          print(f"CORE_Y52_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          for rank,(fn,count) in enumerate(counts.most_common(20),1):
              print(f"CORE_Y52_BLOCKER rank={rank} count={count} function={fn} examples={examples[fn][:6]}")
          for i in (0,7,42,95):
              r=next((x for x in rows if int(x.get('index',-1))==i),None)
              if r is not None:
                  print(f"CORE_Y52_SPRINT index={i} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% first={r.get('first_error_line')} message={r.get('message','')}")
          if f['selected'] != 500 or f['error'] != 0:
              raise SystemExit(f'Y52 exact-head regression: {f}')
          PY
