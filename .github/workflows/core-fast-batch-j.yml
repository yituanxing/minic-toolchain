name: Core Y62 Queue Zone Direct Trace

on:
  pull_request:

permissions:
  contents: read

jobs:
  y62-queue-zone-direct-trace:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 884de084fe81cfcfead1ff31232600bb8333fb4f
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Build exact semantic head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y62-compiler
      - name: Direct trace representative TU
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y62-compiler/bin/minic"
          input="$GITHUB_WORKSPACE/build/linux-focus-corpus/kbuild/init/do_mounts_initrd.i"
          mkdir -p build/core-y62-direct
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_LOWER_DETAIL=1 CORE_ASSIGN_STAGE=1 CORE_ASM_DETAIL=1 \
            "$compiler" -S "$input" -o build/core-y62-direct/out.s \
            >build/core-y62-direct/stdout.log 2>build/core-y62-direct/stderr.log
          rc=$?
          set -e
          echo CORE_Y62_RC=$rc
          echo '=== CORE_Y62 STDERR FILTERED ==='
          grep -E 'CORE_|queue_max_zone_append_sectors|unsupported|UNSUPPORTED|error:' build/core-y62-direct/stderr.log | tail -n 300 || true
          echo '=== CORE_Y62 STDERR TAIL ==='
          tail -n 200 build/core-y62-direct/stderr.log || true
          test "$rc" -ne 0
