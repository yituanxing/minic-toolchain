name: Core Batch Y Clean Production500

on:
  pull_request:

permissions:
  contents: read

jobs:
  clean-production500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-batch-y-clean-production500-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee86826c9106e30ffaf79cbace164372b3cb6a04
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Build exact production compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y-clean-compiler
      - name: Full Core regression suite from production source
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y-clean-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y-clean-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y_CLEAN_CORE_SUITE_PASS
      - name: Frozen strict500 from production source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          compiler="$GITHUB_WORKSPACE/build/core-batch-y-clean-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y-clean-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y_CLEAN_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/core-batch-y-clean-full500')
          f=json.loads((work/'frontier-summary.json').read_text())
          p=json.loads((work/'progress-summary.json').read_text())
          print(f"CORE_BATCH_Y_CLEAN_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          print(f"CORE_BATCH_Y_CLEAN_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          if f['selected'] != 500 or f['pass'] != 14 or f['unsupported'] != 486 or f['error'] != 0:
              raise SystemExit(f'clean production500 mismatch: {f}')
          PY
