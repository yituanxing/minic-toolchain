name: Core Batch Y24 Remaining Error Reasons

on:
  pull_request:

permissions:
  contents: read

jobs:
  y24-error-reasons:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y24-error-reasons-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee86826c9106e30ffaf79cbace164372b3cb6a04

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply cleanup-safe Y21 candidate and verifier reason probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''    /* The parser-owned synthetic continue label is part of the loop body.\n       Keep it so explicit continue edges and fallthrough converge before the\n       canonical backedge is emitted. */\n    *iteration_body = *body;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          new='''    /* CORE_FOR_CONTINUE_CLEANUP_V1 */\n    *iteration_body = *body;\n    if (!core_cleanup_edge_is_empty(continue_label)) {\n        iteration_body->statement_count -= 1U;\n    }\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          if old not in s: raise SystemExit('continue-tail anchor not found')
          s=s.replace(old,new,1)
          old='''    /* Strip only the normalized update.  The preceding synthetic continue\n       label remains in the body and becomes the convergence point before the\n       update is lowered. */\n    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          new='''    /* CORE_FOR_CONTINUE_CLEANUP_V1 */\n    *iteration_body = *body;\n    iteration_body->statement_count -= core_cleanup_edge_is_empty(continue_label) ? 1U : 2U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          if old not in s: raise SystemExit('update-tail anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/core/core_ir.c')
          s=p.read_text()
          old='''    block = &function->blocks[block_id];\n    if (!storage_shape_is_valid(\n            block->instructions, block->instruction_count, block->instruction_capacity) ||\n        !block->has_terminator) {\n        return false;\n    }'''
          new='''    block = &function->blocks[block_id];\n    if (!storage_shape_is_valid(\n            block->instructions, block->instruction_count, block->instruction_capacity) ||\n        !block->has_terminator) {\n        (void)fprintf(stderr,\n                      "CORE_Y24_VERIFY function=%s block=%u reason=block-shape has_term=%d instructions=%zu capacity=%zu\\n",\n                      function->name != NULL ? function->name : "?",\n                      (unsigned int)block_id,\n                      block->has_terminator ? 1 : 0,\n                      block->instruction_count,\n                      block->instruction_capacity);\n        return false;\n    }'''
          if old not in s: raise SystemExit('block-shape anchor not found')
          s=s.replace(old,new,1)
          old='''        instruction_id = block->instructions[index];\n        if (instruction_id >= function->instruction_count || instruction_seen[instruction_id]) {\n            return false;\n        }\n        instruction = &function->instructions[instruction_id];\n        if (!instruction_is_valid(function, instruction, available_values)) {\n            return false;\n        }'''
          new='''        instruction_id = block->instructions[index];\n        if (instruction_id >= function->instruction_count || instruction_seen[instruction_id]) {\n            (void)fprintf(stderr,\n                          "CORE_Y24_VERIFY function=%s block=%u reason=instruction-id index=%zu instruction=%u count=%zu duplicate=%d\\n",\n                          function->name != NULL ? function->name : "?",\n                          (unsigned int)block_id, index, (unsigned int)instruction_id,\n                          function->instruction_count,\n                          instruction_id < function->instruction_count && instruction_seen[instruction_id] ? 1 : 0);\n            return false;\n        }\n        instruction = &function->instructions[instruction_id];\n        if (!instruction_is_valid(function, instruction, available_values)) {\n            (void)fprintf(stderr,\n                          "CORE_Y24_VERIFY function=%s block=%u reason=instruction-valid index=%zu instruction=%u kind=%d result=%u\\n",\n                          function->name != NULL ? function->name : "?",\n                          (unsigned int)block_id, index, (unsigned int)instruction_id,\n                          (int)instruction->kind, (unsigned int)instruction->result);\n            return false;\n        }'''
          if old not in s: raise SystemExit('instruction anchor not found')
          s=s.replace(old,new,1)
          old='''            result = &function->values[instruction->result];\n            if (value_seen[instruction->result] || result->definition != instruction_id) {\n                return false;\n            }'''
          new='''            result = &function->values[instruction->result];\n            if (value_seen[instruction->result] || result->definition != instruction_id) {\n                (void)fprintf(stderr,\n                              "CORE_Y24_VERIFY function=%s block=%u reason=value-owner instruction=%u value=%u seen=%d definition=%u\\n",\n                              function->name != NULL ? function->name : "?",\n                              (unsigned int)block_id, (unsigned int)instruction_id,\n                              (unsigned int)instruction->result,\n                              value_seen[instruction->result] ? 1 : 0,\n                              (unsigned int)result->definition);\n                return false;\n            }'''
          if old not in s: raise SystemExit('value anchor not found')
          s=s.replace(old,new,1)
          old='''    return terminator_is_valid(function, &block->terminator, available_values);\n}'''
          new='''    if (!terminator_is_valid(function, &block->terminator, available_values)) {\n        (void)fprintf(stderr,\n                      "CORE_Y24_VERIFY function=%s block=%u reason=terminator-valid kind=%d\\n",\n                      function->name != NULL ? function->name : "?",\n                      (unsigned int)block_id, (int)block->terminator.kind);\n        return false;\n    }\n    return true;\n}'''
          if old not in s: raise SystemExit('terminator anchor not found')
          p.write_text(s.replace(old,new,1))
          print('CORE_BATCH_Y24_PATCHED')
          PY

      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y24-compiler

      - name: Replay three Y21 Core errors
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y24-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y24-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '39,152,265'
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y24_REPLAY_STATUS=%d\n' "$replay_status"
          echo CORE_BATCH_Y24_REASONS_BEGIN
          grep -R 'CORE_Y24_VERIFY' "$work/minic-stderr" || true
          echo CORE_BATCH_Y24_REASONS_END
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 6 --json-out "$work/frontier-summary.json"
