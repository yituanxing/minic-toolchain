name: Core Batch Y21 Cleanup-Safe Full500

on:
  pull_request:

permissions:
  contents: read

jobs:
  y21-cleanup-safe-full500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-batch-y21-cleanup-safe-full500-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee86826c9106e30ffaf79cbace164372b3cb6a04
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply cleanup-safe normalized-for tail refinement
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''    /* The parser-owned synthetic continue label is part of the loop body.\n       Keep it so explicit continue edges and fallthrough converge before the\n       canonical backedge is emitted. */\n    *iteration_body = *body;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          new='''    /* CORE_FOR_CONTINUE_CLEANUP_V1: preserve the parser-owned continue\n       label only when reaching it crosses no cleanup lifetime. Cleanup-bearing\n       for scopes retain the pre-Y tail shape; Core does not claim ownership of\n       those cleanup transitions merely to repair ordinary continue CFG. */\n    *iteration_body = *body;\n    if (!core_cleanup_edge_is_empty(continue_label)) {\n        iteration_body->statement_count -= 1U;\n    }\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          if old not in s: raise SystemExit('continue-tail production anchor not found')
          s=s.replace(old,new,1)
          old='''    /* Strip only the normalized update.  The preceding synthetic continue\n       label remains in the body and becomes the convergence point before the\n       update is lowered. */\n    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          new='''    /* Strip the update in all normalized-for shapes. Preserve the synthetic\n       continue label only for a zero-distance cleanup edge; cleanup-bearing\n       scopes keep the historical two-statement tail removal. */\n    *iteration_body = *body;\n    iteration_body->statement_count -= core_cleanup_edge_is_empty(continue_label) ? 1U : 2U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          if old not in s: raise SystemExit('update-tail production anchor not found')
          p.write_text(s.replace(old,new,1))
          print('CORE_BATCH_Y21_PATCHED cleanup-safe normalized-for tail')
          PY
      - name: Build exact candidate compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y21-compiler
      - name: Full frozen strict500 cleanup-safe replay
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y21-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y21-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y21_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 20 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/core-batch-y21-full500')
          f=json.loads((work/'frontier-summary.json').read_text())
          p=json.loads((work/'progress-summary.json').read_text())
          print(f"CORE_BATCH_Y21_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct_blockers={f.get('distinct_blockers')}")
          print(f"CORE_BATCH_Y21_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          errors=f.get('errors') or []
          print(f"CORE_BATCH_Y21_ERRORS count={len(errors)}")
          for i,e in enumerate(errors[:20],1):
              print('CORE_BATCH_Y21_ERROR',i,json.dumps(e,sort_keys=True,separators=(',',':')))
          if f['selected'] != 500 or f['error'] != 0 or f['pass'] < 15:
              raise SystemExit(f'cleanup-safe full500 gate failed: {f}')
          PY
          echo CORE_BATCH_Y21_FAILURE_LINES_BEGIN
          grep -E 'Core IR shadow lowering failed|CORE_STRICT500_ERROR' "$work/replay.log" | tail -n 80 || true
          echo CORE_BATCH_Y21_FAILURE_LINES_END
