name: Core Y88 Csum Fixed Argument Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  y88-csum-fixed-argument:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c26979e02d06873a401475f8d63a02406c862226
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Audit direct-call code and source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/core/core_lower.c').read_text()
          marker='BATCH_D_VARIADIC_DIRECT_CALL'
          pos=s.index(marker)
          lo=max(0,pos-5500); hi=min(len(s),pos+8500)
          first=s.count('\n',0,lo)+1
          print(f'CORE_Y88_CALL_SOURCE_BEGIN line={first}')
          for n,line in enumerate(s[lo:hi].splitlines(),first): print(f'{n}: {line}')
          print('CORE_Y88_CALL_SOURCE_END')
          corpus=Path('build/linux-focus-corpus/kbuild/init/do_mounts.i')
          lines=corpus.read_text(errors='replace').splitlines()
          hits=[i for i,x in enumerate(lines) if 'csum16_sub' in x]
          print(f'CORE_Y88_CSUM_HITS={[i+1 for i in hits[:10]]}')
          for i in hits[:2]:
              lo2=max(0,i-20); hi2=min(len(lines),i+45)
              print(f'CORE_Y88_CSUM_SOURCE_BEGIN line={lo2+1}')
              for j in range(lo2,hi2): print(f'{j+1}: {lines[j]}')
              print('CORE_Y88_CSUM_SOURCE_END')
          PY
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y88-compiler
      - name: Replay csum representative
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y88-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y88-linux"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_LOWER_DETAIL=1 CORE_ASSIGN_STAGE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 1 --offset 0 --limit 500 --sample-count 0 --indices '2'
          status=$?
          set -e
          echo CORE_Y88_REPLAY_STATUS=$status
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y88-linux'); rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in rows:
              rel=r['input']; print(f"CORE_Y88_INDEX index={r.get('index')} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% message={r.get('message','')}")
              err=w/'minic-stderr'/f'{rel}.stderr'
              if err.is_file():
                  for x in err.read_text(errors='replace').splitlines():
                      if 'csum16_sub' in x or 'csum16_add' in x or 'CORE_LOWER_DETAIL' in x or 'CORE_ASSIGN_STAGE' in x: print(x)
          PY
