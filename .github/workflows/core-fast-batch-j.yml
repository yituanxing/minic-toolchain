name: Core Y87 Terminating Switch Fallthrough

on:
  pull_request:

permissions:
  contents: write

jobs:
  y87-terminating-switch-fallthrough:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c26979e02d06873a401475f8d63a02406c862226
          fetch-depth: 0
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply switch fallthrough termination candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c'); s=p.read_text()
          old='''    size_t source_index;\n    bool all_segments_terminate;\n'''
          new='''    size_t source_index;\n    bool all_segments_terminate;\n    bool segment_breaks[MINIC_CORE_SWITCH_LABEL_LIMIT];\n    bool segment_terminates[MINIC_CORE_SWITCH_LABEL_LIMIT];\n'''
          if s.count(old)!=1: raise SystemExit(f'decl anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''    /* M98_TERMINATING_SWITCH: a switch with a default and no path to its\n       synthetic exit is a terminating statement. Track the narrow proven\n       shape first: every label segment itself terminates. Fallthrough/break\n       segments stay conservatively non-terminating. */\n    all_segments_terminate = default_label != SIZE_MAX && label_count != 0U;\n    for (source_index = 0U; source_index < label_count; ++source_index) {\n'''
          new='''    /* M101_TERMINATING_SWITCH_FALLTHROUGH: termination is a property of the\n       path starting at a label, not only of that label's immediate segment.\n       Record each segment first, then prove fallthrough chains backwards. A\n       break still reaches the synthetic exit and is therefore non-terminating. */\n    (void)memset(segment_breaks, 0, sizeof(segment_breaks));\n    (void)memset(segment_terminates, 0, sizeof(segment_terminates));\n    for (source_index = 0U; source_index < label_count; ++source_index) {\n'''
          if s.count(old)!=1: raise SystemExit(f'loop anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''        if (segment_terminated) {\n            continue;\n        }\n        all_segments_terminate = false;\n        if (break_index != SIZE_MAX) {\n'''
          new='''        segment_terminates[source_index] = segment_terminated;\n        segment_breaks[source_index] = break_index != SIZE_MAX;\n        if (segment_terminated) {\n            continue;\n        }\n        if (break_index != SIZE_MAX) {\n'''
          if s.count(old)!=1: raise SystemExit(f'segment anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''    }\n\n    context->block_id = exit_block;\n    if (all_segments_terminate) {\n'''
          new='''    }\n\n    all_segments_terminate = default_label != SIZE_MAX && label_count != 0U;\n    if (all_segments_terminate) {\n        bool next_path_terminates = false;\n\n        for (source_index = label_count; source_index-- > 0U;) {\n            bool path_terminates;\n\n            path_terminates =\n                segment_terminates[source_index] ||\n                (!segment_breaks[source_index] && source_index + 1U < label_count &&\n                 next_path_terminates);\n            if (!path_terminates) {\n                all_segments_terminate = false;\n            }\n            next_path_terminates = path_terminates;\n        }\n    }\n\n    context->block_id = exit_block;\n    if (all_segments_terminate) {\n'''
          # This suffix can occur elsewhere; restrict to lower_switch region.
          start=s.index('static MinicCoreLowerStatus\nlower_switch(')
          end=s.index('static MinicCoreLowerStatus\nlower_block(',start)
          region=s[start:end]
          if region.count(old)!=1: raise SystemExit(f'post-loop anchor {region.count(old)}')
          region=region.replace(old,new,1)
          s=s[:start]+region+s[end:]
          p.write_text(s)

          p=Path('tests/core/run-core-ir-shadow.sh'); s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/terminating-switch-fallthrough.i" <<'EOF'\nint terminating_switch_fallthrough(int value) {\n    switch (value) {\n    case 0:\n    case 1:\n        return 11;\n    case 2:\n        return 22;\n    default:\n        return 33;\n    }\n}\nEOF\ncheck_strict_case terminating-switch-fallthrough\n\n'''
          if s.count(anchor)!=1: raise SystemExit(f'test anchor {s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          print('CORE_Y87_CANDIDATE_APPLIED')
          PY
      - name: Build and exact Core regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y87-compiler
          MINIC="$GITHUB_WORKSPACE/build/core-y87-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/core-y87-regression" bash tests/core/run-core-ir-shadow.sh
      - name: Focused BTF qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y87-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y87-focus"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_LOWER_DETAIL=1 CORE_ASM_DETAIL=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '186,193'
          status=$?
          set -e
          echo CORE_Y87_FOCUS_STATUS=$status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 8 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y87-focus'); f=json.loads((w/'frontier-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          print(f"CORE_Y87_FOCUS selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          for r in rows: print(f"CORE_Y87_INDEX index={r.get('index')} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% message={r.get('message','')}")
          if f['error'] != 0: raise SystemExit(f'Core ERROR: {f}')
          if any('btf_field_type_name' in r.get('message','') for r in rows): raise SystemExit('btf_field_type_name survived Y87')
          PY
      - name: Frozen strict500 qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          compiler="$GITHUB_WORKSPACE/build/core-y87-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y87-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_Y87_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py "$work/batch-results.json" --expect-selected 500 --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          w=Path('build/core-y87-full500'); f=json.loads((w/'frontier-summary.json').read_text()); p=json.loads((w/'progress-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          c=Counter(); examples={}; marker="Core IR shadow does not yet support function '"
          for r in rows:
              if r.get('status')=='PASS': continue
              msg=r.get('message',''); fn=msg.split(marker,1)[1].split("'",1)[0] if marker in msg else (msg or '<unknown>')
              c[fn]+=1; examples.setdefault(fn,[]).append(int(r.get('index',-1)))
          print(f"CORE_Y87_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct={len(c)}")
          print(f"CORE_Y87_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          for rank,(fn,count) in enumerate(c.most_common(15),1): print(f"CORE_Y87_BLOCKER rank={rank} count={count} function={fn} examples={examples[fn][:6]}")
          if f['selected'] != 500 or f['error'] != 0: raise SystemExit(f'Y87 qualification failed: {f}')
          if any('btf_field_type_name' in r.get('message','') for r in rows): raise SystemExit('btf_field_type_name survived full500')
          PY
      - name: Productize switch fallthrough termination
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff -- src/core/core_lower.c tests/core/run-core-ir-shadow.sh > /tmp/y87-semantic.patch
          test -s /tmp/y87-semantic.patch
          git reset --hard c26979e02d06873a401475f8d63a02406c862226
          git fetch origin refactor/declaration-sema-v1
          git diff --quiet c26979e02d06873a401475f8d63a02406c862226..origin/refactor/declaration-sema-v1 -- src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git checkout -B y87-productize origin/refactor/declaration-sema-v1
          git apply /tmp/y87-semantic.patch
          python3 - <<'PY'
          import subprocess
          allowed={'src/core/core_lower.c','tests/core/run-core-ir-shadow.sh'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed: raise SystemExit(f'unexpected semantic diff: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git commit -m 'core: recognize terminating switch fallthrough chains'
          git push origin HEAD:refactor/declaration-sema-v1
          echo CORE_Y87_SEMANTIC_COMMIT=$(git rev-parse HEAD)
