name: Core Batch Y33 Cleanup Return Candidate

on:
  pull_request:

permissions:
  contents: read

jobs:
  y33-candidate:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y33-candidate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eda1ef08377ef7d7ec06ac0151599e82d8317f4
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply cleanup-return candidate and pointer trace
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()

          anchor='''static MinicCoreLowerStatus lower_return(MinicCoreLowerContext *context,\n                                         const MinicStatement *statement) {'''
          helper='''static MinicCoreLowerStatus lower_cleanup_contexts(\n    MinicCoreLowerContext *context, MinicCleanupContextId current, MinicCleanupContextId stop) {\n    if (context == NULL || context->body == NULL || context->body->program == NULL ||\n        !minic_c0_cleanup_context_reaches(context->body->program, current, stop)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    while (current != stop) {\n        const MinicCleanupContext *cleanup;\n        MinicCoreValueId discarded_value;\n        MinicCoreLowerStatus status;\n\n        cleanup = minic_c0_program_cleanup_context(context->body->program, current);\n        if (cleanup == NULL || cleanup->parent == current ||\n            cleanup->cleanup_expression == MINIC_EXPRESSION_INVALID) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        status = lower_expression(context, cleanup->cleanup_expression, &discarded_value);\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n        current = cleanup->parent;\n    }\n    return MINIC_CORE_LOWER_OK;\n}\n\n'''+anchor
          if s.count(anchor)!=1: raise SystemExit(f'return anchor count={s.count(anchor)}')
          s=s.replace(anchor,helper,1)

          old='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          new='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n    MinicCoreObjectId cleanup_return_object;\n    bool has_cleanup;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          if s.count(old)<1: raise SystemExit('return declarations anchor')
          # replace occurrence following lower_return only
          pos=s.find(anchor)
          sub=s[pos:]
          if old not in sub: raise SystemExit('return declarations not after function')
          sub=sub.replace(old,new,1)
          s=s[:pos]+sub

          old='''    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          new='''    has_cleanup = statement->cleanup_context != statement->cleanup_stop_context;\n    cleanup_return_object = MINIC_CORE_OBJECT_INVALID;\n    if (has_cleanup &&\n        !minic_c0_cleanup_context_reaches(context->body->program,\n                                          statement->cleanup_context,\n                                          statement->cleanup_stop_context)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          pos=s.find(anchor)
          sub=s[pos:]
          if old not in sub: raise SystemExit('return init anchor')
          sub=sub.replace(old,new,1)
          s=s[:pos]+sub

          old='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;'''
          new='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;\n\n            if (has_cleanup) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }'''
          pos=s.find(anchor)
          sub=s[pos:]
          if old not in sub: raise SystemExit('record return anchor')
          sub=sub.replace(old,new,1)
          s=s[:pos]+sub

          old='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    return minic_core_function_set_terminator(context->function, context->block_id, &terminator)'''
          new='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    if (has_cleanup) {\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = spill_scalar_value(context,\n                                        statement->span,\n                                        context->source_function->return_type,\n                                        terminator.return_value,\n                                        &cleanup_return_object);\n            if (status != MINIC_CORE_LOWER_OK) {\n                return status;\n            }\n        }\n        status = lower_cleanup_contexts(context,\n                                        statement->cleanup_context,\n                                        statement->cleanup_stop_context);\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = reload_scalar_value(context,\n                                         statement->span,\n                                         context->source_function->return_type,\n                                         cleanup_return_object,\n                                         &terminator.return_value);\n            if (status != MINIC_CORE_LOWER_OK) {\n                return status;\n            }\n        }\n    }\n    return minic_core_function_set_terminator(context->function, context->block_id, &terminator)'''
          pos=s.find(anchor)
          sub=s[pos:]
          if old not in sub: raise SystemExit('return completion anchor')
          sub=sub.replace(old,new,1)
          s=s[:pos]+sub

          old='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            (void)fprintf(stderr,'''
          new='''        if (statement->cleanup_context != statement->cleanup_stop_context &&\n            statement->kind != MINIC_STATEMENT_RETURN) {\n            (void)fprintf(stderr,'''
          if s.count(old)!=1: raise SystemExit(f'cleanup guard anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          # Add stage tracing to the existing pointer +/- integer path.
          marker='''        /* BATCH_U_POINTER_ARITH_VALUE_TYPES: Core consumes scalar values, not\n           lvalue storage qualifiers.'''
          trace='''        if (context->source_function != NULL &&\n            strcmp(context->source_function->name, "bvec_advance") == 0) {\n            MinicType trace_pointer_type;\n            MinicType trace_index_type;\n            size_t trace_element_size = 0U;\n            bool trace_pointer_ok = core_scalar_expression_value_type(\n                context->body, pointer_expression, &trace_pointer_type);\n            bool trace_index_ok = core_scalar_expression_value_type(\n                context->body, index_expression, &trace_index_type);\n            bool trace_element_ok = minic_c0_pointer_arithmetic_element_size(\n                context->body->program, minic_default_data_layout(), expression->type,\n                &trace_element_size);\n            (void)fprintf(stderr,\n                          "CORE_POINTER_OFFSET_DETAIL function=bvec_advance pointer_ok=%d index_ok=%d "\n                          "pointer_equal_result=%d pointer_base=%d pointer_depth=%u pointer_bq=%u "\n                          "pointer_pq=%u result_base=%d result_depth=%u result_bq=%u result_pq=%u "\n                          "index_base=%d index_depth=%u element_ok=%d element_size=%zu\\n",\n                          trace_pointer_ok ? 1 : 0, trace_index_ok ? 1 : 0,\n                          trace_pointer_ok && minic_type_equal(trace_pointer_type, expression->type) ? 1 : 0,\n                          trace_pointer_ok ? (int)trace_pointer_type.base_kind : -1,\n                          trace_pointer_ok ? trace_pointer_type.pointer_depth : 0U,\n                          trace_pointer_ok ? trace_pointer_type.base_qualifiers : 0U,\n                          trace_pointer_ok ? trace_pointer_type.pointer_qualifiers : 0U,\n                          (int)expression->type.base_kind, expression->type.pointer_depth,\n                          expression->type.base_qualifiers, expression->type.pointer_qualifiers,\n                          trace_index_ok ? (int)trace_index_type.base_kind : -1,\n                          trace_index_ok ? trace_index_type.pointer_depth : 0U,\n                          trace_element_ok ? 1 : 0, trace_element_size);\n        }\n'''+marker
          if s.count(marker)!=1: raise SystemExit(f'pointer marker count={s.count(marker)}')
          s=s.replace(marker,trace,1)
          p.write_text(s)
          print('CORE_BATCH_Y33_PATCHED')
          PY
      - name: Build exact candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y33-compiler
      - name: Full Core regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y33-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y33-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y33_CORE_SUITE_PASS
      - name: Replay focused blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y33-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y33"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '2,3,7'
          replay_status=$?
          set -e
          echo CORE_BATCH_Y33_REPLAY_STATUS=$replay_status
          echo CORE_BATCH_Y33_DETAILS_BEGIN
          grep -R -E 'CORE_POINTER_OFFSET_DETAIL|CORE_FAST_TRACE|CORE_ASSIGN_STAGE' "$work/minic-stderr" | grep -E 'bvec_advance|device_has_driver_override|device_match_driver_override|CORE_POINTER_OFFSET_DETAIL' || true
          echo CORE_BATCH_Y33_DETAILS_END
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 8 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 3 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-batch-y33')
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in sorted(rows,key=lambda x:x.get('index',-1)):
              print(f"CORE_BATCH_Y33_ROW index={r.get('index')} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.2f}% first={r.get('first_error_line')} message={r.get('message','')}")
          f=json.loads((w/'frontier-summary.json').read_text())
          print(f"CORE_BATCH_Y33_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['error'] != 0 or next(r for r in rows if int(r['index'])==7)['status'] != 'PASS':
              raise SystemExit(f'Y33 regression/error: {f}')
          PY
