name: Core Batch Y36 Productize Pointer Offset

on:
  pull_request:

permissions:
  contents: write

jobs:
  y36-productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y36-productize-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply semantic source and focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''        MinicCoreValueId pointer_value;\n        MinicCoreValueId index_value;\n        MinicCoreLowerStatus status;\n        MinicType pointer_value_type;\n        MinicType index_value_type;\n        size_t element_size;'''
          new='''        MinicCoreValueId pointer_value;\n        MinicCoreValueId index_value;\n        MinicCoreValueId offset_value;\n        MinicCoreLowerStatus status;\n        MinicType expression_value_type;\n        MinicType pointer_value_type;\n        MinicType index_value_type;\n        size_t element_size;'''
          if s.count(old)!=1: raise SystemExit(f'decl anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''            !minic_type_is_pointer(pointer_value_type) ||\n            !minic_type_is_integer(index_value_type) ||\n            !minic_type_equal(pointer_value_type, expression->type) ||\n            !minic_c0_pointer_arithmetic_element_size(context->body->program,\n                                                      minic_default_data_layout(),\n                                                      expression->type,\n                                                      &element_size)) {'''
          new='''            !minic_type_is_pointer(pointer_value_type) ||\n            !minic_type_is_integer(index_value_type) ||\n            !minic_type_unqualified(expression->type, &expression_value_type) ||\n            !minic_type_equal(pointer_value_type, expression_value_type) ||\n            !minic_c0_pointer_arithmetic_element_size(context->body->program,\n                                                      minic_default_data_layout(),\n                                                      pointer_value_type,\n                                                      &element_size)) {'''
          if s.count(old)!=1: raise SystemExit(f'validation anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''        instruction.kind = MINIC_CORE_INSTRUCTION_POINTER_OFFSET;\n        instruction.value.pointer_offset.base = pointer_value;\n        instruction.value.pointer_offset.index = index_value;\n        instruction.value.pointer_offset.element_size = element_size;\n        /* M75 introduced this flag for compound subtraction. Always initialize\n           it on ordinary pointer arithmetic as well; leaving pointer + integer\n           indeterminate would make the Core program nondeterministic. */\n        instruction.value.pointer_offset.subtract =\n            expression->value.binary.operator_kind == MINIC_BINARY_SUBTRACT;\n        return minic_core_function_append_value_instruction(\n                   context->function, context->block_id, &instruction, value_id)\n                   ? MINIC_CORE_LOWER_OK\n                   : MINIC_CORE_LOWER_ERROR;'''
          new='''        instruction.kind = MINIC_CORE_INSTRUCTION_POINTER_OFFSET;\n        instruction.type = pointer_value_type;\n        instruction.value.pointer_offset.base = pointer_value;\n        instruction.value.pointer_offset.index = index_value;\n        instruction.value.pointer_offset.element_size = element_size;\n        /* Pointer arithmetic computes in the lvalue-to-rvalue pointer type.\n           If the semantic expression retains a top-level pointer qualifier,\n           represent that result spelling with Core's pointer bitcast rather\n           than making POINTER_OFFSET violate its base/result type invariant. */\n        instruction.value.pointer_offset.subtract =\n            expression->value.binary.operator_kind == MINIC_BINARY_SUBTRACT;\n        if (!minic_core_function_append_value_instruction(\n                context->function, context->block_id, &instruction, &offset_value)) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        if (minic_type_equal(pointer_value_type, expression->type)) {\n            *value_id = offset_value;\n            return MINIC_CORE_LOWER_OK;\n        }\n        return append_scalar_bitcast(\n            context, expression->span, expression->type, offset_value, value_id);'''
          if s.count(old)!=1: raise SystemExit(f'emit anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''cat >"$work_dir/const-record-member-subscript.i" <<'EOF'\nstruct pointer_view {\n    int *items;\n};\n\nint *const_record_member_subscript(const struct pointer_view *view,\n                                   unsigned long index) {\n    return &view->items[index];\n}\nEOF\ncheck_strict_case const-record-member-subscript\n'''
          extra='''\ncat >"$work_dir/const-record-member-pointer-offset.i" <<'EOF'\nstruct offset_item {\n    long value;\n};\n\nstruct offset_view {\n    struct offset_item *items;\n};\n\nstruct offset_item *const_record_member_pointer_offset(const struct offset_view *view,\n                                                       unsigned long index) {\n    return view->items + index;\n}\nEOF\ncheck_strict_case const-record-member-pointer-offset\n'''
          if s.count(anchor)!=1: raise SystemExit(f'test anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,anchor+extra,1))
          print('CORE_BATCH_Y36_PATCHED')
          PY
      - name: Build exact production candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y36-compiler
      - name: Full Core exact regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y36-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y36-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y36_CORE_SUITE_PASS
      - name: Focused Linux gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          compiler="$GITHUB_WORKSPACE/build/core-batch-y36-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y36-linux"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '3,7'
          replay_status=$?
          set -e
          echo CORE_BATCH_Y36_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 4 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-batch-y36-linux')
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          by={int(r['index']):r for r in rows}
          f=json.loads((w/'frontier-summary.json').read_text())
          for i in sorted(by):
              r=by[i]
              print(f"CORE_BATCH_Y36_ROW index={i} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.2f}% message={r.get('message','')}")
          print(f"CORE_BATCH_Y36_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['error'] != 0 or by[7]['status'] != 'PASS' or by[3].get('message','').endswith("'bvec_advance'"):
              raise SystemExit(f'Y36 focused gate failed: {f}')
          PY
      - name: Commit semantic production change
        shell: bash
        run: |
          set -Eeuo pipefail
          git restore tests/external/linux/corpus_replay.py
          python3 - <<'PY'
          import subprocess
          allowed={'src/core/core_lower.c','tests/core/run-core-ir-shadow.sh'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          print('CORE_BATCH_Y36_CHANGED',sorted(changed))
          if changed != allowed:
              raise SystemExit(f'unexpected production diff: {changed}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git commit -m 'core: normalize qualified pointer offsets'
          git push origin HEAD:refactor/declaration-sema-v1
          echo "CORE_BATCH_Y36_PRODUCTION_COMMIT=$(git rev-parse HEAD)"
