name: Core Y105b Function Address Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  y105b-productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply production semantic patch
        id: patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M104_FUNCTION_DESIGNATOR_ADDRESS' src/core/core_lower.c; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c'); s=p.read_text()
          old='''    if (expression == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    /* M103_INTEGER_BIT_FIELD_READ: a bit-field is not C-addressable, but\n'''
          new='''    if (expression == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    /* M104_FUNCTION_DESIGNATOR_ADDRESS: the normalized frontend represents a\n       function designator as its function-pointer semantic value already. C's\n       `&function` therefore has the same pointer type and symbol identity; do\n       not route it through the object-lvalue address seam. */\n    if (expression->kind == MINIC_EXPRESSION_ADDRESS_OF) {\n        const MinicExpression *operand = minic_c0_program_expression(\n            context->body->program, expression->value.unary.operand);\n        MinicType function_type;\n\n        if (operand != NULL && operand->kind == MINIC_EXPRESSION_FUNCTION) {\n            if (!minic_type_equal(expression->type, operand->type) ||\n                !minic_type_pointee(operand->type, &function_type) ||\n                !minic_type_is_function(function_type)) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }\n            return lower_expression(context, expression->value.unary.operand, value_id);\n        }\n    }\n    /* M103_INTEGER_BIT_FIELD_READ: a bit-field is not C-addressable, but\n'''
          if s.count(old)!=1: raise SystemExit(f'core anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          t=Path('tests/core/run-core-ir-shadow.sh'); ts=t.read_text()
          anchor='''cat >"$work_dir/function-pointer-parameter-ingress.i" <<'EOF'\n'''
          case='''cat >"$work_dir/function-designator-address.i" <<'EOF'\nint function_address_target(int value);\nint function_address_consume(int (*callback)(int));\n\nint function_designator_address(void) {\n    return function_address_consume(&function_address_target);\n}\nEOF\ncheck_strict_case function-designator-address\n\n'''
          if ts.count(anchor)!=1: raise SystemExit(f'test anchor count={ts.count(anchor)}')
          t.write_text(ts.replace(anchor,case+anchor,1))
          PY
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Build production candidate
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y105b-compiler
      - name: Run permanent Core shadow regression
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-y105b-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-y105b-shadow" \
            bash tests/core/run-core-ir-shadow.sh
      - name: Require init main strict PASS
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y105b-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y105b-linux"; mkdir -p "$work"
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 1 --offset 0 --limit 500 --sample-count 0 --indices '0'
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('build/core-y105b-linux/batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          if len(rows)!=1 or rows[0].get('status')!='PASS':
              raise SystemExit(f'init/main not PASS: {rows}')
          print(f"CORE_Y105B_PASS input={rows[0].get('input')} total={rows[0].get('total_lines')}")
          PY
      - name: Commit production semantic change
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git diff --cached --check
          git commit -m 'core: lower function designator addresses'
          git push origin HEAD:refactor/declaration-sema-v1
