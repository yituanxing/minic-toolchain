name: Core Y70 Conditional Scalar Full500 Productize

on:
  pull_request:

permissions:
  contents: write

jobs:
  y70-conditional-scalar-full500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 884de084fe81cfcfead1ff31232600bb8333fb4f
          fetch-depth: 0
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply qualified conditional scalar candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''    if (expression->kind == MINIC_EXPRESSION_STATEMENT) {\n        if (expression->value.statement_expression.result == MINIC_EXPRESSION_INVALID) {\n            return false;\n        }\n        statement_result = minic_c0_program_expression(\n            body->program, expression->value.statement_expression.result);\n        return statement_result != NULL &&\n               core_scalar_expression_value_type(body, statement_result, value_type);\n    }\n    if (expression->value_category == MINIC_VALUE_LVALUE) {\n'''
          new='''    if (expression->kind == MINIC_EXPRESSION_STATEMENT) {\n        if (expression->value.statement_expression.result == MINIC_EXPRESSION_INVALID) {\n            return false;\n        }\n        statement_result = minic_c0_program_expression(\n            body->program, expression->value.statement_expression.result);\n        return statement_result != NULL &&\n               core_scalar_expression_value_type(body, statement_result, value_type);\n    }\n    /* M97_CONDITIONAL_SCALAR_VALUE_TYPE: GNU C may preserve top-level\n       qualifiers on a scalar conditional expression whose arms originate as\n       qualified lvalues. Once the conditional is consumed as a scalar value,\n       those top-level qualifiers do not belong to the Core SSA/storage type. */\n    if (expression->kind == MINIC_EXPRESSION_CONDITIONAL) {\n        return minic_type_unqualified(expression->type, value_type);\n    }\n    if (expression->value_category == MINIC_VALUE_LVALUE) {\n'''
          if s.count(old)!=1: raise SystemExit(f'helper anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''        MinicCoreLowerStatus status;\n        MinicType false_type;\n        MinicType true_type;\n\n        /* M60_POINTER_CONDITIONAL_VALUE: C conditional values may be pointer\n'''
          new='''        MinicCoreLowerStatus status;\n        MinicType false_type;\n        MinicType result_type;\n        MinicType true_type;\n\n        /* M60_POINTER_CONDITIONAL_VALUE: C conditional values may be pointer\n'''
          if s.count(old)!=1: raise SystemExit(f'decl anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''        if (expression->value.conditional.uses_condition_value ||\n            expression->value.conditional.when_true == MINIC_EXPRESSION_INVALID ||\n            expression->value.conditional.when_false == MINIC_EXPRESSION_INVALID ||\n            !core_memory_scalar_type(expression->type) || minic_type_is_const(expression->type) ||\n            minic_type_is_volatile(expression->type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n'''
          new='''        if (expression->value.conditional.uses_condition_value ||\n            expression->value.conditional.when_true == MINIC_EXPRESSION_INVALID ||\n            expression->value.conditional.when_false == MINIC_EXPRESSION_INVALID ||\n            !core_scalar_expression_value_type(context->body, expression, &result_type) ||\n            !core_memory_scalar_type(result_type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n'''
          if s.count(old)!=1: raise SystemExit(f'guard anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''        if (!core_memory_scalar_type(expression->type) ||\n            !core_scalar_expression_value_type(context->body, true_expression, &true_type) ||\n            !core_scalar_expression_value_type(context->body, false_expression, &false_type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n        if (!minic_core_function_add_object(\n                context->function, expression->span, expression->type, &result_object) ||\n'''
          new='''        if (!core_scalar_expression_value_type(context->body, true_expression, &true_type) ||\n            !core_scalar_expression_value_type(context->body, false_expression, &false_type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n        if (!minic_core_function_add_object(\n                context->function, expression->span, result_type, &result_object) ||\n'''
          if s.count(old)!=1: raise SystemExit(f'object anchor {s.count(old)}')
          s=s.replace(old,new,1)
          pairs=[
          ('''        status = lower_scalar_assignment_value(context,\n                                               expression->type,\n                                               expression->value.conditional.when_true,\n                                               &arm_value);\n''','''        status = lower_scalar_assignment_value(context,\n                                               result_type,\n                                               expression->value.conditional.when_true,\n                                               &arm_value);\n'''),
          ('''        status = store_scalar_value(\n            context, true_expression->span, expression->type, result_object, arm_value);\n''','''        status = store_scalar_value(\n            context, true_expression->span, result_type, result_object, arm_value);\n'''),
          ('''        status = lower_scalar_assignment_value(context,\n                                               expression->type,\n                                               expression->value.conditional.when_false,\n                                               &arm_value);\n''','''        status = lower_scalar_assignment_value(context,\n                                               result_type,\n                                               expression->value.conditional.when_false,\n                                               &arm_value);\n'''),
          ('''        status = store_scalar_value(\n            context, false_expression->span, expression->type, result_object, arm_value);\n''','''        status = store_scalar_value(\n            context, false_expression->span, result_type, result_object, arm_value);\n''')]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'body anchor {s.count(old)}')
              s=s.replace(old,new,1)
          old='''        return reload_scalar_value(\n            context, expression->span, expression->type, result_object, value_id);\n    }\n    /* M73_COMMA_EXPRESSION_VALUE'''
          new='''        return reload_scalar_value(\n            context, expression->span, result_type, result_object, value_id);\n    }\n    /* M73_COMMA_EXPRESSION_VALUE'''
          if s.count(old)!=1: raise SystemExit(f'reload anchor {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/qualified-statement-conditional.i" <<'EOF'\nstruct core_cond_limits { unsigned int first; unsigned int second; };\nunsigned int qualified_statement_conditional(const struct core_cond_limits *limits) {\n    return ({\n        __auto_type x = (limits->first);\n        __auto_type y = (limits->second);\n        x < y ? x : y;\n    });\n}\nEOF\ncheck_strict_case qualified-statement-conditional\n\n'''
          if s.count(anchor)!=1: raise SystemExit(f'test anchor {s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          print('CORE_Y70_CANDIDATE_APPLIED')
          PY
      - name: Build and exact Core regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y70-compiler
          MINIC="$GITHUB_WORKSPACE/build/core-y70-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-y70-regression" \
            bash tests/core/run-core-ir-shadow.sh
      - name: Frozen strict500 qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y70-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y70-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_Y70_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          w=Path('build/core-y70-full500')
          f=json.loads((w/'frontier-summary.json').read_text())
          p=json.loads((w/'progress-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          c=Counter(); examples={}
          marker="Core IR shadow does not yet support function '"
          for r in rows:
              if r.get('status') == 'PASS': continue
              msg=r.get('message','')
              fn=msg.split(marker,1)[1].split("'",1)[0] if marker in msg else (msg or '<unknown>')
              c[fn]+=1; examples.setdefault(fn,[]).append(int(r.get('index',-1)))
          print(f"CORE_Y70_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct={len(c)}")
          print(f"CORE_Y70_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          for rank,(fn,count) in enumerate(c.most_common(20),1):
              print(f"CORE_Y70_BLOCKER rank={rank} count={count} function={fn} examples={examples[fn][:6]}")
          for i in (0,3,7,42,95,193,301,303):
              r=next((x for x in rows if int(x.get('index',-1))==i),None)
              if r:
                  print(f"CORE_Y70_INDEX index={i} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% message={r.get('message','')}")
          if f['selected'] != 500 or f['error'] != 0:
              raise SystemExit(f'Y70 qualification failed: {f}')
          if any('queue_max_zone_append_sectors' in r.get('message','') for r in rows):
              raise SystemExit('queue_max_zone_append_sectors survived full500')
          PY
      - name: Productize qualified semantic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff -- src/core/core_lower.c tests/core/run-core-ir-shadow.sh > /tmp/y70-semantic.patch
          test -s /tmp/y70-semantic.patch
          git reset --hard 884de084fe81cfcfead1ff31232600bb8333fb4f
          git fetch origin refactor/declaration-sema-v1
          git diff --quiet 884de084fe81cfcfead1ff31232600bb8333fb4f..origin/refactor/declaration-sema-v1 -- \
            src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git checkout -B y70-productize origin/refactor/declaration-sema-v1
          git apply /tmp/y70-semantic.patch
          python3 - <<'PY'
          import subprocess
          allowed={'src/core/core_lower.c','tests/core/run-core-ir-shadow.sh'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected semantic diff: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git commit -m 'core: normalize conditional scalar value types'
          git push origin HEAD:refactor/declaration-sema-v1
          echo CORE_Y70_SEMANTIC_COMMIT=$(git rev-parse HEAD)
