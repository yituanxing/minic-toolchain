name: Core Y57 Bio Segments Shape

on:
  pull_request:

permissions:
  contents: read

jobs:
  y57-bio-segments-shape:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 996066104f58d75bcc547847449186bcbc76b0f9
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Show bio_segments source
        shell: bash
        run: |
          set -Eeuo pipefail
          f=build/linux-focus-corpus/kbuild/init/do_mounts_initrd.i
          echo CORE_Y57_SOURCE_BEGIN
          grep -n -A45 -B10 -m1 'bio_segments' "$f" || true
          echo CORE_Y57_SOURCE_END
      - name: Enable progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py
      - name: Build exact semantic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y57-compiler
      - name: Replay bio_segments representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y57-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y57"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_ASSIGN_STAGE=1 CORE_LOWER_DETAIL=1 \
            python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '3,58,301'
          replay_status=$?
          set -e
          echo CORE_Y57_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 6 --json-out "$work/frontier-summary.json"
          echo CORE_Y57_TRACE_BEGIN
          grep -R -E 'bio_segments|CORE_ASSIGN_STAGE|CORE_LOWER_DETAIL|CORE_FAST_TRACE' "$work/minic-stderr" | head -n 240 || true
          echo CORE_Y57_TRACE_END
