name: Core Y98b Switch Ownership Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  y98b-switch-audit:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86d98851a9741d90bcc08280114f7253f7bc8a43
      - name: Print switch ownership code
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets=[
              ('src/frontend/parser_statement.c','MINIC_STATEMENT_SWITCH'),
              ('src/frontend/parser_statement.c','MINIC_STATEMENT_CASE'),
              ('src/frontend/parser_statement.c','MINIC_STATEMENT_DEFAULT'),
              ('src/target/riscv64/codegen_statement.c','MINIC_STATEMENT_SWITCH'),
              ('src/core/core_lower.c','MINIC_STATEMENT_SWITCH'),
              ('src/core/core_lower.c','switch (statement->kind)'),
          ]
          for path, needle in targets:
              lines=Path(path).read_text(errors='replace').splitlines()
              hits=[i for i,x in enumerate(lines) if needle in x]
              print(f'Y98B_HITS path={path} needle={needle!r} hits={[i+1 for i in hits]}')
              for i in hits[:6]:
                  lo=max(0,i-90); hi=min(len(lines),i+180)
                  print(f'Y98B_CONTEXT_BEGIN path={path} needle={needle!r} line={lo+1}')
                  for n in range(lo,hi): print(f'{n+1}: {lines[n]}')
                  print(f'Y98B_CONTEXT_END path={path} needle={needle!r}')
          PY
