name: Core Batch Y37 Clean67 Cleanup Exit

on:
  pull_request:

permissions:
  contents: read

jobs:
  clean67:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y37-clean67-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0c1136a34f08ba62e11cfe8db049913ece58dfe
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Build clean production head
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y37-clean-compiler
      - name: Full Core exact suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y37-clean-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y37-clean-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y37_CLEAN_CORE_SUITE_PASS
      - name: Clean frozen strict500
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          compiler="$GITHUB_WORKSPACE/build/core-batch-y37-clean-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y37-clean500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_BATCH_Y37_CLEAN_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 10 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-batch-y37-clean500')
          f=json.loads((w/'frontier-summary.json').read_text())
          p=json.loads((w/'progress-summary.json').read_text())
          print(f"CORE_BATCH_Y37_CLEAN_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          print(f"CORE_BATCH_Y37_CLEAN_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          if f['selected'] != 500 or f['pass'] != 67 or f['unsupported'] != 433 or f['error'] != 0:
              raise SystemExit(f'clean c0c1136 mismatch: {f}')
          PY

  cleanup-exit:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y37-cleanup-exit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0c1136a34f08ba62e11cfe8db049913ece58dfe
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply return-cleanup candidate and exit tracing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          anchor='''static MinicCoreLowerStatus lower_return(MinicCoreLowerContext *context,\n                                         const MinicStatement *statement) {'''
          helper='''static MinicCoreLowerStatus lower_cleanup_contexts(\n    MinicCoreLowerContext *context, MinicCleanupContextId current, MinicCleanupContextId stop) {\n    if (context == NULL || context->body == NULL || context->body->program == NULL ||\n        !minic_c0_cleanup_context_reaches(context->body->program, current, stop)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    while (current != stop) {\n        const MinicCleanupContext *cleanup;\n        MinicCoreValueId discarded_value = MINIC_CORE_VALUE_INVALID;\n        MinicCoreLowerStatus status;\n        cleanup = minic_c0_program_cleanup_context(context->body->program, current);\n        if (cleanup == NULL || cleanup->parent == current ||\n            cleanup->cleanup_expression == MINIC_EXPRESSION_INVALID) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        status = lower_expression(context, cleanup->cleanup_expression, &discarded_value);\n        (void)fprintf(stderr,\n                      "CORE_CLEANUP_EXIT stage=cleanup-call function=%s context=%llu parent=%llu "\n                      "status=%d block=%u value=%u\\n",\n                      context->source_function != NULL ? context->source_function->name : "?",\n                      (unsigned long long)current, (unsigned long long)cleanup->parent,\n                      (int)status, (unsigned int)context->block_id, (unsigned int)discarded_value);\n        if (status != MINIC_CORE_LOWER_OK) return status;\n        current = cleanup->parent;\n    }\n    return MINIC_CORE_LOWER_OK;\n}\n\n'''+anchor
          if s.count(anchor)!=1: raise SystemExit('lower_return anchor')
          s=s.replace(anchor,helper,1)
          pos=s.find(anchor); sub=s[pos:]
          old='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          new='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n    MinicCoreObjectId cleanup_return_object;\n    bool has_cleanup;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          if old not in sub: raise SystemExit('return decl')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(anchor); sub=s[pos:]
          old='''    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          new='''    has_cleanup = statement->cleanup_context != statement->cleanup_stop_context;\n    cleanup_return_object = MINIC_CORE_OBJECT_INVALID;\n    if (has_cleanup && !minic_c0_cleanup_context_reaches(\n            context->body->program, statement->cleanup_context, statement->cleanup_stop_context)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          if old not in sub: raise SystemExit('return init')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(anchor); sub=s[pos:]
          old='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;'''
          new='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;\n            if (has_cleanup) return MINIC_CORE_LOWER_UNSUPPORTED;'''
          if old not in sub: raise SystemExit('record return')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(anchor); sub=s[pos:]
          old='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    return minic_core_function_set_terminator(context->function, context->block_id, &terminator)\n               ? MINIC_CORE_LOWER_OK\n               : MINIC_CORE_LOWER_ERROR;'''
          new='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    if (has_cleanup) {\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = spill_scalar_value(context, statement->span,\n                                        context->source_function->return_type,\n                                        terminator.return_value, &cleanup_return_object);\n            (void)fprintf(stderr,\n                          "CORE_CLEANUP_EXIT stage=spill function=%s status=%d block=%u object=%u value=%u\\n",\n                          context->source_function->name, (int)status,\n                          (unsigned int)context->block_id, (unsigned int)cleanup_return_object,\n                          (unsigned int)terminator.return_value);\n            if (status != MINIC_CORE_LOWER_OK) return status;\n        }\n        status = lower_cleanup_contexts(context, statement->cleanup_context,\n                                        statement->cleanup_stop_context);\n        if (status != MINIC_CORE_LOWER_OK) return status;\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = reload_scalar_value(context, statement->span,\n                                         context->source_function->return_type,\n                                         cleanup_return_object, &terminator.return_value);\n            (void)fprintf(stderr,\n                          "CORE_CLEANUP_EXIT stage=reload function=%s status=%d block=%u object=%u value=%u\\n",\n                          context->source_function->name, (int)status,\n                          (unsigned int)context->block_id, (unsigned int)cleanup_return_object,\n                          (unsigned int)terminator.return_value);\n            if (status != MINIC_CORE_LOWER_OK) return status;\n        }\n    }\n    {\n        bool set_ok = minic_core_function_set_terminator(\n            context->function, context->block_id, &terminator);\n        (void)fprintf(stderr,\n                      "CORE_CLEANUP_EXIT stage=set-return function=%s cleanup=%d ok=%d block=%u\\n",\n                      context->source_function->name, has_cleanup ? 1 : 0, set_ok ? 1 : 0,\n                      (unsigned int)context->block_id);\n        return set_ok ? MINIC_CORE_LOWER_OK : MINIC_CORE_LOWER_ERROR;\n    }'''
          if old not in sub: raise SystemExit('return end')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          old='''        if (block_terminated) {\n            if (statement->kind == MINIC_STATEMENT_RETURN) {\n                continue;\n            }\n            if (statement->kind != MINIC_STATEMENT_LABEL) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }\n        }'''
          new='''        if (block_terminated) {\n            (void)fprintf(stderr,\n                          "CORE_AFTER_TERMINATOR function=%s index=%zu statement_id=%llu kind=%d "\n                          "span=%zu:%zu cleanup=%llu stop=%llu\\n",\n                          context->source_function->name, statement_index,\n                          (unsigned long long)source_block->statements[statement_index],\n                          (int)statement->kind, statement->span.begin.line, statement->span.begin.column,\n                          (unsigned long long)statement->cleanup_context,\n                          (unsigned long long)statement->cleanup_stop_context);\n            if (statement->kind == MINIC_STATEMENT_RETURN) continue;\n            if (statement->kind != MINIC_STATEMENT_LABEL) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }\n        }'''
          if s.count(old)!=1: raise SystemExit('after terminator anchor')
          s=s.replace(old,new,1)
          old='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            (void)fprintf(stderr,'''
          new='''        if (statement->cleanup_context != statement->cleanup_stop_context &&\n            statement->kind != MINIC_STATEMENT_RETURN) {\n            (void)fprintf(stderr,'''
          if s.count(old)!=1: raise SystemExit('cleanup guard')
          s=s.replace(old,new,1)
          old='''    if (status == MINIC_CORE_LOWER_OK) status = lower_block(&context, source_block, &terminated);\n    free(statement_blocks); free(local_objects);\n    if (status != MINIC_CORE_LOWER_OK) {'''
          new='''    if (status == MINIC_CORE_LOWER_OK) status = lower_block(&context, source_block, &terminated);\n    (void)fprintf(stderr,\n                  "CORE_FUNCTION_EXIT function=%s status=%d terminated=%d block=%u blocks=%zu\\n",\n                  source_function->name, (int)status, terminated ? 1 : 0,\n                  (unsigned int)context.block_id, lowered.block_count);\n    free(statement_blocks); free(local_objects);\n    if (status != MINIC_CORE_LOWER_OK) {'''
          if s.count(old)!=1: raise SystemExit('function exit anchor')
          p.write_text(s.replace(old,new,1))
          print('CORE_BATCH_Y37_CLEANUP_PATCHED')
          PY
      - name: Build diagnostic candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y37-cleanup-compiler
      - name: Core exact suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y37-cleanup-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y37-cleanup-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y37_CLEANUP_CORE_SUITE_PASS
      - name: Replay cleanup representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y37-cleanup-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y37-cleanup"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '2,3,7'
          replay_status=$?
          set -e
          echo CORE_BATCH_Y37_CLEANUP_REPLAY_STATUS=$replay_status
          echo CORE_BATCH_Y37_CLEANUP_DETAILS_BEGIN
          grep -R -E 'CORE_CLEANUP_EXIT|CORE_AFTER_TERMINATOR|CORE_FUNCTION_EXIT|CORE_FAST_TRACE' "$work/minic-stderr" \
            | grep -E 'device_has_driver_override|device_match_driver_override' || true
          echo CORE_BATCH_Y37_CLEANUP_DETAILS_END
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 8 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-batch-y37-cleanup')
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in sorted(rows,key=lambda x:x.get('index',-1)):
              print(f"CORE_BATCH_Y37_CLEANUP_ROW index={r.get('index')} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.2f}% first={r.get('first_error_line')} message={r.get('message','')}")
          f=json.loads((w/'frontier-summary.json').read_text())
          print(f"CORE_BATCH_Y37_CLEANUP_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['error'] != 0:
              raise SystemExit(f'cleanup candidate introduced Core ERROR: {f}')
          PY
