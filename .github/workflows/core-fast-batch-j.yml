name: Core Fast Batch Q Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  batch-q-diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-q-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-q-compiler

      - name: One-TU ptep_clear diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-q-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-q-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 1 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '155'
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Q_REPLAY_STATUS=%d\n' "$replay_status"
          stderr="$work/minic-stderr/kernel/time/time.i.stderr"
          echo CORE_BATCH_Q_TRACE_BEGIN
          grep 'function=ptep_clear' "$stderr" || true
          echo CORE_BATCH_Q_TRACE_END
          echo CORE_BATCH_Q_INDEX_ENTRY
          sed -n '156p' "$GITHUB_WORKSPACE/build/linux-focus-corpus/selected-tus.txt" || true
          echo CORE_BATCH_Q_SOURCE_BEGIN
          src="$(find "$GITHUB_WORKSPACE/build/linux-focus-corpus" -type f -name 'time.i' | head -n1)"
          printf 'CORE_BATCH_Q_SOURCE_FILE=%s\n' "$src"
          if test -n "$src"; then
            grep -n -A14 -B10 'ptep_clear' "$src" | head -n 180 || true
          fi
          echo CORE_BATCH_Q_SOURCE_END
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 1 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-q-frontier/frontier-summary.json').read_text())
          print(f"CORE_BATCH_Q_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['selected'] != 1 or f['error'] != 0:
              raise SystemExit(f"diagnostic invalid: {f.get('errors', [])}")
          PY
