name: Core Y71 Tag2str Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  y71-tag2str-diagnostic:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2a46647651f0fd642fcf25484e32f9ce4119d8c
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Build exact compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y71-compiler
      - name: Diagnose tag2str representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y71-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y71-linux"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_LOWER_DETAIL=1 CORE_ASSIGN_STAGE=1 \
            python3 tests/external/linux/corpus_replay.py \
              --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '430,431,432'
          status=$?
          set -e
          echo CORE_Y71_REPLAY_STATUS=$status
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y71-linux')
          corpus=Path('build/linux-focus-corpus/kbuild')
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in rows:
              idx=int(r['index']); rel=r['input']
              print(f"CORE_Y71_INDEX index={idx} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% first={r.get('first_error_line')} message={r.get('message','')}")
              p=corpus/rel
              lines=p.read_text(errors='replace').splitlines()
              hits=[i for i,line in enumerate(lines) if 'tag2str' in line]
              print(f"CORE_Y71_TAG_HITS index={idx} hits={[i+1 for i in hits[:8]]}")
              for i in hits[:2]:
                  lo=max(0,i-8); hi=min(len(lines),i+45)
                  print(f"CORE_Y71_SOURCE_BEGIN index={idx} line={lo+1}")
                  for n in range(lo,hi): print(f"{n+1}: {lines[n]}")
                  print(f"CORE_Y71_SOURCE_END index={idx}")
              err=w/'minic-stderr'/f'{rel}.stderr'
              if err.is_file():
                  text=err.read_text(errors='replace').splitlines()
                  keep=[x for x in text if 'CORE_FAST_TRACE' in x or 'CORE_' in x or 'tag2str' in x or 'unsupported' in x.lower() or 'error:' in x.lower()]
                  print(f"CORE_Y71_STDERR_BEGIN index={idx}")
                  for x in keep[-220:]: print(x)
                  print(f"CORE_Y71_STDERR_END index={idx}")
          PY
