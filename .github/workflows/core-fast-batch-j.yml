name: Core Y73 Terminating Switch Full500 Productize

on:
  pull_request:

permissions:
  contents: write

jobs:
  y73-terminating-switch-full500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2a46647651f0fd642fcf25484e32f9ce4119d8c
          fetch-depth: 0
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply terminating switch candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''    size_t label_count;\n    size_t source_index;\n\n    if (context == NULL'''
          new='''    size_t label_count;\n    size_t source_index;\n    bool all_segments_terminate;\n\n    if (context == NULL'''
          if s.count(old)!=1: raise SystemExit(f'decl anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''    for (source_index = 0U; source_index < label_count; ++source_index) {\n        MinicBlock segment;\n'''
          new='''    /* M98_TERMINATING_SWITCH: a switch with a default and no path to its\n       synthetic exit is a terminating statement. Track the narrow proven\n       shape first: every label segment itself terminates. Fallthrough/break\n       segments stay conservatively non-terminating. */\n    all_segments_terminate = default_label != SIZE_MAX && label_count != 0U;\n    for (source_index = 0U; source_index < label_count; ++source_index) {\n        MinicBlock segment;\n'''
          if s.count(old)!=1: raise SystemExit(f'loop anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''        if (segment_terminated) {\n            continue;\n        }\n        if (break_index != SIZE_MAX) {\n'''
          new='''        if (segment_terminated) {\n            continue;\n        }\n        all_segments_terminate = false;\n        if (break_index != SIZE_MAX) {\n'''
          if s.count(old)!=1: raise SystemExit(f'segment anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''    context->block_id = exit_block;\n    *terminated = false;\n    return MINIC_CORE_LOWER_OK;\n}\n\nstatic MinicCoreLowerStatus\nlower_block'''
          new='''    context->block_id = exit_block;\n    if (all_segments_terminate) {\n        MinicCoreTerminator exit_terminator;\n\n        (void)memset(&exit_terminator, 0, sizeof(exit_terminator));\n        exit_terminator.kind = MINIC_CORE_TERMINATOR_UNREACHABLE;\n        exit_terminator.span = statement->span;\n        exit_terminator.return_value = MINIC_CORE_VALUE_INVALID;\n        exit_terminator.return_object = MINIC_CORE_OBJECT_INVALID;\n        if (!minic_core_function_set_terminator(\n                context->function, exit_block, &exit_terminator)) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        *terminated = true;\n        return MINIC_CORE_LOWER_OK;\n    }\n    *terminated = false;\n    return MINIC_CORE_LOWER_OK;\n}\n\nstatic MinicCoreLowerStatus\nlower_block'''
          if s.count(old)!=1: raise SystemExit(f'end anchor {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/terminating-switch-return.i" <<'EOF'\nconst char *terminating_switch_return(unsigned short tag) {\n    switch (tag) {\n    case 1: return "one";\n    case 2: return "two";\n    default: return "other";\n    }\n}\nEOF\ncheck_strict_case terminating-switch-return\n\n'''
          if s.count(anchor)!=1: raise SystemExit(f'test anchor {s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          print('CORE_Y73_CANDIDATE_APPLIED')
          PY
      - name: Build and exact Core regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y73-compiler
          MINIC="$GITHUB_WORKSPACE/build/core-y73-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-y73-regression" \
            bash tests/core/run-core-ir-shadow.sh
      - name: Frozen strict500 qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y73-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y73-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_Y73_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py "$work/batch-results.json" --expect-selected 500 --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          w=Path('build/core-y73-full500')
          f=json.loads((w/'frontier-summary.json').read_text())
          p=json.loads((w/'progress-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          c=Counter(); examples={}; marker="Core IR shadow does not yet support function '"
          for r in rows:
              if r.get('status')=='PASS': continue
              msg=r.get('message','')
              fn=msg.split(marker,1)[1].split("'",1)[0] if marker in msg else (msg or '<unknown>')
              c[fn]+=1; examples.setdefault(fn,[]).append(int(r.get('index',-1)))
          print(f"CORE_Y73_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct={len(c)}")
          print(f"CORE_Y73_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          for rank,(fn,count) in enumerate(c.most_common(20),1):
              print(f"CORE_Y73_BLOCKER rank={rank} count={count} function={fn} examples={examples[fn][:6]}")
          if f['selected'] != 500 or f['error'] != 0: raise SystemExit(f'Y73 qualification failed: {f}')
          if any('tag2str' in r.get('message','') for r in rows): raise SystemExit('tag2str survived full500')
          PY
      - name: Productize terminating switch candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff -- src/core/core_lower.c tests/core/run-core-ir-shadow.sh > /tmp/y73-semantic.patch
          test -s /tmp/y73-semantic.patch
          git reset --hard d2a46647651f0fd642fcf25484e32f9ce4119d8c
          git fetch origin refactor/declaration-sema-v1
          git diff --quiet d2a46647651f0fd642fcf25484e32f9ce4119d8c..origin/refactor/declaration-sema-v1 -- src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git checkout -B y73-productize origin/refactor/declaration-sema-v1
          git apply /tmp/y73-semantic.patch
          python3 - <<'PY'
          import subprocess
          allowed={'src/core/core_lower.c','tests/core/run-core-ir-shadow.sh'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed: raise SystemExit(f'unexpected semantic diff: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git commit -m 'core: recognize terminating switch control flow'
          git push origin HEAD:refactor/declaration-sema-v1
          echo CORE_Y73_SEMANTIC_COMMIT=$(git rev-parse HEAD)
