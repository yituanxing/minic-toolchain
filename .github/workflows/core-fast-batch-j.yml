name: Core Y81 Top Blocker Source Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  y81-top-blocker-audit:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40142a09c5c57ee85bb6fbabd84e3138f671cd55
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Audit omitted conditional lowerer and BTF blocker
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          marker='BATCH_N_GNU_OMITTED_MIDDLE_CONDITIONAL'
          pos=s.index(marker)
          line=s.count('\n',0,pos)+1
          lo=max(0,pos-500); hi=min(len(s),pos+8500)
          chunk=s[lo:hi]
          first=s.count('\n',0,lo)+1
          print(f'CORE_Y81_LOWERER_MARKER_LINE={line}')
          for n,text in enumerate(chunk.splitlines(),first):
              print(f'CORE_Y81_CORE {n}: {text}')
          corpus=Path('build/linux-focus-corpus/kbuild')
          for idx,rel,needle in [
              (2,'init/do_mounts.i','xattr_prefix'),
              (186,'kernel/cgroup/rstat.i','btf_field_type_name'),
              (193,'kernel/bpf/core.i','btf_field_type_name')]:
              lines=(corpus/rel).read_text(errors='replace').splitlines()
              hits=[i for i,x in enumerate(lines) if needle in x]
              print(f'CORE_Y81_HITS index={idx} needle={needle} hits={[i+1 for i in hits[:8]]}')
              for i in hits[:1]:
                  lo2=max(0,i-12); hi2=min(len(lines),i+55)
                  print(f'CORE_Y81_SOURCE_BEGIN index={idx} line={lo2+1}')
                  for j in range(lo2,hi2): print(f'{j+1}: {lines[j]}')
                  print(f'CORE_Y81_SOURCE_END index={idx}')
          PY
