name: Core Batch Y45 Bitfield Storage Read

on:
  pull_request:

permissions:
  contents: read

jobs:
  y45-bitfield-read:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y45-bitfield-read-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6bdeb8fa8302a2f22bd06a4c740de9e39dc59e8
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply bitfield storage-read candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/core/core_lower.c')
          s=p.read_text()

          anchor='''static bool core_memory_scalar_type(MinicType type) {\n    return minic_type_is_integer(type) || minic_type_is_pointer(type);\n}\n'''
          helper=anchor+'''\n/* A bit-field's C value width is not necessarily the width of the memory\n   allocation unit containing it. _Bool is the important case: its semantic\n   integer width is one bit, while DataLayout allocates one byte. Keep the\n   semantic value type for the expression result and choose a separate unsigned\n   integer type whose object size/target width matches the storage unit used by\n   the field layout. */\nstatic bool core_unsigned_bit_field_storage_type(\n    const MinicCoreLowerContext *context,\n    MinicType value_type,\n    MinicType *storage_type,\n    unsigned int *storage_width) {\n    MinicType candidates[5];\n    size_t candidate_alignment;\n    size_t candidate_size;\n    size_t candidate_index;\n    size_t storage_alignment;\n    size_t storage_size;\n    unsigned int candidate_width;\n    unsigned int value_width;\n\n    if (context == NULL || context->body == NULL || context->body->program == NULL ||\n        context->target == NULL || storage_type == NULL || storage_width == NULL ||\n        !minic_type_is_integer(value_type) || !minic_type_is_unsigned_integer(value_type) ||\n        !minic_data_layout_type(minic_default_data_layout(),\n                                context->body->program,\n                                value_type,\n                                &storage_size,\n                                &storage_alignment) ||\n        storage_size == 0U || storage_size > 8U) {\n        return false;\n    }\n    (void)storage_alignment;\n\n    if (minic_target_info_integer_width(\n            context->target, context->body->program, value_type, &value_width) &&\n        (size_t)value_width == storage_size * 8U) {\n        *storage_type = value_type;\n        *storage_width = value_width;\n        return true;\n    }\n\n    candidates[0] = minic_type_unsigned_char();\n    candidates[1] = minic_type_unsigned_short();\n    candidates[2] = minic_type_unsigned_int();\n    candidates[3] = minic_type_unsigned_long();\n    candidates[4] = minic_type_unsigned_long_long();\n    for (candidate_index = 0U; candidate_index < 5U; ++candidate_index) {\n        if (minic_data_layout_type(minic_default_data_layout(),\n                                   context->body->program,\n                                   candidates[candidate_index],\n                                   &candidate_size,\n                                   &candidate_alignment) &&\n            candidate_size == storage_size &&\n            minic_target_info_integer_width(context->target,\n                                            context->body->program,\n                                            candidates[candidate_index],\n                                            &candidate_width) &&\n            (size_t)candidate_width == storage_size * 8U) {\n            (void)candidate_alignment;\n            *storage_type = candidates[candidate_index];\n            *storage_width = candidate_width;\n            return true;\n        }\n    }\n    return false;\n}\n'''
          if s.count(anchor)!=1: raise SystemExit(f'storage helper anchor count={s.count(anchor)}')
          s=s.replace(anchor,helper,1)

          begin=s.find('''    /* BATCH_A_UNSIGNED_BIT_FIELD_READ:''')
          end=s.find('''    /* BATCH_R_RECORD_CALL_MEMBER_VALUE:''', begin)
          if begin < 0 or end < 0: raise SystemExit('bitfield read scope')
          sub=s[begin:end]
          old='''        MinicType base_value_type;\n        MinicType record_type;\n        MinicType value_type;\n        size_t byte_offset;\n        size_t bit_offset;\n        unsigned int storage_width;\n        uint64_t mask_bits;\n'''
          new='''        MinicType base_value_type;\n        MinicType record_type;\n        MinicType storage_access_type;\n        MinicType storage_type;\n        MinicType value_type;\n        size_t byte_offset;\n        size_t bit_offset;\n        unsigned int storage_width;\n        uint64_t mask_bits;\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield read decl count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''                !minic_type_is_integer(value_type) ||\n                !minic_type_is_unsigned_integer(value_type) ||\n                context->target == NULL ||\n                !minic_target_info_integer_width(\n                    context->target, context->body->program, value_type, &storage_width) ||\n                storage_width == 0U || storage_width > 64U ||\n                field->bit_width > storage_width ||\n'''
          new='''                !minic_type_is_integer(value_type) ||\n                !minic_type_is_unsigned_integer(value_type) ||\n                !core_unsigned_bit_field_storage_type(\n                    context, value_type, &storage_type, &storage_width) ||\n                storage_width == 0U || storage_width > 64U ||\n                field->bit_width > storage_width ||\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield storage guard count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''            (void)byte_offset;\n            status = lower_expression(context, expression->value.member.base, &base_id);\n'''
          new='''            (void)byte_offset;\n            storage_access_type = storage_type;\n            if (minic_type_is_const(expression->type) &&\n                !minic_type_add_const(storage_access_type, &storage_access_type)) {\n                return MINIC_CORE_LOWER_ERROR;\n            }\n            if (minic_type_is_volatile(expression->type) &&\n                !minic_type_add_volatile(storage_access_type, &storage_access_type)) {\n                return MINIC_CORE_LOWER_ERROR;\n            }\n            status = lower_expression(context, expression->value.member.base, &base_id);\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield storage access count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''                                          expression->value.member.record_id,\n                                          expression->value.member.field_index,\n                                          expression->type,\n                                          &address_id);\n'''
          new='''                                          expression->value.member.record_id,\n                                          expression->value.member.field_index,\n                                          storage_access_type,\n                                          &address_id);\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield address type count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''            extract.kind = MINIC_CORE_INSTRUCTION_LOAD;\n            extract.span = expression->span;\n            extract.type = value_type;\n'''
          new='''            extract.kind = MINIC_CORE_INSTRUCTION_LOAD;\n            extract.span = expression->span;\n            extract.type = storage_type;\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield load type count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''                extract.kind = MINIC_CORE_INSTRUCTION_INTEGER_SHIFT_RIGHT;\n                extract.span = expression->span;\n                extract.type = value_type;\n'''
          new='''                extract.kind = MINIC_CORE_INSTRUCTION_INTEGER_SHIFT_RIGHT;\n                extract.span = expression->span;\n                extract.type = storage_type;\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield shift type count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''                extract.kind = MINIC_CORE_INSTRUCTION_INTEGER_CONSTANT;\n                extract.span = expression->span;\n                extract.type = value_type;\n                extract.result = MINIC_CORE_VALUE_INVALID;\n                (void)memcpy(&extract.value.integer_value, &mask_bits, sizeof(mask_bits));\n'''
          new='''                extract.kind = MINIC_CORE_INSTRUCTION_INTEGER_CONSTANT;\n                extract.span = expression->span;\n                extract.type = storage_type;\n                extract.result = MINIC_CORE_VALUE_INVALID;\n                (void)memcpy(&extract.value.integer_value, &mask_bits, sizeof(mask_bits));\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield mask constant type count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''                extract.kind = MINIC_CORE_INSTRUCTION_INTEGER_BITWISE_AND;\n                extract.span = expression->span;\n                extract.type = value_type;\n'''
          new='''                extract.kind = MINIC_CORE_INSTRUCTION_INTEGER_BITWISE_AND;\n                extract.span = expression->span;\n                extract.type = storage_type;\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield mask op type count={sub.count(old)}')
          sub=sub.replace(old,new,1)

          old='''            *value_id = current;\n            return MINIC_CORE_LOWER_OK;\n'''
          new='''            if (minic_type_equal(storage_type, value_type)) {\n                *value_id = current;\n                return MINIC_CORE_LOWER_OK;\n            }\n            return append_integer_conversion(\n                context, expression->span, value_type, current, value_id);\n'''
          if sub.count(old)!=1: raise SystemExit(f'bitfield result conversion count={sub.count(old)}')
          sub=sub.replace(old,new,1)
          s=s[:begin]+sub+s[end:]
          p.write_text(s)

          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''check_strict_case scalar-return-cleanup\n\ncat >"$work_dir/indirect-cfg-argument.i" <<'EOF'\n'''
          extra='''check_strict_case scalar-return-cleanup\n\ncat >"$work_dir/bool-bitfield-storage-read.i" <<'EOF'\nstruct bool_bitfield_storage {\n    unsigned int prefix : 1;\n    _Bool ready : 1;\n};\n\nint bool_bitfield_storage_read(struct bool_bitfield_storage *state) {\n    return !state->ready;\n}\nEOF\ncheck_strict_case bool-bitfield-storage-read\n\ncat >"$work_dir/indirect-cfg-argument.i" <<'EOF'\n'''
          if s.count(anchor)!=1: raise SystemExit(f'test anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,extra,1))
          print('CORE_BATCH_Y45_PATCHED')
          PY
      - name: Build exact candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y45-compiler
      - name: Full Core exact regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y45-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y45-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y45_CORE_SUITE_PASS
      - name: Focused Linux gate
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y45-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y45-linux"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '2,3,7'
          replay_status=$?
          set -e
          echo CORE_BATCH_Y45_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 8 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-batch-y45-linux')
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          by={int(r['index']):r for r in rows}
          f=json.loads((w/'frontier-summary.json').read_text())
          for i in sorted(by):
              r=by[i]
              print(f"CORE_BATCH_Y45_ROW index={i} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.2f}% first={r.get('first_error_line')} message={r.get('message','')}")
          print(f"CORE_BATCH_Y45_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['error'] != 0 or by[7]['status'] != 'PASS':
              raise SystemExit(f'Y45 focused regression: {f}')
          if any(r.get('message','').endswith("'device_enable_async_suspend'") for r in rows):
              raise SystemExit('Y45 did not clear device_enable_async_suspend')
          PY
