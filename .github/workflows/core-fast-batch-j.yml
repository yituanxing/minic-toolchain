name: Core Fast Batch Y10 Full500 Error Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  batch-y10-error-census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-y10-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply Y and generic normalized-for continue fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-batch-y.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/core_lower.c')
          s = p.read_text()
          old_continue = '''    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          new_continue = '''    /* BATCH_Y8_FOR_CONTINUE_LABEL: keep the parser-owned synthetic\n       continue label inside the lowered iteration body. A source `continue`\n       is represented as a goto to this label; stripping the label creates a\n       reachable empty Core block with no terminator. For a no-update `for`,\n       lower_block lands on the label and lower_while closes it back to the\n       condition block. */\n    *iteration_body = *body;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          if old_continue not in s:
              raise SystemExit('normalized_for_continue_tail anchor not found')
          s = s.replace(old_continue, new_continue, 1)
          old_update = '''    *iteration_body = *body;\n    iteration_body->statement_count -= 2U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          new_update = '''    /* Keep the synthetic continue label in the iteration body and strip only\n       the update statement. All fallthrough and explicit continue edges then\n       converge on one real Core block before the update is lowered. */\n    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          if old_update not in s:
              raise SystemExit('normalized_for_update_tail anchor not found')
          p.write_text(s.replace(old_update, new_update, 1))
          print('CORE_BATCH_Y10_PATCHED Y plus normalized-for continue target')
          PY
      - name: Build exact candidate compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y10-compiler
      - name: Full frozen strict500 concise census
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y10-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y10-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y10_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 20 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" \
            >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/core-batch-y10-full500')
          f=json.loads((work/'frontier-summary.json').read_text())
          p=json.loads((work/'progress-summary.json').read_text())
          print(f"CORE_BATCH_Y10_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct_blockers={f.get('distinct_blockers')}")
          print(f"CORE_BATCH_Y10_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          errors=f.get('errors') or []
          print(f"CORE_BATCH_Y10_ERRORS count={len(errors)}")
          for i,e in enumerate(errors[:30],1):
              print('CORE_BATCH_Y10_ERROR', i, json.dumps(e, sort_keys=True, separators=(',',':')))
          if f['selected'] != 500:
              raise SystemExit(f"selected mismatch: {f['selected']}")
          PY
          echo CORE_BATCH_Y10_REPLAY_ERROR_LINES_BEGIN
          grep -E 'Core IR shadow lowering failed|CORE_STRICT500_ERROR' "$work/replay.log" | tail -n 80 || true
          echo CORE_BATCH_Y10_REPLAY_ERROR_LINES_END
