name: Core Batch Y43 Device Power Field Shape

on:
  pull_request:

permissions:
  contents: read

jobs:
  clean-head:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6bdeb8fa8302a2f22bd06a4c740de9e39dc59e8
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Build clean production head
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y43-clean-compiler
      - name: Full Core exact suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y43-clean-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y43-clean-tests" \
            bash tests/core/run-core-ir-shadow.sh
      - name: Clean frozen strict500
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          compiler="$GITHUB_WORKSPACE/build/core-batch-y43-clean-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y43-clean-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_BATCH_Y43_CLEAN_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-batch-y43-clean-full500')
          f=json.loads((w/'frontier-summary.json').read_text())
          p=json.loads((w/'progress-summary.json').read_text())
          print(f"CORE_BATCH_Y43_CLEAN_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          print(f"CORE_BATCH_Y43_CLEAN_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          if f['selected'] != 500 or f['error'] != 0:
              raise SystemExit(f'Y43 clean exact-head regression: {f}')
          PY

  field-shape:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6bdeb8fa8302a2f22bd06a4c740de9e39dc59e8
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Show real preprocessed field declarations
        shell: bash
        run: |
          set -Eeuo pipefail
          echo CORE_BATCH_Y43_DECLS_BEGIN
          grep -n -m 20 -E 'is_prepared|async_suspend' build/linux-focus-corpus/kbuild/init/do_mounts.i || true
          echo CORE_BATCH_Y43_DECLS_END
      - name: Instrument device power member metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          anchor='''    expression = minic_c0_program_expression(context->body->program, expression_id);\n    if (expression == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n'''
          extra=anchor+'''    if (context->source_function != NULL &&\n        strcmp(context->source_function->name, "device_enable_async_suspend") == 0 &&\n        expression->kind == MINIC_EXPRESSION_MEMBER) {\n        const MinicExpression *trace_base;\n        const MinicRecord *trace_record;\n        const MinicRecordField *trace_field;\n        trace_base = minic_c0_program_expression(\n            context->body->program, expression->value.member.base);\n        trace_record = minic_c0_program_record(\n            context->body->program, expression->value.member.record_id);\n        trace_field = minic_c0_record_field(trace_record, expression->value.member.field_index);\n        (void)fprintf(stderr,\n                      "CORE_Y43_MEMBER expression=%llu kind=%d category=%d type_kind=%d "\n                      "record=%llu field=%zu bit=%d signed=%d width=%u storage=%u "\n                      "base_kind=%d base_category=%d base_type_kind=%d span=%zu:%zu\\n",\n                      (unsigned long long)expression_id, (int)expression->kind,\n                      (int)expression->value_category, (int)expression->type.kind,\n                      (unsigned long long)expression->value.member.record_id,\n                      expression->value.member.field_index,\n                      trace_field != NULL && trace_field->is_bit_field ? 1 : 0,\n                      trace_field != NULL && trace_field->is_signed ? 1 : 0,\n                      trace_field != NULL ? trace_field->bit_width : 0U,\n                      trace_field != NULL ? trace_field->storage_unit_width : 0U,\n                      trace_base != NULL ? (int)trace_base->kind : -1,\n                      trace_base != NULL ? (int)trace_base->value_category : -1,\n                      trace_base != NULL ? (int)trace_base->type.kind : -1,\n                      expression->span.begin.line, expression->span.begin.column);\n    }\n'''
          if s.count(anchor) < 1: raise SystemExit(f'expression anchor count={s.count(anchor)}')
          # Instrument the real lower_expression definition, not helper lookups before it.
          marker='''static MinicCoreLowerStatus lower_expression(MinicCoreLowerContext *context,\n                                             MinicExpressionId expression_id,\n                                             MinicCoreValueId *value_id) {'''
          pos=s.find(marker)
          if pos < 0: raise SystemExit('lower_expression definition')
          before=s[:pos]
          sub=s[pos:]
          if anchor not in sub: raise SystemExit('lower_expression fetch anchor')
          p.write_text(before+sub.replace(anchor,extra,1))
          print('CORE_BATCH_Y43_INSTRUMENTED')
          PY
      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y43-diag-compiler
      - name: Replay representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y43-diag-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y43-diag"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '2,3'
          status=$?
          set -e
          echo CORE_BATCH_Y43_REPLAY_STATUS=$status
          echo CORE_BATCH_Y43_META_BEGIN
          grep -R -E 'CORE_Y43_MEMBER|device_enable_async_suspend|CORE_FAST_TRACE' "$work/minic-stderr" | head -n 160 || true
          echo CORE_BATCH_Y43_META_END
