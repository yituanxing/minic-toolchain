name: Core Batch Y30 Clean66 And Frontier Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  clean-production500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y30-clean500-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eda1ef08377ef7d7ec06ac0151599e82d8317f4
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Build exact production compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y30-clean-compiler
      - name: Full Core regression suite from production source
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y30-clean-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y30-clean-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y30_CORE_SUITE_PASS
      - name: Frozen strict500 from production source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          compiler="$GITHUB_WORKSPACE/build/core-batch-y30-clean-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y30-clean-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y30_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 20 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/core-batch-y30-clean-full500')
          f=json.loads((work/'frontier-summary.json').read_text())
          p=json.loads((work/'progress-summary.json').read_text())
          rows=json.loads((work/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          status={int(r['index']):r['status'] for r in rows}
          print(f"CORE_BATCH_Y30_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          print(f"CORE_BATCH_Y30_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          print(f"CORE_BATCH_Y30_SENTINELS index7={status.get(7)} index39={status.get(39)}")
          if f['selected'] != 500 or f['pass'] != 66 or f['unsupported'] != 434 or f['error'] != 0 or status.get(7) != 'PASS' or status.get(39) != 'PASS':
              raise SystemExit(f'clean production mismatch: {f}')
          PY

  fast-frontier:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y30-frontier-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eda1ef08377ef7d7ec06ac0151599e82d8317f4
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Enable compact progress and Core traces
        run: python3 tools/dev/patch-linux-replay-live-progress.py
      - name: Build exact production compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y30-frontier-compiler
      - name: Probe two large frontiers and Sprint sentinels
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y30-frontier-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y30-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            --indices '0,2,3,7,42,95'
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y30_FRONTIER_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 10 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 6 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt"
          echo CORE_BATCH_Y30_DETAILS_BEGIN
          grep -R -E 'CORE_FAST_TRACE|CORE_ASSIGN_STAGE|CORE_LOWER_DETAIL|CORE_ASM_DETAIL' "$work/minic-stderr" | tail -n 300 || true
          echo CORE_BATCH_Y30_DETAILS_END
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/core-batch-y30-frontier')
          rows=json.loads((work/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in sorted(rows,key=lambda x:x.get('index',-1)):
              p=float(r.get('progress_ratio') or 0.0)*100.0
              print(f"CORE_BATCH_Y30_ROW index={r.get('index')} status={r.get('status')} progress={p:.2f}% first={r.get('first_error_line')} total={r.get('total_lines')} input={r.get('input')} message={r.get('message','')}")
          f=json.loads((work/'frontier-summary.json').read_text())
          print(f"CORE_BATCH_Y30_FRONTIER_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['error'] != 0:
              raise SystemExit(f'frontier probe contains Core ERROR: {f.get("errors")}')
          PY
