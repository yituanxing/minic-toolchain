name: Core Y58 Bio Comma Discard Trace

on:
  pull_request:

permissions:
  contents: read

jobs:
  y58-bio-comma-discard:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a24b427d110c2354135622834bc1f06ee8270e4
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Instrument comma discarded operand
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''        status = lower_expression(context, expression->value.binary.left, &discarded_left);\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n'''
          new='''        {\n            const MinicExpression *discarded_expression = minic_c0_program_expression(\n                context->body->program, expression->value.binary.left);\n            const MinicExpression *assignment_target = NULL;\n            const MinicExpression *assignment_source = NULL;\n            if (discarded_expression != NULL &&\n                discarded_expression->kind == MINIC_EXPRESSION_ASSIGNMENT) {\n                assignment_target = minic_c0_program_expression(\n                    context->body->program, discarded_expression->value.binary.left);\n                assignment_source = minic_c0_program_expression(\n                    context->body->program, discarded_expression->value.binary.right);\n            }\n            if (context->source_function != NULL &&\n                strcmp(context->source_function->name, "bio_segments") == 0) {\n                const MinicExpression *right_expression = minic_c0_program_expression(\n                    context->body->program, expression->value.binary.right);\n                (void)fprintf(stderr,\n                    "CORE_Y58_COMMA span=%zu:%zu left_kind=%d left_record=%d left_cat=%d "\n                    "assign_target_kind=%d assign_source_kind=%d assign_source_record=%d "\n                    "right_kind=%d\\n",\n                    expression->span.begin.line, expression->span.begin.column,\n                    discarded_expression != NULL ? (int)discarded_expression->kind : -1,\n                    discarded_expression != NULL && minic_type_is_record(discarded_expression->type) ? 1 : 0,\n                    discarded_expression != NULL ? (int)discarded_expression->value_category : -1,\n                    assignment_target != NULL ? (int)assignment_target->kind : -1,\n                    assignment_source != NULL ? (int)assignment_source->kind : -1,\n                    assignment_source != NULL && minic_type_is_record(assignment_source->type) ? 1 : 0,\n                    right_expression != NULL ? (int)right_expression->kind : -1);\n            }\n            status = lower_expression(context, expression->value.binary.left, &discarded_left);\n            if (context->source_function != NULL &&\n                strcmp(context->source_function->name, "bio_segments") == 0) {\n                (void)fprintf(stderr,\n                    "CORE_Y58_COMMA_LEFT_STATUS span=%zu:%zu status=%d\\n",\n                    expression->span.begin.line, expression->span.begin.column, (int)status);\n            }\n        }\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n'''
          if s.count(old)!=1:
              raise SystemExit(f'comma-left anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          print('CORE_Y58_INSTRUMENTED')
          PY
      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y58-compiler
      - name: Replay representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y58-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y58"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_ASSIGN_STAGE=1 CORE_LOWER_DETAIL=1 \
            python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '3,58,301'
          replay_status=$?
          set -e
          echo CORE_Y58_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 6 --json-out "$work/frontier-summary.json"
          echo CORE_Y58_TRACE_BEGIN
          grep -R -E 'CORE_Y58_|bio_segments|CORE_FAST_TRACE' "$work/minic-stderr" | head -n 240 || true
          echo CORE_Y58_TRACE_END
