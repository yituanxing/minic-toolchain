name: Core Y59 Shared Comma Discard Candidate

on:
  pull_request:

permissions:
  contents: read

jobs:
  y59-shared-comma-discard:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a24b427d110c2354135622834bc1f06ee8270e4
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply shared discarded-expression candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''static MinicCoreLowerStatus lower_expression(MinicCoreLowerContext *context,\n                                             MinicExpressionId expression_id,\n                                             MinicCoreValueId *value_id);\n'''
          new=old+'''static MinicCoreLowerStatus lower_expression_statement(\n    MinicCoreLowerContext *context, const MinicStatement *statement);\n'''
          if s.count(old)!=1:
              raise SystemExit(f'forward anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''        status = lower_expression(context, expression->value.binary.left, &discarded_left);\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n'''
          new='''        {\n            const MinicExpression *discarded_expression;\n            MinicStatement discarded_statement;\n\n            discarded_expression = minic_c0_program_expression(\n                context->body->program, expression->value.binary.left);\n            if (discarded_expression == NULL) {\n                return MINIC_CORE_LOWER_ERROR;\n            }\n            (void)memset(&discarded_statement, 0, sizeof(discarded_statement));\n            discarded_statement.kind = MINIC_STATEMENT_EXPRESSION;\n            discarded_statement.span = discarded_expression->span;\n            discarded_statement.expression = expression->value.binary.left;\n            status = lower_expression_statement(context, &discarded_statement);\n        }\n        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n'''
          if s.count(old)!=1:
              raise SystemExit(f'comma-left anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/comma-discard-record-assignment.i" <<'EOF'\nstruct core_comma_pair { int a; int b; };\nint comma_discard_record_assignment(void) {\n    struct core_comma_pair value;\n    return ((value = (struct core_comma_pair){ .a = 1, .b = 2 }), 1);\n}\nEOF\ncheck_strict_case comma-discard-record-assignment\n\n'''
          if s.count(anchor)!=1:
              raise SystemExit(f'test anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          print('CORE_Y59_CANDIDATE_APPLIED')
          PY
      - name: Build candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y59-compiler
      - name: Full Core exact regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-y59-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-y59-regression" \
            bash tests/core/run-core-ir-shadow.sh
      - name: Focused bio_segments Linux replay
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y59-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y59-linux"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '3,58,301'
          replay_status=$?
          set -e
          echo CORE_Y59_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 6 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y59-linux')
          f=json.loads((w/'frontier-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          print(f"CORE_Y59_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          for r in rows:
              print(f"CORE_Y59_INDEX index={r.get('index')} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% message={r.get('message','')}")
          if f['error'] != 0:
              raise SystemExit(f'focused Core ERROR: {f}')
          if any('bio_segments' in r.get('message','') for r in rows):
              raise SystemExit('bio_segments blocker survived Y59')
          PY
