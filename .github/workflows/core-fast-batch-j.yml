name: Core Fast Batch J

on:
  pull_request:

permissions:
  contents: write

jobs:
  batch-j:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-j-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply Batch J production changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-batch-j.py

      - name: Build exact patched compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-j-compiler

      - name: Focused nested record-call argument regression
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-j-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-j-focused"
          mkdir -p "$work"
          cat >"$work/nested-record-call.i" <<'EOF'
          typedef struct Box { unsigned long value; } Box;
          static Box combine(Box a, Box b) { return (Box){a.value | b.value}; }
          static Box intersect(Box a, Box b) { return (Box){a.value & b.value}; }
          Box nested_record_call(Box a, Box b) {
              return combine(a, intersect(b, (Box){7}));
          }
          EOF
          MINIC_CORE_IR=strict "$compiler" -S "$work/nested-record-call.i" -o "$work/strict.s"
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 "$compiler" \
            -S "$work/nested-record-call.i" -o "$work/core.s"
          grep -q 'call intersect' "$work/core.s"
          grep -q 'call combine' "$work/core.s"
          echo CORE_BATCH_J_FOCUSED_PASS

      - name: Four-TU cap_raise_fs_set frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-j-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-j-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '2,3,155,299'
          replay_status=$?
          set -e
          printf 'CORE_BATCH_J_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 4 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-j-frontier/frontier-summary.json').read_text())
          blockers = {b.get('function') for b in f.get('blockers', [])}
          print(f"CORE_BATCH_J_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct_blockers={len(f.get('blockers', []))}")
          if f['selected'] != 4:
              raise SystemExit(f"expected 4 probes, got {f['selected']}")
          if f['error'] != 0:
              raise SystemExit(f"Batch J introduced Core ERRORs: {f.get('errors', [])}")
          if 'cap_raise_fs_set' in blockers:
              raise SystemExit('cap_raise_fs_set blocker did not clear')
          PY

      - name: Persist qualified Batch J production tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/core/core_lower.c
          if git diff --cached --quiet; then
            echo CORE_BATCH_J_ALREADY_PERSISTED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'core: pass direct record-call results by value'
          git push origin HEAD:refactor/declaration-sema-v1
