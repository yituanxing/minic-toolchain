name: Core Y78 Parameter Local Full500 Productize

on:
  pull_request:

permissions:
  contents: write

jobs:
  y78-parameter-local-full500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 687b773b03440af4812f17e5ca31303510fd03d0
          fetch-depth: 0
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply parameter-local initialization candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/frontend/parser_function.c'); s=p.read_text()
          old='''            parameter_local.element_count = 1U;\n            parameter_local.is_array = false;\n            if (minic_parser_find_local_in_current_scope(parser, parameter_local.name_span) !=\n'''
          new='''            parameter_local.element_count = 1U;\n            parameter_local.is_array = false;\n            /* Function parameters are ordinary automatic objects unless their\n               declaration explicitly carries storage metadata. Do not persist\n               an indeterminate stack byte into the semantic local. */\n            parameter_local.is_register_storage = false;\n            if (minic_parser_find_local_in_current_scope(parser, parameter_local.name_span) !=\n'''
          if s.count(old)!=1: raise SystemExit(f'parameter anchor {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          p=Path('tests/core/run-core-ir-shadow.sh'); s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/function-pointer-parameter-ingress.i" <<'EOF'\ntypedef void (*core_callback_t)(void *);\nstruct core_param_mask { unsigned long bits[1]; };\nextern struct core_param_mask core_param_online;\nextern void core_call_mask(void *, core_callback_t, void *, _Bool, const struct core_param_mask *);\nvoid function_pointer_parameter_ingress(core_callback_t func, void *info, int wait) {\n    core_call_mask((void *)0, func, info, wait, &core_param_online);\n}\nEOF\ncheck_strict_case function-pointer-parameter-ingress\n\n'''
          if s.count(anchor)!=1: raise SystemExit(f'test anchor {s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          print('CORE_Y78_CANDIDATE_APPLIED')
          PY
      - name: Build and exact Core regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y78-compiler
          MINIC="$GITHUB_WORKSPACE/build/core-y78-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/core-y78-regression" bash tests/core/run-core-ir-shadow.sh
      - name: Frozen strict500 qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y78-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y78-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_Y78_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py "$work/batch-results.json" --expect-selected 500 --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          w=Path('build/core-y78-full500')
          f=json.loads((w/'frontier-summary.json').read_text()); p=json.loads((w/'progress-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          c=Counter(); examples={}; marker="Core IR shadow does not yet support function '"
          for r in rows:
              if r.get('status')=='PASS': continue
              msg=r.get('message',''); fn=msg.split(marker,1)[1].split("'",1)[0] if marker in msg else (msg or '<unknown>')
              c[fn]+=1; examples.setdefault(fn,[]).append(int(r.get('index',-1)))
          print(f"CORE_Y78_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct={len(c)}")
          print(f"CORE_Y78_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          for rank,(fn,count) in enumerate(c.most_common(20),1): print(f"CORE_Y78_BLOCKER rank={rank} count={count} function={fn} examples={examples[fn][:6]}")
          if f['selected'] != 500 or f['error'] != 0: raise SystemExit(f'Y78 qualification failed: {f}')
          if any('on_each_cpu' in r.get('message','') for r in rows): raise SystemExit('on_each_cpu survived full500')
          PY
      - name: Productize parameter-local initialization
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff -- src/frontend/parser_function.c tests/core/run-core-ir-shadow.sh > /tmp/y78-semantic.patch
          test -s /tmp/y78-semantic.patch
          git reset --hard 687b773b03440af4812f17e5ca31303510fd03d0
          git fetch origin refactor/declaration-sema-v1
          git diff --quiet 687b773b03440af4812f17e5ca31303510fd03d0..origin/refactor/declaration-sema-v1 -- src/frontend/parser_function.c tests/core/run-core-ir-shadow.sh
          git checkout -B y78-productize origin/refactor/declaration-sema-v1
          git apply /tmp/y78-semantic.patch
          python3 - <<'PY'
          import subprocess
          allowed={'src/frontend/parser_function.c','tests/core/run-core-ir-shadow.sh'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed: raise SystemExit(f'unexpected semantic diff: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_function.c tests/core/run-core-ir-shadow.sh
          git commit -m 'frontend: initialize function parameter locals'
          git push origin HEAD:refactor/declaration-sema-v1
          echo CORE_Y78_SEMANTIC_COMMIT=$(git rev-parse HEAD)
