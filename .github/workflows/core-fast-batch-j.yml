name: Core Y56c Productize Frame Address

on:
  pull_request:

permissions:
  contents: write

jobs:
  y56c-productize-frame-address:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0
      - name: Require unchanged qualified semantic base
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --quiet 996066104f58d75bcc547847449186bcbc76b0f9..HEAD -- \
            src/core/core_lower.c src/target/riscv64/core_codegen.c tests/core/run-core-ir-shadow.sh
      - name: Apply already-qualified frame-address support
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''    if (expression->kind == MINIC_EXPRESSION_CALL_FRAME_ADDRESS) {\n        MinicType pointee;\n\n        if (expression->value.call_frame_address.kind != MINIC_CALL_FRAME_ADDRESS_RETURN ||\n            expression->value.call_frame_address.level != 0U ||\n            !minic_type_pointee(expression->type, &pointee) || !minic_type_is_void(pointee)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n        (void)memset(&instruction, 0, sizeof(instruction));\n        instruction.kind = MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS;\n        instruction.span = expression->span;\n        instruction.type = expression->type;\n        instruction.result = MINIC_CORE_VALUE_INVALID;\n        instruction.value.call_frame_address.kind = MINIC_CORE_CALL_FRAME_ADDRESS_RETURN;\n        instruction.value.call_frame_address.level = 0U;\n        return minic_core_function_append_value_instruction(\n                   context->function, context->block_id, &instruction, value_id)\n                   ? MINIC_CORE_LOWER_OK\n                   : MINIC_CORE_LOWER_ERROR;\n    }\n'''
          new='''    if (expression->kind == MINIC_EXPRESSION_CALL_FRAME_ADDRESS) {\n        MinicCoreCallFrameAddressKind core_kind;\n        MinicType pointee;\n\n        if (expression->value.call_frame_address.level != 0U ||\n            !minic_type_pointee(expression->type, &pointee) || !minic_type_is_void(pointee)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n        switch (expression->value.call_frame_address.kind) {\n        case MINIC_CALL_FRAME_ADDRESS_RETURN:\n            core_kind = MINIC_CORE_CALL_FRAME_ADDRESS_RETURN;\n            break;\n        case MINIC_CALL_FRAME_ADDRESS_FRAME:\n            core_kind = MINIC_CORE_CALL_FRAME_ADDRESS_FRAME;\n            break;\n        default:\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n        (void)memset(&instruction, 0, sizeof(instruction));\n        instruction.kind = MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS;\n        instruction.span = expression->span;\n        instruction.type = expression->type;\n        instruction.result = MINIC_CORE_VALUE_INVALID;\n        instruction.value.call_frame_address.kind = core_kind;\n        instruction.value.call_frame_address.level = 0U;\n        return minic_core_function_append_value_instruction(\n                   context->function, context->block_id, &instruction, value_id)\n                   ? MINIC_CORE_LOWER_OK\n                   : MINIC_CORE_LOWER_ERROR;\n    }\n'''
          if s.count(old)!=1:
              raise SystemExit(f'core_lower anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('src/target/riscv64/core_codegen.c')
          s=p.read_text()
          old='''        if (kind == MINIC_CORE_INSTRUCTION_CALL ||\n            kind == MINIC_CORE_INSTRUCTION_INDIRECT_CALL ||\n            kind == MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS) {\n            return true;\n        }\n'''
          new='''        if (kind == MINIC_CORE_INSTRUCTION_CALL ||\n            kind == MINIC_CORE_INSTRUCTION_INDIRECT_CALL) {\n            return true;\n        }\n        if (kind == MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS &&\n            function->instructions[instruction_index].value.call_frame_address.kind ==\n                MINIC_CORE_CALL_FRAME_ADDRESS_RETURN) {\n            return true;\n        }\n'''
          if s.count(old)!=1:
              raise SystemExit(f'ra-save anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''    return instruction != NULL &&\n           instruction->kind == MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS &&\n           instruction->value.call_frame_address.kind == MINIC_CORE_CALL_FRAME_ADDRESS_RETURN &&\n           instruction->value.call_frame_address.level == 0U &&\n           minic_type_pointee(instruction->type, &pointee) && minic_type_is_void(pointee);\n'''
          new='''    return instruction != NULL &&\n           instruction->kind == MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS &&\n           (instruction->value.call_frame_address.kind == MINIC_CORE_CALL_FRAME_ADDRESS_RETURN ||\n            instruction->value.call_frame_address.kind == MINIC_CORE_CALL_FRAME_ADDRESS_FRAME) &&\n           instruction->value.call_frame_address.level == 0U &&\n           minic_type_pointee(instruction->type, &pointee) && minic_type_is_void(pointee);\n'''
          if s.count(old)!=1:
              raise SystemExit(f'support anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''    case MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS:\n        if (!core_call_frame_address_supported(instruction) || !frame->saves_return_address ||\n            !minic_riscv64_emit_sp_load64(file, "t0", frame->return_address_offset)) {\n            return false;\n        }\n        return store_core_value(file, frame, instruction->result, "t0");\n'''
          new='''    case MINIC_CORE_INSTRUCTION_CALL_FRAME_ADDRESS:\n        if (!core_call_frame_address_supported(instruction)) {\n            return false;\n        }\n        if (instruction->value.call_frame_address.kind == MINIC_CORE_CALL_FRAME_ADDRESS_RETURN) {\n            if (!frame->saves_return_address ||\n                !minic_riscv64_emit_sp_load64(file, "t0", frame->return_address_offset)) {\n                return false;\n            }\n        } else if (instruction->value.call_frame_address.kind ==\n                   MINIC_CORE_CALL_FRAME_ADDRESS_FRAME) {\n            if (fprintf(file, "  mv t0, sp\\n") < 0) {\n                return false;\n            }\n        } else {\n            return false;\n        }\n        return store_core_value(file, frame, instruction->result, "t0");\n'''
          if s.count(old)!=1:
              raise SystemExit(f'emit anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/call-frame-address-level-zero.i" <<'EOF'\nunsigned long core_return_address_level_zero(void) {\n    return (unsigned long)__builtin_return_address(0);\n}\n\nunsigned long core_frame_address_level_zero(void) {\n    return (unsigned long)__builtin_frame_address(0);\n}\nEOF\ncheck_strict_case call-frame-address-level-zero\n\n'''
          if s.count(anchor)!=1:
              raise SystemExit(f'test anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          PY
      - name: Sanity exact candidate before push
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y56c-compiler
          compiler="$GITHUB_WORKSPACE/build/core-y56c-compiler/bin/minic"
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-y56c-regression" bash tests/core/run-core-ir-shadow.sh
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-y56c-c0" bash tests/compiler/c0/run-gnu-call-frame-address.sh
      - name: Commit qualified semantic change
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess
          allowed={'src/core/core_lower.c','src/target/riscv64/core_codegen.c','tests/core/run-core-ir-shadow.sh'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected semantic diff: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c src/target/riscv64/core_codegen.c tests/core/run-core-ir-shadow.sh
          git commit -m 'core: support level-zero frame address'
          git push origin HEAD:refactor/declaration-sema-v1
          echo CORE_Y56C_SEMANTIC_COMMIT=$(git rev-parse HEAD)
