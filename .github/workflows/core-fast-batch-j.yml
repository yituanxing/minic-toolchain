name: Core Batch Y40 Device Async Suspend Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  y40-device-async:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y40-device-async-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0c1136a34f08ba62e11cfe8db049913ece58dfe
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply Y38 cleanup-return candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          anchor='''static MinicCoreLowerStatus lower_return(MinicCoreLowerContext *context,\n                                         const MinicStatement *statement) {'''
          helper='''static bool core_is_materialized_cleanup_statement(\n    const MinicCoreLowerContext *context, const MinicStatement *statement) {\n    size_t cleanup_index;\n    if (context == NULL || context->body == NULL || context->body->program == NULL ||\n        statement == NULL || statement->kind != MINIC_STATEMENT_EXPRESSION ||\n        statement->expression == MINIC_EXPRESSION_INVALID) return false;\n    for (cleanup_index = 0U; cleanup_index < context->body->program->cleanup_context_count; ++cleanup_index) {\n        if (context->body->program->cleanup_contexts[cleanup_index].cleanup_expression == statement->expression) return true;\n    }\n    return false;\n}\n\nstatic MinicCoreLowerStatus lower_cleanup_contexts(\n    MinicCoreLowerContext *context, MinicCleanupContextId current, MinicCleanupContextId stop) {\n    if (context == NULL || context->body == NULL || context->body->program == NULL ||\n        !minic_c0_cleanup_context_reaches(context->body->program, current, stop)) return MINIC_CORE_LOWER_ERROR;\n    while (current != stop) {\n        const MinicCleanupContext *cleanup; MinicCoreValueId discarded_value; MinicCoreLowerStatus status;\n        cleanup = minic_c0_program_cleanup_context(context->body->program, current);\n        if (cleanup == NULL || cleanup->parent == current || cleanup->cleanup_expression == MINIC_EXPRESSION_INVALID) return MINIC_CORE_LOWER_ERROR;\n        status = lower_expression(context, cleanup->cleanup_expression, &discarded_value);\n        if (status != MINIC_CORE_LOWER_OK) return status;\n        current = cleanup->parent;\n    }\n    return MINIC_CORE_LOWER_OK;\n}\n\n'''+anchor
          if s.count(anchor)!=1: raise SystemExit('return anchor')
          s=s.replace(anchor,helper,1)
          pos=s.find(anchor); sub=s[pos:]
          old='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          new='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n    MinicCoreObjectId cleanup_return_object;\n    bool has_cleanup;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          if old not in sub: raise SystemExit('return decl')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(anchor); sub=s[pos:]
          old='''    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          new='''    has_cleanup = statement->cleanup_context != statement->cleanup_stop_context;\n    cleanup_return_object = MINIC_CORE_OBJECT_INVALID;\n    if (has_cleanup && !minic_c0_cleanup_context_reaches(\n            context->body->program, statement->cleanup_context, statement->cleanup_stop_context)) return MINIC_CORE_LOWER_ERROR;\n    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          if old not in sub: raise SystemExit('return init')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(anchor); sub=s[pos:]
          old='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;'''
          new='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;\n            if (has_cleanup) return MINIC_CORE_LOWER_UNSUPPORTED;'''
          if old not in sub: raise SystemExit('record return')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(anchor); sub=s[pos:]
          old='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    return minic_core_function_set_terminator(context->function, context->block_id, &terminator)\n               ? MINIC_CORE_LOWER_OK\n               : MINIC_CORE_LOWER_ERROR;'''
          new='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    if (has_cleanup) {\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = spill_scalar_value(context, statement->span, context->source_function->return_type, terminator.return_value, &cleanup_return_object);\n            if (status != MINIC_CORE_LOWER_OK) return status;\n        }\n        status = lower_cleanup_contexts(context, statement->cleanup_context, statement->cleanup_stop_context);\n        if (status != MINIC_CORE_LOWER_OK) return status;\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = reload_scalar_value(context, statement->span, context->source_function->return_type, cleanup_return_object, &terminator.return_value);\n            if (status != MINIC_CORE_LOWER_OK) return status;\n        }\n    }\n    return minic_core_function_set_terminator(context->function, context->block_id, &terminator)\n               ? MINIC_CORE_LOWER_OK\n               : MINIC_CORE_LOWER_ERROR;'''
          if old not in sub: raise SystemExit('return end')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          old='''        if (block_terminated) {\n            if (statement->kind == MINIC_STATEMENT_RETURN) {\n                continue;\n            }\n            if (statement->kind != MINIC_STATEMENT_LABEL) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }\n        }'''
          new='''        if (block_terminated) {\n            if (statement->kind == MINIC_STATEMENT_RETURN || core_is_materialized_cleanup_statement(context, statement)) continue;\n            if (statement->kind != MINIC_STATEMENT_LABEL) return MINIC_CORE_LOWER_UNSUPPORTED;\n        }'''
          if s.count(old)!=1: raise SystemExit('terminated-tail anchor')
          s=s.replace(old,new,1)
          old='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            (void)fprintf(stderr,'''
          new='''        if (statement->cleanup_context != statement->cleanup_stop_context &&\n            statement->kind != MINIC_STATEMENT_RETURN) {\n            (void)fprintf(stderr,'''
          if s.count(old)!=1: raise SystemExit('cleanup guard')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build diagnostic candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y40-compiler
      - name: Replay representatives and print frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y40-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y40"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '2,3'
          status=$?
          set -e
          echo CORE_BATCH_Y40_REPLAY_STATUS=$status
          echo CORE_BATCH_Y40_TRACE_BEGIN
          grep -R -E 'device_enable_async_suspend|CORE_FAST_TRACE|CORE_ASSIGN_STAGE|CORE_LOWER_DETAIL' "$work/minic-stderr" | head -n 120 || true
          echo CORE_BATCH_Y40_TRACE_END
          echo CORE_BATCH_Y40_SOURCE_BEGIN
          for f in init/do_mounts.i init/do_mounts_initrd.i; do
            echo "--- $f ---"
            grep -n -A8 -B4 'device_enable_async_suspend' "build/linux-focus-corpus/kbuild/$f" | head -n 80 || true
          done
          echo CORE_BATCH_Y40_SOURCE_END
