name: Core Batch Y32 Cleanup Statement Expr Diagnosis

on:
  pull_request:

permissions:
  contents: read

jobs:
  y32-diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y32-diagnose-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eda1ef08377ef7d7ec06ac0151599e82d8317f4
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Add exact cleanup and bvec expression tracing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()

          old='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            (void)fprintf(stderr,\n                          "CORE_FAST_TRACE stage=statement reason=cleanup-context "\n                          "function=%s kind=%d span=%zu:%zu cleanup=%llu stop=%llu\\n",\n                          context->source_function->name,\n                          (int)statement->kind,\n                          statement->span.begin.line,\n                          statement->span.begin.column,\n                          (unsigned long long)statement->cleanup_context,\n                          (unsigned long long)statement->cleanup_stop_context);\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }'''
          new='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            MinicCleanupContextId trace_context = statement->cleanup_context;\n            unsigned int trace_depth = 0U;\n            (void)fprintf(stderr,\n                          "CORE_FAST_TRACE stage=statement reason=cleanup-context "\n                          "function=%s kind=%d span=%zu:%zu cleanup=%llu stop=%llu\\n",\n                          context->source_function->name,\n                          (int)statement->kind, statement->span.begin.line,\n                          statement->span.begin.column,\n                          (unsigned long long)statement->cleanup_context,\n                          (unsigned long long)statement->cleanup_stop_context);\n            (void)fprintf(stderr,\n                          "CORE_CLEANUP_REACH function=%s reaches=%d\\n",\n                          context->source_function->name,\n                          minic_c0_cleanup_context_reaches(context->body->program,\n                                                           statement->cleanup_context,\n                                                           statement->cleanup_stop_context) ? 1 : 0);\n            while (trace_context != statement->cleanup_stop_context && trace_depth < 8U) {\n                const MinicCleanupContext *cleanup = minic_c0_program_cleanup_context(\n                    context->body->program, trace_context);\n                const MinicExpression *ce = cleanup != NULL\n                    ? minic_c0_program_expression(context->body->program, cleanup->cleanup_expression)\n                    : NULL;\n                (void)fprintf(stderr,\n                              "CORE_CLEANUP_DETAIL function=%s context=%llu parent=%llu expr=%llu "\n                              "kind=%d cat=%d base=%d ptr=%u span=%zu:%zu\\n",\n                              context->source_function->name,\n                              (unsigned long long)trace_context,\n                              cleanup != NULL ? (unsigned long long)cleanup->parent : ~0ULL,\n                              cleanup != NULL ? (unsigned long long)cleanup->cleanup_expression : ~0ULL,\n                              ce != NULL ? (int)ce->kind : -1,\n                              ce != NULL ? (int)ce->value_category : -1,\n                              ce != NULL ? (int)ce->type.base_kind : -1,\n                              ce != NULL ? ce->type.pointer_depth : 0U,\n                              ce != NULL ? ce->span.begin.line : 0U,\n                              ce != NULL ? ce->span.begin.column : 0U);\n                if (cleanup == NULL || cleanup->parent == trace_context) break;\n                trace_context = cleanup->parent;\n                trace_depth += 1U;\n            }\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }'''
          if s.count(old)!=1: raise SystemExit(f'cleanup anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          sig='''static MinicCoreLowerStatus lower_expression(MinicCoreLowerContext *context,\n                                             MinicExpressionId expression_id,\n                                             MinicCoreValueId *value_id) {'''
          start=s.find(sig)
          if start<0: raise SystemExit('lower_expression definition missing')
          anchor='''    expression = minic_c0_program_expression(context->body->program, expression_id);\n    if (expression == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }'''
          pos=s.find(anchor,start)
          if pos<0: raise SystemExit('lower_expression fetch anchor missing')
          inject='''    expression = minic_c0_program_expression(context->body->program, expression_id);\n    if (expression == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    if (context->source_function != NULL &&\n        strcmp(context->source_function->name, "bvec_advance") == 0 &&\n        expression->span.begin.line >= 46160U && expression->span.begin.line <= 46175U) {\n        if (expression->kind == MINIC_EXPRESSION_BINARY) {\n            const MinicExpression *left = minic_c0_program_expression(\n                context->body->program, expression->value.binary.left);\n            const MinicExpression *right = minic_c0_program_expression(\n                context->body->program, expression->value.binary.right);\n            (void)fprintf(stderr,\n                          "CORE_BINARY_DETAIL expr=%llu op=%d span=%zu:%zu type_base=%d ptr=%u "\n                          "left=%llu lk=%d lb=%d lp=%u lc=%d right=%llu rk=%d rb=%d rp=%u rc=%d\\n",\n                          (unsigned long long)expression_id,\n                          (int)expression->value.binary.operator_kind,\n                          expression->span.begin.line, expression->span.begin.column,\n                          (int)expression->type.base_kind, expression->type.pointer_depth,\n                          (unsigned long long)expression->value.binary.left,\n                          left != NULL ? (int)left->kind : -1,\n                          left != NULL ? (int)left->type.base_kind : -1,\n                          left != NULL ? left->type.pointer_depth : 0U,\n                          left != NULL ? (int)left->value_category : -1,\n                          (unsigned long long)expression->value.binary.right,\n                          right != NULL ? (int)right->kind : -1,\n                          right != NULL ? (int)right->type.base_kind : -1,\n                          right != NULL ? right->type.pointer_depth : 0U,\n                          right != NULL ? (int)right->value_category : -1);\n        } else if (expression->kind == MINIC_EXPRESSION_STATEMENT) {\n            const MinicExpression *result = expression->value.statement_expression.result != MINIC_EXPRESSION_INVALID\n                ? minic_c0_program_expression(context->body->program,\n                                              expression->value.statement_expression.result)\n                : NULL;\n            (void)fprintf(stderr,\n                          "CORE_STMTEXPR_DETAIL expr=%llu span=%zu:%zu block=%llu result=%llu "\n                          "result_kind=%d result_base=%d result_ptr=%u result_cat=%d\\n",\n                          (unsigned long long)expression_id, expression->span.begin.line,\n                          expression->span.begin.column,\n                          (unsigned long long)expression->value.statement_expression.block,\n                          (unsigned long long)expression->value.statement_expression.result,\n                          result != NULL ? (int)result->kind : -1,\n                          result != NULL ? (int)result->type.base_kind : -1,\n                          result != NULL ? result->type.pointer_depth : 0U,\n                          result != NULL ? (int)result->value_category : -1);\n        } else if (expression->kind == MINIC_EXPRESSION_CONDITIONAL) {\n            (void)fprintf(stderr,\n                          "CORE_COND_DETAIL expr=%llu span=%zu:%zu cond=%llu true=%llu false=%llu uses=%d\\n",\n                          (unsigned long long)expression_id, expression->span.begin.line,\n                          expression->span.begin.column,\n                          (unsigned long long)expression->value.conditional.condition,\n                          (unsigned long long)expression->value.conditional.when_true,\n                          (unsigned long long)expression->value.conditional.when_false,\n                          expression->value.conditional.uses_condition_value ? 1 : 0);\n        }\n    }'''
          s=s[:pos]+inject+s[pos+len(anchor):]
          p.write_text(s)
          print('CORE_BATCH_Y32_TRACE_PATCHED')
          PY
      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y32-compiler
      - name: Replay representative blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y32-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y32"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '2,3'
          status=$?
          set -e
          echo CORE_BATCH_Y32_REPLAY_STATUS=$status
          echo CORE_BATCH_Y32_DETAILS_BEGIN
          grep -R -E 'CORE_CLEANUP_|CORE_BINARY_DETAIL|CORE_STMTEXPR_DETAIL|CORE_COND_DETAIL|CORE_ASSIGN_STAGE|CORE_FAST_TRACE' "$work/minic-stderr" | grep -E 'device_has_driver_override|bvec_advance|CORE_BINARY_DETAIL|CORE_STMTEXPR_DETAIL|CORE_COND_DETAIL' || true
          echo CORE_BATCH_Y32_DETAILS_END
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 4
