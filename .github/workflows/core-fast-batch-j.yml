name: Core Batch Y39 Return Cleanup Full500

on:
  pull_request:

permissions:
  contents: read

jobs:
  y39-cleanup-full500:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y39-cleanup-full500-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0c1136a34f08ba62e11cfe8db049913ece58dfe
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Apply cleanup-return ownership candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()

          return_anchor='''static MinicCoreLowerStatus lower_return(MinicCoreLowerContext *context,\n                                         const MinicStatement *statement) {'''
          cleanup_helpers='''static bool core_is_materialized_cleanup_statement(\n    const MinicCoreLowerContext *context, const MinicStatement *statement) {\n    size_t cleanup_index;\n\n    if (context == NULL || context->body == NULL || context->body->program == NULL ||\n        statement == NULL || statement->kind != MINIC_STATEMENT_EXPRESSION ||\n        statement->expression == MINIC_EXPRESSION_INVALID) {\n        return false;\n    }\n    for (cleanup_index = 0U; cleanup_index < context->body->program->cleanup_context_count;\n         ++cleanup_index) {\n        if (context->body->program->cleanup_contexts[cleanup_index].cleanup_expression ==\n            statement->expression) {\n            return true;\n        }\n    }\n    return false;\n}\n\nstatic MinicCoreLowerStatus lower_cleanup_contexts(\n    MinicCoreLowerContext *context, MinicCleanupContextId current, MinicCleanupContextId stop) {\n    if (context == NULL || context->body == NULL || context->body->program == NULL ||\n        !minic_c0_cleanup_context_reaches(context->body->program, current, stop)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    while (current != stop) {\n        const MinicCleanupContext *cleanup;\n        MinicCoreValueId discarded_value;\n        MinicCoreLowerStatus status;\n\n        cleanup = minic_c0_program_cleanup_context(context->body->program, current);\n        if (cleanup == NULL || cleanup->parent == current ||\n            cleanup->cleanup_expression == MINIC_EXPRESSION_INVALID) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        status = lower_expression(context, cleanup->cleanup_expression, &discarded_value);\n        if (status != MINIC_CORE_LOWER_OK) return status;\n        current = cleanup->parent;\n    }\n    return MINIC_CORE_LOWER_OK;\n}\n\n'''+return_anchor
          if s.count(return_anchor)!=1: raise SystemExit('return anchor')
          s=s.replace(return_anchor,cleanup_helpers,1)
          pos=s.find(return_anchor); sub=s[pos:]
          old='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          new='''    MinicCoreTerminator terminator;\n    MinicCoreLowerStatus status;\n    MinicCoreObjectId cleanup_return_object;\n    bool has_cleanup;\n\n    if (context == NULL || context->source_function == NULL || statement == NULL) {'''
          if old not in sub: raise SystemExit('return decl')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(return_anchor); sub=s[pos:]
          old='''    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          new='''    has_cleanup = statement->cleanup_context != statement->cleanup_stop_context;\n    cleanup_return_object = MINIC_CORE_OBJECT_INVALID;\n    if (has_cleanup && !minic_c0_cleanup_context_reaches(\n            context->body->program, statement->cleanup_context, statement->cleanup_stop_context)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    (void)memset(&terminator, 0, sizeof(terminator));\n    terminator.kind = MINIC_CORE_TERMINATOR_RETURN;'''
          if old not in sub: raise SystemExit('return init')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(return_anchor); sub=s[pos:]
          old='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;'''
          new='''        } else if (minic_type_is_record(context->source_function->return_type)) {\n            const MinicExpression *expression;\n\n            if (has_cleanup) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }'''
          if old not in sub: raise SystemExit('record return')
          sub=sub.replace(old,new,1); s=s[:pos]+sub
          pos=s.find(return_anchor); sub=s[pos:]
          old='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    return minic_core_function_set_terminator(context->function, context->block_id, &terminator)\n               ? MINIC_CORE_LOWER_OK\n               : MINIC_CORE_LOWER_ERROR;'''
          new='''        if (status != MINIC_CORE_LOWER_OK) {\n            return status;\n        }\n    }\n    if (has_cleanup) {\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = spill_scalar_value(context, statement->span,\n                                        context->source_function->return_type,\n                                        terminator.return_value, &cleanup_return_object);\n            if (status != MINIC_CORE_LOWER_OK) return status;\n        }\n        status = lower_cleanup_contexts(context, statement->cleanup_context,\n                                        statement->cleanup_stop_context);\n        if (status != MINIC_CORE_LOWER_OK) return status;\n        if (core_memory_scalar_type(context->source_function->return_type)) {\n            status = reload_scalar_value(context, statement->span,\n                                         context->source_function->return_type,\n                                         cleanup_return_object, &terminator.return_value);\n            if (status != MINIC_CORE_LOWER_OK) return status;\n        }\n    }\n    return minic_core_function_set_terminator(context->function, context->block_id, &terminator)\n               ? MINIC_CORE_LOWER_OK\n               : MINIC_CORE_LOWER_ERROR;'''
          if old not in sub: raise SystemExit('return end')
          sub=sub.replace(old,new,1); s=s[:pos]+sub

          old='''        if (block_terminated) {\n            if (statement->kind == MINIC_STATEMENT_RETURN) {\n                continue;\n            }\n            if (statement->kind != MINIC_STATEMENT_LABEL) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }\n        }'''
          new='''        if (block_terminated) {\n            if (statement->kind == MINIC_STATEMENT_RETURN ||\n                core_is_materialized_cleanup_statement(context, statement)) {\n                continue;\n            }\n            if (statement->kind != MINIC_STATEMENT_LABEL) {\n                return MINIC_CORE_LOWER_UNSUPPORTED;\n            }\n        }'''
          if s.count(old)!=1: raise SystemExit('terminated-tail anchor')
          s=s.replace(old,new,1)
          old='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            (void)fprintf(stderr,'''
          new='''        if (statement->cleanup_context != statement->cleanup_stop_context &&\n            statement->kind != MINIC_STATEMENT_RETURN) {\n            (void)fprintf(stderr,'''
          if s.count(old)!=1: raise SystemExit('cleanup guard')
          p.write_text(s.replace(old,new,1))
          print('CORE_BATCH_Y39_PATCHED')
          PY
      - name: Build exact candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y39-compiler
      - name: Full Core exact regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y39-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y39-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y39_CORE_SUITE_PASS
      - name: Frozen strict500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y39-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y39-full500"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0 \
            >"$work/replay.log" 2>&1
          replay_status=$?
          set -e
          echo CORE_BATCH_Y39_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 12 --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-batch-y39-full500')
          f=json.loads((w/'frontier-summary.json').read_text())
          p=json.loads((w/'progress-summary.json').read_text())
          print(f"CORE_BATCH_Y39_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          print(f"CORE_BATCH_Y39_PROGRESS mean={p.get('tu_mean_progress')} median={p.get('tu_median_progress')} line_weighted={p.get('line_weighted_progress')}")
          if f['selected'] != 500 or f['error'] != 0:
              raise SystemExit(f'Y39 full500 error/regression: {f}')
          PY
