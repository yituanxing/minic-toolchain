name: Core Y68 Conditional Unqualified Value

on:
  pull_request:

permissions:
  contents: read

jobs:
  y68-conditional-unqualified-value:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 884de084fe81cfcfead1ff31232600bb8333fb4f
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply conditional value candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''        MinicCoreLowerStatus status;\n        MinicType false_type;\n        MinicType true_type;\n\n        /* M60_POINTER_CONDITIONAL_VALUE: C conditional values may be pointer\n'''
          new='''        MinicCoreLowerStatus status;\n        MinicType false_type;\n        MinicType result_type;\n        MinicType true_type;\n\n        /* M60_POINTER_CONDITIONAL_VALUE: C conditional values may be pointer\n'''
          if s.count(old)!=1: raise SystemExit(f'decl anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''        if (expression->value.conditional.uses_condition_value ||\n            expression->value.conditional.when_true == MINIC_EXPRESSION_INVALID ||\n            expression->value.conditional.when_false == MINIC_EXPRESSION_INVALID ||\n            !core_memory_scalar_type(expression->type) || minic_type_is_const(expression->type) ||\n            minic_type_is_volatile(expression->type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n'''
          new='''        if (expression->value.conditional.uses_condition_value ||\n            expression->value.conditional.when_true == MINIC_EXPRESSION_INVALID ||\n            expression->value.conditional.when_false == MINIC_EXPRESSION_INVALID ||\n            !minic_type_unqualified(expression->type, &result_type) ||\n            !core_memory_scalar_type(result_type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n'''
          if s.count(old)!=1: raise SystemExit(f'guard anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='''        if (!core_memory_scalar_type(expression->type) ||\n            !core_scalar_expression_value_type(context->body, true_expression, &true_type) ||\n            !core_scalar_expression_value_type(context->body, false_expression, &false_type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n        if (!minic_core_function_add_object(\n                context->function, expression->span, expression->type, &result_object) ||\n'''
          new='''        if (!core_scalar_expression_value_type(context->body, true_expression, &true_type) ||\n            !core_scalar_expression_value_type(context->body, false_expression, &false_type)) {\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }\n        if (!minic_core_function_add_object(\n                context->function, expression->span, result_type, &result_object) ||\n'''
          if s.count(old)!=1: raise SystemExit(f'object anchor {s.count(old)}')
          s=s.replace(old,new,1)
          pairs=[
          ('''        status = lower_scalar_assignment_value(context,\n                                               expression->type,\n                                               expression->value.conditional.when_true,\n                                               &arm_value);\n''','''        status = lower_scalar_assignment_value(context,\n                                               result_type,\n                                               expression->value.conditional.when_true,\n                                               &arm_value);\n'''),
          ('''        status = store_scalar_value(\n            context, true_expression->span, expression->type, result_object, arm_value);\n''','''        status = store_scalar_value(\n            context, true_expression->span, result_type, result_object, arm_value);\n'''),
          ('''        status = lower_scalar_assignment_value(context,\n                                               expression->type,\n                                               expression->value.conditional.when_false,\n                                               &arm_value);\n''','''        status = lower_scalar_assignment_value(context,\n                                               result_type,\n                                               expression->value.conditional.when_false,\n                                               &arm_value);\n'''),
          ('''        status = store_scalar_value(\n            context, false_expression->span, expression->type, result_object, arm_value);\n''','''        status = store_scalar_value(\n            context, false_expression->span, result_type, result_object, arm_value);\n''')]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'body anchor {s.count(old)}')
              s=s.replace(old,new,1)
          old='''        return reload_scalar_value(\n            context, expression->span, expression->type, result_object, value_id);\n    }\n    /* M73_COMMA_EXPRESSION_VALUE'''
          new='''        return reload_scalar_value(\n            context, expression->span, result_type, result_object, value_id);\n    }\n    /* M73_COMMA_EXPRESSION_VALUE'''
          if s.count(old)!=1: raise SystemExit(f'reload anchor {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/core/run-core-ir-shadow.sh')
          s=p.read_text()
          anchor='''cat >"$work_dir/variadic-call-unsupported.i" <<'EOF'\n'''
          addition='''cat >"$work_dir/qualified-statement-conditional.i" <<'EOF'\nstruct core_cond_limits { unsigned int first; unsigned int second; };\nunsigned int qualified_statement_conditional(const struct core_cond_limits *limits) {\n    return ({\n        __auto_type x = (limits->first);\n        __auto_type y = (limits->second);\n        x < y ? x : y;\n    });\n}\nEOF\ncheck_strict_case qualified-statement-conditional\n\n'''
          if s.count(anchor)!=1: raise SystemExit(f'test anchor {s.count(anchor)}')
          p.write_text(s.replace(anchor,addition+anchor,1))
          print('CORE_Y68_CANDIDATE_APPLIED')
          PY
      - name: Build and exact Core regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y68-compiler
          MINIC="$GITHUB_WORKSPACE/build/core-y68-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-y68-regression" \
            bash tests/core/run-core-ir-shadow.sh
      - name: Focused queue zone append replay
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y68-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y68-linux"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '3,301,303'
          replay_status=$?
          set -e
          echo CORE_Y68_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 8 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y68-linux')
          f=json.loads((w/'frontier-summary.json').read_text())
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          print(f"CORE_Y68_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          for r in rows:
              print(f"CORE_Y68_INDEX index={r.get('index')} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% message={r.get('message','')}")
          if f['error'] != 0:
              raise SystemExit(f'Core ERROR: {f}')
          if any('queue_max_zone_append_sectors' in r.get('message','') for r in rows):
              raise SystemExit('queue_max_zone_append_sectors survived Y68')
          PY
