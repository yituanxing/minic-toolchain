name: Core Y83 BTF Warn Frontier Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  y83-btf-warn-frontier:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40142a09c5c57ee85bb6fbabd84e3138f671cd55
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Build exact compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y83-compiler
      - name: Diagnose BTF representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y83-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y83-linux"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_LOWER_DETAIL=1 CORE_ASM_DETAIL=1 CORE_ASSIGN_STAGE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '186,193'
          status=$?
          set -e
          echo CORE_Y83_REPLAY_STATUS=$status
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y83-linux')
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in rows:
              idx=int(r['index']); rel=r['input']
              print(f"CORE_Y83_INDEX index={idx} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% first={r.get('first_error_line')} message={r.get('message','')}")
              err=w/'minic-stderr'/f'{rel}.stderr'
              if not err.is_file(): continue
              lines=err.read_text(errors='replace').splitlines()
              keep=[]
              for x in lines:
                  if ('btf_field_type_name' in x or 'CORE_FAST_TRACE' in x or 'CORE_LOWER_DETAIL' in x or
                      'CORE_ASM_DETAIL' in x or 'CORE_ASSIGN_STAGE' in x):
                      keep.append(x)
              print(f'CORE_Y83_STDERR_BEGIN index={idx}')
              for x in keep[-260:]: print(x)
              print(f'CORE_Y83_STDERR_END index={idx}')
          PY
