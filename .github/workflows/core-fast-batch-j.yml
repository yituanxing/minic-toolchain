name: Core Batch Y Productionize

on:
  pull_request:

permissions:
  contents: write

jobs:
  productionize-y:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-batch-y-productionize-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 1

      - name: Guard idempotent productionization
        id: guard
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'CORE_LOOP_CONTINUE_TARGET_V1' src/core/core_lower.c; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'CORE_BATCH_Y_PRODUCTION_ALREADY_PRESENT=1'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            echo 'CORE_BATCH_Y_PRODUCTION_ALREADY_PRESENT=0'
          fi

      - name: Restore frozen Linux corpus
        if: steps.guard.outputs.needed == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply validated semantic source changes
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-core-frontier-batch-y.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/core_lower.c')
          s = p.read_text()

          old_continue = '''    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          new_continue = '''    /* The parser-owned synthetic continue label is part of the loop body.\n       Keep it so explicit continue edges and fallthrough converge before the\n       canonical backedge is emitted. */\n    *iteration_body = *body;\n    return true;\n}\n\nstatic bool normalized_for_update_tail'''
          if old_continue not in s:
              raise SystemExit('normalized_for_continue_tail anchor not found')
          s = s.replace(old_continue, new_continue, 1)

          old_update = '''    *iteration_body = *body;\n    iteration_body->statement_count -= 2U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          new_update = '''    /* Strip only the normalized update.  The preceding synthetic continue\n       label remains in the body and becomes the convergence point before the\n       update is lowered. */\n    *iteration_body = *body;\n    iteration_body->statement_count -= 1U;\n    *update_statement = update;\n    return true;\n}\n\nstatic MinicCoreLowerStatus\nlower_while'''
          if old_update not in s:
              raise SystemExit('normalized_for_update_tail anchor not found')
          s = s.replace(old_update, new_update, 1)

          old_sig = '''static MinicCoreLowerStatus\nlower_while(MinicCoreLowerContext *context, const MinicStatement *statement, bool *terminated) {'''
          new_sig = '''static MinicCoreLowerStatus\nlower_while(MinicCoreLowerContext *context,\n            const MinicStatement *statement,\n            MinicStatementId continue_label_statement,\n            bool *terminated) {'''
          if old_sig not in s:
              raise SystemExit('lower_while signature anchor not found')
          s = s.replace(old_sig, new_sig, 1)

          old_blocks = '''    if (!minic_core_function_add_block(context->function, &condition_block) ||\n        !minic_core_function_add_block(context->function, &body_block) ||\n        !minic_core_function_add_block(context->function, &exit_block)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    status = set_branch(context, preheader_block, statement->span, condition_block);\n'''
          new_blocks = '''    if (!minic_core_function_add_block(context->function, &condition_block) ||\n        !minic_core_function_add_block(context->function, &body_block) ||\n        !minic_core_function_add_block(context->function, &exit_block)) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    if (continue_label_statement != MINIC_STATEMENT_INVALID) {\n        if (context->statement_blocks == NULL ||\n            continue_label_statement >= context->statement_block_count ||\n            context->statement_blocks[continue_label_statement] != MINIC_CORE_BLOCK_INVALID) {\n            return MINIC_CORE_LOWER_ERROR;\n        }\n        /* CORE_LOOP_CONTINUE_TARGET_V1: a parser-owned while continue label\n           denotes condition re-evaluation. Bind the source label directly to\n           the real condition block before lowering the body, so continue does\n           not manufacture an orphan block. */\n        context->statement_blocks[continue_label_statement] = condition_block;\n    }\n    status = set_branch(context, preheader_block, statement->span, condition_block);\n'''
          if old_blocks not in s:
              raise SystemExit('lower_while block creation anchor not found')
          s = s.replace(old_blocks, new_blocks, 1)

          old_internal = '''            if (internal_loop_label) {\n                status = lower_while(context, loop, &statement_terminated);\n                if (status != MINIC_CORE_LOWER_OK) return status;\n                statement_index += 1U;\n            } else {\n'''
          new_internal = '''            if (internal_loop_label) {\n                status = lower_while(context,\n                                     loop,\n                                     source_block->statements[statement_index],\n                                     &statement_terminated);\n                if (status != MINIC_CORE_LOWER_OK) return status;\n                statement_index += 1U;\n            } else {\n'''
          if old_internal not in s:
              raise SystemExit('internal loop call anchor not found')
          s = s.replace(old_internal, new_internal, 1)

          old_direct = '''            case MINIC_STATEMENT_WHILE:\n                status = lower_while(context, statement, &statement_terminated);\n                break;\n'''
          new_direct = '''            case MINIC_STATEMENT_WHILE:\n                status = lower_while(\n                    context, statement, MINIC_STATEMENT_INVALID, &statement_terminated);\n                break;\n'''
          if old_direct not in s:
              raise SystemExit('direct while call anchor not found')
          p.write_text(s.replace(old_direct, new_direct, 1))
          print('CORE_BATCH_Y_PRODUCTION_SOURCE_PATCHED')
          PY

      - name: Refresh Core regression contracts
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/core/run-core-ir-shadow.sh')
          s = p.read_text()

          old_for = '''"$MINIC" -S "$work_dir/for-shape.i" -o "$work_dir/for-shape-normal.s"\nMINIC_CORE_IR=shadow "$MINIC" -S "$work_dir/for-shape.i" -o "$work_dir/for-shape-shadow.s"\ncmp "$work_dir/for-shape-normal.s" "$work_dir/for-shape-shadow.s"\nif MINIC_CORE_IR=strict "$MINIC" -S "$work_dir/for-shape.i" \\\n    -o "$work_dir/for-shape-strict.s" 2>"$work_dir/for-shape-strict.err"; then\n    echo "strict Core IR shadow unexpectedly accepted canonical for-loop lowering" >&2\n    exit 1\nfi\ngrep -F "Core IR shadow does not yet support function 'for_shape'" \\\n    "$work_dir/for-shape-strict.err" >/dev/null\n'''
          if old_for not in s:
              raise SystemExit('for-shape stale expectation anchor not found')
          s = s.replace(old_for, 'check_strict_case for-shape\n', 1)

          while_anchor = '''check_strict_case while-backedge\n\n'''
          while_extra = '''check_strict_case while-backedge\n\ncat >"$work_dir/while-continue.i" <<'EOF'\nint while_continue(int value) {\n    while (value) {\n        if (value == 1) {\n            value = 0;\n            continue;\n        }\n        value = 1;\n    }\n    return value;\n}\nEOF\ncheck_strict_case while-continue\n\n'''
          if while_anchor not in s:
              raise SystemExit('while-backedge test anchor not found')
          s = s.replace(while_anchor, while_extra, 1)

          for_anchor = '''check_strict_case for-shape\n\n\ncat >"$work_dir/direct-call-v0.i"'''
          for_extra = '''check_strict_case for-shape\n\ncat >"$work_dir/for-continue.i" <<'EOF'\nint for_continue(int value) {\n    for (; value; value = value - 1) {\n        if (value == 2)\n            continue;\n    }\n    return value;\n}\nEOF\ncheck_strict_case for-continue\n\ncat >"$work_dir/void-statement-expression.i" <<'EOF'\nvoid sink(void);\n\nvoid void_statement_expression(void) {\n    ({ sink(); });\n    return;\n}\nEOF\ncheck_strict_case void-statement-expression\n\ncat >"$work_dir/direct-call-v0.i"'''
          if for_anchor not in s:
              raise SystemExit('for focused insertion anchor not found')
          s = s.replace(for_anchor, for_extra, 1)

          old_indirect = '''"$MINIC" -S "$work_dir/indirect-call-unsupported.i" \\\n    -o "$work_dir/indirect-call-unsupported-normal.s"\nif MINIC_CORE_IR=strict "$MINIC" -S "$work_dir/indirect-call-unsupported.i" \\\n    -o "$work_dir/indirect-call-unsupported-strict.s" \\\n    2>"$work_dir/indirect-call-unsupported-strict.err"; then\n    echo "strict Core IR shadow unexpectedly accepted an indirect call" >&2\n    exit 1\nfi\ngrep -F "Core IR shadow does not yet support function 'indirect_caller'" \\\n    "$work_dir/indirect-call-unsupported-strict.err" >/dev/null\n'''
          if old_indirect not in s:
              raise SystemExit('indirect-call stale expectation anchor not found')
          s = s.replace(old_indirect, 'check_strict_case indirect-call-unsupported\n', 1)

          old_variadic = '''"$MINIC" -S "$work_dir/variadic-call-unsupported.i" \\\n    -o "$work_dir/variadic-call-unsupported-normal.s"\nif MINIC_CORE_IR=strict "$MINIC" -S "$work_dir/variadic-call-unsupported.i" \\\n    -o "$work_dir/variadic-call-unsupported-strict.s" \\\n    2>"$work_dir/variadic-call-unsupported-strict.err"; then\n    echo "strict Core IR shadow unexpectedly accepted a variadic call" >&2\n    exit 1\nfi\ngrep -F "Core IR shadow does not yet support function 'variadic_caller'" \\\n    "$work_dir/variadic-call-unsupported-strict.err" >/dev/null\n'''
          if old_variadic not in s:
              raise SystemExit('variadic-call stale expectation anchor not found')
          s = s.replace(old_variadic, 'check_strict_case variadic-call-unsupported\n', 1)

          p.write_text(s)
          print('CORE_BATCH_Y_PRODUCTION_TESTS_PATCHED')
          PY

      - name: Build production candidate
        if: steps.guard.outputs.needed == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y-production-compiler

      - name: Run full Core IR shadow regression suite
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-batch-y-production-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-batch-y-production-tests" \
            bash tests/core/run-core-ir-shadow.sh
          echo CORE_BATCH_Y_PRODUCTION_CORE_SUITE_PASS

      - name: Focus former strict500 Core errors
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          compiler="$GITHUB_WORKSPACE/build/core-batch-y-production-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y-production-linux"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '208,339'
          replay_status=$?
          set -e
          printf 'CORE_BATCH_Y_PRODUCTION_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 8 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-y-production-linux/frontier-summary.json').read_text())
          print(f"CORE_BATCH_Y_PRODUCTION_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['selected'] != 2 or f['error'] != 0 or f['pass'] < 1:
              raise SystemExit(f'production focused gate failed: {f}')
          PY

      - name: Commit validated semantic changes
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'core: close loop continue CFG and void statement expressions'
          git push origin HEAD:refactor/declaration-sema-v1
          echo "CORE_BATCH_Y_PRODUCTION_HEAD=$(git rev-parse HEAD)"
