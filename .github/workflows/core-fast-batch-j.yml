name: Core Y86 BTF Function Stage

on:
  pull_request:

permissions:
  contents: read

jobs:
  y86-btf-function-stage:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c26979e02d06873a401475f8d63a02406c862226
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Instrument function stage and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c'); s=p.read_text()
          old='''    status = lower_parameter_ingress(&context);\n    terminated = false;\n    if (status == MINIC_CORE_LOWER_OK) status = lower_block(&context, source_block, &terminated);\n'''
          new='''    status = lower_parameter_ingress(&context);\n    if (source_function->name != NULL && strcmp(source_function->name, "btf_field_type_name") == 0) {\n        (void)fprintf(stderr, "CORE_Y86_STAGE function=btf_field_type_name stage=parameter-ingress status=%d values=%zu objects=%zu blocks=%zu\\n",\n                      (int)status, lowered.value_count, lowered.object_count, lowered.block_count);\n    }\n    terminated = false;\n    if (status == MINIC_CORE_LOWER_OK) {\n        status = lower_block(&context, source_block, &terminated);\n        if (source_function->name != NULL && strcmp(source_function->name, "btf_field_type_name") == 0) {\n            (void)fprintf(stderr, "CORE_Y86_STAGE function=btf_field_type_name stage=body status=%d terminated=%d values=%zu objects=%zu blocks=%zu\\n",\n                          (int)status, terminated ? 1 : 0, lowered.value_count, lowered.object_count, lowered.block_count);\n        }\n    }\n'''
          if s.count(old)!=1: raise SystemExit(f'function-stage anchor {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y86-compiler
      - name: Replay BTF representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y86-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y86-linux"
          mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 CORE_LOWER_DETAIL=1 CORE_ASM_DETAIL=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '186,193'
          status=$?
          set -e
          echo CORE_Y86_REPLAY_STATUS=$status
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y86-linux'); rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in rows:
              idx=int(r['index']); rel=r['input']
              print(f"CORE_Y86_INDEX index={idx} status={r.get('status')} progress={float(r.get('progress_ratio') or 0)*100:.3f}% message={r.get('message','')}")
              err=w/'minic-stderr'/f'{rel}.stderr'
              if err.is_file():
                  for x in err.read_text(errors='replace').splitlines():
                      if 'CORE_Y86_STAGE' in x or ('CORE_FAST_TRACE' in x and 'btf_field_type_name' in x) or ('CORE_ASM_DETAIL' in x and 'btf_field_type_name' in x): print(x)
          PY
