name: Core Y53 Perf Caller Regs Shape

on:
  pull_request:

permissions:
  contents: read

jobs:
  y53-perf-caller-regs-shape:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 996066104f58d75bcc547847449186bcbc76b0f9
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Show representative source and Core bitcast path
        shell: bash
        run: |
          set -Eeuo pipefail
          echo CORE_Y53_SOURCE_BEGIN
          for f in \
            build/linux-focus-corpus/kbuild/init/main.i \
            build/linux-focus-corpus/kbuild/init/initramfs.i \
            build/linux-focus-corpus/kbuild/arch/riscv/kernel/perf_callchain.i; do
            echo "--- $f"
            grep -n -A28 -B6 -m1 'perf_fetch_caller_regs' "$f" || true
          done
          echo CORE_Y53_SOURCE_END
          echo CORE_Y53_LOWER_BITCAST_BEGIN
          grep -n -A55 -B20 'MINIC_EXPRESSION_BITCAST' src/core/core_lower.c || true
          grep -n -A45 -B15 'append_scalar_bitcast' src/core/core_lower.c || true
          echo CORE_Y53_LOWER_BITCAST_END
      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py
      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y53-compiler
      - name: Replay representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y53-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y53"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '0,4,40'
          replay_status=$?
          set -e
          echo CORE_Y53_REPLAY_STATUS=$replay_status
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 6 --json-out "$work/frontier-summary.json"
          echo CORE_Y53_TRACE_BEGIN
          grep -R -E 'perf_fetch_caller_regs|CORE_ASSIGN_STAGE|CORE_LOWER_DETAIL|CORE_FAST_TRACE' \
            "$work/minic-stderr" | grep -E 'perf_fetch_caller_regs|CORE_ASSIGN_STAGE' | head -n 160 || true
          echo CORE_Y53_TRACE_END
