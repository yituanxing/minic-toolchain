name: Core Y101b Netdev Selector Shape

on:
  pull_request:

permissions:
  contents: read

jobs:
  y101b-selector-shape:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86d98851a9741d90bcc08280114f7253f7bc8a43
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Instrument selector shape
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c'); s=p.read_text()
          old='''    status = lower_expression(context, statement->expression, &selector_source);\n    if (status != MINIC_CORE_LOWER_OK) {\n        return status;\n    }\n'''
          new='''    if (context->source_function != NULL && strcmp(context->source_function->name, "netdev_reg_state") == 0) {\n        const MinicRecord *trace_record = NULL;\n        const MinicRecordField *trace_field = NULL;\n        if (selector_expression->kind == MINIC_EXPRESSION_MEMBER) {\n            trace_record = minic_c0_program_record(context->body->program, selector_expression->value.member.record_id);\n            trace_field = minic_c0_record_field(trace_record, selector_expression->value.member.field_index);\n        }\n        (void)fprintf(stderr,\n                      "CORE_Y101_SELECTOR kind=%d category=%d integer=%d unsigned=%d bool=%d field=%d bitfield=%d width=%zu volatile=%d const=%d\\n",\n                      (int)selector_expression->kind,\n                      (int)selector_expression->value_category,\n                      minic_type_is_integer(selector_expression->type) ? 1 : 0,\n                      minic_type_is_unsigned_integer(selector_expression->type) ? 1 : 0,\n                      minic_type_is_bool_integer(selector_expression->type) ? 1 : 0,\n                      trace_field != NULL ? 1 : 0,\n                      trace_field != NULL && trace_field->is_bit_field ? 1 : 0,\n                      trace_field != NULL ? trace_field->bit_width : (size_t)0U,\n                      minic_type_is_volatile(selector_expression->type) ? 1 : 0,\n                      minic_type_is_const(selector_expression->type) ? 1 : 0);\n    }\n    status = lower_expression(context, statement->expression, &selector_source);\n    if (status != MINIC_CORE_LOWER_OK) {\n        return status;\n    }\n'''
          if s.count(old)!=1: raise SystemExit(f'anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build exact instrumented compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y101b-compiler
      - name: Replay representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y101b-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-y101b-linux"; mkdir -p "$work"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 3 --offset 0 --limit 500 --sample-count 0 --indices '193,242,357'
          status=$?; set -e; echo CORE_Y101B_REPLAY_STATUS=$status
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/core-y101b-linux')
          rows=json.loads((w/'batch-results.json').read_text())
          if isinstance(rows,dict): rows=rows.get('results',rows.get('tus',[]))
          for r in rows:
              print(f"CORE_Y101B_INDEX index={r.get('index')} status={r.get('status')} message={r.get('message','')}")
              err=w/'minic-stderr'/f"{r['input']}.stderr"
              if err.is_file():
                  for x in err.read_text(errors='replace').splitlines():
                      if 'CORE_Y101_SELECTOR' in x or ('CORE_FAST_TRACE' in x and 'netdev_reg_state' in x): print(x)
          PY
