name: Core Fast Batch U2 Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  batch-u2-diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-u2-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply U candidate and telemetry
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-batch-u.py

      - name: Build exact patched compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-u2-compiler

      - name: One-TU find_section diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-u2-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-u2-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 1 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '4'
          replay_status=$?
          set -e
          printf 'CORE_BATCH_U2_REPLAY_STATUS=%d\n' "$replay_status"
          stderr="$work/minic-stderr/init/initramfs.i.stderr"
          echo CORE_BATCH_U2_TRACE_BEGIN
          grep -E 'function=find_section|CORE_ASSIGN_STAGE.*find_section|CORE_ASSIGN_DETAIL.*find_section' "$stderr" || true
          echo CORE_BATCH_U2_TRACE_END
          src="$(find "$GITHUB_WORKSPACE/build/linux-focus-corpus" -type f -path '*/init/initramfs.i' | head -n1)"
          echo CORE_BATCH_U2_SOURCE_BEGIN
          printf 'CORE_BATCH_U2_SOURCE_FILE=%s\n' "$src"
          if test -n "$src"; then
            grep -n -A70 -B25 'find_section' "$src" | head -n 420 || true
          fi
          echo CORE_BATCH_U2_SOURCE_END
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 1 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-u2-frontier/frontier-summary.json').read_text())
          print(f"CORE_BATCH_U2_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['selected'] != 1 or f['error'] != 1:
              raise SystemExit(f"diagnostic changed unexpectedly: {f}")
          PY
