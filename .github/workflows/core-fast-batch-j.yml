name: Core Fast Batch M

on:
  pull_request:

permissions:
  contents: write

jobs:
  batch-m:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-m-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Enable compact progress telemetry
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-m-compiler

      - name: Diagnose one real ptep_get frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-m-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-m-diagnostic"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 1 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '56'
          replay_status=$?
          set -e
          printf 'CORE_BATCH_M_DIAGNOSTIC_STATUS=%d\n' "$replay_status"
          echo '--- failure context ---'
          cat "$work/failure-contexts.txt"
          echo '--- Core trace ---'
          find "$work/minic-stderr" -type f -name '*.stderr' -print0 | \
            xargs -0 grep -E 'CORE_FAST_TRACE|CORE_ASSIGN|ptep_get' || true
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 1 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-m-diagnostic/frontier-summary.json').read_text())
          print(f"CORE_BATCH_M_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']}")
          if f['selected'] != 1:
              raise SystemExit('expected exactly one diagnostic TU')
          if f['error'] != 0:
              raise SystemExit(f"unexpected Core ERROR: {f.get('errors', [])}")
          PY
