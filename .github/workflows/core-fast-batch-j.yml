name: Core Sprint Y23 Target Source Windows

on:
  pull_request:

permissions:
  contents: read

jobs:
  y23-target-source-windows:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-sprint-y23-target-source-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee86826c9106e30ffaf79cbace164372b3cb6a04
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Show exact near-pass source windows
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          echo CORE_SPRINT_Y23_MAIN_BEGIN
          sed -n '90590,90635p' build/linux-focus-corpus/kbuild/init/main.i
          echo CORE_SPRINT_Y23_MAIN_END
          echo CORE_SPRINT_Y23_SBI_BEGIN
          sed -n '18180,18230p' build/linux-focus-corpus/kbuild/arch/riscv/kernel/sbi.i
          echo CORE_SPRINT_Y23_SBI_END
