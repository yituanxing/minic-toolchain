name: Core Y65 Queue Conditional Guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  y65-queue-conditional-guard:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 884de084fe81cfcfead1ff31232600bb8333fb4f
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Patch guard trace and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''        /* M60_POINTER_CONDITIONAL_VALUE: C conditional values may be pointer\n           scalars as well as integers. The existing arm conversion, spill and\n           reload machinery is already scalar-generic, so keep the semantic\n           restriction at the Core scalar boundary rather than at integer-only. */\n        if (expression->value.conditional.uses_condition_value ||\n'''
          new='''        /* M60_POINTER_CONDITIONAL_VALUE: C conditional values may be pointer\n           scalars as well as integers. The existing arm conversion, spill and\n           reload machinery is already scalar-generic, so keep the semantic\n           restriction at the Core scalar boundary rather than at integer-only. */\n        if (context->source_function != NULL && context->source_function->name != NULL &&\n            strcmp(context->source_function->name, "queue_max_zone_append_sectors") == 0) {\n            (void)fprintf(stderr,\n                          "CORE_Y65_GUARD uses=%d true_invalid=%d false_invalid=%d memory_scalar=%d integer=%d pointer=%d const=%d volatile=%d true=%zu false=%zu condition=%zu span=%zu:%zu\\n",\n                          expression->value.conditional.uses_condition_value ? 1 : 0,\n                          expression->value.conditional.when_true == MINIC_EXPRESSION_INVALID ? 1 : 0,\n                          expression->value.conditional.when_false == MINIC_EXPRESSION_INVALID ? 1 : 0,\n                          core_memory_scalar_type(expression->type) ? 1 : 0,\n                          minic_type_is_integer(expression->type) ? 1 : 0,\n                          minic_type_is_pointer(expression->type) ? 1 : 0,\n                          minic_type_is_const(expression->type) ? 1 : 0,\n                          minic_type_is_volatile(expression->type) ? 1 : 0,\n                          expression->value.conditional.when_true,\n                          expression->value.conditional.when_false,\n                          expression->value.conditional.condition,\n                          expression->span.begin.line, expression->span.begin.column);\n        }\n        if (expression->value.conditional.uses_condition_value ||\n'''
          if s.count(old)!=1:
              raise SystemExit(f'guard anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-y65-compiler
      - name: Direct representative trace
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-y65-compiler/bin/minic"
          input="$GITHUB_WORKSPACE/build/linux-focus-corpus/kbuild/init/do_mounts_initrd.i"
          mkdir -p build/core-y65-direct
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 "$compiler" -S "$input" -o build/core-y65-direct/out.s \
            >build/core-y65-direct/stdout.log 2>build/core-y65-direct/stderr.log
          rc=$?
          set -e
          echo CORE_Y65_RC=$rc
          grep -E 'CORE_Y65|CORE_FAST_TRACE.*queue_max_zone_append_sectors' build/core-y65-direct/stderr.log || true
          test "$rc" -ne 0
