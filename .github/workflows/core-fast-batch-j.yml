name: Core Batch Y31 Cleanup Binary Diagnosis

on:
  pull_request:

permissions:
  contents: read

jobs:
  y31-diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-y31-diagnose-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eda1ef08377ef7d7ec06ac0151599e82d8317f4
      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
      - name: Show blocker source windows
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'CORE_BATCH_Y31_SOURCE_DEVICE_BEGIN'
          f=$(find build/linux-focus-corpus -type f -path '*/init/do_mounts.i' | head -n1)
          test -n "$f"
          sed -n '41945,41975p' "$f"
          echo 'CORE_BATCH_Y31_SOURCE_DEVICE_END'
          echo 'CORE_BATCH_Y31_SOURCE_BVEC_BEGIN'
          f=$(find build/linux-focus-corpus -type f -path '*/init/do_mounts_initrd.i' | head -n1)
          test -n "$f"
          sed -n '46155,46182p' "$f"
          echo 'CORE_BATCH_Y31_SOURCE_BVEC_END'
      - name: Add narrow semantic tracing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          s=p.read_text()
          old='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            (void)fprintf(stderr,\n                          "CORE_FAST_TRACE stage=statement reason=cleanup-context "\n                          "function=%s kind=%d span=%zu:%zu cleanup=%llu stop=%llu\\n",\n                          context->source_function->name,\n                          (int)statement->kind,\n                          statement->span.begin.line,\n                          statement->span.begin.column,\n                          (unsigned long long)statement->cleanup_context,\n                          (unsigned long long)statement->cleanup_stop_context);\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }'''
          new='''        if (statement->cleanup_context != statement->cleanup_stop_context) {\n            MinicCleanupContextId trace_context = statement->cleanup_context;\n            unsigned int trace_depth = 0U;\n            (void)fprintf(stderr,\n                          "CORE_FAST_TRACE stage=statement reason=cleanup-context "\n                          "function=%s kind=%d span=%zu:%zu cleanup=%llu stop=%llu\\n",\n                          context->source_function->name,\n                          (int)statement->kind,\n                          statement->span.begin.line,\n                          statement->span.begin.column,\n                          (unsigned long long)statement->cleanup_context,\n                          (unsigned long long)statement->cleanup_stop_context);\n            while (trace_context != statement->cleanup_stop_context && trace_depth < 8U) {\n                const MinicCleanupContext *cleanup = minic_c0_program_cleanup_context(\n                    context->body->program, trace_context);\n                const MinicExpression *cleanup_expression = cleanup != NULL\n                    ? minic_c0_program_expression(context->body->program, cleanup->cleanup_expression)\n                    : NULL;\n                (void)fprintf(stderr,\n                              "CORE_CLEANUP_DETAIL function=%s context=%llu parent=%llu expr=%llu "\n                              "expr_kind=%d expr_type_base=%d expr_ptr_depth=%u expr_span=%zu:%zu\\n",\n                              context->source_function->name,\n                              (unsigned long long)trace_context,\n                              cleanup != NULL ? (unsigned long long)cleanup->parent : ~0ULL,\n                              cleanup != NULL ? (unsigned long long)cleanup->cleanup_expression : ~0ULL,\n                              cleanup_expression != NULL ? (int)cleanup_expression->kind : -1,\n                              cleanup_expression != NULL ? (int)cleanup_expression->type.base_kind : -1,\n                              cleanup_expression != NULL ? cleanup_expression->type.pointer_depth : 0U,\n                              cleanup_expression != NULL ? cleanup_expression->span.begin.line : 0U,\n                              cleanup_expression != NULL ? cleanup_expression->span.begin.column : 0U);\n                if (cleanup == NULL || cleanup->parent == trace_context) {\n                    break;\n                }\n                trace_context = cleanup->parent;\n                trace_depth += 1U;\n            }\n            return MINIC_CORE_LOWER_UNSUPPORTED;\n        }'''
          if s.count(old)!=1: raise SystemExit(f'cleanup anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          # Trace the exact bvec_advance binary RHS before its normal lower path.
          anchor='''    if (expression == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }'''
          inject='''    if (expression == NULL) {\n        return MINIC_CORE_LOWER_ERROR;\n    }\n    if (context->source_function != NULL &&\n        strcmp(context->source_function->name, "bvec_advance") == 0 &&\n        expression->kind == MINIC_EXPRESSION_BINARY &&\n        expression->span.begin.line >= 46160U && expression->span.begin.line <= 46175U) {\n        const MinicExpression *left = minic_c0_program_expression(\n            context->body->program, expression->value.binary.left);\n        const MinicExpression *right = minic_c0_program_expression(\n            context->body->program, expression->value.binary.right);\n        (void)fprintf(stderr,\n                      "CORE_BINARY_DETAIL function=bvec_advance expr=%llu op=%d span=%zu:%zu "\n                      "type_base=%d ptr=%u left=%llu left_kind=%d left_base=%d left_ptr=%u left_cat=%d "\n                      "right=%llu right_kind=%d right_base=%d right_ptr=%u right_cat=%d\\n",\n                      (unsigned long long)expression_id,\n                      (int)expression->value.binary.operator_kind,\n                      expression->span.begin.line, expression->span.begin.column,\n                      (int)expression->type.base_kind, expression->type.pointer_depth,\n                      (unsigned long long)expression->value.binary.left,\n                      left != NULL ? (int)left->kind : -1,\n                      left != NULL ? (int)left->type.base_kind : -1,\n                      left != NULL ? left->type.pointer_depth : 0U,\n                      left != NULL ? (int)left->value_category : -1,\n                      (unsigned long long)expression->value.binary.right,\n                      right != NULL ? (int)right->kind : -1,\n                      right != NULL ? (int)right->type.base_kind : -1,\n                      right != NULL ? right->type.pointer_depth : 0U,\n                      right != NULL ? (int)right->value_category : -1);\n    }'''
          # lower_expression has several expression fetches; place only in the definition area by last matching occurrence.
          pos=s.rfind(anchor)
          if pos<0: raise SystemExit('expression anchor')
          s=s[:pos]+s[pos:].replace(anchor,inject,1)
          p.write_text(s)
          print('CORE_BATCH_Y31_TRACE_PATCHED')
          PY
      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-y31-compiler
      - name: Replay representative blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-y31-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-y31"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 2 --offset 0 --limit 500 --sample-count 0 --indices '2,3'
          status=$?
          set -e
          echo CORE_BATCH_Y31_REPLAY_STATUS=$status
          echo CORE_BATCH_Y31_DETAILS_BEGIN
          grep -R -E 'CORE_CLEANUP_DETAIL|CORE_BINARY_DETAIL|CORE_ASSIGN_STAGE|CORE_FAST_TRACE' "$work/minic-stderr" | grep -E 'device_has_driver_override|bvec_advance' || true
          echo CORE_BATCH_Y31_DETAILS_END
          python3 tools/ci/classify-core-strict-frontier.py "$work/batch-results.json" --examples 4
