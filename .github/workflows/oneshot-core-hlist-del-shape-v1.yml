name: One-shot Core Hlist Del Shape

on:
  pull_request:

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Build compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-hlist-del-probe
      - name: Probe hlist delete shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-hlist-del-probe/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-hlist-del-shapes"
          mkdir -p "$work"

          cat > "$work/pp_store.i" <<'EOF'
          struct node { struct node *next; struct node **pprev; };
          void probe(struct node *n) {
              struct node *next = n->next;
              struct node **pprev = n->pprev;
              *pprev = next;
          }
          EOF

          cat > "$work/volatile_pp_store.i" <<'EOF'
          struct node { struct node *next; struct node **pprev; };
          void probe(struct node *n) {
              struct node *next = n->next;
              struct node **pprev = n->pprev;
              *(struct node * volatile *)pprev = next;
          }
          EOF

          cat > "$work/pointer_if.i" <<'EOF'
          struct node { struct node *next; struct node **pprev; };
          void probe(struct node *next, struct node **pprev) {
              if (next)
                  next->pprev = pprev;
          }
          EOF

          cat > "$work/combined.i" <<'EOF'
          struct node { struct node *next; struct node **pprev; };
          void probe(struct node *n) {
              struct node *next = n->next;
              struct node **pprev = n->pprev;
              *pprev = next;
              if (next)
                  next->pprev = pprev;
          }
          EOF

          cat > "$work/write_once.i" <<'EOF'
          #define WRITE_ONCE(x, val) ({ (*(volatile __typeof__(x) *)&(x)) = (val); })
          struct node { struct node *next; struct node **pprev; };
          void probe(struct node *n) {
              struct node *next = n->next;
              struct node **pprev = n->pprev;
              WRITE_ONCE(*pprev, next);
              if (next)
                  WRITE_ONCE(next->pprev, pprev);
          }
          EOF

          for shape in pp_store volatile_pp_store pointer_if combined write_once; do
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$work/$shape.i" -o "$work/$shape.s" 2>"$work/$shape.err"
            rc=$?
            set -e
            printf 'CORE_HLIST_SHAPE name=%s rc=%d message=' "$shape" "$rc"
            tr '\n' ' ' < "$work/$shape.err"
            printf '\n'
          done
