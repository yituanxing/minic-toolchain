name: Core M125 Memory Input Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  memory-input:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized family
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M125_STRUCTURED_MEMORY_INPUT_ASM' src/core/core_ir.h; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M125 structured memory input
        if: steps.state.outputs.needs_patch == 'true'
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m125-memory-input-structured-asm.py
          git diff --check
          grep -Fq 'MINIC_CORE_STRUCTURED_INLINE_ASM_MEMORY_INPUT' src/core/core_ir.h
          grep -Fq 'M125_STRUCTURED_MEMORY_INPUT_ASM' src/core/core_lower.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m125-memory-input-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m125-memory-input-check

      - name: Replay exact 20 memory-input first blockers
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m125-memory-input-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m125-memory-input-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '23,33,49,146,155,180,182,183,184,232,243,244,246,267,274,295,300,322,445,477'
          replay_status=$?
          set -e
          printf 'CORE_M125_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          work = Path('build/m125-memory-input-focused')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if summary['selected'] != 20:
              raise SystemExit(f"expected 20 focused TUs, got {summary['selected']}")
          if summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(
                  f"focused ERROR/missing: error={summary['error']} missing={summary['preprocess_missing']}"
              )
          print(
              f"CORE_M125_FOCUSED selected=20 pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error=0"
          )
          print((work / 'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m125-memory-input-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m125-memory-input-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M125_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          work = Path('build/m125-memory-input-full500')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if summary['selected'] != 500:
              raise SystemExit(f"expected 500 TUs, got {summary['selected']}")
          if summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(
                  f"full500 ERROR/missing: error={summary['error']} missing={summary['preprocess_missing']}"
              )
          if summary['pass'] < 424:
              raise SystemExit(
                  f"M125 regressed strict500: pass={summary['pass']} baseline=424"
              )
          print(
              f"CORE_M125_FULL500 selected=500 pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error=0"
          )
          print((work / 'progress-summary.txt').read_text())
          print((work / 'reason-summary.txt').read_text())
          PY

      - name: Commit M125 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c \
                  src/target/riscv64/core_codegen.c tests/compiler/c0/run-gnu-inline-asm-operands.sh
          git diff --cached --quiet && { echo 'no semantic changes to productize'; exit 1; }
          git commit -m 'core: model read-only structured asm memory inputs'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M125 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m125-memory-input-${{ github.sha }}
          path: |
            build/m125-memory-input-focused/batch-results.json
            build/m125-memory-input-focused/frontier-summary.json
            build/m125-memory-input-focused/reason-summary.txt
            build/m125-memory-input-focused/minic-stderr/**
            build/m125-memory-input-full500/batch-results.json
            build/m125-memory-input-full500/frontier-summary.json
            build/m125-memory-input-full500/reason-summary.txt
            build/m125-memory-input-full500/progress-summary.json
            build/m125-memory-input-full500/progress-summary.txt
            build/m125-memory-input-full500/minic-stderr/**
          if-no-files-found: warn
