name: Staging Apply Comma UAF Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/staging-apply-comma-uaf.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply stable comma-expression span fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/parser_expression.c')
          source = path.read_text()
          old = '''        while (parser->current.kind == MINIC_TOKEN_COMMA) {
              const MinicExpression *left_expression;
              const MinicExpression *right_expression;
              MinicExpression comma_expression;
              MinicExpressionId right_id;

              left_expression = minic_c0_program_expression(parser->program, primary_id);
              if (left_expression == NULL || !minic_parser_advance(parser) ||
                  !parse_expression_internal(parser, &right_id, 0U, true)) {
                  return false;
              }
              right_expression = minic_c0_program_expression(parser->program, right_id);
              if (right_expression == NULL) {
                  minic_parser_error(parser, "invalid comma expression operand");
                  return false;
              }
              (void)memset(&comma_expression, 0, sizeof(comma_expression));
              comma_expression.kind = MINIC_EXPRESSION_BINARY;
              comma_expression.span.begin = left_expression->span.begin;
              comma_expression.span.end = right_expression->span.end;
'''
          new = '''        while (parser->current.kind == MINIC_TOKEN_COMMA) {
              const MinicExpression *left_expression;
              const MinicExpression *right_expression;
              MinicExpression comma_expression;
              MinicExpressionId right_id;
              MinicSourcePosition left_begin;

              left_expression = minic_c0_program_expression(parser->program, primary_id);
              if (left_expression == NULL) {
                  minic_parser_error(parser, "invalid comma expression operand");
                  return false;
              }
              left_begin = left_expression->span.begin;
              if (!minic_parser_advance(parser) ||
                  !parse_expression_internal(parser, &right_id, 0U, true)) {
                  return false;
              }
              right_expression = minic_c0_program_expression(parser->program, right_id);
              if (right_expression == NULL) {
                  minic_parser_error(parser, "invalid comma expression operand");
                  return false;
              }
              (void)memset(&comma_expression, 0, sizeof(comma_expression));
              comma_expression.kind = MINIC_EXPRESSION_BINARY;
              comma_expression.span.begin = left_begin;
              comma_expression.span.end = right_expression->span.end;
'''
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('comma-expression patch anchor not found')
          PY
          git diff --check

      - name: Commit materialized source fix
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- src/frontend/parser_expression.c; then
            echo 'Source fix already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_expression.c
          git commit -m 'frontend: keep comma spans stable across expression growth'
          git push origin HEAD:${{ github.head_ref }}
