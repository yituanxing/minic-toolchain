name: Staging Format Composite Header

on:
  push:
    branches:
      - staging/external-array-composite-v1

permissions:
  contents: write

jobs:
  format-header:
    if: ${{ !contains(github.event.head_commit.message, '[format-publish]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format parser internal header
        run: clang-format-18 -i src/frontend/parser_internal.h
      - name: Publish formatted header
        run: |
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add src/frontend/parser_internal.h
          git diff --cached --check
          git commit -m 'chore(staging): format composite header [format-publish]'
          git push origin HEAD:staging/external-array-composite-v1
