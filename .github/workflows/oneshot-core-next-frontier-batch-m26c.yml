name: One-shot Core Next Frontier Batch M26c

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Build strict compiler once
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m26c-probe

      - name: Extract three exact frozen blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('build/linux-focus-corpus/kbuild')
          names = ['__iter_div_u64_rem', 'generic___change_bit', 'IS_ERR_OR_NULL']

          def definition(text, name):
              for m in re.finditer(r'\b' + re.escape(name) + r'\s*\(', text):
                  i = text.find('(', m.start())
                  depth = 0
                  end_paren = None
                  for j in range(i, len(text)):
                      c = text[j]
                      if c == '(':
                          depth += 1
                      elif c == ')':
                          depth -= 1
                          if depth == 0:
                              end_paren = j + 1
                              break
                  if end_paren is None:
                      continue
                  semi = text.find(';', end_paren)
                  brace = text.find('{', end_paren)
                  if brace < 0 or (semi >= 0 and semi < brace):
                      continue
                  start = text.rfind('\n', 0, max(0, m.start() - 800)) + 1
                  depth = 0
                  end = None
                  for j in range(brace, len(text)):
                      c = text[j]
                      if c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = j + 1
                              break
                  if end is not None:
                      return text[start:end]
              return None

          files = list(root.rglob('*.i'))
          for name in names:
              found = False
              for p in files:
                  try:
                      text = p.read_text(errors='replace')
                  except OSError:
                      continue
                  if name not in text:
                      continue
                  body = definition(text, name)
                  if body is None:
                      continue
                  print(f'CORE_M26C_EXACT_BEGIN name={name} file={p}')
                  print(body)
                  print(f'CORE_M26C_EXACT_END name={name}')
                  found = True
                  break
              if not found:
                  print(f'CORE_M26C_EXACT_MISSING name={name}')
          PY

      - name: Probe likely same-layer gaps
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m26c-probe/bin/minic"
          w="$GITHUB_WORKSPACE/build/core-m26c-shapes"
          mkdir -p "$w"

          cat > "$w/compound_xor.i" <<'EOF'
          void probe(unsigned long *p, unsigned long mask) { *p ^= mask; }
          EOF

          cat > "$w/logical_or_value.i" <<'EOF'
          int probe(const void *ptr) {
              return !ptr || ((unsigned long)ptr >= (unsigned long)-4095L);
          }
          EOF

          cat > "$w/pre_update.i" <<'EOF'
          unsigned long probe(unsigned long value) { return ++value; }
          EOF

          for n in compound_xor logical_or_value pre_update; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "$w/$n.i" -o "$w/$n.s" 2>"$w/$n.err"
              rc=$?
              set -e
              printf 'CORE_M26C_SHAPE name=%s rc=%d message=' "$n" "$rc"
              tr '\n' ' ' < "$w/$n.err"
              printf '\n'
          done
