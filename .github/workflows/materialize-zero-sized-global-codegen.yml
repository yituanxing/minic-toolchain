name: Materialize zero-sized GlobalObject emission

on:
  push:
    branches: [agent/linux-tail-pointer-array-v1]
    paths:
      - tools/dev/materialize-zero-sized-global-codegen.py
      - .github/workflows/materialize-zero-sized-global-codegen.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linux-tail-pointer-array-v1
          fetch-depth: 0
      - name: Materialize product code
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-zero-sized-global-codegen.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build and run focused gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/zero-global
          MINIC="$GITHUB_WORKSPACE/build/zero-global/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/empty-record-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-empty-records.sh
          MINIC="$GITHUB_WORKSPACE/build/zero-global/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/array-param-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-array-parameter-adjustment.sh
          MINIC="$GITHUB_WORKSPACE/build/zero-global/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-array-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-static-pointer-arrays.sh
      - name: Write clean product commit
        run: |
          set -Eeuo pipefail
          git rm tools/dev/materialize-zero-sized-global-codegen.py \
                 .github/workflows/materialize-zero-sized-global-codegen.yml
          git add src/target/riscv64/codegen_function.c \
                  tests/compiler/c0/gnu_empty_records.c \
                  tests/compiler/c0/run-gnu-empty-records.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(riscv64): emit zero-sized static objects'
          git push origin HEAD:agent/linux-tail-pointer-array-v1
