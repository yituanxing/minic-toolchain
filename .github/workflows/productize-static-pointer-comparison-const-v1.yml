name: Productize static pointer comparison const v1

on:
  pull_request:
    paths:
      - 'tools/dev/materialize-static-pointer-comparison-const-v1.py'
      - '.github/workflows/productize-static-pointer-comparison-const-v1.yml'
      - 'src/frontend/parser_global.c'
      - 'tests/compiler/c0/static_object_address_relocation.c'
      - 'tests/compiler/c0/run-static-object-address-relocation.sh'

permissions:
  contents: read

jobs:
  productize:
    name: Materialize static pointer comparison const
    if: ${{ github.head_ref == 'frontend/static-pointer-comparison-const-v1' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout capability branch
        uses: actions/checkout@v4
        with:
          ref: frontend/static-pointer-comparison-const-v1
          fetch-depth: 0

      - name: Materialize canonical capability
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-static-pointer-comparison-const-v1.py
          rm tools/dev/materialize-static-pointer-comparison-const-v1.py
          rm .github/workflows/productize-static-pointer-comparison-const-v1.yml

      - name: Format and validate focused ownership
        run: |
          set -Eeuo pipefail
          mapfile -t changed_c < <(git diff --name-only -- '*.c' '*.h')
          if (( ${#changed_c[@]} != 0 )); then
            clang-format-18 -i "${changed_c[@]}"
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-static-pointer-comparison
          MINIC="$GITHUB_WORKSPACE/build/product-static-pointer-comparison/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-static-pointer-comparison" \
            sh tests/compiler/c0/run-static-object-address-relocation.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-static-pointer-comparison-fast

      - name: Publish clean product slice
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: fold proven static pointer comparisons'
          git push origin HEAD:frontend/static-pointer-comparison-const-v1
