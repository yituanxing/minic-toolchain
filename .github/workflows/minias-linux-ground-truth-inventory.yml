name: MiniAS Linux Ground Truth Inventory

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_VERSION: "6.6.143"
  LINUX_ARCHIVE_SHA256: "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-ground-truth]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux RISC-V build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev dwarves

      - name: Build exact GNU RISC-V defconfig kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-ground-truth-src"
          out="$GITHUB_WORKSPACE/build/linux-ground-truth-out"
          archive="$GITHUB_WORKSPACE/build/linux-${LINUX_VERSION}.tar.xz"
          mkdir -p build
          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          rm -rf "$src" "$out"
          mkdir -p "$src" "$out"
          tar -xJf "$archive" -C "$src" --strip-components=1
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          started=$(date +%s)
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4
          ended=$(date +%s)
          echo "LINUX_GROUND_TRUTH_BUILD_SECONDS=$((ended-started))"
          test -s "$out/vmlinux"

      - name: Classify actual compiled object inputs from cmd files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from collections import Counter
          import json, re

          out = Path("build/linux-ground-truth-out").resolve()
          src = Path("build/linux-ground-truth-src").resolve()
          output_re = re.compile(r"(?:^|\s)-o\s+([^\s;]+\.o)(?=\s|;|$)")
          source_re = re.compile(r"(?:^|\s)([^\s;]+\.(?:c|S|s|rs))(?=\s|;|$)")
          rows = {}
          unmatched_target_cmds=[]

          for cmdfile in out.rglob(".*.cmd"):
              try: text=cmdfile.read_text(errors="replace")
              except OSError: continue
              for line in text.splitlines():
                  if ":=" not in line or " -c " not in f" {line} ":
                      continue
                  objects=output_re.findall(line)
                  sources=source_re.findall(line)
                  if not objects or not sources:
                      continue
                  raw_obj=objects[-1].strip("'\"")
                  obj=Path(raw_obj)
                  if obj.is_absolute():
                      try: rel_obj=obj.resolve().relative_to(out)
                      except ValueError: continue
                  else:
                      rel_obj=obj
                  rel_text=PurePosixPath(rel_obj.as_posix()).as_posix()
                  if rel_text.startswith(("scripts/","tools/")) or "/scripts/" in rel_text:
                      continue
                  raw_src=sources[-1].strip("'\"")
                  suffix=Path(raw_src).suffix
                  kind={".c":"c",".S":"asm_preprocessed",".s":"asm_raw",".rs":"rust"}[suffix]
                  rows[rel_text]={"kind":kind,"source":raw_src,"cmdfile":str(cmdfile.relative_to(out))}

          counts=Counter(row["kind"] for row in rows.values())
          native=counts["asm_preprocessed"]+counts["asm_raw"]
          assembler_inputs=counts["c"]+native
          result={
              "linux":"6.6.143","arch":"riscv","config":"defconfig",
              "classified_object_compile_rules":len(rows),
              "c":counts["c"],
              "asm_preprocessed":counts["asm_preprocessed"],
              "asm_raw":counts["asm_raw"],
              "native_asm_total":native,
              "rust":counts["rust"],
              "assembler_inputs_without_rust":assembler_inputs,
          }
          Path("build/minias-ground-truth-inventory.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          Path("build/minias-ground-truth-native-asm.tsv").write_text("\n".join(
              f"{obj}\t{row['kind']}\t{row['source']}\t{row['cmdfile']}"
              for obj,row in sorted(rows.items()) if row["kind"].startswith("asm_")
          )+"\n")
          Path("build/minias-ground-truth-rust.tsv").write_text("\n".join(
              f"{obj}\t{row['source']}\t{row['cmdfile']}"
              for obj,row in sorted(rows.items()) if row["kind"]=="rust"
          )+"\n")
          print(
              "MINIAS_GROUND_TRUTH_INVENTORY "
              f"c={counts['c']} native_S={counts['asm_preprocessed']} native_s={counts['asm_raw']} "
              f"native_asm_total={native} rust={counts['rust']} "
              f"assembler_inputs_without_rust={assembler_inputs} classified_objects={len(rows)}"
          )
          PY
          cat build/minias-ground-truth-inventory.json

      - uses: actions/upload-artifact@v4
        with:
          name: minias-linux-ground-truth-inventory
          path: |
            build/minias-ground-truth-inventory.json
            build/minias-ground-truth-native-asm.tsv
            build/minias-ground-truth-rust.tsv
          retention-days: 30
          if-no-files-found: error