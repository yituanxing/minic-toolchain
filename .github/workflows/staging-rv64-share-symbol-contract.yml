name: Staging RV64 Share Symbol Contract

on:
  push:
    branches:
      - staging/rv64-function-symbol-contract-v0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Share target symbol contract with legacy emitter
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/target/riscv64/codegen_function.c")
          text = path.read_text()
          marker = '#include "target/riscv64/function_symbol.h"'
          if marker in text:
              raise SystemExit(0)

          text = text.replace(
              '#include "target/riscv64/codegen_internal.h"\n#include "target/data_layout.h"',
              '#include "target/riscv64/codegen_internal.h"\n#include "target/riscv64/function_symbol.h"\n#include "target/data_layout.h"',
              1,
          )
          text = text.replace(
              '    MinicRiscv64FunctionLayout function_layout;\n'
              '    MinicRiscv64FrameLayout frame_layout;\n'
              '    size_t frame_size;',
              '    MinicRiscv64FunctionLayout function_layout;\n'
              '    MinicRiscv64FrameLayout frame_layout;\n'
              '    MinicRiscv64FunctionSymbol symbol;\n'
              '    size_t frame_size;',
              1,
          )
          old_symbol = '''    frame_size = frame_layout.frame_size;
              symbol_name = minic_c0_function_symbol_name(function);
              if (symbol_name == NULL || symbol_name[0] == '\\0') {
                  minic_riscv64_function_layout_destroy(&function_layout);
                  return false;
              }

              success = function->section_name != NULL
                            ? fprintf(file, ".section %s\\n", function->section_name) >= 0
                            : fprintf(file, ".text\\n") >= 0;
              if (success && !function->is_internal) {
                  success = fprintf(file, function->is_weak ? ".weak %s\\n" : ".globl %s\\n", symbol_name) >= 0;
                  if (success && function->visibility != MINIC_SYMBOL_VISIBILITY_DEFAULT) {
                      const char *directive;

                      directive = function->visibility == MINIC_SYMBOL_VISIBILITY_HIDDEN      ? ".hidden"
                                  : function->visibility == MINIC_SYMBOL_VISIBILITY_INTERNAL  ? ".internal"
                                  : function->visibility == MINIC_SYMBOL_VISIBILITY_PROTECTED ? ".protected"
                                                                                              : NULL;
                      success = directive != NULL && fprintf(file, "%s %s\\n", directive, symbol_name) >= 0;
                  }
              }
              if (success) {
                  success = fprintf(file,
                                    ".type %s, @function\\n"
                                    "%s:\\n",
                                    symbol_name,
                                    symbol_name) >= 0;
              }
          '''
          new_symbol = '''    frame_size = frame_layout.frame_size;
              if (!minic_riscv64_function_symbol_from_function(function, &symbol)) {
                  minic_riscv64_function_layout_destroy(&function_layout);
                  return false;
              }
              symbol_name = symbol.symbol_name;

              success = minic_riscv64_emit_function_symbol_begin(file, &symbol);
          '''
          if old_symbol not in text:
              raise SystemExit("legacy symbol prelude did not match expected source")
          text = text.replace(old_symbol, new_symbol, 1)

          old_end = '''    if (success) {
                  success = fprintf(file,
                                    "  ret\\n"
                                    ".size %s, .-%s\\n",
                                    symbol_name,
                                    symbol_name) >= 0;
              }
          '''
          new_end = '''    if (success) {
                  success = fprintf(file, "  ret\\n") >= 0 &&
                            minic_riscv64_emit_function_symbol_end(file, &symbol);
              }
          '''
          if old_end not in text:
              raise SystemExit("legacy symbol epilogue did not match expected source")
          text = text.replace(old_end, new_end, 1)
          path.write_text(text)
          PY
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          if git diff --quiet -- src/target/riscv64/codegen_function.c; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/target/riscv64/codegen_function.c
          git commit -m "refactor(target): share RV64 function symbol emission"
          git push origin HEAD:staging/rv64-function-symbol-contract-v0
