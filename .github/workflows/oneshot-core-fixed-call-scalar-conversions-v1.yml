name: One-shot Core Fixed Call Scalar Conversions

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Apply Core M3 slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-fixed-call-scalar-conversions-v1.py
          python3 tools/dev/patch-core-fixed-call-scalar-conversions-v1.py
          clang-format-18 -i \
            src/core/core_lower.c \
            tests/compiler/c0/core_fixed_call_scalar_conversions.c \
            tests/compiler/c0/core_fixed_call_scalar_conversions_runtime.c
          sh -n tests/compiler/c0/run-core-fixed-call-scalar-conversions.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check

      - name: Validate fixed-call scalar conversions
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m3-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m3-compiler/bin/minic"
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m3-focused" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-fixed-call-scalar-conversions.sh

          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-shadow-m3" \
            bash tests/core/run-core-ir-shadow.sh

          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S \
            tests/target/riscv64/core_hybrid_differential.i \
            -o build/core-m3-focused/hybrid.s
          grep -q '^\.Lcore_hybrid_fallback_load_core_bb0:' build/core-m3-focused/hybrid.s
          grep -q '^\.Lcore_hybrid_fallback_indirect_return:' build/core-m3-focused/hybrid.s
          if grep -q '^\.Lcore_hybrid_fallback_indirect_core_bb' build/core-m3-focused/hybrid.s; then
            printf '%s\n' 'indirect-call sentinel unexpectedly became Core-owned' >&2
            exit 1
          fi
          printf '%s\n' 'PASS core/m3-fixed-call-scalar-conversions'

      - name: Publish Core M3 slice
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-fixed-call-scalar-conversions-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_lower.c \
            tests/compiler/c0/core_fixed_call_scalar_conversions.c \
            tests/compiler/c0/core_fixed_call_scalar_conversions_runtime.c \
            tests/compiler/c0/run-core-fixed-call-scalar-conversions.sh \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-fixed-call-scalar-conversions-v1.py
          git diff --cached --check
          git commit -m 'core: lower fixed-call scalar conversions'
          git push origin HEAD:refactor/declaration-sema-v1
