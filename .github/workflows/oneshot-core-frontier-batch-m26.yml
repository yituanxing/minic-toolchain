name: One-shot Core Frontier Batch M26

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Build strict compiler once
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m26-probe

      - name: Extract top five exact frozen blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('build/linux-focus-corpus/kbuild')
          names = [
              'cpu_to_be32_array',
              'reciprocal_scale',
              'generic___set_bit',
              'IS_ERR',
              'in_range64',
          ]

          def definition(text, name):
              for m in re.finditer(r'\b' + re.escape(name) + r'\s*\(', text):
                  i = text.find('(', m.start())
                  depth = 0
                  end_paren = None
                  for j in range(i, len(text)):
                      c = text[j]
                      if c == '(':
                          depth += 1
                      elif c == ')':
                          depth -= 1
                          if depth == 0:
                              end_paren = j + 1
                              break
                  if end_paren is None:
                      continue
                  semi = text.find(';', end_paren)
                  brace = text.find('{', end_paren)
                  if brace < 0 or (semi >= 0 and semi < brace):
                      continue
                  start = text.rfind('\n', 0, max(0, m.start() - 1200)) + 1
                  depth = 0
                  end = None
                  for j in range(brace, len(text)):
                      c = text[j]
                      if c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = j + 1
                              break
                  if end is not None:
                      return text[start:end]
              return None

          files = list(root.rglob('*.i'))
          for name in names:
              found = False
              for p in files:
                  try:
                      text = p.read_text(errors='replace')
                  except OSError:
                      continue
                  if name not in text:
                      continue
                  body = definition(text, name)
                  if body is None:
                      continue
                  print(f'CORE_M26_EXACT_BEGIN name={name} file={p}')
                  print(body)
                  print(f'CORE_M26_EXACT_END name={name}')
                  found = True
                  break
              if not found:
                  print(f'CORE_M26_EXACT_MISSING name={name}')
          PY

      - name: Probe same-class CFG value lifetime matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m26-probe/bin/minic"
          w="$GITHUB_WORKSPACE/build/core-m26-shapes"
          mkdir -p "$w"

          cat > "$w/shift_rhs_cfg.i" <<'EOF'
          unsigned long slow(unsigned long v) { return v + 1UL; }
          unsigned long probe(unsigned long a, unsigned long *p) {
              return a << (__builtin_constant_p(*p) ? *p : slow(*p));
          }
          EOF

          cat > "$w/multiarg_cfg.i" <<'EOF'
          unsigned long slow(unsigned long v) { return v + 1UL; }
          unsigned long sink(unsigned long a, unsigned long b) { return a + b; }
          unsigned long probe(unsigned long *p, unsigned long *q) {
              return sink(__builtin_constant_p(*p) ? *p : slow(*p),
                          __builtin_constant_p(*q) ? *q : slow(*q));
          }
          EOF

          cat > "$w/compound_and_rhs_cfg.i" <<'EOF'
          unsigned long slow(unsigned long v) { return v + 1UL; }
          void probe(unsigned long *p, unsigned long *q) {
              *p &= (__builtin_constant_p(*q) ? *q : slow(*q));
          }
          EOF

          cat > "$w/assignment_lvalue_cfg.i" <<'EOF'
          void probe(unsigned long *p, unsigned long *q, unsigned long value, int choose) {
              *(choose ? p : q) = value;
          }
          EOF

          for n in shift_rhs_cfg multiarg_cfg compound_and_rhs_cfg assignment_lvalue_cfg; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "$w/$n.i" -o "$w/$n.s" 2>"$w/$n.err"
              rc=$?
              set -e
              printf 'CORE_M26_LIFETIME name=%s rc=%d message=' "$n" "$rc"
              tr '\n' ' ' < "$w/$n.err"
              printf '\n'
          done
