name: Agent Record Call Copy

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.head_ref == 'refactor/foundation-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-call-copy-v0
          fetch-depth: 0
      - name: Generate and validate slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_record_call_copy_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/record-call-copy-compiler
          MINIC="$GITHUB_WORKSPACE/build/record-call-copy-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-call-copy-focused" \
            sh tests/compiler/c0/run-gnu-statement-record-value.sh
          MINIC="$GITHUB_WORKSPACE/build/record-call-copy-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-call-copy-focused-all" \
            sh tools/dev/pr76-focused.sh
          make -j4 MODE=release BUILD_DIR=build/record-call-copy-compiler check-fast
      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/ast.h \
            src/frontend/ast.c \
            src/frontend/ast_verifier.c \
            src/frontend/parser_statement.c \
            src/frontend/parser_expression.c \
            src/target/riscv64/codegen_internal.h \
            src/target/riscv64/codegen_expression.c \
            src/target/riscv64/codegen_statement.c \
            tests/compiler/c0/run-gnu-statement-record-value.sh
          git diff --cached --check
          git diff --cached --quiet && {
            printf '%s\n' 'generator produced no source changes' >&2
            exit 1
          }
          git commit -m '[generated] frontend: accept register-backed record copy sources' \
            -m 'Extend whole-record copy semantics from address-backed record values to direct record-returning calls supported by the current RV64 integer-aggregate ABI. Keep C value categories unchanged, classify copy-source capability explicitly in the AST layer, and converge statement/expression record-copy lowering on one RV64 materializer that snapshots either an address-backed object or a0/a1 into the same alias-safe temporary. Preserve the 24-byte aggregate boundary.\n\n将 whole-record copy 从 address-backed record value 扩展到当前 RV64 integer-aggregate ABI 支持的直接 record-returning call。保持 C value category 不变，在 AST 层显式分类 copy-source 能力，并让 statement/expression 两条 record-copy lowering 共用一个 RV64 materializer：无论来源是对象地址还是 a0/a1，都先快照到同一个 alias-safe 临时对象。继续保留 24-byte aggregate 的受限边界。'
          git push origin HEAD:agent/record-call-copy-v0 --force-with-lease
