name: Diagnostic Core IR First100 Parameter Reasons V1

on:
  push:
    branches:
      - diagnostic/core-ir-first100-parameter-reasons-v1

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
      - name: Install Linux Kbuild dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Instrument parameter unsupported subfamilies
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/core_lower.c')
          s = p.read_text()
          s = s.replace('#include <stdlib.h>\n#include <string.h>\n',
                        '#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n', 1)
          anchor = '''static MinicCoreLowerStatus
          lower_block(MinicCoreLowerContext *context, const MinicBlock *source_block, bool *terminated);
          '''
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + '''
          static MinicCoreLowerStatus core_diag_parameter_unsupported(const char *reason) {
              (void)fprintf(stderr, "MINIC_CORE_PARAMETER_REASON reason=%s\\n", reason);
              return MINIC_CORE_LOWER_UNSUPPORTED;
          }
          ''', 1)
          old = '''        if (!minic_type_is_integer(parameter->type) || minic_type_is_const(parameter->type) ||
                      minic_type_is_volatile(parameter->type) || parameter->is_array ||
                      parameter->is_register_storage) {
                      return MINIC_CORE_LOWER_UNSUPPORTED;
                  }
          '''
          new = '''        if (parameter->is_array) {
                      return core_diag_parameter_unsupported("array");
                  }
                  if (parameter->is_register_storage) {
                      return core_diag_parameter_unsupported("register_storage");
                  }
                  if (minic_type_is_const(parameter->type) || minic_type_is_volatile(parameter->type)) {
                      return core_diag_parameter_unsupported("top_level_qualified");
                  }
                  if (minic_type_is_pointer(parameter->type)) {
                      return core_diag_parameter_unsupported("pointer");
                  }
                  if (!minic_type_is_integer(parameter->type)) {
                      return core_diag_parameter_unsupported("noninteger_other");
                  }
          '''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build diagnostic compiler
        run: make -j4 MODE=release BUILD_DIR=build/core-parameter-reasons-compiler
      - name: Drive fixed first100 with Core shadow
        continue-on-error: true
        env:
          MINIC_CORE_IR: shadow
        run: |
          MINIC="$GITHUB_WORKSPACE/build/core-parameter-reasons-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-parameter-reasons-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh
      - name: Aggregate parameter reasons
        if: always()
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          out = Path('build/core-parameter-reasons-linux')
          out.mkdir(parents=True, exist_ok=True)
          root = out / 'minic-stderr'
          pat = re.compile(r'^MINIC_CORE_PARAMETER_REASON reason=(.+)$')
          c = Counter()
          for p in root.rglob('*.stderr') if root.is_dir() else []:
              for line in p.read_text(errors='replace').splitlines():
                  m = pat.match(line.strip())
                  if m: c[m.group(1)] += 1
          total = sum(c.values())
          lines = ['MINIC_CORE_FIRST100_PARAMETER_REASONS', f'total_parameter_unsupported={total}']
          for reason, count in c.most_common():
              lines.append(f'{reason}={count} ({(100.0*count/total if total else 0.0):.2f}%)')
          text='\n'.join(lines)+'\n'
          (out/'core-parameter-reasons.txt').write_text(text)
          print(text,end='')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-ir-first100-parameter-reasons-${{ github.run_id }}
          path: |
            build/core-parameter-reasons-linux/core-parameter-reasons.txt
            build/core-parameter-reasons-linux/batch-summary.txt
          if-no-files-found: ignore
          retention-days: 7
