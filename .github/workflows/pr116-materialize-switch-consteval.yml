name: PR116 Materialize Switch ConstEval
on:
  push:
    branches: [agent/switch-typed-consteval-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize switch typed consteval
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr116-materialize.py
          clang-format-18 -i src/frontend/parser_statement.c tests/compiler/c0/switch_typed_consteval.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr116-focused" HOST_CC=cc sh tests/compiler/c0/run-switch-control-flow.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr116-materialize.py .github/workflows/pr116-materialize-switch-consteval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(frontend): share typed consteval for switch cases'
          git push origin HEAD:agent/switch-typed-consteval-v0
