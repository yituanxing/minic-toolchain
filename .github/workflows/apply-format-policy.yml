name: Apply format policy integration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/format-policy.ready'

permissions:
  contents: write

concurrency:
  group: apply-format-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: build/format-policy
          fetch-depth: 0

      - name: Apply permanent format policy
        shell: bash
        run: |
          set -Eeuo pipefail
          clang-format-18 --version
          python3 .github/scripts/apply-format-policy.py
          sh tools/maintenance/check-production-source-inventory.sh
          bash tools/maintenance/run-format.sh check
          sh -n tools/maintenance/check-production-source-inventory.sh
          bash -n tools/maintenance/run-format.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check

          test ! -e .github/scripts/apply-format-policy.py
          test ! -e .github/workflows/apply-format-policy.yml
          test ! -e .github/format-policy.ready

      - name: Commit formatted permanent tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "build: enforce the first-party format policy

          Replace the placeholder Makefile targets with clang-format-18 check/write commands, connect format checking to the complete clean-checkout gate, and normalize the active first-party C/header surface.

          中文说明：
          用 clang-format-18 的 check/write 命令替换 Makefile 占位目标，把格式检查接入完整干净检出门禁，并统一当前第一方 C/头文件格式。"
          git push origin HEAD:build/format-policy
