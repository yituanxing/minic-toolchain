name: Linux Runtime Timer Focused V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-timer-focused-v0.yml"
      - "tools/ci/runtime-timer-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-timer-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timer-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-timer-focused-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh frontier owners plus timer/hrtimer/tick-sched with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-timer-focused-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock_debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build_utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build_policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log

          riscv64-linux-gnu-nm -an "$out/kernel/time/timer.o" >"$ev/timer.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/time/timer.o" >"$ev/timer.objdump.txt"
          cp "$out/kernel/time/timer.minic-stage2.s" "$ev/timer.minic-stage2.s"
          grep -n -A30 -B4 '<get_current>:' "$ev/timer.objdump.txt" >"$ev/get_current.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/kernel/time/hrtimer.o" >"$ev/hrtimer.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/time/hrtimer.o" >"$ev/hrtimer.objdump.txt"
          cp "$out/kernel/time/hrtimer.minic-stage2.s" "$ev/hrtimer.minic-stage2.s"
          grep -n -A90 -B8 '<hrtimer_run_queues>:' "$ev/hrtimer.objdump.txt" >"$ev/hrtimer_run_queues.objdump.txt" || true

          riscv64-linux-gnu-nm -an "$out/kernel/time/tick-sched.o" >"$ev/tick-sched.nm.txt"
          riscv64-linux-gnu-objdump -dr "$out/kernel/time/tick-sched.o" >"$ev/tick-sched.objdump.txt"
          cp "$out/kernel/time/tick-sched.minic-stage2.s" "$ev/tick-sched.minic-stage2.s"
          grep -n -A90 -B8 '<tick_check_oneshot_change>:' "$ev/tick-sched.objdump.txt" >"$ev/tick_check_oneshot_change.objdump.txt" || true

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"

      - name: Execute QEMU current frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-timer-focused-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py --config tools/ci/linux-runtime-init-irq-frontier-v0.json --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-timer-focused-v0-${{ github.sha }}
          path: |
            build/linux-runtime-timer-focused-v0/profile/patch.log
            build/linux-runtime-timer-focused-v0/*-refresh.log
            build/linux-runtime-timer-focused-v0/timer.nm.txt
            build/linux-runtime-timer-focused-v0/timer.objdump.txt
            build/linux-runtime-timer-focused-v0/timer.minic-stage2.s
            build/linux-runtime-timer-focused-v0/get_current.objdump.txt
            build/linux-runtime-timer-focused-v0/hrtimer.nm.txt
            build/linux-runtime-timer-focused-v0/hrtimer.objdump.txt
            build/linux-runtime-timer-focused-v0/hrtimer.minic-stage2.s
            build/linux-runtime-timer-focused-v0/hrtimer_run_queues.objdump.txt
            build/linux-runtime-timer-focused-v0/tick-sched.nm.txt
            build/linux-runtime-timer-focused-v0/tick-sched.objdump.txt
            build/linux-runtime-timer-focused-v0/tick-sched.minic-stage2.s
            build/linux-runtime-timer-focused-v0/tick_check_oneshot_change.objdump.txt
            build/linux-runtime-timer-focused-v0/watch/frontier-result.json
            build/linux-runtime-timer-focused-v0/watch/frontier-summary.txt
            build/linux-runtime-timer-focused-v0/watch/watch-result.json
            build/linux-runtime-timer-focused-v0/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
