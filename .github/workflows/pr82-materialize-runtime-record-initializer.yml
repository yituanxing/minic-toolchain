name: PR82 Materialize Runtime Record Initializer

on:
  pull_request:
    paths:
      - 'tools/dev/pr82-runtime-record-initializer.patch'
      - '.github/workflows/pr82-materialize-runtime-record-initializer.yml'
      - 'src/frontend/parser_statement.c'
      - 'tests/compiler/c0/gnu_record_compound_literal.c'
      - 'tests/compiler/c0/run-gnu-record-compound-literal.sh'

permissions:
  contents: write

concurrency:
  group: pr82-runtime-record-initializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/runtime-record-initializer-v0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize bounded initializer slice
        shell: bash
        run: |
          set -Eeuo pipefail
          patch=tools/dev/pr82-runtime-record-initializer.patch
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'Runtime record initializer v0 already materialized.'
          else
            echo 'Runtime record initializer patch no longer matches current source.' >&2
            exit 1
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/pr82 check

      - name: Commit materialized source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c \
                  tests/compiler/c0/gnu_record_compound_literal.c \
                  tests/compiler/c0/run-gnu-record-compound-literal.sh
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'frontend: extend runtime record initializers'
          git push origin HEAD:${{ github.head_ref }}
