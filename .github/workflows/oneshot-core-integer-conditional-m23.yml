name: One-shot Core Integer Conditional M23

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Prove M23 gaps
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m23-before
          compiler="$GITHUB_WORKSPACE/build/core-m23-before/bin/minic"
          cat > build/core-m23-before-conditional.i <<'EOF'
          unsigned long helper(unsigned long x) { return x; }
          unsigned long probe(int c, unsigned long x) { return c ? 7UL : helper(x); }
          EOF
          if MINIC_CORE_IR=strict "$compiler" -S build/core-m23-before-conditional.i -o /tmp/m23-before-conditional.s 2>/tmp/m23-before-conditional.err; then
            echo 'M23 conditional gap unexpectedly absent' >&2
            exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'probe'" /tmp/m23-before-conditional.err >/dev/null
          cat > build/core-m23-before-const.i <<'EOF'
          unsigned long probe(const unsigned long x) { return x; }
          EOF
          if MINIC_CORE_IR=strict "$compiler" -S build/core-m23-before-const.i -o /tmp/m23-before-const.s 2>/tmp/m23-before-const.err; then
            echo 'M23 const-parameter gap unexpectedly absent' >&2
            exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'probe'" /tmp/m23-before-const.err >/dev/null

      - name: Apply M23
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-integer-conditional-m23.py tools/dev/patch-core-const-parameter-m23b.py
          python3 tools/dev/patch-core-integer-conditional-m23.py
          python3 tools/dev/patch-core-const-parameter-m23b.py
          clang-format-18 -i src/core/core_ir.c src/core/core_lower.c \
            tests/compiler/c0/core_integer_conditional_m23.c \
            tests/compiler/c0/core_integer_conditional_m23_runtime.c \
            tests/compiler/c0/core_const_parameter_m23b.c \
            tests/compiler/c0/core_const_parameter_m23b_runtime.c
          sh -n tests/compiler/c0/run-core-integer-conditional-m23.sh
          sh -n tests/compiler/c0/run-core-const-parameter-m23b.sh
          git diff --check
          git diff --exit-code -- src/core/core_ir.h src/target/riscv64/core_codegen.c

      - name: Build and validate M23
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m23-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m23-compiler/bin/minic"
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m23-focused" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-conditional-m23.sh
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m23b-focused" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-const-parameter-m23b.sh
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m23-m22" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-integer-or-shifts-m22.sh
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m23-m21" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-pointer-condition-m21.sh
          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-m23-m20" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 sh tests/compiler/c0/run-core-for-postincrement-m20.sh
          MINIC="$compiler" bash tests/core/run-core-ir-shadow.sh

      - name: Replay full frozen strict first500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m23-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-m23-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 5 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices ''
          replay_status=$?
          set -e
          printf 'CORE_M23_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('build/core-m23-strict500/frontier-summary.json').read_text())
          blockers = {row['function']: row['count'] for row in s['blockers']}
          if s['selected'] != 500:
              raise SystemExit(f"M23 expected 500 TUs, got {s['selected']}")
          if s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit('M23 introduced non-UNSUPPORTED strict failures')
          if blockers.get('__swab', 0) != 0:
              raise SystemExit(f"M23 did not pierce __swab: {blockers.get('__swab')}")
          if s['pass'] + s['unsupported'] != 500:
              raise SystemExit('M23 strict500 accounting mismatch')
          PY

      - name: Publish M23 product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-integer-conditional-m23.py \
             tools/dev/patch-core-const-parameter-m23b.py \
             .github/workflows/oneshot-core-integer-conditional-m23.yml \
             .github/workflows/oneshot-core-swab-shape-v1.yml \
             .github/workflows/oneshot-core-swab-source-v2.yml \
             .github/workflows/oneshot-core-swab-exact-types-v3.yml \
             .github/workflows/oneshot-core-swab-const-param-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.c src/core/core_lower.c \
                  tests/compiler/c0/core_integer_conditional_m23.c \
                  tests/compiler/c0/core_integer_conditional_m23_runtime.c \
                  tests/compiler/c0/run-core-integer-conditional-m23.sh \
                  tests/compiler/c0/core_const_parameter_m23b.c \
                  tests/compiler/c0/core_const_parameter_m23b_runtime.c \
                  tests/compiler/c0/run-core-const-parameter-m23b.sh \
                  tools/dev/patch-core-integer-conditional-m23.py \
                  tools/dev/patch-core-const-parameter-m23b.py \
                  .github/workflows/oneshot-core-integer-conditional-m23.yml \
                  .github/workflows/oneshot-core-swab-shape-v1.yml \
                  .github/workflows/oneshot-core-swab-source-v2.yml \
                  .github/workflows/oneshot-core-swab-exact-types-v3.yml \
                  .github/workflows/oneshot-core-swab-const-param-v4.yml
          git diff --cached --check
          git commit -m 'core: lower integer conditionals and const parameters'
          git push origin HEAD:refactor/declaration-sema-v1
