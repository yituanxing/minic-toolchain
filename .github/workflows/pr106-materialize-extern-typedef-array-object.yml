name: PR106 Materialize Extern Typedef Array Object
on:
  push:
    branches: [agent/extern-typedef-array-object-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/extern-typedef-array-object-v0, fetch-depth: 0}
      - name: Materialize typedef-array extern semantics
        run: python3 tools/dev/pr106-materialize-extern-typedef-array-object.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused-extern-typedef-array" HOST_CC=cc sh tests/compiler/c0/run-extern-typedef-array-object.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr106-materialize-extern-typedef-array-object.yml tools/dev/pr106-materialize-extern-typedef-array-object.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: accept extern typedef-array objects'
          git push origin HEAD:agent/extern-typedef-array-object-v0
