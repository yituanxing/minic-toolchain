name: One-shot Core printk_get_level Shape M27

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Build exact-head compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m27-probe
          version_i=$(find build/linux-focus-corpus -type f -path '*/init/version.i' -print -quit)
          test -n "$version_i"
          printf '%s\n' "$version_i" > build/core-m27-version-path.txt
          printf 'M27_VERSION_PATH=%s\n' "$version_i"

      - name: Prove narrow integer equality gap
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m27-probe/bin/minic"
          mkdir -p build/core-m27-shapes
          cat > build/core-m27-shapes/equality.i <<'EOF'
          int probe_equality(const char *p) { return p[0] == '\001'; }
          EOF
          if MINIC_CORE_IR=strict "$c" -S build/core-m27-shapes/equality.i -o /tmp/m27-eq-before.s 2>/tmp/m27-eq-before.err; then
              echo 'M27a equality gap unexpectedly absent' >&2
              exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'probe_equality'" /tmp/m27-eq-before.err >/dev/null

      - name: Apply M27a equality candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-integer-equality-common-m27a.py
          python3 tools/dev/patch-core-integer-equality-common-m27a.py
          clang-format-18 -i src/core/core_lower.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m27a-compiler

      - name: Prove M27a and expose switch seam
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m27a-compiler/bin/minic"
          cat > build/core-m27-shapes/equality_unsigned.i <<'EOF'
          int probe_equality_unsigned(const unsigned char *p) { return p[0] != 255; }
          EOF
          cat > build/core-m27-shapes/nested_if_equivalent.i <<'EOF'
          int probe_nested_if_equivalent(const char *p) { if (p[0] == '\001') { if (p[1]) return p[1]; } return 0; }
          EOF
          cat > build/core-m27-shapes/exact_if_condition.i <<'EOF'
          int probe_exact_if_condition(const char *p) { if (p[0] == '\001' && p[1]) return p[1]; return 0; }
          EOF
          cat > build/core-m27-shapes/switch_simple.i <<'EOF'
          int probe_switch_simple(const char *p) { switch (p[1]) { case '0': return p[1]; case 'c': return p[1]; default: return 0; } }
          EOF
          cat > build/core-m27-shapes/switch_range.i <<'EOF'
          int probe_switch_range(const char *p) { switch (p[1]) { case '0' ... '7': return p[1]; case 'c': return p[1]; default: return 0; } }
          EOF

          for name in equality equality_unsigned nested_if_equivalent exact_if_condition; do
              MINIC_CORE_IR=strict "$c" -S "build/core-m27-shapes/$name.i" -o "build/core-m27-shapes/$name.after.s"
              printf 'M27A_PASS name=%s\n' "$name"
          done
          for name in switch_simple switch_range; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "build/core-m27-shapes/$name.i" -o "build/core-m27-shapes/$name.after.s" 2>"build/core-m27-shapes/$name.after.err"
              rc=$?
              set -e
              printf 'M27A_SWITCH_GAP name=%s rc=%d\n' "$name" "$rc"
              test "$rc" -ne 0
              grep -F "Core IR shadow does not yet support function 'probe_" "build/core-m27-shapes/$name.after.err" >/dev/null
          done

          version_i=$(cat build/core-m27-version-path.txt)
          set +e
          MINIC_CORE_IR=strict "$c" -S "$version_i" -o /tmp/m27a-version.s 2>/tmp/m27a-version.err
          rc=$?
          set -e
          printf 'M27A_EXACT_VERSION_RC=%d\n' "$rc"
          sed -n '1,20p' /tmp/m27a-version.err
          test "$rc" -ne 0
          grep -F "Core IR shadow does not yet support function 'printk_get_level'" /tmp/m27a-version.err >/dev/null
