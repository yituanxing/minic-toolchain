name: One-shot Core printk_get_level Shape M27

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Build exact-head compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m27-probe
          version_i=$(find build/linux-focus-corpus -type f -path '*/init/version.i' -print -quit)
          test -n "$version_i"
          printf '%s\n' "$version_i" > build/core-m27-version-path.txt
          printf 'M27_VERSION_PATH=%s\n' "$version_i"

      - name: Classify short-circuit and switch shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m27-probe/bin/minic"
          mkdir -p build/core-m27-shapes

          cat > build/core-m27-shapes/equality.i <<'EOF'
          int probe_equality(const char *p) { return p[0] == '\001'; }
          EOF
          cat > build/core-m27-shapes/if_equality.i <<'EOF'
          int probe_if_equality(const char *p) { if (p[0] == '\001') return p[1]; return 0; }
          EOF
          cat > build/core-m27-shapes/scalar_truth.i <<'EOF'
          int probe_scalar_truth(const char *p) { if (p[1]) return p[1]; return 0; }
          EOF
          cat > build/core-m27-shapes/logical_and_value.i <<'EOF'
          int probe_logical_and_value(int a, int b) { return a && b; }
          EOF
          cat > build/core-m27-shapes/logical_or_value.i <<'EOF'
          int probe_logical_or_value(int a, int b) { return a || b; }
          EOF
          cat > build/core-m27-shapes/if_logical_and.i <<'EOF'
          int probe_if_logical_and(int a, int b) { if (a && b) return 7; return 0; }
          EOF
          cat > build/core-m27-shapes/if_logical_or.i <<'EOF'
          int probe_if_logical_or(int a, int b) { if (a || b) return 7; return 0; }
          EOF
          cat > build/core-m27-shapes/nested_if_equivalent.i <<'EOF'
          int probe_nested_if_equivalent(const char *p) { if (p[0] == '\001') { if (p[1]) return p[1]; } return 0; }
          EOF
          cat > build/core-m27-shapes/exact_if_condition.i <<'EOF'
          int probe_exact_if_condition(const char *p) { if (p[0] == '\001' && p[1]) return p[1]; return 0; }
          EOF
          cat > build/core-m27-shapes/switch_simple.i <<'EOF'
          int probe_switch_simple(const char *p) { switch (p[1]) { case '0': return p[1]; case 'c': return p[1]; default: return 0; } }
          EOF
          cat > build/core-m27-shapes/switch_range.i <<'EOF'
          int probe_switch_range(const char *p) { switch (p[1]) { case '0' ... '7': return p[1]; case 'c': return p[1]; default: return 0; } }
          EOF

          for f in build/core-m27-shapes/*.i; do
              name=$(basename "$f" .i)
              set +e
              MINIC_CORE_IR=strict "$c" -S "$f" -o "build/core-m27-shapes/$name.s" 2>"build/core-m27-shapes/$name.err"
              rc=$?
              set -e
              printf 'M27_SHAPE name=%s rc=%d\n' "$name" "$rc"
              if [ -s "build/core-m27-shapes/$name.err" ]; then
                  sed -n '1,12p' "build/core-m27-shapes/$name.err"
              fi
          done

      - name: Compile exact representative and report blocker
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m27-probe/bin/minic"
          version_i=$(cat build/core-m27-version-path.txt)
          set +e
          MINIC_CORE_IR=strict "$c" -S "$version_i" -o /tmp/m27-version.s 2>/tmp/m27-version.err
          rc=$?
          set -e
          printf 'M27_EXACT_VERSION_RC=%d\n' "$rc"
          sed -n '1,30p' /tmp/m27-version.err
          grep -F "Core IR shadow does not yet support function 'printk_get_level'" /tmp/m27-version.err >/dev/null
