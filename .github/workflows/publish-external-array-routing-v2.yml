name: Publish validated external array product patch

on:
  push:
    branches:
      - frontend/external-array-routing-staging-v2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize previously validated product patch
        run: |
          set -Eeuo pipefail
          sed -i 's/run-external-tentative-definitions.sh/run-external-pointer-arrays.sh/' tools/dev/publish_external_array_declarator_routing.py
          python3 tools/dev/publish_external_array_declarator_routing.py
          python3 tools/dev/publish_external_array_relocation_emitter.py
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/parser_function.c src/target/riscv64/codegen_function.c tests/compiler/c0/external_array_declarator_routing.c
          chmod +x tests/compiler/c0/run-external-array-declarator-routing.sh
          git diff --check

      - name: Commit product-only patch
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git rm -f .github/workflows/publish-external-array-routing-v2.yml tools/dev/publish_external_array_declarator_routing.py tools/dev/publish_external_array_relocation_emitter.py
          git add src/frontend/parser_function.c src/target/riscv64/codegen_function.c tests/compiler/c0/external_array_declarator_routing.c tests/compiler/c0/run-external-array-declarator-routing.sh tests/compiler/c0/run-external-pointer-arrays.sh tests/compiler/c0/run-foundation-focused.sh
          git commit -m 'frontend: route complete external arrays as ordinary objects' -m 'Materialize complete external array declarators before storage routing and reuse the canonical external object/static-storage initializer owners. Keep scalar arrays on the existing flat emitter; relocation-bearing arrays use recursive typed static-data emission, while array-only trailing-zero compression preserves existing assembly contracts.' -m '中文说明：完整 external array 先物化 canonical array declarator，再复用普通 external object/static-storage initializer owner；relocation-bearing array 使用递归 typed static-data 发射，array-only 尾零压缩保持既有汇编契约。'
          git push origin HEAD:frontend/external-array-routing-staging-v2
