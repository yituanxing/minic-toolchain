name: Publish bounded external array routing

on:
  push:
    branches:
      - frontend/external-array-routing-staging-v2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply frontend patch
        run: python3 tools/dev/publish_external_array_declarator_routing.py

      - name: Canonical format
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/external_array_declarator_routing.c
          chmod +x tests/compiler/c0/run-external-array-declarator-routing.sh
          git diff --check

      - name: Sanitizer focused regressions
        run: |
          set -Eeuo pipefail
          make -j4 MODE=sanitize BUILD_DIR=build/external-array-routing-v2-sanitize
          export MINIC="$PWD/build/external-array-routing-v2-sanitize/bin/minic"
          export BUILD_DIR="$PWD/build/external-array-routing-v2-sanitize"
          sh tests/compiler/c0/run-external-array-declarator-routing.sh
          sh tests/compiler/c0/run-external-pointer-arrays.sh
          sh tests/compiler/c0/run-extern-fixed-integer-arrays.sh

      - name: Foundation regression
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/external-array-routing-v2-release
          MINIC="$PWD/build/external-array-routing-v2-release/bin/minic" BUILD_DIR="$PWD/build/external-array-routing-v2-release" sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish product-only patch
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git rm .github/workflows/publish-external-array-routing-v2.yml tools/dev/publish_external_array_declarator_routing.py
          git add src/frontend/parser_function.c tests/compiler/c0/external_array_declarator_routing.c tests/compiler/c0/run-external-array-declarator-routing.sh tests/compiler/c0/run-foundation-focused.sh
          git commit -m 'frontend: route complete external arrays as ordinary objects' -m 'Materialize complete external array declarators before storage routing and reuse the canonical external object/static-storage initializer owners. Keep incomplete-array bound inference isolated and leave RV64 static-data emission unchanged.' -m '中文说明：完整 external array 先物化 canonical array declarator，再复用普通 external object/static-storage initializer owner；不完整数组的 bound inference 暂时保持隔离，RV64 static-data emitter 不做改动。'
          git push origin HEAD:frontend/external-array-routing-staging-v2
