name: PR92 Materialize CLZLL ConstEval

on:
  push:
    branches:
      - agent/clzll-typed-consteval-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clzll-typed-consteval-v0
          fetch-depth: 0
      - name: Materialize typed builtin ConstEval
        run: |
          set -Eeuo pipefail
          python tools/dev/pr92-materialize-clzll-consteval.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-builtin-clzll.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr92-materialize-clzll-consteval.py
          rm -f .github/workflows/pr92-materialize-clzll-consteval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: const-evaluate builtin clzll'
          git push origin HEAD:agent/clzll-typed-consteval-v0
