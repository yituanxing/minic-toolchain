name: PR92 Materialize CLZLL ConstEval

on:
  push:
    branches:
      - agent/clzll-typed-consteval-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clzll-typed-consteval-v0
          fetch-depth: 0
      - name: Materialize typed builtin ConstEval
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/dev/pr92-materialize-clzll-consteval.py')
          text = path.read_text()
          marker = '\nreplace_once(\n    "tests/compiler/c0/run-builtin-clzll.sh",'
          if text.count(marker) != 1:
              raise SystemExit('runner transformation marker mismatch')
          path.write_text(text.split(marker, 1)[0] + '\n')
          PY
          python tools/dev/pr92-materialize-clzll-consteval.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/compiler/c0/run-builtin-clzll.sh')
          text = path.read_text()
          old = "printf '%s\\n' 'PASS compiler/c0/builtin_clzll ast=unary-builtin argument=ull-normalized runtime-lowering=rv64i-binary-search consteval=deferred zbb=none'\n"
          new = """cat >\"$work/clzll-zero.c\" <<'EOF'\nint invalid_bound[__builtin_clzll(0ULL)];\nEOF\n\"$host_cc\" -E -P -std=gnu11 -x c \"$work/clzll-zero.c\" -o \"$work/clzll-zero.i\"\nif \"$minic\" -S \"$work/clzll-zero.i\" -o \"$work/clzll-zero.s\" 2>\"$work/clzll-zero.stderr\"; then\n    printf '%s\\n' '__builtin_clzll(0) unexpectedly accepted as an integer constant expression' >&2\n    exit 1\nfi\ngrep -F 'expected integer constant expression' \"$work/clzll-zero.stderr\" >/dev/null\n\nprintf '%s\\n' 'PASS compiler/c0/builtin_clzll ast=unary-builtin argument=ull-normalized runtime-lowering=rv64i-binary-search typed-consteval=nonzero linux-array-bound=1 zero=fail-closed zbb=none'\n"""
          if text.count(old) != 1:
              raise SystemExit('builtin-clzll PASS anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-builtin-clzll.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr92-materialize-clzll-consteval.py
          rm -f .github/workflows/pr92-materialize-clzll-consteval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: const-evaluate builtin clzll'
          git push origin HEAD:agent/clzll-typed-consteval-v0
