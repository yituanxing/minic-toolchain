name: PR92 Materialize CLZLL ConstEval

on:
  push:
    branches:
      - agent/clzll-typed-consteval-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clzll-typed-consteval-v0
          fetch-depth: 0
      - name: Materialize typed builtin ConstEval
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/dev/pr92-materialize-clzll-consteval.py')
          text = path.read_text()
          marker = '\nreplace_once(\n    "tests/compiler/c0/run-builtin-clzll.sh",'
          if text.count(marker) != 1:
              raise SystemExit('runner transformation marker mismatch')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n')
          PY
          python tools/dev/pr92-materialize-clzll-consteval.py
          python - <<'PY'
          from pathlib import Path
          Path('tests/compiler/c0/run-builtin-clzll.sh').write_text(r'''#!/bin/sh
          set -eu

          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/compiler-c0-builtin-clzll

          rm -rf "$work"
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c "$root/tests/compiler/c0/builtin_clzll.c" -o "$work/builtin_clzll.i"
          "$minic" -S "$work/builtin_clzll.i" -o "$work/builtin_clzll.s"
          test -s "$work/builtin_clzll.s"
          grep -F 'runtime_clzll_ull:' "$work/builtin_clzll.s" >/dev/null
          grep -F 'runtime_clzll_uint:' "$work/builtin_clzll.s" >/dev/null
          grep -F '.Lminic_clzll_32_' "$work/builtin_clzll.s" >/dev/null
          grep -F '  srli t1, a0, 32' "$work/builtin_clzll.s" >/dev/null
          if grep -Eq '(^|[[:space:]])clz([[:space:]]|$)' "$work/builtin_clzll.s"; then
              printf '%s\n' 'unexpected Zbb clz dependency' >&2
              exit 1
          fi

          cat >"$work/clzll-zero.c" <<'EOF'
          int invalid_bound[__builtin_clzll(0ULL)];
          EOF
          "$host_cc" -E -P -std=gnu11 -x c "$work/clzll-zero.c" -o "$work/clzll-zero.i"
          if "$minic" -S "$work/clzll-zero.i" -o "$work/clzll-zero.s" 2>"$work/clzll-zero.stderr"; then
              printf '%s\n' '__builtin_clzll(0) unexpectedly accepted as an integer constant expression' >&2
              exit 1
          fi
          grep -F 'expected integer constant expression' "$work/clzll-zero.stderr" >/dev/null

          printf '%s\n' 'PASS compiler/c0/builtin_clzll ast=unary-builtin argument=ull-normalized runtime-lowering=rv64i-binary-search typed-consteval=nonzero linux-array-bound=1 zero=fail-closed zbb=none'
          ''')
          PY
          sed -i 's/^          //' tests/compiler/c0/run-builtin-clzll.sh
          chmod +x tests/compiler/c0/run-builtin-clzll.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-builtin-clzll.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr92-materialize-clzll-consteval.py
          rm -f .github/workflows/pr92-materialize-clzll-consteval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: const-evaluate builtin clzll'
          git push origin HEAD:agent/clzll-typed-consteval-v0
