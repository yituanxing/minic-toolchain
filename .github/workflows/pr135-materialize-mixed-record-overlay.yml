name: PR135 Materialize Mixed Record Overlay
on:
  push:
    branches: [agent/mixed-record-init-overlay-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize mixed record overlays
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr135-materialize.py
          clang-format-18 -i \
            src/frontend/ast_global.c \
            src/frontend/ast_verifier.c \
            src/frontend/parser_global.c \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/static_mixed_symbol_relocations.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr135-focused" \
            sh tests/compiler/c0/run-static-mixed-symbol-relocations.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr135-materialize.py \
            .github/workflows/pr135-materialize-mixed-record-overlay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): overlay record relocations on constants'
          git push origin HEAD:agent/mixed-record-init-overlay-v0
