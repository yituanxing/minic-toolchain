name: Staging Core FIELD Apply

on:
  push:
    branches:
      - staging/core-rv64-field-address-v0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply program-aware FIELD_ADDRESS emission
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Public Core emitter API: keep no-program v0 wrappers, add program-aware entry points.
          path = Path('src/target/riscv64/core_codegen.h')
          text = path.read_text()
          old = '''bool minic_riscv64_core_function_can_emit_basic_v0(const MinicCoreFunction *function);\n\nbool minic_riscv64_emit_core_function_basic_v0_with_symbol(\n    FILE *file, const MinicCoreFunction *function, const MinicRiscv64FunctionSymbol *symbol);\n'''
          new = '''bool minic_riscv64_core_function_can_emit_basic_v0(const MinicCoreFunction *function);\nbool minic_riscv64_core_function_can_emit_basic_v0_for_program(\n    const MinicC0Program *program, const MinicCoreFunction *function);\n\nbool minic_riscv64_emit_core_function_basic_v0_with_symbol(\n    FILE *file, const MinicCoreFunction *function, const MinicRiscv64FunctionSymbol *symbol);\nbool minic_riscv64_emit_core_function_basic_v0_for_program_with_symbol(\n    FILE *file,\n    const MinicC0Program *program,\n    const MinicCoreFunction *function,\n    const MinicRiscv64FunctionSymbol *symbol);\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))

          path = Path('src/target/riscv64/core_codegen.c')
          text = path.read_text()
          old = '#include "target/riscv64/codegen_internal.h"\n'
          new = '#include "target/riscv64/codegen_internal.h"\n#include "target/data_layout.h"\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''static bool core_instruction_supported(const MinicCoreFunction *function,\n                                       const MinicCoreInstruction *instruction) {\n    const MinicCoreCallee *callee;\n\n    if (function == NULL || instruction == NULL) {\n        return false;\n    }\n    switch (instruction->kind) {\n    case MINIC_CORE_INSTRUCTION_INTEGER_CONSTANT:\n    case MINIC_CORE_INSTRUCTION_INTEGER_ADD:\n    case MINIC_CORE_INSTRUCTION_INTEGER_CONVERSION:\n    case MINIC_CORE_INSTRUCTION_INTEGER_NEGATE:\n    case MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO:\n    case MINIC_CORE_INSTRUCTION_PARAMETER:\n    case MINIC_CORE_INSTRUCTION_OBJECT_ADDRESS:\n    case MINIC_CORE_INSTRUCTION_LOAD:\n    case MINIC_CORE_INSTRUCTION_STORE:\n        return true;\n    case MINIC_CORE_INSTRUCTION_CALL:\n        if (instruction->value.call.callee_id >= function->callee_count ||\n            instruction->value.call.argument_count > 8U) {\n            return false;\n        }\n        callee = &function->callees[instruction->value.call.callee_id];\n        return callee->name != NULL && callee->name_length != 0U && callee->parameter_count <= 8U;\n    case MINIC_CORE_INSTRUCTION_FIELD_ADDRESS:\n        return false;\n    }\n    return false;\n}\n'''
          new = '''static bool core_field_address_supported(const MinicC0Program *program,\n                                         const MinicCoreInstruction *instruction,\n                                         size_t *field_offset) {\n    const MinicRecord *record;\n    const MinicRecordField *field;\n    size_t offset;\n\n    if (program == NULL || instruction == NULL ||\n        instruction->kind != MINIC_CORE_INSTRUCTION_FIELD_ADDRESS) {\n        return false;\n    }\n    record = minic_c0_program_record(program, instruction->value.field_address.record_id);\n    field = minic_c0_record_field(record, instruction->value.field_address.field_index);\n    if (record == NULL || field == NULL || field->is_bit_field ||\n        !minic_data_layout_record_field_offset(minic_default_data_layout(),\n                                               program,\n                                               record,\n                                               instruction->value.field_address.field_index,\n                                               &offset)) {\n        return false;\n    }\n    if (field_offset != NULL) {\n        *field_offset = offset;\n    }\n    return true;\n}\n\nstatic bool core_instruction_supported(const MinicC0Program *program,\n                                       const MinicCoreFunction *function,\n                                       const MinicCoreInstruction *instruction) {\n    const MinicCoreCallee *callee;\n\n    if (function == NULL || instruction == NULL) {\n        return false;\n    }\n    switch (instruction->kind) {\n    case MINIC_CORE_INSTRUCTION_INTEGER_CONSTANT:\n    case MINIC_CORE_INSTRUCTION_INTEGER_ADD:\n    case MINIC_CORE_INSTRUCTION_INTEGER_CONVERSION:\n    case MINIC_CORE_INSTRUCTION_INTEGER_NEGATE:\n    case MINIC_CORE_INSTRUCTION_SCALAR_IS_ZERO:\n    case MINIC_CORE_INSTRUCTION_PARAMETER:\n    case MINIC_CORE_INSTRUCTION_OBJECT_ADDRESS:\n    case MINIC_CORE_INSTRUCTION_LOAD:\n    case MINIC_CORE_INSTRUCTION_STORE:\n        return true;\n    case MINIC_CORE_INSTRUCTION_CALL:\n        if (instruction->value.call.callee_id >= function->callee_count ||\n            instruction->value.call.argument_count > 8U) {\n            return false;\n        }\n        callee = &function->callees[instruction->value.call.callee_id];\n        return callee->name != NULL && callee->name_length != 0U && callee->parameter_count <= 8U;\n    case MINIC_CORE_INSTRUCTION_FIELD_ADDRESS:\n        return core_field_address_supported(program, instruction, NULL);\n    }\n    return false;\n}\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          start = text.index('bool minic_riscv64_core_function_can_emit_basic_v0(const MinicCoreFunction *function) {')
          end = text.index('\n}\n\nstatic bool emit_parameter', start) + 2
          old = text[start:end]
          new = old.replace(
              'bool minic_riscv64_core_function_can_emit_basic_v0(const MinicCoreFunction *function) {',
              'static bool core_function_can_emit_basic_v0(const MinicC0Program *program,\n                                            const MinicCoreFunction *function) {',
              1,
          ).replace(
              'if (!core_instruction_supported(function, &function->instructions[index])) {',
              'if (!core_instruction_supported(program, function, &function->instructions[index])) {',
              1,
          )
          new += '''\n\nbool minic_riscv64_core_function_can_emit_basic_v0(const MinicCoreFunction *function) {\n    return core_function_can_emit_basic_v0(NULL, function);\n}\n\nbool minic_riscv64_core_function_can_emit_basic_v0_for_program(\n    const MinicC0Program *program, const MinicCoreFunction *function) {\n    return program != NULL && core_function_can_emit_basic_v0(program, function);\n}'''
          text = text[:start] + new + text[end:]

          old = '!core_instruction_supported(function, instruction)) {'
          new = '!core_instruction_supported(NULL, function, instruction)) {'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          marker = '''static bool emit_instruction(FILE *file,\n                             const MinicCoreFunction *function,\n                             const MinicRiscv64CoreFrame *frame,\n                             const MinicCoreInstruction *instruction) {\n'''
          replacement = '''static bool emit_field_address(FILE *file,\n                               const MinicC0Program *program,\n                               const MinicRiscv64CoreFrame *frame,\n                               const MinicCoreInstruction *instruction) {\n    size_t field_offset;\n\n    if (!core_field_address_supported(program, instruction, &field_offset) ||\n        !load_core_value(file, frame, instruction->value.field_address.base, "t0")) {\n        return false;\n    }\n    if (field_offset != 0U) {\n        if (field_offset <= 2047U) {\n            if (fprintf(file, "  addi t0, t0, %zu\\n", field_offset) < 0) {\n                return false;\n            }\n        } else if (fprintf(file,\n                           "  li t1, %zu\\n"\n                           "  add t0, t0, t1\\n",\n                           field_offset) < 0) {\n            return false;\n        }\n    }\n    return store_core_value(file, frame, instruction->result, "t0");\n}\n\nstatic bool emit_instruction(FILE *file,\n                             const MinicC0Program *program,\n                             const MinicCoreFunction *function,\n                             const MinicRiscv64CoreFrame *frame,\n                             const MinicCoreInstruction *instruction) {\n'''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, replacement, 1)
          old = '!core_instruction_supported(function, instruction)) {'
          new = '!core_instruction_supported(program, function, instruction)) {'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '''    case MINIC_CORE_INSTRUCTION_CALL:\n        return emit_call(file, function, frame, instruction);\n    case MINIC_CORE_INSTRUCTION_FIELD_ADDRESS:\n        return false;\n'''
          new = '''    case MINIC_CORE_INSTRUCTION_CALL:\n        return emit_call(file, function, frame, instruction);\n    case MINIC_CORE_INSTRUCTION_FIELD_ADDRESS:\n        return emit_field_address(file, program, frame, instruction);\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''bool minic_riscv64_emit_core_function_basic_v0_with_symbol(\n    FILE *file, const MinicCoreFunction *function, const MinicRiscv64FunctionSymbol *symbol) {\n'''
          new = '''static bool emit_core_function_basic_v0_with_symbol(\n    FILE *file,\n    const MinicC0Program *program,\n    const MinicCoreFunction *function,\n    const MinicRiscv64FunctionSymbol *symbol) {\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '!minic_riscv64_core_function_can_emit_basic_v0(function) ||'
          new = '!core_function_can_emit_basic_v0(program, function) ||'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '''                !emit_instruction(\n                    file, function, &frame, &function->instructions[instruction_id])) {\n'''
          new = '''                !emit_instruction(\n                    file, program, function, &frame, &function->instructions[instruction_id])) {\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          text += '''\n\nbool minic_riscv64_emit_core_function_basic_v0_with_symbol(\n    FILE *file, const MinicCoreFunction *function, const MinicRiscv64FunctionSymbol *symbol) {\n    return emit_core_function_basic_v0_with_symbol(file, NULL, function, symbol);\n}\n\nbool minic_riscv64_emit_core_function_basic_v0_for_program_with_symbol(\n    FILE *file,\n    const MinicC0Program *program,\n    const MinicCoreFunction *function,\n    const MinicRiscv64FunctionSymbol *symbol) {\n    return program != NULL &&\n           emit_core_function_basic_v0_with_symbol(file, program, function, symbol);\n}\n'''
          path.write_text(text)

          # Production writer supplies the program-owned record/layout context.
          path = Path('src/target/riscv64/codegen_function.c')
          text = path.read_text()
          old = '''        if (core_function != NULL && minic_riscv64_core_function_can_emit_basic_v0(core_function)) {\n            MinicRiscv64FunctionSymbol symbol;\n\n            success =\n                minic_riscv64_function_symbol_from_function(function, &symbol) &&\n                minic_riscv64_emit_core_function_basic_v0_with_symbol(file, core_function, &symbol);\n'''
          new = '''        if (core_function != NULL &&\n            minic_riscv64_core_function_can_emit_basic_v0_for_program(program, core_function)) {\n            MinicRiscv64FunctionSymbol symbol;\n\n            success = minic_riscv64_function_symbol_from_function(function, &symbol) &&\n                      minic_riscv64_emit_core_function_basic_v0_for_program_with_symbol(\n                          file, program, core_function, &symbol);\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))

          # Frontend-derived differential also owns the parsed program, so it exercises FIELD.
          path = Path('tests/target/riscv64/core_frontend_emitter_test.c')
          text = path.read_text()
          old = '''        success = status == MINIC_CORE_LOWER_OK && minic_core_function_verify(&core) &&\n                  minic_riscv64_core_function_can_emit_basic_v0(&core) &&\n                  minic_riscv64_function_symbol_from_function(function, &symbol);\n        if (success) {\n            success = minic_riscv64_emit_core_function_basic_v0_with_symbol(file, &core, &symbol);\n        }\n'''
          new = '''        success = status == MINIC_CORE_LOWER_OK && minic_core_function_verify(&core) &&\n                  minic_riscv64_core_function_can_emit_basic_v0_for_program(program, &core) &&\n                  minic_riscv64_function_symbol_from_function(function, &symbol);\n        if (success) {\n            success = minic_riscv64_emit_core_function_basic_v0_for_program_with_symbol(\n                file, program, &core, &symbol);\n        }\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY

          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check -- src/target/riscv64/core_codegen.c src/target/riscv64/core_codegen.h \
            src/target/riscv64/codegen_function.c tests/target/riscv64/core_frontend_emitter_test.c

      - name: Commit source-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/target/riscv64/core_codegen.c src/target/riscv64/core_codegen.h \
            src/target/riscv64/codegen_function.c tests/target/riscv64/core_frontend_emitter_test.c
          git diff --cached --quiet && exit 0
          git commit -m 'core: emit RV64 field addresses v0'
          git push origin HEAD:staging/core-rv64-field-address-v0
