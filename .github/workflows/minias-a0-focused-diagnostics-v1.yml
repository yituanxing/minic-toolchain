name: MiniAS Focused, Frozen Window and 3536 Semantic Oracles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Focused MiniAS diagnostic
        required: true
        type: choice
        options:
          - real16
          - frontier
          - vector33
          - window
          - semantic
      window:
        description: "Frozen Linux window (when mode=window)"
        required: false
        type: choice
        default: first500
        options:
          - first500
          - new500
          - next500
          - next500b
          - next500c
          - next500d
          - final352

permissions:
  contents: read
  actions: read

env:
  FROZEN_CORPUS_EXPORT_RUN: "33186855250"
  FROZEN_SIDECARS_RUN: "33237304382"
  FROZEN_CONFIG_GZ_SHA256: "8511a666382dda596a9ddba313113f77182d3156fed890a2ea9f2e86223226ff"
  C149_EXPORT_RUN: "33248985705"

jobs:
  real16:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'real16'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen first500 corpus
        uses: actions/download-artifact@v4
        with:
          name: frozen-linux-corpus-first500
          path: build/import-first500
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-first500
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (
            cd build
            sha256sum -c import-first500/files.sha256 >/dev/null
          )
          echo "FROZEN_CORPUS=PASS archive_sha=$actual"

      - name: Build compiler and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-real16-toolchain all

      - name: Run MiniAS A0 micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-real16-toolchain check-minias-a0

      - name: Generate 16 real Linux assembly files
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/minias-real16-toolchain/bin/minic-cc"
          work="$GITHUB_WORKSPACE/build/minias-real16"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 --offset 0 --limit 500 --sample-count 16
          python3 - "$work/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==16 and not bad, (len(rows), bad)
          print("MINIAS_REAL16_INPUT=PASS generated=16")
          PY

      - name: Assemble real Linux sample and classify first blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-real16-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-real16/minic-out"
          out="$GITHUB_WORKSPACE/build/minias-real16/minias-out"
          mkdir -p "$out"
          : > "$out/results.tsv"
          : > "$out/blockers.txt"
          pass=0
          fail=0

          mapfile -t files < <(find "$root" -type f -name '*.s' | LC_ALL=C sort)
          test "${#files[@]}" -eq 16

          worker="$out/assemble-one.sh"
          cat >"$worker" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          minias=$1
          root=$2
          out=$3
          asm=$4
          rel="${asm#"$root"/}"
          stem="$out/${rel%.s}"
          obj="$stem.o"
          err="$stem.err"
          result="$stem.result"
          blocker="$stem.blocker"
          mkdir -p "$(dirname "$obj")"
          if "$minias" -o "$obj" "$asm" 2>"$err"; then
            readelf -h "$obj" | grep -q 'RISC-V'
            readelf -h "$obj" | grep -q 'REL (Relocatable file)'
            printf 'PASS\t%s\t-\n' "$rel" >"$result"
          else
            raw=$(head -n 1 "$err")
            first=$(printf '%s\n' "$raw" | sed -E 's/^minic-as: //; s/:line=[0-9]+$//')
            line=$(printf '%s\n' "$raw" | sed -nE 's/.*:line=([0-9]+)$/\1/p')
            test -n "$first"
            printf '%s\n' "$first" >"$blocker"
            printf 'FAIL\t%s\t%s\n' "$rel" "$first" >"$result"
            if [[ "$line" =~ ^[0-9]+$ ]]; then
              context="$stem.context.txt"
              from=$(( line > 3 ? line - 3 : 1 ))
              to=$(( line + 3 ))
              {
                printf 'MINIAS_BLOCKER_CONTEXT file=%s line=%s blocker=%s\n' "$rel" "$line" "$first"
                nl -ba "$asm" | sed -n "${from},${to}p"
              } >"$context"
            fi
          fi
          SH
          chmod +x "$worker"

          jobs="${MINIAS_ASSEMBLY_JOBS:-4}"
          printf '%s\0' "${files[@]}" |
            xargs -0 -n1 -P"$jobs" "$worker" "$minias" "$root" "$out"

          mapfile -d '' -t result_files < <(
            find "$out" -type f -name '*.result' -print0 | LC_ALL=C sort -z
          )
          test "${#result_files[@]}" -eq 16
          for result in "${result_files[@]}"; do
            cat "$result"
          done >"$out/results.tsv"

          find "$out" -type f -name '*.blocker' -print0 |
            LC_ALL=C sort -z |
            xargs -0 -r cat >"$out/blockers.txt"

          find "$out" -type f -name '*.context.txt' -print0 |
            LC_ALL=C sort -z |
            xargs -0 -r cat

          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")

          {
            echo "MINIAS_REAL16_SUMMARY pass=$pass fail=$fail total=16"
            echo "MINIAS_REAL16_BLOCKERS"
            if test -s "$out/blockers.txt"; then
              LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr
            else
              echo "  none"
            fi
            echo "MINIAS_REAL16_FILES"
            cat "$out/results.tsv"
          } | tee "$out/summary.txt"

          test $((pass + fail)) -eq 16

      - uses: actions/upload-artifact@v4
        with:
          name: minias-a0-real16
          path: |
            build/minias-real16/minias-out/results.tsv
            build/minias-real16/minias-out/summary.txt
            build/minias-real16/minias-out/**/*.err
            build/minias-real16/minias-out/**/*.context.txt
          retention-days: 14
          if-no-files-found: error

  frontier:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'frontier'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen first500 corpus
        uses: actions/download-artifact@v4
        with:
          name: frozen-linux-corpus-first500
          path: build/import-first500
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen corpus and map frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-first500
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (cd build && sha256sum -c import-first500/files.sha256 >/dev/null)
          python3 - <<'PY'
          from pathlib import Path

          frontier = [line.strip() for line in Path('assembler/corpus/first500-frontier.txt').read_text().splitlines() if line.strip() and not line.lstrip().startswith('#')]
          rows = [line.split('\t', 3) for line in Path('build/linux-focus-corpus/selected-tus.txt').read_text().splitlines() if line.strip()]
          by_asm = {preprocessed + ".s": int(index) for index, _obj, preprocessed, _source in rows}
          missing = [path for path in frontier if path not in by_asm]
          if missing:
              raise SystemExit(f"frontier entries missing from frozen first500: {missing}")
          indices = [by_asm[path] for path in frontier]
          Path('build/minias-frontier-indices.txt').write_text(','.join(map(str, indices)) + '\n')
          print(f"MINIAS_FRONTIER_MAP count={len(frontier)} indices={indices}")
          PY

      - name: Restore frozen MiniAS Linux sidecars
        uses: actions/download-artifact@v4
        with:
          name: minias-linux-sidecars-v1
          path: build/import-minias-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_SIDECARS_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and install frozen incbin sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=build/import-minias-sidecars/kernel/config_data.gz
          test -s "$payload"
          actual=$(sha256sum "$payload" | cut -d' ' -f1)
          test "$actual" = "$FROZEN_CONFIG_GZ_SHA256"
          mkdir -p kernel
          cp "$payload" kernel/config_data.gz
          echo "MINIAS_INCBIN_SIDECAR=PASS sha256=$actual"

      - name: Build compiler and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-frontier-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-frontier-toolchain check-minias-a0

      - name: Generate current frontier assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/minias-frontier-toolchain/bin/minic-cc"
          work="$GITHUB_WORKSPACE/build/minias-frontier"
          indices=$(cat build/minias-frontier-indices.txt)
          expected=$(grep -cve '^[[:space:]#]*$' assembler/corpus/first500-frontier.txt)
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --indices "$indices"
          python3 - "$work/batch-results.json" "$expected" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          expected=int(sys.argv[2])
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==expected and not bad, (len(rows), expected, bad[:5])
          print(f"MINIAS_FRONTIER_INPUT=PASS generated={expected}")
          PY

      - name: Assemble current frontier and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-frontier-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-frontier/minic-out"
          out="$GITHUB_WORKSPACE/build/minias-frontier/minias-out"
          mkdir -p "$out"
          expected=$(grep -cve '^[[:space:]#]*$' assembler/corpus/first500-frontier.txt)
          worker="$out/assemble-one.sh"
          cat >"$worker" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          minias=$1
          root=$2
          out=$3
          asm=$4
          rel="${asm#"$root"/}"
          stem="$out/${rel%.s}"
          obj="$stem.o"
          err="$stem.err"
          result="$stem.result"
          blocker="$stem.blocker"
          context="$stem.context.txt"
          mkdir -p "$(dirname "$obj")"
          if "$minias" -o "$obj" "$asm" 2>"$err"; then
            readelf -h "$obj" | grep -q 'RISC-V'
            readelf -h "$obj" | grep -q 'REL (Relocatable file)'
            printf 'PASS\t%s\t-\n' "$rel" >"$result"
          else
            raw=$(head -n 1 "$err")
            first=$(printf '%s\n' "$raw" | sed -E 's/^minic-as: //; s/:line=[0-9]+$//')
            line=$(printf '%s\n' "$raw" | sed -nE 's/.*:line=([0-9]+)$/\1/p')
            printf '%s\n' "$first" >"$blocker"
            printf 'FAIL\t%s\t%s\n' "$rel" "$first" >"$result"
            if [[ "$line" =~ ^[0-9]+$ ]]; then
              from=$(( line > 3 ? line - 3 : 1 ))
              to=$(( line + 5 ))
              {
                printf 'MINIAS_FRONTIER_CONTEXT file=%s line=%s blocker=%s\n' "$rel" "$line" "$first"
                nl -ba "$asm" | sed -n "${from},${to}p"
              } >"$context"
            fi
          fi
          SH
          chmod +x "$worker"
          mapfile -t files < <(find "$root" -type f -name '*.s' | LC_ALL=C sort)
          test "${#files[@]}" -eq "$expected"
          printf '%s\0' "${files[@]}" |
            xargs -0 -n1 -P"${MINIAS_ASSEMBLY_JOBS:-4}" "$worker" "$minias" "$root" "$out"
          mapfile -d '' -t result_files < <(find "$out" -type f -name '*.result' -print0 | LC_ALL=C sort -z)
          test "${#result_files[@]}" -eq "$expected"
          for f in "${result_files[@]}"; do cat "$f"; done >"$out/results.tsv"
          find "$out" -type f -name '*.blocker' -print0 | LC_ALL=C sort -z | xargs -0 -r cat >"$out/blockers.txt"
          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")
          {
            echo "MINIAS_FRONTIER_SUMMARY pass=$pass fail=$fail total=$expected"
            echo "MINIAS_FRONTIER_BLOCKERS"
            if test -s "$out/blockers.txt"; then
              LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr
            else
              echo "  none"
            fi
            echo "MINIAS_FRONTIER_FILES"
            cat "$out/results.tsv"
            find "$out" -type f -name '*.context.txt' -print0 | LC_ALL=C sort -z | xargs -0 -r cat
          } | tee "$out/summary.txt"
          test $((pass + fail)) -eq "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: minias-a0-current-frontier
          path: |
            build/minias-frontier/minias-out/results.tsv
            build/minias-frontier/minias-out/summary.txt
            build/minias-frontier/minias-out/**/*.err
            build/minias-frontier/minias-out/**/*.context.txt
          retention-days: 14
          if-no-files-found: error
  vector33:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'vector33'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen first500 corpus
        uses: actions/download-artifact@v4
        with:
          name: frozen-linux-corpus-first500
          path: build/import-first500
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-first500
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (cd build && sha256sum -c import-first500/files.sha256 >/dev/null)
          grep -q $'^33\t.*arch/riscv/kernel/vector\.i\t' build/linux-focus-corpus/selected-tus.txt
          echo "MINIAS_VECTOR33_CORPUS=PASS archive_sha=$actual"

      - name: Build compiler and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-vector33-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-vector33-toolchain check-minias-a0

      - name: Generate vector33 assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/minias-vector33-toolchain/bin/minic-cc"
          work="$GITHUB_WORKSPACE/build/minias-vector33"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 1 --indices 33
          python3 - "$work/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          assert len(rows)==1 and rows[0]["status"]=="PASS", rows
          print("MINIAS_VECTOR33_INPUT=PASS index=33")
          PY

      - name: Assemble vector33 and print frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-vector33-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-vector33/minic-out"
          asm=$(find "$root" -type f -path '*/arch/riscv/kernel/vector.i.s' -print -quit)
          test -n "$asm"
          out="$GITHUB_WORKSPACE/build/minias-vector33/minias-out"
          mkdir -p "$out"
          obj="$out/vector.o"
          err="$out/vector.err"
          if "$minias" -o "$obj" "$asm" 2>"$err"; then
            readelf -h "$obj" | grep -q 'RISC-V'
            readelf -h "$obj" | grep -q 'REL (Relocatable file)'
            echo "MINIAS_VECTOR33_SUMMARY pass=1 fail=0"
          else
            raw=$(head -n 1 "$err")
            first=$(printf '%s\n' "$raw" | sed -E 's/^minic-as: //; s/:line=[0-9]+$//')
            line=$(printf '%s\n' "$raw" | sed -nE 's/.*:line=([0-9]+)$/\1/p')
            echo "MINIAS_VECTOR33_SUMMARY pass=0 fail=1 blocker=$first"
            if [[ "$line" =~ ^[0-9]+$ ]]; then
              from=$(( line > 4 ? line - 4 : 1 ))
              to=$(( line + 8 ))
              printf 'MINIAS_VECTOR33_CONTEXT line=%s blocker=%s\n' "$line" "$first"
              nl -ba "$asm" | sed -n "${from},${to}p"
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minias-a0-vector33
          path: |
            build/minias-vector33/minias-out/vector.err
            build/minias-vector33/minias-out/vector.o
          retention-days: 7
          if-no-files-found: warn

  # Exact historical frozen window producer and aggregation jobs.
  resolve:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'window'
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.pick.outputs.label }}
      artifact: ${{ steps.pick.outputs.artifact }}
      corpus_dir: ${{ steps.pick.outputs.corpus_dir }}
      total: ${{ steps.pick.outputs.total }}
    steps:
      - name: Resolve frozen window
        id: pick
        shell: bash
        env:
          REQUESTED: ${{ inputs.window }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -Eeuo pipefail
          label="${REQUESTED:-}"
          if test -z "$label"; then
            case "$COMMIT_MESSAGE" in
              *"[minias-first500]"*) label=first500 ;;
              *"[minias-final352]"*) label=final352 ;;
              *"[minias-next500d]"*) label=next500d ;;
              *"[minias-next500c]"*) label=next500c ;;
              *"[minias-next500b]"*) label=next500b ;;
              *"[minias-next500]"*) label=next500 ;;
              *"[minias-new500]"*) label=new500 ;;
              *) echo "no frozen-window trigger"; exit 1 ;;
            esac
          fi
          case "$label" in
            first500)
              artifact=frozen-linux-corpus-first500
              corpus_dir=linux-focus-corpus
              total=500
              ;;
            new500)
              artifact=frozen-linux-corpus-new500
              corpus_dir=linux-new500-corpus
              total=500
              ;;
            next500)
              artifact=frozen-linux-corpus-next500
              corpus_dir=linux-next500-corpus
              total=500
              ;;
            next500b)
              artifact=frozen-linux-corpus-next500b
              corpus_dir=linux-next500b-corpus
              total=500
              ;;
            next500c)
              artifact=frozen-linux-corpus-next500c
              corpus_dir=linux-next500c-corpus
              total=500
              ;;
            next500d)
              artifact=frozen-linux-corpus-next500d
              corpus_dir=linux-next500d-corpus
              total=500
              ;;
            final352)
              artifact=frozen-linux-corpus-final352
              corpus_dir=linux-final352-corpus
              total=352
              ;;
            *) echo "unsupported window: $label"; exit 1 ;;
          esac
          echo "label=$label" >>"$GITHUB_OUTPUT"
          echo "artifact=$artifact" >>"$GITHUB_OUTPUT"
          echo "corpus_dir=$corpus_dir" >>"$GITHUB_OUTPUT"
          echo "total=$total" >>"$GITHUB_OUTPUT"
          echo "MINIAS_WINDOW_RESOLVE label=$label total=$total artifact=$artifact corpus=$corpus_dir"

  window-shard:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen window corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.artifact }}
          path: build/import-window
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen window corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-window
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (cd build && sha256sum -c import-window/files.sha256 >/dev/null)
          corpus="build/${{ needs.resolve.outputs.corpus_dir }}"
          test "$(grep -cve '^[[:space:]]*$' "$corpus/selected-tus.txt")" -eq "${{ needs.resolve.outputs.total }}"
          echo "MINIAS_WINDOW_CORPUS=PASS label=${{ needs.resolve.outputs.label }} sha=$actual"

      - name: Restore frozen MiniAS Linux sidecars
        uses: actions/download-artifact@v4
        with:
          name: minias-linux-sidecars-v1
          path: build/import-minias-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_SIDECARS_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and install frozen incbin sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=build/import-minias-sidecars/kernel/config_data.gz
          test -s "$payload"
          actual=$(sha256sum "$payload" | cut -d' ' -f1)
          test "$actual" = "$FROZEN_CONFIG_GZ_SHA256"
          mkdir -p kernel
          cp "$payload" kernel/config_data.gz
          echo "MINIAS_INCBIN_SIDECAR=PASS sha256=$actual"

      - name: Build compiler and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-window-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-window-toolchain check-minias-a0

      - name: Generate window shard assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          total=${{ needs.resolve.outputs.total }}
          shard=${{ matrix.shard }}
          chunk=$(( (total + 3) / 4 ))
          offset=$(( shard * chunk ))
          remaining=$(( total - offset ))
          limit=$chunk
          if (( remaining < limit )); then limit=$remaining; fi
          test "$limit" -gt 0
          compiler="$GITHUB_WORKSPACE/build/minias-window-toolchain/bin/minic-cc"
          corpus="$GITHUB_WORKSPACE/build/${{ needs.resolve.outputs.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/minias-${{ needs.resolve.outputs.label }}-s${{ matrix.shard }}"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$corpus" --work "$work" \
            --jobs 4 --offset "$offset" --limit "$limit" --sample-count 0
          python3 - "$work/batch-results.json" "$limit" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          expected=int(sys.argv[2])
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==expected and not bad, (len(rows), expected, bad[:5])
          print(f"MINIAS_WINDOW_INPUT=PASS generated={expected}")
          PY
          echo "$limit" >"$work/expected-count.txt"

      - name: Assemble window shard and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-window-toolchain/bin/minic-as"
          work="$GITHUB_WORKSPACE/build/minias-${{ needs.resolve.outputs.label }}-s${{ matrix.shard }}"
          root="$work/minic-out"
          out="$work/minias-out"
          expected=$(cat "$work/expected-count.txt")
          mkdir -p "$out"
          worker="$out/assemble-one.sh"
          cat >"$worker" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          minias=$1; root=$2; out=$3; asm=$4
          rel="${asm#"$root"/}"
          stem="$out/${rel%.s}"
          obj="$stem.o"; err="$stem.err"; result="$stem.result"; blocker="$stem.blocker"
          mkdir -p "$(dirname "$obj")"
          if "$minias" -o "$obj" "$asm" 2>"$err"; then
            readelf -h "$obj" | grep -q 'RISC-V'
            readelf -h "$obj" | grep -q 'REL (Relocatable file)'
            printf 'PASS\t%s\t-\n' "$rel" >"$result"
          else
            raw=$(head -n 1 "$err" || true)
            first=$(printf '%s\n' "$raw" | sed -E 's/^minic-as: //; s/:line=[0-9]+$//')
            if test -z "$first"; then first="internal:no-diagnostic"; fi
            printf '%s\n' "$first" >"$blocker"
            printf 'FAIL\t%s\t%s\n' "$rel" "$first" >"$result"
          fi
          SH
          chmod +x "$worker"
          mapfile -t files < <(find "$root" -type f -name '*.s' | LC_ALL=C sort)
          test "${#files[@]}" -eq "$expected"
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P"${MINIAS_ASSEMBLY_JOBS:-4}" "$worker" "$minias" "$root" "$out"
          mapfile -d '' -t result_files < <(find "$out" -type f -name '*.result' -print0 | LC_ALL=C sort -z)
          test "${#result_files[@]}" -eq "$expected"
          for f in "${result_files[@]}"; do cat "$f"; done >"$out/results.tsv"
          find "$out" -type f -name '*.blocker' -print0 | LC_ALL=C sort -z | xargs -0 -r cat >"$out/blockers.txt"
          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")
          echo "MINIAS_WINDOW_SHARD label=${{ needs.resolve.outputs.label }} shard=${{ matrix.shard }} pass=$pass fail=$fail total=$expected"
          test $((pass + fail)) -eq "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: minias-a0-${{ needs.resolve.outputs.label }}-shard-${{ matrix.shard }}
          path: |
            build/minias-${{ needs.resolve.outputs.label }}-s${{ matrix.shard }}/minias-out/results.tsv
            build/minias-${{ needs.resolve.outputs.label }}-s${{ matrix.shard }}/minias-out/blockers.txt
          retention-days: 14
          if-no-files-found: error

  window:
    needs: [resolve, window-shard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: minias-a0-${{ needs.resolve.outputs.label }}-shard-*
          path: build/minias-window-shards

      - name: Aggregate frozen window headline
        shell: bash
        run: |
          set -Eeuo pipefail
          label="${{ needs.resolve.outputs.label }}"
          total=${{ needs.resolve.outputs.total }}
          out=build/minias-window-aggregate
          mkdir -p "$out"
          mapfile -t results < <(find build/minias-window-shards -type f -name results.tsv | LC_ALL=C sort)
          mapfile -t blockers < <(find build/minias-window-shards -type f -name blockers.txt | LC_ALL=C sort)
          test "${#results[@]}" -eq 4
          for f in "${results[@]}"; do cat "$f"; done | LC_ALL=C sort -t $'\t' -k2,2 >"$out/results.tsv"
          : >"$out/blockers.txt"
          for f in "${blockers[@]}"; do cat "$f"; done >"$out/blockers.txt"
          test "$(wc -l < "$out/results.tsv")" -eq "$total"
          awk -F '\t' '$1=="FAIL" {print}' "$out/results.tsv" >"$out/failure-pool.tsv"
          awk -F '\t' '$1=="FAIL" && ($3 ~ /^internal:/ || $3 ~ /^out-of-memory:/ || $3 ~ /^unknown-error/) {print}' "$out/results.tsv" >"$out/error-pool.tsv"
          python3 - "$out/failure-pool.tsv" "$out/candidate-active-sample.txt" <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import sys
          rows=[]
          for line in Path(sys.argv[1]).read_text().splitlines():
              if line.strip():
                  _status,path,blocker=line.split("\t",2)
                  rows.append((path,blocker))
          groups=defaultdict(list)
          for path,blocker in rows: groups[blocker].append(path)
          for paths in groups.values(): paths.sort()
          ordered=sorted(groups,key=lambda b:(-len(groups[b]),b))
          active=[]
          while len(active)<min(16,len(rows)):
              progressed=False
              for blocker in ordered:
                  if groups[blocker] and len(active)<16:
                      active.append(groups[blocker].pop(0)); progressed=True
              if not progressed: break
          Path(sys.argv[2]).write_text("".join(path+"\n" for path in active))
          print(f"MINIAS_WINDOW_FAILURE_POOL fail={len(rows)} candidate_active={len(active)}")
          PY
          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")
          {
            echo "MINIAS_WINDOW_SUMMARY label=$label pass=$pass fail=$fail total=$total"
            echo "MINIAS_WINDOW_TOP_BLOCKERS"
            if test -s "$out/blockers.txt"; then LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr | head -n 40; else echo "  none"; fi
            if test "$label" = first500; then
              echo "MINIAS_FIRST500_FIRST_PASSES"
              awk -F '\t' '$1=="PASS" && shown < 30 {print $2; shown++}' "$out/results.tsv"
            fi
            echo "MINIAS_WINDOW_CANDIDATE_ACTIVE_SAMPLE"
            cat "$out/candidate-active-sample.txt"
            echo "MINIAS_WINDOW_ERROR_POOL"
            if test -s "$out/error-pool.tsv"; then cat "$out/error-pool.tsv"; else echo "  none"; fi
          } | tee "$out/summary.txt"
          test $((pass + fail)) -eq "$total"

      - uses: actions/upload-artifact@v4
        with:
          name: minias-a0-${{ needs.resolve.outputs.label }}-progress
          path: |
            build/minias-window-aggregate/results.tsv
            build/minias-window-aggregate/summary.txt
            build/minias-window-aggregate/failure-pool.tsv
            build/minias-window-aggregate/error-pool.tsv
            build/minias-window-aggregate/candidate-active-sample.txt
          retention-days: 14
          if-no-files-found: error

  c-shards:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'semantic'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: first500
            artifact: frozen-linux-corpus-first500
            corpus_dir: linux-focus-corpus
            total: 500
          - label: new500
            artifact: frozen-linux-corpus-new500
            corpus_dir: linux-new500-corpus
            total: 500
          - label: next500
            artifact: frozen-linux-corpus-next500
            corpus_dir: linux-next500-corpus
            total: 500
          - label: next500b
            artifact: frozen-linux-corpus-next500b
            corpus_dir: linux-next500b-corpus
            total: 500
          - label: next500c
            artifact: frozen-linux-corpus-next500c
            corpus_dir: linux-next500c-corpus
            total: 500
          - label: next500d
            artifact: frozen-linux-corpus-next500d
            corpus_dir: linux-next500d-corpus
            total: 500
          - label: final352
            artifact: frozen-linux-corpus-final352
            corpus_dir: linux-final352-corpus
            total: 352
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install oracle dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3-pyelftools

      - name: Download frozen Linux corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/import-${{ matrix.label }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen Linux corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          import="build/import-${{ matrix.label }}"
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (cd build && sha256sum -c "import-${{ matrix.label }}/files.sha256" >/dev/null)
          manifest="build/${{ matrix.corpus_dir }}/selected-tus.txt"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq ${{ matrix.total }}

      - name: Restore frozen incbin sidecar
        uses: actions/download-artifact@v4
        with:
          name: minias-linux-sidecars-v1
          path: build/import-minias-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_SIDECARS_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and install sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=build/import-minias-sidecars/kernel/config_data.gz
          test -s "$payload"
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = "$FROZEN_CONFIG_GZ_SHA256"
          mkdir -p kernel
          cp "$payload" kernel/config_data.gz

      - name: Build exact MiniC and MiniAS
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-semantic-${{ matrix.label }}-toolchain all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-semantic-${{ matrix.label }}-toolchain check-minias-a0

      - name: Generate exact MiniC assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/minias-semantic-${{ matrix.label }}-toolchain/bin/minic-cc"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/minias-semantic-${{ matrix.label }}"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$corpus" --work "$work" \
            --jobs 4 --offset 0 --limit ${{ matrix.total }} --sample-count 0
          test "$(find "$work/minic-out" -type f -name '*.s' | wc -l)" -eq ${{ matrix.total }}

      - name: Compare GNU as and MiniAS semantically
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/assembler/run_semantic_oracle.py \
            --input-root "build/minias-semantic-${{ matrix.label }}/minic-out" \
            --output-root "build/minias-semantic-${{ matrix.label }}/oracle" \
            --minias "build/minias-semantic-${{ matrix.label }}-toolchain/bin/minic-as" \
            --oracle tests/assembler/elf_semantic_compare.py \
            --jobs 4 --expected ${{ matrix.total }}

      - uses: actions/upload-artifact@v4
        with:
          name: minias-semantic-${{ matrix.label }}
          path: |
            build/minias-semantic-${{ matrix.label }}/oracle/results.tsv
            build/minias-semantic-${{ matrix.label }}/oracle/summary.txt
            build/minias-semantic-${{ matrix.label }}/oracle/semantic/**/*.json
          retention-days: 14
          if-no-files-found: error

  c149:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'semantic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install oracle dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3-pyelftools

      - name: Download frozen C149 corpus
        uses: actions/download-artifact@v4
        with:
          name: minias-ground-truth-c149-corpus
          path: build/import-c149
          repository: ${{ github.repository }}
          run-id: ${{ env.C149_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and extract C149
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(cut -d' ' -f1 build/import-c149/minias-ground-truth-c149-corpus.tar.gz.sha256)
          actual=$(sha256sum build/import-c149/minias-ground-truth-c149-corpus.tar.gz | cut -d' ' -f1)
          test "$actual" = "$expected"
          cd build
          tar -xzf import-c149/minias-ground-truth-c149-corpus.tar.gz
          corpus="$GITHUB_WORKSPACE/build/minias-ground-truth-c149-corpus"
          test "$(grep -cve '^[[:space:]]*$' "$corpus/selected-tus.txt")" -eq 149
          (cd "$corpus" && sha256sum -c files.sha256 >/dev/null)

      - name: Restore frozen incbin sidecar
        uses: actions/download-artifact@v4
        with:
          name: minias-linux-sidecars-v1
          path: build/import-minias-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_SIDECARS_RUN }}
          github-token: ${{ github.token }}

      - name: Install sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=build/import-minias-sidecars/kernel/config_data.gz
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = "$FROZEN_CONFIG_GZ_SHA256"
          mkdir -p kernel
          cp "$payload" kernel/config_data.gz

      - name: Build exact MiniC and MiniAS
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-semantic-c149-toolchain all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-semantic-c149-toolchain check-minias-a0

      - name: Replay C149 through MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/minias-semantic-c149-toolchain/bin/minic-cc" \
            --corpus "$GITHUB_WORKSPACE/build/minias-ground-truth-c149-corpus" \
            --work "$GITHUB_WORKSPACE/build/minias-semantic-c149-replay" \
            --jobs 4 --offset 0 --limit 149 --sample-count 0
          test "$(find build/minias-semantic-c149-replay/minic-out -type f -name '*.s' | wc -l)" -eq 149

      - name: Compare C149 objects semantically
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/assembler/run_semantic_oracle.py \
            --input-root build/minias-semantic-c149-replay/minic-out \
            --output-root build/minias-semantic-c149-oracle \
            --minias build/minias-semantic-c149-toolchain/bin/minic-as \
            --oracle tests/assembler/elf_semantic_compare.py \
            --jobs 4 --expected 149

      - uses: actions/upload-artifact@v4
        with:
          name: minias-semantic-c149
          path: |
            build/minias-semantic-c149-oracle/results.tsv
            build/minias-semantic-c149-oracle/summary.txt
            build/minias-semantic-c149-oracle/semantic/**/*.json
          retention-days: 14
          if-no-files-found: error

  native35:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'semantic'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install semantic-oracle and exact Linux RISC-V build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            flex bison bc libelf-dev libssl-dev dwarves python3-pyelftools

      - name: Rebuild native35 from exact targeted Kbuild object commands
        shell: bash
        env:
          LINUX_VERSION: "6.6.143"
          LINUX_ARCHIVE_SHA256: "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/minias-semantic-native35-linux-src"
          out="$GITHUB_WORKSPACE/build/minias-semantic-native35-linux-out"
          fixture="$GITHUB_WORKSPACE/build/minias-semantic-native35-inputs"
          archive="$GITHUB_WORKSPACE/build/linux-${LINUX_VERSION}.tar.xz"
          mkdir -p build
          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          rm -rf "$src" "$out" "$fixture"
          mkdir -p "$src" "$out" "$fixture"
          tar -xJf "$archive" -C "$src" --strip-components=1
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts

          cat >build/minias-semantic-native35-targets.txt <<'EOF'
          arch/riscv/errata/sifive/errata_cip_453.s
          arch/riscv/kernel/compat_vdso/compat_vdso.s
          arch/riscv/kernel/compat_vdso/flush_icache.s
          arch/riscv/kernel/compat_vdso/getcpu.s
          arch/riscv/kernel/compat_vdso/note.s
          arch/riscv/kernel/compat_vdso/rt_sigreturn.s
          arch/riscv/kernel/copy-unaligned.s
          arch/riscv/kernel/entry.s
          arch/riscv/kernel/fpu.s
          arch/riscv/kernel/head.s
          arch/riscv/kernel/suspend_entry.s
          arch/riscv/kernel/vdso/flush_icache.s
          arch/riscv/kernel/vdso/getcpu.s
          arch/riscv/kernel/vdso/note.s
          arch/riscv/kernel/vdso/rt_sigreturn.s
          arch/riscv/kernel/vdso/sys_hwprobe.s
          arch/riscv/kernel/vdso/vdso.s
          arch/riscv/kvm/vcpu_switch.s
          arch/riscv/lib/clear_page.s
          arch/riscv/lib/memcpy.s
          arch/riscv/lib/memmove.s
          arch/riscv/lib/memset.s
          arch/riscv/lib/strcmp.s
          arch/riscv/lib/strlen.s
          arch/riscv/lib/strncmp.s
          arch/riscv/lib/tishift.s
          arch/riscv/lib/uaccess.s
          arch/riscv/purgatory/entry.s
          arch/riscv/purgatory/kexec-purgatory.s
          arch/riscv/purgatory/memcpy.s
          arch/riscv/purgatory/memset.s
          arch/riscv/purgatory/strcmp.s
          arch/riscv/purgatory/strlen.s
          arch/riscv/purgatory/strncmp.s
          usr/initramfs_data.s
          EOF
          sed -i 's/^[[:space:]]*//' build/minias-semantic-native35-targets.txt
          test "$(wc -l < build/minias-semantic-native35-targets.txt)" -eq 35

          mapfile -t asm_targets < build/minias-semantic-native35-targets.txt
          obj_targets=()
          for rel in "${asm_targets[@]}"; do
            obj_targets+=("${rel%.s}.o")
          done
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 "${obj_targets[@]}"

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, re, shlex, subprocess

          out = Path("build/minias-semantic-native35-linux-out").resolve()
          fixture = Path("build/minias-semantic-native35-inputs").resolve()
          desired = set(Path("build/minias-semantic-native35-targets.txt").read_text().splitlines())
          if len(desired) != 35:
              raise SystemExit(f"expected 35 desired assembly targets, got {len(desired)}")

          output_re = re.compile(r"(?:^|\s)-o\s+([^\s;]+\.o)(?=\s|;|$)")
          source_re = re.compile(r"(?:^|\s)([^\s;]+\.S)(?=\s|;|$)")
          rows = {}

          def normalize_output(token: str) -> str:
              path = Path(token.strip("'\""))
              if path.is_absolute():
                  try:
                      return path.resolve().relative_to(out).as_posix()
                  except ValueError:
                      return ""
              return PurePosixPath(path.as_posix()).as_posix()

          for cmdfile in out.rglob(".*.cmd"):
              try:
                  lines = cmdfile.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              for raw in lines:
                  if ":=" not in raw or " -c " not in f" {raw} ":
                      continue
                  objects = output_re.findall(raw)
                  sources = source_re.findall(raw)
                  if not objects or not sources:
                      continue
                  obj = normalize_output(objects[-1])
                  if not obj.endswith(".o"):
                      continue
                  rel_s = obj[:-2] + ".s"
                  if rel_s not in desired:
                      continue
                  command = raw.split(":=", 1)[1].strip()
                  tokens = shlex.split(command, posix=True)
                  rows[rel_s] = {
                      "object": obj,
                      "source": sources[-1].strip("'\""),
                      "cmdfile": cmdfile.relative_to(out).as_posix(),
                      "tokens": tokens,
                  }

          missing = sorted(desired - set(rows))
          extra = sorted(set(rows) - desired)
          if missing or extra or len(rows) != 35:
              raise SystemExit(
                  f"native35 Kbuild command mismatch rows={len(rows)} missing={missing} extra={extra}"
              )

          manifest = []
          for index, rel_s in enumerate(sorted(desired)):
              meta = rows[rel_s]
              tokens = list(meta["tokens"])
              compile_index = tokens.index("-c")
              output_index = tokens.index("-o")
              target = fixture / rel_s
              target.parent.mkdir(parents=True, exist_ok=True)
              tokens[compile_index] = "-E"
              tokens[output_index + 1] = str(target)
              proc = subprocess.run(
                  tokens,
                  cwd=out,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              if proc.returncode != 0 or not target.is_file() or target.stat().st_size == 0:
                  raise RuntimeError(
                      f"native preprocess failed target={rel_s} rc={proc.returncode}: "
                      + proc.stderr[-2000:]
                  )
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              manifest.append({
                  "index": index,
                  "assembly": rel_s,
                  "object": meta["object"],
                  "source": meta["source"],
                  "cmdfile": meta["cmdfile"],
                  "sha256": digest,
              })

          (fixture / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          (fixture / "SHA256SUMS").write_text(
              "".join(f"{row['sha256']}  {row['assembly']}\n" for row in manifest)
          )
          print("MINIAS_NATIVE35_FIXTURE=PASS selected=35 source=targeted-kbuild-object-commands")
          PY

      - name: Build exact MiniAS
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-semantic-native35-toolchain all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-semantic-native35-toolchain check-minias-a0

      - name: Compare regenerated native35 objects semantically
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/assembler/run_semantic_oracle.py \
            --input-root build/minias-semantic-native35-inputs \
            --output-root build/minias-semantic-native35-oracle \
            --minias build/minias-semantic-native35-toolchain/bin/minic-as \
            --oracle tests/assembler/elf_semantic_compare.py \
            --cwd build/minias-semantic-native35-linux-out \
            --native35 --jobs 4 --expected 35

      - uses: actions/upload-artifact@v4
        with:
          name: minias-semantic-native35
          path: |
            build/minias-semantic-native35-inputs/manifest.json
            build/minias-semantic-native35-inputs/SHA256SUMS
            build/minias-semantic-native35-oracle/results.tsv
            build/minias-semantic-native35-oracle/summary.txt
            build/minias-semantic-native35-oracle/semantic/**/*.json
          retention-days: 14
          if-no-files-found: error

  aggregate:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'semantic'
    needs: [c-shards, c149, native35]
    runs-on: ubuntu-24.04
    steps:
      - name: Require classification jobs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.c-shards.result }}" = success
          test "${{ needs.c149.result }}" = success
          test "${{ needs.native35.result }}" = success

      - uses: actions/download-artifact@v4
        with:
          pattern: minias-semantic-*
          path: build/minias-semantic-3536

      - name: Aggregate 3536 semantic baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path

          root=Path("build/minias-semantic-3536")
          files=sorted(root.rglob("results.tsv"))
          if len(files) != 9:
              raise SystemExit(f"expected 9 result cohorts, got {len(files)}")

          status=Counter()
          dimensions=Counter()
          strict=0
          total=0
          for path in files:
              for raw in path.read_text().splitlines():
                  if not raw.strip():
                      continue
                  state, rel, strict_flag, dims = raw.split("\t", 3)
                  total += 1
                  status[state] += 1
                  strict += strict_flag == "1"
                  if dims != "-":
                      for dim in dims.split(","):
                          dimensions[dim] += 1

          print(
              f"MINIAS_SEMANTIC_3536_BASELINE selected={total} "
              f"semantic_equal={status['PASS']} semantic_diff={status['DIFF']} "
              f"strict_equal={strict} gnu_fail={status['GNU_FAIL']} "
              f"minias_fail={status['MINIAS_FAIL']} oracle_error={status['ORACLE_ERROR']}"
          )
          print("MINIAS_SEMANTIC_3536_DIMENSIONS")
          for name,count in dimensions.most_common():
              print(f"{count:5d} {name}")

          if total != 3536:
              raise SystemExit(f"expected 3536 classified objects, got {total}")
          if status['GNU_FAIL'] or status['MINIAS_FAIL'] or status['ORACLE_ERROR']:
              raise SystemExit("semantic oracle infrastructure failure")
          PY
