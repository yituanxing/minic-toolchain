name: Net Core Filter Phase Trace V0

on:
  push:
    branches: ["agent/net-core-filter-phase-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net-core-filter-phase-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 Linux prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3 time

      - name: Build current runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-phase"
          mkdir -p "$work/evidence"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$work/toolchain" "$work/evidence/profile"

      - name: Prepare Linux 6.6.143
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-phase"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare

      - name: Warm filter Kbuild prerequisites with GCC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-phase"
          src="$work/linux-6.6.143"
          out="$work/out"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            CC=/usr/bin/riscv64-linux-gnu-gcc -j4 net/core/filter.o
          test -s "$out/net/core/filter.o"
          rm -f "$out/net/core/filter.o"

      - name: Phase trace net/core/filter.o
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-phase"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          minic="$work/toolchain/bin/minic"
          rm -f "$out/net/core/filter.o"
          start=$(date +%s)
          set +e
          /usr/bin/time -v -o "$ev/filter-phase.time.txt" \
            timeout --signal=TERM --kill-after=20s 30s \
            env MINIC="$minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
              MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/filter-phase.kbuild.trace" \
              MINIC_BOOTSTRAP_TRACE=1 MINIC_SPECIALIZATION_PERF_TRACE=1 CORE_FAST_TRACE=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
                CC="$wrapper" -j1 V=1 net/core/filter.o >"$ev/filter-phase.log" 2>&1
          rc=$?
          set -e
          elapsed=$(($(date +%s) - start))
          printf 'FILTER_PHASE_RC=%s\nFILTER_PHASE_ELAPSED_S=%s\n' "$rc" "$elapsed" | tee "$ev/filter-phase-summary.txt"
          side="$out/net/core/filter.minic-stage2.minic.stderr"
          if test -f "$side"; then
            cp "$side" "$ev/filter-minic.stderr"
          fi
          if test -f "$out/net/core/filter.minic-stage2.i"; then
            wc -c "$out/net/core/filter.minic-stage2.i" >"$ev/filter-i-bytes.txt"
          fi
          grep -a 'MINIC_BOOTSTRAP_TRACE' "$ev/filter-minic.stderr" >"$ev/bootstrap-trace.txt" 2>/dev/null || true
          grep -a -E 'MINIC_BOOTSTRAP_TRACE|MINIC_SPECIALIZATION_PERF|MINIC_KBUILD_BLOCKER|error:|fatal:|Killed|Terminated' \
            "$ev/filter-minic.stderr" "$ev/filter-phase.log" | tail -n 3000 >"$ev/filter-phase-diagnostic.txt" 2>/dev/null || true
          tail -n 500 "$ev/filter-phase.log" >"$ev/filter-phase-tail.txt" || true
          exit "$rc"

      - name: Preserve phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-core-filter-phase-v0
          path: build/filter-phase/evidence/
          if-no-files-found: error
          retention-days: 7
