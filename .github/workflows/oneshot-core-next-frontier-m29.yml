name: One-shot Core Next Frontier M29

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Build strict compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m29-probe

      - name: Extract exact frozen blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('build/linux-focus-corpus/kbuild')
          names = ['mul_u64_u32_div', 'cpu_relax', 'get_current', 'arch_atomic_add', 'IS_ERR_OR_NULL']

          def definition(text, name):
              for m in re.finditer(r'\b' + re.escape(name) + r'\s*\(', text):
                  i = text.find('(', m.start())
                  depth = 0
                  end_paren = None
                  for j in range(i, len(text)):
                      if text[j] == '(':
                          depth += 1
                      elif text[j] == ')':
                          depth -= 1
                          if depth == 0:
                              end_paren = j + 1
                              break
                  if end_paren is None:
                      continue
                  semi = text.find(';', end_paren)
                  brace = text.find('{', end_paren)
                  if brace < 0 or (semi >= 0 and semi < brace):
                      continue
                  start = text.rfind('\n', 0, max(0, m.start() - 500)) + 1
                  depth = 0
                  end = None
                  for j in range(brace, len(text)):
                      if text[j] == '{':
                          depth += 1
                      elif text[j] == '}':
                          depth -= 1
                          if depth == 0:
                              end = j + 1
                              break
                  if end is not None:
                      return text[start:end]
              return None

          files = list(root.rglob('*.i'))
          preferred = {
              'mul_u64_u32_div': ['init/do_mounts.i'],
              'cpu_relax': ['init/do_mounts_initrd.i'],
              'get_current': ['init/version.i'],
              'arch_atomic_add': ['init/init_task.i'],
              'IS_ERR_OR_NULL': ['arch/riscv/kernel/pi/cmdline_early.i'],
          }
          for name in names:
              candidates = []
              for suffix in preferred[name]:
                  candidates.extend(p for p in files if str(p).endswith(suffix))
              candidates.extend(p for p in files if p not in candidates)
              found = False
              for p in candidates:
                  try:
                      text = p.read_text(errors='replace')
                  except OSError:
                      continue
                  if name not in text:
                      continue
                  body = definition(text, name)
                  if body is None:
                      continue
                  print(f'M29_EXACT_BEGIN name={name} file={p}')
                  print(body)
                  print(f'M29_EXACT_END name={name}')
                  found = True
                  break
              if not found:
                  print(f'M29_EXACT_MISSING name={name}')
          PY

      - name: Probe scalar likely seams
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/core-m29-probe/bin/minic"
          w="$GITHUB_WORKSPACE/build/core-m29-shapes"
          mkdir -p "$w"

          cat > "$w/mul_mixed.i" <<'EOF'
          unsigned long probe_m29_mul_mixed(unsigned long a, unsigned int b) { return a * b; }
          EOF
          cat > "$w/div_mixed.i" <<'EOF'
          unsigned long probe_m29_div_mixed(unsigned long a, unsigned int b) { return a / b; }
          EOF
          cat > "$w/helper_call.i" <<'EOF'
          unsigned long helper_m29(unsigned long a, unsigned int b) { return a / b; }
          unsigned long probe_m29_helper_call(unsigned long a, unsigned int b) { return helper_m29(a, b); }
          EOF
          cat > "$w/or_value.i" <<'EOF'
          int probe_m29_or_value(const void *p) { return !p || ((unsigned long)p >= (unsigned long)-4095L); }
          EOF
          cat > "$w/basic_asm.i" <<'EOF'
          void probe_m29_basic_asm(void) { __asm__ volatile("nop"); }
          EOF
          cat > "$w/output_asm.i" <<'EOF'
          unsigned long probe_m29_output_asm(unsigned long x) { unsigned long y; __asm__("mv %0, %1" : "=r"(y) : "r"(x)); return y; }
          EOF

          for n in mul_mixed div_mixed helper_call or_value basic_asm output_asm; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "$w/$n.i" -o "$w/$n.s" 2>"$w/$n.err"
              rc=$?
              set -e
              printf 'M29_SHAPE name=%s rc=%d message=' "$n" "$rc"
              tr '\n' ' ' < "$w/$n.err"
              printf '\n'
          done
