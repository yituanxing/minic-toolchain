name: Agent Record Designated Init

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.head_ref == 'refactor/foundation-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-designated-init-v0
          fetch-depth: 0
      - name: Generate and validate slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_record_designated_init_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/record-designated-compiler
          MINIC="$GITHUB_WORKSPACE/build/record-designated-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-designated-focused" \
            sh tests/compiler/c0/run-gnu-record-alignment.sh
          MINIC="$GITHUB_WORKSPACE/build/record-designated-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-designated-focused-all" \
            sh tools/dev/pr76-focused.sh
          make -j4 MODE=release BUILD_DIR=build/record-designated-compiler check-fast
      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/attribute.h \
            src/frontend/attribute.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_attribute.c \
            src/frontend/parser_function.c \
            src/frontend/parser_record.c \
            tests/compiler/c0/gnu_record_alignment.c \
            tests/compiler/c0/invalid_record_designated_init_arguments.c \
            tests/compiler/c0/invalid_union_designated_init.c \
            tests/compiler/c0/run-gnu-record-alignment.sh
          git diff --cached --check
          git diff --cached --quiet && {
            printf '%s\n' 'generator produced no source changes' >&2
            exit 1
          }
          git commit -m '[generated] frontend: converge record suffix type attributes' \
            -m 'Route record suffix GNU attributes through the shared AttributeRegistry consumer path. Classify designated_init as a zero-argument diagnostic struct type attribute, preserve its no-codegen behavior, and converge record/object aligned argument decoding on one parser attribute service instead of maintaining duplicate ICE decoders.\n\n让 record suffix GNU attribute 进入共享 AttributeRegistry consumer 路径。将 designated_init 分类为零参数、仅 struct 的 diagnostic type attribute，不改变 codegen；同时让 record/object 的 aligned 参数共用同一个 parser attribute service，删除重复 ICE decoder。'
          git push origin HEAD:agent/record-designated-init-v0 --force-with-lease
