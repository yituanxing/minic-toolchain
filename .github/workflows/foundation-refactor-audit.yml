name: Foundation Refactor Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-local-label-patch
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 1

      - name: Generate GNU local-label source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_local_label_patch.py
          clang-format-18 -i \
            src/frontend/parser_internal.h \
            src/frontend/parser_core.c \
            src/frontend/parser_statement.c \
            src/frontend/ast.h \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/frontend/cast_normalization.c \
            src/target/riscv64/codegen_expression.c
          git diff --check -- src/frontend src/target/riscv64/codegen_expression.c

      - name: Build generated compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/local-label-generated
          make -j4 MODE=release BUILD_DIR=build/local-label-generated check-fast

      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend src/target/riscv64/codegen_expression.c
          git commit -m 'frontend: add GNU local label addresses'
          git push --force origin HEAD:agent/local-label-generated
