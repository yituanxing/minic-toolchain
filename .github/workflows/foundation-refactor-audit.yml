name: Foundation Refactor Validation

on:
  push:
    branches:
      - refactor/foundation-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify formatting without source rewriting
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --exit-code -- include src tools/minic

      - name: Build committed compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler

      - name: Run frozen Lua and Linux focused semantic gates
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/foundation-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/foundation-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Record source-of-truth invariant
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'PASS source-of-truth: checked-in include/src/tools/minic is the compiler under test' \
            'PASS staging: no semantic source-rewrite step executed by this workflow'
