name: Foundation Refactor Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-prefix-section-patch
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 1

      - name: Generate deferred prefix-section semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_prefix_section_patch.py
          clang-format-18 -i \
            src/frontend/parser_function.c \
            src/target/riscv64/codegen_inline_asm.c
          git diff --check -- src/frontend/parser_function.c src/target/riscv64/codegen_inline_asm.c

      - name: Build generated compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/prefix-section-generated

      - name: Run deferred prefix-section gate
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/prefix-section-generated/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/prefix-section-focused" \
          HOST_CC=cc \
            sh -x tests/compiler/c0/run-gnu-section-symbol-attribute.sh || {
              cat "$GITHUB_WORKSPACE/build/prefix-section-focused/tests/compiler-c0-gnu-section-symbol-attribute/gnu_section_symbol_attribute.s" 2>/dev/null || true
              exit 1
            }

      - name: Run asm-goto safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/prefix-section-generated/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/asm-goto-safety-focused" \
          HOST_CC=cc \
            sh -x tests/compiler/c0/run-gnu-inline-asm-goto.sh

      - name: Run fast compiler contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/prefix-section-generated check-fast

      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_function.c src/target/riscv64/codegen_inline_asm.c
          git commit -m 'frontend: apply deferred object section attributes'
          git push --force origin HEAD:agent/prefix-section-generated
