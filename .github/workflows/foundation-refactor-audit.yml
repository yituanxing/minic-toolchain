name: Foundation Refactor Validation

on:
  push:
    branches:
      - refactor/foundation-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-source:
    if: github.event_name == 'push' || github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1

      - name: Apply shared function declarator migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/maintenance/foundation-function-declarator-once.py

      - name: Format candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Verify candidate diff scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only
          bad=$(git diff --name-only | grep -Ev '^(Makefile|src/frontend/parser_declarator\.c|src/frontend/parser_internal\.h|src/frontend/parser_function\.c|src/frontend/parser_record\.c|src/frontend/parser_typedef\.c|src/frontend/parser_global\.c|tests/compiler/c0/shared_function_declarator\.c|tools/dev/pr76-focused\.sh)$' || true)
          if test -n "$bad"; then
            printf '%s\n' "unexpected function declarator migration paths:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

      - name: Build compiler candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler

      - name: Run fast compiler contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler check-fast

      - name: Run focused declarator and frozen Lua/Linux semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/foundation-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/foundation-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Commit validated function declarator migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Makefile src/frontend/parser_declarator.c src/frontend/parser_internal.h \
            src/frontend/parser_function.c src/frontend/parser_record.c \
            src/frontend/parser_typedef.c src/frontend/parser_global.c \
            tests/compiler/c0/shared_function_declarator.c tools/dev/pr76-focused.sh
          if git diff --cached --quiet; then
            echo 'no function declarator candidate changes to commit'
            exit 0
          fi
          git commit -m 'refactor: share parenthesized function declarators'
          git push origin HEAD:refactor/foundation-v1
