name: Foundation Refactor Validation

on:
  push:
    branches:
      - refactor/foundation-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-source:
    if: github.event_name == 'push' || github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1

      - name: Apply builtin clzll candidate once
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -q 'MINIC_EXPRESSION_BUILTIN_UNARY' src/frontend/ast.h; then
            echo 'applied=0' >> "$GITHUB_OUTPUT"
          else
            python3 tools/dev/foundation-builtin-clzll-once.py
            python3 tools/dev/foundation-builtin-clzll-candidate-fix.py
            chmod +x tests/compiler/c0/run-builtin-clzll.sh tests/compiler/c0/run-builtin-clzll-rv64.sh
            echo 'applied=1' >> "$GITHUB_OUTPUT"
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

      - name: Verify candidate scope
        shell: bash
        run: |
          set -Eeuo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              src/frontend/ast.h|src/frontend/parser_expression.c|src/frontend/ast_verifier.c|src/frontend/cast_normalization.c|src/target/riscv64/codegen_expression.c|tests/compiler/c0/builtin_clzll.c|tests/compiler/c0/run-builtin-clzll.sh|tests/compiler/c0/run-builtin-clzll-rv64.sh|tools/dev/pr76-focused.sh) ;;
              '') ;;
              *) printf '%s\n' "unexpected candidate path: $path" >&2; bad=1 ;;
            esac
          done <<EOF
          $(git diff --name-only)
          EOF
          test "$bad" -eq 0
          git diff --check

      - name: Build candidate compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler

      - name: Run full fast contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler check-fast

      - name: Run frozen Lua and Linux focused semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/foundation-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/foundation-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Install real RV64 runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross qemu-user

      - name: Run GCC-MiniC clzll RV64 differential
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/foundation-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/foundation-clzll-rv64" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-builtin-clzll-rv64.sh

      - name: Commit validated source candidate
        if: steps.candidate.outputs.applied == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/ast.h \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/frontend/cast_normalization.c \
            src/target/riscv64/codegen_expression.c \
            tests/compiler/c0/builtin_clzll.c \
            tests/compiler/c0/run-builtin-clzll.sh \
            tests/compiler/c0/run-builtin-clzll-rv64.sh \
            tools/dev/pr76-focused.sh
          git diff --cached --check
          git commit -m 'compiler: add normalized unary builtin clzll lowering'
          git push origin HEAD:refactor/foundation-v1
