name: Foundation Refactor Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-typedef-alignment-patch
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 1

      - name: Generate attributed typedef alignment source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/dev/agent_typedef_alignment_patch.py')
          text = path.read_text()
          old = '''    if count != 1:\n        raise SystemExit(f"{label}: expected one anchor, found {count}")\n    p.write_text(text.replace(old, new, 1))\n'''
          new = '''    if count < 1:\n        raise SystemExit(f"{label}: expected an anchor, found {count}")\n    p.write_text(text.replace(old, new, 1))\n'''
          if text.count(old) != 1:
              raise SystemExit('generator replace helper anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 tools/dev/agent_typedef_alignment_patch.py
          clang-format-18 -i \
            src/frontend/type.h \
            src/frontend/type.c \
            src/frontend/parser_typedef.c \
            src/target/data_layout.c
          git diff --check -- src/frontend/type.h src/frontend/type.c \
            src/frontend/parser_typedef.c src/target/data_layout.c

      - name: Build and run focused semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/typedef-alignment-generated
          MINIC="$GITHUB_WORKSPACE/build/typedef-alignment-generated/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/typedef-alignment-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-typedef-redundant-aligned.sh
          make -j4 MODE=release BUILD_DIR=build/typedef-alignment-generated check-fast

      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/type.h src/frontend/type.c src/frontend/parser_typedef.c \
            src/target/data_layout.c
          git commit -m 'frontend: model attributed typedef alignment'
          git push --force origin HEAD:agent/typedef-alignment-generated
