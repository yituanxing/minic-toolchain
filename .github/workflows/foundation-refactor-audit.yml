name: Foundation Refactor Validation

on:
  push:
    branches:
      - refactor/foundation-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-source:
    if: github.event_name == 'push' || github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1

      - name: Apply generic for-update candidate once
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -q 'for update only supports a discarded void cast here' src/frontend/parser_statement.c; then
            python3 tools/dev/foundation-for-update-expression-once.py
            python3 tools/dev/foundation-for-update-contract-fix.py
            chmod +x tests/compiler/c0/run-for-expression-initializers.sh
            echo 'applied=1' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=0' >> "$GITHUB_OUTPUT"
          fi
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

      - name: Verify candidate scope and ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              src/frontend/parser_statement.c|tests/compiler/c0/for_expression_initializer.c|tests/compiler/c0/run-for-expression-initializers.sh|tests/compiler/c0/run-for-loops.sh) ;;
              '') ;;
              *) printf '%s\n' "unexpected candidate path: $path" >&2; bad=1 ;;
            esac
          done <<EOF
          $(git diff --name-only)
          EOF
          test "$bad" -eq 0
          git diff --check
          ! grep -q 'for update only supports a discarded void cast here' src/frontend/parser_statement.c
          ! grep -q 'for update supports at most eight comma-separated items' src/frontend/parser_statement.c
          grep -q 'minic_parser_parse_full_expression(parser, &statement.expression)' src/frontend/parser_statement.c

      - name: Build candidate compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler

      - name: Run full fast contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler check-fast

      - name: Run frozen Lua and Linux focused semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/foundation-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/foundation-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Commit validated source candidate
        if: steps.candidate.outputs.applied == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/parser_statement.c \
            tests/compiler/c0/for_expression_initializer.c \
            tests/compiler/c0/run-for-expression-initializers.sh \
            tests/compiler/c0/run-for-loops.sh
          git diff --cached --check
          git commit -m 'frontend: parse for updates as full expressions'
          git push origin HEAD:refactor/foundation-v1
