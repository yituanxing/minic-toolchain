name: Foundation Refactor Validation

on:
  push:
    branches:
      - refactor/foundation-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-source:
    if: github.event_name == 'push' || github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1

      - name: Apply shared static-assert candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/foundation-static-assert-once.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

      - name: Enforce candidate scope
        shell: bash
        run: |
          set -Eeuo pipefail
          allowed='^(Makefile|src/frontend/token\.h|src/frontend/token\.c|src/frontend/lexer\.c|src/frontend/parser_expression\.c|src/frontend/parser_internal\.h|src/frontend/parser_static_assert\.c|src/frontend/parser_function\.c|src/frontend/parser_statement\.c|tests/frontend/token_model_test\.c|tests/frontend/lexer_test\.c|tests/compiler/c0/static_assert_declaration\.c|tests/compiler/c0/invalid_static_assert_false\.c|tests/compiler/c0/run-static-assert-declaration\.sh|tools/dev/pr76-focused\.sh)$'
          changed=$(git status --porcelain=v1 | sed -E 's/^.. //')
          printf '%s\n' "$changed"
          bad=$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)
          if test -n "$bad"; then
            printf '%s\n' 'unexpected candidate paths:' "$bad" >&2
            exit 1
          fi
          test -n "$changed"
          grep -q 'MINIC_TOKEN_KW_STATIC_ASSERT' src/frontend/token.h
          grep -q '_Static_assert' src/frontend/lexer.c
          grep -q 'minic_parser_parse_static_assert_declaration' src/frontend/parser_static_assert.c
          grep -q 'minic_parser_evaluate_integer_constant_expression' src/frontend/parser_expression.c
          grep -q 'MINIC_TOKEN_KW_STATIC_ASSERT' src/frontend/parser_function.c
          grep -q 'MINIC_TOKEN_KW_STATIC_ASSERT' src/frontend/parser_statement.c
          grep -q 'scope=file+block' tests/compiler/c0/run-static-assert-declaration.sh

      - name: Build compiler candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler

      - name: Run fast compiler contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/foundation-compiler check-fast

      - name: Run frozen Lua and Linux focused semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/foundation-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/foundation-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Commit validated candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Makefile \
            src/frontend/token.h \
            src/frontend/token.c \
            src/frontend/lexer.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_static_assert.c \
            src/frontend/parser_function.c \
            src/frontend/parser_statement.c \
            tests/frontend/token_model_test.c \
            tests/frontend/lexer_test.c \
            tests/compiler/c0/static_assert_declaration.c \
            tests/compiler/c0/invalid_static_assert_false.c \
            tests/compiler/c0/run-static-assert-declaration.sh \
            tools/dev/pr76-focused.sh
          git commit -m 'frontend: support shared static-assert declarations' \
                     -m '前端：支持共享 static-assert 声明'
          git push origin HEAD:refactor/foundation-v1
