name: Foundation Refactor Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-asm-goto-patch
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 1

      - name: Generate GNU asm-goto source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_asm_goto_patch.py
          clang-format-18 -i \
            src/frontend/ast.h \
            src/frontend/ast.c \
            src/frontend/parser_statement.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_inline_asm.c
          git diff --check -- src/frontend src/target/riscv64/codegen_inline_asm.c

      - name: Build and run asm-goto semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/asm-goto-generated
          MINIC="$GITHUB_WORKSPACE/build/asm-goto-generated/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/asm-goto-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-inline-asm-goto.sh
          make -j4 MODE=release BUILD_DIR=build/asm-goto-generated check-fast

      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/ast.h src/frontend/ast.c src/frontend/parser_statement.c \
            src/frontend/ast_verifier.c src/target/riscv64/codegen_inline_asm.c
          git commit -m 'frontend: add GNU asm goto labels'
          git push --force origin HEAD:agent/asm-goto-generated
