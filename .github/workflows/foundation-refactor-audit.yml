name: Foundation Refactor Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-source-patch
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 1

      - name: Generate bounded object-size source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_object_size_patch.py
          clang-format-18 -i src/frontend/parser_expression.c
          git diff --check -- src/frontend/parser_expression.c

      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_expression.c
          git commit -m 'frontend: add bounded object size query'
          git push --force origin HEAD:agent/object-size-generated
