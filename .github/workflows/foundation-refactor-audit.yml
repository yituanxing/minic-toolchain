name: Foundation Refactor Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: foundation-refactor-pointer-sign-call-patch
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 1

      - name: Generate pointer-sign call conversions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_pointer_sign_call_patch.py
          clang-format-18 -i \
            src/frontend/parser_internal.h \
            src/frontend/parser_expression.c \
            src/frontend/parser_postfix.c
          git diff --check -- src/frontend/parser_internal.h src/frontend/parser_expression.c \
            src/frontend/parser_postfix.c

      - name: Build and run focused call conversion gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/pointer-sign-call-generated
          MINIC="$GITHUB_WORKSPACE/build/pointer-sign-call-generated/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-sign-call-focused" \
          HOST_CC=cc \
            sh -x tests/compiler/c0/run-gnu-pointer-sign-call-conversion.sh
          make -j4 MODE=release BUILD_DIR=build/pointer-sign-call-generated check-fast

      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_internal.h src/frontend/parser_expression.c \
            src/frontend/parser_postfix.c
          git commit -m 'frontend: model pointer-sign call conversions'
          git push --force origin HEAD:agent/pointer-sign-call-generated
