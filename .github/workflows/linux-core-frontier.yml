name: Linux Core New500 Frontier

on:
  push:
    branches:
      - refactor/declaration-sema-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-sample16-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen sample16 corpus
        id: sample-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-new500-sample16-corpus
          key: linux-new500-sample16-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-even16

      - name: Validate cached sample16 corpus
        if: steps.sample-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest=build/linux-new500-sample16-corpus/selected-tus.txt
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq 16
          echo 'LINUX_NEW500_SAMPLE16_CORPUS cache=hit selected=16'

      - name: Fetch exact Linux 6.6.143 stable source
        if: steps.sample-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PIPELINE_PROGRESS phase=linux-source [....................] 0%'
          rm -rf build/linux-source
          git init -q build/linux-source
          git -C build/linux-source remote add origin https://github.com/gregkh/linux.git
          git -C build/linux-source fetch --depth=1 --no-tags --progress origin d1cfde2d5d15be14123bdd1689162bd27f995a90
          git -C build/linux-source checkout -q --detach FETCH_HEAD
          test "$(git -C build/linux-source rev-parse HEAD)" = d1cfde2d5d15be14123bdd1689162bd27f995a90
          echo 'PIPELINE_PROGRESS phase=linux-source [####################] 100%'

      - name: Install sample materialization dependencies
        if: steps.sample-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get             -o Acquire::Retries=3             -o Acquire::http::Timeout=30             install -y --no-install-recommends               gcc-riscv64-linux-gnu libc6-dev-riscv64-cross               flex bison bc libelf-dev libssl-dev
          command -v riscv64-linux-gnu-gcc

      - name: Materialize sample16 independently
        if: steps.sample-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          builder="$GITHUB_WORKSPACE/build/linux-new500-sample16-builder"
          corpus="$GITHUB_WORKSPACE/build/linux-new500-sample16-corpus"
          LINUX_BATCH_MATERIALIZE_ONLY=1           BUILD_DIR="$builder"           LINUX_SOURCE_TREE="$GITHUB_WORKSPACE/build/linux-source"           CROSS_COMPILE=riscv64-linux-gnu-           LINUX_BATCH_SELECTION="500,533,566,599,633,666,699,732,766,799,832,865,899,932,965,999"           LINUX_BATCH_JOBS=4             sh tests/external/linux/batch_probe.sh

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          expected = [500, 533, 566, 599, 633, 666, 699, 732,
                      766, 799, 832, 865, 899, 932, 965, 999]
          builder = Path("build/linux-new500-sample16-builder")
          corpus = Path("build/linux-new500-sample16-corpus")
          selected = builder / "selected-tus.txt"
          rows = [line for line in selected.read_text().splitlines() if line.strip()]
          indices = [int(line.split("\t", 1)[0]) for line in rows]
          if indices != expected:
              raise SystemExit(f"unexpected sample16 indices: {indices}")

          shutil.rmtree(corpus, ignore_errors=True)
          inputs = corpus / "kbuild"
          inputs.mkdir(parents=True)
          shutil.copy2(selected, corpus / "selected-tus.txt")
          manifest = builder / "tu-manifest.txt"
          if manifest.is_file():
              shutil.copy2(manifest, corpus / "tu-manifest.txt")
          for row in rows:
              _, _, rel_i, _ = row.split("\t", 3)
              source = builder / "kbuild" / rel_i
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f"missing sample input: {source}")
              target = inputs / rel_i
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          print("LINUX_NEW500_SAMPLE16_CORPUS cache=fill selected=16")
          PY

      - name: Save frozen sample16 corpus
        if: steps.sample-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-new500-sample16-corpus
          key: linux-new500-sample16-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-even16


  sample16:
    needs: prepare-sample16-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: linux-new500-sample16-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen sample16 corpus
        id: sample-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-new500-sample16-corpus
          key: linux-new500-sample16-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-even16

      - name: Require frozen sample16 corpus
        run: |
          test "${{ steps.sample-cache.outputs.cache-hit }}" = true
          test "$(grep -cve '^[[:space:]]*$' build/linux-new500-sample16-corpus/selected-tus.txt)" -eq 16

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/new500-sample-compiler

      - name: Replay sample16
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/new500-sample-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/new500-sample"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py             --minic "$compiler"             --corpus "$GITHUB_WORKSPACE/build/linux-new500-sample16-corpus"             --work "$work"             --jobs 4             --offset 0             --limit 16             --sample-count 0
          replay_status=$?
          set -e
          echo "LINUX_NEW500_SAMPLE16_REPLAY_STATUS=$replay_status"

          python3 tools/ci/classify-core-strict-frontier.py             "$work/batch-results.json"             --stderr-root "$work/minic-stderr"             --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h"             --examples 16             --json-out "$work/frontier-summary.json"             --reason-text-out "$work/reason-summary.txt"

          python3 tools/ci/summarize-core-frontier-progress.py             "$work/batch-results.json"             --expect-selected 16             --json-out "$work/progress-summary.json"             --text-out "$work/progress-summary.txt"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          work = Path("build/new500-sample")
          summary = json.loads((work / "frontier-summary.json").read_text())
          if summary["selected"] != 16 or summary["preprocess_missing"] != 0:
              raise SystemExit(f"sample16 infrastructure failure: {summary}")
          headline = (
              f"LINUX_NEW500_SAMPLE16_EXACT selected={summary['selected']} "
              f"pass={summary['pass']} unsupported={summary['unsupported']} "
              f"error={summary['error']} preprocess_missing={summary['preprocess_missing']}"
          )
          print(headline)
          (work / "headline.txt").write_text(headline + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("## Linux new500 sample16\n\n")
              output.write(f"`{headline}`\n\n")
              output.write((work / "reason-summary.txt").read_text())
          PY

      - name: Persist sample16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-new500-sample16-${{ github.sha }}
          path: |
            build/new500-sample/headline.txt
            build/new500-sample/batch-results.json
            build/new500-sample/frontier-summary.json
            build/new500-sample/reason-summary.txt
            build/new500-sample/progress-summary.json
            build/new500-sample/progress-summary.txt
            build/new500-sample/failure-contexts.txt
            build/new500-sample/minic-stderr/**
          if-no-files-found: warn

  prepare-new500-corpus:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full500]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      cache_hit: ${{ steps.new500-cache.outputs.cache-hit }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen new500 corpus
        id: new500-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-new500-corpus
          key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999

      - name: Validate cached new500 corpus
        if: steps.new500-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest=build/linux-new500-corpus/selected-tus.txt
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq 500
          test "$(head -1 "$manifest" | cut -f1)" -eq 500
          test "$(tail -1 "$manifest" | cut -f1)" -eq 999
          echo 'LINUX_NEW500_CORPUS cache=hit selected=500 indices=500-999'

      - name: Fetch exact Linux 6.6.143 stable source
        if: steps.new500-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PIPELINE_PROGRESS phase=linux-source [....................] 0%'
          rm -rf build/linux-source
          git init -q build/linux-source
          git -C build/linux-source remote add origin https://github.com/gregkh/linux.git
          git -C build/linux-source fetch --depth=1 --no-tags --progress origin d1cfde2d5d15be14123bdd1689162bd27f995a90
          git -C build/linux-source checkout -q --detach FETCH_HEAD
          test "$(git -C build/linux-source rev-parse HEAD)" = d1cfde2d5d15be14123bdd1689162bd27f995a90
          echo 'PIPELINE_PROGRESS phase=linux-source [####################] 100%'

      - name: Install corpus materialization dependencies
        if: steps.new500-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get             -o Acquire::Retries=3             -o Acquire::http::Timeout=30             install -y --no-install-recommends               gcc-riscv64-linux-gnu libc6-dev-riscv64-cross               flex bison bc libelf-dev libssl-dev
          command -v riscv64-linux-gnu-gcc

      - name: Materialize indices 500 through 999 once
        if: steps.new500-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          builder="$GITHUB_WORKSPACE/build/linux-new500-builder"
          corpus="$GITHUB_WORKSPACE/build/linux-new500-corpus"
          LINUX_BATCH_MATERIALIZE_ONLY=1           BUILD_DIR="$builder"           LINUX_SOURCE_TREE="$GITHUB_WORKSPACE/build/linux-source"           CROSS_COMPILE=riscv64-linux-gnu-           LINUX_BATCH_OFFSET=500           LINUX_BATCH_LIMIT=500           LINUX_BATCH_JOBS=4             sh tests/external/linux/batch_probe.sh

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          builder = Path("build/linux-new500-builder")
          corpus = Path("build/linux-new500-corpus")
          selected = builder / "selected-tus.txt"
          rows = [line for line in selected.read_text().splitlines() if line.strip()]
          indices = [int(line.split("\t", 1)[0]) for line in rows]
          if len(rows) != 500 or indices[0] != 500 or indices[-1] != 999:
              raise SystemExit(
                  f"unexpected new500 selection: count={len(rows)} "
                  f"first={indices[0] if indices else None} "
                  f"last={indices[-1] if indices else None}"
              )
          shutil.rmtree(corpus, ignore_errors=True)
          inputs = corpus / "kbuild"
          inputs.mkdir(parents=True)
          shutil.copy2(selected, corpus / "selected-tus.txt")
          manifest = builder / "tu-manifest.txt"
          if manifest.is_file():
              shutil.copy2(manifest, corpus / "tu-manifest.txt")
          total_bytes = 0
          for row in rows:
              _, _, rel_i, _ = row.split("\t", 3)
              source = builder / "kbuild" / rel_i
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f"missing materialized input: {source}")
              target = inputs / rel_i
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              total_bytes += target.stat().st_size
          (corpus / "corpus-info.txt").write_text(
              f"linux=6.6.143\nindices=500-999\nselected=500\nbytes={total_bytes}\n"
          )
          print(f"LINUX_NEW500_CORPUS cache=fill selected=500 bytes={total_bytes}")
          PY

      - name: Save frozen new500 corpus
        if: steps.new500-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-new500-corpus
          key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999


  full500:
    needs: prepare-new500-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: linux-new500-full500-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen new500 corpus
        id: new500-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-new500-corpus
          key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999

      - name: Require frozen new500 corpus
        run: |
          test "${{ steps.new500-cache.outputs.cache-hit }}" = true
          test "$(grep -cve '^[[:space:]]*$' build/linux-new500-corpus/selected-tus.txt)" -eq 500

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/new500-full-compiler

      - name: Replay all new500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/new500-full-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/new500-full"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py             --minic "$compiler"             --corpus "$GITHUB_WORKSPACE/build/linux-new500-corpus"             --work "$work"             --jobs 4             --offset 0             --limit 500             --sample-count 0
          replay_status=$?
          set -e
          echo "LINUX_NEW500_FULL_REPLAY_STATUS=$replay_status"

          python3 tools/ci/classify-core-strict-frontier.py             "$work/batch-results.json"             --stderr-root "$work/minic-stderr"             --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h"             --examples 50             --json-out "$work/frontier-summary.json"             --reason-text-out "$work/reason-summary.txt"

          python3 tools/ci/summarize-core-frontier-progress.py             "$work/batch-results.json"             --expect-selected 500             --json-out "$work/progress-summary.json"             --text-out "$work/progress-summary.txt"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          work = Path("build/new500-full")
          summary = json.loads((work / "frontier-summary.json").read_text())
          if summary["selected"] != 500 or summary["preprocess_missing"] != 0:
              raise SystemExit(f"full500 infrastructure failure: {summary}")
          headline = (
              f"LINUX_NEW500_FULL_EXACT selected={summary['selected']} "
              f"pass={summary['pass']} unsupported={summary['unsupported']} "
              f"error={summary['error']} preprocess_missing={summary['preprocess_missing']}"
          )
          print(headline)
          (work / "headline.txt").write_text(headline + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("## Linux new500 full census\n\n")
              output.write(f"`{headline}`\n\n")
              output.write((work / "reason-summary.txt").read_text())
          PY

      - name: Persist full500 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-new500-full500-${{ github.sha }}
          path: |
            build/new500-full/headline.txt
            build/new500-full/batch-results.json
            build/new500-full/batch-results.tsv
            build/new500-full/frontier-summary.json
            build/new500-full/reason-summary.txt
            build/new500-full/progress-summary.json
            build/new500-full/progress-summary.txt
            build/new500-full/failure-contexts.txt
            build/new500-full/minic-stderr/**
          if-no-files-found: warn
