name: Linux Core Frontier

on:
  push:
    branches:
      - refactor/declaration-sema-v1
  workflow_dispatch:
    inputs:
      offset:
        description: Optional TU offset override
        required: false
        type: string
      limit:
        description: Optional TU limit override
        required: false
        type: string
      jobs:
        description: Optional MiniC replay parallelism override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-core-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Resolve frontier window
        shell: bash
        run: |
          set -Eeuo pipefail
          source tests/external/linux/qualification-frontier.env
          offset='${{ inputs.offset }}'
          limit='${{ inputs.limit }}'
          jobs='${{ inputs.jobs }}'
          [[ -n "$offset" ]] || offset="$LINUX_FRONTIER_OFFSET"
          [[ -n "$limit" ]] || limit="$LINUX_FRONTIER_LIMIT"
          [[ -n "$jobs" ]] || jobs="$LINUX_FRONTIER_JOBS"
          for value in "$offset" "$limit" "$jobs"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done
          (( limit > 0 ))
          (( jobs > 0 ))
          echo "LINUX_FRONTIER_OFFSET=$offset" >> "$GITHUB_ENV"
          echo "LINUX_FRONTIER_LIMIT=$limit" >> "$GITHUB_ENV"
          echo "LINUX_FRONTIER_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "LINUX_FRONTIER_WINDOW offset=$offset limit=$limit jobs=$jobs"

      - name: Restore pinned Linux source archive
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Restore Linux qualification package archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-linux-frontier-apt/archives
          key: linux-frontier-apt-${{ runner.os }}-${{ runner.arch }}-noble-v1

      - name: Install Linux qualification dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          apt_cache="$HOME/.cache/minic-linux-frontier-apt/archives"
          mkdir -p "$apt_cache/partial"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Dir::Cache::archives="$apt_cache" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
              gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
              flex bison bc libelf-dev libssl-dev
          command -v riscv64-linux-gnu-gcc
          command -v flex
          command -v bison
          command -v bc

      - name: Build exact Core-only compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-frontier-compiler
          echo "LINUX_FRONTIER_SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Check replay selection contract
        run: python3 tests/external/linux/corpus_replay_selection_test.py

      - name: Materialize and replay Linux frontier
        id: frontier_replay
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-frontier-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-frontier"
          driver_log="$GITHUB_WORKSPACE/build/linux-frontier-driver.log"
          rm -f "$driver_log"
          set +e
          CORE_FAST_TRACE=1 \
          MINIC="$compiler" \
          BUILD_DIR="$work" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET="$LINUX_FRONTIER_OFFSET" \
          LINUX_BATCH_LIMIT="$LINUX_FRONTIER_LIMIT" \
          LINUX_BATCH_JOBS="$LINUX_FRONTIER_JOBS" \
            sh tests/external/linux/batch_probe.sh 2>&1 | tee "$driver_log"
          probe_status=${PIPESTATUS[0]}
          set -e
          printf 'LINUX_FRONTIER_PROBE_STATUS=%d\n' "$probe_status"
          test -s "$work/batch-results.json"
          printf '%d\n' "$probe_status" > "$work/probe-status.txt"

          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 50 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"

          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected "$LINUX_FRONTIER_LIMIT" \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          work = Path("build/linux-frontier")
          summary = json.loads((work / "frontier-summary.json").read_text())
          expected = int(os.environ["LINUX_FRONTIER_LIMIT"])
          if summary["selected"] != expected:
              raise SystemExit(
                  f"Linux frontier selected {summary['selected']}, expected {expected}"
              )
          if summary["preprocess_missing"] != 0:
              raise SystemExit(
                  f"Linux frontier has preprocess_missing={summary['preprocess_missing']}"
              )
          headline = (
              f"LINUX_CORE_FRONTIER_EXACT offset={os.environ['LINUX_FRONTIER_OFFSET']} "
              f"selected={summary['selected']} pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error={summary['error']} "
              f"preprocess_missing={summary['preprocess_missing']}"
          )
          print(headline)
          (work / "headline.txt").write_text(headline + "\n")

          driver = Path("build/linux-frontier-driver.log")
          plan = ""
          if driver.is_file():
              for line in driver.read_text(errors="replace").splitlines():
                  if "LINUX_BATCH_PLAN " in line:
                      plan = line
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("## Linux Core Frontier\n\n")
              output.write(f"`{headline}`\n\n")
              if plan:
                  output.write(f"`{plan}`\n\n")
              output.write((work / "progress-summary.txt").read_text())
          PY

      - name: Save pinned Linux source archive
        if: always() && steps.linux-source-cache.outputs.cache-hit != 'true' && hashFiles('build/linux-cache/linux-6.6.143.tar.xz') != ''
        uses: actions/cache/save@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Persist Linux frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-core-frontier-${{ github.sha }}
          path: |
            build/linux-frontier/headline.txt
            build/linux-frontier/batch-summary.txt
            build/linux-frontier/batch-results.json
            build/linux-frontier/batch-results.tsv
            build/linux-frontier/frontier-summary.json
            build/linux-frontier/reason-summary.txt
            build/linux-frontier/progress-summary.json
            build/linux-frontier/progress-summary.txt
            build/linux-frontier/failure-contexts.txt
            build/linux-frontier/probe-status.txt
            build/linux-frontier/minic-stderr/**
            build/linux-frontier-driver.log
          if-no-files-found: warn
