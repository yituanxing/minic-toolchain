name: PR119 Materialize Function-Typed Declaration List
on:
  push:
    branches: [agent/function-typed-declaration-list-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize function-typed declaration list
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr119-materialize.py
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/function_typed_declarator.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr119-focused" HOST_CC=cc sh tests/compiler/c0/run-function-typed-declarator.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr119-materialize.py .github/workflows/pr119-materialize-function-typed-list.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): support function-typed declaration lists'
          git push origin HEAD:agent/function-typed-declaration-list-v0
