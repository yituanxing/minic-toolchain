name: One-shot Linux Core Strict Coverage

on:
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build exact MiniC candidate
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-strict-compiler

      - name: Measure deterministic 64-TU strict Core coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json
          import os
          import re
          import subprocess
          import time

          corpus = Path('build/linux-focus-corpus')
          root = corpus / 'kbuild'
          minic = Path('build/core-strict-compiler/bin/minic').resolve()
          work = Path('build/linux-core-strict-coverage')
          out = work / 'asm'
          err = work / 'stderr'
          out.mkdir(parents=True, exist_ok=True)
          err.mkdir(parents=True, exist_ok=True)

          entries = []
          for line in (corpus / 'selected-tus.txt').read_text().splitlines():
              index, obj, rel_i, source = line.split('\t', 3)
              entries.append((int(index), obj, rel_i, source))
          entries.sort()
          if len(entries) < 64:
              raise SystemExit(f'frozen corpus too small: {len(entries)}')
          last = len(entries) - 1
          positions = [sample * last // 63 for sample in range(64)]
          selected = [entries[position] for position in positions]

          unsupported_re = re.compile(r"Core IR shadow does not yet support function '([^']+)'")
          error_re = re.compile(r"Core IR shadow lowering failed for function '([^']+)'")

          def run_one(entry):
              index, obj, rel_i, source = entry
              input_path = root / rel_i
              asm_path = out / f'{index}.s'
              stderr_path = err / f'{index}.stderr'
              env = os.environ.copy()
              env['MINIC_CORE_IR'] = 'strict'
              started = time.monotonic()
              proc = subprocess.run(
                  [str(minic), '-S', str(input_path), '-o', str(asm_path)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors='replace',
                  env=env,
                  check=False,
              )
              elapsed = time.monotonic() - started
              stderr_path.write_text(proc.stderr)
              message = ''
              kind = 'PASS'
              function = ''
              if proc.returncode != 0:
                  lines = [line.strip() for line in proc.stderr.splitlines() if line.strip()]
                  message = lines[0] if lines else f'returncode={proc.returncode}'
                  joined = '\n'.join(lines)
                  match = unsupported_re.search(joined)
                  if match:
                      kind = 'UNSUPPORTED'
                      function = match.group(1)
                  else:
                      match = error_re.search(joined)
                      if match:
                          kind = 'ERROR'
                          function = match.group(1)
                      else:
                          kind = 'OTHER_FAIL'
              return {
                  'index': index,
                  'object': obj,
                  'input': rel_i,
                  'source': source,
                  'status': kind,
                  'function': function,
                  'message': message,
                  'seconds': elapsed,
              }

          results = []
          started = time.monotonic()
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [pool.submit(run_one, entry) for entry in selected]
              for future in as_completed(futures):
                  results.append(future.result())
          results.sort(key=lambda row: row['index'])
          elapsed = time.monotonic() - started

          statuses = Counter(row['status'] for row in results)
          unsupported_functions = Counter(
              row['function'] for row in results
              if row['status'] == 'UNSUPPORTED' and row['function']
          )
          messages = Counter(
              row['message'] for row in results
              if row['status'] != 'PASS'
          )

          work.mkdir(parents=True, exist_ok=True)
          (work / 'results.json').write_text(json.dumps(results, indent=2, sort_keys=True))
          with (work / 'results.tsv').open('w') as fp:
              fp.write('index\tstatus\tfunction\tinput\tsource\tseconds\tmessage\n')
              for row in results:
                  message = row['message'].replace('\t', ' ').replace('\n', ' ')
                  fp.write(
                      f"{row['index']}\t{row['status']}\t{row['function']}\t{row['input']}\t"
                      f"{row['source']}\t{row['seconds']:.3f}\t{message}\n"
                  )

          summary = []
          summary.append('LINUX_CORE_STRICT_COVERAGE')
          summary.append('selected_tus=64')
          summary.append(f"strict_pass_tus={statuses['PASS']}")
          summary.append(f"strict_unsupported_tus={statuses['UNSUPPORTED']}")
          summary.append(f"strict_error_tus={statuses['ERROR']}")
          summary.append(f"strict_other_fail_tus={statuses['OTHER_FAIL']}")
          summary.append(f'elapsed_seconds={elapsed:.3f}')
          summary.append('')
          summary.append('first_unsupported_functions:')
          if unsupported_functions:
              for function, count in unsupported_functions.most_common(30):
                  summary.append(f'  {count:3d} {function}')
          else:
              summary.append('  none')
          summary.append('')
          summary.append('failure_messages:')
          if messages:
              for message, count in messages.most_common(30):
                  summary.append(f'  {count:3d} {message}')
          else:
              summary.append('  none')
          text = '\n'.join(summary) + '\n'
          (work / 'summary.txt').write_text(text)
          print(text, end='')
          PY

      - name: Upload strict coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-core-strict-coverage-${{ github.run_id }}
          path: |
            build/linux-core-strict-coverage/summary.txt
            build/linux-core-strict-coverage/results.tsv
            build/linux-core-strict-coverage/results.json
            build/linux-core-strict-coverage/stderr/**/*.stderr
          retention-days: 7
