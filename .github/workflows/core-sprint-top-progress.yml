name: Core M107 Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  m107:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-m107-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M107 structured memory-output asm
        id: m107
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/m107-structured-memory-output-asm.py
          if git diff --quiet -- \
              src/core/core_ir.h \
              src/core/core_ir.c \
              src/core/core_lower.c \
              src/target/riscv64/core_codegen.c \
              tests/core/run-core-ir-shadow.sh; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          git diff --check

      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m107-compiler

      - name: Core shadow qualification
        if: steps.m107.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/m107-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/m107-shadow" \
            bash tests/core/run-core-ir-shadow.sh

      - name: Focused Linux qualification
        if: steps.m107.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m107-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m107-focus"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '0,7,42,95'
          replay_status=$?
          set -e
          printf 'CORE_M107_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 4 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          work = Path('build/m107-focus')
          rows = json.loads((work / 'batch-results.json').read_text())
          if isinstance(rows, dict):
              rows = rows.get('results', rows.get('tus', []))
          by_index = {int(r['index']): r for r in rows}
          frontier = json.loads((work / 'frontier-summary.json').read_text())
          print(f"CORE_M107_RESULT selected={frontier['selected']} pass={frontier['pass']} unsupported={frontier['unsupported']} error={frontier['error']}")
          for idx in sorted(by_index):
              r = by_index[idx]
              print(f"CORE_M107_ROW index={idx} status={r.get('status')} first={r.get('first_error_line')} total={r.get('total_lines')} progress={r.get('progress_ratio')} input={r.get('input')} message={r.get('message','')}")
          if frontier['error'] != 0:
              raise SystemExit(f"Core ERROR present: {frontier.get('errors', [])}")
          for idx in (0, 7, 42):
              if idx not in by_index or by_index[idx].get('status') != 'PASS':
                  raise SystemExit(f'required PASS missing for index {idx}: {by_index.get(idx)}')
          r95 = by_index.get(95)
          if r95 is None:
              raise SystemExit('missing index95')
          if r95.get('status') == 'ERROR':
              raise SystemExit(f'index95 Core ERROR: {r95}')
          if r95.get('status') != 'PASS':
              first = r95.get('first_error_line')
              if first is None or int(first) <= 88096:
                  raise SystemExit(f'index95 blocker did not move past 88096: {r95}')
          PY

      - name: Commit M107 production semantic
        if: steps.m107.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_ir.h \
            src/core/core_ir.c \
            src/core/core_lower.c \
            src/target/riscv64/core_codegen.c \
            tests/core/run-core-ir-shadow.sh
          git diff --cached --check
          git commit -m 'core: lower register-readwrite memory-output asm'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Replay frozen strict500 after production
        if: steps.m107.outputs.changed == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m107-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 20 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/strict500')
          frontier = json.loads((work / 'frontier-summary.json').read_text())
          print(f"CORE_STRICT500_EXACT selected={frontier['selected']} pass={frontier['pass']} unsupported={frontier['unsupported']} error={frontier['error']}")
          if frontier['error'] != 0:
              raise SystemExit(f"Core ERROR present: {frontier.get('errors', [])}")
          PY
