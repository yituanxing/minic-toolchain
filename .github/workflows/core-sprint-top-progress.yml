name: Core Sprint Top Progress

on:
  pull_request:

permissions:
  contents: write

jobs:
  sprint:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-sprint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M105 fixed-register batch
        id: m105
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/m105-fixed-register-core.py
          if git diff --quiet -- src/core/core_ir.h src/core/core_lower.c src/target/riscv64/core_codegen.c tests/core/run-core-ir-shadow.sh; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Instrument M106 final fixed-call blocker
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/m106-fixed-call-diagnostic.py
          python3 tools/dev/m106-address-diagnostic.py

      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-sprint-compiler

      - name: Core shadow qualification
        if: steps.m105.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-sprint-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/core-sprint-shadow" \
            bash tests/core/run-core-ir-shadow.sh

      - name: Sprint nearest-to-pass TUs
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-sprint-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-sprint"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '0,7,42,95'
          replay_status=$?
          set -e
          printf 'CORE_SPRINT_REPLAY_STATUS=%d\n' "$replay_status"
          grep -R 'CORE_M106_' "$work/minic-stderr" || true
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 4 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 4 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          work = Path('build/core-sprint')
          rows = json.loads((work / 'batch-results.json').read_text())
          if isinstance(rows, dict):
              rows = rows.get('results', rows.get('tus', []))

          def progress(r):
              p = r.get('progress_ratio')
              if p is not None:
                  return float(p)
              total = r.get('total_lines') or 0
              first = r.get('first_error_line')
              return 1.0 if r.get('status') == 'PASS' else ((float(first) / total) if first and total else 0.0)

          def blocker_function(message):
              match = re.search(r"function '([^']+)'", message or '')
              return match.group(1) if match else None

          def first_detail(r):
              if r.get('status') == 'PASS':
                  return None
              stderr_path = work / 'minic-stderr' / f"{r.get('input')}.stderr"
              if not stderr_path.is_file():
                  return None
              function = blocker_function(r.get('message', ''))
              lines = stderr_path.read_text(errors='replace').splitlines()
              detail_prefixes = ('CORE_M106_ADDRESS', 'CORE_M106_SCALAR', 'CORE_ASSIGN_STAGE', 'CORE_LOWER_DETAIL', 'CORE_ASM_DETAIL')
              if function:
                  for prefix in detail_prefixes:
                      for line in lines:
                          if prefix in line:
                              return line.strip()
                  for line in lines:
                      if 'CORE_FAST_TRACE' in line and f'function={function}' in line:
                          return line.strip()
              for prefix in detail_prefixes + ('CORE_FAST_TRACE',):
                  for line in lines:
                      if prefix in line:
                          return line.strip()
              return None

          print('CORE_SPRINT_TABLE index status progress first/total input message')
          by_index = {}
          for r in sorted(rows, key=progress, reverse=True):
              by_index[int(r['index'])] = r
              total = r.get('total_lines', '-')
              first = r.get('first_error_line') or '-'
              print(f"CORE_SPRINT_ROW index={r.get('index')} status={r.get('status')} progress={progress(r)*100:.2f}% first={first} total={total} input={r.get('input')} message={r.get('message','')}")
              detail = first_detail(r)
              if detail:
                  print(f"CORE_SPRINT_TRACE index={r.get('index')} {detail}")

          frontier = json.loads((work / 'frontier-summary.json').read_text())
          print(f"CORE_SPRINT_RESULT selected={frontier['selected']} pass={frontier['pass']} unsupported={frontier['unsupported']} error={frontier['error']}")
          if frontier['error'] != 0:
              raise SystemExit(f"sprint introduced/contains Core ERRORs: {frontier.get('errors', [])}")

          for idx in (0, 7, 42):
              if idx not in by_index or by_index[idx].get('status') != 'PASS':
                  raise SystemExit(f'required PASS missing for index {idx}: {by_index.get(idx)}')
          PY

      - name: Commit M105 production semantic
        if: steps.m105.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_lower.c src/target/riscv64/core_codegen.c tests/core/run-core-ir-shadow.sh
          git diff --cached --check
          git commit -m 'core: preserve fixed-register structured asm bindings'
          git push origin HEAD:refactor/declaration-sema-v1
