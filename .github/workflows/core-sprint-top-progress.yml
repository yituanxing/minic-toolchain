name: Core Strict500 Snapshot

on:
  pull_request:
  workflow_dispatch:

jobs:
  strict500:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/strict500-compiler

      - name: Replay frozen strict500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 20 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/strict500')
          frontier = json.loads((work / 'frontier-summary.json').read_text())
          headline = f"CORE_STRICT500_EXACT selected={frontier['selected']} pass={frontier['pass']} unsupported={frontier['unsupported']} error={frontier['error']}"
          print(headline)
          with Path('build/strict500/headline.txt').open('w') as f:
              f.write(headline + '\n')
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Core Strict500\n\n')
              f.write(f'`{headline}`\n\n')
              f.write((work / 'progress-summary.txt').read_text())
          if frontier['error'] != 0:
              print(f"CORE_STRICT500_ERRORS {frontier.get('errors', [])}")
          PY

      - name: Persist strict500 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-strict500-${{ github.sha }}
          path: |
            build/strict500/batch-results.json
            build/strict500/frontier-summary.json
            build/strict500/progress-summary.json
            build/strict500/progress-summary.txt
            build/strict500/headline.txt
          if-no-files-found: warn
