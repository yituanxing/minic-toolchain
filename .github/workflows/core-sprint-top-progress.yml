name: Core Strict500 Snapshot

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strict500:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Stage M122 discarded comma sequencing
        id: m122
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M122_DISCARDED_COMMA_EFFECT_SEQUENCE' src/core/core_lower.c; then
            echo 'staged=false' >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci/apply-m122-discarded-comma.py
            git diff --check
            echo 'staged=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Stage M123 variadic builtin ownership
        id: m123
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M123_VARIADIC_ARGUMENT_ADDRESS' src/core/core_ir.h; then
            echo 'staged=false' >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci/apply-m123-variadic-builtins.py
            git diff --check
            echo 'staged=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate census tooling
        run: python3 -m py_compile tools/ci/classify-core-strict-frontier.py

      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/strict500-compiler

      - name: Run fast regression gate
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/strict500-check

      - name: Replay frozen strict500
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/strict500-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_STRICT500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os

          work = Path('build/strict500')
          frontier = json.loads((work / 'frontier-summary.json').read_text())
          headline = f"CORE_STRICT500_EXACT selected={frontier['selected']} pass={frontier['pass']} unsupported={frontier['unsupported']} error={frontier['error']}"
          print(headline)
          with (work / 'headline.txt').open('w') as f:
              f.write(headline + '\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Core Strict500\n\n')
              f.write(f'`{headline}`\n\n')
              f.write((work / 'progress-summary.txt').read_text())
              f.write('\n### Unsupported feature census\n\n```text\n')
              reason_lines = (work / 'reason-summary.txt').read_text().splitlines()
              f.write('\n'.join(reason_lines[:80]))
              if len(reason_lines) > 80:
                  f.write(f'\n... {len(reason_lines) - 80} more lines in artifact')
              f.write('\n```\n')
          if frontier['error'] != 0:
              print(f"CORE_STRICT500_ERRORS {frontier.get('errors', [])}")
          PY

      - name: Validate staged M122 globally
        if: steps.m122.outputs.staged == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          work = Path('build/strict500')
          frontier = json.loads((work / 'frontier-summary.json').read_text())
          binary_gate = sum(
              int(item.get('count', 0))
              for item in frontier.get('reason_fingerprints', [])
              if 'route=scalar-type-gate expression_kind=MINIC_EXPRESSION_BINARY' in
                 str(item.get('fingerprint', ''))
          )
          if frontier['error'] != 0 or frontier['preprocess_missing'] != 0:
              raise SystemExit(
                  f"M122 global ERROR/missing: error={frontier['error']} "
                  f"missing={frontier['preprocess_missing']}"
              )
          if frontier['pass'] < 374:
              raise SystemExit(f"M122 global pass regression: {frontier['pass']} < 374")
          if binary_gate >= 37:
              raise SystemExit(f"M122 discarded-comma frontier did not improve: {binary_gate} >= 37")
          print(
              f"CORE_M122_GLOBAL_ACCEPT pass={frontier['pass']} "
              f"unsupported={frontier['unsupported']} error=0 binary_gate={binary_gate}"
          )
          PY

      - name: Validate staged M123 globally
        if: steps.m123.outputs.staged == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          work = Path('build/strict500')
          frontier = json.loads((work / 'frontier-summary.json').read_text())
          stale_va_start = sum(
              int(item.get('count', 0))
              for item in frontier.get('reason_fingerprints', [])
              if 'MINIC_EXPRESSION_BUILTIN_VA_START' in str(item.get('fingerprint', ''))
          )
          if frontier['error'] != 0 or frontier['preprocess_missing'] != 0:
              raise SystemExit(
                  f"M123 global ERROR/missing: error={frontier['error']} "
                  f"missing={frontier['preprocess_missing']}"
              )
          if frontier['pass'] < 407:
              raise SystemExit(f"M123 global pass regression: {frontier['pass']} < 407")
          if stale_va_start != 0:
              raise SystemExit(f"M123 stale va_start frontier remains: {stale_va_start}")
          print(
              f"CORE_M123_GLOBAL_ACCEPT pass={frontier['pass']} "
              f"unsupported={frontier['unsupported']} error=0 va_start={stale_va_start}"
          )
          PY

      - name: Commit globally validated M122 semantic fix
        if: steps.m122.outputs.staged == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c
          git diff --cached --quiet && { echo 'no M122 semantic changes'; exit 1; }
          git commit -m 'core: sequence discarded comma expressions'

      - name: Commit globally validated M123 semantic fix
        if: steps.m123.outputs.staged == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --cached --quiet && { echo 'no M123 semantic changes'; exit 1; }
          git commit -m 'core: own variadic builtin cursor semantics'

      - name: Push globally validated semantic fixes
        if: steps.m122.outputs.staged == 'true' || steps.m123.outputs.staged == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist strict500 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-strict500-${{ github.sha }}
          path: |
            build/strict500/batch-results.json
            build/strict500/frontier-summary.json
            build/strict500/progress-summary.json
            build/strict500/progress-summary.txt
            build/strict500/reason-summary.txt
            build/strict500/headline.txt
            build/strict500/minic-stderr
          if-no-files-found: warn
