name: Core M108 Frontier

on:
  pull_request:
  push:
    branches:
      - refactor/declaration-sema-v1

permissions:
  contents: write

jobs:
  m108-frontier:
    if: github.head_ref == 'refactor/declaration-sema-v1' || github.ref == 'refs/heads/refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-m108-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Enable compact progress telemetry
        run: python3 tools/dev/patch-linux-replay-live-progress.py

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m108-compiler

      - name: Capture exact do_task_dead failure
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m108-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m108-frontier"
          src="$GITHUB_WORKSPACE/build/linux-focus-corpus/kbuild/kernel/sched/core.i"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 1 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '95'
          replay_status=$?
          set -e
          printf 'CORE_M108_REPLAY_STATUS=%d\n' "$replay_status"
          echo CORE_DO_TASK_DEAD_SOURCE_BEGIN
          grep -n -A90 -B8 'do_task_dead' "$src" | head -120 || true
          echo CORE_DO_TASK_DEAD_SOURCE_END
          stderr="$work/minic-stderr/kernel/sched/core.i.stderr"
          echo CORE_DO_TASK_DEAD_RAW_TRACE_BEGIN
          if test -f "$stderr"; then
            tail -240 "$stderr"
          fi
          echo CORE_DO_TASK_DEAD_RAW_TRACE_END
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 2 \
            --json-out "$work/frontier-summary.json"
