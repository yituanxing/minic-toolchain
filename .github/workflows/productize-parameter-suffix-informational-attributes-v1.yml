name: Productize Parameter Suffix Informational Attributes V1
on:
  push:
    branches: [product/parameter-suffix-informational-attributes-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/parameter-suffix-informational-attributes-v1
          fetch-depth: 0
      - name: Materialize source and permanent contract
        run: |
          set -Eeuo pipefail
          git show origin/staging/string-octal-v1:tools/dev/materialize-parameter-suffix-informational-attributes-v1.py > tools/dev/.productize-parameter-suffix-informational-attributes-v1.py
          python3 tools/dev/.productize-parameter-suffix-informational-attributes-v1.py
          rm tools/dev/.productize-parameter-suffix-informational-attributes-v1.py
          cat > tests/compiler/c0/parameter_suffix_informational_attribute.c <<'EOF'
          static int add_one(int value __attribute__((__unused__))) { return value + 1; }
          int main(void) { return add_one(6) == 7 ? 0 : 1; }
          EOF
          cat > tests/compiler/c0/invalid_parameter_suffix_aligned.c <<'EOF'
          static int add_one(int value __attribute__((aligned(16)))) { return value + 1; }
          EOF
          cat >> tests/compiler/c0/run-function-parameter-adjustment.sh <<'EOF'

          "$host_cc" -E -P -std=gnu11 -x c \
              "$root/tests/compiler/c0/parameter_suffix_informational_attribute.c" \
              -o "$work/parameter-suffix-info.i"
          "$minic" -S "$work/parameter-suffix-info.i" -o "$work/parameter-suffix-info.s"
          grep -F 'add_one:' "$work/parameter-suffix-info.s" >/dev/null

          "$host_cc" -E -P -std=gnu11 -x c \
              "$root/tests/compiler/c0/invalid_parameter_suffix_aligned.c" \
              -o "$work/parameter-suffix-aligned.i"
          if "$minic" -S "$work/parameter-suffix-aligned.i" -o "$work/parameter-suffix-aligned.s" \
              >"$work/parameter-suffix-aligned.out" 2>"$work/parameter-suffix-aligned.err"; then
              echo 'FAIL compiler/c0/invalid_parameter_suffix_aligned' >&2
              exit 1
          fi
          grep -F 'GNU parameter declarator attribute requires explicit language/layout semantics' \
              "$work/parameter-suffix-aligned.err" >/dev/null
          printf '%s\n' 'PASS compiler/c0/parameter_suffix_informational_attribute informational=1 layout=fail-closed'
          EOF
          clang-format-18 -i src/frontend/parser_function.c \
            tests/compiler/c0/parameter_suffix_informational_attribute.c \
            tests/compiler/c0/invalid_parameter_suffix_aligned.c
          git diff --check
      - name: Validate Werror focused and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-parameter-suffix
          MINIC="$GITHUB_WORKSPACE/build/product-parameter-suffix/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/product-parameter-suffix" sh tests/compiler/c0/run-function-parameter-adjustment.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-parameter-suffix-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-parameter-suffix-informational-attributes-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: accept parse-only parameter suffix attributes'
          git push origin HEAD:product/parameter-suffix-informational-attributes-v1
