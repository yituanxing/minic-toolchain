name: Freeze Parson Discovery

on:
  push:
    branches: [external/parson-discovery]
    paths:
      - '.github/workflows/pr72-freeze.yml'

permissions:
  contents: write

concurrency:
  group: pr72-freeze
  cancel-in-progress: false

jobs:
  diagnose-stage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Parson discovery branch
        uses: actions/checkout@v4
        with:
          ref: external/parson-discovery
          fetch-depth: 0

      - name: Reproduce staged compiler tree
        id: stage
        shell: bash
        run: |
          set +e
          sh tools/dev/pr72-stage.sh > "$RUNNER_TEMP/pr72-stage.log" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          git reset --hard HEAD

          mkdir -p docs/dev
          {
            printf 'stage_status=%s\n' "$status"
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf '%s\n' '--- stage log ---'
            cat "$RUNNER_TEMP/pr72-stage.log"
          } > docs/dev/pr72-freeze-stage.log

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/dev/pr72-freeze-stage.log
          git commit -m 'ci: record Parson freeze staging diagnostic / CI：记录 Parson 冻结暂存诊断'
          git push origin HEAD:external/parson-discovery

      - name: Fail if staging failed
        if: steps.stage.outputs.status != '0'
        shell: bash
        run: exit 1
