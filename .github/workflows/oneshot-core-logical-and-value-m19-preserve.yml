name: One-shot Core Logical And Value M19 Preserve

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Prove M19 logical-and value gap
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m19p-before-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m19p-before-compiler/bin/minic"
          cat > build/core-m19p-before.i <<'EOF'
          int core_m19_before(int left, int right) {
              return left && right;
          }
          EOF
          if MINIC_CORE_IR=strict "$compiler" -S build/core-m19p-before.i \
              -o build/core-m19p-before.s 2>build/core-m19p-before.err; then
            echo 'M19 logical-and value gap unexpectedly absent before patch' >&2
            exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'core_m19_before'" \
            build/core-m19p-before.err >/dev/null

      - name: Apply M19 with scalar preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            tools/dev/patch-core-logical-and-value-m19.py \
            tools/dev/patch-core-cfg-assignment-continuation-m19.py \
            tools/dev/patch-core-scalar-preservation-m19.py
          python3 tools/dev/patch-core-logical-and-value-m19.py
          python3 tools/dev/patch-core-cfg-assignment-continuation-m19.py
          python3 tools/dev/patch-core-scalar-preservation-m19.py
          clang-format-18 -i \
            src/core/core_lower.c \
            tests/compiler/c0/core_logical_and_value.c \
            tests/compiler/c0/core_logical_and_value_runtime.c
          sh -n tests/compiler/c0/run-core-logical-and-value.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check
          grep -F 'operator_kind == MINIC_BINARY_LOGICAL_AND' src/core/core_lower.c >/dev/null
          grep -F 'spill_scalar_value(' src/core/core_lower.c >/dev/null
          grep -F 'reload_scalar_value(' src/core/core_lower.c >/dev/null
          grep -F 'core_m19_equality_cfg_rhs' tests/compiler/c0/core_logical_and_value.c >/dev/null
          if grep -R -F 'MINIC_CORE_INSTRUCTION_LOGICAL_AND' src/core >/dev/null; then
            echo 'M19 must model C short-circuit AND with CFG, not a plain value opcode' >&2
            exit 1
          fi

      - name: Build and validate M19
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m19p-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m19p-compiler/bin/minic"
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19p-focused" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-logical-and-value.sh
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19p-condition-and-regression" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-condition-and.sh
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19p-inline-asm-regression" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-opaque-inline-asm.sh
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19p-statement-expression-regression" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-statement-expression.sh
          MINIC="$compiler" bash tests/core/run-core-ir-shadow.sh

      - name: Replay frozen strict frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m19p-compiler/bin/minic"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$GITHUB_WORKSPACE/build/core-m19p-strict" \
            --jobs 4 --offset 0 --limit 500 --sample-count 64 --indices ''
          replay_status=$?
          set -e
          printf 'CORE_M19P_REPLAY_STATUS=%d\n' "$replay_status"
          python3 - <<'PY'
          from collections import Counter
          import json, re
          from pathlib import Path
          rows = json.loads(Path('build/core-m19p-strict/batch-results.json').read_text())
          unsupported_re = re.compile(r"^Core IR shadow does not yet support function '([^']+)'$")
          unsupported = Counter()
          errors = []
          passes = 0
          for row in rows:
              if row['status'] == 'PASS':
                  passes += 1
                  continue
              message = str(row['message'])
              match = unsupported_re.match(message)
              if match:
                  unsupported[match.group(1)] += 1
              else:
                  errors.append((row['index'], message))
          print(f'CORE_M19P_FRONTIER selected={len(rows)} pass={passes} unsupported={sum(unsupported.values())} error={len(errors)}')
          for function, count in unsupported.most_common():
              print(f'CORE_M19P_BLOCKER count={count} function={function}')
          for index, message in errors:
              print(f'CORE_M19P_ERROR index={index} message={message}')
          if errors:
              raise SystemExit('M19 preservation introduced non-UNSUPPORTED strict failures')
          if unsupported.get('list_empty_careful', 0) != 0:
              raise SystemExit('M19 preservation did not pierce list_empty_careful')
          PY

      - name: Publish M19 product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm \
            tools/dev/patch-core-logical-and-value-m19.py \
            tools/dev/patch-core-cfg-assignment-continuation-m19.py \
            tools/dev/patch-core-scalar-preservation-m19.py \
            .github/workflows/oneshot-core-logical-and-value-m19.yml \
            .github/workflows/oneshot-core-logical-and-value-m19-preserve.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_lower.c \
            tests/compiler/c0/core_logical_and_value.c \
            tests/compiler/c0/core_logical_and_value_runtime.c \
            tests/compiler/c0/run-core-logical-and-value.sh \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-logical-and-value-m19.py \
            tools/dev/patch-core-cfg-assignment-continuation-m19.py \
            tools/dev/patch-core-scalar-preservation-m19.py \
            .github/workflows/oneshot-core-logical-and-value-m19.yml \
            .github/workflows/oneshot-core-logical-and-value-m19-preserve.yml
          git diff --cached --check
          git commit -m 'core: lower CFG-safe short-circuit logical and'
          git push origin HEAD:refactor/declaration-sema-v1
