name: MiniAS Pinned Linux 3x7 Fast Replay

# Assembler-only exact-head test. Reuse authentic Linux 6.6.143 GNU Kbuild
# .s, .cmd, and producer-created .incbin payloads from the successful source
# capture run 40658346252. No fake data and no GCC regeneration between ISA
# changes. A new producer capture is required after kernel/config/tool changes.
on:
  workflow_dispatch:
  push:
    branches: [refactor/minias-target-isa-abi-core]
    paths:
      - '.github/workflows/minias-linux-cached-kbuild-replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    name: replay (${{ matrix.target }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64, loongarch64]
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable GNU source provenance
        run: |
          set -Eeuo pipefail
          # Source coverage checkpoint: four remaining candidates at the
          # former 86ffe77b HEAD. Reevaluate all 21 against this exact HEAD
          # self-audit exact-head checkpoint: all Common ELF section families, TLS/IFUNC, init/fini/preinit arrays, and target-owned x86 local-ABS section-symbol policy.
          echo "MINIAS_REPLAY_SOURCE_RUN=40658346252"
          echo "MINIAS_REPLAY_SOURCE_HEAD=6a725a15e0b7b6c611f73de10e4c95a03f8637f0"
          echo "MINIAS_REPLAY_ASSEMBLER_HEAD=$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40658346252
          name: minias-linux-kbuild-${{ matrix.target }}-shard${{ matrix.shard }}
          path: build/minias-linux-kbuild-input
      - name: Build exact-head MiniAS (strict)
        run: make -j2 MODE=release CFLAGS=-Werror build/release/bin/minic-as
      - name: Scan full original Kbuild shard (assembly candidates, not GNU ELF parity)
        run: |
          set -Eeuo pipefail
          test -s "build/minias-linux-kbuild-input/shard-${{ matrix.shard }}.tar.gz"
          python3 tools/ci/minias-linux-kbuild-seven-v1.py scan \
            --target '${{ matrix.target }}' \
            --shard '${{ matrix.shard }}' \
            --archive 'build/minias-linux-kbuild-input/shard-${{ matrix.shard }}.tar.gz' \
            --minias "$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            --dest 'build/minias-linux-s-scan/${{ matrix.target }}-${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        with:
          name: minias-linux-s-result-${{ matrix.target }}-${{ matrix.shard }}
          path: build/minias-linux-s-scan/${{ matrix.target }}-${{ matrix.shard }}/results.json
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: replay
    if: always() && needs.replay.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minias-linux-s-result-*
          path: build/minias-linux-s-collection
      - name: Validate all 21 shards and aggregate exact-head candidate coverage
        run: |
          python3 tools/ci/minias-linux-kbuild-seven-v1.py aggregate \
            --results build/minias-linux-s-collection \
            --dest build/minias-linux-s-aggregate/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: minias-linux-s-three-target-aggregate
          path: build/minias-linux-s-aggregate/summary.json
          if-no-files-found: error
          retention-days: 30
