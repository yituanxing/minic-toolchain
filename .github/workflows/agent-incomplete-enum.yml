name: Agent Incomplete Enum

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.head_ref == 'refactor/foundation-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/incomplete-enum-v0
          fetch-depth: 0
      - name: Generate and validate slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_incomplete_enum_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/incomplete-enum-compiler
          MINIC="$GITHUB_WORKSPACE/build/incomplete-enum-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/incomplete-enum-focused" \
            sh tests/compiler/c0/run-enum-tag-type-references.sh
          MINIC="$GITHUB_WORKSPACE/build/incomplete-enum-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/incomplete-enum-focused-all" \
            sh tools/dev/pr76-focused.sh
          make -j4 MODE=release BUILD_DIR=build/incomplete-enum-compiler check-fast
      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/parser_internal.h \
            src/frontend/parser_enum.c \
            src/frontend/parser_function.c \
            tests/compiler/c0/enum_tag_type_references.c \
            tests/compiler/c0/run-enum-tag-type-references.sh \
            docs/DEVIATIONS.md
          git diff --cached --check
          git diff --cached --quiet && {
            printf '%s\n' 'generator produced no source changes' >&2
            exit 1
          }
          git commit -m '[generated] frontend: track incomplete enum tag lifecycle' \
            -m 'Teach the parser-owned enum registry to distinguish incomplete and complete tags. Unknown tagged references become bounded GNU C incomplete enum declarations, explicit enum tag semicolons are accepted at file scope, and later definitions complete the same tag while duplicate completed definitions remain errors. Keep the current enum-as-int semantic lowering explicit as DEV-0004 instead of prematurely introducing first-class enum TypeIds.\n\n让 parser-owned enum registry 区分 incomplete 与 complete tag。未知 tagged reference 建立受控的 GNU C incomplete enum，file scope 支持显式 enum tag; 前向声明，后续定义完成同一 tag，已完成 tag 的重复定义继续报错。当前 enum-as-int semantic lowering 作为 DEV-0004 显式记录，不在本 blocker 中提前引入一等 enum TypeId。'
          git push origin HEAD:agent/incomplete-enum-v0 --force-with-lease
