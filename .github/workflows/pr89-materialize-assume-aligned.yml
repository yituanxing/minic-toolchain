name: PR89 Materialize Assume Aligned Attribute

on:
  push:
    branches:
      - agent/function-assume-aligned-attribute-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/function-assume-aligned-attribute-v0
          fetch-depth: 0
      - name: Materialize attribute registry support
        run: |
          set -Eeuo pipefail
          python tools/dev/pr89-materialize-assume-aligned.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-gnu-function-attributes.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr89-materialize-assume-aligned.py
          rm -f .github/workflows/pr89-materialize-assume-aligned.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: register GNU assume_aligned metadata'
          git push origin HEAD:agent/function-assume-aligned-attribute-v0
