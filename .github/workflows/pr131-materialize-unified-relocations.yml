name: PR131 Materialize Unified Global Symbol Relocations
on:
  push:
    branches: [agent/unified-global-symbol-relocations-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize unified relocation model
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr131-materialize.py
          python3 tools/dev/pr131-fix-materializer.py
          python3 tools/dev/pr131-semantic-slot-repair.py
          clang-format-18 -i \
            src/frontend/ast.h \
            src/frontend/ast.c \
            src/frontend/ast_global.c \
            src/frontend/ast_verifier.c \
            src/frontend/parser_global.c \
            src/frontend/parser_function.c \
            src/target/data_layout.h \
            src/target/data_layout.c \
            src/target/riscv64/codegen_function.c \
            tests/programs/c0/static_function_relocations.c \
            tests/compiler/c0/static_mixed_symbol_relocations.c \
            tests/compiler/c0/invalid_static_record_object_relocation_type.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr131-focused" \
            sh tests/compiler/c0/run-static-mixed-symbol-relocations.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr131-materialize.py \
            tools/dev/pr131-fix-materializer.py \
            tools/dev/pr131-semantic-slot-repair.py \
            .github/workflows/pr131-materialize-unified-relocations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(frontend): unify global symbol relocations'
          git push origin HEAD:agent/unified-global-symbol-relocations-v0
