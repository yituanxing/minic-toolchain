name: MiniC targeted fixture owner adjudication temporary
on:
  push:
    branches: [cleanup/minic-native-matrix-batch-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect every broad dynamic fixture expansion site and classify unmatched C0 inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,re,fnmatch,json,collections
          root=pathlib.Path.cwd()
          paths=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\x00') if p]
          src=[p for p in paths if p.startswith('tests/compiler/c0/') and p.endswith(('.c','.i'))]
          contexts=[]
          other=[]
          for p in paths:
              if p in src or p.endswith('.md'):continue
              try:
                  if not (root/p).is_file() or (root/p).stat().st_size>250000:continue
                  body=(root/p).read_text(errors='replace')
              except:continue
              if p.startswith('.github/workflows/minic-c0-full-census-temp.yml'):continue
              other.append((p,body))
              for ix,line in enumerate(body.splitlines(),1):
                  if 'tests/compiler/c0/' in line and any(w in line for w in ('*.c','*.i','glob(','rglob(','fnmatch','find ')):
                      contexts.append((p,ix,line[:260]))
          print('DYNAMIC_PATTERNS',json.dumps(contexts,ensure_ascii=False))
          text='\n'.join(b for _,b in other)
          all_tokens=set(re.findall(r'[A-Za-z_][A-Za-z0-9_]{3,}',text))
          included=set()
          for p in src:
              try:included.update(x.split('/')[-1] for x in re.findall(r'#\s*include\s*["\x27]([^"\x27]+\.(?:c|i))["\x27]',(root/p).read_text(errors='replace')))
              except:pass
          noowner=[]
          for p in src:
              b=p.split('/')[-1];stem=b.rsplit('.',1)[0]
              if stem in all_tokens or b in text or p in text or b in included:continue
              noowner.append(p)
          print('NO_OWNER_SUMMARY',json.dumps(dict(total=len(src),missing=len(noowner),largest=max(((root/p).stat().st_size for p in noowner),default=0)),ensure_ascii=False))
          for p in noowner:
              code=(root/p).read_text(errors='replace')
              cleaned=[x.strip() for x in code.splitlines() if x.strip() and not x.strip().startswith(('#','//','/*','*','*/'))]
              print('NO_OWNER_CASE',json.dumps(dict(path=p,size=len(code),head=cleaned[:5],tail=cleaned[-2:]),ensure_ascii=False))
          PY
