name: MiniAS A0 Native Linux ASM26

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minias-native26-${{ github.ref }}
  cancel-in-progress: true

env:
  FROZEN_NATIVE26_RUN: "33245348705"
  FROZEN_NATIVE26_FILES_SHA256: "fdbdf1f8fbf4ddcb1af4ff689225780f12e0e243dec3b9540fc493e766b429f6"

jobs:
  native26:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-native26]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native26-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native26-toolchain check-minias-a0

      - name: Download frozen native26 inputs
        uses: actions/download-artifact@v4
        with:
          name: minias-a0-native26-progress
          path: build/import-native26
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_NATIVE26_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and materialize frozen native26 inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-native26
          test -s "$import/minias-native26-manifest.json"
          test -d "$import/minias-native26-inputs"
          rm -rf build/minias-native26-inputs build/linux-native26-out
          cp "$import/minias-native26-manifest.json" build/minias-native26-manifest.json
          if test -s "$import/minias-native26-targets.txt"; then
            cp "$import/minias-native26-targets.txt" build/minias-native26-targets.txt
          else
            : > build/minias-native26-targets.txt
          fi
          cp -a "$import/minias-native26-inputs" build/minias-native26-inputs
          mkdir -p build/linux-native26-out

          count=$(find build/minias-native26-inputs -type f -name '*.s' | wc -l)
          test "$count" -eq 26
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("build/minias-native26-manifest.json").read_text())
          assert len(rows)==26, len(rows)
          expected={row["desired_s"] for row in rows}
          actual={
              p.relative_to("build/minias-native26-inputs").as_posix()
              for p in Path("build/minias-native26-inputs").rglob("*.s")
          }
          assert actual == expected, (sorted(expected-actual), sorted(actual-expected))
          print("MINIAS_NATIVE26_MANIFEST=PASS selected=26")
          PY

          (
            cd build/minias-native26-inputs
            find . -type f -name '*.s' -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > ../native26-files.sha256
          )
          actual=$(sha256sum build/native26-files.sha256 | cut -d' ' -f1)
          test "$actual" = "$FROZEN_NATIVE26_FILES_SHA256"
          echo "MINIAS_NATIVE26_FROZEN=PASS selected=26 files_sha256=$actual source_run=$FROZEN_NATIVE26_RUN"

      - name: Assemble native26 and classify first blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, re, subprocess

          workspace = Path.cwd().resolve()
          minias = workspace / "build/minias-native26-toolchain/bin/minic-as"
          linux_out = workspace / "build/linux-native26-out"
          input_root = workspace / "build/minias-native26-inputs"
          result_root = workspace / "build/minias-native26-results"
          result_root.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((workspace / "build/minias-native26-manifest.json").read_text())
          results = []
          blockers = Counter()

          for row in manifest:
              rel_s = row["desired_s"]
              inp = input_root / rel_s
              obj = result_root / (rel_s[:-2] + ".o")
              err = result_root / (rel_s[:-2] + ".err")
              obj.parent.mkdir(parents=True, exist_ok=True)
              err.parent.mkdir(parents=True, exist_ok=True)
              proc = subprocess.run(
                  [str(minias), "-o", str(obj), str(inp)],
                  cwd=linux_out,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              err.write_text(proc.stderr)
              if proc.returncode == 0 and obj.is_file() and obj.stat().st_size:
                  check = subprocess.run(
                      ["readelf", "-h", str(obj)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      errors="replace",
                  )
                  ok = check.returncode == 0 and "RISC-V" in check.stdout and "REL (Relocatable file)" in check.stdout
              else:
                  ok = False
              if ok:
                  results.append(("PASS", rel_s, "-"))
                  continue
              raw = next((line.strip() for line in proc.stderr.splitlines() if line.strip()), "internal:no-diagnostic")
              blocker = re.sub(r"^minic-as:\s*", "", raw)
              blocker = re.sub(r":line=[0-9]+$", "", blocker)
              blockers[blocker] += 1
              results.append(("FAIL", rel_s, blocker))

          (result_root / "results.tsv").write_text(
              "".join(f"{status}\t{path}\t{blocker}\n" for status, path, blocker in results)
          )
          pass_count = sum(status == "PASS" for status, _, _ in results)
          fail_count = len(results) - pass_count
          lines = [
              f"MINIAS_NATIVE26_SUMMARY pass={pass_count} fail={fail_count} total={len(results)}",
              "MINIAS_NATIVE26_TOP_BLOCKERS",
          ]
          lines.extend(
              [f"  {count:5d} {blocker}" for blocker, count in blockers.most_common()]
              or ["  none"]
          )
          lines.append("MINIAS_NATIVE26_FILES")
          lines.extend(f"{status}\t{path}\t{blocker}" for status, path, blocker in results)
          summary = "\n".join(lines) + "\n"
          (result_root / "summary.txt").write_text(summary)
          print(summary, end="")
          if len(results) != 26:
              raise SystemExit(f"expected 26 results, got {len(results)}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minias-a0-native26-progress
          path: |
            build/minias-native26-manifest.json
            build/minias-native26-targets.txt
            build/minias-native26-inputs/**/*.s
            build/minias-native26-results/results.tsv
            build/minias-native26-results/summary.txt
            build/minias-native26-results/**/*.err
          retention-days: 14
          if-no-files-found: warn
