name: MiniAS A0 Native Linux ASM26

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_VERSION: "6.6.143"
  LINUX_ARCHIVE_SHA256: "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"

jobs:
  native26:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-native26]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev

      - name: Build MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native26-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native26-toolchain check-minias-a0

      - name: Materialize configured native assembly plan
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-native26-src"
          out="$GITHUB_WORKSPACE/build/linux-native26-out"
          archive="$GITHUB_WORKSPACE/build/linux-${LINUX_VERSION}.tar.xz"
          mkdir -p build
          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          rm -rf "$src" "$out"
          mkdir -p "$src" "$out"
          tar -xJf "$archive" -C "$src" --strip-components=1
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >build/native26-plan.raw 2>build/native26-plan.stderr
          rc=$?
          set -e
          echo "MINIAS_NATIVE26_PLAN_STATUS=$rc"
          test -s build/native26-plan.raw

      - name: Resolve and build native .s targets through Kbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import json, re

          plan = Path("build/native26-plan.raw").read_text(errors="replace").splitlines()
          out_root = Path("build/linux-native26-out").resolve()
          src_root = Path("build/linux-native26-src").resolve()
          object_re = re.compile(r"(?:^|\s)-o\s+([^\s;]+\.o)(?=\s|;|$)")
          source_re = re.compile(r"(?:^|\s)([^\s;]+\.S)(?=\s|;|$)")
          entries = {}

          for line in plan:
              if "riscv64-linux-gnu-gcc" not in line or " -c " not in f" {line} ":
                  continue
              objects = object_re.findall(line)
              sources = source_re.findall(line)
              if not objects or not sources:
                  continue
              raw_obj = objects[-1].strip("'\"")
              obj = Path(raw_obj)
              if obj.is_absolute():
                  try:
                      rel_obj = obj.resolve().relative_to(out_root)
                  except ValueError:
                      continue
              else:
                  rel_obj = obj
              rel_obj_text = PurePosixPath(rel_obj.as_posix()).as_posix()
              if rel_obj_text.startswith(("scripts/", "tools/")) or "/scripts/" in rel_obj_text:
                  continue
              source = Path(sources[-1].strip("'\"")).resolve()
              try:
                  rel_source = PurePosixPath(source.relative_to(src_root).as_posix()).as_posix()
              except ValueError:
                  continue
              entries[rel_obj_text] = rel_source

          if len(entries) != 26:
              raise SystemExit(f"expected 26 configured native .S objects, got {len(entries)}")

          manifest = []
          targets = []
          for obj in sorted(entries):
              source = entries[obj]
              desired_s = obj[:-2] + ".s"
              matching_source = obj[:-2] + ".S"
              target_s = desired_s if source == matching_source else source[:-2] + ".s"
              manifest.append({
                  "object": obj,
                  "source": source,
                  "desired_s": desired_s,
                  "target_s": target_s,
              })
              if target_s not in targets:
                  targets.append(target_s)

          Path("build/minias-native26-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          Path("build/minias-native26-targets.txt").write_text("\n".join(targets) + "\n")
          print(
              f"MINIAS_NATIVE26_TARGETS objects={len(manifest)} "
              f"unique_s_targets={len(targets)}"
          )
          PY

          src="$GITHUB_WORKSPACE/build/linux-native26-src"
          out="$GITHUB_WORKSPACE/build/linux-native26-out"
          mapfile -t targets < build/minias-native26-targets.txt
          test "${#targets[@]}" -gt 0
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 "${targets[@]}"

          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          manifest = json.loads(Path("build/minias-native26-manifest.json").read_text())
          out = Path("build/linux-native26-out")
          root = Path("build/minias-native26-inputs")
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(parents=True)
          for row in manifest:
              source = out / row["target_s"]
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f"missing Kbuild .s target: {row['target_s']}")
              target = root / row["desired_s"]
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          print(f"MINIAS_NATIVE26_INPUTS selected={len(manifest)}")
          PY

      - name: Assemble native26 and classify first blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, re, subprocess

          workspace = Path.cwd().resolve()
          minias = workspace / "build/minias-native26-toolchain/bin/minic-as"
          linux_out = workspace / "build/linux-native26-out"
          input_root = workspace / "build/minias-native26-inputs"
          result_root = workspace / "build/minias-native26-results"
          result_root.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((workspace / "build/minias-native26-manifest.json").read_text())
          results = []
          blockers = Counter()

          for row in manifest:
              rel_s = row["desired_s"]
              inp = input_root / rel_s
              obj = result_root / (rel_s[:-2] + ".o")
              err = result_root / (rel_s[:-2] + ".err")
              obj.parent.mkdir(parents=True, exist_ok=True)
              err.parent.mkdir(parents=True, exist_ok=True)
              proc = subprocess.run(
                  [str(minias), "-o", str(obj), str(inp)],
                  cwd=linux_out,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              err.write_text(proc.stderr)
              if proc.returncode == 0 and obj.is_file() and obj.stat().st_size:
                  check = subprocess.run(
                      ["readelf", "-h", str(obj)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      errors="replace",
                  )
                  ok = check.returncode == 0 and "RISC-V" in check.stdout and "REL (Relocatable file)" in check.stdout
              else:
                  ok = False
              if ok:
                  results.append(("PASS", rel_s, "-"))
                  continue
              raw = next((line.strip() for line in proc.stderr.splitlines() if line.strip()), "internal:no-diagnostic")
              blocker = re.sub(r"^minic-as:\s*", "", raw)
              blocker = re.sub(r":line=[0-9]+$", "", blocker)
              blockers[blocker] += 1
              results.append(("FAIL", rel_s, blocker))

          (result_root / "results.tsv").write_text(
              "".join(f"{status}\t{path}\t{blocker}\n" for status, path, blocker in results)
          )
          pass_count = sum(status == "PASS" for status, _, _ in results)
          fail_count = len(results) - pass_count
          lines = [
              f"MINIAS_NATIVE26_SUMMARY pass={pass_count} fail={fail_count} total={len(results)}",
              "MINIAS_NATIVE26_TOP_BLOCKERS",
          ]
          lines.extend(
              [f"  {count:5d} {blocker}" for blocker, count in blockers.most_common()]
              or ["  none"]
          )
          lines.append("MINIAS_NATIVE26_FILES")
          lines.extend(f"{status}\t{path}\t{blocker}" for status, path, blocker in results)
          summary = "\n".join(lines) + "\n"
          (result_root / "summary.txt").write_text(summary)
          print(summary, end="")
          if len(results) != 26:
              raise SystemExit(f"expected 26 results, got {len(results)}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minias-a0-native26-progress
          path: |
            build/minias-native26-manifest.json
            build/minias-native26-targets.txt
            build/minias-native26-results/results.tsv
            build/minias-native26-results/summary.txt
            build/minias-native26-results/**/*.err
          retention-days: 14
          if-no-files-found: warn
