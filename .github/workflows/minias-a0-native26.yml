name: MiniAS A0 Native Linux ASM26

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_VERSION: "6.6.143"
  LINUX_ARCHIVE_SHA256: "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"

jobs:
  native26:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-native26]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev

      - name: Build MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native26-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native26-toolchain check-minias-a0

      - name: Materialize configured native assembly plan
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-native26-src"
          out="$GITHUB_WORKSPACE/build/linux-native26-out"
          archive="$GITHUB_WORKSPACE/build/linux-${LINUX_VERSION}.tar.xz"
          mkdir -p build
          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          rm -rf "$src" "$out"
          mkdir -p "$src" "$out"
          tar -xJf "$archive" -C "$src" --strip-components=1
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >build/native26-plan.raw 2>build/native26-plan.stderr
          rc=$?
          set -e
          echo "MINIAS_NATIVE26_PLAN_STATUS=$rc"
          test -s build/native26-plan.raw

      - name: Materialize exact native .s targets through Kbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import re

          plan = Path("build/native26-plan.raw").read_text(errors="replace").splitlines()
          out_root = Path("build/linux-native26-out").resolve()
          object_re = re.compile(r"(?:^|\s)-o\s+([^\s;]+\.o)(?=\s|;|$)")
          source_re = re.compile(r"(?:^|\s)([^\s;]+\.S)(?=\s|;|$)")
          entries = {}
          for line in plan:
              if "riscv64-linux-gnu-gcc" not in line or " -c " not in f" {line} ":
                  continue
              objs = object_re.findall(line)
              srcs = source_re.findall(line)
              if not objs or not srcs:
                  continue
              raw_obj = objs[-1].strip("'\"")
              obj = Path(raw_obj)
              if obj.is_absolute():
                  try: rel = obj.resolve().relative_to(out_root)
                  except ValueError: continue
              else:
                  rel = obj
              rel_text = PurePosixPath(rel.as_posix()).as_posix()
              if rel_text.startswith(("scripts/","tools/")) or "/scripts/" in rel_text:
                  continue
              entries[rel_text] = srcs[-1].strip("'\"")
          if len(entries) != 26:
              raise SystemExit(f"expected 26 configured native .S objects, got {len(entries)}")
          src_root = Path("build/linux-native26-src").resolve()
          materialized = []
          targets = []
          for obj in sorted(entries):
              source = Path(entries[obj]).resolve()
              try:
                  source_rel = PurePosixPath(source.relative_to(src_root).as_posix()).as_posix()
              except ValueError:
                  raise SystemExit(f"native source outside Linux tree: {source}")
              desired_s = obj[:-2] + ".s"
              matching_source = obj[:-2] + ".S"
              target_s = desired_s if source_rel == matching_source else source_rel[:-2] + ".s"
              materialized.append((obj, desired_s, target_s, str(source)))
              if target_s not in targets:
                  targets.append(target_s)
          Path("build/minias-native26-targets.txt").write_text("\n".join(targets)+"\n")
          Path("build/minias-native26-sources.tsv").write_text("\n".join(
              f"{obj}\t{desired_s}\t{target_s}\t{source}"
              for obj,desired_s,target_s,source in materialized
          )+"\n")
          print(f"MINIAS_NATIVE26_TARGETS objects={len(materialized)} unique_s_targets={len(targets)}")
          PY
          src="$GITHUB_WORKSPACE/build/linux-native26-src"
          out="$GITHUB_WORKSPACE/build/linux-native26-out"
          mapfile -t targets <build/minias-native26-targets.txt
          test "${#targets[@]}" -ge 1
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 "${targets[@]}"
          root="$GITHUB_WORKSPACE/build/minias-native26-inputs"
          rm -rf "$root"
          mkdir -p "$root"
          while IFS=      - name: Assemble native26 and classify first blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-native26-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-native26-inputs"
          out="$GITHUB_WORKSPACE/build/minias-native26-results"
          mkdir -p "$out"
          while IFS=$'\t' read -r obj rel_s source; do
            stem="$out/${rel_s%.s}"
            mkdir -p "$(dirname "$stem")"
            err="$stem.err"; result="$stem.result"; blocker="$stem.blocker"
            if (cd "$GITHUB_WORKSPACE/build/linux-native26-out" && "$minias" -o "$GITHUB_WORKSPACE/$stem.o" "$GITHUB_WORKSPACE/$root/$rel_s" 2>"$GITHUB_WORKSPACE/$err"); then
              readelf -h "$stem.o" | grep -q "RISC-V"
              readelf -h "$stem.o" | grep -q "REL (Relocatable file)"
              printf "PASS\t%s\t-\n" "$rel_s" >"$result"
            else
              raw=$(head -n1 "$err" || true)
              first=$(printf "%s\n" "$raw" | sed -E "s/^minic-as: //; s/:line=[0-9]+$//")
              test -n "$first" || first="internal:no-diagnostic"
              printf "%s\n" "$first" >"$blocker"
              printf "FAIL\t%s\t%s\n" "$rel_s" "$first" >"$result"
            fi
          done <build/minias-native26-manifest.tsv
          find "$out" -type f -name "*.result" -print0 | LC_ALL=C sort -z | xargs -0 cat >"$out/results.tsv"
          find "$out" -type f -name "*.blocker" -print0 | LC_ALL=C sort -z | xargs -0 -r cat >"$out/blockers.txt"
          test "$(wc -l < "$out/results.tsv")" -eq 26
          pass=$(awk -F "\t" '$1=="PASS"{n++}END{print n+0}' "$out/results.tsv")
          fail=$(awk -F "\t" '$1=="FAIL"{n++}END{print n+0}' "$out/results.tsv")
          {
            echo "MINIAS_NATIVE26_SUMMARY pass=$pass fail=$fail total=26"
            echo "MINIAS_NATIVE26_TOP_BLOCKERS"
            if test -s "$out/blockers.txt"; then LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr; else echo "  none"; fi
            echo "MINIAS_NATIVE26_FILES"
            cat "$out/results.tsv"
          } | tee "$out/summary.txt"
          test $((pass + fail)) -eq 26

      - uses: actions/upload-artifact@v4
        with:
          name: minias-a0-native26-progress
          path: |
            build/minias-native26-manifest.tsv
            build/minias-native26-results/results.tsv
            build/minias-native26-results/summary.txt
            build/minias-native26-results/**/*.err
          retention-days: 14
          if-no-files-found: error\t' read -r obj rel_s target_s source; do
            test -s "$out/$target_s"
            mkdir -p "$root/$(dirname "$rel_s")"
            cp "$out/$target_s" "$root/$rel_s"
          done <build/minias-native26-sources.tsv
          awk -F '\t' '{print $1 "\t" $2 "\t" $4}' build/minias-native26-sources.tsv >build/minias-native26-manifest.tsv
          test "$(wc -l <build/minias-native26-manifest.tsv)" -eq 26
          echo "MINIAS_NATIVE26_INPUTS selected=26"
      - name: Assemble native26 and classify first blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-native26-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-native26-inputs"
          out="$GITHUB_WORKSPACE/build/minias-native26-results"
          mkdir -p "$out"
          while IFS=$'\t' read -r obj rel_s source; do
            stem="$out/${rel_s%.s}"
            mkdir -p "$(dirname "$stem")"
            err="$stem.err"; result="$stem.result"; blocker="$stem.blocker"
            if (cd "$GITHUB_WORKSPACE/build/linux-native26-out" && "$minias" -o "$GITHUB_WORKSPACE/$stem.o" "$GITHUB_WORKSPACE/$root/$rel_s" 2>"$GITHUB_WORKSPACE/$err"); then
              readelf -h "$stem.o" | grep -q "RISC-V"
              readelf -h "$stem.o" | grep -q "REL (Relocatable file)"
              printf "PASS\t%s\t-\n" "$rel_s" >"$result"
            else
              raw=$(head -n1 "$err" || true)
              first=$(printf "%s\n" "$raw" | sed -E "s/^minic-as: //; s/:line=[0-9]+$//")
              test -n "$first" || first="internal:no-diagnostic"
              printf "%s\n" "$first" >"$blocker"
              printf "FAIL\t%s\t%s\n" "$rel_s" "$first" >"$result"
            fi
          done <build/minias-native26-manifest.tsv
          find "$out" -type f -name "*.result" -print0 | LC_ALL=C sort -z | xargs -0 cat >"$out/results.tsv"
          find "$out" -type f -name "*.blocker" -print0 | LC_ALL=C sort -z | xargs -0 -r cat >"$out/blockers.txt"
          test "$(wc -l < "$out/results.tsv")" -eq 26
          pass=$(awk -F "\t" '$1=="PASS"{n++}END{print n+0}' "$out/results.tsv")
          fail=$(awk -F "\t" '$1=="FAIL"{n++}END{print n+0}' "$out/results.tsv")
          {
            echo "MINIAS_NATIVE26_SUMMARY pass=$pass fail=$fail total=26"
            echo "MINIAS_NATIVE26_TOP_BLOCKERS"
            if test -s "$out/blockers.txt"; then LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr; else echo "  none"; fi
            echo "MINIAS_NATIVE26_FILES"
            cat "$out/results.tsv"
          } | tee "$out/summary.txt"
          test $((pass + fail)) -eq 26

      - uses: actions/upload-artifact@v4
        with:
          name: minias-a0-native26-progress
          path: |
            build/minias-native26-manifest.tsv
            build/minias-native26-results/results.tsv
            build/minias-native26-results/summary.txt
            build/minias-native26-results/**/*.err
          retention-days: 14
          if-no-files-found: error