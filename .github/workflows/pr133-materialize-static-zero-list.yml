name: PR133 Materialize Static Zero Declaration List
on:
  push:
    branches: [agent/static-zero-declaration-list-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize static zero declaration lists
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr133-materialize.py
          chmod +x tests/compiler/c0/run-static-zero-declaration-list.sh
          clang-format-18 -i \
            src/frontend/parser_internal.h \
            src/frontend/parser_global.c \
            src/frontend/parser_function.c \
            tests/compiler/c0/static_zero_declaration_list.c \
            tests/compiler/c0/invalid_static_zero_declaration_list_initializer.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr133-focused" \
            sh tests/compiler/c0/run-static-zero-declaration-list.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr133-materialize.py \
            .github/workflows/pr133-materialize-static-zero-list.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): support static zero declaration lists'
          git push origin HEAD:agent/static-zero-declaration-list-v0
