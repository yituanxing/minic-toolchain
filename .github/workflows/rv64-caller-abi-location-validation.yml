name: RV64 Caller ABI Location Validation

on:
  push:
    branches:
      - refactor/rv64-caller-abi-location-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv64-caller-abi-location-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Materialize caller location consumer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-rv64-caller-abi-location-v1.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          grep -F 'MinicRiscv64AbiArgumentLocation argument_locations' \
            src/target/riscv64/codegen_expression.c >/dev/null
          grep -F 'stack_argument_count = abi_cursor.stack_slot_count;' \
            src/target/riscv64/codegen_expression.c >/dev/null
          if grep -F 'size_t stack_argument_index;' src/target/riscv64/codegen_expression.c >/dev/null; then
            echo 'legacy caller stack placement cursor remains' >&2
            exit 1
          fi
          git diff -- src/target/riscv64/codegen_expression.c

      - name: Verify unchanged production source inventory
        run: sh tools/maintenance/check-production-source-inventory.sh

      - name: Run release host contracts
        run: make -j2 MODE=release BUILD_DIR=build/rv64-caller-abi-host CFLAGS=-Werror check-fast

      - name: Run sanitizer AST contracts
        run: make -j2 MODE=sanitize BUILD_DIR=build/rv64-caller-abi-sanitize check-ast-contract

      - name: Run frozen Foundation focused semantics
        shell: bash
        env:
          MINIC: ${{ github.workspace }}/build/rv64-caller-abi-host/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/rv64-caller-abi-foundation-focused
          HOST_CC: cc
        run: sh tools/dev/pr76-focused.sh

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Materialize caller location consumer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-rv64-caller-abi-location-v1.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh
