name: Agent Object Alignment

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.head_ref == 'refactor/foundation-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/object-alignment-v0
          fetch-depth: 0
      - name: Generate and validate slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/dev/agent_object_alignment_patch.py')
          text = path.read_text()
          text = text.replace(r"message[0] == '\0'", r"message[0] == '\\0'")
          text = text.replace(r"/^  \.align 6$/", r"/^\.align 6$/")
          text = text.replace(r"/^  \.align 3$/", r"/^\.align 3$/")
          path.write_text(text)
          PY
          python3 tools/dev/agent_object_alignment_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/object-alignment-compiler
          MINIC="$GITHUB_WORKSPACE/build/object-alignment-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/object-alignment-focused" \
            sh -x tests/compiler/c0/run-gnu-object-alignment-attribute.sh
          MINIC="$GITHUB_WORKSPACE/build/object-alignment-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/object-alignment-focused-all" \
            sh tools/dev/pr76-focused.sh
          make -j4 MODE=release BUILD_DIR=build/object-alignment-compiler check-fast
      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/attribute.c \
            src/frontend/ast.h \
            src/frontend/ast_global.c \
            src/frontend/parser_function.c \
            src/frontend/parser_global.c \
            src/frontend/parser_internal.h \
            src/target/riscv64/layout.c \
            tests/compiler/c0/gnu_object_alignment_attribute.c \
            tests/compiler/c0/run-gnu-object-alignment-attribute.sh \
            tools/dev/pr76-focused.sh
          git diff --cached --check
          git diff --cached --quiet && {
            printf '%s\n' 'generator produced no source changes' >&2
            exit 1
          }
          git commit -m '[generated] frontend: preserve object-specific GNU alignment' \
            -m 'Model GNU aligned on object declarations as object-owned minimum alignment rather than mutating the C type. Merge the property across extern declarations, materialize it in RV64 object layout, and preserve existing section metadata. Verify the Linux jiffies shape, non-contamination of another object with the same typedef, and rejection of invalid non-power-of-two alignment.\n\n将对象声明上的 GNU aligned 建模为对象自身的最小对齐要求，而不是修改 C 类型。该属性可在 extern 声明间合并，并在 RV64 对象布局中物化，同时保留已有 section 元数据。验证 Linux jiffies 形状、同 typedef 普通对象不受污染，以及非法非 2 次幂对齐仍被拒绝。'
          git push origin HEAD:agent/object-alignment-v0 --force-with-lease
