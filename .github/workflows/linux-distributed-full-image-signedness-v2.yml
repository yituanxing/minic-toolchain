name: Linux Distributed Full Image Signedness V2
on:
  workflow_dispatch:

permissions:
  contents: read
env:
  MINIC_DISTRIBUTED_FIX_NESTED_CONSTANT_P: '1'
concurrency:
  group: linux-distributed-full-image-signedness-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate experiment shell and Core patch syntax before setup
        run: |
          set -Eeuo pipefail
          bash -n tools/ci/linux-distributed-full-image-v1.sh
          python3 -m py_compile tools/ci/apply-correctness-constant-p-core-local-facts-v1.py tools/ci/apply-correctness-constant-p-nested-core-v2.py
      - name: Install Linux Kbuild manifest prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu bc bison flex \
            libssl-dev libelf-dev make curl xz-utils python3
      - name: Prepare exact expanded Image config
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-distributed-image-graph-v1"
          mkdir -p "$work"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$work/linux-6.6.143.tar.xz"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$work/linux-6.6.143.tar.xz" | sha256sum -c -
          tar -xJf "$work/linux-6.6.143.tar.xz" -C "$work"
          src="$work/linux-6.6.143"
          out="$work/out"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts
          sha256sum "$out/.config" >"$work/config.sha256"
          echo "DIST_IMAGE_PREPARE=PASS config_sha=$(cut -d' ' -f1 "$work/config.sha256")"
      - name: Discover Kbuild default-build C object candidates
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-distributed-image-graph-v1"
          src="$work/linux-6.6.143"
          out="$work/out"
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/plan.raw" 2>"$work/plan.stderr"
          rc=$?
          set -e
          echo "DIST_IMAGE_PLAN_DRY_RUN_RC=$rc"
          python3 tools/ci/linux-distributed-image-plan-v1.py \
            "$work/plan.raw" "$out" "$work/manifest.tsv" 7 | tee "$work/summary.txt"
          head -n 3 "$work/manifest.tsv"
          tail -n 3 "$work/manifest.tsv"
      - name: Prove GNU constant-p ICE on a previously failing real Nouveau target
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-distributed-image-graph-v1"
          src="$work/linux-6.6.143"
          out="$work/out"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$work/toolchain" "$work/profile"
          python3 tools/ci/apply-correctness-constant-p-ice-v1.py | tee "$work/ice-patch.txt"
          python3 tools/ci/apply-correctness-constant-p-core-local-facts-v1.py | tee "$work/nested-v1-patch.txt"
          python3 tools/ci/apply-correctness-constant-p-nested-core-v2.py | tee "$work/nested-v2-patch.txt"
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" >/dev/null
          : >"$work/nouveau.trace"
          MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
            MINIC_KBUILD_TRACE="$work/nouveau.trace" CORE_FAST_TRACE=0 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            CC="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh" \
            -j1 V=1 drivers/gpu/drm/nouveau/nouveau_drm.o \
              >"$work/nouveau.log" 2>&1 || { tail -n 85 "$work/nouveau.log"; exit 1; }
          test -s "$out/drivers/gpu/drm/nouveau/nouveau_drm.o"
          grep -Fq 'pass source=' "$work/nouveau.trace"
          riscv64-linux-gnu-readelf -h "$out/drivers/gpu/drm/nouveau/nouveau_drm.o" \
            | grep -q 'Machine:.*RISC-V'
          echo 'DIST_IMAGE_NOUVEAU_ICE=PASS targeted_real_kbuild=1' | tee "$work/nouveau-result.txt"
      - name: Preserve reproducible full Image plan and exact config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-full-image-plan-v1
          path: |
            build/linux-distributed-image-graph-v1/config.sha256
            build/linux-distributed-image-graph-v1/manifest.tsv
            build/linux-distributed-image-graph-v1/manifest.sha256
            build/linux-distributed-image-graph-v1/summary.txt
            build/linux-distributed-image-graph-v1/plan.stderr
            build/linux-distributed-image-graph-v1/nouveau.log
            build/linux-distributed-image-graph-v1/nouveau.trace
            build/linux-distributed-image-graph-v1/nouveau-result.txt
            build/linux-distributed-image-graph-v1/ice-patch.txt
            build/linux-distributed-image-graph-v1/nested-v1-patch.txt
            build/linux-distributed-image-graph-v1/nested-v2-patch.txt
          if-no-files-found: warn
          retention-days: 7

  shards:
    needs: graph
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributed-full-image-plan-v1
          path: build/linux-distributed-full-image-v1/plan
      - name: Install exact RISC-V compiler prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu build-essential \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3
      - name: Prepare identical Linux tree and corrected Runtime MiniC
        run: bash tools/ci/linux-distributed-full-image-v1.sh prepare
      - name: Compile real Kbuild C object shard
        run: bash tools/ci/linux-distributed-full-image-v1.sh produce ${{ matrix.shard }}
      - name: Export strict object and hidden Kbuild metadata
        uses: actions/upload-artifact@v4
        with:
          name: distributed-full-image-shard-${{ matrix.shard }}
          path: build/linux-distributed-full-image-v1/bundle/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 2
          retention-days: 4
      - name: Preserve shard failures separately
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-full-image-debug-${{ matrix.shard }}
          path: |
            build/linux-distributed-full-image-v1/produce-*.log
            build/linux-distributed-full-image-v1/produce-*.trace
            build/linux-distributed-full-image-v1/config.sha256
            build/linux-distributed-full-image-v1/compiler.sha256
          if-no-files-found: ignore
          retention-days: 4

  receiver:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributed-full-image-plan-v1
          path: build/linux-distributed-full-image-v1/plan
      - name: Install the exact producer dependencies before configuring Linux
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu build-essential \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3
      - name: Prepare independent Linux and corrected Runtime 39+ICE+Nested MiniC
        run: bash tools/ci/linux-distributed-full-image-v1.sh prepare
      - name: Restore all seven real object shards
        uses: actions/download-artifact@v4
        with:
          pattern: distributed-full-image-shard-*
          path: build/linux-distributed-full-image-v1/incoming/
          merge-multiple: false
      - name: Verify all transferred objects then build complete Kbuild Image
        run: bash tools/ci/linux-distributed-full-image-v1.sh image
      - name: Install QEMU and static-init dependencies only after Image is finished
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            qemu-system-misc opensbi cpio gzip libc6-dev-riscv64-cross device-tree-compiler
      - name: Boot generated Image with independently compiled initramfs
        run: bash tools/ci/linux-distributed-full-image-v1.sh qemu
      - name: Preserve link, verification and QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-full-image-receiver-evidence
          path: |
            build/linux-distributed-full-image-v1/image.log
            build/linux-distributed-full-image-v1/image.trace
            build/linux-distributed-full-image-v1/image-summary.txt
            build/linux-distributed-full-image-v1/reuse.sha256
            build/linux-distributed-full-image-v1/qemu.log
            build/linux-distributed-full-image-v1/qemu-summary.txt
            build/linux-distributed-full-image-v1/config.sha256
            build/linux-distributed-full-image-v1/compiler.sha256
          if-no-files-found: ignore
          retention-days: 7
