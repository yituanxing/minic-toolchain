name: Integrate RV64 Callee ABI Location

on:
  push:
    branches:
      - refactor/rv64-callee-abi-location-v1

permissions:
  contents: write

concurrency:
  group: rv64-callee-abi-location-integrate
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/rv64-callee-abi-location-v1
          fetch-depth: 0

      - name: Fold proven callee location candidate into canonical source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-rv64-callee-abi-location-v1.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          grep -F 'MinicRiscv64AbiCursor abi_cursor;' src/target/riscv64/codegen_function.c >/dev/null
          grep -F 'minic_riscv64_abi_place_argument' src/target/riscv64/codegen_function.c >/dev/null
          if grep -F 'size_t stack_parameter_index;' src/target/riscv64/codegen_function.c >/dev/null; then
            echo 'legacy callee stack parameter cursor remains' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/target/riscv64/codegen_function.c
          git rm tools/dev/materialize-rv64-callee-abi-location-v1.py
          git rm .github/workflows/rv64-callee-abi-location-integrate.yml
          git diff --cached --check
          git commit -m 'refactor(abi): consume abstract locations at callee entry'
          git push origin HEAD:refactor/rv64-callee-abi-location-v1
