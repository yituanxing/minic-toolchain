name: Nested Switch Case V0

on:
  push:
    branches:
      - compiler/nested-switch-case-v0

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install RV64 runtime tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
      - name: Build MiniC
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/nested-switch-case-v0
      - name: Strict Core nested switch case runtime
        run: |
          MINIC="$GITHUB_WORKSPACE/build/nested-switch-case-v0/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/nested-switch-case-v0/focused" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-switch-m27.sh
      - name: Existing switch control-flow regression
        run: |
          MINIC="$GITHUB_WORKSPACE/build/nested-switch-case-v0/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/nested-switch-case-v0/focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-switch-control-flow.sh
