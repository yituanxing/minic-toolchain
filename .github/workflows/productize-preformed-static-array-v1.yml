name: Productize Preformed Static Array V1
on:
  push:
    branches: [product/preformed-static-array-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/preformed-static-array-v1
          fetch-depth: 0
      - name: Apply staging-proven static array support
        run: |
          set -Eeuo pipefail
          mat=tools/dev/.productize-preformed-static-array-v1.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-preformed-static-array-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat > tests/compiler/c0/preformed_static_array.c <<'EOF'
          struct mapping { const char *name; int value; };
          static struct mapping maps[] __attribute__((section(".data.test"))) = {
              { .name = "one", .value = 1 },
              { .name = "two", .value = 2 },
          };
          int main(void) { return maps[1].value - 2; }
          EOF
          cat >> tests/compiler/c0/run.sh <<'EOF'

          compile_source preformed_static_array preformed_static_array
          expect_instructions preformed_static_array ".section .data.test" "maps:"
          EOF
          clang-format-18 -i src/frontend/parser_global.c tests/compiler/c0/preformed_static_array.c
          git diff --check
      - name: Validate Werror and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/preformed-static-array-v1
          make -j4 check-fast MODE=release BUILD_DIR=build/preformed-static-array-v1-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-preformed-static-array-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_global.c tests/compiler/c0/preformed_static_array.c tests/compiler/c0/run.sh
          git commit -m 'frontend: initialize preformed static arrays'
          git push origin HEAD:product/preformed-static-array-v1
