name: Linux Internal Function Emission V0

on:
  push:
    branches:
      - "agent/linux-link-correctness-v0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-internal-function-emission-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Build current product and run emission regression
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/linux-internal-function-emission-v0/toolchain"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" all
          MINIC="$build/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-internal-function-emission-v0" \
            bash tests/compiler/c0/run-inline-emission-reachability-rv64.sh
          echo "LINUX_INTERNAL_FUNCTION_EMISSION_V0=PASS head=${GITHUB_SHA}"
