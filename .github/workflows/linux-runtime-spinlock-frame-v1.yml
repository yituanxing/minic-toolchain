name: Linux Runtime Spinlock Frame V1

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-spinlock-frame-v1.yml"
      - "tools/ci/runtime-spinlock-frame-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restore linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true
      - name: Restore Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true
      - name: Install prerequisites
        run: sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3 make
      - name: Build runtime MiniC and refresh spinlock_debug
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-frame-v1"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-spinlock-frame-v1"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          target=kernel/locking/spinlock_debug.o
          base=${target%.o}
          rm -f "$out/$target" "$out/kernel/locking/.spinlock_debug.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/refresh.log" 2>&1
          cp "$out/$base.minic-stage2.s" "$ev/spinlock_debug.s"
          riscv64-linux-gnu-objdump -dr "$out/$target" > "$ev/spinlock_debug.objdump.txt"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('build/linux-runtime-spinlock-frame-v1/spinlock_debug.objdump.txt')
          lines=p.read_text(errors='replace').splitlines()
          sym='__minic_inline_spec_720_39'
          i=next(i for i,l in enumerate(lines) if f'<{sym}>:' in l)
          j=next((k for k in range(i+1,len(lines)) if re.match(r'^\s*[0-9a-f]+ <[^>]+>:$',lines[k]) and '<.L' not in lines[k]), min(len(lines),i+120))
          body=lines[i:j]
          print('CLONE_OBJDUMP_BEGIN')
          print('\n'.join(body[:120]))
          print('CLONE_OBJDUMP_END')
          regs=sorted(set(re.findall(r'\b(s(?:[0-9]|10|11))\b','\n'.join(body))), key=lambda x:int(x[1:]))
          print('CLONE_S_REGS=' + ','.join(regs))
          print('CLONE_S_REG_COUNT=' + str(len(regs)))
          m=re.search(r'addi\s+sp,sp,-(\d+)', '\n'.join(body[:8]))
          print('CLONE_FRAME=' + (m.group(1) if m else 'unknown'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-spinlock-frame-v1-${{ github.sha }}
          path: build/linux-runtime-spinlock-frame-v1
          retention-days: 7
