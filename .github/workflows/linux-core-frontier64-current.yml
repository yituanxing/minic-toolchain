name: Linux MiniC MiniAS Historical16 Current

on:
  push:
    branches:
      - agent/linux-frontier64-v0

permissions:
  contents: read

jobs:
  historical16-minias:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install RV64 Linux prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Apply current semantic stack and build MiniC plus MiniAS
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-minic-minias-historical16"
          mkdir -p "$work/evidence"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
          )
          for patch in "${patches[@]}"; do
            python3 "tools/ci/$patch" | tee -a "$work/evidence/patch.log"
          done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" all
          test -x "$work/toolchain/bin/minic"
          test -x "$work/toolchain/bin/minic-as"
          make MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" check-minias-a0
          echo 'MINIC_MINIAS_TOOLCHAIN=PASS'

      - name: Materialize 16 historically difficult Linux TUs
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-minic-minias-historical16"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          rm -rf "$src" "$work/corpus-builder" "$work/corpus"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"

          LINUX_BATCH_MATERIALIZE_ONLY=1 \
          BUILD_DIR="$work/corpus-builder" \
          LINUX_SOURCE_TREE="$src" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_SELECTION='555,591,611,613,749,829,887,899,949,963,965,973,975,978,990,995' \
          LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh

          mkdir -p "$work/corpus/kbuild"
          cp "$work/corpus-builder/selected-tus.txt" "$work/corpus/selected-tus.txt"
          test "$(grep -cve '^[[:space:]]*$' "$work/corpus/selected-tus.txt")" -eq 16
          while IFS=$'\t' read -r index object rel_i source; do
            test -n "$rel_i" || continue
            mkdir -p "$work/corpus/kbuild/$(dirname "$rel_i")"
            cp "$work/corpus-builder/kbuild/$rel_i" "$work/corpus/kbuild/$rel_i"
          done < "$work/corpus/selected-tus.txt"
          cp "$work/corpus-builder/tu-manifest.txt" "$work/corpus/tu-manifest.txt" 2>/dev/null || true
          echo 'MINIC_MINIAS_CORPUS=PASS selected=16'

      - name: Generate current MiniC assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-minic-minias-historical16"
          compiler="$work/toolchain/bin/minic"
          replay="$work/replay"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$work/corpus" \
            --work "$replay" \
            --jobs 4 \
            --offset 0 \
            --limit 16 \
            --sample-count 0
          python3 - "$replay/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          bad=[r for r in rows if r['status'] != 'PASS']
          assert len(rows) == 16 and not bad, (len(rows), bad[:3])
          print('MINIC_MINIAS_INPUT=PASS generated=16')
          PY

      - name: Dual assemble with GNU and MiniAS
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-minic-minias-historical16"
          replay="$work/replay"
          root="$replay/minic-out"
          minias="$work/toolchain/bin/minic-as"
          out="$work/assembly"
          mkdir -p "$out/gnu" "$out/minias" "$out/errors"
          : > "$out/results.tsv"
          bad=0
          total=0
          gnu_pass=0
          minias_pass=0

          while IFS=$'\t' read -r index object preprocessed source; do
            test -n "$preprocessed" || continue
            asm="$root/$preprocessed.s"
            test -s "$asm"
            total=$((total + 1))
            gnu_obj="$out/gnu/${index}.o"
            mini_obj="$out/minias/${index}.o"
            gnu_err="$out/errors/${index}.gnu.stderr"
            mini_err="$out/errors/${index}.minias.stderr"

            gnu_status=FAIL
            mini_status=SKIP
            if riscv64-linux-gnu-gcc \
                -march=rv64imac_zicsr_zifencei_zihintpause -mabi=lp64 \
                -mcmodel=medany -mstrict-align -Wa,-mno-arch-attr \
                -x assembler -c "$asm" -o "$gnu_obj" 2>"$gnu_err"; then
              gnu_status=PASS
              gnu_pass=$((gnu_pass + 1))
              if "$minias" -o "$mini_obj" "$asm" 2>"$mini_err"; then
                readelf -h "$mini_obj" | grep -q 'RISC-V'
                readelf -h "$mini_obj" | grep -q 'REL (Relocatable file)'
                mini_status=PASS
                minias_pass=$((minias_pass + 1))
              else
                mini_status=FAIL
                bad=1
              fi
            else
              bad=1
              : > "$mini_err"
            fi

            printf '%s\t%s\t%s\t%s\t%s\n' "$index" "$gnu_status" "$mini_status" "$preprocessed" "$source" >> "$out/results.tsv"
            if test "$gnu_status" != PASS; then
              echo "MINIC_ASM_BLOCKER index=$index input=$preprocessed source=$source message=$(head -n1 "$gnu_err")"
            elif test "$mini_status" != PASS; then
              raw=$(head -n1 "$mini_err")
              echo "MINIAS_BLOCKER index=$index input=$preprocessed source=$source message=$raw"
              line=$(printf '%s\n' "$raw" | sed -nE 's/.*:line=([0-9]+)$/\1/p')
              if [[ "$line" =~ ^[0-9]+$ ]]; then
                from=$(( line > 4 ? line - 4 : 1 ))
                to=$(( line + 4 ))
                {
                  echo "MINIAS_BLOCKER_CONTEXT index=$index line=$line input=$preprocessed"
                  nl -ba "$asm" | sed -n "${from},${to}p"
                } | tee "$out/errors/${index}.context.txt"
              fi
            fi
          done < "$replay/selected-tus.txt"

          echo "MINIC_MINIAS_ASSEMBLY_SUMMARY total=$total gnu_pass=$gnu_pass minias_pass=$minias_pass failures=$((total-minias_pass))"
          cat "$out/results.tsv"
          test "$total" -eq 16
          test "$gnu_pass" -eq 16
          test "$minias_pass" -eq 16
          test "$bad" -eq 0
          echo 'MINIC_MINIAS_HISTORICAL16=PASS total=16'

      - name: Preserve MiniAS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-minic-minias-historical16-${{ github.sha }}
          path: |
            build/linux-minic-minias-historical16/evidence/**
            build/linux-minic-minias-historical16/corpus/selected-tus.txt
            build/linux-minic-minias-historical16/replay/batch-results.json
            build/linux-minic-minias-historical16/replay/selected-tus.txt
            build/linux-minic-minias-historical16/replay/minic-stderr/**
            build/linux-minic-minias-historical16/assembly/results.tsv
            build/linux-minic-minias-historical16/assembly/errors/**
          if-no-files-found: warn
          retention-days: 7
