name: Linux Full Image Current MiniC MiniAS

on:
  push:
    branches:
      - agent/linux-frontier64-v0

permissions:
  contents: read

jobs:
  full-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install RISC-V Linux prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils file python3

      - name: Apply current semantic stack and build toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-full-current"
          mkdir -p "$work/evidence"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
          )
          for patch in "${patches[@]}"; do
            python3 "tools/ci/$patch" | tee -a "$work/evidence/patch.log"
          done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" all
          make MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" check-minias-a0
          test -x "$work/toolchain/bin/minic"
          test -x "$work/toolchain/bin/minic-as"
          echo 'FULL_CURRENT_TOOLCHAIN=PASS'

      - name: Install MiniAS below GCC assembler boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-full-current"
          as_bindir="$work/as-override"
          mkdir -p "$as_bindir" "$work/failure-inputs"
          cat >"$as_bindir/riscv64-linux-gnu-as" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          minias=${MINIAS:?MINIAS is not set}
          trace=${MINIAS_AS_TRACE:?MINIAS_AS_TRACE is not set}
          real_as=${REAL_AS:-/usr/bin/riscv64-linux-gnu-as}
          args=("$@")
          minias_opts=()
          out=
          input=
          query=0
          for ((i=0; i<${#args[@]}; ++i)); do
            arg=${args[i]}
            case "$arg" in
              --version|-v|--help) query=1 ;;
              -march=*|-mabi=*) minias_opts+=("$arg") ;;
              -o)
                if (( i + 1 < ${#args[@]} )); then
                  out=${args[i+1]}
                  ((++i))
                fi
                ;;
              -*) ;;
              *) if [[ -f "$arg" ]]; then input=$arg; fi ;;
            esac
          done
          if (( query )); then
            printf 'delegate-query' >>"$trace"
            printf ' %q' "$@" >>"$trace"
            printf '\n' >>"$trace"
            exec "$real_as" "$@"
          fi
          if [[ -z "$input" || -z "$out" ]]; then
            echo "MINIAS_AS_WRAPPER_ERROR missing input/output" >&2
            exit 2
          fi
          {
            printf 'assemble input=%q output=%q argv=' "$input" "$out"
            printf ' %q' "$@"
            printf '\n'
          } >>"$trace"
          if "$minias" "${minias_opts[@]}" -o "$out" "$input" 2>>"$trace"; then
            printf 'pass input=%q output=%q\n' "$input" "$out" >>"$trace"
          else
            status=$?
            printf 'fail status=%s input=%q output=%q\n' "$status" "$input" "$out" >>"$trace"
            if [[ -n "${MINIAS_FAILURE_DIR:-}" && -f "$input" ]]; then
              mkdir -p "$MINIAS_FAILURE_DIR"
              cp "$input" "$MINIAS_FAILURE_DIR/$(basename "$out").s"
            fi
            exit "$status"
          fi
          SH
          chmod +x "$as_bindir/riscv64-linux-gnu-as"

          cat >"$work/riscv64-linux-gnu-gcc-through-minias" <<SH
          #!/usr/bin/env bash
          exec /usr/bin/riscv64-linux-gnu-gcc -B"$as_bindir/" "\$@"
          SH
          chmod +x "$work/riscv64-linux-gnu-gcc-through-minias"

      - name: Build Linux 6.6.143 Image through current MiniC and MiniAS
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-full-current"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          gcc_wrapper="$work/riscv64-linux-gnu-gcc-through-minias"
          : >"$work/minic-kbuild.trace"
          : >"$work/minias-as.trace"

          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"

          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig

          export MINIC="$work/toolchain/bin/minic"
          export REAL_CC="$gcc_wrapper"
          export MINIC_KBUILD_TRACE="$work/minic-kbuild.trace"
          export MINIC_KEEP_INTERMEDIATES=0
          export MINIC_KBUILD_GCC_VDSO=1
          export MINIC_KBUILD_GCC_PURGATORY=1
          export MINIAS="$work/toolchain/bin/minic-as"
          export MINIAS_AS_TRACE="$work/minias-as.trace"
          export MINIAS_FAILURE_DIR="$work/failure-inputs"
          export REAL_AS=/usr/bin/riscv64-linux-gnu-as

          started=$(date +%s)
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            CC="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh" \
            -j4 Image >"$work/kbuild.log" 2>&1
          status=$?
          set -e
          elapsed=$(( $(date +%s) - started ))

          minic_inputs=$(grep -c '^minic input=' "$work/minic-kbuild.trace" || true)
          minic_passes=$(grep -c '^pass source=' "$work/minic-kbuild.trace" || true)
          vdso_delegates=$(grep -c '^delegate-vdso ' "$work/minic-kbuild.trace" || true)
          purgatory_delegates=$(grep -c '^delegate-purgatory ' "$work/minic-kbuild.trace" || true)
          minias_assembled=$(grep -c '^assemble ' "$work/minias-as.trace" || true)
          minias_passed=$(grep -c '^pass ' "$work/minias-as.trace" || true)
          minias_failures=$(grep -c '^fail ' "$work/minias-as.trace" || true)

          echo "FULL_CURRENT_PROGRESS status=$status minic_inputs=$minic_inputs minic_passes=$minic_passes minias_assembled=$minias_assembled minias_passed=$minias_passed minias_failures=$minias_failures vdso_gcc=$vdso_delegates purgatory_gcc=$purgatory_delegates elapsed_s=$elapsed"
          if test "$status" -ne 0; then
            echo 'FULL_CURRENT_FIRST_KBUILD_ERRORS'
            grep -nE 'error:|minic:|minic-as:|undefined reference|Error [0-9]+' "$work/kbuild.log" | tail -n 80 || true
            echo 'FULL_CURRENT_MINIAS_FAILURE_TAIL'
            tail -n 120 "$work/minias-as.trace" || true
            exit "$status"
          fi

          image="$out/arch/riscv/boot/Image"
          test -s "$image"
          test "$minic_inputs" -ge 1000
          test "$minic_inputs" -eq "$minic_passes"
          test "$minias_passed" -gt 1000
          test "$minias_failures" -eq 0
          sha256sum "$image" >"$work/Image.sha256"
          echo "FULL_CURRENT_IMAGE=PASS minic_inputs=$minic_inputs minias_passed=$minias_passed elapsed_s=$elapsed bytes=$(stat -c %s "$image") head=$GITHUB_SHA"

      - name: Preserve full-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-full-current-${{ github.sha }}
          path: |
            build/linux-full-current/evidence/**
            build/linux-full-current/kbuild.log
            build/linux-full-current/minic-kbuild.trace
            build/linux-full-current/minias-as.trace
            build/linux-full-current/failure-inputs/*.s
            build/linux-full-current/out/.config
            build/linux-full-current/Image.sha256
          if-no-files-found: warn
          retention-days: 7
