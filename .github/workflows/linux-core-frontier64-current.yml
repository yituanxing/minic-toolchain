name: Linux Core Historical16 Current

on:
  push:
    branches:
      - agent/linux-frontier64-v0

permissions:
  contents: read

jobs:
  historical16:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install RV64 Linux prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Apply current MiniC semantic stack and build
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-historical16-current"
          mkdir -p "$work/evidence"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
          )
          for patch in "${patches[@]}"; do
            python3 "tools/ci/$patch" | tee -a "$work/evidence/patch.log"
          done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" all
          test -x "$work/toolchain/bin/minic"

      - name: Materialize historical new500 blocker TUs
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-historical16-current"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          rm -rf "$src" "$work/corpus-builder" "$work/corpus"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"

          LINUX_BATCH_MATERIALIZE_ONLY=1 \
          BUILD_DIR="$work/corpus-builder" \
          LINUX_SOURCE_TREE="$src" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_SELECTION='555,591,611,613,749,829,887,899,949,963,965,973,975,978,990,995' \
          LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh

          mkdir -p "$work/corpus/kbuild"
          cp "$work/corpus-builder/selected-tus.txt" "$work/corpus/selected-tus.txt"
          test "$(grep -cve '^[[:space:]]*$' "$work/corpus/selected-tus.txt")" -eq 16
          while IFS=$'\t' read -r index object rel_i source; do
            test -n "$rel_i" || continue
            mkdir -p "$work/corpus/kbuild/$(dirname "$rel_i")"
            cp "$work/corpus-builder/kbuild/$rel_i" "$work/corpus/kbuild/$rel_i"
          done < "$work/corpus/selected-tus.txt"
          cp "$work/corpus-builder/tu-manifest.txt" "$work/corpus/tu-manifest.txt" 2>/dev/null || true
          echo 'LINUX_HISTORICAL16_CORPUS=PASS selected=16 indices=555,591,611,613,749,829,887,899,949,963,965,973,975,978,990,995'

      - name: Replay patched MiniC over historical16
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-historical16-current"
          compiler="$work/toolchain/bin/minic"
          replay="$work/replay"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$work/corpus" \
            --work "$replay" \
            --jobs 4 \
            --offset 0 \
            --limit 16 \
            --sample-count 0
          replay_status=$?
          set -e
          echo "LINUX_HISTORICAL16_REPLAY_STATUS=$replay_status"

          python3 tools/ci/classify-core-strict-frontier.py \
            "$replay/batch-results.json" \
            --stderr-root "$replay/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 16 \
            --json-out "$replay/frontier-summary.json" \
            --reason-text-out "$replay/reason-summary.txt"

          python3 tools/ci/summarize-core-frontier-progress.py \
            "$replay/batch-results.json" \
            --expect-selected 16 \
            --json-out "$replay/progress-summary.json" \
            --text-out "$replay/progress-summary.txt"

          echo 'LINUX_HISTORICAL16_FAILURE_CONTEXTS'
          cat "$replay/failure-contexts.txt" || true
          cat "$replay/reason-summary.txt" || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/linux-historical16-current/replay/frontier-summary.json')
          s = json.loads(p.read_text())
          print(f"LINUX_HISTORICAL16_EXACT selected={s['selected']} pass={s['pass']} unsupported={s['unsupported']} error={s['error']} preprocess_missing={s['preprocess_missing']}")
          PY

      - name: Preserve historical16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-historical16-current-${{ github.sha }}
          path: |
            build/linux-historical16-current/evidence/**
            build/linux-historical16-current/corpus/selected-tus.txt
            build/linux-historical16-current/replay/batch-results.json
            build/linux-historical16-current/replay/frontier-summary.json
            build/linux-historical16-current/replay/reason-summary.txt
            build/linux-historical16-current/replay/progress-summary.json
            build/linux-historical16-current/replay/progress-summary.txt
            build/linux-historical16-current/replay/failure-contexts.txt
            build/linux-historical16-current/replay/minic-stderr/**
          if-no-files-found: warn
          retention-days: 7
