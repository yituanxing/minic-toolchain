name: Productize Zero Slot Aggregate Relocation V1
on:
  push:
    branches: [product/zero-slot-aggregate-relocation-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/zero-slot-aggregate-relocation-v1
          fetch-depth: 0
      - name: Materialize source and permanent contract
        run: |
          set -Eeuo pipefail
          git show origin/staging/string-octal-v1:tools/dev/materialize-zero-slot-aggregate-relocation-v1.py > tools/dev/.productize-zero-slot-aggregate-relocation-v1.py
          python3 tools/dev/.productize-zero-slot-aggregate-relocation-v1.py
          rm tools/dev/.productize-zero-slot-aggregate-relocation-v1.py
          cat > tests/compiler/c0/run-zero-slot-aggregate-relocation.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/zero-slot-aggregate-relocation
          mkdir -p "$work"
          cat > "$work/input.c" <<'SRC'
          struct Empty {};
          int target;
          struct Holder {
              struct Empty empty;
              int *pointer;
          };
          static struct Holder holder = { {}, &target };
          int main(void) { return holder.pointer == &target ? 0 : 1; }
          SRC
          "$minic" -S "$work/input.c" -o "$work/output.s"
          grep -Fq 'holder:' "$work/output.s"
          grep -Fq '  .dword target' "$work/output.s"
          printf '%s\n' 'PASS compiler/c0/zero-slot-aggregate-relocation'
          EOF
          chmod +x tests/compiler/c0/run-zero-slot-aggregate-relocation.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" \
          BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
          sh "$root/tests/compiler/c0/run-zero-slot-aggregate-relocation.sh"
          EOF
          clang-format-18 -i src/frontend/ast_global.c
          git diff --check
      - name: Validate focused and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/product-zero-slot
          MINIC="$GITHUB_WORKSPACE/build/product-zero-slot/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-zero-slot" sh tests/compiler/c0/run-zero-slot-aggregate-relocation.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-zero-slot
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-zero-slot-aggregate-relocation-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: skip zero-slot subaggregates in relocation slots'
          git push origin HEAD:product/zero-slot-aggregate-relocation-v1
