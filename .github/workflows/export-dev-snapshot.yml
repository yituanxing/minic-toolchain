name: Export Development Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/export-dev-snapshot.yml'

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.ref == 'agent/gnu-void-pointer-relational-v0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Archive source
        shell: bash
        run: git archive --format=tar.gz --output=/tmp/minic-source.tar.gz HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: minic-source-${{ github.sha }}
          path: /tmp/minic-source.tar.gz
          retention-days: 1
