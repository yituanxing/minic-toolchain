name: Core Fast Batch F

on:
  pull_request:

permissions:
  contents: write

jobs:
  batch-f:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-f-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply Batch F production changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-batch-f.py

      - name: Build exact patched compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-f-compiler

      - name: Focused implicit-volatile outputless asm regression
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-f-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-f-focused"
          mkdir -p "$work"

          cat >"$work/outputless-asm.i" <<'EOF'
          void flush_like(unsigned long value) {
              asm("nop # %0" : : "r" (value) : "memory");
          }
          EOF
          "$compiler" -S "$work/outputless-asm.i" -o "$work/normal.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/outputless-asm.i" -o "$work/strict.s"
          cmp "$work/normal.s" "$work/strict.s"
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 "$compiler" \
            -S "$work/outputless-asm.i" -o "$work/core.s"
          grep -q 'nop' "$work/core.s"

          echo CORE_BATCH_F_FOCUSED_PASS

      - name: Strict sixteen frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-f-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-f-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 16 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '0,1,2,3,4,7,9,20,42,66,95,155,165,280,288,299'
          probe_status=$?
          set -e
          printf 'CORE_BATCH_F_STRICT16_STATUS=%d\n' "$probe_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 16 \
            --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-f-frontier/frontier-summary.json').read_text())
          blockers = {b.get('function') for b in f.get('blockers', [])}
          print(
              'CORE_BATCH_F_RESULT '
              f"selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} "
              f"error={f['error']} distinct_blockers={len(f.get('blockers', []))}"
          )
          if f['selected'] != 16:
              raise SystemExit(f"expected 16 probes, got {f['selected']}")
          if f['error'] != 0:
              raise SystemExit(f"Batch F introduced Core lowering ERRORs: {f.get('errors', [])}")
          if 'local_flush_tlb_all_asid' in blockers:
              raise SystemExit('implicit-volatile outputless asm blocker did not clear')
          PY

      - name: Upload Batch F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-fast-batch-f-${{ github.run_id }}
          path: |
            build/core-batch-f-frontier/batch-results.json
            build/core-batch-f-frontier/batch-results.tsv
            build/core-batch-f-frontier/batch-summary.txt
            build/core-batch-f-frontier/failure-contexts.txt
            build/core-batch-f-frontier/frontier-summary.json
            build/core-batch-f-frontier/minic-stderr
          if-no-files-found: warn

      - name: Persist qualified Batch F production tree
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/core/core_lower.c
          # A/B were one-shot development gates. Remove them only after this
          # replacement fast gate proves green, so future commits stop wasting
          # runner capacity on already-landed batches.
          git rm -f .github/workflows/core-fast-batch-a.yml .github/workflows/core-fast-batch-b.yml
          if git diff --cached --quiet; then
            echo CORE_BATCH_F_ALREADY_PERSISTED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'core: honor implicit volatility of outputless asm'
          git push origin HEAD:refactor/declaration-sema-v1
