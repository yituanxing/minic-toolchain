name: Core Fast Batch G

on:
  pull_request:

permissions:
  contents: write

jobs:
  batch-g:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    concurrency:
      group: core-fast-batch-g-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply Batch G production changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-linux-replay-live-progress.py
          python3 tools/dev/patch-core-frontier-batch-g.py

      - name: Build exact patched compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-batch-g-compiler

      - name: Focused two-input outputless asm regression
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-g-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-g-focused"
          mkdir -p "$work"
          cat >"$work/two-input-asm.i" <<'EOF'
          void flush_page(unsigned long addr, unsigned long asid) {
              asm("sfence.vma %0, %1" : : "r" (addr), "r" (asid) : "memory");
          }
          EOF
          "$compiler" -S "$work/two-input-asm.i" -o "$work/normal.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/two-input-asm.i" -o "$work/strict.s"
          cmp "$work/normal.s" "$work/strict.s"
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 "$compiler" \
            -S "$work/two-input-asm.i" -o "$work/core.s"
          grep -q 'sfence.vma' "$work/core.s"
          echo CORE_BATCH_G_FOCUSED_PASS

      - name: Strict sixteen frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-batch-g-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-batch-g-frontier"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 16 \
            --offset 0 \
            --limit 500 \
            --sample-count 0 \
            --indices '0,1,2,3,4,7,9,20,42,66,95,155,165,280,288,299'
          probe_status=$?
          set -e
          printf 'CORE_BATCH_G_STRICT16_STATUS=%d\n' "$probe_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --examples 16 --json-out "$work/frontier-summary.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path('build/core-batch-g-frontier/frontier-summary.json').read_text())
          blockers = {b.get('function') for b in f.get('blockers', [])}
          print(f"CORE_BATCH_G_RESULT selected={f['selected']} pass={f['pass']} unsupported={f['unsupported']} error={f['error']} distinct_blockers={len(f.get('blockers', []))}")
          if f['selected'] != 16:
              raise SystemExit(f"expected 16 probes, got {f['selected']}")
          if f['error'] != 0:
              raise SystemExit(f"Batch G introduced Core lowering ERRORs: {f.get('errors', [])}")
          if 'local_flush_tlb_page_asid' in blockers:
              raise SystemExit('two-input outputless asm blocker did not clear')
          PY

      - name: Persist qualified Batch G production tree
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/core/core_lower.c src/target/riscv64/core_codegen.c
          if git diff --cached --quiet; then
            echo CORE_BATCH_G_ALREADY_PERSISTED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'core: lower two-input outputless inline asm'
          git push origin HEAD:refactor/declaration-sema-v1
