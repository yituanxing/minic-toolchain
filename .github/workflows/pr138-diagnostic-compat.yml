name: PR138 Product Finalization

on:
  push:
    branches:
      - agent/static-aggregate-init-family-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize final product fixes
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr138-diagnostic-compat.py
          python3 tools/dev/pr138-typed-bits-emission.py
      - name: Build release compiler
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 BUILD_DIR=build/final-release CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Wmissing-prototypes -Werror -O2 -DNDEBUG'
      - name: Recheck affected semantic contracts
        run: |
          set -Eeuo pipefail
          export MINIC="$GITHUB_WORKSPACE/build/final-release/bin/minic"
          export HOST_CC=cc
          export BUILD_DIR="$GITHUB_WORKSPACE/build/final-focused"
          sh tests/compiler/c0/run-static-object-address-relocation.sh
          sh tests/compiler/c0/run-external-scalar-definitions.sh
          sh tests/compiler/c0/run-short-integers.sh
          sh tests/compiler/c0/run-unsigned-char-layout.sh
          "$MINIC" -S tests/programs/c0/static_record_compound_literal.c -o build/pr138-aggregate-inspect.s
          cat build/pr138-aggregate-inspect.s
          sh -x tests/compiler/c0/run-static-aggregate-initializers.sh
          sh tests/compiler/c0/run-static-pointer-arrays.sh
          sh tests/compiler/c0/run-pointer-array-typed-null.sh
          sh tests/compiler/c0/run-static-zero-definitions.sh
          sh tests/compiler/c0/run-record-copy-array-members.sh
      - name: Run complete host checks
        run: |
          set -Eeuo pipefail
          make -j4 check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr138-diagnostic-compat.py
          rm -f tools/dev/pr138-typed-bits-emission.py
          rm -f .github/workflows/pr138-diagnostic-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(frontend): preserve scalar initializer semantics'
          git push origin HEAD:agent/static-aggregate-init-family-v1
