name: MiniAS Immutable Linux 3x7 GNU Kbuild S Replay

# Frozen original Linux 6.6.143 inputs. Discovery, NOT P1/parity.
# Grouped original Linux re-evaluation after Common GNU parenthesized
# expressions and macro calls, x86 real CFI, A64 comparison/MVN, and the
# sized shared A64 operand splitter. No synthetic .incbin inputs in this
# pinned v1 corpus; genuine generated blobs are produced separately.
# LoongArch focused exact-head seven shards after GNU IOCSR/TLB/CFI/conditional batch.
# One grouped LoongArch exact-head replay after LSX/LASX vector, FCSR, INVTLB, LI.W and dual-relocation LA.PCREL.
# Final same-config LoongArch seven-shard census after verified LSX logic/FPR and variable-length GNU LI.W/LI.D ISA families.
# Same frozen GNU Linux 6.6.143 LoongArch seven-shard grouped ISA frontier after LASX logical, LSX shifts/compare and FCC2GR GNU exact-byte oracle.
# Subsequent grouped VSHUF/XVSHUF, LASX vector masks and MOVGR2CF family exact GNU byte oracle pass: reevaluate only Loong seven cached shards.
# Discovery is assembly generation only, not GNU ELF object parity nor Linux P1.
# Re-measure AArch64 target post-LSE + cross-section PREL32 + PRFM/.inst
# against all 4140 frozen original GNU Kbuild .s, seven shards one head.
# AArch64 only: 7 frozen shards after real LSE extension gating/atomics.
# Do not infer GNU parity or P1 from successful discovery jobs.
# Grouped exact-head Oct27 scan after A64 bitmask/REV/LDAR and x86 BT/XADD,
# GNU C block comment lexer and x86 implicit shifts; frozen sources unchanged.
# Oct 27 batch acceptance: Common .fill, LoongArch timer/prefetch/branch
# aliases, AArch64 BRK/SUBS/ADDS/MOVN and x86 prefixes/indirect transfers.
# Record all 21 frozen GNU .s shards on this exact commit; a discovery
# SUCCESS is NOT an ELF parity or Linux P1 SUCCESS.
# Full cross-target frozen input replay after Common symbol-local delta and GNU alignment batch; only original corpus is reused.
# Grouped final scan after Common data/fixup/align + AArch CSET/CMN + x86 FS/GS RIP.
# Exact-head opt-in after Common GNU fill/maxskip, arithmetic .skip, and AArch64 MRS/CMN batches.
# Opt-in GNU original AArch64 seven-shard contract after the Target HINT
# 0..127 encoding batch. This does NOT re-run upstream GCC or claim ELF parity.
on:
  workflow_dispatch:
  push:
    branches: [refactor/minias-target-isa-abi-core]
    paths:
      - 'assembler/**'
      - 'elf/**'
      - 'tests/assembler/**'
      - 'Makefile'
      - '.github/workflows/minias-linux-pinned-3x7-replay.yml'
      - 'tools/ci/minias-linux-kbuild-seven-v1.py'
      - 'assembler/src/cfi.c'
      - 'assembler/src/debug_line.c'
      - 'assembler/src/aarch64_target.c'
      - 'assembler/src/x86_64_target.c'
      - 'assembler/src/assembler.c'
      - 'tests/assembler/probe-aarch64-elf64.sh'

permissions:
  contents: read
  actions: read

jobs:
  shard:
    # Opt-in large grouped corpus only. Target fixes normally run unit GNU
    # parity; explicit batch marker or workflow_dispatch scans all 21 shards.
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[minias-replay-3x7]') || contains(github.event.head_commit.message, '[minias-replay-aarch-7]') || contains(github.event.head_commit.message, '[minias-replay-loong-7]') || contains(github.event.head_commit.message, '[minias-replay-x86-7]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(contains(github.event.head_commit.message, '[minias-replay-aarch-7]') && '["aarch64"]' || contains(github.event.head_commit.message, '[minias-replay-loong-7]') && '["loongarch64"]' || contains(github.event.head_commit.message, '[minias-replay-x86-7]') && '["x86_64"]' || '["x86_64","aarch64","loongarch64"]') }}
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: '40461070882'
          github-token: ${{ github.token }}
          name: minias-linux-kbuild-${{ matrix.target }}-shard${{ matrix.shard }}
          path: build/minias-frozen
      - name: Prove original GNU Kbuild target and per-shard S/CMD hashes
        run: |
          python3 - '${{ matrix.target }}' '${{ matrix.shard }}' <<'PY_PIN'
          import importlib.util, pathlib, sys
          target, n = sys.argv[1], int(sys.argv[2])
          hashes = {
              "x86_64": "9065a6925d9e5081336894e42f7544f9d671efcb5d70eb499a24884988d00ac1",
              "aarch64": "e2d034013185b214763c9fa42aef3f3eb4e9d96e276f8678717c1f9d675969cf",
              "loongarch64": "203ed9df2cb4408cd8d0ee48b5de9f2a6444d115e8cdca649cf70995d6fc7017",
          }
          spec = importlib.util.spec_from_file_location(
              "kbuild_s", "tools/ci/minias-linux-kbuild-seven-v1.py")
          tool = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tool)
          path = pathlib.Path(f"build/minias-frozen/shard-{n}.tar.gz")
          manifest, digest, selected = tool.checked_shard(path, target, n)
          assert digest == hashes[target], (target, n, digest)
          assert manifest["full_kbuild"] and manifest["build_exit"] == 0
          assert len(selected) > 0
          print(f"MINIAS_GNU_SOURCE_PIN=PASS target={target} shard={n} "
                f"files={len(selected)} manifest={digest} GCC_rebuilt=NO")
          PY_PIN
      - name: Build MiniAS only on this exact source HEAD
        run: make -j2 MODE=release CFLAGS=-Werror build/release/bin/minic-as
      - name: Scan all frozen input and record each first blocker
        run: |
          python3 tools/ci/minias-linux-kbuild-seven-v1.py scan \
            --target '${{ matrix.target }}' --shard '${{ matrix.shard }}' \
            --archive 'build/minias-frozen/shard-${{ matrix.shard }}.tar.gz' \
            --minias "$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            --dest 'build/minias-linux-replay/${{ matrix.target }}-${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        with:
          name: minias-linux-replay-${{ matrix.target }}-${{ matrix.shard }}
          path: build/minias-linux-replay/${{ matrix.target }}-${{ matrix.shard }}/results.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minias-linux-replay-*
          path: build/minias-linux-replay-collected
      - name: Require all selected 7-way shards, with disjoint architecture pools
        run: |
          python3 tools/ci/minias-linux-kbuild-seven-v1.py aggregate \
            --strict \
            --targets "${{ contains(github.event.head_commit.message, '[minias-replay-aarch-7]') && 'aarch64' || contains(github.event.head_commit.message, '[minias-replay-loong-7]') && 'loongarch64' || contains(github.event.head_commit.message, '[minias-replay-x86-7]') && 'x86_64' || 'x86_64,aarch64,loongarch64' }}" \
            --results build/minias-linux-replay-collected \
            --dest build/minias-linux-replay-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minias-linux-replay-three-target-summary
          path: build/minias-linux-replay-summary.json
          if-no-files-found: error
          retention-days: 14
