name: Productize function-typed variadic redeclaration v1

on:
  push:
    branches:
      - frontend/declaration-head-variadic-function-type-v1
    paths:
      - tools/dev/fix-function-typed-variadic-redecl-v1.py
      - .github/workflows/productize-function-typed-variadic-redecl-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: frontend/declaration-head-variadic-function-type-v1

      - name: Materialize product
        run: |
          python3 tools/dev/fix-function-typed-variadic-redecl-v1.py
          clang-format -i src/frontend/parser_function.c tests/compiler/c0/declaration_head_variadic.c

      - name: Build and focused gate
        run: |
          make -j4 CFLAGS=-Werror
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/debug" \
            sh tests/compiler/c0/run-declaration-head-variadic.sh
          git diff --check

      - name: Commit product
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_function.c tests/compiler/c0/declaration_head_variadic.c
          if git diff --cached --quiet; then
            echo 'function-typed variadic redeclaration product already materialized'
            exit 0
          fi
          git commit -m 'frontend: preserve variadicness through typeof redeclarations'
          git push origin HEAD:frontend/declaration-head-variadic-function-type-v1
