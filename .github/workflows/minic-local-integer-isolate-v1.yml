name: MiniC Local Integer Isolate V1

on:
  push:
    branches:
      - agent/linux-local-integer-isolate-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install RV64 tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3
      - name: Isolate local integer regression
        run: bash tools/ci/run-local-integer-isolate-v1.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-local-integer-isolate-v1
          path: build/local-integer-isolate-v1/
          if-no-files-found: ignore
          retention-days: 3
