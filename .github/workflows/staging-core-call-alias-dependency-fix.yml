name: Staging Core CALL Alias Dependency Fix

on:
  push:
    branches:
      - staging/core-rv64-call-v0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove unnecessary helper dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/core_lower.c')
          text = path.read_text()
          old = '''    callee_name = minic_c0_function_symbol_name(callee);\n    callee_name_length =\n        callee->assembler_name != NULL ? callee->assembler_name_length : callee->name_length;\n'''
          new = '''    callee_name = callee->assembler_name != NULL ? callee->assembler_name : callee->name;\n    callee_name_length =\n        callee->assembler_name != NULL ? callee->assembler_name_length : callee->name_length;\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check -- src/core/core_lower.c

      - name: Commit source-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/core_lower.c
          git diff --cached --quiet && exit 0
          git commit -m 'core: keep direct callee symbol metadata local'
          git push origin HEAD:staging/core-rv64-call-v0
