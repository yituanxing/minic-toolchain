name: MiniC Refactor Four/Five-ISA Paired Performance (A/B)

on:
  push:
    branches:
      - refactor/minic-target-language-boundary
    paths:
      - '.github/workflows/minic-refactor-paired-perf.yml'
      - 'tools/ci/minic-refactor-paired-perf-trigger.txt'
  pull_request:
    paths:
      - '.github/workflows/minic-refactor-paired-perf.yml'
      - 'src/target/**'
      - 'src/core/**'
      - 'src/compiler/**'
      - 'src/frontend/**'
      - 'tools/minic/**'
      - 'tools/minic-cc/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push and its PR synchronize event can share the same SHA. Their jobs
  # must not cancel each other: the PR gate is skipped without [minic-full],
  # but it used to cancel the real push A/B job after only a few seconds.
  group: minic-four-backend-refactor-perf-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  paired-ab:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.title, '[minic-full]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Retrieve fixed early-refactor and recent pre-optimization baselines
        shell: bash
        env:
          BASE_SHA: c638ba10a55533c6332d204fc6eb6c086ed7b67d
          RECENT_SHA: 5e4c65b9c37af5b9f1a2841abaeb87bf36501193
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/minic-refactor-perf"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/minic-refactor-perf/baseline" "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$RECENT_SHA"
          git worktree add --detach "$RUNNER_TEMP/minic-refactor-perf/recent" "$RECENT_SHA"
          test "$(git -C "$RUNNER_TEMP/minic-refactor-perf/baseline" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/minic-refactor-perf/recent" rev-parse HEAD)" = "$RECENT_SHA"
          candidate=$(git rev-parse HEAD)
          test "$candidate" = "${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'MINIC_PERF_AB_EARLY_REFACTOR=%s\nMINIC_PERF_AB_RECENT_PRE_OPT=%s\nMINIC_PERF_AB_CANDIDATE=%s\n' "$BASE_SHA" "$RECENT_SHA" "$candidate"
      - name: Build three MiniC binaries in separate source trees
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C "$RUNNER_TEMP/minic-refactor-perf/baseline" \
            -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/perf-ab all
          make -C "$RUNNER_TEMP/minic-refactor-perf/recent" \
            -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/perf-ab all
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/perf-ab all
          test -x "$RUNNER_TEMP/minic-refactor-perf/baseline/build/perf-ab/bin/minic-cc"
          test -x "$RUNNER_TEMP/minic-refactor-perf/recent/build/perf-ab/bin/minic-cc"
          test -x "$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc"
      - name: Freeze original upstream AES C fixture into one preprocessed source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/minic-refactor-perf/inputs"
          cc -E -P -nostdinc -x c \
            -I"$GITHUB_WORKSPACE/tests/external/tiny-aes-c/include" \
            -I"$GITHUB_WORKSPACE/tests/vendor/tiny-aes-c/upstream" \
            -DECB=1 -DCBC=0 -DCTR=0 -DMULTIPLY_AS_A_FUNCTION=1 \
            "$GITHUB_WORKSPACE/tests/external/tiny-aes-c/aes128_ecb_vectors.c" \
            -o "$RUNNER_TEMP/minic-refactor-perf/inputs/original-aes128-ecb.i"
          test -s "$RUNNER_TEMP/minic-refactor-perf/inputs/original-aes128-ecb.i"
          sha256sum "$RUNNER_TEMP/minic-refactor-perf/inputs/original-aes128-ecb.i"
      - name: Freeze original upstream cJSON C using the existing verified oracle preprocessor
        shell: bash
        env:
          MINIC_CJSON_PREPROCESS_ONLY: '1'
          RISCV_CC: cc
          QEMU_RISCV64: env
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$RUNNER_TEMP/minic-refactor-perf" sh tests/external/cjson/probe.sh
          cp "$RUNNER_TEMP/minic-refactor-perf/tests/external/cjson/cJSON.i" \
            "$RUNNER_TEMP/minic-refactor-perf/inputs/original-cjson-1.7.19.i"
          test -s "$RUNNER_TEMP/minic-refactor-perf/inputs/original-cjson-1.7.19.i"
          sha256sum "$RUNNER_TEMP/minic-refactor-perf/inputs/original-cjson-1.7.19.i"
      - name: Four-ISA early-refactor and five-ISA recent-source paired A/B
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/compiler/perf/minic-four-backend-refactor-ab.py \
            --baseline "$RUNNER_TEMP/minic-refactor-perf/baseline/build/perf-ab/bin/minic-cc" \
            --candidate "$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc" \
            --source "$RUNNER_TEMP/minic-refactor-perf/inputs/original-aes128-ecb.i" \
            --output "$RUNNER_TEMP/minic-refactor-perf/result/aes" \
            --repeats 4 \
            --label tinyAES-128-ECB
          python3 tests/compiler/perf/minic-four-backend-refactor-ab.py \
            --baseline "$RUNNER_TEMP/minic-refactor-perf/baseline/build/perf-ab/bin/minic-cc" \
            --candidate "$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc" \
            --source "$RUNNER_TEMP/minic-refactor-perf/inputs/original-cjson-1.7.19.i" \
            --output "$RUNNER_TEMP/minic-refactor-perf/result/cjson" \
            --repeats 4 \
            --label cJSON-1.7.19 \
            --compile-only
          python3 tests/compiler/perf/minic-four-backend-refactor-ab.py \
            --baseline "$RUNNER_TEMP/minic-refactor-perf/recent/build/perf-ab/bin/minic-cc" \
            --candidate "$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc" \
            --source "$RUNNER_TEMP/minic-refactor-perf/inputs/original-aes128-ecb.i" \
            --output "$RUNNER_TEMP/minic-refactor-perf/result/recent-aes" \
            --repeats 4 \
            --five-isa \
            --label tinyAES-128-ECB
          python3 tests/compiler/perf/minic-four-backend-refactor-ab.py \
            --baseline "$RUNNER_TEMP/minic-refactor-perf/recent/build/perf-ab/bin/minic-cc" \
            --candidate "$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc" \
            --source "$RUNNER_TEMP/minic-refactor-perf/inputs/original-cjson-1.7.19.i" \
            --output "$RUNNER_TEMP/minic-refactor-perf/result/recent-cjson" \
            --repeats 4 \
            --five-isa \
            --label cJSON-1.7.19 \
            --compile-only
          cat "$RUNNER_TEMP/minic-refactor-perf/result/aes/summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/minic-refactor-perf/result/cjson/summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/minic-refactor-perf/result/recent-aes/summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/minic-refactor-perf/result/recent-cjson/summary.md" >> "$GITHUB_STEP_SUMMARY"
      # Diagnostic only: compare the current compiler with itself, since
      # historical refactor builds legitimately emit different assembly.
      # This reuses the existing phase tracer and never turns its timing into
      # a claimed old/new compiler speedup.
      - name: Inspect current compiler phase costs on frozen upstream inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-perf-phase-trace-v1.py --self-test
          compiler="$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc"
          for fixture in original-cjson-1.7.19 original-aes128-ecb; do
            python3 tools/ci/linux-perf-phase-trace-v1.py \
              --input "$RUNNER_TEMP/minic-refactor-perf/inputs/$fixture.i" \
              --baseline "$compiler" --candidate "$compiler" \
              --out "$RUNNER_TEMP/minic-refactor-perf/result/phase-$fixture" \
              | tee "$RUNNER_TEMP/minic-refactor-perf/result/phase-$fixture.log"
          done
      # Host compiler only. The -g sibling keeps MODE=release -O2 and must
      # produce byte-identical target assembly before hotspot data is accepted.
      # Callgrind simulated instruction counts are diagnostic, never A/B time.
      - name: Profile current MiniC host compiler on fixed original upstream C
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          make -j4 MODE=release CFLAGS='-g -Werror' BUILD_DIR=build/perf-profile all
          release="$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc"
          debug="$GITHUB_WORKSPACE/build/perf-profile/bin/minic-cc"
          test -x "$release"
          test -x "$debug"
          for fixture in original-cjson-1.7.19 original-aes128-ecb; do
            python3 tools/ci/linux-perf-host-hotspot-profiler-v1.py \
              --input "$RUNNER_TEMP/minic-refactor-perf/inputs/$fixture.i" \
              --debug-compiler "$debug" --release-compiler "$release" \
              --out "$RUNNER_TEMP/minic-refactor-perf/result/hotspot-$fixture" \
              --timeout 600 \
              | tee "$RUNNER_TEMP/minic-refactor-perf/result/hotspot-$fixture.log"
          done
      # Only re-use authentic historical GNU Kbuild inputs. Never regenerate
      # an unverified kernel in this lightweight diagnostic workflow.
      - name: Restore SHA-frozen Linux first500 corpus for host profile
        id: linux-corpus-restore
        uses: actions/cache/restore@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true
      - name: Verify frozen GNU Linux input and profile host compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          corpus="$GITHUB_WORKSPACE/build/linux-perf-corpus"
          test -s "$corpus/selected-tus.txt"
          test "$(grep -cve '^[[:space:]]*        if: always()
        with:
          name: minic-four-backend-refactor-paired-ab
          path: |
            ${{ runner.temp }}/minic-refactor-perf/result/aes/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/aes/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/cjson/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/cjson/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/recent-aes/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/recent-aes/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/recent-cjson/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/recent-cjson/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/phase-*/phases.json
            ${{ runner.temp }}/minic-refactor-perf/result/phase-*.log
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/summary.json
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/callgrind-self.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/callgrind-inclusive.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/perf-top.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*.log
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-linux-fsync/summary.json
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-linux-fsync/callgrind-self.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-linux-fsync/callgrind-inclusive.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-linux-fsync/perf-top.txt
          if-no-files-found: warn
 "$corpus/selected-tus.txt")" -eq 500
          test "$(wc -l < "$corpus/inputs.sha256")" -eq 500
          sha256sum --status --check "$corpus/inputs.sha256"
          echo 'MINIC_LINUX_CORPUS=VERIFIED owners=500 sha256=500'
          python3 - "$corpus" "$RUNNER_TEMP/minic-refactor-perf/inputs" <<'PY'
          from pathlib import Path
          import sys
          corpus, dest = (Path(s).resolve() for s in sys.argv[1:])
          kbuild = (corpus / "kbuild").resolve()
          entries = {}
          for line in (corpus / "selected-tus.txt").read_text().splitlines():
              columns = line.split("\t", 3)
              if len(columns) != 4 or columns[1] in entries:
                  raise SystemExit("invalid or duplicate selected-tu row")
              entries[columns[1]] = columns[2]
          if len(entries) != 500 or "fs/ext4/fsync.o" not in entries:
              raise SystemExit("missing authentic fs/ext4/fsync.o in first500")
          source = (kbuild / entries["fs/ext4/fsync.o"]).resolve()
          if not source.is_relative_to(kbuild) or not source.is_file():
              raise SystemExit("invalid fsync frozen Kbuild path")
          import shutil
          output = dest / "frozen-linux-fsync.i"
          shutil.copyfile(source, output)
          print("MINIC_LINUX_FSYNC=VERIFIED input_bytes=" + str(output.stat().st_size))
          PY
          sha256sum "$RUNNER_TEMP/minic-refactor-perf/inputs/frozen-linux-fsync.i"
          python3 tools/ci/linux-perf-host-hotspot-profiler-v1.py \
            --input "$RUNNER_TEMP/minic-refactor-perf/inputs/frozen-linux-fsync.i" \
            --debug-compiler "$GITHUB_WORKSPACE/build/perf-profile/bin/minic-cc" \
            --release-compiler "$GITHUB_WORKSPACE/build/perf-ab/bin/minic-cc" \
            --out "$RUNNER_TEMP/minic-refactor-perf/result/hotspot-linux-fsync" \
            --timeout 720 \
            | tee "$RUNNER_TEMP/minic-refactor-perf/result/hotspot-linux-fsync.log"
          python3 - "$RUNNER_TEMP/minic-refactor-perf/result/hotspot-linux-fsync" <<'PY'
          from pathlib import Path
          import json,sys
          base=Path(sys.argv[1])
          summary=json.loads((base / "summary.json").read_text())
          assert summary["assembly_equal"]
          assert summary["debug_cc_sha256"] != summary["release_cc_sha256"]
          if summary["method"] == "callgrind-instructions-calls":
              report=(base / "callgrind-inclusive.txt").read_text(errors="replace")
              assert "src/compiler/compiler.c" in report or "minic_compile_preprocessed_file" in report
          print("MINIC_LINUX_HOST_HOTSPOT=PASS owner=fs/ext4/fsync.o real_minic_cc=true")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minic-four-backend-refactor-paired-ab
          path: |
            ${{ runner.temp }}/minic-refactor-perf/result/aes/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/aes/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/cjson/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/cjson/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/recent-aes/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/recent-aes/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/recent-cjson/summary.md
            ${{ runner.temp }}/minic-refactor-perf/result/recent-cjson/results.json
            ${{ runner.temp }}/minic-refactor-perf/result/phase-*/phases.json
            ${{ runner.temp }}/minic-refactor-perf/result/phase-*.log
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/summary.json
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/callgrind-self.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/callgrind-inclusive.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*/perf-top.txt
            ${{ runner.temp }}/minic-refactor-perf/result/hotspot-*.log
          if-no-files-found: warn
