name: Builtin Alloca V0

on:
  push:
    branches:
      - compiler/builtin-alloca-v0

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install RV64 runtime tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
      - name: Build Mini toolchain with warnings fatal
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/builtin-alloca-toolchain
      - name: Run strict Core builtin alloca differential
        run: |
          MINIC="$GITHUB_WORKSPACE/build/builtin-alloca-toolchain/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/builtin-alloca-focused" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-builtin-alloca.sh
