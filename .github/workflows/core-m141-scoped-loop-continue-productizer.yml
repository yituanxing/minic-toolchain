name: Core M141 Scoped Loop Continue Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M141
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M141_SCOPED_LOOP_CONTINUE_TAIL_OWNER' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M137 target owner plus scoped M141 tail owner
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'M134_UNREACHABLE_TAIL_OWNER' src/core/core_lower.c
          ! grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c
          python3 tools/ci/apply-m137-detached-loop-continue-owner.py
          python3 tools/ci/apply-m141-scoped-loop-continue-tail.py
          git diff --check
          grep -Fq 'M137_DETACHED_LOOP_CONTINUE_OWNER' src/core/core_lower.c
          grep -Fq 'M141_SCOPED_LOOP_CONTINUE_TAIL_OWNER' src/core/core_lower.c
          ! grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c
          test -s tests/compiler/c0/m137_detached_loop_continue.c
          test -s tests/compiler/c0/m141_scoped_loop_continue_tail.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m141-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m141-product-check

      - name: Run isolated M137 plus M141 strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m141-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m141-product-regression"
          mkdir -p "$work"

          cc -E -P -std=gnu11 -x c tests/compiler/c0/m137_detached_loop_continue.c -o "$work/m137.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/m137.i" -o "$work/m137.s"
          grep -F 'nested_while_continue:' "$work/m137.s" >/dev/null
          grep -F 'double_nested_continue:' "$work/m137.s" >/dev/null

          cc -E -P -std=gnu11 -x c tests/compiler/c0/m141_scoped_loop_continue_tail.c -o "$work/m141.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/m141.i" -o "$work/m141.s"
          grep -F 'for_unbounded_continue:' "$work/m141.s" >/dev/null
          grep -F 'for_update_continue:' "$work/m141.s" >/dev/null
          grep -F 'nested_for_continue:' "$work/m141.s" >/dev/null
          grep -F 'ordinary_for_unchanged:' "$work/m141.s" >/dev/null
          printf '%s\n' 'CORE_M141_STRICT_REGRESSION m137-target=PASS scoped-tail=PASS ordinary-for=PASS'

      - name: Replay M141 focused pair
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m141-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m141-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 2 \
            --indices '95,98'
          replay_status=$?
          set -e
          printf 'CORE_M141_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 10 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m141-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 2 or summary['pass'] != 2 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M141 focused pair not fully clear: {summary}')
          by_index={int(row['index']):row for row in rows}
          for index in (95,98):
              row=by_index[index]
              print(f"CORE_M141_INDEX_{index} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
              if row['status'] != 'PASS':
                  raise SystemExit(f'M141 expected PASS at index {index}: {row}')
          print('CORE_M141_PRODUCT_FOCUSED selected=2 pass=2 unsupported=0 error=0')
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m141-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m141-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M141_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m141-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M141 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 487:
              raise SystemExit(f"M141 produced no strict500 gain: pass={summary['pass']} baseline=487")
          print(f"CORE_M141_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M137 plus M141 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
            tests/compiler/c0/m137_detached_loop_continue.c \
            tests/compiler/c0/m141_scoped_loop_continue_tail.c
          git diff --cached --quiet && { echo 'no M141 semantic changes'; exit 1; }
          git commit -m 'core: scope synthetic continue targets to loop owner'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M141 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m141-scoped-loop-continue-${{ github.sha }}
          path: |
            build/m141-product-regression/**
            build/m141-product-focused/**
            build/m141-product-full500/**
          if-no-files-found: warn
