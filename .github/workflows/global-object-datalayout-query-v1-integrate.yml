name: Gate and Integrate Global Object DataLayout Query v1

on:
  push:
    branches: [refactor/global-object-datalayout-query-v1]

permissions:
  actions: read
  contents: write

concurrency:
  group: global-object-datalayout-query-v1-integrate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: refactor/global-object-datalayout-query-v1
      FOUNDATION_BRANCH: refactor/foundation-v1
      EXPECTED_FOUNDATION_HEAD: c1b8f1498f28fcf54682ca7c454c9f80662f0477
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for same-head full and Linux pressure gate
        id: pressure
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow global-object-datalayout-query-v1-pressure.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if test -n "$run_id"; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 180); do
            state=$(gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '.status + ":" + (.conclusion // "")')
            echo "pressure_run=$run_id state=$state"
            case "$state" in
              completed:success)
                log=$(mktemp)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > "$log"
                grep -F 'GLOBAL_OBJECT_DATALAYOUT_HYBRID=1' "$log" >/dev/null
                grep -F 'cached_tu_status=0' "$log" >/dev/null
                grep -F 'FULL_TU_PASS lines=90928' "$log" >/dev/null
                exit 0
                ;;
              completed:*)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'global-object DataLayout pressure gate did not complete within polling budget' >&2
          exit 1

      - name: Materialize and validate canonical global-object DataLayout slice
        shell: bash
        env:
          PRESSURE_RUN_ID: ${{ steps.pressure.outputs.run_id }}
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin "$FEATURE_BRANCH" "$FOUNDATION_BRANCH"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$FOUNDATION_BRANCH")" = "$EXPECTED_FOUNDATION_HEAD"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"

          python3 tools/dev/run-materialize-global-object-datalayout-query-v1.py
          python3 tools/dev/materialize-global-object-datalayout-cache-removal.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

          grep -F 'bool minic_data_layout_global_object' src/target/data_layout.c >/dev/null
          grep -F 'minic_data_layout_global_object' src/target/riscv64/codegen_function.c >/dev/null
          grep -F 'minic_data_layout_global_object' src/target/riscv64/layout.c >/dev/null
          if grep -R -n --include='*.c' --include='*.h' 'object->storage_size\|object->alignment' src; then
            echo 'global-object derived layout cache reference remains' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/frontend/ast.h').read_text()
          start = text.index('typedef struct MinicGlobalObject {')
          end = text.index('} MinicGlobalObject;', start)
          block = text[start:end]
          if 'size_t storage_size;' in block or 'size_t alignment;' in block:
              raise SystemExit('derived global-object layout fields remain in semantic AST')
          if 'size_t explicit_alignment;' not in block:
              raise SystemExit('semantic explicit alignment input was lost')
          PY

          mkdir -p docs/architecture
          cat > docs/architecture/global-object-datalayout-query-v1.md <<'DOC'
          # Global-object DataLayout query ownership v1

          This slice completes the object-layout ownership cleanup by making
          `MinicDataLayout` the single source of derived global-object size and alignment.
          Semantic `MinicGlobalObject` nodes retain object-definition inputs and policy:
          type, explicit alignment, linkage/storage flags, section/visibility metadata,
          initializer payload, relocations, and tentative/extern state. They no longer
          cache the target-derived `storage_size` and `alignment` answers.

          The new `minic_data_layout_global_object()` query owns the object-level policy
          that cannot be expressed by a bare type-layout query alone. It preserves the
          established handling for extern void objects, extern incomplete records,
          extern incomplete arrays, and object-level explicit alignment, and otherwise
          delegates size/alignment to the canonical type DataLayout.

          RV64 global emission now queries this object layout wherever it needs the
          object's extent or alignment. `minic_riscv64_layout_globals()` is consequently
          validation-only: it verifies that every global object has a valid DataLayout
          answer but writes no derived target facts into the semantic AST.

          Initializer and relocation ownership is intentionally unchanged. Their payload
          describes object contents and language/linkage semantics; moving size/alignment
          does not imply an InitPlan design. That remains a separate frontend ownership
          decision to be made after another global reread.

          The Linux pressure harness retained discovery-only zero-sized-record emission.
          Its helper now asks the same global-object DataLayout query whether the object
          size is zero instead of reading a removed AST cache. This adapter is staging
          only; the formal product slice remains independent of Linux-specific semantics.

          Together with FunctionLayout and record DataLayout ownership, this sharpens the
          deferred Core IR seam: semantic nodes carry language/object inputs, while all
          concrete target layout answers are queried from target-owned services.

          The candidate passed the official full compiler gate and frozen Linux 6.6.143
          hybrid pressure run `@PRESSURE_RUN_ID@`, which completed with
          `GLOBAL_OBJECT_DATALAYOUT_HYBRID=1`, `cached_tu_status=0`, and
          `FULL_TU_PASS lines=90928`.
          DOC
          sed -i "s/@PRESSURE_RUN_ID@/$PRESSURE_RUN_ID/" \
            docs/architecture/global-object-datalayout-query-v1.md

          rm -f \
            tools/dev/materialize-global-object-datalayout-query-v1.py \
            tools/dev/run-materialize-global-object-datalayout-query-v1.py \
            tools/dev/materialize-global-object-datalayout-cache-removal.py \
            tools/dev/materialize-global-object-datalayout-hybrid.py \
            tools/dev/run-global-object-datalayout-linux-pressure.sh \
            .github/workflows/global-object-datalayout-query-v1-validation.yml \
            .github/workflows/global-object-datalayout-query-v1-pressure.yml \
            .github/workflows/global-object-datalayout-query-v1-integrate.yml

          git diff --check
          sh tools/maintenance/check-production-source-inventory.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

          make -j2 BUILD_DIR=build/global-object-final-debug check-layout
          make -j2 MODE=release BUILD_DIR=build/global-object-final-release CFLAGS=-Werror check-fast
          make -j2 MODE=sanitize BUILD_DIR=build/global-object-final-sanitize check-ast-contract
          bash .github/scripts/compiler-c0-full-gate.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check

          changed=$(git diff --cached --name-only "$EXPECTED_FOUNDATION_HEAD" | sort)
          expected=$(printf '%s\n' \
            docs/architecture/global-object-datalayout-query-v1.md \
            src/frontend/ast.h \
            src/target/data_layout.c \
            src/target/data_layout.h \
            src/target/riscv64/codegen_function.c \
            src/target/riscv64/layout.c \
            tests/target/riscv64/layout_test.c | sort)
          if test "$changed" != "$expected"; then
            echo 'unexpected final global-object DataLayout diff:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          git commit \
            -m 'refactor(layout): make DataLayout own global object placement' \
            -m "Frozen Linux global-object DataLayout pressure run: $PRESSURE_RUN_ID"
          git push origin HEAD:"$FEATURE_BRANCH"
