name: Finish Overflow Representability V3
# registered by a second branch push
on:
  push:
    branches: [product/overflow-representable-operands-v3]
permissions:
  contents: write
jobs:
  finish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/overflow-representable-operands-v3
          fetch-depth: 0
      - name: Materialize corrected layered product slice
        run: |
          set -Eeuo pipefail
          git fetch origin main staging/string-octal-v1
          git show origin/staging/string-octal-v1:tools/dev/materialize-overflow-result-range-v1.py > tools/dev/.overflow-range.py
          python3 tools/dev/.overflow-range.py
          rm tools/dev/.overflow-range.py
          awk '/^          python3 - <<'\''PY'\''$/{flag=1;next} /^          PY$/{if(flag){exit}} flag{sub(/^          /,""); print}' .github/workflows/compiler-c0.yml > /tmp/overflow-v3.py
          python3 /tmp/overflow-v3.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/frontend/const_eval.c')
          s = p.read_text()
          anchor = '''static bool convert_value(const MinicC0Program *program,\n                          const MinicTargetInfo *target,\n                          const MinicConstValue *source,\n                          MinicType type,\n                          MinicConstValue *result) {\n'''
          proto = '''static bool signed_range(const MinicC0Program *program,\n                         const MinicTargetInfo *target,\n                         MinicType type,\n                         int64_t *minimum,\n                         int64_t *maximum);\n\n'''
          if proto not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('const-eval declaration anchor mismatch')
              s = s.replace(anchor, proto + anchor, 1)
              p.write_text(s)
          PY
          git show origin/main:.github/workflows/compiler-c0.yml > .github/workflows/compiler-c0.yml
          clang-format-18 -i src/frontend/expression_semantics.h src/frontend/expression_semantics.c src/frontend/const_eval.h src/frontend/const_eval.c src/frontend/parser_expression.c src/frontend/ast_verifier.c src/target/riscv64/codegen_expression.c tests/compiler/c0/gnu_overflow_builtins.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/overflow-v3-final
          MINIC="$GITHUB_WORKSPACE/build/overflow-v3-final/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/overflow-v3-focused" sh tests/compiler/c0/run-gnu-overflow-builtins.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/overflow-v3-fast
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finish-overflow-representability-v3.yml
          git add .github/workflows/compiler-c0.yml src/frontend/expression_semantics.h src/frontend/expression_semantics.c src/frontend/const_eval.h src/frontend/const_eval.c src/frontend/parser_expression.c src/frontend/ast_verifier.c src/target/riscv64/codegen_expression.c tests/compiler/c0/gnu_overflow_builtins.c
          git commit -m 'frontend: accept representable overflow builtin operands'
          git push origin HEAD:product/overflow-representable-operands-v3
