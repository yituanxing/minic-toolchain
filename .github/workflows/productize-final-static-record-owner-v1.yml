name: Productize Final Static Record Owner V1
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.head_ref == 'product/final-static-record-owner-v1' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/final-static-record-owner-v1
          fetch-depth: 0
      - name: Materialize generic static record ownership
        run: |
          set -Eeuo pipefail
          git fetch origin diagnostic/effective-convergence-snapshot-v1
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/frontend/parser_global.c')
          source = path.read_text()
          staging = subprocess.check_output(
              ['git', 'show', 'origin/diagnostic/effective-convergence-snapshot-v1:src/frontend/parser_global.c'],
              text=True,
          )

          helper_start_marker = 'typedef struct MinicStaticRecordDesignator {'
          helper_end_marker = 'static bool overwrite_static_zero_record_constant('
          if helper_start_marker in source:
              raise SystemExit('static record designator helper already present')
          helper_start = staging.index(helper_start_marker)
          helper_end = staging.index(helper_end_marker, helper_start)
          helpers = staging[helper_start:helper_end]
          insert_at = source.index(helper_end_marker)
          source = source[:insert_at] + helpers + source[insert_at:]

          array_block = '''    if (field->is_array) {
              return overwrite_static_zero_array_constant(
                  parser, object_id, field->type, field->element_count, field_base_slot);
          }
          '''
          if source.count(array_block) != 1:
              raise SystemExit(f'backward array block count={source.count(array_block)}')
          char_overlay = '''    if (field->is_array && minic_type_is_char_integer(field->type) &&
              parser->current.kind == MINIC_TOKEN_STRING_LITERAL) {
              return minic_parser_replace_zero_bounded_string_literal_initializer(
                  parser, object_id, field_base_slot, field->element_count);
          }
          '''
          source = source.replace(array_block, char_overlay + array_block, 1)

          function_start = 'static bool parse_static_record_constant('
          function_end = '\nbool minic_parser_parse_static_storage_initializer_value('
          staging_start = staging.index(function_start, helper_start)
          staging_end = staging.index(function_end, staging_start)
          staged_function = staging[staging_start:staging_end]
          current_start = source.index(function_start, insert_at + len(helpers))
          current_end = source.index(function_end, current_start)
          source = source[:current_start] + staged_function + source[current_end:]
          path.write_text(source)
          PY

          cat > tests/compiler/c0/static_record_nested_designator_string_overlay.c <<'EOF'
          struct refcount {
              long refs[1];
          };
          struct namespace_state {
              struct refcount count;
          };
          struct boot_state {
              struct namespace_state ns;
              char comm[8];
              long tail;
          };

          static struct boot_state state = {
              .ns.count = { .refs = { 2 } },
              .tail = 9,
              .comm = "swap",
          };

          int main(void) {
              if (state.ns.count.refs[0] != 2) {
                  return 1;
              }
              if (state.comm[0] != 's' || state.comm[1] != 'w' || state.comm[4] != 0) {
                  return 2;
              }
              return state.tail == 9 ? 0 : 3;
          }
          EOF

          cat > tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/static-record-nested-designator-string-overlay
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c \
            "$root/tests/compiler/c0/static_record_nested_designator_string_overlay.c" \
            -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/compiler/c0/run.sh')
          source = path.read_text()
          invocation = '''\nMINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \\
            sh "$root/tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh"\n'''
          if 'run-static-record-nested-designator-string-overlay.sh' not in source:
              path.write_text(source + invocation)
          PY
      - name: Validate clean product slice
        run: |
          set -Eeuo pipefail
          clang-format-18 -i src/frontend/parser_global.c tests/compiler/c0/static_record_nested_designator_string_overlay.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-static-record-owner
          MINIC="$GITHUB_WORKSPACE/build/product-static-record-owner/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-static-record-owner" \
            sh tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-static-record-owner-fast
      - name: Commit product source and permanent regression
        run: |
          set -Eeuo pipefail
          rm -f diagnostics/final-static-record-owner-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_global.c \
                  tests/compiler/c0/static_record_nested_designator_string_overlay.c \
                  tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh \
                  tests/compiler/c0/run.sh \
                  diagnostics/final-static-record-owner-trigger.txt
          git commit -m 'frontend: complete static record initializer ownership'
          git push origin HEAD:product/final-static-record-owner-v1
