name: Productize Final Static Record Owner V1
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.head_ref == 'product/final-static-record-owner-v1' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/final-static-record-owner-v1
          fetch-depth: 0
      - name: Materialize generic static record ownership
        run: |
          set -Eeuo pipefail
          git fetch origin diagnostic/effective-convergence-snapshot-v1
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          staging_global = subprocess.check_output(
              ['git', 'show', 'origin/diagnostic/effective-convergence-snapshot-v1:src/frontend/parser_global.c'],
              text=True,
          )
          staging_string = subprocess.check_output(
              ['git', 'show', 'origin/diagnostic/effective-convergence-snapshot-v1:src/frontend/parser_string.c'],
              text=True,
          )

          global_path = Path('src/frontend/parser_global.c')
          source = global_path.read_text()
          helper_start_marker = 'typedef struct MinicStaticRecordDesignator {'
          helper_end_marker = 'static bool overwrite_static_zero_record_constant('
          if helper_start_marker in source:
              raise SystemExit('static record designator helper already present')
          helper_start = staging_global.index(helper_start_marker)
          helper_end = staging_global.index(helper_end_marker, helper_start)
          helpers = staging_global[helper_start:helper_end]
          insert_at = source.index(helper_end_marker)
          source = source[:insert_at] + helpers + source[insert_at:]

          field_start_marker = 'static bool overwrite_static_zero_field_value('
          field_end_marker = '\nstatic bool overwrite_static_zero_array_element('
          field_start = source.index(field_start_marker)
          field_end = source.index(field_end_marker, field_start)
          field_body = source[field_start:field_end]
          if 'minic_parser_replace_zero_bounded_string_literal_initializer' in field_body:
              raise SystemExit('backward character-array string overlay already present')
          generic_array_marker = '    if (field->is_array) {'
          generic_array_offset = field_body.index(generic_array_marker)
          char_overlay = '''    if (field->is_array && minic_type_is_char_integer(field->type) &&
              parser->current.kind == MINIC_TOKEN_STRING_LITERAL) {
              return minic_parser_replace_zero_bounded_string_literal_initializer(
                  parser, object_id, field_base_slot, field->element_count);
          }
          '''
          insert_char_at = field_start + generic_array_offset
          source = source[:insert_char_at] + char_overlay + source[insert_char_at:]

          function_start = 'static bool parse_static_record_constant('
          function_end = '\nbool minic_parser_parse_static_storage_initializer_value('
          staging_start = staging_global.index(function_start, helper_start)
          staging_end = staging_global.index(function_end, staging_start)
          staged_function = staging_global[staging_start:staging_end]
          current_start = source.index(function_start, insert_at + len(helpers))
          current_end = source.index(function_end, current_start)
          source = source[:current_start] + staged_function + source[current_end:]
          global_path.write_text(source)

          string_path = Path('src/frontend/parser_string.c')
          string_source = string_path.read_text()
          replace_start_marker = 'static bool replace_zero_string_payload('
          replace_end_marker = '\nbool minic_parser_get_predefined_function_name_object('
          if 'bool minic_parser_replace_zero_bounded_string_literal_initializer(' in string_source:
              raise SystemExit('bounded string overwrite implementation already present')
          replace_start = staging_string.index(replace_start_marker)
          replace_end = staging_string.index(replace_end_marker, replace_start)
          replace_block = staging_string[replace_start:replace_end]
          string_insert = string_source.index(replace_end_marker)
          string_source = string_source[:string_insert] + '\n' + replace_block + string_source[string_insert:]
          string_path.write_text(string_source)

          internal_path = Path('src/frontend/parser_internal.h')
          internal_source = internal_path.read_text()
          prototype_name = 'bool minic_parser_replace_zero_bounded_string_literal_initializer('
          if prototype_name in internal_source:
              raise SystemExit('bounded string overwrite prototype already present')
          bounded_name = 'bool minic_parser_add_bounded_string_literal_initializer('
          bounded_start = internal_source.index(bounded_name)
          bounded_end = internal_source.index(';\n', bounded_start) + 2
          prototype = '''bool minic_parser_replace_zero_bounded_string_literal_initializer(MinicParser *parser,
                                                                    MinicGlobalObjectId object_id,
                                                                    size_t first_slot,
                                                                    size_t element_capacity);
          '''
          internal_source = internal_source[:bounded_end] + prototype + internal_source[bounded_end:]
          internal_path.write_text(internal_source)
          PY

          cat > tests/compiler/c0/static_record_nested_designator_string_overlay.c <<'EOF'
          struct refcount {
              long refs[1];
          };
          struct namespace_state {
              struct refcount count;
          };
          struct boot_state {
              struct namespace_state ns;
              char comm[8];
              long tail;
          };

          static struct boot_state state = {
              .ns.count = { .refs = { 2 } },
              .tail = 9,
              .comm = "swap",
          };

          int main(void) {
              if (state.ns.count.refs[0] != 2) {
                  return 1;
              }
              if (state.comm[0] != 's' || state.comm[1] != 'w' || state.comm[4] != 0) {
                  return 2;
              }
              return state.tail == 9 ? 0 : 3;
          }
          EOF

          cat > tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/static-record-nested-designator-string-overlay
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c \
            "$root/tests/compiler/c0/static_record_nested_designator_string_overlay.c" \
            -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/compiler/c0/run.sh')
          source = path.read_text()
          invocation = '''\nMINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \\
            sh "$root/tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh"\n'''
          if 'run-static-record-nested-designator-string-overlay.sh' not in source:
              path.write_text(source + invocation)
          PY
      - name: Validate clean product slice
        run: |
          set -Eeuo pipefail
          clang-format-18 -i src/frontend/parser_global.c src/frontend/parser_string.c src/frontend/parser_internal.h tests/compiler/c0/static_record_nested_designator_string_overlay.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-static-record-owner
          MINIC="$GITHUB_WORKSPACE/build/product-static-record-owner/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-static-record-owner" \
            sh tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-static-record-owner-fast
      - name: Commit product source and permanent regression
        run: |
          set -Eeuo pipefail
          rm -f diagnostics/final-static-record-owner-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_global.c \
                  src/frontend/parser_string.c \
                  src/frontend/parser_internal.h \
                  tests/compiler/c0/static_record_nested_designator_string_overlay.c \
                  tests/compiler/c0/run-static-record-nested-designator-string-overlay.sh \
                  tests/compiler/c0/run.sh \
                  diagnostics/final-static-record-owner-trigger.txt
          git commit -m 'frontend: complete static record initializer ownership'
          git push origin HEAD:product/final-static-record-owner-v1
