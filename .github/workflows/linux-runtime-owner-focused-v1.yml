name: Linux Runtime Owner Focused V1

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
    paths:
      - ".github/workflows/linux-runtime-owner-focused-v1.yml"
      - "tools/ci/runtime-timekeeping-trigger.txt"
      - "tools/ci/runtime-vsyscall-trigger.txt"
      - "tools/ci/runtime-notifier-trigger.txt"
      - "tools/ci/runtime-build-policy-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-owner-focused-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner:
    strategy:
      fail-fast: false
      matrix:
        mode: [timekeeping, vsyscall, notifier, build-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Restore certified frozen linker source subset
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: frozen

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Resolve focused owner mode
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -Eeuo pipefail
          case "$MODE" in
            timekeeping)
              target=kernel/time/timekeeping.o
              stem=kernel/time/timekeeping
              symbol=timekeeping_advance
              ;;
            vsyscall)
              target=kernel/time/vsyscall.o
              stem=kernel/time/vsyscall
              symbol=update_vsyscall
              ;;
            notifier)
              target=kernel/notifier.o
              stem=kernel/notifier
              symbol=raw_notifier_call_chain
              ;;
            build-policy)
              target=kernel/sched/build_policy.o
              stem=kernel/sched/build_policy
              symbol=account_process_tick
              ;;
            *)
              exit 2
              ;;
          esac
          {
            echo "MODE=$MODE"
            echo "TARGET=$target"
            echo "STEM=$stem"
            echo "SYMBOL=$symbol"
            echo "EV=$GITHUB_WORKSPACE/build/linux-runtime-owner-focused-v1-$MODE"
            echo "TOOLCHAIN=$GITHUB_WORKSPACE/build/toolchain-runtime-owner-focused-v1-$MODE"
          } >>"$GITHUB_ENV"

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EV"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$TOOLCHAIN" "$EV/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$EV/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$EV/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$EV/profile/patch.log"

      - name: Refresh frontier owners through selected target
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"
            log="$2"
            base="${target%.o}"
            dir="${target%/*}"
            stem="${target##*/}"
            stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" \
              "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$TOOLCHAIN/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            MINIC_CORE_FRAME_TRACE="${MINIC_CORE_FRAME_TRACE:-0}" CORE_FAST_TRACE="${CORE_FAST_TRACE:-0}" \
            MINIC_LOCAL_FACT_TRACE="${MINIC_LOCAL_FACT_TRACE:-0}" \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$EV/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
            "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$TOOLCHAIN/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" \
            >"$EV/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          test -s "$out/$pi_base.minic-stage2.s"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$out/$pi_base.minic-stage2.s" >/dev/null
          echo 'PI_OWNER_REFRESH=PASS local_string=lla'

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock_debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build_utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log

          case "$MODE" in
            timekeeping) ;;
            vsyscall)
              stamp="$EV/vsyscall-frame-start.stamp"
              touch "$stamp"
              MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
                refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
              find "$out/kernel/time" -type f -name '*.minic.stderr' -newer "$stamp" -print0 \
                | xargs -0 -r cat >"$EV/vsyscall-frame-trace.txt"
              grep -E 'CORE_FRAME_REUSE function=update_vsyscall([[:space:]]|$)' \
                "$EV/vsyscall-frame-trace.txt" | tee "$EV/vsyscall-frame-lines.txt"
              frame=$(sed -n 's/.*CORE_FRAME_REUSE function=update_vsyscall frame=\([0-9][0-9]*\).*/\1/p' \
                "$EV/vsyscall-frame-lines.txt" | head -1)
              test -n "$frame"
              printf 'UPDATE_VSYSCALL_FRAME=%s\n' "$frame" | tee "$EV/vsyscall-frame-contract.txt"
              test "$frame" -lt 2256
              echo 'VSYSCALL_FRAME_CONTRACT=PASS limit=2256' | tee -a "$EV/vsyscall-frame-contract.txt"
              ;;
            notifier)
              refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
              refresh_obj kernel/notifier.o notifier-refresh.log
              ;;
            build-policy)
              refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
              refresh_obj kernel/notifier.o notifier-refresh.log
              refresh_obj kernel/sched/build_policy.o build_policy-refresh.log
              ;;
          esac

          test -s "$out/$TARGET"
          riscv64-linux-gnu-objdump -dr "$out/$TARGET" >"$EV/target.objdump.txt"
          riscv64-linux-gnu-nm -an "$out/$TARGET" >"$EV/target.nm.txt"
          cp "$out/$STEM.minic-stage2.s" "$EV/target.minic-stage2.s"

          python3 - "$EV/target.objdump.txt" "$EV/target-function.objdump.txt" "$SYMBOL" <<'PY'
          import re, sys
          from pathlib import Path
          src, dst, symbol = map(Path, sys.argv[1:3]) if False else (Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3])
          lines = src.read_text(errors='replace').splitlines()
          needle = f'<{symbol}>:'
          start = next(i for i, line in enumerate(lines) if needle in line)
          end = len(lines)
          for i in range(start + 1, len(lines)):
              if re.match(r'^\s*[0-9a-f]+ <[^>]+>:$', lines[i]) and '<.L' not in lines[i]:
                  end = i
                  break
          body = lines[start:end]
          dst.write_text('\n'.join(body) + '\n')
          print('\n'.join(body[:100]))
          PY

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$EV/early"

      - name: Execute QEMU current frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-init-irq-frontier-v0.json \
            --nm "$EV/early/nm.txt" --image "$EV/early/Image.early" \
            --evidence-dir "$EV/watch" --timeout-ms 8000 --poll-ms 100 | tee "$EV/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$EV/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-owner-focused-v1-${{ matrix.mode }}-${{ github.sha }}
          path: |
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/profile/patch.log
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/*-refresh.log
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/target.objdump.txt
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/target.nm.txt
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/target.minic-stage2.s
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/target-function.objdump.txt
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/vsyscall-frame-trace.txt
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/vsyscall-frame-lines.txt
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/vsyscall-frame-contract.txt
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/watch/frontier-result.json
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/watch/frontier-summary.txt
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/watch/watch-result.json
            build/linux-runtime-owner-focused-v1-${{ matrix.mode }}/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
