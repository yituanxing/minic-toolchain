name: Linux Runtime Kallsyms Breakpoint V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-kallsyms-breakpoint-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-kallsyms-breakpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kallsyms-breakpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-kallsyms-breakpoint-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh current runtime owner set
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-kallsyms-breakpoint-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock_debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build_utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build_policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/rcu/rcu_segcblist.o rcu-segcblist-refresh.log
          refresh_obj init/main.o init-main-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log

          test -s "$out/kernel/kallsyms.o"
          sha256sum "$out/kernel/kallsyms.o" | tee "$ev/kallsyms.before.sha256.txt"
          riscv64-linux-gnu-nm -A -an "$out/built-in.a" 2>/dev/null | grep -E '(^|:)kernel/kallsyms\.o:.* get_symbol_pos$' | tee "$ev/kallsyms.owner.txt"

      - name: Baseline relink and inspect
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/baseline"
          riscv64-linux-gnu-objdump -dr --disassemble=get_symbol_pos "$ev/baseline/vmlinux.early" >"$ev/baseline.get_symbol_pos.objdump.txt"
          grep -n -E 'get_symbol_pos|ebreak|809f95a4' "$ev/baseline.get_symbol_pos.objdump.txt" | tee "$ev/baseline.get_symbol_pos.key.txt" || true

      - name: Baseline QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py --config tools/ci/linux-runtime-init-irq-frontier-v0.json --nm "$ev/baseline/nm.txt" --image "$ev/baseline/Image.early" --evidence-dir "$ev/baseline-watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/baseline-watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Refresh kallsyms owner with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-kallsyms-breakpoint-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=kernel/kallsyms.o
          base=kernel/kallsyms
          rm -f "$out/$target" "$out/kernel/.kallsyms.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/kallsyms-refresh.log" 2>&1
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.s"
          echo 'KALLSYMS_REFRESH=PASS'
          sha256sum "$out/$target" | tee "$ev/kallsyms.after.sha256.txt"
          cp "$out/$base.minic-stage2.s" "$ev/kallsyms.minic-stage2.s"
          riscv64-linux-gnu-objdump -dr "$out/$target" >"$ev/kallsyms.after.objdump.txt"
          grep -n -A180 -B8 '<get_symbol_pos>:' "$ev/kallsyms.after.objdump.txt" >"$ev/kallsyms.after.get_symbol_pos.objdump.txt" || true

      - name: Refreshed relink and inspect
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/refreshed"
          riscv64-linux-gnu-objdump -dr --disassemble=get_symbol_pos "$ev/refreshed/vmlinux.early" >"$ev/refreshed.get_symbol_pos.objdump.txt"
          grep -n -E 'get_symbol_pos|ebreak' "$ev/refreshed.get_symbol_pos.objdump.txt" | tee "$ev/refreshed.get_symbol_pos.key.txt" || true

      - name: Refreshed QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py --config tools/ci/linux-runtime-init-irq-frontier-v0.json --nm "$ev/refreshed/nm.txt" --image "$ev/refreshed/Image.early" --evidence-dir "$ev/refreshed-watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/refreshed-watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Compare A B
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-breakpoint-v0"
          echo '=== KALLSYMS HASH BEFORE ==='
          cat "$ev/kallsyms.before.sha256.txt" || true
          echo '=== KALLSYMS HASH AFTER ==='
          cat "$ev/kallsyms.after.sha256.txt" || true
          echo '=== BASELINE BREAKPOINTS ==='
          grep -F 'desc=breakpoint' "$ev/baseline-watch/qemu.interrupts.txt" | tail -n 8 || true
          echo '=== REFRESHED BREAKPOINTS ==='
          grep -F 'desc=breakpoint' "$ev/refreshed-watch/qemu.interrupts.txt" | tail -n 8 || true
          echo '=== BASELINE FRONTIER ==='
          cat "$ev/baseline-watch/frontier-summary.txt" || true
          echo '=== REFRESHED FRONTIER ==='
          cat "$ev/refreshed-watch/frontier-summary.txt" || true

      - name: Preserve kallsyms breakpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-kallsyms-breakpoint-v0-${{ github.sha }}
          path: |
            build/linux-runtime-kallsyms-breakpoint-v0/profile/patch.log
            build/linux-runtime-kallsyms-breakpoint-v0/*-refresh.log
            build/linux-runtime-kallsyms-breakpoint-v0/kallsyms.*
            build/linux-runtime-kallsyms-breakpoint-v0/baseline/nm.txt
            build/linux-runtime-kallsyms-breakpoint-v0/baseline.get_symbol_pos.objdump.txt
            build/linux-runtime-kallsyms-breakpoint-v0/baseline.get_symbol_pos.key.txt
            build/linux-runtime-kallsyms-breakpoint-v0/baseline-watch.stdout.txt
            build/linux-runtime-kallsyms-breakpoint-v0/baseline-watch/frontier-result.json
            build/linux-runtime-kallsyms-breakpoint-v0/baseline-watch/frontier-summary.txt
            build/linux-runtime-kallsyms-breakpoint-v0/baseline-watch/watch-result.json
            build/linux-runtime-kallsyms-breakpoint-v0/baseline-watch/qemu.interrupts.txt
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed/nm.txt
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed.get_symbol_pos.objdump.txt
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed.get_symbol_pos.key.txt
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed-watch.stdout.txt
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed-watch/frontier-result.json
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed-watch/frontier-summary.txt
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed-watch/watch-result.json
            build/linux-runtime-kallsyms-breakpoint-v0/refreshed-watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
