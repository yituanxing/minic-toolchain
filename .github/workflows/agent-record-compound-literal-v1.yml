name: Agent Record Compound Literal V1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0
      - name: Generate record compound literal source
        run: python3 tools/dev/agent_record_compound_literal_v1.py
      - name: Format generated source
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-record-compound-literal
      - name: Run record compound literal focused contract
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-record-compound-literal/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-record-compound-literal-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-record-compound-literal.sh
      - name: Run Foundation focused contracts
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-record-compound-literal/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-record-compound-literal-foundation" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh
      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-record-compound-literal check-fast
      - name: Publish generated source to scratch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/ast.h \
                  src/frontend/parser_internal.h \
                  src/frontend/parser_statement.c \
                  src/frontend/parser_expression.c \
                  src/frontend/cast_normalization.c \
                  src/frontend/ast_verifier.c \
                  src/target/riscv64/codegen_expression.c \
                  tests/compiler/c0/gnu_record_compound_literal.c \
                  tests/compiler/c0/run-gnu-record-compound-literal.sh \
                  tools/dev/pr76-focused.sh
          git commit -m 'frontend: add block-scope record compound literals'
          git push --force origin HEAD:agent/record-compound-literal-v1
