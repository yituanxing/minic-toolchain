name: MiniStrip M0 Gate

on:
  push:
    branches:
      - "toolchain/minicstrip-m0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minicstrip-m0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV32 RV64 oracle toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Strict build
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minicstrip all

      - name: Preserve Objcopy A0 A1 A2
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minicstrip check-miniobjcopy-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minicstrip check-miniobjcopy-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minicstrip check-miniobjcopy-a2

      - name: Differentially validate MiniStrip M0
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minicstrip check-minicstrip-m0
