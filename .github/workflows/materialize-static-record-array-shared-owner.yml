name: Materialize static record-array shared owner

on:
  push:
    branches:
      - staging/static-record-array-shared-owner-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize product delta
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-static-record-array-shared-owner.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh fix
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and focused validation
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/record-array-shared-owner
          MINIC="$GITHUB_WORKSPACE/build/record-array-shared-owner/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-array-shared-owner-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-static-record-arrays.sh
          make check-fast

      - name: Commit materialized product files
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/frontend/parser_global.c \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/static_record_array.c \
            tests/compiler/c0/run-static-record-arrays.sh
          git commit -m 'refactor: share static record-array initializer semantics [materialized]'
          git push origin HEAD:staging/static-record-array-shared-owner-v1
