name: Linux Filter Local Integer V2

on:
  push:
    branches:
      - agent/linux-local-integer-isolate-v1
      - agent/inline-specialization-reachability-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-filter-local-integer-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install RV64 Linux prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3
      - name: Build real Linux filter.o with V2 local constants
        run: bash tools/ci/run-linux-filter-local-integer-v2.sh
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-filter-local-integer-v2
          path: |
            build/linux-filter-local-integer-v2/evidence/
            build/linux-filter-local-integer-v2/patch.log
          if-no-files-found: ignore
          retention-days: 5
