name: PR126 Materialize Static Object Address
on:
  push:
    branches: [agent/static-object-address-relocation-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize static object address relocations
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr126-materialize.py
          chmod +x tests/compiler/c0/run-static-object-address-relocation.sh
          clang-format-18 -i \
            src/frontend/parser_global.c \
            tests/compiler/c0/static_object_address_relocation.c \
            tests/compiler/c0/invalid_static_object_address_type.c \
            tests/compiler/c0/invalid_static_object_address_addend.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr126-focused" \
            sh tests/compiler/c0/run-static-object-address-relocation.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr126-materialize.py .github/workflows/pr126-materialize-static-address.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): support static object address relocations'
          git push origin HEAD:agent/static-object-address-relocation-v0
