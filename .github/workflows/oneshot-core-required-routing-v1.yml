name: One-shot Core Required Routing

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Prove current silent fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-required-routing-v1.py
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-routing-pre
          cat > build/core-routing-pre/core_required_no_fallback.c <<'EOF'
          static int core_owned_sum9(int a, int b, int c, int d, int e, int f, int g, int h, int i) {
              return a + b + c + d + e + f + g + h + i;
          }

          int core_owned_call9(void) {
              return core_owned_sum9(1, 2, 3, 4, 5, 6, 7, 8, 9);
          }
          EOF
          cc -E -P -std=gnu11 -x c build/core-routing-pre/core_required_no_fallback.c \
            -o build/core-routing-pre/core_required_no_fallback.i
          compiler="$GITHUB_WORKSPACE/build/core-routing-pre/bin/minic"
          MINIC_CORE_IR=strict "$compiler" -S \
            build/core-routing-pre/core_required_no_fallback.i \
            -o build/core-routing-pre/shadow-strict.s
          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S \
            build/core-routing-pre/core_required_no_fallback.i \
            -o build/core-routing-pre/hybrid.s
          grep -q '^core_owned_call9:' build/core-routing-pre/hybrid.s
          if grep -q 'core_owned_call9_core_bb' build/core-routing-pre/hybrid.s; then
            printf '%s\n' 'expected pre-migration caller to use legacy fallback' >&2
            exit 1
          fi
          printf '%s\n' 'PASS pre/core-required-routing lower-ok=1 silent-fallback-observed=1'

      - name: Apply Core ownership routing patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-core-required-routing-v1.py
          clang-format-18 -i \
            src/compiler/compiler.c \
            src/target/riscv64/codegen.h \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/core_required_no_fallback.c
          grep -F 'bool *core_required;' src/compiler/compiler.c >/dev/null
          grep -F 'const bool *core_required_functions' src/target/riscv64/codegen.h >/dev/null
          grep -F "Core-owned function '%s' cannot be emitted by RV64 basic-v0" \
            src/target/riscv64/codegen_function.c >/dev/null

      - name: Validate fail-closed Core ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-routing-post
          MINIC="$GITHUB_WORKSPACE/build/core-routing-post/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-routing-post" \
            sh tests/compiler/c0/run-core-required-no-fallback.sh

          compiler="$GITHUB_WORKSPACE/build/core-routing-post/bin/minic"
          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S \
            tests/target/riscv64/core_hybrid_differential.i \
            -o build/core-routing-post/core_hybrid_differential.s
          grep -q '^\.Lcore_hybrid_core_core_bb0:' \
            build/core-routing-post/core_hybrid_differential.s
          grep -q '^\.Lcore_hybrid_fallback_load_return:' \
            build/core-routing-post/core_hybrid_differential.s
          if grep -q '^\.Lcore_hybrid_fallback_load_core_bb' \
              build/core-routing-post/core_hybrid_differential.s; then
            printf '%s\n' 'lower-UNSUPPORTED hybrid function unexpectedly became Core-owned' >&2
            exit 1
          fi

          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S \
            tests/target/riscv64/core_frontend_differential.i \
            -o build/core-routing-post/core_frontend_differential.s
          grep -q '^core_diff_math:' build/core-routing-post/core_frontend_differential.s
          grep -q 'core_diff_math_core_bb0' build/core-routing-post/core_frontend_differential.s

      - name: Publish Core routing contract
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-required-routing-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/compiler/compiler.c \
            src/target/riscv64/codegen.h \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/core_required_no_fallback.c \
            tests/compiler/c0/run-core-required-no-fallback.sh \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-required-routing-v1.py
          git diff --cached --check
          git commit -m 'core: make lowered functions fail closed in hybrid codegen'
          git push origin HEAD:refactor/declaration-sema-v1
