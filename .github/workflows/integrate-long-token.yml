name: Integrate long keyword token

on:
  push:
    branches:
      - frontend/rv64-long-integers
    paths:
      - '.github/scripts/integrate-long-token.sh'
      - '.github/workflows/integrate-long-token.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-long-token
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
          fetch-depth: 0

      - name: Apply, format, and validate the token slice
        run: bash .github/scripts/integrate-long-token.sh
