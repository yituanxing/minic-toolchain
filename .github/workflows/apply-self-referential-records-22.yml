name: Apply self-referential records 22

on:
  pull_request:
    paths:
      - '.github/workflows/apply-self-referential-records-22.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/incomplete-record-tags
          fetch-depth: 0
      - name: Install pinned formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          clang-format-18 --version
      - name: Normalize parser source boundary
        run: printf '\n' >> src/frontend/parser_type.c
      - name: Apply and verify self-referential record support
        run: bash .github/scripts/apply-self-referential-records.sh
