name: One-shot Linux Fast Replay

on:
  pull_request:

permissions:
  contents: write

jobs:
  optimize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Validate fast frozen Linux replay candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/one-shot-linux-fast-replay.py
          python3 tests/external/linux/corpus_replay_selection_test.py
          python3 -m py_compile tests/external/linux/corpus_replay.py tests/external/linux/corpus_replay_selection_test.py
          git diff --check

          cp .github/workflows/linux-batch-pressure.yml tools/dev/linux-batch-pressure.fast.yml.generated
          git checkout -- .github/workflows/linux-batch-pressure.yml
          rm tools/dev/one-shot-linux-fast-replay.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/external/linux/corpus_replay.py \
            tests/external/linux/corpus_replay_selection_test.py \
            tools/dev/linux-batch-pressure.fast.yml.generated \
            tools/dev/one-shot-linux-fast-replay.py
          git commit -m "ci: validate fast frozen Linux replay"
          git push origin HEAD:refactor/declaration-sema-v1
