name: Gate and Integrate RV64 FunctionLayout v1

on:
  push:
    branches: [refactor/rv64-function-layout-v1]

permissions:
  actions: read
  contents: write

concurrency:
  group: rv64-function-layout-v1-integrate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: refactor/rv64-function-layout-v1
      FOUNDATION_BRANCH: refactor/foundation-v1
      EXPECTED_FOUNDATION_HEAD: b85e5318c5f82ae1ab64de87770d4f778aa0af24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for same-head full and Linux pressure gate
        id: pressure
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow rv64-function-layout-v1-pressure.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if test -n "$run_id"; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 180); do
            state=$(gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '.status + ":" + (.conclusion // "")')
            echo "pressure_run=$run_id state=$state"
            case "$state" in
              completed:success)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log \
                  | grep -F 'FULL_TU_PASS lines=90928' >/dev/null
                exit 0
                ;;
              completed:*)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'FunctionLayout pressure gate did not complete within polling budget' >&2
          exit 1

      - name: Materialize and validate canonical FunctionLayout slice
        shell: bash
        env:
          PRESSURE_RUN_ID: ${{ steps.pressure.outputs.run_id }}
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin "$FEATURE_BRANCH" "$FOUNDATION_BRANCH"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$FOUNDATION_BRANCH")" = "$EXPECTED_FOUNDATION_HEAD"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"

          python3 tools/dev/materialize-rv64-function-layout-v1.py
          python3 tools/dev/materialize-rv64-function-layout-v1-frame-fix.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

          grep -F 'typedef struct MinicRiscv64FunctionLayout' src/target/riscv64/layout.h >/dev/null
          grep -F 'minic_riscv64_frame_layout_from_function_layout' \
            src/target/riscv64/codegen_support.c >/dev/null
          grep -F 'minic_riscv64_layout_function(NULL, program, function, &function_layout, NULL)' \
            src/target/riscv64/codegen_function.c >/dev/null
          python3 - <<'PY'
          from pathlib import Path

          text = Path('src/target/riscv64/codegen_support.c').read_text()
          marker = 'bool minic_riscv64_frame_layout_from_function_layout('
          start = text.index(marker)
          brace = text.index('{', start)
          depth = 0
          end = None
          for index in range(brace, len(text)):
              if text[index] == '{':
                  depth += 1
              elif text[index] == '}':
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise SystemExit('cannot find FrameLayout core span')
          body = text[start:end]
          if 'function->local_storage_size' in body:
              raise SystemExit('FrameLayout core still consumes AST local_storage_size')
          if 'function_layout->local_storage_size' not in body:
              raise SystemExit('FrameLayout core does not consume FunctionLayout local storage')
          print('FRAME_LAYOUT_OWNER=function-layout')
          PY

          mkdir -p docs/architecture
          cat > docs/architecture/rv64-function-layout-v1.md <<'DOC'
          # RV64 FunctionLayout ownership v1

          This slice introduces `MinicRiscv64FunctionLayout` as the canonical RV64
          owner of function-local object placement. It records the local-object offset
          vector and total local storage size independently of the semantic AST.

          `MinicRiscv64FrameLayout` now has a core path that consumes this FunctionLayout
          result. Function emission constructs the FunctionLayout once and uses that core
          path, so frame sizing no longer treats `MinicFunction.local_storage_size` as its
          source of truth. The legacy three-argument frame-layout entry point remains as a
          compatibility adapter for expression-level consumers and constructs a temporary
          FunctionLayout internally.

          This is intentionally a migration slice, not the final removal of backend facts
          from the AST. `minic_riscv64_layout_program()` still mirrors the canonical local
          offsets into `MinicLocal.storage_offset` and the total into
          `MinicFunction.local_storage_size` because local address/load/store emitters still
          consume those fields. A later bounded slice must migrate those consumers to the
          FunctionLayout side state before deleting the mirror fields.

          Record-field and global-object layout are deliberately outside this change. They
          belong to the C object DataLayout boundary and must not be conflated with concrete
          per-function stack placement.

          The design preserves the deferred Core IR seam: C semantic facts and object
          DataLayout remain above/along the seam, while concrete function-local placement
          and frame construction stay below it in the target backend.

          The candidate passed the official full compiler gate and the frozen Linux 6.6.143
          hybrid pressure gate in run `@PRESSURE_RUN_ID@`; the latter produced
          `cached_tu_status=0` and `FULL_TU_PASS lines=90928`.
          DOC
          sed -i "s/@PRESSURE_RUN_ID@/$PRESSURE_RUN_ID/" \
            docs/architecture/rv64-function-layout-v1.md

          rm -f \
            tools/dev/materialize-rv64-function-layout-v1.py \
            tools/dev/materialize-rv64-function-layout-v1-frame-fix.py \
            .github/workflows/rv64-function-layout-v1-validation.yml \
            .github/workflows/rv64-function-layout-v1-pressure.yml \
            .github/workflows/rv64-function-layout-v1-integrate.yml

          git diff --check
          sh tools/maintenance/check-production-source-inventory.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

          make -j2 BUILD_DIR=build/function-layout-final-debug check-layout
          make -j2 MODE=release BUILD_DIR=build/function-layout-final-release CFLAGS=-Werror check-fast
          make -j2 MODE=sanitize BUILD_DIR=build/function-layout-final-sanitize check-layout
          bash .github/scripts/compiler-c0-full-gate.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check

          changed=$(git diff --cached --name-only "$EXPECTED_FOUNDATION_HEAD" | sort)
          expected=$(printf '%s\n' \
            docs/architecture/rv64-function-layout-v1.md \
            src/target/riscv64/codegen_function.c \
            src/target/riscv64/codegen_internal.h \
            src/target/riscv64/codegen_support.c \
            src/target/riscv64/layout.c \
            src/target/riscv64/layout.h \
            tests/target/riscv64/layout_test.c | sort)
          if test "$changed" != "$expected"; then
            echo 'unexpected final FunctionLayout diff:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          git commit \
            -m 'refactor(layout): introduce RV64 FunctionLayout side state' \
            -m "Frozen Linux FunctionLayout pressure run: $PRESSURE_RUN_ID"
          git push origin HEAD:"$FEATURE_BRANCH"
