name: PR91 Materialize Packed Record Field

on:
  push:
    branches:
      - agent/packed-record-field-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/packed-record-field-v0
          fetch-depth: 0
      - name: Materialize packed field semantics
        run: |
          set -Eeuo pipefail
          python tools/dev/pr91-materialize-packed-field.py
          chmod +x tests/compiler/c0/run-gnu-packed-record-field.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-gnu-packed-record-field.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr91-materialize-packed-field.py
          rm -f .github/workflows/pr91-materialize-packed-field.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: model GNU packed record fields'
          git push origin HEAD:agent/packed-record-field-v0
