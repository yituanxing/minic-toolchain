            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/boolean-domain-counts.tsv
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/integer-owner-counts.tsv
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/boolean-domain-summary.json
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/stage-probe/stages.tsv
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/stage-probe/minic-rss.tsv
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/stage-probe/minic-resource-summary.json
