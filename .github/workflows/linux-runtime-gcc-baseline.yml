name: Linux Runtime GCC Baseline

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/linux-perf-boolean-domain-v1"
    paths:
      - '.github/workflows/linux-runtime-gcc-baseline.yml'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

# P1 calibration rerun after loopback bring-up.

jobs:
  gcc-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-gcc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V Linux runtime prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils cpio gzip file \
            qemu-system-misc opensbi

      - name: Build deterministic runtime initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-runtime-gcc/initramfs" \
          OUTPUT_INITRAMFS="$GITHUB_WORKSPACE/build/linux-runtime-gcc/runtime-initramfs.cpio.gz" \
          RISCV_CC=riscv64-linux-gnu-gcc \
            bash tests/external/linux/build_runtime_initramfs.sh

      - name: Build Linux 6.6.143 GCC baseline Image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          # This is the SAME config generated by the full Linux MiniC Image
          # workflow. Reject drift before spending time compiling the kernel.
          expected_config=e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          actual_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          echo "GNU_EXACT_CONFIG actual=$actual_config expected=$expected_config"
          test "$actual_config" = "$expected_config"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 Image
          test -s "$out/arch/riscv/boot/Image"
          file "$out/arch/riscv/boot/Image"
          echo "LINUX_RUNTIME_GCC_IMAGE=PASS release=6.6.143"

      - name: Run Python-era runtime contract against GCC baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu" \
          LINUX_RELEASE=6.6.143 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
          QEMU_SHELL_INPUT_DELAY_SECONDS=8 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_BASELINE=PASS lanes=2/2 head=$GITHUB_SHA"

      - name: Calibrate P1 syscall profile against GCC reference
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu-p1" \
          LINUX_RELEASE=6.6.143 \
          LINUX_RUNTIME_PROFILE=p1 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_P1=PASS syscalls=12 head=$GITHUB_SHA"

      - name: Certify pure-GNU exact-config object pool after QEMU contracts
        id: exact_gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          out="$work/out"
          expected=e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          actual=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test "$actual" = "$expected"
          test -s "$out/vmlinux"
          test -s "$out/arch/riscv/boot/Image"
          test -s "$out/built-in.a"
          test -s "$out/lib/lib.a"
          mkdir -p "$work/provenance"
          (
            cd "$out"
            find . -type f -name '*.o' -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) >"$work/provenance/gcc-objects.sha256"
          count=$(wc -l <"$work/provenance/gcc-objects.sha256")
          test "$count" -ge 3000
          {
            echo "schema=linux-gnu-exact-config-v1"
            echo "linux_release=6.6.143"
            echo "linux_archive_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"
            echo "config_sha256=$actual"
            echo "gcc_version=$(riscv64-linux-gnu-gcc -dumpfullversion)"
            echo "gcc_target=$(riscv64-linux-gnu-gcc -dumpmachine)"
            echo "gcc_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)"
            echo "gnu_ld_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -d' ' -f1)"
            echo "gnu_ar_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ar)" | cut -d' ' -f1)"
            echo "gcc_object_count=$count"
            echo "vmlinux_sha256=$(sha256sum "$out/vmlinux" | cut -d' ' -f1)"
            echo "image_sha256=$(sha256sum "$out/arch/riscv/boot/Image" | cut -d' ' -f1)"
            echo "qemu_contract=full_and_p1_passed"
          } >"$work/provenance/gcc-baseline.txt"
          bin_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          key="linux-gnu-golden-v1-6.6.143-$actual-$bin_sig-$ld_sig"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "GNU_EXACT_GOLDEN=PASS objects=$count config=$actual cache_key=$key"
          du -sh "$out" || true

      - name: Save certified GNU Linux object pool for MiniC one-TU swaps
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.exact_gnu.outputs.key }}

      - name: Preserve runtime blocker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-gcc-blocker
          path: |
            build/linux-runtime-gcc/qemu/*.log
            build/linux-runtime-gcc/qemu-p1/*.log
            build/linux-runtime-gcc/out/.config
            build/linux-runtime-gcc/runtime-initramfs.cpio.gz
          if-no-files-found: ignore
          retention-days: 1
