            build/linux-runtime-gcc-cohort-v1/trials/*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/*/earlycon-source/*
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1.log
          if-no-files-found: warn
          retention-days: 7

  # Opt-in hotfix diagnostic: reuse authenticated 2064 old MiniC objects
  # but replace only earlycon.o with the current patched MiniC profile.
  # No new workflow, no rebuilding the 2063 unaffected C translation units.
  gcc-earlycon-hotfix:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[linux-runtime-earlycon-hotfix]') || contains(github.event.head_commit.message, '[linux-runtime-core-capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install pinned RISC-V GNU tools and QEMU
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      - name: Identify exact pure-GNU golden reference
        id: golden
        shell: bash
        run: |
          set -Eeuo pipefail
          cfg=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$cfg-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - name: Restore QEMU-certified GCC golden object tree
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.golden.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore old authenticated 2064 MiniC object pool
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          # Exact immutable key from pre-fix CI #38051834014, not restore-keys.
          key: gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-d19c855bc2650568f84a73a8a17e2b8be42faee80d0ed22913588bb4d8df7822-1d1c8d09cfffddb37990552ae6392181a42d55332e48232dce27e7305d7e770b-0c2a199ea3ae14d39b008fd4080d4b18d675b07daa17976c7d9755e8ea67310b-d072447ef15a207422bf4874920221c41af7a771d1dbae770855cf3d6220a507
          fail-on-cache-miss: true

      - name: Restore exact Linux 6.6.143 source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Recover certified full-C same-config object order
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          source="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$source"
          test ! -e "$work/linux-6.6.143"
          cp -a --reflink=auto "$source" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$work/out" --manifest "$work/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          test "$(grep -Ec '^[^#[:space:]]+\.o$' "$ev/full-objects.txt")" = 2064

      - name: Capture exact Netfilter GNU and MiniC cached objects only
        if: contains(github.event.head_commit.message, '[linux-runtime-core-capture]')
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/core-capture
          d=build/core-capture
          gcc="$GITHUB_WORKSPACE/build/linux-runtime-gcc/out/net/netfilter/core.o"
          minic="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/minic/net/netfilter/core.o"
          test -s "$gcc" && test -s "$minic"
          cp "$gcc" "$d/gcc-core.o"
          cp "$minic" "$d/minic-core.o"
          sha256sum "$gcc" "$minic" >"$d/identities.sha256"
          riscv64-linux-gnu-objdump -dr --disassemble=nf_hook_entries_grow "$gcc" >"$d/gcc.nf_hook_entries_grow.disasm"
          riscv64-linux-gnu-objdump -dr --disassemble=nf_hook_entries_grow "$minic" >"$d/minic.nf_hook_entries_grow.disasm"
          riscv64-linux-gnu-nm --defined-only "$minic" >"$d/minic.symbols"
          # Recover the next fault's exact mm/gup.c owner without linking a
          # kernel; test whether generic MiniC corrections alter its code.
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          gup_gcc="$work/out/mm/gup.o"
          gup_old="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/minic/mm/gup.o"
          test -s "$gup_gcc" && test -s "$gup_old"
          sha256sum "$gup_old" >"$d/gup.old-object.sha256"
          riscv64-linux-gnu-objdump -dr --disassemble=__minic_inline_spec_9309_155 \
            "$gup_old" >"$d/gup.old-fault-inline.disasm"
          make -C "$work/linux-6.6.143" O="$work/out" ARCH=riscv \
            CROSS_COMPILE=riscv64-linux-gnu- mm/gup.i >"$d/gup.preprocess.log" 2>&1
          cp "$work/out/mm/gup.i" "$d/gup.exact.i"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$d/gup-compiler"
          "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            -S "$d/gup.exact.i" -o "$d/gup.current-minic.s" \
            >"$d/gup.current.stdout" 2>"$d/gup.current.stderr"
          riscv64-linux-gnu-gcc -c "$d/gup.current-minic.s" -o "$d/gup.current-minic.o"
          riscv64-linux-gnu-objdump -dr --disassemble=__minic_inline_spec_9309_155 \
            "$d/gup.current-minic.o" >"$d/gup.current-fault-inline.disasm"
          sha256sum "$d/gup.current-minic.o" >"$d/gup.current-object.sha256"
          echo "GUP_EXACT_CAPTURE=PASS old=$(sha256sum "$gup_old" | cut -d' ' -f1) current=$(sha256sum "$d/gup.current-minic.o" | cut -d' ' -f1)"
          echo "NETFILTER_EXACT_OWNER_CAPTURE=PASS"
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[linux-runtime-core-capture]')
        with:
          name: netfilter-core-gnu-minic-cache-exact
          path: build/core-capture/
          retention-days: 2
      - name: Build current patched MiniC compiler only once
        if: "!contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/compiler"

      - name: Validate QMP sampler before expensive GNU linking
        if: "!contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-runtime-qmp-pc-sampler-v1.py --self-test
          python3 -m py_compile tools/ci/linux-runtime-qmp-pc-sampler-v1.py tools/ci/linux-runtime-qmp-stack-symbols-v1.py tools/ci/linux-runtime-gdb-boundary-v1.py
          sock="/tmp/minic-gdb-preflight-$.sock"
          qemu-system-riscv64 -M virt -cpu max -m 512M -nographic -no-reboot -bios none -S \
            -chardev "socket,path=$sock,server=on,wait=off,id=gdb0" \
            -gdb chardev:gdb0 </dev/null > /tmp/minic-gdb-stub-preflight.log 2>&1 &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || :; wait "$qpid" 2>/dev/null || :; rm -f -- "$sock"' EXIT
          ready=0
          for i in $(seq 1 50); do
            if test -S "$sock"; then ready=1; break; fi
            if ! kill -0 "$qpid" 2>/dev/null; then break; fi
            sleep .1
          done
          if ((ready==0)); then
            cat /tmp/minic-gdb-stub-preflight.log
            echo "GDB_STUB_PREFLIGHT=FAIL"
            exit 1
          fi
          echo "GDB_STUB_PREFLIGHT=PASS unix_socket=true"
          kill "$qpid" 2>/dev/null || :
          wait "$qpid" 2>/dev/null || :
          rm -f -- "$sock"
          trap - EXIT

      - name: Recompile earlycon.o only, GNU link and compare QEMU frontier
        if: "!contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          chmod +x tests/external/linux/qemu_explicit_initrd_wrapper.py
          export COHORT_ACTION=verify COHORT_EARLYCON_HOTFIX=1 COHORT_PATCH_SUPER_V1=1 COHORT_PATCH_NET_PAIR=1 COHORT_NETWORK_CAPTURE_ONLY=0 COHORT_FAULT_OWNER_MAP=1 COHORT_FAULT_OWNER_SYMBOL=__minic_inline_spec_999_52 COHORT_FAULT_OWNER_COMPANION=__minic_inline_spec_10691_62 COHORT_FAULT_OWNER_EXTRA_NETLINK=0 COHORT_EARLYCON_EXPLICIT_INITRD=0 COHORT_EARLYCON_EXPLICIT_SHELL=0 COHORT_NEXT_FAULT_DIAG=0 COHORT_UART_EARLYCON=1 COHORT_NEXT_GCC_SWAPS=1 COHORT_NEXT_GCC_TARGET= COHORT_QMP_STOP_SNAPSHOT=1 COHORT_SPINLOCK_CAPTURE_ONLY=0 COHORT_REPAIR_RUNTIME_OWNER=1 COHORT_REPAIR_INET_CSK_OWNER=1 COHORT_REPAIR_INET_HASHTABLES_OWNER=1 COHORT_NEXT_GCC_EXPLICIT_INITRD=1 COHORT_GDB_SWAP=0 COHORT_GDB_BOUNDARY=0 LINUX_RUNTIME_EARLYCON_ARG=earlycon=uart8250,mmio,0x10000000,115200n8
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve single-object experiment evidence
        if: "always() && !contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-earlycon-one-object-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/earlycon-hotfix/
            build/linux-runtime-gcc-cohort-v1/fault-owner/*
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/link*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qmp*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-uart-earlycon.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/uart-qmp/*
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/gdb-boundary/*
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/qemu-uart-earlycon.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/uart-qmp/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/uart-qmp/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/uart-qmp/stack-symbols.txt
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/runtime-explicit-*.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/qemu-explicit-*/rdinit-init.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_fs_*/gdb-boundary/*
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-early-noinitrd.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/runtime-explicit-*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-explicit-*/rdinit-init.log
          if-no-files-found: warn
          retention-days: 7

