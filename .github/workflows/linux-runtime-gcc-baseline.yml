name: Linux Runtime GCC Baseline

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/linux-perf-boolean-domain-v1"
    paths:
      - '.github/workflows/linux-runtime-gcc-baseline.yml'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # Same-repository exact historical Image artifact download

# P1 calibration rerun after loopback bring-up.

jobs:
  gcc-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-gcc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V Linux runtime prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils cpio gzip file \
            qemu-system-misc opensbi

      - name: Build deterministic runtime initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-runtime-gcc/initramfs" \
          OUTPUT_INITRAMFS="$GITHUB_WORKSPACE/build/linux-runtime-gcc/runtime-initramfs.cpio.gz" \
          RISCV_CC=riscv64-linux-gnu-gcc \
            bash tests/external/linux/build_runtime_initramfs.sh

      - name: Build Linux 6.6.143 GCC baseline Image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          # Fresh GNU reference campaign: the historical mixed-MiniC cache
          # used config e538a6..., but today's GCC/Kconfig yields its own
          # reproducible config. Only compare MiniC against THIS same config.
          actual_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          echo "GNU_GOLDEN_CONFIG sha=$actual_config historical_mixed=e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 Image
          final_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test "$final_config" = "$actual_config"
          echo "GNU_GOLDEN_CONFIG_STABLE=PASS sha=$final_config"
          test -s "$out/arch/riscv/boot/Image"
          file "$out/arch/riscv/boot/Image"
          echo "LINUX_RUNTIME_GCC_IMAGE=PASS release=6.6.143"

      - name: Run Python-era runtime contract against GCC baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu" \
          LINUX_RELEASE=6.6.143 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
          QEMU_SHELL_INPUT_DELAY_SECONDS=8 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_BASELINE=PASS lanes=2/2 head=$GITHUB_SHA"

      - name: Calibrate P1 syscall profile against GCC reference
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu-p1" \
          LINUX_RELEASE=6.6.143 \
          LINUX_RUNTIME_PROFILE=p1 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_P1=PASS syscalls=12 head=$GITHUB_SHA"

      - name: Certify pure-GNU exact-config object pool after QEMU contracts
        id: exact_gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          out="$work/out"
          # Certified GCC .config identity is this run's actual SHA, not a
          # borrowed SHA from the historical mixed-compiler experiment.
          actual=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test -n "$actual"
          test -s "$out/vmlinux"
          test -s "$out/arch/riscv/boot/Image"
          test -s "$out/built-in.a"
          test -s "$out/lib/lib.a"
          mkdir -p "$work/provenance"
          # The default GCC kernel compiles fewer C owners than the 3352
          # frozen candidate-TU corpus. Only record RISC-V ET_REL objects;
          # HOSTCC-generated native ELF objects are not Linux swap targets.
          python3 - "$out" "$work/provenance/gcc-objects.sha256" <<'PY_GCC_POOL'
          import hashlib
          from pathlib import Path
          import struct
          import sys
          out, dest = map(Path, sys.argv[1:])
          total = 0
          with dest.open("w", encoding="utf-8") as manifest:
              for obj in sorted(out.rglob("*.o")):
                  with obj.open("rb") as src:
                      header = src.read(20)
                  if (len(header) < 20 or header[:4] != b"\x7fELF"
                      or header[5] != 1
                      or struct.unpack_from("<H", header, 16)[0] != 1
                      or struct.unpack_from("<H", header, 18)[0] != 243):
                      continue
                  digest = hashlib.sha256()
                  with obj.open("rb") as src:
                      for data in iter(lambda: src.read(1048576), b""):
                          digest.update(data)
                  manifest.write(f"{digest.hexdigest()}  {obj.relative_to(out)}\n")
                  total += 1
          print(f"GNU_RISCV_OBJECT_POOL objects={total} manifest={dest}")
          PY_GCC_POOL
          count=$(wc -l <"$work/provenance/gcc-objects.sha256")
          echo "GNU_GOLDEN_OBJECT_COUNT=$count"
          # Fail if Kbuild produced an implausibly small kernel object pool.
          test "$count" -ge 1500
          {
            echo "schema=linux-gnu-exact-config-v1"
            echo "linux_release=6.6.143"
            echo "linux_archive_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"
            echo "config_sha256=$actual"
            echo "gcc_version=$(riscv64-linux-gnu-gcc -dumpfullversion)"
            echo "gcc_target=$(riscv64-linux-gnu-gcc -dumpmachine)"
            echo "gcc_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)"
            echo "gnu_ld_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -d' ' -f1)"
            echo "gnu_ar_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ar)" | cut -d' ' -f1)"
            echo "gcc_object_count=$count"
            echo "vmlinux_sha256=$(sha256sum "$out/vmlinux" | cut -d' ' -f1)"
            echo "image_sha256=$(sha256sum "$out/arch/riscv/boot/Image" | cut -d' ' -f1)"
            echo "qemu_contract=full_and_p1_passed"
          } >"$work/provenance/gcc-baseline.txt"
          bin_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          key="linux-gnu-golden-v1-6.6.143-$actual-$bin_sig-$ld_sig"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "GNU_EXACT_GOLDEN=PASS objects=$count config=$actual cache_key=$key"
          du -sh "$out" || true

      - name: Save certified GNU Linux object pool for MiniC one-TU swaps
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.exact_gnu.outputs.key }}

      - name: Preserve runtime blocker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-gcc-blocker
          path: |
            build/linux-runtime-gcc/qemu/*.log
            build/linux-runtime-gcc/qemu-p1/*.log
            build/linux-runtime-gcc/out/.config
            build/linux-runtime-gcc/runtime-initramfs.cpio.gz
          if-no-files-found: ignore
          retention-days: 1

  gcc-single:
    # Reuse the EXISTING opt-in isolation job. ONE runner handles the entire
    # batch compile, two cohorts and any QEMU prefix bisection.
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[linux-runtime-gcc-cohort]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install GNU RISC-V toolchain and QEMU once
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross \
            python3 make cpio gzip || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      - name: Derive exact certified GNU golden cache key
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - name: Restore QEMU-certified GNU golden objects
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.identity.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore pinned Linux 6.6.143 source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Derive full same-config GCC C object universe
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          # Rapid diagnostic: exactly 384 objects, not the whole C universe.
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') }}" == true ]]; then
            python3 - "$ev/full-objects.txt" <<'PY_DIAGNOSTIC'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          objects=[x for x in p.read_text().splitlines() if x and not x.startswith("#")]
          assert len(objects)>=384
          p.write_text("# DIAGNOSTIC_384_FROM_PINNED_GNU_FULL_C_UNIVERSE\n"
                       + "\n".join(objects[:384]) + "\n")
          print("COHORT_SCOPE=DIAGNOSTIC_384 objects=384")
          PY_DIAGNOSTIC
          fi
          # Fast exact-config one-object compile/ABI/symbol oracle.  It is
          # deliberately NOT an Image/QEMU verdict; no new workflow/job.
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') }}" == true ]]; then
            grep -Fxq kernel/dma/direct.o "$ev/full-objects.txt"
            printf '%s\n' kernel/dma/direct.o > "$ev/full-objects.txt"
            echo "COHORT_SCOPE=DMA_SINGLE_COMPILE_ONLY objects=1"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            for owner in kernel/dma/direct.o mm/truncate.o mm/shmem.o; do
              grep -Fxq "$owner" "$ev/full-objects.txt"
            done
            printf '%s\n' kernel/dma/direct.o mm/truncate.o mm/shmem.o > "$ev/full-objects.txt"
            echo "COHORT_SCOPE=LINK_TRIAD_COMPILE_ONLY objects=3"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') }}" == true ]]; then
            grep -Fxq mm/shmem.o "$ev/full-objects.txt"
            printf '%s\n' mm/shmem.o > "$ev/full-objects.txt"
            echo "COHORT_SCOPE=SHMEM_SINGLE_COMPILE_ONLY objects=1"
          fi

      - name: Compute pinned MiniC candidate object cache identity
        id: candidate_id
        shell: bash
        run: |
          set -Eeuo pipefail
          # Must be computed from the CLEAN sources, before 39 MiniC
          # runtime-profile patches modify src/ in place.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          objects=$(sha256sum build/linux-runtime-gcc-cohort-v1/full-objects.txt | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "key=gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$objects-$gcc-$assembler" >>"$GITHUB_OUTPUT"

      - name: Restore exact ABI-validated MiniC candidate objects
        id: candidate_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ steps.candidate_id.outputs.key }}

      - name: Build MiniC once and produce authenticated C candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          # Kbuild .cmd depends on the producer's exact source path.
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          export COHORT_ALLOW_DIAGNOSTIC_384=${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') && '1' || '0' }}
          export COHORT_ALLOW_SHARD=${{ (contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || (contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]'))) && '1' || '0' }}
          export COHORT_ACTION=compile
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" \
            "$ev/full-objects.txt" "$ev"

      - name: Check completed full MiniC object pool is cacheable
        id: candidate_ready
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          if test -s "$ev/full-objects.txt"; then
            count=$(grep -cE '^[^#[:space:]]+\.o$' "$ev/full-objects.txt" || true)
          else
            count=0
          fi
          min_count=384
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') }}" == true ]]; then
            min_count=1
            test "$count" -eq 1
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            min_count=3
            test "$count" -eq 3
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') }}" == true ]]; then
            min_count=1
            test "$count" -eq 1
          fi
          if test "$count" -ge "$min_count" && \
             test -s "$ev/cohort.log" && \
             { grep -Fq "COHORT_COMPILE=PASS objects=$count" "$ev/cohort.log" || \
               grep -Fq "COHORT_CANDIDATE_CACHE=HIT objects=$count" "$ev/cohort.log"; } && \
             test -s "$ev/minic-manifest.sha256" && \
             test -s "$ev/minic-identity.txt" && \
             grep -Fq "COHORT_ABI=PASS objects=$count" "$ev/cohort.log" && \
             (cd "$ev"; sha256sum --quiet -c minic-manifest.sha256); then
            echo "ready=true" >>"$GITHUB_OUTPUT"
            echo "COHORT_CANDIDATE_READY=PASS objects=$count"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "COHORT_CANDIDATE_READY=FAIL count=$count (check MiniC trace, ABI and candidate hashes)" >&2
            exit 1
          fi

      - name: Save immutable MiniC objects despite later link or QEMU failure
        if: always() && steps.candidate_ready.outputs.ready == 'true' && steps.candidate_restore.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ steps.candidate_id.outputs.key }}

      # This boundary is essential: a subsequent GNU relink/QEMU failure
      # must NEVER waste the expensive, already-verified candidate objects.
      - name: Prove exact Linux link blocker symbols are absent
        if: (contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]')) && steps.candidate_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            obj="$ev/minic/kernel/dma/direct.o"
            test -s "$obj"
            riscv64-linux-gnu-nm -u "$obj" >"$ev/dma-undefined.txt"
            if grep -F 'arch_dma_set_uncached' "$ev/dma-undefined.txt"; then
              echo 'GNU_MINIC_DMA_SINGLE=FAIL undefined_arch_dma_set_uncached'
              exit 1
            fi
            echo 'GNU_MINIC_DMA_SINGLE=PASS missing_symbol_absent=1 exact_kernel_tu=1 abi=PASS'
          fi
          targets=()
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            targets=('mm/truncate.o:dax_delete_mapping_entry' 'mm/shmem.o:__compiletime_assert_')
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') }}" == true ]]; then
            targets=('mm/shmem.o:__compiletime_assert_')
          fi
          for pair in "${targets[@]}"; do
            target=${pair%%:*}
            bad=${pair#*:}
            obj="$ev/minic/$target"
            test -s "$obj"
            name=${target##*/}
            riscv64-linux-gnu-nm -u "$obj" >"$ev/$name.undefined.txt"
            if grep -F "$bad" "$ev/$name.undefined.txt"; then
              echo "GNU_MINIC_LINK_BLOCKER=FAIL owner=$target symbol=$bad"
              exit 1
            fi
            echo "GNU_MINIC_LINK_BLOCKER_OWNER=PASS owner=$target symbol=$bad"
          done
          echo "GNU_MINIC_LINK_BLOCKERS=PASS checked=${#targets[@]}"

      - name: GNU relink and QEMU from authenticated MiniC objects
        if: "!(contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]'))"
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.candidate_ready.outputs.ready }}" = true
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          export COHORT_ALLOW_DIAGNOSTIC_384=${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') && '1' || '0' }}
          export COHORT_ACTION=verify
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve compilation, GNU object identities, QEMU verdicts and bisection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-full-c-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/full-objects.txt
            build/linux-runtime-gcc-cohort-v1/non-c-objects.tsv
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/compile.log
            build/linux-runtime-gcc-cohort-v1/compile-blockers.txt
            build/linux-runtime-gcc-cohort-v1/mini-success-objects.txt
            build/linux-runtime-gcc-cohort-v1/failure-pool-index.tsv
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.i
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.stderr
            build/linux-runtime-gcc-cohort-v1/source-aliases.txt
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/gcc-objects-stable.sha256
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
            build/linux-runtime-gcc-cohort-v1/dma-undefined.txt
            build/linux-runtime-gcc-cohort-v1/*.undefined.txt
            build/linux-runtime-gcc-cohort-v1/shmem-assert-context.txt
            build/linux-runtime-gcc-cohort-v1/frontier.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/link.log
            build/linux-runtime-gcc-cohort-v1/trials/*/link-repaired.log
            build/linux-runtime-gcc-cohort-v1/trials/*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/*/generated-before.json
            build/linux-runtime-gcc-cohort-v1/trials/*/selected-objects.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1-python.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-p1/*.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu/*.log
            build/linux-runtime-gcc-cohort-v1/compiler/toolchain-timing.txt
          if-no-files-found: warn
          retention-days: 7

  # Explicit, optional 7-runner producer for the same pure-GCC C universe.
  # Do not use this lane for everyday single-TU debugging.
  gcc-shards:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-gcc-sharded]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install pinned GNU RISC-V build tools
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make cpio gzip || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                libc6-dev-riscv64-cross python3 make cpio gzip
            }

      - name: Identify certified exact-config GNU golden pool
        id: gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.gnu.outputs.key }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Derive identical full universe and this shard
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/all-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          python3 tools/ci/linux-runtime-gcc-shards-v1.py split \
            --full "$ev/all-objects.txt" \
            --shard ${{ matrix.shard }} --output "$ev/full-objects.txt"

      - name: Identify immutable MiniC shard artifact
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          # Profile source identity MUST be obtained before patching src/.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          subset=$(sha256sum "build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/full-objects.txt" | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "key=gnu-minic-shard-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$subset-$gcc-$assembler" >>"$GITHUB_OUTPUT"

      - name: Restore this shard's immutable candidate objects
        id: shard_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-identity.txt
          key: ${{ steps.candidate.outputs.key }}

      - name: Build MiniC and prove this exact shard
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          export COHORT_ACTION=compile COHORT_ALLOW_SHARD=1
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Authenticate shard before cache or export
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          n=$(grep -cE '^[^#[:space:]]+\.o$' "$ev/full-objects.txt")
          test "$n" -gt 0
          grep -Fq "COHORT_ABI=PASS objects=$n" "$ev/cohort.log"
          grep -Fq "COHORT_PRODUCE_ONLY=PASS objects=$n" "$ev/cohort.log"
          test -s "$ev/minic-identity.txt"
          (cd "$ev"; sha256sum --quiet -c minic-manifest.sha256)
          echo "GNU_MINIC_SHARD_READY=PASS shard=${{ matrix.shard }} objects=$n"

      - name: Cache completed shard independently of later link failures
        if: steps.shard_cache.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-identity.txt
          key: ${{ steps.candidate.outputs.key }}

      - name: Transfer only candidate objects and attestations
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-identity.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/full-objects.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/cohort.log
          if-no-files-found: error
          retention-days: 3

      - name: Keep bounded failed-TU evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-shard-${{ matrix.shard }}
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/compile.log
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/compile-blockers.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/failure-pool-index.tsv
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.i
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.stderr
          if-no-files-found: ignore
          retention-days: 3

  gcc-shard-verify:
    needs: gcc-shards
    # Use the SAME receiver job for exact immutable Image reboots. When the
    # seven producer jobs are skipped, always() prevents needs' implicit skip;
    # the ordinary full-shard path still requires a successful producer.
    if: always() && github.event_name == 'push' && ((contains(github.event.head_commit.message, '[linux-runtime-gcc-sharded]') && needs.gcc-shards.result == 'success') || contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') || contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') || contains(github.event.head_commit.message, '[linux-runtime-stack-owners]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install minimal pinned GNU binutils and GCC for P1 object-only audit
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3

      - name: Install pinned GNU RISC-V tools and QEMU
        # Azure apt mirror transiently exceeded 5m (run 38256038299); allow
        # package downloads without mistaking environment for compiler failure.
        timeout-minutes: 12
        if: "!contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')"
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross \
            python3 make cpio gzip device-tree-compiler || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      # Reuse the exact 215511040-byte Image from the previous 2064-object
      # successful GNU link. This opt-in path never rebuilds or relinks C.
      - name: Restore immutable full MiniC Linux Image from earlier CI
        if: contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')
        uses: actions/download-artifact@v4
        with:
          run-id: 38204602644
          github-token: ${{ github.token }}
          name: sharded-gnu-minic-QEMU-d5dde03594665842f2bb3b8556f842f511a5dfa4
          path: build/linux-runtime-large-image-qemu-v0/source-artifact

      - name: Run original Image in 2G QEMU against P0 P1 and shell oracles
        if: contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-runtime-large-image-qemu-v0.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-large-image-qemu-v0/source-artifact"

      - name: Preserve exact large Image boot and failure evidence
        if: always() && contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-large-image-qemu-${{ github.sha }}
          path: |
            build/linux-runtime-large-image-qemu-v0/provenance.txt
            build/linux-runtime-large-image-qemu-v0/initramfs.log
            build/linux-runtime-large-image-qemu-v0/*.stdout.log
            build/linux-runtime-large-image-qemu-v0/qemu-*/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install P1 RISC-V GDB debugger
        if: contains(github.event.head_commit.message, '[linux-runtime-gdb-stack]') || contains(github.event.head_commit.message, '[linux-runtime-p1-pair-debug]')
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends gdb-multiarch

      - name: Restore identical certified GNU golden objects
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "GNU_GOLDEN_KEY=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig"
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')"
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ env.key }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/linux-runtime-restore-fixture
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')"
        with:
          fixture: source

      - name: Reconstruct complete GNU C manifest
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" --min-c-objects 1200
          # Compute stable profile ID from pristine MiniC sources, BEFORE
          # applying any of the build-time profile patches.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          objects=$(sha256sum "$ev/full-objects.txt" | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "FULL_MINIC_KEY=gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$objects-$gcc-$assembler" >>"$GITHUB_ENV"

      # The exact 2064 MiniC .o cache was already SHA/ABI-certified in
      # full CI #38204602644. This lane only resolves P1 crash symbol owners
      # and compares stack prologues with the certified pure-GNU .o pool.
      - name: Restore immutable 2064-object MiniC cache for P1 diagnosis
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') || contains(github.event.head_commit.message, '[linux-runtime-stack-owners]')
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ env.FULL_MINIC_KEY }}
          fail-on-cache-miss: true

      - name: Locate real P1 crash owners and compare RV64 stack prologues
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          (cd "$ev" && sha256sum --status -c minic-manifest.sha256)
          python3 tools/ci/linux-runtime-p1-frame-audit-v1.py \
            "$ev/minic" "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            "$ev/p1-frame-audit"

      - name: Restore unchanged P1 panic call trace from certified full Image
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')
        uses: actions/download-artifact@v4
        with:
          run-id: 38207896965
          github-token: ${{ github.token }}
          name: minic-large-image-qemu-3e73328c2182f9cebb713e4595d2bf85067ac5b1
          path: build/linux-runtime-gcc-cohort-v1/p1-crash-artifact

      - name: Extract full original P1 kernel call trace from unchanged Image
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          source="$ev/p1-crash-artifact/qemu-p1/rdinit-init.log"
          test -s "$source"
          python3 - "$source" "$ev/p1-frame-audit/panic-calltrace.txt" <<'PY_PANIC'
          from pathlib import Path
          import sys
          src,out=map(Path,sys.argv[1:])
          lines=src.read_text(errors="replace").splitlines()
          triggers=[i for i,l in enumerate(lines) if "Insufficient stack space to handle exception!" in l]
          if not triggers:
              raise SystemExit("P1_PANIC_TRACE=FAIL stack_overflow_marker_missing")
          evidence=[]
          for i in triggers:
              evidence.extend(lines[max(0,i-24):min(len(lines),i+180)])
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text("\\n".join(evidence)+"\\n")
          print(f"P1_PANIC_TRACE=PASS repeats={len(triggers)} lines={len(evidence)}")
          for line in evidence[-150:]:
              print(line)
          PY_PANIC

      - name: Preserve P1 crash owner and stack audit
        if: always() && contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')
        uses: actions/upload-artifact@v4
        with:
          name: minic-p1-stack-owners-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/p1-frame-audit/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-frame-audit/*.txt
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/download-artifact@v4
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-runtime-stack-owners]')"
        with:
          pattern: shard-*
          path: build/linux-runtime-gcc-shards-v1
          merge-multiple: false

      - name: Build identical MiniC profile and verify exact shard union
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-runtime-stack-owners]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          python3 tools/ci/linux-runtime-gcc-shards-v1.py merge \
            --full "$ev/full-objects.txt" \
            --shards "$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1" \
            --evidence "$ev" --out "$work/out" --provenance "$work/provenance" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --assembler /usr/bin/riscv64-linux-gnu-as

      - name: Retain fully verified MiniC objects before link or runtime
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-runtime-stack-owners]')"
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ env.FULL_MINIC_KEY }}

      - name: Restore pristine Linux source and MiniC profile for frozen P1 swaps
        if: contains(github.event.head_commit.message, '[linux-runtime-stack-owners]')
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          echo "COHORT_P1_OWNER_POOL=PASS objects=$(wc -l <"$ev/minic-manifest.sha256") frozen=true"

      # Do not alter the stable runtime profile cache ID: build the EXACT
      # profile first, then inject stderr-only instrumentation. The cohort
      # lane SHA-compares each replayed object with its immutable MiniC .o.
      - name: Instrument original MiniC profile for exact P1 frame audit
        if: contains(github.event.head_commit.message, '[linux-runtime-frame-components]') || contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]')
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain"
          sha256sum "$work/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-pre-audit-compiler.sha256"
          python3 tools/ci/apply-riscv64-p1-frame-diagnostic-v1.py
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]') && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-riscv64-p1-nonreuse-reasons-v1.py
          fi
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work" "$work/bin/minic" "$work/bin/minic-cc"
          sha256sum "$work/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-diagnostic-compiler.sha256"
          echo "P1_FRAME_DIAG=COMPILER_REBUILT same_codegen_only_extra_stderr=true"

      # The default 2064-object Runtime profile and cache remain untouched.
      # This experiment is fail-closed and never updates the canonical compiler.
      - name: Build opt-in write-before-read cross-block MiniC experiment
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-defined-crossblock]') || contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]')
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain"
          sha256sum "$build/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-pre-crossblock-compiler.sha256"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-p1-pure-discarded-local-address-equality-v1.py
          else
            python3 tools/ci/apply-riscv64-p1-defined-before-use-crossblock-v1.py
          fi
          if [[ "${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]')) && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-riscv64-p1-frame-diagnostic-v1.py
          fi
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" "$build/bin/minic" "$build/bin/minic-cc"
          sha256sum "$build/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-crossblock-compiler.sha256"
          echo "P1_DEFINED_CROSSBLOCK=COMPILER_BUILT opt_in_only=true"

      - name: GNU-only link and QEMU with NO MiniC recompilation
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          export COHORT_ACTION=verify
          export COHORT_P1_STACK_OWNER_SWAPS=${{ contains(github.event.head_commit.message, '[linux-runtime-stack-owners]') && '1' || '0' }}
          export COHORT_P1_IDENTICAL_IMAGE_REPEAT=${{ contains(github.event.head_commit.message, '[linux-runtime-repeat-image]') && '1' || '0' }}
          export COHORT_P1_GDB_STACK=${{ contains(github.event.head_commit.message, '[linux-runtime-gdb-stack]') && '1' || '0' }}
          export COHORT_P1_MULTI_RESCUE=${{ contains(github.event.head_commit.message, '[linux-runtime-multi-rescue]') && '1' || '0' }}
          export COHORT_P1_MINIMIZE_RESCUE=${{ contains(github.event.head_commit.message, '[linux-runtime-rescue-minimize]') && '1' || '0' }}
          export COHORT_P1_PAIR_RESCUE=${{ contains(github.event.head_commit.message, '[linux-runtime-rescue-pairs]') && '1' || '0' }}
          export COHORT_P1_PAIR_DEBUG=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-pair-debug]') && '1' || '0' }}
          export COHORT_P1_DEFINED_CROSSBLOCK=${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-defined-crossblock]') || contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]')) && '1' || '0' }}
          export COHORT_P1_DISCARD_EQ=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') && '1' || '0' }}
          export COHORT_P1_SINGLE_OWNER=${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]')) && '1' || '0' }}
          if [[ "$COHORT_P1_SINGLE_OWNER" == 1 ]]; then
            [[ "$COHORT_P1_DEFINED_CROSSBLOCK" == 1 && "$COHORT_P1_PAIR_RESCUE" == 0 ]] || {
              echo "P1_IP6_SINGLE=INVALID conflicting_experiment_flags"; exit 8;
            }
            echo "P1_IP6_SINGLE=ENABLED replay=ip6_output.o gcc=tcp_ipv6.o unchanged_others=2062"
          fi
          export COHORT_FRAME_CAPTURE_ONLY=${{ (contains(github.event.head_commit.message, '[linux-runtime-frame-components]') || contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]')) && '1' || '0' }}
          export COHORT_NONREUSE_REASON_CAPTURE=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]') && '1' || '0' }}
          export MINIC_CORE_FRAME_TRACE_FILTER=ip6_finish_output2,ip6_xmit,tcp_v6_connect,__tcp_transmit_skb
          # #38219062394 identified 4064B and 2288B MiniC stack frames in
          # ip6_finish_output2 and ip6_xmit. Test the containing C owner,
          # then tcp_output, with all other 2063 objects pinned unchanged.
          if [[ "${COHORT_P1_STACK_OWNER_SWAPS}" == 1 ]]; then
            export COHORT_P1_SWAP_OWNERS="net/ipv6/ip6_output.o net/ipv4/tcp_output.o"
            if [[ "${COHORT_P1_IDENTICAL_IMAGE_REPEAT}" == 1 ]]; then
              export COHORT_P1_SWAP_OWNERS="net/ipv6/ip6_output.o"
            fi
          fi
          export COHORT_CAPTURE_ONLY=${{ contains(github.event.head_commit.message, '[linux-runtime-earlycon-capture]') && '1' || '0' }}
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve aggregate link, QEMU and failure-frontier evidence
        if: always() && !contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')
        uses: actions/upload-artifact@v4
        with:
          name: sharded-gnu-minic-QEMU-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/full-objects.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/frontier.txt
            build/linux-runtime-gcc-cohort-v1/p1-owner-verdicts.tsv
            build/linux-runtime-gcc-cohort-v1/p1-multi-rescue-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-minimize.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-minimize-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-pairs.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-pairs-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.log
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.gdb
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1_gcc_rescue_set.txt
            build/linux-runtime-gcc-cohort-v1/p1-identical-image-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.log
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.gdb
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu/rdinit-init.log
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.log
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.i.gz
            build/linux-runtime-gcc-cohort-v1/p1-*-audit-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-diagnostic-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-pre-crossblock-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-crossblock-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.log
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.log
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1-owner-hit.txt
            build/linux-runtime-gcc-cohort-v1/p1-list-debug-disasm.txt
            build/linux-runtime-gcc-cohort-v1/trials/full_all/Image
            build/linux-runtime-gcc-cohort-v1/trials/*/link.log
            build/linux-runtime-gcc-cohort-v1/trials/*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/*/earlycon-source/*
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1.log
          if-no-files-found: warn
          retention-days: 7

  # Opt-in hotfix diagnostic: reuse authenticated 2064 old MiniC objects
  # but replace only earlycon.o with the current patched MiniC profile.
  # No new workflow, no rebuilding the 2063 unaffected C translation units.
  gcc-earlycon-hotfix:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[linux-runtime-earlycon-hotfix]') || contains(github.event.head_commit.message, '[linux-runtime-core-capture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install pinned RISC-V GNU tools and QEMU
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      - name: Identify exact pure-GNU golden reference
        id: golden
        shell: bash
        run: |
          set -Eeuo pipefail
          cfg=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$cfg-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - name: Restore QEMU-certified GCC golden object tree
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.golden.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore old authenticated 2064 MiniC object pool
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          # Exact immutable key from pre-fix CI #38051834014, not restore-keys.
          key: gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-d19c855bc2650568f84a73a8a17e2b8be42faee80d0ed22913588bb4d8df7822-1d1c8d09cfffddb37990552ae6392181a42d55332e48232dce27e7305d7e770b-0c2a199ea3ae14d39b008fd4080d4b18d675b07daa17976c7d9755e8ea67310b-d072447ef15a207422bf4874920221c41af7a771d1dbae770855cf3d6220a507
          fail-on-cache-miss: true

      - name: Restore exact Linux 6.6.143 source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Recover certified full-C same-config object order
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          source="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$source"
          test ! -e "$work/linux-6.6.143"
          cp -a --reflink=auto "$source" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$work/out" --manifest "$work/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          test "$(grep -Ec '^[^#[:space:]]+\.o$' "$ev/full-objects.txt")" = 2064

      - name: Capture exact Netfilter GNU and MiniC cached objects only
        if: contains(github.event.head_commit.message, '[linux-runtime-core-capture]')
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/core-capture
          d=build/core-capture
          gcc="$GITHUB_WORKSPACE/build/linux-runtime-gcc/out/net/netfilter/core.o"
          minic="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/minic/net/netfilter/core.o"
          test -s "$gcc" && test -s "$minic"
          cp "$gcc" "$d/gcc-core.o"
          cp "$minic" "$d/minic-core.o"
          sha256sum "$gcc" "$minic" >"$d/identities.sha256"
          riscv64-linux-gnu-objdump -dr --disassemble=nf_hook_entries_grow "$gcc" >"$d/gcc.nf_hook_entries_grow.disasm"
          riscv64-linux-gnu-objdump -dr --disassemble=nf_hook_entries_grow "$minic" >"$d/minic.nf_hook_entries_grow.disasm"
          riscv64-linux-gnu-nm --defined-only "$minic" >"$d/minic.symbols"
          # Recover the next fault's exact mm/gup.c owner without linking a
          # kernel; test whether generic MiniC corrections alter its code.
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          gup_gcc="$work/out/mm/gup.o"
          gup_old="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/minic/mm/gup.o"
          test -s "$gup_gcc" && test -s "$gup_old"
          sha256sum "$gup_old" >"$d/gup.old-object.sha256"
          riscv64-linux-gnu-objdump -dr --disassemble=__minic_inline_spec_9309_155 \
            "$gup_old" >"$d/gup.old-fault-inline.disasm"
          make -C "$work/linux-6.6.143" O="$work/out" ARCH=riscv \
            CROSS_COMPILE=riscv64-linux-gnu- mm/gup.i >"$d/gup.preprocess.log" 2>&1
          cp "$work/out/mm/gup.i" "$d/gup.exact.i"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$d/gup-compiler"
          "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            -S "$d/gup.exact.i" -o "$d/gup.current-minic.s" \
            >"$d/gup.current.stdout" 2>"$d/gup.current.stderr"
          riscv64-linux-gnu-gcc -c "$d/gup.current-minic.s" -o "$d/gup.current-minic.o"
          riscv64-linux-gnu-objdump -dr --disassemble=__minic_inline_spec_9309_155 \
            "$d/gup.current-minic.o" >"$d/gup.current-fault-inline.disasm"
          sha256sum "$d/gup.current-minic.o" >"$d/gup.current-object.sha256"
          echo "GUP_EXACT_CAPTURE=PASS old=$(sha256sum "$gup_old" | cut -d' ' -f1) current=$(sha256sum "$d/gup.current-minic.o" | cut -d' ' -f1)"
          echo "NETFILTER_EXACT_OWNER_CAPTURE=PASS"
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[linux-runtime-core-capture]')
        with:
          name: netfilter-core-gnu-minic-cache-exact
          path: build/core-capture/
          retention-days: 2
      - name: Build current patched MiniC compiler only once
        if: "!contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/compiler"

      - name: Validate QMP sampler before expensive GNU linking
        if: "!contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-runtime-qmp-pc-sampler-v1.py --self-test
          python3 -m py_compile tools/ci/linux-runtime-qmp-pc-sampler-v1.py tools/ci/linux-runtime-qmp-stack-symbols-v1.py tools/ci/linux-runtime-gdb-boundary-v1.py
          sock="/tmp/minic-gdb-preflight-$.sock"
          qemu-system-riscv64 -M virt -cpu max -m 512M -nographic -no-reboot -bios none -S \
            -chardev "socket,path=$sock,server=on,wait=off,id=gdb0" \
            -gdb chardev:gdb0 </dev/null > /tmp/minic-gdb-stub-preflight.log 2>&1 &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || :; wait "$qpid" 2>/dev/null || :; rm -f -- "$sock"' EXIT
          ready=0
          for i in $(seq 1 50); do
            if test -S "$sock"; then ready=1; break; fi
            if ! kill -0 "$qpid" 2>/dev/null; then break; fi
            sleep .1
          done
          if ((ready==0)); then
            cat /tmp/minic-gdb-stub-preflight.log
            echo "GDB_STUB_PREFLIGHT=FAIL"
            exit 1
          fi
          echo "GDB_STUB_PREFLIGHT=PASS unix_socket=true"
          kill "$qpid" 2>/dev/null || :
          wait "$qpid" 2>/dev/null || :
          rm -f -- "$sock"
          trap - EXIT

      - name: Recompile earlycon.o only, GNU link and compare QEMU frontier
        if: "!contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          chmod +x tests/external/linux/qemu_explicit_initrd_wrapper.py
          export COHORT_ACTION=verify COHORT_EARLYCON_HOTFIX=1 COHORT_PATCH_SUPER_V1=1 COHORT_PATCH_NET_PAIR=1 COHORT_NETWORK_CAPTURE_ONLY=0 COHORT_FAULT_OWNER_MAP=1 COHORT_FAULT_OWNER_SYMBOL=__minic_inline_spec_999_52 COHORT_FAULT_OWNER_COMPANION=__minic_inline_spec_10691_62 COHORT_FAULT_OWNER_EXTRA_NETLINK=0 COHORT_EARLYCON_EXPLICIT_INITRD=0 COHORT_EARLYCON_EXPLICIT_SHELL=0 COHORT_NEXT_FAULT_DIAG=0 COHORT_UART_EARLYCON=1 COHORT_NEXT_GCC_SWAPS=1 COHORT_NEXT_GCC_TARGET= COHORT_QMP_STOP_SNAPSHOT=1 COHORT_SPINLOCK_CAPTURE_ONLY=0 COHORT_REPAIR_RUNTIME_OWNER=1 COHORT_REPAIR_INET_CSK_OWNER=1 COHORT_REPAIR_INET_HASHTABLES_OWNER=1 COHORT_NEXT_GCC_EXPLICIT_INITRD=1 COHORT_GDB_SWAP=0 COHORT_GDB_BOUNDARY=0 LINUX_RUNTIME_EARLYCON_ARG=earlycon=uart8250,mmio,0x10000000,115200n8
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve single-object experiment evidence
        if: "always() && !contains(github.event.head_commit.message, '[linux-runtime-core-capture]')"
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-earlycon-one-object-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/earlycon-hotfix/
            build/linux-runtime-gcc-cohort-v1/fault-owner/*
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/link*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qmp*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-uart-earlycon.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/uart-qmp/*
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/gdb-boundary/*
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/qemu-uart-earlycon.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_*/uart-qmp/qmp-probe.log
