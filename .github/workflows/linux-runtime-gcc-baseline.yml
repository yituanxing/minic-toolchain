          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/perf-ab.tsv
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/perf-ab-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Keep bounded failed-TU evidence
        if: failure() && !contains(github.event.head_commit.message, '[linux-minias-seven-shards]') && !contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && !contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        uses: actions/upload-artifact@v4
        with:
