        run: |
          set -Eeuo pipefail
          image="$GITHUB_WORKSPACE/build/rv32i-linux-entry/out/arch/riscv/boot/Image"
          test -s "$image"
          sha=$(sha256sum "$image" | cut -d ' ' -f1)
          dir="$GITHUB_WORKSPACE/build/rv32i-linux-entry/current-qemu-p1"
          mkdir -p "$dir/trials"
          printf 'attempt\timage_sha256\tverdict\n' > "$dir/p1-repeats.tsv"
          printf 'commit=%s\nimage_sha256=%s\nproducer_run=%s\n' \
            "$GITHUB_SHA" "$sha" "$GITHUB_RUN_ID" > "$dir/source-identity.txt"
          # Verify a real ELF32 shell in this exact newly linked kernel.
          RV32I_QEMU_P1=1 RV32I_QEMU_SHELL=1 \
          RV32I_QEMU_IMAGE="$image" \
          RV32I_QEMU_WORK="$dir/shell" \
          RV32I_QEMU_TIMEOUT_SECONDS=45 \
            bash tools/ci/linux-rv32i-qemu-p0-v1.sh
          echo "RV32I_CURRENT_HEAD_SHELL=PASS image_sha256=$sha"
          # Canonical P1 manifest: fork/exec/wait, 12 syscall families,
          # clean powerdown, and one SHA-locked Image for all twelve boots.
          for attempt in $(seq 1 12); do
            work="$dir/trials/$attempt"
            if RV32I_QEMU_P1=1 \
               RV32I_QEMU_IMAGE="$image" \
               RV32I_QEMU_WORK="$work" \
               RV32I_QEMU_TIMEOUT_SECONDS=45 \
                 bash tools/ci/linux-rv32i-qemu-p0-v1.sh; then
              actual=$(sha256sum "$image" | cut -d ' ' -f1)
              test "$actual" = "$sha"
              printf '%s\t%s\tPASS\n' "$attempt" "$sha" >> "$dir/p1-repeats.tsv"
              echo "RV32I_CURRENT_HEAD_P1_TRIAL=PASS attempt=$attempt/12 image_sha256=$sha syscalls=12/12"
            else
              printf '%s\t%s\tFAIL\n' "$attempt" "$sha" >> "$dir/p1-repeats.tsv"
              echo "RV32I_CURRENT_HEAD_P1_TRIAL=FAIL attempt=$attempt/12 image_sha256=$sha" >&2
              exit 1
            fi
          done
          test "$(awk -F '\t' '$3=="PASS"{n++} END{print n+0}' "$dir/p1-repeats.tsv")" -eq 12
          test "$(tail -n +2 "$dir/p1-repeats.tsv" | cut -f2 | sort -u | wc -l)" -eq 1
          test "$(sha256sum "$image" | cut -d ' ' -f1)" = "$sha"
          echo "RV32I_CURRENT_HEAD_P1=PASS boots=12/12 syscalls=12/12 MiniC_C=1741/1741 original_Kbuild=true ELF32=true immutable_Image=$sha"

      - name: Preserve independently attested RV32 seven-shard full Image result
        if: always() && (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        uses: actions/upload-artifact@v4
        with:
          name: linux-rv32i-seven-shard-Image-${{ github.sha }}
          path: |
            build/rv32i-linux-entry/merged/minic-identity.txt
            build/rv32i-linux-entry/merged/minic-manifest.sha256
            build/rv32i-linux-entry/merged/gnu-prepare.log
            build/rv32i-linux-entry/merged/minic-relink.log
            build/rv32i-linux-entry/merged/minic-relink-retry.log
            build/rv32i-linux-entry/merged/minic-owner-drift.tsv
            build/rv32i-linux-entry/merged/generated-before.json
            build/rv32i-linux-entry/merged/generated-after-first-link.json
            build/rv32i-linux-entry/merged/header-affected-objects.txt
            build/rv32i-linux-entry/merged/header-impact.log
            build/rv32i-linux-entry/merged/header-replay.log
            build/rv32i-linux-entry/merged/header-replay-hashes.sha256
            build/rv32i-linux-entry/merged/owner-restored.txt
            build/rv32i-linux-entry/merged/link-inputs/
            build/rv32i-linux-entry/merged/minic-vmlinux-elf.txt
            build/rv32i-linux-entry/merged/union-result.txt
            build/rv32i-linux-entry/current-qemu-p0/qemu-serial.log
            build/rv32i-linux-entry/current-qemu-p0/provenance.txt
            build/rv32i-linux-entry/current-qemu-p0/qemu-uart-serial.log
            build/rv32i-linux-entry/current-qemu-p0/qemu-debug.log
            build/rv32i-linux-entry/current-qemu-p1/source-identity.txt
            build/rv32i-linux-entry/current-qemu-p1/p1-repeats.tsv
            build/rv32i-linux-entry/current-qemu-p1/shell/qemu-serial.log
            build/rv32i-linux-entry/current-qemu-p1/trials/*/qemu-serial.log
            build/rv32i-linux-entry/current-qemu-p1/trials/*/provenance.txt
            build/rv32i-linux-entry/out/arch/riscv/boot/Image
          if-no-files-found: warn
          retention-days: 7

      - name: Download SHA-attested self-host Stage2 RV64 compiler
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux2064]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39040013459
          name: minic-current-bootstrap-b1-stage2-v1
          github-token: ${{ github.token }}
          path: build/bootstrap-stage2-linux2064/artifact

      - name: Download fixed-point nine-tool Stage4 RV64 compiler
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39058935623
          name: minic-current-bootstrap-stage2-native-runtime-v1
          github-token: ${{ github.token }}
          path: build/bootstrap-stage4-linux2064/artifact

      - name: Build identical MiniC profile and verify exact shard union
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-runtime-stack-owners]') && !contains(github.event.head_commit.message, '[linux-native-union-cached]') && !contains(github.event.head_commit.message, '[linux-minild-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-reloc-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-purgatory-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso64-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso32-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          # Keep receiver GNU Kbuild commands byte-identical to the golden.
          # A copied source tree changes .o.cmd dependency/command paths.
          test ! -e "$work/linux-6.6.143"
          ln -s "$src" "$work/linux-6.6.143"
          test -L "$work/linux-6.6.143"
          test "$(realpath "$work/linux-6.6.143")" = "$src"
          echo 'RV64_GNU_KBUILD_SOURCE_ALIAS=PASS lane=seven_receiver original_source_path=true'
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-full-crossblock]') && '1' || '0' }}" == 1 ]]; then
            export MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1
            echo "LINUX_FULL_CROSSBLOCK=RECEIVER_START shards=7 live_all_C=true full_GNU_link_QEMU=true"
          fi
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          if git log -1 --format=%B | grep -Fq '[minic-bootstrap-stage2-linux2064]'; then
            source tools/ci/minic-bootstrap-stage2-2064-prepare-v1.sh receiver "$ev"
          fi
          if git log -1 --format=%B | grep -Fq '[minic-bootstrap-stage4-linux2064]'; then
            source tools/ci/minic-bootstrap-stage4-2064-prepare-v1.sh receiver "$ev"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-integrated-full]') }}" == true ]]; then
            bash tools/ci/linux-perf-integrated-full-profile-v1.sh \
              "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
            echo "LINUX_PERF_3_RECEIVER=READY shards=7"
          fi
          balanced_args=()
          if [[ "${{ contains(github.event.head_commit.message, '[minic-gnu-balanced-full2064]') }}" == true ]]; then
            plan="$GITHUB_WORKSPACE/tools/ci/linux-gnu-balanced-plan-2026-10-17.json"
            python3 tools/ci/linux_gnu_balanced_plan_v1.py --owners "$ev/full-objects.txt" --plan "$plan"
            balanced_args=(--balanced-plan "$plan")
            echo "GNU_MINIC_BALANCED=RECEIVER_REQUIRE_SAME_PLAN source_run=39033023656"
          fi
          python3 tools/ci/linux-runtime-gcc-shards-v1.py merge \
            --full "$ev/full-objects.txt" \
            --shards "$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1" \
            --evidence "$ev" --out "$work/out" --provenance "$work/provenance" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --assembler /usr/bin/riscv64-linux-gnu-as "${balanced_args[@]}"

      - name: Restore identical MiniC compiler profile for native tool union (without rebuilding C objects)
        if: contains(github.event.head_commit.message, '[linux-native-union-cached]')
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && '1' || '0' }}" != 1 && "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '1' || '0' }}" != 1 ]]; then
            test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          fi
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          echo "NATIVE_UNION_COMPILER=READY recompiled_C=0 sources=canonical_main native_shard_reuse=${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && 'true' || 'false' }}"

      - name: Retain fully verified MiniC objects before link or runtime
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-runtime-stack-owners]') && !contains(github.event.head_commit.message, '[linux-native-union-cached]') && !contains(github.event.head_commit.message, '[linux-minild-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-reloc-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-purgatory-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso64-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso32-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux2064]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ env.FULL_MINIC_KEY }}

      - name: Restore pristine Linux source and MiniC profile for frozen P1 swaps
        if: contains(github.event.head_commit.message, '[linux-runtime-stack-owners]')
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          echo "COHORT_P1_OWNER_POOL=PASS objects=$(wc -l <"$ev/minic-manifest.sha256") frozen=true"

      # Do not alter the stable runtime profile cache ID: build the EXACT
      # profile first, then inject stderr-only instrumentation. The cohort
      # lane SHA-compares each replayed object with its immutable MiniC .o.
      - name: Instrument original MiniC profile for exact P1 frame audit
        if: contains(github.event.head_commit.message, '[linux-runtime-frame-components]') || contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]')
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain"
          sha256sum "$work/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-pre-audit-compiler.sha256"
          python3 tools/ci/apply-riscv64-p1-frame-diagnostic-v1.py
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]') && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-riscv64-p1-nonreuse-reasons-v1.py
          fi
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work" "$work/bin/minic" "$work/bin/minic-cc"
          sha256sum "$work/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-diagnostic-compiler.sha256"
          echo "P1_FRAME_DIAG=COMPILER_REBUILT same_codegen_only_extra_stderr=true"

      # The default 2064-object Runtime profile and cache remain untouched.
      # This experiment is fail-closed and never updates the canonical compiler.
      - name: Build opt-in write-before-read cross-block MiniC experiment
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-defined-crossblock]') || contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]'))
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain"
          sha256sum "$build/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-pre-crossblock-compiler.sha256"
          if [[ "${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]')) && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-p1-pure-discarded-local-address-equality-v1.py
          else
            python3 tools/ci/apply-riscv64-p1-defined-before-use-crossblock-v1.py
          fi
          if [[ "${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]'))) && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-riscv64-p1-frame-diagnostic-v1.py
          fi
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" "$build/bin/minic" "$build/bin/minic-cc"
          sha256sum "$build/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-crossblock-compiler.sha256"
          echo "P1_DEFINED_CROSSBLOCK=COMPILER_BUILT opt_in_only=true"

      - name: Run P1 experimental Core CFG semantic-only GCC and MiniC differential
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-cfg-semantic-only]')
        shell: bash
        run: |
          set -Eeuo pipefail
          # Exact Runtime profile+opt-in backend was built above, not the
          # unpatched stock MiniC. Avoid relinking or booting Linux here.
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends qemu-user
          minic="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/cfg-semantic-only"
          test -x "$minic"
          mkdir -p "$work"
          MINIC="$minic" WORK="$work/existing" RISCV_CC=riscv64-linux-gnu-gcc \
            QEMU_RISCV64=qemu-riscv64 \
            bash tests/compiler/c0/run-core-cfg-slot-reuse-p1.sh
          MINIC="$minic" WORK="$work/adversarial" RISCV_CC=riscv64-linux-gnu-gcc \
            QEMU_RISCV64=qemu-riscv64 \
            bash tests/compiler/c0/run-core-cfg-slot-reuse-adversarial-p1.sh
          MINIC="$minic" BUILD_DIR="$work" RISCV_CC=riscv64-linux-gnu-gcc \
            QEMU_RISCV64=qemu-riscv64 \
            bash tests/compiler/c0/run-pure-discarded-address-rv64.sh
          echo "P1_CFG_SEMANTIC_ONLY=PASS gcc_minic_baseline_crossblock=3way matrix=7+8 x1023 no_kernel_link=true no_linux_recompile=true"

      # Diagnostic-only: same exact GNU golden + SHA-authenticated 2064 MiniC
      # object fixture as native union; do not run Kbuild, linker or QEMU here.
      # Retain MiniC .s across MiniAS revisions so future work reassembles only.
      - name: Restore exact MiniC assembly sample for MiniAS (independent of MiniAS SHA)
        id: minias_corpus_s_cache
        if: contains(github.event.head_commit.message, '[linux-minias-corpus-scan]')
        uses: actions/cache/restore@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-64
          restore-keys: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-12

      - name: Probe representative real Linux MiniC assembly with MiniAS (no C objects rebuilt)
        if: contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') && !contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-matched-key }}" = "$FULL_MINIC_KEY"
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          tools="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tools" "$tools/bin/minic-as"
          python3 tools/ci/minias-linux-corpus-probe-v1.py \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --candidate-pool "$ev/minic" --manifest "$ev/minic-manifest.sha256" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --minias "$tools/bin/minic-as" \
            --work "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --cache-identity "$FULL_MINIC_KEY" --limit 64

      # Isolated full 2064-object assembly coverage; the 64 .s cache is the
      # bootstrap. No new workflow/jobs, no C-object compilation, and no
      # Kbuild/link/QEMU cost until the real assembly gaps are classified.
      - name: Restore expanded complete MiniC S corpus
        id: minias_full_s_cache
        if: contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        uses: actions/cache/restore@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-2064

      - name: Sweep all certified Linux C owners through native MiniAS
        if: contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        shell: bash
        timeout-minutes: 75
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          tools="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tools" "$tools/bin/minic-as"
          python3 tools/ci/minias-linux-full-corpus-v1.py \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --candidate-pool "$ev/minic" --manifest "$ev/minic-manifest.sha256" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --minias "$tools/bin/minic-as" \
            --work "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --cache-identity "$FULL_MINIC_KEY" --jobs 4

      - name: Save SHA-locked Linux S corpus for future MiniAS-only reassembly
        if: always() && contains(github.event.head_commit.message, '[linux-minias-full-corpus]') && steps.minias_full_s_cache.outputs.cache-hit != 'true' && hashFiles('build/minias-linux-corpus-v1/assembly/index.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-2064

      - name: Preserve full native assembly coverage report and blockers
        if: always() && contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        uses: actions/upload-artifact@v4
        with:
          name: minias-full-corpus-${{ github.sha }}
          path: |
            build/minias-linux-corpus-v1/full-summary.json
            build/minias-linux-corpus-v1/full-scan.tsv
            build/minias-linux-corpus-v1/evidence/python-failures/*.txt
            build/minias-linux-corpus-v1/evidence/**/*.minias.log
          retention-days: 7
          if-no-files-found: warn

      - name: Prepare SHA-verified 60-MiniAS object overlay from 64 cached assemblies
        if: contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]')
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          python3 tools/ci/minias-linux-corpus-runtime-overlay-v1.py \
            --original-pool "$ev/minic" \
            --manifest "$ev/minic-manifest.sha256" \
            --scan-root "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --destination "$ev/minias-corpus-64-pool" \
            --evidence "$ev/minias-corpus-64-evidence" \
            --cache-identity "$FULL_MINIC_KEY"

      - name: Cache frozen MiniC assembly sample for later MiniAS-only changes
        # Even if later .cmd parsing fails, retain each already SHA-attested
        # .s file. This cache has a per-member identity index.
        if: always() && contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') && !contains(github.event.head_commit.message, '[linux-minias-full-corpus]') && steps.minias_corpus_s_cache.outputs.cache-hit != 'true' && hashFiles('build/minias-linux-corpus-v1/assembly/index.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-64

      - name: Keep MiniAS sampled gap classification without kernel relink
        if: always() && contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') && !contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        uses: actions/upload-artifact@v4
        with:
          name: minias-linux-corpus-scan-${{ github.sha }}
          path: |
            build/minias-linux-corpus-v1/scan.tsv
            build/minias-linux-corpus-v1/evidence/**/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Download frozen real MiniC earlycon.s for isolated native MiniAS object in full Linux
        if: contains(github.event.head_commit.message, '[linux-native-minias-earlycon]')
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38426379946
          github-token: ${{ github.token }}
          name: sharded-gnu-minic-QEMU-088b8ef0a30154e1eeaeb145107a1b51c07ba996
          path: build/minias-earlycon-full-artifact

      # Reuse the seven existing build runners and this existing receiver.
      - name: Restore full native MiniPP seven-shard artifacts
        if: contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && !contains(github.event.head_commit.message, '[linux-minipp-seven-replay]')
        uses: actions/download-artifact@v4
        with:
          pattern: minipp-native-shard-*-${{ github.sha }}
          path: build/minipp-seven-merge/incoming
          merge-multiple: false

      # Native candidate reuses the seven immutable full-shard artifacts from
      # successful 2064/2064 run 38833727157, after exact producer-tree
      # comparison and SHA/ELF/owner verification. No redundant 2064-C build.
      # Cache-only replay of the original 2064/2064 certified native C shards.
      - name: Restore certified MiniPP native C objects for cache-only P1 replay
        if: contains(github.event.head_commit.message, '[linux-minipp-seven-replay]')
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && '38833727157' || '38550003154' }}
          github-token: ${{ github.token }}
          pattern: ${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && 'minipp-native-shard-*-7c36ffbf7319624227d90aa97db6e2976a56f316' || 'minipp-native-shard-*-041ae51e1ff2f3f1b9e30b489957e53cfc43dfa1' }}
          path: build/minipp-seven-merge/incoming
          merge-multiple: false

      - name: Merge all 2064 real MiniPP-native Linux C objects
        if: contains(github.event.head_commit.message, '[linux-minipp-seven-integration]')
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && '1' || '0' }}" == 1 ]]; then
            # Only reuse the seven fully produced .o shards after proving no
            # source, GNU fixture or producer script changed since their build.
            producer=7c36ffbf7319624227d90aa97db6e2976a56f316
            git fetch --quiet --no-tags --depth=1 origin "$producer"
            git diff --quiet "$producer" "$GITHUB_SHA" -- \
              Makefile src include preprocessor assembler archiver linker elf \
              tools/minic tools/minic-cc \
              tools/ci/linux-runtime-build-minic-profile-v1.sh \
              tools/ci/minipp-linux-seven-native-stage-v1.py \
              tools/ci/minipp-linux-seven-merge-v1.py \
              tools/ci/linux-runtime-gcc-cohort-objects-v1.txt || {
              echo 'MINIPP_REUSE=FAIL validated_producer_source_changed' >&2; exit 13;
            }
            echo "MINIPP_REUSE=SOURCE_IDENTICAL producer=$producer current=$GITHUB_SHA frozen_C=2064"
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '1' || '0' }}" == 1 ]]; then
            # Fresh 2064 current-source shards are authenticated by the merge
            # manifest below, not by an obsolete GNU-PP MiniC object cache.
            echo 'MINIPP_FULL_CURRENT=SOURCE_CURRENT verified_by=seven_sha_attested_shards'
          else
            test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
            (cd "$ev"; sha256sum --quiet -c minic-manifest.sha256)
          fi
          shard_commit="$GITHUB_SHA"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && '1' || '0' }}" == 1 ]]; then
            shard_commit=7c36ffbf7319624227d90aa97db6e2976a56f316
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-replay]') && '1' || '0' }}" == 1 ]]; then
            shard_commit=041ae51e1ff2f3f1b9e30b489957e53cfc43dfa1
          fi
          pinned_merge_args=()
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-pinned-full]') && '1' || '0' }}" == 1 ]]; then
            pinned_merge_args=(--pinned-profile "$GITHUB_WORKSPACE/tests/preprocessor/profiles/rv64-linux-6.6.143-gcc13.json.gz.b64")
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') && '1' || '0' }}" == 1 ]]; then
            pinned_merge_args=(--pinned-profile "$GITHUB_WORKSPACE/tests/preprocessor/profiles/rv64-linux-6.6.143-gcc13.json.gz.b64" --native-macro-rules)
          fi
          balanced_merge_args=()
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-balanced]') && '1' || '0' }}" == 1 ]]; then
            test "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '1' || '0' }}" = 1
            test "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && '1' || '0' }}" = 1
            balanced_plan="$GITHUB_WORKSPACE/tools/ci/minipp-seven-balanced-plan-2026-10-16.json"
            python3 tools/ci/linux_minipp_seven_balanced_plan_v1.py \
              --plan "$balanced_plan" --owners "$ev/full-objects.txt"
            balanced_merge_args=(--balanced-plan "$balanced_plan")
            echo "MINIPP_SEVEN_MERGE_SCHEDULER=SHA_BOUND_GREEDY_LPT"
          fi
          python3 tools/ci/minipp-linux-seven-merge-v1.py \
            --artifacts "$GITHUB_WORKSPACE/build/minipp-seven-merge/incoming" \
            --owners "$ev/full-objects.txt" \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --dest "$GITHUB_WORKSPACE/build/minipp-seven-merge/native-objects" \
            --commit "$shard_commit" "${pinned_merge_args[@]}" "${balanced_merge_args[@]}"
          (cd build/minipp-seven-merge/native-objects; sha256sum --quiet -c ../native-full-manifest.sha256)

      # Exactly the 2064 fresh MiniC .s inputs verified by the existing
      # seven gcc-shards jobs in successful run #38498107462. No recompilation
      # and no new workflow. This is the NEXT integration gate, not an
      # independent MiniAS correctness rerun.
      - name: Reuse all seven certified MiniC assembly-shard artifacts
        if: contains(github.event.head_commit.message, '[linux-minias-all-C-runtime]')
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38498107462
          github-token: ${{ github.token }}
          pattern: minias-seven-corpus-*
          merge-multiple: false
          path: build/minias-seven-runtime-input

      - name: Promote all 2060 stable MiniC assembly owners through native MiniAS
        if: contains(github.event.head_commit.message, '[linux-minias-all-C-runtime]')
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          minias="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$minias" "$minias/bin/minic-as"
          # 1-second fail-fast oracle for the exact executable NOP alignment
          # that trapped in the native Linux strcmp Zbb fast path. Verify the
          # machine bytes BEFORE 2060 native C reassemblies and QEMU.
          cat > "$minias/code-align-preflight.s" <<'MINIAS_ALIGN_EOF'
          .text
            nop
            .p2align 3
            nop
          MINIAS_ALIGN_EOF
          "$minias/bin/minic-as" -o "$minias/code-align-preflight.o" "$minias/code-align-preflight.s"
          riscv64-linux-gnu-objcopy -O binary -j .text "$minias/code-align-preflight.o" "$minias/code-align-preflight.bin"
          align_hex="$(od -An -v -tx1 "$minias/code-align-preflight.bin" | xargs | tr -d ' ')"
          if [[ "$align_hex" != '130000001300000013000000' ]]; then
            echo "MINIAS_CODE_ALIGN_PREFLIGHT=FAIL hex=$align_hex expected=130000001300000013000000" >&2
            exit 10
          fi
          echo 'MINIAS_CODE_ALIGN_PREFLIGHT=PASS exe_padding=RISC-V_NOP no_C_UNIMP=true'
          python3 tools/ci/minias-linux-corpus-runtime-overlay-v1.py \
            --original-pool "$ev/minic" \
            --manifest "$ev/minic-manifest.sha256" \
            --scan-root "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --destination "$ev/minias-corpus-2064-pool" \
            --evidence "$ev/minias-corpus-2064-evidence" \
            --cache-identity "$FULL_MINIC_KEY" \
            --seven-shard-root "$GITHUB_WORKSPACE/build/minias-seven-runtime-input" \
            --minias "$minias/bin/minic-as" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out"

      # Historical MiniAS full GNU-origin .S support already passed QEMU.
      # Extend accepted 2064 MiniC->MiniAS C-object runtime to the actual
      # non-C Kbuild assembly owners. No new jobs or full C compilation.
      - name: Reassemble actual non-C Linux Kbuild S owners using MiniAS
        if: contains(github.event.head_commit.message, '[linux-minias-native-S-runtime]')
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          original_pool="$ev/minic"
          original_manifest="$ev/minic-manifest.sha256"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && '1' || '0' }}" == 1 || "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '1' || '0' }}" == 1 ]]; then
            original_pool="$GITHUB_WORKSPACE/build/minipp-seven-merge/native-objects"
            original_manifest="$GITHUB_WORKSPACE/build/minipp-seven-merge/native-full-manifest.sha256"
            (cd "$original_pool" && sha256sum --quiet -c "$original_manifest")
            echo 'MINIAS_NATIVE_S=REUSING_VERIFIED_NATIVE_SHARDS count=2064 source=MiniPP_MiniC_MiniAS'
          else
            (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          fi
          # The native-S lane always needs a real MiniAS binary; strcmp-diff
          # only guards extra diagnostics, never assembler preparation.
          tools="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tools" "$tools/bin/minic-as"
          test -x "$tools/bin/minic-as"
          native_S_pp_args=()
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-S]') && '1' || '0' }}" == 1 ]]; then
            # Real Kbuild .S inputs, using the SAME authenticated 2064
            # MiniPP/MiniC/MiniAS C pool and original 34 Kbuild .S owners.
            # Fail closed if any MiniPP output differs from the exact GNU-E
            # oracle before the expensive link/QEMU gate.
            minipp="$GITHUB_WORKSPACE/build/minipp-seven-tools/bin/minic-cpp"
            make -j4 MODE=release CFLAGS=-Werror \
              BUILD_DIR="$GITHUB_WORKSPACE/build/minipp-seven-tools" "$minipp"
            native_S_pp_args=(--native-asm-minipp "$minipp" \
                              --linux-src "$work/linux-6.6.143")
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-pinned-predefines]') && '1' || '0' }}" == 1 ]]; then
              profile="$GITHUB_WORKSPACE/tests/preprocessor/profiles/rv64-linux-6.6.143-gcc13.json.gz.b64"
              test -s "$profile"
              native_S_pp_args+=(--native-asm-profile-snapshot "$profile")
              echo 'MINIPP_NATIVE_S_PROFILE=ENABLED pinned_GCC13_target_abi=true no_GCC_macro_generation=true'
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-rules-p1]') && '1' || '0' }}" == 1 ]]; then
              native_S_pp_args+=(--native-asm-macro-rules)
              echo 'MINIPP_NATIVE_S_PROFILE=RULE_GENERATED GCC_processes=0 ABI=classified'
            fi
          fi
          python3 tools/ci/minias-linux-corpus-runtime-overlay-v1.py \
            --original-pool "$original_pool" --manifest "$original_manifest" \
            --scan-root "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --cache-identity "$FULL_MINIC_KEY" \
            --destination "$ev/minias-native-S-pool" \
            --evidence "$ev/minias-native-S-evidence" \
            --golden-out "$work/out" \
            --minias "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools/bin/minic-as" \
            --native-asm-only --c-universe "$ev/full-objects.txt" \
            --gcc-manifest "$work/provenance/gcc-objects.sha256" \
            "${native_S_pp_args[@]}"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-strcmp-diff]') && '1' || '0' }}" == 1 ]]; then
            cmpout="$ev/minias-native-S-evidence/strcmp"
            mkdir -p "$cmpout"
            orig="$work/out/arch/riscv/lib/strcmp.o"
            native="$ev/minias-native-S-pool/arch/riscv/lib/strcmp.o"
            (cd "$work/out" && sha256sum --quiet -c "$work/provenance/gcc-objects.sha256")
            test -s "$orig" && test -s "$native"
            for role in gnu mini; do
              obj="$orig"
              [[ "$role" == mini ]] && obj="$native"
              riscv64-linux-gnu-objdump -dr -M no-aliases "$obj" >"$cmpout/$role.objdump"
              readelf -Wr "$obj" >"$cmpout/$role.relocs"
              readelf -SW "$obj" >"$cmpout/$role.sections"
              readelf -x .alternative "$obj" >"$cmpout/$role.alternative-hex" 2>&1 || true
              readelf -x .altinstr_replacement "$obj" >"$cmpout/$role.alt-replacement-hex" 2>&1 || true
              sha256sum "$obj" >"$cmpout/$role.sha256"
            done
            diff -u "$cmpout/gnu.relocs" "$cmpout/mini.relocs" >"$cmpout/reloc.diff" || true
            diff -u "$cmpout/gnu.objdump" "$cmpout/mini.objdump" >"$cmpout/objdump.diff" || true
            diff -u "$cmpout/gnu.alternative-hex" "$cmpout/mini.alternative-hex" >"$cmpout/alternative.diff" || true
            echo 'MINIAS_STRCMP_DIAGNOSTIC=COMPLETE real_GNU_Kbuild_obj=true native_MiniAS_obj=true runtime_not_run=true'
            echo 'MINIAS_STRCMP_DIAGNOSTIC=RELOCATION_DIFF'
            sed -n '1,110p' "$cmpout/reloc.diff"
            echo 'MINIAS_STRCMP_DIAGNOSTIC=ALTERNATIVE_DIFF'
            sed -n '1,110p' "$cmpout/alternative.diff"
            echo 'MINIAS_STRCMP_DIAGNOSTIC=OBJDUMP_DIFF'
            sed -n '1,180p' "$cmpout/objdump.diff"
          fi

      - name: Prepare native MiniAR, final-link MiniLD and MiniObjcopy (same cached C objects)
        if: contains(github.event.head_commit.message, '[linux-native-union-cached]') && (!contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') || contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]'))
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-runtime-native-union-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-native-union-v1-tools" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/native-union"
          echo "NATIVE_UNION_TOOLS=PASS minic_C_objects_reused=true"

      - name: Prepare one native MiniAS earlycon.o and attest 2063 unchanged MiniC objects
        if: contains(github.event.head_commit.message, '[linux-native-minias-earlycon]')
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          bash tools/ci/minias-linux-earlycon-p1-experiment-v1.sh \
            "$GITHUB_WORKSPACE/build/minias-earlycon-full-artifact" \
            "$ev/minic" "$ev/minias-earlycon-pool" \
            "$GITHUB_WORKSPACE/build/minias-earlycon-p1-tools" \
            "$ev/minias-earlycon-experiment"
          echo "MINIAS_EARLYCON_FULL_PREPARE=PASS original_2064_SHA_cache_immutable=true"

      - name: GNU-only link and QEMU with NO MiniC recompilation
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-cfg-semantic-only]') && !contains(github.event.head_commit.message, '[linux-minild-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-reloc-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-purgatory-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso64-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso32-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') && (!contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') || contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]')) && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        shell: bash
        env:
          COHORT_MINIPP_DYNAMIC_HEADERS: ${{ contains(github.event.head_commit.message, '[linux-minipp-dynamic-headers]') && '1' || '0' }}
          COHORT_MINIPP_PROFILE_SNAPSHOT: ${{ contains(github.event.head_commit.message, '[linux-minipp-pinned-predefines]') && 'tests/preprocessor/profiles/rv64-linux-6.6.143-gcc13.json.gz.b64' || '' }}
          COHORT_MINIPP_NATIVE_MACRO_RULES: ${{ contains(github.event.head_commit.message, '[linux-minipp-native-rules-p1]') && '1' || '0' }}
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          export COHORT_ACTION=verify
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-integrated-full]') }}" == true ]]; then
            export COHORT_GNU_PREFLIGHT_ALLOW_SEVEN_RECEIVER_VOLATILE=1
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-native-union-cached]') && '1' || '0' }}" == 1 ]]; then
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && '1' || '0' }}" != 1 && "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '1' || '0' }}" != 1 ]]; then
              test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
            fi
            native="$ev/native-union"
            toolchain="$GITHUB_WORKSPACE/build/linux-runtime-native-union-v1-tools"
            export MINIAR="$toolchain/bin/minic-ar"
            export MINILD="$toolchain/bin/minic-ld"
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && '1' || '0' }}" == 1 ]]; then
              export COHORT_P1_EXPERIMENTAL_POOL="$GITHUB_WORKSPACE/build/minipp-seven-merge/native-objects"
              if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-reuse]') && '1' || '0' }}" == 1 || "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '1' || '0' }}" == 1 ]]; then
                export COHORT_NATIVE_SAME_RUN_POOL="$COHORT_P1_EXPERIMENTAL_POOL"
                echo 'NATIVE_UNION=SOURCE_AUTHENTICATED_NATIVE_SHARDS legacy_full_cache=not_required'
              fi
              if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-replay]') && '1' || '0' }}" == 1 ]]; then
                # Only this immutable cache-replay may tolerate timestamp-derived
                # GNU Kbuild version.o / vmlinux.o preflight regeneration.
                export COHORT_GNU_PREFLIGHT_ALLOW_PINNED_VOLATILE=1
              fi
              test "$(wc -l < build/minipp-seven-merge/native-full-manifest.sha256)" -eq 2064
              (cd "$COHORT_P1_EXPERIMENTAL_POOL"; sha256sum --quiet -c ../native-full-manifest.sha256)
              echo "MINIPP_FULL_C_UNION=ENABLED PP=MiniPP CC=MiniC AS=MiniAS C=2064 shards=7"
            fi

            export MINIOBJCOPY="$toolchain/bin/minic-objcopy"
            export NATIVE_TRACE_DIR="$native"
            export COHORT_NATIVE_UNION=1
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-minias-earlycon]') && '1' || '0' }}" == 1 ]]; then
              export COHORT_P1_EXPERIMENTAL_POOL="$ev/minias-earlycon-pool"
              test -s "$ev/minias-earlycon-experiment/experimental-earlycon-object.sha256"
              echo "MINIAS_EARLYCON_QEMU_EXPERIMENT=ENABLED selected_C_objects=2064 compiled_C_objects=0 native_AS_owners=1 frozen_GNU_AS_owners=2063"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]') && '1' || '0' }}" == 1 ]]; then
              export COHORT_P1_EXPERIMENTAL_POOL="$ev/minias-corpus-64-pool"
              export COHORT_MINIAS_CORPUS_MANIFEST="$ev/minias-corpus-64-evidence/native-object-hashes.sha256"
              test "$(wc -l < "$COHORT_MINIAS_CORPUS_MANIFEST")" -eq 60
              (cd "$COHORT_P1_EXPERIMENTAL_POOL" && sha256sum --quiet -c "$COHORT_MINIAS_CORPUS_MANIFEST")
              echo "MINIAS_CORPUS_QEMU_EXPERIMENT=ENABLED native=60 original=2004 gcc_E_and_minic_S_reused=true"
              if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-dynamic-headers]') && '1' || '0' }}" == 1 ]]; then
