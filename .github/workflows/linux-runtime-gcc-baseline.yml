          # artifact; historical default remains strictly unchanged.
          run-id: ${{ contains(github.event.head_commit.message, '[linux-runtime-p1-accepted-replay]') && '38390921455' || '38204602644' }}
          github-token: ${{ github.token }}
          name: ${{ contains(github.event.head_commit.message, '[linux-runtime-p1-accepted-replay]') && 'sharded-gnu-minic-QEMU-9bf648d989ec652de0618ecdd1ccf159a8a836b5' || 'sharded-gnu-minic-QEMU-d5dde03594665842f2bb3b8556f842f511a5dfa4' }}
          path: build/linux-runtime-large-image-qemu-v0/source-artifact

      - name: Run original Image in 2G QEMU against P0 P1 and shell oracles
        if: contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')
        shell: bash
        env:
          ACCEPTED_P1: ${{ contains(github.event.head_commit.message, '[linux-runtime-p1-accepted-replay]') && '1' || '0' }}
        run: |
          set -Eeuo pipefail
          if [[ "$ACCEPTED_P1" == 1 ]]; then
