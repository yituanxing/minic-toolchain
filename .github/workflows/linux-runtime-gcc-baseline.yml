name: Linux Runtime GCC Baseline

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/linux-perf-boolean-domain-v1"
    paths:
      - '.github/workflows/linux-runtime-gcc-baseline.yml'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

# P1 calibration rerun after loopback bring-up.

jobs:
  gcc-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-gcc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V Linux runtime prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils cpio gzip file \
            qemu-system-misc opensbi

      - name: Build deterministic runtime initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-runtime-gcc/initramfs" \
          OUTPUT_INITRAMFS="$GITHUB_WORKSPACE/build/linux-runtime-gcc/runtime-initramfs.cpio.gz" \
          RISCV_CC=riscv64-linux-gnu-gcc \
            bash tests/external/linux/build_runtime_initramfs.sh

      - name: Build Linux 6.6.143 GCC baseline Image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          # Fresh GNU reference campaign: the historical mixed-MiniC cache
          # used config e538a6..., but today's GCC/Kconfig yields its own
          # reproducible config. Only compare MiniC against THIS same config.
          actual_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          echo "GNU_GOLDEN_CONFIG sha=$actual_config historical_mixed=e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 Image
          final_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test "$final_config" = "$actual_config"
          echo "GNU_GOLDEN_CONFIG_STABLE=PASS sha=$final_config"
          test -s "$out/arch/riscv/boot/Image"
          file "$out/arch/riscv/boot/Image"
          echo "LINUX_RUNTIME_GCC_IMAGE=PASS release=6.6.143"

      - name: Run Python-era runtime contract against GCC baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu" \
          LINUX_RELEASE=6.6.143 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
          QEMU_SHELL_INPUT_DELAY_SECONDS=8 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_BASELINE=PASS lanes=2/2 head=$GITHUB_SHA"

      - name: Calibrate P1 syscall profile against GCC reference
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu-p1" \
          LINUX_RELEASE=6.6.143 \
          LINUX_RUNTIME_PROFILE=p1 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_P1=PASS syscalls=12 head=$GITHUB_SHA"

      - name: Certify pure-GNU exact-config object pool after QEMU contracts
        id: exact_gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          out="$work/out"
          # Certified GCC .config identity is this run's actual SHA, not a
          # borrowed SHA from the historical mixed-compiler experiment.
          actual=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test -n "$actual"
          test -s "$out/vmlinux"
          test -s "$out/arch/riscv/boot/Image"
          test -s "$out/built-in.a"
          test -s "$out/lib/lib.a"
          mkdir -p "$work/provenance"
          # The default GCC kernel compiles fewer C owners than the 3352
          # frozen candidate-TU corpus. Only record RISC-V ET_REL objects;
          # HOSTCC-generated native ELF objects are not Linux swap targets.
          python3 - "$out" "$work/provenance/gcc-objects.sha256" <<'PY_GCC_POOL'
          import hashlib
          from pathlib import Path
          import struct
          import sys
          out, dest = map(Path, sys.argv[1:])
          total = 0
          with dest.open("w", encoding="utf-8") as manifest:
              for obj in sorted(out.rglob("*.o")):
                  with obj.open("rb") as src:
                      header = src.read(20)
                  if (len(header) < 20 or header[:4] != b"\x7fELF"
                      or header[5] != 1
                      or struct.unpack_from("<H", header, 16)[0] != 1
                      or struct.unpack_from("<H", header, 18)[0] != 243):
                      continue
                  digest = hashlib.sha256()
                  with obj.open("rb") as src:
                      for data in iter(lambda: src.read(1048576), b""):
                          digest.update(data)
                  manifest.write(f"{digest.hexdigest()}  {obj.relative_to(out)}\n")
                  total += 1
          print(f"GNU_RISCV_OBJECT_POOL objects={total} manifest={dest}")
          PY_GCC_POOL
          count=$(wc -l <"$work/provenance/gcc-objects.sha256")
          echo "GNU_GOLDEN_OBJECT_COUNT=$count"
          # Fail if Kbuild produced an implausibly small kernel object pool.
          test "$count" -ge 1500
          {
            echo "schema=linux-gnu-exact-config-v1"
            echo "linux_release=6.6.143"
            echo "linux_archive_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"
            echo "config_sha256=$actual"
            echo "gcc_version=$(riscv64-linux-gnu-gcc -dumpfullversion)"
            echo "gcc_target=$(riscv64-linux-gnu-gcc -dumpmachine)"
            echo "gcc_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)"
            echo "gnu_ld_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -d' ' -f1)"
            echo "gnu_ar_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ar)" | cut -d' ' -f1)"
            echo "gcc_object_count=$count"
            echo "vmlinux_sha256=$(sha256sum "$out/vmlinux" | cut -d' ' -f1)"
            echo "image_sha256=$(sha256sum "$out/arch/riscv/boot/Image" | cut -d' ' -f1)"
            echo "qemu_contract=full_and_p1_passed"
          } >"$work/provenance/gcc-baseline.txt"
          bin_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          key="linux-gnu-golden-v1-6.6.143-$actual-$bin_sig-$ld_sig"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "GNU_EXACT_GOLDEN=PASS objects=$count config=$actual cache_key=$key"
          du -sh "$out" || true

      - name: Save certified GNU Linux object pool for MiniC one-TU swaps
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.exact_gnu.outputs.key }}

      - name: Preserve runtime blocker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-gcc-blocker
          path: |
            build/linux-runtime-gcc/qemu/*.log
            build/linux-runtime-gcc/qemu-p1/*.log
            build/linux-runtime-gcc/out/.config
            build/linux-runtime-gcc/runtime-initramfs.cpio.gz
          if-no-files-found: ignore
          retention-days: 1

  gcc-single:
    # Reuse the EXISTING opt-in isolation job. ONE runner handles the entire
    # batch compile, two cohorts and any QEMU prefix bisection.
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[linux-runtime-gcc-cohort]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-384]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install GNU RISC-V toolchain and QEMU once
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross \
            python3 make cpio gzip || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      - name: Derive exact certified GNU golden cache key
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - name: Restore QEMU-certified GNU golden objects
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.identity.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore pinned Linux 6.6.143 source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Derive full same-config GCC C object universe
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          # Rapid diagnostic: exactly 384 objects, not the whole C universe.
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') }}" == true ]]; then
            python3 - "$ev/full-objects.txt" <<'PY_DIAGNOSTIC'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          objects=[x for x in p.read_text().splitlines() if x and not x.startswith("#")]
          assert len(objects)>=384
          p.write_text("# DIAGNOSTIC_384_FROM_PINNED_GNU_FULL_C_UNIVERSE\n"
                       + "\n".join(objects[:384]) + "\n")
          print("COHORT_SCOPE=DIAGNOSTIC_384 objects=384")
          PY_DIAGNOSTIC
          fi

      - name: Compute pinned MiniC candidate object cache identity
        id: candidate_id
        shell: bash
        run: |
          set -Eeuo pipefail
          # Must be computed from the CLEAN sources, before 39 MiniC
          # runtime-profile patches modify src/ in place.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          objects=$(sha256sum build/linux-runtime-gcc-cohort-v1/full-objects.txt | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "key=gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$objects-$gcc-$assembler" >>"$GITHUB_OUTPUT"

      - name: Restore exact ABI-validated MiniC candidate objects
        id: candidate_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ steps.candidate_id.outputs.key }}

      - name: Build MiniC once and produce authenticated C candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          # Kbuild .cmd depends on the producer's exact source path.
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          export COHORT_ALLOW_DIAGNOSTIC_384=${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') && '1' || '0' }}
          export COHORT_ACTION=compile
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" \
            "$ev/full-objects.txt" "$ev"

      - name: Check completed full MiniC object pool is cacheable
        id: candidate_ready
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          if test -s "$ev/full-objects.txt"; then
            count=$(grep -cE '^[^#[:space:]]+\.o$' "$ev/full-objects.txt" || true)
          else
            count=0
          fi
          if test "$count" -ge 384 && \
             test -s "$ev/cohort.log" && \
             { grep -Fq "COHORT_COMPILE=PASS objects=$count" "$ev/cohort.log" || \
               grep -Fq "COHORT_CANDIDATE_CACHE=HIT objects=$count" "$ev/cohort.log"; } && \
             test -s "$ev/minic-manifest.sha256" && \
             test -s "$ev/minic-identity.txt" && \
             grep -Fq "COHORT_ABI=PASS objects=$count" "$ev/cohort.log" && \
             (cd "$ev"; sha256sum --quiet -c minic-manifest.sha256); then
            echo "ready=true" >>"$GITHUB_OUTPUT"
            echo "COHORT_CANDIDATE_READY=PASS objects=$count"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "COHORT_CANDIDATE_READY=FAIL count=$count (check MiniC trace, ABI and candidate hashes)" >&2
            exit 1
          fi

      - name: Save immutable MiniC objects despite later link or QEMU failure
        if: always() && steps.candidate_ready.outputs.ready == 'true' && steps.candidate_restore.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ steps.candidate_id.outputs.key }}

      # This boundary is essential: a subsequent GNU relink/QEMU failure
      # must NEVER waste the expensive, already-verified candidate objects.
      - name: GNU relink and QEMU from authenticated MiniC objects
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.candidate_ready.outputs.ready }}" = true
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          export COHORT_ALLOW_DIAGNOSTIC_384=${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') && '1' || '0' }}
          export COHORT_ACTION=verify
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve compilation, GNU object identities, QEMU verdicts and bisection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-full-c-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/full-objects.txt
            build/linux-runtime-gcc-cohort-v1/non-c-objects.tsv
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/compile.log
            build/linux-runtime-gcc-cohort-v1/compile-blockers.txt
            build/linux-runtime-gcc-cohort-v1/mini-success-objects.txt
            build/linux-runtime-gcc-cohort-v1/failure-pool-index.tsv
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.i
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.stderr
            build/linux-runtime-gcc-cohort-v1/source-aliases.txt
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/gcc-objects-stable.sha256
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
            build/linux-runtime-gcc-cohort-v1/frontier.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/link.log
            build/linux-runtime-gcc-cohort-v1/trials/*/link-repaired.log
            build/linux-runtime-gcc-cohort-v1/trials/*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/*/generated-before.json
            build/linux-runtime-gcc-cohort-v1/trials/*/selected-objects.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1-python.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-p1/*.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu/*.log
            build/linux-runtime-gcc-cohort-v1/compiler/toolchain-timing.txt
          if-no-files-found: warn
          retention-days: 7

  # Explicit, optional 7-runner producer for the same pure-GCC C universe.
  # Do not use this lane for everyday single-TU debugging.
  gcc-shards:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-gcc-sharded]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install pinned GNU RISC-V build tools
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross python3 make cpio gzip || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                libc6-dev-riscv64-cross python3 make cpio gzip
            }

      - name: Identify certified exact-config GNU golden pool
        id: gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.gnu.outputs.key }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Derive identical full universe and this shard
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/all-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          python3 tools/ci/linux-runtime-gcc-shards-v1.py split \
            --full "$ev/all-objects.txt" \
            --shard ${{ matrix.shard }} --output "$ev/full-objects.txt"

      - name: Identify immutable MiniC shard artifact
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          # Profile source identity MUST be obtained before patching src/.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          subset=$(sha256sum "build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/full-objects.txt" | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "key=gnu-minic-shard-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$subset-$gcc-$assembler" >>"$GITHUB_OUTPUT"

      - name: Restore this shard's immutable candidate objects
        id: shard_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-identity.txt
          key: ${{ steps.candidate.outputs.key }}

      - name: Build MiniC and prove this exact shard
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          export COHORT_ACTION=compile COHORT_ALLOW_SHARD=1
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Authenticate shard before cache or export
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          n=$(grep -cE '^[^#[:space:]]+\.o$' "$ev/full-objects.txt")
          test "$n" -gt 0
          grep -Fq "COHORT_ABI=PASS objects=$n" "$ev/cohort.log"
          grep -Fq "COHORT_PRODUCE_ONLY=PASS objects=$n" "$ev/cohort.log"
          test -s "$ev/minic-identity.txt"
          (cd "$ev"; sha256sum --quiet -c minic-manifest.sha256)
          echo "GNU_MINIC_SHARD_READY=PASS shard=${{ matrix.shard }} objects=$n"

      - name: Cache completed shard independently of later link failures
        if: steps.shard_cache.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-identity.txt
          key: ${{ steps.candidate.outputs.key }}

      - name: Transfer only candidate objects and attestations
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-identity.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/full-objects.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/cohort.log
          if-no-files-found: error
          retention-days: 3

      - name: Keep bounded failed-TU evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-shard-${{ matrix.shard }}
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/compile.log
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/compile-blockers.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/failure-pool-index.tsv
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.i
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.stderr
          if-no-files-found: ignore
          retention-days: 3

  gcc-shard-verify:
    needs: gcc-shards
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-gcc-sharded]')
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install pinned GNU RISC-V tools and QEMU
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross \
            python3 make cpio gzip || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      - name: Restore identical certified GNU golden objects
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "GNU_GOLDEN_KEY=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig"
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ env.key }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Reconstruct complete GNU C manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" --min-c-objects 1200
          # Compute stable profile ID from pristine MiniC sources, BEFORE
          # applying any of the build-time profile patches.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          objects=$(sha256sum "$ev/full-objects.txt" | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "FULL_MINIC_KEY=gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$objects-$gcc-$assembler" >>"$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: build/linux-runtime-gcc-shards-v1
          merge-multiple: false

      - name: Build identical MiniC profile and verify exact shard union
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          python3 tools/ci/linux-runtime-gcc-shards-v1.py merge \
            --full "$ev/full-objects.txt" \
            --shards "$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1" \
            --evidence "$ev" --out "$work/out" --provenance "$work/provenance" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --assembler /usr/bin/riscv64-linux-gnu-as

      - name: Retain fully verified MiniC objects before link or runtime
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ env.FULL_MINIC_KEY }}

      - name: GNU-only link and QEMU with NO MiniC recompilation
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          export COHORT_ACTION=verify
          export COHORT_CAPTURE_ONLY=${{ contains(github.event.head_commit.message, '[linux-runtime-earlycon-capture]') && '1' || '0' }}
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve aggregate link, QEMU and failure-frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharded-gnu-minic-QEMU-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/full-objects.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/frontier.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/link.log
            build/linux-runtime-gcc-cohort-v1/trials/*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/*/earlycon-source/*
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1.log
          if-no-files-found: warn
          retention-days: 7

  # Opt-in hotfix diagnostic: reuse authenticated 2064 old MiniC objects
  # but replace only earlycon.o with the current patched MiniC profile.
  # No new workflow, no rebuilding the 2063 unaffected C translation units.
  gcc-earlycon-hotfix:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-earlycon-hotfix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install pinned RISC-V GNU tools and QEMU
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      - name: Identify exact pure-GNU golden reference
        id: golden
        shell: bash
        run: |
          set -Eeuo pipefail
          cfg=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$cfg-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - name: Restore QEMU-certified GCC golden object tree
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.golden.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore old authenticated 2064 MiniC object pool
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          # Exact immutable key from pre-fix CI #38051834014, not restore-keys.
          key: gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-d19c855bc2650568f84a73a8a17e2b8be42faee80d0ed22913588bb4d8df7822-1d1c8d09cfffddb37990552ae6392181a42d55332e48232dce27e7305d7e770b-0c2a199ea3ae14d39b008fd4080d4b18d675b07daa17976c7d9755e8ea67310b-d072447ef15a207422bf4874920221c41af7a771d1dbae770855cf3d6220a507
          fail-on-cache-miss: true

      - name: Restore exact Linux 6.6.143 source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Recover certified full-C same-config object order
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          source="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$source"
          test ! -e "$work/linux-6.6.143"
          cp -a --reflink=auto "$source" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$work/out" --manifest "$work/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          test "$(grep -Ec '^[^#[:space:]]+\.o$' "$ev/full-objects.txt")" = 2064

      - name: Build current patched MiniC compiler only once
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/compiler"

      - name: Validate QMP sampler before expensive GNU linking
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-runtime-qmp-pc-sampler-v1.py --self-test
          python3 -m py_compile tools/ci/linux-runtime-qmp-pc-sampler-v1.py tools/ci/linux-runtime-qmp-stack-symbols-v1.py tools/ci/linux-runtime-gdb-boundary-v1.py

      - name: Recompile earlycon.o only, GNU link and compare QEMU frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          chmod +x tests/external/linux/qemu_explicit_initrd_wrapper.py
          export COHORT_ACTION=verify COHORT_EARLYCON_HOTFIX=1 COHORT_EARLYCON_EXPLICIT_INITRD=0 COHORT_NEXT_FAULT_DIAG=0 COHORT_UART_EARLYCON=1 COHORT_NEXT_GCC_SWAPS=0 COHORT_GDB_BOUNDARY=1
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve single-object experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-earlycon-one-object-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/earlycon-hotfix/
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/link*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qmp*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-uart-earlycon.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/uart-qmp/*
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/gdb-boundary/*
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_mm_*/qemu-uart-earlycon.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_mm_*/uart-qmp/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_mm_*/uart-qmp/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_mm_*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/gcc_only_mm_*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-early-noinitrd.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/runtime-explicit-*.log
            build/linux-runtime-gcc-cohort-v1/trials/earlycon_fixed_only/qemu-explicit-*/rdinit-init.log
          if-no-files-found: warn
          retention-days: 7

