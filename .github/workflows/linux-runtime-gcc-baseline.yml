          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/compile.log
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/mini-success-objects.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/stage4-invocations.tsv
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/mini-object-hashes.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/compile-blockers.txt
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/failure-pool-index.tsv
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.i
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.stderr
          if-no-files-found: ignore
