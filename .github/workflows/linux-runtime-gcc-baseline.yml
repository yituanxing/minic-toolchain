      # COHORT_P1 syscalls=12 is one boot with twelve syscall probes; it is
      # not twelve independent boots. The explicit current-HEAD campaign
      # must also pass twelve NEW QEMU processes on one immutable Image.
      - name: Reboot the exact RV64 all-MiniC Image twelve times with strict P1
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')
        timeout-minutes: 20
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          image="$ev/trials/full_all_verified/Image"
          initramfs="$ev/runtime-initramfs.cpio.gz"
          test -s "$image" && test -s "$initramfs"
          grep -Fq 'COHORT_RESULT=PASS candidate_objects=2064 scope=FULL_C_UNIVERSE' "$ev/cohort.log"
          grep -Fq 'COHORT_P1=PASS name=full_all_verified syscalls=12 python_era_oracle=PASS' "$ev/cohort.log"
          root="$ev/p1-identical-image-12"
          mkdir -p "$root/trials"
          image_sha=$(sha256sum "$image" | cut -d' ' -f1)
          # The preceding full_all_verified trial already proved this exact
          # Image under its non-overlapping large-Image DTB when >128MiB.
          # A fresh Actions shell loses those three loader env variables;
          # restore that SAME approved map for all twelve new QEMU processes.
          # Smaller Images keep the original 512MiB/-initrd GNU baseline.
          source tools/ci/linux-runtime-rv64-repeat-loader-v1.sh
          minic_rv64_repeat_loader_selftest
          minic_rv64_repeat_loader_select "$ev" "$image" "$initramfs" "$image_sha"
          printf 'attempt\timage_sha256\tqemu_exit\tsyscalls\tverdict\n' > "$root/repeats.tsv"
          printf 'head=%s\nimage_sha256=%s\ncompiler_profile=native-current-head\nloader_memory=%s\nloader_initrd=%s\n' \
            "$MINIC_EXPECTED_HEAD_SHA" "$image_sha" \
            "${LINUX_RUNTIME_QEMU_MEMORY:-512M}" "${LINUX_RUNTIME_INITRD_LOAD_ADDR:-default}" \
            > "$root/identity.txt"
          for attempt in $(seq 1 12); do
            work="$root/trials/$attempt"
            mkdir -p "$work"
            test "$(sha256sum "$image" | cut -d' ' -f1)" = "$image_sha"
            if ! LINUX_IMAGE="$image" INITRAMFS="$initramfs" \
                 BUILD_DIR="$work/qemu" LINUX_RELEASE=6.6.143 \
                 LINUX_RUNTIME_PROFILE=p1 QEMU_TIMEOUT_SECONDS=45 \
                 bash tests/external/linux/runtime_boot.sh \
                   >"$work/runtime_boot.log" 2>&1; then
              echo "RV64_FULL_REPEAT=FAIL attempt=$attempt stage=runtime_boot" >&2
              tail -n 80 "$work/runtime_boot.log" >&2
              exit 1
            fi
            # The old runtime_boot.sh accepts status 124/143 if guest markers
            # exist. This stricter campaign explicitly rejects timeout/TERM.
            grep -Fq 'LINUX_RUNTIME_BOOT lane=rdinit-init qemu_status=0 ' "$work/runtime_boot.log" || {
              echo "RV64_FULL_REPEAT=FAIL attempt=$attempt qemu_did_not_exit_cleanly" >&2
              exit 1
            }
            grep -Fq 'LINUX_RUNTIME_EXACT=PASS release=6.6.143 profile=p1 lanes=1/1' "$work/runtime_boot.log"
            python3 tests/external/linux/runtime_v2_log_check.py \
              --profile p1 --log "$work/qemu/rdinit-init.log" \
              >"$work/p1-check.log" 2>&1
            test "$(sha256sum "$image" | cut -d' ' -f1)" = "$image_sha"
            printf '%s\t%s\t0\t12\tPASS\n' "$attempt" "$image_sha" >> "$root/repeats.tsv"
            echo "RV64_FULL_REPEAT=PASS attempt=$attempt/12 image_sha256=$image_sha syscalls=12 qemu_exit=0"
          done
          test "$(grep -c $'\tPASS$' "$root/repeats.tsv")" -eq 12
          echo "RV64_FULL_IDENTICAL_IMAGE=PASS repeats=12/12 syscalls_each=12/12 image_sha256=$image_sha head=$MINIC_EXPECTED_HEAD_SHA"

      - name: Authenticate Stage4 2064-object Linux QEMU P1 runtime
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064]')
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          # The saved full object owner inventory has one descriptive header.
          test "$(grep -cvE '^(#|[[:space:]]*$)' "$ev/full-objects.txt")" -eq 2064
          test "$(wc -l < "$ev/minic-manifest.sha256")" -eq 2064
          grep -Fq 'COHORT_RESULT=PASS candidate_objects=2064 scope=FULL_C_UNIVERSE' "$ev/cohort.log"
          grep -Fq 'COHORT_P1=PASS name=full_all_verified syscalls=12 python_era_oracle=PASS' "$ev/cohort.log"
          echo "BOOTSTRAP_STAGE4_LINUX2064=PASS compiler=Stage4 all_C_objects=2064/2064 original_GNU_link=true QEMU_P1=12/12"

      - name: Preserve aggregate link, QEMU and failure-frontier evidence
        if: always() && !contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-minild-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-reloc-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-purgatory-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso64-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso32-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') && (!contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') || contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]')) && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        uses: actions/upload-artifact@v4
        with:
          name: sharded-gnu-minic-QEMU-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/full-objects.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/minipp-seven-merge/native-summary.json
            build/minipp-seven-merge/native-performance.json
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/native-union/*.trace
            build/linux-runtime-gcc-cohort-v1/native-union/*.tsv
            build/linux-runtime-gcc-cohort-v1/trials/*/minias-dynamic-hashes.sha256
            build/linux-runtime-gcc-cohort-v1/trials/*/minias-dynamic-logs/*.log
            build/linux-runtime-gcc-cohort-v1/minias-corpus-2064-evidence/*.json
            build/linux-runtime-gcc-cohort-v1/minias-corpus-2064-evidence/*.sha256
            build/linux-runtime-gcc-cohort-v1/minias-native-S-evidence/*.tsv
            build/linux-runtime-gcc-cohort-v1/minias-native-S-evidence/*.sha256
            build/linux-runtime-gcc-cohort-v1/minias-native-S-evidence/logs/*.log
