name: Linux Runtime GCC Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/linux-runtime-gcc-baseline.yml'
      - 'src/target/**'
      - 'src/core/**'
      - 'src/compiler/**'
      - 'src/frontend/**'
      - 'tests/external/linux/rv32i_kbuild_entry.sh'
      - 'tools/ci/**'
      - 'Makefile'
  push:
    branches:
      - "main"
    paths:
      - '.github/workflows/linux-runtime-gcc-baseline.yml'
      # One explicitly audited four-ISA + seven-shard current-source recertification.
      - '.github/workflows/minic-capability-recertify.yml'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
      # Native source identity is part of the Kbuild compiler acceptance gate;
      # changing its exact SHA contract must allow the existing gated CI run.
      - 'docs/ci/native-runtime44-perf4-validated-sha1.txt'
      # Single canonical product line: source ownership must trigger its
      # existing Linux oracle, not require pushing onto obsolete agent refs.
      # RV64 Linux ownership only: x86/AArch64/LoongArch64 ISA emitter edits
      # cannot affect this compiler's RV64 C or Linux QEMU ABI.
      - 'src/compiler/**'
      - 'src/core/**'
      - 'src/frontend/**'
      - 'src/target/riscv64/**'
      # Same Linux workflow's opt-in RV32I entry must run on RV32 machine changes.
      - 'src/target/riscv32/**'
      - 'src/target/riscv/**'
      - 'tests/compiler/c0/probe-rv32-target-gate.sh'
      - 'src/target/common/**'
      - 'src/target/backend*'
      - 'src/target/data_layout*'
      - 'src/target/target_info*'
      - 'include/minic/**'
      - 'tools/minic/**'
      - 'tools/minic-cc/**'
      # Native MiniPP source and its existing oracle must also reach Linux P1.
      - 'preprocessor/**'
      - 'tools/minic-cpp/**'
      - 'tests/preprocessor/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'GNU reference only, or exact-head RV64 all-MiniC Linux 2064 P0/P1'
        required: true
        type: choice
        default: gcc-baseline
        options:
          - gcc-baseline
          - rv64-full

permissions:
  contents: read
  actions: read  # Same-repository exact historical Image artifact download

# Immutable original GNU ELF32 oracle: pinned Linux 6.6.143 Kconfig digest
# verified in run 40177835323 (1741 objects, Image and object SHA manifest).
# A shard must restore THIS validated golden rather than generate a new,
# subtly different config and silently compare incompatible object universes.
env:
  RV32I_GNU_GOLDEN_CONFIG_SHA256: 4c6c19f79741a8a31ec52ad57b1a6bc56b81dd6996cbf5e1bdc63f587d85244c

# P1 calibration rerun after loopback bring-up.
# Stage2 2064 rerun: guest ELF executable bit restored; single-runner B1 driver probe PASS.
# SHA-certified Stage2 Linux 2064 opt-in after Stage2 500/500 identity pass.

jobs:
  # One-shot PR entry for a newly added rv64-full workflow_dispatch mode.
  # The explicit current-HEAD trigger is checked against the LAST commit;
  # an old trigger elsewhere in a long-lived PR never launches new 7-shard
  # campaigns on ordinary source edits.
  rv64-campaign-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Authenticate exact-head opt-in for full RV64 Linux runtime
        id: decide
        shell: bash
        run: |
          set -Eeuo pipefail
          active=false
          if [[ "${{ github.event_name }}" == pull_request ]] && \
             git rev-parse --verify HEAD^ >/dev/null 2>&1 && \
             ! git diff --quiet HEAD^ HEAD -- tools/ci/linux-rv64-runtime-trigger.txt; then
            active=true
          fi
          printf 'run=%s\n' "$active" >>"$GITHUB_OUTPUT"
          echo "RV64_FULL_PR_GATE=$active head=$(git rev-parse HEAD)"

  # A cached original GNU Kbuild Image is an optimization, not a prerequisite
  # for running the user's exact-head MiniC campaign. Historical branch-scoped
  # caches (and keys tied to an older Ubuntu package hash) can disappear.
  # Generate the *same pinned source/config* once, not independently in seven
  # MiniC workers, and release those workers only after a real GNU P0/P1 proof.
  rv64-current-gnu-golden:
    needs: rv64-campaign-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      RV64_FULL_ACTIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')) && '1' || '0' }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        if: env.RV64_FULL_ACTIVE == '1'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify original GNU Linux golden producer identity
        if: env.RV64_FULL_ACTIVE == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          bash -n tools/ci/linux-rv64-current-golden-v1.sh
          echo "RV64_GOLDEN_EXACT_HEAD=PASS sha=$EXPECTED_HEAD"

      - name: Install pinned original GNU/QEMU Linux tools
        if: env.RV64_FULL_ACTIVE == '1'
        timeout-minutes: 15
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross bc bison flex libelf-dev libssl-dev \
            make curl xz-utils cpio gzip file python3 qemu-system-misc opensbi

      - name: Identify exact GNU toolchain/Kconfig object-cache identity
        if: env.RV64_FULL_ACTIVE == '1'
        id: gnu_identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cfg=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$cfg-$gcc_sig-$ld_sig" >> "$GITHUB_OUTPUT"

      - name: Restore pinned original Linux source if it still exists
        if: env.RV64_FULL_ACTIVE == '1'
        uses: actions/cache/restore@v4
        id: pristine_source_cache
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1

      - name: Reconstitute SHA-pinned original Linux source after cache expiry
        if: env.RV64_FULL_ACTIVE == '1' && steps.pristine_source_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          mkdir -p "$root"
          archive="$RUNNER_TEMP/minic-6.6.143-original-linux.tar.xz"
          curl --proto '=https' --tlsv1.2 -fLSs --retry 4 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz \
            -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$root"
          test -s "$root/linux-6.6.143/Makefile"
          echo 'RV64_GNU_ORIGINAL_SOURCE=PASS sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932'

      - name: Save reconstructed pinned Linux source for the seven workers
        if: env.RV64_FULL_ACTIVE == '1' && steps.pristine_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1

      - name: Restore GNU/QEMU-certified object cache if still available
        if: env.RV64_FULL_ACTIVE == '1'
        id: original_gnu_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.gnu_identity.outputs.key }}

      - name: Build original GNU Linux and certify P0/P1 on a missing cache
        if: env.RV64_FULL_ACTIVE == '1' && steps.original_gnu_cache.outputs.cache-hit != 'true'
        timeout-minutes: 75
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-rv64-current-golden-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc" \
            "$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"

      - name: Attest original GNU cache source, Kconfig, owner count, QEMU contract
        if: env.RV64_FULL_ACTIVE == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          cfg=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          test -s "$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143/Makefile"
          test "$(sha256sum "$work/out/.config" | cut -d' ' -f1)" = "$cfg"
          test -s "$work/out/arch/riscv/boot/Image"
          test -s "$work/out/vmlinux"
          grep -Fxq 'linux_release=6.6.143' "$work/provenance/gcc-baseline.txt"
          grep -Fxq "config_sha256=$cfg" "$work/provenance/gcc-baseline.txt"
          grep -Fxq 'qemu_contract=full_and_p1_passed' "$work/provenance/gcc-baseline.txt"
          grep -Fxq 'linux_archive_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932' "$work/provenance/gcc-baseline.txt"
          test -s "$work/provenance/gcc-objects.sha256"
          echo "RV64_CURRENT_GNU_GOLDEN=PASS config=$cfg cache_hit=${{ steps.original_gnu_cache.outputs.cache-hit }} original_Linux=true"

      - name: Cache freshly rebuilt GNU/QEMU-qualified object pool once
        if: env.RV64_FULL_ACTIVE == '1' && steps.original_gnu_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.gnu_identity.outputs.key }}

      - name: Preserve GNU Kbuild/QEMU failure if golden regeneration is blocked
        if: failure() && env.RV64_FULL_ACTIVE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rv64-current-gnu-golden-blocker-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/linux-runtime-gcc/out/.config
            build/linux-runtime-gcc/provenance/
          if-no-files-found: warn
          retention-days: 7

  gcc-runtime:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'rv64-full') || contains(github.event.head_commit.message, '[linux-runtime-gcc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install RISC-V Linux runtime prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils cpio gzip file \
            qemu-system-misc opensbi

      - name: Build deterministic runtime initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-runtime-gcc/initramfs" \
          OUTPUT_INITRAMFS="$GITHUB_WORKSPACE/build/linux-runtime-gcc/runtime-initramfs.cpio.gz" \
          RISCV_CC=riscv64-linux-gnu-gcc \
            bash tests/external/linux/build_runtime_initramfs.sh

      - name: Build Linux 6.6.143 GCC baseline Image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          # Fresh GNU reference campaign: the historical mixed-MiniC cache
          # used config e538a6..., but today's GCC/Kconfig yields its own
          # reproducible config. Only compare MiniC against THIS same config.
          actual_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          echo "GNU_GOLDEN_CONFIG sha=$actual_config historical_mixed=e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 Image
          final_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test "$final_config" = "$actual_config"
          echo "GNU_GOLDEN_CONFIG_STABLE=PASS sha=$final_config"
          test -s "$out/arch/riscv/boot/Image"
          file "$out/arch/riscv/boot/Image"
          echo "LINUX_RUNTIME_GCC_IMAGE=PASS release=6.6.143"

      - name: Run Python-era runtime contract against GCC baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu" \
          LINUX_RELEASE=6.6.143 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
          QEMU_SHELL_INPUT_DELAY_SECONDS=8 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_BASELINE=PASS lanes=2/2 head=$GITHUB_SHA"

      - name: Calibrate P1 syscall profile against GCC reference
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu-p1" \
          LINUX_RELEASE=6.6.143 \
          LINUX_RUNTIME_PROFILE=p1 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_P1=PASS syscalls=12 head=$GITHUB_SHA"

      - name: Certify pure-GNU exact-config object pool after QEMU contracts
        id: exact_gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          out="$work/out"
          # Certified GCC .config identity is this run's actual SHA, not a
          # borrowed SHA from the historical mixed-compiler experiment.
          actual=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test -n "$actual"
          test -s "$out/vmlinux"
          test -s "$out/arch/riscv/boot/Image"
          test -s "$out/built-in.a"
          test -s "$out/lib/lib.a"
          mkdir -p "$work/provenance"
          # The default GCC kernel compiles fewer C owners than the 3352
          # frozen candidate-TU corpus. Only record RISC-V ET_REL objects;
          # HOSTCC-generated native ELF objects are not Linux swap targets.
          python3 - "$out" "$work/provenance/gcc-objects.sha256" <<'PY_GCC_POOL'
          import hashlib
          from pathlib import Path
          import struct
          import sys
          out, dest = map(Path, sys.argv[1:])
          total = 0
          with dest.open("w", encoding="utf-8") as manifest:
              for obj in sorted(out.rglob("*.o")):
                  with obj.open("rb") as src:
                      header = src.read(20)
                  if (len(header) < 20 or header[:4] != b"\x7fELF"
                      or header[5] != 1
                      or struct.unpack_from("<H", header, 16)[0] != 1
                      or struct.unpack_from("<H", header, 18)[0] != 243):
                      continue
                  digest = hashlib.sha256()
                  with obj.open("rb") as src:
                      for data in iter(lambda: src.read(1048576), b""):
                          digest.update(data)
                  manifest.write(f"{digest.hexdigest()}  {obj.relative_to(out)}\n")
                  total += 1
          print(f"GNU_RISCV_OBJECT_POOL objects={total} manifest={dest}")
          PY_GCC_POOL
          count=$(wc -l <"$work/provenance/gcc-objects.sha256")
          echo "GNU_GOLDEN_OBJECT_COUNT=$count"
          # Fail if Kbuild produced an implausibly small kernel object pool.
          test "$count" -ge 1500
          {
            echo "schema=linux-gnu-exact-config-v1"
            echo "linux_release=6.6.143"
            echo "linux_archive_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"
            echo "config_sha256=$actual"
            echo "gcc_version=$(riscv64-linux-gnu-gcc -dumpfullversion)"
            echo "gcc_target=$(riscv64-linux-gnu-gcc -dumpmachine)"
            echo "gcc_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)"
            echo "gnu_ld_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -d' ' -f1)"
            echo "gnu_ar_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ar)" | cut -d' ' -f1)"
            echo "gcc_object_count=$count"
            echo "vmlinux_sha256=$(sha256sum "$out/vmlinux" | cut -d' ' -f1)"
            echo "image_sha256=$(sha256sum "$out/arch/riscv/boot/Image" | cut -d' ' -f1)"
            echo "qemu_contract=full_and_p1_passed"
          } >"$work/provenance/gcc-baseline.txt"
          bin_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          key="linux-gnu-golden-v1-6.6.143-$actual-$bin_sig-$ld_sig"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "GNU_EXACT_GOLDEN=PASS objects=$count config=$actual cache_key=$key"
          du -sh "$out" || true

      - name: Save certified GNU Linux object pool for MiniC one-TU swaps
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.exact_gnu.outputs.key }}

      # GitHub Actions caches are branch-scoped: the old agent-branch GCC
      # golden/source caches cannot be restored after consolidating to main.
      # Seed the identical pinned sources once from the existing GNU baseline
      # producer. No extra job and no change to the previously validated
      # seven-shard compilation or QEMU verification path.
      - name: Stage certified GNU Linux sources on canonical main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/linux-expanded-kbuild-v0
          mv build/linux-runtime-gcc/linux-6.6.143 \
             build/linux-expanded-kbuild-v0/linux-6.6.143
          test -f build/linux-expanded-kbuild-v0/linux-6.6.143/Makefile

      - name: Save pinned Linux source cache for canonical main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1

      - name: Preserve runtime blocker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-gcc-blocker
          path: |
            build/linux-runtime-gcc/qemu/*.log
            build/linux-runtime-gcc/qemu-p1/*.log
            build/linux-runtime-gcc/out/.config
            build/linux-runtime-gcc/runtime-initramfs.cpio.gz
          if-no-files-found: ignore
          retention-days: 1

  gcc-single:
    # Reuse the EXISTING opt-in isolation job. ONE runner handles the entire
    # batch compile, two cohorts and any QEMU prefix bisection.
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[linux-runtime-gcc-cohort]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') || contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') || contains(github.event.head_commit.message, '[linux-perf-hotowners]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install GNU RISC-V toolchain and QEMU once
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross \
            python3 make cpio gzip || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip device-tree-compiler gdb-multiarch
            }

      - name: Derive exact certified GNU golden cache key
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - name: Restore QEMU-certified GNU golden objects
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.identity.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore pinned Linux 6.6.143 source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Derive full same-config GCC C object universe
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          # Rapid diagnostic: exactly 384 objects, not the whole C universe.
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') }}" == true ]]; then
            python3 - "$ev/full-objects.txt" <<'PY_DIAGNOSTIC'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          objects=[x for x in p.read_text().splitlines() if x and not x.startswith("#")]
          assert len(objects)>=384
          p.write_text("# DIAGNOSTIC_384_FROM_PINNED_GNU_FULL_C_UNIVERSE\n"
                       + "\n".join(objects[:384]) + "\n")
          print("COHORT_SCOPE=DIAGNOSTIC_384 objects=384")
          PY_DIAGNOSTIC
          fi
          # Fast exact-config one-object compile/ABI/symbol oracle.  It is
          # deliberately NOT an Image/QEMU verdict; no new workflow/job.
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') }}" == true ]]; then
            grep -Fxq kernel/dma/direct.o "$ev/full-objects.txt"
            printf '%s\n' kernel/dma/direct.o > "$ev/full-objects.txt"
            echo "COHORT_SCOPE=DMA_SINGLE_COMPILE_ONLY objects=1"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            for owner in kernel/dma/direct.o mm/truncate.o mm/shmem.o; do
              grep -Fxq "$owner" "$ev/full-objects.txt"
            done
            printf '%s\n' kernel/dma/direct.o mm/truncate.o mm/shmem.o > "$ev/full-objects.txt"
            echo "COHORT_SCOPE=LINK_TRIAD_COMPILE_ONLY objects=3"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') }}" == true ]]; then
            grep -Fxq mm/shmem.o "$ev/full-objects.txt"
            printf '%s\n' mm/shmem.o > "$ev/full-objects.txt"
            echo "COHORT_SCOPE=SHMEM_SINGLE_COMPILE_ONLY objects=1"
          fi
          # One REAL Linux 6.6.143 C translation unit, after historical GCC
          # Kbuild generated-header fixture. No seven shards, link or QEMU.
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') }}" == true ]]; then
            grep -Fxq lib/crypto/blake2s-generic.o "$ev/full-objects.txt"
            printf '%s\n' lib/crypto/blake2s-generic.o > "$ev/full-objects.txt"
            echo "BLAKE2S_SINGLE=SELECTED target=lib/crypto/blake2s-generic.o baseline_minic_ms=1981990"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-hotowners]') }}" == true ]]; then
            # Three highly expensive, structurally distinct Linux C owners.
            # Never reuse the blake2s experiment for one-off tuning.
            if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-hotowners-rotation]') }}" == true ]]; then
              # New, disjoint C owners; old three-owner A/B inputs remain cached.
              targets=(net/core/dev.o net/ipv4/tcp_input.o lib/crc32.o)
              cohort_label=ROTATION
            else
              targets=(kernel/bpf/btf.o kernel/bpf/verifier.o net/core/filter.o)
              cohort_label=ORIGINAL
            fi
            for owner in "${targets[@]}"; do
              grep -Fxq "$owner" "$ev/full-objects.txt"
            done
            printf '%s\n' "${targets[@]}" >"$ev/full-objects.txt"
            echo "BOOL_HOT_OWNER_SELECTION=PASS mode=$cohort_label owners=3 total_full_C_untouched=true"
          fi

      - name: Compute pinned MiniC candidate object cache identity
        id: candidate_id
        shell: bash
        run: |
          set -Eeuo pipefail
          # Must be computed from the CLEAN sources, before 39 MiniC
          # runtime-profile patches modify src/ in place.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') }}" == true ]]; then
            # An opt-in patch outside the default profile must be part of
            # the immutable MiniC object cache identity.
            profile="${profile}-blake2s-cfg-linear-$(sha256sum tools/ci/apply-riscv64-p1-defined-before-use-crossblock-v1.py | cut -c1-16)"
          fi
          if [[ "${{ (contains(github.event.head_commit.message, '[linux-perf-boolean-single]') || contains(github.event.head_commit.message, '[linux-perf-hotowners]')) && !contains(github.event.head_commit.message, '[minic-source-paired-ab]') }}" == true ]]; then
            [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') || contains(github.event.head_commit.message, '[linux-perf-hotowners]') }}" == true ]] || { echo 'BOOLEAN_CACHE_SINGLE=FAIL missing_owner'; exit 8; }
            profile="${profile}-bool-index-$(sha256sum tools/ci/apply-inline-specialization-local-boolean-domain-scoped-v1.py tools/ci/apply-inline-specialization-local-boolean-domain-index-v0.py | sha256sum | cut -c1-16)"
            echo 'BOOLEAN_CACHE_SINGLE=IDENTITY patch_sha_bound=true'
          fi
          objects=$(sha256sum build/linux-runtime-gcc-cohort-v1/full-objects.txt | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "key=gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$objects-$gcc-$assembler" >>"$GITHUB_OUTPUT"

      - name: Restore exact ABI-validated MiniC candidate objects
        id: candidate_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ steps.candidate_id.outputs.key }}

      - name: Restore SHA-bound selected hot-owner preprocessed sources
        if: contains(github.event.head_commit.message, '[linux-perf-hotowners]')
        id: hot_sources_restore
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-gcc-cohort-v1/boolean-hot
          key: ${{ steps.candidate_id.outputs.key }}-hot-owner-frozen-inputs-v1

      - name: Build MiniC once and produce authenticated C candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          # Kbuild .cmd depends on the producer's exact source path.
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') || contains(github.event.head_commit.message, '[linux-perf-hotowners]') }}" == true ]]; then
            export MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1
            echo "BLAKE2S_SINGLE=PROFILE exact_full_crossblock_profile=true"
          fi
          # Main-only recertification: verify the current checked-out
          # compiler instead of applying the immutable 2026-10-17 patch
          # overlay or requiring obsolete pre-refactor file hashes.
          export MINIC_CURRENT_MAIN_SEVEN_RECHECK=1
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          if [[ "${{ (contains(github.event.head_commit.message, '[linux-perf-boolean-single]') || contains(github.event.head_commit.message, '[linux-perf-hotowners]')) && !contains(github.event.head_commit.message, '[minic-source-paired-ab]') }}" == true ]]; then
            tool="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain"
            # minic is only the driver. minic-cc contains compiler.c and
            # MUST change when Boolean Domain optimization is actually built.
            cp "$tool/bin/minic-cc" "$ev/compiler/minic-cc-before-boolean"
            chmod 755 "$ev/compiler/minic-cc-before-boolean"
            python3 tools/ci/apply-inline-specialization-local-boolean-domain-scoped-v1.py >>"$ev/compiler/patch.log"
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tool" "$tool/bin/minic" "$tool/bin/minic-cc" >/dev/null
            git diff --check
            echo apply-inline-specialization-local-boolean-domain-scoped-v1.py >>"$ev/compiler/minic-profile.txt"
            sha256sum "$tool/bin/minic" "$tool/bin/minic-cc" >"$ev/compiler/minic.sha256"
            old_sha=$(sha256sum "$ev/compiler/minic-cc-before-boolean" | cut -d' ' -f1)
            new_sha=$(sha256sum "$tool/bin/minic-cc" | cut -d' ' -f1)
            [[ "$old_sha" != "$new_sha" ]] || {
              echo 'BOOLEAN_CACHE_SINGLE=FAIL unchanged_minic_cc_compiler'; exit 8;
            }
            echo "BOOLEAN_CACHE_SINGLE=READY minic_cc_before=${old_sha:0:16} minic_cc_after=${new_sha:0:16}"
          fi
          export COHORT_ALLOW_DIAGNOSTIC_384=${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') && '1' || '0' }}
          export COHORT_ALLOW_SHARD=${{ (contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') || contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') || contains(github.event.head_commit.message, '[linux-perf-hotowners]')) && '1' || '0' }}
          export COHORT_ACTION=compile
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-hotowners]') }}" == true ]]; then
            export COHORT_GNU_PREFLIGHT_ALLOW_BOOL_HOT=1
            export COHORT_KEEP_BOOL_HOT_I=1
            export COHORT_BOOL_HOT_ROTATION=${{ contains(github.event.head_commit.message, '[linux-perf-hotowners-rotation]') && '1' || '0' }}
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-boolean-single]') }}" == true ]]; then
            export COHORT_GNU_PREFLIGHT_ALLOW_BOOL_SINGLE=1
            export COHORT_KEEP_BOOL_SINGLE_I=1
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') }}" == true ]]; then
            # Fail quickly if the supposed O(n) fix still costs minutes;
            # the historical 33m value is already proven by CI #38400728544.
            timeout --signal=TERM --kill-after=10s 300s bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
              "$work/linux-6.6.143" "$work/out" \
              "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
              "$work/provenance" "$ev/full-objects.txt" "$ev"
          else
            bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
              "$work/linux-6.6.143" "$work/out" \
              "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
              "$work/provenance" "$ev/full-objects.txt" "$ev"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-boolean-single]') }}" == true ]]; then
            python3 -m py_compile tools/ci/linux-perf-pinned-single-paired-ab-v1.py
            exact_i="$ev/boolean-ab/blake2s-generic.frozen.i"
            test -s "$exact_i" || { echo 'BOOLEAN_CACHE_SINGLE=FAIL frozen_kbuild_i_missing'; exit 8; }
            mkdir -p "$ev/boolean-ab/baseline/bin"
            cp "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" "$ev/boolean-ab/baseline/bin/minic"
            cp "$ev/compiler/minic-cc-before-boolean" "$ev/boolean-ab/baseline/bin/minic-cc"
            python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
              --input "$exact_i" \
              --baseline-driver "$ev/boolean-ab/baseline/bin/minic" \
              --candidate-driver "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
              --out "$ev/boolean-ab" | tee "$ev/boolean-ab/paired-verdict.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$ev/boolean-ab/paired-verdict.txt"
          fi


      - name: Check completed full MiniC object pool is cacheable
        id: candidate_ready
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          if test -s "$ev/full-objects.txt"; then
            count=$(grep -cE '^[^#[:space:]]+\.o$' "$ev/full-objects.txt" || true)
          else
            count=0
          fi
          min_count=384
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') }}" == true ]]; then
            min_count=1
            test "$count" -eq 1
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            min_count=3
            test "$count" -eq 3
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-perf-hotowners]') }}" == true ]]; then
            min_count=3
            test "$count" -eq 3
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') || contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') }}" == true ]]; then
            min_count=1
            test "$count" -eq 1
          fi
          if test "$count" -ge "$min_count" && \
             test -s "$ev/cohort.log" && \
             { grep -Fq "COHORT_COMPILE=PASS objects=$count" "$ev/cohort.log" || \
               grep -Fq "COHORT_CANDIDATE_CACHE=HIT objects=$count" "$ev/cohort.log"; } && \
             test -s "$ev/minic-manifest.sha256" && \
             test -s "$ev/minic-identity.txt" && \
             grep -Fq "COHORT_ABI=PASS objects=$count" "$ev/cohort.log" && \
             (cd "$ev"; sha256sum --quiet -c minic-manifest.sha256); then
            echo "ready=true" >>"$GITHUB_OUTPUT"
            echo "COHORT_CANDIDATE_READY=PASS objects=$count"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "COHORT_CANDIDATE_READY=FAIL count=$count (check MiniC trace, ABI and candidate hashes)" >&2
            exit 1
          fi

      - name: Save immutable MiniC objects despite later link or QEMU failure
        if: always() && steps.candidate_ready.outputs.ready == 'true' && steps.candidate_restore.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ steps.candidate_id.outputs.key }}

      - name: Preserve the three exact frozen Kbuild sources for future A-B
        if: contains(github.event.head_commit.message, '[linux-perf-hotowners]') && steps.candidate_ready.outputs.ready == 'true' && steps.hot_sources_restore.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-runtime-gcc-cohort-v1/boolean-hot
          key: ${{ steps.candidate_id.outputs.key }}-hot-owner-frozen-inputs-v1

      - name: Restore original SHA-frozen first500 Linux corpus
        if: (contains(github.event.head_commit.message, '[linux-perf-symbolic-first500]') || contains(github.event.head_commit.message, '[linux-perf-integrated-first500]')) && steps.candidate_ready.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/linux-perf-corpus
          key: linux-6.6.143-first500-rv64-v1-${{ hashFiles('tests/external/linux/batch_probe.sh', 'tests/external/linux/probe.sh', 'tests/external/linux/replay-indices.txt') }}
          fail-on-cache-miss: true

      # Explicit one-runner, two-compiler experiment. Historical #38870185276
      # and current #38887211130 both passed full Linux P1. Unlike cross-run
      # timings, these arms run on the same VM over identical SHA-pinned .i.
      # The [minic-source-paired-ab] marker excludes the legacy Boolean patch
      # so exactly the two production compiler.c reachability changes differ.
      - name: Old versus current native MiniC paired A/B on real frozen Linux inputs
        if: contains(github.event.head_commit.message, '[minic-source-paired-ab]') && contains(github.event.head_commit.message, '[linux-perf-hotowners]') && steps.candidate_ready.outputs.ready == 'true'
        timeout-minutes: 38
        shell: bash
        run: |
          set -Eeuo pipefail
          historical=24b0247401d1f973c4aa4f3495d7298cc7dd4cc1
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          work="$ev/boolean-hot/current-oldnew"
          current="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin"
          mkdir -p "$work"
          # No changed frontend/IR/Codegen or build flags may contaminate
          # the comparison. The diff must be exclusively compiler.c.
          git fetch --quiet --no-tags --depth=1 origin "$historical"
          changed=$(git diff --name-only "$historical" "$GITHUB_SHA" -- src include/minic)
          test "$changed" = src/compiler/compiler.c || {
            echo "MINIC_OLDNEW_AB=FAIL production_diff_not_isolated changed=$changed" >&2
            exit 9
          }
          git -c advice.detachedHead=false worktree add --quiet --detach "$work/old-source" "$historical"
          # Build both compiler identities using the SAME pinned runtime
          # crossblock and pure-discarded-equality profile. Historical source
          # includes its own exact native SHA manifest guard.
          (
            cd "$work/old-source"
            MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
              bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$work/old-toolchain" "$work/old-build-evidence"
          )
          old="$work/old-toolchain/bin"
          test -x "$old/minic" && test -x "$old/minic-cc"
          test -x "$current/minic" && test -x "$current/minic-cc"
          old_sha=$(sha256sum "$old/minic-cc" | cut -d' ' -f1)
          new_sha=$(sha256sum "$current/minic-cc" | cut -d' ' -f1)
          test "$old_sha" != "$new_sha" || { echo 'MINIC_OLDNEW_AB=FAIL identical_compiler_identity'; exit 9; }
          echo "MINIC_OLDNEW_AB=IDENTITIES old_commit=$historical current_commit=$GITHUB_SHA old_cc=$old_sha new_cc=$new_sha"
          test -s "$ev/boolean-hot/frozen.sha256"
          (cd "$ev/boolean-hot"; sha256sum --quiet -c frozen.sha256)
          # Rotate old/new first execution order on the very same runner;
          # verify exact assembly SHA in every warmup and measured repetition.
          for owner in net/core/dev.o net/ipv4/tcp_input.o lib/crc32.o; do
            key="${owner//\//_}"
            frozen="$ev/boolean-hot/$key.frozen.i"
            test -s "$frozen"
            python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
              --input "$frozen" \
              --baseline-driver "$old/minic" \
              --candidate-driver "$current/minic" \
              --repeats 4 --out "$work/results/$key" \
              | tee "$work/$key-verdict.txt"
            grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$work/$key-verdict.txt"
          done
          python3 - "$work/results" <<'PY'
          from pathlib import Path
          import json,sys
          results=sorted(Path(sys.argv[1]).glob("*/paired-result.json"))
          assert len(results)==3, f"expected exactly three real owners, got {len(results)}"
          ratios=[]
          for p in results:
              d=json.loads(p.read_text())
              assert d["assembly_identical"] and d["repeat_per_arm"]==4
              ratios.append(d["candidate_speedup"])
              print("MINIC_OLDNEW_OWNER=PASS owner=%s old_p50_ms=%s new_p50_ms=%s speedup=%.4f same_runner=true input_sha=%s" %
                    (p.parent.name,d["baseline_median_ms"],d["candidate_median_ms"],d["candidate_speedup"],d["input_sha256"]))
          print("MINIC_OLDNEW_AB=PASS owners=3 warmups_per_arm=1 repeats_per_arm=4 assembly=byte_identical speedups=%s" %
                ",".join("%.4f"%v for v in ratios))
          PY

      - name: Analyze three frozen hot owners by paired timing or opt-in phase traces
        if: contains(github.event.head_commit.message, '[linux-perf-hotowners]') && !contains(github.event.head_commit.message, '[minic-source-paired-ab]') && !contains(github.event.head_commit.message, '[linux-perf-ast-footprint]') && !contains(github.event.head_commit.message, '[linux-perf-ast-growth]') && steps.candidate_ready.outputs.ready == 'true'
        shell: bash
        timeout-minutes: 24
        run: |
          set -Eeuo pipefail
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-hotowners]') }}" == true ]]; then
            ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
            root="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin"
            mkdir -p "$ev/boolean-hot/baseline/bin"
            cp "$root/minic" "$ev/boolean-hot/baseline/bin/minic"
            cp "$ev/compiler/minic-cc-before-boolean" "$ev/boolean-hot/baseline/bin/minic-cc"
            python3 -m py_compile tools/ci/linux-perf-pinned-single-paired-ab-v1.py
            if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-codegen-use-index]') }}" == true ]]; then
              # New hotspot family: Codegen scalar OBJECT_ADDRESS use-count
              # previously rescans whole IR per address. Existing P14 candidate
              # indexes ValueId uses once per function. Only this algorithm
              # differs; frozen Linux inputs, Boolean baseline and QEMU scope
              # stay unchanged. Do NOT apply the P15 interval pass here.
              work="$ev/boolean-hot/codegen-use"
              mkdir -p "$work/baseline/bin" "$work/index/bin"
              cp "$root/minic" "$work/baseline/bin/minic"
              cp "$root/minic" "$work/index/bin/minic"
              cp "$root/minic-cc" "$work/baseline/bin/minic-cc"
              python3 tools/ci/apply-perf-core-object-address-use-index-v1.py
              make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" \
                "$root/minic-cc" >/dev/null
              cp "$root/minic-cc" "$work/index/bin/minic-cc"
              test "$(sha256sum "$work/baseline/bin/minic-cc" | cut -d' ' -f1)" != "$(sha256sum "$work/index/bin/minic-cc" | cut -d' ' -f1)"
              git diff --check
              if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-hotowners-rotation]') }}" == true ]]; then
                targets=(net/core/dev.o net/ipv4/tcp_input.o lib/crc32.o)
              else
                targets=(kernel/bpf/btf.o kernel/bpf/verifier.o net/core/filter.o)
              fi
              for owner in "${targets[@]}"; do
                key="${owner//\//_}"
                frozen="$ev/boolean-hot/$key.frozen.i"
                test -s "$frozen"
                python3 tools/ci/linux-perf-pinned-single-paired-ab-v1.py \
                  --input "$frozen" \
                  --baseline-driver "$work/baseline/bin/minic" \
                  --candidate-driver "$work/index/bin/minic" \
                  --repeats 2 --out "$work/results/$key" \
                  | tee "$work/$key-screen.txt"
                grep -Fq 'MINIC_ONE_OWNER_AB=PASS' "$work/$key-screen.txt"
                echo "CODEGEN_USE_INDEX_SCREEN=PASS owner=$owner byte_identical=true"
