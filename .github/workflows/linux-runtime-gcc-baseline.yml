name: Linux Runtime GCC Baseline

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/linux-perf-boolean-domain-v1"
    paths:
      - '.github/workflows/linux-runtime-gcc-baseline.yml'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

# P1 calibration rerun after loopback bring-up.

jobs:
  gcc-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-gcc]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V Linux runtime prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils cpio gzip file \
            qemu-system-misc opensbi

      - name: Build deterministic runtime initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-runtime-gcc/initramfs" \
          OUTPUT_INITRAMFS="$GITHUB_WORKSPACE/build/linux-runtime-gcc/runtime-initramfs.cpio.gz" \
          RISCV_CC=riscv64-linux-gnu-gcc \
            bash tests/external/linux/build_runtime_initramfs.sh

      - name: Build Linux 6.6.143 GCC baseline Image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          # Fresh GNU reference campaign: the historical mixed-MiniC cache
          # used config e538a6..., but today's GCC/Kconfig yields its own
          # reproducible config. Only compare MiniC against THIS same config.
          actual_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          echo "GNU_GOLDEN_CONFIG sha=$actual_config historical_mixed=e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 Image
          final_config=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test "$final_config" = "$actual_config"
          echo "GNU_GOLDEN_CONFIG_STABLE=PASS sha=$final_config"
          test -s "$out/arch/riscv/boot/Image"
          file "$out/arch/riscv/boot/Image"
          echo "LINUX_RUNTIME_GCC_IMAGE=PASS release=6.6.143"

      - name: Run Python-era runtime contract against GCC baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu" \
          LINUX_RELEASE=6.6.143 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
          QEMU_SHELL_INPUT_DELAY_SECONDS=8 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_BASELINE=PASS lanes=2/2 head=$GITHUB_SHA"

      - name: Calibrate P1 syscall profile against GCC reference
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          LINUX_IMAGE="$work/out/arch/riscv/boot/Image" \
          INITRAMFS="$work/runtime-initramfs.cpio.gz" \
          BUILD_DIR="$work/qemu-p1" \
          LINUX_RELEASE=6.6.143 \
          LINUX_RUNTIME_PROFILE=p1 \
          QEMU_SYSTEM_RISCV64=qemu-system-riscv64 \
          QEMU_TIMEOUT_SECONDS=90 \
            bash tests/external/linux/runtime_boot.sh
          echo "LINUX_RUNTIME_GCC_P1=PASS syscalls=12 head=$GITHUB_SHA"

      - name: Certify pure-GNU exact-config object pool after QEMU contracts
        id: exact_gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          out="$work/out"
          # Certified GCC .config identity is this run's actual SHA, not a
          # borrowed SHA from the historical mixed-compiler experiment.
          actual=$(sha256sum "$out/.config" | cut -d' ' -f1)
          test -n "$actual"
          test -s "$out/vmlinux"
          test -s "$out/arch/riscv/boot/Image"
          test -s "$out/built-in.a"
          test -s "$out/lib/lib.a"
          mkdir -p "$work/provenance"
          # The default GCC kernel compiles fewer C owners than the 3352
          # frozen candidate-TU corpus. Only record RISC-V ET_REL objects;
          # HOSTCC-generated native ELF objects are not Linux swap targets.
          python3 - "$out" "$work/provenance/gcc-objects.sha256" <<'PY_GCC_POOL'
          import hashlib
          from pathlib import Path
          import struct
          import sys
          out, dest = map(Path, sys.argv[1:])
          total = 0
          with dest.open("w", encoding="utf-8") as manifest:
              for obj in sorted(out.rglob("*.o")):
                  with obj.open("rb") as src:
                      header = src.read(20)
                  if (len(header) < 20 or header[:4] != b"\x7fELF"
                      or header[5] != 1
                      or struct.unpack_from("<H", header, 16)[0] != 1
                      or struct.unpack_from("<H", header, 18)[0] != 243):
                      continue
                  digest = hashlib.sha256()
                  with obj.open("rb") as src:
                      for data in iter(lambda: src.read(1048576), b""):
                          digest.update(data)
                  manifest.write(f"{digest.hexdigest()}  {obj.relative_to(out)}\n")
                  total += 1
          print(f"GNU_RISCV_OBJECT_POOL objects={total} manifest={dest}")
          PY_GCC_POOL
          count=$(wc -l <"$work/provenance/gcc-objects.sha256")
          echo "GNU_GOLDEN_OBJECT_COUNT=$count"
          # Fail if Kbuild produced an implausibly small kernel object pool.
          test "$count" -ge 1500
          {
            echo "schema=linux-gnu-exact-config-v1"
            echo "linux_release=6.6.143"
            echo "linux_archive_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"
            echo "config_sha256=$actual"
            echo "gcc_version=$(riscv64-linux-gnu-gcc -dumpfullversion)"
            echo "gcc_target=$(riscv64-linux-gnu-gcc -dumpmachine)"
            echo "gcc_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)"
            echo "gnu_ld_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -d' ' -f1)"
            echo "gnu_ar_binary_sha256=$(sha256sum "$(command -v riscv64-linux-gnu-ar)" | cut -d' ' -f1)"
            echo "gcc_object_count=$count"
            echo "vmlinux_sha256=$(sha256sum "$out/vmlinux" | cut -d' ' -f1)"
            echo "image_sha256=$(sha256sum "$out/arch/riscv/boot/Image" | cut -d' ' -f1)"
            echo "qemu_contract=full_and_p1_passed"
          } >"$work/provenance/gcc-baseline.txt"
          bin_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          key="linux-gnu-golden-v1-6.6.143-$actual-$bin_sig-$ld_sig"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "GNU_EXACT_GOLDEN=PASS objects=$count config=$actual cache_key=$key"
          du -sh "$out" || true

      - name: Save certified GNU Linux object pool for MiniC one-TU swaps
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.exact_gnu.outputs.key }}

      - name: Preserve runtime blocker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-gcc-blocker
          path: |
            build/linux-runtime-gcc/qemu/*.log
            build/linux-runtime-gcc/qemu-p1/*.log
            build/linux-runtime-gcc/out/.config
            build/linux-runtime-gcc/runtime-initramfs.cpio.gz
          if-no-files-found: ignore
          retention-days: 1

  gcc-single:
    # Reuse the EXISTING opt-in isolation job. ONE runner handles the entire
    # batch compile, two cohorts and any QEMU prefix bisection.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-runtime-gcc-cohort]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install GNU RISC-V toolchain and QEMU once
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi libc6-dev-riscv64-cross \
            python3 make cpio gzip || {
              sudo apt-get -o Acquire::Retries=3 update
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
                qemu-system-misc opensbi libc6-dev-riscv64-cross python3 make cpio gzip
            }

      - name: Derive exact certified GNU golden cache key
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - name: Restore QEMU-certified GNU golden objects
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.identity.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore pinned Linux 6.6.143 source
        uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      - name: Build MiniC once and execute full batched GNU overlay bisection
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          # Kbuild .cmd depends on the producer's exact source path.
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" \
            tools/ci/linux-runtime-gcc-cohort-objects-v1.txt "$ev"

      - name: Preserve compilation, GNU object identities, QEMU verdicts and bisection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-cohort-32-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/compile.log
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/frontier.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/link.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu/*.log
            build/linux-runtime-gcc-cohort-v1/compiler/toolchain-timing.txt
          if-no-files-found: warn
          retention-days: 7
