          import sys
          src,out=map(Path,sys.argv[1:])
          lines=src.read_text(errors="replace").splitlines()
          triggers=[i for i,l in enumerate(lines) if "Insufficient stack space to handle exception!" in l]
          if not triggers:
              raise SystemExit("P1_PANIC_TRACE=FAIL stack_overflow_marker_missing")
