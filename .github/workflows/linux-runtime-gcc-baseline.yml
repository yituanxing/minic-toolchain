          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          echo "COHORT_P1_OWNER_POOL=PASS objects=$(wc -l <"$ev/minic-manifest.sha256") frozen=true"

      # Do not alter the stable runtime profile cache ID: build the EXACT
      # profile first, then inject stderr-only instrumentation. The cohort
      # lane SHA-compares each replayed object with its immutable MiniC .o.
      - name: Instrument original MiniC profile for exact P1 frame audit
        if: contains(github.event.head_commit.message, '[linux-runtime-frame-components]') || contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]')
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain"
          sha256sum "$work/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-pre-audit-compiler.sha256"
          python3 tools/ci/apply-riscv64-p1-frame-diagnostic-v1.py
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]') && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-riscv64-p1-nonreuse-reasons-v1.py
          fi
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work" "$work/bin/minic" "$work/bin/minic-cc"
          sha256sum "$work/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-diagnostic-compiler.sha256"
          echo "P1_FRAME_DIAG=COMPILER_REBUILT same_codegen_only_extra_stderr=true"

      # The default 2064-object Runtime profile and cache remain untouched.
      # This experiment is fail-closed and never updates the canonical compiler.
      - name: Build opt-in write-before-read cross-block MiniC experiment
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-defined-crossblock]') || contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]'))
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain"
          sha256sum "$build/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-pre-crossblock-compiler.sha256"
          if [[ "${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]')) && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-p1-pure-discarded-local-address-equality-v1.py
          else
            python3 tools/ci/apply-riscv64-p1-defined-before-use-crossblock-v1.py
          fi
          if [[ "${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]'))) && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/apply-riscv64-p1-frame-diagnostic-v1.py
          fi
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" "$build/bin/minic" "$build/bin/minic-cc"
          sha256sum "$build/bin/minic" >"$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-crossblock-compiler.sha256"
          echo "P1_DEFINED_CROSSBLOCK=COMPILER_BUILT opt_in_only=true"

      - name: Run P1 experimental Core CFG semantic-only GCC and MiniC differential
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-cfg-semantic-only]')
        shell: bash
        run: |
          set -Eeuo pipefail
          # Exact Runtime profile+opt-in backend was built above, not the
          # unpatched stock MiniC. Avoid relinking or booting Linux here.
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends qemu-user
          minic="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/cfg-semantic-only"
          test -x "$minic"
          mkdir -p "$work"
          MINIC="$minic" WORK="$work/existing" RISCV_CC=riscv64-linux-gnu-gcc \
            QEMU_RISCV64=qemu-riscv64 \
            bash tests/compiler/c0/run-core-cfg-slot-reuse-p1.sh
          MINIC="$minic" WORK="$work/adversarial" RISCV_CC=riscv64-linux-gnu-gcc \
            QEMU_RISCV64=qemu-riscv64 \
            bash tests/compiler/c0/run-core-cfg-slot-reuse-adversarial-p1.sh
          MINIC="$minic" BUILD_DIR="$work" RISCV_CC=riscv64-linux-gnu-gcc \
            QEMU_RISCV64=qemu-riscv64 \
            bash tests/compiler/c0/run-pure-discarded-address-rv64.sh
          echo "P1_CFG_SEMANTIC_ONLY=PASS gcc_minic_baseline_crossblock=3way matrix=7+8 x1023 no_kernel_link=true no_linux_recompile=true"

      # Diagnostic-only: same exact GNU golden + SHA-authenticated 2064 MiniC
      # object fixture as native union; do not run Kbuild, linker or QEMU here.
      # Retain MiniC .s across MiniAS revisions so future work reassembles only.
      - name: Restore exact MiniC assembly sample for MiniAS (independent of MiniAS SHA)
        id: minias_corpus_s_cache
        if: contains(github.event.head_commit.message, '[linux-minias-corpus-scan]')
        uses: actions/cache/restore@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-64
          restore-keys: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-12

      - name: Probe representative real Linux MiniC assembly with MiniAS (no C objects rebuilt)
        if: contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') && !contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-matched-key }}" = "$FULL_MINIC_KEY"
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          tools="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tools" "$tools/bin/minic-as"
          python3 tools/ci/minias-linux-corpus-probe-v1.py \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --candidate-pool "$ev/minic" --manifest "$ev/minic-manifest.sha256" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --minias "$tools/bin/minic-as" \
            --work "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --cache-identity "$FULL_MINIC_KEY" --limit 64

      # Isolated full 2064-object assembly coverage; the 64 .s cache is the
      # bootstrap. No new workflow/jobs, no C-object compilation, and no
      # Kbuild/link/QEMU cost until the real assembly gaps are classified.
      - name: Restore expanded complete MiniC S corpus
        id: minias_full_s_cache
        if: contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        uses: actions/cache/restore@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-2064

      - name: Sweep all certified Linux C owners through native MiniAS
        if: contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        shell: bash
        timeout-minutes: 75
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          tools="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tools" "$tools/bin/minic-as"
          python3 tools/ci/minias-linux-full-corpus-v1.py \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --candidate-pool "$ev/minic" --manifest "$ev/minic-manifest.sha256" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --minias "$tools/bin/minic-as" \
            --work "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --cache-identity "$FULL_MINIC_KEY" --jobs 4

      - name: Save SHA-locked Linux S corpus for future MiniAS-only reassembly
        if: always() && contains(github.event.head_commit.message, '[linux-minias-full-corpus]') && steps.minias_full_s_cache.outputs.cache-hit != 'true' && hashFiles('build/minias-linux-corpus-v1/assembly/index.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-2064

      - name: Preserve full native assembly coverage report and blockers
        if: always() && contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        uses: actions/upload-artifact@v4
        with:
          name: minias-full-corpus-${{ github.sha }}
          path: |
            build/minias-linux-corpus-v1/full-summary.json
            build/minias-linux-corpus-v1/full-scan.tsv
            build/minias-linux-corpus-v1/evidence/python-failures/*.txt
            build/minias-linux-corpus-v1/evidence/**/*.minias.log
          retention-days: 7
          if-no-files-found: warn

      - name: Prepare SHA-verified 60-MiniAS object overlay from 64 cached assemblies
        if: contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]')
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          python3 tools/ci/minias-linux-corpus-runtime-overlay-v1.py \
            --original-pool "$ev/minic" \
            --manifest "$ev/minic-manifest.sha256" \
            --scan-root "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --destination "$ev/minias-corpus-64-pool" \
            --evidence "$ev/minias-corpus-64-evidence" \
            --cache-identity "$FULL_MINIC_KEY"

      - name: Cache frozen MiniC assembly sample for later MiniAS-only changes
        # Even if later .cmd parsing fails, retain each already SHA-attested
        # .s file. This cache has a per-member identity index.
        if: always() && contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') && !contains(github.event.head_commit.message, '[linux-minias-full-corpus]') && steps.minias_corpus_s_cache.outputs.cache-hit != 'true' && hashFiles('build/minias-linux-corpus-v1/assembly/index.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-64

      - name: Keep MiniAS sampled gap classification without kernel relink
        if: always() && contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') && !contains(github.event.head_commit.message, '[linux-minias-full-corpus]')
        uses: actions/upload-artifact@v4
        with:
          name: minias-linux-corpus-scan-${{ github.sha }}
          path: |
            build/minias-linux-corpus-v1/scan.tsv
            build/minias-linux-corpus-v1/evidence/**/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Download frozen real MiniC earlycon.s for isolated native MiniAS object in full Linux
        if: contains(github.event.head_commit.message, '[linux-native-minias-earlycon]')
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38426379946
          github-token: ${{ github.token }}
          name: sharded-gnu-minic-QEMU-088b8ef0a30154e1eeaeb145107a1b51c07ba996
          path: build/minias-earlycon-full-artifact

      # Exactly the 2064 fresh MiniC .s inputs verified by the existing
      # seven gcc-shards jobs in successful run #38498107462. No recompilation
      # and no new workflow. This is the NEXT integration gate, not an
      # independent MiniAS correctness rerun.
      - name: Reuse all seven certified MiniC assembly-shard artifacts
        if: contains(github.event.head_commit.message, '[linux-minias-all-C-runtime]')
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38498107462
          github-token: ${{ github.token }}
          pattern: minias-seven-corpus-*
          merge-multiple: false
          path: build/minias-seven-runtime-input

      - name: Promote all 2060 stable MiniC assembly owners through native MiniAS
        if: contains(github.event.head_commit.message, '[linux-minias-all-C-runtime]')
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          minias="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$minias" "$minias/bin/minic-as"
          python3 tools/ci/minias-linux-corpus-runtime-overlay-v1.py \
            --original-pool "$ev/minic" \
            --manifest "$ev/minic-manifest.sha256" \
            --scan-root "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --destination "$ev/minias-corpus-2064-pool" \
            --evidence "$ev/minias-corpus-2064-evidence" \
            --cache-identity "$FULL_MINIC_KEY" \
            --seven-shard-root "$GITHUB_WORKSPACE/build/minias-seven-runtime-input" \
            --minias "$minias/bin/minic-as" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out"

      # Historical MiniAS full GNU-origin .S support already passed QEMU.
      # Extend accepted 2064 MiniC->MiniAS C-object runtime to the actual
      # non-C Kbuild assembly owners. No new jobs or full C compilation.
      - name: Reassemble actual non-C Linux Kbuild S owners using MiniAS
        if: contains(github.event.head_commit.message, '[linux-minias-native-S-runtime]')
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          test -x "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools/bin/minic-as"
          python3 tools/ci/minias-linux-corpus-runtime-overlay-v1.py \
            --original-pool "$ev/minic" --manifest "$ev/minic-manifest.sha256" \
            --scan-root "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --cache-identity "$FULL_MINIC_KEY" \
            --destination "$ev/minias-native-S-pool" \
            --evidence "$ev/minias-native-S-evidence" \
            --golden-out "$work/out" \
            --minias "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools/bin/minic-as" \
            --native-asm-only --c-universe "$ev/full-objects.txt" \
            --gcc-manifest "$work/provenance/gcc-objects.sha256"

      - name: Prepare native MiniAR, final-link MiniLD and MiniObjcopy (same cached C objects)
        if: contains(github.event.head_commit.message, '[linux-native-union-cached]') && (!contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') || contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]'))
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-runtime-native-union-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-native-union-v1-tools" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/native-union"
          echo "NATIVE_UNION_TOOLS=PASS minic_C_objects_reused=true"

      - name: Prepare one native MiniAS earlycon.o and attest 2063 unchanged MiniC objects
        if: contains(github.event.head_commit.message, '[linux-native-minias-earlycon]')
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
          bash tools/ci/minias-linux-earlycon-p1-experiment-v1.sh \
            "$GITHUB_WORKSPACE/build/minias-earlycon-full-artifact" \
            "$ev/minic" "$ev/minias-earlycon-pool" \
            "$GITHUB_WORKSPACE/build/minias-earlycon-p1-tools" \
            "$ev/minias-earlycon-experiment"
          echo "MINIAS_EARLYCON_FULL_PREPARE=PASS original_2064_SHA_cache_immutable=true"

      - name: GNU-only link and QEMU with NO MiniC recompilation
        if: "!contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-cfg-semantic-only]') && !contains(github.event.head_commit.message, '[linux-minild-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-reloc-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-purgatory-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso64-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') && (!contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') || contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]'))"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          export COHORT_ACTION=verify
          if [[ "${{ contains(github.event.head_commit.message, '[linux-native-union-cached]') && '1' || '0' }}" == 1 ]]; then
            test "${{ steps.p1_minic_frozen_cache.outputs.cache-hit }}" = true
            native="$ev/native-union"
            toolchain="$GITHUB_WORKSPACE/build/linux-runtime-native-union-v1-tools"
            export MINIAR="$toolchain/bin/minic-ar"
            export MINILD="$toolchain/bin/minic-ld"
            export MINIOBJCOPY="$toolchain/bin/minic-objcopy"
            export NATIVE_TRACE_DIR="$native"
            export COHORT_NATIVE_UNION=1
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-minias-earlycon]') && '1' || '0' }}" == 1 ]]; then
              export COHORT_P1_EXPERIMENTAL_POOL="$ev/minias-earlycon-pool"
              test -s "$ev/minias-earlycon-experiment/experimental-earlycon-object.sha256"
              echo "MINIAS_EARLYCON_QEMU_EXPERIMENT=ENABLED selected_C_objects=2064 compiled_C_objects=0 native_AS_owners=1 frozen_GNU_AS_owners=2063"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]') && '1' || '0' }}" == 1 ]]; then
              export COHORT_P1_EXPERIMENTAL_POOL="$ev/minias-corpus-64-pool"
              export COHORT_MINIAS_CORPUS_MANIFEST="$ev/minias-corpus-64-evidence/native-object-hashes.sha256"
              test "$(wc -l < "$COHORT_MINIAS_CORPUS_MANIFEST")" -eq 60
              (cd "$COHORT_P1_EXPERIMENTAL_POOL" && sha256sum --quiet -c "$COHORT_MINIAS_CORPUS_MANIFEST")
              echo "MINIAS_CORPUS_QEMU_EXPERIMENT=ENABLED native=60 original=2004 gcc_E_and_minic_S_reused=true"
              if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-dynamic-headers]') && '1' || '0' }}" == 1 ]]; then
                export COHORT_MINIAS_DYNAMIC_HEADERS=1
                export COHORT_MINIAS_HEADER_AS="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools/bin/minic-as"
                test -x "$COHORT_MINIAS_HEADER_AS"
                echo 'MINIAS_DYNAMIC_HEADERS=ENABLED Kbuild_header_recompile=MiniC_S_then_MiniAS'
              fi
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-all-C-runtime]') && '1' || '0' }}" == 1 ]]; then
              export COHORT_P1_EXPERIMENTAL_POOL="$ev/minias-corpus-2064-pool"
              export COHORT_MINIAS_CORPUS_MANIFEST="$ev/minias-corpus-2064-evidence/native-object-hashes.sha256"
              export COHORT_MINIAS_EXPECTED_NATIVE=2060
              export COHORT_MINIAS_DYNAMIC_HEADERS=1
              export COHORT_MINIAS_HEADER_AS="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools/bin/minic-as"
              test -x "$COHORT_MINIAS_HEADER_AS"
              test "$(wc -l < "$COHORT_MINIAS_CORPUS_MANIFEST")" -eq 2060
              (cd "$COHORT_P1_EXPERIMENTAL_POOL" && sha256sum --quiet -c "$COHORT_MINIAS_CORPUS_MANIFEST")
              echo "MINIAS_FULL_NATIVE_C=ENABLED stable_native=2060 dynamic_pending=4 all_C=2064 existing_QEMU_runner=true"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-native-S-runtime]') && '1' || '0' }}" == 1 ]]; then
              export COHORT_MINIAS_NATIVE_S_POOL="$ev/minias-native-S-pool"
              export COHORT_MINIAS_NATIVE_S_MANIFEST="$ev/minias-native-S-evidence/native-S-hashes.sha256"
              export COHORT_MINIAS_KBUILD_AS=1
              export MINIAS="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools/bin/minic-as"
              test -x "$MINIAS"
              test -s "$COHORT_MINIAS_NATIVE_S_MANIFEST"
              echo "MINIAS_NATIVE_S=ENABLED count=$(wc -l < "$COHORT_MINIAS_NATIVE_S_MANIFEST") only_existing_Kbuild_inputs=true"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-purgatory-r]') && '1' || '0' }}" == 1 ]]; then
              export MINILD_ENABLE_PURGATORY_R=1
              echo "MINILD_PURGATORY_R=ENABLED boundary=purgatory.ro only gnu_purgatory_chk=true"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-purgatory-static]') && '1' || '0' }}" == 1 ]]; then
              export MINILD_ENABLE_PURGATORY_STATIC=1
              echo "MINILD_PURGATORY_STATIC=ENABLED exact_link=purgatory.chk"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-intermediate-vmlinux-r]') && '1' || '0' }}" == 1 ]]; then
              export MINILD_ENABLE_VMLINUX_R=1
              echo "MINILD_NATIVE_R=ENABLED boundary=vmlinux.o only gnu_linkers=other_unproven"
            fi
            export COHORT_NATIVE_AR="$native/ar-wrapper"
            export COHORT_NATIVE_LD="$native/ld-wrapper"
            export COHORT_NATIVE_OBJCOPY="$native/objcopy-wrapper"
            # No shard recompile: the cached 2064 C objects stay byte-for-byte
            # identical until Kbuild's separately attested generated-header
            # reconciliation, usually four exact C owners.
            test "$(wc -l < "$ev/minic-manifest.sha256")" -eq 2064
            (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
            echo "NATIVE_UNION_CACHE=VERIFIED owners=2064 compile_C=0 reuse_GCC_gold=true"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-full-crossblock]') && '1' || '0' }}" == 1 ]]; then
            export MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1
            export COHORT_LINUX_FULL_CROSSBLOCK=1
            echo "LINUX_FULL_CROSSBLOCK=FULL_VERIFY all_2064_MiniC=true original_stack_16KiB=true"
          fi
          # Full-current acceptance: seven authenticated MiniC producer shards feed
          # this same receiver. Reuse the merged immutable 2064-object pool for
          # the known seven-owner experimental P1 correction in this SAME job;
          # do not rerun a second CI just to restore a freshly built full cache.
          # Bare [linux-runtime-gcc-sharded] retains its original no-swap path.
          export COHORT_P1_STACK_OWNER_SWAPS=${{ (contains(github.event.head_commit.message, '[linux-runtime-stack-owners]') || (contains(github.event.head_commit.message, '[linux-runtime-gcc-sharded]') && contains(github.event.head_commit.message, '[linux-runtime-p1-defined-crossblock]'))) && '1' || '0' }}
          export COHORT_P1_IDENTICAL_IMAGE_REPEAT=${{ contains(github.event.head_commit.message, '[linux-runtime-repeat-image]') && '1' || '0' }}
          export COHORT_P1_GDB_STACK=${{ (contains(github.event.head_commit.message, '[linux-runtime-gdb-stack]') || contains(github.event.head_commit.message, '[linux-runtime-p1-sched-chain]')) && '1' || '0' }}
          export P1_GDB_SCHED_CHAIN=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-sched-chain]') && '1' || '0' }}
          export P1_GDB_IRQ_REENTRY=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-low-irq-entry]') && '1' || '0' }}
          export COHORT_P1_MULTI_RESCUE=${{ contains(github.event.head_commit.message, '[linux-runtime-multi-rescue]') && '1' || '0' }}
          export COHORT_P1_MINIMIZE_RESCUE=${{ contains(github.event.head_commit.message, '[linux-runtime-rescue-minimize]') && '1' || '0' }}
          export COHORT_P1_PAIR_RESCUE=${{ contains(github.event.head_commit.message, '[linux-runtime-rescue-pairs]') && '1' || '0' }}
          export COHORT_P1_PAIR_DEBUG=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-pair-debug]') && '1' || '0' }}
          export COHORT_P1_DEFINED_CROSSBLOCK=${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-defined-crossblock]') || contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]'))) && '1' || '0' }}
          export COHORT_P1_DISCARD_EQ=${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]')) && '1' || '0' }}
          export COHORT_P1_DISCARD_EQ_BOTH=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]') && '1' || '0' }}
          export COHORT_P1_SINGLE_OWNER=${{ (contains(github.event.head_commit.message, '[linux-runtime-p1-ip6-single]') || (contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq]') || contains(github.event.head_commit.message, '[linux-runtime-p1-discard-eq-pair]'))) && '1' || '0' }}
          if [[ "$COHORT_P1_SINGLE_OWNER" == 1 ]]; then
            [[ "$COHORT_P1_DEFINED_CROSSBLOCK" == 1 && "$COHORT_P1_PAIR_RESCUE" == 0 ]] || {
              echo "P1_IP6_SINGLE=INVALID conflicting_experiment_flags"; exit 8;
            }
            echo "P1_IP6_SINGLE=ENABLED replay=ip6_output.o gcc=tcp_ipv6.o unchanged_others=2062"
          fi
          export COHORT_FRAME_CAPTURE_ONLY=${{ (contains(github.event.head_commit.message, '[linux-runtime-frame-components]') || contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]')) && '1' || '0' }}
          export COHORT_NONREUSE_REASON_CAPTURE=${{ contains(github.event.head_commit.message, '[linux-runtime-p1-nonreuse-reasons]') && '1' || '0' }}
          export MINIC_CORE_FRAME_TRACE_FILTER=ip6_finish_output2,ip6_xmit,tcp_v6_connect,__tcp_transmit_skb
          # #38219062394 identified 4064B and 2288B MiniC stack frames in
          # ip6_finish_output2 and ip6_xmit. Test the containing C owner,
          # then tcp_output, with all other 2063 objects pinned unchanged.
          if [[ "${COHORT_P1_STACK_OWNER_SWAPS}" == 1 ]]; then
            export COHORT_P1_SWAP_OWNERS="net/ipv6/ip6_output.o net/ipv4/tcp_output.o"
            if [[ "${COHORT_P1_IDENTICAL_IMAGE_REPEAT}" == 1 ]]; then
              export COHORT_P1_SWAP_OWNERS="net/ipv6/ip6_output.o"
            fi
          fi
          export COHORT_CAPTURE_ONLY=${{ contains(github.event.head_commit.message, '[linux-runtime-earlycon-capture]') && '1' || '0' }}
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-native-union-cached]') && '1' || '0' }}" == 1 ]]; then
            grep -Fq 'COHORT_CANDIDATE_CACHE=HIT objects=2064' "$ev/cohort.log" || {
              echo 'NATIVE_UNION_CACHE=FAIL fallback_recompiled_full_C_pool' >&2; exit 20;
            }
            grep -Fq 'COHORT_RESULT=PASS candidate_objects=2064 scope=FULL_C_UNIVERSE' "$ev/cohort.log" || {
              echo 'NATIVE_UNION_RESULT=FAIL missing_exact_2064_P1_pass' >&2; exit 21;
            }
            test -s "$NATIVE_TRACE_DIR/miniar.trace"
            test -s "$NATIVE_TRACE_DIR/miniobjcopy.trace"
            minic_ar_calls=$(grep -c '^miniar ' "$NATIVE_TRACE_DIR/miniar.trace" || true)
            minic_mpit_calls=$(grep -c '^miniar mPiT ' "$NATIVE_TRACE_DIR/miniar.trace" || true)
            gnu_ar_calls=$(grep -c '^gnu-ar' "$NATIVE_TRACE_DIR/miniar.trace" || true)
            [[ "$minic_ar_calls" -gt 0 && "$minic_mpit_calls" -gt 0 && "$gnu_ar_calls" == 0 ]] || {
              echo "NATIVE_UNION=FAIL AR_path expected_all_native_mPiT_without_GNU_AR" >&2
              exit 22
            }
            test "$(grep -c '^minild ' "$NATIVE_TRACE_DIR/minild.trace")" -ge 3
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-purgatory-r]') && '1' || '0' }}" == 1 ]]; then
              native_purgatory=$(grep -c '^minild-purgatory-r ' "$NATIVE_TRACE_DIR/minild.trace" || true)
              gnu_purgatory=$(grep -Ec '^gnu-ld .* -o arch/riscv/purgatory/purgatory\.ro($| )' "$NATIVE_TRACE_DIR/minild.trace" || true)
              [[ "$native_purgatory" -ge 1 && "$gnu_purgatory" -eq 0 ]] || {
                echo "NATIVE_UNION=FAIL purgatory.ro -r expected_native_no_GNU_fallback" >&2
                exit 24
              }
              echo "MINILD_PURGATORY_R=PASS native_calls=$native_purgatory gnu_calls=0 full_QEMU_P1=PASS"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-purgatory-static]') && '1' || '0' }}" == 1 ]]; then
              native_static=$(grep -c '^minild-purgatory-static ' "$NATIVE_TRACE_DIR/minild.trace" || true)
              gnu_static=$(grep -Ec '^gnu-ld .* -o arch/riscv/purgatory/purgatory\.chk($| )' "$NATIVE_TRACE_DIR/minild.trace" || true)
              [[ "$native_static" -ge 1 && "$gnu_static" -eq 0 ]] || {
                echo "NATIVE_UNION=FAIL purgatory.chk expected_native_no_GNU_fallback" >&2
                exit 25
              }
              echo "MINILD_PURGATORY_STATIC=PASS native_calls=$native_static gnu_calls=0 full_QEMU_P1=PASS"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-intermediate-vmlinux-r]') && '1' || '0' }}" == 1 ]]; then
              minild_r_calls=$(grep -c '^minild-r ' "$NATIVE_TRACE_DIR/minild.trace" || true)
              gnu_r_calls=$(grep -c '^gnu-ld .* -o vmlinux.o ' "$NATIVE_TRACE_DIR/minild.trace" || true)
              [[ "$minild_r_calls" -eq 2 && "$gnu_r_calls" -eq 0 ]] || {
                echo "NATIVE_UNION=FAIL vmlinux.o -r expected_two_real_MiniLD_calls_no_GNU" >&2
                exit 23
              }
              echo "MINILD_NATIVE_R=PASS calls=$minild_r_calls fallback_GNU_vmlinux_o=0 full_QEMU_P1=PASS"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-native-minias-earlycon]') && '1' || '0' }}" == 1 ]]; then
              grep -Fq 'COHORT_P1=PASS name=full_all_verified syscalls=12 python_era_oracle=PASS' "$ev/cohort.log" || exit 29
              test -s "$ev/minias-earlycon-experiment/experimental-earlycon-object.sha256"
              echo "MINIAS_EARLYCON_FULL_RUNTIME=PASS 2063_GNU_AS_C_objects=sha_verified one_MiniAS_earlycon=true full_QEMU_fast_shell_P1=true no_full_C_recompile=true"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]') && '1' || '0' }}" == 1 ]]; then
              grep -Fq 'COHORT_P1=PASS name=full_all_verified syscalls=12 python_era_oracle=PASS' "$ev/cohort.log" || exit 31
              test "$(grep -c 'MINIAS_CORPUS_RUNTIME_OBJECTS=PASS' "$ev/cohort.log")" -eq 2
              echo 'MINIAS_CORPUS_FULL_RUNTIME=PASS scanned=64 native=60 frozen_GNUAS=2004 full_QEMU_fast_shell_P1=true no_full_C_recompile=true'
              if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-dynamic-headers]') && '1' || '0' }}" == 1 ]]; then
                test "$(grep -c 'MINIAS_DYNAMIC_HEADER_OBJECTS=PASS' "$ev/cohort.log")" -eq 2
                echo 'MINIAS_DYNAMIC_FULL_RUNTIME=PASS native_MiniAS_C=64 remaining_GNU_AS_C=2000 P1=true'
              fi
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-all-C-runtime]') && '1' || '0' }}" == 1 ]]; then
              grep -Fq 'COHORT_P1=PASS name=full_all_verified syscalls=12 python_era_oracle=PASS' "$ev/cohort.log" || exit 34
              test "$(grep -c 'MINIAS_CORPUS_RUNTIME_OBJECTS=PASS trial=' "$ev/cohort.log")" -eq 2
              grep -Fq 'MINIAS_DYNAMIC_HEADER_OBJECTS=PASS trial=full_all_verified native_header_objects=4 total_native_C_objects=2064' "$ev/cohort.log" || exit 35
              echo "MINIAS_ALL_C_RUNTIME=PASS miniC_C=2064 miniAS_C=2064 remaining_GNU_AS_C=0 P1=12/12"
            fi
            if [[ "${{ contains(github.event.head_commit.message, '[linux-minias-native-S-runtime]') && '1' || '0' }}" == 1 ]]; then
              grep -Fq 'MINIAS_NATIVE_S_RUNTIME=PASS trial=full_all_verified' "$ev/cohort.log"
              grep -Fq 'MINIAS_ALL_C_RUNTIME=PASS' "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1/cohort.log" || true
              echo "MINIAS_NATIVE_S_INTEGRATION=PASS all_2064_MiniC_C_native_AS=true original_Kbuild_native_S=true P1=12/12"
            fi
            echo "NATIVE_UNION_RESULT=PASS pp=GNU minic=2064 from_cache ar=MiniAR_full_actual_Kbuild ar_native_calls=$minic_ar_calls ar_mpit_calls=$minic_mpit_calls ar_gnu_calls=0 ld=MiniLD_final_only objcopy=MiniObjcopy runtime=P1"
          fi

      - name: Preserve aggregate link, QEMU and failure-frontier evidence
        if: always() && !contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') && !contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-minild-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-reloc-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-purgatory-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minild-vdso64-cached-replay]') && !contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') && (!contains(github.event.head_commit.message, '[linux-minias-corpus-scan]') || contains(github.event.head_commit.message, '[linux-minias-corpus-runtime]'))
        uses: actions/upload-artifact@v4
        with:
          name: sharded-gnu-minic-QEMU-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/full-objects.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/native-union/*.trace
            build/linux-runtime-gcc-cohort-v1/native-union/*.tsv
            build/linux-runtime-gcc-cohort-v1/trials/*/minias-dynamic-hashes.sha256
            build/linux-runtime-gcc-cohort-v1/trials/*/minias-dynamic-logs/*.log
            build/linux-runtime-gcc-cohort-v1/minias-corpus-2064-evidence/*.json
            build/linux-runtime-gcc-cohort-v1/minias-corpus-2064-evidence/*.sha256
            build/linux-runtime-gcc-cohort-v1/minias-native-S-evidence/*.tsv
            build/linux-runtime-gcc-cohort-v1/minias-native-S-evidence/*.sha256
            build/linux-runtime-gcc-cohort-v1/minias-native-S-evidence/logs/*.log
            build/linux-runtime-gcc-cohort-v1/minias-corpus-2064-evidence/assembly-failures.tsv
            build/linux-runtime-gcc-cohort-v1/minias-corpus-64-evidence/*.tsv
            build/linux-runtime-gcc-cohort-v1/minias-corpus-64-evidence/*.sha256
            build/linux-runtime-gcc-cohort-v1/minias-corpus-64-evidence/*.json
            build/linux-runtime-gcc-cohort-v1/minias-earlycon-experiment/*.txt
            build/linux-runtime-gcc-cohort-v1/minias-earlycon-experiment/*.sha256
            build/linux-runtime-gcc-cohort-v1/minias-earlycon-experiment/*.stderr
            build/linux-runtime-gcc-cohort-v1/minias-earlycon-experiment/*.stdout
            build/linux-runtime-gcc-cohort-v1/native-union/tools.sha256
            build/linux-runtime-gcc-cohort-v1/native-union/*-wrapper
            build/linux-runtime-gcc-cohort-v1/frontier.txt
            build/linux-runtime-gcc-cohort-v1/p1-owner-verdicts.tsv
            build/linux-runtime-gcc-cohort-v1/p1-multi-rescue-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-minimize.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-minimize-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-pairs.tsv
            build/linux-runtime-gcc-cohort-v1/p1-rescue-pairs-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.log
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.gdb
            build/linux-runtime-gcc-cohort-v1/p1-pair-calltrace/*/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1_gcc_rescue_set.txt
            build/linux-runtime-gcc-cohort-v1/p1-identical-image-repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.log
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.gdb
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.nm
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.bin
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack-experiment/*.log
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack-experiment/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack-experiment/*.gdb
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack-experiment/*.nm
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack-experiment/*.bin
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack-experiment/*.tsv
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu/rdinit-init.log
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.log
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1-frame-components/*.i.gz
            build/linux-runtime-gcc-cohort-v1/p1-*-audit-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-diagnostic-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-pre-crossblock-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-crossblock-compiler.sha256
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.log
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-defined-crossblock/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.tsv
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.log
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.txt
            build/linux-runtime-gcc-cohort-v1/p1-defined-ip6-only/*.sha256
            build/linux-runtime-gcc-cohort-v1/p1-owner-hit.txt
