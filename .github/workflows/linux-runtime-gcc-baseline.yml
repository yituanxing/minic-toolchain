      - name: Inspect real AST memory without altering assembly
        if: contains(github.event.head_commit.message, '[linux-perf-ast-footprint]') && steps.candidate_ready.outputs.ready == 'true'
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          root="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin"
          bash tools/ci/linux-perf-ast-footprint-v1.sh \
            "$ev" "$root" "${{ contains(github.event.head_commit.message, '[linux-perf-hotowners-rotation]') }}"

      # This boundary is essential: a subsequent GNU relink/QEMU failure
      # must NEVER waste the expensive, already-verified candidate objects.
      - name: Prove exact Linux link blocker symbols are absent
        if: (contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]')) && steps.candidate_ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            obj="$ev/minic/kernel/dma/direct.o"
            test -s "$obj"
            riscv64-linux-gnu-nm -u "$obj" >"$ev/dma-undefined.txt"
            if grep -F 'arch_dma_set_uncached' "$ev/dma-undefined.txt"; then
              echo 'GNU_MINIC_DMA_SINGLE=FAIL undefined_arch_dma_set_uncached'
              exit 1
            fi
            echo 'GNU_MINIC_DMA_SINGLE=PASS missing_symbol_absent=1 exact_kernel_tu=1 abi=PASS'
          fi
          targets=()
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') }}" == true ]]; then
            targets=('mm/truncate.o:dax_delete_mapping_entry' 'mm/shmem.o:__compiletime_assert_')
          elif [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') }}" == true ]]; then
            targets=('mm/shmem.o:__compiletime_assert_')
          fi
          for pair in "${targets[@]}"; do
            target=${pair%%:*}
            bad=${pair#*:}
            obj="$ev/minic/$target"
            test -s "$obj"
            name=${target##*/}
            riscv64-linux-gnu-nm -u "$obj" >"$ev/$name.undefined.txt"
            if grep -F "$bad" "$ev/$name.undefined.txt"; then
              echo "GNU_MINIC_LINK_BLOCKER=FAIL owner=$target symbol=$bad"
              exit 1
            fi
            echo "GNU_MINIC_LINK_BLOCKER_OWNER=PASS owner=$target symbol=$bad"
          done
          echo "GNU_MINIC_LINK_BLOCKERS=PASS checked=${#targets[@]}"

      - name: GNU relink and QEMU from authenticated MiniC objects
        if: "!(contains(github.event.head_commit.message, '[linux-runtime-gcc-dma-only]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-link-triad]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-shmem-only]') || contains(github.event.head_commit.message, '[linux-runtime-blake2s-only]') || contains(github.event.head_commit.message, '[linux-perf-hotowners]'))"
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.candidate_ready.outputs.ready }}" = true
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          export COHORT_ALLOW_DIAGNOSTIC_384=${{ contains(github.event.head_commit.message, '[linux-runtime-gcc-384]') && '1' || '0' }}
          export COHORT_ACTION=verify
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Preserve compilation, GNU object identities, QEMU verdicts and bisection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-full-c-${{ github.sha }}
          path: |
            build/linux-runtime-gcc-cohort-v1/full-objects.txt
            build/linux-runtime-gcc-cohort-v1/non-c-objects.tsv
            build/linux-runtime-gcc-cohort-v1/identity.txt
            build/linux-runtime-gcc-cohort-v1/cohort.log
            build/linux-runtime-gcc-cohort-v1/boolean-hot/symbolic-call/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/symbolic-call/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/first500/results/differential.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/first500/first500-verdict.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/symbolic-integer/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/symbolic-integer/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/integer-call/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/integer-call/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/symbolic-owner/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/symbolic-owner/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/ast-growth/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/ast-growth/results/**/*-rss.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/ast-growth/*-verdict.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/ast-footprint/results/**/traced.stderr
            build/linux-runtime-gcc-cohort-v1/boolean-hot/ast-footprint/results/**/peak-rss.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/integer-owner/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/integer-owner/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/parser-combined/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/parser-combined/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/optimized-phase-four/results/**/phases.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/optimized-phase-four/*-verdict.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/optimized-phase/results/**/phases.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/optimized-phase/*-verdict.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/spec-phase/results/**/phases.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/spec-phase/*-verdict.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/current-oldnew/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/current-oldnew/*-verdict.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/current-oldnew/old-build-evidence/minic.sha256
            build/linux-runtime-gcc-cohort-v1/boolean-hot/codegen-use/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/codegen-use/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/core-workspace/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/core-workspace/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/parser-global/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/parser-global/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/parser-index/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/parser-index/*-screen.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/phase/**/phases.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/*-phase.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/results/**/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-hot/*-verdict.txt
            build/linux-runtime-gcc-cohort-v1/boolean-hot/*.frozen.i
            build/linux-runtime-gcc-cohort-v1/boolean-ab/paired-result.json
            build/linux-runtime-gcc-cohort-v1/boolean-ab/paired-verdict.txt
            build/linux-runtime-gcc-cohort-v1/compile.log
            build/linux-runtime-gcc-cohort-v1/compile-blockers.txt
            build/linux-runtime-gcc-cohort-v1/mini-success-objects.txt
            build/linux-runtime-gcc-cohort-v1/failure-pool-index.tsv
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.i
            build/linux-runtime-gcc/out/**/*.minic-stage2.failed.stderr
            build/linux-runtime-gcc-cohort-v1/source-aliases.txt
            build/linux-runtime-gcc-cohort-v1/gcc-preflight.log
            build/linux-runtime-gcc-cohort-v1/gcc-objects-stable.sha256
            build/linux-runtime-gcc-cohort-v1/results.tsv
            build/linux-runtime-gcc-cohort-v1/native-S-bisect.tsv
            build/linux-runtime-gcc-cohort-v1/native-S-localized.sha256
            build/linux-runtime-gcc-cohort-v1/native-S-unresolved.sha256
            build/linux-runtime-gcc-cohort-v1/native-S-*.sha256
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
            build/linux-runtime-gcc-cohort-v1/dma-undefined.txt
            build/linux-runtime-gcc-cohort-v1/*.undefined.txt
            build/linux-runtime-gcc-cohort-v1/shmem-assert-context.txt
            build/linux-runtime-gcc-cohort-v1/frontier.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/link.log
            build/linux-runtime-gcc-cohort-v1/trials/*/link-repaired.log
            build/linux-runtime-gcc-cohort-v1/trials/*/guard.log
            build/linux-runtime-gcc-cohort-v1/trials/*/generated-before.json
            build/linux-runtime-gcc-cohort-v1/trials/*/selected-objects.txt
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-registers.jsonl
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-probe.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-physical-symbols.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-physical-disasm.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qmp-physical-vmlinux-nm.txt.gz
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-mapped-initrd.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-default-initrd.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1.log
            build/linux-runtime-gcc-cohort-v1/trials/*/runtime-p1-python.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu-p1/*.log
            build/linux-runtime-gcc-cohort-v1/trials/*/qemu/*.log
            build/linux-runtime-gcc-cohort-v1/compiler/toolchain-timing.txt
          if-no-files-found: warn
          retention-days: 7

  # Explicit, optional 7-runner producer for the same pure-GCC C universe.
  # Do not use this lane for everyday single-TU debugging.
  gcc-shards:
    needs: [rv64-campaign-gate, rv64-current-gnu-golden]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') ||
      (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true') ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[linux-runtime-gcc-receiver-reuse]') && ((contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]'))) || contains(github.event.head_commit.message, '[linux-perf-2064-ab]') || contains(github.event.head_commit.message, '[linux-runtime-gcc-sharded]') || contains(github.event.head_commit.message, '[linux-minias-seven-shards]') || (contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && !contains(github.event.head_commit.message, '[linux-minipp-seven-replay]')) || contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux2064]') || contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064]'))) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    env:
      MINIC_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MINIC_CURRENT_MAIN_SEVEN_RECHECK: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')) && '1' || '0' }}
      # Existing fail-closed, three-object timestamp exception for seven-way
      # GNU Kbuild replay. It rejects any non-seven-shard/config scope.
      COHORT_GNU_PREFLIGHT_ALLOW_SEVEN_SHARD_VOLATILE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fail closed on non-native RV64 full campaign profiles
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$MINIC_EXPECTED_HEAD_SHA"
          git diff --quiet -- src include Makefile
          if git log -1 --format=%B | grep -Eq '\[(linux-|minic-bootstrap-)'; then
            echo 'RV64_FULL_EXACT_HEAD=FAIL conflicting historical/experimental commit tag' >&2
            exit 1
          fi
          # The fresh GNU reference uses these exact Kbuild identity fields.
          # Without them a copied source tree may rebuild the generated
          # usr/initramfs_data.o (embedded cpio timestamp) in preflight with
          # different bytes although no genuine C owner has changed.
          {
            echo 'KBUILD_BUILD_USER=minic'
            echo 'KBUILD_BUILD_HOST=minic-ci'
            echo 'KBUILD_BUILD_TIMESTAMP=Thu Jan  1 00:00:00 UTC 1970'
          } >> "$GITHUB_ENV"
          echo 'RV64_GNU_GENERATED_IDENTITIES=PINNED user=minic host=minic-ci timestamp=1970-01-01'
          echo "RV64_FULL_EXACT_HEAD=PASS sha=$MINIC_EXPECTED_HEAD_SHA shard=${{ matrix.shard }} native_source=true"

      - name: Install pinned GNU RISC-V build tools
        timeout-minutes: 12
        shell: bash
        run: |
          set -Eeuo pipefail
          # Use the signed Ubuntu public archive instead of throttled
          # Azure mirrors on fresh runners (seven independent C shards).
          for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]] && grep -q 'azure.archive.ubuntu.com' "$sources"; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$sources"
            fi
          done
          timeout 120s sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 update -qq
          # Four of seven original Kbuild shards passed at the refactored
          # main SHA, but three workers remained indefinitely inside apt.
          # Bound transient Azure mirrors rather than consuming full
          # Linux runner lifetimes before compiler/owner verification.
          packages=(gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
                    libc6-dev-riscv64-cross python3 make cpio gzip time)
          if ! timeout 270s sudo apt-get -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
              "${packages[@]}"; then
            echo 'LINUX_2064_APT=RETRY fresh_package_indexes=1'
            timeout 150s sudo apt-get -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 update
            timeout 260s sudo apt-get -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
              "${packages[@]}"
          fi
          command -v riscv64-linux-gnu-gcc
          command -v riscv64-linux-gnu-as
          echo 'LINUX_2064_APT=PASS native_gnu_tools=1'

      - name: Identify certified exact-config GNU golden pool
        if: "!(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        id: gnu
        shell: bash
        run: |
          set -Eeuo pipefail
          config=eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe
          gcc_sig=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld_sig=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          echo "key=linux-gnu-golden-v1-6.6.143-$config-$gcc_sig-$ld_sig" >>"$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        if: "!(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        with:
          path: |
            build/linux-runtime-gcc/out
            build/linux-runtime-gcc/provenance
          key: ${{ steps.gnu.outputs.key }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/linux-runtime-restore-fixture
        with:
          fixture: source

      # Historical GNU ELF32 golden is cached under its proven generated
      # config hash. Do not regenerate config in a new runner: Linux Kconfig
      # depends on the runner environment and can change the object universe.
      - name: Identify pinned RV32 GNU golden from its historical config and GNU binaries
        if: (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        id: rv32_gold_key
        shell: bash
        run: |
          set -Eeuo pipefail
          cfg="$RV32I_GNU_GOLDEN_CONFIG_SHA256"
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -c1-16)
          ld=$(sha256sum "$(command -v riscv64-linux-gnu-ld)" | cut -c1-16)
          as=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -c1-16)
          echo "key=linux-gnu-golden-rv32i-v1-6.6.143-$cfg-$gcc-$ld-$as" >>"$GITHUB_OUTPUT"

      - name: Restore exact RV32 GNU golden before partitioning
        if: (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv32i-linux-entry/out
            build/rv32i-linux-entry/provenance
          key: ${{ steps.rv32_gold_key.outputs.key }}
          fail-on-cache-miss: true

      - name: Identify this seventh of the RV32 original GNU C universe
        if: (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        id: rv32_candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/rv32i-linux-entry
          test -s "$work/provenance/full-c-objects.txt"
          mkdir -p "$work/shard-${{ matrix.shard }}"
          python3 tools/ci/linux-runtime-gcc-shards-v1.py split \
            --full "$work/provenance/full-c-objects.txt" \
            --shard ${{ matrix.shard }} --count 7 \
            --output "$work/shard-${{ matrix.shard }}/full-objects.txt"
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          subset=$(sha256sum "$work/shard-${{ matrix.shard }}/full-objects.txt" | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          as=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "key=gnu-minic-shard-rv32i-v1-${{ steps.rv32_gold_key.outputs.key }}-$profile-$subset-$gcc-$as" >>"$GITHUB_OUTPUT"

      - name: Restore the exact RV32 MiniC shard candidate
        if: (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        id: rv32_candidate_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic-identity.txt
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/cohort.log
          key: ${{ steps.rv32_candidate.outputs.key }}

      - name: Sweep ALL authentic RV32 C owners assigned to this shard
        if: (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        shell: bash
        timeout-minutes: 60
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/rv32i-linux-tools \
            build/rv32i-linux-tools/bin/minic-cc
          MINIC_CC="$GITHUB_WORKSPACE/build/rv32i-linux-tools/bin/minic-cc" \
          RV32I_LINUX_MODE=shard RV32I_SHARD=${{ matrix.shard }} \
          RV32I_LINUX_SOURCE="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143" \
          RV32I_LINUX_WORK="$GITHUB_WORKSPACE/build/rv32i-linux-entry" \
            bash tests/external/linux/rv32i_kbuild_entry.sh

      - name: Retain certified RV32 objects even if later link or QEMU fails
        if: (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]'))) && steps.rv32_candidate_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic-identity.txt
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/cohort.log
          key: ${{ steps.rv32_candidate.outputs.key }}

      - name: Transfer RV32 candidate objects and SHA evidence
        if: (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic/
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/minic-identity.txt
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/cohort.log
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/full-objects.txt
          retention-days: 7
          if-no-files-found: error

      - name: Preserve every RV32 failed owner and bounded frozen .i inputs
        if: failure() && (contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))
        uses: actions/upload-artifact@v4
        with:
          name: debug-shard-${{ matrix.shard }}
          path: |
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/compile.log
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/compile-blockers.txt
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/make-diagnostics.txt
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/failure-classes.tsv
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/failure-pool-index.tsv
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/mini-success-objects.txt
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/mini-object-hashes.sha256
            build/rv32i-linux-entry/shard-${{ matrix.shard }}/failures/
          if-no-files-found: warn
          retention-days: 7

      # Seven real runners now partition GNU-E -> MiniC-S -> MiniAS, instead
      # of squeezing all 2064 TUs onto a single 4-worker runner. Keep the
      # historical seven-way C-object producer untouched and simply re-route
      # its opt-in seven matrix workers for this independent MiniAS sweep.
      - name: Identify exact 2064-object MiniC cache for native seven-way assembly
        if: contains(github.event.head_commit.message, '[linux-minias-seven-shards]')
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/minias-seven-shards-v1/shard-${{ matrix.shard }}"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/full-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          profile="${profile}-full-crossblock-pure-eq-v1-$(sha256sum tools/ci/apply-riscv64-p1-defined-before-use-crossblock-v1.py | cut -c1-16)"
          objects=$(sha256sum "$ev/full-objects.txt" | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "FULL_MINIC_KEY=gnu-minic-objects-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$objects-$gcc-$assembler" >>"$GITHUB_ENV"

      - name: Restore immutable full MiniC object pool on this MiniAS worker
        id: minias_shard_original_cache
        if: contains(github.event.head_commit.message, '[linux-minias-seven-shards]')
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-cohort-v1/minic
            build/linux-runtime-gcc-cohort-v1/minic-manifest.sha256
            build/linux-runtime-gcc-cohort-v1/minic-identity.txt
          key: ${{ env.FULL_MINIC_KEY }}
          fail-on-cache-miss: true

      - name: Restore this worker's immutable MiniC S assembly cache
        id: minias_shard_s_cache
        if: contains(github.event.head_commit.message, '[linux-minias-seven-shards]')
        uses: actions/cache/restore@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-seven-shards-v1-${{ matrix.shard }}
          restore-keys: ${{ env.FULL_MINIC_KEY }}-minias-corpus-s-v1-64

      - name: Sweep assigned one-seventh of real Linux C owners through MiniAS
        if: contains(github.event.head_commit.message, '[linux-minias-seven-shards]')
        shell: bash
        timeout-minutes: 60
        run: |
          set -Eeuo pipefail
          test "${{ steps.minias_shard_original_cache.outputs.cache-hit }}" = true
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-v1"
          (cd "$ev" && sha256sum --quiet -c minic-manifest.sha256)
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          test -d "$src"
          cp -a --reflink=auto "$src" "$work/linux-6.6.143"
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" \
              "$GITHUB_WORKSPACE/build/minias-seven-shards-v1/shard-${{ matrix.shard }}/compiler"
          tools="$GITHUB_WORKSPACE/build/minias-linux-corpus-v1-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tools" "$tools/bin/minic-as"
          python3 tools/ci/minias-linux-full-corpus-v1.py \
            --golden-out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --candidate-pool "$ev/minic" \
            --manifest "$ev/minic-manifest.sha256" \
            --minic "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            --minias "$tools/bin/minic-as" \
            --work "$GITHUB_WORKSPACE/build/minias-linux-corpus-v1" \
            --cache-identity "$FULL_MINIC_KEY" \
            --shard ${{ matrix.shard }} --shards 7 --jobs 2

      - name: Cache this seventh of MiniC S inputs (even when MiniAS has gaps)
        if: always() && contains(github.event.head_commit.message, '[linux-minias-seven-shards]') && steps.minias_shard_s_cache.outputs.cache-hit != 'true' && hashFiles('build/minias-linux-corpus-v1/assembly/index.json') != ''
        uses: actions/cache/save@v4
        with:
          path: build/minias-linux-corpus-v1/assembly
          key: ${{ env.FULL_MINIC_KEY }}-minias-seven-shards-v1-${{ matrix.shard }}

      - name: Preserve verified shard report and retained assemblies for merge
        if: always() && contains(github.event.head_commit.message, '[linux-minias-seven-shards]')
        uses: actions/upload-artifact@v4
        with:
          name: minias-seven-corpus-${{ matrix.shard }}-${{ github.sha }}
          path: |
            build/minias-linux-corpus-v1/full-summary.json
            build/minias-linux-corpus-v1/full-scan.tsv
            build/minias-linux-corpus-v1/assembly/**/*.s
            build/minias-linux-corpus-v1/assembly/index.json
            build/minias-linux-corpus-v1/evidence/**/*.minias.log
          retention-days: 3
          if-no-files-found: warn

      - name: Derive identical full universe and this shard
        if: "!contains(github.event.head_commit.message, '[linux-minias-seven-shards]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          mkdir -p "$ev"
          python3 tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --manifest "$GITHUB_WORKSPACE/build/linux-runtime-gcc/provenance/gcc-objects.sha256" \
            --prefix tools/ci/linux-runtime-gcc-cohort-objects-v1.txt \
            --output "$ev/all-objects.txt" \
            --excluded "$ev/non-c-objects.tsv" \
            --min-c-objects 1200
          balanced_args=()
          # Recheck the complete SHA-authenticated LPT union after fixing
          # failed-attempt RSS accounting; immutable MiniC C sources remain
          # exactly as certified in the latest full 2064 QEMU P1 gate.
          if [[ "${{ contains(github.event.head_commit.message, '[minic-gnu-balanced-full2064]') }}" == true ]]; then
            plan="$GITHUB_WORKSPACE/tools/ci/linux-gnu-balanced-plan-2026-10-17.json"
            python3 tools/ci/linux_gnu_balanced_plan_v1.py --owners "$ev/all-objects.txt" --plan "$plan"
            balanced_args=(--balanced-plan "$plan")
            echo "GNU_MINIC_BALANCED=ENABLED shard=${{ matrix.shard }}/7 source_run=39033023656 fresh_only=true"
          fi
          python3 tools/ci/linux-runtime-gcc-shards-v1.py split \
            --full "$ev/all-objects.txt" \
            --shard ${{ matrix.shard }} --output "$ev/full-objects.txt" "${balanced_args[@]}"

      # Reuse precisely the existing seven GitHub runners and their
      # SHA-attested GNU Linux golden reference, not a new workflow or a
      # serial 2064-TU compile. Initially sample two real Kbuild C owners
      # per worker; scale from 32 each (224/224 passed) to the
      # entire frozen 2064 owners in [linux-minipp-seven-full] mode.
      # Each actual native .o consumes MiniPP's own .i and is kept
      # as a SHA-attested Kbuild-path artifact for later Kbuild merge.
      - name: MiniPP to MiniC to MiniAS on this seventh of real Linux owners
        if: contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') || contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]')
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          stage="$GITHUB_WORKSPACE/build/minipp-seven-native/shard-${{ matrix.shard }}"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -s "$ev/all-objects.txt"
          test -d "$src"
          # Saved GNU Kbuild .o.cmd inputs refer to this exact Linux
          # source path. The seven-way immutable golden restore stores
          # source elsewhere: mount it read-only by symlink, do not rewrite
          # the authoritative command or duplicate the large source tree.
          test ! -e "$GITHUB_WORKSPACE/build/linux-runtime-gcc/linux-6.6.143"
          ln -s "$src" "$GITHUB_WORKSPACE/build/linux-runtime-gcc/linux-6.6.143"
          MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1 \
            bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
              "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" \
              "$stage/compiler"
          tools="$GITHUB_WORKSPACE/build/minipp-seven-tools"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$tools" \
            "$tools/bin/minic-cpp" "$tools/bin/minic-as"
          pinned_macro_args=()
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-pinned-full]') && '1' || '0' }}" == 1 ]]; then
            profile="$GITHUB_WORKSPACE/tests/preprocessor/profiles/rv64-linux-6.6.143-gcc13.json.gz.b64"
            test -s "$profile"
            pinned_macro_args=(--profile-snapshot "$profile")
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') && '1' || '0' }}" == 1 ]]; then
            pinned_macro_args=(--profile-snapshot "$GITHUB_WORKSPACE/tests/preprocessor/profiles/rv64-linux-6.6.143-gcc13.json.gz.b64" --native-macro-rules)
            echo 'MINIPP_SEVEN_MACRO_PRODUCER=MINI_RULES no_GCC_macro_generation=true reference_only_GNU=true'
          fi
          # Explicit only: original stride layout remains the default.
          # Both producer and receiver must use the exact SHA-bound LPT map.
          balanced_plan_args=()
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-balanced]') && '1' || '0' }}" == 1 ]]; then
            test "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '1' || '0' }}" = 1
            test "${{ contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && '1' || '0' }}" = 1
            balanced_plan="$GITHUB_WORKSPACE/tools/ci/minipp-seven-balanced-plan-2026-10-16.json"
            python3 tools/ci/linux_minipp_seven_balanced_plan_v1.py \
              --plan "$balanced_plan" --owners "$ev/all-objects.txt"
            balanced_plan_args=(--balanced-plan "$balanced_plan")
            echo "MINIPP_SEVEN_SCHEDULER=SHA_BOUND_GREEDY_LPT original=879790ms forecast=739298ms not_measured_wall=true"
          fi
          python3 tools/ci/minipp-linux-seven-native-stage-v1.py \
            --out "$GITHUB_WORKSPACE/build/linux-runtime-gcc/out" \
            --src "$src" --owner-list "$ev/all-objects.txt" \
            --stage "$stage" \
            --minipp "$tools/bin/minic-cpp" \
            --minic-cc "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic-cc" \
            --minias "$tools/bin/minic-as" \
            --shard ${{ matrix.shard }} --shards 7 \
            --sample-per-shard ${{ contains(github.event.head_commit.message, '[linux-minipp-seven-full]') && '0' || '32' }} \
            "${pinned_macro_args[@]}" "${balanced_plan_args[@]}"

      - name: Preserve seven-way actual MiniPP to MiniC native evidence
        if: always() && (contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') || contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]'))
        uses: actions/upload-artifact@v4
        with:
          name: minipp-native-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            build/minipp-seven-native/shard-${{ matrix.shard }}/summary.json
            build/minipp-seven-native/shard-${{ matrix.shard }}/performance-summary.json
            build/minipp-seven-native/shard-${{ matrix.shard }}/first-failure.json
            build/minipp-seven-native/shard-${{ matrix.shard }}/results.json
            build/minipp-seven-native/shard-${{ matrix.shard }}/native-manifest.sha256
            build/minipp-seven-native/shard-${{ matrix.shard }}/native-objects/**/*.o
            build/minipp-seven-native/shard-${{ matrix.shard }}/**/*.log
            build/minipp-seven-native/shard-${{ matrix.shard }}/**/*.diff
          retention-days: 3
          if-no-files-found: warn

      - name: Identify immutable MiniC shard artifact
        if: "!contains(github.event.head_commit.message, '[linux-minias-seven-shards]') && !contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && !contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          # Profile source identity MUST be obtained before patching src/.
          profile=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-full-crossblock]') && '1' || '0' }}" == 1 ]]; then
            profile="${profile}-full-crossblock-pure-eq-v1-$(sha256sum tools/ci/apply-riscv64-p1-defined-before-use-crossblock-v1.py | cut -c1-16)"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-integrated-full]') }}" == true ]]; then
            perf_tag=$(sha256sum tools/ci/linux-perf-integrated-full-profile-v1.sh \
              tools/ci/apply-perf-symbolic-function-body-owner-filter-v0.py \
              tools/ci/apply-perf-integer-call-expression-index-v1.py \
              tools/ci/apply-perf-parser-lookup-counters-v0.py \
              tools/ci/apply-perf-parser-function-hash-v0.py | sha256sum | cut -c1-16)
            profile="${profile}-perf-integrated-3-v1-${perf_tag}"
          fi
          subset=$(sha256sum "build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/full-objects.txt" | cut -d' ' -f1)
          gcc=$(sha256sum "$(command -v riscv64-linux-gnu-gcc)" | cut -d' ' -f1)
          assembler=$(sha256sum "$(command -v riscv64-linux-gnu-as)" | cut -d' ' -f1)
          echo "key=gnu-minic-shard-v1-eeb04f304ebfb97a1079c187dc0c2ea3cc61fc50a55aa3cc776237c16ab19bbe-$profile-$subset-$gcc-$assembler" >>"$GITHUB_OUTPUT"

      - name: Restore this shard's immutable candidate objects
        if: "!contains(github.event.head_commit.message, '[linux-minias-seven-shards]') && !contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && !contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') && !contains(github.event.head_commit.message, '[linux-perf-2064-ab]') && !contains(github.event.head_commit.message, '[minic-fresh-full2064-metrics]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux2064]') && !contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        id: shard_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-manifest.sha256
            build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}/minic-identity.txt
          key: ${{ steps.candidate.outputs.key }}

      - name: Download SHA-attested self-host Stage2 RV64 compiler
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux2064]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39040013459
          name: minic-current-bootstrap-b1-stage2-v1
          github-token: ${{ github.token }}
          path: build/bootstrap-stage2-linux2064/artifact

      - name: Download fixed-point nine-tool Stage4 RV64 compiler
        if: contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39058935623
          name: minic-current-bootstrap-stage2-native-runtime-v1
          github-token: ${{ github.token }}
          path: build/bootstrap-stage4-linux2064/artifact

      - name: Build MiniC and prove this exact shard
        if: "!contains(github.event.head_commit.message, '[linux-minias-seven-shards]') && !contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && !contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-runtime-gcc"
          src="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/linux-6.6.143"
          test -d "$src"
          test ! -e "$work/linux-6.6.143"
          # The GNU golden .o.cmd records the original Kbuild source path.
          # Preserve it for this exact seven-shard producer; copied sources
          # change the command signature and force thousands of GNU C rebuilds.
          ln -s "$src" "$work/linux-6.6.143"
          test -L "$work/linux-6.6.143"
          test "$(realpath "$work/linux-6.6.143")" = "$src"
          echo 'RV64_GNU_KBUILD_SOURCE_ALIAS=PASS lane=seven_shard original_source_path=true'
          ev="$GITHUB_WORKSPACE/build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-runtime-full-crossblock]') && '1' || '0' }}" == 1 ]]; then
            export MINIC_LINUX_FULL_CROSSBLOCK=1 MINIC_OPT_PURE_DISCARDED_ADDRESS_EQ=1
            echo "LINUX_FULL_CROSSBLOCK=PRODUCER_START shard=${{ matrix.shard }}/7 pure_eq=1 all_C_optin=true"
          fi
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-2064-ab]') }}" == true ]]; then
            test "${{ contains(github.event.head_commit.message, '[linux-perf-integrated-full]') }}" = true
            # The four integrated perf patches are ALREADY in the native C tree;
            # copying the current binary as "baseline" is now an invalid A/B.
            # Rebuild the last fully validated pre-flag product in a detached
            # worktree, on THIS SAME runner, with its proven shared-.text mode.
            # No historical CI overlays are required or reintroduced.
            historical=b46822fcbc2fbc459081a908058985941eae749b
            git fetch --quiet --no-tags --depth=1 origin "$historical"
            git -c advice.detachedHead=false worktree add --quiet --detach \
              "$ev/perf-historical-source" "$historical"
            make -s -C "$ev/perf-historical-source" -j4 MODE=release \
              CFLAGS="-Werror -DMINIC_LINUX_RUNTIME_DEFAULT_TEXT_V0=1" \
              BUILD_DIR="$ev/perf-before" \
              "$ev/perf-before/bin/minic" "$ev/perf-before/bin/minic-cc"
            test -x "$ev/perf-before/bin/minic"
            test -x "$ev/perf-before/bin/minic-cc"
            if cmp -s "$ev/perf-before/bin/minic-cc" \
                  "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic-cc"; then
              echo "MINIC_FULL_PERF_AB=FAIL identical compiler binaries" >&2
              exit 4
            fi
            echo "MINIC_FULL_PERF_AB=BASELINE_SAVED commit=$historical mode=runtime44-perf4-native baseline_cc=$(sha256sum "$ev/perf-before/bin/minic-cc" | cut -d' ' -f1)"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-integrated-full]') }}" == true ]]; then
            bash tools/ci/linux-perf-integrated-full-profile-v1.sh \
              "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain" "$ev/compiler"
            echo "LINUX_PERF_3_SHARD=READY shard=${{ matrix.shard }}/7"
          fi
          # Explicit full-throughput measurement: do not replay old object cache.
          # All seven independently partitioned shards recompile fresh on this
          # commit; the existing stage-probe counts every real gcc-E / MiniC /
          # GNU-as invocation and additionally measures wait4 child maxRSS.
          if [[ "${{ contains(github.event.head_commit.message, '[minic-fresh-full2064-metrics]') }}" == true ]]; then
            export COHORT_FULL_SPEED_RSS=1 COHORT_PROFILE_STAGES=1
            echo "MINIC_FRESH_FULL2064=ENABLED seven_runner_compilers=true candidate_cache=DISABLED cpu_rss=ENABLED"
          fi
          export COHORT_ACTION=compile COHORT_ALLOW_SHARD=1
          if [[ "${{ contains(github.event.head_commit.message, '[linux-boolean-native-full]') }}" == true ]]; then
            # Keep the established seven-way stride schedule; reuse GNU Kbuild
            # preprocessing and GNU AS, measuring only the actual MiniC compiler.
            export MINIC_BOOLEAN_DOMAIN_PERF=1
            export MINIC_BOOLEAN_DOMAIN_COUNTS_LOG="$ev/boolean-domain-counts.tsv"
            export MINIC_INTEGER_OWNER_PERF=1
            export MINIC_INTEGER_OWNER_COUNTS_LOG="$ev/integer-owner-counts.tsv"
            export COHORT_GNU_PREFLIGHT_ALLOW_SEVEN_SHARD_VOLATILE=1
            export COHORT_PROFILE_STAGES=1
            bash -n tests/external/linux/stage2_kbuild_cc.sh
            python3 -m py_compile tools/ci/linux-minic-boolean-telemetry-v1.py
            : >"$MINIC_BOOLEAN_DOMAIN_COUNTS_LOG"
            : >"$MINIC_INTEGER_OWNER_COUNTS_LOG"
            echo "MINIC_BOOLEAN_NATIVE_2064=START shard=${{ matrix.shard }}/7 GNU_PP=true native_minic=true GNU_AS=true boolean_and_integer_owner_counters=true"
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-2064-ab]') }}" == true ]]; then
            export COHORT_PERF_2064_AB=1
            export COHORT_PERF_2064_BASELINE="$ev/perf-before/bin/minic"
            export COHORT_PROFILE_STAGES=0
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[linux-perf-integrated-full]') }}" == true ]]; then
            export COHORT_GNU_PREFLIGHT_ALLOW_SEVEN_SHARD_VOLATILE=1
          fi
          # Stage4 2064 retains full raw owner-success and actual guest-dispatch
          # trace on any audit failure; success may include a small explicit set
          # of ancillary Kbuild objects beyond the canonical 295 owners.
          # Missing canonical objects or guest dispatch still fail closed.
          # The existing compile script remains unchanged for ordinary runs.
          if git log -1 --format=%B | grep -Fq '[minic-bootstrap-stage2-linux2064]'; then
            source tools/ci/minic-bootstrap-stage2-2064-prepare-v1.sh producer "$ev"
          fi
          if git log -1 --format=%B | grep -Fq '[minic-bootstrap-stage4-linux2064]'; then
            source tools/ci/minic-bootstrap-stage4-2064-prepare-v1.sh producer "$ev"
          fi
          bash tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh \
            "$work/linux-6.6.143" "$work/out" \
            "$GITHUB_WORKSPACE/build/linux-runtime-gcc-cohort-toolchain/bin/minic" \
            "$work/provenance" "$ev/full-objects.txt" "$ev"

      - name: Authenticate shard before cache or export
        if: "!contains(github.event.head_commit.message, '[linux-minias-seven-shards]') && !contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && !contains(github.event.head_commit.message, '[linux-minipp-native-rules-C]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="build/linux-runtime-gcc-shards-v1/shard-${{ matrix.shard }}"
          n=$(grep -cE '^[^#[:space:]]+\.o$' "$ev/full-objects.txt")
          test "$n" -gt 0
          grep -Fq "COHORT_ABI=PASS objects=$n" "$ev/cohort.log"
          grep -Fq "COHORT_PRODUCE_ONLY=PASS objects=$n" "$ev/cohort.log"
          test -s "$ev/minic-identity.txt"
          (cd "$ev"; sha256sum --quiet -c minic-manifest.sha256)
          if [[ "${{ contains(github.event.head_commit.message, '[linux-boolean-native-full]') }}" == true ]]; then
