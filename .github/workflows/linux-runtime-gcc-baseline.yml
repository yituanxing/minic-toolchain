  gcc-shard-verify:
    needs: [gcc-shards, rv64-campaign-gate, rv64-current-gnu-golden]
    # Use the SAME receiver job for exact immutable Image reboots. When the
    # seven producer jobs are skipped, always() prevents needs' implicit skip;
    # the ordinary full-shard path still requires a successful producer.
    if: >-
      (always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full' && needs.gcc-shards.result == 'success') ||
      (always() && github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true' && needs.gcc-shards.result == 'success') ||
      (always() && github.event_name == 'push' && (((contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]'))) && needs.gcc-shards.result == 'success') || (contains(github.event.head_commit.message, '[linux-runtime-gcc-sharded]') && (needs.gcc-shards.result == 'success' || (contains(github.event.head_commit.message, '[linux-runtime-gcc-receiver-reuse]') && needs.gcc-shards.result == 'skipped'))) || (contains(github.event.head_commit.message, '[linux-minipp-seven-integration]') && needs.gcc-shards.result == 'success') || (contains(github.event.head_commit.message, '[linux-minipp-seven-replay]') && needs.gcc-shards.result == 'skipped') || contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]') || contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') || contains(github.event.head_commit.message, '[linux-runtime-stack-owners]') || contains(github.event.head_commit.message, '[linux-native-union-cached]') || contains(github.event.head_commit.message, '[linux-minild-cached-replay]') || contains(github.event.head_commit.message, '[linux-minild-reloc-cached-replay]') || contains(github.event.head_commit.message, '[linux-minild-purgatory-cached-replay]') || contains(github.event.head_commit.message, '[linux-minild-vdso64-cached-replay]') || contains(github.event.head_commit.message, '[linux-minild-vdso32-cached-replay]') || contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') || (contains(github.event.head_commit.message, '[minic-bootstrap-stage2-linux2064]') || (contains(github.event.head_commit.message, '[minic-bootstrap-stage4-linux2064]') && needs.gcc-shards.result == 'success') && needs.gcc-shards.result == 'success'))) ||
      (always() && (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')) && needs.gcc-shards.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      MINIC_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MINIC_CURRENT_MAIN_SEVEN_RECHECK: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')) && '1' || '0' }}
      COHORT_GNU_PREFLIGHT_ALLOW_SEVEN_RECEIVER_VOLATILE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Authenticate RV64 receiver exact-head source before restoring objects
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'rv64-full') || (github.event_name == 'pull_request' && needs.rv64-campaign-gate.outputs.run == 'true')
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$MINIC_EXPECTED_HEAD_SHA"
          git diff --quiet -- src include Makefile
          if git log -1 --format=%B | grep -Eq '\[(linux-|minic-bootstrap-)'; then
            echo 'RV64_FULL_RECEIVER=FAIL conflicting historical/experimental commit tag' >&2
            exit 1
          fi
          {
            echo 'KBUILD_BUILD_USER=minic'
            echo 'KBUILD_BUILD_HOST=minic-ci'
            echo 'KBUILD_BUILD_TIMESTAMP=Thu Jan  1 00:00:00 UTC 1970'
          } >> "$GITHUB_ENV"
          echo 'RV64_GNU_GENERATED_IDENTITIES=PINNED user=minic host=minic-ci timestamp=1970-01-01'
          echo "RV64_FULL_RECEIVER=SOURCE_PASS sha=$MINIC_EXPECTED_HEAD_SHA full_original_2064_required=true"

      - name: Install minimal pinned GNU binutils and GCC for P1 object-only audit
        if: contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]')
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3

      - name: Install only GNU RISC-V binutils for frozen MiniAS differential
        if: contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]')
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            binutils-riscv64-linux-gnu

      - name: Install pinned GNU RISC-V tools and QEMU
        # Large qemu-system-misc mirror downloads can otherwise consume a
        # 12-minute runner without progress. Cap each fetch and prefer the
        # same package set used by the seven successful producers.
        timeout-minutes: 12
        if: "!contains(github.event.head_commit.message, '[linux-runtime-p1-frame-audit]') && !contains(github.event.head_commit.message, '[linux-minias-earlycon-frozen]') && !(contains(github.event.head_commit.message, '[linux-rv32i-kbuild]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[minic-full]')))"
        shell: bash
        run: |
          set -Eeuo pipefail
          packages=(gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
                    qemu-system-misc opensbi libc6-dev-riscv64-cross
                    python3 make cpio gzip device-tree-compiler)
          # Forensic #39981548761: Azure Ubuntu apt served the 57.7 MB
          # qemu-system-misc archive at a rate below the 12-minute gate.
          # The bounded retry at #39983581195 hit the SAME Azure mirror.
          # Use Ubuntu's public archive for this single expensive receiver,
          # preserving official distro versions and package signatures.
          # GitHub Ubuntu 24.04 Actions images resolve the actual mirror
          # from 'URIs: mirror+file:/etc/apt/apt-mirrors.txt'. Rewriting only
          # ubuntu.sources does NOT change Azure package downloads.
          for sources in /etc/apt/apt-mirrors.txt \
                         /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]] &&
               grep -q 'azure.archive.ubuntu.com' "$sources"; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$sources"
              echo "LINUX_RECEIVER_APT_MIRROR=FIXED file=$sources target=archive.ubuntu.com"
            fi
          done
          if grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt 2>/dev/null; then
            echo 'LINUX_RECEIVER_APT_MIRROR=FAIL still_azure_mirrorlist' >&2
            exit 14
          fi
          timeout 90s sudo apt-get -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 update -qq
          if ! timeout 280s sudo apt-get -o Acquire::Retries=2 \
               -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
               -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
               "${packages[@]}"; then
            echo 'LINUX_RECEIVER_APT=RETRY bounded_mirror=true'
            timeout 120s sudo apt-get -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 update
            timeout 270s sudo apt-get -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
              "${packages[@]}"
          fi
          command -v riscv64-linux-gnu-gcc
          command -v qemu-system-riscv64
          echo 'LINUX_RECEIVER_APT=PASS gnu_and_qemu=true'

      # Reuse the exact 215511040-byte Image from the previous 2064-object
      # successful GNU link. This opt-in path never rebuilds or relinks C.
      - name: Restore immutable full MiniC Linux Image from earlier CI
        if: contains(github.event.head_commit.message, '[linux-runtime-large-image-qemu]')
        uses: actions/download-artifact@v4
        with:
