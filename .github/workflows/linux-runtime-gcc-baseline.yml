            build/linux-runtime-gcc-cohort-v1/p1-identical-image-12/identity.txt
            build/linux-runtime-gcc-cohort-v1/p1-identical-image-12/repeats.tsv
            build/linux-runtime-gcc-cohort-v1/p1-identical-image-12/trials/*/runtime_boot.log
            build/linux-runtime-gcc-cohort-v1/p1-identical-image-12/trials/*/p1-check.log
            build/linux-runtime-gcc-cohort-v1/p1-identical-image-12/trials/*/qemu/rdinit-init.log
            build/linux-runtime-gcc-cohort-v1/p1-gdb-stack/*.log
