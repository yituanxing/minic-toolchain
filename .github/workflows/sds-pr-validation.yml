name: SDS PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sds-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sds-compile:
    name: sds-compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage current discovery semantics and build MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          sh tools/dev/pr74-stage.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          make -j4 MODE=release BUILD_DIR=build/sds-compiler
          make -j4 MODE=sanitize BUILD_DIR=build/sds-sanitize

      - name: Verify focused discovery semantics
        shell: bash
        run: |
          MINIC="$GITHUB_WORKSPACE/build/sds-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/sds-focused" HOST_CC=cc sh tests/compiler/c0/run-packed-record-layout.sh
          MINIC="$GITHUB_WORKSPACE/build/sds-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/sds-focused" HOST_CC=cc sh tests/compiler/c0/run-flexible-array-members.sh
          MINIC="$GITHUB_WORKSPACE/build/sds-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/sds-focused" HOST_CC=cc sh tests/compiler/c0/run-inline-functions.sh
          MINIC="$GITHUB_WORKSPACE/build/sds-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/sds-focused" HOST_CC=cc sh tests/compiler/c0/run-postfix-const.sh

      - name: Compile unchanged SDS
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/sds-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/sds-discovery" \
          HOST_CC=cc \
            sh tests/external/sds/probe.sh
          status=$?
          set -e

          if test "$status" -ge 128 && test -f "$GITHUB_WORKSPACE/build/sds-discovery/sds.i"; then
            echo "SDS_SANITIZER_RERUN release_status=$status"
            set +e
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              "$GITHUB_WORKSPACE/build/sds-sanitize/bin/minic" \
              -S "$GITHUB_WORKSPACE/build/sds-discovery/sds.i" \
              -o "$GITHUB_WORKSPACE/build/sds-discovery/sds-sanitize.s"
            sanitize_status=$?
            set -e
            echo "SDS_SANITIZER_STATUS=$sanitize_status"
          fi
          exit "$status"
