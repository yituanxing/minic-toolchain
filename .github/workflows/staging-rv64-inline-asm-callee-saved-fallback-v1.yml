name: Staging RV64 Inline Asm Callee Saved Fallback V1

on:
  push:
    branches: [staging/rv64-inline-asm-callee-saved-fallback-v1]

permissions:
  contents: write

concurrency:
  group: staging-rv64-inline-asm-callee-saved-fallback-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install formatter and RV64 assembler
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18 gcc-riscv64-linux-gnu

      - name: Apply target allocator capability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/stage-rv64-inline-asm-callee-saved-fallback.py

      - name: Canonical formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          clang-format-18 -i src/target/riscv64/codegen_inline_asm.c

      - name: Release Werror build
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/staging-rv64-inline-asm-fallback

      - name: Focused GNU inline asm operands
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/staging-rv64-inline-asm-fallback/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-rv64-inline-asm-fallback-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-inline-asm-operands.sh
          riscv64-linux-gnu-gcc -c \
            "$GITHUB_WORKSPACE/build/staging-rv64-inline-asm-fallback-focused/tests/compiler-c0-gnu-inline-asm-operands/callee-saved-fallback.s" \
            -o "$GITHUB_WORKSPACE/build/staging-rv64-inline-asm-fallback-focused/callee-saved-fallback.o"

      - name: Broad C0 suite
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/staging-rv64-inline-asm-fallback check-fast

      - name: Foundation focused suite
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/staging-rv64-inline-asm-fallback/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/staging-rv64-inline-asm-fallback-foundation" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish validated product diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add \
            src/target/riscv64/codegen_inline_asm.c \
            tests/compiler/c0/run-gnu-inline-asm-operands.sh
          git diff --cached --check
          git commit -m 'target: add RV64 inline asm callee-saved fallback [publish]'
          git push origin HEAD:staging/rv64-inline-asm-callee-saved-fallback-v1
