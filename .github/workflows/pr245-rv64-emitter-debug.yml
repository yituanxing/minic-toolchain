name: PR245 RV64 Emitter Debug

on:
  push:
    branches: [tests/pr245-rv64-emitter-debug]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Instrument RV64 writer ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/target/riscv64/codegen_function.c')
          s = p.read_text()
          old = '''        success =
            minic_riscv64_emit_global_object(file, program, &program->global_objects[global_index]);
        if (!success) {
        }
'''
          new = '''        success =
            minic_riscv64_emit_global_object(file, program, &program->global_objects[global_index]);
        if (!success) {
            fprintf(stderr,
                    "MINIC_RV64_EMIT_FAIL kind=global index=%zu name=%s\\n",
                    global_index,
                    program->global_objects[global_index].name);
        }
'''
          if s.count(old) != 1:
              raise SystemExit('global instrumentation anchor mismatch')
          s = s.replace(old, new, 1)
          old = '''        success = minic_riscv64_emit_function(file, program, function, &label_counter);
        if (!success) {
        }
'''
          new = '''        success = minic_riscv64_emit_function(file, program, function, &label_counter);
        if (!success) {
            fprintf(stderr,
                    "MINIC_RV64_EMIT_FAIL kind=function index=%zu name=%s\\n",
                    function_index,
                    minic_c0_function_symbol_name(function));
        }
'''
          if s.count(old) != 1:
              raise SystemExit('function instrumentation anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          make -j4 MODE=release BUILD_DIR=build/linux-debug-compiler

      - name: Restore pinned Linux source archive
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Probe init main with ownership diagnostics
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/linux-debug-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-emitter-debug" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh
          status=$?
          printf 'PROBE_STATUS=%s\n' "$status"
          test -f build/linux-emitter-debug/minic.stderr && cat build/linux-emitter-debug/minic.stderr || true
          exit 0
