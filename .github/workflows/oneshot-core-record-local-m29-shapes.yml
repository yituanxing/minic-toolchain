name: One-shot Core Record Local M29 Shapes

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Probe record-local seams
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-core-record-local-m29.py
          clang-format-18 -i src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m29-record-probe
          c="$GITHUB_WORKSPACE/build/m29-record-probe/bin/minic"
          w="$GITHUB_WORKSPACE/build/m29-record-shapes"
          mkdir -p "$w"
          cat > "$w/union_scalar.i" <<'EOF'
          union U29A { unsigned long ll; unsigned int w; };
          unsigned long probe_m29_union_scalar(unsigned long a) { union U29A u; u.ll = a; return u.ll; }
          EOF
          cat > "$w/union_nested.i" <<'EOF'
          union U29B { unsigned long ll; struct { unsigned int low, high; } l; };
          unsigned int probe_m29_union_nested(unsigned long a) { union U29B u; u.ll = a; return u.l.low; }
          EOF
          cat > "$w/record_24.i" <<'EOF'
          struct R29C { unsigned long a, b, c; };
          unsigned long probe_m29_record_24(unsigned long x) { struct R29C r; r.a = x; r.b = x + 1; r.c = x + 2; return r.a + r.b + r.c; }
          EOF
          cat > "$w/statement_expr.i" <<'EOF'
          unsigned long probe_m29_statement_expr(unsigned long a, unsigned int d) { return ({ unsigned int r; r = ((unsigned long)a) % d; a = ((unsigned long)a) / d; r; }); }
          EOF
          cat > "$w/helper_store.i" <<'EOF'
          typedef unsigned long u64; typedef unsigned int u32;
          static u64 helper29a(u32 a, u32 b) { return (u64)a * b; }
          u64 probe_m29_helper_store(u64 a, u32 mul) { union { u64 ll; struct { u32 low, high; } l; } u, rl; u.ll = a; rl.ll = helper29a(u.l.low, mul); return rl.ll; }
          EOF
          cat > "$w/call_member_add.i" <<'EOF'
          typedef unsigned long u64; typedef unsigned int u32;
          static u64 helper29b(u32 a, u32 b) { return (u64)a * b; }
          u64 probe_m29_call_member_add(u64 a, u32 mul) { union { u64 ll; struct { u32 low, high; } l; } u, rl, rh; u.ll = a; rl.ll = helper29b(u.l.low, mul); rh.ll = helper29b(u.l.high, mul) + rl.l.high; return rh.ll; }
          EOF
          cat > "$w/member_statement_target.i" <<'EOF'
          typedef unsigned long u64; typedef unsigned int u32;
          u64 probe_m29_member_statement_target(u64 a, u32 divisor) { union { u64 ll; struct { u32 low, high; } l; } u; u.ll = a; u.l.high = ({ u32 base = divisor; u32 rem; rem = ((u64)u.ll) % base; u.ll = ((u64)u.ll) / base; rem; }); return u.ll; }
          EOF
          cat > "$w/full_style.i" <<'EOF'
          typedef unsigned long u64; typedef unsigned int u32;
          static u64 mul_u32_u32_m29(u32 a, u32 b) { return (u64)a * b; }
          u64 probe_m29_full_style(u64 a, u32 mul, u32 divisor) {
            union { u64 ll; struct { u32 low, high; } l; } u, rl, rh;
            u.ll = a;
            rl.ll = mul_u32_u32_m29(u.l.low, mul);
            rh.ll = mul_u32_u32_m29(u.l.high, mul) + rl.l.high;
            rl.l.high = ({ u32 base = divisor; u32 rem; rem = ((u64)rh.ll) % base; rh.ll = ((u64)rh.ll) / base; rem; });
            ({ u32 base = divisor; u32 rem; rem = ((u64)rl.ll) % base; rl.ll = ((u64)rl.ll) / base; rem; });
            rl.l.high = rh.l.low;
            return rl.ll;
          }
          EOF
          for n in union_scalar union_nested record_24 statement_expr helper_store call_member_add member_statement_target full_style; do
              set +e
              MINIC_CORE_IR=strict "$c" -S "$w/$n.i" -o "$w/$n.s" 2>"$w/$n.err"
              rc=$?
              set -e
              printf 'M29_RECORD_SHAPE name=%s rc=%d message=' "$n" "$rc"
              tr '\n' ' ' < "$w/$n.err"
              printf '\n'
          done
