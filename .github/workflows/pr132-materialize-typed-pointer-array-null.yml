name: PR132 Materialize Typed Pointer Array Null
on:
  push:
    branches: [agent/typed-pointer-array-null-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize typed pointer-array null semantics
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr132-materialize.py
          chmod +x tests/compiler/c0/run-pointer-array-typed-null.sh
          clang-format-18 -i \
            src/frontend/parser_internal.h \
            src/frontend/parser_expression.c \
            src/frontend/parser_function.c \
            src/frontend/parser_statement.c \
            src/frontend/parser_global.c \
            tests/compiler/c0/pointer_array_typed_null.c \
            tests/compiler/c0/invalid_pointer_array_nonnull_cast.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr132-focused" \
            sh tests/compiler/c0/run-pointer-array-typed-null.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr132-materialize.py \
            .github/workflows/pr132-materialize-typed-pointer-array-null.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): share typed pointer-array null semantics'
          git push origin HEAD:agent/typed-pointer-array-null-v0
