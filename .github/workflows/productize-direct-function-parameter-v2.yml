name: Productize Direct Function Parameter V2
on:
  push:
    branches: [product/direct-function-parameter-v2]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/direct-function-parameter-v2
          fetch-depth: 0
      - name: Materialize clean source and contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/frontend/parser_function.c')
          text = path.read_text()
          old = '''        } else if (parser->current.kind == MINIC_TOKEN_IDENTIFIER) {\n            if (parameter_name_spans != NULL) {\n                parameter_name_spans[*parameter_count] = parser->current.span;\n            }\n            if (!minic_parser_advance(parser)) {\n                return false;\n            }\n        } else if (require_names) {\n'''
          new = '''        } else if (parser->current.kind == MINIC_TOKEN_IDENTIFIER) {\n            MinicSourceSpan parameter_name_span;\n\n            parameter_name_span = parser->current.span;\n            if (parameter_name_spans != NULL) {\n                parameter_name_spans[*parameter_count] = parameter_name_span;\n            }\n            if (!minic_parser_advance(parser)) {\n                return false;\n            }\n            if (parser->current.kind == MINIC_TOKEN_LPAREN) {\n                MinicParsedFunctionDeclarator direct_function;\n\n                (void)memset(&direct_function, 0, sizeof(direct_function));\n                direct_function.name_span = parameter_name_span;\n                direct_function.has_name = true;\n                if (!minic_parser_parse_function_parameter_suffix(parser, &direct_function) ||\n                    !minic_parser_build_function_declarator_type(\n                        parser, parameter_type, &direct_function, &parameter_type)) {\n                    if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\\0') {\n                        minic_parser_error(parser,\n                                           "cannot build direct function parameter declarator");\n                    }\n                    return false;\n                }\n            }\n        } else if (require_names) {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'direct function parameter anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cat > tests/compiler/c0/direct_function_parameter.c <<'EOF'
          static int increment(int value) { return value + 1; }
          static int apply(int callback(int), int value) { return callback(value); }
          int main(void) { return apply(increment, 6) == 7 ? 0 : 1; }
          EOF
          cat >> tests/compiler/c0/run-function-parameter-adjustment.sh <<'EOF'

          "$host_cc" -E -P -std=gnu11 -x c \
              "$root/tests/compiler/c0/direct_function_parameter.c" \
              -o "$work/direct-function.i"
          "$minic" -S "$work/direct-function.i" -o "$work/direct-function.s"
          grep -F 'apply:' "$work/direct-function.s" >/dev/null
          grep -F 'jalr' "$work/direct-function.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/direct_function_parameter declarator=function-adjusted-to-pointer'
          EOF
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/direct_function_parameter.c
          git diff --check
      - name: Validate Werror focused and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-direct-function-parameter-v2
          MINIC="$GITHUB_WORKSPACE/build/product-direct-function-parameter-v2/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/product-direct-function-parameter-v2" sh tests/compiler/c0/run-function-parameter-adjustment.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-direct-function-parameter-v2-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-direct-function-parameter-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: adjust direct function parameters to pointers'
          git push origin HEAD:product/direct-function-parameter-v2
