name: Diagnostic Global Relocation V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize convergence compiler and relocation fix
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-array-v1.py
          python3 tools/dev/materialize-fixed-call-character-pointer-v1.py
          python3 tools/dev/materialize-function-pointer-array-declarator-v1.py
          python3 tools/dev/materialize-preformed-static-array-v1.py
          python3 tools/dev/materialize-static-local-prefix-attributes-v1.py
          python3 tools/dev/materialize-top-level-braced-static-scalar-v1.py
          python3 tools/dev/materialize-parenthesized-pointer-array-v1.py
          python3 tools/dev/materialize-record-pointer-array-v1.py
          python3 tools/dev/materialize-gnu-function-void-pointer-equality-v1.py
          python3 tools/dev/materialize-gnu-signed-left-shift-ice-v1.py
          python3 tools/dev/materialize-record-value-initialize-v1.py
          python3 tools/dev/materialize-record-value-initialize-v1b.py
          python3 tools/dev/materialize-static-local-self-reference-v1.py
          python3 tools/dev/materialize-record-conditional-type-v1.py
          python3 tools/dev/materialize-direct-function-parameter-v1.py
          python3 tools/dev/materialize-parameter-suffix-informational-attributes-v1.py
          python3 tools/dev/materialize-overflow-result-range-v1.py
          python3 tools/dev/materialize-overflow-constant-value-v1.py
          python3 tools/dev/materialize-static-pointer-constant-conditional-v1.py
          python3 tools/dev/materialize-canonical-array-redeclaration-owner-v1.py
          python3 tools/dev/materialize-query-incomplete-array-v1.py
          python3 tools/dev/materialize-zero-slot-aggregate-relocation-v1.py
          python3 tools/dev/materialize-backward-record-compound-literal-v1.py
          python3 tools/dev/materialize-backward-static-array-overlay-v1.py
          python3 tools/dev/materialize-static-integer-address-relocation-v1.py
          python3 tools/dev/materialize-static-union-zero-designator-v1.py
          python3 tools/dev/materialize-global-relocation-fail-trace-v1.py
          clang-format-18 -i src/frontend/ast.h src/frontend/ast.c src/frontend/ast_global.c \
            src/frontend/ast_verifier.c src/frontend/const_eval.h src/frontend/const_eval.c \
            src/frontend/expression_semantics.h src/frontend/expression_semantics.c \
            src/frontend/function_body.c src/frontend/parser_statement.c \
            src/frontend/parser_expression.c src/frontend/parser_declarator.c \
            src/frontend/parser_function.c src/frontend/parser_internal.h \
            src/frontend/parser_global.c src/frontend/parser_record.c src/frontend/parser_postfix.c \
            src/target/data_layout.c src/target/riscv64/codegen_function.c \
            src/target/riscv64/codegen_expression.c src/target/riscv64/codegen_statement.c
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/convergence
      - name: Focused aggregate relocation contracts
        run: |
          set -Eeuo pipefail
          cat > /tmp/zero-slot-reloc.c <<'EOF'
          struct empty {};
          struct holder {
              struct empty pad;
              int *value;
          };
          static int target;
          static struct holder holder = { .value = &target };
          int main(void) { return holder.value == &target ? 0 : 1; }
          EOF
          build/convergence/bin/minic -S /tmp/zero-slot-reloc.c -o /tmp/zero-slot-reloc.s
          test -s /tmp/zero-slot-reloc.s

          cat > /tmp/backward-record-compound.c <<'EOF'
          struct atom { unsigned long value; };
          struct child { struct atom atom; };
          struct outer { int first; struct child child; int last; };
          static struct outer object = {
              .last = 7,
              .child = { .atom = (struct atom) { .value = 3 } },
          };
          int main(void) { return 0; }
          EOF
          set +e
          build/convergence/bin/minic -S /tmp/backward-record-compound.c -o /tmp/backward-record-compound.s 2>/tmp/backward-record-compound.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/backward-record-compound.err
            grep -Fq 'cannot write RISC-V assembly' /tmp/backward-record-compound.err
            ! grep -Fq "expected '{' in record initializer" /tmp/backward-record-compound.err
          fi

          cat > /tmp/backward-record-array.c <<'EOF'
          struct timer_base { unsigned long nextevt; };
          struct timers { struct timer_base bases[3]; unsigned int active; };
          struct outer_array { struct timers timers; int tail; };
          static struct outer_array object_array = {
              .tail = 1,
              .timers = { .bases = { { .nextevt = ~0UL }, { .nextevt = ~0UL }, { .nextevt = ~0UL } } },
          };
          int main(void) { return 0; }
          EOF
          set +e
          build/convergence/bin/minic -S /tmp/backward-record-array.c -o /tmp/backward-record-array.s 2>/tmp/backward-record-array.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/backward-record-array.err
            grep -Fq 'cannot write RISC-V assembly' /tmp/backward-record-array.err
            ! grep -Fq 'backward aggregate designator requires a supported zero subobject' /tmp/backward-record-array.err
          fi

          cat > /tmp/integer-address-reloc.c <<'EOF'
          static char storage[16];
          struct stack_slot { unsigned long sp; };
          static struct stack_slot slot = {
              .sp = sizeof(storage) + (long)&storage,
          };
          int main(void) { return 0; }
          EOF
          build/convergence/bin/minic -S /tmp/integer-address-reloc.c -o /tmp/integer-address-reloc.s
          test -s /tmp/integer-address-reloc.s
          grep -Eq '\.dword[[:space:]]+storage\+16' /tmp/integer-address-reloc.s

          cat > /tmp/noncanonical-union-zero.c <<'EOF'
          typedef unsigned char u8;
          typedef unsigned int u32;
          union special {
              struct { u8 blocked; u8 need_qs; u8 exp_hint; u8 need_mb; } b;
              u32 s;
          };
          struct union_holder { int before; union special special; int after; };
          static struct union_holder good = {
              .before = 1,
              .special.s = 0,
              .after = 2,
          };
          int main(void) { return 0; }
          EOF
          build/convergence/bin/minic -S /tmp/noncanonical-union-zero.c -o /tmp/noncanonical-union-zero.s
          test -s /tmp/noncanonical-union-zero.s

          sed 's/\.special\.s = 0/\.special.s = 1/' /tmp/noncanonical-union-zero.c > /tmp/noncanonical-union-nonzero.c
          set +e
          build/convergence/bin/minic -S /tmp/noncanonical-union-nonzero.c -o /tmp/noncanonical-union-nonzero.s 2>/tmp/noncanonical-union-nonzero.err
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq 'noncanonical static union member requires a representable zero scalar' /tmp/noncanonical-union-nonzero.err
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Probe init_task nested relocation
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/relocation-6"
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" \
          BUILD_DIR="$build" LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=6 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          mkdir -p build/relocation-artifact
          cp "$build/batch-summary.txt" build/relocation-artifact/ 2>/dev/null || true
          cp -R "$build/minic-stderr" build/relocation-artifact/ 2>/dev/null || true
          echo "$status" > build/relocation-artifact/status.txt
          exit "$status"
      - name: Upload relocation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relocation-6
          path: build/relocation-artifact
          if-no-files-found: warn
