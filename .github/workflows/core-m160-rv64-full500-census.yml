name: Core M173 RV64 Production Cut

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'tests/external/linux/corpus_replay.py'
      - 'tools/ci/apply-m161-rv64-int128-pair.py'
      - 'tools/ci/apply-m162-rv64-record-load.py'
      - 'tools/ci/apply-m163-rv64-caller-abi.py'
      - 'tools/ci/apply-m163b-rv64-zero-record-abi.py'
      - 'tools/ci/apply-m165-rv64-indirect-parameter-object.py'
      - 'tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py'
      - 'tools/ci/apply-m167-rv64-zero-record-copy.py'
      - 'tools/ci/apply-m167d-rv64-indirect-record-return.py'
      - 'tools/ci/apply-m168-rv64-indirect-call-stack.py'
      - 'tools/ci/apply-m170-rv64-array-object.py'
      - 'tools/ci/apply-m171-rv64-overaligned-frame.py'
      - 'tools/ci/apply-m172-rv64-final-four.py'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  productize-core-rv64:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect production backend cut
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M172_STRUCTURED_ASM_CALLEE_SAVED' src/target/riscv64/core_codegen.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
            echo "M173_ALREADY_PRODUCTIZED head=$(git rev-parse HEAD)"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
            echo "M173_SOURCE_HEAD=$(git rev-parse HEAD)"
            test "$(git hash-object src/target/riscv64/core_codegen.c)" = a5414575a573abd9ce9ced00fb6c234d785e4e03
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Materialize qualified M161-M172 backend
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m161-rv64-int128-pair.py
          python3 tools/ci/apply-m162-rv64-record-load.py
          python3 tools/ci/apply-m163-rv64-caller-abi.py
          python3 tools/ci/apply-m163b-rv64-zero-record-abi.py
          python3 tools/ci/apply-m165-rv64-indirect-parameter-object.py
          python3 tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py
          python3 tools/ci/apply-m167-rv64-zero-record-copy.py
          python3 tools/ci/apply-m167d-rv64-indirect-record-return.py
          python3 tools/ci/apply-m168-rv64-indirect-call-stack.py
          python3 tools/ci/apply-m170-rv64-array-object.py
          python3 tools/ci/apply-m171-rv64-overaligned-frame.py
          python3 tools/ci/apply-m172-rv64-final-four.py
          git diff --check
          grep -Fq 'M172_STRUCTURED_ASM_CALLEE_SAVED' src/target/riscv64/core_codegen.c
          changed="$(git diff --name-only)"
          test "$changed" = 'src/target/riscv64/core_codegen.c'
          echo 'M173_MATERIALIZED_SOURCE_ONLY=1'

      - name: Build production candidate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m173-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m173-check

      - name: Replay frozen full500 through production candidate
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m173-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m173-core-rv64"
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
            python3 tests/external/linux/corpus_replay.py \
              --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0

      - name: Require exact production Core RV64 500 of 500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          work=Path('build/m173-core-rv64')
          rows=json.loads((work/'batch-results.json').read_text())
          selected=len(rows)
          passed=sum(r.get('status')=='PASS' for r in rows)
          failed=sum(r.get('status')=='FAIL' for r in rows)
          missing=sum(r.get('status')=='PREPROCESS_MISSING' for r in rows)
          headline=f'M173_PRODUCTION_CORE_RV64 selected={selected} pass={passed} fail={failed} missing={missing}'
          print(headline)
          if selected != 500 or passed != 500 or failed != 0 or missing != 0:
              raise SystemExit(headline)
          PY

      - name: Commit qualified Core RV64 production backend
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/target/riscv64/core_codegen.c
          git diff --cached --quiet && { echo 'no production backend changes'; exit 1; }
          git commit -m 'rv64: productize Core backend first500 closure'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M173 production evidence
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m173-rv64-production-${{ github.sha }}
          path: |
            build/m173-core-rv64/batch-results.json
            build/m173-core-rv64/batch-summary.txt
            build/m173-core-rv64/minic-stderr
          if-no-files-found: warn
