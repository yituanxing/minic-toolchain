name: Core M174 Default Core-Only Productizer

on:
  pull_request:
    paths:
      - 'src/compiler/compiler.c'
      - 'src/target/riscv64/codegen_function.c'
      - 'src/target/riscv64/core_codegen.c'
      - 'include/**'
      - 'Makefile'
      - 'tests/**'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-only-default:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect M174 state
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'M172_STRUCTURED_ASM_CALLEE_SAVED' src/target/riscv64/core_codegen.c
          if grep -Fq 'M174_CORE_ONLY_DEFAULT' src/compiler/compiler.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
            echo "M174_ALREADY_PRODUCTIZED head=$(git rev-parse HEAD)"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
            echo "M174_SOURCE_HEAD=$(git rev-parse HEAD)"
            test "$(git hash-object src/compiler/compiler.c)" = a18f201f4e97467cbc232c9ffdfffbfc8355243f
            test "$(git hash-object src/target/riscv64/codegen_function.c)" = d51b7dfdb4e6e8365f574a23a7c3e5e07f2c7b2d
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Materialize Core-only default and legacy tripwire
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          compiler = Path('src/compiler/compiler.c')
          text = compiler.read_text()

          old = '*mode = MINIC_CORE_CODEGEN_DISABLED;'
          new = ('/* M174_CORE_ONLY_DEFAULT: ordinary RV64 compilation uses Core. */\n'
                 '        *mode = MINIC_CORE_CODEGEN_BASIC_V0;')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'M174 codegen-default token count={count}')
          text = text.replace(old, new, 1)

          pattern = (r'if \(core_codegen_mode != MINIC_CORE_CODEGEN_DISABLED &&\s*'
                     r'core_validation_mode == MINIC_CORE_SHADOW_DISABLED\) \{')
          replacement = 'if (core_codegen_mode != MINIC_CORE_CODEGEN_DISABLED) {'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'M174 validation-condition count={count}')

          old = 'core_validation_mode = MINIC_CORE_SHADOW_OPTIONAL;'
          new = ('/* Core code generation is fail-closed: no defined function may\n'
                 '           fall back to the legacy AST body emitter. */\n'
                 '        core_validation_mode = MINIC_CORE_SHADOW_STRICT;')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'M174 validation-mode token count={count}')
          compiler.write_text(text.replace(old, new, 1))

          writer = Path('src/target/riscv64/codegen_function.c')
          text = writer.read_text()
          marker = 'static bool minic_riscv64_emit_function(FILE *file,'
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'M174 legacy function marker count={count}')
          start = text.index(marker)
          brace = text.index('{', start)
          tripwire = '''
              /* M174 staging tripwire: default compilation must never reach the
                 legacy AST function-body emitter. */
              if (getenv("MINIC_M174_FORBID_LEGACY_BODY") != NULL) {
                  if (failure_stage != NULL) {
                      *failure_stage = "m174-legacy-body-tripwire";
                  }
                  return false;
              }
          '''
          text = text[:brace + 1] + tripwire + text[brace + 1:]
          writer.write_text(text)
          PY
          git diff --check
          grep -Fq 'M174_CORE_ONLY_DEFAULT' src/compiler/compiler.c
          grep -Fq 'm174-legacy-body-tripwire' src/target/riscv64/codegen_function.c

      - name: Build Core-only default candidate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m174-compiler

      - name: Run existing check-fast against unchanged routing baseline
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff -- src/compiler/compiler.c src/target/riscv64/codegen_function.c > /tmp/m174-routing.patch
          test -s /tmp/m174-routing.patch
          git checkout HEAD -- src/compiler/compiler.c src/target/riscv64/codegen_function.c
          make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m174-check
          git apply /tmp/m174-routing.patch
          grep -Fq 'M174_CORE_ONLY_DEFAULT' src/compiler/compiler.c
          grep -Fq 'm174-legacy-body-tripwire' src/target/riscv64/codegen_function.c
          git diff --check

      - name: Probe default Core with legacy body forbidden
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        env:
          MINIC_M174_FORBID_LEGACY_BODY: '1'
        run: |
          set -Eeuo pipefail
          test -z "${MINIC_CORE_IR:-}"
          test -z "${MINIC_CORE_CODEGEN:-}"
          cc -E -P -x c tests/programs/c0/return_42.c -o build/m174-default-smoke.i
          build/m174-compiler/bin/minic -S build/m174-default-smoke.i -o build/m174-default-smoke.s
          grep -Fq '.Lmain_core_return:' build/m174-default-smoke.s
          ! grep -Fq '.Lmain_return:' build/m174-default-smoke.s
          echo 'M174_DEFAULT_CORE_TRIPWIRE_SMOKE=PASS'

      - name: Replay frozen full500 with no Core mode environment
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        env:
          MINIC_M174_FORBID_LEGACY_BODY: '1'
        run: |
          set -Eeuo pipefail
          test -z "${MINIC_CORE_IR:-}"
          test -z "${MINIC_CORE_CODEGEN:-}"
          compiler="$GITHUB_WORKSPACE/build/m174-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m174-default-core"
          python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0

      - name: Require exact no-env Core-only 500 of 500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=json.loads(Path('build/m174-default-core/batch-results.json').read_text())
          selected=len(rows)
          passed=sum(r.get('status')=='PASS' for r in rows)
          failed=sum(r.get('status')=='FAIL' for r in rows)
          missing=sum(r.get('status')=='PREPROCESS_MISSING' for r in rows)
          headline=f'M174_DEFAULT_CORE_ONLY selected={selected} pass={passed} fail={failed} missing={missing}'
          print(headline)
          if (selected, passed, failed, missing) != (500, 500, 0, 0):
              raise SystemExit(headline)
          PY

      - name: Remove staging tripwire and commit default Core routing
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout HEAD -- src/target/riscv64/codegen_function.c
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'src/compiler/compiler.c'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compiler/compiler.c
          git commit -m 'compiler: make Core RV64 the fail-closed default'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M174 evidence
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m174-default-core-${{ github.sha }}
          path: |
            build/m174-default-core/batch-results.json
            build/m174-default-core/batch-summary.txt
            build/m174-default-core/minic-stderr
            build/m174-default-smoke.s
          if-no-files-found: warn
