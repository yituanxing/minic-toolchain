name: Core M171 RV64 Overaligned Frame Full500

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'tests/external/linux/corpus_replay.py'
      - 'tools/ci/apply-m161-rv64-int128-pair.py'
      - 'tools/ci/apply-m162-rv64-record-load.py'
      - 'tools/ci/apply-m163-rv64-caller-abi.py'
      - 'tools/ci/apply-m163b-rv64-zero-record-abi.py'
      - 'tools/ci/apply-m165-rv64-indirect-parameter-object.py'
      - 'tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py'
      - 'tools/ci/apply-m167-rv64-zero-record-copy.py'
      - 'tools/ci/apply-m167d-rv64-indirect-record-return.py'
      - 'tools/ci/apply-m168-rv64-indirect-call-stack.py'
      - 'tools/ci/apply-m170-rv64-array-object.py'
      - 'tools/ci/apply-m171-rv64-overaligned-frame.py'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-rv64-overaligned-frame:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Record M171 staging head
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "M170_CONFIRMED_PASS=491"
          echo "M171_STAGING_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object src/target/riscv64/core_codegen.c)" = a5414575a573abd9ce9ced00fb6c234d785e4e03

      - name: Materialize M161-M171 backend
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m161-rv64-int128-pair.py
          python3 tools/ci/apply-m162-rv64-record-load.py
          python3 tools/ci/apply-m163-rv64-caller-abi.py
          python3 tools/ci/apply-m163b-rv64-zero-record-abi.py
          python3 tools/ci/apply-m165-rv64-indirect-parameter-object.py
          python3 tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py
          python3 tools/ci/apply-m167-rv64-zero-record-copy.py
          python3 tools/ci/apply-m167d-rv64-indirect-record-return.py
          python3 tools/ci/apply-m168-rv64-indirect-call-stack.py
          python3 tools/ci/apply-m170-rv64-array-object.py
          python3 tools/ci/apply-m171-rv64-overaligned-frame.py
          git diff --check

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build staged compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m171-compiler

      - name: Run fast regression gate
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m171-check

      - name: Focus five overaligned Linux owners
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m171-compiler/bin/minic"
          : > build/m171-focused.txt
          for spec in \
            '221:dev_map_bpf_prog_run' \
            '222:cpu_map_bpf_prog_run_xdp' \
            '232:perf_log_lost_samples' \
            '272:smp_call_function_single' \
            '295:rseq_ip_fixup'; do
            index="${spec%%:*}"
            function="${spec#*:}"
            work="$GITHUB_WORKSPACE/build/m171-focused/$index"
            mkdir -p "$work"
            set +e
            MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
              python3 tests/external/linux/corpus_replay.py \
                --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
                --work "$work" --jobs 1 --offset "$index" --limit 1 --sample-count 0 \
                >"$work.stdout" 2>"$work.stderr"
            rc=$?
            set -e
            echo "M171_FOCUSED index=$index function=$function rc=$rc" | tee -a build/m171-focused.txt
            ! grep -R -F "Core-owned function '$function' cannot be emitted by RV64 basic-v0" \
                "$work/minic-stderr" 2>/dev/null
            ! grep -R -F "cannot emit RISC-V function '$function'" \
                "$work/minic-stderr" 2>/dev/null
          done

      - name: Replay frozen full500 through staged Core RV64
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m171-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m171-core-rv64"
          set +e
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
            python3 tests/external/linux/corpus_replay.py \
              --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0
          rc=$?
          set -e
          echo "M171_REPLAY_STATUS=$rc"

      - name: Classify M171 staged frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json,re
          work=Path('build/m171-core-rv64')
          rows=json.loads((work/'batch-results.json').read_text())
          selected=len(rows); passed=sum(r.get('status')=='PASS' for r in rows)
          failed=sum(r.get('status')=='FAIL' for r in rows); missing=sum(r.get('status')=='PREPROCESS_MISSING' for r in rows)
          preflight=re.compile(r"Core-owned function '([^']+)' cannot be emitted by RV64 basic-v0")
          runtime=re.compile(r"cannot emit RISC-V function '([^']+)' \(index=\d+\)")
          groups=Counter(); funcs=Counter(); unexpected=[]
          for row in rows:
              if row.get('status')!='FAIL': continue
              msg=str(row.get('message','')); m=preflight.search(msg)
              if m: group,fn='preflight-reject',m.group(1)
              else:
                  m=runtime.search(msg)
                  if m: group,fn='emit-runtime',m.group(1)
                  else: group,fn='unexpected',None
              groups[group]+=1
              if fn: funcs[fn]+=1
              if group=='unexpected': unexpected.append(row)
          headline=f'M171_CORE_RV64_STAGED selected={selected} pass={passed} fail={failed} missing={missing} preflight={groups["preflight-reject"]} emit_runtime={groups["emit-runtime"]} unexpected={len(unexpected)}'
          print(headline)
          for fn,count in funcs.most_common(30): print(f'  {count:3d} {fn}')
          (work/'m171-summary.json').write_text(json.dumps({'selected':selected,'pass':passed,'fail':failed,'missing':missing,'groups':dict(groups),'functions':dict(funcs),'headline':headline},indent=2,sort_keys=True))
          if selected!=500 or missing!=0 or unexpected or groups['emit-runtime']!=0 or passed<=491:
              raise SystemExit(headline)
          PY

      - name: Persist M171 staged census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m171-rv64-full500-${{ github.sha }}
          path: |
            build/m171-focused.txt
            build/m171-focused
            build/m171-core-rv64/batch-results.json
            build/m171-core-rv64/batch-summary.txt
            build/m171-core-rv64/m171-summary.json
            build/m171-core-rv64/minic-stderr
          if-no-files-found: warn
