name: Core M163 RV64 Preflight Owner Trace

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'tests/external/linux/corpus_replay.py'
      - 'tools/ci/apply-m161-rv64-int128-pair.py'
      - 'tools/ci/apply-m162-rv64-record-load.py'
      - 'tools/ci/apply-m163-rv64-preflight-trace.py'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-rv64-preflight-trace:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Record M163 trace head
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "M162_STAGED_BASELINE_PASS=291"
          echo "M163_TRACE_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object src/target/riscv64/core_codegen.c)" = a5414575a573abd9ce9ced00fb6c234d785e4e03

      - name: Materialize staged backend and trace
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m161-rv64-int128-pair.py
          python3 tools/ci/apply-m162-rv64-record-load.py
          python3 tools/ci/apply-m163-rv64-preflight-trace.py
          git diff --check
          git diff --stat

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build traced compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m163-compiler

      - name: Replay three Pareto representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m163-compiler/bin/minic"
          mkdir -p build/m163-trace
          for spec in "0 merge" "3 zero" "6 skb"; do
            set -- $spec
            index="$1"
            name="$2"
            work="$GITHUB_WORKSPACE/build/m163-trace/$name"
            set +e
            MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
              python3 tests/external/linux/corpus_replay.py \
                --minic "$compiler" \
                --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
                --work "$work" \
                --jobs 1 \
                --offset "$index" \
                --limit 1 \
                --sample-count 0
            rc=$?
            set -e
            echo "M163_FOCUSED name=$name index=$index rc=$rc"
            find "$work/minic-stderr" -type f -maxdepth 8 -print -exec cat {} \; 2>/dev/null || true
          done

      - name: Require three precise preflight traces
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          roots = {
              'merge': Path('build/m163-trace/merge/minic-stderr'),
              'zero': Path('build/m163-trace/zero/minic-stderr'),
              'skb': Path('build/m163-trace/skb/minic-stderr'),
          }
          out = []
          for name, root in roots.items():
              text = '\n'.join(p.read_text(errors='replace') for p in root.rglob('*') if p.is_file())
              lines = [line for line in text.splitlines() if 'CORE_RV64_PREFLIGHT' in line]
              if not lines:
                  raise SystemExit(f'M163 missing preflight trace for {name}')
              out.append(f'[{name}]')
              out.extend(lines[-12:])
          summary = '\n'.join(out) + '\n'
          Path('build/m163-trace/preflight-summary.txt').write_text(summary)
          print(summary)
          PY

      - name: Persist M163 trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m163-rv64-preflight-trace-${{ github.sha }}
          path: |
            build/m163-trace
          if-no-files-found: warn
