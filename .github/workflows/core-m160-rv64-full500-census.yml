name: Core M164 RV64 Tail Owner Trace

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'tests/external/linux/corpus_replay.py'
      - 'tools/ci/apply-m161-rv64-int128-pair.py'
      - 'tools/ci/apply-m162-rv64-record-load.py'
      - 'tools/ci/apply-m163-rv64-caller-abi.py'
      - 'tools/ci/apply-m163b-rv64-zero-record-abi.py'
      - 'tools/ci/apply-m164-rv64-tail-trace.py'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-rv64-tail-trace:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Record M164 trace head
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "M163_STAGED_BASELINE_PASS=463"
          echo "M164_TRACE_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object src/target/riscv64/core_codegen.c)" = a5414575a573abd9ce9ced00fb6c234d785e4e03

      - name: Materialize M163 backend and M164 trace
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m161-rv64-int128-pair.py
          python3 tools/ci/apply-m162-rv64-record-load.py
          python3 tools/ci/apply-m163-rv64-caller-abi.py
          python3 tools/ci/apply-m163b-rv64-zero-record-abi.py
          python3 tools/ci/apply-m164-rv64-tail-trace.py
          git diff --check

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build traced compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m164-compiler

      - name: Replay four tail representatives
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m164-compiler/bin/minic"
          mkdir -p build/m164-trace
          for spec in "193 rht" "25 time" "96 rq" "219 ndisc"; do
            set -- $spec
            index="$1"
            name="$2"
            work="$GITHUB_WORKSPACE/build/m164-trace/$name"
            set +e
            MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
              python3 tests/external/linux/corpus_replay.py \
                --minic "$compiler" \
                --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
                --work "$work" \
                --jobs 1 --offset "$index" --limit 1 --sample-count 0
            rc=$?
            set -e
            echo "M164_FOCUSED name=$name index=$index rc=$rc"
            find "$work/minic-stderr" -type f -print -exec cat {} \; 2>/dev/null || true
          done

      - name: Require four precise traces
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          out=[]
          for name in ('rht','time','rq','ndisc'):
              root=Path('build/m164-trace')/name/'minic-stderr'
              text='\n'.join(p.read_text(errors='replace') for p in root.rglob('*') if p.is_file())
              lines=[line for line in text.splitlines() if 'M164_PREFLIGHT' in line]
              if not lines:
                  raise SystemExit(f'M164 missing trace for {name}')
              out.append(f'[{name}]')
              out.extend(lines[-8:])
          summary='\n'.join(out)+'\n'
          Path('build/m164-trace/preflight-summary.txt').write_text(summary)
          print(summary)
          PY

      - name: Persist M164 trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m164-rv64-tail-trace-${{ github.sha }}
          path: build/m164-trace
          if-no-files-found: warn
