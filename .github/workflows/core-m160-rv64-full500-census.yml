name: Core M170 RV64 Object Shape Trace

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'tests/external/linux/corpus_replay.py'
      - 'tools/ci/apply-m161-rv64-int128-pair.py'
      - 'tools/ci/apply-m162-rv64-record-load.py'
      - 'tools/ci/apply-m163-rv64-caller-abi.py'
      - 'tools/ci/apply-m163b-rv64-zero-record-abi.py'
      - 'tools/ci/apply-m165-rv64-indirect-parameter-object.py'
      - 'tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py'
      - 'tools/ci/apply-m167-rv64-zero-record-copy.py'
      - 'tools/ci/apply-m167d-rv64-indirect-record-return.py'
      - 'tools/ci/apply-m168-rv64-indirect-call-stack.py'
      - 'tools/ci/apply-m169-rv64-tail-preflight-trace.py'
      - 'tools/ci/apply-m170-rv64-object-detail-trace.py'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-rv64-object-shape-trace:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Record M170 trace head
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "M168_CONFIRMED_PASS=483"
          echo "M170_TRACE_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object src/target/riscv64/core_codegen.c)" = a5414575a573abd9ce9ced00fb6c234d785e4e03

      - name: Materialize M161-M170 traced backend
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m161-rv64-int128-pair.py
          python3 tools/ci/apply-m162-rv64-record-load.py
          python3 tools/ci/apply-m163-rv64-caller-abi.py
          python3 tools/ci/apply-m163b-rv64-zero-record-abi.py
          python3 tools/ci/apply-m165-rv64-indirect-parameter-object.py
          python3 tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py
          python3 tools/ci/apply-m167-rv64-zero-record-copy.py
          python3 tools/ci/apply-m167d-rv64-indirect-record-return.py
          python3 tools/ci/apply-m168-rv64-indirect-call-stack.py
          python3 tools/ci/apply-m169-rv64-tail-preflight-trace.py
          python3 tools/ci/apply-m170-rv64-object-detail-trace.py
          git diff --check

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build traced compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m170-compiler

      - name: Trace 13 object failures
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m170-compiler/bin/minic"
          indices="95 98 120 127 157 221 222 232 249 270 272 274 295"
          : > build/m170-object-trace.txt
          for index in $indices; do
            work="$GITHUB_WORKSPACE/build/m170-object/$index"
            mkdir -p "$work"
            set +e
            MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
              python3 tests/external/linux/corpus_replay.py \
                --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
                --work "$work" --jobs 1 --offset "$index" --limit 1 --sample-count 0 \
                >"$work.stdout" 2>"$work.stderr"
            rc=$?
            set -e
            line="$(grep -R -m1 -F 'M170_OBJECT' "$work/minic-stderr" 2>/dev/null || true)"
            echo "M170_TAIL index=$index rc=$rc trace=$line" | tee -a build/m170-object-trace.txt
            test "$rc" != 0
            test -n "$line"
          done

      - name: Summarize M170 object shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          cat build/m170-object-trace.txt
          test "$(grep -c 'M170_OBJECT' build/m170-object-trace.txt)" = 13

      - name: Persist M170 object trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m170-rv64-object-trace-${{ github.sha }}
          path: |
            build/m170-object-trace.txt
            build/m170-object
          if-no-files-found: warn
