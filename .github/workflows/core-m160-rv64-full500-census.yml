name: Core M167 RV64 Zero Record Copy Full500 Census

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'tests/external/linux/corpus_replay.py'
      - 'tools/ci/apply-m161-rv64-int128-pair.py'
      - 'tools/ci/apply-m162-rv64-record-load.py'
      - 'tools/ci/apply-m163-rv64-caller-abi.py'
      - 'tools/ci/apply-m163b-rv64-zero-record-abi.py'
      - 'tools/ci/apply-m165-rv64-indirect-parameter-object.py'
      - 'tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py'
      - 'tools/ci/apply-m167-rv64-zero-record-copy.py'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-rv64-full500:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Record M167 staging head
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "M166_STAGED_BASELINE_PASS=473"
          echo "M167_STAGING_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object src/target/riscv64/core_codegen.c)" = a5414575a573abd9ce9ced00fb6c234d785e4e03

      - name: Materialize M161-M167 backend
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m161-rv64-int128-pair.py
          python3 tools/ci/apply-m162-rv64-record-load.py
          python3 tools/ci/apply-m163-rv64-caller-abi.py
          python3 tools/ci/apply-m163b-rv64-zero-record-abi.py
          python3 tools/ci/apply-m165-rv64-indirect-parameter-object.py
          python3 tools/ci/apply-m166-rv64-fixed-asm-phase-alias.py
          python3 tools/ci/apply-m167-rv64-zero-record-copy.py
          git diff --check
          git diff --stat

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build staged compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m167-compiler

      - name: Run fast regression gate
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m167-check

      - name: Focused zero-record copy owner
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m167-compiler/bin/minic"
          for spec in "96 rq rq_pin_lock 1" "25 time gettimeofday_fallback 1"; do
            set -- $spec
            index="$1"
            name="$2"
            old_owner="$3"
            require_pass="$4"
            work="$GITHUB_WORKSPACE/build/m167-focused/$name"
            set +e
            MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
              python3 tests/external/linux/corpus_replay.py \
                --minic "$compiler" \
                --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
                --work "$work" --jobs 1 --offset "$index" --limit 1 --sample-count 0
            rc=$?
            set -e
            echo "M167_FOCUSED name=$name index=$index rc=$rc"
            if [ "$require_pass" = 1 ]; then
              test "$rc" = 0
            fi
            ! grep -R -F "Core-owned function '$old_owner' cannot be emitted by RV64 basic-v0" "$work/minic-stderr" 2>/dev/null
          done

      - name: Replay frozen full500 through staged Core RV64
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m167-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m167-core-rv64"
          set +e
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
            python3 tests/external/linux/corpus_replay.py \
              --minic "$compiler" \
              --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0
          rc=$?
          set -e
          echo "M167_REPLAY_STATUS=$rc"

      - name: Classify M167 staged frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json, re
          work=Path('build/m167-core-rv64')
          rows=json.loads((work/'batch-results.json').read_text())
          selected=len(rows)
          passed=sum(r.get('status')=='PASS' for r in rows)
          failed=sum(r.get('status')=='FAIL' for r in rows)
          missing=sum(r.get('status')=='PREPROCESS_MISSING' for r in rows)
          preflight=re.compile(r"Core-owned function '([^']+)' cannot be emitted by RV64 basic-v0")
          runtime=re.compile(r"cannot emit RISC-V function '([^']+)' \(index=\d+\)")
          groups=Counter(); functions=Counter(); unexpected=[]
          for row in rows:
              if row.get('status')!='FAIL': continue
              msg=str(row.get('message',''))
              m=preflight.search(msg)
              if m: group, fn='preflight-reject', m.group(1)
              else:
                  m=runtime.search(msg)
                  if m: group, fn='emit-runtime', m.group(1)
                  elif 'Core IR shadow does not yet support function' in msg: group, fn='unexpected-core-lowering-unsupported', None
                  elif 'Core IR shadow lowering failed for function' in msg or 'Core verifier' in msg: group, fn='unexpected-core-error', None
                  else: group, fn='unexpected-other', None
              groups[group]+=1
              if fn: functions[f'{group}:{fn}']+=1
              if group.startswith('unexpected-'): unexpected.append(row)
          headline=(f'M167_CORE_RV64_STAGED selected={selected} pass={passed} fail={failed} '
                    f'preprocess_missing={missing} preflight_reject={groups["preflight-reject"]} '
                    f'emit_runtime={groups["emit-runtime"]} unexpected={len(unexpected)}')
          print(headline)
          for key,count in functions.most_common(50): print(f'  {count:4d}  {key}')
          (work/'m167-summary.json').write_text(json.dumps({
              'baseline_pass':473,'selected':selected,'pass':passed,'fail':failed,
              'preprocess_missing':missing,'groups':dict(groups),'functions':dict(functions),
              'unexpected':unexpected,'headline':headline}, indent=2, sort_keys=True))
          if selected!=500 or missing!=0: raise SystemExit('M167 corpus invariant failed')
          if unexpected: raise SystemExit(f'M167 unexpected failures={len(unexpected)}')
          if groups['emit-runtime']!=0: raise SystemExit(f'M167 runtime emitter failures={groups["emit-runtime"]}')
          if passed<=473: raise SystemExit(f'M167 did not improve 473/500 baseline: pass={passed}')
          PY

      - name: Persist M167 staged census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m167-rv64-full500-${{ github.sha }}
          path: |
            build/m167-focused
            build/m167-core-rv64/batch-results.json
            build/m167-core-rv64/batch-results.tsv
            build/m167-core-rv64/batch-summary.txt
            build/m167-core-rv64/failure-contexts.txt
            build/m167-core-rv64/m167-summary.json
            build/m167-core-rv64/minic-stderr
          if-no-files-found: warn
