name: Core M160 RV64 Full500 Census

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'tests/core/**'
      - 'tests/target/riscv64/**'
      - 'tests/external/linux/corpus_replay.py'
      - '.github/workflows/core-m160-rv64-full500-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-rv64-full500:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Record M160 convergence head
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "M160_CONVERGENCE_START=76a4a4d86fb320f6bb567cc1c1bda2f50289ee5c"
          echo "M160_EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m160-compiler

      - name: Run fast regression gate
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m160-check

      - name: Replay frozen full500 through Core RV64
        id: replay
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m160-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m160-core-rv64"
          set +e
          MINIC_CORE_IR=strict MINIC_CORE_CODEGEN=basic-v0 \
            python3 tests/external/linux/corpus_replay.py \
              --minic "$compiler" \
              --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" \
              --jobs 4 \
              --offset 0 \
              --limit 500 \
              --sample-count 0
          replay_status=$?
          set -e
          echo "status=$replay_status" >> "$GITHUB_OUTPUT"
          printf 'M160_REPLAY_STATUS=%d\n' "$replay_status"

      - name: Capture common first-blocker partial assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          work = Path('build/m160-core-rv64')
          assembly = work / 'minic-out/init/main.i.s'
          output = work / 'm160-first-blocker-assembly.txt'
          if not assembly.exists():
              output.write_text('init/main.i partial assembly is missing\n')
              raise SystemExit(0)

          lines = assembly.read_text(errors='replace').splitlines()
          start = max(0, len(lines) - 240)
          for index, line in enumerate(lines):
              if line.strip() == 'mul_u64_u32_shr:':
                  start = index
          selected = lines[start:]
          output.write_text(
              f'assembly_lines={len(lines)} capture_start={start + 1}\n' +
              '\n'.join(selected) + '\n'
          )
          print(output.read_text())
          PY

      - name: Classify Core RV64 backend frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from pathlib import Path
          import json
          import os
          import re

          work = Path('build/m160-core-rv64')
          rows = json.loads((work / 'batch-results.json').read_text())
          selected = len(rows)
          passed = sum(row.get('status') == 'PASS' for row in rows)
          failed = sum(row.get('status') == 'FAIL' for row in rows)
          missing = sum(row.get('status') == 'PREPROCESS_MISSING' for row in rows)

          preflight_re = re.compile(
              r"Core-owned function '([^']+)' cannot be emitted by RV64 basic-v0"
          )
          emit_runtime_re = re.compile(
              r"cannot emit RISC-V function '([^']+)' \(index=\d+\)"
          )
          groups: Counter[str] = Counter()
          functions: Counter[str] = Counter()
          examples: dict[str, list[dict[str, object]]] = {}
          unexpected: list[dict[str, object]] = []

          def classify(message: str) -> tuple[str, str | None]:
              match = preflight_re.search(message)
              if match:
                  return 'preflight-reject', match.group(1)
              match = emit_runtime_re.search(message)
              if match:
                  return 'emit-runtime', match.group(1)
              if 'Core IR shadow does not yet support function' in message:
                  return 'unexpected-core-lowering-unsupported', None
              if 'Core IR shadow lowering failed for function' in message or 'Core verifier' in message:
                  return 'unexpected-core-error', None
              return 'unexpected-other', None

          for row in rows:
              if row.get('status') != 'FAIL':
                  continue
              message = str(row.get('message', ''))
              group, function = classify(message)
              groups[group] += 1
              if function:
                  functions[f'{group}:{function}'] += 1
              item = {
                  'index': row.get('index'),
                  'input': row.get('input'),
                  'source': row.get('source'),
                  'function': function,
                  'message': message,
              }
              examples.setdefault(group, [])
              if len(examples[group]) < 40:
                  examples[group].append(item)
              if group.startswith('unexpected-'):
                  unexpected.append(item)

          preflight = groups['preflight-reject']
          emit_runtime = groups['emit-runtime']
          headline = (
              f'M160_CORE_RV64_EXACT selected={selected} pass={passed} fail={failed} '
              f'preprocess_missing={missing} preflight_reject={preflight} '
              f'emit_runtime={emit_runtime} unexpected={len(unexpected)}'
          )
          print(headline)

          summary = {
              'convergence_start': '76a4a4d86fb320f6bb567cc1c1bda2f50289ee5c',
              'exact_head': os.environ.get('GITHUB_SHA', ''),
              'selected': selected,
              'pass': passed,
              'fail': failed,
              'preprocess_missing': missing,
              'groups': dict(groups),
              'functions': dict(functions),
              'examples': examples,
              'unexpected': unexpected,
              'headline': headline,
          }
          (work / 'm160-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))

          text = [headline, '', 'groups:']
          for group, count in groups.most_common():
              text.append(f'  {count:4d}  {group}')
          if not groups:
              text.append('  none')
          text.extend(['', 'first-blocker functions:'])
          for key, count in functions.most_common(30):
              text.append(f'  {count:4d}  {key}')
          if not functions:
              text.append('  none')
          text.extend(['', 'examples:'])
          for group, items in examples.items():
              text.append(f'  [{group}]')
              for item in items:
                  function = item['function'] or '-'
                  text.append(
                      f"    index={item['index']} input={item['input']} function={function} "
                      f"message={item['message']}"
                  )
          (work / 'm160-summary.txt').write_text('\n'.join(text) + '\n')
          (work / 'headline.txt').write_text(headline + '\n')

          step_summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with step_summary.open('a') as out:
              out.write('## M160 Core -> RV64 full500 census\n\n')
              out.write(f'`{headline}`\n\n')
              out.write('```text\n')
              out.write((work / 'm160-summary.txt').read_text())
              out.write('```\n')

          if selected != 500:
              raise SystemExit(f'M160 expected 500 selected TUs, got {selected}')
          if missing != 0:
              raise SystemExit(f'M160 corpus missing {missing} selected TUs')
          if unexpected:
              raise SystemExit(
                  f'M160 found {len(unexpected)} failures outside the Core RV64 backend boundary'
              )
          PY

      - name: Persist M160 census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m160-rv64-full500-${{ github.sha }}
          path: |
            build/m160-core-rv64/batch-results.json
            build/m160-core-rv64/batch-results.tsv
            build/m160-core-rv64/batch-summary.txt
            build/m160-core-rv64/failure-contexts.txt
            build/m160-core-rv64/m160-summary.json
            build/m160-core-rv64/m160-summary.txt
            build/m160-core-rv64/headline.txt
            build/m160-core-rv64/m160-first-blocker-assembly.txt
            build/m160-core-rv64/minic-stderr
          if-no-files-found: warn
