name: Stage typeof function-designator v1

on:
  push:
    branches:
      - staging/typeof-function-designator-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'materialize typeof function-designator v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize narrow product delta
        run: python3 tools/dev/stage-typeof-function-designator-v1.py
      - name: Format and inspect product delta
        run: |
          clang-format-18 -i src/frontend/parser_type.c
          git diff --check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff -- src/frontend/parser_type.c tests/compiler/c0/typeof_generic.c tests/compiler/c0/run-typeof-generic.sh
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/typeof-function-stage
      - name: Run focused typeof regression
        run: |
          MINIC="$GITHUB_WORKSPACE/build/typeof-function-stage/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/typeof-function-stage" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-typeof-generic.sh
      - name: Commit staged product delta
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_type.c tests/compiler/c0/typeof_generic.c tests/compiler/c0/run-typeof-generic.sh
          git commit -m 'materialize typeof function-designator v1'
          git push origin HEAD:staging/typeof-function-designator-v1
