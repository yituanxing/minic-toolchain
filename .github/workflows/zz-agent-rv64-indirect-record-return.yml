name: Agent RV64 indirect record return

on:
  push:
    branches:
      - agent/rv64-indirect-record-return-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build baseline and prove the large-record return gap
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-indirect-return-baseline
          cat > /tmp/indirect-record-return.c <<'EOF'
          struct triple64 { long a; long b; long c; };
          static struct triple64 make_triple(long x) {
              struct triple64 r;
              r.a = x;
              r.b = x + 1;
              r.c = x + 2;
              return r;
          }
          static long consume(long x) {
              struct triple64 r = make_triple(x);
              return r.a + r.b + r.c;
          }
          int main(void) { return (int)consume(3); }
          EOF
          cc -E -P -std=gnu11 -x c /tmp/indirect-record-return.c -o /tmp/indirect-record-return.i
          if build/agent-indirect-return-baseline/bin/minic -S /tmp/indirect-record-return.i \
              -o /tmp/indirect-record-return.s 2>/tmp/indirect-record-return.stderr; then
            echo 'baseline unexpectedly accepted 24-byte record return' >&2
            exit 1
          fi
          grep -F 'cannot write RISC-V assembly' /tmp/indirect-record-return.stderr >/dev/null

      - name: Apply candidate product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent-rv64-indirect-record-return.py
          clang-format-18 -i \
            src/target/riscv64/abi.c \
            src/target/riscv64/abi.h \
            src/target/riscv64/codegen_internal.h \
            src/target/riscv64/codegen_support.c \
            src/target/riscv64/codegen_function.c \
            src/target/riscv64/codegen_expression.c \
            src/target/riscv64/codegen_statement.c \
            tests/target/riscv64/abi_test.c \
            tests/compiler/c0/rv64_integer_aggregate_return.c
          git diff --check

      - name: Build patched compiler with warnings as errors
        shell: bash
        run: |
          set -Eeuo pipefail
          make clean BUILD_DIR=build/agent-indirect-return-patched || true
          make -j4 MODE=release BUILD_DIR=build/agent-indirect-return-patched EXTRA_CFLAGS='-Werror'

      - name: Run ABI and aggregate-return focused gates
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-rv64-abi
          MINIC="$GITHUB_WORKSPACE/build/agent-indirect-return-patched/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-indirect-return-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-rv64-integer-aggregate-return.sh

      - name: Run fast regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-fast

      - name: Commit only validated product files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/agent-rv64-indirect-record-return.py
          rm -f .github/workflows/zz-agent-rv64-indirect-record-return.yml
          git add \
            src/target/riscv64/abi.c \
            src/target/riscv64/abi.h \
            src/target/riscv64/codegen_internal.h \
            src/target/riscv64/codegen_support.c \
            src/target/riscv64/codegen_function.c \
            src/target/riscv64/codegen_expression.c \
            src/target/riscv64/codegen_statement.c \
            tests/target/riscv64/abi_test.c \
            tests/compiler/c0/rv64_integer_aggregate_return.c \
            tests/compiler/c0/run-rv64-integer-aggregate-return.sh \
            tools/dev/agent-rv64-indirect-record-return.py \
            .github/workflows/zz-agent-rv64-indirect-record-return.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: support RV64 indirect record returns'
          git push origin HEAD:agent/rv64-indirect-record-return-v1
