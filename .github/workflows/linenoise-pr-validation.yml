name: linenoise PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linenoise-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linenoise-compile:
    name: linenoise-compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage current discovery semantics and build MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          sh tools/dev/pr73-stage.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          make -j4 MODE=release BUILD_DIR=build/linenoise-compiler
          make -j4 MODE=sanitize BUILD_DIR=build/linenoise-sanitize

      - name: Verify focused discovery semantics
        shell: bash
        run: |
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-function-pointer-parameters.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-extern-objects.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-function-type-typedefs.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-unnamed-prototype-parameters.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-static-pointer-arrays.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-static-zero-definitions.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-record-copy-array-members.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-zero-aggregate-null.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-record-local-initializers.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-multiply-assignment.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-static-local-string-arrays.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-external-pointer-definitions.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-adjacent-string-literals.sh
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-focused" HOST_CC=cc sh tests/compiler/c0/run-global-pointer-subscripts.sh

      - name: Compile unchanged linenoise
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/linenoise-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-discovery" \
          HOST_CC=cc \
            sh tests/external/linenoise/probe.sh
          status=$?
          set -e

          if test "$status" -ge 128 && test -f "$GITHUB_WORKSPACE/build/linenoise-discovery/linenoise.i"; then
            echo "LINENOISE_SANITIZER_RERUN release_status=$status"
            set +e
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              "$GITHUB_WORKSPACE/build/linenoise-sanitize/bin/minic" \
              -S "$GITHUB_WORKSPACE/build/linenoise-discovery/linenoise.i" \
              -o "$GITHUB_WORKSPACE/build/linenoise-discovery/linenoise-sanitize.s"
            sanitize_status=$?
            set -e
            echo "LINENOISE_SANITIZER_STATUS=$sanitize_status"
          fi
          exit "$status"

      - name: Upload MiniC linenoise assembly
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linenoise-rv64-assembly
          path: build/linenoise-discovery/linenoise.s
          if-no-files-found: error
          retention-days: 3

  linenoise-runtime:
    name: linenoise-runtime
    needs: linenoise-compile
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          apt_cache="$HOME/.cache/minic-apt/archives"
          mkdir -p "$apt_cache/partial"
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          mapfile -d '' -t cached < <(find "$apt_cache" -maxdepth 1 -type f -name '*.deb' -print0 | sort -z)
          if (( ${#cached[@]} > 0 )); then
            sudo apt-get install -y --no-install-recommends "${cached[@]}"
          else
            sudo apt-get update
            sudo apt-get \
              -o Dir::Cache::archives="$apt_cache" \
              -o APT::Keep-Downloaded-Packages=true \
              install -y --no-install-recommends "${packages[@]}"
          fi
          sudo chown -R "$USER:$USER" "$(dirname "$apt_cache")"
          sh tools/ci/verify-validation-tools.sh

      - name: Download MiniC linenoise assembly
        uses: actions/download-artifact@v4
        with:
          name: linenoise-rv64-assembly
          path: build/linenoise-discovery

      - name: Run linenoise non-TTY GCC differential
        shell: bash
        run: |
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
          LINENOISE_ASSEMBLY="$GITHUB_WORKSPACE/build/linenoise-discovery/linenoise.s" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-runtime" \
            sh tests/external/linenoise/runtime_differential.sh
