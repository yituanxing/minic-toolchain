name: PR113 Materialize Deferred Declarator Attributes
on:
  push:
    branches: [agent/deferred-declarator-attributes-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize deferred declarator attributes
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr113-materialize.py
          chmod +x tests/compiler/c0/run-deferred-declarator-attributes.sh
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/deferred_declarator_attributes.c tests/compiler/c0/invalid_function_attribute_on_pointer_object.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr113-focused" sh tests/compiler/c0/run-deferred-declarator-attributes.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr113-materialize.py .github/workflows/pr113-materialize-deferred-attrs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(frontend): defer declarator attributes by entity'
          git push origin HEAD:agent/deferred-declarator-attributes-v0
