name: MiniPP Include Next V0

on:
  push:
    branches:
      - preprocessor/include-next-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minipp-include-next-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minipp-a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build MiniPP
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/minipp-include-next-v0 build/minipp-include-next-v0/bin/minic-cpp
      - name: Run MiniPP byte-identical A0
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIPP="$GITHUB_WORKSPACE/build/minipp-include-next-v0/bin/minic-cpp" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/minipp-include-next-v0" \
          REFERENCE_CPP=gcc \
            sh tests/preprocessor/run-a0.sh
