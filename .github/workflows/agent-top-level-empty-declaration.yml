name: Agent Top-Level Empty Declaration

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.head_ref == 'refactor/foundation-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/top-level-empty-declaration-v0
          fetch-depth: 0
      - name: Generate and validate slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_top_level_empty_declaration_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/top-level-empty-compiler
          MINIC="$GITHUB_WORKSPACE/build/top-level-empty-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/top-level-empty-focused" \
            sh tests/compiler/c0/run-gnu-top-level-empty-declaration.sh
          MINIC="$GITHUB_WORKSPACE/build/top-level-empty-compiler/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/top-level-empty-focused-all" \
            sh tools/dev/pr76-focused.sh
          make -j4 MODE=release BUILD_DIR=build/top-level-empty-compiler check-fast
      - name: Publish generated source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/parser_function.c \
            tests/compiler/c0/gnu_top_level_empty_declaration.c \
            tests/compiler/c0/run-gnu-top-level-empty-declaration.sh \
            tools/dev/pr76-focused.sh
          git diff --cached --check
          git diff --cached --quiet && {
            printf '%s\n' 'generator produced no source changes' >&2
            exit 1
          }
          git commit -m '[generated] frontend: accept top-level empty declarations' \
            -m 'Accept file-scope empty declarations by consuming standalone semicolons in the translation-unit dispatch loop. Keep block-scope empty statements unchanged and verify leading, consecutive, between-declaration, post-function, and trailing placements.\n\n在 translation-unit 分发循环中消费独立分号，从而支持 file-scope empty declaration；不改变 block-scope empty statement，并验证文件开头、连续、声明之间、函数定义之后和文件结尾等位置。'
          git push origin HEAD:agent/top-level-empty-declaration-v0 --force-with-lease
