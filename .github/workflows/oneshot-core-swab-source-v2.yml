name: One-shot Core Swab Source V2

on:
  pull_request:

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Build
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-swab-v2
      - name: Inspect and probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          found = 0
          for p in Path('build/linux-focus-corpus').rglob('*.i'):
              s = p.read_text(errors='replace')
              m = re.search(r'\b__swab\s*\(', s)
              if not m:
                  continue
              print('CORE_SWAB_FILE', p)
              print('CORE_SWAB_CONTEXT_BEGIN')
              print(s[max(0,m.start()-1200):min(len(s),m.start()+2400)])
              print('CORE_SWAB_CONTEXT_END')
              found += 1
              if found == 2:
                  break
          print('CORE_SWAB_FILES', found)
          if not found:
              raise SystemExit(1)
          PY
          c="$GITHUB_WORKSPACE/build/core-swab-v2/bin/minic"
          mkdir -p build/core-swab-v2-shapes
          cat > build/core-swab-v2-shapes/constant_p.i <<'EOF'
          unsigned long probe(unsigned long x) { return __builtin_constant_p(x) ? 7UL : x; }
          EOF
          cat > build/core-swab-v2-shapes/conditional.i <<'EOF'
          unsigned long helper(unsigned long x) { return x; }
          unsigned long probe(unsigned long x) { return x ? 7UL : helper(x); }
          EOF
          for n in constant_p conditional; do
            set +e
            MINIC_CORE_IR=strict "$c" -S build/core-swab-v2-shapes/$n.i -o /tmp/$n.s 2>/tmp/$n.err
            rc=$?
            set -e
            printf 'CORE_SWAB_V2 name=%s rc=%d message=' "$n" "$rc"
            tr '\n' ' ' </tmp/$n.err
            echo
          done
