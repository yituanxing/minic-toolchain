name: MiniC Native Strict Backend Gate

on:
  pull_request:
    paths:
      - 'src/target/**'
      - 'tools/minic/**'
      - 'tools/minic-cc/**'
      - 'tests/compiler/c0/probe-minic-driver-target-catalog.sh'
      - 'tests/compiler/c0/probe-target-language-abi-options.sh'
      - 'src/core/**'
      - 'src/compiler/**'
      - 'src/frontend/**'
      - 'tests/target/riscv64/layout_test.c'
      - 'Makefile'
      - 'tests/compiler/c0/check-four-target-model-m0.c'
      - 'tests/compiler/c0/check-minic-target-boundaries.sh'
      - 'tests/compiler/c0/gnu_prefix_function_attributes.c'
      - 'tests/compiler/c0/run-gnu-prefix-function-attributes.sh'
      - 'tests/compiler/c0/run-gnu-inline-asm-operands.sh'
      - 'tests/compiler/c0/gnu_fixed_register_bindings.c'
      - 'tests/compiler/c0/run-gnu-fixed-register-bindings.sh'
      - 'tests/compiler/c0/run-block-extern-incomplete.sh'
      - 'tests/compiler/c0/run-linux-empty-inline-asm.sh'
      - 'tests/compiler/c0/run-core-constant-switch-dead-cases.sh'
      - 'tests/compiler/c0/block-extern-incomplete.c'
      - 'tests/compiler/c0/probe-rv32-frame-access.c'
      - 'tests/compiler/c0/probe-core-semantic-family.c'
      - 'tests/compiler/c0/probe-core-block-walk.c'
      - 'tests/compiler/c0/probe-direct-lp64-dispatch.c'
      - 'tests/compiler/c0/probe-core-facts-one-pass.c'
      - 'tests/compiler/c0/probe-program-emit-transaction.c'
      - '.github/workflows/minic-native-refactor-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'src/target/**'
      - 'tools/minic/**'
      - 'tools/minic-cc/**'
      - 'tests/compiler/c0/probe-minic-driver-target-catalog.sh'
      - 'tests/compiler/c0/probe-target-language-abi-options.sh'
      - 'src/core/**'
      - 'src/compiler/**'
      - 'src/frontend/**'
      - 'tests/target/riscv64/layout_test.c'
      - 'Makefile'
      - '.github/workflows/minic-native-refactor-gate.yml'
      - 'tests/compiler/c0/check-minic-target-boundaries.sh'
      - 'tests/compiler/c0/gnu_prefix_function_attributes.c'
      - 'tests/compiler/c0/run-gnu-prefix-function-attributes.sh'
      - 'tests/compiler/c0/run-gnu-inline-asm-operands.sh'
      - 'tests/compiler/c0/gnu_fixed_register_bindings.c'
      - 'tests/compiler/c0/run-gnu-fixed-register-bindings.sh'
      - 'tests/compiler/c0/run-block-extern-incomplete.sh'
      - 'tests/compiler/c0/block-extern-incomplete.c'
      - 'tests/compiler/c0/probe-rv32-frame-access.c'
      # Changes to the native ABI/oracle must execute the native gate too.
      - 'tests/compiler/c0/run-x86_64-native-m1.sh'
      - 'tests/compiler/c0/probe-x86-nospec-native.sh'
      - 'tests/compiler/c0/probe-linux-declaration-gates.sh'
      - 'tests/compiler/c0/probe-linux-global-prefix-attributes.sh'
      - 'tests/compiler/c0/probe-x86-linux-bitops.sh'
      - 'tests/compiler/c0/probe-x86-linux-callee-clobber.sh'
      - 'tests/compiler/c0/probe-x86-linux-percpu-gs.sh'
      - 'tests/compiler/c0/probe-x86-linux-checksum-fold.sh'
      - 'tests/compiler/c0/probe-x86-linux-msr-extable.sh'
      - 'tests/compiler/c0/probe-x86-linux-hweight-alternative.sh'
      - 'tests/compiler/c0/probe-x86-linux-clock-msr.sh'
      - 'tests/compiler/c0/probe-x86-linux-port-io.sh'
      - 'tests/compiler/c0/probe-x86-linux-atomic-rmw.sh'
      - 'tests/compiler/c0/probe-x86-linux-atomic-cc.sh'
      - 'tests/compiler/c0/probe-x86-linux-trycas.sh'
      - 'tests/compiler/c0/probe-x86-linux-native-cpuid.sh'
      - 'tests/compiler/c0/probe-x86-linux-atomic-binary-cc.sh'
      - 'tests/compiler/c0/probe-x86-linux-tied-bit-scan.sh'
      - 'tests/compiler/c0/probe-rv64-extended-float-native.sh'
      - 'tests/compiler/c0/probe-rv64-pic-glibc-got.sh'
      - 'tests/compiler/c0/probe-rv64i-strict-isa.sh'
  workflow_dispatch:

concurrency:
  group: minic-native-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minic-native:
    name: MiniC strict compile and x86 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check MiniC backend ownership invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/check-minic-target-boundaries.sh
      - name: Exhaustive Core opcode family and ISA separation
        shell: bash
        run: |
          set -Eeuo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Wswitch-enum -Werror \
            -Isrc -Iinclude tests/compiler/c0/probe-core-semantic-family.c \
            -o "$RUNNER_TEMP/minic-core-semantic-family"
          "$RUNNER_TEMP/minic-core-semantic-family"
      - name: Strictly compile all MiniC targets without apt or QEMU prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minic-native-backend all
          test -x build/minic-native-backend/bin/minic
          test -x build/minic-native-backend/bin/minic-cc
      - name: Exact original Linux AArch64 MRS u64 ABI family and negative target qualification
        run: |
          set -Eeuo pipefail
          MINIC_SYSREG_NATIVE_ONLY=1 bash tests/compiler/c0/probe-aarch64-linux-sysreg64.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
      - name: LoongArch original Linux mask_nospec exact hardware and fail-closed source
        run: |
          set -Eeuo pipefail
          MINIC_LOONG_NOSPEC_NATIVE_ONLY=1 bash tests/compiler/c0/probe-loongarch-linux-nospec.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
      - name: Original GNU Linux ELF named globals across all five targets
        run: |
          set -Eeuo pipefail
          for target in x86_64 aarch64 loongarch64 riscv64 riscv32; do
            MINIC_SECTION_ONLY=1 bash tests/compiler/c0/probe-linux-global-section-reloc.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" "$target"
          done
      - name: Original Linux local_t x86 GNU RMW exact hardware and differential runtime
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-linux-local-rmw.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
      - name: Original Linux level-zero frame builtin two target policy probes
        run: |
          set -Eeuo pipefail
          for target in aarch64 loongarch64; do
            MINIC_FRAME_SOURCE_ONLY=1 bash tests/compiler/c0/probe-direct-linux-frame-level0.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" "$target"
          done
      - name: Original Linux local_add_return XADD true hardware+register GNU differential
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-linux-local-xadd.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
      - name: Original Linux x86 cmpxchg OLD-return four hardware widths GNU runtime
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-x86-linux-raw-cmpxchg.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
      - name: Original Linux LoongArch CSR immutable Core call-argument source constants
        run: |
          set -Eeuo pipefail
          MINIC_LOONG_CSR_SOURCE_ONLY=1 bash tests/compiler/c0/probe-loongarch-linux-csr-constants.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
      - name: Common GNU function metadata and inline-asm fail-closed regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic" \
          BUILD_DIR=build/minic-native-backend \
            sh tests/compiler/c0/run-gnu-prefix-function-attributes.sh
          MINIC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic" \
          BUILD_DIR=build/minic-native-backend \
            sh tests/compiler/c0/run-gnu-fixed-register-bindings.sh
          MINIC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic" \
          BUILD_DIR=build/minic-native-backend \
            sh tests/compiler/c0/run-block-extern-incomplete.sh
          # L1 only: the entire GNU inline-asm operand suite is an RV64
          # backend/assembler campaign with unrelated prerequisites. The
          # changed parser diagnostic gets its own focused negative proof.
          cat > "$RUNNER_TEMP/one-unsupported-clobber.i" <<'SRC'
          int f(int value) {
              __asm__ __volatile__("addi %0, %0, 1" : "+r"(value) : : "s1");
              return value;
          }
          SRC
          if build/minic-native-backend/bin/minic-cc --target=riscv64-linux \
              -S "$RUNNER_TEMP/one-unsupported-clobber.i" \
              -o "$RUNNER_TEMP/one-unsupported-clobber.s" \
              >"$RUNNER_TEMP/one-unsupported-clobber.stdout" \
              2>"$RUNNER_TEMP/one-unsupported-clobber.stderr"; then
              echo "FAIL: unsupported s1 clobber accepted" >&2
              exit 1
          fi
          grep -F 'unsupported GNU asm register clobber for target: s1' \
            "$RUNNER_TEMP/one-unsupported-clobber.stderr"
          # One shared GNU parser, all five targets. This is the exact
          # original Linux 'asm __inline volatile' syntax that previously
          # stopped 757 x86 C translation units before machine validation.
          # Empty template + memory clobber is a legitimate compiler barrier,
          # so each backend must preserve it without inventing ISA opcodes.
          cat > "$RUNNER_TEMP/gnu-asm-inline-qualifier.i" <<'SRC'
          int f(void) {
              asm __inline volatile("" ::: "memory");
              asm __inline__ volatile("" ::: "memory");
              asm inline volatile("" ::: "memory");
              return 42;
          }
          SRC
          for target in riscv32-linux riscv64-linux x86_64-linux aarch64-linux loongarch64-linux; do
              build/minic-native-backend/bin/minic-cc --target="$target" \
                -S "$RUNNER_TEMP/gnu-asm-inline-qualifier.i" \
                -o "$RUNNER_TEMP/gnu-asm-inline-$target.s"
              test -s "$RUNNER_TEMP/gnu-asm-inline-$target.s"
          done
          echo "MINIC_GNU_ASM_INLINE_FIVE_TARGET=PASS grammar=shared barrier=memory"
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
          BUILD_DIR=build/minic-native-backend \
            sh tests/compiler/c0/run-linux-empty-inline-asm.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
          BUILD_DIR=build/minic-native-backend \
            sh tests/compiler/c0/run-core-constant-switch-dead-cases.sh


      - name: Canonical target DataLayout record/global layout regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minic-native-backend check-layout

      - name: Two-XLEN Common single-pass SSA spill regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic" \
          BUILD_DIR=build/minic-native-backend \
            sh tests/compiler/c0/run-core-block-spill-reuse.sh

      - name: RV64 ABI function-plan owner, hard/soft float and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minic-native-backend check-rv64-abi

      - name: Five-target staged Driver and compiler identity
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic" \
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
            bash tests/compiler/c0/probe-minic-driver-target-catalog.sh

      - name: Five-target language ABI options, driver propagation and fail-closed modes
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic" \
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
            bash tests/compiler/c0/probe-target-language-abi-options.sh

      - name: Five-target language/ABI identity contract
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minic-native-backend check-four-target-model-m0

      - name: RV64 extended-float declarations without cross-toolchain installation
        shell: bash
        run: |
          set -Eeuo pipefail
          sh -n tests/compiler/c0/probe-rv64-extended-float-native.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
            sh tests/compiler/c0/probe-rv64-extended-float-native.sh

      - name: RV64 PCREL kernel and GOT glibc modes without APT
        shell: bash
        run: |
          set -Eeuo pipefail
          sh -n tests/compiler/c0/probe-rv64-pic-glibc-got.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
            MINIC_PIC_ASM_ONLY=1 sh tests/compiler/c0/probe-rv64-pic-glibc-got.sh

      - name: RV64I strict ISA and ABI positive/negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tests/compiler/c0/probe-rv64i-strict-isa.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
            bash tests/compiler/c0/probe-rv64i-strict-isa.sh
      - name: RISC-V 32/64 shared word operation lowering
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
            sh tests/compiler/c0/probe-riscv-shared-word-operations.sh

      - name: Source-owned RISC-V GNU assembler passthrough vs compiler-owned Base-I
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/compiler/c0/probe-rv64i-asm-origin.sh \
            "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"

      - name: Native x86-64 ABI and runtime smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = x86_64
          MINIC_CC="$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc" \
            HOST_CC=cc sh tests/compiler/c0/run-x86_64-native-m1.sh
          bash tests/compiler/c0/probe-x86-nospec-native.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-linux-declaration-gates.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-linux-global-prefix-attributes.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-bitops.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-callee-clobber.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-percpu-gs.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-checksum-fold.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-msr-extable.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-hweight-alternative.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-clock-msr.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-port-io.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-atomic-rmw.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-atomic-cc.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-trycas.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-native-cpuid.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-atomic-binary-cc.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
          bash tests/compiler/c0/probe-x86-linux-tied-bit-scan.sh "$GITHUB_WORKSPACE/build/minic-native-backend/bin/minic-cc"
