name: Toolchain M0 Structure Gate

on:
  push:
    branches:
      - "agent/linux-perf-boolean-domain-v1"
    paths:
      - ".github/workflows/toolchain-m0-structure.yml"
      - ".github/workflows/minild-integration-v1.yml"
      - "tools/ci/check_minild_integration_convergence_v1.py"
      - "tools/ci/check_minipp_frozen_convergence_v1.py"
      - "tools/ci/check_minipp_live_frozen_merge_v1.py"
      - "tools/ci/check_linux_runtime_focused_faults_convergence_v1.py"
      - "tools/ci/check_linux_runtime_fixture_restore_v1.py"
      - "tools/ci/check_linux_expanded_pi_p1_convergence_v1.py"
      - "tools/ci/check_linux_early_runtime_union_v1.py"
      - "tools/ci/select_runtime_owner_modes_v1.py"
      - "tools/ci/check_runtime_owner_routing_v1.py"
      - "tools/ci/check_early_runtime_dispatch_v1.py"
      - "tools/ci/check_ci_regression_path_isolation_v1.py"
      - ".github/workflows/toolchain-focused-regressions-v1.yml"
      - ".github/workflows-disabled/toolchain-focused-regressions-three-jobs-2026-10-09.yml"
      - ".github/workflows-disabled/minic-rv64-focused-regressions-v1.yml"
      - ".github/workflows-disabled/miniar-regressions-v1.yml"
      - ".github/workflows-disabled/minild-regressions-v1.yml"
      - "tools/ci/check_ci_shared_elf_coverage_v1.py"
      - "tools/ci/check_ci_trigger_coverage_v1.py"
      - "tools/ci/audit_active_workflow_routing_v1.py"
      - "tools/ci/check_linux_legacy_tag_router_v1.py"
      - ".github/workflows-disabled/performance-retired-2026-10-09/minias-a0-gate-v1.yml"
      - ".github/workflows-disabled/linux-expanded-kbuild-v0.yml"
      - ".github/workflows-disabled/miniar-linux-kbuild.yml"
      - ".github/workflows-disabled/linux-runtime-spinlock-context-v0.yml"
      - ".github/workflows-disabled/linux-core-shards-v1.yml"
      - ".github/workflows-disabled/linux-runtime-fdt-isolation-v1.yml"
      - ".github/workflows-disabled/linux-runtime-fixture-producers-v1.yml"
      - ".github/workflows-disabled/linux-runtime-focused-faults-v1.yml"
      - ".github/workflows-disabled/linux-runtime-focused-owners-v1.yml"
      - ".github/workflows-disabled/linux-runtime-owner-focused-v1.yml"
      - ".github/workflows-disabled/performance-retired-2026-10-09/linux-runtime-fdt-isolation-v1.yml"
      - ".github/workflows-disabled/performance-retired-2026-10-09/linux-runtime-focused-faults-v1.yml"
      - "docs/ci/ci-push-skip-audit-2026-10-09.md"
      - "tools/ci/select_runtime_focused_owners_v1.py"
      - "tools/ci/check_runtime_focused_owner_convergence_v1.py"
      - ".github/workflows/linux-runtime-focused-owners-v1.yml"
      - ".github/workflows-disabled/linux-runtime-mm-core-frontier-v0.yml"
      - ".github/workflows-disabled/linux-runtime-rcu-owner-v0.yml"
      - ".github/workflows-disabled/linux-runtime-riscv-init-codegen-v0.yml"
      - ".github/workflows-disabled/linux-runtime-timer-focused-v0.yml"
      - "tools/ci/export_ci_trigger_matrix_v1.py"
      - "tools/ci/select_miniobjcopy_elf_route_v1.py"
      - "tools/ci/check_ci_miniobjcopy_elf_route_v1.py"
      - ".github/workflows/miniobjcopy-strip-regressions-v1.yml"
      - "docs/ci/active-workflow-inventory-2026-10-09.tsv"
      - ".github/workflows/minic-driver-v0.yml"
      - ".github/workflows/minipp-a0.yml"
      - ".github/workflows/linux-runtime-owner-focused-v1.yml"
      - "tools/ci/check_linux_runtime_fdt_kallsyms_union_v1.py"
      - "tools/ci/check_linux_core_3352_first500_union_v1.py"
      - "tools/ci/check_linux_efi_vdso_convergence_v1.py"
      - "tools/ci/check_minias_semantic_convergence_v1.py"
      - "tools/ci/check_linux_runtime_fixture_producers_convergence_v1.py"
      - ".github/workflows/linux-runtime-fixture-producers-v1.yml"
      - "tools/ci/check_linux_runtime_contract_oracles_convergence_v1.py"
      - ".github/workflows/linux-efi-vdso-focused-v1.yml"
      - ".github/workflows-disabled/linux-runtime-contract-oracles-v1.yml"
      - ".github/workflows/linux-expanded-pi-p1-runtime-v1.yml"
      - ".github/actions/linux-runtime-restore-fixture/**"
      - "tools/ci/check_linux_runtime_frontier_diagnostics_convergence_v1.py"
      - "tools/ci/check_linux_runtime_diagnostic_union_v1.py"
      - ".github/workflows-disabled/linux-runtime-frontier-diagnostics-v1.yml"
      - ".github/workflows/linux-runtime-focused-faults-v1.yml"
      - ".github/workflows/minipp-linux-frozen-v1.yml"
      - ".github/workflows/linux-performance-experiments-v1.yml"
      - "tools/ci/select_perf_experiment_modes_v1.py"
      - "tools/ci/check_perf_experiment_convergence_v1.py"
      - ".github/workflows-disabled/linux-core-object-interval-top5-ab-v1.yml"
      - ".github/workflows-disabled/linux-gnu-constant-p-ice-regression-v1.yml"
      - ".github/workflows-disabled/linux-optimized-first500-verify-v1.yml"
      - ".github/workflows-disabled/linux-parser-scope-first500-ab-v1.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Structural checks or full historical compiler boundary"
        required: true
        type: choice
        default: full
        options:
          - structure
          - full

jobs:
  compiler-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Source oracles below still check the historically identical Runtime YAML.
      # Materialize copies only in this ephemeral runner; not GitHub active sources.
      - name: Materialize SHA-pinned archived Runtime sources for T0 only
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in linux-core-shards-v1.yml linux-runtime-fdt-isolation-v1.yml linux-runtime-fixture-producers-v1.yml linux-runtime-focused-faults-v1.yml linux-runtime-focused-owners-v1.yml linux-runtime-owner-focused-v1.yml; do
            test ! -e ".github/workflows/$name"
            src=".github/workflows-disabled/$name"
            case "$name" in
              linux-runtime-fdt-isolation-v1.yml|linux-runtime-focused-faults-v1.yml)
                src=".github/workflows-disabled/performance-retired-2026-10-09/$name"
                ;;
            esac
            test -f "$src"
            cp "$src" ".github/workflows/$name"
            cmp "$src" ".github/workflows/$name"
          done
          echo "M0_PERF_ARCHIVED_RUNTIME_SOURCE_MATERIALIZE=PASS copies=6"


      - name: Verify First500 performance opt-in contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/linux-performance-experiments-v1.yml').read_text()
          assert "contains(github.event.head_commit.message, '[perf-first500]')" in text
          assert "github.event_name == 'workflow_dispatch'" in text
          assert "tools/ci/**" not in text, "Overbroad CI helper change triggers heavyweight A/B"
          print('M0_PERF_TRIGGER_SCOPE=PASS opt_in_tag=perf-first500 no_broad_tools_ci=1')
          PY

      - name: Verify four preserved Performance experiment owners and exact job bodies
        run: |
          python3 tools/ci/select_perf_experiment_modes_v1.py --self-test
          python3 tools/ci/check_perf_experiment_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/linux-performance-experiments-v1.yml

      - name: Verify MiniLD consolidated integration contracts
        run: |
          python3 tools/ci/check_minild_integration_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_MINILD_INTEGRATION_YAML=PASS"' .github/workflows/minild-integration-v1.yml

      - name: Verify MiniPP frozen and live-Kbuild canonical sources
        run: |
          python3 tools/ci/check_minipp_live_frozen_merge_v1.py

      - name: Verify MiniPP frozen oracle workflow convergence
        run: |
          python3 tools/ci/check_minipp_frozen_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_MINIPP_FROZEN_YAML=PASS"' .github/workflows/minipp-linux-frozen-v1.yml

      - name: Verify seven-job Runtime diagnostic union and immutable canonical sources
        run: |
          python3 tools/ci/check_linux_runtime_diagnostic_union_v1.py

      - name: Verify Runtime focused fault diagnostics consolidation
        run: |
          python3 tools/ci/check_linux_runtime_focused_faults_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_RUNTIME_FOCUSED_FAULTS_YAML=PASS"' .github/workflows/linux-runtime-focused-faults-v1.yml

      - name: Verify Runtime frontier and QEMU diagnostics convergence
        run: |
          python3 tools/ci/check_linux_runtime_frontier_diagnostics_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_RUNTIME_FRONTIER_DIAGNOSTICS_YAML=PASS"' .github/workflows/linux-runtime-focused-faults-v1.yml

      - name: Check shared Linux fixture restore action and complete workflow source equivalence
        run: |
          python3 tools/ci/check_linux_runtime_fixture_restore_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_RUNTIME_FIXTURE_ACTION_YAML=PASS"' .github/actions/linux-runtime-restore-fixture/action.yml

      - name: Prove early Runtime consolidated source canons and seven exact jobs
        run: |
          python3 tools/ci/check_linux_early_runtime_union_v1.py

      - name: Verify expanded PI/P1 Runtime diagnostic workflow convergence
        run: |
          python3 tools/ci/check_linux_expanded_pi_p1_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_LINUX_EXPANDED_PI_P1_YAML=PASS"' .github/workflows/linux-expanded-pi-p1-runtime-v1.yml

      - name: Verify Linux EFI and vDSO focused oracle consolidation
        run: |
          python3 tools/ci/check_linux_efi_vdso_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_EFI_VDSO_YAML=PASS"' .github/workflows/linux-efi-vdso-focused-v1.yml

      - name: Verify Linux compiler semantics and QEMU watch contract consolidation
        run: |
          python3 tools/ci/check_linux_runtime_contract_oracles_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_RUNTIME_CONTRACT_ORACLES_YAML=PASS"' .github/workflows/linux-expanded-pi-p1-runtime-v1.yml

      - name: Check MiniAS focused and 3536 semantic oracle consolidation
        run: |
          python3 tools/ci/check_minias_semantic_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_MINIAS_SEMANTIC_YAML=PASS"' .github/workflows/minias-a0-focused-diagnostics-v1.yml

      - name: Verify Runtime frozen and compact fixture producer convergence
        run: |
          python3 tools/ci/check_linux_runtime_fixture_producers_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_RUNTIME_FIXTURE_PRODUCERS_YAML=PASS"' .github/workflows/linux-runtime-fixture-producers-v1.yml

      - name: Verify FDT and generated kallsyms focused owner convergence
        run: |
          python3 tools/ci/check_linux_runtime_fdt_kallsyms_union_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_FDT_KALLSYMS_YAML=PASS"' .github/workflows/linux-runtime-fdt-isolation-v1.yml

      - name: Verify Core full 3352 and first500/focused-five union
        run: |
          python3 tools/ci/check_linux_core_3352_first500_union_v1.py

      - name: Verify four preserved Runtime diagnostic jobs and selector routing
        run: |
          python3 tools/ci/select_runtime_focused_owners_v1.py --self-test
          python3 tools/ci/check_runtime_focused_owner_convergence_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/linux-runtime-focused-owners-v1.yml

      - name: Check Runtime Owner focused matrix path routing
        run: |
          python3 tools/ci/select_runtime_owner_modes_v1.py --self-test
          python3 tools/ci/check_runtime_owner_routing_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_OWNER_ROUTING_YAML=PASS"' .github/workflows/linux-runtime-owner-focused-v1.yml

      - name: Check early Runtime manual and push route truth table
        run: |
          python3 tools/ci/check_early_runtime_dispatch_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_EARLY_RUNTIME_ROUTING_YAML=PASS"' .github/workflows/linux-expanded-pi-p1-runtime-v1.yml

      - name: Verify regression push path isolation from Runtime-only trigger files
        run: |
          python3 tools/ci/check_ci_regression_path_isolation_v1.py
          for f in toolchain-focused-regressions-v1.yml; do
            ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' ".github/workflows/$f"
          done

      - name: Verify shared ELF build source path coverage
        run: |
          python3 tools/ci/check_ci_shared_elf_coverage_v1.py
          for f in toolchain-focused-regressions-v1.yml minic-driver-v0.yml minipp-a0.yml; do
            ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' ".github/workflows/$f"
          done

      - name: Remove temporary Runtime YAML copies before true active inventory checks
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in linux-core-shards-v1.yml linux-runtime-fdt-isolation-v1.yml linux-runtime-fixture-producers-v1.yml linux-runtime-focused-faults-v1.yml linux-runtime-focused-owners-v1.yml linux-runtime-owner-focused-v1.yml; do
            src=".github/workflows-disabled/$name"
            case "$name" in
              linux-runtime-fdt-isolation-v1.yml|linux-runtime-focused-faults-v1.yml)
                src=".github/workflows-disabled/performance-retired-2026-10-09/$name"
                ;;
            esac
            cmp "$src" ".github/workflows/$name"
            rm ".github/workflows/$name"
            test ! -e ".github/workflows/$name"
          done
          echo "M0_PERF_ACTIVE_ENTRYPOINT_SOURCE_RESTORE=PASS removed=6"

      - name: Audit all maintained workflow trigger/job contracts and MiniObjcopy ELF route
        run: |
          python3 tools/ci/check_ci_trigger_coverage_v1.py
          python3 tools/ci/check_linux_legacy_tag_router_v1.py
          if test -f .github/workflows/linux-legacy-tag-router-v1.yml; then
            ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "M0_LINUX_LEGACY_TAG_ROUTER_YAML=PASS"' .github/workflows/linux-legacy-tag-router-v1.yml
          fi
          python3 tools/ci/audit_active_workflow_routing_v1.py --self-test
          python3 tools/ci/audit_active_workflow_routing_v1.py --output build/ci-active-entrypoint-audit.tsv
          python3 tools/ci/export_ci_trigger_matrix_v1.py --output build/ci-trigger-matrix.tsv
          python3 tools/ci/select_miniobjcopy_elf_route_v1.py --self-test
          python3 tools/ci/check_ci_miniobjcopy_elf_route_v1.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/miniobjcopy-strip-regressions-v1.yml

      - name: Publish per-job CI trigger matrix audit
        uses: actions/upload-artifact@v4
        with:
          name: ci-trigger-matrix-performance
          path: |
            build/ci-trigger-matrix.tsv
            build/ci-active-entrypoint-audit.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Run Linux runtime isolation selftests
        run: |
          python3 tools/ci/test_linux_runtime_object_set_v1.py
          python3 tools/ci/test_linux_runtime_prefix_bisect_v1.py

      - name: Validate active Linux Kbuild wrapper contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tests/external/linux/stage2_kbuild_cc.sh
          bash -n tests/external/linux/stage2_kbuild_cc_test.sh
          bash tests/external/linux/stage2_kbuild_cc_test.sh
          echo "M0_KBUILD_WRAPPER_CONTRACT=PASS"

      - name: Validate BusyBox Kbuild ownership routing contract
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/m0-busybox-kbuild-routing-v0" \
            bash tests/driver/run-busybox-kbuild-routing-v0.sh
          echo "M0_BUSYBOX_KBUILD_ROUTING=PASS"

      - name: Build frozen compiler boundary
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: make clean && make -j2

      - name: Verify minic-cc and independent driver entrypoint
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x build/debug/bin/minic-cc
          test -x build/debug/bin/minic
          if cmp -s build/debug/bin/minic-cc build/debug/bin/minic; then
            echo "minic driver unexpectedly aliases minic-cc" >&2
            exit 1
          fi
          echo "M0_BINARY_BOUNDARY=PASS compiler=minic-cc driver=minic"

      - name: Run focused ownership gates
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          make check-token-model check-lexer check-type check-record check-type-alias
          make check-ast-contract check-layout check-rv64-abi
          make check-static-functions check-cast-expressions check-pointer-members

      - name: Verify compiler CLI output identity
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/m0-cli-identity
          mkdir -p "$work"
          cc -E -P -x c tests/compiler/c0/empty_main.c -o "$work/input.i"
          build/debug/bin/minic-cc -S "$work/input.i" -o "$work/minic-cc.s"
          build/debug/bin/minic -S "$work/input.i" -o "$work/minic-compat.s"
          cmp "$work/minic-cc.s" "$work/minic-compat.s"
          echo "M0_COMPILER_CLI_IDENTITY=PASS boundary=.i-to-.s driver_compat=PASS"
