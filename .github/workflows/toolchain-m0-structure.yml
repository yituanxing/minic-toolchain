name: Toolchain Structure and Ownership Gate

# Current main only. Historical migration/byte-identity audits belong to
# their original Git snapshots; they are not current product acceptance.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'tools/ci/**'
      - 'tests/external/linux/stage2_kbuild_cc*.sh'
      - 'tests/driver/run-busybox-kbuild-routing-v0.sh'
      - 'tests/target/backend_source_registration_test.c'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Parse current workflow and composite action YAML
        run: |
          ruby -e 'require "yaml"; files=Dir.glob(".github/workflows/*.{yml,yaml}") + Dir.glob(".github/actions/**/action.{yml,yaml}"); abort "No workflows" if files.empty?; files.sort.each { |f| YAML.parse_file(f) }; puts "CURRENT_CI_YAML=PASS files=#{files.size}"'

      - name: Validate live routing and artifact helper self-tests
        run: |
          python3 tools/ci/minias_artifact_rescue_v1.py --self-test
          python3 tools/ci/select_runtime_focused_owners_v1.py --self-test
          python3 tools/ci/select_runtime_owner_modes_v1.py --self-test
          python3 tools/ci/select_miniobjcopy_elf_route_v1.py --self-test

      - name: Run Linux runtime isolation selftests
        run: |
          python3 tools/ci/test_linux_runtime_object_set_v1.py
          python3 tools/ci/test_linux_runtime_prefix_bisect_v1.py
          python3 tools/ci/test_linux_runtime_gcc_minic_ab_v1.py
          python3 tools/ci/linux-runtime-gcc-shards-v1.py self-test
          python3 tools/ci/test_linux_runtime_kbuild_regeneration_guard_v1.py
          python3 tools/ci/test_linux_runtime_failed_tu_replay_v1.py
          bash -n tools/ci/linux-runtime-gcc-single-swap-v1.sh
          bash -n tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh
          python3 tools/ci/linux-runtime-minic-route-audit-v1.py --self-test
          python3 -m py_compile tools/ci/linux-runtime-gcc-full-c-objects-v1.py

      - name: Validate active Linux Kbuild wrapper contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tests/external/linux/stage2_kbuild_cc.sh
          bash -n tests/external/linux/stage2_kbuild_cc_test.sh
          bash tests/external/linux/stage2_kbuild_cc_test.sh

      - name: Validate BusyBox Kbuild ownership routing contract
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/build/m0-busybox-kbuild-routing-v0" bash tests/driver/run-busybox-kbuild-routing-v0.sh

      - name: Validate current distributed Image helpers
        run: |
          bash -n tools/ci/linux-distributed-full-image-v1.sh
          python3 -m py_compile tools/ci/linux-distributed-canonical-delay-v1.py tools/ci/linux-distributed-provenance-audit-v2.py tools/ci/linux-distributed-image-plan-v1.py

      - name: Build current toolchain
        run: make -j2

      - name: Verify minic-cc and independent driver entrypoint
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x build/debug/bin/minic-cc
          test -x build/debug/bin/minic
          if cmp -s build/debug/bin/minic-cc build/debug/bin/minic; then
            echo "minic driver unexpectedly aliases minic-cc" >&2
            exit 1
          fi

      - name: Run focused ownership gates
        run: |
          make check-token-model check-lexer check-type check-record check-type-alias
          make check-ast-contract check-layout check-rv64-abi check-backend-source-registration
          make check-static-functions check-cast-expressions check-pointer-members

      - name: Verify compiler CLI output identity
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/m0-cli-identity
          mkdir -p "$work"
          cc -E -P -x c tests/compiler/c0/empty_main.c -o "$work/input.i"
          build/debug/bin/minic-cc -S "$work/input.i" -o "$work/minic-cc.s"
          build/debug/bin/minic -S "$work/input.i" -o "$work/minic-compat.s"
          cmp "$work/minic-cc.s" "$work/minic-compat.s"
