name: Toolchain M0 Structure Gate
# Runtime push: always test isolation / Kbuild wrapper routing; preserve
# historical frozen compiler boundary only for manual non-runtime dispatch.

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
    paths:
      - 'tools/ci/test_linux_runtime_object_set_v1.py'
      - 'tools/ci/test_linux_runtime_prefix_bisect_v1.py'
      - 'tests/external/linux/stage2_kbuild_cc*.sh'
      - 'tests/driver/run-busybox-kbuild-routing-v0.sh'
      - '.github/workflows/toolchain-m0-structure.yml'
      - '.github/workflows/linux-distributed-full-image-signedness-v2.yml'
      - 'tools/ci/linux-distributed-full-image-v1.sh'
      - 'tools/ci/linux-distributed-canonical-delay-v1.py'
      - 'tools/ci/linux-distributed-provenance-audit-v2.py'
      - 'tools/ci/linux-distributed-image-plan-v1.py'
  workflow_dispatch:

jobs:
  compiler-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run Linux runtime isolation selftests
        run: |
          python3 tools/ci/test_linux_runtime_object_set_v1.py
          python3 tools/ci/test_linux_runtime_prefix_bisect_v1.py

      - name: Validate active Linux Kbuild wrapper contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tests/external/linux/stage2_kbuild_cc.sh
          bash -n tests/external/linux/stage2_kbuild_cc_test.sh
          bash tests/external/linux/stage2_kbuild_cc_test.sh
          echo "M0_KBUILD_WRAPPER_CONTRACT=PASS"

      - name: Validate BusyBox Kbuild ownership routing contract
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/build/m0-busybox-kbuild-routing-v0" \
            bash tests/driver/run-busybox-kbuild-routing-v0.sh
          echo "M0_BUSYBOX_KBUILD_ROUTING=PASS"

      - name: Validate distributed Image canonical CI contracts (no Linux build)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/ci/linux-distributed-full-image-v1.sh
          python3 -m py_compile \
            tools/ci/linux-distributed-canonical-delay-v1.py \
            tools/ci/linux-distributed-provenance-audit-v2.py \
            tools/ci/linux-distributed-image-plan-v1.py
          python3 - <<'PY_CI'
          from pathlib import Path
          yaml = Path('.github/workflows/linux-distributed-full-image-signedness-v2.yml').read_text()
          expected = (
              'MINIC_DISTRIBUTED_STRICT_REPLAY:',
              'MINIC_DISTRIBUTED_CANONICALIZE_DELAY_CMD:',
              'needs: shards',
              'bash tools/ci/linux-distributed-full-image-v1.sh image',
              'bash tools/ci/linux-distributed-full-image-v1.sh qemu',
              'reuse-final-check.txt',
          )
          missing = [x for x in expected if x not in yaml]
          assert not missing, 'Missing distributed Image contract: ' + ', '.join(missing)
          assert 'run-id:' not in yaml, 'Canonical Image workflow must create its own shards'
          import hashlib
          retirements = {
              'linux-distributed-kbuild-objects120-v1.yml': '9185bee34ba0f4391561f6a22e294e1a32675efd',
              'linux-distributed-image-receiver-reuse-v1.yml': 'fcff21d5ee82841c4c94c72a16009e8d5b2165aa',
              'linux-distributed-image-receiver-signedness-v2.yml': '7de981f45db79ef58e8e45caf65b3fa4f015f0ef',
              'linux-distributed-full-image-v1.yml': '3a91435760197edacddc277395332c9023b808da',
          }
          for fname, original_sha in retirements.items():
              active = Path('.github/workflows') / fname
              archived = Path('.github/workflows-disabled') / fname
              assert not active.exists(), f'Historical workflow reactivated: {active}'
              data = archived.read_bytes()
              git_blob = b'blob ' + str(len(data)).encode() + bytes([0]) + data
              actual = hashlib.sha1(git_blob).hexdigest()
              assert actual == original_sha, f'Altered archived workflow {fname}: {actual}'
          print('M0_DISTRIBUTED_RETIREMENT=PASS archived=4 identical_git_blobs=4')
          print('M0_DISTRIBUTED_IMAGE_CONTRACT=PASS self_contained=1 strict_replay=1')
          PY_CI

      - name: Build frozen compiler boundary
        if: github.ref != 'refs/heads/agent/linux-expanded-kbuild-v0'
        run: make clean && make -j2

      - name: Verify minic-cc and independent driver entrypoint
        if: github.ref != 'refs/heads/agent/linux-expanded-kbuild-v0'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x build/debug/bin/minic-cc
          test -x build/debug/bin/minic
          if cmp -s build/debug/bin/minic-cc build/debug/bin/minic; then
            echo "minic driver unexpectedly aliases minic-cc" >&2
            exit 1
          fi
          echo "M0_BINARY_BOUNDARY=PASS compiler=minic-cc driver=minic"

      - name: Run focused ownership gates
        if: github.ref != 'refs/heads/agent/linux-expanded-kbuild-v0'
        run: |
          make check-token-model check-lexer check-type check-record check-type-alias
          make check-ast-contract check-layout check-rv64-abi
          make check-static-functions check-cast-expressions check-pointer-members

      - name: Verify compiler CLI output identity
        if: github.ref != 'refs/heads/agent/linux-expanded-kbuild-v0'
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/m0-cli-identity
          mkdir -p "$work"
          cc -E -P -x c tests/compiler/c0/empty_main.c -o "$work/input.i"
          build/debug/bin/minic-cc -S "$work/input.i" -o "$work/minic-cc.s"
          build/debug/bin/minic -S "$work/input.i" -o "$work/minic-compat.s"
          cmp "$work/minic-cc.s" "$work/minic-compat.s"
          echo "M0_COMPILER_CLI_IDENTITY=PASS boundary=.i-to-.s driver_compat=PASS"
