name: Toolchain M0 Structure Gate

on:
  push:
    branches:
      - "toolchain/**"
  workflow_dispatch:

jobs:
  compiler-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build frozen compiler
        run: make clean && make -j2
      - name: Run fast compiler gate
        run: make check-fast
