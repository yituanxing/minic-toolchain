name: Temporary P1 Extern Array Refactor

on:
  push:
    branches:
      - refactor/post-first500-foundation-v2
    paths:
      - '.github/workflows/refactor-apply-p1-extern-array.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/post-first500-foundation-v2

      - name: Apply exact extern ownership refactor
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/parser_global.c')
          text = path.read_text()

          merge_start = 'static bool merge_extern_object_declaration('
          merge_end = '\nbool minic_parser_declare_block_scope_extern_object('
          if text.count(merge_start) != 1:
              raise SystemExit('extern merge helper anchor is not unique')
          start = text.index(merge_start)
          end = text.index(merge_end, start)
          replacement = r'''static bool apply_extern_object_declaration_attributes(
              MinicParser *parser,
              MinicGlobalObjectId object_id,
              const char *section_name,
              size_t section_name_length,
              bool has_section,
              size_t explicit_alignment,
              MinicSymbolVisibility visibility,
              bool has_visibility) {
              if (parser == NULL || parser->program == NULL ||
                  object_id >= parser->program->global_object_count) {
                  return false;
              }
              if ((has_section && !minic_c0_global_object_set_section(
                                      parser->program, object_id, section_name, section_name_length)) ||
                  (explicit_alignment != 0U && !minic_c0_global_object_set_explicit_alignment(
                                                       parser->program,
                                                       object_id,
                                                       explicit_alignment)) ||
                  (has_visibility &&
                   !minic_c0_global_object_set_visibility(parser->program, object_id, visibility))) {
                  minic_parser_error(parser, "conflicting extern object redeclaration attributes");
                  return false;
              }
              return true;
          }

          static bool merge_extern_object_declaration(MinicParser *parser,
                                                      MinicGlobalObjectId object_id,
                                                      MinicType declared_type,
                                                      const char *section_name,
                                                      size_t section_name_length,
                                                      bool has_section,
                                                      size_t explicit_alignment,
                                                      MinicSymbolVisibility visibility,
                                                      bool has_visibility) {
              MinicGlobalObject *object;

              if (parser == NULL || parser->program == NULL ||
                  object_id >= parser->program->global_object_count) {
                  return false;
              }
              object = &parser->program->global_objects[object_id];
              if (!minic_parser_external_object_types_compatible(
                      parser->program, object->type, declared_type)) {
                  minic_parser_error(parser, "conflicting extern object redeclaration");
                  return false;
              }
              if (minic_type_is_array(object->type) &&
                  !minic_parser_merge_external_array_composite_type(
                      parser->program, object->type, declared_type)) {
                  minic_parser_error(parser, "conflicting extern object array redeclaration");
                  return false;
              }
              return apply_extern_object_declaration_attributes(parser,
                                                                object_id,
                                                                section_name,
                                                                section_name_length,
                                                                has_section,
                                                                explicit_alignment,
                                                                visibility,
                                                                has_visibility);
          }
          '''
          text = text[:start] + replacement + text[end:]

          extern_start = 'bool minic_parser_parse_extern_global_after_head('
          extern_end = '\nbool minic_parser_parse_extern_global(MinicParser *parser)'
          if text.count(extern_start) != 1:
              raise SystemExit('extern declaration parser anchor is not unique')
          start = text.index(extern_start)
          end = text.index(extern_end, start)
          replacement = r'''bool minic_parser_parse_extern_global_after_head(MinicParser *parser,
                                                           MinicType base_type,
                                                           MinicType first_object_type,
                                                           MinicSourceSpan first_name_span,
                                                           const char *section_name,
                                                           size_t section_name_length,
                                                           bool has_section,
                                                           size_t shared_explicit_alignment,
                                                           MinicSymbolVisibility visibility,
                                                           bool has_visibility) {
              bool first_declarator;

              if (parser == NULL) {
                  return false;
              }
              first_declarator = true;
              for (;;) {
                  MinicArrayDeclaratorSyntax array_declarator;
                  MinicGlobalObjectId object_id;
                  MinicSourceSpan name_span;
                  MinicType object_type;
                  char declarator_section_name[256];
                  size_t declarator_section_name_length;
                  size_t declarator_explicit_alignment;
                  bool declarator_has_section;
                  MinicSymbolVisibility declarator_visibility;
                  bool declarator_has_visibility;
                  bool declarator_is_weak;
                  bool has_array_declarator;
                  MinicType declarator_element_type;

                  declarator_section_name_length = section_name_length;
                  declarator_explicit_alignment = shared_explicit_alignment;
                  declarator_has_section = has_section;
                  declarator_visibility = visibility;
                  declarator_has_visibility = has_visibility;
                  declarator_is_weak = false;
                  (void)memset(&array_declarator, 0, sizeof(array_declarator));
                  (void)memset(declarator_section_name, 0, sizeof(declarator_section_name));
                  if (has_section) {
                      if (section_name == NULL ||
                          section_name_length + 1U > sizeof(declarator_section_name)) {
                          minic_parser_error(parser, "invalid shared GNU section attribute");
                          return false;
                      }
                      (void)memcpy(
                          declarator_section_name, section_name, section_name_length + 1U);
                  }

                  if (first_declarator) {
                      name_span = first_name_span;
                      object_type = first_object_type;
                      first_declarator = false;
                  } else if (!parse_extern_object_declarator(
                                 parser, base_type, &name_span, &object_type)) {
                      return false;
                  }
                  declarator_element_type = object_type;
                  if (!minic_parser_parse_gnu_object_attribute_lists_with_symbol_metadata(
                          parser,
                          declarator_section_name,
                          sizeof(declarator_section_name),
                          &declarator_section_name_length,
                          &declarator_has_section,
                          &declarator_explicit_alignment,
                          &declarator_visibility,
                          &declarator_has_visibility,
                          &declarator_is_weak)) {
                      return false;
                  }
                  if (minic_type_is_function(object_type)) {
                      minic_parser_error(parser, "unsupported extern object type");
                      return false;
                  }

                  has_array_declarator = parser->current.kind == MINIC_TOKEN_LBRACKET;
                  if ((has_array_declarator &&
                       !minic_parser_parse_array_declarator_syntax(
                           parser, true, &array_declarator)) ||
                      !minic_parser_parse_gnu_object_attribute_lists_with_symbol_metadata(
                          parser,
                          declarator_section_name,
                          sizeof(declarator_section_name),
                          &declarator_section_name_length,
                          &declarator_has_section,
                          &declarator_explicit_alignment,
                          &declarator_visibility,
                          &declarator_has_visibility,
                          &declarator_is_weak)) {
                      return false;
                  }

                  object_id = minic_parser_find_global_object_entity(parser, name_span);
                  if (object_id != MINIC_GLOBAL_OBJECT_INVALID) {
                      if (has_array_declarator) {
                          const MinicGlobalObject *object;

                          object = minic_c0_program_global_object(parser->program, object_id);
                          if (object == NULL ||
                              !minic_sema_merge_array_declarator_composite_type(parser->program,
                                                                                object->type,
                                                                                declarator_element_type,
                                                                                &array_declarator)) {
                              minic_parser_error(
                                  parser, "conflicting extern object array redeclaration");
                              return false;
                          }
                          if (!apply_extern_object_declaration_attributes(
                                  parser,
                                  object_id,
                                  declarator_section_name,
                                  declarator_section_name_length,
                                  declarator_has_section,
                                  declarator_explicit_alignment,
                                  declarator_visibility,
                                  declarator_has_visibility)) {
                              return false;
                          }
                      } else if (!merge_extern_object_declaration(parser,
                                                                 object_id,
                                                                 object_type,
                                                                 declarator_section_name,
                                                                 declarator_section_name_length,
                                                                 declarator_has_section,
                                                                 declarator_explicit_alignment,
                                                                 declarator_visibility,
                                                                 declarator_has_visibility)) {
                          return false;
                      }
                  } else {
                      if (has_array_declarator &&
                          !minic_sema_materialize_array_declarator(parser->program,
                                                                  declarator_element_type,
                                                                  &array_declarator,
                                                                  &object_type)) {
                          minic_parser_error(parser, "cannot build extern array object type");
                          return false;
                      }
                      if (!minic_c0_program_add_extern_global_object(
                              parser->program,
                              parser->source + name_span.begin.offset,
                              minic_parser_span_length(name_span),
                              object_type,
                              minic_type_is_const(declarator_element_type),
                              &object_id) ||
                          (declarator_has_section &&
                           !minic_c0_global_object_set_section(parser->program,
                                                               object_id,
                                                               declarator_section_name,
                                                               declarator_section_name_length)) ||
                          (declarator_explicit_alignment != 0U &&
                           !minic_c0_global_object_set_explicit_alignment(
                               parser->program, object_id, declarator_explicit_alignment)) ||
                          (declarator_has_visibility &&
                           !minic_c0_global_object_set_visibility(
                               parser->program, object_id, declarator_visibility))) {
                          if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\0') {
                              minic_parser_error(parser, "cannot declare extern object");
                          }
                          return false;
                      }
                  }
                  parser->program->global_objects[object_id].is_block_scope_extern_only = false;
                  if (declarator_is_weak &&
                      !minic_c0_global_object_set_weak(parser->program, object_id, true)) {
                      minic_parser_error(parser, "GNU weak requires external object linkage");
                      return false;
                  }

                  if (parser->current.kind != MINIC_TOKEN_COMMA) {
                      break;
                  }
                  if (!minic_parser_advance(parser)) {
                      return false;
                  }
              }

              return minic_parser_expect(
                  parser, MINIC_TOKEN_SEMICOLON, "expected ';' after extern object declaration");
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Format and validate production slice
        shell: bash
        run: |
          set -Eeuo pipefail
          clang-format-18 -i src/frontend/parser_global.c
          git diff --check -- src/frontend/parser_global.c
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/frontend/parser_global.c').read_text()
          start = text.index('bool minic_parser_parse_extern_global_after_head(')
          end = text.index('\nbool minic_parser_parse_extern_global(MinicParser *parser)', start)
          region = text[start:end]
          for stale in ('array_type_begin', 'array_type_count ='):
              if stale in region:
                  raise SystemExit(f'stale extern rollback remains: {stale}')
          if 'minic_parser_parse_array_declarator_syntax' not in region:
              raise SystemExit('transient declarator parser is not used by extern path')
          if 'minic_sema_merge_array_declarator_composite_type' not in region:
              raise SystemExit('Sema composite merge is not used by extern path')
          PY
          make MODE=release CFLAGS=-Werror

      - name: Commit production slice
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- src/frontend/parser_global.c; then
            echo "no production change to commit" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/frontend/parser_global.c
          git commit -m "frontend: stop materializing extern array redeclaration probes"
          git push origin HEAD:refactor/post-first500-foundation-v2
