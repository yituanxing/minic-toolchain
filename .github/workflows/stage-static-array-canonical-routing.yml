name: Stage static array canonical routing

on:
  push:
    branches:
      - staging/static-array-canonical-routing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/static-array-canonical-routing
          fetch-depth: 0

      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/stage_static_array_canonical_routing.py
          chmod +x tests/compiler/c0/run-static-mutable-arrays.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Validate focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/static-array-stage
          MINIC="$PWD/build/static-array-stage/bin/minic" BUILD_DIR="$PWD/build/static-array-stage" sh tests/compiler/c0/run-static-mutable-arrays.sh
          make -j4 MODE=release BUILD_DIR=build/static-array-stage check-fast
          MINIC="$PWD/build/static-array-stage/bin/minic" BUILD_DIR="$PWD/build/static-array-stage" sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish product-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/stage-static-array-canonical-routing.yml
          rm tools/dev/stage_static_array_canonical_routing.py
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: route fixed static arrays through shared initialization' \
            -m 'Route fixed integer static arrays through the canonical array declarator and shared static-storage initializer owners instead of the legacy const-only integer mini-parser. Zero-initialized mutable fixed arrays now use ordinary global-object storage semantics. Relax inferred integer arrays so const controls read-only placement rather than legality.' \
            -m '中文说明：固定整数 static array 改走 canonical array declarator 与共享 static-storage initializer owner，删除旧 const-only integer mini-parser 的固定数组路径；mutable fixed array 的零初始化使用普通 global-object storage 语义。inferred integer array 也不再把 const 当作合法性条件，而只决定只读属性。'
          git push origin HEAD:staging/static-array-canonical-routing
