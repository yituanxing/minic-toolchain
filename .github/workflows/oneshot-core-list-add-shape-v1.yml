name: One-shot Core List Add Shape Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Build exact compiler
        shell: bash
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-list-add-probe-compiler

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Show exact frozen list-add shape
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.linux-corpus-cache.outputs.cache-hit }}" != true ]; then
            echo 'CORE_LIST_ADD_SOURCE corpus-cache-miss'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          roots = list(Path('build/linux-focus-corpus').rglob('*.i'))
          for path in roots:
              try:
                  text = path.read_text(errors='replace')
              except OSError:
                  continue
              needle = '__list_add_valid('
              pos = text.find(needle)
              if pos < 0:
                  continue
              begin = max(0, text.rfind('\n', 0, max(0, pos - 2500)))
              end = text.find('\n}', pos)
              if end < 0:
                  end = min(len(text), pos + 5000)
              else:
                  end = min(len(text), end + 3)
              print(f'CORE_LIST_ADD_SOURCE path={path}')
              print('CORE_LIST_ADD_SOURCE_BEGIN')
              print(text[begin:end])
              print('CORE_LIST_ADD_SOURCE_END')
              break
          else:
              print('CORE_LIST_ADD_SOURCE not-found')
          PY

      - name: Generate atomic list-add shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/core-list-add-shapes
          mkdir -p "$work"

          cat >"$work/a-pointer-equal.i" <<'EOF'
          int probe_pointer_equal(int *left, int *right) {
              return left == right;
          }
          EOF

          cat >"$work/b-member-pointer-equal.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          int probe_member_pointer_equal(struct list_head *next, struct list_head *prev) {
              return next->prev == prev;
          }
          EOF

          cat >"$work/c-pointer-not-equal.i" <<'EOF'
          int probe_pointer_not_equal(int *left, int *right) {
              return left != right;
          }
          EOF

          cat >"$work/d-logical-and.i" <<'EOF'
          int probe_logical_and(int *a, int *b, int *c) {
              return a == b && b == c;
          }
          EOF

          cat >"$work/e-list-condition.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          int probe_list_condition(struct list_head *new_node,
                                   struct list_head *prev,
                                   struct list_head *next) {
              return next->prev == prev && prev->next == next &&
                     new_node != prev && new_node != next;
          }
          EOF

          cat >"$work/f-builtin-expect.i" <<'EOF'
          int probe_builtin_expect(int *left, int *right) {
              return __builtin_expect(!!(left == right), 1);
          }
          EOF

          cat >"$work/g-compound-and-call.i" <<'EOF'
          int report_link(int *a, int *b, int *c);
          int probe_compound_and_call(int *a, int *b, int *c) {
              int ret = 1;
              ret &= report_link(a, b, c);
              return ret;
          }
          EOF

          cat >"$work/h-list-like.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          int report_list(struct list_head *new_node,
                          struct list_head *prev,
                          struct list_head *next);
          int probe_list_like(struct list_head *new_node,
                              struct list_head *prev,
                              struct list_head *next) {
              int ret = 1;
              if (__builtin_expect(!!(next->prev == prev && prev->next == next &&
                                      new_node != prev && new_node != next), 1))
                  return 1;
              ret = 0;
              ret &= report_list(new_node, prev, next);
              return ret;
          }
          EOF

      - name: Run atomic strict probes
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-list-add-probe-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-list-add-shapes"
          normal_pass=0
          strict_pass=0
          total=0
          for input in "$work"/*.i; do
            total=$((total + 1))
            name=$(basename "$input" .i)
            set +e
            "$compiler" -S "$input" -o "$work/$name-normal.s" >"$work/$name-normal.out" 2>"$work/$name-normal.err"
            normal_rc=$?
            set -e
            if [ "$normal_rc" -eq 0 ]; then
              normal_pass=$((normal_pass + 1))
            fi
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name-strict.s" >"$work/$name-strict.out" 2>"$work/$name-strict.err"
            strict_rc=$?
            set -e
            if [ "$strict_rc" -eq 0 ]; then
              strict_pass=$((strict_pass + 1))
              printf 'CORE_LIST_ADD_SHAPE name=%s normal=%d strict=PASS\n' "$name" "$normal_rc"
            else
              printf 'CORE_LIST_ADD_SHAPE name=%s normal=%d strict=FAIL rc=%d\n' "$name" "$normal_rc" "$strict_rc"
              sed 's/^/CORE_LIST_ADD_DIAG /' "$work/$name-strict.err"
            fi
          done
          printf 'CORE_LIST_ADD_SHAPE_SUMMARY total=%d normal_pass=%d strict_pass=%d\n' "$total" "$normal_pass" "$strict_pass"
