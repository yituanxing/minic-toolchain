name: Diagnose Canonical Array Redeclaration Owner V2
on:
  push:
    branches: [product/canonical-array-redeclaration-owner-v2]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/canonical-array-redeclaration-owner-v2
          fetch-depth: 0
      - name: Apply, validate, and persist result
        shell: bash
        run: |
          set -u
          out=diagnostics/canonical-array-redeclaration-owner-v2
          mkdir -p "$out"
          stage=materialize
          status=0

          git show origin/staging/string-octal-v1:tools/dev/materialize-canonical-array-redeclaration-owner-v1.py > /tmp/materialize.py 2>"$out/git-show.err" || status=$?
          if [ "$status" -eq 0 ]; then
            python3 /tmp/materialize.py >"$out/materialize.log" 2>&1 || status=$?
          fi
          printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"

          if [ "$status" -eq 0 ]; then
            stage=format
            clang-format-18 -i src/frontend/parser_function.c >"$out/format.log" 2>&1 || status=$?
            printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"
          fi
          if [ "$status" -eq 0 ]; then
            stage=build
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/array-owner-v2 >"$out/build.log" 2>&1 || status=$?
            printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"
          fi
          if [ "$status" -eq 0 ]; then
            stage=check-fast
            make -j4 check-fast MODE=release BUILD_DIR=build/array-owner-v2-fast >"$out/check-fast.log" 2>&1 || status=$?
            printf 'stage=%s\nstatus=%s\n' "$stage" "$status" > "$out/status.txt"
          fi

          git diff -- src/frontend/parser_function.c > "$out/product.patch" || true
          printf '\nfinal_stage=%s\nfinal_status=%s\n' "$stage" "$status" >> "$out/status.txt"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out"
          git commit -m 'diagnostic: record array owner v2 productization result' || true
          git push origin HEAD:product/canonical-array-redeclaration-owner-v2
          exit 0
