name: One-shot Core Logical And Value M19

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Prove M19 logical-and value gap
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m19-before-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m19-before-compiler/bin/minic"
          cat > build/core-m19-before.i <<'EOF'
          int core_m19_before(int left, int right) {
              return left && right;
          }
          EOF
          if MINIC_CORE_IR=strict "$compiler" -S build/core-m19-before.i \
              -o build/core-m19-before.s 2>build/core-m19-before.err; then
            echo 'M19 logical-and value gap unexpectedly absent before patch' >&2
            exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'core_m19_before'" \
            build/core-m19-before.err >/dev/null
          cat > build/core-m19-if.i <<'EOF'
          int core_m19_if(int left, int right) {
              if (!left)
                  return 0;
              return !!right;
          }
          EOF
          MINIC_CORE_IR=strict "$compiler" -S build/core-m19-if.i -o build/core-m19-if.s
          printf '%s\n' 'PROVED core/m19 logical-and-value=unsupported equivalent-if=pass'

      - name: Apply M19
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-logical-and-value-m19.py
          python3 tools/dev/patch-core-logical-and-value-m19.py
          clang-format-18 -i \
            src/core/core_lower.c \
            tests/compiler/c0/core_logical_and_value.c \
            tests/compiler/c0/core_logical_and_value_runtime.c
          sh -n tests/compiler/c0/run-core-logical-and-value.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check
          grep -F 'operator_kind == MINIC_BINARY_LOGICAL_AND' src/core/core_lower.c >/dev/null
          grep -F 'lower_condition_branch(' src/core/core_lower.c >/dev/null
          grep -F 'minic_core_function_add_object(' src/core/core_lower.c >/dev/null
          if grep -R -F 'MINIC_CORE_INSTRUCTION_LOGICAL_AND' src/core >/dev/null; then
            echo 'M19 must model C short-circuit AND with CFG, not a plain value opcode' >&2
            exit 1
          fi

      - name: Build and validate M19
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m19-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m19-compiler/bin/minic"
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19-focused" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-logical-and-value.sh
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19-condition-and-regression" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-condition-and.sh
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19-inline-asm-regression" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-opaque-inline-asm.sh
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m19-statement-expression-regression" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-statement-expression.sh
          MINIC="$compiler" bash tests/core/run-core-ir-shadow.sh

      - name: Diagnose M19 call-left and verifier boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/compiler/compiler.c')
          text = path.read_text()
          old = '''        status = candidates->statuses[function_index];
        if (status == MINIC_CORE_LOWER_OK &&
            !minic_core_function_verify(&candidates->functions[function_index])) {
            status = MINIC_CORE_LOWER_ERROR;
        }
'''
          new = '''        status = candidates->statuses[function_index];
        if (status == MINIC_CORE_LOWER_OK) {
            bool verified = minic_core_function_verify(&candidates->functions[function_index]);
            (void)fprintf(stderr,
                          "CORE_M19_DIAG function=%s lower_status=%d verify=%d\\n",
                          function->name,
                          (int)status,
                          verified ? 1 : 0);
            if (!verified) {
                status = MINIC_CORE_LOWER_ERROR;
            }
        } else {
            (void)fprintf(stderr,
                          "CORE_M19_DIAG function=%s lower_status=%d verify=na\\n",
                          function->name,
                          (int)status);
        }
'''
          if text.count(old) != 1:
              raise SystemExit('Core validation diagnostic anchor changed')
          path.write_text(text.replace(old, new, 1))
          PY
          clang-format-18 -i src/compiler/compiler.c
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m19-diag-compiler
          compiler="$GITHUB_WORKSPACE/build/core-m19-diag-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-m19-call-left-diag"
          mkdir -p "$work"

          cat >"$work/a-call.i" <<'EOF'
          int helper(int left, int right) { return left == right; }
          int probe_call(int left, int right) { return helper(left, right); }
          EOF
          cat >"$work/b-call-left-and.i" <<'EOF'
          int helper(int left, int right) { return left == right; }
          int probe_call_left_and(int left, int right, int third) {
              return helper(left, right) && (right == third);
          }
          EOF
          cat >"$work/c-call-left-volatile-rhs.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int helper(const struct node *list, const struct node *head) { return list == head; }
          int probe_call_left_volatile_rhs(const struct node *head) {
              struct node *next = head->next;
              return helper(next, head) &&
                     (next == ({ (*(struct node * const volatile *)&(head->prev)); }));
          }
          EOF
          cat >"$work/d-full-linux-like.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int helper(const struct node *list, const struct node *head) { return list == head; }
          int probe_full_linux_like(const struct node *head) {
              struct node *next = ({
                  struct node *value =
                      ({ (*(struct node * const volatile *)&(head->next)); });
                  __asm__ __volatile__("fence r,rw" : : : "memory");
                  value;
              });
              return helper(next, head) &&
                     (next == ({ (*(struct node * const volatile *)&(head->prev)); }));
          }
          EOF
          for input in "$work"/*.i; do
            name=$(basename "$input" .i)
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name.s" \
              >"$work/$name.out" 2>"$work/$name.err"
            rc=$?
            set -e
            printf 'CORE_M19_CALL_LEFT name=%s rc=%d\n' "$name" "$rc"
            grep -E 'CORE_M19_DIAG|Core IR shadow' "$work/$name.err" || true
          done

      - name: Replay frozen strict frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m19-compiler/bin/minic"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$GITHUB_WORKSPACE/build/core-m19-strict" \
            --jobs 4 --offset 0 --limit 500 --sample-count 64 --indices ''
          replay_status=$?
          set -e
          printf 'CORE_M19_REPLAY_STATUS=%d\n' "$replay_status"
          python3 - <<'PY'
          from collections import Counter
          import json, re
          from pathlib import Path
          rows = json.loads(Path('build/core-m19-strict/batch-results.json').read_text())
          unsupported_re = re.compile(r"^Core IR shadow does not yet support function '([^']+)'$")
          unsupported = Counter()
          errors = []
          passes = 0
          for row in rows:
              if row['status'] == 'PASS':
                  passes += 1
                  continue
              message = str(row['message'])
              match = unsupported_re.match(message)
              if match:
                  unsupported[match.group(1)] += 1
              else:
                  errors.append((row['index'], message))
          print(f'CORE_M19_FRONTIER selected={len(rows)} pass={passes} unsupported={sum(unsupported.values())} error={len(errors)}')
          for function, count in unsupported.most_common():
              print(f'CORE_M19_BLOCKER count={count} function={function}')
          for index, message in errors:
              print(f'CORE_M19_ERROR index={index} message={message}')
          if errors:
              raise SystemExit('M19 introduced non-UNSUPPORTED strict failures')
          if unsupported.get('list_empty_careful', 0) != 0:
              raise SystemExit('M19 did not pierce the proven list_empty_careful logical-AND blocker')
          PY

      - name: Publish M19 product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-logical-and-value-m19.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_lower.c \
            tests/compiler/c0/core_logical_and_value.c \
            tests/compiler/c0/core_logical_and_value_runtime.c \
            tests/compiler/c0/run-core-logical-and-value.sh \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-logical-and-value-m19.py
          git diff --cached --check
          git commit -m 'core: lower short-circuit logical and values'
          git push origin HEAD:refactor/declaration-sema-v1