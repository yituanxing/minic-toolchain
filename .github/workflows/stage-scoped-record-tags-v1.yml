name: Stage scoped record tags v1

on:
  push:
    branches:
      - staging/scoped-record-tags-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'materialize scoped record tags v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize narrow product delta
        run: |
          python3 tools/dev/stage-scoped-record-tags-v1.py
          chmod +x tests/compiler/c0/run-block-scope-record-tags.sh
      - name: Format and inspect product delta
        run: |
          clang-format-18 -i \
            src/frontend/parser_internal.h \
            src/frontend/parser_core.c \
            src/frontend/parser_record.c \
            src/frontend/parser_type.c \
            src/frontend/parser_statement.c \
            tests/compiler/c0/block_scope_record_tags.c
          git diff --check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff -- \
            src/frontend/parser_internal.h \
            src/frontend/parser_core.c \
            src/frontend/parser_record.c \
            src/frontend/parser_type.c \
            src/frontend/parser_statement.c \
            tests/compiler/c0/block_scope_record_tags.c \
            tests/compiler/c0/run-block-scope-record-tags.sh \
            tests/compiler/c0/run-foundation-focused.sh
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/scoped-record-tags-stage
      - name: Run focused record-tag regressions
        run: |
          export MINIC="$GITHUB_WORKSPACE/build/scoped-record-tags-stage/bin/minic"
          export BUILD_DIR="$GITHUB_WORKSPACE/build/scoped-record-tags-stage"
          export HOST_CC=cc
          sh tests/compiler/c0/run-block-scope-record-tags.sh
          sh tests/compiler/c0/run-record-forward-declarations.sh
          sh tests/compiler/c0/run-record-multi-declarators.sh
          sh tests/compiler/c0/run-anonymous-record-members.sh
      - name: Run fast compiler checks
        run: make -j4 MODE=release BUILD_DIR=build/scoped-record-tags-stage check-fast
      - name: Commit staged product delta
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/frontend/parser_internal.h \
            src/frontend/parser_core.c \
            src/frontend/parser_record.c \
            src/frontend/parser_type.c \
            src/frontend/parser_statement.c \
            tests/compiler/c0/block_scope_record_tags.c \
            tests/compiler/c0/run-block-scope-record-tags.sh \
            tests/compiler/c0/run-foundation-focused.sh
          git commit -m 'materialize scoped record tags v1'
          git push origin HEAD:staging/scoped-record-tags-v1
