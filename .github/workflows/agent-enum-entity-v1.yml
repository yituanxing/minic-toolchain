name: Agent Enum Entity V1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-enum-entity-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Foundation head
        uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0

      - name: Generate EnumEntity v1 source
        run: |
          python3 tools/dev/agent_enum_entity_v1_patch.py
          python3 tools/dev/agent_enum_entity_v1_fix.py
          python3 tools/dev/agent_enum_entity_v1_diag.py
          python3 tools/dev/agent_enum_entity_v1_docs.py

      - name: Format generated source
        run: |
          chmod +x tests/compiler/c0/run-gnu-enum-entity.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-enum-entity

      - name: Run EnumEntity focused contract
        env:
          MINIC: ${{ github.workspace }}/build/agent-enum-entity/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/agent-enum-entity-focused
          HOST_CC: cc
        run: sh tests/compiler/c0/run-gnu-enum-entity.sh

      - name: Run Foundation focused contracts
        env:
          MINIC: ${{ github.workspace }}/build/agent-enum-entity/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/agent-enum-entity-focused-all
          HOST_CC: cc
        run: sh tools/dev/pr76-focused.sh

      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-enum-entity check-fast

      - name: Publish generated source to scratch branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs tests tools/dev/pr76-focused.sh
          git commit -m 'frontend: model enum entities and typed values'
          git push --force origin HEAD:agent/enum-entity-v1
