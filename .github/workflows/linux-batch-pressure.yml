name: Linux 6.6.143 Batch Pressure

on:
  push:
    branches:
      - tests/linux-batch-pressure-convergence-v1
  pull_request:
    paths:
      - 'Makefile'
      - 'include/**'
      - 'src/**'
      - 'tests/external/linux/batch_probe.sh'
      - '.github/workflows/linux-batch-pressure.yml'
  workflow_dispatch:
    inputs:
      offset:
        description: Configured TU window offset
        required: false
        default: '0'
      limit:
        description: Number of configured C TUs; 0 means all remaining
        required: false
        default: '100'
      minic_jobs:
        description: Concurrent MiniC processes
        required: false
        default: '4'

permissions:
  contents: read

concurrency:
  group: linux-batch-pressure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configured-tu-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Build exact MiniC candidate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-batch-compiler

      - name: Drive configured Linux TU batch
        env:
          BATCH_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.offset || '0' }}
          BATCH_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '100' }}
          BATCH_JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.minic_jobs || '4' }}
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/linux-batch-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-batch" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET="$BATCH_OFFSET" \
          LINUX_BATCH_LIMIT="$BATCH_LIMIT" \
          LINUX_BATCH_JOBS="$BATCH_JOBS" \
            sh tests/external/linux/batch_probe.sh

      - name: Show compact batch summary
        if: always()
        run: |
          if test -s build/linux-batch/batch-summary.txt; then
            cat build/linux-batch/batch-summary.txt
          else
            printf '%s\n' 'No batch summary was produced.'
            test -s build/linux-batch/kbuild-plan.stderr && tail -n 120 build/linux-batch/kbuild-plan.stderr || true
            test -s build/linux-batch/preprocess.log && tail -n 120 build/linux-batch/preprocess.log || true
          fi

      - name: Upload Linux batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-batch-${{ github.run_id }}
          path: |
            build/linux-batch/batch-summary.txt
            build/linux-batch/batch-results.tsv
            build/linux-batch/batch-results.json
            build/linux-batch/failure-contexts.txt
            build/linux-batch/tu-manifest.txt
            build/linux-batch/selected-tus.txt
            build/linux-batch/kbuild-plan.stderr
            build/linux-batch/preprocess.log
            build/linux-batch/minic-stderr/**/*.stderr
          if-no-files-found: ignore
          retention-days: 7

      - name: Save pinned Linux source archive
        if: always() && steps.linux-source-cache.outputs.cache-hit != 'true' && hashFiles('build/linux-cache/linux-6.6.143.tar.xz') != ''
        uses: actions/cache/save@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
