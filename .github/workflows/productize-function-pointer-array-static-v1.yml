name: Productize Function Pointer Array Static V1
on:
  push:
    branches: [product/function-pointer-array-static-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/function-pointer-array-static-v1
          fetch-depth: 0
      - name: Apply product slices
        run: |
          set -Eeuo pipefail
          git show origin/staging/string-octal-v1:tools/dev/materialize-function-pointer-array-declarator-v1.py > /tmp/fn-array.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-preformed-static-array-v1.py > /tmp/preformed-array.py
          python3 /tmp/fn-array.py
          python3 /tmp/preformed-array.py
          cat > tests/compiler/c0/function_pointer_array_static.c <<'EOF'
          static int inc(int value) { return value + 1; }
          static int dec(int value) { return value - 1; }
          static int (*handlers[2])(int value) = { inc, dec };
          int main(void) {
              return handlers[0](1) + handlers[1](2) - 3;
          }
          EOF
          cat > tests/compiler/c0/run-function-pointer-array-static.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/function-pointer-array-static
          mkdir -p "$work"
          "$minic" -S "$root/tests/compiler/c0/function_pointer_array_static.c" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-function-pointer-array-static.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-function-pointer-array-static.sh"
          EOF
          clang-format-18 -i src/frontend/parser_internal.h src/frontend/parser_declarator.c src/frontend/parser_global.c tests/compiler/c0/function_pointer_array_static.c
          git diff --check
      - name: Validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/fn-array-static-v1
          MINIC="$GITHUB_WORKSPACE/build/fn-array-static-v1/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/fn-array-static-v1-focused" sh tests/compiler/c0/run-function-pointer-array-static.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/fn-array-static-v1-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-function-pointer-array-static-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_internal.h src/frontend/parser_declarator.c src/frontend/parser_global.c tests/compiler/c0/function_pointer_array_static.c tests/compiler/c0/run-function-pointer-array-static.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: initialize static function pointer arrays'
          git push origin HEAD:product/function-pointer-array-static-v1
