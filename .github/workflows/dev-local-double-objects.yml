name: Dev local double object patch

on:
  push:
    branches:
      - riscv/local-double-objects

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: riscv/local-double-objects
          fetch-depth: 0
      - name: Apply exact compiler patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/frontend/parser_statement.c",
              '''    case MINIC_TOKEN_KW_CHAR:\n    case MINIC_TOKEN_KW_INT:\n    case MINIC_TOKEN_KW_LONG:''',
              '''    case MINIC_TOKEN_KW_CHAR:\n    case MINIC_TOKEN_KW_INT:\n    case MINIC_TOKEN_KW_LONG:\n    case MINIC_TOKEN_KW_DOUBLE:''')

          replace_once(
              "src/target/riscv64/codegen_support.c",
              '''    if (minic_type_is_pointer(type)) {\n        *width = 8U;\n        return true;\n    }\n    if (!minic_type_is_integer(type)) {''',
              '''    if (minic_type_is_pointer(type) || minic_type_is_double(type)) {\n        *width = 8U;\n        return true;\n    }\n    if (!minic_type_is_integer(type)) {''')

          replace_once(
              "src/target/riscv64/codegen_support.c",
              '''static const char *minic_riscv64_load_instruction(MinicType type) {\n    if (minic_type_is_pointer(type)) {\n        return "ld";\n    }\n    if (!minic_type_is_integer(type)) {''',
              '''static const char *minic_riscv64_load_instruction(MinicType type) {\n    if (minic_type_is_pointer(type) || minic_type_is_double(type)) {\n        return "ld";\n    }\n    if (!minic_type_is_integer(type)) {''')

          replace_once(
              "src/target/riscv64/codegen_support.c",
              '''static const char *minic_riscv64_store_instruction(MinicType type) {\n    if (minic_type_is_pointer(type)) {\n        return "sd";\n    }\n    if (!minic_type_is_integer(type)) {''',
              '''static const char *minic_riscv64_store_instruction(MinicType type) {\n    if (minic_type_is_pointer(type) || minic_type_is_double(type)) {\n        return "sd";\n    }\n    if (!minic_type_is_integer(type)) {''')

          test = Path("tests/programs/c0/local_double_objects.c")
          if test.exists():
              raise SystemExit(f"{test}: already exists")
          test.write_text('''static double literal_value(void)\n{\n    return 123.5;\n}\n\nstatic int matches_double_bytes(unsigned char *bytes, int byte5, int byte6, int byte7)\n{\n    if ((bytes[0] != 0) || (bytes[1] != 0) || (bytes[2] != 0) || (bytes[3] != 0) ||\n        (bytes[4] != 0))\n    {\n        return 0;\n    }\n    return (bytes[5] == byte5) && (bytes[6] == byte6) && (bytes[7] == byte7);\n}\n\nint main(void)\n{\n    double value = 1.5;\n    double copy = value;\n    double from_call = literal_value();\n    unsigned char *bytes = (unsigned char *)&copy;\n\n    if (!matches_double_bytes(bytes, 0, 248, 63))\n    {\n        return 1;\n    }\n\n    value = 1.5 + 2.25;\n    bytes = (unsigned char *)&value;\n    if (!matches_double_bytes(bytes, 0, 14, 64))\n    {\n        return 2;\n    }\n\n    bytes = (unsigned char *)&from_call;\n    if (!matches_double_bytes(bytes, 224, 94, 64))\n    {\n        return 3;\n    }\n    return 0;\n}\n''')

          manifest = Path("tests/programs/c0/manifest.txt")
          text = manifest.read_text()
          if "local_double_objects\n" in text:
              raise SystemExit("manifest already contains local_double_objects")
          if not text.endswith("\n"):
              raise SystemExit("manifest must end in newline")
          manifest.write_text(text + "local_double_objects\n")
          PY

          if ! command -v clang-format-18 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang-format-18
          fi
          clang-format-18 -i \
            src/frontend/parser_statement.c \
            src/target/riscv64/codegen_support.c \
            tests/programs/c0/local_double_objects.c

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-local-double-objects.yml
          git add \
            src/frontend/parser_statement.c \
            src/target/riscv64/codegen_support.c \
            tests/programs/c0/local_double_objects.c \
            tests/programs/c0/manifest.txt
          git diff --cached --check
          git commit -m "riscv: add local double objects"
          git push origin HEAD:riscv/local-double-objects
