name: Freeze cJSON Discovery

on:
  workflow_dispatch:
  push:
    branches: [frontend/additive-update-pointer-difference]
    paths:
      - '.github/workflows/pr71-freeze.yml'

permissions:
  contents: write

concurrency:
  group: pr71-freeze
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cJSON branch
        uses: actions/checkout@v4
        with:
          ref: frontend/additive-update-pointer-difference
          fetch-depth: 0

      - name: Materialize validated discovery semantics
        shell: bash
        run: |
          set -Eeuo pipefail

          for patch in \
            tools/dev/pr71-discovery.patch \
            tools/dev/pr71-record-copy.patch \
            tools/dev/pr71-local-array-identity.patch \
            tools/dev/pr71-do-while.patch \
            tools/dev/pr71-assignment-chain.patch \
            tools/dev/pr71-bitwise-platform.patch \
            tools/dev/pr71-float-conversion.patch \
            tools/dev/pr71-conditional-void.patch \
            tools/dev/pr71-fixed-double-abi.patch; do
            git apply --check --recount "$patch"
            git apply --recount "$patch"
          done

          python3 tools/dev/pr71-update-platform.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/compiler-c0-full-gate.sh')
          text = path.read_text()
          start = text.index('for discovery_patch in \\\n')
          end = text.index('log_dir=', start)
          path.write_text(text[:start] + text[end:])
          PY

          # Discovery files remain in history but are no longer part of the active compiler
          # baseline.  Remove them now so clean-head validation cannot accidentally depend on
          # applying the same semantic changes a second time.
          rm -f \
            tools/dev/pr71-discovery.patch \
            tools/dev/pr71-record-copy.patch \
            tools/dev/pr71-local-array-identity.patch \
            tools/dev/pr71-do-while.patch \
            tools/dev/pr71-assignment-chain.patch \
            tools/dev/pr71-bitwise-platform.patch \
            tools/dev/pr71-float-conversion.patch \
            tools/dev/pr71-conditional-void.patch \
            tools/dev/pr71-fixed-double-abi.patch \
            tools/dev/pr71-update-platform.py

          rm -f .github/workflows/pr71-freeze.yml

          git diff --check
          git status --short

      - name: Commit clean cJSON baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'compiler: freeze cJSON-driven semantics / 编译器：冻结 cJSON 驱动语义'
          git push origin HEAD:frontend/additive-update-pointer-difference
