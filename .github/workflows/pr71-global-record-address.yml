name: PR71 Global Record Address

on:
  push:
    branches:
      - frontend/additive-update-pointer-difference

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow address-of global record lvalues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/frontend/parser_expression.c')
          text = path.read_text()

          text, count = re.subn(
              r'(static bool parse_global_reference\(MinicParser \*parser,\n'
              r'\s+MinicSourceSpan name_span,\n'
              r'\s+MinicGlobalObjectId global_object_id,\n)'
              r'(\s+MinicExpressionId \*expression_id\) \{)',
              r'\1                                   bool allow_record_lvalue,\n\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('global reference signature site not found')

          old = 'if (parser->current.kind != MINIC_TOKEN_DOT) {'
          new = 'if (parser->current.kind != MINIC_TOKEN_DOT && !allow_record_lvalue) {'
          if text.count(old) != 1:
              raise SystemExit('global record guard site not unique')
          text = text.replace(old, new, 1)

          text, count = re.subn(
              r'parse_global_reference\(parser,\s*name_span,\s*global_object_id,\s*&primary_id\)',
              'parse_global_reference(\n                    parser, name_span, global_object_id, !decay_array, &primary_id)',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('global reference call site not found')

          path.write_text(text)
          PY
          clang-format-18 -i src/frontend/parser_expression.c

      - name: Host validation
        run: make -j2 BUILD_DIR=build/pr71-global-record-address check

      - name: Commit generated source
        env:
          BRANCH: frontend/additive-update-pointer-difference
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_expression.c
          git rm .github/workflows/pr71-global-record-address.yml
          git commit -m 'frontend: allow address-of global record objects'
          git push origin HEAD:"$BRANCH"
