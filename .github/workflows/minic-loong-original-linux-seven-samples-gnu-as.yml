name: MiniC original Linux LoongArch64 seven-shard GNU AS samples

# Independent bounded original-GNU C-owner evidence: first eight historical
# failures from each of seven authentic Linux 6.6.143 input shards, NOT 3x7
# full C-owner workers, GNU LD or a boot/runtime certificate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/minic-loong-original-linux-seven-samples-gnu-as.yml'
permissions:
  contents: read
  actions: read

jobs:
  original-loongarch64-seven-shard-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install one genuine LoongArch64 cross GNU assembler
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]] && grep -q 'azure.archive.ubuntu.com' "$sources"; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$sources"
            fi
          done
          timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends \
            gcc-13-loongarch64-linux-gnu binutils-loongarch64-linux-gnu
          command -v loongarch64-linux-gnu-gcc-13
          command -v loongarch64-linux-gnu-as
      - name: Fetch all seven authenticated first-failure GNU source shards
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: '42345808682'
          pattern: minic-linux-seven-failure-loongarch64-*
          merge-multiple: false
          path: build/loongarch64-seven-original-inputs
          github-token: ${{ github.token }}
      - name: Check exact seven source shard artifacts are present
        shell: bash
        run: |
          set -Eeuo pipefail
          for shard in {0..6}; do
            source="build/loongarch64-seven-original-inputs/minic-linux-seven-failure-loongarch64-$shard/failed-owner-diagnostics/index.json"
            test -s "$source" || { echo "MISSING_ORIGINAL_LOONG_SHARD=$shard"; exit 1; }
          done
      - name: Build one exact current MiniC, not seven independent compilers
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror \
            build/release/bin/minic-cc build/release/bin/minic
          bash tests/compiler/c0/probe-loongarch64-packed-asm-output.sh \
            build/release/bin/minic-cc
          MINIC=build/release/bin/minic \
            MINIC_CC=build/release/bin/minic-cc \
            bash tests/compiler/c0/probe-target-language-abi-options.sh
      - name: Replay 56 original C owners with exact GNU .cmd LP64S flags
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/loongarch64-seven-original-replay
          failed=0
          for shard in {0..6}; do
            source="build/loongarch64-seven-original-inputs/minic-linux-seven-failure-loongarch64-$shard"
            output="build/loongarch64-seven-original-replay/$shard"
            receipt="build/loongarch64-seven-original-replay/receipt-$shard.txt"
            if python3 tools/ci/minic-loong-original-shard2-gnu-as.py \
                 --artifact "$source" --shard "$shard" \
                 --minic build/release/bin/minic-cc --output "$output" \
                 | tee "$receipt"; then
              grep -Fxq "MINIC_LINUX_ORIGINAL_LOONG_SHARD${shard}_GNU_AS=PASS owners=8/8 original_GNU_i_cmd_SHA=16/16 MiniC_S=8/8 GNU_AS_ELF64_LP64S=8/8 GNU_LD_QEMU=NOT_RUN Linux_P1=NOT_CLAIMED" \
                "$receipt" || failed=$((failed+1))
            else
              failed=$((failed+1))
            fi
          done
          if test "$failed" -ne 0; then
            echo "LOONGARCH64_ORIGINAL_SEVEN_SAMPLES_GNU_AS=FAIL failed_shards=$failed/7"
            exit 1
          fi
          printf 'LOONGARCH64_ORIGINAL_SEVEN_SAMPLES_GNU_AS=PASS owners=56/56 source_and_cmd_sha=112/112 original_run=42345808682 GNU_LD_QEMU=NOT_RUN head=%s\n' \
            "$(git rev-parse HEAD)"
      - name: Preserve every shard result and bounded failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-loongarch64-original-seven-samples-gnu-as
          path: |
            build/loongarch64-seven-original-replay/*/results.json
            build/loongarch64-seven-original-replay/receipt-*.txt
            build/loongarch64-seven-original-replay/*/candidate/staged/**/*.tool-stderr.txt
          if-no-files-found: ignore
          retention-days: 30
