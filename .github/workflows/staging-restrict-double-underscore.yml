name: Staging Restrict Double Underscore

on:
  push:
    branches:
      - staging/restrict-double-underscore-v1

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Apply __restrict__ alias support
        run: python3 tools/dev/stage-restrict-double-underscore.py

      - name: Canonical formatting
        run: |
          clang-format-18 -i \
            src/frontend/parser_declarator.c \
            tests/compiler/c0/restrict_qualifiers.c

      - name: Release Werror build
        run: make -j4 MODE=release BUILD_DIR=build/staging-restrict-double EXTRA_CFLAGS=-Werror

      - name: Focused restrict regression
        env:
          MINIC: ${{ github.workspace }}/build/staging-restrict-double/bin/minic
          HOST_CC: cc
          BUILD_DIR: ${{ github.workspace }}/build/staging-restrict-double
        run: sh tests/compiler/c0/run-restrict-qualifiers.sh

      - name: Broad C0 suite
        env:
          MINIC: ${{ github.workspace }}/build/staging-restrict-double/bin/minic
          HOST_CC: cc
          BUILD_DIR: ${{ github.workspace }}/build/staging-restrict-double
        run: sh tests/compiler/c0/run.sh

      - name: Foundation focused suite
        env:
          MINIC: ${{ github.workspace }}/build/staging-restrict-double/bin/minic
          HOST_CC: cc
          BUILD_DIR: ${{ github.workspace }}/build/staging-restrict-double
        run: sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish validated product diff
        run: |
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add \
            src/frontend/parser_declarator.c \
            tests/compiler/c0/restrict_qualifiers.c \
            tests/compiler/c0/run-restrict-qualifiers.sh
          git diff --cached --check
          git commit -m 'frontend: accept GNU __restrict__ alias [publish]'
          git push origin HEAD:staging/restrict-double-underscore-v1
