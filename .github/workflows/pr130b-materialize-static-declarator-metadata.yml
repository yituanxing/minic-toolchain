name: PR130B Complete Static Declarator Metadata
on:
  push:
    branches: [agent/static-array-declarator-metadata-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize post-name static object attributes
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr130b-materialize.py
          clang-format-18 -i \
            src/frontend/parser_global.c \
            tests/compiler/c0/static_global_object_section.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr130b-focused" \
            sh tests/compiler/c0/run-static-global-object-section.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr130b-materialize.py \
            .github/workflows/pr130b-materialize-static-declarator-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): complete static declarator metadata placement'
          git push origin HEAD:agent/static-array-declarator-metadata-v0
