name: Productize Function Pointer Array Declarator V3
on:
  push:
    branches: [product/function-pointer-array-declarator-v3]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/function-pointer-array-declarator-v3
          fetch-depth: 0
      - name: Apply validated declarator support
        run: |
          set -Eeuo pipefail
          mat=tools/dev/.productize-function-pointer-array-v3.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-function-pointer-array-declarator-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat > tests/compiler/c0/function_pointer_array_declarator_v3.c <<'EOF'
          extern int (*handlers[])(int);
          int (*fixed_handlers[1])(int);
          int main(void) { return 0; }
          EOF
          cat > tests/compiler/c0/run-function-pointer-array-declarator-v3.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/function-pointer-array-declarator-v3
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/function_pointer_array_declarator_v3.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-function-pointer-array-declarator-v3.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-function-pointer-array-declarator-v3.sh"
          EOF
          clang-format-18 -i src/frontend/parser_internal.h src/frontend/parser_declarator.c tests/compiler/c0/function_pointer_array_declarator_v3.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/function-pointer-array-v3
          MINIC="$GITHUB_WORKSPACE/build/function-pointer-array-v3/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/function-pointer-array-v3" \
            sh tests/compiler/c0/run-function-pointer-array-declarator-v3.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/function-pointer-array-v3-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-function-pointer-array-declarator-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_internal.h src/frontend/parser_declarator.c tests/compiler/c0/function_pointer_array_declarator_v3.c tests/compiler/c0/run-function-pointer-array-declarator-v3.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: parse arrays of function pointers'
          git push origin HEAD:product/function-pointer-array-declarator-v3
