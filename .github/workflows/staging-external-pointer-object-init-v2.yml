name: Staging External Pointer Object Init V2

on:
  push:
    branches:
      - staging/external-pointer-object-init-v2

permissions:
  contents: write

jobs:
  probe:
    if: "${{ github.event.head_commit.message != 'external pointer object init product v2' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize shared top-level pointer object initializer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path('src/frontend/parser_internal.h')
          text = header.read_text()
          anchor = '''bool minic_parser_parse_static_global(MinicParser *parser);
          '''
          replacement = anchor + '''bool minic_parser_parse_static_pointer_object_initializer(
              MinicParser *parser, MinicGlobalObjectId object_id, MinicType pointer_type);
          '''
          if anchor not in text:
              raise SystemExit('parser_internal static-global anchor not found')
          header.write_text(text.replace(anchor, replacement, 1))

          global_path = Path('src/frontend/parser_global.c')
          text = global_path.read_text()
          old = '''    } else if (minic_type_is_pointer(type)) {
                  MinicStaticPointerInitializer initializer;

                  if (!parse_static_pointer_initializer(parser, type, &initializer)) {
                      return false;
                  }
                  if (initializer.has_relocation) {
                      bool recorded;

                      if (initializer.relocation_is_function) {
                          recorded = initializer.has_explicit_pointer_cast
                                         ? minic_c0_global_object_add_function_relocation_cast(
                                               parser->program,
                                               object_id,
                                               MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                               0U,
                                               initializer.function_id)
                                         : minic_c0_global_object_add_function_relocation(
                                               parser->program,
                                               object_id,
                                               MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                               0U,
                                               initializer.function_id);
                      } else {
                          recorded = initializer.has_explicit_pointer_cast
                                         ? minic_c0_global_object_add_object_relocation_path_addend_cast(
                                               parser->program,
                                               object_id,
                                               MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                               0U,
                                               initializer.relocation_target.object_id,
                                               initializer.relocation_target.member_indices,
                                               initializer.relocation_target.member_depth,
                                               initializer.relocation_target.byte_addend)
                                         : minic_c0_global_object_add_object_relocation_path_addend(
                                               parser->program,
                                               object_id,
                                               MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                               0U,
                                               initializer.relocation_target.object_id,
                                               initializer.relocation_target.member_indices,
                                               initializer.relocation_target.member_depth,
                                               initializer.relocation_target.byte_addend);
                      }
                      if (!recorded ||
                          !minic_c0_global_object_set_zero_initialized(parser->program, object_id)) {
                          minic_parser_error(parser, "cannot record static symbolic pointer relocation");
                          return false;
                      }
                  } else if (!minic_c0_global_object_add_initializer_bits(
                                 parser->program, object_id, initializer.bits)) {
                      minic_parser_error(parser, "cannot record static pointer constant bits");
                      return false;
                  }
              } else {
          '''
          new = '''    } else if (minic_type_is_pointer(type)) {
                  if (!minic_parser_parse_static_pointer_object_initializer(
                          parser, object_id, type)) {
                      return false;
                  }
              } else {
          '''
          if old not in text:
              raise SystemExit('static pointer object materialization block not found')
          text = text.replace(old, new, 1)

          insert_anchor = '''static bool parse_static_scalar(MinicParser *parser, MinicType type, MinicSourceSpan name_span) {
          '''
          helper = '''bool minic_parser_parse_static_pointer_object_initializer(MinicParser *parser,
                                                                  MinicGlobalObjectId object_id,
                                                                  MinicType pointer_type) {
              MinicStaticPointerInitializer initializer;
              bool recorded;

              if (parser == NULL || object_id >= parser->program->global_object_count ||
                  !minic_type_is_pointer(pointer_type) ||
                  !parse_static_pointer_initializer(parser, pointer_type, &initializer)) {
                  return false;
              }
              if (!initializer.has_relocation) {
                  if (!minic_c0_global_object_add_initializer_bits(
                          parser->program, object_id, initializer.bits)) {
                      minic_parser_error(parser, "cannot record static pointer constant bits");
                      return false;
                  }
                  return true;
              }
              if (initializer.relocation_is_function) {
                  recorded = initializer.has_explicit_pointer_cast
                                 ? minic_c0_global_object_add_function_relocation_cast(
                                       parser->program,
                                       object_id,
                                       MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                       0U,
                                       initializer.function_id)
                                 : minic_c0_global_object_add_function_relocation(
                                       parser->program,
                                       object_id,
                                       MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                       0U,
                                       initializer.function_id);
              } else {
                  recorded = initializer.has_explicit_pointer_cast
                                 ? minic_c0_global_object_add_object_relocation_path_addend_cast(
                                       parser->program,
                                       object_id,
                                       MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                       0U,
                                       initializer.relocation_target.object_id,
                                       initializer.relocation_target.member_indices,
                                       initializer.relocation_target.member_depth,
                                       initializer.relocation_target.byte_addend)
                                 : minic_c0_global_object_add_object_relocation_path_addend(
                                       parser->program,
                                       object_id,
                                       MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR,
                                       0U,
                                       initializer.relocation_target.object_id,
                                       initializer.relocation_target.member_indices,
                                       initializer.relocation_target.member_depth,
                                       initializer.relocation_target.byte_addend);
              }
              if (!recorded ||
                  !minic_c0_global_object_set_zero_initialized(parser->program, object_id)) {
                  minic_parser_error(parser, "cannot record static symbolic pointer relocation");
                  return false;
              }
              return true;
          }

          ''' + insert_anchor
          if insert_anchor not in text:
              raise SystemExit('static scalar insertion anchor not found')
          global_path.write_text(text.replace(insert_anchor, helper, 1))

          function_path = Path('src/frontend/parser_function.c')
          text = function_path.read_text()
          old = '''    MinicGlobalObjectId object_id;
              MinicGlobalObjectId target_id;
              MinicSourceSpan literal_span;
              MinicType literal_type;
              MinicType literal_pointer_type;
              const MinicArrayType *literal_array;
              const MinicGlobalObject *existing;
          '''
          new = '''    MinicGlobalObjectId object_id;
              const MinicGlobalObject *existing;
          '''
          if old not in text:
              raise SystemExit('external pointer locals anchor not found')
          text = text.replace(old, new, 1)
          old = '''    if (minic_type_is_record(object_type) || minic_type_is_array(object_type)) {
                  if (!minic_parser_parse_static_storage_initializer_value(parser, object_id, object_type)) {
                      if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\\0') {
                          minic_parser_error(parser, "cannot record external record initializer");
                      }
                      return false;
                  }
                  return minic_parser_expect(
                      parser, MINIC_TOKEN_SEMICOLON, "expected ';' after external object definition");
              }

              if (parser->current.kind != MINIC_TOKEN_STRING_LITERAL ||
                  !minic_parser_create_string_literal_object(
                      parser, &target_id, &literal_type, &literal_span)) {
                  if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\\0') {
                      minic_parser_error(parser,
                                         "external pointer definition requires a string literal initializer");
                  }
                  return false;
              }
              literal_array = minic_c0_program_array_type(parser->program, literal_type.array_type_id);
              if (literal_array == NULL || !minic_type_is_array(literal_type) ||
                  !minic_type_pointer_to(literal_array->element_type, &literal_pointer_type) ||
                  !minic_type_assignment_compatible(object_type, literal_pointer_type) ||
                  !minic_c0_global_object_set_zero_initialized(parser->program, object_id) ||
                  !minic_c0_global_object_add_object_relocation(
                      parser->program, object_id, MINIC_GLOBAL_RELOCATION_LOCATION_SCALAR, 0U, target_id)) {
                  minic_parser_error(parser, "external pointer initializer type mismatch");
                  return false;
              }
              (void)literal_span;
              return minic_parser_expect(
                  parser, MINIC_TOKEN_SEMICOLON, "expected ';' after external object definition");
          '''
          new = '''    if (minic_type_is_record(object_type) || minic_type_is_array(object_type)) {
                  if (!minic_parser_parse_static_storage_initializer_value(parser, object_id, object_type)) {
                      if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\\0') {
                          minic_parser_error(parser, "cannot record external record initializer");
                      }
                      return false;
                  }
              } else if (minic_type_is_pointer(object_type)) {
                  if (!minic_parser_parse_static_pointer_object_initializer(
                          parser, object_id, object_type)) {
                      return false;
                  }
              } else {
                  return false;
              }
              return minic_parser_expect(
                  parser, MINIC_TOKEN_SEMICOLON, "expected ';' after external object definition");
          '''
          if old not in text:
              raise SystemExit('external string-only pointer block not found')
          function_path.write_text(text.replace(old, new, 1))
          PY

          cat > tests/compiler/c0/external_pointer_definition.c <<'EOF'
          char *message = "hello";
          void (*power_off)(void) = ((void *)0);
          int object_target = 41;
          int *object_pointer = &object_target;
          struct PointerPair { int left; int right; };
          struct PointerPair pair_target = { .left = 7, .right = 23 };
          int *member_pointer = &pair_target.right;
          int callback_target(void) { return 17; }
          int (*callback_pointer)(void) = callback_target;
          int main(void)
          {
              if (message[0] != 'h' || message[4] != 'o') return 1;
              if (power_off != 0) return 2;
              if (*object_pointer != 41) return 3;
              if (*member_pointer != 23) return 4;
              if (callback_pointer() != 17) return 5;
              return 0;
          }
          EOF

          cat > tests/compiler/c0/run-external-pointer-definitions.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          riscv_cc=${RISCV_CC:-riscv64-linux-gnu-gcc}
          qemu_riscv64=${QEMU_RISCV64:-qemu-riscv64}
          require_runtime=${REQUIRE_RISCV_RUNTIME:-0}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/compiler-c0-external-pointer-definitions
          rm -rf "$work" && mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/external_pointer_definition.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          for symbol in message power_off object_pointer member_pointer callback_pointer; do
              grep -F ".globl $symbol" "$work/output.s" >/dev/null
              grep -F "$symbol:" "$work/output.s" >/dev/null
          done
          grep -E '^  \.dword \.Lminic_string_[0-9]+$' "$work/output.s" >/dev/null
          grep -F '  .dword object_target' "$work/output.s" >/dev/null
          grep -E '^  \.dword pair_target([+-][0-9]+)?$' "$work/output.s" >/dev/null
          grep -F '  .dword callback_target' "$work/output.s" >/dev/null
          if command -v "$riscv_cc" >/dev/null 2>&1 && command -v "$qemu_riscv64" >/dev/null 2>&1; then
              "$riscv_cc" -static "$work/output.s" -o "$work/minic-runtime"
              "$riscv_cc" -std=gnu11 -static "$root/tests/compiler/c0/external_pointer_definition.c" -o "$work/gcc-runtime"
              set +e
              "$qemu_riscv64" "$work/gcc-runtime"; gcc_status=$?
              "$qemu_riscv64" "$work/minic-runtime"; minic_status=$?
              set -e
              test "$gcc_status" -eq 0
              test "$minic_status" -eq "$gcc_status"
          elif test "$require_runtime" = 1; then
              exit 1
          fi
          printf '%s\n' 'PASS compiler/c0/external_pointer_definition linkage=external initializer=string|null|object-address|member-address|function-address owner=shared-pointer-object'
          EOF
          chmod +x tests/compiler/c0/run-external-pointer-definitions.sh
          clang-format -i src/frontend/parser_internal.h src/frontend/parser_global.c src/frontend/parser_function.c tests/compiler/c0/external_pointer_definition.c || true
          git diff --check

      - name: Install runtime and Linux probe tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user \
            binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev

      - name: Build and focused differential
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug BUILD_DIR=build/pointer-object
          MINIC="$GITHUB_WORKSPACE/build/pointer-object/bin/minic" \
          HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-object-focused" \
          RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 REQUIRE_RISCV_RUNTIME=1 \
            sh tests/compiler/c0/run-external-pointer-definitions.sh

      - name: Broad C0
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/pointer-object/bin/minic" HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-object-c0" sh tests/compiler/c0/run.sh

      - name: Commit product staging
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add src/frontend/parser_internal.h src/frontend/parser_global.c src/frontend/parser_function.c \
            tests/compiler/c0/external_pointer_definition.c tests/compiler/c0/run-external-pointer-definitions.sh
          git commit -m 'external pointer object init product v2'
          git push origin HEAD:staging/external-pointer-object-init-v2

      - name: Restore Linux batch probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh

      - name: Restore Linux archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Probe reset and vdso
        shell: bash
        run: |
          set -Eeuo pipefail
          for spec in '20:reset' '32:vdso'; do
            offset=${spec%%:*}; tag=${spec##*:}
            set +e
            MINIC="$GITHUB_WORKSPACE/build/pointer-object/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-object-linux-$tag" \
            LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
            CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET="$offset" LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
              sh tests/external/linux/batch_probe.sh
            status=$?
            set -e
            cat "build/pointer-object-linux-$tag/batch-summary.txt"
            printf '%s status=%s\n' "$tag" "$status"
            test "$status" -eq 0 -o "$status" -eq 1
          done
