name: Core M159 Final Strict500 Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect final strict500 cut
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M159_CONSTANT_TRUE_DO_WHILE_REACHABILITY_OWNER' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require M157 production baseline
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          grep -Fq 'M157_SCALAR_COMPOUND_LITERAL_ADDRESS_OWNER' src/core/core_lower.c

      - name: Materialize final semantic cut
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! grep -Fq 'M158_FINAL_STRICT_TAIL' src/core/core_ir.h; then
            python3 tools/ci/apply-m158-final-four-v2.py
            sed -i \
              -e 's/core_ctz_zero_%%/core_ctz_zero_%/g' \
              -e 's/core_ctz_loop_%%/core_ctz_loop_%/g' \
              -e 's/core_ctz_done_%%/core_ctz_done_%/g' \
              src/target/riscv64/core_codegen.c
          fi
          python3 tools/ci/apply-m159-constant-true-do-while.py
          git diff --check
          grep -Fq 'M158_FINAL_STRICT_TAIL' src/core/core_ir.h
          grep -Fq 'M158_FINAL_STRICT_TAIL_VOID_STMT_EXPR' src/core/core_lower.c
          grep -Fq 'M158_FINAL_STRICT_TAIL_COMPUTED_GOTO' src/core/core_lower.c
          grep -Fq 'M158_FINAL_STRICT_TAIL_CTZ_RV64' src/target/riscv64/core_codegen.c
          grep -Fq 'M159_CONSTANT_TRUE_DO_WHILE_REACHABILITY_OWNER' src/core/core_lower.c

      - name: Build patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m159-compiler

      - name: Fast gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m159-check

      - name: Isolated strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/m159-regression
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m158_final_strict_tail.c \
            -o build/m159-regression/m158.i
          MINIC_CORE_IR=strict build/m159-compiler/bin/minic -S \
            build/m159-regression/m158.i -o build/m159-regression/m158.s
          test -s build/m159-regression/m158.s
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m159_constant_true_do_while.c \
            -o build/m159-regression/m159.i
          MINIC_CORE_IR=strict build/m159-compiler/bin/minic -S \
            build/m159-regression/m159.i -o build/m159-regression/m159.s
          test -s build/m159-regression/m159.s
          echo 'CORE_M159_ISOLATED strict=PASS'

      - name: Replay final four
        if: steps.state.outputs.needs_patch == 'true'
        id: focused
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/m159-focused
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/m159-compiler/bin/minic" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --indices '60,193,195,414'
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" --require-no-errors
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          w=Path('build/m159-focused')
          rows=json.loads((w/'batch-results.json').read_text())
          s=json.loads((w/'frontier-summary.json').read_text())
          by={int(r['index']):r for r in rows}
          expected=(60,193,195,414)
          if s['selected'] != 4 or s['pass'] != 4 or s['unsupported'] != 0 or s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit(f'M159 focused is not 4/4: {s}')
          for idx in expected:
              if by[idx]['status'] != 'PASS':
                  raise SystemExit(f'M159 focused failed #{idx}: {by[idx]}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('all_pass=true\n')
          for r in rows:
              print(f"M159 index={r['index']} status={r['status']}")
          print('CORE_M159_FINAL_FOUR pass=4 unsupported=0 error=0')
          PY

      - name: Full strict500 qualification
        if: steps.state.outputs.needs_patch == 'true' && steps.focused.outputs.all_pass == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/m159-full500
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/m159-compiler/bin/minic" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m159-full500/frontier-summary.json').read_text())
          print('M159_FULL500', s)
          if s['selected'] != 500 or s['pass'] != 500 or s['unsupported'] != 0 or s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit(f'full500 is not green: {s}')
          print('CORE_STRICT500_FINAL selected=500 pass=500 unsupported=0 error=0 preprocess_missing=0')
          PY

      - name: Commit qualified strict500 semantic cut
        if: steps.state.outputs.needs_patch == 'true' && steps.focused.outputs.all_pass == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c \
                  src/target/riscv64/core_codegen.c \
                  tests/compiler/c0/m158_final_strict_tail.c \
                  tests/compiler/c0/m159_constant_true_do_while.c
          git diff --cached --quiet && { echo 'no strict500 semantic changes'; exit 1; }
          git commit -m 'core: complete strict500 semantic lowering'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist final results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m159-strict500-${{ github.sha }}
          path: |
            build/m159-regression/**
            build/m159-focused/**
            build/m159-full500/**
          if-no-files-found: warn
