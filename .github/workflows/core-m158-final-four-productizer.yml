name: Core M158 Final Strict Tail Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect final tail
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M158_FINAL_STRICT_TAIL' src/core/core_ir.h; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require M157 baseline
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          grep -Fq 'M157_SCALAR_COMPOUND_LITERAL_ADDRESS_OWNER' src/core/core_lower.c

      - name: Apply final-tail candidate
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m158-final-four.py
          # Correct the materializer's literal-percent escaping before compiling;
          # only the generated semantic source is productized.
          sed -i \
            -e 's/core_ctz_zero_%%/core_ctz_zero_%/g' \
            -e 's/core_ctz_loop_%%/core_ctz_loop_%/g' \
            -e 's/core_ctz_done_%%/core_ctz_done_%/g' \
            src/target/riscv64/core_codegen.c
          git diff --check
          grep -Fq 'M158_FINAL_STRICT_TAIL' src/core/core_ir.h
          grep -Fq 'M158_FINAL_STRICT_TAIL_VOID_STMT_EXPR' src/core/core_lower.c
          grep -Fq 'M158_FINAL_STRICT_TAIL_COMPUTED_GOTO' src/core/core_lower.c
          grep -Fq 'M158_FINAL_STRICT_TAIL_CTZ_RV64' src/target/riscv64/core_codegen.c

      - name: Build patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m158-compiler

      - name: Fast gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m158-check

      - name: Isolated strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/m158-regression
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m158_final_strict_tail.c \
            -o build/m158-regression/test.i
          MINIC_CORE_IR=strict build/m158-compiler/bin/minic -S \
            build/m158-regression/test.i -o build/m158-regression/test.s
          test -s build/m158-regression/test.s
          grep -Fq 'jalr zero' build/m158-regression/test.s
          grep -Fq 'core_ctz_loop' build/m158-regression/test.s

      - name: Replay final four
        if: steps.state.outputs.needs_patch == 'true'
        id: focused
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/m158-focused
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/m158-compiler/bin/minic" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --indices '60,193,195,414'
          replay_status=$?
          set -e
          echo "CORE_M158_REPLAY_STATUS=$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" --require-no-errors
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          w=Path('build/m158-focused')
          rows=json.loads((w/'batch-results.json').read_text())
          s=json.loads((w/'frontier-summary.json').read_text())
          by={int(r['index']):r for r in rows}
          if s['selected'] != 4 or s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit(f'M158 focused invalid: {s}')
          for idx in (60,193,195):
              if by[idx]['status'] != 'PASS':
                  raise SystemExit(f'M158 failed to close #{idx}: {by[idx]}')
          all_pass = by[414]['status'] == 'PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'all_pass={str(all_pass).lower()}\n')
          for r in rows:
              print(f"M158 index={r['index']} status={r['status']} line={r.get('first_error_line')} message={r.get('message')}")
          print((w/'reason-summary.txt').read_text())
          PY
          if ! grep -R 'CORE_M158_INGRESS_DETAIL' "$work/minic-stderr"; then
            echo 'CORE_M158_INGRESS_DETAIL none'
          fi

      - name: Full strict500 qualification
        if: steps.state.outputs.needs_patch == 'true' && steps.focused.outputs.all_pass == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/m158-full500
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/m158-compiler/bin/minic" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m158-full500/frontier-summary.json').read_text())
          print('M158_FULL500', s)
          if s['selected'] != 500 or s['pass'] != 500 or s['unsupported'] != 0 or s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit(f'full500 is not green: {s}')
          PY

      - name: Commit final-tail semantic cut
        if: steps.state.outputs.needs_patch == 'true' && steps.focused.outputs.all_pass == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # Diagnostic-only ingress prints are not part of the final semantic cut.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/core_lower.c')
          t=p.read_text()
          # Leave diagnostics for this first run only. A fully-green run will be
          # cleaned by the next finalizer revision before productization.
          p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c \
                  src/target/riscv64/core_codegen.c tests/compiler/c0/m158_final_strict_tail.c
          git diff --cached --quiet && { echo 'no M158 semantic changes'; exit 1; }
          git commit -m 'core: close final strict500 semantic tail'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M158 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m158-final-tail-${{ github.sha }}
          path: |
            build/m158-regression/**
            build/m158-focused/**
            build/m158-full500/**
          if-no-files-found: warn
