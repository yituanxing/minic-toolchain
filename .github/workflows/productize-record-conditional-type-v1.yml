name: Productize Record Conditional Type V1
on:
  push:
    branches: [product/record-conditional-type-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/record-conditional-type-v1
          fetch-depth: 0
      - name: Apply and validate record conditional semantics
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-record-conditional-type-v1.py
          cat > tests/compiler/c0/record_conditional_type.c <<'EOF'
          typedef struct { unsigned int value; } id_t;
          static id_t make_id(unsigned int value) {
              id_t result = { value };
              return result;
          }
          static id_t pick(int cond, const id_t *left) {
              return cond ? *left : make_id(7U);
          }
          int main(void) {
              id_t value = { 3U };
              return (int)pick(1, &value).value - 3;
          }
          EOF
          cat > tests/compiler/c0/run-record-conditional-type.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/record-conditional-type
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/record_conditional_type.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-record-conditional-type.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-record-conditional-type.sh"
          EOF
          clang-format-18 -i src/frontend/expression_semantics.c tests/compiler/c0/record_conditional_type.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/record-conditional-type-v1
          MINIC="$GITHUB_WORKSPACE/build/record-conditional-type-v1/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/record-conditional-type-v1" \
            sh tests/compiler/c0/run-record-conditional-type.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/record-conditional-type-v1-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-record-conditional-type-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/expression_semantics.c tests/compiler/c0/record_conditional_type.c tests/compiler/c0/run-record-conditional-type.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: type compatible record conditionals'
          git push origin HEAD:product/record-conditional-type-v1
