name: Freeze linenoise Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: linenoise-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  freeze:
    if: github.event.pull_request.number == 73
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout actual discovery branch
        uses: actions/checkout@v4
        with:
          ref: external/linenoise-discovery
          fetch-depth: 0

      - name: Materialize validated semantics
        shell: bash
        run: |
          set -Eeuo pipefail

          # Materialize only semantic discovery transforms. The temporary codegen
          # diagnostic transform is deliberately excluded from the frozen source.
          for transform in \
            tools/dev/pr73-short-integer.py \
            tools/dev/pr73-function-pointer-parameter.py \
            tools/dev/pr73-extern-object.py \
            tools/dev/pr73-function-type-typedef.py \
            tools/dev/pr73-unnamed-prototype-parameters.py \
            tools/dev/pr73-static-pointer-array.py \
            tools/dev/pr73-static-zero-definition.py \
            tools/dev/pr73-record-copy-array-members.py \
            tools/dev/pr73-zero-aggregate-null.py \
            tools/dev/pr73-record-local-initializer.py \
            tools/dev/pr73-multiply-assignment.py \
            tools/dev/pr73-static-local-string-array.py \
            tools/dev/pr73-external-global-definition.py \
            tools/dev/pr73-adjacent-string-literals.py \
            tools/dev/pr73-global-pointer-subscript.py; do
            python3 "$transform"
          done

          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

          # Pin the exact unchanged upstream source inside the test tree so clean-head
          # validation no longer depends on network retrieval.
          upstream=a473823d74b93eab2ba83480df16ed37617493f2
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "https://github.com/antirez/linenoise/archive/$upstream.tar.gz" -o "$tmp/linenoise.tar.gz"
          mkdir -p "$tmp/src"
          tar -xzf "$tmp/linenoise.tar.gz" --strip-components=1 -C "$tmp/src"
          test "$(git hash-object "$tmp/src/linenoise.c")" = 63f23ddaf0e06dea4d2ac04efa084c3ca275ad8c
          test "$(git hash-object "$tmp/src/linenoise.h")" = 735629b78ed2302d407fb3b6c8e56c6ac24bd6b7
          rm -rf tests/vendor/linenoise
          mkdir -p tests/vendor/linenoise
          cp "$tmp/src/linenoise.c" "$tmp/src/linenoise.h" tests/vendor/linenoise/
          if test -f "$tmp/src/LICENSE"; then cp "$tmp/src/LICENSE" tests/vendor/linenoise/; fi
          cat > tests/vendor/linenoise/UPSTREAM <<EOF
          commit=$upstream
          linenoise.c=63f23ddaf0e06dea4d2ac04efa084c3ca275ad8c
          linenoise.h=735629b78ed2302d407fb3b6c8e56c6ac24bd6b7
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # Use the vendored, hash-checked upstream source in both compile and runtime gates.
          path = Path('tests/external/linenoise/probe.sh')
          text = path.read_text()
          old = '''vendor="$work/upstream"
          include="$work/include"
          minic=${MINIC:-"$root/build/ci-release/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          upstream=a473823d74b93eab2ba83480df16ed37617493f2

          rm -rf "$work"
          mkdir -p "$vendor" "$include/sys"

          curl -fsSL "https://raw.githubusercontent.com/antirez/linenoise/$upstream/linenoise.c" -o "$vendor/linenoise.c"
          curl -fsSL "https://raw.githubusercontent.com/antirez/linenoise/$upstream/linenoise.h" -o "$vendor/linenoise.h"

          test "$(git hash-object "$vendor/linenoise.c")" = 63f23ddaf0e06dea4d2ac04efa084c3ca275ad8c
          test "$(git hash-object "$vendor/linenoise.h")" = 735629b78ed2302d407fb3b6c8e56c6ac24bd6b7
          '''
          new = '''vendor="$root/tests/vendor/linenoise"
          include="$work/include"
          minic=${MINIC:-"$root/build/ci-release/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          upstream=a473823d74b93eab2ba83480df16ed37617493f2

          rm -rf "$work"
          mkdir -p "$work" "$include/sys"

          test "$(git hash-object "$vendor/linenoise.c")" = 63f23ddaf0e06dea4d2ac04efa084c3ca275ad8c
          test "$(git hash-object "$vendor/linenoise.h")" = 735629b78ed2302d407fb3b6c8e56c6ac24bd6b7
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected linenoise probe upstream block')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/external/linenoise/runtime_differential.sh')
          text = path.read_text()
          text = text.replace('vendor="$work/upstream"\narchive="$work/linenoise.tar.gz"\n',
                              'vendor="$root/tests/vendor/linenoise"\n', 1)
          old = '''rm -rf "$work"
          mkdir -p "$vendor"

          if test ! -f "$assembly"; then
              printf '%s\\n' "FAIL external/linenoise-runtime: missing MiniC assembly $assembly" >&2
              exit 1
          fi

          curl -fsSL "https://github.com/antirez/linenoise/archive/$upstream.tar.gz" -o "$archive"
          tar -xzf "$archive" --strip-components=1 -C "$vendor"
          test "$(git hash-object "$vendor/linenoise.c")" = 63f23ddaf0e06dea4d2ac04efa084c3ca275ad8c
          test "$(git hash-object "$vendor/linenoise.h")" = 735629b78ed2302d407fb3b6c8e56c6ac24bd6b7
          '''
          new = '''rm -rf "$work"
          mkdir -p "$work"

          if test ! -f "$assembly"; then
              printf '%s\\n' "FAIL external/linenoise-runtime: missing MiniC assembly $assembly" >&2
              exit 1
          fi

          test "$(git hash-object "$vendor/linenoise.c")" = 63f23ddaf0e06dea4d2ac04efa084c3ca275ad8c
          test "$(git hash-object "$vendor/linenoise.h")" = 735629b78ed2302d407fb3b6c8e56c6ac24bd6b7
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected linenoise runtime upstream block')
          path.write_text(text.replace(old, new, 1))

          # Promote every discovery-focused semantic test to the permanent C0 gate.
          path = Path('.github/scripts/compiler-c0-full-gate.sh')
          text = path.read_text()
          marker = '''switch_control_flow_focused() {
              MINIC="$root/build/ci-debug/bin/minic" \\
              HOST_CC=cc \\
              BUILD_DIR="$root/build/ci-switch-control-flow" \\
                  sh tests/compiler/c0/run-switch-control-flow.sh
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit('unexpected full-gate focused marker')
          addition = marker + '''linenoise_driven_focused() {
              local script
              for script in \\
                  run-short-integers.sh \\
                  run-function-pointer-parameters.sh \\
                  run-extern-objects.sh \\
                  run-function-type-typedefs.sh \\
                  run-unnamed-prototype-parameters.sh \\
                  run-static-pointer-arrays.sh \\
                  run-static-zero-definitions.sh \\
                  run-record-copy-array-members.sh \\
                  run-zero-aggregate-null.sh \\
                  run-record-local-initializers.sh \\
                  run-multiply-assignment.sh \\
                  run-static-local-string-arrays.sh \\
                  run-external-pointer-definitions.sh \\
                  run-adjacent-string-literals.sh \\
                  run-global-pointer-subscripts.sh; do
                  MINIC="$root/build/ci-debug/bin/minic" \\
                  HOST_CC=cc \\
                  BUILD_DIR="$root/build/ci-linenoise-driven" \\
                      sh "$root/tests/compiler/c0/$script"
              done
          }

          '''
          text = text.replace(marker, addition, 1)
          old = 'start_gate switch-control-flow-focused switch_control_flow_focused\n'
          new = old + 'start_gate linenoise-driven-focused linenoise_driven_focused\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected full-gate phase-2 registration')
          path.write_text(text.replace(old, new, 1))
          PY

          # Discovery machinery and temporary diagnostics remain archived, not active.
          rm -f tools/dev/pr73-*.py tools/dev/pr73-stage.sh

          git diff --check

          # Fast pre-commit proof on the materialized source itself.
          make -j4 MODE=release BUILD_DIR=build/linenoise-freeze
          MINIC="$GITHUB_WORKSPACE/build/linenoise-freeze/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linenoise-freeze-probe" \
          HOST_CC=cc \
            sh tests/external/linenoise/probe.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'compiler: freeze linenoise-driven semantics / 编译器：冻结 linenoise 驱动语义'
          git push origin HEAD:external/linenoise-discovery
