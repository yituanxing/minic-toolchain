name: Foundation Linux Tail Convergence

on:
  push:
    branches: [agent/foundation-linux-tail-convergence-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-linux-tail-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize GNU empty-record static emission
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/target/riscv64/codegen_function.c')
          text = p.read_text()
          helper = '''static bool minic_riscv64_zero_size_record_definition(const MinicC0Program *program,\n                                                        const MinicGlobalObject *object,\n                                                        size_t storage_size) {\n    const MinicRecord *record;\n\n    if (program == NULL || object == NULL || storage_size != 0U ||\n        !minic_type_is_record(object->type) || object->initializer_count != 0U ||\n        object->relocation_count != 0U) {\n        return false;\n    }\n    record = minic_c0_program_record(program, object->type.record_id);\n    return record != NULL && record->is_complete && record->field_count == 0U;\n}\n\n'''
          anchor = 'static bool minic_riscv64_emit_global_object(FILE *file,\n'
          if helper not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('empty-record helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old_locals = '''    unsigned int alignment_power;\n    size_t scalar_width;\n    size_t initializer_index;\n\n    if (!minic_data_layout_global_object(\n            minic_default_data_layout(), program, object, &storage_size, &object_alignment)) {\n        return false;\n    }\n\n    if (file == NULL || program == NULL || object == NULL || object->name_length == 0U ||\n        object_alignment == 0U ||\n        !minic_riscv64_alignment_power(object_alignment, &alignment_power)) {\n        return false;\n    }\n    if (storage_size == 0U && ((!object->is_zero_initialized && !object->is_tentative) ||\n                               object->initializer_count != 0U || object->relocation_count != 0U)) {\n        return false;\n    }\n'''
          new_locals = '''    unsigned int alignment_power;\n    size_t scalar_width;\n    size_t initializer_index;\n    bool zero_size_record_definition;\n\n    if (!minic_data_layout_global_object(\n            minic_default_data_layout(), program, object, &storage_size, &object_alignment)) {\n        return false;\n    }\n\n    if (file == NULL || program == NULL || object == NULL || object->name_length == 0U ||\n        object_alignment == 0U ||\n        !minic_riscv64_alignment_power(object_alignment, &alignment_power)) {\n        return false;\n    }\n    zero_size_record_definition =\n        minic_riscv64_zero_size_record_definition(program, object, storage_size);\n    if (storage_size == 0U && !zero_size_record_definition) {\n        return false;\n    }\n'''
          if new_locals not in text:
              if old_locals not in text:
                  raise SystemExit('empty-record precondition anchor not found')
              text = text.replace(old_locals, new_locals, 1)

          old_record = '''        record = minic_c0_program_record(program, object->type.record_id);\n        if (record == NULL || !record->is_complete || object->initializer_count == 0U) {\n            return false;\n        }\n'''
          new_record = '''        record = minic_c0_program_record(program, object->type.record_id);\n        if (record == NULL || !record->is_complete ||\n            (object->initializer_count == 0U && !zero_size_record_definition)) {\n            return false;\n        }\n'''
          if new_record not in text:
              if old_record not in text:
                  raise SystemExit('empty-record initializer anchor not found')
              text = text.replace(old_record, new_record, 1)

          p.write_text(text)
          PY
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

      - name: Build and focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/tail-compiler
          cat > build/zero-size-static.c <<'EOF'
          struct empty {};
          static struct empty file_empty = {};
          int zero_size_static(void) {
              static struct empty local_empty = {};
              return sizeof(file_empty) + sizeof(local_empty);
          }
          EOF
          build/tail-compiler/bin/minic -S build/zero-size-static.c -o build/zero-size-static.s
          test "$(grep -F '.size ' build/zero-size-static.s | grep -F ', 0' | wc -l)" -ge 2
          BUILD_DIR="$GITHUB_WORKSPACE/build/tail-full" \
            bash .github/scripts/compiler-c0-full-gate.sh

      - name: Commit and publish product source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/target/riscv64/codegen_function.c
          git commit -m 'fix(riscv64): emit GNU empty-record static definitions'
          git push origin HEAD:agent/foundation-linux-tail-convergence-v1

      - name: Restore pinned Linux source archive
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Drive committed candidate over unchanged init/main.i
        id: linux
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/tail-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-tail" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare frontier diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-tail"
          summary="$work/frontier-summary.txt"
          mkdir -p "$work"
          : > "$summary"
          if test -s "$work/kbuild/init/main.i"; then
            printf '%s\n' "total_lines=$(wc -l < "$work/kbuild/init/main.i" | tr -d ' ')" >> "$summary"
          fi
          if test -s "$work/minic.stderr"; then
            frontier_line=$(sed -n 's/.*init\/main\.i:\([0-9][0-9]*\):.*/\1/p' "$work/minic.stderr" | head -n 1)
            printf '%s\n' "frontier_line=${frontier_line:-unknown}" >> "$summary"
            printf '%s\n' 'MiniC diagnostic:' >> "$summary"
            sed -n '1,120p' "$work/minic.stderr" >> "$summary"
            if test -n "${frontier_line:-}" && test -s "$work/kbuild/init/main.i"; then
              start=$((frontier_line > 12 ? frontier_line - 12 : 1))
              end=$((frontier_line + 12))
              printf '\n%s\n' "init/main.i lines=$start-$end:" >> "$summary"
              nl -ba "$work/kbuild/init/main.i" | sed -n "${start},${end}p" >> "$summary"
            fi
          else
            printf '%s\n' 'No MiniC diagnostic; candidate passed MiniC or failed before it.' >> "$summary"
          fi
          printf '%s\n' "probe_status=${{ steps.linux.outputs.status }}" >> "$summary"
          cat "$summary"

      - name: Upload frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-linux-tail-${{ github.run_id }}
          path: |
            build/linux-tail/frontier-summary.txt
            build/linux-tail/main-i-inventory.txt
            build/linux-tail/kbuild/init/main.i
          if-no-files-found: ignore
          retention-days: 7

      - name: Save pinned Linux source archive
        if: always() && steps.linux-source-cache.outputs.cache-hit != 'true' && hashFiles('build/linux-cache/linux-6.6.143.tar.xz') != ''
        uses: actions/cache/save@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Require complete Linux TU
        if: always()
        shell: bash
        run: test "${{ steps.linux.outputs.status }}" = 0
