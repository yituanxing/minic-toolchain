name: Foundation Linux Tail Convergence

on:
  push:
    branches: [agent/foundation-linux-tail-convergence-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-linux-tail-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize transactional array-parameter ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/frontend/ast.h',
              '''bool minic_c0_program_complete_array_type(MinicC0Program *program,\n                                          MinicType array_type,\n                                          size_t element_count);\n''',
              '''bool minic_c0_program_complete_array_type(MinicC0Program *program,\n                                          MinicType array_type,\n                                          size_t element_count);\nbool minic_c0_program_discard_last_array_type(MinicC0Program *program, MinicType array_type);\n''',
              'ast declaration')

          replace_once(
              'src/frontend/ast.c',
              '''bool minic_c0_program_complete_array_type(MinicC0Program *program,\n                                          MinicType array_type,\n                                          size_t element_count) {\n    MinicArrayType *descriptor;\n\n    if (program == NULL || !minic_type_is_array(array_type) || element_count == 0U ||\n        array_type.array_type_id >= program->array_type_count) {\n        return false;\n    }\n    descriptor = &program->array_types[array_type.array_type_id];\n    if (descriptor->is_zero_length) {\n        return false;\n    }\n    if (descriptor->element_count != 0U) {\n        return descriptor->element_count == element_count;\n    }\n    descriptor->element_count = element_count;\n    return true;\n}\n''',
              '''bool minic_c0_program_complete_array_type(MinicC0Program *program,\n                                          MinicType array_type,\n                                          size_t element_count) {\n    MinicArrayType *descriptor;\n\n    if (program == NULL || !minic_type_is_array(array_type) || element_count == 0U ||\n        array_type.array_type_id >= program->array_type_count) {\n        return false;\n    }\n    descriptor = &program->array_types[array_type.array_type_id];\n    if (descriptor->is_zero_length) {\n        return false;\n    }\n    if (descriptor->element_count != 0U) {\n        return descriptor->element_count == element_count;\n    }\n    descriptor->element_count = element_count;\n    return true;\n}\n\nbool minic_c0_program_discard_last_array_type(MinicC0Program *program, MinicType array_type) {\n    MinicArrayTypeId array_type_id;\n\n    if (program == NULL || !minic_type_is_array(array_type) || program->array_type_count == 0U) {\n        return false;\n    }\n    array_type_id = array_type.array_type_id;\n    if (array_type_id != program->array_type_count - 1U) {\n        return false;\n    }\n    (void)memset(&program->array_types[array_type_id], 0, sizeof(program->array_types[array_type_id]));\n    program->array_type_count -= 1U;\n    return true;\n}\n''',
              'ast implementation')

          p = Path('src/frontend/parser_function.c')
          text = p.read_text()
          pattern = re.compile(
              r'static bool adjust_array_parameter_type\(MinicParser \*parser, MinicType \*parameter_type\) \{.*?\n\}\n\nstatic bool adjust_function_parameter_type',
              re.S)
          replacement = '''static bool adjust_array_parameter_type(MinicParser *parser, MinicType *parameter_type) {\n    const MinicArrayType *outer_array;\n    MinicType adjusted_type;\n    MinicType declared_array_type;\n    MinicType pointee_type;\n    bool is_array;\n\n    if (parser == NULL || parameter_type == NULL || parser->current.kind != MINIC_TOKEN_LBRACKET) {\n        return parser != NULL && parameter_type != NULL;\n    }\n    if (!minic_parser_parse_array_declarator_suffix(\n            parser, *parameter_type, true, &declared_array_type, &is_array) ||\n        !is_array || !minic_type_is_array(declared_array_type)) {\n        if (parser->diagnostic != NULL && parser->diagnostic->message[0] == '\\0') {\n            minic_parser_error(parser, "cannot parse array parameter declarator");\n        }\n        return false;\n    }\n    outer_array = minic_c0_program_array_type(parser->program, declared_array_type.array_type_id);\n    if (outer_array == NULL) {\n        minic_parser_error(parser, "cannot resolve array parameter declarator");\n        return false;\n    }\n    pointee_type = outer_array->element_type;\n    if (!minic_type_pointer_to(pointee_type, &adjusted_type) ||\n        !minic_c0_program_discard_last_array_type(parser->program, declared_array_type)) {\n        minic_parser_error(parser, "cannot adjust array parameter to pointer type");\n        return false;\n    }\n    *parameter_type = adjusted_type;\n    return true;\n}\n\nstatic bool adjust_function_parameter_type'''
          text2, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'parameter adjustment: matches={count}')
          p.write_text(text2)
          PY
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

      - name: Build and focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/tail-compiler
          cat > build/parameter-array-adjustment.c <<'EOF'
          struct vfsmount;
          void unmounts(struct vfsmount *mnt[], unsigned int num) {(void)mnt; (void)num;}
          int matrix_sum(int matrix[][4]) { return matrix[0][0]; }
          EOF
          build/tail-compiler/bin/minic -S build/parameter-array-adjustment.c -o build/parameter-array-adjustment.s
          MINIC="$GITHUB_WORKSPACE/build/tail-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/tail-focused" \
            sh tests/compiler/c0/run-static-pointer-arrays.sh
          BUILD_DIR="$GITHUB_WORKSPACE/build/tail-full" \
            bash .github/scripts/compiler-c0-full-gate.sh

      - name: Commit and publish product source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/frontend/ast.h src/frontend/ast.c src/frontend/parser_function.c
          git commit -m 'fix(frontend): discard adjusted parameter array descriptors'
          git push origin HEAD:agent/foundation-linux-tail-convergence-v1

      - name: Restore pinned Linux source archive
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Drive committed candidate over unchanged init/main.i
        id: linux
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/tail-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-tail" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare frontier diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-tail"
          summary="$work/frontier-summary.txt"
          mkdir -p "$work"
          : > "$summary"
          if test -s "$work/kbuild/init/main.i"; then
            printf '%s\n' "total_lines=$(wc -l < "$work/kbuild/init/main.i" | tr -d ' ')" >> "$summary"
          fi
          if test -s "$work/minic.stderr"; then
            frontier_line=$(sed -n 's/.*init\/main\.i:\([0-9][0-9]*\):.*/\1/p' "$work/minic.stderr" | head -n 1)
            printf '%s\n' "frontier_line=${frontier_line:-unknown}" >> "$summary"
            printf '%s\n' 'MiniC diagnostic:' >> "$summary"
            sed -n '1,100p' "$work/minic.stderr" >> "$summary"
            if test -n "${frontier_line:-}" && test -s "$work/kbuild/init/main.i"; then
              start=$((frontier_line > 12 ? frontier_line - 12 : 1))
              end=$((frontier_line + 12))
              printf '\n%s\n' "init/main.i lines=$start-$end:" >> "$summary"
              nl -ba "$work/kbuild/init/main.i" | sed -n "${start},${end}p" >> "$summary"
            fi
          else
            printf '%s\n' 'No MiniC diagnostic; candidate passed MiniC or failed before it.' >> "$summary"
          fi
          printf '%s\n' "probe_status=${{ steps.linux.outputs.status }}" >> "$summary"
          cat "$summary"

      - name: Upload frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-linux-tail-${{ github.run_id }}
          path: |
            build/linux-tail/frontier-summary.txt
            build/linux-tail/main-i-inventory.txt
            build/linux-tail/kbuild/init/main.i
          if-no-files-found: ignore
          retention-days: 7

      - name: Save pinned Linux source archive
        if: always() && steps.linux-source-cache.outputs.cache-hit != 'true' && hashFiles('build/linux-cache/linux-6.6.143.tar.xz') != ''
        uses: actions/cache/save@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Fail if Linux candidate is not complete
        if: always()
        shell: bash
        run: |
          test "${{ steps.linux.outputs.status }}" = 0
