name: Foundation Linux Tail Convergence

on:
  push:
    branches: [agent/foundation-linux-tail-convergence-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-linux-tail-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synthesize proven current-architecture Linux tail
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          candidate_base=$(git rev-parse HEAD)

          git checkout --detach f5e529b48f831cad83a96c45684279a777cf1d3e
          git show f5e529b48f831cad83a96c45684279a777cf1d3e:tools/dev/run-global-object-datalayout-linux-pressure.sh \
            | awk '/^make -j4 MODE=release BUILD_DIR=build\/global-object-datalayout-hybrid-linux/{exit} {print}' \
            > /tmp/rebuild-proven-tail.sh
          bash /tmp/rebuild-proven-tail.sh

          rm -rf /tmp/proven-product
          mkdir -p /tmp/proven-product/tools
          cp -a include /tmp/proven-product/include
          cp -a src /tmp/proven-product/src
          cp -a tools/minic /tmp/proven-product/tools/minic

          git reset --hard
          git clean -fd
          git checkout -B agent/foundation-linux-tail-convergence-v1 "$candidate_base"
          rm -rf include src tools/minic
          cp -a /tmp/proven-product/include ./include
          cp -a /tmp/proven-product/src ./src
          mkdir -p tools
          cp -a /tmp/proven-product/tools/minic ./tools/minic

          python3 tools/dev/normalize-converged-rv64-abi.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          mkdir -p build/convergence
          git diff --stat -- include src tools/minic tests/target/riscv64/abi_test.c \
            > build/convergence/product-diff-stat.txt
          git diff --binary -- include src tools/minic tests/target/riscv64/abi_test.c \
            > build/convergence/product.patch
          cat build/convergence/product-diff-stat.txt

          if grep -R -n --include='*.c' --include='*.h' \
              'field->storage_offset\|field->bit_offset\|record->storage_size\|record->alignment\|object->storage_size\|object->alignment' src; then
            echo 'target-derived semantic AST layout cache reintroduced' >&2
            exit 1
          fi
          if grep -R -n --include='*.c' --include='*.h' '\<local_storage_size\>' src/frontend; then
            echo 'frontend local placement cache reintroduced' >&2
            exit 1
          fi
          grep -F 'minic_data_layout_global_object' src/target/riscv64/codegen_function.c >/dev/null
          grep -F 'minic_riscv64_abi_place_argument' src/target/riscv64/codegen_expression.c >/dev/null
          grep -F 'minic_riscv64_abi_place_argument' src/target/riscv64/codegen_function.c >/dev/null
          grep -F 'MINIC_RISCV64_ABI_VALUE_VOID' src/target/riscv64/abi.h >/dev/null
          grep -F 'MINIC_RISCV64_ABI_VALUE_IGNORE' src/target/riscv64/abi.h >/dev/null
          grep -F 'MINIC_RISCV64_ABI_VALUE_INDIRECT' src/target/riscv64/abi.h >/dev/null
          grep -F 'minic_c0_program_remap_external_expression_ids' src/frontend/cast_normalization.c >/dev/null
          if grep -n 'static bool minic_riscv64_integer_aggregate_member_type' \
              src/target/riscv64/codegen_support.c; then
            echo 'duplicate aggregate classifier remains outside TargetABI' >&2
            exit 1
          fi

      - name: Validate committed-source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/converged-compiler
          BUILD_DIR="$GITHUB_WORKSPACE/build/converged-full" \
            bash .github/scripts/compiler-c0-full-gate.sh

      - name: Restore pinned Linux source archive
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Drive synthesized committed source over unchanged init/main.i
        id: linux
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/converged-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-converged" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record convergence evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-converged"
          summary="$GITHUB_WORKSPACE/build/convergence/linux-summary.txt"
          mkdir -p "$GITHUB_WORKSPACE/build/convergence"
          : > "$summary"
          if test -s "$work/kbuild/init/main.i"; then
            printf '%s\n' "total_lines=$(wc -l < "$work/kbuild/init/main.i" | tr -d ' ')" >> "$summary"
          fi
          printf '%s\n' "probe_status=${{ steps.linux.outputs.status }}" >> "$summary"
          if test -s "$work/minic.stderr"; then
            sed -n '1,160p' "$work/minic.stderr" >> "$summary"
          fi
          cat "$summary"

      - name: Publish committed product source
        if: steps.linux.outputs.status == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          git add include src tools/minic tests/target/riscv64/abi_test.c
          git diff --cached --check
          git commit -m 'feat(compiler): converge proven Linux tail semantics'
          git push origin HEAD:agent/foundation-linux-tail-convergence-v1

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-linux-tail-convergence-${{ github.run_id }}
          path: |
            build/convergence/product-diff-stat.txt
            build/convergence/product.patch
            build/convergence/linux-summary.txt
            build/linux-converged/main-i-inventory.txt
            build/linux-converged/kbuild/init/main.i
          if-no-files-found: ignore
          retention-days: 7

      - name: Save pinned Linux source archive
        if: always() && steps.linux-source-cache.outputs.cache-hit != 'true' && hashFiles('build/linux-cache/linux-6.6.143.tar.xz') != ''
        uses: actions/cache/save@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Require complete committed Linux TU
        if: always()
        shell: bash
        run: test "${{ steps.linux.outputs.status }}" = 0
