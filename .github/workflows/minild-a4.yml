name: MiniLD A4 Dynamic ELF

on:
  push:
    branches:
      - "toolchain/minild-dynamic-a4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minild-a4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V ELF oracle
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils-riscv64-linux-gnu qemu-user

      - name: Build MiniLD with strict warnings
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4 all

      - name: Keep A0-A3 green
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4 check-minild-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4 check-minild-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4 check-minild-a2
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4 check-minild-a3

      - name: Run ET_DYN metadata gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4 check-minild-a4
