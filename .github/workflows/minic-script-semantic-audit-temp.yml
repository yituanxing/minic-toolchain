name: MiniC Script Semantic Audit (temporary)
on:
  push:
    branches:
      - audit/minic-script-review-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect all script bodies and call references, including discarded tests
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, pathlib, collections, itertools, difflib, subprocess, shlex
          root=pathlib.Path.cwd()
          files=[pathlib.Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0')]
          texts={}
          for p in files:
              try:
                  if p.stat().st_size < 1000000:
                      texts[p.as_posix()]=p.read_text()
              except (UnicodeError,OSError): pass
          scripts={p:c for p,c in texts.items() if p.endswith(('.sh','.py'))}
          ci={p:c for p,c in texts.items() if p.startswith('.github/workflows/') and p.endswith(('.yml','.yaml'))}
          assert_regex=re.compile(r'\b(?:assert|grep|cmp|diff|test|awk|readelf|objdump|nm|sha256sum|sha256|expect|require|check_output)\b|(^|\s)\[\[?(?=\s)',re.I|re.M)
          feature_tokens=('GNU','QEMU','ABI','KVM','Linux','runtime','negative','reject','asm','native','cross','Stage','RV32','RV64','AArch64','LoongArch','x86','fixture','sanitiz','bootstrap','compiler','link','ELF')
          def label(p):
              if p.startswith('tests/compiler/c0/'):return 'c0'
              if p.startswith('tools/ci/'):return 'tools-ci'
              if p.startswith('tests/'):return 'other-test'
              if p.startswith('tools/'):return 'other-tool'
              return 'other'
          owners={}
          for path,body in scripts.items():
              base=path.split('/')[-1]
              refs=[]
              for caller,content in texts.items():
                  if caller==path: continue
                  if path in content or base in content:
                      refs.append(caller)
              owners[path]=refs
          def canonical_tokens(s):
              s=re.sub(r'#[^\n]*','',s)
              s=re.sub(r'(".*?"|'.replace("'",'')+r"'.*?')",'<STRING>',s)
              s=re.sub(r'\b[0-9]+\b','<N>',s)
              return set(re.findall(r'[a-z_][a-z_0-9-]+',s.lower()))
          # log summary for every script
          metadata={}
          for p,body in scripts.items():
              refs=owners[p]; direct=[r for r in refs if not r.startswith('docs/') and not r.endswith('.md')]
              docs=[r for r in refs if r not in direct]
              scriptsFrom=[r for r in direct if r in scripts]
              testSources=set(re.findall(r'tests/compiler/c0/[A-Za-z0-9_./-]+\.(?:c|i|h|S|s)\b',body))
              miniFiles=set(re.findall(r'tools/ci/[A-Za-z0-9_./-]+\.(?:py|sh)\b',body))
              markers=sorted(set(re.findall(r'[A-Z][A-Z0-9_]{6,}=PASS',body)))
              data=dict(p=p,group=label(p),lines=len(body.splitlines()),bytes=len(body.encode()),
                  direct=len(direct),ci_refs=sum(r in ci for r in refs),make_refs=sum(r=='Makefile' for r in refs),
                  script_refs=len(scriptsFrom),docs=len(docs),assertions=len(assert_regex.findall(body)),
                  source_count=len(testSources),sources=sorted(testSources)[:12],
                  tool_calls=len(miniFiles),markers=markers[:12],
                  qemu=('qemu' in body.lower()),target=sorted({x for x in ('x86_64','riscv32','riscv64','aarch64','loongarch64') if x in body.lower()}),
                  explicit_consumers=direct[:16])
              metadata[p]=data
              print('SCRIPT',json.dumps(data,separators=(',',':')),flush=False)
          count=collections.Counter(x['group'] for x in metadata.values())
          print('GROUP_COUNTS',json.dumps(count),flush=True)
          for group in ('c0','tools-ci','other-test','other-tool','other'):
              current=[x for x in metadata.values() if x['group']==group]
              unref=[x for x in current if x['direct']==0]
              print('GROUP_STATS',json.dumps(dict(group=group,total=len(current),no_direct=len(unref),
                  no_direct_bytes=sum(x['bytes'] for x in unref),
                  live_by_make=sum(x['make_refs']>0 for x in current),
                  live_by_ci=sum(x['ci_refs']>0 for x in current),
                  with_assertions=sum(x['assertions']>0 for x in current),
                  large=sorted((x for x in current if x['bytes']>14000),key=lambda x:-x['bytes'])[:20])),flush=True)
          # Find highly similar scripts but do NOT call them semantically redundant without checking oracles.
          candidates=[(p,c,canonical_tokens(c)) for p,c in scripts.items() if label(p) in ('c0','tools-ci') and len(c)>280]
          pairs=[]
          for (p,a,ta),(q,b,tb) in itertools.combinations(candidates,2):
              if label(p)!=label(q):continue
              if min(len(ta),len(tb))<15: continue
              similarity=len(ta&tb)/max(len(ta|tb),1)
              if similarity>=.78:
                  pairs.append((round(similarity,3),p,q,len(ta),len(tb)))
          print('SIMILARITY_TOP',json.dumps(sorted(pairs,reverse=True)[:120]),flush=True)
          # Identify pass-through wrappers; a finding is review, not approval to delete.
          wrappers=[]
          for p,c in scripts.items():
              ls=[x.strip() for x in c.splitlines() if x.strip() and not x.strip().startswith('#')]
              if len(ls)<=25 and not assert_regex.search(c) and re.search(r'\b(?:exec|bash|sh|python3)\b',c):
                  wrappers.append((p,len(ls),c[:350]))
          print('WRAPPERS',json.dumps(wrappers[:150]),flush=True)
          # Review retired scripts from previous PR against base, including unique assertions.
          old='7ad7f2b885b0c01bfe8e11fbbdecf3d4cac5876c'
          deleted=subprocess.check_output(['git','diff','--name-only','--diff-filter=D',old,'HEAD'],text=True).splitlines()
          lost=[]
          for p in deleted:
              if not p.endswith('.sh'): continue
              raw=subprocess.run(['git','show',old+':'+p],capture_output=True,text=True)
              if raw.returncode:continue
              c=raw.stdout
              markers=sorted(set(re.findall(r'[A-Z][A-Z0-9_]{6,}=PASS',c)))
              cfixtures=sorted(set(re.findall(r'tests/compiler/c0/[A-Za-z0-9_./-]+\.(?:c|i|h|S|s)\b',c)))
              present=[m for m in markers if any(m in b for n,b in texts.items() if n!=p and not n.startswith('docs/'))]
              lost.append(dict(path=p,bytes=len(c),assertions=len(assert_regex.findall(c)),
                  markers=markers,markers_retained=present,fixtures=len(cfixtures),flags=' '.join(t for t in ('qemu','readelf','objdump','cc -','grep','diff','gcc') if t in c)))
          print('RETIRED_SCRIPTS',json.dumps(lost),flush=True)
          print('AUDIT_SUMMARY',json.dumps(dict(files=len(files),textfiles=len(texts),scripts=len(scripts),
           c0=count.get('c0',0),tools_ci=count.get('tools-ci',0),workflows=len(ci),retired_scripts=len(lost),
           retired_with_assertions=sum(x['assertions']>0 for x in lost),
           retired_unique_explicit_markers=sum(bool(set(x['markers'])-set(x['markers_retained'])) for x in lost),
           near_pairs=len(pairs))),flush=True)
          
          PY
