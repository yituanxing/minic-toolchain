name: MiniAS x86-64 and LoongArch64 Integer GNU Oracle

on:
  pull_request:
    paths:
      - 'assembler/src/**'
      - 'elf/**'
      - 'tests/assembler/probe-comdat-groups.sh'
      - 'tests/assembler/probe-mc-cross-layer-contract.sh'
      - 'tests/assembler/probe-cfi-debug-frame.sh'
      - 'tests/assembler/probe-cfi-dual-frame.sh'
      - 'tests/assembler/probe-minias-acceptance-gates.sh'
      - 'tests/assembler/probe-elf-semantic-comdat-strict.sh'
      - 'tests/assembler/probe-miniobjcopy-comdat-rewrite.sh'
      - 'tests/assembler/probe-x86-loong-base.sh'
      - 'tests/assembler/probe-mc-operand-lexer.sh'
      - 'tests/assembler/mc-operand-lexer-contract.c'
      - '.github/workflows/minias-new-targets-oracle.yml'
      - 'Makefile'
  workflow_dispatch:
permissions:
  contents: read

# Only the latest commit of one PR needs the fast GNU differential. Earlier
# run conclusions remain in GitHub history; no artifacts or workflows are
# removed by canceling obsolete in-flight exact-head attempts.
concurrency:
  group: minias-x86-loong-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integer-gnu-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install real LoongArch GNU assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-loongarch64-linux-gnu python3-pyelftools
      - name: Build exact-head MiniAS and all four target backends
        run: make -j2 MODE=release CFLAGS=-Werror build/release/bin/minic-as build/release/bin/minic-objcopy
      - name: Validate GNU duplicate COMDAT and strict semantic comparator
        run: |
          bash tests/assembler/probe-elf-semantic-comdat-strict.sh
          bash tests/assembler/probe-minias-acceptance-gates.sh
      - name: GNU x86 cross-layer section, alias, layout and FILE semantics
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
            bash tests/assembler/probe-mc-cross-layer-contract.sh
      - name: Native MiniAS to MiniObjcopy COMDAT member rewrite versus GNU objcopy
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
          MINIOBJCOPY="$GITHUB_WORKSPACE/build/release/bin/minic-objcopy" \
            bash tests/assembler/probe-miniobjcopy-comdat-rewrite.sh
      - name: GNU x86-64 and LoongArch64 dual CFI frame section contract
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-cfi-dual-frame.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-cfi-dual-frame.sh
      - name: GNU x86-64 grouped MC operand tokenizer and negative grammar
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-operand-lexer.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-mc-operand-lexer.sh
      - name: GNU x86-64 and LoongArch64 MCExpr byte+relocation parity
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-common-mcexpr-four-arch.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-common-mcexpr-four-arch.sh
      - name: GNU x86-64 and LoongArch64 one-pass INCBIN DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-immutable-incbin.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-mc-immutable-incbin.sh
      - name: GNU x86-64 and LoongArch64 immutable LEB and string DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-immutable-literal-data.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-mc-immutable-literal-data.sh
      - name: GNU x86-64 and LoongArch64 immutable lexical MCExpr
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mcexpr-lexical-sets.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-mcexpr-lexical-sets.sh
      - name: Verify parsed MCExpr final-dot and local symbol offset
        run: |
          cat > /tmp/mc-dot.s <<'SRC_DOT'
          .text
          base:
          nop
          .long .-base
          .long .-base+7
          .long .-(base+1)
          SRC_DOT
          build/release/bin/minic-as --target=x86_64 -o /tmp/mc-dot-mini.o /tmp/mc-dot.s
          as --64 -o /tmp/mc-dot-gnu.o /tmp/mc-dot.s
          objcopy -j .text -O binary /tmp/mc-dot-mini.o /tmp/mc-mini.bin
          objcopy -j .text -O binary /tmp/mc-dot-gnu.o /tmp/mc-gnu.bin
          if ! cmp /tmp/mc-mini.bin /tmp/mc-gnu.bin; then
            echo 'MiniAS MCExpr .-base bytes:' >&2
            od -An -tx1 /tmp/mc-mini.bin >&2
            echo 'GNU GAS .-base bytes:' >&2
            od -An -tx1 /tmp/mc-gnu.bin >&2
            readelf -rW /tmp/mc-dot-mini.o >&2
            readelf -rW /tmp/mc-dot-gnu.o >&2
            exit 1
          fi
      - name: GNU x86 and LoongArch64 256-byte CFI bytecode oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-cfi-escape-blob.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-cfi-escape-blob.sh
      - name: GNU x86 and LoongArch64 extended CFI nested state
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-cfi-extended-gnu.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-cfi-extended-gnu.sh
      - name: Real x86 and LoongArch64 implicit EH GNU oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-cfi-eh-frame.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-cfi-eh-frame.sh
      - name: Verify GNU x86 and LoongArch64 DWARF CIE/FDE semantics
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-cfi-debug-frame.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-cfi-debug-frame.sh
      - name: GNU x86 long-branch and typed variable DATA oracle
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-typed-variable-data-relax.sh
      - name: GNU x86 persistent .org layout and lexical conditionals
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-org-lexical-layout.sh
      - name: GNU x86 and LoongArch64 fixed .org with forward DATA
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mc-org-data-fixedpoint.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-mc-org-data-fixedpoint.sh
      - name: GNU x86 and LoongArch64 variable MCExpr retained semantics
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mcexpr-variable-fixedpoint.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-mcexpr-variable-fixedpoint.sh
      - name: GNU x86 and LoongArch64 .size signed end anchors
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=x86_64 \
            bash tests/assembler/probe-mcexpr-size-end-anchor.sh
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" ARCH=loongarch64 \
            bash tests/assembler/probe-mcexpr-size-end-anchor.sh
      - name: GNU AS byte equality, ELF ABI, and ISA error gates
        run: |
          MINIAS="$GITHUB_WORKSPACE/build/release/bin/minic-as" \
          LOONGAS=loongarch64-linux-gnu-as \
          LOONGCOPY=loongarch64-linux-gnu-objcopy \
          LOONGREADELF=loongarch64-linux-gnu-readelf \
            bash tests/assembler/probe-x86-loong-base.sh
