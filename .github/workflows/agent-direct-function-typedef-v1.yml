name: Agent Direct Function Typedef V1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0
      - name: Generate direct function typedef source
        run: python3 tools/dev/agent_direct_function_typedef_v1.py
      - name: Format generated source
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-direct-function-typedef
      - name: Run shared declarator focused contract
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-direct-function-typedef/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-direct-function-typedef-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-shared-function-declarator.sh
      - name: Run Foundation focused contracts
        run: |
          MINIC="$GITHUB_WORKSPACE/build/agent-direct-function-typedef/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-direct-function-typedef-foundation" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh
      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-direct-function-typedef check-fast
      - name: Publish generated source to scratch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_internal.h \
                  src/frontend/parser_declarator.c \
                  src/frontend/parser_typedef.c \
                  tests/compiler/c0/shared_function_declarator.c \
                  tests/compiler/c0/run-shared-function-declarator.sh
          git commit -m 'frontend: support direct function type typedefs'
          git push --force origin HEAD:agent/direct-function-typedef-v1
