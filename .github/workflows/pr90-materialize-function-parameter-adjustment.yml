name: PR90 Materialize Function Parameter Adjustment

on:
  push:
    branches:
      - agent/function-parameter-adjustment-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/function-parameter-adjustment-v0
          fetch-depth: 0
      - name: Materialize function parameter semantics
        run: |
          set -Eeuo pipefail
          python tools/dev/pr90-materialize-function-parameter-adjustment.py
          chmod +x tests/compiler/c0/run-function-parameter-adjustment.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug
          sh tests/compiler/c0/run-function-parameter-adjustment.sh
          make check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr90-materialize-function-parameter-adjustment.py
          rm -f .github/workflows/pr90-materialize-function-parameter-adjustment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: adjust function parameters to pointers'
          git push origin HEAD:agent/function-parameter-adjustment-v0
