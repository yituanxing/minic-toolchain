name: PR99 Materialize Block Scope Extern Object
on:
  push:
    branches: [agent/block-scope-extern-object-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/block-scope-extern-object-v0, fetch-depth: 0}
      - name: Materialize block-scope extern object semantics
        run: python3 tools/dev/pr99-materialize-block-scope-extern-object.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          chmod +x tests/compiler/c0/run-block-scope-extern-object.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused" HOST_CC=cc sh tests/compiler/c0/run-block-scope-extern-object.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr99-materialize-block-scope-extern-object.yml tools/dev/pr99-materialize-block-scope-extern-object.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: support block-scope extern object declarations'
          git push origin HEAD:agent/block-scope-extern-object-v0
