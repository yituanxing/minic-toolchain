name: MiniC 24-driver old/new semantic parity (temporary)
on:
  push:
    branches: [cleanup/minic-native-matrix-batch-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production MiniC exact head
        run: make -j4 MODE=release CFLAGS=-Werror build/release/bin/minic-cc build/release/bin/minic
      - name: Independently compare real legacy shell versus declarative matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile, json
          root=pathlib.Path.cwd()
          cc=str(root/'build/release/bin/minic-cc')
          mini=str(root/'build/release/bin/minic')
          cases=json.loads((root/'tests/compiler/c0/native-matrix.json').read_text())
          names=[
            "run-gnu-inline-asm-over-capacity",
            "probe-gnu-numeric-pointer-global",
            "probe-direct-lp64-abi-policy",
            "run-block-extern-void-linker-symbol",
            "run-gnu-zero-extent-global-array-address",
            "probe-gnu-tee-const-record-member-5isa",
            "run-incomplete-array-symbol-address-equality",
            "run-gnu-static-multi-array-declarators",
            "run-gnu-basic-implicit-volatile-asm",
            "probe-gnu-aarch64-q-record-memory",
            "run-gnu-efi-msabi-attributed-pointer-declarators",
            "probe-gnu-qualified-array-pointer-argument",
            "probe-lp64-empty-record-call-abi",
            "probe-lp64-overaligned-stack-frame",
            "run-riscv-extended-zero-output-volatile",
            "run-riscv-linux-compiletime-assert-guards",
            "run-incomplete-function-pointer-array-lifetime",
            "run-gnu-array-object-identity",
            "probe-aarch64-fixmap-cross-static-const",
            "probe-rv64-packed-wide-alignment",
            "probe-gnu-const-bitfield-initialization-5isa",
            "probe-gnu-indirect-record-return-5isa",
            "probe-gnu-nested-switch-record-return-5isa",
            "probe-gnu-variadic-single-scalar-record",
          ]
          assert len(names)==24 and all(n in cases for n in names)
          bash_cases={'run-gnu-zero-extent-global-array-address','run-gnu-static-multi-array-declarators','probe-gnu-nested-switch-record-return-5isa','probe-gnu-indirect-record-return-5isa','probe-gnu-const-bitfield-initialization-5isa'}
          with_arg={'run-gnu-zero-extent-global-array-address','run-gnu-static-multi-array-declarators'}
          fail=[]
          for name in names:
              with tempfile.TemporaryDirectory(prefix='c0-batch24-') as scratch:
                  paths=pathlib.Path(scratch)
                  env=dict(os.environ,MINIC_CC=cc,MINIC=mini,HOST_CC='cc',CC='cc')
                  outputs=[]
                  for phase in ('old','new'):
                      env['BUILD_DIR']=str(paths/phase)
                      if phase=='old':
                          cmd=['bash' if name in bash_cases else 'sh','tests/compiler/c0/'+name+'.sh']
                          if name in with_arg: cmd.append(cc)
                      else:
                          cmd=['sh','tests/compiler/c0/run-native-matrix.sh',name]
                          if name in with_arg: cmd.append(cc)
                      try:
                          p=subprocess.run(cmd,cwd=root,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=160)
                          outputs.append((p.returncode,p.stdout,p.stderr))
                      except Exception as e:
                          outputs.append((998,b'',repr(e).encode()))
                  a,b=outputs
                  okay=a==b and a[0]==0
                  print('PARITY24',name,'old_rc',a[0],'new_rc',b[0],
                        'stdout_equal',a[1]==b[1],'stderr_equal',a[2]==b[2],
                        'ok',okay,flush=True)
                  if not okay:
                      fail.append(name)
                      print('OLD_RESULT',name,repr(a[1][-2200:]),repr(a[2][-3500:]),flush=True)
                      print('NEW_RESULT',name,repr(b[1][-2200:]),repr(b[2][-3500:]),flush=True)
          print('PARITY24_SUMMARY',len(names)-len(fail),'/',len(names),'FAILED',fail,flush=True)
          if fail: raise SystemExit(1)
          PY
