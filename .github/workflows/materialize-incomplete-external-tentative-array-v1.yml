name: Materialize Incomplete External Tentative Array V1
on:
  push:
    branches: [staging/string-octal-v1]
    paths:
      - tools/dev/materialize-incomplete-external-tentative-array-v1.py
      - .github/workflows/materialize-incomplete-external-tentative-array-v1.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-incomplete-external-tentative-array-v1.py
          clang-format-18 -i src/frontend/parser_function.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/incomplete-array
      - name: Focused incomplete tentative completion
        run: |
          set -Eeuo pipefail
          cat > /tmp/incomplete-array.c <<'EOF'
          extern const char banner[];
          const char banner[] __attribute__((weak));
          const char banner[] = "abc";
          int main(void) { return banner[3]; }
          EOF
          build/incomplete-array/bin/minic -S /tmp/incomplete-array.c -o /tmp/incomplete-array.s
          grep -Fx '.weak banner' /tmp/incomplete-array.s
          ! grep -Fx '.globl banner' /tmp/incomplete-array.s
      - name: Install Linux probe tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Probe unchanged version.i
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          set +e
          MINIC="$GITHUB_WORKSPACE/build/incomplete-array/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/incomplete-version" CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=1 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/incomplete-version/batch-summary.txt
          echo "VERSION_PROBE_STATUS=$status"
      - name: Commit product only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-incomplete-external-tentative-array-v1.py .github/workflows/materialize-incomplete-external-tentative-array-v1.yml .github/workflows/diagnostic-version-linux-banner-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_function.c tools/dev/materialize-incomplete-external-tentative-array-v1.py .github/workflows/materialize-incomplete-external-tentative-array-v1.yml .github/workflows/diagnostic-version-linux-banner-v1.yml
          git diff --cached --check
          git commit -m 'frontend: retain incomplete external tentative arrays'
          git push origin HEAD:staging/string-octal-v1
