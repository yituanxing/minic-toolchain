name: Productize GNU enum mode byte v1

on:
  pull_request:
    branches:
      - frontend/promoted-static-record-designator-v1
    paths:
      - 'tools/dev/materialize-enum-mode-byte-v1.py'
      - 'tests/compiler/c0/enum_mode_byte*.c'
      - 'tests/compiler/c0/run-enum-mode-byte.sh'
      - '.github/workflows/productize-enum-mode-byte-v1.yml'

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: frontend/enum-mode-byte-v1

      - name: Materialize enum mode semantics
        run: |
          python3 tools/dev/materialize-enum-mode-byte-v1.py
          clang-format -i src/frontend/attribute.c src/frontend/attribute.h src/frontend/parser_enum.c

      - name: Build and focused gate
        run: |
          make -j4 CFLAGS=-Werror
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" HOST_CC=cc BUILD_DIR="$GITHUB_WORKSPACE/build/debug" \
            sh tests/compiler/c0/run-enum-mode-byte.sh
          git diff --check

      - name: Commit product
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/attribute.c src/frontend/attribute.h src/frontend/parser_enum.c tests/compiler/c0/run.sh
          if git diff --cached --quiet; then
            echo 'enum mode product already materialized'
            exit 0
          fi
          git commit -m 'frontend: support GNU enum mode byte'
          git push origin HEAD:frontend/enum-mode-byte-v1
