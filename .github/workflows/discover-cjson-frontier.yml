name: Discover cJSON frontier

on:
  pull_request:
    paths:
      - '.github/scripts/discover-cjson-frontier.sh'
      - '.github/workflows/discover-cjson-frontier.yml'
      - 'tests/vendor/cjson/**'
      - 'tests/external/cjson/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-cjson-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RISC-V preprocessor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu

      - name: Build MiniC
        run: make -j2

      - name: Discover exact cJSON frontier
        run: bash .github/scripts/discover-cjson-frontier.sh
