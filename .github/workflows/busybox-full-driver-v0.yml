name: BusyBox Compiler Batch Fast V0

on:
  push:
    branches:
      - compiler/busybox-batch-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busybox-compiler-batch-fast-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-batch-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build current Mini toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/busybox-batch-fast-v0 all

      - name: Run focused compiler regression batch
        shell: bash
        run: |
          set -Eeuo pipefail
          export MINIC="$GITHUB_WORKSPACE/build/busybox-batch-fast-v0/bin/minic"
          export MINIPP="$GITHUB_WORKSPACE/build/busybox-batch-fast-v0/bin/minic-cpp"
          export BUILD_DIR="$GITHUB_WORKSPACE/build/busybox-batch-fast-v0"
          export HOST_CC=cc
          export REFERENCE_CPP=gcc
          sh tests/compiler/c0/run-enum-constant-scopes.sh
          sh tests/preprocessor/run-a0.sh
          sh tests/compiler/c0/run-cast-expressions.sh
          sh tests/compiler/c0/run-gnu-packed-record-field.sh
          sh tests/compiler/c0/run-mixed-double-arithmetic.sh
          sh tests/compiler/c0/run-float-integer-arithmetic.sh
          sh tests/compiler/c0/run-floating-prefix-update.sh
          sh tests/compiler/c0/run-gnu-function-attributes.sh
          sh tests/compiler/c0/run-gnu-prefix-function-attributes.sh
          echo "BUSYBOX_COMPILER_BATCH_FAST_V0=PASS"
