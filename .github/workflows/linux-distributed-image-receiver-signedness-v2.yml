name: Linux Distributed Image Receiver Strict Replay V3
on:
  push:
    branches: [agent/linux-expanded-kbuild-v0]
    paths:
      - 'tools/ci/run-linux-distributed-image-receiver-signedness-v2.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-distributed-image-receiver-signedness-v2
  cancel-in-progress: false

env:
  MINIC_DISTRIBUTED_FIX_NESTED_CONSTANT_P: '1'
  MINIC_DISTRIBUTED_TRACED_REBUILD_LIMIT: '60'
  MINIC_DISTRIBUTED_STRICT_REPLAY: '1'

jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact audit and shell syntax before downloads
        run: |
          set -Eeuo pipefail
          bash -n tools/ci/linux-distributed-full-image-v1.sh
          python3 -m py_compile tools/ci/linux-distributed-provenance-audit-v2.py tools/ci/apply-correctness-constant-p-core-local-facts-v1.py tools/ci/apply-correctness-constant-p-nested-core-v2.py
      - name: Restore pinned V2 producer manifest
        uses: actions/download-artifact@v4
        with:
          name: distributed-full-image-plan-v1
          run-id: 37787452745
          github-token: ${{ github.token }}
          path: build/linux-distributed-full-image-v1/plan
      - name: Restore seven V2 MiniC original shards without recompiling them
        uses: actions/download-artifact@v4
        with:
          pattern: distributed-full-image-shard-*
          run-id: 37787452745
          github-token: ${{ github.token }}
          path: build/linux-distributed-full-image-v1/incoming
          merge-multiple: false
      - name: Install exact producer RISC-V dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu build-essential \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3
      - name: Reproduce V2 Linux config and corrected MiniC compiler identity
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-distributed-full-image-v1.sh prepare
          grep -qx 'e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7' build/linux-distributed-full-image-v1/config.sha256
          grep -qx 'e41c4becdfb614ea736621ee0a449522a18a3ad2309258e9eeeff7bce317bd40' build/linux-distributed-full-image-v1/compiler.sha256
      - name: Restore 3352 objects; complete generated-dependency warmup and strict byte-exact replay
        run: bash tools/ci/linux-distributed-full-image-v1.sh image
      - name: Install QEMU only after Image and provenance are validated
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            qemu-system-misc opensbi cpio gzip libc6-dev-riscv64-cross device-tree-compiler
      - name: Boot RISC-V Linux Image with independent initramfs
        run: bash tools/ci/linux-distributed-full-image-v1.sh qemu
      - name: Preserve warmup, strict replay and QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-image-strict-replay-v3-receiver-evidence
          path: |
            build/linux-distributed-full-image-v1/image-warmup.log
            build/linux-distributed-full-image-v1/image-warmup.trace
            build/linux-distributed-full-image-v1/warmup-compiled.txt
            build/linux-distributed-full-image-v1/reuse-final-check.txt
            build/linux-distributed-full-image-v1/image.log
            build/linux-distributed-full-image-v1/image.trace
            build/linux-distributed-full-image-v1/image-summary.txt
            build/linux-distributed-full-image-v1/reuse.sha256
            build/linux-distributed-full-image-v1/reuse-post-audit.txt
            build/linux-distributed-full-image-v1/final-compiled.txt
            build/linux-distributed-full-image-v1/qemu.log
            build/linux-distributed-full-image-v1/qemu-summary.txt
            build/linux-distributed-full-image-v1/config.sha256
            build/linux-distributed-full-image-v1/compiler.sha256
          if-no-files-found: warn
          retention-days: 7
