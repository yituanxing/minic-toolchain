name: Diagnostic Inline Asm Capacity V1

on:
  push:
    branches: [diagnostic/inline-asm-capacity-v1]

permissions:
  contents: read

concurrency:
  group: diagnostic-inline-asm-capacity-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Widen only backend operand capacity
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/target/riscv64/codegen_inline_asm.c')
          s = p.read_text()
          old = '#define MINIC_RISCV64_INLINE_ASM_MAX_OPERANDS 6U'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '#define MINIC_RISCV64_INLINE_ASM_MAX_OPERANDS 12U', 1))
          PY
          git diff -- src/target/riscv64/codegen_inline_asm.c
      - name: Build diagnostic compiler
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/diag-inline-asm-capacity
      - name: Drive first 100
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/diag-inline-asm-capacity/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-batch" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh
      - name: Show summary
        if: always()
        run: |
          test -s build/linux-batch/batch-summary.txt && cat build/linux-batch/batch-summary.txt || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-inline-asm-capacity-${{ github.run_id }}
          path: |
            build/linux-batch/batch-summary.txt
            build/linux-batch/batch-results.json
            build/linux-batch/failure-contexts.txt
            build/linux-batch/minic-stderr/**/*.stderr
          if-no-files-found: ignore
          retention-days: 7
