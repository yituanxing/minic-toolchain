name: Staging Builtin Memcpy Call

on:
  push:
    branches:
      - staging/builtin-memcpy-call-v1

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Apply builtin memcpy CALL lowering
        run: python3 tools/dev/stage-builtin-memcpy-call.py

      - name: Canonical formatting
        run: |
          chmod +x tests/compiler/c0/run-builtin-memcpy-call.sh
          clang-format-18 -i \
            src/frontend/parser_expression.c \
            tests/compiler/c0/builtin_memcpy_call.c

      - name: Release Werror build
        run: make -j4 MODE=release BUILD_DIR=build/staging-builtin-memcpy EXTRA_CFLAGS=-Werror

      - name: Focused builtin memcpy regression
        env:
          MINIC: ${{ github.workspace }}/build/staging-builtin-memcpy/bin/minic
          HOST_CC: cc
          BUILD_DIR: ${{ github.workspace }}/build/staging-builtin-memcpy
        run: sh tests/compiler/c0/run-builtin-memcpy-call.sh

      - name: Broad C0 suite
        env:
          MINIC: ${{ github.workspace }}/build/staging-builtin-memcpy/bin/minic
          HOST_CC: cc
          BUILD_DIR: ${{ github.workspace }}/build/staging-builtin-memcpy
        run: sh tests/compiler/c0/run.sh

      - name: Foundation focused suite
        env:
          MINIC: ${{ github.workspace }}/build/staging-builtin-memcpy/bin/minic
          HOST_CC: cc
          BUILD_DIR: ${{ github.workspace }}/build/staging-builtin-memcpy
        run: sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish validated product diff
        run: |
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add \
            src/frontend/parser_expression.c \
            tests/compiler/c0/builtin_memcpy_call.c \
            tests/compiler/c0/run-builtin-memcpy-call.sh \
            tests/compiler/c0/run-foundation-focused.sh
          git diff --cached --check
          git commit -m 'frontend: lower builtin memcpy to canonical call [publish]'
          git push origin HEAD:staging/builtin-memcpy-call-v1
