name: Architecture Seams Host Validation

on:
  push:
    branches:
      - refactor/architecture-seams-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-seams-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize intended source-list integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Makefile')
          text = path.read_text()

          production = (
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )
          production_replacement = (
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_traversal.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )
          contract = (
              'AST_CONTRACT_TEST_SOURCES := \\\n'
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_global.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )
          contract_replacement = (
              'AST_CONTRACT_TEST_SOURCES := \\\n'
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_global.c \\\n'
              '\tsrc/frontend/ast_traversal.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )

          if text.count(production) != 1:
              raise SystemExit('unexpected production source-list shape')
          if text.count(contract) != 1:
              raise SystemExit('unexpected AST contract source-list shape')

          text = text.replace(production, production_replacement, 1)
          text = text.replace(contract, contract_replacement, 1)
          path.write_text(text)
          PY

      - name: Verify production source inventory
        run: sh tools/maintenance/check-production-source-inventory.sh

      - name: Check committed source formatting
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Run release host contracts
        run: make -j2 MODE=release BUILD_DIR=build/architecture-host CFLAGS=-Werror check-fast

      - name: Run sanitizer AST contracts
        run: make -j2 MODE=sanitize BUILD_DIR=build/architecture-sanitize check-ast-contract
