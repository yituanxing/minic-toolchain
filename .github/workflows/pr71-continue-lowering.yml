name: PR71 Continue Lowering

on:
  push:
    branches:
      - frontend/additive-update-pointer-difference

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply continue token and internal-label lowering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement for {old!r}, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/frontend/token.h',
              '    MINIC_TOKEN_KW_BREAK,\n',
              '    MINIC_TOKEN_KW_BREAK,\n    MINIC_TOKEN_KW_CONTINUE,\n')
          replace_once(
              'src/frontend/token.c',
              '    case MINIC_TOKEN_KW_BREAK:\n        return "break";\n',
              '    case MINIC_TOKEN_KW_BREAK:\n        return "break";\n    case MINIC_TOKEN_KW_CONTINUE:\n        return "continue";\n')
          replace_once(
              'src/frontend/lexer.c',
              '    if (length == 5U && memcmp(text, "break", 5U) == 0) {\n        return MINIC_TOKEN_KW_BREAK;\n    }\n',
              '    if (length == 5U && memcmp(text, "break", 5U) == 0) {\n        return MINIC_TOKEN_KW_BREAK;\n    }\n    if (length == 8U && memcmp(text, "continue", 8U) == 0) {\n        return MINIC_TOKEN_KW_CONTINUE;\n    }\n')
          replace_once(
              'src/frontend/parser_internal.h',
              '    size_t loop_depth;\n    size_t switch_depth;\n',
              '    size_t loop_depth;\n    MinicStatementId continue_target_statement;\n    size_t switch_depth;\n')
          replace_once(
              'src/frontend/parser_function.c',
              '    parser.current_function = MINIC_FUNCTION_INVALID;\n',
              '    parser.current_function = MINIC_FUNCTION_INVALID;\n    parser.continue_target_statement = MINIC_STATEMENT_INVALID;\n')

          path = Path('src/frontend/parser_statement.c')
          text = path.read_text()
          helper_marker = 'static bool parse_while(MinicParser *parser) {\n'
          helper = r'''static bool add_internal_continue_label(MinicParser *parser,
                                               MinicSourceSpan span,
                                               MinicStatementId *statement_id) {
              MinicStatement label;

              if (statement_id == NULL) {
                  return false;
              }
              (void)memset(&label, 0, sizeof(label));
              label.kind = MINIC_STATEMENT_LABEL;
              label.span = span;
              label.target_expression = MINIC_EXPRESSION_INVALID;
              label.expression = MINIC_EXPRESSION_INVALID;
              label.target_statement = MINIC_STATEMENT_INVALID;
              label.then_block = MINIC_BLOCK_INVALID;
              label.else_block = MINIC_BLOCK_INVALID;
              if (!minic_c0_program_add_statement(parser->program, &label, statement_id)) {
                  minic_parser_error(parser, "out of memory while adding continue target");
                  return false;
              }
              return true;
          }

          static bool parse_continue(MinicParser *parser) {
              MinicStatement statement;

              if (parser->loop_depth == 0U ||
                  parser->continue_target_statement == MINIC_STATEMENT_INVALID) {
                  minic_parser_error(parser, "continue statement requires an enclosing loop");
                  return false;
              }

              (void)memset(&statement, 0, sizeof(statement));
              statement.kind = MINIC_STATEMENT_GOTO;
              statement.span = parser->current.span;
              statement.target_expression = MINIC_EXPRESSION_INVALID;
              statement.expression = MINIC_EXPRESSION_INVALID;
              statement.target_statement = parser->continue_target_statement;
              statement.then_block = MINIC_BLOCK_INVALID;
              statement.else_block = MINIC_BLOCK_INVALID;
              return minic_parser_advance(parser) &&
                     minic_parser_expect(parser,
                                         MINIC_TOKEN_SEMICOLON,
                                         "expected ';' after continue") &&
                     minic_parser_add_statement(parser, &statement);
          }

          '''
          if text.count(helper_marker) != 1:
              raise SystemExit('parse_while marker not unique')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          while_pattern = re.compile(
              r'static bool parse_while\(MinicParser \*parser\) \{.*?\n\}\n\nstatic bool parse_switch',
              re.DOTALL,
          )
          while_replacement = r'''static bool parse_while(MinicParser *parser) {
              MinicStatement statement;
              MinicStatementId continue_label;
              MinicStatementId previous_continue_target;
              MinicSourceSpan while_span;
              bool success;

              while_span = parser->current.span;
              (void)memset(&statement, 0, sizeof(statement));
              statement.kind = MINIC_STATEMENT_WHILE;
              statement.span.begin = while_span.begin;
              statement.target_expression = MINIC_EXPRESSION_INVALID;
              statement.expression = MINIC_EXPRESSION_INVALID;
              statement.then_block = MINIC_BLOCK_INVALID;
              statement.else_block = MINIC_BLOCK_INVALID;

              if (!minic_parser_advance(parser) ||
                  !minic_parser_expect(parser, MINIC_TOKEN_LPAREN, "expected '('") ||
                  !minic_parser_parse_expression(parser, &statement.expression, 0U) ||
                  !expression_is_integer_condition(parser, statement.expression) ||
                  !minic_parser_expect(parser, MINIC_TOKEN_RPAREN, "expected ')'") ||
                  !add_internal_continue_label(parser, while_span, &continue_label) ||
                  !minic_c0_block_add_statement(
                      parser->program, parser->current_block, continue_label)) {
                  return false;
              }
              previous_continue_target = parser->continue_target_statement;
              parser->continue_target_statement = continue_label;
              success = parse_loop_branch(parser, &statement.then_block);
              parser->continue_target_statement = previous_continue_target;
              if (!success) {
                  return false;
              }
              statement.span.end = parser->current.span.begin;
              return minic_parser_add_statement(parser, &statement);
          }

          static bool parse_switch'''
          text, count = while_pattern.subn(while_replacement, text, count=1)
          if count != 1:
              raise SystemExit('parse_while function not replaced')

          for_pattern = re.compile(
              r'static bool parse_for\(MinicParser \*parser\) \{.*?\n\}\n\nstatic bool ensure_function_label_context',
              re.DOTALL,
          )
          for_replacement = r'''static bool parse_for(MinicParser *parser) {
              MinicStatement statement;
              MinicStatementId updates[8];
              MinicStatementId continue_label;
              MinicStatementId previous_continue_target;
              size_t update_count;
              size_t update_index;
              MinicSourceSpan for_span;
              bool success;

              (void)memset(&statement, 0, sizeof(statement));
              statement.kind = MINIC_STATEMENT_WHILE;
              statement.target_expression = MINIC_EXPRESSION_INVALID;
              statement.expression = MINIC_EXPRESSION_INVALID;
              statement.then_block = MINIC_BLOCK_INVALID;
              statement.else_block = MINIC_BLOCK_INVALID;
              for_span = parser->current.span;

              if (!minic_parser_advance(parser) ||
                  !minic_parser_expect(parser, MINIC_TOKEN_LPAREN, "expected '('")) {
                  return false;
              }
              if (parser->current.kind == MINIC_TOKEN_SEMICOLON) {
                  if (!minic_parser_advance(parser)) {
                      return false;
                  }
              } else if (!parse_expression_or_assignment_statement(parser, false)) {
                  return false;
              }
              if (parser->current.kind == MINIC_TOKEN_SEMICOLON) {
                  if (!minic_parser_advance(parser)) {
                      return false;
                  }
              } else if (!minic_parser_parse_expression(parser, &statement.expression, 0U) ||
                         !expression_is_integer_condition(parser, statement.expression) ||
                         !minic_parser_expect(parser, MINIC_TOKEN_SEMICOLON, "expected ';'")) {
                  return false;
              }

              update_count = 0U;
              while (parser->current.kind != MINIC_TOKEN_RPAREN) {
                  if (update_count >= sizeof(updates) / sizeof(updates[0])) {
                      minic_parser_error(
                          parser, "for update supports at most eight comma-separated items");
                      return false;
                  }
                  if (!parse_for_update(parser, &updates[update_count])) {
                      return false;
                  }
                  update_count += 1U;
                  if (parser->current.kind == MINIC_TOKEN_COMMA) {
                      if (!minic_parser_advance(parser)) {
                          return false;
                      }
                      continue;
                  }
                  if (parser->current.kind != MINIC_TOKEN_RPAREN) {
                      minic_parser_error(parser, "expected ',' or ')' after for update");
                      return false;
                  }
              }

              if (!minic_parser_expect(parser, MINIC_TOKEN_RPAREN, "expected ')'") ||
                  !add_internal_continue_label(parser, for_span, &continue_label)) {
                  return false;
              }
              previous_continue_target = parser->continue_target_statement;
              parser->continue_target_statement = continue_label;
              success = parse_loop_branch(parser, &statement.then_block);
              parser->continue_target_statement = previous_continue_target;
              if (!success ||
                  !minic_c0_block_add_statement(
                      parser->program, statement.then_block, continue_label)) {
                  if (success) {
                      minic_parser_error(parser, "cannot append for-loop continue target");
                  }
                  return false;
              }
              for (update_index = 0U; update_index < update_count; ++update_index) {
                  if (!minic_c0_block_add_statement(
                          parser->program, statement.then_block, updates[update_index])) {
                      minic_parser_error(parser, "cannot append for-loop update");
                      return false;
                  }
              }
              statement.span.begin = for_span.begin;
              statement.span.end = parser->current.span.begin;
              return minic_parser_add_statement(parser, &statement);
          }

          static bool ensure_function_label_context'''
          text, count = for_pattern.subn(for_replacement, text, count=1)
          if count != 1:
              raise SystemExit('parse_for function not replaced')

          dispatch_old = '''    if (parser->current.kind == MINIC_TOKEN_KW_BREAK) {
              return parse_break(parser);
          }
          if (current_identifier_is_goto(parser)) {'''
          dispatch_new = '''    if (parser->current.kind == MINIC_TOKEN_KW_BREAK) {
              return parse_break(parser);
          }
          if (parser->current.kind == MINIC_TOKEN_KW_CONTINUE) {
              return parse_continue(parser);
          }
          if (current_identifier_is_goto(parser)) {'''
          if text.count(dispatch_old) != 1:
              raise SystemExit('statement dispatch site not found')
          path.write_text(text.replace(dispatch_old, dispatch_new, 1))
          PY
          clang-format-18 -i \
            src/frontend/token.h \
            src/frontend/token.c \
            src/frontend/lexer.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_function.c \
            src/frontend/parser_statement.c

      - name: Host validation
        run: make -j2 BUILD_DIR=build/pr71-continue check

      - name: Commit generated sources
        env:
          BRANCH: frontend/additive-update-pointer-difference
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/frontend/token.h \
            src/frontend/token.c \
            src/frontend/lexer.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_function.c \
            src/frontend/parser_statement.c
          git rm .github/workflows/pr71-continue-lowering.yml
          git commit -m 'frontend: lower continue through internal labels'
          git push origin HEAD:"$BRANCH"
