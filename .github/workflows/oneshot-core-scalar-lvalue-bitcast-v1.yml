name: One-shot Core Scalar Lvalue Bitcast

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Apply focused Core migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            tools/dev/patch-core-scalar-lvalue-bitcast-v1.py \
            tools/dev/patch-core-hybrid-sentinel-v1.py
          python3 tools/dev/patch-core-scalar-lvalue-bitcast-v1.py
          python3 tools/dev/patch-core-hybrid-sentinel-v1.py
          clang-format-18 -i \
            src/core/core_ir.h \
            src/core/core_ir.c \
            src/core/core_lower.c \
            src/target/riscv64/core_codegen.c \
            tests/compiler/c0/core_scalar_lvalue_bitcast.c \
            tests/compiler/c0/core_scalar_lvalue_bitcast_runtime.c \
            tests/target/riscv64/core_hybrid_differential.i \
            tests/target/riscv64/core_hybrid_differential_runtime.c
          bash -n tests/compiler/c0/run-core-scalar-lvalue-bitcast.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check

      - name: Validate Core lowering and RV64 routing
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-scalar-bitcast
          compiler="$GITHUB_WORKSPACE/build/core-scalar-bitcast/bin/minic"
          source_file=tests/compiler/c0/core_scalar_lvalue_bitcast.c
          cc -E -P -std=gnu11 "$source_file" -o build/core-scalar-bitcast/core_scalar_lvalue_bitcast.i

          MINIC_CORE_IR=strict "$compiler" -S \
            build/core-scalar-bitcast/core_scalar_lvalue_bitcast.i \
            -o build/core-scalar-bitcast/strict.s
          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S \
            build/core-scalar-bitcast/core_scalar_lvalue_bitcast.i \
            -o build/core-scalar-bitcast/core.s
          for symbol in core_offset_to_ptr core_pointer_read core_member_read core_pointer_bits; do
            grep -q "^${symbol}:" build/core-scalar-bitcast/core.s
            grep -q "${symbol}_core_bb0" build/core-scalar-bitcast/core.s
          done

          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-shadow-post" \
            bash tests/core/run-core-ir-shadow.sh

          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S \
            tests/target/riscv64/core_hybrid_differential.i \
            -o build/core-scalar-bitcast/hybrid.s
          grep -q '^\.Lcore_hybrid_fallback_load_core_bb0:' build/core-scalar-bitcast/hybrid.s
          grep -q '^\.Lcore_hybrid_fallback_indirect_return:' build/core-scalar-bitcast/hybrid.s
          if grep -q '^\.Lcore_hybrid_fallback_indirect_core_bb' build/core-scalar-bitcast/hybrid.s; then
            printf '%s\n' 'indirect-call sentinel unexpectedly became Core-owned' >&2
            exit 1
          fi
          printf '%s\n' 'PASS core/m2-scalar-lvalue-bitcast'

      - name: Publish Core M2 slice
        shell: bash
        run: |
          set -Eeuo pipefail
          rm \
            tools/dev/patch-core-scalar-lvalue-bitcast-v1.py \
            tools/dev/patch-core-hybrid-sentinel-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_ir.h \
            src/core/core_ir.c \
            src/core/core_lower.c \
            src/target/riscv64/core_codegen.c \
            tests/compiler/c0/core_scalar_lvalue_bitcast.c \
            tests/compiler/c0/core_scalar_lvalue_bitcast_runtime.c \
            tests/compiler/c0/run-core-scalar-lvalue-bitcast.sh \
            tests/target/riscv64/core_hybrid_differential.i \
            tests/target/riscv64/core_hybrid_differential_runtime.c \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-scalar-lvalue-bitcast-v1.py \
            tools/dev/patch-core-hybrid-sentinel-v1.py
          git diff --cached --check
          git commit -m 'core: lower scalar lvalue reads and bitcasts'
          git push origin HEAD:refactor/declaration-sema-v1
