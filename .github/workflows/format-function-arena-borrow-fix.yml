name: Format Function Arena Borrow Fix

on:
  push:
    branches: [fix/frontend-function-arena-borrow]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonical format and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/parser_statement.c
          rm .github/workflows/format-function-arena-borrow-fix.yml
          git diff --check
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add -A
          git commit -m 'style: canonicalize function arena borrow fix'
          git push origin HEAD:fix/frontend-function-arena-borrow
