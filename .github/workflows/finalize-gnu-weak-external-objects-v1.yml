name: Finalize GNU Weak External Objects V1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  productize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'product/final-gnu-weak-object-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/final-gnu-weak-object-v1
          fetch-depth: 0

      - name: Apply current-main GNU weak object semantics
        run: |
          set -Eeuo pipefail
          if grep -q 'bool is_weak;' src/frontend/ast.h && test -f tests/compiler/c0/gnu_weak_external_objects.c; then
            echo 'weak product tree already materialized'
            exit 0
          fi

          git fetch origin product/gnu-weak-external-objects-v1
          git show origin/product/gnu-weak-external-objects-v1:.github/workflows/productize-gnu-weak-external-objects-v1.yml > /tmp/old-weak.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('/tmp/old-weak.yml').read_text()
          begin = text.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = text.index("\n          PY\n", begin)
          script = textwrap.dedent(text[begin:end])
          external_begin = script.index('# External object parser:')
          external_end = script.index('# RV64 ELF/assembly symbol binding.', external_begin)
          script = script[:external_begin] + script[external_end:]
          Path('/tmp/weak-foundation.py').write_text(script)
          PY
          python3 /tmp/weak-foundation.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/frontend/parser_function.c')
          s = p.read_text()

          old = '''    if (parser == NULL || object_id_out == NULL ||
              !minic_c0_type_is_complete_object(parser->program, object_type)) {
          '''
          new = '''    if (parser == NULL || object_id_out == NULL ||
              (!minic_c0_type_is_complete_object(parser->program, object_type) &&
               !minic_type_is_array(object_type))) {
          '''
          if s.count(old) != 1:
              raise SystemExit(f'tentative incomplete-array guard count={s.count(old)}')
          s = s.replace(old, new, 1)

          marker = 'static bool parse_external_tentative_object(MinicParser *parser,\n'
          if s.count(marker) != 1:
              raise SystemExit(f'tentative marker count={s.count(marker)}')
          helper = '''static bool apply_external_object_weak(MinicParser *parser,
                                                 MinicSourceSpan name_span,
                                                 bool is_weak) {
              MinicGlobalObjectId object_id;

              if (!is_weak) {
                  return true;
              }
              object_id = minic_parser_find_global_object_entity(parser, name_span);
              if (object_id == MINIC_GLOBAL_OBJECT_INVALID ||
                  !minic_c0_global_object_set_weak(parser->program, object_id, true)) {
                  minic_parser_error(parser, "GNU weak requires external object linkage");
                  return false;
              }
              return true;
          }

          '''
          s = s.replace(marker, helper + marker, 1)

          start = s.index('static bool parse_visible_external_array(MinicParser *parser,')
          end = s.index('typedef struct MinicParsedDeclarationPrefix {', start)
          new_visible = '''static bool incomplete_array_declarator_is_tentative(const MinicParser *parser) {
              MinicParser probe;

              if (parser == NULL || parser->current.kind != MINIC_TOKEN_LBRACKET) {
                  return false;
              }
              probe = *parser;
              if (!minic_parser_advance(&probe) || probe.current.kind != MINIC_TOKEN_RBRACKET ||
                  !minic_parser_advance(&probe)) {
                  return false;
              }
              while (function_identifier_is(&probe, "__attribute__") ||
                     function_identifier_is(&probe, "__attribute")) {
                  size_t depth;

                  if (!minic_parser_advance(&probe) || probe.current.kind != MINIC_TOKEN_LPAREN) {
                      return false;
                  }
                  depth = 0U;
                  for (;;) {
                      if (probe.current.kind == MINIC_TOKEN_LPAREN) {
                          depth += 1U;
                      } else if (probe.current.kind == MINIC_TOKEN_RPAREN) {
                          if (depth == 0U) {
                              return false;
                          }
                          depth -= 1U;
                      }
                      if (!minic_parser_advance(&probe)) {
                          return false;
                      }
                      if (depth == 0U) {
                          break;
                      }
                  }
              }
              return probe.current.kind == MINIC_TOKEN_SEMICOLON;
          }

          static bool parse_visible_external_array(MinicParser *parser,
                                                   MinicType element_type,
                                                   MinicSourceSpan name_span,
                                                   char *section_name,
                                                   size_t section_name_capacity,
                                                   size_t *section_name_length,
                                                   bool *has_section,
                                                   size_t *explicit_alignment,
                                                   MinicSymbolVisibility visibility,
                                                   bool has_visibility,
                                                   bool *is_weak) {
              MinicParser probe;
              MinicType array_type;
              bool is_array;

              if (parser == NULL || parser->current.kind != MINIC_TOKEN_LBRACKET ||
                  section_name == NULL || section_name_length == NULL || has_section == NULL ||
                  explicit_alignment == NULL || is_weak == NULL) {
                  return false;
              }

              if (incomplete_array_declarator_is_tentative(parser)) {
                  MinicGlobalObjectId existing_id;
                  const MinicGlobalObject *existing;
                  const MinicArrayType *existing_array;

                  existing_id = minic_parser_find_global_object_entity(parser, name_span);
                  existing = existing_id == MINIC_GLOBAL_OBJECT_INVALID
                                 ? NULL
                                 : minic_c0_program_global_object(parser->program, existing_id);
                  existing_array =
                      existing != NULL && minic_type_is_array(existing->type)
                          ? minic_c0_program_array_type(parser->program, existing->type.array_type_id)
                          : NULL;
                  if (existing_array != NULL &&
                      minic_parser_external_object_types_compatible(
                          parser->program, existing_array->element_type, element_type)) {
                      if (!minic_parser_expect(parser, MINIC_TOKEN_LBRACKET, "expected '['") ||
                          !minic_parser_expect(parser, MINIC_TOKEN_RBRACKET, "expected ']'")) {
                          return false;
                      }
                      array_type = existing->type;
                      is_array = true;
                  } else if (!minic_parser_parse_array_declarator_suffix(
                                 parser, element_type, true, &array_type, &is_array) ||
                             !is_array || !minic_type_is_array(array_type)) {
                      return false;
                  }
                  if (!minic_parser_parse_gnu_object_attribute_lists_with_symbol_metadata(
                          parser,
                          section_name,
                          section_name_capacity,
                          section_name_length,
                          has_section,
                          explicit_alignment,
                          &visibility,
                          &has_visibility,
                          is_weak)) {
                      return false;
                  }
                  return parse_external_tentative_object(parser,
                                                         array_type,
                                                         name_span,
                                                         section_name,
                                                         *section_name_length,
                                                         *has_section,
                                                         *explicit_alignment,
                                                         visibility,
                                                         has_visibility);
              }

              probe = *parser;
              if (!minic_parser_advance(&probe)) {
                  return false;
              }
              if (probe.current.kind == MINIC_TOKEN_RBRACKET) {
                  if (!minic_parser_advance(&probe)) {
                      return false;
                  }
                  if (minic_type_is_record(element_type)) {
                      return parse_inferred_external_record_array_definition(parser,
                                                                             element_type,
                                                                             name_span,
                                                                             section_name,
                                                                             section_name_capacity,
                                                                             section_name_length,
                                                                             has_section,
                                                                             explicit_alignment,
                                                                             visibility,
                                                                             has_visibility);
                  }
                  return parse_external_integer_array_definition(parser, element_type, name_span);
              }

              if (!minic_parser_parse_array_declarator_suffix(
                      parser, element_type, true, &array_type, &is_array) ||
                  !is_array ||
                  !minic_parser_parse_gnu_object_attribute_lists_with_symbol_metadata(
                      parser,
                      section_name,
                      section_name_capacity,
                      section_name_length,
                      has_section,
                      explicit_alignment,
                      &visibility,
                      &has_visibility,
                      is_weak)) {
                  return false;
              }
              if (parser->current.kind == MINIC_TOKEN_SEMICOLON) {
                  return parse_external_tentative_object(parser,
                                                         array_type,
                                                         name_span,
                                                         section_name,
                                                         *section_name_length,
                                                         *has_section,
                                                         *explicit_alignment,
                                                         visibility,
                                                         has_visibility);
              }
              return parse_external_object_definition(parser,
                                                      array_type,
                                                      name_span,
                                                      section_name,
                                                      *section_name_length,
                                                      *has_section,
                                                      *explicit_alignment,
                                                      visibility,
                                                      has_visibility);
          }

          '''
          s = s[:start] + new_visible + s[end:]

          old = '''    MinicSymbolVisibility visibility;
              bool has_visibility;
              MinicFunctionId alias_target;
          '''
          new = '''    MinicSymbolVisibility visibility;
              bool has_visibility;
              bool object_is_weak;
              MinicFunctionId alias_target;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'object weak local count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''    visibility = MINIC_SYMBOL_VISIBILITY_DEFAULT;
              has_visibility = false;
              alias_target = MINIC_FUNCTION_INVALID;
          '''
          new = '''    visibility = MINIC_SYMBOL_VISIBILITY_DEFAULT;
              has_visibility = false;
              object_is_weak = false;
              alias_target = MINIC_FUNCTION_INVALID;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'object weak init count={s.count(old)}')
          s = s.replace(old, new, 1)

          external_start = s.index(
              '    if (!is_internal &&\n        (is_function_pointer_object || parser->current.kind != MINIC_TOKEN_LPAREN)) {')
          external_end = s.index('    if (!apply_function_attribute_list(\n', external_start)
          external = '''    if (!is_internal &&
              (is_function_pointer_object || parser->current.kind != MINIC_TOKEN_LPAREN)) {
              if (is_inline) {
                  minic_parser_error(parser, "inline specifier requires a function declarator");
                  return false;
              }
              if (!minic_parser_apply_object_attribute_list_with_symbol_metadata(
                      parser,
                      &deferred_attributes,
                      section_name,
                      sizeof(section_name),
                      &section_name_length,
                      &has_section,
                      &object_explicit_alignment,
                      &visibility,
                      &has_visibility,
                      &object_is_weak) ||
                  !minic_parser_apply_object_attribute_list_with_symbol_metadata(
                      parser,
                      &declarator_attributes,
                      section_name,
                      sizeof(section_name),
                      &section_name_length,
                      &has_section,
                      &object_explicit_alignment,
                      &visibility,
                      &has_visibility,
                      &object_is_weak)) {
                  return false;
              }
              if (is_extern_declaration) {
                  if (object_is_weak) {
                      minic_parser_error(
                          parser, "GNU weak extern object declarations are not supported yet");
                      return false;
                  }
                  return minic_parser_parse_extern_global_after_head(parser,
                                                                     base_type,
                                                                     return_type,
                                                                     name_span,
                                                                     section_name,
                                                                     section_name_length,
                                                                     has_section,
                                                                     object_explicit_alignment,
                                                                     visibility,
                                                                     has_visibility);
              }
              if (!minic_parser_parse_gnu_object_attribute_lists_with_symbol_metadata(
                      parser,
                      section_name,
                      sizeof(section_name),
                      &section_name_length,
                      &has_section,
                      &object_explicit_alignment,
                      &visibility,
                      &has_visibility,
                      &object_is_weak)) {
                  return false;
              }
              if (parser->current.kind == MINIC_TOKEN_COMMA) {
                  if (object_is_weak) {
                      minic_parser_error(parser, "GNU weak declaration lists are not supported yet");
                      return false;
                  }
                  return parse_external_tentative_declaration_list_after_head(parser,
                                                                              base_type,
                                                                              return_type,
                                                                              name_span,
                                                                              section_name,
                                                                              section_name_length,
                                                                              has_section,
                                                                              object_explicit_alignment,
                                                                              visibility,
                                                                              has_visibility);
              }
              if (parser->current.kind == MINIC_TOKEN_LBRACKET) {
                  if (!parse_visible_external_array(parser,
                                                    return_type,
                                                    name_span,
                                                    section_name,
                                                    sizeof(section_name),
                                                    &section_name_length,
                                                    &has_section,
                                                    &object_explicit_alignment,
                                                    visibility,
                                                    has_visibility,
                                                    &object_is_weak)) {
                      return false;
                  }
              } else if (parser->current.kind == MINIC_TOKEN_SEMICOLON) {
                  if (!parse_external_tentative_object(parser,
                                                       return_type,
                                                       name_span,
                                                       section_name,
                                                       section_name_length,
                                                       has_section,
                                                       object_explicit_alignment,
                                                       visibility,
                                                       has_visibility)) {
                      return false;
                  }
              } else if (!parse_external_object_definition(parser,
                                                           return_type,
                                                           name_span,
                                                           section_name,
                                                           section_name_length,
                                                           has_section,
                                                           object_explicit_alignment,
                                                           visibility,
                                                           has_visibility)) {
                  return false;
              }
              return apply_external_object_weak(parser, name_span, object_is_weak);
          }
          '''
          s = s[:external_start] + external + s[external_end:]
          p.write_text(s)
          PY

          cat > tests/compiler/c0/gnu_weak_external_objects.c <<'EOF'
          struct uts_like { int value; };
          struct uts_like weak_record __attribute__((__weak__));
          const char weak_banner[] __attribute__((__weak__));
          int weak_defined __attribute__((weak)) = 7;
          int main(void) {
              return weak_record.value + weak_banner[0] + weak_defined - 7;
          }
          EOF
          cat > tests/compiler/c0/invalid_gnu_weak_internal_object.c <<'EOF'
          static int internal_value __attribute__((weak));
          int main(void) { return internal_value; }
          EOF
          cat > tests/compiler/c0/run-gnu-weak-external-objects.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/gnu-weak-external-objects
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c "$root/tests/compiler/c0/gnu_weak_external_objects.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          grep -q '^\.weak weak_record$' "$work/output.s"
          grep -q '^\.weak weak_banner$' "$work/output.s"
          grep -q '^\.weak weak_defined$' "$work/output.s"
          "$host_cc" -E -P -std=gnu11 -x c "$root/tests/compiler/c0/invalid_gnu_weak_internal_object.c" -o "$work/invalid.i"
          if "$minic" -S "$work/invalid.i" -o "$work/invalid.s" >"$work/invalid.out" 2>"$work/invalid.err"; then
            echo 'expected internal weak object rejection' >&2
            exit 1
          fi
          EOF
          chmod +x tests/compiler/c0/run-gnu-weak-external-objects.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/compiler/c0/run.sh')
          s = p.read_text()
          if 'run-gnu-weak-external-objects.sh' not in s:
              p.write_text(s + '\nMINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \\\n  sh "$root/tests/compiler/c0/run-gnu-weak-external-objects.sh"\n')
          PY

      - name: Validate weak object product tree
        run: |
          set -Eeuo pipefail
          if command -v clang-format-18 >/dev/null 2>&1; then
            clang-format-18 -i src/frontend/ast.h src/frontend/ast_global.c src/frontend/ast_verifier.c src/frontend/attribute.c src/frontend/parser_attribute.c src/frontend/parser_function.c src/frontend/parser_internal.h src/target/riscv64/codegen_function.c tests/compiler/c0/gnu_weak_external_objects.c tests/compiler/c0/invalid_gnu_weak_internal_object.c
          fi
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-weak-final
          MINIC="$GITHUB_WORKSPACE/build/product-weak-final/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-weak-final" sh tests/compiler/c0/run-gnu-weak-external-objects.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-weak-final-fast

      - name: Commit clean weak product tree
        run: |
          set -Eeuo pipefail
          rm -f diagnostics/final-gnu-weak-trigger.txt
          if git diff --quiet && git diff --cached --quiet; then
            echo 'no product diff to commit'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: model GNU weak external objects'
          git push origin HEAD:product/final-gnu-weak-object-v1
