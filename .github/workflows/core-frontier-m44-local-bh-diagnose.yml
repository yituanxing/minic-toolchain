name: Core M44 Label Address Qualification

on:
  pull_request:

jobs:
  qualify:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply M31b through M44 and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          python3 tools/dev/patch-core-frontier-batch-m38.py
          python3 tools/dev/patch-core-frontier-batch-m41.py
          python3 tools/dev/patch-core-frontier-batch-m42.py
          python3 tools/dev/patch-core-frontier-batch-m43.py
          python3 tools/dev/run-core-frontier-batch-m44.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m44
      - name: Focused label-address matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m44/bin/minic"
          w=build/m44-shapes
          mkdir -p "$w"

          cat > "$w/01_label_address.c" <<'EOF'
          unsigned long f(void) { return ({ __label__ here; here: (unsigned long)&&here; }); }
          EOF

          cat > "$w/02_this_ip_call.c" <<'EOF'
          void sink(unsigned long, unsigned int);
          void f(void) { sink(({ __label__ here; here: (unsigned long)&&here; }), 512U); }
          EOF

          cat > "$w/03_forward_address.c" <<'EOF'
          void *f(void) { void *p = &&later; later: return p; }
          EOF

          cat > "$w/04_same_label.c" <<'EOF'
          int f(void) { return ({ __label__ here; here: &&here == &&here; }); }
          EOF

          cat > "$w/05_preempt_add_barrier.c" <<'EOF'
          void f(volatile int *p, int v) { *p += v; __asm__ __volatile__("" ::: "memory"); }
          EOF

          cat > "$w/06_local_bh_shape.c" <<'EOF'
          static void helper(volatile int *p, unsigned long ip, unsigned int cnt) {
              (void)ip;
              *p += (int)cnt;
              __asm__ __volatile__("" ::: "memory");
          }
          void f(volatile int *p) {
              helper(p, ({ __label__ here; here: (unsigned long)&&here; }), 512U);
          }
          EOF

          failures=0
          for src in "$w"/*.c; do
            n=$(basename "$src" .c)
            set +e
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$n.s" 2>"$w/$n.err"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              printf 'M44_SHAPE_PASS name=%s\n' "$n"
            else
              failures=$((failures + 1))
              printf 'M44_SHAPE_FAIL name=%s rc=%d\n' "$n" "$rc"
              sed -n '1,12p' "$w/$n.err"
            fi
          done
          printf 'M44_SHAPE_MATRIX failures=%d\n' "$failures"
          test "$failures" -eq 0
      - name: RISC-V label-address differential
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m44/bin/minic"
          w=build/m44-qemu
          mkdir -p "$w"
          cat > "$w/f.c" <<'EOF'
          unsigned long f(void) { return ({ __label__ here; here: (unsigned long)&&here; }); }
          int same(void) { return ({ __label__ here; here: &&here == &&here; }); }
          EOF
          cat > "$w/main.c" <<'EOF'
          #include <stdio.h>
          unsigned long f(void);
          int same(void);
          int main(void) { printf("%d %d\n", f() != 0UL, same()); return 0; }
          EOF
          MINIC_CORE_IR=strict "$c" -S "$w/f.c" -o "$w/minic.s"
          riscv64-linux-gnu-gcc -O0 -static "$w/main.c" "$w/minic.s" -o "$w/minic.elf"
          qemu-riscv64 "$w/minic.elf" > "$w/minic.out"
          riscv64-linux-gnu-gcc -O0 -static "$w/main.c" "$w/f.c" -o "$w/gcc.elf"
          qemu-riscv64 "$w/gcc.elf" > "$w/gcc.out"
          diff -u "$w/gcc.out" "$w/minic.out"
          grep -Fx '1 1' "$w/minic.out"
          echo M44_QEMU_DIFF_PASS
      - name: Frozen local_bh representative moves
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m44/bin/minic"
          w=build/m44-rep
          mkdir -p "$w"
          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/version.i -o "$w/version.s" 2>"$w/version.err"
          rc=$?
          set -e
          head -12 "$w/version.err" || true
          ! grep -Fq "Core IR shadow does not yet support function 'local_bh_disable'" "$w/version.err"
          ! grep -Fq "Core IR shadow lowering failed for function 'local_bh_disable'" "$w/version.err"
          printf 'M44_LOCAL_BH_MOVED rc=%d\n' "$rc"
      - name: Frozen strict first500
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m44/bin/minic"
          w="$GITHUB_WORKSPACE/build/m44-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$c" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$w" --jobs 5 --offset 0 --limit 500 --sample-count 0 --indices ''
          rc=$?
          set -e
          printf 'M44_REPLAY_RC=%d\n' "$rc"
          python3 tools/ci/classify-core-strict-frontier.py "$w/batch-results.json" --examples 5 --json-out "$w/frontier-summary.json" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m44-strict500/frontier-summary.json').read_text())
          assert s['selected']==500 and s['error']==0 and s['preprocess_missing']==0, s
          print(f"M44_SUMMARY selected=500 pass={s['pass']} unsupported={s['unsupported']} error=0 distinct={len(s['blockers'])}")
          for r in s['blockers'][:25]: print(f"M44_BLOCKER count={r['count']} function={r['function']}")
          PY
