name: Core M45c Exact Cpumask Diagnose

on:
  pull_request:

jobs:
  diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Expose exact frozen cpumask body
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/linux-focus-corpus/kbuild/init/version.i')
          text = p.read_text(errors='replace')
          needle = 'cpumask_any_but('
          positions=[]
          at=0
          while True:
              at=text.find(needle, at)
              if at < 0: break
              positions.append(at)
              at += len(needle)
          print(f'M45C_CPUMASK_OCCURRENCES count={len(positions)}')
          for serial,pos in enumerate(positions[:8]):
              line=text.count('\n',0,pos)+1
              print(f'M45C_OCCURRENCE serial={serial} line={line}')
              lo=text.rfind('\n',0,max(0,pos-1200))+1
              hi=text.find('\n',min(len(text),pos+2200))
              if hi < 0: hi=len(text)
              chunk=text[lo:hi]
              print('M45C_CHUNK_BEGIN')
              print(chunk)
              print('M45C_CHUNK_END')
          # Find the definition occurrence and brace-match it exactly.
          for pos in positions:
              brace=text.find('{',pos,pos+1500)
              semi=text.find(';',pos,pos+1500)
              if brace < 0 or (semi >= 0 and semi < brace):
                  continue
              depth=0
              quote=None
              esc=False
              end=None
              i=brace
              while i < len(text):
                  ch=text[i]
                  if quote is not None:
                      if esc: esc=False
                      elif ch == '\\': esc=True
                      elif ch == quote: quote=None
                  elif ch in ('"', "'"):
                      quote=ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end=i+1
                          break
                  i += 1
              if end is not None:
                  start=text.rfind('\n',0,max(0,pos-800))+1
                  body=text[start:end]
                  print(f'M45C_DEFINITION line={text.count(chr(10),0,pos)+1} bytes={len(body)}')
                  print('M45C_DEFINITION_BEGIN')
                  print(body)
                  print('M45C_DEFINITION_END')
                  break
          PY
      - name: Apply M31b through M45 and build
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          python3 tools/dev/patch-core-frontier-batch-m38.py
          python3 tools/dev/patch-core-frontier-batch-m41.py
          python3 tools/dev/patch-core-frontier-batch-m42.py
          python3 tools/dev/patch-core-frontier-batch-m43.py
          python3 tools/dev/run-core-frontier-batch-m44.py
          python3 tools/dev/patch-core-frontier-batch-m45.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m45c
      - name: Confirm exact frozen blocker
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m45c/bin/minic"
          w=build/m45c-rep
          mkdir -p "$w"
          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/version.i -o "$w/version.s" 2>"$w/version.err"
          rc=$?
          set -e
          head -4 "$w/version.err" || true
          if ! grep -Fq "Core IR shadow does not yet support function 'cpumask_any_but'" "$w/version.err"; then
            echo 'M45C_UNEXPECTED_REPRESENTATIVE_CHANGE'
            exit 1
          fi
          printf 'M45C_CPUMASK_CONFIRMED rc=%d\n' "$rc"
