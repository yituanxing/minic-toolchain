name: Core M45b Cpumask Diagnose

on:
  pull_request:

jobs:
  diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply M31b through M45 and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          python3 tools/dev/patch-core-frontier-batch-m38.py
          python3 tools/dev/patch-core-frontier-batch-m41.py
          python3 tools/dev/patch-core-frontier-batch-m42.py
          python3 tools/dev/patch-core-frontier-batch-m43.py
          python3 tools/dev/run-core-frontier-batch-m44.py
          python3 tools/dev/patch-core-frontier-batch-m45.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m45b
      - name: Cpumask shape matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m45b/bin/minic"
          w=build/m45b-shapes
          mkdir -p "$w"

          cat > "$w/01_signed_break.c" <<'EOF'
          unsigned int f(int cpu) {
              unsigned int i;
              for (i = 0U; i < 8U; ++i)
                  if (i != cpu)
                      break;
              return i;
          }
          EOF

          cat > "$w/02_check_call.c" <<'EOF'
          extern unsigned int check(unsigned int);
          unsigned int f(int cpu) {
              if (cpu != -1)
                  check(cpu);
              return 0U;
          }
          EOF

          cat > "$w/03_call_init_update.c" <<'EOF'
          extern unsigned long first(const unsigned long *, unsigned int);
          extern unsigned long next(const unsigned long *, unsigned int, unsigned long);
          unsigned int f(const unsigned long *bits, int cpu) {
              unsigned int i;
              for (i = first(bits, 64U); i < 64U; i = next(bits, 64U, (unsigned long)i + 1UL))
                  if (i != cpu)
                      break;
              return i;
          }
          EOF

          cat > "$w/04_member_array_decay.c" <<'EOF'
          struct mask { unsigned long bits[1]; };
          extern unsigned long first(const unsigned long *, unsigned int);
          unsigned int f(const struct mask *mask) {
              return (unsigned int)first(mask->bits, 64U);
          }
          EOF

          cat > "$w/05_member_array_loop.c" <<'EOF'
          struct mask { unsigned long bits[1]; };
          extern unsigned long first(const unsigned long *, unsigned int);
          extern unsigned long next(const unsigned long *, unsigned int, unsigned long);
          unsigned int f(const struct mask *mask, int cpu) {
              unsigned int i;
              for (i = first(mask->bits, 64U); i < 64U;
                   i = next(mask->bits, 64U, (unsigned long)i + 1UL))
                  if (i != cpu)
                      break;
              return i;
          }
          EOF

          for src in "$w"/*.c; do
            n=$(basename "$src" .c)
            set +e
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$n.s" 2>"$w/$n.err"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              printf 'M45B_SHAPE_PASS name=%s\n' "$n"
            else
              printf 'M45B_SHAPE_FAIL name=%s rc=%d\n' "$n" "$rc"
              sed -n '1,8p' "$w/$n.err"
            fi
          done

      - name: Frozen representative must still expose cpumask
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m45b/bin/minic"
          w=build/m45b-rep
          mkdir -p "$w"
          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/version.i -o "$w/version.s" 2>"$w/version.err"
          rc=$?
          set -e
          head -4 "$w/version.err" || true
          if ! grep -Fq "Core IR shadow does not yet support function 'cpumask_any_but'" "$w/version.err"; then
            echo 'M45B_UNEXPECTED_REPRESENTATIVE_CHANGE'
            exit 1
          fi
          printf 'M45B_CPUMASK_CONFIRMED rc=%d\n' "$rc"
