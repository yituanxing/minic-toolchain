name: Staging Core Parameter Unsupported V1

on:
  push:
    branches:
      - staging/core-parameter-unsupported-v1

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish-v1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user

      - name: Apply Core parameter tri-state fix
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/core_lower.c')
          s = p.read_text()
          old = '''        parameter = minic_c0_program_local(context->body->program, local_id);
                  if (parameter == NULL ||
                      !minic_type_equal(parameter->type,
                                        context->source_function->parameter_types[parameter_index])) {
                      return MINIC_CORE_LOWER_ERROR;
                  }
                  if (!minic_type_is_integer(parameter->type) || minic_type_is_const(parameter->type) ||
                      minic_type_is_volatile(parameter->type) || parameter->is_array ||
                      parameter->is_register_storage) {
                      return MINIC_CORE_LOWER_UNSUPPORTED;
                  }
          '''
          new = '''        parameter = minic_c0_program_local(context->body->program, local_id);
                  if (parameter == NULL) {
                      return MINIC_CORE_LOWER_ERROR;
                  }
                  if (!minic_type_is_integer(parameter->type) || minic_type_is_const(parameter->type) ||
                      minic_type_is_volatile(parameter->type) || parameter->is_array ||
                      parameter->is_register_storage) {
                      return MINIC_CORE_LOWER_UNSUPPORTED;
                  }
                  if (!minic_type_equal(parameter->type,
                                        context->source_function->parameter_types[parameter_index])) {
                      return MINIC_CORE_LOWER_ERROR;
                  }
          '''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/core/run-core-ir-shadow.sh')
          s = p.read_text()
          anchor = '''check_strict_case parameter
          '''
          assert s.count(anchor) == 1
          addition = anchor + '''
          cat >"$work_dir/qualified-parameter.i" <<'EOF'
          unsigned long qualified_parameter(const unsigned long value) {
              return value;
          }
          EOF

          "$MINIC" -S "$work_dir/qualified-parameter.i" -o "$work_dir/qualified-parameter-normal.s"
          MINIC_CORE_IR=shadow "$MINIC" -S "$work_dir/qualified-parameter.i" \
              -o "$work_dir/qualified-parameter-shadow.s"
          cmp "$work_dir/qualified-parameter-normal.s" "$work_dir/qualified-parameter-shadow.s"
          if MINIC_CORE_IR=strict "$MINIC" -S "$work_dir/qualified-parameter.i" \
              -o "$work_dir/qualified-parameter-strict.s" 2>"$work_dir/qualified-parameter-strict.err"; then
              echo "strict Core IR shadow unexpectedly accepted a qualified parameter" >&2
              exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'qualified_parameter'" \
              "$work_dir/qualified-parameter-strict.err" >/dev/null
          '''
          p.write_text(s.replace(anchor, addition, 1))
          PY

      - name: Canonical formatting
        run: clang-format -i src/core/core_lower.c

      - name: Release Werror build
        run: make -j4 MODE=release BUILD_DIR=build/staging-core-parameter CFLAGS_EXTRA='-Werror'

      - name: Core shadow tri-state regression
        env:
          MINIC: ${{ github.workspace }}/build/staging-core-parameter/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/staging-core-parameter
        run: bash tests/core/run-core-ir-shadow.sh

      - name: Official full compiler C0 gate
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Foundation focused suite
        env:
          MINIC: ${{ github.workspace }}/build/staging-core-parameter/bin/minic
          HOST_CC: cc
          BUILD_DIR: ${{ github.workspace }}/build/staging-core-parameter-foundation
        run: sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish validated product diff
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add src/core/core_lower.c tests/core/run-core-ir-shadow.sh
          git diff --cached --check
          git commit -m 'core: classify unsupported parameter forms [publish-v1]'
          git push origin HEAD:staging/core-parameter-unsupported-v1
