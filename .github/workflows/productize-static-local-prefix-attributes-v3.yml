name: Productize Static Local Prefix Attributes V3
on:
  push:
    branches: [product/static-local-prefix-attributes-v3]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/static-local-prefix-attributes-v3
          fetch-depth: 0
      - name: Apply validated static-local prefix attribute support
        run: |
          set -Eeuo pipefail
          mat=tools/dev/.productize-static-local-prefix-v3.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-static-local-prefix-attributes-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat > tests/compiler/c0/static_local_prefix_attributes.c <<'EOF'
          struct key { long value; };
          static long run(void) {
              static __attribute__((__unused__)) struct key key_value;
              static __attribute__((__unused__)) long scalar;
              return key_value.value + scalar;
          }
          int main(void) { return (int)run(); }
          EOF
          cat > tests/compiler/c0/run-static-local-prefix-attributes.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/static-local-prefix-attributes
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/static_local_prefix_attributes.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-static-local-prefix-attributes.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-static-local-prefix-attributes.sh"
          EOF
          clang-format-18 -i src/frontend/parser_statement.c tests/compiler/c0/static_local_prefix_attributes.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/static-local-prefix-v3
          MINIC="$GITHUB_WORKSPACE/build/static-local-prefix-v3/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/static-local-prefix-v3" \
            sh tests/compiler/c0/run-static-local-prefix-attributes.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/static-local-prefix-v3-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-static-local-prefix-attributes-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_statement.c tests/compiler/c0/static_local_prefix_attributes.c tests/compiler/c0/run-static-local-prefix-attributes.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: accept GNU attributes after static local storage'
          git push origin HEAD:product/static-local-prefix-attributes-v3
