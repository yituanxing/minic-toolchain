name: PR127 Materialize File-Scope Basic Asm v2
on:
  push:
    branches: [agent/file-scope-basic-asm-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize file-scope basic asm
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr127-materialize.py
          python3 tools/dev/pr127-fix.py
          chmod +x tests/compiler/c0/run-file-scope-basic-asm.sh
          clang-format-18 -i \
            src/frontend/ast.h \
            src/frontend/ast.c \
            src/frontend/ast_verifier.c \
            src/frontend/parser_function.c \
            src/target/riscv64/codegen_function.c \
            tests/compiler/c0/file_scope_basic_asm.c \
            tests/compiler/c0/invalid_file_scope_basic_asm_qualifier.c \
            tests/compiler/c0/invalid_file_scope_basic_asm_operands.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr127-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-file-scope-basic-asm.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr127-materialize.py \
            tools/dev/pr127-fix.py \
            .github/workflows/pr127-materialize-file-asm.yml \
            .github/workflows/pr127-materialize-file-asm-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): support file-scope basic asm'
          git push origin HEAD:agent/file-scope-basic-asm-v0
