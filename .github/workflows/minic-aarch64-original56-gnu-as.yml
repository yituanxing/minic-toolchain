name: MiniC AArch64 original Linux 6.6 56-owner GNU AS

# Replay only the original 7x8 failed owners from a completed GNU Linux
# campaign. Success is relocatable ELF evidence, NOT a Linux Image/P1 boot.
on:
  pull_request:
    paths:
      - '.github/workflows/minic-aarch64-original56-gnu-as.yml'
      - 'tools/ci/minic-aarch64-original56-gnu-as-v1.py'
      - 'src/compiler/**'
      - 'src/core/**'
      - 'src/frontend/**'
      - 'src/target/aarch64/**'
      - 'src/target/common/**'
      - 'src/target/source_policy/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minic-aarch64-original56-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact-original-fifty-six-gnu-as:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Fetch only seven sealed original GNU .i/.cmd failure artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 42345808682
          github-token: ${{ github.token }}
          pattern: minic-linux-seven-failure-aarch64-*
          merge-multiple: false
          path: ${{ runner.temp }}/aarch64-original56

      - name: Install AArch64 GNU binutils
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$sources" ]] && grep -q 'azure.archive.ubuntu.com' "$sources"; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$sources"
            fi
          done
          timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o DPkg::Lock::Timeout=60 install -y --no-install-recommends binutils-aarch64-linux-gnu
          command -v aarch64-linux-gnu-as
          command -v aarch64-linux-gnu-readelf

      - name: Restore compiler objects at identical HEAD
        id: obj_cache
        uses: actions/cache/restore@v4
        with:
          path: build/aarch-original56-ci/obj
          key: minic-aarch-original56-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build exactly one MiniC with strict warnings
        run: make -j2 MODE=release CFLAGS=-Werror BUILD_DIR=build/aarch-original56-ci build/aarch-original56-ci/bin/minic-cc

      - name: Save compiler objects before any source failure
        if: steps.obj_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/aarch-original56-ci/obj
          key: minic-aarch-original56-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.head.sha || github.sha }}

      - name: SHA-validate 56 original owners and use GNU AS for every object
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          mkdir -p build/aarch-original56-ci/evidence
          {
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'ORIGINAL_RUN=42345808682\n'
            sha256sum build/aarch-original56-ci/bin/minic-cc
            aarch64-linux-gnu-as --version | head -n 1
          } | tee build/aarch-original56-ci/origins.receipt
          python3 tools/ci/minic-aarch64-original56-gnu-as-v1.py \
            --artifact-root "$RUNNER_TEMP/aarch64-original56" \
            --minic build/aarch-original56-ci/bin/minic-cc \
            --output build/aarch-original56-ci/evidence \
            | tee build/aarch-original56-ci/original56.receipt
          grep -Fxq \
            'AARCH_ORIGINAL56_GNU_AS=PASS owners=56/56 source_run=42345808682 gcc_fallback=NO Linux_Image_P1=NOT_RUN' \
            build/aarch-original56-ci/original56.receipt

      - name: Preserve ELF evidence and exact failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-aarch64-original56-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/aarch-original56-ci/origins.receipt
            build/aarch-original56-ci/original56.receipt
            build/aarch-original56-ci/evidence/*
          if-no-files-found: warn
          retention-days: 14
