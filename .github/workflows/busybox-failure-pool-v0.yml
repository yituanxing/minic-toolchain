name: BusyBox Failure Pool V0

on:
  push:
    branches:
      - external/busybox-full-driver-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busybox-failure-pool-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  busybox-sample16-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 build and runtime prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross linux-libc-dev-riscv64-cross \
            qemu-user bzip2 curl ca-certificates

      - name: Build current Mini toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/busybox-full-driver-v0 all
          echo "BUSYBOX_MINI_TOOLCHAIN=PASS"

      - name: Validate scoped enum constant regression
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DIR=build/busybox-full-driver-v0 \
          MINIC="$GITHUB_WORKSPACE/build/busybox-full-driver-v0/bin/minic" \
            sh tests/compiler/c0/run-enum-constant-scopes.sh

      - name: Validate MiniPP byte-identical A0
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIPP="$GITHUB_WORKSPACE/build/busybox-full-driver-v0/bin/minic-cpp" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/busybox-full-driver-v0" \
          REFERENCE_CPP=gcc \
            sh tests/preprocessor/run-a0.sh

      - name: Validate implicit arithmetic assignment conversions
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/busybox-full-driver-v0/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/busybox-full-driver-v0" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-cast-expressions.sh

      - name: Validate BusyBox arithmetic and variadic regression batch
        shell: bash
        run: |
          set -Eeuo pipefail
          export MINIC="$GITHUB_WORKSPACE/build/busybox-full-driver-v0/bin/minic"
          export BUILD_DIR="$GITHUB_WORKSPACE/build/busybox-full-driver-v0"
          sh tests/compiler/c0/run-float-binary-arithmetic.sh

      - name: Fetch pinned BusyBox 1.38.0 and musl 1.2.5
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/busybox-full-driver-v0"
          mkdir -p "$work"

          busybox_sha=fc71374dfccd46448c62947269a35f1420d7ee28
          busybox_src="$work/busybox-1.38.0"
          rm -rf "$busybox_src"
          git init -q "$busybox_src"
          git -C "$busybox_src" remote add origin \
            https://github.com/vda-linux/busybox_mirror.git
          git -C "$busybox_src" fetch -q --depth=1 origin "$busybox_sha"
          git -C "$busybox_src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$busybox_src" rev-parse HEAD)" = "$busybox_sha"
          grep -q '^VERSION = 1$' "$busybox_src/Makefile"
          grep -q '^PATCHLEVEL = 38$' "$busybox_src/Makefile"
          grep -q '^SUBLEVEL = 0$' "$busybox_src/Makefile"
          grep -q '^EXTRAVERSION =$' "$busybox_src/Makefile"
          rm -rf "$busybox_src/.git"
          echo "BUSYBOX_SOURCE_GIT=PASS release=1.38.0 commit=$busybox_sha"

          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz \
            -o "$work/musl-1.2.5.tar.gz"
          printf '%s  %s\n' \
            a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4 \
            "$work/musl-1.2.5.tar.gz" | sha256sum -c -
          tar -xzf "$work/musl-1.2.5.tar.gz" -C "$work"
          echo "BUSYBOX_SOURCE=PASS release=1.38.0 musl=1.2.5"

      - name: Prepare musl headers for fast producer probes
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/busybox-full-driver-v0"
          src="$work/musl-1.2.5"
          out="$work/musl-build"
          sysroot="$work/musl-sysroot"
          mkdir -p "$out" "$sysroot/usr/include"

          cp -a /usr/riscv64-linux-gnu/include/linux "$sysroot/usr/include/"
          cp -a /usr/riscv64-linux-gnu/include/asm "$sysroot/usr/include/"
          cp -a /usr/riscv64-linux-gnu/include/asm-generic "$sysroot/usr/include/"
          cp -a /usr/riscv64-linux-gnu/include/mtd "$sysroot/usr/include/"

          cd "$out"
          CFLAGS="-O2 -fno-pic -fno-pie" \
          CC=riscv64-linux-gnu-gcc \
          AR=riscv64-linux-gnu-ar \
          RANLIB=riscv64-linux-gnu-ranlib \
            "$src/configure" \
              --target=riscv64-linux-gnu \
              --disable-shared \
              --prefix=/usr \
            >"$work/musl-configure.log" 2>&1
          make DESTDIR="$sysroot" install-headers \
            >"$work/musl-install-headers.log" 2>&1

          test -s "$sysroot/usr/include/stdio.h"
          echo "BUSYBOX_MUSL_HEADERS=PASS"

      - name: Prepare frozen V222 408-applet profile
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/busybox-full-driver-v0"
          fixture="$GITHUB_WORKSPACE/tests/linker/fixtures"
          src="$work/busybox-1.38.0"
          out="$work/busybox-out"

          cat \
            "$fixture/busybox-v222.config.part00" \
            "$fixture/busybox-v222.config.part01" \
            "$fixture/busybox-v222.config.part02" \
            "$fixture/busybox-v222.config.part03" \
            "$fixture/busybox-v222.config.part04" \
            >"$work/busybox-v222.config"

          cfg_hash="$(sha256sum "$work/busybox-v222.config" | awk '{print $1}')"
          app_hash="$(sha256sum "$fixture/busybox-v222.applet-list.txt" | awk '{print $1}')"
          test "$cfg_hash" = "5977f8e325530d35a9ee4a332b2531e85705f2216279b79090baaebd3cbaf809"
          test "$app_hash" = "372c678111d15f760f1272dddacc807d792a108505ffb62097e2e4f488852177"
          test "$(wc -l <"$fixture/busybox-v222.applet-list.txt")" -eq 408

          mkdir -p "$out"
          cp "$work/busybox-v222.config" "$out/.config"
          set +e
          yes "" | make -C "$src" O="$out" oldconfig HOSTCC=/usr/bin/cc \
            >"$work/busybox-oldconfig.log" 2>&1
          rc=${PIPESTATUS[1]}
          set -e
          test "$rc" -eq 0
          grep -q '^CONFIG_STATIC=y$' "$out/.config"
          grep -q '^CONFIG_ASH=y$' "$out/.config"

          # The real BusyBox make graph generates this before target C compilation.
          # The direct sample lane intentionally bypasses that graph, so reproduce
          # the same generated header once rather than making every probe recurse.
          (
            cd "$out"
            "$src/scripts/generate_BUFSIZ.sh" include/common_bufsiz.h
          )
          test -s "$out/include/common_bufsiz.h"
          echo "BUSYBOX_PROFILE=PASS applets=408 sha256=$cfg_hash"

      - name: Drive BusyBox C producer through Mini
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/busybox-full-driver-v0"
          src="$work/busybox-1.38.0"
          out="$work/busybox-out"
          sysroot="$work/musl-sysroot"
          musl="$work/musl-build"
          wrapper="$work/minic-busybox-wrapper.sh"
          results="$work/busybox-c-results.tsv"
          libgcc="$(riscv64-linux-gnu-gcc -print-libgcc-file-name)"
          uapi="$GITHUB_WORKSPACE/tests/linker/fixtures/busybox-uapi"
          : >"$results"

          test -f "$uapi/linux/pkt_sched.h"

          cat >"$wrapper" <<'SH'
          #!/usr/bin/env bash
          set -u
          : "${BUSYBOX_MINIC:?}"
          : "${BUSYBOX_MINI_SYSROOT:?}"
          : "${BUSYBOX_MUSL_BUILD:?}"
          : "${BUSYBOX_LIBGCC:?}"
          : "${BUSYBOX_UAPI_COMPAT:?}"
          : "${BUSYBOX_C_RESULTS:?}"

          # BusyBox probes CC for compiler identity before any target compile.
          # Keep those build-system queries on the known GNU cross driver; only
          # real target C producers below are routed through Mini.
          for arg in "$@"; do
            case "$arg" in
              -dumpversion|-dumpfullversion|-dumpmachine)
                exec riscv64-linux-gnu-gcc "$@"
                ;;
            esac
          done

          compile=0
          relocatable=0
          dep_only=0
          source=
          output=
          depfile=
          dep_target=
          previous=
          for arg in "$@"; do
            case "$arg" in
              -c|-E|-S) compile=1 ;;
              -r) relocatable=1 ;;
              -M|-MM) dep_only=1 ;;
              *.c|*.S|*.s) source="$arg" ;;
            esac
            if test "$previous" = "-o"; then
              output="$arg"
            elif test "$previous" = "-MF"; then
              depfile="$arg"
            elif test "$previous" = "-MT" || test "$previous" = "-MQ"; then
              dep_target="$arg"
            fi
            case "$arg" in
              -Wp,-MD,*) depfile="${arg#-Wp,-MD,}" ;;
              -Wp,-MMD,*) depfile="${arg#-Wp,-MMD,}" ;;
            esac
            previous="$arg"
          done

          if test "$relocatable" -eq 1; then
            exec riscv64-linux-gnu-gcc \
              --sysroot="$BUSYBOX_MINI_SYSROOT/.." -nostdlib "$@"
          fi

          if test "$dep_only" -eq 1 || test "${source##*.}" = "S" || test "${source##*.}" = "s"; then
            exec riscv64-linux-gnu-gcc \
              --sysroot="$BUSYBOX_MINI_SYSROOT/.." \
              -I"$BUSYBOX_UAPI_COMPAT" -fno-pic -fno-pie "$@"
          fi

          if test "$compile" -eq 1 && test "${source##*.}" = "c"; then
            filtered=()
            skip=0
            for arg in "$@"; do
              if test "$skip" -eq 1; then
                skip=0
                continue
              fi
              case "$arg" in
                -Wall|-W*|-O|-O0|-O1|-O2|-O3|-Os|-Og|-Ofast|-pipe)
                  ;;
                -g|-g0|-g1|-g2|-g3)
                  ;;
                -fno-builtin*|-fno-strict-aliasing|-fomit-frame-pointer|\
                -ffunction-sections|-fdata-sections|-fno-asynchronous-unwind-tables|\
                -fno-unwind-tables|-fno-stack-protector|-fno-pic|-fno-pie|-fno-PIE)
                  ;;
                -march=*|-mabi=*|-mcmodel=*|-mno-*)
                  ;;
                -std=*)
                  ;;
                -MD|-MMD|-MP)
                  ;;
                -MF|-MT|-MQ)
                  skip=1
                  ;;
                -Wp,*)
                  ;;
                *)
                  filtered+=("$arg")
                  ;;
              esac
            done

            set +e
            timeout 120s "$BUSYBOX_MINIC" --sysroot "$BUSYBOX_MINI_SYSROOT" \
              -I"$BUSYBOX_UAPI_COMPAT" "${filtered[@]}"
            rc=$?

            # Mini does not consume GCC/Kbuild depfile switches yet. Generate
            # dependency metadata separately without letting GNU produce the
            # target object; the .o remains exclusively MiniPP/MiniC/MiniAS.
            if test "$rc" -eq 0 && test -n "$depfile"; then
              dep_cpp_args=()
              dep_expect=
              for arg in "$@"; do
                if test -n "$dep_expect"; then
                  dep_cpp_args+=("$dep_expect" "$arg")
                  dep_expect=
                  continue
                fi
                case "$arg" in
                  -I|-D|-U|-include|-isystem|-iquote)
                    dep_expect="$arg"
                    ;;
                  -I*|-D*|-U*|-include*|-isystem*|-iquote*)
                    dep_cpp_args+=("$arg")
                    ;;
                esac
              done
              mkdir -p "$(dirname -- "$depfile")"
              riscv64-linux-gnu-gcc \
                --sysroot="$BUSYBOX_MINI_SYSROOT/.." \
                -I"$BUSYBOX_UAPI_COMPAT" "${dep_cpp_args[@]}" \
                -MMD -MF "$depfile" -MT "${dep_target:-$output}" \
                -E "$source" -o /dev/null
              dep_rc=$?
              if test "$dep_rc" -ne 0; then
                rc=$dep_rc
              fi
            fi
            set -e
            status=FAIL
            test "$rc" -eq 0 && status=PASS
            {
              flock 9
              printf '%s\t%s\t%s\t%s\n' "$source" "$status" "$rc" "$output" >&9
            } 9>>"$BUSYBOX_C_RESULTS"
            if test "$rc" -ne 0; then
              echo "BUSYBOX_MINI_C_FAIL source=$source output=$output rc=$rc" >&2
            fi
            exit "$rc"
          fi

          filtered=()
          for arg in "$@"; do
            case "$arg" in
              -lm|-lcrypt|-lrt|-lresolv|-lpthread|-lc)
                ;;
              *)
                filtered+=("$arg")
                ;;
            esac
          done
          exec riscv64-linux-gnu-gcc \
            --sysroot="$BUSYBOX_MINI_SYSROOT/.." \
            -nostdlib -static -Wl,-e,_start \
            "$BUSYBOX_MUSL_BUILD/obj/crt/crt1.o" \
            "$BUSYBOX_MUSL_BUILD/obj/crt/crti.o" \
            "${filtered[@]}" \
            -Wl,--start-group \
            "$BUSYBOX_MUSL_BUILD/lib/libc.a" \
            "$BUSYBOX_LIBGCC" \
            -Wl,--end-group \
            "$BUSYBOX_MUSL_BUILD/obj/crt/crtn.o"
          SH
          chmod +x "$wrapper"

          export BUSYBOX_MINIC="$work/bin/minic"
          export BUSYBOX_MINI_SYSROOT="$sysroot/usr"
          export BUSYBOX_MUSL_BUILD="$musl"
          export BUSYBOX_LIBGCC="$libgcc"
          export BUSYBOX_UAPI_COMPAT="$uapi"
          export BUSYBOX_C_RESULTS="$results"
          unset MINIC_KEEP_FAILED_TEMPS
          export CORE_FAST_TRACE=1

          mkdir -p "$out/include2"
          ln -fsn "$src/include/asm-x86_64" "$out/include2/asm"

          targets=(
            archival/libarchive/decompress_gunzip.o
            archival/unzip.o
            runit/runsv.o
            util-linux/mkfs_vfat.o
            networking/ifenslave.o
            networking/ifplugd.o
            networking/udhcp/dhcpc.o
            networking/libiproute/ll_types.o
            miscutils/ubirename.o
            editors/awk.o
            networking/brctl.o
            networking/tc.o
            sysklogd/syslogd_and_logger.o
            libbb/progress.o
            libbb/xconnect.o
            libbb/xreadlink.o
          )

          compile_target() {
            target="$1"
            rel="${target%.o}.c"
            dir="${rel%/*}"
            file="${rel##*/}"
            base="${file%.c}"
            mkdir -p "$out/$dir"
            log="$work/sample-${base}.log"
            set +e
            (
              cd "$out"
              timeout 90s "$wrapper" \
                "-Wp,-MD,$dir/.$base.o.d" \
                -Iinclude -Ilibbb -Iinclude2 \
                -I"$src/include" -I"$src/libbb" \
                -include include/autoconf.h \
                -D_GNU_SOURCE -DNDEBUG -D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE \
                -D_FILE_OFFSET_BITS=64 -D_TIME_BITS=64 '-DBB_VER="1.38.0"' \
                -I"$src/$dir" -I"$dir" \
                "-DKBUILD_BASENAME=\"$base\"" "-DKBUILD_MODNAME=\"$base\"" \
                -c -o "$target" "$src/$rel"
            ) >"$log" 2>&1
            rc=$?
            set -e
            printf '%s\t%s\n' "$target" "$rc" >>"$work/sample-status.tsv"
            return 0
          }
          export -f compile_target
          export work src out wrapper

          : >"$work/sample-status.tsv"
          started="$(date +%s)"
          printf '%s\n' "${targets[@]}" | xargs -n1 -P4 bash -c 'compile_target "$1"' _
          elapsed=$(( $(date +%s) - started ))
          cat "$work"/sample-*.log >"$work/busybox-mini-build.log" || true
          build_rc=0
          if awk -F '\t' '$2 != 0 { bad=1 } END { exit bad ? 0 : 1 }' "$work/sample-status.tsv"; then
            build_rc=2
          fi

          total="$(wc -l <"$results")"
          passed="$(awk -F '\t' '$2=="PASS"{n++} END{print n+0}' "$results")"
          failed="$(awk -F '\t' '$2=="FAIL"{n++} END{print n+0}' "$results")"
          unique_sources="$(cut -f1 "$results" | sort -u | wc -l)"
          echo "BUSYBOX_C_FRONTIER selected=$total unique=$unique_sources pass=$passed fail=$failed make_rc=$build_rc elapsed_s=$elapsed"

          if test "$failed" -ne 0 || test "$build_rc" -ne 0 || test "$unique_sources" -ne 16; then
            echo "BUSYBOX_C_FAILURE_POOL_BEGIN"
            awk -F '\t' '$2=="FAIL"{print}' "$results" | head -n 80
            echo "BUSYBOX_C_FAILURE_POOL_END"
            tail -n 240 "$work/busybox-mini-build.log"
            exit 1
          fi

          test "$unique_sources" -eq 16
          echo "BUSYBOX_ACTIVE_SAMPLE16_V0=PASS selected=$total unique=$unique_sources pipeline=MiniPP,MiniC,MiniAS"

      - name: Run 408-applet BusyBox acceptance
        if: false
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/busybox-full-driver-v0"
          out="$work/busybox-out"
          fixture="$GITHUB_WORKSPACE/tests/linker/fixtures"

          qemu-riscv64 "$out/busybox_unstripped" --list \
            >"$work/busybox-mini.applets" 2>"$work/busybox-mini-list.stderr"
          test "$(wc -l <"$work/busybox-mini.applets")" -eq 408
          cmp "$fixture/busybox-v222.applet-list.txt" "$work/busybox-mini.applets"

          qemu-riscv64 "$out/busybox_unstripped" ash -c \
            'i=1; s=0; while [ "$i" -le 100 ]; do s=$((s+i)); i=$((i+1)); done; echo ASH_OK "$s"' \
            >"$work/busybox-mini-ash.stdout" 2>"$work/busybox-mini-ash.stderr"
          grep -q '^ASH_OK 5050$' "$work/busybox-mini-ash.stdout"
          echo "BUSYBOX_C_RUNTIME_V0=PASS applets=408 ash=PASS"

      - name: Keep fast-lane evidence compact
        if: always()
        shell: bash
        run: |
          set -u
          work="$GITHUB_WORKSPACE/build/busybox-full-driver-v0"
          echo "BUSYBOX_FAST_EVIDENCE=compact"
          du -sh "$work" || true

      - name: Preserve BusyBox producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: busybox-failure-pool-v0-frontier
          path: |
            build/busybox-full-driver-v0/musl-configure.log
            build/busybox-full-driver-v0/musl-install-headers.log
            build/busybox-full-driver-v0/busybox-oldconfig.log
            build/busybox-full-driver-v0/minic-busybox-wrapper.sh
            build/busybox-full-driver-v0/busybox-c-results.tsv
            build/busybox-full-driver-v0/busybox-mini-build.log
            build/busybox-full-driver-v0/sample-status.tsv
            build/busybox-full-driver-v0/sample-*.log
            build/busybox-full-driver-v0/busybox-mini.applets
            build/busybox-full-driver-v0/busybox-mini-list.stderr
            build/busybox-full-driver-v0/busybox-mini-ash.stdout
            build/busybox-full-driver-v0/busybox-mini-ash.stderr
          if-no-files-found: ignore
          retention-days: 7
