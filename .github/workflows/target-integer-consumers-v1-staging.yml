name: Target Integer Consumers v1 Staging

on:
  push:
    branches:
      - refactor/target-integer-consumers-v1-staging

permissions:
  contents: write

concurrency:
  group: target-integer-consumers-v1-staging
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-04c72dc79c8fe80e89688b7f28f9d47ca006d2c8010871449e857f7427c57c50

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Materialize target integer consumers
        run: |
          set -Eeuo pipefail
          sed -i \
            -e 's/!= 7:/!= 11:/' \
            -e 's/expected 7 type_is_valid calls/expected 11 type_is_valid calls/' \
            -e '/require_absent("src\/frontend\/ast_verifier.c", "minic_type_integer_common(")/d' \
            -e '/require_absent("src\/frontend\/ast_verifier.c", "minic_type_integer_promotion(")/d' \
            -e 's/if path.as_posix() == "src\/frontend\/type.c":/if path.as_posix() in ("src\/frontend\/type.c", "src\/frontend\/const_eval.c", "src\/frontend\/ast_verifier.c"):/' \
            -e 's/if "minic_type_char()" in text:/if path.as_posix() != "src\/target\/target_info.c" and "minic_type_char()" in text:/' \
            tools/dev/materialize-target-integer-consumers-v1.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/target/riscv64/layout_test.c')
          text = path.read_text()
          old = '        MinicIntegerSign plain_char_sign;\n        MinicType promoted_type;\n'
          sentinel = ('        MinicIntegerSign plain_char_sign;\n'
                      '        /* staging-rv64-integer-model-anchor */\n'
                      '        MinicType promoted_type;\n')
          if text.count(old) != 2:
              raise SystemExit(f'layout_test.c: expected two integer-model declaration blocks, found {text.count(old)}')
          path.write_text(text.replace(old, sentinel, 1))
          PY
          python3 tools/dev/materialize-target-integer-consumers-v1.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/target/riscv64/layout_test.c')
          text = path.read_text()
          sentinel = ('        MinicIntegerSign plain_char_sign;\n'
                      '        /* staging-rv64-integer-model-anchor */\n'
                      '        MinicType promoted_type;\n')
          old = '        MinicIntegerSign plain_char_sign;\n        MinicType promoted_type;\n'
          if text.count(sentinel) != 1:
              raise SystemExit('layout_test.c: RV64 staging sentinel missing')
          path.write_text(text.replace(sentinel, old, 1))

          path = Path('src/frontend/ast.c')
          text = path.read_text()
          replacements = [
              (
                  'static bool\nminic_c0_conditional_type_only(MinicType when_true, MinicType when_false, MinicType *result) {',
                  'static bool minic_c0_conditional_type_only(const MinicTargetInfo *target,\n'
                  '                                           MinicType when_true,\n'
                  '                                           MinicType when_false,\n'
                  '                                           MinicType *result) {',
              ),
              (
                  'return minic_c0_conditional_type_only(when_true->type, when_false->type, result);',
                  'return minic_c0_conditional_type_only(\n'
                  '        target, when_true->type, when_false->type, result);',
              ),
          ]
          for old_text, new_text in replacements:
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(f'ast.c: expected one occurrence, found {count}: {old_text}')
              text = text.replace(old_text, new_text)
          path.write_text(text)

          path = Path('src/frontend/ast_verifier.c')
          text = path.read_text()
          replacements = [
              (
                  '!minic_type_integer_promotion(operand->type, &expected_type)',
                  '!minic_target_info_integer_promotion(target, operand->type, &expected_type)',
              ),
              (
                  'minic_type_integer_common(left->type, right->type, &common_type)',
                  'minic_target_info_integer_common(target, left->type, right->type, &common_type)',
              ),
              (
                  'static bool verify_statement(const MinicC0Program *program, const MinicStatement *statement) {',
                  'static bool verify_statement(const MinicC0Program *program,\n'
                  '                             const MinicTargetInfo *target_info,\n'
                  '                             const MinicStatement *statement) {',
              ),
              (
                  'minic_type_integer_common(target->type, expression->type, &common_type)',
                  'minic_target_info_integer_common(\n'
                  '                   target_info, target->type, expression->type, &common_type)',
              ),
              (
                  'if (!verify_statement(program, &program->statements[index])) {',
                  'if (!verify_statement(program, target, &program->statements[index])) {',
              ),
          ]
          for old_text, new_text in replacements:
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(f'ast_verifier.c: expected one occurrence, found {count}: {old_text}')
              text = text.replace(old_text, new_text)
          if 'minic_type_integer_common(' in text or 'minic_type_integer_promotion(' in text:
              raise SystemExit('ast_verifier.c: legacy integer semantic helper remains')
          path.write_text(text)

          path = Path('src/frontend/const_eval.c')
          text = path.read_text()
          replacements = [
              (
                  'minic_type_integer_common(left.type, right.type, &operation_type)',
                  'minic_target_info_integer_common(target, left.type, right.type, &operation_type)',
              ),
              (
                  'minic_type_integer_common(left.type, left.type, &operation_type)',
                  'minic_target_info_integer_promotion(target, left.type, &operation_type)',
              ),
          ]
          for old_text, new_text in replacements:
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(f'const_eval.c: expected one occurrence, found {count}: {old_text}')
              text = text.replace(old_text, new_text)
          if 'minic_type_integer_common(' in text or 'minic_type_integer_promotion(' in text:
              raise SystemExit('const_eval.c: legacy integer semantic helper remains')
          path.write_text(text)

          path = Path('Makefile')
          text = path.read_text()
          replacements = [
              (
                  'RECORD_TEST_SOURCES := \\\n\tsrc/frontend/ast.c \\\n\tsrc/frontend/type.c \\\n\ttests/frontend/record_test.c',
                  'RECORD_TEST_SOURCES := \\\n\tsrc/frontend/ast.c \\\n\tsrc/frontend/type.c \\\n\tsrc/target/data_layout.c \\\n\tsrc/target/target_info.c \\\n\ttests/frontend/record_test.c',
              ),
              (
                  'TYPE_ALIAS_TEST_SOURCES := \\\n\tsrc/frontend/ast.c \\\n\tsrc/frontend/type.c \\\n\ttests/frontend/type_alias_test.c',
                  'TYPE_ALIAS_TEST_SOURCES := \\\n\tsrc/frontend/ast.c \\\n\tsrc/frontend/type.c \\\n\tsrc/target/data_layout.c \\\n\tsrc/target/target_info.c \\\n\ttests/frontend/type_alias_test.c',
              ),
              (
                  'RV64_ABI_TEST_SOURCES := \\\n\tsrc/frontend/ast.c \\\n\tsrc/frontend/ast_global.c \\\n\tsrc/frontend/type.c \\\n\tsrc/target/data_layout.c \\\n\tsrc/target/riscv64/abi.c',
                  'RV64_ABI_TEST_SOURCES := \\\n\tsrc/frontend/ast.c \\\n\tsrc/frontend/ast_global.c \\\n\tsrc/frontend/type.c \\\n\tsrc/target/data_layout.c \\\n\tsrc/target/target_info.c \\\n\tsrc/target/riscv64/abi.c',
              ),
          ]
          for old_text, new_text in replacements:
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(f'Makefile: expected one occurrence, found {count}: {old_text[:60]}')
              text = text.replace(old_text, new_text)
          path.write_text(text)
          PY
          clang-format-18 -i \
            src/target/target_info.h \
            src/target/target_info.c \
            src/frontend/type.c \
            src/frontend/const_eval.c \
            src/frontend/parser_type.c \
            src/frontend/parser_string.c \
            src/frontend/parser_global.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_constant.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_statement.c \
            src/frontend/ast.h \
            src/frontend/ast.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_expression.c \
            src/target/riscv64/codegen_statement.c \
            tests/target/riscv64/layout_test.c
          git diff --check
          if grep -R --line-number --include='*.c' \
              -e 'minic_type_integer_common(' \
              -e 'minic_type_integer_promotion(' \
              src --exclude='type.c'; then
            echo 'legacy integer semantic helper remains in production'
            exit 1
          fi

      - name: Run complete compiler gate
        run: bash .github/scripts/compiler-c0-full-gate.sh

      - name: Install Linux Kbuild dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Drive unchanged Linux 6.6.143 init/main.i
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/consumer-linux-compiler
          MINIC="$GITHUB_WORKSPACE/build/consumer-linux-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/consumer-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh

      - name: Publish validated product files
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Makefile \
            src/target/target_info.h \
            src/target/target_info.c \
            src/frontend/type.c \
            src/frontend/const_eval.c \
            src/frontend/parser_type.c \
            src/frontend/parser_string.c \
            src/frontend/parser_global.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_constant.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_statement.c \
            src/frontend/ast.h \
            src/frontend/ast.c \
            src/frontend/ast_verifier.c \
            src/target/riscv64/codegen_expression.c \
            src/target/riscv64/codegen_statement.c \
            tests/compiler/c0/unsigned_64_literals.c \
            tests/target/riscv64/layout_test.c
          git commit -m 'refactor(frontend): route integer semantics through TargetInfo [skip ci]'
          git push origin HEAD:refactor/target-integer-consumers-v1-staging
