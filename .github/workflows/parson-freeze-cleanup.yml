name: Parson Freeze Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: parson-freeze-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.number == 72
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout actual PR head
        uses: actions/checkout@v4
        with:
          ref: external/parson-discovery
          fetch-depth: 0

      - name: Apply freeze-only cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/target/riscv64/codegen_function.c')
          text = path.read_text()
          old = '''        const MinicGlobalFunctionRelocation *relocation;
                  const MinicRecordField *field;
                  const MinicFunction *function;
                  MinicType pointee;
                  size_t field_offset;

                  relocation = &object->function_relocations[relocation_index];
                  field = minic_c0_record_field(record, relocation->field_index);
                  function = minic_c0_program_function(program, relocation->function_id);
                  if (field == NULL || function == NULL || function->name_length == 0U ||
                      field->element_count != 1U || !minic_type_pointee(field->type, &pointee) ||
                      !minic_type_is_function(pointee)) {
          '''
          new = '''        const MinicGlobalFunctionRelocation *relocation;
                  const MinicRecordField *field;
                  const MinicFunction *function;
                  MinicType field_pointee;
                  size_t field_offset;

                  relocation = &object->function_relocations[relocation_index];
                  field = minic_c0_record_field(record, relocation->field_index);
                  function = minic_c0_program_function(program, relocation->function_id);
                  if (field == NULL || function == NULL || function->name_length == 0U ||
                      field->element_count != 1U || !minic_type_pointee(field->type, &field_pointee) ||
                      !minic_type_is_function(field_pointee)) {
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected function-relocation block')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/compiler/c0/run-for-loops.sh')
          text = path.read_text()
          old = '''expect_failure \\
              invalid_for_update \\
              "assignment target must be a modifiable lvalue"
          '''
          new = '''expect_failure \\
              invalid_for_update \\
              "assignment expression requires a modifiable scalar lvalue"
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected invalid_for_update expectation')
          path.write_text(text.replace(old, new, 1))
          PY

          clang-format-18 -i src/target/riscv64/codegen_function.c
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/target/riscv64/codegen_function.c tests/compiler/c0/run-for-loops.sh
          git diff --cached --check
          git commit -m 'compiler: clean Parson freeze regressions / 编译器：清理 Parson 冻结回归'
          git push origin HEAD:external/parson-discovery
