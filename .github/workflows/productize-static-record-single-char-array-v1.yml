name: Productize Static Record Single Char Array V1
on:
  push:
    branches: [product/static-record-single-char-array-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/static-record-single-char-array-v1
          fetch-depth: 0
      - name: Fix one-element array field classification
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/frontend/parser_global.c')
          text = p.read_text()
          old = '''            if (field->element_count == 1U) {\n                if (!minic_parser_parse_static_storage_initializer_value(\n                        parser, object_id, field->type)) {\n                    return false;\n                }\n            } else if (minic_type_is_char_integer(field->type) &&\n                       parser->current.kind == MINIC_TOKEN_STRING_LITERAL) {\n'''
          new = '''            if (field->element_count == 1U && !field->is_array) {\n                if (!minic_parser_parse_static_storage_initializer_value(\n                        parser, object_id, field->type)) {\n                    return false;\n                }\n            } else if (field->is_array && minic_type_is_char_integer(field->type) &&\n                       parser->current.kind == MINIC_TOKEN_STRING_LITERAL) {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'static record array classification anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Add permanent focused regression
        run: |
          set -Eeuo pipefail
          cat > tests/compiler/c0/static_record_single_char_array.c <<'EOF'
          struct header { unsigned int a, b, c; };
          static const struct {
              struct header h;
              unsigned char name[sizeof("Linux")];
              typeof("") desc;
          } note = {{sizeof("Linux"), sizeof(""), 0x100}, "Linux", ""};
          int main(void) { return note.name[0] != 'L' || note.desc[0] != '\0'; }
          EOF
          cat > tests/compiler/c0/run-static-record-single-char-array.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/static-record-single-char-array
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/static_record_single_char_array.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-static-record-single-char-array.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'
          
          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-static-record-single-char-array.sh"
          EOF
      - name: Validate product slice
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-char-array-v1
          MINIC="$GITHUB_WORKSPACE/build/product-char-array-v1/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-char-array-v1-focused" \
            sh tests/compiler/c0/run-static-record-single-char-array.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-char-array-v1-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/productize-static-record-single-char-array-v1.yml
          git add src/frontend/parser_global.c tests/compiler/c0/static_record_single_char_array.c \
                  tests/compiler/c0/run-static-record-single-char-array.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: keep one-element char arrays as aggregate fields'
          git push origin HEAD:product/static-record-single-char-array-v1
