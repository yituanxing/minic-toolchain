name: Gate and Integrate Initializer ConstEval Zero v1

on:
  push:
    branches: [refactor/initializer-consteval-zero-v1]

permissions:
  actions: read
  contents: write

concurrency:
  group: initializer-consteval-zero-v1-integrate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: refactor/initializer-consteval-zero-v1
      FOUNDATION_BRANCH: refactor/foundation-v1
      EXPECTED_FOUNDATION_HEAD: 35227a49af02f8a0a8c06263cdacbb3061df7eac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for same-head full and Linux pressure gate
        id: pressure
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow initializer-consteval-zero-v1-pressure.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if test -n "$run_id"; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 180); do
            state=$(gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '.status + ":" + (.conclusion // "")')
            echo "pressure_run=$run_id state=$state"
            case "$state" in
              completed:success)
                log=$(mktemp)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > "$log"
                grep -F 'INITIALIZER_CONSTEVAL_HYBRID=1' "$log" >/dev/null
                grep -F 'cached_tu_status=0' "$log" >/dev/null
                grep -F 'FULL_TU_PASS lines=90928' "$log" >/dev/null
                exit 0
                ;;
              completed:*)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'initializer ConstEval pressure gate did not complete within polling budget' >&2
          exit 1

      - name: Materialize and validate canonical initializer ConstEval slice
        shell: bash
        env:
          PRESSURE_RUN_ID: ${{ steps.pressure.outputs.run_id }}
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin "$FEATURE_BRANCH" "$FOUNDATION_BRANCH"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$GITHUB_SHA"
          test "$(git rev-parse "origin/$FOUNDATION_BRANCH")" = "$EXPECTED_FOUNDATION_HEAD"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"

          python3 tools/dev/materialize-initializer-consteval-zero-v1.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write

          grep -F 'minic_const_eval_integer(' src/frontend/parser_statement.c >/dev/null
          grep -F 'minic_const_value_is_zero(' src/frontend/parser_statement.c >/dev/null
          if grep -F 'expression->value.integer_value == 0' src/frontend/parser_statement.c >/dev/null; then
            echo 'initializer still owns literal-only integer-zero semantics' >&2
            exit 1
          fi
          grep -F '1 - 1' tests/compiler/c0/zero_aggregate_null.c >/dev/null
          grep -F '2 - 2' tests/compiler/c0/zero_aggregate_null.c >/dev/null

          mkdir -p docs/architecture
          cat > docs/architecture/initializer-consteval-zero-v1.md <<'DOC'
          # Initializer ConstEval zero convergence v1

          This slice removes an initializer-specific copy of integer constant-zero
          semantics. Aggregate initialization previously recognized only a literal integer
          zero (plus a recursively wrapped pointer cast) when deciding whether zero/null
          values may initialize aggregate members. That made initializer behavior depend on
          syntax shape instead of the compiler's canonical integer constant evaluator.

          Integer zero detection now uses `minic_const_eval_integer()` followed by
          `minic_const_value_is_zero()`, with the parser's existing `TargetInfo` passed
          explicitly. As a result, any integer constant expression already supported by
          ConstEval has the same zero semantics in aggregate initialization. The focused
          regression deliberately uses `1 - 1` and `(void *)(2 - 2)` so the former
          literal-only implementation cannot pass accidentally.

          The outer pointer-cast handling remains intentionally narrow. This slice strips
          the pointer cast and delegates the underlying integer-zero question to ConstEval;
          it does not redesign the broader C null-pointer-constant contract.
          `minic_c0_expression_is_null_pointer_constant_v0()` therefore remains unchanged
          and should be reassessed separately after a global reread rather than folded into
          this initializer change.

          This is semantic-owner convergence, not an InitPlan framework. Global and local
          initializer representation still needs a separate ownership review: global
          objects currently combine scalar value slots, relocations and zero-initialized
          state, while local aggregate initialization lowers directly to statements. A
          future InitPlan should be introduced only if that reread shows it removes real
          duplication after constant semantics have first converged.

          The slice preserves the deferred Core IR seam by keeping C constant-expression
          semantics above the seam in the frontend. No target placement or machine facts
          are introduced.

          The candidate passed the official full compiler gate and frozen Linux 6.6.143
          hybrid pressure run `@PRESSURE_RUN_ID@`, which rebuilt the proven semantic,
          ABI and layout ownership stack, applied this initializer patch cleanly, and
          completed with `INITIALIZER_CONSTEVAL_HYBRID=1`, `cached_tu_status=0`, and
          `FULL_TU_PASS lines=90928`.
          DOC
          sed -i "s/@PRESSURE_RUN_ID@/$PRESSURE_RUN_ID/" \
            docs/architecture/initializer-consteval-zero-v1.md

          rm -f \
            tools/dev/materialize-initializer-consteval-zero-v1.py \
            .github/workflows/initializer-consteval-zero-v1-validation.yml \
            .github/workflows/initializer-consteval-zero-v1-pressure.yml \
            .github/workflows/initializer-consteval-zero-v1-integrate.yml

          git diff --check
          sh tools/maintenance/check-production-source-inventory.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

          make -j2 MODE=release BUILD_DIR=build/initializer-consteval-final-release CFLAGS=-Werror check-fast
          MINIC="$GITHUB_WORKSPACE/build/initializer-consteval-final-release/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/initializer-consteval-final-focused" \
            sh tests/compiler/c0/run-zero-aggregate-null.sh
          make -j2 MODE=sanitize BUILD_DIR=build/initializer-consteval-final-sanitize check-ast-contract
          bash .github/scripts/compiler-c0-full-gate.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check

          changed=$(git diff --cached --name-only "$EXPECTED_FOUNDATION_HEAD" | sort)
          expected=$(printf '%s\n' \
            docs/architecture/initializer-consteval-zero-v1.md \
            src/frontend/parser_statement.c \
            tests/compiler/c0/run-zero-aggregate-null.sh \
            tests/compiler/c0/zero_aggregate_null.c | sort)
          if test "$changed" != "$expected"; then
            echo 'unexpected final initializer ConstEval diff:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          git commit \
            -m 'refactor(consteval): unify initializer zero constants' \
            -m "Frozen Linux initializer ConstEval pressure run: $PRESSURE_RUN_ID"
          git push origin HEAD:"$FEATURE_BRANCH"
