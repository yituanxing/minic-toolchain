name: Core M145 Loop Owner Differential Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require clean semantic baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          grep -Fq 'M134_UNREACHABLE_TAIL_OWNER' src/core/core_lower.c
          ! grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c
          ! grep -Fq 'M137_DETACHED_LOOP_CONTINUE_OWNER' src/core/core_lower.c
          ! grep -Fq 'M141_SCOPED_LOOP_CONTINUE_TAIL_OWNER' src/core/core_lower.c
          ! grep -Fq 'M142_NONEDGE_CLEANUP_METADATA_OWNER' src/core/core_lower.c
          ! grep -Fq 'M144_UNREFERENCED_LOOP_LABEL_METADATA_OWNER' src/core/core_lower.c

      - name: Census baseline and cumulative ownership layers
        shell: bash
        run: |
          set -Eeuo pipefail
          indices='9,54,66,95,96,98,229,296,306,325,330,333,334,337,345,353,357,367,382,387,444,449,451,465,468,484'
          root="$GITHUB_WORKSPACE/build/m145-differential"
          mkdir -p "$root"

          run_layer() {
            name="$1"
            build="$GITHUB_WORKSPACE/build/m145-${name}-compiler"
            work="$root/$name"
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build"
            set +e
            MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
              --minic "$build/bin/minic" \
              --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" \
              --jobs 4 \
              --indices "$indices"
            rc=$?
            set -e
            printf 'CORE_M145_LAYER_REPLAY layer=%s rc=%d\n' "$name" "$rc"
            python3 tools/ci/classify-core-strict-frontier.py \
              "$work/batch-results.json" \
              --stderr-root "$work/minic-stderr" \
              --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
              --examples 30 \
              --json-out "$work/frontier-summary.json" \
              --reason-text-out "$work/reason-summary.txt"
            python3 - "$name" "$work" <<'PY'
          import json, sys
          from pathlib import Path
          name=sys.argv[1]
          work=Path(sys.argv[2])
          rows=json.loads((work/'batch-results.json').read_text())
          counts={}
          for row in rows:
              counts[row['status']]=counts.get(row['status'],0)+1
              print(f"CORE_M145_ROW layer={name} index={row['index']} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
          print(f"CORE_M145_LAYER layer={name} selected={len(rows)} pass={counts.get('PASS',0)} unsupported={counts.get('FAIL',0)} error={counts.get('ERROR',0)}")
          PY
          }

          run_layer baseline

          python3 tools/ci/apply-m137-detached-loop-continue-owner.py
          git diff --check
          run_layer m137

          python3 tools/ci/apply-m141-scoped-loop-continue-tail.py
          git diff --check
          run_layer m141

          python3 tools/ci/apply-m142-nonedge-cleanup-metadata.py
          git diff --check
          run_layer m142

          python3 tools/ci/apply-m144-unreferenced-loop-label-metadata.py
          git diff --check
          run_layer m144

      - name: Build differential matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('build/m145-differential')
          layers=['baseline','m137','m141','m142','m144']
          data={}
          for layer in layers:
              rows=json.loads((root/layer/'batch-results.json').read_text())
              data[layer]={int(r['index']):r for r in rows}
          indices=sorted(data['baseline'])
          lines=['index\tbaseline\tm137\tm141\tm142\tm144\tfirst_regression']
          first_counts={layer:0 for layer in layers[1:]}
          for idx in indices:
              statuses=[data[layer][idx]['status'] for layer in layers]
              first='-'
              if statuses[0] == 'PASS':
                  for layer,status in zip(layers[1:],statuses[1:]):
                      if status != 'PASS':
                          first=layer
                          first_counts[layer]+=1
                          break
              lines.append(f"{idx}\t"+'\t'.join(statuses)+f"\t{first}")
          matrix='\n'.join(lines)+'\n'
          (root/'matrix.tsv').write_text(matrix)
          print(matrix, end='')
          for layer in layers:
              rows=data[layer].values()
              counts={}
              for row in rows:
                  counts[row['status']]=counts.get(row['status'],0)+1
              print(f"CORE_M145_SUMMARY layer={layer} pass={counts.get('PASS',0)} fail={counts.get('FAIL',0)} error={counts.get('ERROR',0)}")
          print('CORE_M145_FIRST_REGRESSION_COUNTS '+ ' '.join(f'{k}={v}' for k,v in first_counts.items()))
          for idx in (95,98):
              print('CORE_M145_TARGET index=%d %s' % (idx, ' '.join(f'{layer}={data[layer][idx]["status"]}@{data[layer][idx].get("first_error_line")}' for layer in layers)))

          baseline=data['baseline']
          if any(row['status']=='ERROR' for row in baseline.values()):
              raise SystemExit('M145 baseline unexpectedly contains ERROR')
          if sum(row['status']=='PASS' for row in baseline.values()) != 24:
              raise SystemExit('M145 expected exactly 24 clean baseline PASS controls')
          PY

      - name: Persist M145 census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m145-loop-owner-differential-${{ github.sha }}
          path: build/m145-differential/**
          if-no-files-found: warn
