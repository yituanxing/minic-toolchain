name: Publish GNU No Profile Function Attribute

on:
  push:
    branches: [compiler/gnu-no-profile-function-attribute]

permissions:
  contents: write

concurrency:
  group: publish-gnu-no-profile-function-attribute
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add parse-only GNU profile instrumentation attribute
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path('src/frontend/attribute.h')
          text = header.read_text()
          old = '    MINIC_ATTRIBUTE_NO_INSTRUMENT_FUNCTION,\n    MINIC_ATTRIBUTE_NO_SANITIZE_ADDRESS,\n'
          new = ('    MINIC_ATTRIBUTE_NO_INSTRUMENT_FUNCTION,\n'
                 '    MINIC_ATTRIBUTE_NO_PROFILE_INSTRUMENT_FUNCTION,\n'
                 '    MINIC_ATTRIBUTE_NO_SANITIZE_ADDRESS,\n')
          if text.count(old) != 1:
              raise SystemExit('attribute enum insertion seam not found')
          header.write_text(text.replace(old, new, 1))

          source = Path('src/frontend/attribute.c')
          text = source.read_text()
          old = '''    MINIC_ATTRIBUTE_ENTRY("__no_instrument_function__",\n                          MINIC_ATTRIBUTE_NO_INSTRUMENT_FUNCTION,\n                          MINIC_ATTRIBUTE_CLASS_INFORMATIONAL,\n                          MINIC_ATTRIBUTE_TARGET_FUNCTION),\n'''
          new = old + '''    {\n        "no_profile_instrument_function",\n        sizeof("no_profile_instrument_function") - 1U,\n        MINIC_ATTRIBUTE_NO_PROFILE_INSTRUMENT_FUNCTION,\n        MINIC_ATTRIBUTE_CLASS_OPTIMIZATION,\n        MINIC_ATTRIBUTE_TARGET_FUNCTION,\n        0U,\n        0U,\n        true,\n    },\n    {\n        "__no_profile_instrument_function__",\n        sizeof("__no_profile_instrument_function__") - 1U,\n        MINIC_ATTRIBUTE_NO_PROFILE_INSTRUMENT_FUNCTION,\n        MINIC_ATTRIBUTE_CLASS_OPTIMIZATION,\n        MINIC_ATTRIBUTE_TARGET_FUNCTION,\n        0U,\n        0U,\n        true,\n    },\n'''
          if text.count(old) != 1:
              raise SystemExit('attribute descriptor insertion seam not found')
          source.write_text(text.replace(old, new, 1))

          runner = Path('tests/compiler/c0/run-foundation-focused.sh')
          data = runner.read_text()
          anchor = '    run-gnu-statement-expression.sh \\\n'
          addition = anchor + '    run-gnu-no-profile-function-attribute.sh \\\n'
          if 'run-gnu-no-profile-function-attribute.sh' not in data:
              if anchor not in data:
                  raise SystemExit('foundation runner insertion seam not found')
              runner.write_text(data.replace(anchor, addition, 1))
          PY

          cat > tests/compiler/c0/gnu_no_profile_function_attribute.c <<'EOF'
          int __attribute__((__noinline__))
              __attribute__((__no_instrument_function__))
              __attribute__((__section__(".noinstr.text")))
              __attribute__((__no_sanitize_address__))
              __attribute__((__no_profile_instrument_function__))
              no_profile_decl(int value);

          __attribute__((__noinline__))
          __attribute__((__no_instrument_function__))
          __attribute__((__section__(".noinstr.text")))
          __attribute__((__no_sanitize_address__))
          __attribute__((__no_profile_instrument_function__))
          int no_profile_decl(int value)
          {
              return value + 1;
          }
          EOF

          cat > tests/compiler/c0/run-gnu-no-profile-function-attribute.sh <<'EOF'
          #!/bin/sh
          set -eu

          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/compiler-c0-gnu-no-profile-function-attribute

          rm -rf "$work"
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c \
            "$root/tests/compiler/c0/gnu_no_profile_function_attribute.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          grep -F 'no_profile_decl:' "$work/output.s" >/dev/null
          grep -F '.noinstr.text' "$work/output.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/gnu_no_profile_function_attribute parse-only=1 section=preserved'
          EOF
          chmod +x tests/compiler/c0/run-gnu-no-profile-function-attribute.sh

          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/attribute.h src/frontend/attribute.c \
            tests/compiler/c0/gnu_no_profile_function_attribute.c
          rm .github/workflows/publish-gnu-no-profile-function-attribute.yml
          git diff --check

      - name: Sanitizer focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=sanitize BUILD_DIR=build/no-profile-attr-sanitize
          MINIC="$GITHUB_WORKSPACE/build/no-profile-attr-sanitize/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/no-profile-attr-sanitize" \
            sh tests/compiler/c0/run-gnu-no-profile-function-attribute.sh

      - name: Release Foundation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/no-profile-attr-release
          MINIC="$GITHUB_WORKSPACE/build/no-profile-attr-release/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/no-profile-attr-release" \
            sh tests/compiler/c0/run-foundation-focused.sh

      - name: Commit product-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: classify GNU no-profile instrumentation attribute' \
            -m 'Register no_profile_instrument_function and its underscored spelling as function-only optimization attributes. MiniC has no profile-feedback instrumentation pass, so the attribute is semantically inert for current code generation and can use the existing parse-only function-attribute path while section and other persistent attributes keep their canonical owners.' \
            -m '中文说明：登记 no_profile_instrument_function 及双下划线拼写，并归类为仅用于函数的 optimization attribute。MiniC 当前没有 profile-feedback instrumentation，因此该属性对现有代码生成没有额外执行语义，可复用既有 parse-only function attribute 路径；section 等持久属性仍由各自 canonical owner 处理。' \
            -m 'Validation / 验证：focused sanitizer PASS; Foundation focused PASS; clang-format-18 canonical.'
          git push origin HEAD:compiler/gnu-no-profile-function-attribute
