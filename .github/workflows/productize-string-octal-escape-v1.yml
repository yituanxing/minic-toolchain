name: Productize String Octal Escape V1
on:
  push:
    branches: [product/string-octal-escape-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/string-octal-escape-v1
          fetch-depth: 0
      - name: Materialize source and permanent contracts
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/frontend/parser_string.c')
          text = path.read_text()
          old_simple = '''    case 'v':\n        *value = '\\v';\n        return true;\n    case '0':\n        *value = 0;\n        return true;\n    default:\n'''
          new_simple = '''    case 'v':\n        *value = '\\v';\n        return true;\n    default:\n'''
          if text.count(old_simple) != 1:
              raise SystemExit(f'simple escape anchor count={text.count(old_simple)}')
          text = text.replace(old_simple, new_simple, 1)
          hex_anchor = '''static int hex_digit_value(char character) {\n'''
          octal = '''static int octal_digit_value(char character) {\n    if (character >= '0' && character <= '7') {\n        return character - '0';\n    }\n    return -1;\n}\n\n'''
          if text.count(hex_anchor) != 1:
              raise SystemExit(f'hex anchor count={text.count(hex_anchor)}')
          text = text.replace(hex_anchor, octal + hex_anchor, 1)
          old_decl = '''    unsigned int decoded;\n    int digit;\n'''
          new_decl = '''    unsigned int decoded;\n    unsigned int digit_count;\n    int digit;\n'''
          if text.count(old_decl) != 1:
              raise SystemExit(f'decode decl anchor count={text.count(old_decl)}')
          text = text.replace(old_decl, new_decl, 1)
          old_dispatch = '''    if (source[*cursor] != 'x') {\n        if (!decode_simple_escape(source[*cursor], value)) {\n            return false;\n        }\n        *cursor += 1U;\n        return true;\n    }\n\n    *cursor += 1U;\n'''
          new_dispatch = '''    digit = octal_digit_value(source[*cursor]);\n    if (digit >= 0) {\n        decoded = 0U;\n        digit_count = 0U;\n        while (*cursor < end && digit_count < 3U &&\n               (digit = octal_digit_value(source[*cursor])) >= 0) {\n            if (decoded > (255U - (unsigned int)digit) / 8U) {\n                return false;\n            }\n            decoded = decoded * 8U + (unsigned int)digit;\n            *cursor += 1U;\n            digit_count += 1U;\n        }\n        *value = (int)decoded;\n        return true;\n    }\n    if (source[*cursor] != 'x') {\n        if (!decode_simple_escape(source[*cursor], value)) {\n            return false;\n        }\n        *cursor += 1U;\n        return true;\n    }\n\n    *cursor += 1U;\n'''
          if text.count(old_dispatch) != 1:
              raise SystemExit(f'decode dispatch anchor count={text.count(old_dispatch)}')
          text = text.replace(old_dispatch, new_dispatch, 1)
          path.write_text(text)
          PY
          cat > tests/compiler/c0/run-string-octal-escape.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/string-octal-escape
          mkdir -p "$work"
          cat > "$work/positive.c" <<'SRC'
          static const char text[] = "\101\102\103\0\7";
          int main(void) {
              return text[0] == 'A' && text[1] == 'B' && text[2] == 'C' &&
                     text[3] == 0 && text[4] == 7 && text[5] == 0 ? 0 : 1;
          }
          SRC
          "$minic" -S "$work/positive.c" -o "$work/positive.s"
          grep -Fq '  .byte 65' "$work/positive.s"
          grep -Fq '  .byte 66' "$work/positive.s"
          grep -Fq '  .byte 67' "$work/positive.s"
          grep -Fq '  .byte 7' "$work/positive.s"
          cat > "$work/overflow.c" <<'SRC'
          static const char text[] = "\400";
          SRC
          if "$minic" -S "$work/overflow.c" -o "$work/overflow.s" 2>"$work/overflow.err"; then
              echo 'FAIL compiler/c0/string-octal-escape: out-of-range octal escape accepted' >&2
              exit 1
          fi
          grep -Fq 'unsupported string escape' "$work/overflow.err"
          printf '%s\n' 'PASS compiler/c0/string-octal-escape'
          EOF
          chmod +x tests/compiler/c0/run-string-octal-escape.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" \
          BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
          sh "$root/tests/compiler/c0/run-string-octal-escape.sh"
          EOF
          clang-format-18 -i src/frontend/parser_string.c
          git diff --check
      - name: Validate Werror focused and fast gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-string-octal
          MINIC="$GITHUB_WORKSPACE/build/product-string-octal/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/product-string-octal" sh tests/compiler/c0/run-string-octal-escape.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-string-octal-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-string-octal-escape-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'frontend: decode octal string escapes'
          git push origin HEAD:product/string-octal-escape-v1
