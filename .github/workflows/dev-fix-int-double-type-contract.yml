name: Dev fix int double type contract

on:
  push:
    branches:
      - frontend/integer-to-double-conversion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/integer-to-double-conversion
      - name: Update exact type contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/frontend/type_test.c')
          text = path.read_text()
          old = '        minic_type_cast_compatible(double_type, integer_type) ||\n'
          new = '        !minic_type_cast_compatible(double_type, integer_type) ||\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old contract, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          clang-format-18 -i tests/frontend/type_test.c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-fix-int-double-type-contract.yml
          git add tests/frontend/type_test.c
          git diff --cached --check
          git commit -m "tests: update integer to double type contract"
          git push origin HEAD:frontend/integer-to-double-conversion
