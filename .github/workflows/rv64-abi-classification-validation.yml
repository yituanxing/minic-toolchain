name: RV64 ABI Classification Validation

on:
  push:
    branches:
      - refactor/rv64-abi-classification-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv64-abi-classification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build focused RV64 ABI contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/rv64-abi
          cc -std=c11 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror \
            -Iinclude -Isrc \
            src/frontend/ast.c \
            src/frontend/ast_global.c \
            src/frontend/type.c \
            src/target/data_layout.c \
            src/target/riscv64/abi.c \
            tests/target/riscv64/abi_test.c \
            -o build/rv64-abi/abi-test

      - name: Run focused RV64 ABI contract
        run: build/rv64-abi/abi-test

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify production source inventory
        run: sh tools/maintenance/check-production-source-inventory.sh

      - name: Check committed source formatting
        run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Run release host contracts
        run: make -j2 MODE=release BUILD_DIR=build/rv64-abi-host CFLAGS=-Werror check-fast

      - name: Run sanitizer AST contracts
        run: make -j2 MODE=sanitize BUILD_DIR=build/rv64-abi-sanitize check-ast-contract

      - name: Run frozen Foundation focused semantics
        shell: bash
        env:
          MINIC: ${{ github.workspace }}/build/rv64-abi-host/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/rv64-abi-foundation-focused
          HOST_CC: cc
        run: sh tools/dev/pr76-focused.sh

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh
