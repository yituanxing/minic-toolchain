name: Core M136 Silent Statement Census

on:
  pull_request:

jobs:
  census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Stage M135 candidate plus M136 diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m135-cleanup-edge-classification.py
          python3 tools/ci/apply-m136-silent-statement-census.py
          git diff --check
          grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c
          grep -Fq 'M136_SILENT_STATEMENT_CENSUS' src/core/core_lower.c

      - name: Build exact diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m136-census-compiler

      - name: Replay post-M135 silent pair
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m136-census-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m136-census-focused"
          set +e
          CORE_M136_STATEMENT_TRACE=1 CORE_FAST_TRACE=1 MINIC_CORE_IR=strict \
            python3 tests/external/linux/corpus_replay.py \
              --minic "$compiler" \
              --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" \
              --jobs 2 \
              --indices '95,98'
          replay_status=$?
          set -e
          printf 'CORE_M136_REPLAY_STATUS=%d\n' "$replay_status"
          for f in "$work"/minic-stderr/kernel/sched/*.stderr; do
            echo "===== $f ====="
            grep -E 'CORE_M136_STMT_ENTRY|CORE_FAST_TRACE|CORE_EXPR_STMT_DETAIL|error:' "$f" | tail -n 160 || true
          done

      - name: Persist M136 census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m136-silent-statement-${{ github.sha }}
          path: build/m136-census-focused/**
          if-no-files-found: error
