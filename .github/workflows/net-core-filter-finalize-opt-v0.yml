name: Net Core Filter Frame AB V0

on:
  push:
    branches: ["agent/net-core-filter-frame-ab-v0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-frame-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3 time

      - name: Build current runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-frame-ab"
          mkdir -p "$work/evidence"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$work/toolchain" "$work/evidence/profile"

      - name: Prepare Linux
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-frame-ab"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare

      - name: Warm filter with GCC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-frame-ab"
          src="$work/linux-6.6.143"
          out="$work/out"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            CC=/usr/bin/riscv64-linux-gnu-gcc -j4 net/core/filter.o
          test -s "$out/net/core/filter.o"
          rm -f "$out/net/core/filter.o"

      - name: Compile filter with object-slot reuse disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/filter-frame-ab"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          start=$(date +%s)
          set +e
          /usr/bin/time -v -o "$ev/filter-frame-ab.time.txt" \
            timeout --signal=TERM --kill-after=20s 90s \
            env MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
              MINIC_KEEP_INTERMEDIATES=1 MINIC_BOOTSTRAP_TRACE=1 \
              MINIC_SPECIALIZATION_PERF_TRACE=1 MINIC_DISABLE_CORE_OBJECT_SLOT_REUSE=1 MINIC_CORE_FRAME_TRACE=1 MINIC_KBUILD_TRACE="$ev/filter-frame-ab.kbuild.trace" \
              CORE_FAST_TRACE=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
                CC="$wrapper" -j1 V=1 net/core/filter.o >"$ev/filter-frame-ab.log" 2>&1
          rc=$?
          set -e
          elapsed=$(($(date +%s)-start))
          printf 'FILTER_FRAME_AB_RC=%s\nFILTER_FRAME_AB_ELAPSED_S=%s\n' "$rc" "$elapsed" | tee "$ev/filter-frame-ab-summary.txt"
          side="$out/net/core/filter.minic-stage2.minic.stderr"
          test ! -f "$side" || cp "$side" "$ev/filter-minic.stderr"
          test ! -f "$out/net/core/filter.minic-stage2.i" || wc -c "$out/net/core/filter.minic-stage2.i" >"$ev/filter-i-bytes.txt"
          grep -a -E 'MINIC_BOOTSTRAP_TRACE|MINIC_SPECIALIZATION_PERF|MINIC_INLINE_|error:|fatal:|MINIC_KBUILD_BLOCKER' \
            "$ev/filter-minic.stderr" "$ev/filter-frame-ab.log" | tail -n 5000 >"$ev/filter-frame-ab-diagnostic.txt" 2>/dev/null || true
          tail -n 500 "$ev/filter-frame-ab.log" >"$ev/filter-frame-ab-tail.txt" || true
          if test "$rc" -eq 0; then
            test -s "$out/net/core/filter.o"
            echo "FILTER_FRAME_AB=PASS" | tee -a "$ev/filter-frame-ab-summary.txt"
          fi
          exit "$rc"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-core-filter-frame-ab-v0
          path: build/filter-frame-ab/evidence/
          if-no-files-found: error
          retention-days: 7
