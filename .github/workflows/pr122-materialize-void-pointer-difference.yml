name: PR122 Materialize GNU Void Pointer Difference
on:
  push:
    branches: [agent/gnu-void-pointer-difference-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize GNU void pointer difference
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr122-materialize.py
          clang-format-18 -i src/frontend/parser_expression.c tests/compiler/c0/gnu_void_pointer_arithmetic.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pr122-focused" HOST_CC=cc sh tests/compiler/c0/run-gnu-void-pointer-arithmetic.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr122-materialize.py .github/workflows/pr122-materialize-void-pointer-difference.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): support GNU void pointer difference'
          git push origin HEAD:agent/gnu-void-pointer-difference-v0
