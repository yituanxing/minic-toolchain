name: Agent RV64 inline asm lvalue outputs

on:
  push:
    branches:
      - agent/rv64-inline-asm-lvalue-output-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build baseline MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-inline-asm-lvalue-baseline

      - name: Prove baseline rejects Linux-shaped register member outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-inline-asm-lvalue-baseline/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          struct csr_state {
              unsigned long vstart;
              unsigned long vtype;
              unsigned long vl;
              unsigned long vcsr;
              unsigned long vlenb;
          };

          void save(struct csr_state *dest) {
              __asm__ __volatile__(
                  "li %0, 1\n\t"
                  "li %1, 2\n\t"
                  "li %2, 3\n\t"
                  "li %3, 4\n\t"
                  "li %4, 5"
                  : "=r"(dest->vstart), "=r"(dest->vtype), "=r"(dest->vl),
                    "=r"(dest->vcsr), "=r"(dest->vlenb));
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          if build/agent-inline-asm-lvalue-baseline/bin/minic -S "$work/repro.i" -o "$work/repro.s" \
              >"$work/stdout" 2>"$work/stderr"; then
              echo 'baseline unexpectedly accepted register member outputs' >&2
              exit 1
          fi
          grep -F 'cannot write RISC-V assembly' "$work/stderr" >/dev/null

      - name: Apply general lvalue-output patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent-rv64-inline-asm-lvalue-output.py
          clang-format-18 -i src/target/riscv64/codegen_inline_asm.c tests/compiler/c0/gnu_inline_asm_operands.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Build patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-inline-asm-lvalue-patched

      - name: Run focused GNU inline asm contract
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/agent-inline-asm-lvalue-patched/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-inline-asm-lvalue-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-inline-asm-operands.sh

      - name: Re-run Linux-shaped reproducer
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-inline-asm-lvalue-patched/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          struct csr_state {
              unsigned long vstart;
              unsigned long vtype;
              unsigned long vl;
              unsigned long vcsr;
              unsigned long vlenb;
          };

          void save(struct csr_state *dest) {
              __asm__ __volatile__(
                  "csrr %0, 0x8\n\t"
                  "csrr %1, 0xc21\n\t"
                  "csrr %2, 0xc20\n\t"
                  "csrr %3, 0xf\n\t"
                  "csrr %4, 0xc22"
                  : "=r"(dest->vstart), "=r"(dest->vtype), "=r"(dest->vl),
                    "=r"(dest->vcsr), "=r"(dest->vlenb));
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          build/agent-inline-asm-lvalue-patched/bin/minic -S "$work/repro.i" -o "$work/repro.s"
          grep -F 'csrr t0, 0x8' "$work/repro.s" >/dev/null
          grep -F 'csrr t5, 0xc22' "$work/repro.s" >/dev/null
          test "$(grep -c '^  sd t[01345], 0(a0)$' "$work/repro.s")" -ge 5

      - name: Run fast regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-fast

      - name: Commit product-only result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/zz-agent-rv64-inline-asm-lvalue-output.yml
          rm -f tools/dev/agent-rv64-inline-asm-lvalue-output.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: support register outputs to scalar lvalues'
          git push origin HEAD:agent/rv64-inline-asm-lvalue-output-v1
