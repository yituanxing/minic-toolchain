name: Isolated Core Verify and Parser Shadow Audit V1

on:
  push:
    branches:
      - agent/linux-perf-independent-verify-audit-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build current canonical compiler and enable verifier counters
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/independent-verify-audit-v1"
          mkdir -p "$work/evidence"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh \
            "$work/toolchain" "$work/evidence/canonical-build"
          python3 tools/ci/apply-perf-core-verify-counters-v1.py \
            | tee "$work/evidence/verifier-counter-patch.txt"
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" >"$work/evidence/instrument-build.log" 2>&1
          echo "AUDIT_INSTRUMENTED_BUILD=PASS"

      - name: Regression oracle for scoped typedef shadowing
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/independent-verify-audit-v1"
          cat > "$work/typedef-shadow.i" <<'EOF'
          int shadow_test(void) {
              int T = 1;
              {
                  typedef int T;
                  T x = 3;
                  return x;
              }
          }
          EOF
          gcc -S "$work/typedef-shadow.i" -o "$work/gcc-shadow.s"
          echo "GCC_SCOPED_TYPEDEF_SHADOW=PASS"
          if MINIC_CORE_VERIFY_AUDIT=1 \
               "$work/toolchain/bin/minic" -S "$work/typedef-shadow.i" \
               -o "$work/minic-shadow.s" >"$work/evidence/minic-shadow.log" 2>&1; then
            echo "MINIC_SCOPED_TYPEDEF_SHADOW=PASS" | tee -a "$work/evidence/minic-shadow.log"
          else
            echo "MINIC_SCOPED_TYPEDEF_SHADOW=FAIL" | tee -a "$work/evidence/minic-shadow.log"
            tail -n 20 "$work/evidence/minic-shadow.log"
          fi

      - name: Fix nearest local binding and prove shadowing regression
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/independent-verify-audit-v1"
          python3 tools/ci/apply-perf-parser-local-shadow-fix-v1.py \
            | tee "$work/evidence/local-shadow-patch.txt"
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" \
            >"$work/evidence/shadow-rebuild.log" 2>&1
          MINIC_CORE_VERIFY_AUDIT=1 "$work/toolchain/bin/minic" \
            -S "$work/typedef-shadow.i" -o "$work/minic-shadow-fixed.s" \
            >"$work/evidence/minic-shadow-fixed.log" 2>&1
          test -s "$work/minic-shadow-fixed.s"
          echo "MINIC_SCOPED_TYPEDEF_SHADOW_FIXED=PASS"
          cat > "$work/typedef-local-reverse.i" <<'EOF'
          typedef int number_t;
          int local_hides_typedef(void) {
              int number_t = 4;
              return number_t;
          }
          EOF
          gcc -S "$work/typedef-local-reverse.i" -o "$work/gcc-reverse-shadow.s"
          "$work/toolchain/bin/minic" -S "$work/typedef-local-reverse.i" \
            -o "$work/minic-reverse-shadow.s" >"$work/evidence/minic-reverse-shadow.log" 2>&1
          test -s "$work/minic-reverse-shadow.s"
          echo "MINIC_LOCAL_HIDES_GLOBAL_TYPEDEF=PASS"

      - name: Resolve nearest ordinary binding across all local categories
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/independent-verify-audit-v1"
          python3 tools/ci/apply-perf-parser-nearest-ordinary-scope-v1.py \
            | tee "$work/evidence/nearest-ordinary-scope.txt"
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" \
            >"$work/evidence/ordinary-scope-rebuild.log" 2>&1
          echo "MINIC_NEAREST_ORDINARY_SCOPE_BUILD=PASS"

      - name: Probe enum and typedef ordinary-identifier shadow cases
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/independent-verify-audit-v1"
          mkdir -p "$work/ordinary-shadow"
          cat > "$work/ordinary-shadow/enum-global.i" <<'EOF'
          int G = 20;
          int test1(void) { enum { G = 7 }; return G; }
          int main(void) { return test1() == 7 ? 0 : 1; }
          EOF
          cat > "$work/ordinary-shadow/enum-local.i" <<'EOF'
          int test2(void) {
              int G = 1;
              { enum { G = 7 }; return G; }
          }
          int main(void) { return test2() == 7 ? 0 : 1; }
          EOF
          cat > "$work/ordinary-shadow/enum-typedef.i" <<'EOF'
          typedef int Alias;
          int test3(void) { enum { Alias = 7 }; return (Alias) + 1; }
          int main(void) { return test3() == 8 ? 0 : 1; }
          EOF
          cat > "$work/ordinary-shadow/invalid-typedef-expr.i" <<'EOF'
          int x = 9;
          int invalid(void) { typedef int x; return x; }
          EOF
          for case in enum-global enum-local enum-typedef; do
            input="$work/ordinary-shadow/$case.i"
            gcc "$input" -x c -o "$work/ordinary-shadow/$case.gcc.bin"
            "$work/ordinary-shadow/$case.gcc.bin"
            echo "GCC_SEMANTIC_RUNTIME=$case PASS"
            if "$work/toolchain/bin/minic" -S "$input" -o "$work/ordinary-shadow/$case.s" \
              >"$work/evidence/$case-minic.log" 2>&1; then
              echo "MINIC_SHADOW_COMPILE=$case PASS"
            else
              echo "MINIC_SHADOW_COMPILE=$case FAIL"
              tail -n 4 "$work/evidence/$case-minic.log"
              exit 1
            fi
          done
          input="$work/ordinary-shadow/invalid-typedef-expr.i"
          if gcc -S "$input" -o "$work/ordinary-shadow/invalid-gcc.s" \
              >"$work/evidence/invalid-gcc.log" 2>&1; then
            echo "GCC_INVALID_TYPEDEF_EXPRESSION=UNEXPECTED_PASS"
            exit 1
          fi
          echo "GCC_INVALID_TYPEDEF_EXPRESSION=REJECT"
          if "$work/toolchain/bin/minic" -S "$input" -o "$work/ordinary-shadow/invalid-minic.s" \
              >"$work/evidence/invalid-minic.log" 2>&1; then
            echo "MINIC_INVALID_TYPEDEF_EXPRESSION=UNEXPECTED_PASS"
            exit 1
          else
            echo "MINIC_INVALID_TYPEDEF_EXPRESSION=REJECT"
          fi

      - name: Measure Core verifier on generated block-heavy C
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/independent-verify-audit-v1"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/independent-verify-audit-v1/block-heavy.i")
          with p.open("w") as f:
              for function_idx in range(30):
                  f.write(f"int block_heavy_{function_idx}(int x) {{\n")
                  f.write("    int y = x;\n")
                  for block_idx in range(50):
                      mask = 1 << (block_idx % 16)
                      f.write(f"    if ((x & {mask}) != 0) y += {block_idx + 1}; else y -= {block_idx + 1};\n")
                  f.write("    return y;\n}\n")
          print("CORE_VERIFY_AUDIT_SYNTHETIC_FUNCTIONS=30 BRANCHES_PER_FUNCTION=50")
          PY
          gcc -S "$work/block-heavy.i" -o "$work/gcc-block-heavy.s"
          MINIC_CORE_VERIFY_AUDIT=1 \
            "$work/toolchain/bin/minic" -S "$work/block-heavy.i" \
            -o "$work/minic-block-heavy.s" \
            > "$work/evidence/core-verify-metrics.log" 2>&1
          grep '^CORE_VERIFY_AUDIT ' "$work/evidence/core-verify-metrics.log" | tee "$work/evidence/verifier-summary.txt"
          test -s "$work/minic-block-heavy.s"
          echo "CORE_VERIFY_AUDIT_STRESS=PASS"

      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verifier-and-scope-audit-v1
          path: build/independent-verify-audit-v1/evidence
          retention-days: 7
