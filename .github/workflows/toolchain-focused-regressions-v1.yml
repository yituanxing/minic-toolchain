name: Toolchain Focused Regression Suite (RV64, AR, LD)

on:
  push:
    branches:
      - "main"
      - "agent/linux-expanded-kbuild-v0"
      - "agent/linux-perf-boolean-domain-v1"
      - "feature/four-backend-aarch64-loongarch64-m0"
    paths:
      - 'src/**'
      - 'include/**'
      - 'compiler/**'
      - 'preprocessor/**'
      - 'assembler/**'
      - 'archiver/**'
      - 'linker/**'
      - 'elf/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/actions/**'
      - '.github/workflows/toolchain-focused-regressions-v1.yml'
      - '.github/workflows/linux-runtime-gcc-baseline.yml'
      - '!**/*.md'
      - '!tools/ci/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Select regression owner
        required: true
        type: choice
        default: all
        options:
          - all
          - minic-rv64
          - miniar
          - minild
          - four-backend

permissions:
  contents: read
  actions: read # only opt-in exact earlycon artifact comparison

concurrency:
  group: toolchain-focused-regressions-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'push' }}
  cancel-in-progress: true

jobs:
  focused-t1:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Only changes confined to new ISA backends / their GNU-QEMU fixtures
      # select four-backend; Core, driver, Makefile, CI, unknown paths or
      # unavailable git history fail open to ALL existing regression owners.
      - name: Select focused regression owners
        id: owners
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          mode=all
          linux_yaml=true
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            mode="${DISPATCH_MODE:-all}"
            if [[ "$mode" != all ]]; then linux_yaml=false; fi
          else
            paths="$RUNNER_TEMP/minic-focused-changed-paths.txt"
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
               [[ ! "$BEFORE_SHA" =~ ^0+$ ]] &&
               { git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null ||
                 git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; } &&
               git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$paths"; then
              linux_yaml=false
              four_only=true
              [[ -s "$paths" ]] || four_only=false
              while IFS= read -r changed; do
                if [[ "$changed" == .github/workflows/linux-runtime-gcc-baseline.yml ||
                      "$changed" == .github/workflows/toolchain-focused-regressions-v1.yml ]]; then
                  linux_yaml=true
                fi
                case "$changed" in
                  src/target/aarch64/*|src/target/loongarch64/*|tests/compiler/c0/run-four-backend-m1.sh|tests/external/tiny-aes-c/*|tests/external/cjson/*|tests/external/zlib/*|tests/external/lua/*|tests/external/sqlite/*)
                    ;;
                  *) four_only=false ;;
                esac
              done < "$paths"
              if [[ "$four_only" == true ]]; then mode=four-backend; fi
            else
              echo 'FOCUSED_OWNER_DIFF=UNAVAILABLE fallback=all owners'
            fi
          fi
          rv64=false
          miniar=false
          minild=false
          four=false
          case "$mode" in
            all) rv64=true; miniar=true; minild=true; four=true ;;
            minic-rv64) rv64=true ;;
            miniar) miniar=true ;;
            minild) minild=true ;;
            four-backend) four=true ;;
            *) echo "FOCUSED_OWNER_INVALID_MODE=$mode" >&2; exit 1 ;;
          esac
          {
            printf 'mode=%s\n' "$mode"
            printf 'rv64=%s\n' "$rv64"
            printf 'miniar=%s\n' "$miniar"
            printf 'minild=%s\n' "$minild"
            printf 'four=%s\n' "$four"
            printf 'linux_yaml=%s\n' "$linux_yaml"
          } >> "$GITHUB_OUTPUT"
          echo "FOCUSED_OWNER_PLAN mode=$mode rv64=$rv64 miniar=$miniar minild=$minild four=$four linux_yaml=$linux_yaml"
      # Stage2 2064 preflight checks current source workflow.
      # The bootstrap Linux opt-in workflow has several nested matrix
      # conditions. Parse its real YAML BEFORE another costly seven-way run.
      - name: Parse existing Linux runtime workflow YAML
        if: steps.owners.outputs.linux_yaml == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/linux-runtime-gcc-baseline.yml"); puts "LINUX_RUNTIME_YAML_PARSE=PASS"'
          # Catch GitHub Actions expression and schema errors (which
          # Ruby's plain YAML syntax check intentionally cannot catch).
          # Pin the official actionlint release and verify its published digest.
          # go run @latest fetched a whole replacement Go 1.26 toolchain on
          # ubuntu-24.04 (70s preflight in #39273247308), masking test gains.
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 \
            --max-time 45 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o /tmp/minic-actionlint-v1.7.12.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            /tmp/minic-actionlint-v1.7.12.tar.gz | sha256sum --check --status
          mkdir -p /tmp/minic-actionlint-bin
          tar -xzf /tmp/minic-actionlint-v1.7.12.tar.gz -C /tmp/minic-actionlint-bin actionlint
          /tmp/minic-actionlint-bin/actionlint -shellcheck= -pyflakes= \
            .github/workflows/linux-runtime-gcc-baseline.yml \
            .github/workflows/toolchain-focused-regressions-v1.yml

      - name: Install union of RV64, archive, static and dynamic linker oracle prerequisites
        if: steps.owners.outputs.mode != 'four-backend'
        run: |
          set -Eeuo pipefail
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-riscv64-cross libc6-dev-riscv64-cross qemu-user

      - name: Compile Mini toolchain exactly once for three independent verdicts
        id: build
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 all
          test -x build/toolchain-focused-t1-v2/bin/minic
          test -x build/toolchain-focused-t1-v2/bin/minic-as
          test -x build/toolchain-focused-t1-v2/bin/minic-ar
          test -x build/toolchain-focused-t1-v2/bin/minic-ld

      # Stage2 artifact mode fix: Actions strips +x; QEMU requires executable ELF.
      # Certified fixture return_42.c for strict direct/driver parity.
      # Verify the exact certified self-hosted RV64 Stage2 driver hookup on
      # one runner BEFORE burning seven full Linux runners again.
      # Temporary actual cJSON 1.7.19 original-source GNU/QEMU survey,
      # run only after proven original AES 2/2 and restore baseline YAML.
      - name: Four backend original AES and cJSON two-target source frontier
        id: four
        if: steps.owners.outputs.four == 'true' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          # Four-backend-only pushes do not need RV64 cross packages.
          if [[ "${{ steps.owners.outputs.mode }}" == four-backend ]]; then
            timeout 240s sudo apt-get -o Acquire::Retries=3 update
          fi
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-13-loongarch64-linux-gnu libc6-dev-loong64-cross qemu-user
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-four-backend-tinyaes-accept
          # The 22 named M17-M38 gates share baseline C/GNU/QEMU fixtures.
          # Enable them together: each independent case executes once per ISA,
          # while the existing script still emits each individual Mxx PASS.
          FOUR_BACKEND_M17_RECORD=1 \
          FOUR_BACKEND_M18_VARARGS=1 \
          FOUR_BACKEND_M19_PTR_COMPARE=1 \
          FOUR_BACKEND_M20_LP64_ABI=1 \
          FOUR_BACKEND_M21_LP64_ADD=1 \
          FOUR_BACKEND_M22_LP64_CONV=1 \
          FOUR_BACKEND_M23_LP64_COMPARE=1 \
          FOUR_BACKEND_M24_INDIRECT_CALL=1 \
          FOUR_BACKEND_M25_DOUBLE_TRANSPORT=1 \
          FOUR_BACKEND_M26_DOUBLE_DIV=1 \
          FOUR_BACKEND_M27_FP_PARAMETER=1 \
          FOUR_BACKEND_M28_INT_DOUBLE=1 \
          FOUR_BACKEND_M29_DOUBLE_CMP=1 \
          FOUR_BACKEND_M30_FP_CALL=1 \
          FOUR_BACKEND_M31_FLOAT_PROMOTE=1 \
          FOUR_BACKEND_M32_UNREACHABLE=1 \
          FOUR_BACKEND_M33_POINTER_LESS=1 \
          FOUR_BACKEND_M34_FP_CALL_RESULT=1 \
          FOUR_BACKEND_M35_PTR_TO_LP64=1 \
          FOUR_BACKEND_M36_LP64_MUL=1 \
          FOUR_BACKEND_M37_FP_ARITH=1 \
          FOUR_BACKEND_M38_FP_VARARGS=1 \
          FOUR_BACKEND_M39_LP64_BITOPS=1 \
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-four-backend-m38-fp-varargs
          sh -n tests/compiler/c0/probe-four-backend-outgoing-abi.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-four-backend-outgoing-abi.sh
          sh -n tests/compiler/c0/probe-aarch64-va-list-forward.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-aarch64-va-list-forward.sh
          sh -n tests/compiler/c0/probe-four-backend-computed-goto.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-four-backend-computed-goto.sh
          sh -n tests/compiler/c0/probe-four-backend-fp-conversions.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-four-backend-fp-conversions.sh
          sh -n tests/compiler/c0/probe-four-backend-integer-intrinsics.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-four-backend-integer-intrinsics.sh
          sh -n tests/compiler/c0/probe-four-backend-record-call-abi.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-four-backend-record-call-abi.sh
          sh -n tests/compiler/c0/probe-four-backend-relaxed-atomics.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-four-backend-relaxed-atomics.sh
          sh -n tests/compiler/c0/probe-four-backend-global-layout.sh
          MINIC_CC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cc" \
            sh tests/compiler/c0/probe-four-backend-global-layout.sh
          # cJSON is now an accepted project: no permissive regression frontier.
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-four-backend-cjson-accept
          # Strict real zlib acceptance: all 15 MiniC-owned TUs, original
          # example/minigzip GNU/QEMU differential, and gzprintf GP/FP ABI.
          sh -n tests/external/zlib/probe-four-backend-frontier.sh
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-four-backend-zlib-accept
          # Lua 5.5.0 is now a strict two-ISA acceptance, not a
          # permissive discovery frontier: all 34 original TUs must pass
          # and both real interpreter/luac binaries must match GNU/QEMU.
          sh -n tests/external/lua/probe-four-backend-frontier.sh
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-four-backend-lua-accept
          # Next original project (no partial success claims). One pinned
          # amalgamation per ISA, timeout and first error with source context.
          # Discovery never treats a blocked TU as accepted SQLite.
          sh -n tests/external/sqlite/probe-four-backend-frontier.sh
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-four-backend-sqlite-frontier

      - name: Fetch certified Stage2 for single-runner Kbuild driver preflight
        if: contains(github.event.head_commit.message, '[minic-stage2-driver-smoke]')
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: 39040013459
          name: minic-current-bootstrap-b1-stage2-v1
          github-token: ${{ github.token }}
          path: build/bootstrap-stage2-driver-smoke/artifact

      - name: Validate host driver finds real self-hosted Stage2 QEMU compiler
        if: contains(github.event.head_commit.message, '[minic-stage2-driver-smoke]')
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/build/bootstrap-stage2-driver-smoke"
          cp -a build/toolchain-focused-t1-v2/bin "$root/bin"
          export COHORT_STAGE2_INVOKE_TRACE="$root/stage2-invocations.tsv"
          : > "$COHORT_STAGE2_INVOKE_TRACE"
          bash tools/ci/minic-bootstrap-stage2-install-kbuild-v1.sh \
            "$root/bin" "$root/artifact/build/bootstrap-current-b1/stage2/minic-stage2-rv64"
          test -s "$COHORT_STAGE2_INVOKE_TRACE"
          echo "BOOTSTRAP_STAGE2_DRIVER_PREFLIGHT=PASS qemu_stage2_dispatch=$(wc -l < "$COHORT_STAGE2_INVOKE_TRACE")"
      - name: Run focused current-product regressions
        id: rv64
        if: steps.owners.outputs.rv64 == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          minic="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic"
          minias="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-as"
          work="$GITHUB_WORKSPACE/build/rv64-focused-v1"

          # Opt-in SHA-checked macro variation audit: one pinned snapshot,
          # nine actual Kbuild contexts, no Linux rebuild or GNU macro query.
          if [[ "${{ contains(github.event.head_commit.message, '[linux-minipp-profile-diff]') && '1' || '0' }}" == 1 ]]; then
            python3 tools/ci/minipp-linux-profile-diff-audit-v1.py \
              --snapshot tests/preprocessor/profiles/rv64-linux-6.6.143-gcc13.json.gz.b64 \
              --report "$work/minipp-profile-diff.json"
          fi
          # The target builtin macro rules are product code, not a disposable
          # CI patch. Every focused regression exercises their exact known
          # GCC13/RV64 Linux compatibility contexts without a GNU subprocess.
          # Validate the exact seven-worker diagnostic code before spending
          # several minutes or gigabytes running full Linux shards.
          python3 -m py_compile tools/ci/minipp-linux-seven-native-stage-v1.py
          python3 -m py_compile tools/ci/minipp-linux-seven-merge-v1.py
          # SHA-attested linker-only build refactor must reuse the exact
          # 2064 MiniC compiler cache identity; unrelated edits must miss.
          python3 tools/ci/linux-runtime-profile-cache-id-v1.py --self-test
          bash -n tools/ci/minild-linux-cache-vdso32-replay-v1.sh
          bash -n tools/ci/linux-runtime-native-union-v1.sh
          bash -n tools/ci/linux-runtime-gcc-cohort-bisect-v1.sh
          bash -n tests/preprocessor/build_reference_predefines.sh
          python3 tests/preprocessor/oracle_riscv_linux_predefines.py --self-check
          # Python is now only the nine-context read-only oracle. The actual
          # target macro producer is compiled into the native minic-cpp.
          bash tests/preprocessor/run-target-predefines-native.sh \
            "$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-cpp"

          MINIC="$minic" \
          BUILD_DIR="$work" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          RISCV_LD=riscv64-linux-gnu-ld \
          RISCV_NM=riscv64-linux-gnu-nm \
          QEMU_RISCV64=qemu-riscv64 \
            bash tests/compiler/c0/run-inline-emission-reachability-rv64.sh

          MINIC="$minic" \
          MINIAS="$minias" \
          BUILD_DIR="$work" \
          RISCV_LD=riscv64-linux-gnu-ld \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/driver/run-constant-if-link-v0.sh

          MINIC="$minic" \
          MINIAS="$minias" \
          BUILD_DIR="$work" \
          RISCV_LD=riscv64-linux-gnu-ld \
          RISCV_READELF=riscv64-linux-gnu-readelf \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/driver/run-section-gc-v0.sh

          echo "MINIC_RV64_FOCUSED_REGRESSIONS_V1=PASS inline-emission=PASS constant-if=PASS section-gc=PASS"

      - name: Profile-only exact earlycon differential against frozen GNU input
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[earlycon-profile-probe]')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_MINIC: ${{ github.workspace }}/build/toolchain-focused-t1-v2/bin/minic
          PROBE_DIR: ${{ github.workspace }}/build/rv64-focused-v1/earlycon-profile-diff
        run: |
          set -Eeuo pipefail
          bash tools/ci/linux-runtime-earlycon-profile-probe-v1.sh

      - name: Validate MiniAR archive contracts
        id: ar_archive
        if: steps.owners.outputs.miniar == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-miniar-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-miniar-a1

      - name: Validate shared ELF reader contract
        id: ar_reader
        if: steps.owners.outputs.miniar == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minielf-reader-a0

      - name: Validate MiniNM archive consumers
        id: ar_nm
        if: steps.owners.outputs.miniar == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-mininm-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-mininm-a1

      - name: Validate shared ELF writer reader and linker-script contracts
        id: ld_shared
        if: steps.owners.outputs.minild == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minielf-reader-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minias-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-script-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-script-a1

      - name: Validate MiniLD static A0-A3 contracts
        id: ld_static
        if: steps.owners.outputs.minild == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-a2
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-a3

      - name: Validate MiniLD dynamic A4-A6 contracts
        id: ld_dynamic
        if: steps.owners.outputs.minild == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-a4
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-a5
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/toolchain-focused-t1-v2 check-minild-a6

      - name: Validate MiniLD section GC contract
        id: ld_gc
        if: steps.owners.outputs.minild == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic" \
          MINIAS="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-as" \
          MINILD="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2/bin/minic-ld" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/toolchain-focused-t1-v2" \
          RISCV_READELF=riscv64-linux-gnu-readelf \
          RISCV_NM=riscv64-linux-gnu-nm \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/linker/run-gc-v0.sh

      - name: Preserve independent MiniC RV64 regression evidence
        if: always() && steps.owners.outputs.rv64 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: minic-rv64-focused-regressions-v1
          path: build/rv64-focused-v1/
          if-no-files-found: ignore
          retention-days: 5

      - name: Publish independent RV64, MiniAR and MiniLD test verdicts
        if: always()
        id: verdict
        shell: bash
        env:
          MODE: ${{ steps.owners.outputs.mode }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/toolchain-focused-t1-verdict
          failures=0
          echo -e 'owner\tcheck\tresult' > build/toolchain-focused-t1-verdict/outcomes.tsv
          result="${{ steps.four.outcome }}"
          printf '%s\t%s\t%s\n' 'four-backend' 'gnu_qemu_cjson_frontier' "$result" >> build/toolchain-focused-t1-verdict/outcomes.tsv
          if [[ "$MODE" == all || "$MODE" == four-backend ]]; then
            if [[ "$result" != success ]]; then echo "T1_OWNER_CHECK_FAILED owner=four-backend check=gnu_qemu result=$result"; failures=1; fi
          elif [[ "$result" != skipped ]]; then
            echo "T1_UNEXPECTED_OWNER_EXECUTION owner=four-backend check=gnu_qemu result=$result"; failures=1
          fi
          result="${{ steps.rv64.outcome }}"
          printf '%s\t%s\t%s\n' 'rv64' 'rv64' "$result" >> build/toolchain-focused-t1-verdict/outcomes.tsv
          if [[ "$MODE" == all || "$MODE" == "minic-rv64" ]]; then
            if [[ "$result" != success ]]; then echo "T1_OWNER_CHECK_FAILED owner=rv64 check=rv64 result=$result"; failures=1; fi
          elif [[ "$result" != skipped ]]; then
            echo "T1_UNEXPECTED_OWNER_EXECUTION owner=rv64 check=rv64 result=$result"; failures=1
          fi
          result="${{ steps.ar_archive.outcome }}"
          printf '%s\t%s\t%s\n' 'miniar' 'ar_archive' "$result" >> build/toolchain-focused-t1-verdict/outcomes.tsv
          if [[ "$MODE" == all || "$MODE" == "miniar" ]]; then
