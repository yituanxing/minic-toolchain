name: MiniC Linux 6.6.143 strict 3-ISA 7-runner GNU LD/QEMU runtime

# A separate explicit runtime campaign: the existing single-runner GNU/QEMU
# workflow and its SHA-locked original GNU golden cache contract are untouched.
on:
  workflow_dispatch:
    inputs:
      regenerate_original_gnu:
        description: 'Regenerate all original GNU inputs in this run; promote the new run ID only after full acceptance'
        type: boolean
        default: false
      reuse_candidate_objects:
        description: 'Explicitly replay SHA-verified candidate C objects from the pinned 21-shard producer run'
        type: boolean
        default: false
      loong_cached_cohort_diagnostic:
        description: 'Opt-in failure-only LoongArch mixed C-owner P0 diagnosis with the exact 2026-11-07 2723-object cache; never strict acceptance'
        type: boolean
        default: false
      fresh_source_targets:
        description: 'Refresh original GNU input artifacts for this target scope; none uses an existing frozen input run'
        type: choice
        default: none
        options: [none, all, x86_64, aarch64, loongarch64]
      fresh_inputs_only:
        description: 'Export original GNU .i/.cmd and SHA receipts only; skip every MiniC candidate shard and LD/QEMU receiver'
        type: boolean
        default: false
      candidate_target:
        description: 'Scope current MiniC candidate C shards and QEMU receivers (not three-ISA acceptance if partial)'
        type: choice
        default: all
        options: [all, x86_64, aarch64, loongarch64]
      frozen_input_run_id:
        description: 'Source-export Actions run ID for frozen input reuse; must contain all selected original .i/.cmd shard artifacts'
        type: string
        default: '41181106144'
      resume_candidate_run_id:
        description: 'Explicit prior FAILED candidate run containing per-owner partial artifacts; resume only identical SHA corpus/compiler/tools'
        type: string
        default: ''
  # GitHub App ref updates can suppress downstream push-triggered Actions.
  # Keep the proven PR entry point, but admit its expensive jobs ONLY when
  # HEAD itself changed the explicit one-shot trigger marker.
  pull_request:
    paths:
      - '.github/workflows/minic-linux-three-isa-seven-runtime-v1.yml'
      - 'tools/ci/linux-three-isa-seven-runtime-trigger.txt'
      - 'tools/ci/linux-three-isa-seven-source-refresh-trigger.txt'
      - 'tools/ci/linux-three-isa-seven-candidate-trigger.txt'
      - 'tools/ci/linux-rv32-history-preserve-trigger.txt'
  push:
    branches: [refactor/minic-target-language-boundary]
    paths:
      - 'tools/ci/linux-three-isa-seven-runtime-trigger.txt'
      - 'tools/ci/linux-three-isa-seven-source-refresh-trigger.txt'
      - 'tools/ci/linux-three-isa-seven-candidate-trigger.txt'
      - 'tools/ci/linux-rv32-history-preserve-trigger.txt'

permissions:
  contents: read
  actions: read

env:
  # One reviewed original GNU/Kbuild producer; not the current MiniC revision.
  # The default 2026-10-31 producer's short-lived artifacts may have expired.
  # Use dispatch fresh_source_targets=all,fresh_inputs_only=true once, retain
  # original frozen inputs for 90 days and pin that source-export run ID in a
  # later candidate replay. Never silently reconstruct C inputs from GCC C.
  MINIC_LINUX_PINNED_INPUT_RUN: '41181106144'
  # All 21 original MiniC C/GNU AS object shards must be SHA-proven against
  # the byte-identical compiler pair before receiver-only replay is accepted.
  MINIC_LINUX_PINNED_OBJECT_RUN: '41181106144'
  # Immutable original 2723-owner LoongArch/GNU-AS producer and compiler pair.
  MINIC_LINUX_LOONG_COHORT_OBJECT_RUN: '42378020139'

concurrency:
  # One exact candidate HEAD shared by push and PR events.  A GitHub App
  # update can deliver either/both; never execute two costly 3x7 campaigns.
  group: minic-linux-seven-runtime-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # This job is a historical retention operation only. A new PR-only workflow
  # is not necessarily registered on the repository default branch, so keep
  # the one-shot archival gate on this already-registered runtime workflow.
  # It never builds candidate C, links Linux, or starts QEMU.
  rv32-historical-evidence-preserve:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require this exact PR HEAD to change the historical marker
        id: admit
        shell: bash
        run: |
          set -Eeuo pipefail
          marker=tools/ci/linux-rv32-history-preserve-trigger.txt
          active=false
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
              ! git diff --quiet HEAD^ HEAD -- "$marker" &&
              grep -Fxq 'source_run=41212514498' "$marker" &&
              grep -Fxq 'source_merge_commit=796f2b44fada71218a22fc506ae50ecfe6b43342' "$marker" &&
              grep -Fxq 'nonce=2026-11-07-preserve-existing-v2' "$marker"; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "RV32_HISTORY_PRESERVE_GATE=$active original_run=41212514498 current_head=$(git rev-parse HEAD)"
      - name: Restore all nine original 2026-10-31 GNU and MiniC artifacts
        if: steps.admit.outputs.active == 'true'
        uses: actions/download-artifact@v4
        with:
          repository: yituanxing/minic-toolchain
          run-id: '41212514498'
          github-token: ${{ github.token }}
          pattern: '*'
          merge-multiple: false
          path: build/rv32-history-preserve/source-run-41212514498
      - name: Verify historical 1741 ELF32 objects and twelve original QEMU boots
        if: steps.admit.outputs.active == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          base=build/rv32-history-preserve
          python3 tools/ci/verify_rv32_history_bundle_v1.py \
            --input "$base/source-run-41212514498" \
            --receipt "$base/HISTORICAL-NOT-CURRENT-HEAD-VERDICT.json"
          sha256sum "$base/source-run-41212514498"/linux-rv32i-seven-shard-Image-*/out/arch/riscv/boot/Image
      - name: Retain independently verified historical evidence for ninety days
        if: steps.admit.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rv32i-original-1741-12boot-history-41212514498
          path: build/rv32-history-preserve/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Mark historical-only result, never current compiler acceptance
        if: steps.admit.outputs.active == 'true'
        run: |
          echo 'RV32_HISTORY_PRESERVE=PASS historical_MiniC_C=1741/1741 historical_QEMU_P1=12/12 current_MiniC_C=NOT_RUN current_QEMU_P1=NOT_RUN'
          echo 'Historical input run #41212514498, nine original artifacts, SHA-verified and retained 90 days. No current-head compilation or QEMU was executed.' >> "$GITHUB_STEP_SUMMARY"

  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      regenerate: ${{ steps.decide.outputs.regenerate }}
      reuse_objects: ${{ steps.decide.outputs.reuse_objects }}
      only_aarch64: ${{ steps.decide.outputs.only_aarch64 }}
      only_x86_64: ${{ steps.decide.outputs.only_x86_64 }}
      source_only: ${{ steps.decide.outputs.source_only }}
      source_scope: ${{ steps.decide.outputs.source_scope }}
      partial_target: ${{ steps.decide.outputs.partial_target }}
      input_run: ${{ steps.decide.outputs.input_run }}
      resume_run: ${{ steps.decide.outputs.resume_run }}
      producer_targets: ${{ steps.decide.outputs.producer_targets }}
      receiver_targets: ${{ steps.decide.outputs.receiver_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Authenticate explicit marker push or manual dispatch
        id: decide
        shell: bash
        env:
          REQUESTED_SOURCE_SCOPE: ${{ inputs.fresh_source_targets }}
          REQUESTED_CANDIDATE_SCOPE: ${{ inputs.candidate_target }}
          REQUESTED_FROZEN_INPUT_RUN: ${{ inputs.frozen_input_run_id }}
          REQUESTED_RESUME_RUN: ${{ inputs.resume_candidate_run_id }}
        run: |
          set -Eeuo pipefail
          active=false
          regenerate=false
          reuse_objects=false
          only_aarch64=false
          only_x86_64=false
          source_only=false
          source_scope=none
          candidate_scope=all
          input_run="$MINIC_LINUX_PINNED_INPUT_RUN"
          resume_run=''
          source_refresh_marker=false
          candidate_marker=false
          if [[ '${{ github.event_name }}' == workflow_dispatch ]]; then
            active=true
            if [[ '${{ inputs.regenerate_original_gnu }}' == true ]]; then
              regenerate=true
            fi
            if [[ '${{ inputs.reuse_candidate_objects }}' == true ]]; then
              reuse_objects=true
            fi
            source_scope="${REQUESTED_SOURCE_SCOPE:-none}"
            candidate_scope="${REQUESTED_CANDIDATE_SCOPE:-all}"
            input_run="${REQUESTED_FROZEN_INPUT_RUN:-$MINIC_LINUX_PINNED_INPUT_RUN}"
            resume_run="${REQUESTED_RESUME_RUN:-}"
            if [[ "$source_scope" != none ]]; then
              regenerate=true
            fi
            if [[ '${{ inputs.fresh_inputs_only }}' == true ]]; then
              source_only=true
            fi
          elif [[ '${{ github.event_name }}' == push ]]; then
            # push.paths matches the entire pushed range, not necessarily HEAD.
            # Require the marker in this exact commit, as with pull_request.
            if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
               ! git diff --quiet HEAD^ HEAD -- tools/ci/linux-three-isa-seven-runtime-trigger.txt; then
              active=true
            fi
            if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
               ! git diff --quiet HEAD^ HEAD -- tools/ci/linux-three-isa-seven-source-refresh-trigger.txt; then
              active=true
              source_refresh_marker=true
            fi
            if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
               ! git diff --quiet HEAD^ HEAD -- tools/ci/linux-three-isa-seven-candidate-trigger.txt; then
              active=true
              candidate_marker=true
            fi
          elif [[ '${{ github.event_name }}' == pull_request ]] &&
               git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
               ! git diff --quiet HEAD^ HEAD -- tools/ci/linux-three-isa-seven-runtime-trigger.txt; then
            active=true
          fi
          if [[ '${{ github.event_name }}' == pull_request ]] &&
             git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
             ! git diff --quiet HEAD^ HEAD -- tools/ci/linux-three-isa-seven-source-refresh-trigger.txt; then
            active=true
            source_refresh_marker=true
          fi
          if [[ '${{ github.event_name }}' == pull_request ]] &&
             git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
             ! git diff --quiet HEAD^ HEAD -- tools/ci/linux-three-isa-seven-candidate-trigger.txt; then
            active=true
            candidate_marker=true
          fi
          if [[ "$active" == true && '${{ github.event_name }}' != workflow_dispatch ]]; then
            # A one-shot HEAD subject is shared by push and PR delivery. The
            # persisted marker file alone never silently enables object reuse.
            head_subject=$(git log -1 --format=%s)
            if [[ "$head_subject" == *'[minic-regen-gnu]'* ]]; then
              regenerate=true
            fi
            if [[ "$head_subject" == *'[minic-reuse-objects]'* ]]; then
              reuse_objects=true
            fi
            if [[ "$head_subject" == *'[minic-only-aarch64]'* ]]; then
              only_aarch64=true
            fi
            if [[ "$head_subject" == *'[minic-only-x86_64]'* ]]; then
              only_x86_64=true
            fi
          fi
          if [[ "$source_refresh_marker" == true ]]; then
            # Exact one-shot, source-only marker. A regular source/CI commit
            # cannot restart 21 expensive MiniC candidate workers.
            mapfile -t source_marker < tools/ci/linux-three-isa-seven-source-refresh-trigger.txt
            if [[ "${#source_marker[@]}" != 3 ||
                  ! "${source_marker[0]}" =~ ^sources=(all|x86_64|aarch64|loongarch64)$ ||
                  "${source_marker[1]}" != 'mode=input-only' ||
                  ! "${source_marker[2]}" =~ ^nonce=[0-9]{8}-[0-9]{1,5}$ ]]; then
              echo 'Source-refresh marker requires validated sources/mode/nonce and is always input-only' >&2
              exit 1
            fi
            source_scope="${source_marker[0]#sources=}"
            source_only=true
            regenerate=true
          fi
          if [[ "$candidate_marker" == true ]]; then
            # The separately reviewed original GNU source-export job has
            # already completed. One explicit marker may replay only ONE
            # architecture's seven current MiniC owners; never all 21.
            if [[ "$source_refresh_marker" == true ]]; then
              echo 'Source-only regeneration and candidate-only replay cannot share one HEAD' >&2
              exit 1
            fi
            mapfile -t candidate_lines < tools/ci/linux-three-isa-seven-candidate-trigger.txt
            if [[ "${#candidate_lines[@]}" != 4 ||
                  ! "${candidate_lines[0]}" =~ ^target=(x86_64|aarch64|loongarch64)$ ||
                  ! "${candidate_lines[1]}" =~ ^input_run=[1-9][0-9]{7,14}$ ||
                  ! "${candidate_lines[2]}" =~ ^nonce=[0-9]{8}-[0-9]{1,5}$ ||
                  "${candidate_lines[3]}" != 'mode=candidate-only' ]]; then
              echo 'Candidate marker requires one target, real input-run ID, nonce, candidate-only mode' >&2
              exit 1
            fi
            if [[ "$regenerate" == true || "$reuse_objects" == true ||
                  "$only_aarch64" == true || "$only_x86_64" == true ]]; then
              echo 'One-target current MiniC replay refuses conflicting GNU/reuse/legacy marker flags' >&2
              exit 1
            fi
            candidate_scope="${candidate_lines[0]#target=}"
            input_run="${candidate_lines[1]#input_run=}"
          fi
          if [[ "$regenerate" == true && "$reuse_objects" == true ]]; then
            echo 'Refuse simultaneous original-GNU regeneration and candidate-object reuse' >&2
            exit 1
          fi
          if [[ ! "$input_run" =~ ^[0-9]{8,15}$ ]]; then
            echo 'Frozen original-source run ID must be an explicit decimal Actions run ID' >&2
            exit 1
          fi
          if [[ -n "$resume_run" ]]; then
            if [[ ! "$resume_run" =~ ^[0-9]{8,15}$ ||
                  "$resume_run" == '${{ github.run_id }}' ||
                  "$regenerate" == true || "$reuse_objects" == true ||
                  "$source_only" == true ]]; then
              echo 'Partial resume requires an earlier explicit run ID and identical frozen-input candidate mode' >&2
              exit 1
            fi
          fi
          if [[ "$source_only" == true && "$regenerate" != true ]]; then
            echo 'Original inputs-only capture requires explicit original GNU regeneration' >&2
            exit 1
          fi
          if [[ "$source_scope" != none && "$source_scope" != all &&
                "$source_scope" != x86_64 && "$source_scope" != aarch64 &&
                "$source_scope" != loongarch64 ]]; then
            echo 'Unsupported original-source scope' >&2
            exit 1
          fi
          if [[ "$candidate_scope" != all && "$candidate_scope" != x86_64 &&
                "$candidate_scope" != aarch64 && "$candidate_scope" != loongarch64 ]]; then
            echo 'Unsupported MiniC candidate target' >&2
            exit 1
          fi
          if [[ "$source_scope" != none && "$candidate_scope" != all && "$source_scope" != "$candidate_scope" ]]; then
            echo 'Source regeneration and MiniC candidate scopes disagree' >&2
            exit 1
          fi
          if [[ "$only_aarch64" == true && "$reuse_objects" != true ]]; then
            echo 'Legacy AArch64-only receiver replay requires SHA-verified reused candidate objects' >&2
            exit 1
          fi
          if [[ "$only_aarch64" == true && "$only_x86_64" == true ]]; then
            echo 'Refuse simultaneous partial AArch64 and x86 development modes' >&2
            exit 1
          fi
          if [[ "$only_x86_64" == true && ( "$regenerate" == true || "$reuse_objects" == true ) ]]; then
            echo 'x86-only development needs the pinned GNU .i/.cmd and seven fresh exact-HEAD MiniC shards' >&2
            exit 1
          fi
          if [[ '${{ inputs.loong_cached_cohort_diagnostic }}' == true &&
                ( "$reuse_objects" != true || "$candidate_scope" != loongarch64 ||
                  "$source_scope" != none || "$regenerate" == true ) ]]; then
            echo 'Loong cached cohort requires receiver-only replay of the exact pinned Loong objects; no GNU regeneration' >&2
            exit 1
          fi
          producer_targets='["x86_64","aarch64","loongarch64"]'
          receiver_targets='["x86_64","aarch64","loongarch64"]'
          if [[ "$only_aarch64" == true ]]; then
            receiver_targets='["aarch64"]'
          fi
          if [[ "$only_x86_64" == true ]]; then
            producer_targets='["x86_64"]'
            receiver_targets='["x86_64"]'
          fi
          selected="$candidate_scope"
          if [[ "$source_scope" != none ]]; then
            selected="$source_scope"
          fi
          if [[ "$selected" != all ]]; then
            producer_targets="[\"$selected\"]"
            receiver_targets="[\"$selected\"]"
          fi
          partial_target="$selected"
          if [[ "$only_aarch64" == true ]]; then partial_target=aarch64; fi
          if [[ "$only_x86_64" == true ]]; then partial_target=x86_64; fi
          echo "run=$active" >> "$GITHUB_OUTPUT"
          echo "regenerate=$regenerate" >> "$GITHUB_OUTPUT"
          echo "reuse_objects=$reuse_objects" >> "$GITHUB_OUTPUT"
          echo "only_aarch64=$only_aarch64" >> "$GITHUB_OUTPUT"
          echo "only_x86_64=$only_x86_64" >> "$GITHUB_OUTPUT"
          echo "source_only=$source_only" >> "$GITHUB_OUTPUT"
          echo "source_scope=$source_scope" >> "$GITHUB_OUTPUT"
          echo "partial_target=$partial_target" >> "$GITHUB_OUTPUT"
          echo "input_run=$input_run" >> "$GITHUB_OUTPUT"
          echo "resume_run=$resume_run" >> "$GITHUB_OUTPUT"
          echo "producer_targets=$producer_targets" >> "$GITHUB_OUTPUT"
          echo "receiver_targets=$receiver_targets" >> "$GITHUB_OUTPUT"
          echo "MINIC_LINUX_SEVEN_EXACT_HEAD_GATE=$active regenerate=$regenerate reuse_objects=$reuse_objects source_only=$source_only source_scope=$source_scope partial_target=$partial_target input_run=$input_run producers=$producer_targets receivers=$receiver_targets sha=$(git rev-parse HEAD)"
          {
            echo '### MiniC Linux 3x7 exact-head campaign'
            echo "Run: $active; GNU source refresh: $source_scope; source-only: $source_only; MiniC target: $partial_target; pinned frozen source run: $input_run; reused objects: $reuse_objects"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Producer targets: $producer_targets"
            echo "Receiver targets: $receiver_targets"
            if [[ '${{ inputs.loong_cached_cohort_diagnostic }}' == true ]]; then
              echo 'DIAGNOSTIC_ONLY: historical ACE5 compiler/2723 C objects from official run 42378020139; current HEAD not eligible for compiler/Linux strict acceptance.'
            elif [[ "$reuse_objects" == true ]]; then
              echo "Candidate objects: pinned producer run $MINIC_LINUX_PINNED_OBJECT_RUN (byte-identical current compiler pair mandatory)."
            fi
            echo 'A gate success is never Linux C/LD/QEMU acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

  minic-binary:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify strict seven-runner CLI and original candidate test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/ci/linux-three-isa-seven-runtime-v1.py tools/ci/linux-three-isa-minic-candidate-v1.py
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py selftest
          python3 tools/ci/test_linux_three_isa_seven_runtime_v1.py
          python3 tools/ci/test_linux_three_isa_seven_partial_v1.py
          python3 tools/ci/test_linux_three_isa_candidate_marker_gate_v1.py
          python3 tools/ci/linux-three-isa-minic-candidate-v1.py --self-test
          python3 tools/ci/test_linux_three_isa_candidate_shard_cache_v1.py
          python3 tools/ci/linux-three-isa-loongarch64-early-boot-pc-v1.py --self-test
          python3 -m unittest tools/ci/test_linux_three_isa_boot_cohort_diagnostic_v1.py
      - name: Build exactly one immutable MiniC and minic-cc for all 21 workers
        if: inputs.loong_cached_cohort_diagnostic != true
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minic-seven-bin \
            build/minic-seven-bin/bin/minic build/minic-seven-bin/bin/minic-cc
          test -x build/minic-seven-bin/bin/minic
          test -x build/minic-seven-bin/bin/minic-cc
          sha256sum build/minic-seven-bin/bin/minic build/minic-seven-bin/bin/minic-cc
          MINIC_CC="$PWD/build/minic-seven-bin/bin/minic" \
            BUILD_DIR="$PWD/build/minic-seven-bin" \
            bash tests/compiler/c0/probe-direct-lp64-source-object-slot-reuse.sh
          MINIC_CC="$PWD/build/minic-seven-bin/bin/minic" \
            bash tests/compiler/c0/probe-x86-variadic-no-sse.sh
          MINIC_CC="$PWD/build/minic-seven-bin/bin/minic-cc" \
            BUILD_DIR="$PWD/build/minic-seven-bin" \
            bash tests/compiler/c0/run-x86-gnu-vector-size-copy.sh
      - name: Use only authentic ACE5 compiler binaries for historical Loong cohort diagnosis
        if: inputs.loong_cached_cohort_diagnostic == true
        uses: actions/download-artifact@v4
        with:
          name: minic-linux-seven-compiler
          repository: ${{ github.repository }}
          run-id: ${{ env.MINIC_LINUX_LOONG_COHORT_OBJECT_RUN }}
          github-token: ${{ github.token }}
          path: build/minic-seven-bin/bin
      - name: Restore pinned producer's immutable MiniC compiler pair for receiver-only replay
        if: needs.gate.outputs.reuse_objects == 'true'
        uses: actions/download-artifact@v4
        with:
          name: minic-linux-seven-compiler
          repository: ${{ github.repository }}
          run-id: ${{ inputs.loong_cached_cohort_diagnostic == true && env.MINIC_LINUX_LOONG_COHORT_OBJECT_RUN || env.MINIC_LINUX_PINNED_OBJECT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pinned-minic-seven-compiler
      - name: Require byte-identical MiniC and minic-cc before reusing 21 candidate shards
        if: needs.gate.outputs.reuse_objects == 'true' && inputs.loong_cached_cohort_diagnostic != true
        shell: bash
        run: |
          set -Eeuo pipefail
          for binary in minic minic-cc; do
            old="$RUNNER_TEMP/pinned-minic-seven-compiler/$binary"
            current="build/minic-seven-bin/bin/$binary"
            test -s "$old"
            test -s "$current"
            cmp "$old" "$current"
            echo "MINIC_SEVEN_REUSED_COMPILER_BYTE_IDENTICAL=$binary sha256=$(sha256sum "$current" | cut -d' ' -f1)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-compiler
          path: |
            build/minic-seven-bin/bin/minic
            build/minic-seven-bin/bin/minic-cc
          compression-level: 1
          if-no-files-found: error
          retention-days: 7

  original-gnu-golden:
    needs: [gate, minic-binary]
    # The known-good 21 frozen .i/.cmd input artifacts already exist. Keep
    # this producer for explicit original-source regeneration only; like
    # MiniAS pinned-3x7, normal compiler fixes NEVER rebuild/re-upload them.
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.regenerate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.gate.outputs.producer_targets) }}
    env:
      GNU_WORK: ${{ github.workspace }}/build/minic-linux-gnu-${{ matrix.target }}
      RUNTIME_OUTPUT: ${{ github.workspace }}/build/minic-seven-gnu-boot-${{ matrix.target }}
      LOONG_FIRMWARE_URL: https://raw.githubusercontent.com/loongson/Firmware/9e2b59f4f0d0c40258fade9769cd93c8034fd436/LoongArchVirtMachine/QEMU_EFI.fd
      LOONG_FIRMWARE_SHA256: b375639ebcf7a873d2cab67f0c9c1c6c208fc3f1bcba4083172fa20c4fb7e1ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: minic-linux-seven-compiler
          path: build/minic-seven-bin/bin
      - name: Verify exact compiler source HEAD and restore executable bits
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          chmod +x build/minic-seven-bin/bin/minic build/minic-seven-bin/bin/minic-cc
      - name: Install exact original GNU Kbuild and target QEMU prerequisites
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev cpio gzip curl \
            xz-utils make python3
          case '${{ matrix.target }}' in
            x86_64) sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 ;;
            aarch64) sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                         gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
                         libc6-dev-arm64-cross qemu-system-arm ;;
            loongarch64) sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                            gcc-13-loongarch64-linux-gnu binutils-loongarch64-linux-gnu \
                            libc6-dev-loong64-cross qemu-system-misc ;;
          esac
      - name: Identify original GNU golden exact cache key without MiniC HEAD
        id: gnu-key
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) gcc=gcc; ld=ld; assembler=as ;;
            aarch64) gcc=aarch64-linux-gnu-gcc; ld=aarch64-linux-gnu-ld; assembler=aarch64-linux-gnu-as ;;
            loongarch64) gcc=loongarch64-linux-gnu-gcc-13; ld=loongarch64-linux-gnu-ld; assembler=loongarch64-linux-gnu-as ;;
          esac
          signature=$(
            {
              printf '%s\n' \
                'cache_contract=three-isa-gnu-golden-precandidate-v1' \
                'linux=6.6.143' \
                'linux_tar_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932' \
                'config_profile=broad' \
                'gnu_qemu_p0_p1_must_rerun=true' \
                "target=${{ matrix.target }}" \
                "gnu_work=$GNU_WORK" \
                "workspace=$GITHUB_WORKSPACE"
              for tool in "$gcc" "$ld" "$assembler" gcc ld as make bison flex bc; do
                exe=$(command -v "$tool")
                test -s "$exe"
                printf '%s:%s:%s\n' "$tool" "$exe" "$(sha256sum "$exe" | cut -d' ' -f1)"
              done
              sha256sum \
                tools/ci/linux-three-isa-golden-v1.sh \
                tools/ci/linux-three-isa-golden-v1.py \
                tools/ci/linux-three-isa-freeze-i-v1.py \
                tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
                tools/ci/linux-three-isa-common.config
            } | sha256sum | cut -c1-32
          )
          echo "key=linux-three-isa-gnu-golden-6.6.143-${{ matrix.target }}-$signature" >> "$GITHUB_OUTPUT"
          echo "THREE_ISA_SEVEN_GNU_CACHE_KEY=$signature target=${{ matrix.target }}"
      - uses: actions/cache/restore@v4
        id: gnu-cache
        with:
          path: ${{ env.GNU_WORK }}
          key: ${{ steps.gnu-key.outputs.key }}
      - name: Build truly original GNU Linux only on exact cache MISS
        if: steps.gnu-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GNU_WORK"
          MINIC_LINUX_CONFIG_PROFILE=broad bash tools/ci/linux-three-isa-golden-v1.sh \
            '${{ matrix.target }}' "$GNU_WORK"
      - name: Verify any restored complete GNU Kbuild against original SHA
        if: steps.gnu-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) gcc=gcc ;;
            aarch64) gcc=aarch64-linux-gnu-gcc ;;
            loongarch64) gcc=loongarch64-linux-gnu-gcc-13 ;;
          esac
          python3 tools/ci/linux-three-isa-gnu-cache-verify-v1.py \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" --gcc "$gcc"
      - name: Verify authentic LoongArch original EFI boot image and firmware
        if: matrix.target == 'loongarch64'
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v qemu-system-loongarch64
          test -s "$GNU_WORK/build/arch/loongarch/boot/vmlinux.efi"
          mkdir -p "$RUNTIME_OUTPUT"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            "$LOONG_FIRMWARE_URL" -o "$RUNTIME_OUTPUT/QEMU_EFI.fd"
          printf '%s  %s\n' "$LOONG_FIRMWARE_SHA256" "$RUNTIME_OUTPUT/QEMU_EFI.fd" | sha256sum -c -
      - name: Build original target GNU initramfs and 12-syscall oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) cc=gcc ;;
            aarch64) cc=aarch64-linux-gnu-gcc ;;
            loongarch64) cc=loongarch64-linux-gnu-gcc-13 ;;
          esac
          mkdir -p "$RUNTIME_OUTPUT"
          RISCV_CC="$cc" BUILD_DIR="$RUNTIME_OUTPUT/initramfs" \
            OUTPUT_INITRAMFS="$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            bash tests/external/linux/build_runtime_initramfs.sh
      - name: Fresh QEMU GNU-only original P0/P1 oracle on this exact cache
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          args=()
          if [[ '${{ matrix.target }}' == loongarch64 ]]; then
            args+=(--firmware "$RUNTIME_OUTPUT/QEMU_EFI.fd" \
                   --firmware-sha256 "$LOONG_FIRMWARE_SHA256")
          fi
          python3 tools/ci/linux-three-isa-gnu-qemu-v1.py \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --initramfs-root "$RUNTIME_OUTPUT/initramfs/root" \
            --output "$RUNTIME_OUTPUT/boot" --timeout 240 "${args[@]}"
      - name: Bind fresh P0/P1 receipt to immutable GNU golden
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) gcc=gcc ;;
            aarch64) gcc=aarch64-linux-gnu-gcc ;;
            loongarch64) gcc=loongarch64-linux-gnu-gcc-13 ;;
          esac
          python3 tools/ci/linux-three-isa-gnu-cache-verify-v1.py \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" --gcc "$gcc" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json"
      - name: Save original GNU golden before any candidate C-object modifications
        if: steps.gnu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.GNU_WORK }}
          key: ${{ steps.gnu-key.outputs.key }}
      - name: Export seven non-overlapping original GNU -E/.o.cmd input artifacts
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py export \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --output "$GITHUB_WORKSPACE/build/minic-seven-export-${{ matrix.target }}"
      - name: Require complete original owner census and historical original GNU input SHA parity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$GITHUB_WORKSPACE/build/minic-seven-export-${{ matrix.target }}" '${{ matrix.target }}' \
            "tools/ci/fixtures/linux-6.6.143-original-input-sha-${{ matrix.target }}.tsv" <<'PY'
          import hashlib, json, pathlib, sys
          root, target = pathlib.Path(sys.argv[1]), sys.argv[2]
          historic = pathlib.Path(sys.argv[3])
          identities = [json.loads((root / str(shard) / 'identity.json').read_text())
                        for shard in range(7)]
          total = {'x86_64': 2758, 'aarch64': 4108, 'loongarch64': 2723}[target]
          expected = [len(range(shard, total, 7)) for shard in range(7)]
          actual = [row['shard_c_owners'] for row in identities]
          assert all(row['target'] == target and row['shard'] == shard
                     and row['total_c_owners'] == total
                     for shard, row in enumerate(identities)), f'{target} source owner identity mismatch'
          assert actual == expected, f'{target} frozen source owner shards changed: {actual}'
          for field in ('frozen_manifest_sha256', 'original_config_sha256',
                        'original_owner_list_sha256', 'gnu_c_owner_manifest_sha256'):
              assert len({row[field] for row in identities}) == 1, f'{target} source {field} inconsistent'
          # The 2026-10-31 original-GNU receiver is the known-good historical
          # baseline. This fingerprint checks the old config/owner universe;
          # the TSV below additionally checks every original GNU -E byte SHA.
          historical_ids = {
              'x86_64': (
                  'e2ec24b7076d99ac9c1bf842ded47e91ba6dfacacc28dd027ec6487d8709e264',
                  'f12e533e1a4079f13aca28e314f56570fe22f8fed1da89b1a98289acc62a715d'),
              'aarch64': (
                  '36279e6a49dd79ac1d302e871c326a1aaff4522b2fd2968a9755296ac5293f8c',
                  '45ce687974258eb80f1bedb62c55646180d2df8e9ffc069c106adcef9243cc5f'),
              'loongarch64': (
                  '5cd1dcd0cd3db4f8d2713fd3fbd0a550198fd4f0c4598a31b290b1600573b9d2',
                  '64f7be34f20e9c752079f03510c6151b22e4479a71500448a275976b32077592'),
          }
          if target in historical_ids:
              old_config, old_owner_manifest = historical_ids[target]
              assert identities[0]['original_config_sha256'] == old_config, 'historic GNU config SHA changed'
              assert identities[0]['gnu_c_owner_manifest_sha256'] == old_owner_manifest, 'historic GNU C owner manifest SHA changed'
          manifest = json.loads((root / '0/frozen/manifest.json').read_text())
          current = sorted(f"{row['object']}\t{row['sha256']}" for row in manifest['rows'])
          reference = sorted(line for line in historic.read_text().splitlines() if line)
          assert len(reference) == total and len(set(reference)) == total, 'historic GNU SHA fixture incomplete'
          assert len(current) == total and len(set(current)) == total, 'current GNU SHA owner census corrupt'
          if current != reference:
              mismatch = next(((old, new) for old, new in zip(reference, current) if old != new), None)
              raise AssertionError(f'{target} original GNU .i differs from historical pinned source: {mismatch}')
          owner_input_sha = hashlib.sha256(('\n'.join(current) + '\n').encode()).hexdigest()
          print('ORIGINAL_LINUX_C_OWNERS=PASS target=' + target + ' total=' + str(total)
                + ' shards=' + str(actual)
                + ' historical_i_sha_pairs=' + str(len(current)) + '/' + str(total)
                + ' owner_input_sha=' + owner_input_sha
                + ' manifest_sha=' + identities[0]['frozen_manifest_sha256']
                + ' config_sha=' + identities[0]['original_config_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-0
          path: build/minic-seven-export-${{ matrix.target }}/0/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-1
          path: build/minic-seven-export-${{ matrix.target }}/1/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-2
          path: build/minic-seven-export-${{ matrix.target }}/2/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-3
          path: build/minic-seven-export-${{ matrix.target }}/3/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-4
          path: build/minic-seven-export-${{ matrix.target }}/4/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-5
          path: build/minic-seven-export-${{ matrix.target }}/5/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-6
          path: build/minic-seven-export-${{ matrix.target }}/6/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 90
      - name: Preserve exact original GNU P0/P1 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-gnu-evidence-${{ matrix.target }}
          path: |
            build/minic-seven-gnu-boot-${{ matrix.target }}/boot/
            build/minic-linux-gnu-${{ matrix.target }}/evidence/
          if-no-files-found: warn
          retention-days: 90

  seven-independent-runners:
    needs: [gate, minic-binary, original-gnu-golden]
    # A failing GNU LoongArch platform must not suppress live x86/AArch64
    # evidence: each independent worker requires *its* real input artifact.
    if: >-
      always() && needs.gate.outputs.run == 'true' &&
      needs.gate.outputs.source_only != 'true' &&
      needs.gate.outputs.reuse_objects != 'true' &&
      needs.minic-binary.result == 'success' &&
      (needs.gate.outputs.regenerate != 'true' ||
       needs.original-gnu-golden.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        target: ${{ fromJSON(needs.gate.outputs.producer_targets) }}
        shard: [0, 1, 2, 3, 4, 5, 6]
    env:
      INPUT: ${{ github.workspace }}/build/minic-seven-input-${{ matrix.target }}-${{ matrix.shard }}
      OUTPUT: ${{ github.workspace }}/build/minic-seven-object-${{ matrix.target }}-${{ matrix.shard }}
      CACHE: ${{ github.workspace }}/build/minic-seven-cache-${{ matrix.target }}-${{ matrix.shard }}
      IDENTITY: ${{ github.workspace }}/build/minic-seven-cache-identity-${{ matrix.target }}-${{ matrix.shard }}.json
      RESUME: ${{ github.workspace }}/build/minic-seven-resume-${{ matrix.target }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authenticate frozen-source producer exact HEAD before cache or MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/download-artifact@v4
        with:
          name: minic-linux-seven-input-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ env.INPUT }}
          # Normal runs use the reviewed frozen producer. Explicit GNU input
          # regeneration must consume this SAME run's new 21 artifacts.
          repository: ${{ github.repository }}
          run-id: ${{ needs.gate.outputs.regenerate == 'true' && github.run_id || needs.gate.outputs.input_run }}
          github-token: ${{ github.token }}
      - name: Authenticate 90-day frozen GNU source against the historical original Linux corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$INPUT" '${{ matrix.target }}' '${{ matrix.shard }}' \
            "tools/ci/fixtures/linux-6.6.143-original-input-sha-${{ matrix.target }}.tsv" <<'PY'
          import hashlib, json, pathlib, sys
          root, target, shard, fixture = pathlib.Path(sys.argv[1]), sys.argv[2], int(sys.argv[3]), pathlib.Path(sys.argv[4])
          historic = {
              'x86_64': (2758, 'e2ec24b7076d99ac9c1bf842ded47e91ba6dfacacc28dd027ec6487d8709e264',
                         'f12e533e1a4079f13aca28e314f56570fe22f8fed1da89b1a98289acc62a715d'),
              'aarch64': (4108, '36279e6a49dd79ac1d302e871c326a1aaff4522b2fd2968a9755296ac5293f8c',
                          '45ce687974258eb80f1bedb62c55646180d2df8e9ffc069c106adcef9243cc5f'),
              'loongarch64': (2723, '5cd1dcd0cd3db4f8d2713fd3fbd0a550198fd4f0c4598a31b290b1600573b9d2',
                              '64f7be34f20e9c752079f03510c6151b22e4479a71500448a275976b32077592'),
          }
          fixture_sha = {
              'x86_64': '4637e32d2c99538744bb2a89f7cd02e64d7a490d3b5147c6ff22d2e7b52d765d',
              'aarch64': 'd6dcf0145700fa87f7e5cfbba63b7d06ab960fb2e94867e6ab1eb5f8f6a676bc',
              'loongarch64': '7e1e6602cde12d11fbe3eedc4c42e571bebb728d23a359726a4bb3cf0aecff50',
          }
          assert hashlib.sha256(fixture.read_bytes()).hexdigest() == fixture_sha[target], 'historic GNU source SHA fixture changed'
          total, config_sha, owner_sha = historic[target]
          identity = json.loads((root / 'identity.json').read_text())
          manifest_path = root / 'frozen/manifest.json'
          manifest = json.loads(manifest_path.read_text())
          assert (identity['target'], identity['shard'], identity['total_c_owners']) == (target, shard, total)
          assert identity['shard_c_owners'] == len(range(shard, total, 7))
          assert identity['frozen_manifest_sha256'] == hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert identity['original_config_sha256'] == config_sha
          assert identity['gnu_c_owner_manifest_sha256'] == owner_sha
          rows = manifest['rows']
          current = sorted(f"{row['object']}\t{row['sha256']}" for row in rows)
          original = sorted(line for line in fixture.read_text().splitlines() if line)
          assert len(current) == total and len(set(current)) == total
          assert current == original, f'{target} source input SHA differs from official historical run'
          print('MINIC_CANDIDATE_FROZEN_SOURCE_SHA=PASS target=' + target + ' shard=' + str(shard)
                + ' current_original=' + str(total) + '/' + str(total)
                + ' source_run=${{ needs.gate.outputs.regenerate == 'true' && github.run_id || needs.gate.outputs.input_run }}')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: minic-linux-seven-compiler
          path: build/minic-seven-bin/bin
      - name: Install only exact target GNU assembler drivers (no Linux GNU Kbuild)
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          chmod +x build/minic-seven-bin/bin/minic build/minic-seven-bin/bin/minic-cc
          case '${{ matrix.target }}' in
            x86_64) command -v gcc; command -v as ;;
            aarch64) sudo apt-get -o Acquire::Retries=3 update -qq
                     sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                       gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu ;;
            loongarch64) sudo apt-get -o Acquire::Retries=3 update -qq
                         sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                           gcc-13-loongarch64-linux-gnu binutils-loongarch64-linux-gnu ;;
          esac
      - name: Bind candidate C-object cache key to exact .i/.cmd, MiniC and GNU AS
        id: object-key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py cache-key \
            --target '${{ matrix.target }}' --shard '${{ matrix.shard }}' \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --input "$INPUT" --output "$IDENTITY"
          python3 - "$IDENTITY" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          with open(sys.argv[2], 'a') as f:
              print('enabled='+str(data['cacheable']).lower(), file=f)
              print('key='+data['key'], file=f)
          PY
      - uses: actions/cache/restore@v4
        id: candidate-cache
        if: steps.object-key.outputs.enabled == 'true'
        with:
          path: ${{ env.CACHE }}
          key: ${{ steps.object-key.outputs.key }}
      - name: Reauthenticate frozen MiniC C/AS shard from exact candidate cache
        if: steps.candidate-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py cache-load \
            --target '${{ matrix.target }}' --shard '${{ matrix.shard }}' \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --input "$INPUT" --output "$OUTPUT" \
            --cache "$CACHE" --cache-identity "$IDENTITY"
      - name: Verify partial artifact comes from this exact commit and workflow
        if: needs.gate.outputs.resume_run != '' && steps.candidate-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ needs.gate.outputs.resume_run }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" |
            python3 -c '
          import json, os, sys
          run = json.load(sys.stdin)
          assert run["head_sha"] == os.environ["EXPECTED_SHA"], "partial prior run belongs to another compiler HEAD"
          assert run["path"] == ".github/workflows/minic-linux-three-isa-seven-runtime-v1.yml", "foreign partial workflow"
          assert run["status"] == "completed" and run["conclusion"] in ("failure", "cancelled", "timed_out"), "partial run not terminated red"
          print("MINIC_PARTIAL_PREVIOUS_RUN_HEAD_SHA=PASS run=" + os.environ["RESUME_RUN_ID"])
          '
      - name: Download explicitly selected FAILED run's partial MiniC objects
        if: needs.gate.outputs.resume_run != '' && steps.candidate-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: minic-linux-seven-partial-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ env.RESUME }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.gate.outputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Compile every original Kbuild C owner on one real independent runner
        id: producer
        if: steps.candidate-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 45
        run: |
          set -Eeuo pipefail
          resume_args=()
          if [[ -n '${{ needs.gate.outputs.resume_run }}' ]]; then
            resume_args=(--resume "$RESUME")
          fi
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py produce \
            --target '${{ matrix.target }}' --shard '${{ matrix.shard }}' \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --input "$INPUT" --output "$OUTPUT" --workers 2 --timeout 240 \
            "${resume_args[@]}"
      - name: Preserve per-owner MiniC + GNU AS objects even when shard fails
        if: always() && (steps.producer.outcome == 'failure' || steps.producer.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-partial-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            ${{ env.OUTPUT }}/checkpoint/
            ${{ env.OUTPUT }}/staged/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 2
          retention-days: 30
      - name: Preserve authenticated candidate cache before any LD/QEMU failure
        if: steps.object-key.outputs.enabled == 'true' && steps.candidate-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py cache-store \
            --target '${{ matrix.target }}' --shard '${{ matrix.shard }}' \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --input "$INPUT" --output "$OUTPUT" \
            --cache "$CACHE" --cache-identity "$IDENTITY"
      - uses: actions/cache/save@v4
        if: steps.object-key.outputs.enabled == 'true' && steps.candidate-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.CACHE }}
          key: ${{ steps.object-key.outputs.key }}
      - name: Export only authentic independently built MiniC C ELF64 objects
        uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-objects-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ env.OUTPUT }}/bundle/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 2
          retention-days: 7
      - name: Preserve authentic first GNU -E / MiniC / GNU AS failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-failure-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            ${{ env.OUTPUT }}/results.json
            ${{ env.OUTPUT }}/staged/**/*.tool-stderr.txt
            ${{ env.OUTPUT }}/failed-owner-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  original-gnu-ld-qemu-receivers:
    needs: [gate, minic-binary, seven-independent-runners]
    # Always provision each target receiver independently, including when
    # another target failed. Missing any of the seven objects is a hard FAIL.
    if: >-
      always() && needs.gate.outputs.run == 'true' &&
      needs.gate.outputs.source_only != 'true' &&
      needs.minic-binary.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.gate.outputs.receiver_targets) }}
    env:
      GNU_WORK: ${{ github.workspace }}/build/minic-linux-gnu-${{ matrix.target }}
      RUNTIME_OUTPUT: ${{ github.workspace }}/build/minic-seven-receiver-${{ matrix.target }}
      LOONG_FIRMWARE_URL: https://raw.githubusercontent.com/loongson/Firmware/9e2b59f4f0d0c40258fade9769cd93c8034fd436/LoongArchVirtMachine/QEMU_EFI.fd
      LOONG_FIRMWARE_SHA256: b375639ebcf7a873d2cab67f0c9c1c6c208fc3f1bcba4083172fa20c4fb7e1ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: minic-linux-seven-compiler
          path: build/minic-seven-bin/bin
      - name: Restore all seven candidate C-object artifacts before GNU setup
        uses: actions/download-artifact@v4
        with:
          pattern: minic-linux-seven-objects-${{ matrix.target }}-*
          path: build/minic-seven-incoming/
          merge-multiple: false
          # Normal mode consumes the current 21 independently built shards.
          # Receiver-only mode consumes the reviewed original producer run,
          # after minic-binary proved that both compiler binaries are identical.
          repository: ${{ github.repository }}
          run-id: ${{ needs.gate.outputs.reuse_objects == 'true' && (inputs.loong_cached_cohort_diagnostic == true && env.MINIC_LINUX_LOONG_COHORT_OBJECT_RUN || env.MINIC_LINUX_PINNED_OBJECT_RUN) || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact official Loong seven-object and compiler ZIP SHA metadata before reuse
        if: matrix.target == 'loongarch64' && inputs.loong_cached_cohort_diagnostic == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          expected = {
              'minic-linux-seven-compiler': (13576945126, '61226efc1e940c4080484ab648b1ee8329e39dfff789a4088121f64422089b79'),
              'minic-linux-seven-objects-loongarch64-0': (13575833950, 'a453258db76ebe13cafd98e3603a6186160c6688a96e3faa39ed051ed371ea5a'),
              'minic-linux-seven-objects-loongarch64-1': (13576292959, '3e5a19746a181eba9ee46bfadfd6aff90685beb3f15111ff2a5c747f68abfc5b'),
              'minic-linux-seven-objects-loongarch64-2': (13575704526, '40e1d6749fb18e641deafa74981b5425b257f11aa3ab513776276f656c314d58'),
              'minic-linux-seven-objects-loongarch64-3': (13575998576, '3d2588e2de011db9d0c9a5e03c41837e4789c1dea0b8728403195de8811afecb'),
              'minic-linux-seven-objects-loongarch64-4': (13576666982, '1b015d9c775ea77db3bc96056d46dff3ab68981946089467c41c804ded411cf2'),
              'minic-linux-seven-objects-loongarch64-5': (13576576488, '2e6cd683dbf8737ba270c0332d2fed07084f50ff92badfbdb712bbbbd932e0b3'),
              'minic-linux-seven-objects-loongarch64-6': (13576442748, '15c5354d3aac4903978acb8d201e157d7547b513c2f1793d9d7df7a41c3a5bc7'),
          }
          url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/actions/runs/42378020139/artifacts?per_page=100'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=20) as response:
              artifacts = json.load(response)['artifacts']
          found = {a['name']: a for a in artifacts}
          for name, (id_, sha) in expected.items():
              a = found.get(name)
              assert a and a['id'] == id_ and a.get('digest') == 'sha256:' + sha and not a['expired'], name
          print('LOONG_CACHED_COHORT_OFFICIAL_ZIP_METADATA=PASS count=8 run=42378020139')
          PY
      - name: Reject partial/foreign seven-shard objects before costly GNU cache
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x build/minic-seven-bin/bin/minic build/minic-seven-bin/bin/minic-cc
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py preflight \
            --target '${{ matrix.target }}' \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --incoming "$GITHUB_WORKSPACE/build/minic-seven-incoming"
      - name: Install unchanged target GNU LD/Kbuild and system QEMU
        timeout-minutes: 15
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x build/minic-seven-bin/bin/minic build/minic-seven-bin/bin/minic-cc
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev cpio gzip curl \
            xz-utils make python3
          case '${{ matrix.target }}' in
            x86_64) sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 ;;
            aarch64) sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                         gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
                         libc6-dev-arm64-cross qemu-system-arm ;;
            loongarch64) sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                            gcc-13-loongarch64-linux-gnu binutils-loongarch64-linux-gnu \
                            libc6-dev-loong64-cross qemu-system-misc ;;
          esac
      - name: Recompute exactly the same GNU golden SHA key as original producer
        id: gnu-key
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) gcc=gcc; ld=ld; assembler=as ;;
            aarch64) gcc=aarch64-linux-gnu-gcc; ld=aarch64-linux-gnu-ld; assembler=aarch64-linux-gnu-as ;;
            loongarch64) gcc=loongarch64-linux-gnu-gcc-13; ld=loongarch64-linux-gnu-ld; assembler=loongarch64-linux-gnu-as ;;
          esac
          signature=$(
            {
              printf '%s\n' \
                'cache_contract=three-isa-gnu-golden-precandidate-v1' \
                'linux=6.6.143' \
                'linux_tar_sha256=dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932' \
                'config_profile=broad' \
                'gnu_qemu_p0_p1_must_rerun=true' \
                "target=${{ matrix.target }}" \
                "gnu_work=$GNU_WORK" \
                "workspace=$GITHUB_WORKSPACE"
              for tool in "$gcc" "$ld" "$assembler" gcc ld as make bison flex bc; do
                exe=$(command -v "$tool")
                test -s "$exe"
                printf '%s:%s:%s\n' "$tool" "$exe" "$(sha256sum "$exe" | cut -d' ' -f1)"
              done
              sha256sum \
                tools/ci/linux-three-isa-golden-v1.sh \
                tools/ci/linux-three-isa-golden-v1.py \
                tools/ci/linux-three-isa-freeze-i-v1.py \
                tools/ci/linux-runtime-gcc-full-c-objects-v1.py \
                tools/ci/linux-three-isa-common.config
            } | sha256sum | cut -c1-32
          )
          echo "key=linux-three-isa-gnu-golden-6.6.143-${{ matrix.target }}-$signature" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: gnu-cache
        # Same real-GNU-on-cache-MISS contract as the earlier RV Linux gate.
        # GitHub may report a cache hit but fail the download when the account
        # reaches its egress limit; never let this hide a MiniC Linux result.
        # The existing cache namespace has ONLY the broad config profile.
        # Authenticate all prefix hits, including config/owner/ELF SHA, below.
        continue-on-error: true
        with:
          path: ${{ env.GNU_WORK }}
          key: ${{ steps.gnu-key.outputs.key }}
          restore-keys: |
            linux-three-isa-gnu-golden-6.6.143-${{ matrix.target }}-
      - name: Authenticate exact or prefix-restored original GNU golden before reuse
        id: restored-gnu-check
        if: steps.gnu-cache.outcome == 'success' && steps.gnu-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) gcc=gcc ;;
            aarch64) gcc=aarch64-linux-gnu-gcc ;;
            loongarch64) gcc=loongarch64-linux-gnu-gcc-13 ;;
          esac
          python3 tools/ci/linux-three-isa-gnu-cache-verify-v1.py \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" --gcc "$gcc"
          echo 'verified=true' >> "$GITHUB_OUTPUT"
          echo 'MINIC_LINUX_GNU_CACHE_RESTORED=SHA_VERIFIED matched_key=${{ steps.gnu-cache.outputs.cache-matched-key }}'
      - name: Rebuild original GNU Kbuild only when no authenticated cache survives
        if: steps.restored-gnu-check.outputs.verified != 'true'
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          if [[ '${{ steps.gnu-cache.outputs.cache-hit }}' == true ]]; then
            # GitHub caches are immutable: a rejected exact hit cannot be
            # overwritten. The fresh tree is still accepted on its own SHA;
            # the poisoned cache key must be explicitly rotated/evicted later.
            echo '::warning::Rejected exact GNU cache; rebuilding. Immutable old exact key will not be overwritten.'
          fi
          # A failed restore may have left partial bytes. Preserve them outside
          # the authenticated work path; golden.sh only accepts a new tree.
          if [[ -e "$GNU_WORK" || -L "$GNU_WORK" ]]; then
            test -d "$GNU_WORK" && test ! -L "$GNU_WORK"
            mv -- "$GNU_WORK" "$RUNNER_TEMP/partial-gnu-${{ matrix.target }}-$GITHUB_RUN_ATTEMPT"
          fi
          MINIC_LINUX_CONFIG_PROFILE=broad bash tools/ci/linux-three-isa-golden-v1.sh \
            '${{ matrix.target }}' "$GNU_WORK"
      - name: Verify original GNU Golden complete immutable cache C/Kbuild SHAs
        shell: bash
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) gcc=gcc ;;
            aarch64) gcc=aarch64-linux-gnu-gcc ;;
            loongarch64) gcc=loongarch64-linux-gnu-gcc-13 ;;
          esac
          python3 tools/ci/linux-three-isa-gnu-cache-verify-v1.py \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" --gcc "$gcc"
      - name: Build unchanged GNU runtime initramfs and Loong EFI original firmware
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          case '${{ matrix.target }}' in
            x86_64) cc=gcc ;;
            aarch64) cc=aarch64-linux-gnu-gcc ;;
            loongarch64) cc=loongarch64-linux-gnu-gcc-13
                         command -v qemu-system-loongarch64
                         mkdir -p "$RUNTIME_OUTPUT"
                         curl --proto '=https' --tlsv1.2 -fL --retry 3 \
                           "$LOONG_FIRMWARE_URL" -o "$RUNTIME_OUTPUT/QEMU_EFI.fd"
                         printf '%s  %s\n' "$LOONG_FIRMWARE_SHA256" "$RUNTIME_OUTPUT/QEMU_EFI.fd" | sha256sum -c - ;;
          esac
          mkdir -p "$RUNTIME_OUTPUT"
          RISCV_CC="$cc" BUILD_DIR="$RUNTIME_OUTPUT/initramfs" \
            OUTPUT_INITRAMFS="$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            bash tests/external/linux/build_runtime_initramfs.sh
      - name: Fresh pristine GNU golden P0/P1 QEMU before replacing any C object
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          args=()
          if [[ '${{ matrix.target }}' == loongarch64 ]]; then
            args+=(--firmware "$RUNTIME_OUTPUT/QEMU_EFI.fd" \
                   --firmware-sha256 "$LOONG_FIRMWARE_SHA256")
          fi
          python3 tools/ci/linux-three-isa-gnu-qemu-v1.py \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --initramfs-root "$RUNTIME_OUTPUT/initramfs/root" \
            --output "$RUNTIME_OUTPUT/boot" --timeout 240 "${args[@]}"
      - name: Save authenticated pristine GNU golden under the current exact key
        # All prefix restores and fresh builds passed GNU SHA verification and
        # a NEW GNU P0/P1 QEMU. Never save a candidate-modified Kbuild tree.
        # Existing exact cache keys are immutable; cache egress/quota conflicts
        # must not turn valid GNU/QEMU evidence into a false compiler failure.
        if: steps.gnu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.GNU_WORK }}
          key: ${{ steps.gnu-key.outputs.key }}
      - name: Pin pristine GNU Loong EFI locally for same-target failure-only PC comparison
        if: matrix.target == 'loongarch64'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "$GNU_WORK/build/arch/loongarch/boot/vmlinux.efi" "$RUNTIME_OUTPUT/loong-gnu-control.efi"
          python3 - "$RUNTIME_OUTPUT" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = json.loads((root / 'boot/gnu-qemu-receipt.json').read_text())['image_sha256']
          got = hashlib.sha256((root / 'loong-gnu-control.efi').read_bytes()).hexdigest()
          assert got == expected, 'pristine Loong EFI differs from passing GNU golden'
          print('LOONG_PRISTINE_GNU_EFI_PINNED=' + got)
          PY
      - name: Pin exactly one original Loong GNU vDSO C object before candidate overlay
        if: matrix.target == 'loongarch64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-loong-vdso-cohort-v1.py pin \
            --gnu-work "$GNU_WORK" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --output "$RUNTIME_OUTPUT/loong-vdso-pin"
      - name: Snapshot pristine x86 GNU Kbuild for bounded RV-style C-owner cohort diagnosis
        if: matrix.target == 'x86_64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          df -h "$GNU_WORK"
          python3 tools/ci/linux-three-isa-boot-cohort-diagnostic-v1.py prepare \
            --gnu-work "$GNU_WORK" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --snapshot-dir "$RUNTIME_OUTPUT/x86-pristine-cohort-snapshot"
      - name: Freeze complete pristine Loong GNU Kbuild for exact cached C-owner cohort diagnosis
        if: matrix.target == 'loongarch64' && inputs.loong_cached_cohort_diagnostic == true
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-boot-cohort-diagnostic-v1.py prepare \
            --target loongarch64 --gnu-work "$GNU_WORK" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --firmware "$RUNTIME_OUTPUT/QEMU_EFI.fd" \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --snapshot-dir "$RUNTIME_OUTPUT/loong-pristine-cohort-snapshot"
          echo 'LOONG_COHORT_HISTORICAL_COMPILER_SOURCE_EPOCH=ace5bd14026c08ab343ea77df979a11f8c7a1a80 current_HEAD_not_certified=true'
      - name: Original GNU Kbuild LD of ALL MiniC C objects and candidate QEMU P0/P1
        shell: bash
        timeout-minutes: 95
        run: |
          set -Eeuo pipefail
          args=()
          if [[ '${{ matrix.target }}' == loongarch64 ]]; then
            args+=(--firmware "$RUNTIME_OUTPUT/QEMU_EFI.fd")
          fi
          python3 tools/ci/linux-three-isa-seven-runtime-v1.py receive \
            --target '${{ matrix.target }}' --gnu-work "$GNU_WORK" \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --gnu-boot-logs "$RUNTIME_OUTPUT/boot" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --incoming "$GITHUB_WORKSPACE/build/minic-seven-incoming" \
            --output "$RUNTIME_OUTPUT/candidate" "${args[@]}"
          if [[ '${{ inputs.loong_cached_cohort_diagnostic }}' == true ]]; then
            echo 'LOONG_COHORT_HISTORICAL_ACE5_REPLAY_ONLY_NO_CURRENT_HEAD_ACCEPTANCE' >&2
            exit 2
          fi
      - name: Capture only failed AArch64 zero-serial early-boot PC and exception trace
        if: failure() && matrix.target == 'aarch64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-aarch64-early-boot-trace-v1.py \
            --image "$GNU_WORK/build/arch/arm64/boot/Image" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --failed-p0 "$RUNTIME_OUTPUT/candidate/boot/p0.log" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --qemu /usr/bin/qemu-system-aarch64 \
            --vmlinux "$GNU_WORK/build/vmlinux" --nm /usr/bin/aarch64-linux-gnu-nm \
            --output "$RUNTIME_OUTPUT/aarch64-early-trace" \
            --timeout 15 --max-bytes 1048576
      - name: Capture only failed x86 BIOS-only P0 exception and reset evidence
        if: failure() && matrix.target == 'x86_64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-x86-early-boot-trace-v1.py \
            --image "$GNU_WORK/build/arch/x86/boot/bzImage" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --failed-p0 "$RUNTIME_OUTPUT/candidate/boot/p0.log" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --qemu /usr/bin/qemu-system-x86_64 \
            --output "$RUNTIME_OUTPUT/x86-early-trace" \
            --timeout 20 --max-bytes 1048576
      - name: Compare x86 compressed 12 C owners and complement using frozen GNU/MiniC objects
        if: failure() && matrix.target == 'x86_64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 28
        run: |
          set -Eeuo pipefail
          test -f "$RUNTIME_OUTPUT/candidate/boot/p0.log"
          test -f "$RUNTIME_OUTPUT/x86-pristine-cohort-snapshot/prepare.json"
          python3 - "$RUNTIME_OUTPUT/candidate/postlink-c-owner-census.json" <<'PY'
          import json, sys
          assert json.load(open(sys.argv[1]))['verdict'] == 'POSTLINK_ALL_C_MINIC_SHA_PASS'
          PY
          for mode in gnu-plus-compressed minic-except-compressed; do
            if python3 tools/ci/linux-three-isa-boot-cohort-diagnostic-v1.py probe \
              --gnu-work "$GNU_WORK" \
              --snapshot-dir "$RUNTIME_OUTPUT/x86-pristine-cohort-snapshot" \
              --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
              --staged "$RUNTIME_OUTPUT/candidate/staged" \
              --results "$RUNTIME_OUTPUT/candidate/all-c-owners-result.json" \
              --trial-dir "$RUNTIME_OUTPUT/x86-cohort-$mode" \
              --mode "$mode" --link-timeout 600 --qemu-timeout 90; then
              echo "X86_BOOT_COHORT=$mode diagnostic_P0_match=1 official_strict_P0=0"
            else
              echo "X86_BOOT_COHORT=$mode diagnostic_P0_match=0_or_inconclusive official_strict_P0=0"
            fi
          done
          # The previously observed GNU+12 MiniC compressed cohort boots.
          # Add only existing, early x86 C owners to that same passing baseline;
          # this is a bounded mixed-owner diagnostic, never strict acceptance.
          python3 - "$GNU_WORK/frozen/manifest.json" "$RUNTIME_OUTPUT/x86-early-extra-owners.json" <<'PY'
          import json, pathlib, sys
          available = {row['object'] for row in json.loads(pathlib.Path(sys.argv[1]).read_text())['rows']}
          priority = ('arch/x86/kernel/head64.o', 'arch/x86/kernel/setup.o',
                      'arch/x86/kernel/e820.o', 'arch/x86/kernel/early_printk.o',
                      'arch/x86/kernel/cpu/common.o', 'arch/x86/mm/init_64.o',
                      'arch/x86/mm/ident_map.o', 'init/main.o')
          selected = [name for name in priority if name in available]
          if len(selected) < 4:
              raise SystemExit(f'X86_EARLY_OWNER_SELECTION=FAIL only {selected}')
          pathlib.Path(sys.argv[2]).write_text(json.dumps(selected, indent=2) + '\n')
          print(f'X86_EARLY_OWNER_SELECTION=PASS owners={len(selected)} paths={selected}')
          PY
          if python3 tools/ci/linux-three-isa-boot-cohort-diagnostic-v1.py probe \
            --gnu-work "$GNU_WORK" \
            --snapshot-dir "$RUNTIME_OUTPUT/x86-pristine-cohort-snapshot" \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --staged "$RUNTIME_OUTPUT/candidate/staged" \
            --results "$RUNTIME_OUTPUT/candidate/all-c-owners-result.json" \
            --trial-dir "$RUNTIME_OUTPUT/x86-cohort-early-owners" \
            --mode gnu-plus-compressed \
            --extra-owners-file "$RUNTIME_OUTPUT/x86-early-extra-owners.json" \
            --link-timeout 600 --qemu-timeout 90; then
            echo "X86_EARLY_OWNER_COHORT=diagnostic_P0_match official_strict_P0=0"
          else
            echo "X86_EARLY_OWNER_COHORT=diagnostic_failure_or_inconclusive official_strict_P0=0"
          fi
      - name: Diagnose Loong static init SIGSEGV using SHA-frozen GNU/MiniC seed and bounded bisection
        if: failure() && matrix.target == 'loongarch64' && inputs.loong_cached_cohort_diagnostic == true
        continue-on-error: true
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          test -s "$RUNTIME_OUTPUT/loong-pristine-cohort-snapshot/prepare.json"
          test -s "$RUNTIME_OUTPUT/candidate/boot/p0.log"
          python3 tools/ci/linux-three-isa-boot-cohort-diagnostic-v1.py vdso-layout \
            --gnu-build "$RUNTIME_OUTPUT/loong-pristine-cohort-snapshot/pristine-gnu-build" \
            --candidate-build "$GNU_WORK/build" \
            --output "$RUNTIME_OUTPUT/loong-vdso-elf-phdr-evidence.json"
          python3 - "$RUNTIME_OUTPUT/candidate/postlink-c-owner-census.json" \
                    "$RUNTIME_OUTPUT/candidate/boot/p0.log" \
                    "$GNU_WORK/frozen/manifest.json" \
                    "$RUNTIME_OUTPUT/loong-cohort-seed.json" <<'PY'
          import json, pathlib, sys
          census, boot, manifest, selected = map(pathlib.Path, sys.argv[1:])
          assert json.loads(census.read_text())['verdict'] == 'POSTLINK_ALL_C_MINIC_SHA_PASS'
          log = boot.read_text(errors='replace')
          assert 'do_page_fault(): sending SIGSEGV to init for invalid read access from ' in log
          assert 'era = 0000000120015ca4 in init' in log
          assert 'Kernel panic - not syncing: Attempted to kill init! exitcode=0x0000000b' in log
          owners = [row['object'] for row in json.loads(manifest.read_text())['rows']]
          assert len(owners) == 2723 and len(set(owners)) == 2723
          # Test the two vDSO body codegen owners first. kernel/vdso.o is a
          # generated late C owner with a different frozen/live GNU-E epoch;
          # swapping it together with these two obscures the ELF-size test.
          priority = ('arch/loongarch/vdso/vgetcpu.o',
                      'arch/loongarch/vdso/vgettimeofday.o')
          assert set(priority).issubset(owners), 'actual Loong original C owners differ'
          selected.write_text(json.dumps(list(priority), indent=2) + '\n')
          print('LOONG_COHORT_SEED=PASS total=2723 selected=2 diagnostic_only=true')
          PY
          probe() {
            local mode="$1" depth="$2" owners="$3" trial="$RUNTIME_OUTPUT/loong-cohort-${depth}-${mode}"
            if python3 tools/ci/linux-three-isa-boot-cohort-diagnostic-v1.py probe \
                --target loongarch64 --gnu-work "$GNU_WORK" \
                --snapshot-dir "$RUNTIME_OUTPUT/loong-pristine-cohort-snapshot" \
                --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
                --firmware "$RUNTIME_OUTPUT/QEMU_EFI.fd" \
                --staged "$RUNTIME_OUTPUT/candidate/staged" \
                --results "$RUNTIME_OUTPUT/candidate/all-c-owners-result.json" \
                --trial-dir "$trial" --mode "$mode" \
                --extra-owners-file "$owners" --max-live-cc 0 \
                --link-timeout 360 --qemu-timeout 90; then
              echo "LOONG_COHORT depth=$depth mode=$mode GNU_P0_MATCH=1 diagnostic_only=true"
            else
              echo "LOONG_COHORT depth=$depth mode=$mode GNU_P0_MATCH=0_or_inconclusive diagnostic_only=true"
            fi
          }
          selected="$RUNTIME_OUTPUT/loong-cohort-seed.json"
          probe gnu-plus-list 0 "$selected"
          probe minic-except-list 0 "$selected"
          # If authenticated ELF PT_LOAD already requires >1 16-KiB mapping
          # page while pristine GNU requires one, do not spend six further
          # long QEMU probes on broad C-owner bisection. The actual runtime
          # vdso_info.size field/mapping still needs separate proof.
          if python3 - "$RUNTIME_OUTPUT/loong-vdso-elf-phdr-evidence.json" <<'PY'
          import json, pathlib, sys
          x = json.loads(pathlib.Path(sys.argv[1]).read_text())['images']
          for path in ('arch/loongarch/vdso/vdso.so', 'arch/loongarch/vdso/vdso.so.dbg'):
              g, m = x['pristine_gnu'][path], x['final_minic'][path]
              if g.get('required_16k_mapping_pages') == 1 and m.get('required_16k_mapping_pages', 0) > 1:
                  print('LOONG_VDSO_PT_LOAD_SIZE_DIFF=GNU_ONE_PAGE_MINIC_MULTIPAGE; no broad bisection')
                  raise SystemExit(0)
          raise SystemExit(2)
          PY
          then
            echo 'LOONG_COHORT_BISECT_STOP=authenticated_vdso_PT_LOAD_multpage_source_mapping_unproven'
            exit 0
          fi
          for depth in 1 2 3; do
            prior=$((depth - 1))
            next="$RUNTIME_OUTPUT/loong-cohort-depth-${depth}.json"
            if ! python3 - "$GNU_WORK/frozen/manifest.json" "$selected" \
                      "$RUNTIME_OUTPUT/loong-cohort-${prior}-gnu-plus-list/diagnostic-receipt.json" \
                      "$RUNTIME_OUTPUT/loong-cohort-${prior}-minic-except-list/diagnostic-receipt.json" \
                      "$next" <<'PY'
          import json, pathlib, sys
          manifest, selection, positive, negative, nextfile = map(pathlib.Path, sys.argv[1:])
          names = [row['object'] for row in json.loads(manifest.read_text())['rows']]
          chosen = set(json.loads(selection.read_text()))
          p, n = json.loads(positive.read_text()), json.loads(negative.read_text())
          passing = 'DIAGNOSTIC_P0_MATCHES_GNU_NOT_ACCEPTANCE'
          failing = 'DIAGNOSTIC_P0_REPRODUCES_INIT_SIGSEGV'
          if p.get('verdict') == failing and n.get('verdict') == passing:
              candidates = [name for name in names if name in chosen]
          elif p.get('verdict') == passing and n.get('verdict') == failing:
              candidates = [name for name in names if name not in chosen]
          else:
              print(f'LOONG_COHORT_BISECT_STOP=interaction_or_owner_drift_plus_{p.get("verdict")}_minus_{n.get("verdict")}')
              raise SystemExit(2)
          if len(candidates) <= 1:
              print(f'LOONG_COHORT_BISECT_STOP=single_candidate domain={candidates}')
              raise SystemExit(2)
          half = candidates[:len(candidates) // 2]
          nextfile.write_text(json.dumps(half, indent=2) + '\n')
          print(f'LOONG_COHORT_BISECT_CONTINUE=depth={nextfile.stem} domain={len(candidates)} next={len(half)}')
          PY
            then
              break
            fi
            selected="$next"
            probe gnu-plus-list "$depth" "$selected"
            probe minic-except-list "$depth" "$selected"
          done
          echo 'LOONG_COHORT_DIAGNOSTIC_ONLY=true strict_acceptance=false gnu_control_unchanged=true'
      - name: Capture failed Loong EFI-to-Linux PC and register snapshots without changing oracle
        if: failure() && matrix.target == 'loongarch64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-three-isa-loongarch64-early-boot-pc-v1.py \
            --image "$GNU_WORK/build/arch/loongarch/boot/vmlinux.efi" \
            --firmware "$RUNTIME_OUTPUT/QEMU_EFI.fd" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --failed-p0 "$RUNTIME_OUTPUT/candidate/boot/p0.log" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --gnu-image "$RUNTIME_OUTPUT/loong-gnu-control.efi" \
            --census "$RUNTIME_OUTPUT/candidate/postlink-c-owner-census.json" \
            --system-map "$GNU_WORK/build/System.map" \
            --vmlinux "$GNU_WORK/build/vmlinux" \
            --nm /usr/bin/loongarch64-linux-gnu-nm \
            --qemu /usr/bin/qemu-system-loongarch64 \
            --output "$RUNTIME_OUTPUT/loong-early-trace"
      - name: Diagnose Loong init SIGSEGV with one original GNU vDSO glue object
        if: failure() && matrix.target == 'loongarch64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 22
        run: |
          set -Eeuo pipefail
          test -f "$RUNTIME_OUTPUT/loong-vdso-pin/pin.json"
          test -f "$RUNTIME_OUTPUT/candidate/postlink-c-owner-census.json"
          python3 tools/ci/linux-three-isa-loong-vdso-cohort-v1.py probe \
            --gnu-work "$GNU_WORK" \
            --gnu-receipt "$RUNTIME_OUTPUT/boot/gnu-qemu-receipt.json" \
            --gnu-p0 "$RUNTIME_OUTPUT/boot/p0.log" \
            --initramfs "$RUNTIME_OUTPUT/runtime-initramfs.cpio.gz" \
            --firmware "$RUNTIME_OUTPUT/QEMU_EFI.fd" \
            --minic "$GITHUB_WORKSPACE/build/minic-seven-bin/bin/minic" \
            --pinned "$RUNTIME_OUTPUT/loong-vdso-pin" \
            --census "$RUNTIME_OUTPUT/candidate/postlink-c-owner-census.json" \
            --failed-p0 "$RUNTIME_OUTPUT/candidate/boot/p0.log" \
            --trial "$RUNTIME_OUTPUT/loong-vdso-cohort"
      - name: Preserve failed x86 final MiniC candidate bzImage without rebuilding
        if: failure() && matrix.target == 'x86_64'
        continue-on-error: true
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          # Only an actual candidate boot attempt with final all-C provenance
          # may export this path: never substitute the pristine GNU golden.
          test -f "$RUNTIME_OUTPUT/candidate/boot/p0.log"
          python3 - "$GNU_WORK" "$RUNTIME_OUTPUT" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          work, runtime = map(pathlib.Path, sys.argv[1:])
          census = json.loads((runtime / "candidate/postlink-c-owner-census.json").read_text())
          assert census.get("verdict") == "POSTLINK_ALL_C_MINIC_SHA_PASS", "final MiniC C provenance unavailable"
          image = work / "build/arch/x86/boot/bzImage"
          assert image.is_file() and not image.is_symlink() and image.stat().st_size > 0
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          before = digest(image)
          golden = json.loads((runtime / "boot/gnu-qemu-receipt.json").read_text())
          assert before != golden["image_sha256"], "refuse exporting GNU golden as MiniC candidate"
          folder = runtime / "x86-early-trace"
          folder.mkdir(parents=True, exist_ok=True)
          destination = folder / "candidate-bzImage"
          assert not destination.exists() and not destination.is_symlink()
          shutil.copyfile(image, destination)
          assert digest(destination) == before == digest(image), "candidate image changed during copy"
          receipt = {"diagnostic_only": True, "original_path": str(image), "sha256": before,
                     "bytes": destination.stat().st_size, "original_unchanged": True}
          (folder / "candidate-bzImage-provenance.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("X86_FAILED_CANDIDATE_IMAGE_PRESERVED=" + json.dumps(receipt, sort_keys=True))
          PY
      - name: Record exact original initramfs SHA for failure-only future image replay
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNTIME_OUTPUT" '${{ matrix.target }}' <<'PY'
          import hashlib, json, pathlib, sys
          runtime, target = pathlib.Path(sys.argv[1]), sys.argv[2]
          initramfs = runtime / "runtime-initramfs.cpio.gz"
          golden = runtime / "boot/gnu-qemu-receipt.json"
          if not initramfs.is_file() or initramfs.is_symlink() or not golden.is_file():
              raise SystemExit("exact original GNU initramfs/receipt unavailable")
          oracle = json.loads(golden.read_text())
          actual = hashlib.sha256(initramfs.read_bytes()).hexdigest()
          if (oracle.get("target") != target or
                  oracle.get("verdict") != "GNU_QEMU_P0_P1_PASS_NOT_MINIC" or
                  oracle.get("initramfs_sha256") != actual):
              raise SystemExit("initramfs bytes differ from passing original GNU P0/P1 receipt")
          record = {"schema": "minic-linux-original-initramfs-artifact-v1",
                    "target": target, "sha256": actual,
                    "gnu_receipt_initramfs_sha256": oracle["initramfs_sha256"],
                    "source_run_id": '${{ github.run_id }}',
                    "candidate_head_sha": '${{ github.event.pull_request.head.sha || github.sha }}',
                    "scope": "DIAGNOSTIC_REPLAY_INPUT_ONLY_NEVER_RUNTIME_PASS"}
          (runtime / "runtime-initramfs-provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n")
          print("MINIC_LINUX_ORIGINAL_INITRAMFS_PRESERVED=" + json.dumps(record, sort_keys=True))
          PY
      - name: Preserve genuine GNU LD errors, MiniC C provenance and dual QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-linux-seven-receiver-${{ matrix.target }}
          path: |
            build/minic-seven-receiver-${{ matrix.target }}/boot/
            build/minic-seven-receiver-${{ matrix.target }}/runtime-initramfs.cpio.gz
            build/minic-seven-receiver-${{ matrix.target }}/runtime-initramfs-provenance.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/candidate-receipt.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/all-c-owners-result.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/c-section-sizes.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/link-layout/
            build/minic-seven-receiver-${{ matrix.target }}/candidate/gnu-ld-relink.log
            build/minic-seven-receiver-${{ matrix.target }}/candidate/gnu-ld-final-relink*.log
            build/minic-seven-receiver-${{ matrix.target }}/candidate/gnu-link-failure-summary.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/postlink-c-owner-census.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/postlink-*-c-owner-census.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/postlink-live-gnu-e-minic-c*-receipt.json
            build/minic-seven-receiver-${{ matrix.target }}/candidate/link-failure-owner-diagnostics/
            build/minic-seven-receiver-${{ matrix.target }}/candidate/boot/
            build/minic-seven-receiver-${{ matrix.target }}/aarch64-early-trace/
            build/minic-seven-receiver-${{ matrix.target }}/x86-early-trace/
            build/minic-seven-receiver-${{ matrix.target }}/x86-cohort-gnu-plus-compressed/
            build/minic-seven-receiver-${{ matrix.target }}/x86-cohort-minic-except-compressed/
            build/minic-seven-receiver-${{ matrix.target }}/x86-cohort-early-owners/
            build/minic-seven-receiver-${{ matrix.target }}/loong-cohort-*/
            build/minic-seven-receiver-${{ matrix.target }}/loong-cohort-*.json
            build/minic-seven-receiver-${{ matrix.target }}/loong-vdso-elf-phdr-evidence.json
            build/minic-seven-receiver-${{ matrix.target }}/x86-early-extra-owners.json
            build/minic-seven-receiver-${{ matrix.target }}/loong-early-trace/
            build/minic-seven-receiver-${{ matrix.target }}/loong-gnu-control.efi
            build/minic-seven-receiver-${{ matrix.target }}/loong-vdso-pin/
            build/minic-seven-receiver-${{ matrix.target }}/loong-vdso-cohort/
          if-no-files-found: warn
          retention-days: 14

  strict-three-isa-result:
    needs: [gate, minic-binary, original-gnu-golden, seven-independent-runners, original-gnu-ld-qemu-receivers]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a single false PASS or omitted C/LD/QEMU target
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'MINIC_LINUX_SEVEN_INPUT_RUN=${{ needs.gate.outputs.regenerate == 'true' && github.run_id || needs.gate.outputs.input_run }}'
          echo 'MINIC_LINUX_SEVEN_21_C_SHARDS=${{ needs.seven-independent-runners.result }}'
          echo 'MINIC_LINUX_SEVEN_GNU_LD_QEMU=${{ needs.original-gnu-ld-qemu-receivers.result }}'
          if [[ '${{ needs.gate.outputs.source_only }}' == true ]]; then
            # The input producer itself runs pristine GNU P0/P1 and preserves
            # independently SHA-checked original -E/.o.cmd for 90 days. This
            # is intentionally NOT a MiniC runtime test.
            test '${{ needs.minic-binary.result }}' = success
            test '${{ needs.original-gnu-golden.result }}' = success
            test '${{ needs.seven-independent-runners.result }}' = skipped
            test '${{ needs.original-gnu-ld-qemu-receivers.result }}' = skipped
            echo 'MINIC_LINUX_FROZEN_SOURCE_EXPORT=PASS scope=${{ needs.gate.outputs.source_scope }} run_id=${{ github.run_id }} retention_days=90 MiniC_C=NOT_RUN GNU_LD_CANDIDATE=NOT_RUN QEMU_CANDIDATE=NOT_RUN'
            echo '### Original GNU source/input capture only — NOT MiniC Linux runtime acceptance' >> "$GITHUB_STEP_SUMMARY"
            echo 'Frozen source artifacts retained 90 days. Pin this run ID for future exact-head MiniC candidate shards.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ '${{ needs.gate.outputs.only_aarch64 }}' == true ]]; then
            # Legacy receiver-only replay remains SHA locked to its compiler.
            echo 'MINIC_LINUX_SEVEN_RUNTIME=PARTIAL_RECEIVER_REPLAY_NOT_FULL_ACCEPTANCE targets=aarch64_only'
            echo '### PARTIAL_RECEIVER_REPLAY — NOT 3-ISA ACCEPTANCE' >> "$GITHUB_STEP_SUMMARY"
            if [[ '${{ needs.minic-binary.result }}' == success &&
                  '${{ needs.seven-independent-runners.result }}' == skipped &&
                  '${{ needs.original-gnu-ld-qemu-receivers.result }}' == success ]]; then
              echo 'MINIC_LINUX_AARCH64_ONLY_RECEIVER=PASS_REUSED_SHA_VERIFIED source_run=${{ env.MINIC_LINUX_PINNED_OBJECT_RUN }}'
              echo 'AArch64 receiver passed with SHA-verified reused shards; x86 and LoongArch were NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'MINIC_LINUX_AARCH64_ONLY_RECEIVER=FAIL_OR_INCOMPLETE'
              echo 'AArch64 reused-object receiver did not complete successfully; x86 and LoongArch were NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '::error::AArch64-only evidence cannot satisfy strict three-ISA acceptance'
            exit 1
          fi
          if [[ '${{ needs.gate.outputs.only_x86_64 }}' == true ]]; then
            # Seven fresh x86 C owners are genuine development evidence, but
            # skipped AArch64/LoongArch C/LD/P0/P1 MUST keep this job red.
            echo 'MINIC_LINUX_SEVEN_RUNTIME=PARTIAL_REPLAY_NOT_ACCEPTED targets=x86_64_only producer_shards=7 receiver_targets=1'
            echo '### PARTIAL_REPLAY — NOT ACCEPTED: only x86-64 was run' >> "$GITHUB_STEP_SUMMARY"
            if [[ '${{ needs.minic-binary.result }}' == success &&
                  '${{ needs.seven-independent-runners.result }}' == success &&
                  '${{ needs.original-gnu-ld-qemu-receivers.result }}' == success ]]; then
              echo 'MINIC_LINUX_X86_ONLY_DEV=PASS_ALL_SEVEN_FRESH_SHARDS_AND_RECEIVER_ONLY'
              echo 'x86-64 fresh 7/7 C shards, GNU LD and QEMU receiver passed. AArch64/LoongArch64 were NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'MINIC_LINUX_X86_ONLY_DEV=FAIL_OR_INCOMPLETE'
              echo 'x86-64 development did not fully pass. AArch64/LoongArch64 were NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '::error::PARTIAL_REPLAY cannot satisfy strict three-ISA acceptance'
            exit 1
          fi
          if [[ '${{ needs.gate.outputs.partial_target }}' != all ]]; then
            echo 'MINIC_LINUX_SEVEN_RUNTIME=PARTIAL_CURRENT_MINIC_NOT_THREE_ISA target=${{ needs.gate.outputs.partial_target }}'
            echo '### One-target current MiniC Linux campaign — NOT 3-ISA acceptance' >> "$GITHUB_STEP_SUMMARY"
            if [[ '${{ needs.minic-binary.result }}' == success &&
                  '${{ needs.seven-independent-runners.result }}' == success &&
                  '${{ needs.original-gnu-ld-qemu-receivers.result }}' == success ]]; then
              echo 'MINIC_LINUX_ONE_TARGET=PASS_7_FRESH_SHARDS_GNU_LD_QEMU target=${{ needs.gate.outputs.partial_target }}'
              echo 'This single target passed all seven current MiniC shards and GNU LD/QEMU. Other two targets were NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'MINIC_LINUX_ONE_TARGET=FAIL_OR_INCOMPLETE target=${{ needs.gate.outputs.partial_target }}'
              echo 'This single target failed or is incomplete. Other two targets were NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '::error::Single-target result cannot satisfy strict three-ISA acceptance'
            exit 1
          fi
          test '${{ needs.minic-binary.result }}' = success
          if [[ '${{ needs.gate.outputs.reuse_objects }}' == true ]]; then
            # The 21 producers MUST be skipped in receiver-only mode. The
            # downloaded artifacts still pass SHA/ABI preflight and the full
            # original GNU LD/QEMU receiver checks, on this exact compiler.
            test '${{ needs.seven-independent-runners.result }}' = skipped
            candidate_provenance=REUSED_SHA_VERIFIED
            source_run='${{ env.MINIC_LINUX_PINNED_OBJECT_RUN }}'
          else
            test '${{ needs.seven-independent-runners.result }}' = success
            candidate_provenance=FRESH_SHA_VERIFIED
            source_run='${{ github.run_id }}'
          fi
          test '${{ needs.original-gnu-ld-qemu-receivers.result }}' = success
          echo "MINIC_LINUX_SEVEN_21_C_SHARDS=$candidate_provenance source_run=$source_run"
          echo "Candidate C objects: $candidate_provenance (producer run $source_run; seven SHA-verified shards per target)." >> "$GITHUB_STEP_SUMMARY"
          echo 'MINIC_LINUX_SEVEN_RUNTIME=PASS targets=3 seven_shards_per_target_sha_verified=true all_C_GNU_AS_LD_QEMU_P0_P1=true'
          echo 'MINIC_LINUX_GNU_CODEGEN_OPTION_PARITY=NOT_CLAIMED_BY_RUNTIME_GATE'
          echo 'Linux 3x7 GNU LD/QEMU acceptance: PASS (all three targets).' >> "$GITHUB_STEP_SUMMARY"
          echo 'GCC codegen-option semantic equivalence is separately audited in each receiver receipt and is not claimed by this Linux runtime result.' >> "$GITHUB_STEP_SUMMARY"
