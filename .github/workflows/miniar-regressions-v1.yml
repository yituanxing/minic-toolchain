name: MiniAR Regressions V1

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniar-regressions-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install archive and RV64 oracle prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Build current Mini toolchain once
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-regressions-v1 all
          test -x build/miniar-regressions-v1/bin/minic-ar

      - name: Validate MiniAR archive contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-regressions-v1 check-miniar-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-regressions-v1 check-miniar-a1

      - name: Validate shared ELF reader contract
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-regressions-v1 check-minielf-reader-a0

      - name: Validate MiniNM archive consumers
        shell: bash
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-regressions-v1 check-mininm-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-regressions-v1 check-mininm-a1

      - name: Publish canonical verdict
        run: echo "MINIAR_REGRESSIONS_V1=PASS archive=A0-A1 elf-reader=PASS mininm=A0-A1"
