name: Agent Alignment Typed ConstEval V1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-alignment-typed-consteval-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-source:
    if: github.head_ref == 'refactor/foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/foundation-v1
          fetch-depth: 0
      - name: Generate typed alignment source
        run: python3 tools/dev/agent_alignment_typed_consteval_v1.py
      - name: Format generated source
        run: |
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
      - name: Build release compiler
        run: make -j4 MODE=release BUILD_DIR=build/agent-alignment-typed
      - name: Run alignment focused contracts
        env:
          MINIC: ${{ github.workspace }}/build/agent-alignment-typed/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/agent-alignment-typed-focused
          HOST_CC: cc
        run: |
          sh tests/compiler/c0/run-gnu-aligned-record-fields.sh
          sh tests/compiler/c0/run-gnu-record-alignment.sh
      - name: Run Foundation focused contracts
        env:
          MINIC: ${{ github.workspace }}/build/agent-alignment-typed/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/agent-alignment-typed-focused-all
          HOST_CC: cc
        run: sh tools/dev/pr76-focused.sh
      - name: Run fast compiler contracts
        run: make -j4 MODE=release BUILD_DIR=build/agent-alignment-typed check-fast
      - name: Publish generated source to scratch branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'frontend: use typed ConstEval for alignment attributes'
          git push --force origin HEAD:agent/alignment-typed-consteval-v1
