name: Discover cJSON after long

on:
  pull_request:
    paths:
      - '.github/workflows/discover-cjson-after-long.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
      - name: Install target preprocessor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu
      - name: Build MiniC
        run: make -j2
      - name: Print next exact cJSON frontier
        shell: bash
        run: |
          set +e
          MINIC="$PWD/build/debug/bin/minic" \
          BUILD_DIR="$PWD/build/cjson-after-long" \
          RISCV_CC=riscv64-linux-gnu-gcc \
            sh tests/external/cjson/probe.sh
          status=$?
          set -e
          printf 'recorded_probe_status=%s\n' "$status"
          test "$status" -ne 0
          exit 1
