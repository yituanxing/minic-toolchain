name: Productize Function Pointer Array Declarator V8
on:
  push:
    branches: [product/function-pointer-array-declarator-v8]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/function-pointer-array-declarator-v8
          fetch-depth: 0
      - name: Apply proven function pointer array declarator semantics
        run: |
          set -Eeuo pipefail
          git fetch origin staging/string-octal-v1:refs/remotes/origin/staging/string-octal-v1
          git show origin/staging/string-octal-v1:tools/dev/materialize-function-pointer-array-declarator-v1.py > tools/dev/.productize-function-pointer-array-v8.py
          python3 tools/dev/.productize-function-pointer-array-v8.py
          rm tools/dev/.productize-function-pointer-array-v8.py
      - name: Extend permanent focused contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tests/compiler/c0/function_pointer_qualifiers.c')
          addition = '''\nextern int (*external_handlers[])(int value);\nstatic int (*static_handlers[1])(int value) = {0};\n\nint function_pointer_array_shape(void)\n{\n    return static_handlers[0] == 0;\n}\n'''
          text = src.read_text()
          if 'function_pointer_array_shape' not in text:
              src.write_text(text + addition)
          runner = Path('tests/compiler/c0/run-function-pointer-qualifiers.sh')
          text = runner.read_text()
          anchor = "grep -F 'call_typedef:' \"$work/output.s\" >/dev/null\n"
          if anchor not in text:
              raise SystemExit('function-pointer runner anchor missing')
          if "function_pointer_array_shape:" not in text:
              runner.write_text(text.replace(anchor, anchor + "grep -F 'function_pointer_array_shape:' \"$work/output.s\" >/dev/null\n", 1))
          PY
      - name: Validate product slice
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/product-fp-array-v8
          MINIC="$GITHUB_WORKSPACE/build/product-fp-array-v8/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/product-fp-array-v8-focused" \
            sh tests/compiler/c0/run-function-pointer-qualifiers.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/product-fp-array-v8-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/productize-function-pointer-array-declarator-v8.yml
          git add src/frontend/parser_internal.h src/frontend/parser_declarator.c \
                  tests/compiler/c0/function_pointer_qualifiers.c \
                  tests/compiler/c0/run-function-pointer-qualifiers.sh
          git commit -m 'frontend: parse function pointer array declarators'
          git push origin HEAD:product/function-pointer-array-declarator-v8
