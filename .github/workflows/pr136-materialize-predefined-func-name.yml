name: PR136 Materialize Predefined Func Name
on:
  push:
    branches: [agent/predefined-func-name-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize predefined function-name semantics
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr136-materialize.py
          chmod +x tests/compiler/c0/run-predefined-func-name.sh
          clang-format-18 -i \
            src/frontend/parser_internal.h \
            src/frontend/parser_string.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_function.c \
            tests/programs/c0/predefined_func_name.c \
            tests/compiler/c0/invalid_predefined_func_name_write.c \
            tests/compiler/c0/invalid_predefined_func_name_file_scope.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr136-focused" \
            sh tests/compiler/c0/run-predefined-func-name.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit clean product
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/dev/pr136-materialize.py \
            .github/workflows/pr136-materialize-predefined-func-name.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): model predefined function name'
          git push origin HEAD:agent/predefined-func-name-v0
