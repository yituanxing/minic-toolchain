name: One-shot Core list_del Shape Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Build exact compiler
        shell: bash
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-list-del-probe-compiler

      - name: Probe list_del semantic layers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-list-del-probe-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-list-del-probe"
          mkdir -p "$work"

          cat >"$work/a-call-only.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          void __list_del_entry(struct list_head *entry);
          void probe_call_only(struct list_head *entry) {
              __list_del_entry(entry);
          }
          EOF

          cat >"$work/b-member-null.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          void probe_member_null(struct list_head *entry) {
              entry->next = (void *)0;
          }
          EOF

          cat >"$work/c-member-intptr.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          void probe_member_intptr(struct list_head *entry) {
              entry->next = (void *)0x100;
          }
          EOF

          cat >"$work/d-member-pointer-add-zero.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          void probe_member_pointer_add_zero(struct list_head *entry) {
              entry->next = (void *)0x100 + 0UL;
          }
          EOF

          cat >"$work/e-member-pointer-add-delta.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          void probe_member_pointer_add_delta(struct list_head *entry, unsigned long delta) {
              entry->next = (void *)0x100 + delta;
          }
          EOF

          cat >"$work/f-list-del.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          void __list_del_entry(struct list_head *entry);
          void probe_list_del(struct list_head *entry) {
              __list_del_entry(entry);
              entry->next = (void *)0x100 + 0UL;
              entry->prev = (void *)0x122 + 0UL;
          }
          EOF

          for input in "$work"/*.i; do
            name=$(basename "$input" .i)
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name.s" \
              >"$work/$name.out" 2>"$work/$name.err"
            rc=$?
            set -e
            printf 'CORE_LIST_DEL_SHAPE name=%s rc=%d\n' "$name" "$rc"
            sed 's/^/CORE_LIST_DEL_DIAG /' "$work/$name.err"
          done

          test -s "$work/a-call-only.s"
          test -s "$work/b-member-null.s"
          test -s "$work/c-member-intptr.s"
          printf '%s\n' 'PASS core/list-del-shape probe-complete'
