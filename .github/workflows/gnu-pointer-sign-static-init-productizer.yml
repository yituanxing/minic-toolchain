name: GNU Pointer Sign Static Init Productizer

on:
  push:
    branches:
      - frontend/gnu-pointer-sign-static-init-v1

permissions:
  contents: write

concurrency:
  group: gnu-pointer-sign-static-init-${{ github.ref }}
  cancel-in-progress: true

jobs:
  productize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout capability branch
        uses: actions/checkout@v4
        with:
          ref: frontend/gnu-pointer-sign-static-init-v1
          fetch-depth: 0

      - name: Materialize shared type capability
        run: python3 tools/dev/materialize-gnu-pointer-sign-static-init-v1.py

      - name: Build release compiler with warnings as errors
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/gnu-pointer-sign-static-init

      - name: Run focused pointer conversion gates
        run: |
          MINIC="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-focused" \
            sh tests/compiler/c0/run-static-object-address-relocation.sh
          MINIC="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-focused" \
            sh tests/compiler/c0/run-gnu-pointer-sign-call-conversion.sh

      - name: Run fast regression gate
        run: make -j4 BUILD_DIR=build/gnu-pointer-sign-static-init-fast check-fast

      - name: Commit materialized product
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- src/frontend/type.h src/frontend/type.c src/frontend/parser_expression.c src/frontend/parser_global.c; then
            printf '%s\n' 'Product source already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/type.h src/frontend/type.c src/frontend/parser_expression.c src/frontend/parser_global.c
          git commit -m 'frontend: share GNU pointer-sign conversion semantics'
          git push origin HEAD:frontend/gnu-pointer-sign-static-init-v1

      - name: Capture productizer failure
        if: failure()
        run: |
          set +e
          log=tools/dev/gnu-pointer-sign-static-init-failure.log
          {
            printf '%s\n' '=== materializer ==='
            python3 tools/dev/materialize-gnu-pointer-sign-static-init-v1.py
            printf 'status=%d\n' "$?"
            printf '%s\n' '=== release build ==='
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/gnu-pointer-sign-static-init-diagnostic
            printf 'status=%d\n' "$?"
            printf '%s\n' '=== static relocation focused ==='
            MINIC="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-diagnostic/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-diagnostic-focused" \
              sh tests/compiler/c0/run-static-object-address-relocation.sh
            printf 'status=%d\n' "$?"
            printf '%s\n' '=== pointer-sign call focused ==='
            MINIC="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-diagnostic/bin/minic" \
            HOST_CC=cc \
            BUILD_DIR="$GITHUB_WORKSPACE/build/gnu-pointer-sign-static-init-diagnostic-focused" \
              sh tests/compiler/c0/run-gnu-pointer-sign-call-conversion.sh
            printf 'status=%d\n' "$?"
          } >"$log" 2>&1
          git checkout -- src/frontend/type.h src/frontend/type.c src/frontend/parser_expression.c src/frontend/parser_global.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log"
          git commit -m 'ci: capture GNU pointer-sign productizer failure'
          git push origin HEAD:frontend/gnu-pointer-sign-static-init-v1
