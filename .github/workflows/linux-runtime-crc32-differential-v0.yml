# Diagnose the post-kallsyms crc32 regression with runtime arguments and an object-level A/B.
name: Linux Runtime CRC32 Differential V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-crc32-differential-v0.yml"
      - "tools/ci/linux-early-runtime-link-v3.sh"
      - "tools/ci/linux-runtime-arch-rest-init-frontier-v0.json"
      - "tools/ci/apply-riscv64-core-object-slot-reuse-v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-crc32-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crc32-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified fixtures
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make gdb-multiarch \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make gdb-multiarch; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-crc32-differential-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-crc32-differential-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -Fx 'apply-riscv64-core-object-slot-reuse-v0.py' "$ev/profile/minic-profile.txt"
          echo 'CRC32_DIFF_PROFILE=PASS slot_reuse=current'

      - name: Refresh certified owners and preserve both crc32 objects
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-crc32-differential-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-crc32-differential-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$out/$pi_base.minic-stage2.s" >/dev/null

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock-debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build-utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build-policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log
          refresh_obj drivers/of/fdt.o fdt-refresh.log

          test -s "$out/lib/crc32.o"
          cp "$out/lib/crc32.o" "$ev/crc32.baseline.o"
          sha256sum "$ev/crc32.baseline.o" | tee "$ev/crc32-baseline.sha256"
          riscv64-linux-gnu-nm -S "$ev/crc32.baseline.o" | grep -E '[[:space:]]crc32_body$' | tee "$ev/crc32-baseline.symbol.txt"

          refresh_obj lib/crc32.o crc32-refresh.log
          cp "$out/lib/crc32.o" "$ev/crc32.current.o"
          sha256sum "$ev/crc32.current.o" | tee "$ev/crc32-current.sha256"
          riscv64-linux-gnu-nm -S "$ev/crc32.current.o" | grep -E '[[:space:]]crc32_body$' | tee "$ev/crc32-current.symbol.txt"

          refresh_obj kernel/kallsyms.o kallsyms-refresh.log

      - name: Link current-crc32 V3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-crc32-differential-v0"
          bash tools/ci/linux-early-runtime-link-v3.sh "$frozen/src" "$work/out" "$ev/current" "$work/linux-6.6.143"
          grep -E '[[:space:]](crc32_be|crc32_body|early_init_dt_scan_chosen|initial_boot_params|_end)$' "$ev/current/nm.txt" | tee "$ev/current-symbols.txt"

      - name: Classify current-crc32 V3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-crc32-differential-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-arch-rest-init-frontier-v0.json \
            --nm "$ev/current/nm.txt" --image "$ev/current/Image.early" \
            --evidence-dir "$ev/current-watch" --timeout-ms 30000 --poll-ms 100 | tee "$ev/current-watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "CRC32_CURRENT_CLASSIFIER_RC=$rc"
          cat "$ev/current-watch/frontier-summary.txt" || true
          exit 0

      - name: Capture crc32 runtime entry arguments with GDB
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-crc32-differential-v0"
          crc_be=$(awk '$3 == "crc32_be" { print "0x" $1; exit }' "$ev/current/nm.txt")
          test -n "$crc_be"
          cat >"$ev/crc32.gdb" <<EOF
          set pagination off
          set confirm off
          set architecture riscv:rv64
          target remote :1234
          set \$hits = 0
          hbreak *$crc_be
          commands
            silent
            set \$hits = \$hits + 1
            printf "CRC32_GDB_HIT=%d a0=0x%lx a1=0x%lx a2=0x%lx a3=0x%lx pc=0x%lx sp=0x%lx\\n", \$hits, \$a0, \$a1, \$a2, \$a3, \$pc, \$sp
            if \$hits >= 2
              detach
              quit
            end
            continue
          end
          continue
          EOF

          qemu-system-riscv64 -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/current/Image.early" \
            -append "console=ttyS0 earlycon=sbi loglevel=8 panic=-1" \
            -S -gdb tcp::1234 >"$ev/crc32-gdb-qemu.log" 2>&1 &
          qpid=$!
          cleanup() { kill "$qpid" 2>/dev/null || true; wait "$qpid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1
          set +e
          timeout 20s gdb-multiarch -q -batch -x "$ev/crc32.gdb" "$ev/current/vmlinux.early" | tee "$ev/crc32-gdb.txt"
          grc=${PIPESTATUS[0]}
          set -e
          echo "CRC32_GDB_RC=$grc" | tee -a "$ev/crc32-gdb.txt"
          cleanup
          trap - EXIT
          exit 0

      - name: Link and classify baseline-crc32 V3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          out="$work/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-crc32-differential-v0"

          cp "$ev/crc32.baseline.o" "$out/lib/crc32.o"
          bash tools/ci/linux-early-runtime-link-v3.sh "$frozen/src" "$out" "$ev/baseline" "$work/linux-6.6.143"
          grep -E '[[:space:]](crc32_be|crc32_body|early_init_dt_scan_chosen|initial_boot_params|_end)$' "$ev/baseline/nm.txt" | tee "$ev/baseline-symbols.txt"

          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-arch-rest-init-frontier-v0.json \
            --nm "$ev/baseline/nm.txt" --image "$ev/baseline/Image.early" \
            --evidence-dir "$ev/baseline-watch" --timeout-ms 30000 --poll-ms 100 | tee "$ev/baseline-watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "CRC32_BASELINE_CLASSIFIER_RC=$rc"
          cat "$ev/baseline-watch/frontier-summary.txt" || true
          cp "$ev/crc32.current.o" "$out/lib/crc32.o"
          exit 0

      - name: Summarize differential
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-crc32-differential-v0"
          echo 'CRC32_DIFFERENTIAL_BEGIN'
          cat "$ev/crc32-baseline.sha256" "$ev/crc32-baseline.symbol.txt"
          cat "$ev/crc32-current.sha256" "$ev/crc32-current.symbol.txt"
          echo 'CURRENT_FRONTIER'
          cat "$ev/current-watch/frontier-summary.txt" || true
          echo 'GDB_ARGUMENTS'
          cat "$ev/crc32-gdb.txt" || true
          echo 'BASELINE_FRONTIER'
          cat "$ev/baseline-watch/frontier-summary.txt" || true
          echo 'CRC32_DIFFERENTIAL_END'

      - name: Preserve differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-crc32-differential-v0-${{ github.sha }}
          path: |
            build/linux-runtime-crc32-differential-v0/profile/patch.log
            build/linux-runtime-crc32-differential-v0/profile/minic-profile.txt
            build/linux-runtime-crc32-differential-v0/*-refresh.log
            build/linux-runtime-crc32-differential-v0/crc32-*.o
            build/linux-runtime-crc32-differential-v0/crc32-*.sha256
            build/linux-runtime-crc32-differential-v0/crc32-*.symbol.txt
            build/linux-runtime-crc32-differential-v0/crc32-gdb.txt
            build/linux-runtime-crc32-differential-v0/crc32-gdb-qemu.log
            build/linux-runtime-crc32-differential-v0/current/nm.txt
            build/linux-runtime-crc32-differential-v0/baseline/nm.txt
            build/linux-runtime-crc32-differential-v0/*-symbols.txt
            build/linux-runtime-crc32-differential-v0/current-watch/frontier-result.json
            build/linux-runtime-crc32-differential-v0/current-watch/frontier-summary.txt
            build/linux-runtime-crc32-differential-v0/current-watch/qemu.interrupts.txt
            build/linux-runtime-crc32-differential-v0/baseline-watch/frontier-result.json
            build/linux-runtime-crc32-differential-v0/baseline-watch/frontier-summary.txt
            build/linux-runtime-crc32-differential-v0/baseline-watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
