name: Linux Runtime FDT Isolation V1

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-fdt-isolation-v1.yml"
      - "tools/ci/linux-early-runtime-link-v2.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-fdt-isolation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fdt-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified fixtures
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make; }

      - name: Build exact MiniC runtime profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-fdt-isolation-v1"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh current MiniC runtime owners
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-fdt-isolation-v1"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            local target="$1"
            local stem="${target##*/}"; stem="${stem%.o}"
            local dir="${target%/*}"
            local base="${target%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/${dir//\//-}-${stem}.log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi=arch/riscv/kernel/pi/cmdline_early.pi.o
          rm -f "$out/$pi" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
                "$out/arch/riscv/kernel/pi/cmdline_early.minic-stage2.i" "$out/arch/riscv/kernel/pi/cmdline_early.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi" >"$ev/pi.log" 2>&1
          test -s "$out/$pi"
          echo "OWNER_REFRESH=PASS target=$pi"

          owners=(
            kernel/kallsyms.o arch/riscv/mm/init.o arch/riscv/kernel/setup.o
            kernel/sched/core.o arch/riscv/kernel/irq.o
            kernel/locking/spinlock.o kernel/locking/spinlock_debug.o
            kernel/sched/build_utility.o kernel/time/timekeeping.o kernel/time/vsyscall.o
            kernel/notifier.o kernel/sched/build_policy.o kernel/time/timer.o
            kernel/time/hrtimer.o kernel/time/tick-sched.o kernel/rcu/tree.o
            kernel/rcu/rcu_segcblist.o init/main.o kernel/softirq.o
          )
          for obj in "${owners[@]}"; do refresh_obj "$obj"; done

      - name: Discover and optionally swap linked fdt_ro owner to GCC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"

          riscv64-linux-gnu-ar t "$out/lib/lib.a" >"$ev/lib-members.txt"
          grep -E '(^|/)fdt_ro\.o$' "$ev/lib-members.txt" | tee "$ev/fdt-ro-members.txt" || true
          if [[ -s "$ev/fdt-ro-members.txt" ]]; then
            target=lib/fdt_ro.o
            rm -f "$out/$target" "$out/lib/.fdt_ro.o.cmd"
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC=/usr/bin/riscv64-linux-gnu-gcc -j2 V=1 "$target" >"$ev/fdt-ro-gcc.log" 2>&1
            test -s "$out/$target"
            riscv64-linux-gnu-nm -an "$out/$target" >"$ev/fdt-ro-gcc.nm"
            sha256sum "$out/$target" | tee "$ev/fdt-ro-gcc.sha256"
            echo 'FDT_RO_GCC_SWAP=ACTIVE' | tee "$ev/swap-status.txt"
          else
            echo 'FDT_RO_GCC_SWAP=NOT_LINKED_BY_LIB_A' | tee "$ev/swap-status.txt"
          fi

      - name: Relink with generated kallsyms
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          EARLY_LINK_WITH_KALLSYMS=1 EARLY_LINK_KALLSYMS_SRC="$src" \
            bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early" | tee "$ev/link.log"
          grep -F 'EARLY_LINK_KALLSYMS_CONSISTENT=PASS' "$ev/early/kallsyms-status.txt"
          grep -F 'EARLY_LINK_KALLSYMS_SYMBOL=PASS' "$ev/early/kallsyms-status.txt"

      - name: Capture FDT setup arguments and first die
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          qemu_log="$ev/qemu.console.log"
          gdb_cmd="$ev/capture.gdb"
          gdb_out="$ev/gdb.txt"

          cat >"$gdb_cmd" <<GDB
          set pagination off
          set confirm off
          file $ev/early/vmlinux.early
          target remote 127.0.0.1:1234
          hbreak create_fdt_early_page_table
          continue
          printf "CREATE_FDT_HIT=PASS\\n"
          printf "FIX_FDT_VA_ARG=0x%lx\\n", \$a0
          printf "DTB_PA_ARG=0x%lx\\n", \$a1
          printf "PGTABLE_L5=%u\\n", *(unsigned char *)&pgtable_l5_enabled
          printf "PGTABLE_L4=%u\\n", *(unsigned char *)&pgtable_l4_enabled
          printf "SATP_MODE=0x%lx\\n", *(unsigned long *)&satp_mode
          printf "KERNEL_MAP_WORDS_BEGIN\\n"
          x/8gx &kernel_map
          printf "KERNEL_MAP_WORDS_END\\n"
          disable 1
          hbreak die
          continue
          printf "FIRST_DIE_HIT=PASS\\n"
          set \$regs = \$a0
          x/35gx \$regs
          set \$epc = *(unsigned long *)(\$regs + 0)
          set \$saved_ra = *(unsigned long *)(\$regs + 8)
          set \$saved_badaddr = *(unsigned long *)(\$regs + 264)
          set \$saved_cause = *(unsigned long *)(\$regs + 272)
          printf "EPC=0x%lx\\n", \$epc
          printf "SAVED_RA=0x%lx\\n", \$saved_ra
          printf "BADADDR=0x%lx\\n", \$saved_badaddr
          printf "CAUSE=0x%lx\\n", \$saved_cause
          detach
          quit
          GDB

          qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/early/Image.early" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -S -gdb tcp:127.0.0.1:1234 >"$qemu_log" 2>&1 &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true; wait "$qpid" 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 45s gdb-multiarch -q -batch -x "$gdb_cmd" >"$gdb_out" 2>&1
          grc=$?
          set -e
          echo "GDB_RC=$grc" | tee "$ev/gdb-rc.txt"
          cat "$gdb_out"

          python3 - "$gdb_out" "$ev/early/nm.txt" "$ev/swap-status.txt" "$ev/result.txt" <<'PY'
          from bisect import bisect_right
          from pathlib import Path
          import re, sys
          gdb=Path(sys.argv[1]).read_text(errors='replace')
          nm=Path(sys.argv[2]).read_text(errors='replace').splitlines()
          swap=Path(sys.argv[3]).read_text(errors='replace').strip()
          syms=[]
          for line in nm:
              p=line.split(None,2)
              if len(p)!=3: continue
              try:a=int(p[0],16)
              except ValueError:continue
              syms.append((a,p[2]))
          syms.sort(); addrs=[a for a,_ in syms]
          def resolve(v):
              i=bisect_right(addrs,v)-1
              if i<0:return 'none'
              a,n=syms[i]; return f'{n}+0x{v-a:x} @0x{a:x}'
          out=[swap]
          for k in ('FIX_FDT_VA_ARG','DTB_PA_ARG','SATP_MODE'):
              m=re.search(rf'^{k}=(0x[0-9a-fA-F]+)$',gdb,re.M)
              out.append(f'{k}={m.group(1) if m else "MISSING"}')
          for k in ('PGTABLE_L5','PGTABLE_L4'):
              m=re.search(rf'^{k}=([0-9]+)$',gdb,re.M)
              out.append(f'{k}={m.group(1) if m else "MISSING"}')
          if 'FIRST_DIE_HIT=PASS' in gdb:
              vals={}
              for k in ('EPC','SAVED_RA','BADADDR','CAUSE'):
                  m=re.search(rf'^{k}=(0x[0-9a-fA-F]+)$',gdb,re.M)
                  if not m: raise SystemExit(f'missing {k}')
                  vals[k]=int(m.group(1),16)
              out += [f"EPC=0x{vals['EPC']:x}",f"EPC_NEAREST={resolve(vals['EPC'])}",f"RA=0x{vals['SAVED_RA']:x}",f"RA_NEAREST={resolve(vals['SAVED_RA'])}",f"BADADDR=0x{vals['BADADDR']:x}",f"CAUSE=0x{vals['CAUSE']:x}"]
          else:
              out.append('FIRST_DIE_HIT=NO_WITHIN_45S')
          Path(sys.argv[4]).write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY

      - name: Preserve FDT isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-fdt-isolation-v1-${{ github.sha }}
          path: |
            build/linux-runtime-fdt-isolation-v1/profile/patch.log
            build/linux-runtime-fdt-isolation-v1/*.log
            build/linux-runtime-fdt-isolation-v1/*.txt
            build/linux-runtime-fdt-isolation-v1/*.sha256
            build/linux-runtime-fdt-isolation-v1/gdb*
            build/linux-runtime-fdt-isolation-v1/result.txt
            build/linux-runtime-fdt-isolation-v1/qemu.console.log
            build/linux-runtime-fdt-isolation-v1/early/kallsyms-status.txt
            build/linux-runtime-fdt-isolation-v1/early/kallsyms-symbols.txt
            build/linux-runtime-fdt-isolation-v1/early/nm.txt
          if-no-files-found: warn
          retention-days: 7
