          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          echo "OWNER_REFRESH=PASS target=$pi_target"

          refresh_obj kernel/kallsyms.o kallsyms-refresh.log
          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock-debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build-utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build-policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/rcu/rcu_segcblist.o rcu-segcblist-refresh.log
          refresh_obj init/main.o init-main-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log

          sha256sum "$out/kernel/kallsyms.o" | tee "$ev/kallsyms.sha256"
          riscv64-linux-gnu-readelf -rW "$out/kernel/kallsyms.o" >"$ev/kallsyms.relocs.txt"
          grep -E 'kallsyms_(offsets|addresses|percpu_absolute)' "$ev/kallsyms.relocs.txt" | tee "$ev/kallsyms-key-relocs.txt" || true

      - name: Relink with generated kallsyms data
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-generated-kallsyms-first-die-v0"
          diag="$ev/kallsyms-pass-diagnostics.txt"

          set +e
          EARLY_LINK_WITH_KALLSYMS=1 EARLY_LINK_KALLSYMS_SRC="$src" \
            bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early" 2>&1 | tee "$ev/link.log"
          relink_rc=${PIPESTATUS[0]}
          set -e

          : >"$diag"
          shopt -s nullglob
          syms_files=("$ev"/early/.tmp_vmlinux.kallsyms*.syms)
          if ((${#syms_files[@]} == 0)); then
            echo 'KALLSYMS_DIAG_SYMS=NONE' | tee -a "$diag"
          fi
          for syms in "${syms_files[@]}"; do
            lines=$(wc -l <"$syms")
            valid=$(awk 'NF >= 3 && $1 ~ /^[0-9A-Fa-f]+$/ { n++ } END { print n+0 }' "$syms")
            printf 'KALLSYMS_DIAG file=%s lines=%s valid_addr_lines=%s\n' "$(basename "$syms")" "$lines" "$valid" | tee -a "$diag"
            echo '--- head ---' >>"$diag"
            sed -n '1,8p' "$syms" >>"$diag"
            echo '--- tail ---' >>"$diag"
            tail -n 8 "$syms" >>"$diag"
          done
          stderr_files=("$ev"/early/.tmp_vmlinux.kallsyms*.ld.stderr.txt "$ev"/early/.tmp_vmlinux.kallsyms*.mksysmap.stderr.txt)
          for f in "${stderr_files[@]}"; do
            printf 'KALLSYMS_DIAG_STDERR file=%s bytes=%s\n' "$(basename "$f")" "$(wc -c <"$f")" | tee -a "$diag"
            if [[ -s "$f" ]]; then
              sed -n '1,40p' "$f" >>"$diag"
            fi
          done
          shopt -u nullglob
          cat "$diag"

          if [[ "$relink_rc" -ne 0 ]]; then
            echo "EARLY_LINK_DIAGNOSTIC_RC=$relink_rc"
            exit "$relink_rc"
          fi

          grep -F 'EARLY_LINK_KALLSYMS_CONSISTENT=PASS' "$ev/early/kallsyms-status.txt"
          grep -F 'EARLY_LINK_KALLSYMS_SYMBOL=PASS' "$ev/early/kallsyms-status.txt"
          grep -E ' [Tt] (die|get_symbol_pos)$| (kallsyms_offsets|kallsyms_addresses|kallsyms_relative_base|kallsyms_num_syms)$' "$ev/early/nm.txt" | tee "$ev/key-symbols.txt" || true

      - name: Capture primary fault after generated kallsyms
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-generated-kallsyms-first-die-v0"
          qemu_log="$ev/qemu.console.log"
          qemu_debug="$ev/qemu.debug.log"
          gdb_cmd="$ev/capture.gdb"
          gdb_out="$ev/gdb-first-die.txt"

          cat >"$gdb_cmd" <<GDB
          set pagination off
          set confirm off
          file $ev/early/vmlinux.early
          target remote 127.0.0.1:1234
          hbreak die
          continue
          printf "FIRST_DIE_HIT=PASS\\n"
          set \$regs = \$a0
          set \$epc = *(unsigned long *)(\$regs + 0)
          set \$saved_ra = *(unsigned long *)(\$regs + 8)
          set \$saved_sp = *(unsigned long *)(\$regs + 16)
          set \$saved_status = *(unsigned long *)(\$regs + 256)
          set \$saved_badaddr = *(unsigned long *)(\$regs + 264)
          set \$saved_cause = *(unsigned long *)(\$regs + 272)
          printf "EPC=0x%lx\\n", \$epc
          printf "SAVED_RA=0x%lx\\n", \$saved_ra
          printf "SAVED_SP=0x%lx\\n", \$saved_sp
          printf "STATUS=0x%lx\\n", \$saved_status
          printf "BADADDR=0x%lx\\n", \$saved_badaddr
          printf "CAUSE=0x%lx\\n", \$saved_cause
          detach
          quit
          GDB

          qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/early/Image.early" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -S -gdb tcp:127.0.0.1:1234 -d int -D "$qemu_debug" \
            >"$qemu_log" 2>&1 &
          qpid=$!
          cleanup() {
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1

          set +e
          timeout 45s gdb-multiarch -q -batch -x "$gdb_cmd" >"$gdb_out" 2>&1
          grc=$?
          set -e
          echo "GDB_RC=$grc" | tee "$ev/gdb-rc.txt"
          cat "$gdb_out"

          python3 - "$gdb_out" "$ev/early/nm.txt" "$ev/qemu.console.log" "$ev/result.txt" <<'PY'
          from bisect import bisect_right
          from pathlib import Path
          import re, sys

          gdb = Path(sys.argv[1]).read_text(errors='replace')
          nm_lines = Path(sys.argv[2]).read_text(errors='replace').splitlines()
          console = Path(sys.argv[3]).read_text(errors='replace') if Path(sys.argv[3]).exists() else ''
          out = Path(sys.argv[4])
          syms = []
          for line in nm_lines:
              parts = line.split(None, 2)
              if len(parts) != 3:
                  continue
              try: addr = int(parts[0], 16)
              except ValueError: continue
              syms.append((addr, parts[2]))
          syms.sort()
          addrs = [a for a, _ in syms]
          def resolve(v):
              i = bisect_right(addrs, v) - 1
              if i < 0: return 'none'
              a, n = syms[i]
              return f'{n}+0x{v-a:x} @0x{a:x}'

          hit = 'FIRST_DIE_HIT=PASS' in gdb
          lines = [f'FIRST_DIE_HIT={"YES" if hit else "NO_WITHIN_45S"}']
          if hit:
              vals = {}
              for key in ('EPC','SAVED_RA','SAVED_SP','STATUS','BADADDR','CAUSE'):
                  m = re.search(rf'^{key}=(0x[0-9a-fA-F]+)$', gdb, re.M)
                  if not m: raise SystemExit(f'missing {key}')
                  vals[key] = int(m.group(1), 16)
              cause_names = {0:'instruction-address-misaligned',1:'instruction-access-fault',2:'illegal-instruction',3:'breakpoint',4:'load-address-misaligned',5:'load-access-fault',6:'store-amo-address-misaligned',7:'store-amo-access-fault',8:'ecall-u',9:'ecall-s',11:'ecall-m',12:'instruction-page-fault',13:'load-page-fault',15:'store-amo-page-fault'}
              cause = vals['CAUSE'] & ((1 << 63) - 1)
              epc_nearest = resolve(vals['EPC'])
              lines += [
                  f"EPC=0x{vals['EPC']:x}",
                  f"EPC_NEAREST={epc_nearest}",
                  f"SAVED_RA=0x{vals['SAVED_RA']:x}",
                  f"SAVED_RA_NEAREST={resolve(vals['SAVED_RA'])}",
                  f"BADADDR=0x{vals['BADADDR']:x}",
                  f"CAUSE=0x{vals['CAUSE']:x}",
                  f"CAUSE_NAME={cause_names.get(cause, 'unknown')}",
                  f"GET_SYMBOL_POS_FAULT={'YES' if epc_nearest.startswith('get_symbol_pos+') else 'NO'}",
              ]
          markers = [
              ('START_KERNEL', 'start_kernel'), ('VFS_CACHES', 'VFS: Disk quotas'),
              ('NET', 'NET:'), ('RUN_INIT', 'Run /init as init process'),
          ]
          for key, needle in markers:
              lines.append(f'CONSOLE_{key}={"YES" if needle in console else "NO"}')
          out.write_text('\n'.join(lines) + '\n')
          print(out.read_text(), end='')
          PY

          if grep -Fq 'GET_SYMBOL_POS_FAULT=YES' "$ev/result.txt"; then
            echo 'GENERATED_KALLSYMS_FIRST_DIE=REGRESSED_GET_SYMBOL_POS'
            exit 1
          fi
          echo 'GENERATED_KALLSYMS_FIRST_DIE=PASS'

      - name: Preserve generated-kallsyms evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-generated-kallsyms-first-die-v0-${{ github.sha }}
          path: |
            build/linux-runtime-generated-kallsyms-first-die-v0/profile/patch.log
            build/linux-runtime-generated-kallsyms-first-die-v0/kallsyms*.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/kallsyms*.sha256
            build/linux-runtime-generated-kallsyms-first-die-v0/*refresh.log
            build/linux-runtime-generated-kallsyms-first-die-v0/link.log
            build/linux-runtime-generated-kallsyms-first-die-v0/key-symbols.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/kallsyms-pass-diagnostics.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/gdb-first-die.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/gdb-rc.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/result.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/qemu.console.log
            build/linux-runtime-generated-kallsyms-first-die-v0/qemu.debug.log
            build/linux-runtime-generated-kallsyms-first-die-v0/early/kallsyms-status.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/early/kallsyms-symbols.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/early/System.map.early
            build/linux-runtime-generated-kallsyms-first-die-v0/early/nm.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/early/.tmp_vmlinux.kallsyms*.syms
            build/linux-runtime-generated-kallsyms-first-die-v0/early/.tmp_vmlinux.kallsyms*.ld.stderr.txt
            build/linux-runtime-generated-kallsyms-first-die-v0/early/.tmp_vmlinux.kallsyms*.mksysmap.stderr.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

