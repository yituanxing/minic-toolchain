name: PR98 Materialize Record Rvalue Member
on:
  push:
    branches: [agent/record-rvalue-member-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/record-rvalue-member-v0, fetch-depth: 0}
      - name: Materialize record rvalue member semantics
        run: python3 tools/dev/pr98-materialize-record-rvalue-member.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          chmod +x tests/compiler/c0/run-record-rvalue-member.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused" HOST_CC=cc sh tests/compiler/c0/run-record-rvalue-member.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr98-materialize-record-rvalue-member.yml tools/dev/pr98-materialize-record-rvalue-member.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: support scalar members of record rvalues'
          git push origin HEAD:agent/record-rvalue-member-v0
