name: Core M126A Generic Structured Asm Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  generic-structured-asm:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M126A
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M126A_GENERIC_STRUCTURED_ASM' src/core/core_ir.h; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M126A generic structured asm
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m126a-generic-structured-asm.py
          git diff --check
          grep -Fq 'M126A_GENERIC_STRUCTURED_ASM' src/core/core_ir.h
          grep -Fq 'core_structured_inline_asm_allocate' src/target/riscv64/core_codegen.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m126a-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m126a-check

      - name: Replay M126A eight-TU cohort
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m126a-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m126a-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '25,32,58,61,79,94,177,179'
          replay_status=$?
          set -e
          printf 'CORE_M126A_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/m126a-focused')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if summary['selected'] != 8:
              raise SystemExit(f"expected 8 focused TUs, got {summary['selected']}")
          if summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f"focused ERROR/missing: {summary}")
          print(f"CORE_M126A_FOCUSED selected=8 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work / 'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m126a-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m126a-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M126A_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/m126a-full500')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if summary['selected'] != 500:
              raise SystemExit(f"expected 500 TUs, got {summary['selected']}")
          if summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f"full500 ERROR/missing: {summary}")
          if summary['pass'] < 444:
              raise SystemExit(f"M126A regressed strict500: pass={summary['pass']} baseline=444")
          print(f"CORE_M126A_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work / 'progress-summary.txt').read_text())
          print((work / 'reason-summary.txt').read_text())
          PY

      - name: Commit M126A semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c \
                  src/target/riscv64/core_codegen.c tests/compiler/c0/run-gnu-inline-asm-operands.sh
          git diff --cached --quiet && { echo 'no M126A semantic changes'; exit 1; }
          git commit -m 'core: generalize structured asm register allocation'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M126A results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m126a-generic-asm-${{ github.sha }}
          path: |
            build/m126a-focused/batch-results.json
            build/m126a-focused/frontier-summary.json
            build/m126a-focused/reason-summary.txt
            build/m126a-focused/minic-stderr/**
            build/m126a-full500/batch-results.json
            build/m126a-full500/frontier-summary.json
            build/m126a-full500/reason-summary.txt
            build/m126a-full500/progress-summary.json
            build/m126a-full500/progress-summary.txt
            build/m126a-full500/minic-stderr/**
          if-no-files-found: warn
