name: Publish GNU Typeof Array Bound Cast

on:
  push:
    branches: [compiler/gnu-typeof-array-bound-cast]

permissions:
  contents: write

concurrency:
  group: publish-gnu-typeof-array-bound-cast
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse canonical type-name lookahead for array-bound casts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/parser_core.c')
          text = path.read_text()
          begin = text.index('static bool array_bound_parenthesis_starts_integer_cast(MinicParser *parser) {')
          end = text.index('\nstatic bool array_bound_apply_integer_cast', begin)
          old = text[begin:end]
          new = '''static bool array_bound_parenthesis_starts_integer_cast(MinicParser *parser) {\n    MinicParser probe;\n\n    if (parser == NULL || parser->current.kind != MINIC_TOKEN_LPAREN) {\n        return false;\n    }\n    probe = *parser;\n    if (!minic_parser_advance(&probe)) {\n        return false;\n    }\n    return minic_parser_token_starts_type_name(parser, probe.current);\n}\n'''
          if 'switch (probe.current.kind)' not in old:
              raise SystemExit('legacy array-bound cast lookahead shape not found')
          text = text[:begin] + new + text[end:]
          path.write_text(text)

          runner = Path('tests/compiler/c0/run-foundation-focused.sh')
          data = runner.read_text()
          anchor = '    run-gnu-typeof-array-type-name.sh \\\n'
          if anchor not in data:
              anchor = '    run-gnu-statement-expression.sh \\\n'
          addition = anchor + '    run-gnu-typeof-array-bound-cast.sh \\\n'
          if 'run-gnu-typeof-array-bound-cast.sh' not in data:
              if anchor not in data:
                  raise SystemExit('foundation runner insertion seam not found')
              runner.write_text(data.replace(anchor, addition, 1))
          PY

          cat > tests/compiler/c0/gnu_typeof_array_bound_cast.c <<'EOF'
          typedef unsigned int note_like_t[
              (((sizeof(unsigned long) + ((__typeof__((sizeof(unsigned long))))((4)) - 1)) &
                ~((__typeof__((sizeof(unsigned long))))((4)) - 1)) * 2) /
               4)];

          int typeof_array_bound_cast_size(void)
          {
              return (int)sizeof(note_like_t);
          }
          EOF

          cat > tests/compiler/c0/run-gnu-typeof-array-bound-cast.sh <<'EOF'
          #!/bin/sh
          set -eu

          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/compiler-c0-gnu-typeof-array-bound-cast

          rm -rf "$work"
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c \
            "$root/tests/compiler/c0/gnu_typeof_array_bound_cast.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          grep -F 'typeof_array_bound_cast_size:' "$work/output.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/gnu_typeof_array_bound_cast shared-type-lookahead=1 typeof-cast=1'
          EOF
          chmod +x tests/compiler/c0/run-gnu-typeof-array-bound-cast.sh

          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/parser_core.c tests/compiler/c0/gnu_typeof_array_bound_cast.c
          rm .github/workflows/publish-gnu-typeof-array-bound-cast.yml
          git diff --check

      - name: Sanitizer focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=sanitize BUILD_DIR=build/typeof-bound-sanitize
          MINIC="$GITHUB_WORKSPACE/build/typeof-bound-sanitize/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/typeof-bound-sanitize" \
            sh tests/compiler/c0/run-gnu-typeof-array-bound-cast.sh

      - name: Release Foundation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/typeof-bound-release
          MINIC="$GITHUB_WORKSPACE/build/typeof-bound-release/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/typeof-bound-release" \
            sh tests/compiler/c0/run-foundation-focused.sh

      - name: Commit product-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: share type-name lookahead for array-bound casts' \
            -m 'Replace the stale integer-array-bound cast token switch with the canonical token_starts_type_name semantic query. GNU typeof, typedef shadowing, GNU int128 spellings, and ordinary type specifiers now have one type-name owner; actual integer-cast legality remains in the existing array-bound evaluator.' \
            -m '中文说明：用 canonical token_starts_type_name 语义查询替换旧的 integer array-bound cast token switch。GNU typeof、typedef shadowing、GNU int128 和普通类型说明符统一由一个 type-name owner 判断；整数 cast 的合法性仍由既有 array-bound evaluator 负责。' \
            -m 'Validation / 验证：focused sanitizer PASS; Foundation focused PASS; clang-format-18 canonical.'
          git push origin HEAD:compiler/gnu-typeof-array-bound-cast
