name: Publish Typed Array Declarator Bounds

on:
  push:
    branches: [compiler/gnu-typeof-array-bound-cast]

permissions:
  contents: write

concurrency:
  group: publish-typed-array-declarator-bounds
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route array declarator bounds through typed ConstEval
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core = Path('src/frontend/parser_core.c')
          text = core.read_text()
          old = '''static bool minic_parser_parse_typed_integer_constant_expression(MinicParser *parser,\n                                                                 int64_t *value) {'''
          new = '''bool minic_parser_parse_typed_integer_constant_expression(MinicParser *parser,\n                                                          int64_t *value) {'''
          if text.count(old) != 1:
              raise SystemExit('typed ConstEval helper definition seam not found')
          core.write_text(text.replace(old, new, 1))

          header = Path('src/frontend/parser_internal.h')
          text = header.read_text()
          anchor = 'bool minic_parser_parse_integer_constant_expression(MinicParser *parser, int64_t *value);\n'
          addition = anchor + ('bool minic_parser_parse_typed_integer_constant_expression(MinicParser *parser,\n'
                               '                                                          int64_t *value);\n')
          if 'bool minic_parser_parse_typed_integer_constant_expression(' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('parser_internal typed ConstEval declaration seam not found')
              text = text.replace(anchor, addition, 1)
              header.write_text(text)

          declarator = Path('src/frontend/parser_declarator.c')
          text = declarator.read_text()
          begin = text.index('static bool parse_array_bound_allow_zero(MinicParser *parser, size_t *element_count) {')
          end = text.index('\nbool minic_parser_parse_array_declarator_suffix(', begin)
          section = text[begin:end]
          old_call = '!minic_parser_parse_integer_constant_expression(parser, &value)'
          new_call = '!minic_parser_parse_typed_integer_constant_expression(parser, &value)'
          if section.count(old_call) != 1:
              raise SystemExit('array declarator legacy ICE consumer seam not found')
          text = text[:begin] + section.replace(old_call, new_call, 1) + text[end:]
          declarator.write_text(text)

          runner = Path('tests/compiler/c0/run-foundation-focused.sh')
          data = runner.read_text()
          anchor = '    run-gnu-typeof-array-type-name.sh \\\n'
          if anchor not in data:
              anchor = '    run-gnu-statement-expression.sh \\\n'
          addition = anchor + '    run-gnu-typeof-array-bound-cast.sh \\\n'
          if 'run-gnu-typeof-array-bound-cast.sh' not in data:
              if anchor not in data:
                  raise SystemExit('foundation runner insertion seam not found')
              runner.write_text(data.replace(anchor, addition, 1))
          PY

          cat > tests/compiler/c0/gnu_typeof_array_bound_cast.c <<'EOF'
          typedef unsigned int note_like_t[
              (((sizeof(unsigned long) + ((__typeof__((sizeof(unsigned long))))((4)) - 1)) &
                ~((__typeof__((sizeof(unsigned long))))((4)) - 1)) * 2) /
               4)];

          int typeof_array_bound_cast_size(void)
          {
              return (int)sizeof(note_like_t);
          }
          EOF

          cat > tests/compiler/c0/run-gnu-typeof-array-bound-cast.sh <<'EOF'
          #!/bin/sh
          set -eu

          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/compiler-c0-gnu-typeof-array-bound-cast

          rm -rf "$work"
          mkdir -p "$work"
          "$host_cc" -E -P -std=gnu11 -x c \
            "$root/tests/compiler/c0/gnu_typeof_array_bound_cast.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          grep -F 'typeof_array_bound_cast_size:' "$work/output.s" >/dev/null
          printf '%s\n' 'PASS compiler/c0/gnu_typeof_array_bound_cast semantic-ast=1 typed-consteval=1'
          EOF
          chmod +x tests/compiler/c0/run-gnu-typeof-array-bound-cast.sh

          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/parser_core.c src/frontend/parser_declarator.c \
            src/frontend/parser_internal.h tests/compiler/c0/gnu_typeof_array_bound_cast.c
          rm .github/workflows/publish-gnu-typeof-array-bound-cast.yml
          git diff --check

      - name: Sanitizer focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=sanitize BUILD_DIR=build/typed-array-bound-sanitize
          MINIC="$GITHUB_WORKSPACE/build/typed-array-bound-sanitize/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/typed-array-bound-sanitize" \
            sh tests/compiler/c0/run-gnu-typeof-array-bound-cast.sh

      - name: Release Foundation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/typed-array-bound-release
          MINIC="$GITHUB_WORKSPACE/build/typed-array-bound-release/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/typed-array-bound-release" \
            sh tests/compiler/c0/run-foundation-focused.sh

      - name: Commit product-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: route array declarator bounds through typed ConstEval' \
            -m 'Move array-declarator bounds off the legacy token-level integer-expression evaluator and onto the existing semantic expression AST plus typed ConstEval owner already used by fixed array bounds. GNU typeof casts, sizeof, bitwise operators, and future constant-expression semantics therefore share one canonical evaluator instead of growing a second mini expression language.' \
            -m '中文说明：将 array declarator bound 从 legacy token-level 整数表达式求值器迁移到 fixed array bound 已使用的 semantic expression AST + typed ConstEval owner。GNU typeof cast、sizeof、位运算以及后续常量表达式语义由同一个 canonical evaluator 负责，不再扩张第二套迷你表达式语言。' \
            -m 'Validation / 验证：focused sanitizer PASS; Foundation focused PASS; clang-format-18 canonical.'
          git push origin HEAD:compiler/gnu-typeof-array-bound-cast
