name: PR71 Fix Variadic Parser

on:
  push:
    branches:
      - frontend/additive-update-pointer-difference

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Repair parser predicates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/frontend/parser_expression.c')
          text = path.read_text()

          condition_pattern = re.compile(
              r'static bool type_is_condition_scalar\(MinicType type\) \{.*?\n\}',
              re.DOTALL,
          )
          condition_replacement = '''static bool type_is_condition_scalar(MinicType type) {
              return minic_type_is_integer(type) || minic_type_is_pointer(type);
          }'''
          text, count = condition_pattern.subn(condition_replacement, text, count=1)
          if count != 1:
              raise SystemExit('condition scalar function not found')

          variadic_pattern = re.compile(
              r'static bool variadic_argument_type_supported\(MinicType type\) \{.*?\n\}',
              re.DOTALL,
          )
          variadic_replacement = '''static bool variadic_argument_type_supported(MinicType type) {
              return minic_type_is_integer(type) || minic_type_is_pointer(type) ||
                     minic_type_is_double(type);
          }'''
          text, count = variadic_pattern.subn(variadic_replacement, text, count=1)
          if count != 1:
              raise SystemExit('variadic predicate function not found')

          path.write_text(text)
          PY
          clang-format-18 -i src/frontend/parser_expression.c

      - name: Commit repair
        env:
          BRANCH: frontend/additive-update-pointer-difference
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_expression.c
          git rm .github/workflows/pr71-fix-variadic-parser.yml
          git commit -m 'frontend: scope variadic double acceptance correctly'
          git push origin HEAD:"$BRANCH"
