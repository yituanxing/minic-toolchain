name: Diagnostic Core IR Post Field Shapes V1

on:
  push:
    branches:
      - diagnostic/core-ir-post-field-shapes-v1

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Install Linux Kbuild dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Instrument execution-shape blockers
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/core_lower.c')
          s = p.read_text()
          old = '#include <stdlib.h>\n#include <string.h>\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n', 1)

          old = '''    return MINIC_CORE_LOWER_UNSUPPORTED;
          }

          static MinicCoreLowerStatus lower_assignment_pair'''
          new = '''    (void)fprintf(stderr,
                        "MINIC_CORE_SHAPE domain=expression kind=%d op=%d\\n",
                        (int)expression->kind,
                        expression->kind == MINIC_EXPRESSION_BINARY
                            ? (int)expression->value.binary.operator_kind
                            : -1);
              return MINIC_CORE_LOWER_UNSUPPORTED;
          }

          static MinicCoreLowerStatus lower_assignment_pair'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = '''    if (expression->kind != MINIC_EXPRESSION_ASSIGNMENT) {
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
          '''
          new = '''    if (expression->kind != MINIC_EXPRESSION_ASSIGNMENT) {
                  (void)fprintf(stderr,
                                "MINIC_CORE_SHAPE domain=expression_statement kind=%d op=%d\\n",
                                (int)expression->kind,
                                expression->kind == MINIC_EXPRESSION_BINARY
                                    ? (int)expression->value.binary.operator_kind
                                    : -1);
                  return MINIC_CORE_LOWER_UNSUPPORTED;
              }
          '''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = '''            default:
                          return MINIC_CORE_LOWER_UNSUPPORTED;
          '''
          new = '''            default:
                          (void)fprintf(stderr,
                                        "MINIC_CORE_SHAPE domain=statement kind=%d op=-1\\n",
                                        (int)statement->kind);
                          return MINIC_CORE_LOWER_UNSUPPORTED;
          '''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build diagnostic compiler
        run: make -j4 MODE=release BUILD_DIR=build/core-post-field-shapes-compiler

      - name: Drive fixed first100 with Core shadow
        continue-on-error: true
        env:
          MINIC_CORE_IR: shadow
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/core-post-field-shapes-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-post-field-shapes-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
          LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=2 \
            sh tests/external/linux/batch_probe.sh

      - name: Aggregate execution shapes
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          expression_names = [
              'INTEGER','FLOATING','LOCAL','GLOBAL_OBJECT','FIXED_REGISTER','FUNCTION',
              'LABEL_ADDRESS','CALL_FRAME_ADDRESS','BUILTIN_UNREACHABLE','SIZEOF','OFFSETOF',
              'ADDRESS_OF','DEREFERENCE','CAST','BITCAST','CONVERSION','DISCARD','SUBSCRIPT',
              'MEMBER','LVALUE_READ','ASSIGNMENT','COMPOUND_ASSIGNMENT','UNARY','BINARY',
              'CONDITIONAL','CALL','COMPOUND_LITERAL','STATEMENT','BUILTIN_UNARY','BUILTIN_OVERFLOW'
          ]
          binary_names = [
              'ADD','SUBTRACT','MULTIPLY','DIVIDE','REMAINDER','SHIFT_LEFT','SHIFT_RIGHT',
              'BITWISE_AND','BITWISE_XOR','BITWISE_OR','EQUAL','NOT_EQUAL','LESS','LESS_EQUAL',
              'GREATER','GREATER_EQUAL','LOGICAL_AND','LOGICAL_OR','COMMA'
          ]
          statement_names = [
              'ASSIGN','RECORD_COPY','XOR_ASSIGN','EXPRESSION','INLINE_ASM','RETURN','BREAK',
              'GOTO','LABEL','IF','WHILE','SWITCH','CASE','DEFAULT'
          ]
          pat = re.compile(r'^MINIC_CORE_SHAPE domain=(\S+) kind=(-?\d+) op=(-?\d+)$')
          counts = Counter()
          root = Path('build/core-post-field-shapes-linux/minic-stderr')
          for path in root.rglob('*.stderr') if root.is_dir() else []:
              for line in path.read_text(errors='replace').splitlines():
                  m = pat.match(line.strip())
                  if not m:
                      continue
                  domain, raw_kind, raw_op = m.groups()
                  kind = int(raw_kind)
                  op = int(raw_op)
                  if domain in ('expression', 'expression_statement'):
                      kname = expression_names[kind] if 0 <= kind < len(expression_names) else f'EXPR_{kind}'
                      if kname == 'BINARY' and 0 <= op < len(binary_names):
                          shape = f'{domain}:BINARY_{binary_names[op]}'
                      else:
                          shape = f'{domain}:{kname}'
                  else:
                      kname = statement_names[kind] if 0 <= kind < len(statement_names) else f'STMT_{kind}'
                      shape = f'{domain}:{kname}'
                  counts[shape] += 1
          total = sum(counts.values())
          lines = ['MINIC_CORE_POST_FIELD_EXECUTION_SHAPES', f'total_shape_blockers={total}']
          for shape, count in counts.most_common():
              pct = 100.0 * count / total if total else 0.0
              lines.append(f'{shape}={count} ({pct:.2f}%)')
          text = '\n'.join(lines) + '\n'
          out = Path('build/core-post-field-shapes-linux/core-execution-shapes.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text)
          print(text, end='')
          PY
          test -s build/core-post-field-shapes-linux/batch-summary.txt && cat build/core-post-field-shapes-linux/batch-summary.txt || true

      - name: Upload shape evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-post-field-first100-shapes-${{ github.run_id }}
          path: |
            build/core-post-field-shapes-linux/core-execution-shapes.txt
            build/core-post-field-shapes-linux/batch-summary.txt
          if-no-files-found: ignore
          retention-days: 7
