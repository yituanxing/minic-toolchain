name: Core M175A Repeated Array Object Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect M175A state
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M175A_REPEATED_ARRAY_OBJECT' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
            echo "M175A_ALREADY_PRODUCTIZED head=$(git rev-parse HEAD)"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
            echo "M175A_SOURCE_HEAD=$(git rev-parse HEAD)"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Materialize repeated array object owner
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m175a-repeated-array-object.py
          git diff --check
          grep -Fq 'M175A_REPEATED_ARRAY_OBJECT' src/core/core_lower.c

      - name: Build patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m175a-compiler

      - name: Run pointer arithmetic fast target
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-pointer-arithmetic MODE=release CFLAGS=-Werror BUILD_DIR=build/m175a-check

      - name: Run isolated aggregate pointer strict regression
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175a-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175a-regression"
          mkdir -p "$work"
          cc -E -P -std=gnu11 -x c tests/programs/c0/pointer_aggregate_arithmetic.c -o "$work/pointer-aggregate.i"
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 "$compiler" -S "$work/pointer-aggregate.i" -o "$work/pointer-aggregate.s"
          grep -F '.Lmain_core_return:' "$work/pointer-aggregate.s" >/dev/null
          grep -E '^[[:space:]]+(mul|slli)[[:space:]]' "$work/pointer-aggregate.s" >/dev/null
          printf '%s\n' 'CORE_M175A_STRICT_REGRESSION array-of-array-address=PASS aggregate-pointer-arithmetic=PASS'

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175a-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175a-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M175A_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/m175a-full500')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['pass'] != 500 or summary['unsupported'] != 0 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M175A requires exact strict500 500/500: {summary}')
          print('CORE_M175A_FULL500 selected=500 pass=500 unsupported=0 error=0')
          PY

      - name: Productize M175A
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c
          git diff --cached --quiet && { echo 'no M175A semantic changes'; exit 1; }
          git commit -m 'core: support repeated materialized array locals'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M175A evidence
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m175a-repeated-array-${{ github.sha }}
          path: |
            build/m175a-regression/**
            build/m175a-full500/**
          if-no-files-found: warn
