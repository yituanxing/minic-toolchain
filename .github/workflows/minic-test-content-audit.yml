name: MiniC minimal production baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build complete production toolchain (C11, -Werror)
        run: make -j4 MODE=release CFLAGS=-Werror all
      - name: Run maintained 202-case GNU/MiniC native oracle matrix
        run: make MODE=release CFLAGS=-Werror check-native
      - name: Verify generated invalid-language rejections
        run: make MODE=release CFLAGS=-Werror check-parser
      - name: Verify MiniAS and MiniPP native smoke contracts
        run: make MODE=release CFLAGS=-Werror check-toolchain

  temporary-cppcheck-minic-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Check C functions across full src, report MiniC results
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck >/tmp/minic-install.log 2>&1
          cppcheck --version
          cppcheck --enable=unusedFunction,warning,style --language=c --std=c11 --template='{file}:{line}:{severity}:{id}:{message}' --suppress=missingIncludeSystem --suppress=missingInclude -j1 src > /tmp/minic-cpp-out.txt 2> /tmp/minic-cppcheck.txt || true
          echo "CPP_TOTAL_DIAGNOSTICS $(grep -Ec ':(warning|style|error|performance):' /tmp/minic-cppcheck.txt || true)"
          echo "CPP_UNUSED_ALL $(grep -c ':unusedFunction:' /tmp/minic-cppcheck.txt || true)"
          echo "CPP_UNUSED_MINIC $(grep -E '^(src/compiler/|src/frontend/|src/core/|src/target/).*:unusedFunction:' /tmp/minic-cppcheck.txt | wc -l)"
          echo '=== MINI C UNUSED FUNCTIONS ==='
          grep -E '^(src/compiler/|src/frontend/|src/core/|src/target/).*:unusedFunction:' /tmp/minic-cppcheck.txt | head -100 || true
          echo '=== MINI C SELECTED NON-UNUSED DIAGNOSTICS ==='
          grep -E '^(src/compiler/|src/frontend/|src/core/|src/target/).*:(warning|style|error):' /tmp/minic-cppcheck.txt | grep -v ':unusedFunction:' | head -100 || true
          echo '=== CPP END ==='
  temporary-jscpd-minic-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Check structural clones inside MiniC C implementation
        shell: bash
        run: |
          set -uo pipefail
          node --version
          npm --version
          timeout 900s npx --yes jscpd@5 --format c --min-lines 12 --min-tokens 70 --similarity 0.85 --reporters console src/compiler src/frontend src/core src/target > /tmp/minic-jscpd.log 2>&1
          result=$?
          echo "JSCPD_EXIT $result"
          echo "JSCPD_LINES $(wc -l < /tmp/minic-jscpd.log)"
          echo '=== JSCPD FIRST 140 LINES ==='
          head -140 /tmp/minic-jscpd.log
          echo '=== JSCPD LAST 40 LINES ==='
          tail -40 /tmp/minic-jscpd.log
          echo '=== JSCPD END ==='
