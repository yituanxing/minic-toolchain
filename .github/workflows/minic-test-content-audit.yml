name: MiniC minimal production baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build complete production toolchain (C11, -Werror)
        run: make -j4 MODE=release CFLAGS=-Werror all
      - name: Run maintained 202-case GNU/MiniC native oracle matrix
        run: make MODE=release CFLAGS=-Werror check-native
      - name: Verify generated invalid-language rejections
        run: make MODE=release CFLAGS=-Werror check-parser
      - name: Verify MiniAS and MiniPP native smoke contracts
        run: make MODE=release CFLAGS=-Werror check-toolchain

  temporary_dead_code_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repository-wide call-site audit for Cppcheck candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          files=subprocess.check_output(["git","ls-files","-z","--","*.c","*.h"]).decode().split("\0")
          files=[x for x in files if x and not x.startswith("third_party/")]
          data={x:Path(x).read_text(encoding="utf-8",errors="replace") for x in files}
          candidates="minic_core_asm_output_operand_count minic_core_function_is_variadic minic_core_asm_token_mentions_symbol minic_core_assembler_symbol_lexically_safe minic_core_deferred_asm_symbol_valid minic_core_format_label_symbol minic_core_format_deferred_asm_symbol minic_c0_call_argument minic_c0_call_set_argument minic_core_block_walk_begin minic_core_block_walk_next minic_core_frame_reserve minic_core_scalar_bitcast_shape minic_direct_lp64_abi_policy_valid minic_lp64_baseline_values_fit_frame minic_lp64_function_integer_width minic_lp64_core_type_float_format minic_machine_production_preflight minic_riscv_codegen_has minic_x86_64_machine_fixed_register_read minic_x86_64_machine_local_fixed_register minic_x86_64_target_codegen_options_set minic_x86_64_requires_qualified_input_asm minic_x86_64_qualify_inline_asm_goto minic_x86_64_qualify_inline_asm minic_x86_64_write_core_module".split()
          print("SCANNED_FILES",len(data),flush=True)
          for name in candidates:
              pattern=re.compile(r"\b"+re.escape(name)+r"\b")
              sites=[]
              for path,body in data.items():
                  for match in pattern.finditer(body):
                      sites.append((path,body.count("\n",0,match.start())+1))
              print("SYMBOL",name,"HITS",len(sites),"SITES"," ".join(f"{p}:{n}" for p,n in sites[:16]),flush=True)
          PY
