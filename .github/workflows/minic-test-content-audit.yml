name: MiniC minimal production baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build complete production toolchain (C11, -Werror)
        run: make -j4 MODE=release CFLAGS=-Werror all
      - name: Run maintained 202-case GNU/MiniC native oracle matrix
        run: make MODE=release CFLAGS=-Werror check-native
      - name: Verify generated invalid-language rejections
        run: make MODE=release CFLAGS=-Werror check-parser
      - name: Verify MiniAS and MiniPP native smoke contracts
        run: make MODE=release CFLAGS=-Werror check-toolchain
  temporary_link_gc_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trace unreachable compiled functions from production minic-cc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gc-audit
          if ! make -j4 MODE=debug BUILD_DIR=build/gc-audit CFLAGS="-Werror -ffunction-sections -fdata-sections" LDFLAGS="-Wl,--gc-sections -Wl,--print-gc-sections" build/gc-audit/bin/minic-cc > build/gc-audit/make.log 2>&1; then
            tail -120 build/gc-audit/make.log
            exit 1
          fi
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          text=Path("build/gc-audit/make.log").read_text(errors="replace")
          pat=re.compile(r"removing unused section [\x27\u2018]([^\x27\u2019]+)[\x27\u2019] in file [\x27\u2018]([^\x27\u2019]+)[\x27\u2019]")
          found=set()
          for line in text.splitlines():
              m=pat.search(line)
              if not m: continue
              sec,obj=m.groups()
              if not sec.startswith(".text.") or not obj.startswith("build/gc-audit/obj/"):continue
              if not obj.endswith(".o"):continue
              symbol=sec[6:]
              src=obj.replace("build/gc-audit/obj/","",1)[:-2]+".c"
              found.add((src,symbol))
          print("GC_AUDIT total_deleted_function_sections",len(found),flush=True)
          counts=Counter(src for src,sym in found)
          for src,n in counts.most_common(30):
              print("GC_FILE",n,src,flush=True)
          for src,sym in sorted(found):
              print("GC_UNUSED",src,sym,flush=True)
          import subprocess
          paths=subprocess.check_output(["git","ls-files","-z","--","*.c","*.h"]).decode().split("\0")
          indexed={}
          for path in paths:
              if path and not path.startswith("third_party/"):
                  indexed[path]=Path(path).read_text(encoding="utf-8",errors="replace")
          for src,sym in sorted(found):
              pat=re.compile(r"\b"+re.escape(sym)+r"\b")
              references=[]
              for path,body in indexed.items():
                  hits=len(pat.findall(body))
                  if hits:references.append((path,hits))
              refs=" ".join(f"{p}:{n}" for p,n in references[:16])
              print("GC_SITE",sym,"FILES",len(references),"HITS",sum(n for _,n in references),"REFS",refs,flush=True)
          PY
