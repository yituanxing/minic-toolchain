name: One-shot Core Strict Frontier M5b

on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Build exact MiniC candidate
        shell: bash
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m5b-probe-compiler

      - name: Replay deterministic 64-TU strict sample
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/core-m5b-probe-compiler/bin/minic" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$GITHUB_WORKSPACE/build/core-m5b-strict-probe" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 64 \
            --indices ''
          replay_status=$?
          set -e
          printf 'CORE_STRICT_REPLAY_STATUS=%d\n' "$replay_status"
          grep -q '^selected_c_tus=64$' build/core-m5b-strict-probe/batch-summary.txt

          python3 - <<'PY'
          from collections import Counter
          import json
          import re
          from pathlib import Path

          rows = json.loads(Path('build/core-m5b-strict-probe/batch-results.json').read_text())
          unsupported_re = re.compile(r"^Core IR shadow does not yet support function '([^']+)'$")
          unsupported = Counter()
          errors = []
          passes = 0
          for row in rows:
              if row['status'] == 'PASS':
                  passes += 1
                  continue
              message = str(row['message'])
              match = unsupported_re.match(message)
              if match:
                  unsupported[match.group(1)] += 1
              else:
                  errors.append((row['index'], message))

          print(f'CORE_STRICT_FRONTIER selected={len(rows)} pass={passes} unsupported={sum(unsupported.values())} error={len(errors)}')
          for function, count in unsupported.most_common():
              print(f'CORE_STRICT_BLOCKER count={count} function={function}')
          for index, message in errors:
              print(f'CORE_STRICT_ERROR index={index} message={message}')
          if errors:
              raise SystemExit(1)
          PY

      - name: Show strict summary
        if: always()
        shell: bash
        run: |
          test -s build/core-m5b-strict-probe/batch-summary.txt && cat build/core-m5b-strict-probe/batch-summary.txt || true
