name: MiniObjcopy and MiniStrip Regressions V1

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniobjcopy-strip-regressions-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[miniobjcopy-strip-regressions]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV32 RV64 oracle tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Strict build once
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-strip-v1 all

      - name: Preserve shared ELF reader consumers
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-strip-v1 check-minielf-reader-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-strip-v1 check-mininm-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-strip-v1 check-miniar-a0
          echo "MINIOBJCOPY_STRIP_SHARED_CONSUMERS=PASS reader=A0 mininm=A0 miniar=A0"

      - name: Validate MiniObjcopy A0 and A1
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-strip-v1 check-miniobjcopy-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-strip-v1 check-miniobjcopy-a1
          echo "MINIOBJCOPY_REGRESSIONS=PASS a0=PASS a1=PASS"

      - name: Validate MiniStrip A0
        run: |
          set -Eeuo pipefail
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy-strip-v1 check-minicstrip-a0
          echo "MINISTRIP_REGRESSION=PASS a0=PASS"

      - name: Publish canonical verdict
        run: echo "MINIOBJCOPY_STRIP_REGRESSIONS_V1=PASS shared-reader=PASS objcopy-a0=PASS objcopy-a1=PASS strip-a0=PASS head=$GITHUB_SHA"
