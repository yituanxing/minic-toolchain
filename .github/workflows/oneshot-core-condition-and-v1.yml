name: One-shot Core Condition And

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply Core M12 slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-condition-and-v1.py
          python3 tools/dev/patch-core-condition-and-v1.py
          clang-format-18 -i \
            src/core/core_lower.c \
            tests/compiler/c0/core_condition_and.c \
            tests/compiler/c0/core_condition_and_runtime.c
          sh -n tests/compiler/c0/run-core-condition-and.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check

      - name: Build exact compiler
        shell: bash
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m12-compiler

      - name: Validate condition decomposition
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m12-compiler/bin/minic"
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m12-condition" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-condition-and.sh

          cat > build/core-m12-condition/pointer-not-equal.i <<'EOF'
          int core_m12_pointer_not_equal(int *left, int *right) {
              if (left != right)
                  return 1;
              return 0;
          }
          EOF
          "$compiler" -S build/core-m12-condition/pointer-not-equal.i \
            -o build/core-m12-condition/pointer-not-equal-normal.s
          if MINIC_CORE_IR=strict "$compiler" -S build/core-m12-condition/pointer-not-equal.i \
              -o build/core-m12-condition/pointer-not-equal-strict.s \
              2> build/core-m12-condition/pointer-not-equal-strict.err; then
            echo 'pointer != unexpectedly became Core-owned in M12' >&2
            exit 1
          fi
          grep -F "Core IR shadow does not yet support function 'core_m12_pointer_not_equal'" \
            build/core-m12-condition/pointer-not-equal-strict.err >/dev/null
          printf '%s\n' 'PASS core/m12-condition-boundary'

      - name: Replay deterministic 64-TU strict sample
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m12-compiler/bin/minic"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$GITHUB_WORKSPACE/build/core-m12-strict-probe" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 64 \
            --indices ''
          replay_status=$?
          set -e
          printf 'CORE_M12_STRICT_REPLAY_STATUS=%d\n' "$replay_status"
          grep -q '^selected_c_tus=64$' build/core-m12-strict-probe/batch-summary.txt

          python3 - <<'PY'
          from collections import Counter
          import json
          import re
          from pathlib import Path

          rows = json.loads(Path('build/core-m12-strict-probe/batch-results.json').read_text())
          unsupported_re = re.compile(r"^Core IR shadow does not yet support function '([^']+)'$")
          unsupported = Counter()
          errors = []
          passes = 0
          for row in rows:
              if row['status'] == 'PASS':
                  passes += 1
                  continue
              message = str(row['message'])
              match = unsupported_re.match(message)
              if match:
                  unsupported[match.group(1)] += 1
              else:
                  errors.append((row['index'], message))

          print(f'CORE_M12_STRICT_FRONTIER selected={len(rows)} pass={passes} '
                f'unsupported={sum(unsupported.values())} error={len(errors)}')
          for function, count in unsupported.most_common():
              print(f'CORE_M12_STRICT_BLOCKER count={count} function={function}')
          for index, message in errors:
              print(f'CORE_M12_STRICT_ERROR index={index} message={message}')
          print(f"CORE_M12_LIST_ADD_VALID count={unsupported['__list_add_valid']}")
          if errors:
              raise SystemExit('unexpected Core strict errors')
          if unsupported['__list_add_valid'] > 23:
              raise SystemExit('condition decomposition regressed list-add frontier')
          PY

      - name: Publish Core M12 slice
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-condition-and-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_lower.c \
            tests/compiler/c0/core_condition_and.c \
            tests/compiler/c0/core_condition_and_runtime.c \
            tests/compiler/c0/run-core-condition-and.sh \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-condition-and-v1.py
          git diff --cached --check
          git commit -m 'core: decompose logical-and conditions'
          git push origin HEAD:refactor/declaration-sema-v1
