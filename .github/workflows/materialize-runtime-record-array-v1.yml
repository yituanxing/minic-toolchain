name: Materialize Runtime Record Array V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: read
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize convergence compiler
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-array-v1.py
          python3 tools/dev/materialize-fixed-call-character-pointer-v1.py
          python3 tools/dev/materialize-function-pointer-array-declarator-v1.py
          python3 tools/dev/materialize-preformed-static-array-v1.py
          python3 tools/dev/materialize-static-local-prefix-attributes-v1.py
          python3 tools/dev/materialize-top-level-braced-static-scalar-v1.py
          python3 tools/dev/materialize-parenthesized-pointer-array-v1.py
          clang-format-18 -i src/frontend/parser_statement.c src/frontend/parser_expression.c \
            src/frontend/parser_declarator.c src/frontend/parser_internal.h src/frontend/parser_global.c
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/convergence
      - name: Focused regression seams
        run: |
          set -Eeuo pipefail
          cat > /tmp/seams.c <<'EOF'
          static int zero(void) { return 0; }
          static int (*actions[])(void) = { zero };
          int main(void) {
              char (*p)[0] = 0;
              static __attribute__((unused)) unsigned long key = { 0 };
              return p == 0 && actions[0]() == 0 && key == 0 ? 0 : 1;
          }
          EOF
          build/convergence/bin/minic -S /tmp/seams.c -o /tmp/seams.s
          test -s /tmp/seams.s
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Diagnose unchanged kvm_main.i
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/kvm-main" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=68 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/kvm-main/batch-summary.txt
          stderr=build/kvm-main/minic-stderr/virt/kvm/kvm_main.i.stderr
          cat "$stderr" || true
          input=build/kvm-main/kbuild/virt/kvm/kvm_main.i
          frontier=$(sed -n 's/.*kvm_main\.i:\([0-9][0-9]*\):.*/\1/p' "$stderr" | head -n 1)
          if test -n "$frontier"; then
            start=$((frontier > 45 ? frontier - 45 : 1)); end=$((frontier + 45));
            echo "--- exact source context ${start}..${end} ---"
            nl -ba "$input" | sed -n "${start},${end}p"
          fi
          echo "KVM_MAIN_PROBE_STATUS=$status"
