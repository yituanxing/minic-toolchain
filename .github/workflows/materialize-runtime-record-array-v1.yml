name: Materialize Runtime Record Array V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: read
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-array-v1.py
          python3 tools/dev/materialize-fixed-call-character-pointer-v1.py
          python3 tools/dev/materialize-function-pointer-array-declarator-v1.py
          python3 tools/dev/materialize-preformed-static-array-v1.py
          clang-format-18 -i \
            src/frontend/parser_statement.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_declarator.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_global.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/runtime-record-array
      - name: Recheck focused function pointer arrays
        run: |
          set -Eeuo pipefail
          cat > /tmp/function-pointer-array.c <<'EOF'
          static int zero(void) { return 0; }
          static int one(void) { return 1; }
          static int (*actions[])(void) = { [0] = zero, [1] = one };
          static int (*fixed[2])(void) = { zero, one };
          static int (*matrix[2][3])(void);
          int main(void) { return actions[1]() == 1 && fixed[0]() == 0 && matrix[0][0] == 0 ? 0 : 1; }
          EOF
          build/runtime-record-array/bin/minic -S /tmp/function-pointer-array.c -o /tmp/function-pointer-array.s
          test -s /tmp/function-pointer-array.s
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Diagnose unchanged initramfs.i after 59425
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/runtime-record-array/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/runtime-record-array-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=4 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          echo "$status" > /tmp/initramfs-status
          cat build/runtime-record-array-linux/batch-summary.txt
          cat build/runtime-record-array-linux/minic-stderr/init/initramfs.i.stderr || true
          input=build/runtime-record-array-linux/kbuild/init/initramfs.i
          echo '--- initramfs exact context 59460..59525 ---'
          nl -ba "$input" | sed -n '59460,59525p'
      - name: Probe unchanged module.i with same declarator slice
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/runtime-record-array/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/function-pointer-array-module" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=37 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/function-pointer-array-module/batch-summary.txt || true
          cat build/function-pointer-array-module/minic-stderr/arch/riscv/kernel/module.i.stderr || true
          input=build/function-pointer-array-module/kbuild/arch/riscv/kernel/module.i
          if test -f "$input"; then
            frontier=$(sed -n 's/.*module\.i:\([0-9][0-9]*\):.*/\1/p' build/function-pointer-array-module/minic-stderr/arch/riscv/kernel/module.i.stderr | head -n 1)
            if test -n "$frontier"; then
              start=$((frontier > 25 ? frontier - 25 : 1)); end=$((frontier + 25));
              nl -ba "$input" | sed -n "${start},${end}p"
            fi
          fi
          echo "MODULE_PROBE_STATUS=$status"
      - name: Preserve initramfs failure status
        run: |
          status=$(cat /tmp/initramfs-status)
          exit "$status"
