name: Materialize Runtime Record Array V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: read
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize convergence compiler
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-array-v1.py
          python3 tools/dev/materialize-fixed-call-character-pointer-v1.py
          python3 tools/dev/materialize-function-pointer-array-declarator-v1.py
          python3 tools/dev/materialize-preformed-static-array-v1.py
          python3 tools/dev/materialize-static-local-prefix-attributes-v1.py
          python3 tools/dev/materialize-top-level-braced-static-scalar-v1.py
          python3 tools/dev/materialize-parenthesized-pointer-array-v1.py
          python3 tools/dev/materialize-record-pointer-array-v1.py
          python3 tools/dev/materialize-gnu-function-void-pointer-equality-v1.py
          python3 tools/dev/materialize-gnu-signed-left-shift-ice-v1.py
          clang-format-18 -i \
            src/frontend/parser_statement.c src/frontend/parser_expression.c \
            src/frontend/parser_declarator.c src/frontend/parser_internal.h \
            src/frontend/parser_global.c src/frontend/parser_record.c \
            src/frontend/ast.c src/frontend/const_eval.c
          git diff --check
          make -j4 MODE=release BUILD_DIR=build/convergence
      - name: Focused declarator regression seams
        run: |
          set -Eeuo pipefail
          cat > /tmp/seams.c <<'EOF'
          struct holder { char (*zero)[0]; char (*fixed)[4]; };
          static unsigned long key = { 0 };
          static int zero_fn(void) { return 0; }
          static int (*actions[])(void) = { zero_fn };
          int main(void) {
              char (*p)[0] = 0;
              struct holder h = { .zero = 0, .fixed = 0 };
              return p == 0 && h.zero == 0 && h.fixed == 0 && actions[0]() == 0 && key == 0 ? 0 : 1;
          }
          EOF
          build/convergence/bin/minic -S /tmp/seams.c -o /tmp/seams.s
          test -s /tmp/seams.s
      - name: Focused GNU function-void pointer equality
        run: |
          set -Eeuo pipefail
          cat > /tmp/pointer-equality-positive.c <<'EOF'
          static void fn(void) {}
          int eq(void (*p)(void)) {
              return p == (void *)fn || (void *)fn != p;
          }
          EOF
          build/convergence/bin/minic -S /tmp/pointer-equality-positive.c -o /tmp/pointer-equality-positive.s
          test -s /tmp/pointer-equality-positive.s
          cat > /tmp/pointer-relational-negative.c <<'EOF'
          static void fn(void) {}
          int bad(void (*p)(void)) { return p < (void *)fn; }
          EOF
          if build/convergence/bin/minic -S /tmp/pointer-relational-negative.c -o /tmp/pointer-relational-negative.s; then
            echo 'expected function/void pointer relational comparison to fail' >&2
            exit 1
          fi
          cat > /tmp/pointer-equality-negative.c <<'EOF'
          static void fn(void) {}
          int bad(void (*p)(void), int *q) { return p == q; }
          EOF
          if build/convergence/bin/minic -S /tmp/pointer-equality-negative.c -o /tmp/pointer-equality-negative.s; then
            echo 'expected incompatible function/object pointer equality to fail without void bridge' >&2
            exit 1
          fi
          printf '%s\n' 'PASS GNU function<->void pointer equality only; relational/incompatible object pointer rejected'
      - name: Focused GNU signed left-shift ICE
        run: |
          set -Eeuo pipefail
          cat > /tmp/gnu-shift-ice-positive.c <<'EOF'
          enum transport {
              TCP = 6,
              BC_TCP = TCP | (1 << 31),
          };
          static int value = BC_TCP;
          int main(void) { return value == (int)0x80000006U ? 0 : 1; }
          EOF
          build/convergence/bin/minic -S /tmp/gnu-shift-ice-positive.c -o /tmp/gnu-shift-ice-positive.s
          test -s /tmp/gnu-shift-ice-positive.s
          cat > /tmp/gnu-shift-negative-lhs.c <<'EOF'
          enum bad { X = (-1) << 1 };
          EOF
          if build/convergence/bin/minic -S /tmp/gnu-shift-negative-lhs.c -o /tmp/gnu-shift-negative-lhs.s; then
            echo 'expected negative signed left-shift ICE to fail' >&2
            exit 1
          fi
          cat > /tmp/gnu-shift-width.c <<'EOF'
          enum bad { X = 1 << 32 };
          EOF
          if build/convergence/bin/minic -S /tmp/gnu-shift-width.c -o /tmp/gnu-shift-width.s; then
            echo 'expected out-of-width left shift ICE to fail' >&2
            exit 1
          fi
          printf '%s\n' 'PASS GNU signed left-shift ICE sign-bit target pattern; negative/count>=width rejected'
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Probe unchanged do_mounts.i
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/do-mounts" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=2 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/do-mounts/batch-summary.txt
          stderr=build/do-mounts/minic-stderr/init/do_mounts.i.stderr
          cat "$stderr" || true
          input=build/do-mounts/kbuild/init/do_mounts.i
          frontier=$(sed -n 's/.*do_mounts\.i:\([0-9][0-9]*\):.*/\1/p' "$stderr" | head -n 1)
          if test -n "$frontier"; then
            start=$((frontier > 35 ? frontier - 35 : 1)); end=$((frontier + 35));
            nl -ba "$input" | sed -n "${start},${end}p"
          fi
          echo "DO_MOUNTS_PROBE_STATUS=$status"
      - name: Probe unchanged kvm_main.i
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/kvm-main" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=68 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/kvm-main/batch-summary.txt
          stderr=build/kvm-main/minic-stderr/virt/kvm/kvm_main.i.stderr
          cat "$stderr" || true
          input=build/kvm-main/kbuild/virt/kvm/kvm_main.i
          frontier=$(sed -n 's/.*kvm_main\.i:\([0-9][0-9]*\):.*/\1/p' "$stderr" | head -n 1)
          if test -n "$frontier"; then
            start=$((frontier > 40 ? frontier - 40 : 1)); end=$((frontier + 40));
            nl -ba "$input" | sed -n "${start},${end}p"
          fi
          echo "KVM_MAIN_PROBE_STATUS=$status"
      - name: Probe fixed Linux first100
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/first100" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/first100/batch-summary.txt
          echo "FIRST100_STATUS=$status"
          test "$status" -eq 0 || test "$status" -eq 1
