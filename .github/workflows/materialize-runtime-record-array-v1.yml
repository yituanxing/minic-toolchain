name: Materialize Runtime Record Array V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-array-v1.py
          python3 tools/dev/materialize-fixed-call-character-pointer-v1.py
          clang-format-18 -i src/frontend/parser_statement.c src/frontend/parser_expression.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/runtime-record-array
      - name: Focused runtime record array semantics
        run: |
          set -Eeuo pipefail
          cat > /tmp/runtime-record-array.c <<'EOF'
          struct item { long a; long b; };
          int f(long x) {
              struct item values[3] = { { .a = x }, { .b = 7 } };
              struct item designated[2] = { [1] = { .a = 9 } };
              return (int)(values[0].a + values[0].b + values[1].a + values[1].b +
                           values[2].a + values[2].b + designated[0].a + designated[0].b +
                           designated[1].a + designated[1].b);
          }
          EOF
          build/runtime-record-array/bin/minic -S /tmp/runtime-record-array.c -o /tmp/runtime-record-array.s
          test -s /tmp/runtime-record-array.s
      - name: Focused fixed-call character pointer conversions
        run: |
          set -Eeuo pipefail
          cat > /tmp/char-call-positive.c <<'EOF'
          static long sink(const unsigned char *p) { return p != 0; }
          static long signed_sink(const signed char *p) { return p != 0; }
          long call_plain(char *p) { return sink(p) + signed_sink(p); }
          EOF
          build/runtime-record-array/bin/minic -S /tmp/char-call-positive.c -o /tmp/char-call-positive.s
          cat > /tmp/char-call-drop-const.c <<'EOF'
          static long sink(unsigned char *p) { return p != 0; }
          long reject_drop_const(const char *p) { return sink(p); }
          EOF
          ! build/runtime-record-array/bin/minic -S /tmp/char-call-drop-const.c -o /tmp/char-call-drop-const.s
          cat > /tmp/char-call-rank-mismatch.c <<'EOF'
          static long sink(const unsigned char *p) { return p != 0; }
          long reject_rank_mismatch(int *p) { return sink(p); }
          EOF
          ! build/runtime-record-array/bin/minic -S /tmp/char-call-rank-mismatch.c -o /tmp/char-call-rank-mismatch.s
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Diagnose unchanged initramfs.i declarator frontier
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/runtime-record-array/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/runtime-record-array-linux" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=4 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/runtime-record-array-linux/batch-summary.txt
          input=build/runtime-record-array-linux/kbuild/init/initramfs.i
          echo '--- compiler diagnostic ---'
          cat build/runtime-record-array-linux/minic-stderr/init/initramfs.i.stderr || true
          echo '--- exact source context 59395..59455 ---'
          nl -ba "$input" | sed -n '59395,59455p'
          echo '--- declarator-like lines nearby ---'
          sed -n '59370,59480p' "$input" | grep -n -E '\(\*|\[[^]]*\][[:space:]]*\(|typedef|static|extern' || true
          exit "$status"
      - name: Probe fixed Linux first100
        if: success()
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/runtime-record-array/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/runtime-record-array-first100" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/runtime-record-array-first100/batch-summary.txt
          test "$status" -eq 1 || test "$status" -eq 0
      - name: Commit product only
        if: success()
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-runtime-record-array-v1.py \
                tools/dev/materialize-fixed-call-character-pointer-v1.py \
                .github/workflows/materialize-runtime-record-array-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c src/frontend/parser_expression.c \
                  tools/dev/materialize-runtime-record-array-v1.py \
                  tools/dev/materialize-fixed-call-character-pointer-v1.py \
                  .github/workflows/materialize-runtime-record-array-v1.yml
          git diff --cached --check
          git commit -m 'frontend: complete initramfs runtime initializer semantics'
          git push origin HEAD:staging/string-octal-v1
