name: Materialize Runtime Record Array V1
on:
  push:
    branches: [staging/string-octal-v1]
permissions:
  contents: read
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/string-octal-v1
          fetch-depth: 0
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-runtime-record-array-v1.py
          python3 tools/dev/materialize-fixed-call-character-pointer-v1.py
          python3 tools/dev/materialize-function-pointer-array-declarator-v1.py
          python3 tools/dev/materialize-preformed-static-array-v1.py
          python3 tools/dev/materialize-static-local-prefix-attributes-v1.py
          python3 tools/dev/materialize-top-level-braced-static-scalar-v1.py
          python3 tools/dev/materialize-parenthesized-pointer-array-v1.py
          clang-format-18 -i \
            src/frontend/parser_statement.c \
            src/frontend/parser_expression.c \
            src/frontend/parser_declarator.c \
            src/frontend/parser_internal.h \
            src/frontend/parser_global.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/convergence
      - name: Focused parenthesized pointer-to-array semantics
        run: |
          set -Eeuo pipefail
          cat > /tmp/pointer-array.c <<'EOF'
          int main(void) {
              char (*zero)[0] = 0;
              char (*fixed)[4] = 0;
              char (**nested)[8] = 0;
              int (*fn)(void) = 0;
              return zero == 0 && fixed == 0 && nested == 0 && fn == 0 ? 0 : 1;
          }
          EOF
          build/convergence/bin/minic -S /tmp/pointer-array.c -o /tmp/pointer-array.s
          test -s /tmp/pointer-array.s
          printf '%s\n' 'PASS parenthesized-pointer-declarators pointer-to-array zero+fixed+nested function-pointer-preserved'
      - name: Recheck prior convergence slices
        run: |
          set -Eeuo pipefail
          cat > /tmp/regression.c <<'EOF'
          struct key { unsigned long value; };
          static unsigned long braced = { 0 };
          static int zero(void) { return 0; }
          static int one(void) { return 1; }
          static int (*actions[])(void) = { zero, one };
          int f(void) {
              static __attribute__((section(".minic.prefix"))) char msg[64];
              static __attribute__((unused)) struct key k;
              return actions[1]() + (int)braced + (int)msg[0] + (int)k.value;
          }
          EOF
          build/convergence/bin/minic -S /tmp/regression.c -o /tmp/regression.s
          grep -F '.minic.prefix' /tmp/regression.s >/dev/null
      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
      - name: Probe unchanged do_mounts.i
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/do-mounts" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=2 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/do-mounts/batch-summary.txt
          cat build/do-mounts/minic-stderr/init/do_mounts.i.stderr || true
          input=build/do-mounts/kbuild/init/do_mounts.i
          if test -f "$input"; then
            frontier=$(sed -n 's/.*do_mounts\.i:\([0-9][0-9]*\):.*/\1/p' build/do-mounts/minic-stderr/init/do_mounts.i.stderr | head -n 1)
            if test -n "$frontier"; then
              start=$((frontier > 30 ? frontier - 30 : 1)); end=$((frontier + 30));
              nl -ba "$input" | sed -n "${start},${end}p"
            fi
          fi
          echo "DO_MOUNTS_PROBE_STATUS=$status"
      - name: Probe fixed Linux first100
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/convergence/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/first100" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/first100/batch-summary.txt
          echo "FIRST100_STATUS=$status"
          test "$status" -eq 0 || test "$status" -eq 1
