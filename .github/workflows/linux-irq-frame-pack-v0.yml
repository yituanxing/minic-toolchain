name: Linux IRQ Frame Pack V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-irq-frame-pack-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  irq-frame-pack:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-irq-frame-pack-v0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore known-good Linux object cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update >/dev/null
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3 >/dev/null

      - name: Build MiniC with packed Core value slots
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          ev="$GITHUB_WORKSPACE/build/linux-irq-frame-pack-v0/evidence"
          mkdir -p "$ev"
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-asm-rk-early-v0.py
            apply-inline-asm-rk-early-hotfix-v0.py
            apply-inline-asm-rk-tail-rollback-v0.py
            apply-inline-asm-rk-cast-tail-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
            apply-riscv64-core-value-slot-pack-v0.py
          )
          start=$(date +%s%N)
          for p in "${patches[@]}"; do python3 "tools/ci/$p" >>"$ev/patch.log"; done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$work/toolchain" \
            "$work/toolchain/bin/minic" "$work/toolchain/bin/minic-cc" >/dev/null
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING toolchain_ms={(b-a)//1_000_000}")
          PY

      - name: Prepare pinned Linux source and baseline disassembly
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          archive="$work/linux-6.6.143.tar.xz"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-irq-frame-pack-v0/evidence"
          test -s "$out/.config"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          rm -rf "$src" && tar -xJf "$archive" -C "$work"
          for obj in arch/riscv/kernel/traps.o kernel/softirq.o kernel/locking/spinlock.o; do
            test -s "$out/$obj"
            tag=${obj//\//_}; tag=${tag%.o}
            riscv64-linux-gnu-objdump -dr "$out/$obj" >"$ev/baseline-${tag}.disasm.txt"
          done

      - name: Rebuild focused IRQ path objects through packed MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-irq-frame-pack-v0/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          targets=(arch/riscv/kernel/traps.o kernel/softirq.o kernel/locking/spinlock.o)
          for obj in "${targets[@]}"; do
            rm -f "$out/$obj" "$out/$(dirname "$obj")/.$(basename "$obj" .o).o.cmd"
          done
          stamp="$ev/rebuild-start.stamp"
          touch "$stamp"
          start=$(date +%s%N)
          MINIC="$work/toolchain/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/refresh.trace" \
          MINIC_CORE_FRAME_TRACE=1 CORE_FAST_TRACE=1 MINIC_LOCAL_FACT_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j3 V=1 "${targets[@]}" >"$ev/refresh.log" 2>&1
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY' | tee -a "$ev/timing.txt"
          import sys
          a,b=map(int,sys.argv[1:])
          print(f"TIMING irq_refresh_ms={(b-a)//1_000_000}")
          PY
          for obj in "${targets[@]}"; do
            tag=${obj//\//_}; tag=${tag%.o}
            riscv64-linux-gnu-objdump -dr "$out/$obj" >"$ev/packed-${tag}.disasm.txt"
          done
          find "$out" -type f -name '*.minic.stderr' -newer "$stamp" -print0 \
            | xargs -0 -r cat >"$ev/minic-frame-trace.txt"
          grep -E 'CORE_FRAME function=(do_irq|handle_riscv_irq|irq_enter_rcu|arch_spin_lock|do_raw_spin_lock)' \
            "$ev/minic-frame-trace.txt" | tee "$ev/irq-core-frames.txt" || true

      - name: Compare focused function stack frames
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-irq-frame-pack-v0/evidence"
          python3 - "$ev" <<'PY' | tee "$ev/frame-compare.txt"
          import re, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          wanted=['do_irq','handle_riscv_irq','irq_enter_rcu','arch_spin_lock','do_raw_spin_lock']
          def scan(path):
              lines=path.read_text(errors='replace').splitlines()
              out={}
              cur=None
              for line in lines:
                  m=re.search(r'<([^>]+)>:$', line.strip())
                  if m:
                      cur=m.group(1)
                      continue
                  if cur in wanted and cur not in out:
                      m=re.search(r'\baddi\s+sp,sp,-([0-9]+)', line)
                      if m:
                          out[cur]=int(m.group(1))
              return out
          for phase in ('baseline','packed'):
              merged={}
              for p in sorted(root.glob(f'{phase}-*.disasm.txt')):
                  merged.update(scan(p))
              for name in wanted:
                  if name in merged:
                      print(f'FRAME phase={phase} function={name} bytes={merged[name]}')
          packed={}
          base={}
          for p in sorted(root.glob('baseline-*.disasm.txt')): base.update(scan(p))
          for p in sorted(root.glob('packed-*.disasm.txt')): packed.update(scan(p))
          for name in wanted:
              if name in base and name in packed:
                  delta=packed[name]-base[name]
                  pct=(100.0*(base[name]-packed[name])/base[name]) if base[name] else 0.0
                  print(f'FRAME_DELTA function={name} before={base[name]} after={packed[name]} delta={delta} shrink_pct={pct:.2f}')
          if not any(name in packed for name in ('do_irq','handle_riscv_irq','irq_enter_rcu')):
              raise SystemExit('focused IRQ functions not found in packed disassembly')
          PY

      - name: Preserve IRQ frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-irq-frame-pack-v0
          path: build/linux-irq-frame-pack-v0/evidence/
          if-no-files-found: ignore
          retention-days: 5
