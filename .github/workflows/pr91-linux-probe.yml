name: PR91 Linux Probe
on:
  push:
    branches: [agent/packed-record-field-v0]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/packed-record-field-v0, fetch-depth: 0}
      - uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
      - run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/linux-compiler
          MINIC="$GITHUB_WORKSPACE/build/linux-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused" HOST_CC=cc sh tests/compiler/c0/run-gnu-packed-record-field.sh
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - id: linux
        continue-on-error: true
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/linux-compiler/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/linux-discovery" LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" CROSS_COMPILE=riscv64-linux-gnu- sh tests/external/linux/probe.sh
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - if: always()
        run: |
          work="$GITHUB_WORKSPACE/build/linux-discovery"
          if test -s "$work/minic.stderr"; then
            line=$(sed -n 's/.*init\/main\.i:\([0-9][0-9]*\):.*/\1/p' "$work/minic.stderr" | head -n1)
            echo "frontier_line=${line:-unknown}"
            sed -n '1,20p' "$work/minic.stderr"
            test -z "${line:-}" || nl -ba "$work/kbuild/init/main.i" | sed -n "$((line>8?line-8:1)),$((line+8))p"
          else
            echo 'No MiniC diagnostic; main.i may have passed.'
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr91-linux-${{ github.run_id }}
          path: |
            build/linux-discovery/minic.stderr
            build/linux-discovery/kbuild/init/main.i
          if-no-files-found: ignore
          retention-days: 3
      - if: always()
        run: |
          git rm .github/workflows/pr91-linux-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'cleanup: remove PR91 Linux probe'
          git push origin HEAD:agent/packed-record-field-v0
      - if: always()
        run: test "${{ steps.linux.outputs.status }}" -eq 0
