name: Publish External Array Declarator Routing

on:
  push:
    branches:
      - frontend/external-array-declarator-routing

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage product patch
        run: |
          sed -i 's/run-external-tentative-definitions\.sh/run-gnu-visible-extern-arrays.sh/' tools/dev/publish_external_array_declarator_routing.py
          python3 tools/dev/publish_external_array_declarator_routing.py

      - name: Canonical format
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends clang-format-18 >/dev/null
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/external_array_declarator_routing.c
          chmod +x tests/compiler/c0/run-external-array-declarator-routing.sh
          rm .github/workflows/publish-external-array-declarator-routing.yml
          rm tools/dev/publish_external_array_declarator_routing.py
          git diff --check

      - name: Sanitizer focused regression
        run: |
          make -j4 MODE=sanitize BUILD_DIR=build/external-array-routing-sanitize
          MINIC="$GITHUB_WORKSPACE/build/external-array-routing-sanitize/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/external-array-routing-sanitize" sh tests/compiler/c0/run-external-array-declarator-routing.sh

      - name: Foundation regression
        run: |
          make -j4 MODE=release BUILD_DIR=build/external-array-routing-release
          MINIC="$GITHUB_WORKSPACE/build/external-array-routing-release/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/external-array-routing-release" sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish product-only patch
        run: |
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: route complete external arrays through generic objects' -m 'Materialize complete array declarator suffixes before classifying file-scope external-linkage objects, consume post-declarator GNU object attributes, and route complete arrays through the generic tentative/definition owners. Generic external definitions reuse the shared static-storage initializer. Incomplete top-level array definitions remain on the bounded legacy inference path until initializer semantics owns inferred aggregate shape.' -m '中文说明：文件作用域 external-linkage 对象先完整物化 array declarator suffix，再解析 declarator 后 GNU object attributes，并将完整数组统一路由到 generic tentative/definition owner；完整数组定义复用 shared static-storage initializer。需要从 initializer 推断 bound 的 incomplete top-level array definition 暂时保留在受限旧路径。'
          git push origin HEAD:frontend/external-array-declarator-routing
