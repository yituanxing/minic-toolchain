name: Staging RV64 Argument Register Clobbers

on:
  push:
    branches:
      - staging/rv64-argument-clobbers-v1

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TargetConstraint v1 clobbers
        run: python3 tools/dev/staging-rv64-argument-clobbers.py

      - name: Canonical formatting
        run: clang-format -i src/target/target_info.c

      - name: Release build
        run: make -j4 MODE=release BUILD_DIR=build/staging-rv64-argument-clobbers

      - name: Focused GNU inline asm operands
        env:
          MINIC: ${{ github.workspace }}/build/staging-rv64-argument-clobbers/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/staging-rv64-argument-clobbers
        run: sh tests/compiler/c0/run-gnu-inline-asm-operands.sh

      - name: Broad C0 suite
        env:
          MINIC: ${{ github.workspace }}/build/staging-rv64-argument-clobbers/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/staging-rv64-argument-clobbers
        run: sh tests/compiler/c0/run.sh

      - name: Foundation focused suite
        env:
          MINIC: ${{ github.workspace }}/build/staging-rv64-argument-clobbers/bin/minic
          BUILD_DIR: ${{ github.workspace }}/build/staging-rv64-argument-clobbers
        run: sh tests/compiler/c0/run-foundation-focused.sh

      - name: Publish validated product diff
        run: |
          set -eu
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add src/target/target_info.c tests/compiler/c0/run-gnu-inline-asm-operands.sh
          git rm tools/dev/staging-rv64-argument-clobbers.py .github/workflows/staging-rv64-argument-clobbers.yml
          git commit -m 'target: accept RV64 argument-register asm clobbers [publish]'
          git push origin HEAD:staging/rv64-argument-clobbers-v1
