name: Core M39 Const Local Diagnostic

on:
  pull_request:

jobs:
  diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Build staged candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m39
      - name: Local scalar matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m39/bin/minic"; w=build/m39-shapes; mkdir -p "$w"
          cat > "$w/inline.c" <<'EOF'
          unsigned long f(const unsigned long *map, unsigned long start) { return (map[start / 64UL] >> (start % 64UL)) & 0xffUL; }
          EOF
          cat > "$w/const_index.c" <<'EOF'
          unsigned long f(const unsigned long *map, unsigned long start) { const unsigned long index = start / 64UL; return map[index]; }
          EOF
          cat > "$w/const_offset.c" <<'EOF'
          unsigned long f(unsigned long x, unsigned long start) { const unsigned long offset = start % 64UL; return x >> offset; }
          EOF
          cat > "$w/const_two_nosub.c" <<'EOF'
          unsigned long f(unsigned long x, unsigned long start) { const unsigned long index = start / 64UL; const unsigned long offset = start % 64UL; return (x + index) >> offset; }
          EOF
          cat > "$w/nonconst_two.c" <<'EOF'
          unsigned long f(const unsigned long *map, unsigned long start) { unsigned long index = start / 64UL; unsigned long offset = start % 64UL; return (map[index] >> offset) & 0xffUL; }
          EOF
          cat > "$w/const_literal.c" <<'EOF'
          unsigned long f(unsigned long x) { const unsigned long n = 3UL; return x >> n; }
          EOF
          cat > "$w/const_copy.c" <<'EOF'
          unsigned long f(unsigned long x) { const unsigned long n = x; return n; }
          EOF
          for src in "$w"/*.c; do
            name=$(basename "$src" .c)
            set +e
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$name.s" 2>"$w/$name.err"
            rc=$?
            set -e
            printf 'M39_SHAPE name=%s rc=%d\n' "$name" "$rc"
            cat "$w/$name.err"
          done
