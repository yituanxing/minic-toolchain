name: Linux Expanded Kbuild V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-expanded-kbuild-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore Linux Kbuild frontier cache
        id: kbuild-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'tools/ci/apply-*.py', 'tests/external/linux/stage2_kbuild_cc.sh') }}
          restore-keys: |
            linux-expanded-kbuild-v0-6.6.143-${{ runner.os }}-

      - name: Install RV64 Linux prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Apply MiniC Linux semantic stack and build
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          build="$work/toolchain"
          mkdir -p "$work/evidence"
          start=$(date +%s)
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
          )
          for patch in "${patches[@]}"; do
            python3 "tools/ci/$patch" | tee -a "$work/evidence/patch.log"
          done
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" \
            "$build/bin/minic" "$build/bin/minic-cc"
          test -x "$build/bin/minic"
          test -x "$build/bin/minic-cc"
          elapsed=$(($(date +%s) - start))
          echo "TIMING toolchain_s=$elapsed" | tee -a "$work/evidence/timing.txt"
          echo "LINUX_EXPANDED_TOOLCHAIN=PASS head=${GITHUB_SHA}"

      - name: Prepare pinned Linux 6.6.143
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence"
          mkdir -p "$ev"
          cache_hit="${{ steps.kbuild-cache.outputs.cache-hit }}"
          cache_key="${{ steps.kbuild-cache.outputs.cache-matched-key }}"
          printf 'KBUILD_CACHE_HIT=%s\nKBUILD_CACHE_MATCHED_KEY=%s\n' \
            "${cache_hit:-false}" "${cache_key:-none}" | tee "$ev/cache.txt"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' \
            dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          if test -s "$out/.config" && test -s "$out/include/config/auto.conf" && \
             test -s "$out/include/generated/autoconf.h"; then
            echo "LINUX_EXPANDED_CACHE_RESTORE=PASS"
          else
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
            "$src/scripts/config" --file "$out/.config" \
              -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
              -e SERIAL_8250 -e SERIAL_8250_CONSOLE
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare
          fi
          sha256sum "$out/.config" >"$ev/config.sha256"

      - name: Refresh only cached objects with bad explicit sections
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          python3 tools/ci/scan-linux-nonalloc-explicit-sections-v0.py "$out" \
            >"$ev/section-refresh-targets.txt" 2>"$ev/section-refresh-detail.txt"
          count=$(grep -c . "$ev/section-refresh-targets.txt" || true)
          echo "LINUX_SECTION_REFRESH_TARGETS=$count" | tee "$ev/section-refresh-summary.txt"
          head -n 200 "$ev/section-refresh-detail.txt" || true
          if test "$count" -gt 0; then
            mapfile -t targets <"$ev/section-refresh-targets.txt"
            for target in "${targets[@]}"; do rm -f "$out/$target"; done
            MINIC="$work/toolchain/bin/minic" \
            REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
            MINIC_KEEP_INTERMEDIATES=0 \
            MINIC_KBUILD_TRACE="$ev/section-refresh.trace" \
            CORE_FAST_TRACE=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
                CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/section-refresh.log" 2>&1
          fi
          python3 tools/ci/scan-linux-nonalloc-explicit-sections-v0.py "$out" \
            --verify --targets-file "$ev/section-refresh-targets.txt"

      - name: Refresh cached final-link failure pool
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          targets=(
            arch/riscv/mm/init.o
            arch/riscv/mm/fault.o
            kernel/ptrace.o
            kernel/sched/fair.o
            kernel/dma/direct.o
            kernel/dma/pool.o
            kernel/bpf/verifier.o
            kernel/jump_label.o
            mm/swap.o
            mm/truncate.o
            mm/shmem.o
            mm/vmstat.o
            mm/percpu.o
            mm/slab_common.o
            mm/gup.o
            mm/memory.o
            mm/mprotect.o
            mm/mremap.o
            mm/page_vma_mapped.o
            mm/rmap.o
            mm/vmalloc.o
            mm/page_alloc.o
            mm/madvise.o
            mm/memcontrol.o
            mm/memfd.o
            fs/remap_range.o
            fs/proc/task_mmu.o
            fs/ext4/inode.o
            fs/hugetlbfs/inode.o
            crypto/skcipher.o
            crypto/rsa-pkcs1pad.o
            block/bio.o
            block/blk-core.o
            block/blk-map.o
            block/blk-merge.o
            block/blk-mq.o
            drivers/acpi/scan.o
            drivers/nvdimm/bus.o
            drivers/nvdimm/region_devs.o
            drivers/nvdimm/namespace_devs.o
            drivers/nvdimm/claim.o
            drivers/nvdimm/pmem.o
            drivers/spi/spi.o
            drivers/net/phy/phy_device.o
            net/core/sock.o
            net/core/skbuff.o
            net/core/filter.o
            net/core/bpf_sk_storage.o
            net/sched/cls_api.o
            net/ipv4/ip_forward.o
            net/ipv4/ip_sockglue.o
            net/ipv4/tcp.o
            net/ipv4/tcp_input.o
            net/ipv4/raw.o
            net/ipv4/arp.o
            net/ipv4/xfrm4_input.o
            net/ipv4/xfrm4_output.o
            net/ipv4/af_inet.o
            net/xfrm/xfrm_output.o
            net/xfrm/xfrm_state.o
            net/ipv6/ip6_output.o
            net/ipv6/ndisc.o
            net/ipv6/raw.o
            net/ipv6/mcast.o
            net/ipv6/xfrm6_input.o
            net/ipv6/xfrm6_output.o
            net/ipv6/addrconf.o
            net/ipv6/route.o
            net/ipv6/ipv6_sockglue.o
            net/ipv6/icmp.o
            net/ipv6/tcp_ipv6.o
            net/ipv6/datagram.o
            lib/maple_tree.o
          )
          echo "LINUX_UNDEF_REFRESH_TARGETS=${#targets[@]}" | tee "$ev/undef-refresh-summary.txt"
          if test "${{ steps.kbuild-cache.outputs.cache-hit }}" = "true"; then
            echo "LINUX_UNDEF_REFRESH=SKIP_EXACT_MIXED_CACHE" | tee -a "$ev/undef-refresh-summary.txt"
          else
            start=$(date +%s)
            for target in "${targets[@]}"; do rm -f "$out/$target"; done
            MINIC="$work/toolchain/bin/minic" \
            REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
            MINIC_KEEP_INTERMEDIATES=0 \
            MINIC_KBUILD_TRACE="$ev/undef-refresh.trace" \
            CORE_FAST_TRACE=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
                CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/undef-refresh.log" 2>&1
            elapsed=$(($(date +%s) - start))
            echo "TIMING undef_refresh_s=$elapsed" | tee -a "$ev/timing.txt"
            echo "LINUX_UNDEF_REFRESH=PASS" | tee -a "$ev/undef-refresh-summary.txt"
          fi

      - name: Build Linux Image through MiniC until next frontier
        id: frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          trace="$ev/minic-kbuild.trace"
          : >"$trace"
          start=$(date +%s)
          set +e
          MINIC="$work/toolchain/bin/minic" \
          REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=0 \
          MINIC_KBUILD_TRACE="$trace" \
          CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j4 V=1 Image >"$ev/kbuild.log" 2>&1
          rc=$?
          set -e
          elapsed=$(($(date +%s) - start))
          echo "TIMING image_frontier_s=$elapsed rc=$rc" | tee -a "$ev/timing.txt"
          attempts=$(grep -c '^minic ' "$trace" || true)
          passes=$(grep -c '^pass ' "$trace" || true)
          delegates=$(grep -c '^delegate ' "$trace" || true)
          blockers=$(grep -a -c 'MINIC_KBUILD_BLOCKER' "$ev/kbuild.log" || true)
          orphan_text=$(grep -a -c 'orphan section.*\.text\.' "$ev/kbuild.log" || true)
          nonalloc=$(grep -a -c 'unexpected non-allocatable section' "$ev/kbuild.log" || true)
          bfd_asserts=$(grep -a -c 'elfnn-riscv.c:.*Assertion' "$ev/kbuild.log" || true)
          read undefined_refs undefined_unique < <(python3 - "$ev/kbuild.log" <<'PY'
import re
import sys
text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
names = re.findall(r"undefined reference to [`'‘]([^'’`]+)", text)
print(len(names), len(set(names)))
PY
          )
          printf 'LINUX_EXPANDED_FRONTIER rc=%s minic_attempts=%s passes=%s delegates=%s blockers=%s orphan_text=%s nonalloc=%s bfd_asserts=%s undefined_refs=%s undefined_unique=%s\n' \
            "$rc" "$attempts" "$passes" "$delegates" "$blockers" "$orphan_text" "$nonalloc" "$bfd_asserts" "$undefined_refs" "$undefined_unique" | tee "$ev/summary.txt"
          cat "$ev/cache.txt" >>"$ev/summary.txt" || true
          cat "$ev/section-refresh-summary.txt" >>"$ev/summary.txt" || true
          cat "$ev/undef-refresh-summary.txt" >>"$ev/summary.txt" || true
          grep -a -E 'riscv64-linux-gnu-ld|orphan section|unexpected non-allocatable section|elfnn-riscv.c:.*Assertion|Segmentation fault|undefined reference|modpost:' \
            "$ev/kbuild.log" | tail -n 1200 >"$ev/link-frontier.log" || true
          tail -n 300 "$ev/kbuild.log" >"$ev/kbuild-tail.log" || true
          if test "$rc" -eq 0; then
            test -s "$out/arch/riscv/boot/Image"
            printf 'LINUX_EXPANDED_IMAGE=PASS image_bytes=%s\n' "$(stat -c %s "$out/arch/riscv/boot/Image")" | tee -a "$ev/summary.txt"
          fi
          exit "$rc"

      - name: Save mixed Linux frontier cache
        if: always() && steps.prepare.outcome == 'success' && steps.kbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'tools/ci/apply-*.py', 'tests/external/linux/stage2_kbuild_cc.sh') }}

      - name: Preserve expanded frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-expanded-kbuild-v0
          path: build/linux-expanded-kbuild-v0/evidence/
          if-no-files-found: ignore
          retention-days: 7
