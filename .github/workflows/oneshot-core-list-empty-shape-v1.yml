name: One-shot Core list_empty Shape Probe

on:
  pull_request:

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-list-empty-probe-compiler
      - name: Probe list_empty layers
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-list-empty-probe-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-list-empty-probe"
          mkdir -p "$work"

          cat >"$work/a-direct.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_direct(const struct node *head) {
              return head->next == head;
          }
          EOF

          cat >"$work/b-volatile-deref.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_volatile_deref(const struct node *head) {
              return (*(struct node * const volatile *)&(head->next)) == head;
          }
          EOF

          cat >"$work/c-statement-expression.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_statement_expression(const struct node *head) {
              return ({ head->next; }) == head;
          }
          EOF

          cat >"$work/d-read-once-shape.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_read_once_shape(const struct node *head) {
              return ({ (*(struct node * const volatile *)&(head->next)); }) == head;
          }
          EOF

          cat >"$work/e-read-once-local.i" <<'EOF'
          struct node { struct node *next; struct node *prev; };
          int probe_read_once_local(const struct node *head) {
              struct node *value = (*(struct node * const volatile *)&(head->next));
              return value == head;
          }
          EOF

          for input in "$work"/*.i; do
            name=$(basename "$input" .i)
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name.s" \
              >"$work/$name.out" 2>"$work/$name.err"
            rc=$?
            set -e
            printf 'CORE_LIST_EMPTY_SHAPE name=%s rc=%d\n' "$name" "$rc"
            sed 's/^/CORE_LIST_EMPTY_DIAG /' "$work/$name.err"
          done
          test -s "$work/a-direct.s"
          printf '%s\n' 'PASS core/list-empty-shape probe-complete'
