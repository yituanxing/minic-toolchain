name: One-shot Core Global Scalar Memory

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Apply Core M5a slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/dev/patch-core-global-scalar-memory-v1.py
          python3 tools/dev/patch-core-global-scalar-memory-v1.py
          clang-format-18 -i \
            src/core/core_ir.h \
            src/core/core_ir.c \
            src/core/core_lower.c \
            src/target/riscv64/core_codegen.c \
            tests/compiler/c0/core_global_scalar_memory.c \
            tests/compiler/c0/core_global_scalar_memory_runtime.c
          sh -n tests/compiler/c0/run-core-global-scalar-memory.sh
          bash -n .github/scripts/compiler-c0-full-gate.sh
          git diff --check

      - name: Build exact compiler
        shell: bash
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m5a-compiler

      - name: Validate Core global scalar memory
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-m5a-compiler/bin/minic"
          MINIC="$compiler" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/core-m5a-focused" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/compiler/c0/run-core-global-scalar-memory.sh

          MINIC="$compiler" BUILD_DIR="$GITHUB_WORKSPACE/build/core-shadow-m5a" \
            bash tests/core/run-core-ir-shadow.sh

          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S \
            tests/target/riscv64/core_hybrid_differential.i \
            -o build/core-m5a-focused/hybrid.s
          grep -q '^\.Lcore_hybrid_fallback_load_core_bb0:' build/core-m5a-focused/hybrid.s
          grep -q '^\.Lcore_hybrid_fallback_indirect_return:' build/core-m5a-focused/hybrid.s
          if grep -q '^\.Lcore_hybrid_fallback_indirect_core_bb' build/core-m5a-focused/hybrid.s; then
            printf '%s\n' 'indirect-call sentinel unexpectedly became Core-owned' >&2
            exit 1
          fi
          printf '%s\n' 'PASS core/m5a-global-scalar-memory'

      - name: Publish Core M5a slice
        shell: bash
        run: |
          set -Eeuo pipefail
          rm tools/dev/patch-core-global-scalar-memory-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/core/core_ir.h \
            src/core/core_ir.c \
            src/core/core_lower.c \
            src/target/riscv64/core_codegen.c \
            tests/compiler/c0/core_global_scalar_memory.c \
            tests/compiler/c0/core_global_scalar_memory_runtime.c \
            tests/compiler/c0/run-core-global-scalar-memory.sh \
            .github/scripts/compiler-c0-full-gate.sh \
            tools/dev/patch-core-global-scalar-memory-v1.py
          git diff --cached --check
          git commit -m 'core: add global scalar memory references'
          git push origin HEAD:refactor/declaration-sema-v1
