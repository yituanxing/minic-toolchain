name: Core M126A Error Diagnostic

on:
  pull_request:

jobs:
  traps-error:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M126A plus transactional fix and diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m126a-generic-structured-asm.py
          python3 tools/ci/apply-m126a-transactional-lowering.py
          python3 tools/ci/apply-m126a-error-diagnostic.py
          python3 tools/ci/apply-m126a-verifier-diagnostic.py
          git diff --check

      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m126a-error-compiler

      - name: Replay traps TU
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m126a-error-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m126a-error-traps"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 1 \
            --indices '27'
          status=$?
          set -e
          printf 'M126A_TRAPS_REPLAY_STATUS=%d\n' "$status"
          echo '--- traps stderr ---'
          cat "$work/minic-stderr/arch/riscv/kernel/traps.i.stderr" || true
          echo '--- batch result ---'
          cat "$work/batch-results.json"
          echo '--- preprocessed context 59855-59880 ---'
          sed -n '59855,59880p' "$GITHUB_WORKSPACE/build/linux-focus-corpus/kbuild/arch/riscv/kernel/traps.i" \
            | tee "$work/m126a-source-context.txt"

      - name: Persist diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m126a-error-diagnostic-${{ github.sha }}
          path: |
            build/m126a-error-traps/batch-results.json
            build/m126a-error-traps/m126a-source-context.txt
            build/m126a-error-traps/minic-stderr/**
          if-no-files-found: warn
