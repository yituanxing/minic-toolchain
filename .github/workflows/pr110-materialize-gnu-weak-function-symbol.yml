name: PR110 Materialize GNU Weak Function Symbol
on:
  push:
    branches: [agent/gnu-weak-function-symbol-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/gnu-weak-function-symbol-v0, fetch-depth: 0}
      - name: Materialize weak function symbol semantics
        run: |
          python3 tools/dev/pr110-fix-materializer-anchor.py
          python3 tools/dev/pr110-fix-prefix-call-anchors.py
          python3 tools/dev/pr110-fix-definition-metadata-anchor.py
          python3 tools/dev/pr110-materialize-gnu-weak-function-symbol.py
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/focused-weak-function" HOST_CC=cc sh tests/compiler/c0/run-gnu-weak-function-symbol.sh
          make check
      - name: Commit product source
        run: |
          git rm .github/workflows/pr110-materialize-gnu-weak-function-symbol.yml tools/dev/pr110-materialize-gnu-weak-function-symbol.py tools/dev/pr110-fix-materializer-anchor.py tools/dev/pr110-fix-prefix-call-anchors.py tools/dev/pr110-fix-definition-metadata-anchor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'frontend: model GNU weak function symbols'
          git push origin HEAD:agent/gnu-weak-function-symbol-v0
