name: PR71 Materialize

on:
  push:
    branches:
      - frontend/additive-update-pointer-difference

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply conditional expression patch
        run: python3 tools/dev/apply-pr71-conditional.py

      - name: Format generated sources
        run: |
          clang-format-18 -i \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/frontend/cast_normalization.c \
            src/target/riscv64/codegen_expression.c

      - name: Host validation
        run: make -j2 BUILD_DIR=build/pr71-materialize check

      - name: Commit generated sources
        env:
          BRANCH: frontend/additive-update-pointer-difference
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/frontend/parser_expression.c \
            src/frontend/ast_verifier.c \
            src/frontend/cast_normalization.c \
            src/target/riscv64/codegen_expression.c
          git rm tools/dev/apply-pr71-conditional.py .github/workflows/pr71-synthesize.yml
          git commit -m 'frontend: finish conditional expressions'
          git push origin HEAD:"$BRANCH"
