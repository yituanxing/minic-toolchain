name: Apply RV64 long codegen

on:
  pull_request:
    paths:
      - '.github/workflows/apply-rv64-long-codegen.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
          fetch-depth: 0
      - name: Extend cast type recognition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/frontend/parser_expression.c')
          text = path.read_text()
          old = '''    case MINIC_TOKEN_KW_CONST:
    case MINIC_TOKEN_KW_INT:
    case MINIC_TOKEN_KW_UNSIGNED:'''
          new = '''    case MINIC_TOKEN_KW_CONST:
    case MINIC_TOKEN_KW_INT:
    case MINIC_TOKEN_KW_LONG:
    case MINIC_TOKEN_KW_SIGNED:
    case MINIC_TOKEN_KW_UNSIGNED:'''
          if text.count(old) != 1:
              raise SystemExit(f'cast type start marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/diagnose-rv64-long-program.yml
      - name: Apply and verify RV64 long codegen
        run: bash .github/scripts/apply-rv64-long-codegen.sh
