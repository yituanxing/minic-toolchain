name: One-shot Core M20 Runtime Diagnostic

on:
  pull_request:

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Install tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Apply M20 candidate and build
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/patch-core-for-postincrement-m20.py
          clang-format-18 -i src/core/core_lower.c tests/compiler/c0/core_for_postincrement_m20.c tests/compiler/c0/core_for_postincrement_m20_runtime.c
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-m20-runtime-diag
      - name: Diagnose focused pipeline
        shell: bash
        run: |
          set -u
          compiler="$GITHUB_WORKSPACE/build/core-m20-runtime-diag/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-m20-runtime-diag-run"
          source_file="$GITHUB_WORKSPACE/tests/compiler/c0/core_for_postincrement_m20.c"
          runtime_file="$GITHUB_WORKSPACE/tests/compiler/c0/core_for_postincrement_m20_runtime.c"
          mkdir -p "$work"

          run_step() {
            name="$1"; shift
            echo "=== M20_DIAG $name ==="
            set +e
            "$@" >"$work/$name.out" 2>"$work/$name.err"
            rc=$?
            set -e
            echo "M20_DIAG_RESULT name=$name rc=$rc"
            echo "--- stdout ---"; cat "$work/$name.out" || true
            echo "--- stderr ---"; cat "$work/$name.err" || true
            return 0
          }

          run_step preprocess cc -E -P -std=gnu11 "$source_file" -o "$work/input.i"
          echo '=== input ==='; cat "$work/input.i"

          echo '=== M20_DIAG strict ==='
          set +e
          MINIC_CORE_IR=strict "$compiler" -S "$work/input.i" -o "$work/strict.s" >"$work/strict.out" 2>"$work/strict.err"
          strict_rc=$?
          set -e
          echo "M20_DIAG_RESULT name=strict rc=$strict_rc"; cat "$work/strict.out"; cat "$work/strict.err"

          echo '=== M20_DIAG core_codegen ==='
          set +e
          MINIC_CORE_CODEGEN=basic-v0 "$compiler" -S "$work/input.i" -o "$work/core.s" >"$work/core_codegen.out" 2>"$work/core_codegen.err"
          core_rc=$?
          set -e
          echo "M20_DIAG_RESULT name=core_codegen rc=$core_rc"; cat "$work/core_codegen.out"; cat "$work/core_codegen.err"
          if [ -f "$work/core.s" ]; then
            echo '=== core assembly symbols ==='
            grep -nE 'core_m20_(for_assign|postincrement|list_count_nodes)' "$work/core.s" || true
            echo '=== core assembly ==='
            cat "$work/core.s"
          fi

          if [ "$core_rc" -eq 0 ]; then
            run_step reference_link riscv64-linux-gnu-gcc -static -O2 "$source_file" "$runtime_file" -o "$work/reference-rv64"
            run_step minic_link riscv64-linux-gnu-gcc -static -O2 "$runtime_file" "$work/core.s" -o "$work/minic-rv64"
          fi
          if [ -x "$work/reference-rv64" ]; then
            run_step reference_qemu qemu-riscv64 "$work/reference-rv64"
          fi
          if [ -x "$work/minic-rv64" ]; then
            run_step minic_qemu qemu-riscv64 "$work/minic-rv64"
          fi
          if [ -f "$work/reference_qemu.out" ] && [ -f "$work/minic_qemu.out" ]; then
            echo '=== M20_DIAG compare ==='
            diff -u "$work/reference_qemu.out" "$work/minic_qemu.out" || true
          fi
