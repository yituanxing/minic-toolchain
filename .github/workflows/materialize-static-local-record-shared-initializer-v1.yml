name: Materialize static-local shared initializer

on:
  push:
    branches:
      - staging/static-local-record-shared-initializer-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/static-local-record-shared-initializer-v1
          fetch-depth: 0
      - name: Materialize product delta
        run: python3 tools/dev/materialize-static-local-record-shared-initializer-v1.py
      - name: Build and focused validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/materialize-static-local-record-shared-initializer
          MINIC="$GITHUB_WORKSPACE/build/materialize-static-local-record-shared-initializer/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/materialize-static-local-record-shared-initializer-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-static-local-record-initializers.sh
          MINIC="$GITHUB_WORKSPACE/build/materialize-static-local-record-shared-initializer/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/materialize-static-local-record-shared-initializer-aggregate-tests" \
            HOST_CC=cc \
            sh tests/compiler/c0/run-static-aggregate-initializers.sh
          make check-fast
          git diff --check
      - name: Commit materialized product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_statement.c \
                  tests/compiler/c0/static_local_record_initializer.c \
                  tests/compiler/c0/run-static-local-record-initializers.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: share static-local record initializer owner [materialized]'
          git push origin HEAD:staging/static-local-record-shared-initializer-v1
