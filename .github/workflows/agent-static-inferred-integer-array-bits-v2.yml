name: Agent Static Inferred Integer Array Bits V2

on:
  push:
    branches:
      - compiler/static-inferred-integer-array-bits-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-static-inferred-integer-array-bits-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: compiler/static-inferred-integer-array-bits-v2
          fetch-depth: 0

      - name: Materialize typed initializer consumer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent_static_inferred_integer_array_bits_v2_patch.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check

      - name: Build and run focused gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/static-inferred-integer-array-bits-v2
          MINIC="$GITHUB_WORKSPACE/build/static-inferred-integer-array-bits-v2/bin/minic" \
          HOST_CC=cc \
          BUILD_DIR="$GITHUB_WORKSPACE/build/static-inferred-integer-array-bits-v2-focused" \
            sh tests/compiler/c0/run-static-inferred-integer-array.sh
          make -j4 MODE=release BUILD_DIR=build/static-inferred-integer-array-bits-v2 check-fast

      - name: Publish generated product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/frontend/parser_global.c
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve typed static array initializer bits' \
            -m 'Route inferred static integer array elements through the existing target-aware integer initializer parser and uint64 initializer storage instead of the legacy host-int helper.'
          git push origin HEAD:compiler/static-inferred-integer-array-bits-v2
