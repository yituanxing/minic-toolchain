name: One-shot Atomic Extern Publish Primitive

on:
  push:
    branches:
      - refactor/declaration-sema-v1
  pull_request:

permissions:
  contents: write

jobs:
  wire:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'refactor/declaration-sema-v1')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Materialize atomic extern object publish primitive
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i 's/minic_type_const_int()/minic_type_int()/g' \
            tools/dev/one-shot-extern-publish-primitive.py
          python3 tools/dev/one-shot-extern-publish-primitive.py
          clang-format -i \
            src/frontend/ast.h \
            src/frontend/ast_global.c \
            tests/frontend/global_object_publish_test.c
          cc -std=c11 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror \
            -Iinclude -Isrc \
            src/frontend/ast.c \
            src/frontend/ast_global.c \
            src/frontend/type.c \
            tests/frontend/global_object_publish_test.c \
            -o /tmp/global-object-publish-test
          /tmp/global-object-publish-test
          rm \
            .github/workflows/one-shot-extern-publish-primitive.yml \
            tools/dev/one-shot-extern-publish-primitive.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "frontend: publish extern objects atomically"
          git push origin HEAD:refactor/declaration-sema-v1
