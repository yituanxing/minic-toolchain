name: MiniAS A0 Gate V1

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/ci-runtime-cleanup-v1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_CORPUS_EXPORT_RUN: "33186855250"
  FROZEN_SIDECARS_RUN: "33237304382"
  FROZEN_CONFIG_GZ_SHA256: "8511a666382dda596a9ddba313113f77182d3156fed890a2ea9f2e86223226ff"
  C149_EXPORT_RUN: "33248985705"

jobs:
  shard:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-gate-v1]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: first500
            artifact: frozen-linux-corpus-first500
            corpus_dir: linux-focus-corpus
            total: 500
          - label: new500
            artifact: frozen-linux-corpus-new500
            corpus_dir: linux-new500-corpus
            total: 500
          - label: next500
            artifact: frozen-linux-corpus-next500
            corpus_dir: linux-next500-corpus
            total: 500
          - label: next500b
            artifact: frozen-linux-corpus-next500b
            corpus_dir: linux-next500b-corpus
            total: 500
          - label: next500c
            artifact: frozen-linux-corpus-next500c
            corpus_dir: linux-next500c-corpus
            total: 500
          - label: next500d
            artifact: frozen-linux-corpus-next500d
            corpus_dir: linux-next500d-corpus
            total: 500
          - label: final352
            artifact: frozen-linux-corpus-final352
            corpus_dir: linux-final352-corpus
            total: 352
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download frozen Linux corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/import-${{ matrix.label }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen Linux corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          import="build/import-${{ matrix.label }}"
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (cd build && sha256sum -c "import-${{ matrix.label }}/files.sha256" >/dev/null)
          manifest="build/${{ matrix.corpus_dir }}/selected-tus.txt"
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq ${{ matrix.total }}
          echo "MINIAS_ALL3352_CORPUS label=${{ matrix.label }} selected=${{ matrix.total }} sha=$actual"

      - name: Restore frozen MiniAS Linux sidecars
        uses: actions/download-artifact@v4
        with:
          name: minias-linux-sidecars-v1
          path: build/import-minias-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_SIDECARS_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and install frozen incbin sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=build/import-minias-sidecars/kernel/config_data.gz
          test -s "$payload"
          actual=$(sha256sum "$payload" | cut -d' ' -f1)
          test "$actual" = "$FROZEN_CONFIG_GZ_SHA256"
          mkdir -p kernel
          cp "$payload" kernel/config_data.gz
          echo "MINIAS_ALL3352_SIDECAR=PASS sha256=$actual"

      - name: Build exact compiler and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-all3352-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-all3352-toolchain check-minias-a0

      - name: Generate exact assembly window
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/minias-all3352-toolchain/bin/minic-cc"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/minias-all3352-${{ matrix.label }}"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit ${{ matrix.total }} \
            --sample-count 0
          python3 - "$work/batch-results.json" ${{ matrix.total }} <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          expected=int(sys.argv[2])
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==expected and not bad, (len(rows), expected, bad[:5])
          print(f"MINIAS_ALL3352_INPUT=PASS generated={expected}")
          PY

      - name: Assemble exact window and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-all3352-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-all3352-${{ matrix.label }}/minic-out"
          out="$GITHUB_WORKSPACE/build/minias-all3352-${{ matrix.label }}/minias-out"
          expected=${{ matrix.total }}
          mkdir -p "$out"
          worker="$out/assemble-one.sh"
          cat >"$worker" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          minias=$1
          root=$2
          out=$3
          asm=$4
          rel="${asm#"$root"/}"
          stem="$out/${rel%.s}"
          obj="$stem.o"
          err="$stem.err"
          result="$stem.result"
          blocker="$stem.blocker"
          mkdir -p "$(dirname "$obj")"
          if "$minias" -o "$obj" "$asm" 2>"$err"; then
            readelf -h "$obj" | grep -q 'RISC-V'
            readelf -h "$obj" | grep -q 'REL (Relocatable file)'
            printf 'PASS\t%s\t-\n' "$rel" >"$result"
          else
            raw=$(head -n 1 "$err" || true)
            first=$(printf '%s\n' "$raw" | sed -E 's/^minic-as: //; s/:line=[0-9]+$//')
            if test -z "$first"; then first="internal:no-diagnostic"; fi
            printf '%s\n' "$first" >"$blocker"
            printf 'FAIL\t%s\t%s\n' "$rel" "$first" >"$result"
          fi
          SH
          chmod +x "$worker"

          mapfile -t files < <(find "$root" -type f -name '*.s' | LC_ALL=C sort)
          test "${#files[@]}" -eq "$expected"
          printf '%s\0' "${files[@]}" |
            xargs -0 -n1 -P"${MINIAS_ASSEMBLY_JOBS:-4}" "$worker" "$minias" "$root" "$out"

          mapfile -d '' -t results < <(find "$out" -type f -name '*.result' -print0 | LC_ALL=C sort -z)
          test "${#results[@]}" -eq "$expected"
          for f in "${results[@]}"; do cat "$f"; done | LC_ALL=C sort -t $'\t' -k2,2 >"$out/results.tsv"
          find "$out" -type f -name '*.blocker' -print0 | LC_ALL=C sort -z | xargs -0 -r cat >"$out/blockers.txt"

          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")
          printf 'MINIAS_ALL3352_SHARD label=%s pass=%s fail=%s total=%s\n' \
            "${{ matrix.label }}" "$pass" "$fail" "$expected"
          test $((pass + fail)) -eq "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: minias-all3352-${{ matrix.label }}
          path: |
            build/minias-all3352-${{ matrix.label }}/minias-out/results.tsv
            build/minias-all3352-${{ matrix.label }}/minias-out/blockers.txt
          retention-days: 30
          if-no-files-found: error

  all3352:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-gate-v1]'))
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - name: Require matrix completion
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.shard.result }}" = success

      - uses: actions/download-artifact@v4
        with:
          pattern: minias-all3352-*
          path: build/minias-all3352-results

      - name: Aggregate exact all3352
        shell: bash
        run: |
          set -Eeuo pipefail
          out=build/minias-all3352-aggregate
          mkdir -p "$out"
          mapfile -t results < <(find build/minias-all3352-results -type f -name results.tsv | LC_ALL=C sort)
          mapfile -t blockers < <(find build/minias-all3352-results -type f -name blockers.txt | LC_ALL=C sort)
          test "${#results[@]}" -eq 7
          for f in "${results[@]}"; do cat "$f"; done >"$out/results.tsv"
          : >"$out/blockers.txt"
          for f in "${blockers[@]}"; do cat "$f"; done >"$out/blockers.txt"
          test "$(wc -l < "$out/results.tsv")" -eq 3352

          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")
          error=$(awk -F '\t' '$1=="FAIL" && ($3 ~ /^internal:/ || $3 ~ /^out-of-memory:/) {n++} END {print n+0}' "$out/results.tsv")
          echo "MINIAS_ALL3352_EXACT head=$GITHUB_SHA selected=3352 pass=$pass fail=$fail error=$error"
          if test -s "$out/blockers.txt"; then
            echo "MINIAS_ALL3352_TOP_BLOCKERS"
            LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr | head -40
          fi
          test "$pass" -eq 3352
          test "$fail" -eq 0
          test "$error" -eq 0

  c149:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-gate-v1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen ground-truth C149 corpus
        uses: actions/download-artifact@v4
        with:
          name: minias-ground-truth-c149-corpus
          path: build/import-c149
          repository: ${{ github.repository }}
          run-id: ${{ env.C149_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and extract frozen C149 corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(cut -d' ' -f1 build/import-c149/minias-ground-truth-c149-corpus.tar.gz.sha256)
          actual=$(sha256sum build/import-c149/minias-ground-truth-c149-corpus.tar.gz | cut -d' ' -f1)
          test "$actual" = "$expected"
          cd build
          tar -xzf import-c149/minias-ground-truth-c149-corpus.tar.gz
          corpus="$GITHUB_WORKSPACE/build/minias-ground-truth-c149-corpus"
          test -s "$corpus/selected-tus.txt"
          test "$(grep -cve '^[[:space:]]*$' "$corpus/selected-tus.txt")" -eq 149
          (cd "$corpus" && sha256sum -c files.sha256 >/dev/null)
          echo "MINIAS_C149_CORPUS=PASS selected=149"

      - name: Build MiniC and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-c149-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-c149-toolchain check-minias-a0

      - name: Replay C149 through MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$GITHUB_WORKSPACE/build/minias-c149-toolchain/bin/minic-cc" \
            --corpus "$GITHUB_WORKSPACE/build/minias-ground-truth-c149-corpus" \
            --work "$GITHUB_WORKSPACE/build/minias-c149-replay" \
            --jobs 4 \
            --offset 0 \
            --limit 149 \
            --sample-count 0
          rc=$?
          set -e
          echo "MINIAS_C149_MINIC_REPLAY_RC=$rc"
          test -s build/minias-c149-replay/batch-results.json

      - name: Assemble MiniC outputs and build failure pool
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import json, re, subprocess

          root = Path.cwd()
          replay = root / "build/minias-c149-replay"
          minias = root / "build/minias-c149-toolchain/bin/minic-as"
          out = root / "build/minias-c149-results"
          out.mkdir(parents=True, exist_ok=True)

          rows = json.loads((replay / "batch-results.json").read_text())
          if len(rows) != 149:
              raise SystemExit(f"expected 149 MiniC replay rows, got {len(rows)}")

          results = []
          pool = []
          for row in rows:
              index = int(row["index"])
              rel_i = str(row["input"])
              source = str(row["source"])
              if row["status"] != "PASS":
                  blocker = str(row.get("message") or "compiler:no-diagnostic")
                  results.append(("COMPILE_FAIL", index, rel_i, source, blocker))
                  pool.append(("compiler", index, rel_i, source, blocker))
                  continue

              asm = replay / "minic-out" / f"{rel_i}.s"
              obj = out / f"{rel_i}.o"
              err = out / f"{rel_i}.err"
              obj.parent.mkdir(parents=True, exist_ok=True)
              err.parent.mkdir(parents=True, exist_ok=True)
              proc = subprocess.run(
                  [str(minias), "-o", str(obj), str(asm)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              err.write_text(proc.stderr)
              ok = False
              if proc.returncode == 0 and obj.is_file() and obj.stat().st_size:
                  check = subprocess.run(
                      ["readelf", "-h", str(obj)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      errors="replace",
                  )
                  ok = (
                      check.returncode == 0
                      and "RISC-V" in check.stdout
                      and "REL (Relocatable file)" in check.stdout
                  )
              if ok:
                  results.append(("PASS", index, rel_i, source, "-"))
              else:
                  raw = next(
                      (line.strip() for line in proc.stderr.splitlines() if line.strip()),
                      f"assembler:returncode={proc.returncode}",
                  )
                  blocker = re.sub(r"^minic-as:\\s*", "", raw)
                  blocker = re.sub(r":line=[0-9]+$", "", blocker)
                  results.append(("ASSEMBLE_FAIL", index, rel_i, source, blocker))
                  pool.append(("assembler", index, rel_i, source, blocker))

          results.sort(key=lambda row: row[1])
          pool.sort(key=lambda row: row[1])
          (out / "results.tsv").write_text(
              "".join(
                  f"{status}\t{index}\t{rel_i}\t{source}\t{blocker}\n"
                  for status, index, rel_i, source, blocker in results
              )
          )
          (out / "failure-pool.tsv").write_text(
              "".join(
                  f"{stage}\t{index}\t{rel_i}\t{source}\t{blocker}\n"
                  for stage, index, rel_i, source, blocker in pool
              )
          )

          families = defaultdict(list)
          for stage, index, rel_i, source, blocker in pool:
              signature = f"{stage}:{blocker}"
              families[signature].append((stage, index, rel_i, source, blocker))
          ordered = sorted(
              families.items(),
              key=lambda item: (-len(item[1]), item[0]),
          )
          active = []
          offsets = {signature: 0 for signature, _ in ordered}
          while len(active) < 16:
              progressed = False
              for signature, members in ordered:
                  pos = offsets[signature]
                  if pos >= len(members):
                      continue
                  active.append(members[pos])
                  offsets[signature] = pos + 1
                  progressed = True
                  if len(active) == 16:
                      break
              if not progressed:
                  break
          (out / "candidate-active-sample.txt").write_text(
              "".join(f"{index}\t{rel_i}\n" for _, index, rel_i, _, _ in active)
          )

          counts = Counter(status for status, *_ in results)
          blockers = Counter(f"{stage}:{blocker}" for stage, _, _, _, blocker in pool)
          chain_pass = counts["PASS"]
          summary = [
              f"MINIAS_C149_SUMMARY selected=149 chain_pass={chain_pass} "
              f"compile_fail={counts['COMPILE_FAIL']} assemble_fail={counts['ASSEMBLE_FAIL']}",
              f"MINIAS_C149_FAILURE_POOL fail={len(pool)} candidate_active={len(active)}",
              "MINIAS_C149_TOP_BLOCKERS",
          ]
          summary.extend(
              [f"  {count:5d} {blocker}" for blocker, count in blockers.most_common()]
              or ["  none"]
          )
          summary.append("MINIAS_C149_FILES")
          summary.extend(
              f"{status}\t{index}\t{rel_i}\t{blocker}"
              for status, index, rel_i, _, blocker in results
              if status != "PASS"
          )
          text = "\n".join(summary) + "\n"
          (out / "summary.txt").write_text(text)
          print(text, end="")
          if chain_pass != 149:
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minias-a0-c149-progress
          path: |
            build/minias-c149-replay/batch-results.json
            build/minias-c149-replay/batch-results.tsv
            build/minias-c149-replay/batch-summary.txt
            build/minias-c149-replay/failure-contexts.txt
            build/minias-c149-results/results.tsv
            build/minias-c149-results/failure-pool.tsv
            build/minias-c149-results/candidate-active-sample.txt
            build/minias-c149-results/summary.txt
            build/minias-c149-results/**/*.err
          retention-days: 30
          if-no-files-found: warn

  native35:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[minias-gate-v1]') ||
      contains(github.event.head_commit.message, '[minias-native-repro]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install exact Linux RISC-V build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev dwarves

      - name: Rebuild native35 from exact targeted Kbuild object commands
        shell: bash
        env:
          LINUX_VERSION: "6.6.143"
          LINUX_ARCHIVE_SHA256: "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/minias-native35-linux-src"
          out="$GITHUB_WORKSPACE/build/minias-native35-linux-out"
          fixture="$GITHUB_WORKSPACE/build/minias-native35-inputs"
          archive="$GITHUB_WORKSPACE/build/linux-${LINUX_VERSION}.tar.xz"
          mkdir -p build
          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          rm -rf "$src" "$out" "$fixture"
          mkdir -p "$src" "$out" "$fixture"
          tar -xJf "$archive" -C "$src" --strip-components=1
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts

          cat >build/minias-native35-targets.txt <<'EOF'
          arch/riscv/errata/sifive/errata_cip_453.s
          arch/riscv/kernel/compat_vdso/compat_vdso.s
          arch/riscv/kernel/compat_vdso/flush_icache.s
          arch/riscv/kernel/compat_vdso/getcpu.s
          arch/riscv/kernel/compat_vdso/note.s
          arch/riscv/kernel/compat_vdso/rt_sigreturn.s
          arch/riscv/kernel/copy-unaligned.s
          arch/riscv/kernel/entry.s
          arch/riscv/kernel/fpu.s
          arch/riscv/kernel/head.s
          arch/riscv/kernel/suspend_entry.s
          arch/riscv/kernel/vdso/flush_icache.s
          arch/riscv/kernel/vdso/getcpu.s
          arch/riscv/kernel/vdso/note.s
          arch/riscv/kernel/vdso/rt_sigreturn.s
          arch/riscv/kernel/vdso/sys_hwprobe.s
          arch/riscv/kernel/vdso/vdso.s
          arch/riscv/kvm/vcpu_switch.s
          arch/riscv/lib/clear_page.s
          arch/riscv/lib/memcpy.s
          arch/riscv/lib/memmove.s
          arch/riscv/lib/memset.s
          arch/riscv/lib/strcmp.s
          arch/riscv/lib/strlen.s
          arch/riscv/lib/strncmp.s
          arch/riscv/lib/tishift.s
          arch/riscv/lib/uaccess.s
          arch/riscv/purgatory/entry.s
          arch/riscv/purgatory/kexec-purgatory.s
          arch/riscv/purgatory/memcpy.s
          arch/riscv/purgatory/memset.s
          arch/riscv/purgatory/strcmp.s
          arch/riscv/purgatory/strlen.s
          arch/riscv/purgatory/strncmp.s
          usr/initramfs_data.s
          EOF
          sed -i 's/^[[:space:]]*//' build/minias-native35-targets.txt
          test "$(wc -l < build/minias-native35-targets.txt)" -eq 35

          mapfile -t asm_targets < build/minias-native35-targets.txt
          obj_targets=()
          for rel in "${asm_targets[@]}"; do
            obj_targets+=("${rel%.s}.o")
          done
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 "${obj_targets[@]}"

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, re, shlex, subprocess

          out = Path("build/minias-native35-linux-out").resolve()
          fixture = Path("build/minias-native35-inputs").resolve()
          desired = set(Path("build/minias-native35-targets.txt").read_text().splitlines())
          if len(desired) != 35:
              raise SystemExit(f"expected 35 desired assembly targets, got {len(desired)}")

          output_re = re.compile(r"(?:^|\s)-o\s+([^\s;]+\.o)(?=\s|;|$)")
          source_re = re.compile(r"(?:^|\s)([^\s;]+\.S)(?=\s|;|$)")
          rows = {}

          def normalize_output(token: str) -> str:
              path = Path(token.strip("'\""))
              if path.is_absolute():
                  try:
                      return path.resolve().relative_to(out).as_posix()
                  except ValueError:
                      return ""
              return PurePosixPath(path.as_posix()).as_posix()

          for cmdfile in out.rglob(".*.cmd"):
              try:
                  lines = cmdfile.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              for raw in lines:
                  if ":=" not in raw or " -c " not in f" {raw} ":
                      continue
                  objects = output_re.findall(raw)
                  sources = source_re.findall(raw)
                  if not objects or not sources:
                      continue
                  obj = normalize_output(objects[-1])
                  if not obj.endswith(".o"):
                      continue
                  rel_s = obj[:-2] + ".s"
                  if rel_s not in desired:
                      continue
                  command = raw.split(":=", 1)[1].strip()
                  tokens = shlex.split(command, posix=True)
                  rows[rel_s] = {
                      "object": obj,
                      "source": sources[-1].strip("'\""),
                      "cmdfile": cmdfile.relative_to(out).as_posix(),
                      "tokens": tokens,
                  }

          missing = sorted(desired - set(rows))
          extra = sorted(set(rows) - desired)
          if missing or extra or len(rows) != 35:
              raise SystemExit(
                  f"native35 Kbuild command mismatch rows={len(rows)} missing={missing} extra={extra}"
              )

          manifest = []
          for index, rel_s in enumerate(sorted(desired)):
              meta = rows[rel_s]
              tokens = list(meta["tokens"])
              compile_index = tokens.index("-c")
              output_index = tokens.index("-o")
              target = fixture / rel_s
              target.parent.mkdir(parents=True, exist_ok=True)
              tokens[compile_index] = "-E"
              tokens[output_index + 1] = str(target)
              proc = subprocess.run(
                  tokens,
                  cwd=out,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              if proc.returncode != 0 or not target.is_file() or target.stat().st_size == 0:
                  raise RuntimeError(
                      f"native preprocess failed target={rel_s} rc={proc.returncode}: "
                      + proc.stderr[-2000:]
                  )
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              manifest.append({
                  "index": index,
                  "assembly": rel_s,
                  "object": meta["object"],
                  "source": meta["source"],
                  "cmdfile": meta["cmdfile"],
                  "sha256": digest,
              })

          (fixture / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          (fixture / "SHA256SUMS").write_text(
              "".join(f"{row['sha256']}  {row['assembly']}\n" for row in manifest)
          )
          print("MINIAS_NATIVE35_FIXTURE=PASS selected=35 source=targeted-kbuild-object-commands")
          PY

      - name: Build exact MiniAS
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native35-toolchain all
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native35-toolchain check-minias-a0

      - name: Assemble regenerated native35 and require 35 of 35
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, subprocess

          workspace = Path.cwd().resolve()
          minias = workspace / "build/minias-native35-toolchain/bin/minic-as"
          input_root = workspace / "build/minias-native35-inputs"
          linux_out = workspace / "build/minias-native35-linux-out"
          result_root = workspace / "build/minias-native35-results"
          result_root.mkdir(parents=True, exist_ok=True)
          files = sorted(input_root.rglob("*.s"))
          if len(files) != 35:
              raise SystemExit(f"expected 35 native inputs, got {len(files)}")

          results = []
          blockers = Counter()
          for inp in files:
              rel = inp.relative_to(input_root).as_posix()
              obj = result_root / (rel[:-2] + ".o")
              err = result_root / (rel[:-2] + ".err")
              obj.parent.mkdir(parents=True, exist_ok=True)
              err.parent.mkdir(parents=True, exist_ok=True)
              proc = subprocess.run(
                  [str(minias), "-o", str(obj), str(inp)],
                  cwd=linux_out,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              err.write_text(proc.stderr)
              ok = False
              if proc.returncode == 0 and obj.is_file() and obj.stat().st_size:
                  check = subprocess.run(
                      ["readelf", "-h", str(obj)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      errors="replace",
                  )
                  ok = check.returncode == 0 and "RISC-V" in check.stdout and "REL (Relocatable file)" in check.stdout
              if ok:
                  results.append(("PASS", rel, "-"))
              else:
                  raw = next((line.strip() for line in proc.stderr.splitlines() if line.strip()), "internal:no-diagnostic")
                  blocker = re.sub(r"^minic-as:\s*", "", raw)
                  blocker = re.sub(r":line=[0-9]+$", "", blocker)
                  blockers[blocker] += 1
                  results.append(("FAIL", rel, blocker))

          (result_root / "results.tsv").write_text(
              "".join(f"{status}\t{path}\t{blocker}\n" for status, path, blocker in results)
          )
          pass_count = sum(status == "PASS" for status, _, _ in results)
          fail_count = len(results) - pass_count
          summary = [
              f"MINIAS_NATIVE35_SUMMARY pass={pass_count} fail={fail_count} total={len(results)}",
              "MINIAS_NATIVE35_TOP_BLOCKERS",
          ]
          summary.extend(
              [f"  {count:5d} {blocker}" for blocker, count in blockers.most_common()]
              or ["  none"]
          )
          text = "\n".join(summary) + "\n"
          (result_root / "summary.txt").write_text(text)
          print(text, end="")
          if pass_count != 35 or fail_count != 0:
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minias-a0-gate-v1-native35
          path: |
            build/minias-native35-inputs/manifest.json
            build/minias-native35-inputs/SHA256SUMS
            build/minias-native35-results/results.tsv
            build/minias-native35-results/summary.txt
            build/minias-native35-results/**/*.err
          retention-days: 30
          if-no-files-found: warn

  gate3536:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-gate-v1]'))
    needs: [all3352, c149, native35]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete 3536 hard gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.all3352.result }}" = success
          test "${{ needs.c149.result }}" = success
          test "${{ needs.native35.result }}" = success
          echo "MINIAS_A0_GATE_V1=PASS c_frozen=3352 c149=149 native=35 selected=3536 pass=3536 fail=0"
