name: Materialize Record Array Metadata V1

on:
  push:
    branches:
      - staging/string-octal-v1
    paths:
      - tools/dev/materialize-record-array-metadata-v1.py
      - .github/workflows/materialize-record-array-metadata-v1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize generic static record-array metadata support
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-record-array-metadata-v1.py
          clang-format-18 -i src/frontend/parser_global.c tests/compiler/c0/static_global_object_section.c
          git diff --check

      - name: Build and run focused static-object gate
        run: |
          set -Eeuo pipefail
          make -j4 MODE=debug BUILD_DIR=build/record-array-metadata
          MINIC="$GITHUB_WORKSPACE/build/record-array-metadata/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-array-metadata-focused" \
            sh tests/compiler/c0/run-static-global-object-section.sh

      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev

      - name: Probe unchanged VDSO after record-array metadata
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          set +e
          MINIC="$GITHUB_WORKSPACE/build/record-array-metadata/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/record-array-metadata-vdso" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=32 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/record-array-metadata-vdso/batch-summary.txt
          echo "VDSO_PROBE_STATUS=$status"

      - name: Commit product files only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-record-array-metadata-v1.py \
                .github/workflows/materialize-record-array-metadata-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_global.c \
                  tests/compiler/c0/static_global_object_section.c \
                  tests/compiler/c0/run-static-global-object-section.sh \
                  tools/dev/materialize-record-array-metadata-v1.py \
                  .github/workflows/materialize-record-array-metadata-v1.yml
          git commit -m 'frontend: preserve inferred record-array object metadata'
          git push origin HEAD:staging/string-octal-v1
