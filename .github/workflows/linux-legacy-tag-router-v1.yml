name: Linux Historical Opt-in Push Tag Router V1

# Canonical Runtime push entrypoint for explicitly tagged historical integrations.
# The original exact job bodies live in reusable workflows.
on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]

permissions:
  contents: read
  actions: read

jobs:
  linux-kbuild:
    if: contains(github.event.head_commit.message, '[linux-expanded-kbuild-v0]')
    uses: ./.github/workflows/linux-expanded-kbuild-v0.yml

  miniar-kbuild:
    if: contains(github.event.head_commit.message, '[miniar-linux-kbuild]')
    uses: ./.github/workflows/miniar-linux-kbuild.yml

  linux-fixture:
    if: contains(github.event.head_commit.message, '[linux-runtime-frozen-cert-v1]') || contains(github.event.head_commit.message, '[linux-runtime-link-fixture-cert-v1]')
    uses: ./.github/workflows/linux-runtime-fixture-producers-v1.yml

  minias-gate:
    if: contains(github.event.head_commit.message, '[minias-gate-v1]') || contains(github.event.head_commit.message, '[minias-native-repro]')
    uses: ./.github/workflows/minias-a0-gate-v1.yml

  runtime-early:
    if: contains(github.event.head_commit.message, '[linux-expanded-pi-runtime]') || contains(github.event.head_commit.message, '[linux-expanded-runtime-p1]') || contains(github.event.head_commit.message, '[linux-expanded-entry-trace]') || contains(github.event.head_commit.message, '[linux-runtime-pi-local-symbol-v0]') || contains(github.event.head_commit.message, '[runtime-compiler-semantics-v1]') || contains(github.event.head_commit.message, '[linux-pi-micro]') || contains(github.event.head_commit.message, '[linux-runtime-qemu-watch-cert-v1]') || contains(github.event.head_commit.message, '[linux-runtime-qemu-watch-contracts-v1]') || contains(github.event.head_commit.message, '[linux-runtime-qemu-watch-inconclusive-v1]')
    uses: ./.github/workflows/linux-expanded-pi-p1-runtime-v1.yml

  runtime-faults:
    if: contains(github.event.head_commit.message, '[linux-check-cpu-stall-runtime-v0]') || contains(github.event.head_commit.message, '[linux-fork-stack-runtime-v0]') || contains(github.event.head_commit.message, '[linux-runtime-fault-context-v1]') || contains(github.event.head_commit.message, '[linux-runtime-satp-refresh-v0]') || contains(github.event.head_commit.message, '[linux-runtime-frontier-v1]') || contains(github.event.head_commit.message, '[linux-runtime-frontier-fast-v5]') || contains(github.event.head_commit.message, '[linux-image-qemu-runtime-v0]')
    uses: ./.github/workflows/linux-runtime-focused-faults-v1.yml

  minild-integrations:
    if: contains(github.event.head_commit.message, '[minild-dynamic-integration]') || contains(github.event.head_commit.message, '[minild-linux-rel-boundaries]') || contains(github.event.head_commit.message, '[static-runtime]')
    uses: ./.github/workflows/minild-integration-v1.yml

  runtime-perf-suite:
    if: contains(github.event.head_commit.message, '[linux-perf3352]') || contains(github.event.head_commit.message, '[linux-constant-p]') || contains(github.event.head_commit.message, '[linux-perf500]')
    uses: ./.github/workflows/linux-runtime-optin-perf-suite-v1.yml

  spinlock-probes:
    if: contains(github.event.head_commit.message, '[linux-spinlock-context]') || contains(github.event.head_commit.message, '[linux-spinlock-codegen]') || contains(github.event.head_commit.message, '[linux-spinlock-first-context]') || contains(github.event.head_commit.message, '[linux-spinlock-stack]')
    uses: ./.github/workflows/linux-runtime-spinlock-context-v0.yml

  fdt-kallsyms-probes:
    if: contains(github.event.head_commit.message, '[linux-fdt-isolation]') || contains(github.event.head_commit.message, '[linux-fdt-codegen]') || contains(github.event.head_commit.message, '[linux-kallsyms-generated]') || contains(github.event.head_commit.message, '[linux-kallsyms-three-way]') || contains(github.event.head_commit.message, '[linux-kallsyms-object]')
    uses: ./.github/workflows/linux-runtime-fdt-isolation-v1.yml

  minias-focused:
    # Exactly one declared reusable call; no route runner on ordinary pushes.
    # Multi-mode tags use documented precedence; window only matters for mode=window.
    if: contains(github.event.head_commit.message, '[minias-real16]') || contains(github.event.head_commit.message, '[minias-frontier]') || contains(github.event.head_commit.message, '[minias-vector33]') || contains(github.event.head_commit.message, '[minias-semantic3536]') || contains(github.event.head_commit.message, '[minias-first500]') || contains(github.event.head_commit.message, '[minias-new500]') || contains(github.event.head_commit.message, '[minias-next500]') || contains(github.event.head_commit.message, '[minias-next500b]') || contains(github.event.head_commit.message, '[minias-next500c]') || contains(github.event.head_commit.message, '[minias-next500d]') || contains(github.event.head_commit.message, '[minias-final352]')
    uses: ./.github/workflows/minias-a0-focused-diagnostics-v1.yml
    with:
      mode: ${{ contains(github.event.head_commit.message, '[minias-semantic3536]') && 'semantic' || contains(github.event.head_commit.message, '[minias-frontier]') && 'frontier' || contains(github.event.head_commit.message, '[minias-vector33]') && 'vector33' || contains(github.event.head_commit.message, '[minias-real16]') && 'real16' || 'window' }}
      window: ${{ contains(github.event.head_commit.message, '[minias-final352]') && 'final352' || contains(github.event.head_commit.message, '[minias-next500d]') && 'next500d' || contains(github.event.head_commit.message, '[minias-next500c]') && 'next500c' || contains(github.event.head_commit.message, '[minias-next500b]') && 'next500b' || contains(github.event.head_commit.message, '[minias-next500]') && 'next500' || contains(github.event.head_commit.message, '[minias-new500]') && 'new500' || 'first500' }}
