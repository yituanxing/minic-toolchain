name: Linux Historical Opt-in Push Tag Router V1

# One event-level push listener replaces the separate legacy Kbuild/MiniAR
# empty-run cards. The original exact job bodies live in reusable workflows.
on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]

permissions:
  contents: read
  actions: read

jobs:
  linux-kbuild:
    if: contains(github.event.head_commit.message, '[linux-expanded-kbuild-v0]')
    uses: ./.github/workflows/linux-expanded-kbuild-v0.yml

  miniar-kbuild:
    if: contains(github.event.head_commit.message, '[miniar-linux-kbuild]')
    uses: ./.github/workflows/miniar-linux-kbuild.yml

  # Temporary end-to-end probe. This runs only for an explicit special tag,
  # calls M0 as a real reusable workflow, and never starts a Linux build.
  route-smoke:
    if: contains(github.event.head_commit.message, '[ci-legacy-router-smoke-v1]')
    uses: ./.github/workflows/toolchain-m0-structure.yml
