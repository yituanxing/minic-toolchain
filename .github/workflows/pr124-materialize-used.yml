name: PR124 Materialize GNU Used Attribute
on:
  push:
    branches: [agent/used-attribute-v0]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize GNU used attribute
        run: |
          set -Eeuo pipefail
          python3 tools/dev/pr124-materialize.py
          clang-format-18 -i \
            src/frontend/attribute.h \
            src/frontend/attribute.c \
            tests/compiler/c0/deferred_declarator_attributes.c \
            tests/compiler/c0/invalid_used_argument.c \
            tests/compiler/c0/invalid_used_field.c
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          make -j4
          MINIC="$GITHUB_WORKSPACE/build/debug/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/pr124-focused" \
            sh tests/compiler/c0/run-deferred-declarator-attributes.sh
          make check
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --check
      - name: Commit product source
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/pr124-materialize.py .github/workflows/pr124-materialize-used.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(frontend): accept GNU used attribute'
          git push origin HEAD:agent/used-attribute-v0
