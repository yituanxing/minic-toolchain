name: MiniC Core Constant CFG Fix V0

on:
  push:
    branches:
      - "agent/linux-link-correctness-v0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minic-core-constant-cfg-fix-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-prove:
    if: ${{ !contains(github.event.head_commit.message || '', '[constant-cfg-product]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install RV64 prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Apply bounded constant CFG product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lower = Path('src/core/core_lower.c')
          text = lower.read_text()
          anchor = 'static MinicCoreLowerStatus\nlower_switch(MinicCoreLowerContext *context, const MinicStatement *statement, bool *terminated) {'
          pos = text.find(anchor)
          if pos < 0:
              raise SystemExit('lower_switch anchor not found')
          prefix, tail = text[:pos], text[pos:]
          old = '''    default_target = default_label == SIZE_MAX ? exit_block : labels[default_label].body_block;
    dispatch_target =
        first_case_label == SIZE_MAX ? default_target : labels[first_case_label].test_block;
'''
          new = '''    default_target = default_label == SIZE_MAX ? exit_block : labels[default_label].body_block;
    dispatch_target =
        first_case_label == SIZE_MAX ? default_target : labels[first_case_label].test_block;

    /* M177_CONSTANT_SWITCH_CFG_OWNER: an integer constant-expression selector
       has exactly one switch-entry edge. Keep the ordinary case segments and
       their fallthrough CFG intact, but bypass the synthetic comparison chain
       when every case is a simple scalar case. Unselected segments then have
       no selector predecessor and can be removed by target CFG reachability.
       Range cases stay on the established generic dispatch path. */
    {
        MinicConstValue selector_constant;
        MinicConstValue selector_converted;

        if (minic_const_eval_integer(context->body->program,
                                     context->target,
                                     statement->expression,
                                     &selector_constant) &&
            minic_const_value_convert_integer(context->body->program,
                                              context->target,
                                              &selector_constant,
                                              selector_type,
                                              &selector_converted)) {
            size_t constant_target = SIZE_MAX;
            size_t dispatch_index;
            bool simple_cases = true;

            for (dispatch_index = 0U; dispatch_index < label_count; ++dispatch_index) {
                const MinicStatement *case_statement = labels[dispatch_index].statement;
                MinicConstValue case_constant;
                MinicConstValue case_converted;

                if (case_statement->kind != MINIC_STATEMENT_CASE) {
                    continue;
                }
                if (case_statement->target_expression != MINIC_EXPRESSION_INVALID ||
                    !minic_const_eval_integer(context->body->program,
                                              context->target,
                                              case_statement->expression,
                                              &case_constant) ||
                    !minic_const_value_convert_integer(context->body->program,
                                                       context->target,
                                                       &case_constant,
                                                       selector_type,
                                                       &case_converted)) {
                    simple_cases = false;
                    break;
                }
                if (case_converted.bits == selector_converted.bits) {
                    constant_target = dispatch_index;
                    break;
                }
            }
            if (simple_cases) {
                dispatch_target = constant_target == SIZE_MAX
                                      ? default_target
                                      : labels[constant_target].body_block;
            }
        }
    }
'''
          if old not in tail:
              raise SystemExit('flat switch dispatch anchor not found')
          tail = tail.replace(old, new, 1)
          lower.write_text(prefix + tail)

          codegen = Path('src/target/riscv64/core_codegen.c')
          text = codegen.read_text()
          old = '''    size_t *object_offsets;
    size_t *value_offsets;
    size_t value_base_offset;
'''
          new = '''    size_t *object_offsets;
    size_t *value_offsets;
    /* M177_CONSTANT_SWITCH_CFG_OWNER: target emission owns a conservative
       reachability bitmap so selector-dead Core blocks do not materialize
       references that have no executable source path. */
    bool *reachable_blocks;
    size_t value_base_offset;
'''
          if old not in text:
              raise SystemExit('frame field anchor not found')
          text = text.replace(old, new, 1)

          old = '''    frame->object_offsets = NULL;
    frame->value_offsets = NULL;
    frame->value_slot_count = 0U;
'''
          new = '''    frame->object_offsets = NULL;
    frame->value_offsets = NULL;
    frame->reachable_blocks = NULL;
    frame->value_slot_count = 0U;
'''
          if old not in text:
              raise SystemExit('frame init anchor not found')
          text = text.replace(old, new, 1)

          old = '''    free(frame->value_offsets);
    frame->value_offsets = NULL;
    free(frame->object_offsets);
    frame->object_offsets = NULL;
'''
          new = '''    free(frame->value_offsets);
    frame->value_offsets = NULL;
    free(frame->object_offsets);
    frame->object_offsets = NULL;
    free(frame->reachable_blocks);
    frame->reachable_blocks = NULL;
'''
          if old not in text:
              raise SystemExit('frame destroy anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''static bool emit_core_function_with_symbol(FILE *file,
                                                    const MinicC0Program *program,
                                                    const MinicCoreFunction *function,
                                                    const MinicRiscv64FunctionSymbol *symbol) {
'''
          helper = r'''/* M177_CONSTANT_SWITCH_CFG_OWNER: Core keeps source labels as explicit
   block identities. Seed every user-label block conservatively (covering
   goto/asm-goto/computed-goto re-entry), then close over ordinary Core
   terminator edges from the entry block. Synthetic switch comparison/body
   blocks with no executable predecessor remain unmarked and need not be
   emitted. */
static bool core_frame_mark_reachable_blocks(const MinicCoreFunction *function,
                                             MinicRiscv64CoreFrame *frame) {
    MinicCoreBlockId *queue;
    size_t queue_begin;
    size_t queue_end;
    size_t block_index;

    if (function == NULL || frame == NULL || function->block_count == 0U ||
        function->entry_block >= function->block_count ||
        function->block_count > SIZE_MAX / sizeof(*queue)) {
        return false;
    }
    frame->reachable_blocks =
        (bool *)calloc(function->block_count, sizeof(*frame->reachable_blocks));
    queue = (MinicCoreBlockId *)malloc(function->block_count * sizeof(*queue));
    if (frame->reachable_blocks == NULL || queue == NULL) {
        free(queue);
        return false;
    }
    queue_begin = 0U;
    queue_end = 0U;
#define MINIC_CORE_REACHABLE_ENQUEUE(block_id_)                                      \
    do {                                                                             \
        MinicCoreBlockId reach_id_ = (block_id_);                                    \
        if (reach_id_ >= function->block_count) {                                    \
            free(queue);                                                              \
            return false;                                                             \
        }                                                                             \
        if (!frame->reachable_blocks[reach_id_]) {                                   \
            frame->reachable_blocks[reach_id_] = true;                               \
            queue[queue_end++] = reach_id_;                                           \
        }                                                                             \
    } while (0)

    MINIC_CORE_REACHABLE_ENQUEUE(function->entry_block);
    for (block_index = 0U; block_index < function->block_count; ++block_index) {
        if (function->blocks[block_index].source_label_id != SIZE_MAX) {
            MINIC_CORE_REACHABLE_ENQUEUE((MinicCoreBlockId)block_index);
        }
    }
    while (queue_begin < queue_end) {
        const MinicCoreBlock *block = &function->blocks[queue[queue_begin++]];

        if (!block->has_terminator) {
            free(queue);
            return false;
        }
        switch (block->terminator.kind) {
        case MINIC_CORE_TERMINATOR_RETURN:
        case MINIC_CORE_TERMINATOR_UNREACHABLE:
        case MINIC_CORE_TERMINATOR_INDIRECT_BRANCH:
            break;
        case MINIC_CORE_TERMINATOR_BRANCH:
            MINIC_CORE_REACHABLE_ENQUEUE(block->terminator.branch_target);
            break;
        case MINIC_CORE_TERMINATOR_CONDITIONAL_BRANCH:
            MINIC_CORE_REACHABLE_ENQUEUE(block->terminator.conditional.when_true);
            MINIC_CORE_REACHABLE_ENQUEUE(block->terminator.conditional.when_false);
            break;
        default:
            free(queue);
            return false;
        }
    }
#undef MINIC_CORE_REACHABLE_ENQUEUE
    free(queue);
    return true;
}

'''
          if anchor not in text:
              raise SystemExit('codegen function anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          old = '''    if (!core_frame_initialize(program, function, &frame)) {
        return false;
    }
'''
          new = '''    if (!core_frame_initialize(program, function, &frame)) {
        return false;
    }
    if (!core_frame_mark_reachable_blocks(function, &frame)) {
        return core_frame_fail(&frame);
    }
'''
          if old not in text:
              raise SystemExit('frame call anchor not found')
          text = text.replace(old, new, 1)

          old = '''        block = &function->blocks[block_index];
        if (!emit_block_label(file, symbol_name, (MinicCoreBlockId)block_index)) {
'''
          new = '''        block = &function->blocks[block_index];
        if (frame.reachable_blocks != NULL && !frame.reachable_blocks[block_index]) {
            continue;
        }
        if (!emit_block_label(file, symbol_name, (MinicCoreBlockId)block_index)) {
'''
          if old not in text:
              raise SystemExit('block emit anchor not found')
          text = text.replace(old, new, 1)
          codegen.write_text(text)
          PY
          git diff --check
          git diff -- src/core/core_lower.c src/target/riscv64/core_codegen.c

      - name: Build current product
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/constant-cfg-v0/toolchain"
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" all

      - name: Prove constant switch pruning and runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/constant-cfg-v0/test"
          build="$GITHUB_WORKSPACE/build/constant-cfg-v0/toolchain"
          mkdir -p "$work"
          cat >"$work/switch.c" <<'C'
          extern int should_not_exist(void);
          int constant_switch_probe(void) {
              switch (sizeof(long)) {
              case 1:
                  return should_not_exist();
              case 8:
                  return 47;
              default:
                  return should_not_exist();
              }
          }
          C
          "$build/bin/minic" -S "$work/switch.c" -o "$work/switch.s"
          riscv64-linux-gnu-gcc -x assembler -c "$work/switch.s" -o "$work/switch.o"
          riscv64-linux-gnu-nm -u "$work/switch.o" >"$work/switch.undefined"
          if grep -F should_not_exist "$work/switch.undefined"; then
            echo 'CONSTANT_SWITCH_CFG_FAIL dead-symbol-survived' >&2
            exit 1
          fi
          cat >"$work/start.s" <<'ASM'
              .section .text.start,"ax",@progbits
              .globl _start
          _start:
              call constant_switch_probe
              addi a0, a0, -47
              li a7, 93
              ecall
          ASM
          riscv64-linux-gnu-gcc -x assembler -c "$work/start.s" -o "$work/start.o"
          riscv64-linux-gnu-ld -static -e _start -o "$work/switch" "$work/start.o" "$work/switch.o"
          set +e
          qemu-riscv64 "$work/switch"
          rc=$?
          set -e
          test "$rc" -eq 0
          echo "MINIC_CORE_CONSTANT_SWITCH_V0=PASS dead_ref=discarded qemu_rc=$rc"

      - name: Keep existing emission regression green
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/constant-cfg-v0/toolchain"
          MINIC="$build/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/constant-cfg-v0/regression" \
            bash tests/compiler/c0/run-inline-emission-reachability-rv64.sh

      - name: Commit proven product fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/core_lower.c src/target/riscv64/core_codegen.c
          git commit -m "core: prune constant-switch dead CFG [constant-cfg-product]"
          git push origin HEAD:agent/linux-link-correctness-v0
