name: Agent RV64 discard address-backed record values

on:
  push:
    branches:
      - agent/rv64-discard-address-backed-record-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build baseline MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-discard-record-baseline

      - name: Prove baseline rejects discarded zero-size record member
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-discard-record-baseline/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          struct pin_cookie { };
          struct rq_flags { unsigned long flags; struct pin_cookie cookie; };
          void unpin(struct rq_flags *rf) {
              (void)(rf->cookie);
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          if build/agent-discard-record-baseline/bin/minic -S "$work/repro.i" -o "$work/repro.s" \
              >"$work/stdout" 2>"$work/stderr"; then
              echo 'baseline unexpectedly accepted discarded zero-size record member' >&2
              exit 1
          fi
          grep -F 'cannot write RISC-V assembly' "$work/stderr" >/dev/null

      - name: Apply bounded discard consumer patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent-rv64-discard-address-backed-record.py
          clang-format-18 -i src/target/riscv64/codegen_expression.c tests/compiler/c0/gnu_statement_record_value.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Build patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-discard-record-patched

      - name: Re-run Linux-shaped reproducer
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-discard-record-patched/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          struct pin_cookie { };
          struct rq_flags { unsigned long flags; struct pin_cookie cookie; };
          void unpin(struct rq_flags *rf) {
              (void)(rf->cookie);
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          build/agent-discard-record-patched/bin/minic -S "$work/repro.i" -o "$work/repro.s"
          grep -F '.type unpin, @function' "$work/repro.s" >/dev/null
          grep -F '.size unpin, .-unpin' "$work/repro.s" >/dev/null

      - name: Run focused statement-record contract
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/agent-discard-record-patched/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-discard-record-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-statement-record-value.sh

      - name: Run fast regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-fast

      - name: Commit product-only result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/zz-agent-rv64-discard-address-backed-record.yml
          rm -f tools/dev/agent-rv64-discard-address-backed-record.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: discard address-backed record values without materialization'
          git push origin HEAD:agent/rv64-discard-address-backed-record-v1
