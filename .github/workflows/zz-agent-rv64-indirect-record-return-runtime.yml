name: Agent RV64 indirect record return runtime

on:
  push:
    branches:
      - agent/rv64-indirect-record-return-v1

permissions:
  contents: write

jobs:
  validate-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install RV64 validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user

      - name: Build MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-indirect-return-runtime

      - name: Run bidirectional RV64 ABI differential
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-indirect-return-runtime/differential
          mkdir -p "$work"
          cat > "$work/minic_side.c" <<'EOF'
          struct triple64 { long first; long second; long third; };

          extern struct triple64 gcc_make_triple(long base);

          struct triple64 minic_make_triple(long base) {
              struct triple64 result;
              result.first = base;
              result.second = base + 1;
              result.third = base + 2;
              return result;
          }

          struct triple64 minic_forward_gcc(long base) {
              return gcc_make_triple(base);
          }

          long minic_consume_gcc(long base) {
              struct triple64 value = gcc_make_triple(base);
              return value.first * 100 + value.second * 10 + value.third;
          }

          static void cleanup_triple(struct triple64 *value) {
              value->third += 5;
          }

          long minic_cleanup_gcc(long base) {
              struct triple64 value __attribute__((cleanup(cleanup_triple))) = gcc_make_triple(base);
              return value.first + value.second + value.third;
          }
          EOF
          cat > "$work/gcc_side.c" <<'EOF'
          struct triple64 { long first; long second; long third; };

          extern struct triple64 minic_make_triple(long base);
          extern struct triple64 minic_forward_gcc(long base);
          extern long minic_consume_gcc(long base);
          extern long minic_cleanup_gcc(long base);

          struct triple64 gcc_make_triple(long base) {
              struct triple64 result = {base, base + 1, base + 2};
              return result;
          }

          static int equal_triple(struct triple64 value, long base) {
              return value.first == base && value.second == base + 1 && value.third == base + 2;
          }

          int main(void) {
              if (!equal_triple(minic_make_triple(10), 10)) return 11;
              if (!equal_triple(minic_forward_gcc(20), 20)) return 12;
              if (minic_consume_gcc(3) != 345) return 13;
              if (minic_cleanup_gcc(7) != 24) return 14;
              return 0;
          }
          EOF
          riscv64-linux-gnu-gcc -E -P -std=gnu11 -x c "$work/minic_side.c" -o "$work/minic_side.i"
          build/agent-indirect-return-runtime/bin/minic -S "$work/minic_side.i" -o "$work/minic_side.s"
          riscv64-linux-gnu-gcc -static "$work/minic_side.s" "$work/gcc_side.c" -o "$work/interop.elf"
          qemu-riscv64 "$work/interop.elf"

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/zz-agent-rv64-indirect-record-return-runtime.yml
          git add .github/workflows/zz-agent-rv64-indirect-record-return-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary indirect-return runtime workflow'
          git push origin HEAD:agent/rv64-indirect-record-return-v1
