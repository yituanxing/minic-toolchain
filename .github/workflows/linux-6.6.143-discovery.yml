name: Linux 6.6.143 Verifier Debug

on:
  push:
    branches: [probe/linux-final-verifier-debug]

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-final-verifier-debug
  cancel-in-progress: true

jobs:
  linux-frontier:
    name: frozen-init-main-verifier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frozen authoritative Linux TU
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9174570466
          path: build/frozen-linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: yituanxing/minic-toolchain
          run-id: 31683780275

      - name: Build verifier-instrumented MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-linux-verifier-debug.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          make -j4 MODE=release BUILD_DIR=build/linux-compiler

      - name: Verify frozen Linux translation unit
        shell: bash
        run: |
          set -Eeuo pipefail
          input="$GITHUB_WORKSPACE/build/frozen-linux/linux-frontier-31683780275/kbuild/init/main.i"
          test -s "$input"
          test "$(wc -l < "$input" | tr -d ' ')" = 90928
          mkdir -p build/linux-verifier-result
          set +e
          build/linux-compiler/bin/minic -S "$input" -o build/linux-verifier-result/main.s \
            >build/linux-verifier-result/minic.stdout \
            2>build/linux-verifier-result/minic.stderr
          status=$?
          set -e
          cat build/linux-verifier-result/minic.stderr
          exit "$status"

      - name: Upload verifier diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verifier-debug-${{ github.run_id }}
          path: build/linux-verifier-result/minic.stderr
          if-no-files-found: ignore
          retention-days: 7
