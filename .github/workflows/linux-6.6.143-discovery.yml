name: Linux Runtime Spinlock Registered Bridge V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - "tools/ci/runtime-mm-core-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-spinlock-registered-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spinlock-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-registered-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-spinlock-registered-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh certified and spinlock owners with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-registered-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-spinlock-registered-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
            "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" \
            >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          test -s "$out/$pi_base.minic-stage2.s"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$out/$pi_base.minic-stage2.s" >/dev/null
          echo 'PI_OWNER_REFRESH=PASS local_string=lla'

          refresh_obj() {
            target="$1"
            base="${target%.o}"
            dir="${target%/*}"
            stem="${target##*/}"
            stem="${stem%.o}"
            log="$2"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" \
              "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          riscv64-linux-gnu-objdump -dr "$out/arch/riscv/mm/init.o" >"$ev/init.objdump.txt"
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock_debug-refresh.log

          for stem in spinlock spinlock_debug; do
            riscv64-linux-gnu-objdump -dr "$out/kernel/locking/${stem}.o" >"$ev/${stem}.objdump.txt"
            riscv64-linux-gnu-nm -an "$out/kernel/locking/${stem}.o" >"$ev/${stem}.nm.txt"
          done
          {
            echo '=== spinlock.o ==='
            grep -E '[[:space:]]arch_spin_lock$|<arch_spin_lock>:' "$ev/spinlock.nm.txt" "$ev/spinlock.objdump.txt" || true
            echo '=== spinlock_debug.o ==='
            grep -E '[[:space:]]arch_spin_lock$|<arch_spin_lock>:' "$ev/spinlock_debug.nm.txt" "$ev/spinlock_debug.objdump.txt" || true
          } | tee "$ev/spinlock-owner.txt"

      - name: Verify SATP critical CSR window
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('build/linux-runtime-spinlock-registered-v0/init.objdump.txt')
          text = p.read_text(errors='replace').splitlines()
          start = next(i for i,l in enumerate(text) if '<set_satp_mode>:' in l)
          end = len(text)
          for i in range(start + 1, len(text)):
              m = re.match(r'^([0-9a-f]+) <([^>]+)>:$', text[i].strip())
              if m and not m.group(2).startswith('.L'):
                  end = i
                  break
          body = text[start:end]
          first = next(i for i,l in enumerate(body) if re.search(r'\bcsrw\s+satp\b', l))
          second = next(i for i,l in enumerate(body[first+1:], first+1) if re.search(r'\bcsrrwi?\b.*\bsatp\b', l))
          window = body[first+1:second]
          stack_mem = [l for l in window if re.search(r'\b(?:lb|lbu|lh|lhu|lw|lwu|ld|sb|sh|sw|sd)\b[^\n]*\(sp\)', l)]
          print(f'SATP_INTER_CSR_STACK_MEM={len(stack_mem)}')
          if stack_mem:
              print('\n'.join(stack_mem))
              raise SystemExit(1)
          print('SATP_WINDOW=PASS')
          PY

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-registered-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"

      - name: Execute QEMU current frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-spinlock-registered-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-init-irq-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-spinlock-registered-v0-${{ github.sha }}
          path: |
            build/linux-runtime-spinlock-registered-v0/profile/patch.log
            build/linux-runtime-spinlock-registered-v0/*-refresh.log
            build/linux-runtime-spinlock-registered-v0/*.objdump.txt
            build/linux-runtime-spinlock-registered-v0/*.nm.txt
            build/linux-runtime-spinlock-registered-v0/spinlock-owner.txt
            build/linux-runtime-spinlock-registered-v0/watch/frontier-result.json
            build/linux-runtime-spinlock-registered-v0/watch/frontier-summary.txt
            build/linux-runtime-spinlock-registered-v0/watch/watch-result.json
            build/linux-runtime-spinlock-registered-v0/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
