name: Linux 6.6.143 Discovery

on:
  push:
    branches: [external/linux-6.6.143-discovery]
  pull_request:
    branches: [external/lua-discovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-6.6.143-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-frontier:
    name: riscv-defconfig-init-main
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage current compiler semantics and build MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          sh tools/dev/pr76-stage.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          make -j4 MODE=release BUILD_DIR=build/linux-compiler

      - name: Verify Linux-specific focused semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/linux-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-focused" \
          HOST_CC=cc \
            sh tools/dev/pr76-focused.sh

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Drive MiniC with Linux 6.6.143 RISC-V defconfig
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/linux-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-discovery" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh
          status=$?
          set -e
          exit "$status"
