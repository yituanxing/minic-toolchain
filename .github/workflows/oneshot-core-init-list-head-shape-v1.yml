name: One-shot Core INIT_LIST_HEAD Shape Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1

      - name: Build exact compiler
        shell: bash
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/core-init-list-probe-compiler

      - name: Generate atomic compiletime-assert shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/core-init-list-shapes
          mkdir -p "$work"

          cat > "$work/a-local-extern.i" <<'EOF'
          void probe_local_extern(void) {
              extern void probe_external(void);
          }
          EOF

          cat > "$work/b-local-extern-noreturn.i" <<'EOF'
          void probe_local_extern_noreturn(void) {
              __attribute__((noreturn)) extern void probe_external(void);
          }
          EOF

          cat > "$work/c-local-extern-error.i" <<'EOF'
          void probe_local_extern_error(void) {
              __attribute__((noreturn, error("compiletime failure")))
              extern void probe_external(void);
          }
          EOF

          cat > "$work/d-file-extern-if-zero.i" <<'EOF'
          extern void probe_external(void);
          void probe_file_extern_if_zero(void) {
              if (0)
                  probe_external();
          }
          EOF

          cat > "$work/e-local-extern-if-zero.i" <<'EOF'
          void probe_local_extern_if_zero(void) {
              extern void probe_external(void);
              if (0)
                  probe_external();
          }
          EOF

          cat > "$work/f-local-error-if-zero.i" <<'EOF'
          void probe_local_error_if_zero(void) {
              __attribute__((noreturn, error("compiletime failure")))
              extern void probe_external(void);
              if (0)
                  probe_external();
          }
          EOF

          cat > "$work/g-file-extern-sizeof-false.i" <<'EOF'
          extern void probe_external(void);
          void probe_file_extern_sizeof_false(void) {
              if (!(sizeof(void *) == sizeof(void *)))
                  probe_external();
          }
          EOF

          cat > "$work/h-local-error-sizeof-false.i" <<'EOF'
          void probe_local_error_sizeof_false(void) {
              __attribute__((noreturn, error("compiletime failure")))
              extern void probe_external(void);
              if (!(sizeof(void *) == sizeof(void *)))
                  probe_external();
          }
          EOF

          cat > "$work/i-do-local-error-sizeof-false.i" <<'EOF'
          void probe_do_local_error_sizeof_false(void) {
              do {
                  __attribute__((noreturn, error("compiletime failure")))
                  extern void probe_external(void);
                  if (!(sizeof(void *) == sizeof(void *)))
                      probe_external();
              } while (0);
          }
          EOF

          cat > "$work/j-write-once-after-assert.i" <<'EOF'
          struct list_head { struct list_head *next; struct list_head *prev; };
          void probe_write_once_after_assert(struct list_head *list) {
              do {
                  __attribute__((noreturn, error("rwonce type")))
                  extern void probe_external(void);
                  if (!(sizeof(list->next) == sizeof(void *)))
                      probe_external();
              } while (0);
              do {
                  *(volatile __typeof__(list->next) *)&(list->next) = list;
              } while (0);
          }
          EOF

      - name: Run atomic strict probes
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/core-init-list-probe-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/core-init-list-shapes"
          passes=0
          failures=0
          for input in "$work"/*.i; do
            name=$(basename "$input" .i)
            set +e
            MINIC_CORE_IR=strict "$compiler" -S "$input" -o "$work/$name.s" \
              >"$work/$name.stdout" 2>"$work/$name.stderr"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              passes=$((passes + 1))
              printf 'CORE_CTASSERT_SHAPE name=%s status=PASS\n' "$name"
            else
              failures=$((failures + 1))
              printf 'CORE_CTASSERT_SHAPE name=%s status=FAIL rc=%d\n' "$name" "$status"
              sed 's/^/CORE_CTASSERT_DIAG /' "$work/$name.stderr"
            fi
          done
          printf 'CORE_CTASSERT_SHAPE_SUMMARY pass=%d fail=%d\n' "$passes" "$failures"
