name: Productize Record Field Alignment Query V2
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/record-field-alignment-query-v2
          fetch-depth: 0
      - name: Add canonical record-field alignment query
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          h = Path('src/target/data_layout.h')
          hs = h.read_text()
          decl_anchor = '''bool minic_data_layout_record_field_layout(const MinicDataLayout *layout,\n'''
          decl = '''bool minic_data_layout_record_field_alignment(const MinicDataLayout *layout,\n                                              const MinicC0Program *program,\n                                              const MinicRecord *record,\n                                              size_t field_index,\n                                              size_t *alignment);\n'''
          if 'minic_data_layout_record_field_alignment' not in hs:
              if hs.count(decl_anchor) != 1:
                  raise SystemExit('data-layout header anchor mismatch')
              hs = hs.replace(decl_anchor, decl + decl_anchor, 1)
              h.write_text(hs)

          c = Path('src/target/data_layout.c')
          cs = c.read_text()
          impl_anchor = '''bool minic_data_layout_record_field_layout(const MinicDataLayout *layout,\n'''
          impl = '''bool minic_data_layout_record_field_alignment(const MinicDataLayout *layout,\n                                              const MinicC0Program *program,\n                                              const MinicRecord *record,\n                                              size_t field_index,\n                                              size_t *alignment) {\n    const MinicRecordField *field;\n    size_t field_size;\n    size_t field_alignment;\n\n    if (layout == NULL || program == NULL || record == NULL || alignment == NULL ||\n        field_index >= record->field_count) {\n        return false;\n    }\n    field = &record->fields[field_index];\n    if (field->is_bit_field ||\n        !minic_data_layout_type(layout, program, field->type, &field_size, &field_alignment)) {\n        return false;\n    }\n    (void)field_size;\n    if (field->is_packed || (record->is_packed && field->explicit_alignment == 0U)) {\n        field_alignment = 1U;\n    }\n    if (field->explicit_alignment != 0U) {\n        if ((field->explicit_alignment & (field->explicit_alignment - 1U)) != 0U) {\n            return false;\n        }\n        if (field->explicit_alignment > field_alignment) {\n            field_alignment = field->explicit_alignment;\n        }\n    }\n    *alignment = field_alignment;\n    return true;\n}\n\n'''
          if 'bool minic_data_layout_record_field_alignment(' not in cs:
              if cs.count(impl_anchor) != 1:
                  raise SystemExit('data-layout implementation anchor mismatch')
              cs = cs.replace(impl_anchor, impl + impl_anchor, 1)
              c.write_text(cs)
          PY
          clang-format-18 -i src/target/data_layout.c src/target/data_layout.h
          git diff --check
      - name: Validate DataLayout seam
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/record-field-alignment-query-v2
          make -j4 check-fast MODE=release BUILD_DIR=build/record-field-alignment-query-v2-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-record-field-alignment-query-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/target/data_layout.c src/target/data_layout.h
          git commit -m 'target: expose record field alignment query'
          git push origin HEAD:product/record-field-alignment-query-v2
