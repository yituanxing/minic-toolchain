name: Materialize RV64 small aggregate ABI

on:
  push:
    branches: [agent/linux-tail-pointer-array-v1]
    paths:
      - tools/dev/materialize-rv64-small-aggregate-abi.py
      - .github/workflows/materialize-rv64-small-aggregate-abi.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linux-tail-pointer-array-v1
          fetch-depth: 0
      - name: Materialize product code
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-rv64-small-aggregate-abi.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/compiler/c0/run-rv64-integer-aggregate-return.sh')
          text = path.read_text()
          old = "grep -F 'ld a0, 0(t0)' \"$assembly\" >/dev/null\ngrep -F 'ld a1, 8(t0)' \"$assembly\" >/dev/null\n"
          new = "grep -F 'ld a0, 0(t5)' \"$assembly\" >/dev/null\ngrep -F 'ld a1, 0(t5)' \"$assembly\" >/dev/null\n"
          if text.count(old) != 1:
              raise SystemExit('legacy aggregate return assertions: expected one match')
          path.write_text(text.replace(old, new, 1))
          PY
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
      - name: Build and run focused gates
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/small-aggregate
          MINIC="$GITHUB_WORKSPACE/build/small-aggregate/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/aggregate-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-rv64-integer-aggregate-return.sh
          MINIC="$GITHUB_WORKSPACE/build/small-aggregate/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/empty-record-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-empty-records.sh
          MINIC="$GITHUB_WORKSPACE/build/small-aggregate/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/array-param-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-array-parameter-adjustment.sh
          MINIC="$GITHUB_WORKSPACE/build/small-aggregate/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/pointer-array-focused" HOST_CC=cc \
            sh tests/compiler/c0/run-static-pointer-arrays.sh
      - name: Write clean product commit
        run: |
          set -Eeuo pipefail
          git rm tools/dev/materialize-rv64-small-aggregate-abi.py \
                 .github/workflows/materialize-rv64-small-aggregate-abi.yml
          git add src/target/riscv64/codegen_support.c \
                  src/target/riscv64/codegen_internal.h \
                  src/target/riscv64/codegen_expression.c \
                  src/target/riscv64/codegen_statement.c \
                  tests/compiler/c0/rv64_integer_aggregate_return.c \
                  tests/compiler/c0/run-rv64-integer-aggregate-return.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(riscv64): support sub-XLEN aggregate ABI chunks'
          git push origin HEAD:agent/linux-tail-pointer-array-v1
