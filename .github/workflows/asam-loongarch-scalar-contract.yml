name: ASAM LoongArch scalar-contract fix verification

on:
  push:
    branches:
      - fix/asam-loongarch-scalar-contract-20261128
  pull_request:
    paths:
      - 'src/target/loongarch64/**'
      - 'tests/target/loongarch64/machine_scalar_type_test.c'
      - '.github/workflows/asam-loongarch-scalar-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Isolated LoongArch scalar gate and real selector regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source change boundaries and whitespace
        run: |
          git diff --check origin/main...HEAD
          git diff --name-only origin/main...HEAD > /tmp/asam-loong-paths
          cat /tmp/asam-loong-paths
          while IFS= read -r path; do
            case "$path" in
              src/target/loongarch64/machine_scalar_type.h|\
              src/target/loongarch64/machine_scalar_source_select.c|\
              src/target/loongarch64/machine_select.c|\
              src/target/loongarch64/machine_llsc_select.c|\
              src/target/loongarch64/machine_pte_select.c|\
              tests/target/loongarch64/machine_scalar_type_test.c|\
              docs/architecture/minic-backend-review-ledger.json|\
              .github/workflows/asam-loongarch-scalar-contract.yml)
                ;;
              *) echo "Unexpected modified path: $path" >&2; exit 1;;
            esac
          done < /tmp/asam-loong-paths

      - name: Respect canonical backend review ledger
        run: |
          python3 tools/ci/minic-backend-review-ledger.py --check

      - name: New real CoreType forged-input regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror \
            -Iinclude -Isrc -ffunction-sections -fdata-sections \
            tests/target/loongarch64/machine_scalar_type_test.c \
            src/core/core_type.c src/target/common/lp64_scalar.c \
            -Wl,--gc-sections -o /tmp/asam-loong-scalar-type
          /tmp/asam-loong-scalar-type

      - name: Existing real LoongArch Core machine selector regressions
        run: |
          make -j2 MODE=release check-loong-machine-core-select | tee /tmp/asam-candidate-core.log

      - name: Compare legacy frame smoke test against clean main
        shell: bash
        run: |
          set -uo pipefail
          git worktree add --detach /tmp/asam-baseline origin/main
          (cd /tmp/asam-baseline && make -j2 MODE=release check-loong-machine-core-select) > /tmp/asam-baseline-core.log 2>&1
          grep '^LOONG_CORE_MIR_' /tmp/asam-baseline-core.log > /tmp/asam-baseline-core.events
          grep '^LOONG_CORE_MIR_' /tmp/asam-candidate-core.log > /tmp/asam-candidate-core.events
          diff -u /tmp/asam-baseline-core.events /tmp/asam-candidate-core.events
          echo 'LoongArch Core MIR: byte-identical test events on main and candidate' >> "$GITHUB_STEP_SUMMARY"
          if make MODE=release check-loong-machine-mir-select > /tmp/asam-candidate-frame.log 2>&1; then
            candidate_status=0
          else
            candidate_status=$?
          fi
          if (cd /tmp/asam-baseline && make MODE=release check-loong-machine-mir-select) > /tmp/asam-baseline-frame.log 2>&1; then
            baseline_status=0
          else
            baseline_status=$?
          fi
          printf 'Legacy frame smoke: baseline=%d candidate=%d\n' "$baseline_status" "$candidate_status"
          if [ "$baseline_status" -eq 0 ] && [ "$candidate_status" -eq 0 ]; then
            echo 'Legacy frame smoke: PASS on baseline and candidate' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$baseline_status" -ne 0 ] && [ "$candidate_status" -ne 0 ] && \
               grep -Fq 'Loong MIR selected frame failed: save_ra' /tmp/asam-baseline-frame.log && \
               grep -Fq 'Loong MIR selected frame failed: save_ra' /tmp/asam-candidate-frame.log; then
            echo 'Legacy frame smoke: SAME PRE-EXISTING FAILURE on main and candidate' >> "$GITHUB_STEP_SUMMARY"
            echo 'The baseline MIR frame test is not counted as a passing regression.'
          else
            echo 'Legacy frame smoke differs from main baseline; rejecting candidate' >&2
            tail -50 /tmp/asam-baseline-frame.log
            tail -50 /tmp/asam-candidate-frame.log
            exit 1
          fi

      - name: Full MiniC compiler build (strict warnings)
        run: |
          make -j4 MODE=release CFLAGS=-Werror

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asam-loongarch-scalar-verification
          path: /tmp/asam-loong-paths
          if-no-files-found: warn
          retention-days: 14
