name: Staging Core RV64 Linux Hybrid Probe

on:
  push:
    branches:
      - staging/core-rv64-hybrid-routing-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-core-rv64-linux-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-hybrid:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned Linux source archive
        id: linux-source-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-cache/linux-6.6.143.tar.xz
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

      - name: Build committed MiniC source
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check
          git diff --exit-code -- include src tools/minic
          make -j4 MODE=release BUILD_DIR=build/linux-hybrid-compiler

      - name: Install RISC-V Linux Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            flex bison bc libelf-dev libssl-dev

      - name: Drive unchanged Linux init main through hybrid routing
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/linux-hybrid-compiler/bin/minic" \
          MINIC_CORE_CODEGEN=basic-v0 \
          BUILD_DIR="$GITHUB_WORKSPACE/build/linux-hybrid" \
          LINUX_ARCHIVE_CACHE="$GITHUB_WORKSPACE/build/linux-cache/linux-6.6.143.tar.xz" \
          CROSS_COMPILE=riscv64-linux-gnu- \
            sh tests/external/linux/probe.sh

          asm="$GITHUB_WORKSPACE/build/linux-hybrid/init-main.s"
          test -s "$asm"
          core_functions=$(grep -Ec '^\.L.*_core_bb0:$' "$asm" || true)
          function_symbols=$(grep -Ec '^\.type .*@function$' "$asm" || true)
          if test "$core_functions" -le 0; then
            printf '%s\n' 'LINUX_HYBRID_ERROR no function routed through Core emitter' >&2
            exit 1
          fi
          printf '%s\n' \
            "LINUX_HYBRID_ROUTING core_functions=$core_functions function_symbols=$function_symbols"
          riscv64-linux-gnu-gcc -c "$asm" -o "$GITHUB_WORKSPACE/build/linux-hybrid/init-main-hybrid.o"
          test -s "$GITHUB_WORKSPACE/build/linux-hybrid/init-main-hybrid.o"

      - name: Upload hybrid routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-hybrid-routing-${{ github.run_id }}
          path: |
            build/linux-hybrid/init-main.s
            build/linux-hybrid/init-main-hybrid.o
            build/linux-hybrid/minic.stderr
            build/linux-hybrid/main-i-inventory.txt
          if-no-files-found: ignore
          retention-days: 7
