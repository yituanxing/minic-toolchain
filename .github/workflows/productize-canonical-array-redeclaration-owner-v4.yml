name: Productize Canonical Array Redeclaration Owner V4
on:
  push:
    branches: [product/canonical-array-redeclaration-owner-v4]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/canonical-array-redeclaration-owner-v4
          fetch-depth: 0
      - name: Apply validated product diff
        run: |
          set -Eeuo pipefail
          mat=tools/dev/.productize-array-owner-v4.py
          git show origin/staging/string-octal-v1:tools/dev/materialize-canonical-array-redeclaration-owner-v1.py > "$mat"
          python3 "$mat"
          rm "$mat"
          cat > tests/compiler/c0/external_array_redeclaration_owner.c <<'EOF'
          extern int tentative_values[];
          int tentative_values[4];
          extern int defined_values[];
          int defined_values[4] = {1, 2, 3, 4};
          int main(void) { return tentative_values[0] + defined_values[3] - 4; }
          EOF
          cat > tests/compiler/c0/run-external-array-redeclaration-owner.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/external-array-redeclaration-owner
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/external_array_redeclaration_owner.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
          chmod +x tests/compiler/c0/run-external-array-redeclaration-owner.sh
          cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-external-array-redeclaration-owner.sh"
          EOF
          clang-format-18 -i src/frontend/parser_function.c tests/compiler/c0/external_array_redeclaration_owner.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/array-owner-v4
          MINIC="$GITHUB_WORKSPACE/build/array-owner-v4/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/array-owner-v4" \
            sh tests/compiler/c0/run-external-array-redeclaration-owner.sh
          make -j4 check-fast MODE=release BUILD_DIR=build/array-owner-v4-fast
      - name: Commit clean product diff
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/productize-canonical-array-redeclaration-owner-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frontend/parser_function.c tests/compiler/c0/external_array_redeclaration_owner.c tests/compiler/c0/run-external-array-redeclaration-owner.sh tests/compiler/c0/run.sh
          git commit -m 'frontend: retire transient external array redeclarations'
          git push origin HEAD:product/canonical-array-redeclaration-owner-v4
