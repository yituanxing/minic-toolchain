name: Materialize Static Record Member Path V1
on:
  push:
    branches: [staging/string-octal-v1]
    paths:
      - tools/dev/materialize-static-record-member-path-v1.py
      - .github/workflows/materialize-static-record-member-path-v1.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize, format and build
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-static-record-member-path-v1.py
          clang-format-18 -i src/frontend/parser_global.c
          git diff --check
          make -j4 MODE=debug BUILD_DIR=build/static-record-path
      - name: Focused nested path and backward scalar relocation
        run: |
          set -Eeuo pipefail
          cat > /tmp/static-record-path.c <<'EOF'
          struct Count { int refs; };
          struct Ns { struct Count count; int inum; void *ops; };
          struct Outer { struct Ns ns; int middle; };
          static int target;
          static struct Outer state = {
              .ns.count = { .refs = 2 },
              .middle = 7,
              .ns.inum = 9,
              .ns.ops = &target,
          };
          int main(void) {
              return state.ns.count.refs == 2 && state.middle == 7 &&
                     state.ns.inum == 9 && state.ns.ops == &target ? 0 : 1;
          }
          EOF
          build/static-record-path/bin/minic -S /tmp/static-record-path.c -o /tmp/static-record-path.s
          grep -F 'target' /tmp/static-record-path.s >/dev/null
          grep -F '  .word 2' /tmp/static-record-path.s >/dev/null
          grep -F '  .word 9' /tmp/static-record-path.s >/dev/null
      - name: Backward aggregate rewrite remains fail-closed
        run: |
          set -Eeuo pipefail
          cat > /tmp/static-record-path-bad.c <<'EOF'
          struct Inner { int a; int b; };
          struct Outer { struct Inner inner; int tail; };
          static struct Outer state = { .inner.a = 1, .tail = 2, .inner = { 3, 4 } };
          int main(void) { return state.inner.a; }
          EOF
          if build/static-record-path/bin/minic -S /tmp/static-record-path-bad.c -o /tmp/static-record-path-bad.s > /tmp/bad.out 2> /tmp/bad.err; then
            echo 'backward aggregate rewrite unexpectedly accepted' >&2
            exit 1
          fi
      - name: Install Linux probe tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - name: Probe unchanged version.i
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          set +e
          MINIC="$GITHUB_WORKSPACE/build/static-record-path/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/static-record-version" CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=1 LINUX_BATCH_LIMIT=1 LINUX_BATCH_JOBS=1 sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/static-record-version/batch-summary.txt
          echo "VERSION_PROBE_STATUS=$status"
      - name: Commit product only
        run: |
          set -Eeuo pipefail
          rm -f tools/dev/materialize-static-record-member-path-v1.py .github/workflows/materialize-static-record-member-path-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/parser_global.c tools/dev/materialize-static-record-member-path-v1.py .github/workflows/materialize-static-record-member-path-v1.yml
          git diff --cached --check
          git commit -m 'frontend: support static record member-path designators'
          git push origin HEAD:staging/string-octal-v1
