name: Gate and Integrate RV64 Caller ABI Hybrid

on:
  push:
    branches: [agent/rv64-caller-abi-linux-v1]

permissions:
  actions: read
  contents: write

concurrency:
  group: rv64-caller-abi-hybrid-gate-integrate
  cancel-in-progress: true

jobs:
  gate-and-integrate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: refactor/rv64-caller-abi-location-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rv64-caller-abi-linux-v1
          fetch-depth: 0

      - name: Verify authoritative hybrid selector boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'argument_index >= parameter_count' \
            tools/dev/materialize-rv64-caller-abi-location-hybrid.py >/dev/null

      - name: Wait for same-head authoritative hybrid Linux gate
        id: hybrid
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow rv64-caller-abi-hybrid-linux-revalidation.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if test -n "$run_id"; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 120); do
            state=$(gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '.status + ":" + (.conclusion // "")')
            echo "hybrid_run=$run_id state=$state"
            case "$state" in
              completed:success)
                exit 0
                ;;
              completed:*)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'hybrid Linux gate did not complete within polling budget' >&2
          exit 1

      - name: Fold proven caller location consumer into feature branch
        shell: bash
        env:
          LINUX_RUN_ID: ${{ steps.hybrid.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$FEATURE_BRANCH"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          test -f tools/dev/materialize-rv64-caller-abi-location-v1.py

          python3 tools/dev/materialize-rv64-caller-abi-location-v1.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          git diff --check
          grep -F 'MinicRiscv64AbiArgumentLocation argument_locations' \
            src/target/riscv64/codegen_expression.c >/dev/null
          grep -F 'stack_argument_count = abi_cursor.stack_slot_count;' \
            src/target/riscv64/codegen_expression.c >/dev/null
          if grep -F 'size_t stack_argument_index;' src/target/riscv64/codegen_expression.c >/dev/null; then
            echo 'legacy caller stack placement cursor remains' >&2
            exit 1
          fi

          cat > .github/workflows/rv64-caller-abi-location-validation.yml <<'YAML'
          name: RV64 Caller ABI Location Validation

          on:
            push:
              branches:
                - refactor/rv64-caller-abi-location-v1
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: rv64-caller-abi-location-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            host:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4

                - name: Verify canonical caller location consumer
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    grep -F 'MinicRiscv64AbiArgumentLocation argument_locations' \
                      src/target/riscv64/codegen_expression.c >/dev/null
                    grep -F 'stack_argument_count = abi_cursor.stack_slot_count;' \
                      src/target/riscv64/codegen_expression.c >/dev/null
                    if grep -F 'size_t stack_argument_index;' src/target/riscv64/codegen_expression.c >/dev/null; then
                      echo 'legacy caller stack placement cursor remains' >&2
                      exit 1
                    fi

                - name: Verify production source inventory
                  run: sh tools/maintenance/check-production-source-inventory.sh

                - name: Check committed source formatting
                  run: CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

                - name: Run release host contracts
                  run: make -j2 MODE=release BUILD_DIR=build/rv64-caller-abi-host CFLAGS=-Werror check-fast

                - name: Run sanitizer AST contracts
                  run: make -j2 MODE=sanitize BUILD_DIR=build/rv64-caller-abi-sanitize check-ast-contract

                - name: Run frozen Foundation focused semantics
                  shell: bash
                  env:
                    MINIC: ${{ github.workspace }}/build/rv64-caller-abi-host/bin/minic
                    BUILD_DIR: ${{ github.workspace }}/build/rv64-caller-abi-foundation-focused
                    HOST_CC: cc
                  run: sh tools/dev/pr76-focused.sh

            full:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              env:
                DEBIAN_FRONTEND: noninteractive
              steps:
                - uses: actions/checkout@v4

                - name: Verify canonical caller location consumer
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    grep -F 'MinicRiscv64AbiArgumentLocation argument_locations' \
                      src/target/riscv64/codegen_expression.c >/dev/null
                    grep -F 'stack_argument_count = abi_cursor.stack_slot_count;' \
                      src/target/riscv64/codegen_expression.c >/dev/null
                    if grep -F 'size_t stack_argument_index;' src/target/riscv64/codegen_expression.c >/dev/null; then
                      echo 'legacy caller stack placement cursor remains' >&2
                      exit 1
                    fi

                - name: Restore RISC-V package archives
                  id: rv64-cache
                  uses: actions/cache@v4
                  with:
                    path: ~/.cache/minic-apt/archives
                    key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

                - name: Run complete compiler gate
                  env:
                    RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
                  run: bash .github/scripts/compiler-c0-full-gate.sh
          YAML

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/target/riscv64/codegen_expression.c \
            .github/workflows/rv64-caller-abi-location-validation.yml
          git rm tools/dev/materialize-rv64-caller-abi-location-v1.py
          git diff --cached --check
          git commit \
            -m 'refactor(abi): consume abstract locations at RV64 caller' \
            -m "Frozen Linux formal-compatible hybrid run: $LINUX_RUN_ID"
          git push origin HEAD:"$FEATURE_BRANCH"
