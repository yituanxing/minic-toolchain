name: Gate and Integrate RV64 Caller ABI Hybrid

on:
  push:
    branches: [agent/rv64-caller-abi-linux-v1]

permissions:
  actions: read
  contents: write

concurrency:
  group: rv64-caller-abi-hybrid-gate-integrate
  cancel-in-progress: true

jobs:
  gate-and-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: refactor/rv64-caller-abi-location-v1
      FOUNDATION_BRANCH: refactor/foundation-v1
      EXPECTED_FEATURE_HEAD: ca7dd00a080f018574ebe5e51220fb519f29adcd
      EXPECTED_FOUNDATION_HEAD: 7bbefb7252a6ba52541478a0412a22dc4701334c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rv64-caller-abi-linux-v1
          fetch-depth: 0

      - name: Verify authoritative hybrid selector boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'argument_index >= parameter_count' \
            tools/dev/materialize-rv64-caller-abi-location-hybrid.py >/dev/null
          grep -F 'MINIC_RISCV64_ABI_VALUE_INDIRECT' \
            tools/dev/materialize-rv64-caller-abi-location-hybrid.py >/dev/null
          grep -F 'value->storage_size != 8U && value->storage_size != 16U' \
            tools/dev/materialize-rv64-caller-abi-location-hybrid.py >/dev/null

      - name: Wait for same-head authoritative hybrid Linux gate
        id: hybrid
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow rv64-caller-abi-hybrid-linux-revalidation.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if test -n "$run_id"; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 120); do
            state=$(gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '.status + ":" + (.conclusion // "")')
            echo "hybrid_run=$run_id state=$state"
            case "$state" in
              completed:success)
                exit 0
                ;;
              completed:*)
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'hybrid Linux gate did not complete within polling budget' >&2
          exit 1

      - name: Fold, validate and publish canonical caller slice
        shell: bash
        env:
          LINUX_RUN_ID: ${{ steps.hybrid.outputs.run_id }}
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin "$FEATURE_BRANCH" "$FOUNDATION_BRANCH"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$EXPECTED_FEATURE_HEAD"
          test "$(git rev-parse "origin/$FOUNDATION_BRANCH")" = "$EXPECTED_FOUNDATION_HEAD"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          test -f tools/dev/materialize-rv64-caller-abi-location-v1.py

          python3 tools/dev/materialize-rv64-caller-abi-location-v1.py
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh write
          grep -F 'MinicRiscv64AbiArgumentLocation argument_locations' \
            src/target/riscv64/codegen_expression.c >/dev/null
          grep -F 'stack_argument_count = abi_cursor.stack_slot_count;' \
            src/target/riscv64/codegen_expression.c >/dev/null
          if grep -F 'size_t stack_argument_index;' src/target/riscv64/codegen_expression.c >/dev/null; then
            echo 'legacy caller stack placement cursor remains' >&2
            exit 1
          fi

          mkdir -p docs/architecture
          cat > docs/architecture/rv64-caller-abi-location-v1.md <<'DOC'
          # RV64 caller ABI location ownership v1

          This slice makes the checked-in RV64 call emitter consume the canonical
          `MinicRiscv64AbiCursor` / `MinicRiscv64AbiArgumentLocation` result once per
          call instead of independently recomputing integer-register, floating-register,
          and stack placement in two backend passes.

          The C evaluation contract is intentionally unchanged: arguments are still
          evaluated in source order and staged before physical placement. The slice only
          changes ownership of the later ABI placement decision.

          Formal v1 remains deliberately bounded. It covers the already-frozen scalar,
          fixed floating-point, and fixed 8/16-byte integer-aggregate cases. Zero-sized
          aggregates, sub-XLEN aggregate extensions, variadic aggregate placement, and
          greater-than-16-byte indirect aggregate passing remain outside this formal slice
          until their psABI semantics are promoted deliberately.

          Frozen Linux 6.6.143 `init/main.i` was revalidated with a hybrid pressure
          harness: formal-v1-compatible calls use the new location consumer, while
          discovery-only ABI shapes retain the already-proven discovery emission. The
          exact hybrid run for this checked-in fold is `@LINUX_RUN_ID@` and completed
          with the 90,928-line full-TU gate.

          This preserves the future Core IR seam: target-neutral call semantics stay above
          the seam; TargetABI owns abstract locations; the RV64 emitter alone maps those
          locations to textual registers and stack operations.
          DOC
          sed -i 's/^          //' docs/architecture/rv64-caller-abi-location-v1.md
          sed -i "s/@LINUX_RUN_ID@/$LINUX_RUN_ID/" docs/architecture/rv64-caller-abi-location-v1.md

          git rm tools/dev/materialize-rv64-caller-abi-location-v1.py
          git rm .github/workflows/rv64-caller-abi-location-validation.yml
          git diff --check
          sh tools/maintenance/check-production-source-inventory.sh
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

          make -j2 MODE=release BUILD_DIR=build/rv64-caller-abi-host CFLAGS=-Werror check-fast
          make -j2 MODE=sanitize BUILD_DIR=build/rv64-caller-abi-sanitize check-ast-contract
          MINIC="$GITHUB_WORKSPACE/build/rv64-caller-abi-host/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/rv64-caller-abi-foundation-focused" \
            HOST_CC=cc sh tools/dev/pr76-focused.sh
          bash .github/scripts/compiler-c0-full-gate.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/target/riscv64/codegen_expression.c \
            docs/architecture/rv64-caller-abi-location-v1.md
          git diff --cached --check

          changed=$(git diff --cached --name-only "$EXPECTED_FOUNDATION_HEAD" | sort)
          expected=$(printf '%s\n' \
            docs/architecture/rv64-caller-abi-location-v1.md \
            src/target/riscv64/codegen_expression.c | sort)
          test "$changed" = "$expected"

          git commit \
            -m 'refactor(abi): consume abstract locations at RV64 caller' \
            -m "Frozen Linux formal-compatible hybrid run: $LINUX_RUN_ID"
          git push origin HEAD:"$FEATURE_BRANCH"
