name: MiniPP Linux Exact 2000-2999

concurrency:
  group: minipp-linux-2000-2999-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'toolchain/minipp-*'
    paths:
      - 'preprocessor/**'
      - 'tools/minic-cpp/**'
      - 'tests/preprocessor/**'
      - '.github/workflows/minipp-linux-exact-2000-2999.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  MINIPP_LINUX_ARCHIVE_SHA256: dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932

jobs:
  reference2000_2999:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minipp-linux-3000]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      contract_sha: ${{ steps.identity.outputs.contract_sha }}
      cache_key: ${{ steps.identity.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install frozen-oracle prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils

      - name: Prepare Linux and freeze mega1000 preprocessing contract
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-ref1000e-work"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"

          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts

          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/kbuild-plan.raw" 2>"$work/kbuild-plan.stderr"
          plan_status=$?
          set -e
          echo "MINIPP_REFERENCE1000_PLAN_STATUS=$plan_status"

          python3 tests/preprocessor/freeze_linux_kbuild_manifest.py \
            --plan "$work/kbuild-plan.raw" \
            --src "$src" \
            --out "$out" \
            --offset 2000 --limit 1000 \
            --tsv "$work/mega1000.tsv" \
            --sources "$work/mega1000.txt" \
            --contract "$work/mega1000-contract.jsonl"

          contract_sha=$(sha256sum "$work/mega1000-contract.jsonl" | cut -d' ' -f1)
          gcc_fullversion=$(riscv64-linux-gnu-gcc -dumpfullversion)
          gcc_machine=$(riscv64-linux-gnu-gcc -dumpmachine)
          gcc_pkg=$(dpkg-query -W -f='${Version}' gcc-riscv64-linux-gnu 2>/dev/null || true)
          gcc_sig=$(printf '%s\n%s\n%s\n' "$gcc_fullversion" "$gcc_machine" "$gcc_pkg" | sha256sum | cut -d' ' -f1)
          logic_sig=$(sha256sum \
            tests/preprocessor/freeze_linux_kbuild_manifest.py \
            tests/preprocessor/build_reference_predefines.sh \
            tests/preprocessor/build_linux_reference_corpus.py \
            tests/preprocessor/run_linux_cached_exact.py | sha256sum | cut -d' ' -f1)
          cache_key="minipp-linux-ref1000e-v1-linux-6.6.143-$MINIPP_LINUX_ARCHIVE_SHA256-$contract_sha-$gcc_sig-$logic_sig"

          echo "contract_sha=$contract_sha" >>"$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >>"$GITHUB_OUTPUT"
          echo "MINIPP_REFERENCE1000_IDENTITY=PASS contract_sha256=$contract_sha gcc=$gcc_fullversion machine=$gcc_machine"

      - name: Restore frozen GCC mega1000 corpus
        id: ref-cache
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref1000e-corpus
          key: ${{ steps.identity.outputs.cache_key }}

      - name: Build GCC mega1000 reference corpus on cache miss
        if: steps.ref-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-ref1000e-work"
          python3 tests/preprocessor/build_linux_reference_corpus.py \
            --contract "$work/mega1000-contract.jsonl" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --corpus "$GITHUB_WORKSPACE/build/minipp-linux-ref1000e-corpus" \
            --gcc riscv64-linux-gnu-gcc \
            --jobs 12 \
            --linux-id "linux-6.6.143-$MINIPP_LINUX_ARCHIVE_SHA256-rv64-defconfig-offset2000"
          echo "MINIPP_REFERENCE1000_CACHE=MISS built=1000"

      - name: Verify frozen GCC mega1000 corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-ref1000e-work"
          corpus="$GITHUB_WORKSPACE/build/minipp-linux-ref1000e-corpus"
          test -s "$corpus/meta.json"
          test -s "$corpus/contract.jsonl"
          test "$(find "$corpus/refs" -maxdepth 1 -type f -name '*.gcc.i' | wc -l)" -eq 1000
          contract_sha=$(sha256sum "$work/mega1000-contract.jsonl" | cut -d' ' -f1)
          python3 - "$corpus/meta.json" "$contract_sha" <<'PY'
          import json
          import sys
          meta = json.load(open(sys.argv[1]))
          assert meta["selected"] == 1000, meta
          assert meta["contract_sha256"] == sys.argv[2], meta
          print(
              "MINIPP_REFERENCE1000_VERIFY=PASS "
              f"selected={meta['selected']} predef_contexts={meta['predef_contexts']} "
              f"bytes={meta['total_reference_bytes']}"
          )
          PY
          if [[ "${{ steps.ref-cache.outputs.cache-hit }}" == true ]]; then
            echo "MINIPP_REFERENCE1000_CACHE=HIT"
          fi

      - name: Save frozen GCC mega1000 corpus
        if: steps.ref-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/minipp-linux-ref1000e-corpus
          key: ${{ steps.identity.outputs.cache_key }}

      - name: Preserve reference identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-reference2000_2999-identity
          path: |
            build/minipp-linux-ref1000e-work/mega1000.tsv
            build/minipp-linux-ref1000e-work/mega1000.txt
            build/minipp-linux-ref1000e-work/mega1000-contract.jsonl
            build/minipp-linux-ref1000e-corpus/meta.json
            build/minipp-linux-ref1000e-corpus/sha256sums.txt
            build/minipp-linux-ref1000e-corpus/gcc-stderr/**
          if-no-files-found: ignore
          retention-days: 3

  sample32_2000_2999:
    needs: reference2000_2999
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils

      - name: Build independent MiniPP
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-1000e-sample toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-1000e-sample all
          test -x build/minipp-linux-1000e-sample/bin/minic-cpp

      - name: Prepare Linux and reproduce frozen contract
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-1000e-sample-work"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/kbuild-plan.raw" 2>"$work/kbuild-plan.stderr"
          set -e
          python3 tests/preprocessor/freeze_linux_kbuild_manifest.py \
            --plan "$work/kbuild-plan.raw" --src "$src" --out "$out" --offset 2000 --limit 1000 \
            --tsv "$work/mega1000.tsv" --sources "$work/mega1000.txt" \
            --contract "$work/mega1000-contract.jsonl"
          test "$(sha256sum "$work/mega1000-contract.jsonl" | cut -d' ' -f1)" = "${{ needs.reference2000_2999.outputs.contract_sha }}"
          echo "MINIPP_SAMPLE16_CONTRACT=PASS"

      - name: Restore frozen GCC mega1000 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref1000e-corpus
          key: ${{ needs.reference2000_2999.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Replay cached coverage sample32
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-1000e-sample-work"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$work/mega1000-contract.jsonl" \
            --corpus "$GITHUB_WORKSPACE/build/minipp-linux-ref1000e-corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-1000e-sample/bin/minic-cpp" \
            --work "$work/replay" \
            --indices "$GITHUB_WORKSPACE/tests/preprocessor/linux-mega1000-sample32-indices.txt" \
            --jobs 8 \
            --label sample32-2000-2999

      - name: Preserve sample32 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-mega1000-sample32
          path: |
            build/minipp-linux-1000e-sample-work/replay/headline.txt
            build/minipp-linux-1000e-sample-work/replay/results.tsv
            build/minipp-linux-1000e-sample-work/replay/results.json
            build/minipp-linux-1000e-sample-work/replay/failure-pool.tsv
            build/minipp-linux-1000e-sample-work/replay/diff/**
            build/minipp-linux-1000e-sample-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3

  product1000_2000_2999:
    needs: reference2000_2999
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            bc bison flex libssl-dev libelf-dev make curl xz-utils

      - name: Build independent MiniPP
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-1000e toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-1000e all
          test -x build/minipp-linux-1000e/bin/minic-cpp

      - name: Prepare Linux and reproduce frozen contract
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-1000e-work"
          archive="$work/linux-6.6.143.tar.xz"
          src="$work/linux-6.6.143"
          out="$work/out"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts
          set +e
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -n -j1 V=1 \
            >"$work/kbuild-plan.raw" 2>"$work/kbuild-plan.stderr"
          set -e
          python3 tests/preprocessor/freeze_linux_kbuild_manifest.py \
            --plan "$work/kbuild-plan.raw" --src "$src" --out "$out" --offset 2000 --limit 1000 \
            --tsv "$work/mega1000.tsv" --sources "$work/mega1000.txt" \
            --contract "$work/mega1000-contract.jsonl"
          test "$(sha256sum "$work/mega1000-contract.jsonl" | cut -d' ' -f1)" = "${{ needs.reference2000_2999.outputs.contract_sha }}"
          echo "MINIPP_PRODUCT1000_CONTRACT=PASS"

      - name: Restore frozen GCC mega1000 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref1000e-corpus
          key: ${{ needs.reference2000_2999.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Replay cached product1000
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-1000e-work"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$work/mega1000-contract.jsonl" \
            --corpus "$GITHUB_WORKSPACE/build/minipp-linux-ref1000e-corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-1000e/bin/minic-cpp" \
            --work "$work/replay" \
            --jobs 8 \
            --label product1000-2000-2999

      - name: Preserve product1000 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-exact-2000-2999
          path: |
            build/minipp-linux-1000e-work/replay/headline.txt
            build/minipp-linux-1000e-work/replay/results.tsv
            build/minipp-linux-1000e-work/replay/results.json
            build/minipp-linux-1000e-work/replay/failure-pool.tsv
            build/minipp-linux-1000e-work/replay/diff/**
            build/minipp-linux-1000e-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3
