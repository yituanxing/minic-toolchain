name: Productize Linux tail batch8 repair v1

on:
  pull_request:
    branches:
      - infra/linux-tail-batch8-productizer-v2
    paths:
      - 'tools/dev/materialize-linux-tail-batch8-difference-v1.py'

permissions:
  contents: write

jobs:
  productize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact work head
        uses: actions/checkout@v4
        with:
          ref: frontend/linux-tail-batch8-v1

      - name: Separate pointer relational and difference semantics
        run: |
          set -Eeuo pipefail
          python3 tools/dev/materialize-linux-tail-batch8-difference-v1.py
          clang-format -i src/frontend/ast.c \
                          src/frontend/ast.h \
                          src/frontend/parser_expression.c \
                          src/frontend/ast_verifier.c
          git diff --check

      - name: Build and focused regression gates
        run: |
          set -Eeuo pipefail
          make -j4 CFLAGS=-Werror
          MINIC="$PWD/build/debug/bin/minic" BUILD_DIR="$PWD/build/debug" \
            sh tests/compiler/c0/run-gnu-void-pointer-arithmetic.sh
          MINIC="$PWD/build/debug/bin/minic" BUILD_DIR="$PWD/build/debug" \
            sh tests/compiler/c0/run-linux-tail-batch8.sh

      - name: Publish repaired clean product
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/dev/materialize-linux-tail-batch8-difference-v1.py
          git add src/frontend/ast.c \
                  src/frontend/ast.h \
                  src/frontend/parser_expression.c \
                  src/frontend/ast_verifier.c
          git diff --cached --check
          git commit -m 'frontend: separate pointer relational and difference semantics'
          git push origin HEAD:frontend/linux-tail-batch8-v1
