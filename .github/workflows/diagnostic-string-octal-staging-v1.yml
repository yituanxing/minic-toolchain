name: Diagnostic First100 Convergence V1

on:
  push:
    branches:
      - staging/string-octal-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux probe tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev

      - name: Build MiniC and materialize probe helper
        run: |
          set -Eeuo pipefail
          mkdir -p tests/external/linux
          git show origin/diagnostic/linux-first100-variadic-stack-v0:tests/external/linux/batch_probe.sh > tests/external/linux/batch_probe.sh
          chmod +x tests/external/linux/batch_probe.sh
          make -j4 MODE=debug BUILD_DIR=build/first100-convergence-compiler

      - name: Probe fixed Linux first100
        run: |
          set -Eeuo pipefail
          set +e
          MINIC="$GITHUB_WORKSPACE/build/first100-convergence-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/first100-convergence" \
          CROSS_COMPILE=riscv64-linux-gnu- LINUX_BATCH_OFFSET=0 LINUX_BATCH_LIMIT=100 LINUX_BATCH_JOBS=4 \
            sh tests/external/linux/batch_probe.sh
          status=$?
          set -e
          cat build/first100-convergence/batch-summary.txt
          echo "FIRST100_PROBE_STATUS=$status"

      - name: Print source context for every remaining failure
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('build/first100-convergence')
          summary = root / 'batch-summary.txt'
          lines = summary.read_text(errors='replace').splitlines()
          rx = re.compile(r'^\s*index=(\d+)\s+status=FAIL\s+input=(\S+)\s+line=(\d+)\b')
          failures = []
          for line in lines:
              m = rx.match(line)
              if m:
                  message = line.split(' message=', 1)[1] if ' message=' in line else ''
                  failures.append((int(m.group(1)), m.group(2), int(m.group(3)), message))
          print(f'CONTEXT_FAILURE_COUNT={len(failures)}')
          for index, rel, line_no, message in failures:
              matches = list(root.rglob(Path(rel).name))
              exact = [p for p in matches if str(p).endswith(rel)]
              path = exact[0] if exact else (matches[0] if matches else None)
              print(f'=== FAILURE index={index} input={rel} line={line_no} message={message} ===')
              if path is None:
                  print('SOURCE_NOT_FOUND')
                  continue
              source = path.read_text(errors='replace').splitlines()
              lo, hi = ((1, min(len(source), 30)) if line_no <= 1
                        else (max(1, line_no - 12), min(len(source), line_no + 12)))
              for no in range(lo, hi + 1):
                  marker = '>>' if no == line_no else '  '
                  print(f'{marker} {no:6d}: {source[no-1]}')
          PY

      # Refresh marker: canonical incomplete-array reuse is now part of the probed code.
