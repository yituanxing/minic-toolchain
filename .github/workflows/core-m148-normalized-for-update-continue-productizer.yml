name: Core M149 Parser Tail Continue Provenance Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M149
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M149_PARSER_TAIL_CONTINUE_PROVENANCE_OWNER' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require production baseline
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          grep -Fq 'M134_UNREACHABLE_TAIL_OWNER' src/core/core_lower.c
          ! grep -Fq 'M137_DETACHED_LOOP_CONTINUE_OWNER' src/core/core_lower.c
          ! grep -Fq 'M149_PARSER_TAIL_CONTINUE_PROVENANCE_OWNER' src/core/core_lower.c

      - name: Apply M149 candidate bundle
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m137-detached-loop-continue-owner.py
          python3 tools/ci/apply-m146-opportunistic-detached-continue.py
          python3 tools/ci/apply-m141-scoped-loop-continue-tail.py
          python3 tools/ci/apply-m142-nonedge-cleanup-metadata.py
          python3 tools/ci/apply-m144-unreferenced-loop-label-metadata.py
          python3 tools/ci/apply-m147-normalized-for-continue-binding.py
          python3 tools/ci/apply-m148-normalized-for-update-continue-cfg.py
          python3 tools/ci/apply-m149-parser-tail-continue-provenance.py
          git diff --check
          grep -Fq 'M149_PARSER_TAIL_CONTINUE_PROVENANCE_OWNER' src/core/core_lower.c
          ! grep -Fq 'M137_DETACHED_LOOP_CONTINUE_OWNER' src/core/core_lower.c
          ! grep -Fq 'core_resolve_detached_while_continue_label' src/core/core_lower.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m149-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m149-product-check

      - name: Run isolated strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m149-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m149-product-regression"
          mkdir -p "$work"
          for name in m141_scoped_loop_continue_tail m142_nonedge_cleanup_metadata m144_unreferenced_loop_label_metadata m147_normalized_for_continue_binding m148_for_update_continue_cfg m149_parser_tail_continue_provenance; do
            cc -E -P -std=gnu11 -x c "tests/compiler/c0/${name}.c" -o "$work/${name}.i"
            MINIC_CORE_IR=strict "$compiler" -S "$work/${name}.i" -o "$work/${name}.s"
          done
          grep -F 'plain_while_continue:' "$work/m149_parser_tail_continue_provenance.s" >/dev/null
          grep -F 'for_update_continue:' "$work/m149_parser_tail_continue_provenance.s" >/dev/null
          grep -F 'for_unbounded_continue:' "$work/m149_parser_tail_continue_provenance.s" >/dev/null
          printf '%s\n' 'CORE_M149_STRICT_REGRESSION PASS'

      - name: Replay M145 regression controls
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m149-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m149-product-controls"
          indices='9,54,66,96,229,296,306,325,330,333,334,337,345,353,357,367,382,387,444,449,451,465,468,484'
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices "$indices"
          replay_status=$?
          set -e
          printf 'CORE_M149_CONTROL_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m149-product-controls')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          bad=[r for r in rows if r['status'] != 'PASS']
          if summary['selected'] != 24 or summary['error'] != 0 or summary['preprocess_missing'] != 0 or bad:
              raise SystemExit(f'M149 failed controls: summary={summary} bad={bad}')
          print('CORE_M149_CONTROLS selected=24 pass=24 unsupported=0 error=0')
          PY

      - name: Replay focused pair
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m149-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m149-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 2 \
            --indices '95,98'
          replay_status=$?
          set -e
          printf 'CORE_M149_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 10 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m149-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          bad=[r for r in rows if r['status'] != 'PASS']
          for row in rows:
              print(f"CORE_M149_INDEX_{row['index']} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
          if summary['selected'] != 2 or summary['error'] != 0 or summary['preprocess_missing'] != 0 or bad:
              raise SystemExit(f'M149 focused pair did not graduate: summary={summary} bad={bad}')
          print('CORE_M149_FOCUSED selected=2 pass=2 unsupported=0 error=0')
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m149-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m149-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M149_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m149-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M149 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 487:
              raise SystemExit(f"M149 produced no strict500 gain: pass={summary['pass']} baseline=487")
          print(f"CORE_M149_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M149 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
            tests/compiler/c0/m141_scoped_loop_continue_tail.c \
            tests/compiler/c0/m142_nonedge_cleanup_metadata.c \
            tests/compiler/c0/m144_unreferenced_loop_label_metadata.c \
            tests/compiler/c0/m147_normalized_for_continue_binding.c \
            tests/compiler/c0/m148_for_update_continue_cfg.c \
            tests/compiler/c0/m149_parser_tail_continue_provenance.c
          git diff --cached --quiet && { echo 'no M149 semantic changes'; exit 1; }
          git commit -m 'core: derive normalized-for continue from parser tail'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M149 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m149-parser-tail-continue-${{ github.sha }}
          path: |
            build/m149-product-regression/**
            build/m149-product-controls/**
            build/m149-product-focused/**
            build/m149-product-full500/**
          if-no-files-found: warn
