name: Core M152 Enum Bit Field Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M152
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M152_UNSIGNED_ENUM_BIT_FIELD_OWNER' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require exact semantic predecessor
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          grep -Fq 'M151_INDIRECT_CALL_BATCH_OWNER' src/core/core_lower.c
          ! grep -Fq 'M152_UNSIGNED_ENUM_BIT_FIELD_OWNER' src/core/core_lower.c
          ! grep -Fq 'M152_NESTED_RECORD_MEMBER_ADDRESS_OWNER' src/core/core_lower.c

      - name: Apply M152 candidate
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m152-nested-member-address.py
          git diff --check
          grep -Fq 'M152_UNSIGNED_ENUM_BIT_FIELD_OWNER' src/core/core_lower.c
          test -s tests/compiler/c0/m152_enum_bit_field_write.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m152-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m152-product-check

      - name: Run isolated strict regression
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m152-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m152-product-regression"
          mkdir -p "$work"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m152_enum_bit_field_write.c \
            -o "$work/m152_enum_bit_field_write.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/m152_enum_bit_field_write.i" \
            -o "$work/m152_enum_bit_field_write.s"
          test -s "$work/m152_enum_bit_field_write.s"
          echo 'CORE_M152_STRICT_REGRESSION unsigned-enum-bit-field-write=PASS'

      - name: Replay current strict500 tail
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m152-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m152-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 \
            --indices '60,193,195,252,258,292,414,454'
          status=$?
          set -e
          echo "CORE_M152_FOCUSED_REPLAY_STATUS=$status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" --examples 30 \
            --json-out "$work/frontier-summary.json" --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/m152-product-focused')
          rows=json.loads((w/'batch-results.json').read_text())
          s=json.loads((w/'frontier-summary.json').read_text())
          by_index={int(r['index']): r for r in rows}
          if s['selected'] != 8 or s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit(f'M152 focused ERROR/missing: {s}')
          baselines={195:96028, 454:76047}
          for index, old_line in baselines.items():
              row=by_index[index]
              new_line=int(row.get('first_error_line') or 0)
              advanced=row['status'] == 'PASS' or new_line > old_line
              print(f"CORE_M152_TARGET index={index} status={row['status']} old_line={old_line} new_line={new_line} advanced={int(advanced)}")
              if not advanced:
                  raise SystemExit(f'M152 target {index} did not advance: {row}')
          for r in rows:
              print(f"CORE_M152_INDEX_{r['index']} status={r['status']} line={r.get('first_error_line')} message={r.get('message')}")
          print(f"CORE_M152_FOCUSED selected=8 pass={s['pass']} unsupported={s['unsupported']} error=0")
          print((w/'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m152-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m152-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" --jobs 4 --offset 0 --limit 500 --sample-count 0
          status=$?
          set -e
          echo "CORE_M152_FULL500_REPLAY_STATUS=$status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" --examples 30 \
            --json-out "$work/frontier-summary.json" --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" --expect-selected 500 \
            --json-out "$work/progress-summary.json" --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=Path('build/m152-product-full500')
          s=json.loads((w/'frontier-summary.json').read_text())
          if s['selected'] != 500 or s['error'] != 0 or s['preprocess_missing'] != 0:
              raise SystemExit(f'M152 full500 ERROR/missing: {s}')
          if s['pass'] < 492:
              raise SystemExit(f"M152 strict500 regression: pass={s['pass']} baseline=492")
          print(f"CORE_M152_FULL500 selected=500 pass={s['pass']} unsupported={s['unsupported']} error=0")
          print((w/'progress-summary.txt').read_text())
          print((w/'reason-summary.txt').read_text())
          PY

      - name: Commit M152 semantic cut
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/compiler/c0/m152_enum_bit_field_write.c
          git diff --cached --quiet && { echo 'no M152 semantic changes'; exit 1; }
          git commit -m 'core: lower unsigned enum bit-field writes'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M152 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m152-enum-bit-field-${{ github.sha }}
          path: |
            build/m152-product-regression/**
            build/m152-product-focused/**
            build/m152-product-full500/**
          if-no-files-found: warn
