name: Core M151 Indirect Call Batch Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M151
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M151_INDIRECT_CALL_BATCH_OWNER' src/core/core_ir.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require exact M149 production baseline
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          grep -Fq 'M149_PARSER_TAIL_CONTINUE_PROVENANCE_OWNER' src/core/core_lower.c
          ! grep -Fq 'M150_INDIRECT_VARIADIC_CALL_SIGNATURE_OWNER' src/core/core_ir.h
          ! grep -Fq 'M151_INDIRECT_CALL_BATCH_OWNER' src/core/core_ir.c

      - name: Apply M151 batch candidate
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m150-indirect-variadic-call-signature.py
          python3 tools/ci/apply-m151-indirect-call-batch.py
          python3 tools/ci/apply-m151b-indirect-verifier-cleanup.py
          git diff --check
          grep -Fq 'M150_INDIRECT_VARIADIC_CALL_SIGNATURE_OWNER' src/core/core_ir.h
          grep -Fq 'M151_INDIRECT_CALL_BATCH_OWNER' src/core/core_ir.c
          grep -Fq 'M151_INDIRECT_CALL_BATCH_OWNER' src/core/core_lower.c
          grep -Fq 'M151_INDIRECT_CALL_BATCH_OWNER' src/target/riscv64/core_codegen.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m151-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m151-product-check

      - name: Run isolated strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m151-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m151-product-regression"
          mkdir -p "$work"
          for name in m150_indirect_variadic_call m151_indirect_call_batch; do
            cc -E -P -std=gnu11 -x c "tests/compiler/c0/${name}.c" -o "$work/${name}.i"
            MINIC_CORE_IR=strict "$compiler" -S "$work/${name}.i" -o "$work/${name}.s"
            grep -F 'jalr' "$work/${name}.s" >/dev/null
          done
          printf '%s\n' 'CORE_M151_STRICT_REGRESSION variadic+record-indirect=PASS'

      - name: Replay all current strict500 blockers
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m151-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m151-product-focused"
          indices='60,193,195,217,252,258,265,292,352,414,454'
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices "$indices"
          replay_status=$?
          set -e
          printf 'CORE_M151_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m151-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          for row in rows:
              print(f"CORE_M151_INDEX_{row['index']} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
          if summary['selected'] != 11 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M151 focused batch ERROR/missing: {summary}')
          if summary['pass'] < 1:
              raise SystemExit(f'M151 batch produced no focused advancement: {summary}')
          print(f"CORE_M151_FOCUSED selected=11 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m151-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m151-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M151_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m151-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M151 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 489:
              raise SystemExit(f"M151 produced no strict500 gain: pass={summary['pass']} baseline=489")
          print(f"CORE_M151_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M151 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c \
            src/target/riscv64/core_codegen.c \
            tests/compiler/c0/m150_indirect_variadic_call.c \
            tests/compiler/c0/m151_indirect_call_batch.c
          git diff --cached --quiet && { echo 'no M151 semantic changes'; exit 1; }
          git commit -m 'core: share indirect call argument ABI'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M151 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m151-indirect-call-batch-${{ github.sha }}
          path: |
            build/m151-product-regression/**
            build/m151-product-focused/**
            build/m151-product-full500/**
          if-no-files-found: warn
