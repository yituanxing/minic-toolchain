name: Productize Runtime Record Zero Shorthand V1
on:
  push:
    branches: [product/runtime-record-zero-shorthand-v1]
permissions:
  contents: write
jobs:
  productize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/runtime-record-zero-shorthand-v1
          fetch-depth: 0
      - name: Apply validate and persist
        shell: bash
        run: |
          set -u
          out=diagnostics/runtime-record-zero-shorthand-v1
          mkdir -p "$out"
          status=0
          stage=patch
          python3 - <<'PY' >"$out/patch.txt" 2>&1 || status=$?
          from pathlib import Path
          p=Path('src/frontend/parser_statement.c')
          s=p.read_text()
          anchor='''    if (!minic_parser_advance(parser)) {\n        return false;\n    }\n    if (parser->current.kind != MINIC_TOKEN_DOT) {\n'''
          replacement='''    if (!minic_parser_advance(parser)) {\n        return false;\n    }\n    if (parser->current.kind == MINIC_TOKEN_INTEGER_CONSTANT) {\n        const MinicExpression *target;\n        const MinicRecord *record;\n        MinicParser probe;\n        int zero_value;\n        bool zero_shorthand;\n\n        target = minic_c0_program_expression(parser->program, target_id);\n        record = target != NULL && minic_type_is_record(target->type)\n                     ? minic_c0_program_record(parser->program, target->type.record_id)\n                     : NULL;\n        probe = *parser;\n        zero_shorthand = record != NULL && !record->is_union &&\n                         minic_parser_parse_integer_value(&probe, &zero_value) &&\n                         zero_value == 0;\n        if (zero_shorthand && probe.current.kind == MINIC_TOKEN_COMMA) {\n            zero_shorthand = minic_parser_advance(&probe) &&\n                             probe.current.kind == MINIC_TOKEN_RBRACE;\n        } else if (zero_shorthand) {\n            zero_shorthand = probe.current.kind == MINIC_TOKEN_RBRACE;\n        }\n        if (zero_shorthand) {\n            int parsed_zero;\n\n            if (!minic_parser_parse_integer_value(parser, &parsed_zero)) {\n                return false;\n            }\n            if (parser->current.kind == MINIC_TOKEN_COMMA && !minic_parser_advance(parser)) {\n                return false;\n            }\n            if (parser->current.kind != MINIC_TOKEN_RBRACE) {\n                minic_parser_error(parser, "expected '}' after aggregate zero initializer");\n                return false;\n            }\n            initializer_span.end = parser->current.span.end;\n            return minic_parser_advance(parser) &&\n                   add_zero_initialized_record_lvalue(parser, target_id, initializer_span);\n        }\n    }\n    if (parser->current.kind != MINIC_TOKEN_DOT) {\n'''
          if s.count(anchor)!=1:
              raise SystemExit(f'runtime record initializer anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,replacement,1))
          PY

          if [ "$status" -eq 0 ]; then
            stage=regression-source
            cat > tests/compiler/c0/runtime_record_zero_shorthand.c <<'EOF'
          struct inner { long left; long right; };
          struct outer { struct inner nested; long tail; };
          static long run(void) {
              struct outer first = { 0 };
              struct outer second = { 0, };
              return first.nested.left + first.nested.right + first.tail +
                     second.nested.left + second.nested.right + second.tail;
          }
          int main(void) { return (int)run(); }
          EOF
            cat > tests/compiler/c0/run-runtime-record-zero-shorthand.sh <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")/../../.." && pwd)
          minic=${MINIC:-"$root/build/debug/bin/minic"}
          host_cc=${HOST_CC:-${CC:-cc}}
          work=${BUILD_DIR:-"$root/build/debug"}/tests/runtime-record-zero-shorthand
          mkdir -p "$work"
          "$host_cc" -E -P -x c "$root/tests/compiler/c0/runtime_record_zero_shorthand.c" -o "$work/input.i"
          "$minic" -S "$work/input.i" -o "$work/output.s"
          test -s "$work/output.s"
          EOF
            chmod +x tests/compiler/c0/run-runtime-record-zero-shorthand.sh
            cat >> tests/compiler/c0/run.sh <<'EOF'

          MINIC="$minic" HOST_CC="$host_cc" BUILD_DIR="${BUILD_DIR:-"$root/build/debug"}" \
            sh "$root/tests/compiler/c0/run-runtime-record-zero-shorthand.sh"
          EOF
            clang-format-18 -i src/frontend/parser_statement.c tests/compiler/c0/runtime_record_zero_shorthand.c >"$out/format.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=build
            make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/record-zero-v1 >"$out/build.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=focused
            MINIC="$GITHUB_WORKSPACE/build/record-zero-v1/bin/minic" BUILD_DIR="$GITHUB_WORKSPACE/build/record-zero-v1" \
              sh -x tests/compiler/c0/run-runtime-record-zero-shorthand.sh >"$out/focused.txt" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=check-fast
            make -j4 check-fast MODE=release BUILD_DIR=build/record-zero-v1-fast >"$out/check-fast.txt" 2>&1 || status=$?
          fi
          printf 'final_stage=%s\nfinal_status=%s\n' "$stage" "$status" > "$out/status.txt"
          git diff -- src/frontend/parser_statement.c tests/compiler/c0 > "$out/product.patch" || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -eq 0 ]; then
            git rm .github/workflows/productize-runtime-record-zero-shorthand-v1.yml
            rm -rf "$out"
            git add src/frontend/parser_statement.c tests/compiler/c0/runtime_record_zero_shorthand.c tests/compiler/c0/run-runtime-record-zero-shorthand.sh tests/compiler/c0/run.sh
            git commit -m 'frontend: zero-initialize runtime records from {0}'
          else
            git add "$out"
            git commit -m 'diagnostic: record runtime record zero shorthand failure' || true
          fi
          git push origin HEAD:product/runtime-record-zero-shorthand-v1
          exit 0
