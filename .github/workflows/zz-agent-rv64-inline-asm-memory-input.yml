name: Agent RV64 inline asm memory inputs

on:
  push:
    branches:
      - agent/rv64-inline-asm-memory-input-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build baseline MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-asm-memory-input-baseline

      - name: Prove baseline rejects Linux-shaped memory input
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-asm-memory-input-baseline/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          int load_like(const int *ptr) {
              long err = 0;
              int value;
              __asm__ __volatile__("lw %1, %2" : "+r"(err), "=&r"(value) : "m"(*ptr));
              return value + (int)err;
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          if build/agent-asm-memory-input-baseline/bin/minic -S "$work/repro.i" -o "$work/repro.s" \
              >"$work/stdout" 2>"$work/stderr"; then
              echo 'baseline unexpectedly accepted read-only m input' >&2
              exit 1
          fi
          grep -F 'cannot write RISC-V assembly' "$work/stderr" >/dev/null

      - name: Apply general memory-input patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/agent-rv64-inline-asm-memory-input.py
          clang-format-18 -i src/target/riscv64/codegen_inline_asm.c tests/compiler/c0/gnu_inline_asm_operands.c
          CLANG_FORMAT=clang-format-18 bash tools/maintenance/run-format.sh check

      - name: Build patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/agent-asm-memory-input-patched

      - name: Re-run Linux-shaped reproducer
        shell: bash
        run: |
          set -Eeuo pipefail
          work=build/agent-asm-memory-input-patched/repro
          mkdir -p "$work"
          cat > "$work/repro.c" <<'EOF'
          int load_like(const int *ptr) {
              long err = 0;
              int value;
              __asm__ __volatile__("lw %1, %2" : "+r"(err), "=&r"(value) : "m"(*ptr));
              return value + (int)err;
          }
          EOF
          cc -E -P -std=gnu11 -x c "$work/repro.c" -o "$work/repro.i"
          build/agent-asm-memory-input-patched/bin/minic -S "$work/repro.i" -o "$work/repro.s"
          grep -F 'lw t1, 0(t3)' "$work/repro.s" >/dev/null

      - name: Run focused GNU inline asm contract
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/agent-asm-memory-input-patched/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/agent-asm-memory-input-focused" \
          HOST_CC=cc \
            sh tests/compiler/c0/run-gnu-inline-asm-operands.sh

      - name: Run fast regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 check-fast

      - name: Commit product-only result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/zz-agent-rv64-inline-asm-memory-input.yml
          rm -f tools/dev/agent-rv64-inline-asm-memory-input.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: support read-only inline asm memory inputs'
          git push origin HEAD:agent/rv64-inline-asm-memory-input-v1
