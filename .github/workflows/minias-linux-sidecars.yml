name: MiniAS Linux Sidecars

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_VERSION: "6.6.143"
  LINUX_ARCHIVE_SHA256: "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"

jobs:
  sidecars:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-sidecars]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild deterministic RISC-V defconfig sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-sidecar-src"
          out="$GITHUB_WORKSPACE/build/minias-linux-sidecars"
          build="$GITHUB_WORKSPACE/build/linux-sidecar-build"
          mkdir -p "$src" "$out/kernel" "$build"
          archive="$src/linux-${LINUX_VERSION}.tar.xz"
          curl --fail --location --retry 3 \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" \
            -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          tar -C "$src" -xf "$archive"
          make -s -C "$src/linux-${LINUX_VERSION}" \
            ARCH=riscv O="$build" defconfig
          test -s "$build/.config"
          cp "$build/.config" "$out/riscv-defconfig.config"
          gzip -n -f -9 <"$build/.config" >"$out/kernel/config_data.gz"
          test -s "$out/kernel/config_data.gz"
          {
            echo "linux_version=${LINUX_VERSION}"
            echo "linux_archive_sha256=${LINUX_ARCHIVE_SHA256}"
            echo "config_sha256=$(sha256sum "$out/riscv-defconfig.config" | cut -d' ' -f1)"
            echo "kernel_config_data_gz_sha256=$(sha256sum "$out/kernel/config_data.gz" | cut -d' ' -f1)"
            echo "rule=make ARCH=riscv defconfig; gzip -n -f -9"
          } >"$out/provenance.txt"
          cat "$out/provenance.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: minias-linux-sidecars-v1
          path: build/minias-linux-sidecars
          retention-days: 90
          if-no-files-found: error

  native-incbin-sidecars:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-sidecars]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V Kbuild dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev

      - name: Build exact native incbin sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-native-sidecar-src"
          build="$GITHUB_WORKSPACE/build/linux-native-sidecar-build"
          out="$GITHUB_WORKSPACE/build/minias-native26-sidecars"
          archive="$GITHUB_WORKSPACE/build/linux-${LINUX_VERSION}.tar.xz"
          mkdir -p "$src" "$build" "$out"
          curl --http1.1 --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" \
            -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$src" --strip-components=1

          make -s -C "$src" O="$build" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          make -s -C "$src" O="$build" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare scripts

          # Build the real Kbuild consumers.  The four .incbin payloads are
          # internal subdirectory targets and are not valid top-level make goals.
          # Their consumer objects express the authoritative dependency edges.
          driver_targets=(
            arch/riscv/kernel/vdso/vdso.o
            arch/riscv/kernel/compat_vdso/compat_vdso.o
            arch/riscv/purgatory/kexec-purgatory.o
            usr/initramfs_data.o
          )
          make -s -C "$src" O="$build" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 "${driver_targets[@]}"

          sidecars=(
            arch/riscv/kernel/vdso/vdso.so
            arch/riscv/kernel/compat_vdso/compat_vdso.so
            arch/riscv/purgatory/purgatory.ro
            usr/initramfs_inc_data
          )
          for rel in "${sidecars[@]}"; do
            test -f "$build/$rel"
            mkdir -p "$out/$(dirname "$rel")"
            cp "$build/$rel" "$out/$rel"
          done

          # The ground-truth inventory contains nine VDSO assembly rules that
          # are not part of the historical native26 cohort.  Materialize their
          # preprocessed .s form through Kbuild so MiniAS can converge on the
          # exact 35-rule native workload.
          extra="$GITHUB_WORKSPACE/build/minias-native35-extra9"
          mkdir -p "$extra"
          extra_targets=(
            arch/riscv/kernel/compat_vdso/flush_icache.s
            arch/riscv/kernel/compat_vdso/getcpu.s
            arch/riscv/kernel/compat_vdso/note.s
            arch/riscv/kernel/compat_vdso/rt_sigreturn.s
            arch/riscv/kernel/vdso/flush_icache.s
            arch/riscv/kernel/vdso/getcpu.s
            arch/riscv/kernel/vdso/note.s
            arch/riscv/kernel/vdso/rt_sigreturn.s
            arch/riscv/kernel/vdso/sys_hwprobe.s
          )
          make -s -C "$src" O="$build" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 "${extra_targets[@]}"
          for rel in "${extra_targets[@]}"; do
            test -s "$build/$rel"
            mkdir -p "$extra/$(dirname "$rel")"
            cp "$build/$rel" "$extra/$rel"
          done
          (
            cd "$extra"
            find . -type f -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS
          )
          test "$(find "$extra" -type f -name '*.s' | wc -l)" -eq 9
          echo "MINIAS_NATIVE35_EXTRA9=PASS selected=9"

          (
            cd "$out"
            find . -type f ! -name SHA256SUMS -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          {
            echo "linux_version=${LINUX_VERSION}"
            echo "linux_archive_sha256=${LINUX_ARCHIVE_SHA256}"
            echo "arch=riscv"
            echo "cross_compile=riscv64-linux-gnu-"
            echo "config=defconfig"
            echo "targets=arch/riscv/kernel/vdso/vdso.so arch/riscv/kernel/compat_vdso/compat_vdso.so arch/riscv/purgatory/purgatory.ro usr/initramfs_inc_data"
          } >"$out/provenance.txt"
          cat "$out/SHA256SUMS"
          cat "$out/provenance.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: minias-native26-sidecars-v1
          path: build/minias-native26-sidecars
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: minias-native35-extra9-v1
          path: build/minias-native35-extra9
          retention-days: 90
          if-no-files-found: error

