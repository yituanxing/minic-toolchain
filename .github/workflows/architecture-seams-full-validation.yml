name: Architecture Seams Full Validation

on:
  push:
    branches:
      - refactor/architecture-seams-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-seams-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize intended source-list integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Makefile')
          text = path.read_text()

          production = (
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )
          production_replacement = (
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_traversal.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )
          contract = (
              'AST_CONTRACT_TEST_SOURCES := \\\n'
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_global.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )
          contract_replacement = (
              'AST_CONTRACT_TEST_SOURCES := \\\n'
              '\tsrc/frontend/ast.c \\\n'
              '\tsrc/frontend/ast_global.c \\\n'
              '\tsrc/frontend/ast_traversal.c \\\n'
              '\tsrc/frontend/ast_verifier.c \\\n'
          )

          if text.count(production) != 1:
              raise SystemExit('unexpected production source-list shape')
          if text.count(contract) != 1:
              raise SystemExit('unexpected AST contract source-list shape')

          text = text.replace(production, production_replacement, 1)
          text = text.replace(contract, contract_replacement, 1)
          path.write_text(text)
          PY

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Run complete compiler gate
        env:
          RV64_CACHE_HIT: ${{ steps.rv64-cache.outputs.cache-hit }}
        run: bash .github/scripts/compiler-c0-full-gate.sh
