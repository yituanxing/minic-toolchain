name: Clean long test diff

on:
  pull_request:
    paths:
      - '.github/workflows/clean-long-test-diff.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/rv64-long-integers
          fetch-depth: 0
      - name: Restore minimal test diff
        run: bash .github/scripts/clean-long-test-diff.sh
