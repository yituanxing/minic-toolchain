name: Apply feature patch

on:
  push:
    branches:
      - frontend/goto-label-control-flow
    paths:
      - tools/ci/goto-label-control-flow.patch
      - .github/workflows/apply-feature-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check tools/ci/goto-label-control-flow.patch
          git apply tools/ci/goto-label-control-flow.patch
      - name: Commit feature implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend src/target/riscv64
          git commit -m 'frontend: implement named goto and labels'
          git push origin HEAD:frontend/goto-label-control-flow
