# One-shot conversion to main-only repository, following focused CI success.
# Any unmerged commits are first retained through immutable archive tags.
name: MiniC One-Shot Merged PR Branch Cleanup
on:
  workflow_run:
    workflows: ["Toolchain Focused Regression Suite (RV64, AR, LD)"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: minic-main-only-prune
  cancel-in-progress: false
jobs:
  prune:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive divergent history and leave only main
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_MAIN_ONLY'
          import json, os, re, subprocess, urllib.error, urllib.parse, urllib.request
          
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          accepted = os.environ["GH_ACCEPTED_SHA"]
          root = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          
          def api(endpoint, method="GET", payload=None, missing_ok=False):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(root + endpoint, data=data, headers=headers, method=method)
              if data is not None:
                  request.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if missing_ok and exc.code == 404:
                      return None
                  raise
          
          def paged(path):
              all_rows = []
              for page in range(1, 50):
                  part = api(path + ("&" if "?" in path else "?") + "per_page=100&page=" + str(page))
                  if not isinstance(part, list):
                      raise RuntimeError("Unexpected GitHub pagination response")
                  all_rows.extend(part)
                  if len(part) < 100:
                      return all_rows
              raise RuntimeError("Pagination cap reached; refuse destructive cleanup")
          
          def enc(name):
              return urllib.parse.quote(name, safe="/")
          
          def require_main_sha():
              got = api("/branches/main")["commit"]["sha"]
              if got != accepted:
                  raise RuntimeError("main moved from verified focused-CI SHA; refuse cleanup")
          
          require_main_sha()
          merged = api("/pulls/527")
          if not merged.get("merged_at") or merged["base"]["ref"] != "main":
              raise RuntimeError("Four-architecture PR527 not merged to main")
          open_prs = paged("/pulls?state=open")
          if open_prs:
              raise RuntimeError("Open PRs found; cannot delete branches in an active review")
          branches = paged("/branches")
          others = [b for b in branches if b["name"] != "main"]
          if any(b["name"] == "main" and b["commit"]["sha"] != accepted for b in branches):
              raise RuntimeError("main branch moved during inventory")
          if any(b.get("protected") for b in others):
              raise RuntimeError("Protected non-main branches require a separate governance decision")
          print(f"MAIN_ONLY_INVENTORY branches={len(branches)} candidates={len(others)}", flush=True)
          
          # Important: preserve every tip NOT reachable from main as a durable Git tag.
          # A tag is not a branch; it allows recovery of work that was never merged.
          backups = []
          for b in others:
              name, sha = b["name"], b["commit"]["sha"]
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise RuntimeError("Invalid branch SHA " + name)
              test = subprocess.run(["git", "cat-file", "-e", sha + "^{commit}"], capture_output=True)
              if test.returncode:
                  raise RuntimeError("Missing local commit object for " + name)
              ancestor = subprocess.run(["git", "merge-base", "--is-ancestor", sha, accepted],
                                        capture_output=True)
              if ancestor.returncode not in (0, 1):
                  raise RuntimeError("Cannot determine ancestry for " + name)
              if ancestor.returncode == 1:
                  tag = "branch-archive/2026-10-23/" + name
                  backups.append((name, sha, tag))
          # All backup tags are completed BEFORE deleting the first branch.
          for name, sha, tag in backups:
              endpoint = "/git/ref/tags/" + enc(tag)
              exists = api(endpoint, missing_ok=True)
              if exists is None:
                  api("/git/refs", method="POST",
                      payload={"ref": "refs/tags/" + tag, "sha": sha})
              elif exists.get("object", {}).get("sha") != sha:
                  raise RuntimeError("Existing archive tag points elsewhere: " + tag)
              verified = api(endpoint)
              if verified["object"]["sha"] != sha:
                  raise RuntimeError("Cannot verify archive: " + tag)
              print("MAIN_ONLY_ARCHIVED " + name + " -> " + tag + "@" + sha[:12], flush=True)
          
          require_main_sha()
          if paged("/pulls?state=open"):
              raise RuntimeError("PR created during backup; refuse deletion")
          deleted = 0
          for b in others:
              name, sha = b["name"], b["commit"]["sha"]
              current = api("/branches/" + enc(name), missing_ok=True)
              if current is None:
                  print("MAIN_ONLY_ALREADY_GONE " + name, flush=True)
                  continue
              if current["commit"]["sha"] != sha or current.get("protected"):
                  raise RuntimeError("Branch moved or gained protection: " + name)
              require_main_sha()
              api("/git/refs/heads/" + enc(name), method="DELETE")
              deleted += 1
              print("MAIN_ONLY_DELETED " + name, flush=True)
          
          remaining = [b["name"] for b in paged("/branches")]
          if remaining != ["main"]:
              raise RuntimeError("Post-cleanup branch inventory not exactly main: " + repr(remaining))
          print(f"MAIN_ONLY_VERIFIED branches=1 archived_unique_tips={len(backups)} deleted={deleted}", flush=True)
          
          # Retire this one-shot workflow itself via a GitHub-token commit.
          # Token-authored commits do not start a new GitHub Actions push run.
          require_main_sha()
          workflow_path = ".github/workflows/minic-one-shot-merged-branch-cleanup.yml"
          document = api("/contents/" + workflow_path)
          api("/contents/" + workflow_path, method="DELETE", payload={
              "message": "chore(ci): retire completed one-shot main-only branch cleanup",
              "sha": document["sha"], "branch": "main"})
          print("MAIN_ONLY_ONE_SHOT_WORKFLOW=RETIRED", flush=True)
          
          PY_MAIN_ONLY
