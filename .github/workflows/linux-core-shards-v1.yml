name: Linux Core Shards V1

concurrency:
  group: linux-core-shards-v1-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - "agent/linux-expanded-kbuild-v0"
      - "agent/ci-runtime-cleanup-v1"
    paths:
      - 'src/**'
      - 'tests/external/linux/**'
      - 'tools/ci/**'
      - '.github/workflows/linux-core-shards-v1.yml'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      run_crash1573:
        description: 'Run the historical TU 1573 ASan/UBSan diagnostic after shard certification'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  shard:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[core-shards-v1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: new500
            range: 500-999
            offset: 500
            limit: 500
            corpus_path: build/linux-new500-corpus
            cache_key: linux-new500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-500-999
            focus_indices: '555,591,611,613,749,829,887,899,949,963,965,973,975,978,990,995'
            focus_count: 16
            syntax_check: false
            serial_materialize: false
          - id: next500
            range: 1000-1499
            offset: 1000
            limit: 500
            corpus_path: build/linux-next500-corpus
            cache_key: linux-next500-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1000-1499
            focus_indices: '1021,1050,1060,1082,1115,1118,1137,1147,1149,1193,1208,1219,1402,1430,1438,1439'
            focus_count: 16
            syntax_check: false
            serial_materialize: false
          - id: next500b
            range: 1500-1999
            offset: 1500
            limit: 500
            corpus_path: build/linux-next500b-corpus
            cache_key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
            focus_indices: '1501,1527,1533,1544,1565,1573,1579,1581,1596,1636,1642,1687,1773,1810,1836,1910'
            focus_count: 16
            syntax_check: false
            serial_materialize: false
          - id: next500c
            range: 2000-2499
            offset: 2000
            limit: 500
            corpus_path: build/linux-next500c-corpus
            cache_key: linux-next500c-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-2000-2499
            focus_indices: '2089,2334,2337,2434,2443,2457,2459'
            focus_count: 7
            syntax_check: false
            serial_materialize: false
          - id: next500d
            range: 2500-2999
            offset: 2500
            limit: 500
            corpus_path: build/linux-next500d-corpus
            cache_key: linux-next500d-corpus-v4-6.6.143-rv64-defconfig-gcc13.3.0-indices-2500-2999
            focus_indices: '2701,2703,2713,2724,2740,2768,2770,2887,2940,2952,2955,2957,2969,2985,2989,2999'
            focus_count: 16
            syntax_check: true
            serial_materialize: true
          - id: final352
            range: 3000-3351
            offset: 3000
            limit: 352
            corpus_path: build/linux-final352-corpus
            cache_key: linux-final352-corpus-v2-6.6.143-rv64-defconfig-gcc13.3.0-indices-3000-3351
            focus_indices: '3014,3018,3030,3034,3035,3037,3044,3067,3070,3075,3152,3210,3216,3272,3304,3306'
            focus_count: 16
            syntax_check: true
            serial_materialize: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore frozen shard corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.corpus_path }}
          key: ${{ matrix.cache_key }}

      - name: Validate cached shard corpus
        if: steps.corpus-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest="${{ matrix.corpus_path }}/selected-tus.txt"
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq ${{ matrix.limit }}
          test "$(head -1 "$manifest" | cut -f1)" -eq ${{ matrix.offset }}
          test "$(tail -1 "$manifest" | cut -f1)" -eq $(( ${{ matrix.offset }} + ${{ matrix.limit }} - 1 ))
          echo "LINUX_CORE_SHARD_CORPUS cache=hit range=${{ matrix.range }} selected=${{ matrix.limit }}"

      - name: Fetch exact Linux 6.6.143 stable source on cache miss
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build/linux-source-${{ matrix.id }}
          git init -q build/linux-source-${{ matrix.id }}
          git -C build/linux-source-${{ matrix.id }} remote add origin https://github.com/gregkh/linux.git
          git -C build/linux-source-${{ matrix.id }} fetch --depth=1 --no-tags --progress origin d1cfde2d5d15be14123bdd1689162bd27f995a90
          git -C build/linux-source-${{ matrix.id }} checkout -q --detach FETCH_HEAD
          test "$(git -C build/linux-source-${{ matrix.id }} rev-parse HEAD)" = d1cfde2d5d15be14123bdd1689162bd27f995a90

      - name: Install corpus materialization dependencies on cache miss
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev
          command -v riscv64-linux-gnu-gcc

      - name: Materialize frozen shard on cache miss
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          builder="$GITHUB_WORKSPACE/build/linux-core-shards-v1-${{ matrix.id }}-builder"
          corpus="$GITHUB_WORKSPACE/${{ matrix.corpus_path }}"
          export LINUX_BATCH_MATERIALIZE_ONLY=1
          export BUILD_DIR="$builder"
          export LINUX_SOURCE_TREE="$GITHUB_WORKSPACE/build/linux-source-${{ matrix.id }}"
          export CROSS_COMPILE=riscv64-linux-gnu-
          export LINUX_BATCH_OFFSET=${{ matrix.offset }}
          export LINUX_BATCH_LIMIT=${{ matrix.limit }}
          export LINUX_BATCH_JOBS=4
          if [[ "${{ matrix.serial_materialize }}" == true ]]; then
            export LINUX_BATCH_MATERIALIZE_MAKE_JOBS=1
          fi
          sh tests/external/linux/batch_probe.sh

          python3 - "$builder" "$corpus" "${{ matrix.offset }}" "${{ matrix.limit }}" "${{ matrix.range }}" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          builder = Path(sys.argv[1])
          corpus = Path(sys.argv[2])
          offset = int(sys.argv[3])
          limit = int(sys.argv[4])
          range_label = sys.argv[5]
          selected = builder / "selected-tus.txt"
          rows = [line for line in selected.read_text().splitlines() if line.strip()]
          indices = [int(line.split("\t", 1)[0]) for line in rows]
          expected_last = offset + limit - 1
          if len(rows) != limit or not indices or indices[0] != offset or indices[-1] != expected_last:
              raise SystemExit(
                  f"unexpected shard selection: count={len(rows)} first={indices[0] if indices else None} "
                  f"last={indices[-1] if indices else None} expected={offset}-{expected_last}"
              )
          shutil.rmtree(corpus, ignore_errors=True)
          inputs = corpus / "kbuild"
          inputs.mkdir(parents=True)
          shutil.copy2(selected, corpus / "selected-tus.txt")
          manifest = builder / "tu-manifest.txt"
          if manifest.is_file():
              shutil.copy2(manifest, corpus / "tu-manifest.txt")
          total_bytes = 0
          for row in rows:
              _, _, rel_i, _ = row.split("\t", 3)
              source = builder / "kbuild" / rel_i
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f"missing materialized input: {source}")
              target = inputs / rel_i
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              total_bytes += target.stat().st_size
          (corpus / "corpus-info.txt").write_text(
              f"linux=6.6.143\nindices={range_label}\nselected={limit}\nbytes={total_bytes}\n"
          )
          print(f"LINUX_CORE_SHARD_CORPUS cache=fill range={range_label} selected={limit} bytes={total_bytes}")
          PY

      - name: Validate materialized GCC syntax where historically certified
        if: steps.corpus-cache.outputs.cache-hit != 'true' && matrix.syntax_check == true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "${{ matrix.corpus_path }}" <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import subprocess
          import sys

          corpus = Path(sys.argv[1])
          rows = [line for line in (corpus / "selected-tus.txt").read_text().splitlines() if line.strip()]

          def check(row):
              index, _, rel_i, _ = row.split("\t", 3)
              path = corpus / "kbuild" / rel_i
              proc = subprocess.run(
                  ["riscv64-linux-gnu-gcc", "-std=gnu11", "-fshort-wchar", "-fsyntax-only", "-w", str(path)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              return int(index), rel_i, proc.returncode, proc.stderr

          failures = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [pool.submit(check, row) for row in rows]
              for future in as_completed(futures):
                  index, rel_i, rc, stderr = future.result()
                  if rc != 0:
                      failures.append((index, rel_i, stderr))
          failures.sort()
          print(f"LINUX_CORE_SHARD_CORPUS_SYNTAX selected={len(rows)} gcc_fail={len(failures)}")
          if failures:
              for index, rel_i, stderr in failures[:20]:
                  first = next((line for line in stderr.splitlines() if line.strip()), "")
                  print(f"LINUX_CORE_SHARD_CORPUS_SYNTAX_ERROR index={index} input={rel_i} diagnostic={first}")
              raise SystemExit(1)
          PY

      - name: Save frozen shard corpus on cache miss
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.corpus_path }}
          key: ${{ matrix.cache_key }}

      - name: Build exact compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/linux-core-shards-v1-${{ matrix.id }}-compiler

      - name: Replay historical focused blocker pool
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-core-shards-v1-${{ matrix.id }}-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-core-shards-v1-${{ matrix.id }}-focus"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/${{ matrix.corpus_path }}" \
            --work "$work" \
            --jobs 4 \
            --indices "${{ matrix.focus_indices }}" \
            --sample-count 0
          replay_status=$?
          set -e
          echo "LINUX_CORE_SHARD_FOCUS_REPLAY_STATUS=$replay_status range=${{ matrix.range }}"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 50 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected ${{ matrix.focus_count }} \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - "$work/frontier-summary.json" "${{ matrix.focus_count }}" <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1]))
          expected = int(sys.argv[2])
          if summary["selected"] != expected or summary["preprocess_missing"] != 0:
              raise SystemExit(f"focused replay infrastructure failure: {summary}")
          print(
              f"LINUX_CORE_SHARD_FOCUS selected={summary['selected']} pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error={summary['error']} "
              f"preprocess_missing={summary['preprocess_missing']}"
          )
          PY
          if [[ "${{ matrix.id }}" == final352 ]]; then
            echo '===== FINAL352 INTERNAL TRACE ====='
            grep -R -h -E 'CORE_|AST_|STATIC_RELOC_DETAIL|EXTERN_DEF_DETAIL|set_tcp_state|ip_vs_est_calc_phase' "$work/minic-stderr" || true
            echo '===== END FINAL352 INTERNAL TRACE ====='
          fi

      - name: Replay full frozen shard
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-core-shards-v1-${{ matrix.id }}-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/linux-core-shards-v1-${{ matrix.id }}-full"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/${{ matrix.corpus_path }}" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit ${{ matrix.limit }} \
            --sample-count 0
          replay_status=$?
          set -e
          echo "LINUX_CORE_SHARD_FULL_REPLAY_STATUS=$replay_status range=${{ matrix.range }}"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 50 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected ${{ matrix.limit }} \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - "$work/frontier-summary.json" "${{ matrix.limit }}" <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1]))
          expected = int(sys.argv[2])
          if summary["selected"] != expected or summary["preprocess_missing"] != 0:
              raise SystemExit(f"full shard infrastructure failure: {summary}")
          print(
              f"LINUX_CORE_SHARD_FULL selected={summary['selected']} pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error={summary['error']} "
              f"preprocess_missing={summary['preprocess_missing']}"
          )
          PY

      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-core-shards-v1-${{ matrix.id }}-${{ github.sha }}
          path: |
            build/linux-core-shards-v1-${{ matrix.id }}-focus/batch-results.json
            build/linux-core-shards-v1-${{ matrix.id }}-focus/batch-results.tsv
            build/linux-core-shards-v1-${{ matrix.id }}-focus/frontier-summary.json
            build/linux-core-shards-v1-${{ matrix.id }}-focus/reason-summary.txt
            build/linux-core-shards-v1-${{ matrix.id }}-focus/progress-summary.json
            build/linux-core-shards-v1-${{ matrix.id }}-focus/progress-summary.txt
            build/linux-core-shards-v1-${{ matrix.id }}-focus/failure-contexts.txt
            build/linux-core-shards-v1-${{ matrix.id }}-focus/minic-stderr/**
            build/linux-core-shards-v1-${{ matrix.id }}-full/batch-results.json
            build/linux-core-shards-v1-${{ matrix.id }}-full/batch-results.tsv
            build/linux-core-shards-v1-${{ matrix.id }}-full/frontier-summary.json
            build/linux-core-shards-v1-${{ matrix.id }}-full/reason-summary.txt
            build/linux-core-shards-v1-${{ matrix.id }}-full/progress-summary.json
            build/linux-core-shards-v1-${{ matrix.id }}-full/progress-summary.txt
            build/linux-core-shards-v1-${{ matrix.id }}-full/failure-contexts.txt
            build/linux-core-shards-v1-${{ matrix.id }}-full/minic-stderr/**
          if-no-files-found: warn
          retention-days: 3

  crash1573:
    if: contains(github.event.head_commit.message, '[core-shards-crash1573]') || (github.event_name == 'workflow_dispatch' && inputs.run_crash1573 == true)
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore certified 1500-1999 corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-next500b-corpus
          key: linux-next500b-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-indices-1500-1999
          fail-on-cache-miss: true

      - name: Build sanitizer compiler
        run: make -j4 MODE=sanitize CFLAGS=-Werror BUILD_DIR=build/linux-core-shards-v1-crash1573-compiler

      - name: Materialize crash TU 1573
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('build/linux-next500b-corpus')
          crash = Path('build/linux-core-shards-v1-crash1573')
          rows = [line for line in (source / 'selected-tus.txt').read_text().splitlines() if line.strip()]
          selected = [row for row in rows if int(row.split('\t', 1)[0]) == 1573]
          if len(selected) != 1:
              raise SystemExit(f'index 1573 selection mismatch: {len(selected)}')
          shutil.rmtree(crash, ignore_errors=True)
          (crash / 'kbuild').mkdir(parents=True)
          (crash / 'selected-tus.txt').write_text(selected[0] + '\n')
          _, _, rel_i, _ = selected[0].split('\t', 3)
          src = source / 'kbuild' / rel_i
          dst = crash / 'kbuild' / rel_i
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src, dst)
          print(f'CRASH1573_INPUT {rel_i} bytes={dst.stat().st_size}')
          PY

      - name: Replay crash TU under ASan UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/linux-core-shards-v1-crash1573-compiler/bin/minic"
          corpus="$GITHUB_WORKSPACE/build/linux-core-shards-v1-crash1573"
          work="$GITHUB_WORKSPACE/build/linux-core-shards-v1-crash1573-work"
          set +e
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" --corpus "$corpus" --work "$work" --jobs 1 --offset 0 --limit 1 --sample-count 0
          status=$?
          set -e
          echo "CRASH1573_REPLAY_STATUS=$status"
          find "$work/minic-stderr" -type f -maxdepth 20 -print -exec sh -c 'echo "===== $1"; cat "$1"' _ {} \; || true

      - name: Preserve crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-core-shards-v1-crash1573-${{ github.sha }}
          path: |
            build/linux-core-shards-v1-crash1573-work/batch-results.json
            build/linux-core-shards-v1-crash1573-work/batch-results.tsv
            build/linux-core-shards-v1-crash1573-work/minic-stderr/**
          if-no-files-found: warn
          retention-days: 3

  certified:
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - name: Record canonical shard certification
        run: echo 'LINUX_CORE_SHARDS_V1=PASS ranges=500-3351 shards=6'
