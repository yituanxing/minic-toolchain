name: Compiler Bootstrap B2 Runtime

on:
  push:
    branches:
      - refactor/declaration-sema-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# B2 consumes the latest successful frozen Stage2 artifact.

jobs:
  resolve-stage2:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bootstrap-b2-runtime]')
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve latest successful B1
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/compiler-bootstrap-b1-sharded.yml/runs?branch=refactor%2Fdeclaration-sema-v1&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          test -n "$run_id"
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          echo "BOOTSTRAP_B2_SOURCE_B1 run_id=$run_id"

  micro-runtime:
    needs: resolve-stage2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 runtime toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user

      - name: Download frozen Stage2
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-b1-stage2
          path: build/bootstrap-b2-artifact
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-stage2.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Run micro runtime through Stage2
        shell: bash
        run: |
          set -Eeuo pipefail
          stage2=$(find build/bootstrap-b2-artifact -type f -name minic-stage2-rv64 -print -quit)
          test -s "$stage2"
          chmod +x "$stage2"
          wrapper="$GITHUB_WORKSPACE/build/bootstrap-b2-stage2"
          cat >"$wrapper" <<EOF
          #!/bin/sh
          exec qemu-riscv64 "$GITHUB_WORKSPACE/$stage2" "\$@"
          EOF
          chmod +x "$wrapper"

          MINIC="$wrapper" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-runtime-c0" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
          REQUIRE_RISCV_RUNTIME=1 \
            sh tests/compiler/c0/run-runtime.sh

          MINIC="$wrapper" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-runtime-programs" \
          RISCV_CC=riscv64-linux-gnu-gcc \
          RISCV_OBJDUMP=riscv64-linux-gnu-objdump \
          QEMU_RISCV64=qemu-riscv64 \
          REQUIRE_RISCV_RUNTIME=1 \
            sh tests/programs/c0/run.sh

          echo "BOOTSTRAP_B2_MICRO=PASS source_b1=${{ needs.resolve-stage2.outputs.run_id }}"

  projects:
    needs: resolve-stage2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [tiny-aes, cjson, sds, parson, linenoise]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install RV64 runtime toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user curl ca-certificates

      - name: Download frozen Stage2
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-b1-stage2
          path: build/bootstrap-b2-artifact
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-stage2.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Run real project through Stage2
        shell: bash
        run: |
          set -Eeuo pipefail
          stage2=$(find build/bootstrap-b2-artifact -type f -name minic-stage2-rv64 -print -quit)
          test -s "$stage2"
          chmod +x "$stage2"
          wrapper="$GITHUB_WORKSPACE/build/bootstrap-b2-stage2"
          cat >"$wrapper" <<EOF
          #!/bin/sh
          exec qemu-riscv64 "$GITHUB_WORKSPACE/$stage2" "\$@"
          EOF
          chmod +x "$wrapper"

          project="${{ matrix.project }}"
          case "$project" in
            tiny-aes)
              MINIC="$wrapper" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 \
                BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-tiny-aes" \
                sh tests/external/tiny-aes-c/probe.sh
              ;;
            cjson)
              MINIC="$wrapper" RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 \
                BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-cjson" \
                sh tests/external/cjson/probe.sh
              RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 \
                BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-cjson" \
                sh tests/external/cjson/final_differential.sh
              ;;
            sds)
              discovery="$GITHUB_WORKSPACE/build/bootstrap-b2-sds-discovery"
              MINIC="$wrapper" HOST_CC=cc BUILD_DIR="$discovery" sh tests/external/sds/probe.sh
              MINIC="$wrapper" HOST_CC=cc BUILD_DIR="$discovery" sh tests/external/sds/upstream_test_probe.sh
              RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 \
                SDS_TEST_ASSEMBLY="$discovery/sds-test.s" \
                BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-sds-runtime" \
                sh tests/external/sds/runtime_differential.sh
              ;;
            parson)
              discovery="$GITHUB_WORKSPACE/build/bootstrap-b2-parson-discovery"
              MINIC="$wrapper" RISCV_CC=riscv64-linux-gnu-gcc BUILD_DIR="$discovery" \
                sh tests/external/parson/probe.sh
              RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 \
                PARSON_ASSEMBLY="$discovery/parson.s" \
                BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-parson-runtime" \
                sh tests/external/parson/runtime_differential.sh
              ;;
            linenoise)
              discovery="$GITHUB_WORKSPACE/build/bootstrap-b2-linenoise-discovery"
              MINIC="$wrapper" HOST_CC=cc BUILD_DIR="$discovery" sh tests/external/linenoise/probe.sh
              RISCV_CC=riscv64-linux-gnu-gcc QEMU_RISCV64=qemu-riscv64 \
                LINENOISE_ASSEMBLY="$discovery/linenoise.s" \
                BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-linenoise-runtime" \
                sh tests/external/linenoise/runtime_differential.sh
              ;;
          esac
          echo "BOOTSTRAP_B2_PROJECT=PASS project=$project source_b1=${{ needs.resolve-stage2.outputs.run_id }}"

  lua:
    needs: resolve-stage2
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install host and RV64 toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user \
            curl ca-certificates make file

      - name: Download frozen Stage2
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-b1-stage2
          path: build/bootstrap-b2-artifact
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-stage2.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compile Lua 5.5.0 through Stage2
        shell: bash
        run: |
          set -Eeuo pipefail
          stage2=$(find build/bootstrap-b2-artifact -type f -name minic-stage2-rv64 -print -quit)
          test -s "$stage2"
          chmod +x "$stage2"
          wrapper="$GITHUB_WORKSPACE/build/bootstrap-b2-stage2"
          cat >"$wrapper" <<EOF
          #!/bin/sh
          exec qemu-riscv64 "$GITHUB_WORKSPACE/$stage2" "\$@"
          EOF
          chmod +x "$wrapper"

          CORE_FAST_TRACE=1 \
          MINIC="$wrapper" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/bootstrap-b2-lua" \
          HOST_CC=cc \
          TARGET_CC=riscv64-linux-gnu-gcc \
            sh tests/external/lua/probe.sh

          work="$GITHUB_WORKSPACE/build/bootstrap-b2-lua"
          src="$work/lua-5.5.0"
          test ! -d "$src/src" || src="$src/src"
          sources="lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c lua.c"
          asm_inputs=""
          for source in $sources; do
            asm_inputs="$asm_inputs $work/${source%.c}.s"
          done
          riscv64-linux-gnu-gcc -static $asm_inputs -lm -ldl -o "$work/lua-stage2-rv64"

          cat >"$work/runtime-smoke.lua" <<'LUA'
          print(_VERSION)
          print("arith", 7 * 6, 1.5 + 2.25)
          local t = {alpha = 11, 2, 3, 5}
          print("table", t.alpha, #t, t[3])
          local function fib(n)
            if n < 2 then return n end
            return fib(n - 1) + fib(n - 2)
          end
          print("function", fib(10))
          local s = 0
          for i = 1, 100 do s = s + i end
          print("loop", s)
          collectgarbage("collect")
          print("gc", collectgarbage("count") > 0)
          LUA

          qemu-riscv64 "$work/lua-stage2-rv64" "$work/runtime-smoke.lua" \
            >"$work/lua.stdout" 2>"$work/lua.stderr"
          grep -E '^function[[:space:]]+55$' "$work/lua.stdout" >/dev/null
          grep -E '^loop[[:space:]]+5050$' "$work/lua.stdout" >/dev/null
          echo "BOOTSTRAP_B2_LUA=PASS source_b1=${{ needs.resolve-stage2.outputs.run_id }}"

  b2-runtime:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bootstrap-b2-runtime]'))
    needs: [resolve-stage2, micro-runtime, projects, lua]
    runs-on: ubuntu-24.04
    steps:
      - name: Require self-hosted runtime lanes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.resolve-stage2.result }}" = success
          test "${{ needs.micro-runtime.result }}" = success
          test "${{ needs.projects.result }}" = success
          test "${{ needs.lua.result }}" = success
          echo "BOOTSTRAP_B2_RUNTIME=PASS micro=PASS projects=5/5 lua=PASS source_b1=${{ needs.resolve-stage2.outputs.run_id }}"
