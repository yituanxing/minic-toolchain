name: MiniAS Linux Ground Truth Inventory

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LINUX_VERSION: "6.6.143"
  LINUX_ARCHIVE_SHA256: "dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932"

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-ground-truth]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux RISC-V build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev libssl-dev dwarves

      - name: Build exact GNU RISC-V defconfig kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/build/linux-ground-truth-src"
          out="$GITHUB_WORKSPACE/build/linux-ground-truth-out"
          archive="$GITHUB_WORKSPACE/build/linux-${LINUX_VERSION}.tar.xz"
          mkdir -p build
          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" -o "$archive"
          echo "${LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          rm -rf "$src" "$out"
          mkdir -p "$src" "$out"
          tar -xJf "$archive" -C "$src" --strip-components=1
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          started=$(date +%s)
          make -s -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4
          ended=$(date +%s)
          echo "LINUX_GROUND_TRUTH_BUILD_SECONDS=$((ended-started))"
          test -s "$out/vmlinux"

      - name: Classify actual compiled object inputs from cmd files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from collections import Counter
          import json, re

          out = Path("build/linux-ground-truth-out").resolve()
          src = Path("build/linux-ground-truth-src").resolve()
          output_re = re.compile(r"(?:^|\s)-o\s+([^\s;]+\.o)(?=\s|;|$)")
          source_re = re.compile(r"(?:^|\s)([^\s;]+\.(?:c|S|s|rs))(?=\s|;|$)")
          rows = {}
          unmatched_target_cmds=[]

          for cmdfile in out.rglob(".*.cmd"):
              try: text=cmdfile.read_text(errors="replace")
              except OSError: continue
              for line in text.splitlines():
                  if ":=" not in line or " -c " not in f" {line} ":
                      continue
                  objects=output_re.findall(line)
                  sources=source_re.findall(line)
                  if not objects or not sources:
                      continue
                  raw_obj=objects[-1].strip("'\"")
                  obj=Path(raw_obj)
                  if obj.is_absolute():
                      try: rel_obj=obj.resolve().relative_to(out)
                      except ValueError: continue
                  else:
                      rel_obj=obj
                  rel_text=PurePosixPath(rel_obj.as_posix()).as_posix()
                  if rel_text.startswith(("scripts/","tools/")) or "/scripts/" in rel_text:
                      continue
                  raw_src=sources[-1].strip("'\"")
                  suffix=Path(raw_src).suffix
                  kind={".c":"c",".S":"asm_preprocessed",".s":"asm_raw",".rs":"rust"}[suffix]
                  rows[rel_text]={"kind":kind,"source":raw_src,"cmdfile":str(cmdfile.relative_to(out))}

          counts=Counter(row["kind"] for row in rows.values())
          native=counts["asm_preprocessed"]+counts["asm_raw"]
          assembler_inputs=counts["c"]+native
          result={
              "linux":"6.6.143","arch":"riscv","config":"defconfig",
              "classified_object_compile_rules":len(rows),
              "c":counts["c"],
              "asm_preprocessed":counts["asm_preprocessed"],
              "asm_raw":counts["asm_raw"],
              "native_asm_total":native,
              "rust":counts["rust"],
              "assembler_inputs_without_rust":assembler_inputs,
          }
          Path("build/minias-ground-truth-inventory.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          Path("build/minias-ground-truth-c.tsv").write_text("\n".join(
              f"{obj}\t{row['source']}\t{row['cmdfile']}"
              for obj,row in sorted(rows.items()) if row["kind"]=="c"
          )+"\n")
          Path("build/minias-ground-truth-native-asm.tsv").write_text("\n".join(
              f"{obj}\t{row['kind']}\t{row['source']}\t{row['cmdfile']}"
              for obj,row in sorted(rows.items()) if row["kind"].startswith("asm_")
          )+"\n")
          Path("build/minias-ground-truth-rust.tsv").write_text("\n".join(
              f"{obj}\t{row['source']}\t{row['cmdfile']}"
              for obj,row in sorted(rows.items()) if row["kind"]=="rust"
          )+"\n")
          print(
              "MINIAS_GROUND_TRUTH_INVENTORY "
              f"c={counts['c']} native_S={counts['asm_preprocessed']} native_s={counts['asm_raw']} "
              f"native_asm_total={native} rust={counts['rust']} "
              f"assembler_inputs_without_rust={assembler_inputs} classified_objects={len(rows)}"
          )
          PY
          cat build/minias-ground-truth-inventory.json

      - name: Download frozen compiler corpus manifests
        uses: actions/download-artifact@v4
        with:
          pattern: frozen-linux-corpus-*
          path: build/frozen-corpus-artifacts
          repository: ${{ github.repository }}
          run-id: "33186855250"
          github-token: ${{ github.token }}

      - name: Compute frozen3352 vs ground-truth C delta
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, io, json, tarfile

          roots=Path("build/frozen-corpus-artifacts")
          frozen={}
          for archive in sorted(roots.rglob("corpus.tar.gz")):
              with tarfile.open(archive, "r:gz") as tf:
                  selected=[m for m in tf.getmembers() if m.name.endswith("/selected-tus.txt")]
                  if len(selected)!=1:
                      raise SystemExit(f"expected one selected-tus.txt in {archive}, got {len(selected)}")
                  text=tf.extractfile(selected[0]).read().decode()
                  for line in text.splitlines():
                      if not line.strip():
                          continue
                      parts=line.split("\t")
                      if len(parts)<4:
                          raise SystemExit(f"bad frozen manifest line: {line!r}")
                      index,obj,ipath,source=parts[:4]
                      if obj in frozen:
                          raise SystemExit(f"duplicate frozen object path: {obj}")
                      frozen[obj]={"index":int(index),"i":ipath,"source":source}

          gt={}
          for line in Path("build/minias-ground-truth-c.tsv").read_text().splitlines():
              if not line.strip():
                  continue
              obj,source,cmdfile=line.split("\t",2)
              gt[obj]={"source":source,"cmdfile":cmdfile}

          frozen_set=set(frozen)
          gt_set=set(gt)
          overlap=sorted(frozen_set & gt_set)
          gt_only=sorted(gt_set - frozen_set)
          frozen_only=sorted(frozen_set - gt_set)

          def write_rows(path, names, left, right=None):
              lines=[]
              for obj in names:
                  if right is None:
                      row=left[obj]
                      lines.append("\t".join([obj]+[str(v) for v in row.values()]))
                  else:
                      l=left[obj]; r=right[obj]
                      lines.append("\t".join([obj,l.get("source",""),r.get("source",""),r.get("cmdfile","")]))
              Path(path).write_text("\n".join(lines)+("\n" if lines else ""))

          write_rows("build/minias-ground-truth-c-only.tsv",gt_only,gt)
          write_rows("build/minias-frozen3352-only.tsv",frozen_only,frozen)
          write_rows("build/minias-frozen3352-overlap.tsv",overlap,frozen,gt)

          summary={
              "frozen_objects":len(frozen_set),
              "ground_truth_c_objects":len(gt_set),
              "overlap_objects":len(overlap),
              "ground_truth_only_objects":len(gt_only),
              "frozen_only_objects":len(frozen_only),
          }
          Path("build/minias-ground-truth-c-delta.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("MINIAS_GROUND_TRUTH_C_DELTA "+" ".join(f"{k}={v}" for k,v in summary.items()))
          PY
          cat build/minias-ground-truth-c-delta.json

      - name: Export exact ground-truth C149 preprocessed corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import hashlib, json, shlex, subprocess

          out = Path("build/linux-ground-truth-out").resolve()
          corpus = Path("build/minias-ground-truth-c149-corpus")
          kbuild = corpus / "kbuild"
          corpus.mkdir(parents=True, exist_ok=True)
          kbuild.mkdir(parents=True, exist_ok=True)

          rows = []
          for line in Path("build/minias-ground-truth-c-only.tsv").read_text().splitlines():
              if not line.strip():
                  continue
              obj, source, cmdfile = line.split("\t", 2)
              rows.append((obj, source, cmdfile))
          if len(rows) != 149:
              raise SystemExit(f"expected 149 ground-truth-only C rules, got {len(rows)}")

          def normalize_output(token: str) -> str:
              path = Path(token.strip("'\""))
              if path.is_absolute():
                  try:
                      return path.resolve().relative_to(out).as_posix()
                  except ValueError:
                      return ""
              return path.as_posix()

          def command_for(obj: str, cmdfile: str) -> list[str]:
              path = out / cmdfile
              if not path.is_file():
                  raise RuntimeError(f"missing cmd file for {obj}: {cmdfile}")
              matches = []
              for raw in path.read_text(errors="replace").splitlines():
                  if ":=" not in raw or " -c " not in f" {raw} ":
                      continue
                  command = raw.split(":=", 1)[1].strip()
                  try:
                      tokens = shlex.split(command, posix=True)
                  except ValueError:
                      continue
                  for index, token in enumerate(tokens[:-1]):
                      if token == "-o" and normalize_output(tokens[index + 1]) == obj:
                          matches.append(tokens)
                          break
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one exact compile command for {obj}, got {len(matches)}"
                  )
              return matches[0]

          def preprocess(index_row):
              index, (obj, source, cmdfile) = index_row
              tokens = command_for(obj, cmdfile)
              try:
                  compile_index = tokens.index("-c")
                  output_index = tokens.index("-o")
              except ValueError as error:
                  raise RuntimeError(f"compile command shape missing -c/-o for {obj}") from error

              rel_i = obj[:-2] + ".i"
              target = (kbuild / rel_i).resolve()
              target.parent.mkdir(parents=True, exist_ok=True)
              tokens[compile_index] = "-E"
              tokens[output_index + 1] = str(target)

              proc = subprocess.run(
                  tokens,
                  cwd=out,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
                  check=False,
              )
              if proc.returncode != 0 or not target.is_file() or target.stat().st_size == 0:
                  raise RuntimeError(
                      f"preprocess failed obj={obj} rc={proc.returncode}: "
                      + proc.stderr[-2000:]
                  )
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              return index, obj, rel_i, source, digest

          results = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [
                  pool.submit(preprocess, item)
                  for item in enumerate(rows)
              ]
              for future in as_completed(futures):
                  results.append(future.result())
          results.sort()

          (corpus / "selected-tus.txt").write_text(
              "".join(
                  f"{index}\t{obj}\t{rel_i}\t{source}\n"
                  for index, obj, rel_i, source, _ in results
              )
          )
          (corpus / "files.sha256").write_text(
              "".join(
                  f"{digest}  kbuild/{rel_i}\n"
                  for _, _, rel_i, _, digest in results
              )
          )
          summary = {
              "selected": len(results),
              "linux": "6.6.143",
              "arch": "riscv",
              "config": "defconfig",
              "source": "ground-truth successful GNU Kbuild object delta",
          }
          (corpus / "manifest.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(f"MINIAS_GROUND_TRUTH_C149_EXPORT selected={len(results)}")
          PY

          tar -C build -czf build/minias-ground-truth-c149-corpus.tar.gz             minias-ground-truth-c149-corpus
          sha256sum build/minias-ground-truth-c149-corpus.tar.gz             > build/minias-ground-truth-c149-corpus.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: minias-ground-truth-c149-corpus
          path: |
            build/minias-ground-truth-c149-corpus.tar.gz
            build/minias-ground-truth-c149-corpus.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: minias-linux-ground-truth-inventory
          path: |
            build/minias-ground-truth-inventory.json
            build/minias-ground-truth-c.tsv
            build/minias-ground-truth-c-delta.json
            build/minias-ground-truth-c-only.tsv
            build/minias-frozen3352-only.tsv
            build/minias-frozen3352-overlap.tsv
            build/minias-ground-truth-native-asm.tsv
            build/minias-ground-truth-rust.tsv
          retention-days: 30
          if-no-files-found: error