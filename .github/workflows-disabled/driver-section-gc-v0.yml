name: Driver Section GC V0

on:
  pull_request:
    branches:
      - external/busybox-full-driver-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driver-section-gc-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  section-gc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 link and runtime prerequisites
        run: |
          timeout 240s sudo apt-get -o Acquire::Retries=3 update
          timeout 240s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Build current Mini toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/driver-section-gc-v0 all

      - name: Validate per-function section garbage collection
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/driver-section-gc-v0/bin/minic" \
          MINIAS="$GITHUB_WORKSPACE/build/driver-section-gc-v0/bin/minic-as" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/driver-section-gc-v0" \
          RISCV_LD=riscv64-linux-gnu-ld \
          RISCV_READELF=riscv64-linux-gnu-readelf \
          QEMU_RISCV64=qemu-riscv64 \
            sh tests/driver/run-section-gc-v0.sh
