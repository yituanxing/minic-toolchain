name: MiniPP Linux Focus 3000-3351

concurrency:
  group: minipp-linux-focus352f-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'toolchain/minipp-*'
    paths:
      - 'preprocessor/**'
      - 'tools/minic-cpp/**'
      - 'tests/preprocessor/**'
      - '.github/workflows/minipp-linux-focus-3000-3351.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  MINIPP_LINUX_ARCHIVE_SHA256: dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
  MINIPP_FINAL352_CACHE_KEY: minipp-linux-ref352f-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-8c205c3e5a1662b0d3c07bc8495eef7384681ff698a23ef9b3a3147df17cfb4b-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-102f50b8cf781eb2c6def994961ae9b082aefc09b8660776e56ae748c34a8839

jobs:
  focusfinal:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minipp-linux-3352-focus]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install focused replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross make curl xz-utils

      - name: Build independent MiniPP
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-focus352f toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-focus352f all
          test -x build/minipp-linux-focus352f/bin/minic-cpp

      - name: Prepare immutable Linux source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-focus352f-work"
          archive="$work/linux-6.6.143.tar.xz"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"

      - name: Restore frozen GCC final352 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref352f-corpus
          key: ${{ env.MINIPP_FINAL352_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Replay focused final352 pool
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-focus352f-work"
          corpus="$GITHUB_WORKSPACE/build/minipp-linux-ref352f-corpus"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$corpus/contract.jsonl" \
            --corpus "$corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-focus352f/bin/minic-cpp" \
            --work "$work/replay" \
            --indices "$GITHUB_WORKSPACE/tests/preprocessor/linux-final352-focus-indices.txt" \
            --jobs 8 \
            --label focusfinal-3000-3351

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-focus-3000-3351
          path: |
            build/minipp-linux-focus352f-work/replay/headline.txt
            build/minipp-linux-focus352f-work/replay/results.tsv
            build/minipp-linux-focus352f-work/replay/results.json
            build/minipp-linux-focus352f-work/replay/failure-pool.tsv
            build/minipp-linux-focus352f-work/replay/diff/**
            build/minipp-linux-focus352f-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3
