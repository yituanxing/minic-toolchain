name: One-shot Core Frontier M31b Array Diagnostic

on:
  pull_request:
    branches: [frontend/linux-first500-final-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  array-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0
      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh
      - name: Apply M31b and build
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/run-core-frontier-batch-m31b.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m31b-array-diag
      - name: Probe array address shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31b-array-diag/bin/minic"
          w="$GITHUB_WORKSPACE/build/m31b-array-diag-work"
          mkdir -p "$w"
          cat > "$w/global_plain_direct.c" <<'EOF'
          static unsigned a[] = {10,20,30};
          unsigned f(unsigned n) { return a[n]; }
          EOF
          cat > "$w/global_const_direct.c" <<'EOF'
          static const unsigned a[] = {10,20,30};
          unsigned f(unsigned n) { return a[n]; }
          EOF
          cat > "$w/global_const_zero.c" <<'EOF'
          static const unsigned a[] = {10,20,30};
          unsigned f(void) { return a[0]; }
          EOF
          cat > "$w/global_const_ternary.c" <<'EOF'
          static const unsigned a[] = {10,20,30};
          unsigned f(unsigned n) { return n < 3 ? a[n] : 0; }
          EOF
          cat > "$w/global_const_decay.c" <<'EOF'
          static const unsigned a[] = {10,20,30};
          const unsigned *f(void) { return a; }
          EOF
          cat > "$w/global_const_address0.c" <<'EOF'
          static const unsigned a[] = {10,20,30};
          const unsigned *f(void) { return &a[0]; }
          EOF
          cat > "$w/local_static_const_direct.c" <<'EOF'
          unsigned f(unsigned n) { static const unsigned a[] = {10,20,30}; return a[n]; }
          EOF
          fail=0
          for src in "$w"/*.c; do
            name=$(basename "$src" .c)
            set +e
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$name.s" 2>"$w/$name.err"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              printf 'M31B_ARRAY_SHAPE name=%s status=PASS\n' "$name"
            else
              printf 'M31B_ARRAY_SHAPE name=%s status=UNSUPPORTED rc=%d\n' "$name" "$rc"
              cat "$w/$name.err"
              fail=1
            fi
          done
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-frontier-m31b-array-diagnostic
          path: build/m31b-array-diag-work/
          if-no-files-found: error
