name: Core M36 Leading Zero Qualification

on:
  pull_request:

jobs:
  qualify:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0
      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh
      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply M31b through M36 and build release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m36-candidate
      - name: Focused clzll and order-base2 shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m36-candidate/bin/minic"; w=build/m36-shapes; mkdir -p "$w"
          cat > "$w/clzll.c" <<'EOF'
          int f(unsigned long n) { return 63 - __builtin_clzll(n); }
          EOF
          cat > "$w/ilog2_like.c" <<'EOF'
          static int a(unsigned int n) { return (int)n; }
          static int b(unsigned long n) { return (int)n; }
          static int ilog(unsigned long n) {
              return __builtin_constant_p(n) ?
                  (n < 2 ? 0 : 63 - __builtin_clzll(n)) :
                  (sizeof(n) <= 4 ? a((unsigned int)n) : b(n));
          }
          int f(unsigned long n) { return n > 1 ? ilog(n - 1) + 1 : 0; }
          EOF
          for src in "$w/clzll.c" "$w/ilog2_like.c"; do
            name=$(basename "$src" .c)
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$name.s"
            ! grep -Eq '(^|[[:space:]])clz([[:space:]]|$)' "$w/$name.s"
            echo "M36_SHAPE_PASS name=$name"
          done
      - name: RISC-V QEMU differential without Zbb dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m36-candidate/bin/minic"; w=build/m36-shapes
          cat > "$w/runtime_source.c" <<'EOF'
          int c(unsigned long long x) { return __builtin_clzll(x); }
          int order(unsigned long n) { return n > 1 ? (63 - __builtin_clzll(n - 1)) + 1 : 0; }
          EOF
          cat > "$w/runtime.c" <<'EOF'
          #include <stdio.h>
          int c(unsigned long long);
          int order(unsigned long);
          int main(void) {
              printf("%d %d %d %d %d %d\n", c(1ULL), c(16ULL), c(0x8000000000000000ULL), c(0x00f0000000000000ULL), order(1), order(9));
              return 0;
          }
          EOF
          MINIC_CORE_IR=strict "$c" -S "$w/runtime_source.c" -o "$w/minic.s"
          ! grep -Eq '(^|[[:space:]])clz([[:space:]]|$)' "$w/minic.s"
          riscv64-linux-gnu-gcc -O0 -static "$w/runtime.c" "$w/minic.s" -o "$w/minic.elf"
          riscv64-linux-gnu-gcc -O0 -static "$w/runtime.c" "$w/runtime_source.c" -o "$w/gcc.elf"
          qemu-riscv64 "$w/minic.elf" > "$w/minic.out"
          qemu-riscv64 "$w/gcc.elf" > "$w/gcc.out"
          diff -u "$w/gcc.out" "$w/minic.out"
          grep -Fx '63 59 0 8 0 4' "$w/minic.out"
          echo M36_QEMU_DIFF_PASS
      - name: Frozen representative leaves order-base2
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m36-candidate/bin/minic"; w=build/m36-rep; mkdir -p "$w"
          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/version.i -o "$w/version.s" 2>"$w/version.err"
          rc=$?
          set -e
          cat "$w/version.err"
          ! grep -Fq "Core IR shadow does not yet support function '__order_base_2'" "$w/version.err"
          if [ "$rc" -ne 0 ]; then grep -Fq 'Core IR shadow does not yet support function' "$w/version.err"; fi
          printf 'M36_REP_MOVED rc=%d\n' "$rc"
      - name: Frozen strict first500 replay and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m36-candidate/bin/minic"; w="$GITHUB_WORKSPACE/build/m36-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$c" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$w" --jobs 5 --offset 0 --limit 500 --sample-count 0 --indices ''
          rc=$?
          set -e
          printf 'M36_STRICT500_REPLAY_STATUS=%d\n' "$rc"
          python3 tools/ci/classify-core-strict-frontier.py "$w/batch-results.json" --examples 5 --json-out "$w/frontier-summary.json" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m36-strict500/frontier-summary.json').read_text())
          assert s['selected']==500 and s['error']==0 and s['preprocess_missing']==0, s
          assert s['pass']+s['unsupported']==500, s
          b={r['function']:r['count'] for r in s['blockers']}
          assert b.get('__order_base_2',0)==0, b.get('__order_base_2')
          print(f"M36_STRICT500 selected=500 pass={s['pass']} unsupported={s['unsupported']} error=0 distinct={len(s['blockers'])}")
          for r in s['blockers'][:40]: print(f"M36_NEXT_BLOCKER count={r['count']} function={r['function']}")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-frontier-m36-evidence
          path: |
            build/m36-shapes/
            build/m36-rep/
            build/m36-strict500/frontier-summary.json
            build/m36-strict500/batch-results.json
          if-no-files-found: warn
