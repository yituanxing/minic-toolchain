name: MiniAS A0 Native Linux ASM35

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_NATIVE26_RUN: "33245348705"
  FROZEN_NATIVE26_FILES_SHA256: "fdbdf1f8fbf4ddcb1af4ff689225780f12e0e243dec3b9540fc493e766b429f6"
  FROZEN_NATIVE35_EXTRA9_RUN: "33247303056"
  FROZEN_NATIVE35_SIDECARS_RUN: "33247303056"

jobs:
  native35:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-native35]')
    concurrency:
      group: minias-native35-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native35-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-native35-toolchain check-minias-a0

      - name: Download frozen native26 inputs
        uses: actions/download-artifact@v4
        with:
          name: minias-a0-native26-progress
          path: build/import-native26
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_NATIVE26_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and materialize frozen native26 inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-native26
          root=build/minias-native35-inputs
          rm -rf "$root" build/linux-native35-out
          mkdir -p "$root" build/linux-native35-out
          test -d "$import/minias-native26-inputs"
          cp -a "$import/minias-native26-inputs/." "$root/"
          count=$(find "$root" -type f -name '*.s' | wc -l)
          test "$count" -eq 26

          (
            cd "$root"
            find . -type f -name '*.s' -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > ../native26-files.sha256
          )
          actual=$(sha256sum build/native26-files.sha256 | cut -d' ' -f1)
          test "$actual" = "$FROZEN_NATIVE26_FILES_SHA256"
          echo "MINIAS_NATIVE35_BASE26=PASS selected=26 files_sha256=$actual"

      - name: Download ground-truth native35 extra9
        uses: actions/download-artifact@v4
        with:
          name: minias-native35-extra9-v1
          path: build/import-native35-extra9
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_NATIVE35_EXTRA9_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and merge ground-truth extra9
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-native35-extra9
          root=build/minias-native35-inputs
          test "$(find "$import" -type f -name '*.s' | wc -l)" -eq 9
          while IFS= read -r -d '' src; do
            rel=${src#"$import"/}
            test ! -e "$root/$rel"
            mkdir -p "$root/$(dirname "$rel")"
            cp "$src" "$root/$rel"
          done < <(find "$import" -type f -name '*.s' -print0 | LC_ALL=C sort -z)
          test "$(find "$root" -type f -name '*.s' | wc -l)" -eq 35
          (
            cd "$import"
            find . -type f -name '*.s' -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > ../native35-extra9-files.sha256
          )
          echo "MINIAS_NATIVE35_EXTRA9=PASS selected=9 digest=$(sha256sum build/native35-extra9-files.sha256 | cut -d' ' -f1)"
          echo "MINIAS_NATIVE35_INPUTS=PASS selected=35"

      - name: Download frozen native35 incbin sidecars
        uses: actions/download-artifact@v4
        with:
          name: minias-native26-sidecars-v1
          path: build/import-native35-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_NATIVE35_SIDECARS_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and materialize native35 incbin sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-native35-sidecars
          target=build/linux-native35-out
          test -s "$import/SHA256SUMS"
          (
            cd "$import"
            sha256sum -c SHA256SUMS
          )
          sidecars=(
            arch/riscv/kernel/vdso/vdso.so
            arch/riscv/kernel/compat_vdso/compat_vdso.so
            arch/riscv/purgatory/purgatory.ro
            usr/initramfs_inc_data
          )
          for rel in "${sidecars[@]}"; do
            test -s "$import/$rel"
            mkdir -p "$target/$(dirname "$rel")"
            cp "$import/$rel" "$target/$rel"
          done
          echo "MINIAS_NATIVE35_SIDECARS=PASS count=4"

      - name: Assemble native35 and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, subprocess

          workspace = Path.cwd().resolve()
          minias = workspace / "build/minias-native35-toolchain/bin/minic-as"
          input_root = workspace / "build/minias-native35-inputs"
          linux_out = workspace / "build/linux-native35-out"
          result_root = workspace / "build/minias-native35-results"
          result_root.mkdir(parents=True, exist_ok=True)
          files = sorted(input_root.rglob("*.s"))
          if len(files) != 35:
              raise SystemExit(f"expected 35 native inputs, got {len(files)}")

          results = []
          blockers = Counter()
          for inp in files:
              rel = inp.relative_to(input_root).as_posix()
              obj = result_root / (rel[:-2] + ".o")
              err = result_root / (rel[:-2] + ".err")
              obj.parent.mkdir(parents=True, exist_ok=True)
              err.parent.mkdir(parents=True, exist_ok=True)
              proc = subprocess.run(
                  [str(minias), "-o", str(obj), str(inp)],
                  cwd=linux_out,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
              )
              err.write_text(proc.stderr)
              ok = False
              if proc.returncode == 0 and obj.is_file() and obj.stat().st_size:
                  check = subprocess.run(
                      ["readelf", "-h", str(obj)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      errors="replace",
                  )
                  ok = check.returncode == 0 and "RISC-V" in check.stdout and "REL (Relocatable file)" in check.stdout
              if ok:
                  results.append(("PASS", rel, "-"))
                  continue
              raw = next((line.strip() for line in proc.stderr.splitlines() if line.strip()), "internal:no-diagnostic")
              blocker = re.sub(r"^minic-as:\s*", "", raw)
              blocker = re.sub(r":line=[0-9]+$", "", blocker)
              blockers[blocker] += 1
              results.append(("FAIL", rel, blocker))

          (result_root / "results.tsv").write_text(
              "".join(f"{status}\t{path}\t{blocker}\n" for status, path, blocker in results)
          )
          pass_count = sum(status == "PASS" for status, _, _ in results)
          fail_count = len(results) - pass_count
          lines = [
              f"MINIAS_NATIVE35_SUMMARY pass={pass_count} fail={fail_count} total={len(results)}",
              "MINIAS_NATIVE35_TOP_BLOCKERS",
          ]
          lines.extend(
              [f"  {count:5d} {blocker}" for blocker, count in blockers.most_common()]
              or ["  none"]
          )
          lines.append("MINIAS_NATIVE35_FILES")
          lines.extend(f"{status}\t{path}\t{blocker}" for status, path, blocker in results)
          summary = "\n".join(lines) + "\n"
          (result_root / "summary.txt").write_text(summary)
          print(summary, end="")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minias-a0-native35-progress
          path: |
            build/minias-native35-inputs/**/*.s
            build/minias-native35-results/results.tsv
            build/minias-native35-results/summary.txt
            build/minias-native35-results/**/*.err
          retention-days: 30
          if-no-files-found: warn
