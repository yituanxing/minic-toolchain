name: MiniAR A1 Linux Boundary

on:
  push:
    branches:
      - "toolchain/miniar-linux"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniar-a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install archive oracle prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Build MiniAR with strict warnings
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-a1 all

      - name: Keep A0 exact gate green
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-a1 check-miniar-a0

      - name: Validate Linux archive semantics
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-a1 check-miniar-a1
