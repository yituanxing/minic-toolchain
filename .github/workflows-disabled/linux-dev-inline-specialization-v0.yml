name: Linux Dev Inline Specialization V0

on:
  push:
    branches:
      - "agent/linux-local-integer-isolate-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-dev-inline-specialization-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 Linux prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Build focused patched Mini toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-dev-inline-specialization-v0"
          build="$work/toolchain"
          mkdir -p "$work/evidence"
          python3 tools/ci/apply-local-integer-assignment-v2.py | tee "$work/evidence/local-integer.log"
          python3 tools/ci/apply-local-integer-logical-conditions-v0.py | tee "$work/evidence/logical.log"
          python3 tools/ci/apply-inline-integer-specialization-v0.py | tee "$work/evidence/specialization.log"
          python3 tools/ci/apply-inline-specialization-local-facts-v0.py | tee "$work/evidence/local-facts.log"
          python3 tools/ci/apply-inline-specialization-stable-parameter-facts-v0.py | tee "$work/evidence/stable-facts.log"
          python3 tools/ci/apply-inline-specialization-transitive-integer-v0.py | tee "$work/evidence/transitive.log"
          python3 tools/ci/apply-inline-specialization-capacity-v0.py | tee "$work/evidence/capacity.log"
          python3 tools/ci/apply-inline-specialization-core-reachability-v0.py | tee "$work/evidence/reachability.log"
          python3 tools/ci/apply-inline-specialization-core-empty-function-v0.py | tee "$work/evidence/empty-core.log"
          python3 tools/ci/apply-inline-specialization-label-alias-v0.py | tee "$work/evidence/label-alias.log"
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" all
          test -x "$build/bin/minic"

      - name: Build real Linux net/core/dev.o
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-dev-inline-specialization-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          archive="$work/linux-6.6.143.tar.xz"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          "$src/scripts/config" --file "$out/.config" \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j4 prepare
          MINIC="$work/toolchain/bin/minic" \
          REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 \
          MINIC_KBUILD_TRACE="$work/evidence/minic-kbuild.trace" \
          CORE_FAST_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
              CC="$wrapper" -j1 V=1 net/core/dev.o \
              >"$work/evidence/dev-kbuild.log" 2>&1
          test -s "$out/net/core/dev.o"
          cp "$out/net/core/dev.minic-stage2.minic.stderr" "$work/evidence/dev.minic.stderr" 2>/dev/null || true
          echo "LINUX_DEV_INLINE_SPECIALIZATION_V0=PASS"

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-dev-inline-specialization-v0
          path: build/linux-dev-inline-specialization-v0/evidence/
          if-no-files-found: ignore
          retention-days: 5
