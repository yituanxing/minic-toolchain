name: MiniC Local Constant Trace V1

on:
  push:
    branches:
      - agent/linux-local-integer-isolate-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install RV64 tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3
      - name: Trace local constant fact loss
        run: bash tools/ci/run-local-constant-trace-v1.sh
      - name: Preserve trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-local-constant-trace-v1
          path: build/local-constant-trace-v1/
          if-no-files-found: ignore
          retention-days: 3
