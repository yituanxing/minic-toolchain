name: MiniAS A0 All3352 Exact

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_CORPUS_EXPORT_RUN: "33186855250"
  FROZEN_SIDECARS_RUN: "33237304382"
  FROZEN_CONFIG_GZ_SHA256: "8511a666382dda596a9ddba313113f77182d3156fed890a2ea9f2e86223226ff"

jobs:
  shard:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-all3352]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: first500
            artifact: frozen-linux-corpus-first500
            corpus_dir: linux-focus-corpus
            total: 500
          - label: new500
            artifact: frozen-linux-corpus-new500
            corpus_dir: linux-new500-corpus
            total: 500
          - label: next500
            artifact: frozen-linux-corpus-next500
            corpus_dir: linux-next500-corpus
            total: 500
          - label: next500b
            artifact: frozen-linux-corpus-next500b
            corpus_dir: linux-next500b-corpus
            total: 500
          - label: next500c
            artifact: frozen-linux-corpus-next500c
            corpus_dir: linux-next500c-corpus
            total: 500
          - label: next500d
            artifact: frozen-linux-corpus-next500d
            corpus_dir: linux-next500d-corpus
            total: 500
          - label: final352
            artifact: frozen-linux-corpus-final352
            corpus_dir: linux-final352-corpus
            total: 352
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download frozen Linux corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/import-${{ matrix.label }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen Linux corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          import="build/import-${{ matrix.label }}"
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (cd build && sha256sum -c "import-${{ matrix.label }}/files.sha256" >/dev/null)
          manifest="build/${{ matrix.corpus_dir }}/selected-tus.txt"
          test -s "$manifest"
          test "$(grep -cve '^[[:space:]]*$' "$manifest")" -eq ${{ matrix.total }}
          echo "MINIAS_ALL3352_CORPUS label=${{ matrix.label }} selected=${{ matrix.total }} sha=$actual"

      - name: Restore frozen MiniAS Linux sidecars
        uses: actions/download-artifact@v4
        with:
          name: minias-linux-sidecars-v1
          path: build/import-minias-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_SIDECARS_RUN }}
          github-token: ${{ github.token }}

      - name: Verify and install frozen incbin sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=build/import-minias-sidecars/kernel/config_data.gz
          test -s "$payload"
          actual=$(sha256sum "$payload" | cut -d' ' -f1)
          test "$actual" = "$FROZEN_CONFIG_GZ_SHA256"
          mkdir -p kernel
          cp "$payload" kernel/config_data.gz
          echo "MINIAS_ALL3352_SIDECAR=PASS sha256=$actual"

      - name: Build exact compiler and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-all3352-toolchain all

      - name: Run MiniAS micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-all3352-toolchain check-minias-a0

      - name: Generate exact assembly window
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/minias-all3352-toolchain/bin/minic-cc"
          corpus="$GITHUB_WORKSPACE/build/${{ matrix.corpus_dir }}"
          work="$GITHUB_WORKSPACE/build/minias-all3352-${{ matrix.label }}"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit ${{ matrix.total }} \
            --sample-count 0
          python3 - "$work/batch-results.json" ${{ matrix.total }} <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          expected=int(sys.argv[2])
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==expected and not bad, (len(rows), expected, bad[:5])
          print(f"MINIAS_ALL3352_INPUT=PASS generated={expected}")
          PY

      - name: Assemble exact window and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-all3352-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-all3352-${{ matrix.label }}/minic-out"
          out="$GITHUB_WORKSPACE/build/minias-all3352-${{ matrix.label }}/minias-out"
          expected=${{ matrix.total }}
          mkdir -p "$out"
          worker="$out/assemble-one.sh"
          cat >"$worker" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          minias=$1
          root=$2
          out=$3
          asm=$4
          rel="${asm#"$root"/}"
          stem="$out/${rel%.s}"
          obj="$stem.o"
          err="$stem.err"
          result="$stem.result"
          blocker="$stem.blocker"
          mkdir -p "$(dirname "$obj")"
          if "$minias" -o "$obj" "$asm" 2>"$err"; then
            readelf -h "$obj" | grep -q 'RISC-V'
            readelf -h "$obj" | grep -q 'REL (Relocatable file)'
            printf 'PASS\t%s\t-\n' "$rel" >"$result"
          else
            raw=$(head -n 1 "$err" || true)
            first=$(printf '%s\n' "$raw" | sed -E 's/^minic-as: //; s/:line=[0-9]+$//')
            if test -z "$first"; then first="internal:no-diagnostic"; fi
            printf '%s\n' "$first" >"$blocker"
            printf 'FAIL\t%s\t%s\n' "$rel" "$first" >"$result"
          fi
          SH
          chmod +x "$worker"

          mapfile -t files < <(find "$root" -type f -name '*.s' | LC_ALL=C sort)
          test "${#files[@]}" -eq "$expected"
          printf '%s\0' "${files[@]}" |
            xargs -0 -n1 -P"${MINIAS_ASSEMBLY_JOBS:-4}" "$worker" "$minias" "$root" "$out"

          mapfile -d '' -t results < <(find "$out" -type f -name '*.result' -print0 | LC_ALL=C sort -z)
          test "${#results[@]}" -eq "$expected"
          for f in "${results[@]}"; do cat "$f"; done | LC_ALL=C sort -t $'\t' -k2,2 >"$out/results.tsv"
          find "$out" -type f -name '*.blocker' -print0 | LC_ALL=C sort -z | xargs -0 -r cat >"$out/blockers.txt"

          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")
          printf 'MINIAS_ALL3352_SHARD label=%s pass=%s fail=%s total=%s\n' \
            "${{ matrix.label }}" "$pass" "$fail" "$expected"
          test $((pass + fail)) -eq "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: minias-all3352-${{ matrix.label }}
          path: |
            build/minias-all3352-${{ matrix.label }}/minias-out/results.tsv
            build/minias-all3352-${{ matrix.label }}/minias-out/blockers.txt
          retention-days: 30
          if-no-files-found: error

  all3352:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-all3352]'))
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - name: Require matrix completion
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ needs.shard.result }}" = success

      - uses: actions/download-artifact@v4
        with:
          pattern: minias-all3352-*
          path: build/minias-all3352-results

      - name: Aggregate exact all3352
        shell: bash
        run: |
          set -Eeuo pipefail
          out=build/minias-all3352-aggregate
          mkdir -p "$out"
          mapfile -t results < <(find build/minias-all3352-results -type f -name results.tsv | LC_ALL=C sort)
          mapfile -t blockers < <(find build/minias-all3352-results -type f -name blockers.txt | LC_ALL=C sort)
          test "${#results[@]}" -eq 7
          for f in "${results[@]}"; do cat "$f"; done >"$out/results.tsv"
          : >"$out/blockers.txt"
          for f in "${blockers[@]}"; do cat "$f"; done >"$out/blockers.txt"
          test "$(wc -l < "$out/results.tsv")" -eq 3352

          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")
          error=$(awk -F '\t' '$1=="FAIL" && ($3 ~ /^internal:/ || $3 ~ /^out-of-memory:/) {n++} END {print n+0}' "$out/results.tsv")
          echo "MINIAS_ALL3352_EXACT head=$GITHUB_SHA selected=3352 pass=$pass fail=$fail error=$error"
          if test -s "$out/blockers.txt"; then
            echo "MINIAS_ALL3352_TOP_BLOCKERS"
            LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr | head -40
          fi
          test "$pass" -eq 3352
          test "$fail" -eq 0
          test "$error" -eq 0
