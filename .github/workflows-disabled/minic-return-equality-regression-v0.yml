name: MiniC Return Equality Regression V0

on:
  push:
    branches:
      - "agent/linux-link-correctness-v0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minic-return-equality-regression-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install RV64 tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu python3
      - name: Reproduce baseline versus patched
        shell: bash
        run: bash tools/ci/run-return-equality-regression-v0.sh
      - name: Preserve trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-return-equality-regression-v0
          path: build/return-equality-regression-v0/
          if-no-files-found: ignore
          retention-days: 3
