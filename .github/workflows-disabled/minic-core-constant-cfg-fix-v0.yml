name: MiniC Core Constant CFG Fix V0

on:
  push:
    branches:
      - agent/linux-link-correctness-v0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install RV64 prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Patch and prove constant CFG semantics
        run: bash tools/ci/run-constant-cfg-fix-v0.sh
