name: Linux Runtime Get Current Owner V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-get-current-owner-v0.yml"
      - "tools/ci/runtime-get-current-owner-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-get-current-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-current-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-get-current-owner-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-get-current-owner-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh certified frontier owners
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-get-current-owner-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-get-current-owner-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" \
            "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
            "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock_debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build_utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build_policy-refresh.log

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-get-current-owner-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"

      - name: Identify linked get_current owner
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-get-current-owner-v0"
          elf="$ev/early/vmlinux.early"

          riscv64-linux-gnu-nm -an "$elf" | grep -n -C 12 ' get_current$' >"$ev/linked-get-current-symbols.txt" || true
          riscv64-linux-gnu-objdump -d \
            --start-address=0xffffffff808b6f40 --stop-address=0xffffffff808b7040 \
            "$elf" >"$ev/linked-get-current-target.objdump.txt"

          {
            for archive in "$out/vmlinux.a" "$out/built-in.a" "$out/lib/lib.a" "$out/arch/riscv/lib/lib.a"; do
              echo "### $archive"
              riscv64-linux-gnu-nm -A -an "$archive" 2>/dev/null | grep ' get_current$' || true
            done
          } >"$ev/get-current-archive-candidates.txt"

          cd "$out"
          riscv64-linux-gnu-ld \
            -melf64lriscv -z noexecstack --no-warn-rwx-segments \
            -z norelro --build-id=sha1 --orphan-handling=warn \
            --script=arch/riscv/kernel/vmlinux.lds --strip-debug \
            -Map="$ev/early/vmlinux.map" --cref \
            -o "$ev/early/vmlinux.map.elf" \
            --whole-archive vmlinux.a init/version-timestamp.o --no-whole-archive \
            --start-group ./drivers/firmware/efi/libstub/lib.a --end-group \
            >"$ev/early/map-ld.stdout.txt" 2>"$ev/early/map-ld.stderr.txt"

          grep -n -C 12 'get_current' "$ev/early/vmlinux.map" >"$ev/map-get-current.txt" || true
          grep -i -n -C 20 '808b6f' "$ev/early/vmlinux.map" >"$ev/map-target-window.txt" || true

          python3 - <<'PY'
          from pathlib import Path
          target = int('ffffffff808b6fa6', 16)
          lines = Path('build/linux-runtime-get-current-owner-v0/early/nm.txt').read_text(errors='replace').splitlines()
          parsed=[]
          for i,line in enumerate(lines):
              p=line.split()
              if len(p)>=3:
                  try: a=int(p[0],16)
                  except ValueError: continue
                  parsed.append((a,i,line))
          before=[x for x in parsed if x[0] <= target][-30:]
          after=[x for x in parsed if x[0] > target][:30]
          out='\n'.join(x[2] for x in before+after)+'\n'
          Path('build/linux-runtime-get-current-owner-v0/target-neighbor-symbols.txt').write_text(out)
          print(out)
          PY

          echo 'GET_CURRENT_OWNER_DIAG=PASS'

      - name: Execute QEMU current frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-get-current-owner-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-init-irq-frontier-v0.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$ev/watch/frontier-summary.txt" || true
          exit "$rc"

      - name: Preserve owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-get-current-owner-v0-${{ github.sha }}
          path: |
            build/linux-runtime-get-current-owner-v0/profile/patch.log
            build/linux-runtime-get-current-owner-v0/*-refresh.log
            build/linux-runtime-get-current-owner-v0/early/nm.txt
            build/linux-runtime-get-current-owner-v0/early/vmlinux.map
            build/linux-runtime-get-current-owner-v0/linked-get-current-symbols.txt
            build/linux-runtime-get-current-owner-v0/linked-get-current-target.objdump.txt
            build/linux-runtime-get-current-owner-v0/get-current-archive-candidates.txt
            build/linux-runtime-get-current-owner-v0/map-get-current.txt
            build/linux-runtime-get-current-owner-v0/map-target-window.txt
            build/linux-runtime-get-current-owner-v0/target-neighbor-symbols.txt
            build/linux-runtime-get-current-owner-v0/watch/frontier-result.json
            build/linux-runtime-get-current-owner-v0/watch/frontier-summary.txt
            build/linux-runtime-get-current-owner-v0/watch/watch-result.json
            build/linux-runtime-get-current-owner-v0/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
