name: MiniPP Linux Focus 500-999

concurrency:
  group: minipp-linux-focus500b-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'toolchain/minipp-*'
    paths:
      - 'preprocessor/**'
      - 'tools/minic-cpp/**'
      - 'tests/preprocessor/**'
      - '.github/workflows/minipp-linux-focus-500-999.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  MINIPP_LINUX_ARCHIVE_SHA256: dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
  MINIPP_SECOND500_CACHE_KEY: minipp-linux-ref500b-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-202aaedea66c38df0c121ec50b8862335f8f0f0fac11d96e5167f76280cf1fc0-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-a4ddb411938926d3e95625a210030a14317e4bc20b881416269e4698576a8e8e

jobs:
  focus7:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minipp-linux-1000-focus]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install focused replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross make curl xz-utils

      - name: Build independent MiniPP
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-focus500b toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-focus500b all
          test -x build/minipp-linux-focus500b/bin/minic-cpp

      - name: Prepare immutable Linux source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-focus500b-work"
          archive="$work/linux-6.6.143.tar.xz"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"

      - name: Restore frozen GCC second500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref500b-corpus
          key: ${{ env.MINIPP_SECOND500_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Replay focused second500 pool
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-focus500b-work"
          corpus="$GITHUB_WORKSPACE/build/minipp-linux-ref500b-corpus"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$corpus/contract.jsonl" \
            --corpus "$corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-focus500b/bin/minic-cpp" \
            --work "$work/replay" \
            --indices "$GITHUB_WORKSPACE/tests/preprocessor/linux-second500-focus-indices.txt" \
            --jobs 7 \
            --label focus7-500-999

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-focus-500-999
          path: |
            build/minipp-linux-focus500b-work/replay/headline.txt
            build/minipp-linux-focus500b-work/replay/results.tsv
            build/minipp-linux-focus500b-work/replay/results.json
            build/minipp-linux-focus500b-work/replay/failure-pool.tsv
            build/minipp-linux-focus500b-work/replay/diff/**
            build/minipp-linux-focus500b-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3
