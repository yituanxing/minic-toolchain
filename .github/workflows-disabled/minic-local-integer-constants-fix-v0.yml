name: MiniC Local Integer Constants Fix V0

on:
  push:
    branches:
      - "agent/linux-link-correctness-v0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minic-local-integer-constants-fix-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-local-integer-constants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RV64 Linux prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Patch and prove local integer constants
        shell: bash
        run: bash tools/ci/run-local-integer-constants-fix-v0.sh

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minic-local-integer-constants-fix-v0
          path: |
            build/local-integer-constants-v0/test/
            build/local-integer-constants-v0/evidence/
            build/local-integer-constants-v0/patch.log
          if-no-files-found: ignore
          retention-days: 7
