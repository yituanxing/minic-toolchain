name: MiniLD Dynamic A4 Rebase Gate

on:
  push:
    branches:
      - "toolchain/minild-dynamic-a4-rebase"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minild-a4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V GNU oracle tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user

      - name: Strict build
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4-rebase all

      - name: Preserve current static linker contracts
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4-rebase check-minielf-reader-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4-rebase check-minild-script-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4-rebase check-minild-a3

      - name: Validate dynamic A4
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a4-rebase check-minild-a4
