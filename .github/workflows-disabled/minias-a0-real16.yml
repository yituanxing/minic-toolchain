name: MiniAS A0 Real Linux 16

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_CORPUS_EXPORT_RUN: "33186855250"

jobs:
  real16:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minias-real16]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen first500 corpus
        uses: actions/download-artifact@v4
        with:
          name: frozen-linux-corpus-first500
          path: build/import-first500
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_CORPUS_EXPORT_RUN }}
          github-token: ${{ github.token }}

      - name: Verify frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          import=build/import-first500
          expected=$(cut -d' ' -f1 "$import/corpus.tar.gz.sha256")
          actual=$(sha256sum "$import/corpus.tar.gz" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -C build -xzf "$import/corpus.tar.gz"
          (
            cd build
            sha256sum -c import-first500/files.sha256 >/dev/null
          )
          echo "FROZEN_CORPUS=PASS archive_sha=$actual"

      - name: Build compiler and MiniAS
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-real16-toolchain all

      - name: Run MiniAS A0 micro gate
        run: make MODE=release CFLAGS=-Werror BUILD_DIR=build/minias-real16-toolchain check-minias-a0

      - name: Generate 16 real Linux assembly files
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/minias-real16-toolchain/bin/minic-cc"
          work="$GITHUB_WORKSPACE/build/minias-real16"
          CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 --offset 0 --limit 500 --sample-count 16
          python3 - "$work/batch-results.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))
          bad=[r for r in rows if r["status"]!="PASS"]
          assert len(rows)==16 and not bad, (len(rows), bad)
          print("MINIAS_REAL16_INPUT=PASS generated=16")
          PY

      - name: Assemble real Linux sample and classify first blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          minias="$GITHUB_WORKSPACE/build/minias-real16-toolchain/bin/minic-as"
          root="$GITHUB_WORKSPACE/build/minias-real16/minic-out"
          out="$GITHUB_WORKSPACE/build/minias-real16/minias-out"
          mkdir -p "$out"
          : > "$out/results.tsv"
          : > "$out/blockers.txt"
          pass=0
          fail=0

          mapfile -t files < <(find "$root" -type f -name '*.s' | LC_ALL=C sort)
          test "${#files[@]}" -eq 16

          worker="$out/assemble-one.sh"
          cat >"$worker" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          minias=$1
          root=$2
          out=$3
          asm=$4
          rel="${asm#"$root"/}"
          stem="$out/${rel%.s}"
          obj="$stem.o"
          err="$stem.err"
          result="$stem.result"
          blocker="$stem.blocker"
          mkdir -p "$(dirname "$obj")"
          if "$minias" -o "$obj" "$asm" 2>"$err"; then
            readelf -h "$obj" | grep -q 'RISC-V'
            readelf -h "$obj" | grep -q 'REL (Relocatable file)'
            printf 'PASS\t%s\t-\n' "$rel" >"$result"
          else
            raw=$(head -n 1 "$err")
            first=$(printf '%s\n' "$raw" | sed -E 's/^minic-as: //; s/:line=[0-9]+$//')
            line=$(printf '%s\n' "$raw" | sed -nE 's/.*:line=([0-9]+)$/\1/p')
            test -n "$first"
            printf '%s\n' "$first" >"$blocker"
            printf 'FAIL\t%s\t%s\n' "$rel" "$first" >"$result"
            if [[ "$line" =~ ^[0-9]+$ ]]; then
              context="$stem.context.txt"
              from=$(( line > 3 ? line - 3 : 1 ))
              to=$(( line + 3 ))
              {
                printf 'MINIAS_BLOCKER_CONTEXT file=%s line=%s blocker=%s\n' "$rel" "$line" "$first"
                nl -ba "$asm" | sed -n "${from},${to}p"
              } >"$context"
            fi
          fi
          SH
          chmod +x "$worker"

          jobs="${MINIAS_ASSEMBLY_JOBS:-4}"
          printf '%s\0' "${files[@]}" |
            xargs -0 -n1 -P"$jobs" "$worker" "$minias" "$root" "$out"

          mapfile -d '' -t result_files < <(
            find "$out" -type f -name '*.result' -print0 | LC_ALL=C sort -z
          )
          test "${#result_files[@]}" -eq 16
          for result in "${result_files[@]}"; do
            cat "$result"
          done >"$out/results.tsv"

          find "$out" -type f -name '*.blocker' -print0 |
            LC_ALL=C sort -z |
            xargs -0 -r cat >"$out/blockers.txt"

          find "$out" -type f -name '*.context.txt' -print0 |
            LC_ALL=C sort -z |
            xargs -0 -r cat

          pass=$(awk -F '\t' '$1=="PASS" {n++} END {print n+0}' "$out/results.tsv")
          fail=$(awk -F '\t' '$1=="FAIL" {n++} END {print n+0}' "$out/results.tsv")

          {
            echo "MINIAS_REAL16_SUMMARY pass=$pass fail=$fail total=16"
            echo "MINIAS_REAL16_BLOCKERS"
            if test -s "$out/blockers.txt"; then
              LC_ALL=C sort "$out/blockers.txt" | uniq -c | sort -nr
            else
              echo "  none"
            fi
            echo "MINIAS_REAL16_FILES"
            cat "$out/results.tsv"
          } | tee "$out/summary.txt"

          test $((pass + fail)) -eq 16

      - uses: actions/upload-artifact@v4
        with:
          name: minias-a0-real16
          path: |
            build/minias-real16/minias-out/results.tsv
            build/minias-real16/minias-out/summary.txt
            build/minias-real16/minias-out/**/*.err
            build/minias-real16/minias-out/**/*.context.txt
          retention-days: 14
          if-no-files-found: error
