name: MiniAR A0 Exact

on:
  push:
    branches:
      - "toolchain/miniar-a0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniar-a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install archive oracle prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Build MiniAR with strict warnings
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-a0 all

      - name: Run GNU ar byte-exact A0 gate
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniar-a0 check-miniar-a0
