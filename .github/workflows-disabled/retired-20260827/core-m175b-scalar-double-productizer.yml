name: Core M175B Scalar Double + M175 Core-Only Cut

on:
  pull_request:
  push:
    branches:
      - refactor/declaration-sema-v1

permissions:
  contents: write

jobs:
  productize:
    if: github.event_name == 'push' || github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect M175B and Core-only state
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          needs_m175b=true
          needs_cut=true
          grep -Fq 'M175B_SCALAR_DOUBLE_BRIDGE' src/core/core_lower.c && needs_m175b=false
          if ! git grep -n 'minic_riscv64_emit_function(' -- src/target/riscv64/codegen_function.c >/dev/null && \
             ! git grep -n 'minic_riscv64_write_c0_program(' -- src/target/riscv64/codegen_function.c src/target/riscv64/codegen.h >/dev/null; then
            needs_cut=false
          fi
          echo "needs_m175b=$needs_m175b" >> "$GITHUB_OUTPUT"
          echo "needs_cut=$needs_cut" >> "$GITHUB_OUTPUT"
          if [ "$needs_m175b" = true ] || [ "$needs_cut" = true ]; then
            echo 'needs_work=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_work=false' >> "$GITHUB_OUTPUT"
          fi
          printf 'M175_STATE head=%s needs_m175b=%s needs_cut=%s\n' "$(git rev-parse HEAD)" "$needs_m175b" "$needs_cut"

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_work == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_work == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Materialize M175B semantic candidate
        if: steps.state.outputs.needs_m175b == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m175b-qualification.py
          git diff --check

      - name: Sever legacy AST to RV64 function route
        if: steps.state.outputs.needs_cut == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          before_test_hash=$(git hash-object tests/compiler/c0/run.sh)
          python3 tools/ci/apply-m175-core-only-cut.py
          git diff --check
          test "$before_test_hash" = "$(git hash-object tests/compiler/c0/run.sh)"
          ! git grep -n 'minic_riscv64_write_c0_program(' -- src
          ! git grep -n 'minic_riscv64_emit_function(' -- src

      - name: Assert test contracts are unchanged
        if: steps.state.outputs.needs_work == 'true'
        shell: bash
        run: |
          git diff --exit-code -- tests/compiler/c0/run.sh

      - name: Build Core-only candidate
        if: steps.state.outputs.needs_work == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m175-core-only

      - name: Run unchanged Core-default check-fast
        if: steps.state.outputs.needs_work == 'true'
        id: fast
        continue-on-error: true
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m175-fast

      - name: Replay strict full500 on Core-only source
        if: steps.state.outputs.needs_work == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m175-core-only/bin/minic"
          work="$GITHUB_WORKSPACE/build/m175-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'M175_CORE_ONLY_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/m175-full500')
          summary = json.loads((work / 'frontier-summary.json').read_text())
          print('M175_CORE_ONLY_FULL500_SUMMARY', summary)
          if summary['selected'] != 500 or summary['pass'] != 500 or summary['unsupported'] != 0 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M175 Core-only requires exact strict500 500/500: {summary}')
          PY

      - name: Productize validated M175 source only
        if: steps.state.outputs.needs_work == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --exit-code -- tests/compiler/c0/run.sh

          git add \
            src/compiler/compiler.c \
            src/core/core_ir.h \
            src/core/core_ir.c \
            src/core/core_lower.c \
            src/frontend/parser_statement.c \
            src/target/riscv64/core_codegen.c \
            src/target/riscv64/codegen.h \
            src/target/riscv64/codegen_function.c

          staged=$(git diff --cached --name-only)
          test -n "$staged"
          unexpected=$(printf '%s\n' "$staged" | grep -Ev '^(src/compiler/compiler\.c|src/core/core_ir\.h|src/core/core_ir\.c|src/core/core_lower\.c|src/frontend/parser_statement\.c|src/target/riscv64/core_codegen\.c|src/target/riscv64/codegen\.h|src/target/riscv64/codegen_function\.c)$' || true)
          if test -n "$unexpected"; then
            printf 'unexpected staged M175 files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          ! printf '%s\n' "$staged" | grep -E '(^|/)tests?/' >/dev/null
          printf 'M175_PRODUCTIZE_FILES\n%s\n' "$staged"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'core: physically remove legacy RV64 function route'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M175 evidence
        if: always() && steps.state.outputs.needs_work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m175-core-only-${{ github.sha }}
          path: |
            build/m175-full500/**
          if-no-files-found: warn
