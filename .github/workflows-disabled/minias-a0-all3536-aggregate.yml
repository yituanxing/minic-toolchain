name: MiniAS A0 Ground Truth 3536 Aggregate

on:
  push:
    branches:
      - "toolchain/minias-m0-boundary-freeze"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "MiniAS A0 All3352 Exact"
      - "MiniAS A0 Native Linux ASM35"
      - "MiniAS A0 Ground Truth C149"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'toolchain/minias-m0-boundary-freeze') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[minias-all3536]'))
    runs-on: ubuntu-24.04
    steps:
      - name: Require same-head hard gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          api=os.environ["API_URL"]
          repo=os.environ["REPOSITORY"]
          sha=os.environ["TARGET_SHA"]
          token=os.environ["GH_TOKEN"]
          names=[
              "MiniAS A0 All3352 Exact",
              "MiniAS A0 Native Linux ASM35",
              "MiniAS A0 Ground Truth C149",
          ]
          url=f"{api}/repos/{repo}/actions/runs?head_sha={urllib.parse.quote(sha)}&per_page=100"
          req=urllib.request.Request(
              url,
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              runs=json.load(response)["workflow_runs"]

          import time

          deadline=time.monotonic()+1800
          while True:
              url=f"{api}/repos/{repo}/actions/runs?head_sha={urllib.parse.quote(sha)}&per_page=100"
              req=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  runs=json.load(response)["workflow_runs"]

              state={}
              for name in names:
                  candidates=[run for run in runs if run.get("name")==name]
                  candidates.sort(key=lambda run: run["id"], reverse=True)
                  if not candidates:
                      state[name]="missing"
                      continue
                  run=candidates[0]
                  if run["status"]!="completed":
                      state[name]=run["status"]
                  else:
                      state[name]=run.get("conclusion") or "unknown"

              print("MINIAS_ALL3536_COMPONENTS "+json.dumps(state,sort_keys=True), flush=True)
              failed={name:value for name,value in state.items()
                      if value in {"failure","cancelled","timed_out","action_required","startup_failure"}}
              if failed:
                  print("MINIAS_ALL3536=FAIL "+json.dumps(failed,sort_keys=True))
                  raise SystemExit(1)
              if all(state.get(name)=="success" for name in names):
                  break
              if time.monotonic() >= deadline:
                  print(f"MINIAS_ALL3536=TIMEOUT head={sha}")
                  raise SystemExit(1)
              time.sleep(15)

          print(
              f"MINIAS_ALL3536_EXACT head={sha} "
              "c_frozen=3352 c_delta=149 native=35 selected=3536 "
              "pass=3536 fail=0 error=0"
          )
          PY
