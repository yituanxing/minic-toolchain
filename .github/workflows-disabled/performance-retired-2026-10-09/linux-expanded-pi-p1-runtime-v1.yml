          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install minimal runtime prerequisites without update
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-inconclusive-v1"
          mkdir -p "$ev"
          mode=no-update
          if ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
              binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >"$ev/apt.stdout.txt" 2>"$ev/apt.stderr.txt"; then
            mode=fallback-update
            sudo apt-get -o Acquire::Retries=3 update >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
          fi
          echo "INSTALL_MODE=$mode"

      - name: Build certified early image and mismatched same-stage baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-inconclusive-v1"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early"

          # Probe this exact image first.  The repository-wide certified
          # baseline may be ahead of this frozen compact image, so derive the
          # same-stage marker from the image under test instead of hard-coding
          # either a historical or current global frontier stage.
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/probe" --timeout-ms 1500 --poll-ms 100 \
            | tee "$ev/probe.stdout.txt"
          probe_rc=${PIPESTATUS[0]}
          set -e
          echo "WATCH_STAGE_PROBE_RC=$probe_rc"

          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('tools/ci/linux-runtime-frontier-v1.json')
          probe_path=Path('build/linux-runtime-qemu-watch-inconclusive-v1/probe/frontier-result.json')
          dst=Path('build/linux-runtime-qemu-watch-inconclusive-v1/mismatch.json')
          c=json.loads(src.read_text())
          probe=json.loads(probe_path.read_text())
          progress_marker=probe.get('highest_progress')
          if not progress_marker:
              raise SystemExit('WATCH_CONSERVATIVE=FAIL probe missing highest_progress')
          known={m['name'] for m in c.get('progress_markers', [])}
          if progress_marker not in known:
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL unknown probe progress_marker={progress_marker}')
          c['baseline']['progress_marker']=progress_marker
          c['baseline']['fault']={'desc':'fault_load','symbol':'__watch_deliberate_mismatch__','offset':'0x0'}
          dst.write_text(json.dumps(c, indent=2, sort_keys=True)+'\n')
          print(f'WATCH_MISMATCH_BASELINE progress_marker={progress_marker} probe_verdict={probe.get("verdict")}')
          PY

      - name: Prove unknown same-stage fault does not stop the watcher early
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-inconclusive-v1"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config "$ev/mismatch.json" \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 1500 --poll-ms 100 \
            | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/linux-runtime-qemu-watch-inconclusive-v1/watch')
          meta=json.loads((root/'watch-result.json').read_text())
          result=json.loads((root/'frontier-result.json').read_text())
          if meta['stop_reason'] != 'oracle:INCONCLUSIVE:fault':
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL stop={meta["stop_reason"]}')
          if result['verdict'] != 'INCONCLUSIVE':
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL verdict={result["verdict"]}')
          if meta.get('probe_verdict') != 'INCONCLUSIVE':
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL probe_verdict={meta.get("probe_verdict")}')
          if meta['elapsed_ms'] >= 1500:
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL expected fault-aware early stop elapsed_ms={meta["elapsed_ms"]}')
          print(f'WATCH_CONSERVATIVE=PASS stop=oracle:INCONCLUSIVE:fault verdict=INCONCLUSIVE elapsed_ms={meta["elapsed_ms"]} polls={meta["polls"]}')
          print(f'OBSERVED_FAULT={result["fault"]["desc"]}:{result["fault"]["symbol"]}+0x{result["fault"]["offset"]:x}')
          print(f'HIGHEST_PROGRESS={result["highest_progress"]}')
          PY
          test "$rc" -eq 2

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-qemu-watch-inconclusive-v1-${{ github.sha }}
          path: |
            build/linux-runtime-qemu-watch-inconclusive-v1/mismatch.json
            build/linux-runtime-qemu-watch-inconclusive-v1/probe.stdout.txt
            build/linux-runtime-qemu-watch-inconclusive-v1/probe/watch-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/probe/frontier-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/probe/frontier-summary.txt
            build/linux-runtime-qemu-watch-inconclusive-v1/watch.stdout.txt
            build/linux-runtime-qemu-watch-inconclusive-v1/watch/watch-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/watch/frontier-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/watch/frontier-summary.txt
          if-no-files-found: warn
          retention-days: 7
