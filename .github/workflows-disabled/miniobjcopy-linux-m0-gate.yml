name: MiniObjcopy Linux M0 Gate

on:
  push:
    branches:
      - "toolchain/miniobjcopy-linux-m0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniobjcopy-a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V GNU oracle tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Strict build
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy all

      - name: Preserve shared reader consumers
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy check-minielf-reader-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy check-mininm-a0
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy check-miniar-a0

      - name: Differentially validate ELF to binary
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/miniobjcopy check-miniobjcopy-a0
