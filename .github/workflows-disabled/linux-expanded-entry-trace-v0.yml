name: Linux Expanded Entry Trace V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-expanded-entry-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-expanded-entry-trace]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute stable current-profile cache identity
        id: profile-cache
        shell: bash
        run: |
          set -Eeuo pipefail
          digest=$(python3 tools/ci/linux-runtime-profile-cache-id-v1.py)
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          printf 'LINUX_RUNTIME_PROFILE_CACHE_ID=%s\n' "$digest"

      - name: Restore exact certified Expanded Linux Image
        id: expanded-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-image-v3-6.6.143-${{ runner.os }}-${{ steps.profile-cache.outputs.digest }}-${{ hashFiles('tools/ci/linux-expanded-owner-targets-v1.txt', 'tools/ci/linux-expanded-owner-refresh-v1.sh') }}
          fail-on-cache-miss: true

      - name: Install trace prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            qemu-system-misc opensbi binutils-riscv64-linux-gnu python3

      - name: Trace first translated kernel blocks
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0/out"
          work="$GITHUB_WORKSPACE/build/linux-expanded-entry-trace"
          image="$out/arch/riscv/boot/Image"
          vmlinux="$out/vmlinux"
          mkdir -p "$work"
          test "${{ steps.expanded-cache.outputs.cache-hit }}" = "true"
          test -s "$image"
          test -s "$vmlinux"
          printf 'CACHE_HIT=%s\nCACHE_MATCHED_KEY=%s\n' \
            "${{ steps.expanded-cache.outputs.cache-hit }}" \
            "${{ steps.expanded-cache.outputs.cache-matched-key }}" \
            | tee "$work/cache.txt"
          sha256sum "$image" | tee "$work/Image.sha256"
          stat -c 'IMAGE_BYTES=%s' "$image" | tee "$work/summary.txt"
          cat "$work/cache.txt" >>"$work/summary.txt"
          riscv64-linux-gnu-readelf -h "$vmlinux" | grep -E 'Entry point|Machine:' | tee "$work/elf-entry.txt"
          riscv64-linux-gnu-objdump -d --start-address=0xffffffff80000000 --stop-address=0xffffffff80000400 "$vmlinux" \
            >"$work/vmlinux-entry-disasm.txt" || true

          set +e
          timeout --signal=TERM 4s qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$image" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -d in_asm -D "$work/qemu-in-asm.log" \
            >"$work/qemu-console.log" 2>&1
          rc=$?
          set -e
          echo "QEMU_RC=$rc" | tee -a "$work/summary.txt"

          python3 - "$work/qemu-in-asm.log" "$work/kernel-blocks.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:]
          text = open(src, 'r', errors='replace').read().splitlines()
          blocks=[]
          cur=[]
          keep=False
          for line in text:
              if line.startswith('IN:'):
                  if cur and keep: blocks.extend(cur)
                  cur=[line]
                  keep=False
                  continue
              if cur:
                  cur.append(line)
                  m=re.match(r'0x([0-9a-fA-F]+):', line.strip())
                  if m:
                      a=int(m.group(1),16)
                      if (0x80200000 <= a < 0xa0000000) or a >= 0xffffffff80000000:
                          keep=True
          if cur and keep: blocks.extend(cur)
          open(dst,'w').write('\n'.join(blocks[-1200:])+'\n')
          addrs=[]
          for line in blocks:
              m=re.match(r'\s*0x([0-9a-fA-F]+):', line)
              if m:
                  a=int(m.group(1),16)
                  if (0x80200000 <= a < 0xa0000000) or a >= 0xffffffff80000000:
                      addrs.append(a)
          from collections import Counter
          c=Counter(addrs)
          with open(dst+'.summary','w') as f:
              f.write(f'KERNEL_TRANSLATED_INSNS={len(addrs)}\n')
              f.write(f'KERNEL_UNIQUE_ADDRS={len(c)}\n')
              if addrs:
                  f.write(f'FIRST_PC=0x{addrs[0]:x}\nLAST_PC=0x{addrs[-1]:x}\n')
              for a,n in c.most_common(40):
                  f.write(f'PC 0x{a:x} count={n}\n')
          PY
          riscv64-linux-gnu-nm -n "$vmlinux" >"$work/vmlinux.nm"
          python3 - "$work/kernel-blocks.txt" "$work/vmlinux.nm" "$work/virtual-pc-symbols.txt" <<'PY'
          import bisect, re, sys
          blocks_path, nm_path, out_path = sys.argv[1:]
          pcs=[]
          for line in open(blocks_path, errors='replace'):
              m=re.match(r'\s*0x([0-9a-fA-F]+):', line)
              if not m:
                  continue
              pc=int(m.group(1),16)
              if pc >= 0xffffffff80000000:
                  pcs.append(pc)
          uniq=[]
          seen=set()
          for pc in reversed(pcs):
              if pc not in seen:
                  seen.add(pc); uniq.append(pc)
              if len(uniq) >= 128:
                  break
          uniq.reverse()
          syms=[]
          for line in open(nm_path, errors='replace'):
              parts=line.split()
              if len(parts) < 3:
                  continue
              try:
                  addr=int(parts[0],16)
              except ValueError:
                  continue
              syms.append((addr, parts[-1]))
          syms.sort()
          addrs=[a for a,_ in syms]
          with open(out_path,'w') as out:
              for pc in uniq:
                  i=bisect.bisect_right(addrs, pc)-1
                  if i < 0:
                      out.write(f'0x{pc:x} ?\n')
                  else:
                      base,name=syms[i]
                      out.write(f'0x{pc:x} {name}+0x{pc-base:x} base=0x{base:x}\n')
          PY
          tail -n 80 "$work/virtual-pc-symbols.txt" | tee "$work/virtual-pc-symbols-tail.txt"
          cat "$work/kernel-blocks.txt.summary" | tee -a "$work/summary.txt"
          tail -n 240 "$work/kernel-blocks.txt" | tee "$work/kernel-blocks-tail.txt"
          tail -n 120 "$work/qemu-console.log" | tee "$work/qemu-console-tail.txt"

      - name: Preserve entry trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-expanded-entry-trace-v0
          path: build/linux-expanded-entry-trace/
          if-no-files-found: ignore
          retention-days: 7
