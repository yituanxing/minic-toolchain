name: Linux Remaining43 Fast V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-remaining43-fast-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-remaining43-fast-v0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore latest mixed Linux frontier
        id: mixed-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-0a7930411dfbac679a90ff3147482e6417b463628690f2b544bf9db8bf8b7db2
          fail-on-cache-miss: true

      - name: Install RV64 prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3

      - name: Build patched MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          build="$work/toolchain-fast43"
          ev="$work/evidence-fast43"
          rm -rf "$build" "$ev"
          mkdir -p "$ev"
          start=$(date +%s)
          patches=(
            apply-local-integer-assignment-v2.py
            apply-local-integer-logical-conditions-v0.py
            apply-local-null-pointer-facts-v0.py
            apply-builtin-constant-p-local-facts-v0.py
            apply-inline-integer-specialization-v0.py
            apply-inline-specialization-local-facts-v0.py
            apply-inline-specialization-stable-parameter-facts-v0.py
            apply-inline-specialization-transitive-integer-v0.py
            apply-inline-specialization-base-callee-integer-v0.py
            apply-inline-specialization-capacity-v0.py
            apply-inline-specialization-symbolic-address-v0.py
            apply-inline-specialization-symbolic-nested-array-v0.py
            apply-inline-specialization-symbolic-integer-closure-v0.py
            apply-inline-specialization-symbolic-transitive-rewrite-v0.py
            apply-inline-specialization-symbolic-array-lvalue-v0.py
            apply-inline-specialization-symbolic-closed-integers-v0.py
            apply-inline-specialization-base-callee-symbolic-v0.py
            apply-inline-specialization-resolved-asm-goto-v0.py
            apply-inline-specialization-core-reachability-v0.py
            apply-inline-specialization-original-reachability-v0.py
            apply-inline-asm-local-integer-facts-v0.py
            apply-inline-specialization-core-empty-function-v0.py
            apply-inline-specialization-label-alias-v0.py
            apply-riscv64-default-text-section-v0.py
            apply-riscv64-explicit-section-flags-v0.py
            apply-inline-asm-symbolic-specialization-v0.py
          )
          for patch in "${patches[@]}"; do python3 "tools/ci/$patch" | tee -a "$ev/patch.log"; done
          python3 tools/ci/exp-internal-function-reachability-v0.py | tee -a "$ev/patch.log"
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR="$build" "$build/bin/minic" "$build/bin/minic-cc"
          cp -f src/core/core_lower.c "$ev/core_lower.patched.c"
          cp -f src/core/core_lower_internal.h "$ev/core_lower_internal.patched.h"
          echo "TIMING toolchain_s=$(($(date +%s) - start))" | tee "$ev/timing.txt"

      - name: Prepare Linux source only
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          archive="$work/linux-6.6.143.tar.xz"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"
          test -s "$work/out/.config" && test -s "$work/out/include/config/auto.conf"

      - name: Rebuild current tail objects with intermediates
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$work/evidence-fast43"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          targets=(
            kernel/dma/direct.o
            mm/truncate.o
            fs/proc/task_mmu.o
            net/core/skbuff.o
            net/core/filter.o
            lib/crypto/blake2s-generic.o
            lib/siphash.o
          )
          for target in "${targets[@]}"; do rm -f "$out/$target"; done
          start=$(date +%s)
          MINIC="$work/toolchain-fast43/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/minic.trace" CORE_FAST_TRACE=1 \
          MINIC_LOCAL_FACT_TRACE=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j4 V=1 "${targets[@]}" >"$ev/kbuild.log" 2>&1
          echo "TIMING focused_s=$(($(date +%s) - start)) objects=${#targets[@]}" | tee -a "$ev/timing.txt"
          for target in "${targets[@]}"; do
            dir=$(dirname "$target"); stem=$(basename "$target" .o); key=${target//\//__}; key=${key%.o}
            riscv64-linux-gnu-nm -u "$out/$target" | awk '{print $NF}' | sort -u >"$ev/$key.undefined"
            cp -f "$out/$dir/$stem.minic-stage2.i" "$ev/$key.i" 2>/dev/null || true
            cp -f "$out/$dir/$stem.minic-stage2.s" "$ev/$key.s" 2>/dev/null || true
            cp -f "$out/$dir/$stem.minic-stage2.minic.stderr" "$ev/$key.stderr" 2>/dev/null || true
            riscv64-linux-gnu-size -A -d "$out/$target" >"$ev/$key.size" || true
            printf 'TAIL target=%s undefined=%s bytes=%s asm_lines=%s\n' \
              "$target" "$(wc -l <"$ev/$key.undefined")" "$(stat -c %s "$out/$target")" \
              "$(wc -l <"$ev/$key.s" 2>/dev/null || echo 0)" | tee -a "$ev/summary.txt"
            grep -E '__compiletime_assert_|arch_dma_set_uncached|dax_delete_mapping_entry|dax_invalidate_mapping_entry_sync' "$ev/$key.undefined" | sed "s#^#RESIDUAL $target #" | tee -a "$ev/summary.txt" || true
          done

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-remaining43-fast-v0
          path: build/linux-expanded-kbuild-v0/evidence-fast43/
          if-no-files-found: ignore
          retention-days: 7
