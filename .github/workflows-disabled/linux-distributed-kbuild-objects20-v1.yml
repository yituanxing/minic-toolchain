name: Linux Distributed Kbuild Objects 20 Experiment V1

on:
  push:
    branches: [agent/linux-expanded-kbuild-v0]
    paths:
      - '.github/workflows/linux-distributed-kbuild-objects20-v1.yml'
      - 'tools/ci/linux-distributed-kbuild-objects20-v1.sh'
      - 'tools/ci/linux-distributed-kbuild-objects20-targets.tsv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-distributed-kbuild-objects20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shards:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3
      - name: Prepare exact Linux and MiniC inputs
        run: bash tools/ci/linux-distributed-kbuild-objects20-v1.sh prepare
      - name: Produce ten genuine MiniC Kbuild objects
        run: bash tools/ci/linux-distributed-kbuild-objects20-v1.sh produce ${{ matrix.shard }}
      - name: Transfer objects with hidden Kbuild cmd metadata
        uses: actions/upload-artifact@v4
        with:
          name: distributed-kbuild-objects20-shard-${{ matrix.shard }}
          path: build/linux-distributed-o20-v1/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Preserve producer diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-kbuild-objects20-debug-${{ matrix.shard }}
          path: |
            build/linux-distributed-o20-v1/produce-*.log
            build/linux-distributed-o20-v1/produce-*.trace
          if-no-files-found: ignore
          retention-days: 3

  receiver:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl xz-utils python3
      - name: Prepare independent exact Linux and MiniC inputs
        run: bash tools/ci/linux-distributed-kbuild-objects20-v1.sh prepare
      - name: Restore both transferred object shards
        uses: actions/download-artifact@v4
        with:
          pattern: distributed-kbuild-objects20-shard-*
          path: build/linux-distributed-o20-v1/incoming/
          merge-multiple: false
      - name: Verify hashes, Kbuild incremental no-op, and partial link
        run: bash tools/ci/linux-distributed-kbuild-objects20-v1.sh verify
      - name: Preserve receiver diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-kbuild-objects20-receiver-evidence
          path: |
            build/linux-distributed-o20-v1/reuse.log
            build/linux-distributed-o20-v1/reuse.trace
            build/linux-distributed-o20-v1/object-sha-before.txt
            build/linux-distributed-o20-v1/config.sha256
            build/linux-distributed-o20-v1/compiler.sha256
          if-no-files-found: warn
          retention-days: 3
