name: MiniLD Dynamic A6 Rebase Gate

on:
  push:
    branches:
      - "toolchain/minild-dynamic-a6-rebase"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minild-a6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V dynamic TLS runtime oracle
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-riscv64-cross libc6-dev-riscv64-cross qemu-user

      - name: Strict build
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a6-rebase all

      - name: Keep current static and A4-A5 contracts green
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a6-rebase check-minild-script-a1
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a6-rebase check-minild-a3
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a6-rebase check-minild-a4
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a6-rebase check-minild-a5

      - name: Run Global-Dynamic TLS runtime gate
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/minild-a6-rebase check-minild-a6
