name: Linux Runtime Kallsyms Refresh First Die V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-kallsyms-refresh-first-die-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-kallsyms-refresh-first-die-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kallsyms-refresh-first-die:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore certified frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-refresh-first-die-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-kallsyms-refresh-first-die-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh only kallsyms.o with current MiniC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-refresh-first-die-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-kallsyms-refresh-first-die-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          cp "$out/kernel/kallsyms.o" "$ev/kallsyms.before.o"
          sha256sum "$ev/kallsyms.before.o" | tee "$ev/kallsyms-before.sha256"
          riscv64-linux-gnu-readelf -rW "$ev/kallsyms.before.o" >"$ev/kallsyms-before.relocs.txt"
          grep -E 'kallsyms_offsets' "$ev/kallsyms-before.relocs.txt" | tee "$ev/kallsyms-before-offsets-relocs.txt" || true

          rm -f "$out/kernel/kallsyms.o" "$out/kernel/.kallsyms.o.cmd" "$out/kernel/kallsyms.minic-stage2.i" "$out/kernel/kallsyms.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 kernel/kallsyms.o >"$ev/kallsyms-refresh.log" 2>&1
          test -s "$out/kernel/kallsyms.o"
          cp "$out/kernel/kallsyms.o" "$ev/kallsyms.after.o"
          sha256sum "$ev/kallsyms.after.o" | tee "$ev/kallsyms-after.sha256"
          riscv64-linux-gnu-readelf -rW "$ev/kallsyms.after.o" >"$ev/kallsyms-after.relocs.txt"
          grep -E 'kallsyms_offsets' "$ev/kallsyms-after.relocs.txt" | tee "$ev/kallsyms-after-offsets-relocs.txt" || true
          if grep -q 'R_RISCV_GOT_HI20.*kallsyms_offsets' "$ev/kallsyms-after.relocs.txt"; then
            echo 'KALLSYMS_REFRESH_RELOC=BAD_GOT'
            exit 1
          fi
          grep -q 'R_RISCV_PCREL_HI20.*kallsyms_offsets' "$ev/kallsyms-after.relocs.txt"
          echo 'KALLSYMS_REFRESH_RELOC=PCREL_PASS'

      - name: Relink early image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-refresh-first-die-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$work/out" "$ev/early"
          grep -E ' [Tt] get_symbol_pos$| [Tt] die$| die_lock$' "$ev/early/nm.txt" | tee "$ev/key-symbols.txt"

      - name: Capture first die entry with GDB
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-refresh-first-die-v0"
          qemu_log="$ev/qemu.console.log"
          qemu_debug="$ev/qemu.debug.log"
          gdb_cmd="$ev/capture.gdb"
          gdb_out="$ev/gdb-first-die.txt"

          cat >"$gdb_cmd" <<GDB
          set pagination off
          set confirm off
          file $ev/early/vmlinux.early
          target remote 127.0.0.1:1234
          hbreak die
          continue
          printf "FIRST_DIE_HIT=PASS\\n"
          printf "REGS=0x%lx\\n", \$a0
          printf "STR=0x%lx\\n", \$a1
          x/s \$a1
          set \$regs = \$a0
          set \$epc = *(unsigned long *)(\$regs + 0)
          set \$saved_ra = *(unsigned long *)(\$regs + 8)
          set \$saved_sp = *(unsigned long *)(\$regs + 16)
          set \$saved_status = *(unsigned long *)(\$regs + 256)
          set \$saved_badaddr = *(unsigned long *)(\$regs + 264)
          set \$saved_cause = *(unsigned long *)(\$regs + 272)
          printf "EPC=0x%lx\\n", \$epc
          printf "SAVED_RA=0x%lx\\n", \$saved_ra
          printf "SAVED_SP=0x%lx\\n", \$saved_sp
          printf "STATUS=0x%lx\\n", \$saved_status
          printf "BADADDR=0x%lx\\n", \$saved_badaddr
          printf "CAUSE=0x%lx\\n", \$saved_cause
          info symbol \$epc
          info symbol \$saved_ra
          x/16i \$epc-32
          x/12gx \$regs
          detach
          quit
          GDB

          qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/early/Image.early" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -S -gdb tcp:127.0.0.1:1234 -d int -D "$qemu_debug" \
            >"$qemu_log" 2>&1 &
          qpid=$!
          cleanup() {
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1

          set +e
          timeout 30s gdb-multiarch -q -batch -x "$gdb_cmd" >"$gdb_out" 2>&1
          grc=$?
          set -e
          cat "$gdb_out"
          grep -F 'FIRST_DIE_HIT=PASS' "$gdb_out"
          grep -E '^EPC=0x[0-9a-fA-F]+$' "$gdb_out"
          grep -E '^BADADDR=0x[0-9a-fA-F]+$' "$gdb_out"
          grep -E '^CAUSE=0x[0-9a-fA-F]+$' "$gdb_out"
          echo "GDB_RC=$grc"
          test "$grc" -eq 0

      - name: Resolve primary fault and compare old kallsyms BUG
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-kallsyms-refresh-first-die-v0"
          python3 - "$ev/gdb-first-die.txt" "$ev/early/nm.txt" "$ev/resolved-first-die.txt" <<'PY'
          from bisect import bisect_right
          from pathlib import Path
          import re, sys

          gdb = Path(sys.argv[1]).read_text(errors='replace')
          nm_lines = Path(sys.argv[2]).read_text(errors='replace').splitlines()
          out = Path(sys.argv[3])
          vals = {}
          for key in ('EPC', 'SAVED_RA', 'SAVED_SP', 'STATUS', 'BADADDR', 'CAUSE'):
              m = re.search(rf'^{key}=(0x[0-9a-fA-F]+)$', gdb, re.M)
              if not m:
                  raise SystemExit(f'missing {key}')
              vals[key] = int(m.group(1), 16)
          syms = []
          for line in nm_lines:
              parts = line.split(None, 2)
              if len(parts) != 3:
                  continue
              try:
                  addr = int(parts[0], 16)
              except ValueError:
                  continue
              syms.append((addr, parts[2]))
          syms.sort()
          addrs = [x[0] for x in syms]
          def resolve(value):
              i = bisect_right(addrs, value) - 1
              if i < 0:
                  return 'none'
              addr, name = syms[i]
              return f'{name}+0x{value-addr:x} @0x{addr:x}'
          cause_names = {0:'instruction-address-misaligned',1:'instruction-access-fault',2:'illegal-instruction',3:'breakpoint',4:'load-address-misaligned',5:'load-access-fault',6:'store-amo-address-misaligned',7:'store-amo-access-fault',8:'ecall-u',9:'ecall-s',11:'ecall-m',12:'instruction-page-fault',13:'load-page-fault',15:'store-amo-page-fault'}
          cause = vals['CAUSE'] & ((1 << 63) - 1)
          epc_nearest = resolve(vals['EPC'])
          lines = [
              f"EPC=0x{vals['EPC']:x}",
              f"EPC_NEAREST={epc_nearest}",
              f"SAVED_RA=0x{vals['SAVED_RA']:x}",
              f"SAVED_RA_NEAREST={resolve(vals['SAVED_RA'])}",
              f"SAVED_SP=0x{vals['SAVED_SP']:x}",
              f"STATUS=0x{vals['STATUS']:x}",
              f"BADADDR=0x{vals['BADADDR']:x}",
              f"CAUSE=0x{vals['CAUSE']:x}",
              f"CAUSE_NAME={cause_names.get(cause, 'unknown')}",
              f"OLD_GET_SYMBOL_POS_154_REPRODUCED={'YES' if epc_nearest.startswith('get_symbol_pos+0x154 ') else 'NO'}",
          ]
          out.write_text('\n'.join(lines) + '\n')
          print(out.read_text(), end='')
          PY
          grep -F 'OLD_GET_SYMBOL_POS_154_REPRODUCED=NO' "$ev/resolved-first-die.txt"

      - name: Preserve refreshed first-die evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-kallsyms-refresh-first-die-v0-${{ github.sha }}
          path: |
            build/linux-runtime-kallsyms-refresh-first-die-v0/profile/patch.log
            build/linux-runtime-kallsyms-refresh-first-die-v0/kallsyms-*.sha256
            build/linux-runtime-kallsyms-refresh-first-die-v0/kallsyms-*.relocs.txt
            build/linux-runtime-kallsyms-refresh-first-die-v0/kallsyms-refresh.log
            build/linux-runtime-kallsyms-refresh-first-die-v0/early/nm.txt
            build/linux-runtime-kallsyms-refresh-first-die-v0/early/vmlinux.early.map
            build/linux-runtime-kallsyms-refresh-first-die-v0/key-symbols.txt
            build/linux-runtime-kallsyms-refresh-first-die-v0/gdb-first-die.txt
            build/linux-runtime-kallsyms-refresh-first-die-v0/resolved-first-die.txt
            build/linux-runtime-kallsyms-refresh-first-die-v0/qemu.console.log
            build/linux-runtime-kallsyms-refresh-first-die-v0/qemu.debug.log
          if-no-files-found: warn
          retention-days: 7
