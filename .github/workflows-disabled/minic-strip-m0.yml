name: MiniStrip M0 Gate

on:
  push:
    branches:
      - "toolchain/minic-strip-m0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ministrip-a0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install RISC-V GNU oracle tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential binutils-riscv64-linux-gnu

      - name: Strict build
        run: |
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/ministrip all

      - name: Preserve shared rewrite consumer
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/ministrip check-miniobjcopy-a1

      - name: Differentially validate MiniStrip
        run: |
          make MODE=release CFLAGS=-Werror BUILD_DIR=build/ministrip check-minicstrip-a0
