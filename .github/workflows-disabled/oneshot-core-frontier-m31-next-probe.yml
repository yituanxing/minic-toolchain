name: One-shot Core Frontier M31 Next Probe

on:
  pull_request:
    branches: [frontend/linux-first500-final-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh

      - name: Restore frozen Linux corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-5df6e0e2761359d30a8275058e299fcc0381534545f55cf43e41983f5d4c9456

      - name: Build proven M31 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s build/linux-focus-corpus/selected-tus.txt
          python3 tools/dev/run-core-frontier-batch-m31.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m31-next-probe

      - name: Confirm and extract next four real blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m31-next-probe/bin/minic"
          out="$GITHUB_WORKSPACE/build/m31-next-evidence"
          mkdir -p "$out"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, os

          root = Path('build/linux-focus-corpus/kbuild')
          out = Path('build/m31-next-evidence')
          compiler = Path('build/m31-next-probe/bin/minic').resolve()
          cases = [
              ('init/version.i', 'regs_get_kernel_argument'),
              ('init/do_mounts.i', 'uid_eq'),
              ('arch/riscv/kernel/sbi.i', 'ktime_divns'),
              ('arch/riscv/kernel/pi/cmdline_early.i', 'memzero_explicit'),
          ]
          for rel, name in cases:
              src = root / rel
              tag = rel.replace('/', '_')
              err = out / f'{tag}.err'
              asm = out / f'{tag}.s'
              env = dict(os.environ)
              env['MINIC_CORE_IR'] = 'strict'
              p = subprocess.run([str(compiler), '-S', str(src), '-o', str(asm)], stderr=subprocess.PIPE, text=True, env=env)
              err.write_text(p.stderr)
              print(f'NEXT_CONFIRM file={rel} expected={name} rc={p.returncode}')
              print(p.stderr.strip())
              if f"Core IR shadow does not yet support function '{name}'" not in p.stderr:
                  raise SystemExit(f'expected blocker did not reproduce: {rel} {name}')

              lines = src.read_text(errors='replace').splitlines()
              hits = [i for i, line in enumerate(lines) if re.search(r'\b' + re.escape(name) + r'\s*\(', line)]
              print(f'NEXT_HITS function={name} count={len(hits)} lines={[i+1 for i in hits[:8]]}')
              chunks = []
              for n, i in enumerate(hits[:6]):
                  lo = max(0, i - 18)
                  hi = min(len(lines), i + 45)
                  chunk = '\n'.join(f'{j+1:08d}: {lines[j]}' for j in range(lo, hi))
                  chunks.append(f'===== HIT {n+1} line {i+1} =====\n{chunk}')
              text = '\n\n'.join(chunks)
              (out / f'{name}.context.txt').write_text(text)
              print(f'===== {name} CONTEXT BEGIN =====')
              print(text)
              print(f'===== {name} CONTEXT END =====')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-frontier-m31-next-probe
          path: build/m31-next-evidence/
          if-no-files-found: error
