name: Linux Runtime FDT Isolation V1

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-fdt-isolation-v1.yml"
      - "tools/ci/linux-early-runtime-link-v2.sh"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select historical focused runtime probe; all runs independent jobs'
        required: true
        type: choice
        default: 'isolation'
        options:
          - 'isolation'
          - 'codegen'
          - 'all'

permissions:
  contents: read

concurrency:
  group: linux-runtime-fdt-isolation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fdt-isolation:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'isolation' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-fdt-isolation]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified fixtures
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi gdb-multiarch python3 make; }

      - name: Build exact MiniC runtime profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-fdt-isolation-v1"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Refresh current MiniC runtime owners
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-fdt-isolation-v1"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            local target="$1"
            local stem="${target##*/}"; stem="${stem%.o}"
            local dir="${target%/*}"
            local base="${target%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/${dir//\//-}-${stem}.log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi=arch/riscv/kernel/pi/cmdline_early.pi.o
          rm -f "$out/$pi" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" \
                "$out/arch/riscv/kernel/pi/cmdline_early.minic-stage2.i" "$out/arch/riscv/kernel/pi/cmdline_early.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi" >"$ev/pi.log" 2>&1
          test -s "$out/$pi"
          echo "OWNER_REFRESH=PASS target=$pi"

          owners=(
            kernel/kallsyms.o arch/riscv/mm/init.o arch/riscv/kernel/setup.o
            kernel/sched/core.o arch/riscv/kernel/irq.o
            kernel/locking/spinlock.o kernel/locking/spinlock_debug.o
            kernel/sched/build_utility.o kernel/time/timekeeping.o kernel/time/vsyscall.o
            kernel/notifier.o kernel/sched/build_policy.o kernel/time/timer.o
            kernel/time/hrtimer.o kernel/time/tick-sched.o kernel/rcu/tree.o
            kernel/rcu/rcu_segcblist.o init/main.o kernel/softirq.o
          )
          for obj in "${owners[@]}"; do refresh_obj "$obj"; done

      - name: Swap linked fdt_ro owner to GCC
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"

          riscv64-linux-gnu-ar t "$out/lib/lib.a" >"$ev/lib-members.txt"
          grep -E '(^|/)fdt_ro\.o$' "$ev/lib-members.txt" | tee "$ev/fdt-ro-members.txt"
          target=lib/fdt_ro.o
          rm -f "$out/$target" "$out/lib/.fdt_ro.o.cmd"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC=/usr/bin/riscv64-linux-gnu-gcc -j2 V=1 "$target" >"$ev/fdt-ro-gcc.log" 2>&1
          test -s "$out/$target"
          sha256sum "$out/$target" | tee "$ev/fdt-ro-gcc.sha256"
          echo 'FDT_RO_GCC_SWAP=ACTIVE' | tee "$ev/swap-status.txt"

      - name: Relink with generated kallsyms
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          EARLY_LINK_WITH_KALLSYMS=1 EARLY_LINK_KALLSYMS_SRC="$src" \
            bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early" | tee "$ev/link.log"
          grep -F 'EARLY_LINK_KALLSYMS_CONSISTENT=PASS' "$ev/early/kallsyms-status.txt"
          grep -F 'EARLY_LINK_KALLSYMS_SYMBOL=PASS' "$ev/early/kallsyms-status.txt"

      - name: Trace early boot breadcrumbs and first die
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-isolation-v1"
          qemu_log="$ev/qemu.console.log"
          qemu_debug="$ev/qemu.debug.log"
          gdb_cmd="$ev/capture.gdb"
          gdb_out="$ev/gdb.txt"
          phys_gdb="$ev/physical-symbols.gdb"
          phys_txt="$ev/physical-symbols.txt"

          python3 - "$ev/early/nm.txt" "$phys_gdb" "$phys_txt" <<'PY'
          from pathlib import Path
          import sys
          nm_path, gdb_path, txt_path = map(Path, sys.argv[1:4])
          wanted = {
              '_start': 'start',
              '_start_kernel': 'start_kernel_asm',
              'setup_vm': 'setup_vm',
              'set_satp_mode': 'set_satp_mode',
              'create_kernel_page_table': 'create_kernel_pt',
              'create_fdt_early_page_table': 'create_fdt',
              'relocate_enable_mmu': 'relocate_mmu',
              'kernel_map': 'kernel_map',
              'satp_mode': 'satp_mode',
              'pgtable_l4_enabled': 'pgtable_l4',
              'pgtable_l5_enabled': 'pgtable_l5',
          }
          found = {}
          for line in nm_path.read_text(errors='replace').splitlines():
              p = line.split(None, 2)
              if len(p) == 3 and p[2] in wanted:
                  found[p[2]] = int(p[0], 16)
          missing = [name for name in wanted if name not in found]
          if missing:
              raise SystemExit('missing symbols: ' + ','.join(missing))
          load_pa = 0x80200000
          link_start = found['_start']
          rows = [f'KERNEL_LOAD_PA=0x{load_pa:x}']
          commands = []
          for sym, short in wanted.items():
              linked = found[sym]
              physical = load_pa + (linked - link_start)
              rows.append(f'{sym} linked=0x{linked:x} physical=0x{physical:x}')
              commands.append(f'set $phys_{short} = 0x{physical:x}')
          gdb_path.write_text('\n'.join(commands) + '\n')
          txt_path.write_text('\n'.join(rows) + '\n')
          print(txt_path.read_text(), end='')
          PY

          cat >"$gdb_cmd" <<GDB
          set pagination off
          set confirm off
          file $ev/early/vmlinux.early
          target remote 127.0.0.1:1234
          source $phys_gdb

          hbreak *\$phys_start
          commands
            silent
            printf "BREADCRUMB=_start PC=0x%lx\\n", \$pc
            continue
          end
          hbreak *\$phys_start_kernel_asm
          commands
            silent
            printf "BREADCRUMB=_start_kernel PC=0x%lx A0=0x%lx A1=0x%lx\\n", \$pc, \$a0, \$a1
            continue
          end
          hbreak *\$phys_setup_vm
          commands
            silent
            printf "BREADCRUMB=setup_vm PC=0x%lx DTB_PA=0x%lx\\n", \$pc, \$a0
            continue
          end
          hbreak *\$phys_set_satp_mode
          commands
            silent
            printf "BREADCRUMB=set_satp_mode PC=0x%lx\\n", \$pc
            continue
          end
          hbreak *\$phys_create_kernel_pt
          commands
            silent
            printf "BREADCRUMB=create_kernel_page_table PC=0x%lx\\n", \$pc
            continue
          end
          hbreak *\$phys_create_fdt
          commands
            silent
            printf "BREADCRUMB=create_fdt_early_page_table PC=0x%lx FIX_FDT_VA=0x%lx DTB_PA=0x%lx\\n", \$pc, \$a0, \$a1
            printf "PGTABLE_L5=%u\\n", *(unsigned char *)\$phys_pgtable_l5
            printf "PGTABLE_L4=%u\\n", *(unsigned char *)\$phys_pgtable_l4
            printf "SATP_MODE=0x%lx\\n", *(unsigned long *)\$phys_satp_mode
            continue
          end
          hbreak *\$phys_relocate_mmu
          commands
            silent
            printf "BREADCRUMB=relocate_enable_mmu PC=0x%lx PGDIR_PA=0x%lx\\n", \$pc, \$a0
            continue
          end
          hbreak start_kernel
          commands
            silent
            printf "BREADCRUMB=start_kernel PC=0x%lx\\n", \$pc
            continue
          end
          hbreak die
          commands
            silent
            printf "FIRST_DIE_HIT=PASS\\n"
            set \$regs = \$a0
            set \$epc = *(unsigned long *)(\$regs + 0)
            set \$saved_ra = *(unsigned long *)(\$regs + 8)
            set \$saved_badaddr = *(unsigned long *)(\$regs + 264)
            set \$saved_cause = *(unsigned long *)(\$regs + 272)
            printf "EPC=0x%lx\\n", \$epc
            printf "SAVED_RA=0x%lx\\n", \$saved_ra
            printf "BADADDR=0x%lx\\n", \$saved_badaddr
            printf "CAUSE=0x%lx\\n", \$saved_cause
            detach
            quit
          end
          continue
          GDB

          qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/early/Image.early" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -S -gdb tcp:127.0.0.1:1234 -d int -D "$qemu_debug" \
            >"$qemu_log" 2>&1 &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true; wait "$qpid" 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 60s gdb-multiarch -q -batch -x "$gdb_cmd" >"$gdb_out" 2>&1
          grc=$?
          set -e
          echo "GDB_RC=$grc" | tee "$ev/gdb-rc.txt"
          cat "$gdb_out"
          grep '^BREADCRUMB=' "$gdb_out" | tee "$ev/breadcrumbs.txt" || true
          tail -200 "$qemu_debug" >"$ev/qemu-debug-tail.txt" || true

          python3 - "$gdb_out" "$ev/early/nm.txt" "$ev/result.txt" <<'PY'
          from bisect import bisect_right
          from pathlib import Path
          import re, sys
          gdb = Path(sys.argv[1]).read_text(errors='replace')
          nm = Path(sys.argv[2]).read_text(errors='replace').splitlines()
          syms=[]
          for line in nm:
              p=line.split(None,2)
              if len(p)!=3: continue
              try: a=int(p[0],16)
              except ValueError: continue
              syms.append((a,p[2]))
          syms.sort(); addrs=[a for a,_ in syms]
          def resolve(v):
              i=bisect_right(addrs,v)-1
              if i<0:return 'none'
              a,n=syms[i]; return f'{n}+0x{v-a:x} @0x{a:x}'
          crumbs=re.findall(r'^BREADCRUMB=([^ ]+).*$', gdb, re.M)
          out=['BREADCRUMBS=' + (','.join(crumbs) if crumbs else 'none')]
          out.append('LAST_BREADCRUMB=' + (crumbs[-1] if crumbs else 'none'))
          if 'FIRST_DIE_HIT=PASS' in gdb:
              vals={}
              for k in ('EPC','SAVED_RA','BADADDR','CAUSE'):
                  m=re.search(rf'^{k}=(0x[0-9a-fA-F]+)$',gdb,re.M)
                  if not m: raise SystemExit(f'missing {k}')
                  vals[k]=int(m.group(1),16)
              out += [
                  f"EPC=0x{vals['EPC']:x}",
                  f"EPC_NEAREST={resolve(vals['EPC'])}",
                  f"RA=0x{vals['SAVED_RA']:x}",
                  f"RA_NEAREST={resolve(vals['SAVED_RA'])}",
                  f"BADADDR=0x{vals['BADADDR']:x}",
                  f"CAUSE=0x{vals['CAUSE']:x}",
              ]
          else:
              out.append('FIRST_DIE_HIT=NO_WITHIN_60S')
          Path(sys.argv[3]).write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY

          # The Linux image and _start_kernel are mandatory.  Anything later is
          # diagnostic evidence and may legitimately be absent if the boot path
          # faults or parks before setup_vm.
          grep -Fq 'BREADCRUMB=_start ' "$gdb_out"
          grep -Fq 'BREADCRUMB=_start_kernel ' "$gdb_out"

      - name: Preserve FDT isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-fdt-isolation-v1-${{ github.sha }}
          path: |
            build/linux-runtime-fdt-isolation-v1/profile/patch.log
            build/linux-runtime-fdt-isolation-v1/*.log
            build/linux-runtime-fdt-isolation-v1/*.txt
            build/linux-runtime-fdt-isolation-v1/*.sha256
            build/linux-runtime-fdt-isolation-v1/gdb*
            build/linux-runtime-fdt-isolation-v1/physical-symbols.gdb
            build/linux-runtime-fdt-isolation-v1/result.txt
            build/linux-runtime-fdt-isolation-v1/qemu.console.log
            build/linux-runtime-fdt-isolation-v1/qemu.debug.log
            build/linux-runtime-fdt-isolation-v1/early/kallsyms-status.txt
            build/linux-runtime-fdt-isolation-v1/early/kallsyms-symbols.txt
            build/linux-runtime-fdt-isolation-v1/early/nm.txt
          if-no-files-found: warn
          retention-days: 7

  # Retained exact specialized job from linux-runtime-fdt-ro-codegen-v0.yml.
  fdt-ro-codegen:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'codegen' || inputs.mode == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[linux-fdt-codegen]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified full linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Install RISC-V toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu make \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu make; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-ro-codegen-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-fdt-ro-codegen-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_INLINE_ASM_LOCAL_INTEGER_FACTS_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_INLINE_ASM_RK_CAST_TAIL_V0=APPLIED' "$ev/profile/patch.log"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Build MiniC and GCC fdt_ro objects with identical Kbuild context
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-fdt-ro-codegen-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-fdt-ro-codegen-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          target=lib/fdt_ro.o
          base=lib/fdt_ro

          rm -f "$out/$target" "$out/lib/.fdt_ro.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s" \
                "$out/$base.minic-stage2.minic.stdout" "$out/$base.minic-stage2.minic.stderr"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
            >"$ev/minic-kbuild.log" 2>&1
          test -s "$out/$target"
          test -s "$out/$base.minic-stage2.i"
          test -s "$out/$base.minic-stage2.s"
          cp "$out/$target" "$ev/fdt_ro.minic.o"
          cp "$out/$base.minic-stage2.i" "$ev/fdt_ro.minic.i"
          cp "$out/$base.minic-stage2.s" "$ev/fdt_ro.minic.s"
          cp "$out/lib/.fdt_ro.o.cmd" "$ev/fdt_ro.minic.cmd" || true

          riscv64-linux-gnu-nm -an "$ev/fdt_ro.minic.o" >"$ev/fdt_ro.minic.nm"
          riscv64-linux-gnu-objdump -drwC "$ev/fdt_ro.minic.o" >"$ev/fdt_ro.minic.objdump"
          riscv64-linux-gnu-readelf -h -A -sW "$ev/fdt_ro.minic.o" >"$ev/fdt_ro.minic.readelf"

          # Rebuild the same Kbuild target with GCC to obtain an exact-context reference.
          rm -f "$out/$target" "$out/lib/.fdt_ro.o.cmd"
          make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC=/usr/bin/riscv64-linux-gnu-gcc -j2 V=1 "$target" \
            >"$ev/gcc-kbuild.log" 2>&1
          test -s "$out/$target"
          cp "$out/$target" "$ev/fdt_ro.gcc.o"
          cp "$out/lib/.fdt_ro.o.cmd" "$ev/fdt_ro.gcc.cmd" || true
          riscv64-linux-gnu-nm -an "$ev/fdt_ro.gcc.o" >"$ev/fdt_ro.gcc.nm"
          riscv64-linux-gnu-objdump -drwC "$ev/fdt_ro.gcc.o" >"$ev/fdt_ro.gcc.objdump"
          riscv64-linux-gnu-readelf -h -A -sW "$ev/fdt_ro.gcc.o" >"$ev/fdt_ro.gcc.readelf"

          # Put the MiniC object back so this diagnostic never leaves a GCC owner in the fixture.
          cp "$ev/fdt_ro.minic.o" "$out/$target"

          {
            echo '=== MiniC fdt32_ld symbols ==='
            grep -E ' fdt32_ld$| fdt_get_property_namelen$| fdt_get_property_namelen_$|__minic_inline_spec_' "$ev/fdt_ro.minic.nm" || true
            echo '=== GCC fdt32_ld symbols ==='
            grep -E ' fdt32_ld$| fdt_get_property_namelen$| fdt_get_property_namelen_$' "$ev/fdt_ro.gcc.nm" || true
            echo '=== MiniC fdt32_ld disassembly ==='
            sed -n '/<fdt32_ld>:/,/^$/p' "$ev/fdt_ro.minic.objdump" | head -220
            echo '=== MiniC fdt_get_property_namelen disassembly ==='
            sed -n '/<fdt_get_property_namelen>:/,/^$/p' "$ev/fdt_ro.minic.objdump" | head -360
            echo '=== GCC fdt_get_property_namelen disassembly ==='
            sed -n '/<fdt_get_property_namelen>:/,/^$/p' "$ev/fdt_ro.gcc.objdump" | head -360
          } | tee "$ev/focused.txt"

      - name: Preserve FDT codegen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-fdt-ro-codegen-v0-${{ github.sha }}
          path: |
            build/linux-runtime-fdt-ro-codegen-v0/profile/patch.log
