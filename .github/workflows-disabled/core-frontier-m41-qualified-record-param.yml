name: Core M41 Qualified Record Parameter

on:
  pull_request:

jobs:
  qualify:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply M31b through M41 and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          python3 tools/dev/patch-core-frontier-batch-m38.py
          python3 tools/dev/patch-core-frontier-batch-m41.py
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m41
      - name: Qualified aggregate parameter shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m41/bin/minic"; w=build/m41-shapes; mkdir -p "$w"
          cat > "$w/const_params.c" <<'EOF'
          struct S { long a; long b; }; struct S f(const struct S x, const struct S y) { struct S r; r.a=x.a+y.a; r.b=x.b+y.b; return r; }
          EOF
          cat > "$w/exactish.c" <<'EOF'
          typedef long s64; typedef unsigned long u64; struct S { s64 tv_sec; long tv_nsec; }; void norm(struct S*, u64, long); struct S f(const struct S lhs, const struct S rhs) { struct S res; norm(&res,(u64)lhs.tv_sec+rhs.tv_sec,lhs.tv_nsec+rhs.tv_nsec); if (!!(res.tv_sec < lhs.tv_sec || res.tv_sec < rhs.tv_sec)) { res.tv_sec=(s64)~((u64)1<<63); res.tv_nsec=0; } return res; }
          EOF
          for src in "$w"/*.c; do
            n=$(basename "$src" .c)
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$n.s"
            printf 'M41_SHAPE_PASS name=%s\n' "$n"
          done
      - name: Frozen timespec representative moves
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m41/bin/minic"; w=build/m41-rep; mkdir -p "$w"
          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/kernel/time/time.i -o "$w/time.s" 2>"$w/time.err"
          rc=$?
          set -e
          head -6 "$w/time.err" || true
          if grep -Fq "Core IR shadow lowering failed for function 'timespec64_add_safe'" "$w/time.err"; then exit 1; fi
          printf 'M41_TIMESPEC_MOVED rc=%d\n' "$rc"
      - name: Preempt member-address matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m41/bin/minic"; w=build/m41-preempt; mkdir -p "$w"
          cat > "$w/direct.c" <<'EOF'
          struct T { int x; volatile int preempt_count; }; volatile int *f(struct T *p) { return &p->preempt_count; }
          EOF
          cat > "$w/call.c" <<'EOF'
          struct T { int x; volatile int preempt_count; }; struct T *g(void); volatile int *f(void) { return &g()->preempt_count; }
          EOF
          cat > "$w/cast.c" <<'EOF'
          struct T { int x; volatile int preempt_count; }; void *g(void); volatile int *f(void) { return &((struct T *)g())->preempt_count; }
          EOF
          cat > "$w/integer_cast.c" <<'EOF'
          struct T { int x; volatile int preempt_count; }; unsigned long g(void); volatile int *f(void) { return &((struct T *)g())->preempt_count; }
          EOF
          for src in "$w"/*.c; do
            n=$(basename "$src" .c)
            set +e
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$n.s" 2>"$w/$n.err"
            rc=$?
            set -e
            printf 'M41_PREEMPT_SHAPE name=%s rc=%d\n' "$n" "$rc"
            cat "$w/$n.err"
          done
      - name: Frozen strict first500 requires zero errors
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m41/bin/minic"; w="$GITHUB_WORKSPACE/build/m41-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$c" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$w" --jobs 5 --offset 0 --limit 500 --sample-count 0 --indices ''
          rc=$?
          set -e
          printf 'M41_REPLAY_RC=%d\n' "$rc"
          python3 tools/ci/classify-core-strict-frontier.py "$w/batch-results.json" --examples 5 --json-out "$w/frontier-summary.json" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m41-strict500/frontier-summary.json').read_text())
          assert s['selected']==500 and s['error']==0 and s['preprocess_missing']==0, s
          print(f"M41_SUMMARY selected=500 pass={s['pass']} unsupported={s['unsupported']} error=0 distinct={len(s['blockers'])}")
          for r in s['blockers'][:25]: print(f"M41_BLOCKER count={r['count']} function={r['function']}")
          PY
