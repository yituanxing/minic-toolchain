name: MiniLD BusyBox Frozen Profile

on:
  push:
    branches:
      - "toolchain/minild-busybox-static"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact V222 BusyBox profile
        shell: bash
        run: |
          set -Eeuo pipefail
          fixture="$GITHUB_WORKSPACE/tests/linker/fixtures"
          out="$RUNNER_TEMP/busybox-v222.config"
          cat \
            "$fixture/busybox-v222.config.part00" \
            "$fixture/busybox-v222.config.part01" \
            "$fixture/busybox-v222.config.part02" \
            "$fixture/busybox-v222.config.part03" \
            "$fixture/busybox-v222.config.part04" \
            >"$out"
          cfg_hash="$(sha256sum "$out" | awk '{print $1}')"
          app_hash="$(sha256sum "$fixture/busybox-v222.applet-list.txt" | awk '{print $1}')"
          app_count="$(wc -l <"$fixture/busybox-v222.applet-list.txt")"
          test "$cfg_hash" = "5977f8e325530d35a9ee4a332b2531e85705f2216279b79090baaebd3cbaf809"
          test "$app_hash" = "372c678111d15f760f1272dddacc807d792a108505ffb62097e2e4f488852177"
          test "$app_count" -eq 408
          grep -q '^CONFIG_STATIC=y$' "$out"
          grep -q '^CONFIG_ASH=y$' "$out"
          printf 'BUSYBOX_PROFILE=PASS sha256=%s applets=%s\n' "$cfg_hash" "$app_count"
