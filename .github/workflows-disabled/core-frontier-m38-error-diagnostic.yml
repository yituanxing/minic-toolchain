name: Core M38 Error Diagnostic

on:
  pull_request:

jobs:
  diagnose:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Extract exact frozen blocker shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          python3 - <<'PY'
          from pathlib import Path
          cases = [
              (Path('build/linux-focus-corpus/kbuild/arch/riscv/kernel/alternative.i'), 'bitmap_get_value8'),
              (Path('build/linux-focus-corpus/kbuild/init/version.i'), 'preempt_count_ptr'),
              (Path('build/linux-focus-corpus/kbuild/kernel/time/time.i'), 'timespec64_add_safe'),
          ]
          for path, name in cases:
              print(f'===== M38_EXTRACT file={path} symbol={name} =====')
              if not path.exists():
                  print('M38_EXTRACT_MISSING_FILE')
                  continue
              text = path.read_text(errors='replace')
              positions=[]
              pos=0
              while True:
                  pos=text.find(name, pos)
                  if pos < 0 or len(positions) >= 8:
                      break
                  positions.append(pos)
                  pos += len(name)
              print(f'M38_EXTRACT_OCCURRENCES count={len(positions)}')
              for i,p in enumerate(positions):
                  lo=max(0,p-1800); hi=min(len(text),p+3200)
                  print(f'--- occurrence={i} byte={p} ---')
                  print(text[lo:hi])
          PY
      - name: Build staged M36 candidate and reproduce errors
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m38-diagnostic
          c="$GITHUB_WORKSPACE/build/m38-diagnostic/bin/minic"
          mkdir -p build/m38-errors
          for rel in arch/riscv/kernel/alternative.i kernel/time/time.i init/version.i; do
            name=$(printf '%s' "$rel" | tr '/' '_' | tr '.' '_')
            set +e
            MINIC_CORE_IR=strict "$c" -S "build/linux-focus-corpus/kbuild/$rel" -o "build/m38-errors/$name.s" 2>"build/m38-errors/$name.err"
            rc=$?
            set -e
            printf 'M38_REPRO file=%s rc=%d\n' "$rel" "$rc"
            head -20 "build/m38-errors/$name.err" || true
          done
      - name: Focused bitmap expression matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m38-diagnostic/bin/minic"
          w=build/m38-shapes; mkdir -p "$w"
          cat > "$w/base.c" <<'EOF'
          unsigned long f(const unsigned long *map, unsigned long start) {
              const unsigned long index = start / 64UL;
              const unsigned long offset = start % 64UL;
              return (map[index] >> offset) & 0xffUL;
          }
          EOF
          cat > "$w/subscript.c" <<'EOF'
          unsigned long f(const unsigned long *map, unsigned long index) { return map[index]; }
          EOF
          cat > "$w/shift.c" <<'EOF'
          unsigned long f(unsigned long x, unsigned long n) { return x >> n; }
          EOF
          cat > "$w/mask.c" <<'EOF'
          unsigned long f(unsigned long x) { return x & 0xffUL; }
          EOF
          for src in "$w"/*.c; do
            name=$(basename "$src" .c)
            set +e
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$name.s" 2>"$w/$name.err"
            rc=$?
            set -e
            printf 'M38_SHAPE name=%s rc=%d\n' "$name" "$rc"
            cat "$w/$name.err"
          done
