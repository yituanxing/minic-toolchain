name: Linux Runtime Compiler Semantics and QEMU Watch Contracts

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose independently labelled semantic or QEMU watch contract jobs"
        type: choice
        required: true
        default: semantics
        options:
          - semantics
          - watch
          - all

permissions:
  contents: read

jobs:

  pi-local-symbol:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'semantics' || inputs.mode == 'all') || github.event_name == 'push') && (github.ref_name == 'agent/linux-expanded-kbuild-v0' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-pi-local-symbol-v0]') || contains(github.event.head_commit.message, '[runtime-compiler-semantics-v1]')))
    concurrency:
      group: linux-runtime-compiler-semantics-v1-${{ github.ref }}-pi-local-symbol
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified compact linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-link-v1/out
          key: linux-runtime-link-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Restore certified frozen frontier inputs
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites without update
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-local-symbol-v0"
          mkdir -p "$ev"
          mode=no-update
          if ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >"$ev/apt.stdout.txt" 2>"$ev/apt.stderr.txt"; then
            mode=fallback-update
            sudo apt-get -o Acquire::Retries=3 update >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
          fi
          echo "INSTALL_MODE=$mode"

      - name: Build MiniC profile with PI-local-symbol fix
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-local-symbol-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-pi-local-symbol-v0"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -F 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED' "$ev/profile/patch.log"

      - name: Prove local symbols use lla and extern symbols keep la
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-local-symbol-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-pi-local-symbol-v0"
          cat >"$ev/pi-local-symbol.i" <<'EOF'
          extern int ext_symbol;
          const char *local_string_addr(void) { return "minic-pi-local"; }
          int *external_object_addr(void) { return &ext_symbol; }
          EOF
          "$build/bin/minic" -S "$ev/pi-local-symbol.i" -o "$ev/pi-local-symbol.s"
          grep -E '^[[:space:]]+lla[[:space:]]+t0,[[:space:]]*\.Lminic_string_[0-9]+' "$ev/pi-local-symbol.s"
          if grep -Fq 'MINIC_RISCV64_PI_LOCAL_SYMBOL_ADDRESS_V0=APPLIED mode=static-pcrel-preserved' "$ev/profile/patch.log"; then
            grep -E '^[[:space:]]+lla[[:space:]]+t0,[[:space:]]*ext_symbol$' "$ev/pi-local-symbol.s"
            echo 'PI_LOCAL_SYMBOL_SYNTHETIC=PASS local=lla extern=lla policy=static-pcrel'
          else
            grep -E '^[[:space:]]+la[[:space:]]+t0,[[:space:]]*ext_symbol$' "$ev/pi-local-symbol.s"
            if grep -E '^[[:space:]]+lla[[:space:]]+t0,[[:space:]]*ext_symbol$' "$ev/pi-local-symbol.s"; then
              echo 'PI_LOCAL_SYMBOL_SYNTHETIC=FAIL extern unexpectedly lowered with lla under selective policy' >&2
              exit 1
            fi
            echo 'PI_LOCAL_SYMBOL_SYNTHETIC=PASS local=lla extern=la policy=selective'
          fi

      - name: Replay only current frontier owners from frozen inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-local-symbol-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-pi-local-symbol-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"
          mapfile -t asm_args <"$frozen/asm-args.txt"
          start=$(date +%s%N)
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/replay.trace" \
            "$wrapper" "${asm_args[@]}" -c -o "$out/lib/idr.o" "$frozen/lib__idr.i"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc \
          MINIC_KEEP_INTERMEDIATES=1 MINIC_KBUILD_TRACE="$ev/replay.trace" \
            "$wrapper" "${asm_args[@]}" -c -o "$out/lib/xarray.o" "$frozen/lib__xarray.i"
          end=$(date +%s%N)
          echo "TIMING replay_ms=$(((end-start)/1000000)) objects=2" | tee "$ev/timing.txt"
          sha256sum "$out/lib/idr.o" "$out/lib/xarray.o" | tee "$ev/objects.sha256"

      - name: Build exact early image with certified compact linker
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-local-symbol-v0"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early"
          cat "$ev/early/timing.txt" >>"$ev/timing.txt"

      - name: Execute until runtime oracle decides
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-pi-local-symbol-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 \
            | tee "$ev/watch.stdout.txt"
          watch_rc=${PIPESTATUS[0]}
          set -e
          {
            echo '## Linux Runtime PI Local Symbol V0'
            echo
            echo '```text'
            cat "$ev/watch/frontier-summary.txt" || true
            cat "$ev/timing.txt" || true
            echo "WATCH_RC=$watch_rc"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          verdict=$(python3 -c 'import json; print(json.load(open("build/linux-runtime-pi-local-symbol-v0/watch/frontier-result.json"))["verdict"])')
          case "$verdict" in
            SAME_FAULT|MOVED_LATER|FRONTIER_PASS)
              echo "PI_LOCAL_SYMBOL_RUNTIME=PASS verdict=$verdict"
              ;;
            *)
              echo "PI_LOCAL_SYMBOL_RUNTIME=FAIL verdict=$verdict watch_rc=$watch_rc" >&2
              exit 1
              ;;
          esac

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-pi-local-symbol-v0-${{ github.sha }}
          path: |
            build/linux-runtime-pi-local-symbol-v0/profile/patch.log
            build/linux-runtime-pi-local-symbol-v0/profile/minic-profile.txt
            build/linux-runtime-pi-local-symbol-v0/pi-local-symbol.i
            build/linux-runtime-pi-local-symbol-v0/pi-local-symbol.s
            build/linux-runtime-pi-local-symbol-v0/objects.sha256
            build/linux-runtime-pi-local-symbol-v0/replay.trace
            build/linux-runtime-pi-local-symbol-v0/timing.txt
            build/linux-runtime-pi-local-symbol-v0/watch/frontier-result.json
            build/linux-runtime-pi-local-symbol-v0/watch/frontier-summary.txt
            build/linux-runtime-pi-local-symbol-v0/watch/watch-result.json
            build/linux-runtime-pi-local-symbol-v0/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7

  satp-micro:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'semantics' || inputs.mode == 'all') || github.event_name == 'push') && (github.ref_name == 'agent/linux-expanded-kbuild-v0' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-pi-micro]') || contains(github.event.head_commit.message, '[runtime-compiler-semantics-v1]')))
    concurrency:
      group: linux-runtime-compiler-semantics-v1-${{ github.ref }}-satp-micro
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/linux-pi-satp-micro/toolchain"
          ev="$GITHUB_WORKSPACE/build/linux-pi-satp-micro/profile"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev"
          cat "$ev/toolchain-timing.txt"

      - name: Check stack-free SATP transition
        shell: bash
        run: |
          set -Eeuo pipefail
          build="$GITHUB_WORKSPACE/build/linux-pi-satp-micro"
          start=$(date +%s%N)
          MINIC="$build/toolchain/bin/minic" \
          BUILD_DIR="$build" \
          SATP_SKIP_GCC=1 \
          MINIC_LOCAL_FACT_TRACE=1 \
            bash tests/compiler/c0/run-gnu-inline-asm-satp-window-rv64.sh 2>&1 | tee "$build/satp-window.log"
          end=$(date +%s%N)
          python3 - "$start" "$end" <<'PY'
          import sys
          start, end = map(int, sys.argv[1:])
          print(f"SATP_MICRO_TEST_MS={(end-start)//1_000_000}")
          PY

      - name: Preserve failing assembly
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-pi-satp-micro-v0
          path: |
            build/linux-pi-satp-micro/profile/patch.log
            build/linux-pi-satp-micro/profile/minic-profile.txt
            build/linux-pi-satp-micro/satp-window.log
            build/linux-pi-satp-micro/tests/compiler-c0-gnu-inline-asm-satp-window/*.s
          if-no-files-found: ignore
          retention-days: 3


  qemu-watch-cert:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'watch' || inputs.mode == 'all') || github.event_name == 'push') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-qemu-watch-cert-v1]') || contains(github.event.head_commit.message, '[linux-runtime-qemu-watch-contracts-v1]'))
    concurrency:
      group: linux-runtime-qemu-watch-contracts-v1-${{ github.ref }}-qemu-watch-cert
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified compact linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-link-v1/out
          key: linux-runtime-link-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Restore certified frozen frontier inputs
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Verify oracle and fixture contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/linux-runtime-frontier-v1.py --self-test
          bash tools/ci/linux-runtime-frozen-verify-v1.sh build/linux-runtime-frozen-v1
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          (cd "$out" && sha256sum -c link-files.sha256 >/dev/null)
          echo 'QEMU_WATCH_FIXTURE=PASS'

      - name: Install minimal runtime prerequisites without update
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-cert-v1"
          mkdir -p "$ev"
          start=$(date +%s%N)
          mode=no-update
          if ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
              binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >"$ev/apt.stdout.txt" 2>"$ev/apt.stderr.txt"; then
            mode=fallback-update
            sudo apt-get -o Acquire::Retries=3 update >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
          fi
          end=$(date +%s%N)
          echo "TIMING install_ms=$(((end-start)/1000000)) mode=$mode" | tee "$ev/timing.txt"

      - name: Build certified early image
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-cert-v1"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early"
          cat "$ev/early/timing.txt" >>"$ev/timing.txt"

      - name: Run fixed 8 second reference oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-cert-v1"
          ref="$ev/reference"
          mkdir -p "$ref"
          start=$(date +%s%N)
          set +e
          timeout --signal=TERM 8s qemu-system-riscv64 \
            -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/early/Image.early" \
            -append 'console=ttyS0 earlycon=sbi loglevel=8 panic=-1' \
            -d int,in_asm -D "$ref/qemu.trace.log" \
            >"$ref/qemu.console.log" 2>&1
          qemu_rc=$?
          set -e
          end=$(date +%s%N)
          echo "TIMING qemu_reference_ms=$(((end-start)/1000000)) rc=$qemu_rc" | tee -a "$ev/timing.txt"
          grep -a 'riscv_cpu_do_interrupt' "$ref/qemu.trace.log" >"$ref/qemu.interrupts.txt" || true
          set +e
          python3 tools/ci/linux-runtime-frontier-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --interrupts "$ref/qemu.interrupts.txt" --nm "$ev/early/nm.txt" \
            --trace "$ref/qemu.trace.log" --console "$ref/qemu.console.log" \
            --qemu-rc "$qemu_rc" --json-out "$ref/frontier-result.json" \
            --text-out "$ref/frontier-summary.txt"
          ref_rc=$?
          set -e
          echo "REFERENCE_CLASSIFIER_RC=$ref_rc" | tee -a "$ev/timing.txt"

      - name: Run event-driven frontier watcher
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-cert-v1"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 8000 --poll-ms 100 \
            | tee "$ev/watch.stdout.txt"
          watch_rc=${PIPESTATUS[0]}
          set -e
          echo "WATCH_CLASSIFIER_RC=$watch_rc" | tee -a "$ev/timing.txt"

      - name: Prove reference/watch oracle equivalence and early stop
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-cert-v1"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/linux-runtime-qemu-watch-cert-v1')
          ref=json.loads((root/'reference/frontier-result.json').read_text())
          watch=json.loads((root/'watch/frontier-result.json').read_text())
          meta=json.loads((root/'watch/watch-result.json').read_text())
          fields=('verdict','fault','highest_progress','progress_rank','pass_markers')
          diffs={k:(ref.get(k),watch.get(k)) for k in fields if ref.get(k)!=watch.get(k)}
          if diffs:
              raise SystemExit(f'QEMU_WATCH_EQUIVALENCE=FAIL diffs={diffs}')
          if ref['verdict'] != 'SAME_FAULT':
              raise SystemExit(f'QEMU_WATCH_EQUIVALENCE=FAIL reference={ref["verdict"]}')
          if meta['stop_reason'] != 'oracle:SAME_FAULT':
              raise SystemExit(f'QEMU_WATCH_STOP=FAIL reason={meta["stop_reason"]}')
          if meta['elapsed_ms'] >= 8000:
              raise SystemExit(f'QEMU_WATCH_STOP=FAIL elapsed_ms={meta["elapsed_ms"]}')
          print('QEMU_WATCH_EQUIVALENCE=PASS verdict=SAME_FAULT fault=fault_load:strlen+0x6 progress=fdt-path')
          print(f'QEMU_WATCH_EARLY_STOP=PASS elapsed_ms={meta["elapsed_ms"]} polls={meta["polls"]}')
          PY
          cat "$ev/reference/frontier-summary.txt"
          cat "$ev/watch/frontier-summary.txt"
          cat "$ev/watch/watch-result.json"
          {
            echo '## Linux Runtime QEMU Watch Cert V1'
            echo
            echo '```text'
            cat "$ev/watch.stdout.txt"
            cat "$ev/timing.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve watcher certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-qemu-watch-cert-v1-${{ github.sha }}
          path: |
            build/linux-runtime-qemu-watch-cert-v1/timing.txt
            build/linux-runtime-qemu-watch-cert-v1/watch.stdout.txt
            build/linux-runtime-qemu-watch-cert-v1/reference/frontier-result.json
            build/linux-runtime-qemu-watch-cert-v1/reference/frontier-summary.txt
            build/linux-runtime-qemu-watch-cert-v1/watch/frontier-result.json
            build/linux-runtime-qemu-watch-cert-v1/watch/frontier-summary.txt
            build/linux-runtime-qemu-watch-cert-v1/watch/watch-result.json
            build/linux-runtime-qemu-watch-cert-v1/watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
  inconclusive-cert:
    if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'watch' || inputs.mode == 'all') || github.event_name == 'push') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-runtime-qemu-watch-inconclusive-v1]') || contains(github.event.head_commit.message, '[linux-runtime-qemu-watch-contracts-v1]'))
    concurrency:
      group: linux-runtime-qemu-watch-contracts-v1-${{ github.ref }}-inconclusive-cert
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified compact linked fixture
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-link-v1/out
          key: linux-runtime-link-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Restore certified frozen frontier inputs
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install minimal runtime prerequisites without update
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-inconclusive-v1"
          mkdir -p "$ev"
          mode=no-update
          if ! sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
              binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >"$ev/apt.stdout.txt" 2>"$ev/apt.stderr.txt"; then
            mode=fallback-update
            sudo apt-get -o Acquire::Retries=3 update >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 \
              >>"$ev/apt.stdout.txt" 2>>"$ev/apt.stderr.txt"
          fi
          echo "INSTALL_MODE=$mode"

      - name: Build certified early image and mismatched same-stage baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/build/linux-runtime-link-v1/out"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-inconclusive-v1"
          bash tools/ci/linux-early-runtime-link-v2.sh "$frozen/src" "$out" "$ev/early"

          # Probe this exact image first.  The repository-wide certified
          # baseline may be ahead of this frozen compact image, so derive the
          # same-stage marker from the image under test instead of hard-coding
          # either a historical or current global frontier stage.
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-frontier-v1.json \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/probe" --timeout-ms 1500 --poll-ms 100 \
            | tee "$ev/probe.stdout.txt"
          probe_rc=${PIPESTATUS[0]}
          set -e
          echo "WATCH_STAGE_PROBE_RC=$probe_rc"

          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('tools/ci/linux-runtime-frontier-v1.json')
          probe_path=Path('build/linux-runtime-qemu-watch-inconclusive-v1/probe/frontier-result.json')
          dst=Path('build/linux-runtime-qemu-watch-inconclusive-v1/mismatch.json')
          c=json.loads(src.read_text())
          probe=json.loads(probe_path.read_text())
          progress_marker=probe.get('highest_progress')
          if not progress_marker:
              raise SystemExit('WATCH_CONSERVATIVE=FAIL probe missing highest_progress')
          known={m['name'] for m in c.get('progress_markers', [])}
          if progress_marker not in known:
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL unknown probe progress_marker={progress_marker}')
          c['baseline']['progress_marker']=progress_marker
          c['baseline']['fault']={'desc':'fault_load','symbol':'__watch_deliberate_mismatch__','offset':'0x0'}
          dst.write_text(json.dumps(c, indent=2, sort_keys=True)+'\n')
          print(f'WATCH_MISMATCH_BASELINE progress_marker={progress_marker} probe_verdict={probe.get("verdict")}')
          PY

      - name: Prove unknown same-stage fault does not stop the watcher early
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-qemu-watch-inconclusive-v1"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config "$ev/mismatch.json" \
            --nm "$ev/early/nm.txt" --image "$ev/early/Image.early" \
            --evidence-dir "$ev/watch" --timeout-ms 1500 --poll-ms 100 \
            | tee "$ev/watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/linux-runtime-qemu-watch-inconclusive-v1/watch')
          meta=json.loads((root/'watch-result.json').read_text())
          result=json.loads((root/'frontier-result.json').read_text())
          if meta['stop_reason'] != 'oracle:INCONCLUSIVE:fault':
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL stop={meta["stop_reason"]}')
          if result['verdict'] != 'INCONCLUSIVE':
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL verdict={result["verdict"]}')
          if meta.get('probe_verdict') != 'INCONCLUSIVE':
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL probe_verdict={meta.get("probe_verdict")}')
          if meta['elapsed_ms'] >= 1500:
              raise SystemExit(f'WATCH_CONSERVATIVE=FAIL expected fault-aware early stop elapsed_ms={meta["elapsed_ms"]}')
          print(f'WATCH_CONSERVATIVE=PASS stop=oracle:INCONCLUSIVE:fault verdict=INCONCLUSIVE elapsed_ms={meta["elapsed_ms"]} polls={meta["polls"]}')
          print(f'OBSERVED_FAULT={result["fault"]["desc"]}:{result["fault"]["symbol"]}+0x{result["fault"]["offset"]:x}')
          print(f'HIGHEST_PROGRESS={result["highest_progress"]}')
          PY
          test "$rc" -eq 2

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-qemu-watch-inconclusive-v1-${{ github.sha }}
          path: |
            build/linux-runtime-qemu-watch-inconclusive-v1/mismatch.json
            build/linux-runtime-qemu-watch-inconclusive-v1/probe.stdout.txt
            build/linux-runtime-qemu-watch-inconclusive-v1/probe/watch-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/probe/frontier-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/probe/frontier-summary.txt
            build/linux-runtime-qemu-watch-inconclusive-v1/watch.stdout.txt
            build/linux-runtime-qemu-watch-inconclusive-v1/watch/watch-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/watch/frontier-result.json
            build/linux-runtime-qemu-watch-inconclusive-v1/watch/frontier-summary.txt
          if-no-files-found: warn
          retention-days: 7
