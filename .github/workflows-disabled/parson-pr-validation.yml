name: Parson PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: parson-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  parson-compile:
    name: parson-compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build committed MiniC semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release BUILD_DIR=build/parson-compiler
          make -j4 MODE=sanitize BUILD_DIR=build/parson-sanitize

      - name: Compile unchanged Parson 1.5.3
        shell: bash
        run: |
          set +e
          MINIC="$GITHUB_WORKSPACE/build/parson-compiler/bin/minic" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/parson-discovery" \
          RISCV_CC=cc \
            sh tests/external/parson/probe.sh
          status=$?
          set -e

          if test "$status" -ge 128; then
            echo "PARSON_SANITIZER_RERUN release_status=$status"
            set +e
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              "$GITHUB_WORKSPACE/build/parson-sanitize/bin/minic" \
              -S "$GITHUB_WORKSPACE/build/parson-discovery/parson.i" \
              -o "$GITHUB_WORKSPACE/build/parson-discovery/parson-sanitize.s"
            sanitize_status=$?
            set -e
            echo "PARSON_SANITIZER_STATUS=$sanitize_status"
          fi
          exit "$status"

      - name: Upload MiniC Parson assembly
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: parson-rv64-assembly
          path: build/parson-discovery/parson.s
          if-no-files-found: error
          retention-days: 3

  parson-runtime:
    name: parson-runtime
    needs: parson-compile
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore RISC-V package archives
        id: rv64-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/minic-apt/archives
          key: rv64-apt-${{ runner.os }}-${{ runner.arch }}-noble-${{ hashFiles('tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Install RISC-V runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          apt_cache="$HOME/.cache/minic-apt/archives"
          mkdir -p "$apt_cache/partial"
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          mapfile -d '' -t cached < <(find "$apt_cache" -maxdepth 1 -type f -name '*.deb' -print0 | sort -z)
          if (( ${#cached[@]} > 0 )); then
            sudo apt-get install -y --no-install-recommends "${cached[@]}"
          else
            sudo apt-get update
            sudo apt-get \
              -o Dir::Cache::archives="$apt_cache" \
              -o APT::Keep-Downloaded-Packages=true \
              install -y --no-install-recommends "${packages[@]}"
          fi
          sudo chown -R "$USER:$USER" "$(dirname "$apt_cache")"
          sh tools/ci/verify-validation-tools.sh

      - name: Download MiniC Parson assembly
        uses: actions/download-artifact@v4
        with:
          name: parson-rv64-assembly
          path: build/parson-discovery

      - name: Run upstream Parson GCC differential
        shell: bash
        run: |
          RISCV_CC=riscv64-linux-gnu-gcc \
          QEMU_RISCV64=qemu-riscv64 \
          PARSON_ASSEMBLY="$GITHUB_WORKSPACE/build/parson-discovery/parson.s" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/parson-runtime" \
            sh tests/external/parson/runtime_differential.sh
