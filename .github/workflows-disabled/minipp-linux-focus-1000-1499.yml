name: MiniPP Linux Focus 1000-1499

concurrency:
  group: minipp-linux-focus500c-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'toolchain/minipp-*'
    paths:
      - 'preprocessor/**'
      - 'tools/minic-cpp/**'
      - 'tests/preprocessor/**'
      - '.github/workflows/minipp-linux-focus-1000-1499.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  MINIPP_LINUX_ARCHIVE_SHA256: dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932
  MINIPP_THIRD500_CACHE_KEY: minipp-linux-ref500c-v1-linux-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-b3487f3cf001d085a4a5ba55124fa0ec2c3929ab162bc780a5848ddd3934cbf7-7e7ca7019abb49f159d641d0f620be44e874536c422bbd21d79bb661980d3dd1-a4ddb411938926d3e95625a210030a14317e4bc20b881416269e4698576a8e8e

jobs:
  focus4:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minipp-linux-1500-focus]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install focused replay prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross make curl xz-utils

      - name: Build independent MiniPP
        run: |
          set -Eeuo pipefail
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-focus500c toolchain 2>/dev/null || \
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/minipp-linux-focus500c all
          test -x build/minipp-linux-focus500c/bin/minic-cpp

      - name: Prepare immutable Linux source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-focus500c-work"
          archive="$work/linux-6.6.143.tar.xz"
          mkdir -p "$work"
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.143.tar.xz -o "$archive"
          printf '%s  %s\n' "$MINIPP_LINUX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$work"

      - name: Restore frozen GCC third500 corpus
        uses: actions/cache/restore@v4
        with:
          path: build/minipp-linux-ref500c-corpus
          key: ${{ env.MINIPP_THIRD500_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Replay focused third500 pool
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/minipp-linux-focus500c-work"
          corpus="$GITHUB_WORKSPACE/build/minipp-linux-ref500c-corpus"
          python3 tests/preprocessor/run_linux_cached_exact.py \
            --contract "$corpus/contract.jsonl" \
            --corpus "$corpus" \
            --src "$work/linux-6.6.143" \
            --out "$work/out" \
            --minipp "$GITHUB_WORKSPACE/build/minipp-linux-focus500c/bin/minic-cpp" \
            --work "$work/replay" \
            --indices "$GITHUB_WORKSPACE/tests/preprocessor/linux-third500-focus-indices.txt" \
            --jobs 4 \
            --label focus4-500-999

      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minipp-linux-focus-1000-1499
          path: |
            build/minipp-linux-focus500c-work/replay/headline.txt
            build/minipp-linux-focus500c-work/replay/results.tsv
            build/minipp-linux-focus500c-work/replay/results.json
            build/minipp-linux-focus500c-work/replay/failure-pool.tsv
            build/minipp-linux-focus500c-work/replay/diff/**
            build/minipp-linux-focus500c-work/replay/stderr/**
          if-no-files-found: ignore
          retention-days: 3
