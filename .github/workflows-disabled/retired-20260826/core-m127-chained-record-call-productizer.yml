name: Core M127 Chained Record Call Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M127
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M127_CHAINED_RECORD_MATERIALIZED_RHS' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M127 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m127-chained-record-call.py
          git diff --check
          grep -Fq 'M127_CHAINED_RECORD_MATERIALIZED_RHS' src/core/core_lower.c
          grep -Fq 'chained-record-call-strict=1' tests/compiler/c0/run-record-assignment-expressions.sh

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m127-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m127-product-check

      - name: Replay M127 focused frontier
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m127-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m127-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '307,388,390,408,409,410,415,471,473,478,484'
          replay_status=$?
          set -e
          printf 'CORE_M127_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m127-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 11 or summary['pass'] < 9 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M127 focused regression: {summary}')
          by_index={int(row['index']):row for row in rows}
          for index, old_line in {307:69479, 473:60814}.items():
              row=by_index[index]
              if row['status']=='PASS':
                  continue
              new_line=int(row.get('first_error_line') or 0)
              if not str(row.get('message','')).startswith('Core IR shadow does not yet support function ') or new_line <= old_line:
                  raise SystemExit(f'M127 index {index} did not clear old frontier {old_line}: {row}')
              print(f'CORE_M127_PRODUCT_FRONTIER_CLEARED index={index} old={old_line} new={new_line}')
          print(f"CORE_M127_PRODUCT_FOCUSED selected=11 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m127-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m127-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M127_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m127-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M127 full500 ERROR/missing: {summary}')
          if summary['pass'] < 463:
              raise SystemExit(f"M127 regressed strict500: pass={summary['pass']} expected>=463")
          print(f"CORE_M127_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M127 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
                  tests/compiler/c0/record_assignment_expression.c \
                  tests/compiler/c0/run-record-assignment-expressions.sh
          git diff --cached --quiet && { echo 'no M127 semantic changes'; exit 1; }
          git commit -m 'core: materialize chained record assignment RHS'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M127 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m127-chained-record-productizer-${{ github.sha }}
          path: |
            build/m127-product-focused/batch-results.json
            build/m127-product-focused/frontier-summary.json
            build/m127-product-focused/reason-summary.txt
            build/m127-product-focused/minic-stderr/**
            build/m127-product-full500/batch-results.json
            build/m127-product-full500/frontier-summary.json
            build/m127-product-full500/reason-summary.txt
            build/m127-product-full500/progress-summary.json
            build/m127-product-full500/progress-summary.txt
            build/m127-product-full500/minic-stderr/**
          if-no-files-found: warn
