name: Core M129 Leaf Expression Owners Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M129
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M129_LEAF_EXPRESSION_OWNERS' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply pending M128 and M129 semantic batches
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m128-record-call-argument-materialization.py
          python3 tools/ci/apply-m129-leaf-expression-owners.py
          git diff --check
          grep -Fq 'M128_RECORD_CALL_ARGUMENT_MATERIALIZATION' src/core/core_lower.c
          grep -Fq 'M129_LEAF_EXPRESSION_OWNERS' src/core/core_lower.c
          test -s tests/compiler/c0/m129_builtin_isdigit.c
          test -s tests/compiler/c0/m129_discarded_record_values.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m129-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m129-product-check

      - name: Run strict M128 aggregate regression
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/m129-product-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/m129-product-m128-regression" \
            tests/compiler/c0/run-record-conditional-materialization.sh

      - name: Run isolated M129 strict regressions
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m129-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m129-product-regression"
          mkdir -p "$work"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m129_builtin_isdigit.c -o "$work/isdigit.i"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m129_discarded_record_values.c -o "$work/record.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/isdigit.i" -o "$work/isdigit.s"
          MINIC_CORE_IR=strict "$compiler" -S "$work/record.i" -o "$work/record.s"
          grep -F 'call make_word' "$work/record.s" >/dev/null
          printf '%s\n' 'CORE_M129_STRICT_REGRESSION isdigit=PASS discarded-record-assignment=PASS discarded-record-call=PASS'

      - name: Replay M129 focused frontier
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m129-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m129-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '307,424,444,473'
          replay_status=$?
          set -e
          printf 'CORE_M129_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 12 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m129-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 4 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M129 focused ERROR/missing: {summary}')
          if summary['pass'] == 0:
              raise SystemExit(f'M129 did not clear any focused TU: {summary}')
          by_index={int(row['index']):row for row in rows}
          for index in (307,424,444,473):
              row=by_index[index]
              print(f"CORE_M129_INDEX_{index} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
          print(f"CORE_M129_PRODUCT_FOCUSED selected=4 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m129-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m129-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M129_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m129-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M129 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 463:
              raise SystemExit(f"M129 produced no strict500 gain: pass={summary['pass']} baseline=463")
          print(f"CORE_M129_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M128 plus M129 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
                  tests/compiler/c0/run-record-conditional-materialization.sh \
                  tests/compiler/c0/record_call_argument_materialization.c \
                  tests/compiler/c0/m129_builtin_isdigit.c \
                  tests/compiler/c0/m129_discarded_record_values.c
          git diff --cached --quiet && { echo 'no M128/M129 semantic changes'; exit 1; }
          git commit -m 'core: close M128-M129 aggregate and isdigit owners'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M129 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m129-leaf-expression-owners-${{ github.sha }}
          path: |
            build/m129-product-regression/**
            build/m129-product-focused/batch-results.json
            build/m129-product-focused/frontier-summary.json
            build/m129-product-focused/reason-summary.txt
            build/m129-product-focused/minic-stderr/**
            build/m129-product-full500/batch-results.json
            build/m129-product-full500/frontier-summary.json
            build/m129-product-full500/reason-summary.txt
            build/m129-product-full500/progress-summary.json
            build/m129-product-full500/progress-summary.txt
            build/m129-product-full500/minic-stderr/**
          if-no-files-found: warn
