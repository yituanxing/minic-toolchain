name: Core M128 Record Call Argument Materialization Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M128
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M128_RECORD_CALL_ARGUMENT_MATERIALIZATION' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M128 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m128-record-call-argument-materialization.py
          git diff --check
          grep -Fq 'M128_RECORD_CALL_ARGUMENT_MATERIALIZATION' src/core/core_lower.c
          grep -Fq 'record_call_argument_materialization.c' tests/compiler/c0/run-record-conditional-materialization.sh
          grep -Fq 'strict-call-argument=1' tests/compiler/c0/run-record-conditional-materialization.sh
          test -s tests/compiler/c0/record_call_argument_materialization.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m128-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m128-product-check

      - name: Run strict aggregate call composition regression
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MINIC="$GITHUB_WORKSPACE/build/m128-product-compiler/bin/minic" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/m128-product-regression" \
            tests/compiler/c0/run-record-conditional-materialization.sh

      - name: Replay M128 focused frontier
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m128-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m128-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 2 \
            --indices '424,444'
          replay_status=$?
          set -e
          printf 'CORE_M128_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 10 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m128-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 2 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M128 focused ERROR/missing: {summary}')
          by_index={int(row['index']):row for row in rows}
          if by_index[444]['status'] != 'PASS':
              raise SystemExit(f"M128 did not clear record call-argument target #444: {by_index[444]}")
          print(f"CORE_M128_PRODUCT_FOCUSED selected=2 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print(f"CORE_M128_INDEX_424 status={by_index[424]['status']} line={by_index[424].get('first_error_line')} message={by_index[424].get('message')}")
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m128-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m128-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M128_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 20 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m128-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M128 full500 ERROR/missing: {summary}')
          if summary['pass'] < 463:
              raise SystemExit(f"M128 regressed strict500: pass={summary['pass']} expected>=463")
          print(f"CORE_M128_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M128 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c \
                  tests/compiler/c0/run-record-conditional-materialization.sh \
                  tests/compiler/c0/record_call_argument_materialization.c
          git diff --cached --quiet && { echo 'no M128 semantic changes'; exit 1; }
          git commit -m 'core: materialize by-value record call arguments'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M128 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m128-record-call-argument-productizer-${{ github.sha }}
          path: |
            build/m128-product-focused/batch-results.json
            build/m128-product-focused/frontier-summary.json
            build/m128-product-focused/reason-summary.txt
            build/m128-product-focused/minic-stderr/**
            build/m128-product-full500/batch-results.json
            build/m128-product-full500/frontier-summary.json
            build/m128-product-full500/reason-summary.txt
            build/m128-product-full500/progress-summary.json
            build/m128-product-full500/progress-summary.txt
            build/m128-product-full500/minic-stderr/**
          if-no-files-found: warn
