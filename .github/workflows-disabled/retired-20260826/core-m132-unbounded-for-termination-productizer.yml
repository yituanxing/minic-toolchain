name: Core M132 Unbounded For Termination Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  productize:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized M132
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M132_UNBOUNDED_FOR_TERMINATION' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply M132 unbounded-for termination owner
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m132-unbounded-for-termination.py
          git diff --check
          grep -Fq 'M132_UNBOUNDED_FOR_TERMINATION' src/core/core_lower.c
          test -s tests/compiler/c0/m132_unbounded_for_termination.c

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m132-product-compiler

      - name: Run fast regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/m132-product-check

      - name: Run isolated M132 strict regression
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m132-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m132-product-regression"
          mkdir -p "$work"
          cc -E -P -std=gnu11 -x c tests/compiler/c0/m132_unbounded_for_termination.c -o "$work/unbounded-for.i"
          MINIC_CORE_IR=strict "$compiler" -S "$work/unbounded-for.i" -o "$work/unbounded-for.s"
          grep -F 'terminal_loop:' "$work/unbounded-for.s" >/dev/null
          grep -F 'breakable_loop:' "$work/unbounded-for.s" >/dev/null
          printf '%s\n' 'CORE_M132_STRICT_REGRESSION terminal-loop=PASS breakable-loop=PASS'

      - name: Replay M132 focused frontier
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m132-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m132-product-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '156,157,241,318,414'
          replay_status=$?
          set -e
          printf 'CORE_M132_PRODUCT_FOCUSED_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 15 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m132-product-focused')
          rows=json.loads((work/'batch-results.json').read_text())
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 5 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M132 focused ERROR/missing: {summary}')
          by_index={int(row['index']):row for row in rows}
          for index in (156,157,241,318,414):
              row=by_index[index]
              print(f"CORE_M132_INDEX_{index} status={row['status']} line={row.get('first_error_line')} message={row.get('message')}")
          for index in (156,157):
              if by_index[index]['status'] != 'PASS':
                  raise SystemExit(f'M132 expected unbounded-loop TU PASS at index {index}: {by_index[index]}')
          if summary['pass'] < 2:
              raise SystemExit(f'M132 focused produced insufficient gain: {summary}')
          print(f"CORE_M132_PRODUCT_FOCUSED selected=5 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Replay strict full500
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m132-product-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m132-product-full500"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --offset 0 \
            --limit 500 \
            --sample-count 0
          replay_status=$?
          set -e
          printf 'CORE_M132_PRODUCT_FULL500_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 30 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 500 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          work=Path('build/m132-product-full500')
          summary=json.loads((work/'frontier-summary.json').read_text())
          if summary['selected'] != 500 or summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(f'M132 full500 ERROR/missing: {summary}')
          if summary['pass'] <= 479:
              raise SystemExit(f"M132 produced no strict500 gain: pass={summary['pass']} baseline=479")
          print(f"CORE_M132_PRODUCT_FULL500 selected=500 pass={summary['pass']} unsupported={summary['unsupported']} error=0")
          print((work/'progress-summary.txt').read_text())
          print((work/'reason-summary.txt').read_text())
          PY

      - name: Commit M132 semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c tests/compiler/c0/m132_unbounded_for_termination.c
          git diff --cached --quiet && { echo 'no M132 semantic changes'; exit 1; }
          git commit -m 'core: terminate unreachable unbounded-for exits'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist M132 results
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-m132-unbounded-for-${{ github.sha }}
          path: |
            build/m132-product-regression/**
            build/m132-product-focused/**
            build/m132-product-full500/**
          if-no-files-found: warn
