name: Core Futex Cmpxchg5 Productizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  futex-cmpxchg5:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Detect already-productized family
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -Fq 'M118_SIX_OPERAND_ATOMIC_STRUCTURED_ASM' src/core/core_lower.c; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore frozen Linux corpus
        if: steps.state.outputs.needs_patch == 'true'
        id: linux-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.linux-corpus-cache.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Apply six-operand atomic asm batch
        if: steps.state.outputs.needs_patch == 'true'
        run: python3 tools/ci/apply-m118-six-operand-atomic-asm.py

      - name: Build exact patched compiler
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/futex-cmpxchg5-compiler

      - name: Run fast host regression gate
        if: steps.state.outputs.needs_patch == 'true'
        run: make -j4 check-fast MODE=release CFLAGS=-Werror BUILD_DIR=build/futex-cmpxchg5-check

      - name: Replay all cmpxchg futex TUs
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/futex-cmpxchg5-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/futex-cmpxchg5"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '180,181,182,183,184'
          replay_status=$?
          set -e
          printf 'CORE_FUTEX_CMPXCHG5_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --examples 5 \
            --json-out "$work/frontier-summary.json"
          python3 tools/ci/summarize-core-frontier-progress.py \
            "$work/batch-results.json" \
            --expect-selected 5 \
            --json-out "$work/progress-summary.json" \
            --text-out "$work/progress-summary.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          work = Path('build/futex-cmpxchg5')
          rows = json.loads((work / 'batch-results.json').read_text())
          summary = json.loads((work / 'frontier-summary.json').read_text())
          if len(rows) != 5:
              raise SystemExit(f'expected 5 rows, got {len(rows)}')
          if summary['error'] != 0 or summary['preprocess_missing'] != 0:
              raise SystemExit(
                  f"cmpxchg5 ERROR/missing: error={summary['error']} missing={summary['preprocess_missing']}"
              )
          remaining = [b for b in summary.get('blockers', [])
                       if b.get('function') == 'futex_atomic_cmpxchg_inatomic']
          if remaining:
              raise SystemExit(f'old cmpxchg blocker remains: {remaining}')
          print(
              f"CORE_FUTEX_CMPXCHG5_ACCEPT pass={summary['pass']} "
              f"unsupported={summary['unsupported']} error=0 selected=5"
          )
          print('CORE_FUTEX_CMPXCHG5_NEW_FRONTIER ' +
                json.dumps(summary.get('blockers', [])[:8], sort_keys=True))
          print((work / 'progress-summary.txt').read_text())
          PY

      - name: Commit six-operand atomic asm semantic batch
        if: steps.state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --cached --quiet && { echo 'no semantic changes to productize'; exit 1; }
          git commit -m 'core: admit six-operand atomic structured asm'
          git push origin HEAD:refactor/declaration-sema-v1

      - name: Persist cmpxchg5 result
        if: always() && steps.state.outputs.needs_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-futex-cmpxchg5-${{ github.sha }}
          path: |
            build/futex-cmpxchg5/batch-results.json
            build/futex-cmpxchg5/frontier-summary.json
            build/futex-cmpxchg5/progress-summary.json
            build/futex-cmpxchg5/progress-summary.txt
            build/futex-cmpxchg5/minic-stderr/**
          if-no-files-found: warn
