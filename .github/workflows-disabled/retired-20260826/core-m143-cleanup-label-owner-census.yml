name: Core M143 Cleanup Label Owner Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Stage M137 M141 M142 and M143 trace
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'M134_UNREACHABLE_TAIL_OWNER' src/core/core_lower.c
          ! grep -Fq 'M135_CLEANUP_EDGE_CLASSIFICATION' src/core/core_lower.c
          python3 tools/ci/apply-m137-detached-loop-continue-owner.py
          python3 tools/ci/apply-m141-scoped-loop-continue-tail.py
          python3 tools/ci/apply-m142-nonedge-cleanup-metadata.py
          python3 tools/ci/apply-m143-cleanup-label-owner-trace.py
          git diff --check
          grep -Fq 'M143_CLEANUP_LABEL_OWNER_TRACE' src/core/core_lower.c

      - name: Build exact diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m143-census-compiler

      - name: Replay cleanup-label pair
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m143-census-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m143-census-focused"
          set +e
          CORE_M143_TRACE=1 CORE_FAST_TRACE=1 MINIC_CORE_IR=strict \
            python3 tests/external/linux/corpus_replay.py \
              --minic "$compiler" \
              --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
              --work "$work" \
              --jobs 2 \
              --indices '95,98'
          replay_status=$?
          set -e
          printf 'CORE_M143_REPLAY_STATUS=%d\n' "$replay_status"
          for f in "$work"/minic-stderr/kernel/sched/*.stderr; do
            echo "===== $f ====="
            grep -E 'CORE_M143_LABEL|CORE_FAST_TRACE stage=statement reason=cleanup-context|error:' "$f" | tail -n 160 || true
          done

      - name: Persist M143 census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m143-cleanup-label-owner-${{ github.sha }}
          path: build/m143-census-focused/**
          if-no-files-found: warn
