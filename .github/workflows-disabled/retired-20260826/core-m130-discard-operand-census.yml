name: Core M130 Discard Operand Census

on:
  pull_request:

permissions:
  contents: read

jobs:
  census:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0

      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}

      - name: Require frozen corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          test -s build/linux-focus-corpus/selected-tus.txt

      - name: Stage M130 discard operand trace
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/ci/apply-m130-discard-operand-trace.py
          git diff --check
          grep -Fq 'M130_DISCARD_OPERAND_TRACE' src/core/core_lower.c

      - name: Build diagnostic compiler
        run: make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m130-discard-compiler

      - name: Replay focused discard frontier
        shell: bash
        run: |
          set -Eeuo pipefail
          compiler="$GITHUB_WORKSPACE/build/m130-discard-compiler/bin/minic"
          work="$GITHUB_WORKSPACE/build/m130-discard-focused"
          set +e
          MINIC_CORE_IR=strict CORE_FAST_TRACE=1 python3 tests/external/linux/corpus_replay.py \
            --minic "$compiler" \
            --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" \
            --work "$work" \
            --jobs 4 \
            --indices '96,97,98,137'
          replay_status=$?
          set -e
          printf 'CORE_M130_REPLAY_STATUS=%d\n' "$replay_status"
          python3 tools/ci/classify-core-strict-frontier.py \
            "$work/batch-results.json" \
            --stderr-root "$work/minic-stderr" \
            --ast-header "$GITHUB_WORKSPACE/src/frontend/ast.h" \
            --examples 12 \
            --json-out "$work/frontier-summary.json" \
            --reason-text-out "$work/reason-summary.txt" \
            --require-no-errors
          grep -R 'CORE_M130_DISCARD_DETAIL' "$work/minic-stderr" || true
          cat "$work/reason-summary.txt"

      - name: Persist M130 census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-m130-discard-operand-${{ github.sha }}
          path: |
            build/m130-discard-focused/batch-results.json
            build/m130-discard-focused/frontier-summary.json
            build/m130-discard-focused/reason-summary.txt
            build/m130-discard-focused/minic-stderr/**
          if-no-files-found: warn
