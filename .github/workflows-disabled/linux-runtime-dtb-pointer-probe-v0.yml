# Reproduce the certified full-owner early runtime image and inspect crc32_body at the exact fault PC.
name: Linux Runtime DTB Pointer Probe V0

on:
  push:
    branches: ["agent/linux-expanded-kbuild-v0"]
    paths:
      - ".github/workflows/linux-runtime-dtb-pointer-probe-v0.yml"
      - "tools/ci/linux-early-runtime-link-v3.sh"
      - "tools/ci/apply-riscv64-core-object-slot-reuse-v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runtime-dtb-pointer-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dtb-pointer-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore certified fixtures
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/out
          key: linux-expanded-mixed-v1-6.6.143-Linux-d30569a4c675f6ac72d9f63c28f0b8745317f7a15c0799d10768f916d74b3a88
          fail-on-cache-miss: true

      - name: Restore pinned Linux source
        uses: actions/cache/restore@v4
        with:
          path: build/linux-expanded-kbuild-v0/linux-6.6.143
          key: linux-source-6.6.143-dace1f8dc9c0dbf5df14f47e3229cd62c298e83049681731ef229f2ba7592932-v1
          fail-on-cache-miss: true

      - name: Restore frozen linker source subset
        uses: actions/cache/restore@v4
        with:
          path: build/linux-runtime-frozen-v1
          key: linux-runtime-frozen-v1-6.6.143-e538a6ad42ec49c5a667cab5de9bb943f82ca702ff2b7749a020e38ff7ddaea7
          fail-on-cache-miss: true

      - name: Install focused prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make gdb-multiarch \
            || { sudo apt-get -o Acquire::Retries=3 update; sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc opensbi python3 make gdb-multiarch; }

      - name: Build exact Linux runtime MiniC profile
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-dtb-pointer-probe-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-dtb-pointer-probe-v0"
          mkdir -p "$ev"
          bash tools/ci/linux-runtime-build-minic-profile-v1.sh "$build" "$ev/profile"
          grep -Fx 'apply-riscv64-core-object-slot-reuse-v0.py' "$ev/profile/minic-profile.txt"
          echo 'CRC32_FAULT_PROFILE=PASS slot_reuse=current'

      - name: Refresh certified full runtime owners
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          src="$work/linux-6.6.143"
          out="$work/out"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-dtb-pointer-probe-v0"
          build="$GITHUB_WORKSPACE/build/toolchain-runtime-dtb-pointer-probe-v0"
          wrapper="$GITHUB_WORKSPACE/tests/external/linux/stage2_kbuild_cc.sh"

          refresh_obj() {
            target="$1"; log="$2"
            base="${target%.o}"; dir="${target%/*}"; stem="${target##*/}"; stem="${stem%.o}"
            rm -f "$out/$target" "$out/$dir/.${stem}.o.cmd" "$out/$base.minic-stage2.i" "$out/$base.minic-stage2.s"
            MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
              make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$target" \
              >"$ev/$log" 2>&1
            test -s "$out/$target"
            echo "OWNER_REFRESH=PASS target=$target"
          }

          pi_target=arch/riscv/kernel/pi/cmdline_early.pi.o
          pi_base=arch/riscv/kernel/pi/cmdline_early
          rm -f "$out/$pi_base.o" "$out/$pi_target" "$out/arch/riscv/kernel/pi/.cmdline_early.o.cmd" "$out/arch/riscv/kernel/pi/.cmdline_early.pi.o.cmd" "$out/$pi_base.minic-stage2.i" "$out/$pi_base.minic-stage2.s"
          MINIC="$build/bin/minic" REAL_CC=/usr/bin/riscv64-linux-gnu-gcc MINIC_KEEP_INTERMEDIATES=1 \
            make -C "$src" O="$out" ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- CC="$wrapper" -j2 V=1 "$pi_target" >"$ev/pi-owner-refresh.log" 2>&1
          test -s "$out/$pi_target"
          grep -E '^[[:space:]]+lla[[:space:]]+[^,]+,[[:space:]]*\.Lminic_string_' "$out/$pi_base.minic-stage2.s" >/dev/null

          refresh_obj arch/riscv/mm/init.o init-refresh.log
          refresh_obj arch/riscv/kernel/setup.o setup-refresh.log
          refresh_obj kernel/sched/core.o sched-core-refresh.log
          refresh_obj arch/riscv/kernel/irq.o irq-refresh.log
          refresh_obj kernel/locking/spinlock.o spinlock-refresh.log
          refresh_obj kernel/locking/spinlock_debug.o spinlock-debug-refresh.log
          refresh_obj kernel/sched/build_utility.o build-utility-refresh.log
          refresh_obj kernel/time/timekeeping.o timekeeping-refresh.log
          refresh_obj kernel/time/vsyscall.o vsyscall-refresh.log
          refresh_obj kernel/notifier.o notifier-refresh.log
          refresh_obj kernel/sched/build_policy.o build-policy-refresh.log
          refresh_obj kernel/time/timer.o timer-refresh.log
          refresh_obj kernel/time/hrtimer.o hrtimer-refresh.log
          refresh_obj kernel/time/tick-sched.o tick-sched-refresh.log
          refresh_obj kernel/rcu/tree.o rcu-tree-refresh.log
          refresh_obj kernel/softirq.o softirq-refresh.log
          refresh_obj drivers/of/fdt.o fdt-refresh.log
          refresh_obj lib/fdt_ro.o fdt-ro-refresh.log
          refresh_obj lib/crc32.o crc32-refresh.log
          refresh_obj kernel/kallsyms.o kallsyms-refresh.log

          cp "$out/drivers/of/fdt.minic-stage2.s" "$ev/drivers_of_fdt.o.s"
          cp "$out/arch/riscv/mm/init.minic-stage2.s" "$ev/arch_riscv_mm_init.o.s"
          cp "$out/lib/crc32.minic-stage2.s" "$ev/lib_crc32.o.s"
          cp "$out/$pi_base.minic-stage2.s" "$ev/arch_riscv_kernel_pi_cmdline_early.pi.o.s"
          riscv64-linux-gnu-objdump -dr "$out/lib/crc32.o" > "$ev/lib_crc32.objdump.txt"

      - name: Link full-owner V3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/build/linux-expanded-kbuild-v0"
          frozen="$GITHUB_WORKSPACE/build/linux-runtime-frozen-v1"
          ev="$GITHUB_WORKSPACE/build/linux-runtime-dtb-pointer-probe-v0"
          bash tools/ci/linux-early-runtime-link-v3.sh "$frozen/src" "$work/out" "$ev/current" "$work/linux-6.6.143"
          grep -E '[[:space:]](early_init_dt_scan|early_init_dt_verify|crc32_be|crc32_body|crc32table_be|_dtb_early_va|_dtb_early_pa|initial_boot_params|initial_boot_params_pa|_end)$' "$ev/current/nm.txt" | tee "$ev/current-symbols.txt"

      - name: Capture crc32 exact fault frame with GDB
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-dtb-pointer-probe-v0"
          nm="$ev/current/nm.txt"
          sym() { awk -v s="$1" '$3 == s { print "0x" $1; exit }' "$nm"; }

          crc=$(sym crc32_be)
          body=$(sym crc32_body)
          tab=$(sym crc32table_be)
          kend=$(sym _end)
          test -n "$crc"; test -n "$body"; test -n "$tab"; test -n "$kend"

          cat >"$ev/crc32-fault.gdb" <<EOF
          set pagination off
          set confirm off
          set architecture riscv:rv64
          target remote :1234
          hbreak *$crc
          commands
            silent
            printf "CRC32_ENTRY seed=0x%lx buf=0x%lx len=0x%lx a3=0x%lx table_symbol=$tab kernel_end=$kend pc=0x%lx sp=0x%lx\\n", \$a0, \$a1, \$a2, \$a3, \$pc, \$sp
            continue
          end
          hbreak *($body + 0xdd4)
          commands
            silent
            printf "CRC32_FAULT_SITE pc=0x%lx sp=0x%lx\\n", \$pc, \$sp
            x/8i \$pc-8
            info registers ra sp gp tp t0 t1 t2 t3 t4 t5 t6 a0 a1 a2 a3 a4 a5 a6 a7 s0 s1 s2 s3 s4 s5 s6 s7 s8 s9 s10 s11
            printf "CRC32_OBJECTS crc=0x%lx buf=0x%lx len=0x%lx t0p=0x%lx t1p=0x%lx t2p=0x%lx t3p=0x%lx t4p=0x%lx t5p=0x%lx t6p=0x%lx t7p=0x%lx rem=0x%lx b=0x%lx p=0x%lx tabtmp=0x%lx\\n", *(unsigned int *)(\$sp+0), *(unsigned long *)(\$sp+8), *(unsigned long *)(\$sp+16), *(unsigned long *)(\$sp+24), *(unsigned long *)(\$sp+32), *(unsigned long *)(\$sp+40), *(unsigned long *)(\$sp+48), *(unsigned long *)(\$sp+56), *(unsigned long *)(\$sp+64), *(unsigned long *)(\$sp+72), *(unsigned long *)(\$sp+80), *(unsigned long *)(\$sp+88), *(unsigned long *)(\$sp+96), *(unsigned long *)(\$sp+104), *(unsigned long *)(\$sp+112)
            printf "CRC32_SCRATCH s120=0x%lx s128=0x%lx s136=0x%lx s144=0x%lx s152=0x%lx s160=0x%lx s168=0x%lx s176=0x%lx s184=0x%lx\\n", *(unsigned long *)(\$sp+120), *(unsigned long *)(\$sp+128), *(unsigned long *)(\$sp+136), *(unsigned long *)(\$sp+144), *(unsigned long *)(\$sp+152), *(unsigned long *)(\$sp+160), *(unsigned long *)(\$sp+168), *(unsigned long *)(\$sp+176), *(unsigned long *)(\$sp+184)
            detach
            quit
          end
          continue
          EOF

          qemu-system-riscv64 -M virt -cpu max -m 512M -smp 1 -nographic -no-reboot \
            -bios default -kernel "$ev/current/Image.early" \
            -append "console=ttyS0 earlycon=sbi loglevel=8 panic=-1" \
            -S -gdb tcp::1234 >"$ev/crc32-fault-qemu.log" 2>&1 &
          qpid=$!
          cleanup() { kill "$qpid" 2>/dev/null || true; wait "$qpid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1
          set +e
          timeout 30s gdb-multiarch -q -batch -x "$ev/crc32-fault.gdb" "$ev/current/vmlinux.early" | tee "$ev/crc32-fault-gdb.txt"
          grc=${PIPESTATUS[0]}
          set -e
          echo "CRC32_FAULT_GDB_RC=$grc" | tee -a "$ev/crc32-fault-gdb.txt"
          cleanup
          trap - EXIT

      - name: Classify full-owner image
        shell: bash
        run: |
          set -Eeuo pipefail
          ev="$GITHUB_WORKSPACE/build/linux-runtime-dtb-pointer-probe-v0"
          set +e
          python3 tools/ci/linux-runtime-qemu-watch-v1.py \
            --config tools/ci/linux-runtime-arch-rest-init-frontier-v0.json \
            --nm "$ev/current/nm.txt" --image "$ev/current/Image.early" \
            --evidence-dir "$ev/current-watch" --timeout-ms 30000 --poll-ms 100 | tee "$ev/current-watch.stdout.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "CRC32_FAULT_CLASSIFIER_RC=$rc"
          cat "$ev/current-watch/frontier-summary.txt" || true
          exit 0

      - name: Preserve crc32 fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-crc32-fault-frame-v0-${{ github.sha }}
          path: |
            build/linux-runtime-dtb-pointer-probe-v0/profile/patch.log
            build/linux-runtime-dtb-pointer-probe-v0/profile/minic-profile.txt
            build/linux-runtime-dtb-pointer-probe-v0/*-refresh.log
            build/linux-runtime-dtb-pointer-probe-v0/*.s
            build/linux-runtime-dtb-pointer-probe-v0/lib_crc32.objdump.txt
            build/linux-runtime-dtb-pointer-probe-v0/current/nm.txt
            build/linux-runtime-dtb-pointer-probe-v0/current-symbols.txt
            build/linux-runtime-dtb-pointer-probe-v0/crc32-fault-gdb.txt
            build/linux-runtime-dtb-pointer-probe-v0/crc32-fault-qemu.log
            build/linux-runtime-dtb-pointer-probe-v0/current-watch/frontier-result.json
            build/linux-runtime-dtb-pointer-probe-v0/current-watch/frontier-summary.txt
            build/linux-runtime-dtb-pointer-probe-v0/current-watch/qemu.interrupts.txt
          if-no-files-found: warn
          retention-days: 7
