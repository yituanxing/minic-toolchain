name: Core M43 Volatile Prefix Qualification

on:
  pull_request:

jobs:
  qualify:
    if: github.head_ref == 'refactor/declaration-sema-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Restore frozen Linux corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-${{ hashFiles('tests/external/linux/replay-indices.txt') }}
      - name: Apply M31b through M43 and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.corpus.outputs.cache-hit }}" = true
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          python3 tools/dev/patch-core-frontier-batch-m33.py
          python3 tools/dev/patch-core-frontier-batch-m34.py
          python3 tools/dev/patch-core-frontier-batch-m35.py
          python3 tools/dev/patch-core-frontier-batch-m36.py
          python3 tools/dev/patch-core-frontier-batch-m38.py
          python3 tools/dev/patch-core-frontier-batch-m41.py
          python3 tools/dev/patch-core-frontier-batch-m42.py
          python3 tools/dev/patch-core-frontier-batch-m43.py
          clang-format-18 -i src/core/core_ir.c src/core/core_lower.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m43
      - name: Diagnose preempt decrement shapes
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m43/bin/minic"; w=build/m43-shapes; mkdir -p "$w"
          cat > "$w/01_prefix_raw.c" <<'EOF'
          int f(volatile int *p) { return --*p; }
          EOF
          cat > "$w/02_prefix_not.c" <<'EOF'
          int f(volatile int *p) { return !--*p; }
          EOF
          cat > "$w/03_nonvolatile_and_call.c" <<'EOF'
          int tif_need_resched(void);
          _Bool f(int *p) { return !--*p && tif_need_resched(); }
          EOF
          cat > "$w/04_volatile_and_constant.c" <<'EOF'
          _Bool f(volatile int *p) { return !--*p && 1; }
          EOF
          cat > "$w/05_volatile_call_sequence.c" <<'EOF'
          int tif_need_resched(void);
          _Bool f(volatile int *p) { --*p; return tif_need_resched(); }
          EOF
          cat > "$w/06_preempt_like.c" <<'EOF'
          int tif_need_resched(void);
          _Bool f(volatile int *p) { return !--*p && tif_need_resched(); }
          EOF
          failures=0
          for src in "$w"/*.c; do
            n=$(basename "$src" .c)
            set +e
            MINIC_CORE_IR=strict "$c" -S "$src" -o "$w/$n.s" 2>"$w/$n.err"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              printf 'M43_SHAPE_PASS name=%s\n' "$n"
            else
              failures=$((failures + 1))
              printf 'M43_SHAPE_FAIL name=%s rc=%d\n' "$n" "$rc"
              sed -n '1,12p' "$w/$n.err"
            fi
          done
          printf 'M43_SHAPE_MATRIX failures=%d\n' "$failures"
          test "$failures" -eq 0
      - name: RISC-V volatile prefix differential
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m43/bin/minic"; w=build/m43-qemu; mkdir -p "$w"
          cat > "$w/f.c" <<'EOF'
          int g(void);
          int f(volatile int *p) { return !--*p && g(); }
          EOF
          cat > "$w/main.c" <<'EOF'
          #include <stdio.h>
          int f(volatile int *);
          int g(void) { return 1; }
          int main(void) { volatile int x=1; int r=f(&x); printf("%d %d\n", r, (int)x); return 0; }
          EOF
          MINIC_CORE_IR=strict "$c" -S "$w/f.c" -o "$w/minic.s"
          riscv64-linux-gnu-gcc -O0 -static "$w/main.c" "$w/minic.s" -o "$w/minic.elf"
          qemu-riscv64 "$w/minic.elf" > "$w/minic.out"
          riscv64-linux-gnu-gcc -O0 -static "$w/main.c" "$w/f.c" -o "$w/gcc.elf"
          qemu-riscv64 "$w/gcc.elf" > "$w/gcc.out"
          diff -u "$w/gcc.out" "$w/minic.out"
          grep -Fx '1 0' "$w/minic.out"
          echo M43_QEMU_DIFF_PASS
      - name: Frozen preempt representative moves
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m43/bin/minic"; w=build/m43-rep; mkdir -p "$w"
          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/version.i -o "$w/version.s" 2>"$w/version.err"
          rc=$?
          set -e
          head -8 "$w/version.err" || true
          ! grep -Fq "Core IR shadow does not yet support function '__preempt_count_dec_and_test'" "$w/version.err"
          ! grep -Fq "Core IR shadow lowering failed for function '__preempt_count_dec_and_test'" "$w/version.err"
          printf 'M43_PREEMPT_MOVED rc=%d\n' "$rc"
      - name: Frozen strict first500
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m43/bin/minic"; w="$GITHUB_WORKSPACE/build/m43-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$c" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$w" --jobs 5 --offset 0 --limit 500 --sample-count 0 --indices ''
          rc=$?
          set -e
          printf 'M43_REPLAY_RC=%d\n' "$rc"
          python3 tools/ci/classify-core-strict-frontier.py "$w/batch-results.json" --examples 5 --json-out "$w/frontier-summary.json" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m43-strict500/frontier-summary.json').read_text())
          assert s['selected']==500 and s['error']==0 and s['preprocess_missing']==0, s
          print(f"M43_SUMMARY selected=500 pass={s['pass']} unsupported={s['unsupported']} error=0 distinct={len(s['blockers'])}")
          for r in s['blockers'][:25]: print(f"M43_BLOCKER count={r['count']} function={r['function']}")
          PY
