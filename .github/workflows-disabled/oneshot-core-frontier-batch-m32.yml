name: One-shot Core Frontier Batch M32

on:
  pull_request:
    branches: [frontend/linux-first500-final-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-m32:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/declaration-sema-v1
          fetch-depth: 0
      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' tools/ci/ubuntu-24.04-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sh tools/ci/verify-validation-tools.sh
      - name: Restore frozen Linux corpus
        uses: actions/cache/restore@v4
        with:
          path: build/linux-focus-corpus
          key: linux-focus-corpus-v1-6.6.143-rv64-defconfig-gcc13.3.0-5df6e0e2761359d30a8275058e299fcc0381534545f55cf43e41983f5d4c9456
      - name: Apply M31b plus M32 and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s build/linux-focus-corpus/selected-tus.txt
          python3 tools/dev/run-core-frontier-batch-m31b.py
          python3 tools/dev/patch-core-frontier-batch-m32.py
          clang-format-18 -i src/core/core_ir.h src/core/core_ir.c src/core/core_lower.c src/target/riscv64/core_codegen.c
          git diff --check
          make -j4 MODE=release CFLAGS=-Werror BUILD_DIR=build/m32-candidate
      - name: Focused alternative-register constraints
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m32-candidate/bin/minic"
          w="$GITHUB_WORKSPACE/build/m32-shapes"; mkdir -p "$w"
          for pair in 'rK:5' 'rJ:0' 'Jr:0'; do
            con=${pair%%:*}; val=${pair##*:}; name=${con}
            cat > "$w/$name.c" <<EOF
          long f(long x) { long y=x; __asm__ __volatile__("add %0, %0, %1" : "+r"(y) : "$con"($val) : "memory"); return y; }
          EOF
            MINIC_CORE_IR=strict "$c" -S "$w/$name.c" -o "$w/$name.s"
            printf 'M32_SHAPE_PASS constraint=%s\n' "$con"
          done
          cat > "$w/runtime.c" <<'EOF'
          #include <stdio.h>
          long f(long);
          int main(void){ printf("%ld\n", f(37)); return 0; }
          EOF
          MINIC_CORE_IR=strict "$c" -S "$w/rK.c" -o "$w/minic.s"
          riscv64-linux-gnu-gcc -O0 -static "$w/runtime.c" "$w/minic.s" -o "$w/minic.elf"
          qemu-riscv64 "$w/minic.elf" > "$w/minic.out"
          grep -Fx '42' "$w/minic.out"
          printf '%s\n' M32_QEMU_PASS
      - name: Frozen representative leaves arch_local_irq_enable
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m32-candidate/bin/minic"; w=build/m32-rep; mkdir -p "$w"
          set +e
          MINIC_CORE_IR=strict "$c" -S build/linux-focus-corpus/kbuild/init/version.i -o "$w/version.s" 2>"$w/version.err"
          rc=$?
          set -e
          cat "$w/version.err"
          ! grep -Fq "Core IR shadow does not yet support function 'arch_local_irq_enable'" "$w/version.err"
          if [ "$rc" -ne 0 ]; then grep -Fq 'Core IR shadow does not yet support function' "$w/version.err"; fi
          printf 'M32_REP_MOVED rc=%d\n' "$rc"
      - name: Frozen strict first500 replay and classify
        shell: bash
        run: |
          set -Eeuo pipefail
          c="$GITHUB_WORKSPACE/build/m32-candidate/bin/minic"; w="$GITHUB_WORKSPACE/build/m32-strict500"
          set +e
          MINIC_CORE_IR=strict python3 tests/external/linux/corpus_replay.py --minic "$c" --corpus "$GITHUB_WORKSPACE/build/linux-focus-corpus" --work "$w" --jobs 5 --offset 0 --limit 500 --sample-count 0 --indices ''
          rc=$?
          set -e
          printf 'M32_STRICT500_REPLAY_STATUS=%d\n' "$rc"
          python3 tools/ci/classify-core-strict-frontier.py "$w/batch-results.json" --examples 5 --json-out "$w/frontier-summary.json" --require-no-errors
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/m32-strict500/frontier-summary.json').read_text())
          assert s['selected']==500 and s['error']==0 and s['preprocess_missing']==0, s
          assert s['pass']+s['unsupported']==500, s
          b={r['function']:r['count'] for r in s['blockers']}
          assert b.get('arch_local_irq_enable',0)==0, b.get('arch_local_irq_enable')
          print(f"M32_STRICT500 selected=500 pass={s['pass']} unsupported={s['unsupported']} error=0 distinct={len(s['blockers'])}")
          for r in s['blockers'][:40]: print(f"M32_NEXT_BLOCKER count={r['count']} function={r['function']}")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-frontier-batch-m32-evidence
          path: |
            build/m32-shapes/
            build/m32-rep/
            build/m32-strict500/frontier-summary.json
            build/m32-strict500/batch-results.json
          if-no-files-found: warn
